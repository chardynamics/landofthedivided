#Ministers
BSQ_Jesus_Leizaola: "Jesús María de Leizaola"
BSQ_Jesus_Leizaola_hog_desc: "§YVice-Lehendakari\nChristian Conservatism§!\n--------------\n§LJesús María de Leizaola is one of the grand old men of Basque nationalist politics, having been active in the cause of his people's self-determination since the 1910s. After a career in the governments of the Second Republic and of the Basque autonomy during the civil war, he accompanied the first Lehendakari, José Antonio Aguirre, into exile. After Aguirre's sudden death in 1960, he was appointed by the Basque Government in Exile as his successor. In this role, he attempted to keep alive the flame of Basque culture, publishing studies about Basque culture and poetry and contributing to newspapers.\n\nBut then, the Iberian Union exploded in fire and bloodshed, and in the chaos, a new Basque homeland was established. Returning from his long exile, Leizaola was confronted by a new generation of Basque nationalists, less culturally-inclined and much more socially radical than he was. His staunch Catholicism and condemnation of terrorism made him an unacceptable leader to the ETA, and his old age and decades of exile made him less attractive to many more moderate members of the government as well.\n\nThe decision was made to award the title of Lehendakari to Monzón, and while Leiazola accepted the necessity of keeping the provisional government united, and has even softened his stance towards the ETA in the chaotic conditions of Iberia, he is still bitter about being shunted off the role he still sees as having been handed down to him personally.§!"

BSQ_Jose_Miguel_Benaran: "José Miguel Beñarán"
BSQ_Jose_Miguel_Benaran_hog_desc: "§YVice-Lehendakari\nLeft-Wing Nationalism§!\n--------------\n§L§!"
BSQ_Jose_Miguel_Benaran_sec_desc: "§YMinister of Defense\nLeft-Wing Nationalism§!\n--------------\n§L§!"

BSQ_Juan_Ajuriagerra: "Juan de Ajuriagerra"
BSQ_Juan_Ajuriagerra_eco_desc: "§YMinister of Economic Affairs\nChristian Conservatism§!\n--------------\n§LJuan de Ajuriaguerra's Basque nationalism formed as a member of a group of young mountaineers, and ever since, he has worked in service to the land these mountains belonged to - some would say he is single because he is married to Euskadi. Despite his brutal treatment in Franco's dungeons after the Civil War and his command of many European languages, de Ajuriaguerra refused to flee for long periods, working with the Basque and broader democratic underground from his confinement in Pamplona.\n\nDuring this period, de Ajuriaguerra became the EAJ's main leader within Iberia, maintaining contact between OFN assets and the exiled leadership on the one hand and local party operatives on the other. His work was crucial not only to the EAJ's survival but also to the maintenance of its political character - de Ajuriaguerra remained committed to working with Christian-Democratic movements, and refused to condone the radical ideas of younger Basque activists.\n\nAfter the collapse of Iberia and the establishment of the provisional government, Ajuriaguerra is ready to once more take on a public role, after having been a director of propaganda during the Spanish Civil War. Staunchly loyal to Leizaola, who he sees as the rightful Lehendakari, Ajuriaguerra resents the decision to sideline him in favor of Monzón to placate the irresponsible radicals of ETA. For now, however, he is willing to accept the new political order - he has already sacrificed much more for Euskadi.§!"

BSQ_Domingo_Iturbide: "Domingo Iturbide"
BSQ_Domingo_Iturbide_eco_desc: "§YMinister of Economic Affairs\nLeft-Wing Nationalism§!\n--------------\n§L§!"

BSQ_Txabi_Etxebarrieta: "Txabi Etxebarrieta"
BSQ_Txabi_Etxebarrieta_for_desc: "§YMinister of Foreign Affairs\nLeft-Wing Nationalism§!\n--------------\n§LBorn in Bilbao in 1944, Txabi Etxebarrieta was already a prominent member of ETA by the time he graduated from Bilbao University. A youthful firebrand and member of a nationalist family, it seems that he was destined to become an insurgent from an early age, not hesitating to take part in armed struggle despite his poor health.\n\nWith ETA conducting more and more prominent operations in the dying years of the Iberian Union, Etxebarrieta found himself propelled to prominence, first within the organisation, and after the collapse of the Union, within Basque society as a whole. Within the ETA, he came to represent the "fourth-worldist" faction, advocating for cooperation between the various national independence and anti-colonial movements of the world in their shared struggle, but still framing the struggle in staunchly nationalist terms, as opposed to the more internationalist Communist faction.\n\nNow as the de-facto foreign minister of the provisional Basque government, Etxebarrieta has an opportunity to make his ideals into reality: by using the expansive foreign connections of the EAJ, the ETA will be able to gather support from the downtrodden peoples of the world, from Latin America to Africa, and become a vanguard for the liberation of all nations.§!"
BSQ_Txabi_Etxebarrieta_eco_desc: "§YMinister of Economic Affairs\nLeft-Wing Nationalism§!\n--------------\n§LTxabi Etxebarrieta is one of the main leaders of the ETA, and one of the most prominent voices within the organization's "fourth-worldist" faction. In the immediate aftermath of the ETA's coup, Etxebarrieta positioned himself to become Councilor of Economic Development both because he believed himself more suited for the position, but also because it would keep it out of the hands of the "workerist" faction.\n\nEtxebarrieta seeks a decentralized socialist system, what he calls the "Basque working nation", which lies in direct opposition to the workerists' goal of retreading the path laid down by the old USSR.§!"

BSQ_Angel_Otaegui: "Ángel Otaegui"
BSQ_Angel_Otaegui_for_desc: "§YMinister of Foreign Affairs\nLeft-Wing Nationalism§!\n--------------\n§L§!"

BSQ_Xabier_Zumalde: "Xabier Zumalde"
BSQ_Xabier_Zumalde_sec_desc: "§YMinister of Defense\nLeft-Wing Nationalism§!\n--------------\n§L§!"

BSQ_Pablo_Beldarrain_sec_desc: "§YMinister of Security\nChristian Conservatism§!\n--------------\n§LPablo Beldarrain began his military career in 1930, becoming an officer while maintaining his membership in the EAJ and its trade union. Upon the start of the Civil War, he oversaw the training of EAJ volunteers, later commanding troops in battle himself, but despite his skill, Euskadi could not hold the superior Nationalist forces. He retreated to France by boat, ordered by the Basque government to remain there. During the war, he was smuggled to Britain, to be trained by American intelligence, just before Fascism came onto Britain's shores, seemingly unwilling to let him escape its clutches again. And yet, escape he did: this time, he arrived in Mexico and joined its Army for a time.\n\nBut soon, the call of Beldarrain's homeland grew irresistible. He made his way back to the newly-created Iberian Union and was incarcerated upon arrival. After his release, he continued to maintain a small network of EAJ operatives, with some connections to the OFN. It seemed that he would remain a low-profile insurgent in a doomed insurgency.\n\nBut then, the Union collapsed - and Beldarrain's old compatriots contacted him once more. They required an experienced military man to help create a Basque military, and he took up arms once more. He now struggles against the unruly armed bands which liberated Euskadi: may relish their autonomy, but he knows that they must give it up in order to keep it free.§!"

BSQ_Jose_Maria_Eskubi: "José María Eskubi"
BSQ_Jose_Maria_Eskubi_hog_desc: "§YVice-Lehendakari\nLeft-Wing Nationalism§!\n--------------\n§LIn the wake of the coup, José María Eskubi, one of the ETA's main leaders, was named spokesman of the Council of Government. This position does not possess the true authority or powers of a proper council president, instead Eskubi is merely a first among equals.\n\nEskubi is one of the leaders of the ETA's "fourth-worldist" faction, which seeks to link the Basque national struggle to the other nations struggling against the three colonial powers. He has been critical of the ETA's growing factionalism, which has caused his revolutionary fervor to dwindle and fade. Regardless, Eskubi continues to support the internal structures of the ETA that allow such disagreements to exist.§!"

BSQ_Jose_Luis_Alvarez: "José Luis Álvarez 'Txillardegi'"
BSQ_Jose_Luis_Alvarez_for_desc: "§YMinister of Foreign Affairs\nLeft-Wing Nationalism§!\n--------------\n§LJosé Luis Álvarez Enparantza, better known by the pseudonym Txillardegi, was one of the founding members of the ETA, having been a member since its formation in 1959. Despite this, as the main leader of the "culturalist" faction of the ETA, Txillardegi is also one of the most prominent critics of the ETA's commitment to armed struggle.\n\nRegardless, Txillardegi continues the campaign initiated by Etxebarrieta before the ETA's coup, gathering international support from national liberation movements in both Latin America and Africa. However, he has also expanded it to have a special focus on the international Basque diaspora in both France and Latin America.§!"

BSQ_Juan_Etxabe: "Juan José Etxabe"
BSQ_Juan_Etxabe_sec_desc: "§YMinister of Defense\nLeft-Wing Nationalism§!\n--------------\n§LJuan José Etxabe is the leader of the military section of the ETA, in charge of organizing all ETA militias after independence was declared. He is also one of the main leaders of the ETA, known also by the nom de guerre "Haundixe." While not officially a member of any faction, he is largely aligned with the "fourth-worldists" within the ETA.\n\nEtxabe is in truth not very committed to the ETA's socialist line, seeing it as an organization dedicated to national liberation first and foremost. With the new perspective gained from becoming a councilor, Etxabe has shifted away from a focus solely on militias, and now seeks a mixed approach, integrating the militias with more conventional military structures.§!"


#War Tree
BSQ_gora_euskadi_askatuta: "Gora Euskadi Askatuta!"
BSQ_gora_euskadi_askatuta_desc: "When we entered into the 1960s, many amongst our ranks assumed that our dreams of a free Basque Republic were a dead one. Many lamented that these years would pass like countless others, with us squirming under the foreign heel of Madrid. Times have changed - faster than anyone expected.\n\nThe Spaniards have lost any illusion of control they had over the Peninsula, and the oppressive drumbeat of war reigns supreme over Iberia. Euskadi is no exception. Our patriots have beaten back Madrid with unprecedented fury and brutality, and all of Basque falls into our hands! But it won't be enough. A bloody nose and the occasional humiliation will not convince the government of their folly. If Euskadi is to survive, not a single rifle of ours will go unused. Not a single grenade will go unused. Not a single bullet, unspent. Failure would mean extermination."
BSQ_gora_euskadi_askatuta_tt: "§nGora ta Gora Euskadi§!"

BSQ_the_basque_war_economy: "The Basque War Economy"
BSQ_the_basque_war_economy_desc: "The Basque Republic is home to many things. Sprawling orchards, packed to the brim with their scarlet fruits. A coast, lined with towering cliffs, guarding over the Atlantic like a dormant colossus. More importantly, we also contain some of the busiest and densest industrial zones on the entire Peninsula. However, producing artisan wine glasses and ceramic plates would only give the Spaniard grander things to loot from our decaying corpses.\n\nPutting all of Euskadi on a war footing isn't just important, it is the very thing that will keep our Republic afloat. Our ferocity and willpower will only get our men on the field, perhaps. But a rifle will make sure they come back victorious."

BSQ_consolidate_our_forces: "Consolidate Our Forces"
BSQ_consolidate_our_forces_desc: "In the first, furious days of the Revolution, the army we came to possess was an embryo of what was to come. In its place, ragtag militia roamed the countryside - in search of an enemy to kill and a cause to die for. The male population of entire villages - simply gone, in the ultimate service of Euskadi. But that's not how we will fight this war.\n\nFor the sum is greater than the equal of its parts. And we must fuse all of our weak and weary patriots and forge a sword mightier than any infernal thing that Madrid can throw at us. Some may complain, but in the end, the history books will prove us right."

BSQ_seize_federal_assets: "Seize Federal Assets"
BSQ_seize_federal_assets_desc: "When the Federales fled Euskadi, they couldn't take all of their property with them. With nobody to protect them, bank vaults and reserves lay ripe for us to...reappropriate them. Millions of Pesetas and hundreds of tonnes of gold would be a massive boon to our fledgling Republic and our struggle against the Spaniards. Everything is a weapon in survival, and there is seldom a weapon so precious as money. We can use cash for rifles, silver for tanks and gold for our people to keep our economy alive. After all, we're just reclaiming what the Government took from our people, aren't we?"

BSQ_militarize_mondragon_facilities: "Militarize Modragón Facilities"
BSQ_militarize_mondragon_facilities_desc: "While we have already retooled most of our industry for war against the Spanish, we still have a long way to go. The struggle ahead of us will be the ultimate test of our will to survive, and facing our enemies half-cocked will only lead to our doom.\n\nFamous across the Peninsula for its idyllic sights and peaceful living, Mondragón is a central hub of industry nestled among the soaring peaks and endless emerald farmland. While the population may lament it, we cannot afford to leave a single factory out of the war effort. One artillery piece, one rifle, one bullet even, could mean our victory or our downfall. Time is of the essence, and our men are ready to depart for the sleepy town. They only need the order."

BSQ_develop_the_machine_tool_industry: "Develop the Machine Tool Industry"
BSQ_develop_the_machine_tool_industry_desc: "It's all very well having generals plan our next ingenious strategy or having resistance cells eliminate another supply convoy, but we can't keep running on fumes. Eventually, we will run out of bullets; our guns will jam, our artillery will break. If we cannot replace our equipment, then we will only delay the inevitable.\n\nWhile we can't afford to not build up a war economy, it does us no good if our workers are using their hands and fingers to manufacture our guns. Not only do we need to be industrious, but we also need to be efficient. Mass manufacturing of fine machine tools and equipment will not just help win but keep our economy afloat. In war, the most minuscule advantages can change history."

BSQ_expand_the_bilbao_port: "Expand the Bilbao Port"
BSQ_expand_the_bilbao_port_desc: "Not only is our land bountiful, but Euskalduna is also blessed with a picturesque coastline. For centuries, Basque fishers have used the Bay of Biscay as the source of their livelihoods. In modern times, hundreds of families flocked to our pristine beaches as a respite from the oppressive weight of the outside world.\n\nNow, it appears that Bilbao must give into that weight. War is a bloody, costly thing. It has many ravenous maws, all crying out for steel and blood to fulfil its hunger. Too often, we are a bullet away from victory or a loaf away from a happy populace - it will only get worse. Expanding Bilbao Port, overlooking Biscay, will not just expand what supplies we get from the outside world but reduce the time it takes to get from there to here."

BSQ_a_job_for_everybody: "A Job for Everybody"
BSQ_a_job_for_everybody_desc: "Those who can fight, will. Those who can't, will work. The war has been a deadly, costly thing to all the people of Basque. And it will only get worse. If we want to weather out this storm, all hands must be on board for the final clash against tyranny. Businesses, factories, even simple workshops must all be full of hard-working, industrious comrades in arms. It doesn't matter if you're a general or a steelworker - none shall be wasted in our fight for freedom."

BSQ_emergency_taxation_policies: "Emergency Taxation Policies"
BSQ_emergency_taxation_policies_desc: "Guts, bullets and fortifications are not the only things we need to fight a war against Madrid. Every rifle needs to be made; and the people who make it need to get paid. Every bomb requires materials that need to be bought or produced. Every single truck needs fuel, and where will we get that petrol? Money is an unromantic side to war, but it's a side that has always been the decider of who wins and who is relegated to the history books.\n\nCurrently, we can't keep up our war effort by just donations and more...unscrupulous ways of funding ourselves from foreign contacts. If we want our men to win and keep winning, then something has to be done. Unfortunately, it seems the best and most effective way to do this is the most unpopular one. By raising the provisional tax; we will have more than enough to keep up the struggle and win the war. It is not a thing we take lightly, but it must be done."

BSQ_mastery_of_the_mountains: "Mastery of the Mountains"
BSQ_mastery_of_the_mountains_desc: "Time and time again, history has taught its keen students of the wonders of defensive terrain. From the Spartans' use of the Hot Gates against the marauding Persians to the halt of the Wehrmacht in the glens of the Scottish Highlands by the Americans, we would be foolish to not utilise the same advantages. Euskadi is lined by cliff-side roads, towering valleys and most of all - some of the tallest mountains in Iberia.\n\nOur generals are begging us to properly train and equip men in high-altitude combat in fighting Madrid. It would be borderline idiotic to ignore their advice, for we need any advantage we can get. Staining the mountains crimson with Spanish blood will not be a pretty sight, but it is better than our blood."

BSQ_weaponize_trade_ships: "Weaponize Trade Ships"
BSQ_weaponize_trade_ships_desc: "If it isn't broken, don't fix it. While perhaps not as highly regarded as our other arms in the military, the Navy serves an incredibly valuable purpose, nonetheless. We rely on foreign guns and supplies by those sympathetic to our cause. Money, food, guns; our contacts in Washington, Berlin, and Tokyo are all hard at work trying to procure those for us. But what use is getting those supplies if Madrid can simply loot our ships and impress our sailors?\n\nWe must arm our trade ships, from the dinkiest trawler to the colossal freighters sprawling through the ocean. Men trained in amphibious warfare, specialised equipment and even explosives can all supply us the edge we need to secure our oceanic highway and aid our men at the front."

BSQ_rebuild_the_iron_ring: "Rebuild the Iron Ring"
BSQ_rebuild_the_iron_ring_desc: "The Iron Ring was a series of fortifications built in the desperate days of the Spanish Civil War. Consisting of 180 concrete bunkers - each packed with walls nearly a meter thick - and spanning an 80km perimeter around Bilbao. Fighting head-on against it was almost suicidal. Little in Europe, except perhaps the Maginot Line, could match the fortifications in their design and indestructibility.\n\nHowever, like the Maginot Line, it was bypassed and made useless. In our case, from the bomb bays of the Luftwaffe, instead of the forest of the Ardennes. We will not make that mistake again. We will reconstruct this outer shell and hold back the hungry bayonets of Madrid. This time, the Iron Ring will not be resigned as a trinket of history."

BSQ_equal_opportunity_service: "Equal Opportunity of Service"
BSQ_equal_opportunity_service_desc: "Euskadi does not lack for volunteers, the entire nation has committed to taking arms. Making sure volunteers are best placed to serve the nation is the concern. Many men on the front are skilled workers, and their skills may not be easily replaceable. Further, there are many militia fighters attached to our military but their precise status remains dubious; a worrying element given their communist influences.\n\nThe solution is to open military service to women. While a novel solution, the Abertzales agree that this would be a significant step forward in women's rights following the Francoist years. The Jeltzales reluctantly recognise that more women joining the military, under their watch, is fewer women joining the communist-infiltrated militias. Every unskilled woman in a foxhole or bunker, is one more skilled man keeping the nation alive in the factories and offices behind them."

BSQ_the_basque_air_force: "The Basque Airforce"
BSQ_the_basque_air_force_desc: "When we overran the Spaniard positions across Euskadi during our Uprising, they left a gift for our men. Especially along the French border, rows of hangars lie dormant, gathering dust. Fighters, bombers, jet interceptors of all kinds remain inside, just waiting for someone to use them.\n\nJust as well, because one of our deadliest weaknesses during the Spanish Civil War of the 1930s was our lack of air superiority. Every time a breakthrough could be made; our men would be bombed back into the Stone Age by Franco's men or the butchers in the Luftwaffe. This time, we cannot afford to repeat the same mistakes. By challenging the Spanish in the air, we can provide shelter - or at least, a reprieve - for our soldiers on the ground."

BSQ_military_on_wheels: "A Military on Wheels"
BSQ_military_on_wheels_desc: "If there is one lesson that one can take from the butchery of the Second World War, it's that speed is key to success. The French and British were both outmanoeuvred by the German breakthrough in Belgium and were destroyed by Hitler's army. In Yugoslavia, Greece, North Africa and most importantly, the blood-soaked fields of the USSR this lesson was shown, time and time again.\n\nWhy should those lessons not apply to us? We must expand our motorised support across the entire army, from the soldiers to the canteen staff. If we are defeated, we can slip away from the jaws of defeat and recoup our losses. If we are victorious, we can thoroughly follow up our victory and destroy the Spaniard in detail. As far as our men see it, there is no downside to this decision."

BSQ_march_forwards_together: "March Forwards, Together"
BSQ_march_forwards_together_desc: "Two parts make up the government of a Free Euskadi. There are the "jeltzales" of the EAJ - Basque Nationalist Party - and the "abertzales" of the ETA - Basque Homeland and Liberty. The former are aged political experts who have been campaigning for the free Basque Republic for longer than some in the ETA have been alive. Meanwhile, the ETA are young radicals, so hellbent and zealous for the free Basque Republic; that it would make some in Himmler's fiefdom blush.Regardless, if we let our petty differences in how we run our nation divide us, we would only be playing into the hands of Madrid. If we don't stand together then we will die separately, and the fragile embers of a free Euskadi will be blown out. Forever."

BSQ_jeltzale_supremacy: "Jeltzale Supremacy"
BSQ_jeltzale_supremacy_desc: "As much as we pretend to the contrary, the Basque Republic is not wholly unified and monolithic. Our uprising was made possible by two differing groups. The first group is the Old Guard of the Basque Republic. The "jeltzales" of the EAJ, the Basque Nationalist Party. Named so due to their adherence to the EAJ's acronym: Jaun-Goikua Eta Lagi-zaŕa (God and Old Law), they are the wizened teachers of the Basque Republic. In contrast, the other main body of our movement is the "abertzales", the "patriots" of the ETA. Young, energetic and zealous, the abertzales will stop at nothing to achieve their aims.\n\nWhich makes them dangerous. Euskadi cannot be run by a group of violent militiamen fresh out of University. We would be shooting ourselves in the foot and isolating ourselves from international support if we allowed them real power. No. Fine fighters rarely make for fine ministers, they must be stopped."

BSQ_remember_gernika: "Remember Gernika"
BSQ_remember_gernika_desc: "We shall never forget that clear Thursday afternoon, where the birds raced and danced across the pink sky. We shall never forget the children pushing and tugging at each other in the chalk-marked schoolyards so familiar to them. We shall never forget the fathers and their meandering conversations with citrus-smelling farmers in their stalls. Never forget how their deaths arrived with a quiet, thin hum. Never forget the widows who buried their children next to their fathers.\n\nWe remember the people of Guernica."
BSQ_remember_gernika_tt: "God bless the Gernika tree, loved by all Basque people"

BSQ_establish_local_councils: "Establish Local Councils"
BSQ_establish_local_councils_desc: "We can't afford to be inefficient when we are fighting for our lives. Bilbao can only do so much for its people and still manage the frontlines with the care and precision they both deserve. That's why many in our government propose a radical new idea. Local Councils could be set up in varying provinces across Euskadi; to manage the day-to-day business of small, local affairs. The central government can intervene if it needs to, in case something goes horrifically wrong, of course. While others might say that this would lead to factionalism, bureaucracy and many, many more overused buzzwords - we do not have a choice."

BSQ_assymetic_warfare_training: "Assymetric Warfare Training"
BSQ_assymetic_warfare_training_desc: "The soaring peaks of the Pyrenees. The jagged valleys of the highlands. The sheltered woods and orchards of the countryside. What do they all have in common? They bring in tourism, perhaps. But in times of war, fat Americans and their larger wallets serve very little use to us. What stunning scenery blesses us with is hell on Earth for a Spaniard.\n\nTreacherous high-altitude combat. Guerilla sharpshooters taking out countless valuable targets hidden in cottages outside the watershed. Hideaways, nestled in thorn bushes, for our men to slip into the shadows. All these are opportunities for us to take advantage of if we could merely train our men. Hit and run tactics, covert assassinations, proper camouflage and clothing are all things that we could be teaching our men if we just used our commandos to teach them. The scenery might be a dangerous allure to the Spaniard, but it only makes our victory more picture-esque."

BSQ_traitors_not_welcome: "Traitors Not Welcome"
BSQ_traitors_not_welcome_desc: "Nobody expected the Uprising to happen. At least, not so soon. Once banished into the alleys and the cellars, we now walk triumphantly. As our fighters continue to fend off whatever Madrid sends our way, we now face a new problem.\n\nWhile most fled, remnants of the Spaniards remain, like a dagger at our backs. The Guardia Civilies, responsible for the deaths of many in our ranks, have been disarmed and rounded up. The former soldiers and bureaucracy too, await their fates. While unloading a clip into the senior ranks may make some of us happy, some have a different idea. Euskadi is a young thing, even if our people have been here before the Romans. Simply blacklisting and bans from service will serve us, just fine. Just because they have our blood on their hands, does not mean we must have theirs."

BSQ_orders_from_bilbao: "Orders from Bilbao"
BSQ_orders_from_bilbao_desc: "When one is fighting for one's life, the least they can do is keep an eye on themselves. As high-minded and noble as the idea of "local communes" is to the commoner, it will not win us the war. Only through precise coordination and the centralisation of every single man, woman and child in the war effort can we keep ourselves afloat. Despite the seething rage of the anarchists among us, the only way we can cope under such a brutal enemy, like the Spaniard, is to make sure that everyone knows their place."

BSQ_disband_eta_commandos: "Disband ETA Commandos"
BSQ_disband_eta_commandos_desc: "It is a noble thing to take arms for your country. It is an even nobler thing, to know when to put them down. The ETA commandos have provided an unflinchingly agonising thorn in the side of the cursed Spaniard, who seek to put down our revolution - that's true. However, disparate and cobbled revolutionary cells, who might not even see combat, are not how we will fight our revolution.\n\nOur generals suggest that instead of funneling our precious supplies and equipment to scattered and ill-disciplined fighters, we instead integrate these patriots into something more productive. That being, the army. What's the worst that could happen, by having a group of overzealous and undertrained men in our army?"

BSQ_the_misguided_patriots: "The Misguided Patriots"
BSQ_the_misguided_patriots_desc: "We are not animals! Our revolution against Madrid cannot drown itself in the blood of innocents, in vain defiance against the cruelty of humanity. The attacks and even occasional murders of so-called "collaborators" such as members of the Guardia Civiles or the bureaucrats are unacceptable. What is worse is that many among us are not just sympathetic to the shunning of these members of our new society. They encourage it.\n\nDid they not join to protect their families? Their lands? Their home? Aren't we doing the same thing? Should we be content to see their bodies swing from the nearest oak tree? No. We would be butchering potentially valuable allies, considering their experience with governing and guarding these lands. Let us guide these misguided souls to their true purpose."

#ETA War tree

BSQ_gora_euskadi_ta_askatasuna: "Gora Euskadi Ta Askatasuna"
BSQ_gora_euskadi_ta_askatasuna_desc: "We have vanquished the decrepit and decaying jeltzales! Our coup d'etat has overthrown the old regime and ended the menace that made Euskadi weak. The Forever War against the fucking Spaniards will be brought to an end by our rule. Now, we rule Euskadi, as it should have been. A vigorous, unified and socialist state that will be made into reality by our guiding hand.\n\nIt is to our eternal shame that some of our more moderate abertzales had to be put to the sword during our coup d'etat, but this is not a time to mourn. This is a time to make Madrid bleed, for every single square foot they advance into our glorious nation. Their punishment for their eternal sin of oppression and wrath will be severe. If necessary, we will stain Euskadi red if it means that our children can live free."
BSQ_gora_euskadi_ta_askatasuna_tt: "§VBietan jarrai§!"

BSQ_expand_the_organization: "Expand the Organization"
BSQ_expand_the_organization_desc: "Numbers were never an advantage we possessed in our struggle but now that our efforts have paid off we can no longer afford to be a closed-off organization. Though the numbers for a mass movement are not feasible now, we must expand our influence and make our presence known to build legitimacy among the people.\n\nTo that end, we will aim to intensify our recruitment efforts from all walks of society, starting with those who would naturally be amenable to our cause: the unions, the universities, the intellectuals, and comrades who made a stand against the regime but were not part of our cause. This endeavor will take time and effort but is needed to safeguard the revolution."

BSQ_there_will_be_no_quarter: "There Will Be No Quarter"
BSQ_there_will_be_no_quarter_desc: "The beasts are at the door. If they are victorious, they will slaughter our loved ones, slit the throats of our children and leave us as ashes to be swept away. All of Euskadi must know the perils of defeat. They must realise that our nation stands on the crumbling ledge of Annihilation, and none shall survive to see the end. Conversely, if we want to stay alive, let us teach the butchers what fear truly means.\n\nHang their comrades by the trees, blind the survivors of our attacks and burn any semblance of safety they hold dear. Not a single one of those bastards will escape from our carnage intact, and the ones we don't kill - let them talk of what happened to their friends. Let them squeal of the terror of angering the ETA, like the dying pigs they all are. Horrific acts, to be sure, but what other choice do we have?"

BSQ_revolutionary_taxes: "Revolutionary Taxes"
BSQ_revolutionary_taxes_desc: "It is simply not enough. Our continued war effort has been a taxing thing on the populace - and our coffers. Money is rapidly running out, and we can only do so much to replace our losses. Therefore, some of our men suggest a more...revolutionary idea. Those who can pay will pay. The fat cats and cigar-smoking landlords of the countryside have done nothing in their contribution to the war effort. We shall raise a new tax system against those corrupt leeches, in their country mansions.\n\nIf they refuse, then we will simply confiscate their possessions. They will wail and moan about "tyrannical measures". We will laugh at their faces. How can a class of people, built off the backs of the peasants, dare to accuse us of tyranny?"

BSQ_promote_cooperative_farms: "Promote Cooperative Farms"
BSQ_promote_cooperative_farms_desc: "The farms of Euskadi have seen better days, agriculture having been long neglected since industry became the engine of the economy, this has the advantage of making land reform relatively simple with most advocating for the creation of voluntary agricultural cooperatives so that willing farmers can work together and pool their resources for the betterment of all.\n\nThis will revitalize and modernize the lagging economic sector while avoiding unneeded tensions by not making the process compulsory for those who wish to remain self-reliant."

BSQ_root_out_traitors: "Root Out Traitors"
BSQ_root_out_traitors_desc: "They are everywhere. Secret allies of the invaders gather in their masses, against our mandate over Euskadi. Seeking to restore the rule of the despots and would-be kings, they plot and scheme to have us at the end of a firing squad. It is only a matter of time until they make their move against us and enslave all of us under their iron fist. It brings bile to the mouth to imagine that free men of Euskadi could ever consider joining with the Judases, but the sad reality is that it happens - far too commonly.\n\nRegrettably, we must deal with the fifth-columnists. Draw up lists, monitor their allies and dig our knives into their rotting, pus-soaked hearts. When their time comes - and it will - nobody will miss those vipers. Because those who do, have already been dealt with."

BSQ_incentivize_the_mondragon_model: "Incentivize the Mondragón Model"
BSQ_incentivize_the_mondragon_model_desc: "Are we not human beings? Do we not clamor for freedom, as any other sentient creature would do? Would you rather march to your very own destruction with a toothy grin and the illusion of hope in your heart? So many of our people seem to question our methods in dealing with the marauders. They seem to have come under the illusion and think a dangerous thought. The people seem to believe that the war we fight is a morally grey one.\n\nThey seem to think that the invaders are not in fact, the instrument of murder, rape and torture, but are someone to be negotiated with? Someone to treat with respect? Does the hawk treat the pigeon with respect when it sends its talons deep into its flesh - ripping apart its quivering tendons and fat with genuine glee? Should we treat our hawks with honor if they butcher us? No. We fight for Euskadi. We fight for the workers of Euskadi and most of all we fight for freedom! DEATH TO THE SPANIARD!"

BSQ_guerillas_tactics: "Guerilla Tactics"
BSQ_guerillas_tactics_desc: "The armed forces have regrettably been weakened after our takeover and the number of troops that can be counted on to defend the socialist republic is not as much as we would like, nor is it enough to fight our enemies head-on.\n\nThankfully we have other ways of confronting the enemy, by fighting smart and utilizing guerrilla tactics, our relatively small forces can inflict disproportionate damage on enemy forces by raiding their supply lines and attacking soft but vital targets, neutering their advantage by making large-scale incursions impossible."

BSQ_the_war_for_freedom: "The War for Freedom"
BSQ_the_war_for_freedom_desc: "What is this war, truly? Before, it was considered a war of national liberation, a revolt against Spanish oppressors. This is true, but is it all-encompassing? We contend that it was a limited definition, even with its profound importance, on the stakes of our current conflict. It is more than just a national liberation for our Euskadi, it is a blow against the Fascist behemoth that throttles this peninsula, and the continent to which it belongs.\n\nLiberation must come for the Basque people. Liberation from the chains of the Spanish, yes, but also liberations from the chains of fascism and capitalism. We are fighting a war of two fronts, both visible and invisible, to create a beacon of true freedom within Iberia; a beacon that shall shine brightly upon this dark continent."

 #Events 
BSQ_wars.1.t: "An Oath Under a Tree"
BSQ_wars.1.desc: "The pink haze of dawn still lingered to the horizon, refusing to relinquish its grasp upon the edges of the world, as they gathered beside the high yellow pillars that surrounded the Guernica tree. Its old wood, grey wrinkles covering its bark skin, stood in stark contrast to the smooth stone that surrounded it. Its skin had seen much, heard much. Some would say even felt much.\n\nVasco watched the thin man leaning against the pillars, himself watching that wood. His head hung low, his posture heavy. Vasco took notes; his article could only benefit from noting how seriously Telesforo Monzón took his new responsibility - he only wished he could see his face in this private moment. He was new to the role, the Deia newspaper itself barely past its first issue but Euskadi would be a land of detailed truth. At least, he hoped so.\n\nAround him, people stood and waited. Vasco listened in on conversations, searching for anything notable. Mostly he found himself not recognising the faces and the conversations regarding little more than the weather. He had expected more than the curiously mundane. Eventually the call came for them to assemble in a semi-circle beside the tree with Monzón in its centre. He stood alone, with nothing in his hand.\n\n"A nation isn't created today." He looked around the semi-circle. "This is a nation long chained, now finding its strength. For years I have devoted myself to the Basque people; today I am called to its ultimate defence. My oath will be upon no book or weapon, but upon a symbol that has survived all the Spanish have subjected it to: the Guernica tree."\n\nHe closed his eyes, in contemplation or prayer Vasco wasn't certain, before Monzón's eyes opened with all the fire of a dawn's sun. "Before God, humbly standing on Basque soil, remembering our forefathers and under the tree of Guernica, I swear to faithfully carry out my duties as Lehendakari.""
BSQ_wars.1.a: "A cry of "Gora Euskadi Askatuta" rang from the crowd, responded in kind by all."

BSQ_wars.2.t: "Shift Change"
BSQ_wars.2.desc: "They followed the plain clothes police officers, and their uniformed thralls, out to the car as they had dragged their foremen away. Across the workfloor, through the yard and to the parked cars they pursued, a silent but pervasive tide behind the officers. They listened as the foreman, their foreman, questioned what was happening and where he was going. They saw the nervous looks of the uniformed officers, looking back to see a horde matching their speed.\n\nAs the foreman was thrown into the back of the car, handcuffed and immobile, they stood before the small group of police as silent sentries. In the car they could see men, well dressed men, awaiting their foreman's arrival. They could see them whispering to him, speaking, as the foreman looked with nervous glances through the windows at his men. The watcher's strength was unmistakable, but no effort had been made to prevent the abduction. A silent question screamed through the air. Why?\n\nOne of the plain clothes officers stepped forward, loose shirt and tie contrasting from the sea of overalls before him. "A moment, gentleman. We asked you to continue working but now that you are all assembled, I'm sure we will have an important announcement for you all soon." The workers and the police stood as if on two coastlines, the sea turned to ice between them.\n\nMinutes rolled by before the foreman left the car, the onlookers watching as his cuffs were removed. He rubbed his wrists, expression caught in a grimace as he did so, as the plain clothes officer whispered more unheard things to him. The foreman stepped forward to the assembled workers.\n\n"I have been informed that Señor Vasquez has ceded his ownership of this plant to the State, and that operations shall continue as before.They understand that we have not been involved in his activities, and are assured of our loyalty to the Basque nation. Gora Euskadi!""
BSQ_wars.2.a: "The confused mass hesitated, before a discordant, collective "Gora" attempted to reply."

BSQ_wars.3.t: "Proper Employment"
BSQ_wars.3.desc: "The interviews blended together, in this grey office on a corner of San Sebastian. All tales of woe and misfortune, all painfully repetitive. A bespeckled, gaunt man ticked the boxes on his form as they spoke.\n\n"I repaired my husband's clothes, before he was caught in that machine..."\n\n"I worked out in Madrid, accountancy. Left before things got bad, but now there's not much work for a man like me."\n\n"Me and my husband worked a farm. I had command of 10 laborers. Now they're all gone, my husband dead and the farm seized."\n\n"I haven't had a job, father insisted I should focus on my studies. What good are they now? I was educated in History mostly, particularly Rome's Iberian presence if that's useful to know. Are you writing this down?"\n\n"I was attached to mining operations in Africa, operating and repairing the machines too complex for the natives mostly; was only supposed to be back on leave. Who knows if that facility even exists anymore, and I've nothing left, christ."\n\nHe lazily filled the forms as they spoke, wishing they would keep only to the relevant details. They would all find their new lives provided for, the state had many uses for idle hands. He had memorised the open roles nearly completely, if such a creature could smile he would at how neatly some of these fit. Yes, the devil was in idle hands but Euskadi had much work to be done.\n\nA military seamstress, a minor town hall clerk, an agricultural instructor, an assembly line operator and a factory engineering assistant left the office, with addresses and dates of employment."
BSQ_wars.3.a: "As they left the office, the long line outside shuffled forward as a few more entered."

BSQ_wars.4.t: "Lesson in the Mountain"
BSQ_wars.4.desc: ""What is the point of this? Up a mountain, down a hill. I've nearly fallen off these slopes three times today and for what, so I can learn that falling off steep cliffs is a bad thing?"\n\nThe soldiers, a dozen packed together in the thin crevasse upon the side of the mountain road, lay on the dirty rock as if it were a fine mattress. Each of their limbs carried the weights of their packs still, rifles laying atop them while their legs forgot their bodies. They did not breathe heavily, the fatigue lay deeper inside than that; each receptor begged for the end of the marching and the climbing. Their eyes stung to look upon the jagged rocks. They were sick of mountains.\n\nAnother soldier spoke up. "Of course Alvarez isn't here. Telling us to follow this old mountain goat around. He's impressive, we get it, but we're going to be fighting the Spanish not trying for Youth League hiking accolades!" Murmurs of approval came, before the crash of two shots in rapid succession.\n\nThey leaped up, surveying around them. They couldn't pinpoint the shots, the sound seeming to come from all around them. Their sights filled with every crevasse visible, some of them slowly pulling themselves up out of their chosen crevasse to try and see further along the path. "See anything?" came a shout multiple times, but no one answered.\n\nFrom behind, two thuds like impacts upon meat. They turned, fatigue forgotten from their bodies, pointing their weapons upon the two corpses that lay where they once had. They were dirtied, wearing light clothes but ammo pouches unmistakably worn. They looked up in unison to see the mountain goat, the old man they had been following. He was perched upon a ledge above them, a rifle slung to his back, with all his equipment discarded save a single magazine pouch. "Spanish partisans, moving through the mountains as I've been teaching you. As you've been ignoring.""
BSQ_wars.4.a: "He held up two weapons, old German submachine guns. "If I hadn't been here, you would all be dead.""

BSQ_wars.5.t: "Tangled Swords"
BSQ_wars.5.desc: ""All rise, all rise!" With little delay, there came a terrible screeching of wooden furniture against plank flooring, only barely concealed by the scuffing of a hundred feet within a single, tightly-packed meeting hall. The air was electric, and with good cause; there had never been such an organized meeting—let alone a public one—between prominent members of the EAJ and the ETA. Such was the occasion that so-called "independents" were allowed to participate, despite their dubious recognition by the provisional government. The details hardly mattered. More bodies meant more legitimacy, after all.\n\nAnd thus, with the order of the day recognized, discussion poured forth freely and with a touch of chaos. Recent seizures of Union property and fortunes became the hot-button issue among the dominant parties present, and clear ideological divides became increasingly apparent from the very moment "redistribution" was exclaimed by a particularly zealous ETA member. The EAJ would tolerate no such "state-sanctioned thievery," or so their leaders would intone, much to the chagrin of their more revolutionary rivals.\n\n"If we allow ourselves to become entranced by our base desires for revolutionary action," bemoaned Minister Ajuriaguerra, councilor economist of the EAJ, "we will only disillusion our own citizenry and undermine the laws that separate us from mere criminals!"\n\nBlessedly, a compromise was inevitably reached: seized property and fortunes would be liquidated for usage in "national defense," a goal almost all within the hall could agree was beyond any ideological squabbling. The cause of independence demanded absolute unity in dialogue and action, regardless of the underlying tensions that threatened to boil over between the dominant right-wing and the increasingly militant left-wing. The united front would endure, at least for a time, striving ever closer to the blooming of the Basque flower upon the world."
BSQ_wars.5.a: ""Ladies and gentlemen, we are adjourned!""

BSQ_wars.6.t: "God and the New Law"
BSQ_wars.6.desc: "It had felt weird, Juan de Ajuriaguerra thought, to get used to life in Bilbao again, but familiar. The streets had a myriad of new shops, but even as half of them shuttered due to poor supply or service on the front, they still followed the same plan. The streets may have been empty, shorn even of most statues, but most still went the same direction.\n\nAnd his church, still full with worshippers, still gave a chime not quite feared by other people. Even at war, God reigned supreme. It was nice to have familiarity. As he ended his prayer and left service, a number of journalists flocked to him, eager to ask questions in a number of languages. He didn't mind the German, French, Spanish and Italian; he could speak practically every one, and knew enough others spoke English for his backers to soon find out.\n\n"What are your thoughts about the ETA?" asked one, in fluent Basque. The accent gave him away; he was from Bayonne. Can't have been a good few weeks for him; even now, it was a challenge to negotiate anything with the French. Clearly, he was trying to soothe the fears of his colleagues at Je Suis Partout. "Do you think them being in the provisional government will start a longer ceasefire between them and the EAJ?"\n\n"Well, it is a provisional coalition. We work together because we have to, and because we all believe in the unity of Euskara against the fascists besieging us," he responded, calm and rehearsed. "These men are very young, and we need men of all ages if we hope to ensure Euskara's liberation."\n\nThe journalist asked another question, but he quickly shrugged them off, beelining for the nearby motorcade left for him. How could he answer them? Of course he despised the ETA presence, just as he despised the demotion of Leizaola. But to spark a civil war now, of all times? His eyes turned to the Pagasarri mountains, to the path he climbed as a young boy."
BSQ_wars.6.a: "Memories of a time before were all he had left."

BSQ_wars.7.t: "Silent Treatment"
BSQ_wars.7.desc: "It had been subtle, at first. The warmth gradually fading from her neighbours' smiles over the past few weeks, or the way their ritual morning gabs had slowly devolved to hurried greetings and the briefest courtesies. The odd side looks. Whispers she could almost hear thrown at her as she wandered the village streets. Once-dear friends seemingly less and less inclined to find time to engage with her, and now-\n\n"They're doing fine, Marta," off-handedly cut Irene as she helped her pack the vegetables inside her bags. Yeah, that settled it. Merely weeks ago, never in a thousand years would she have forgone any chance to ramble on and on about her growing kids whenever prompted; now, she seemed more eager to attend the next in line to her market stall than making any conversation. So that was how it was going to be. They'd known each other since they were girls, and now, she, too, would join the caucus of those treating her like a total stranger ever since-\n\n"Is this about Javi?" she found herself voicing aloud, perhaps louder than she intended. "One day you're cosying up to me because my husband is a Guardia Civil lieutenant, now you're just afraid that-"  The rest of the sentence died in her throat, as her eyes briefly went to one of the officers clad in axe-and-snake insignias that had started to appear all around the village overnight. 'Afraid that they'll take you too' was what she'd refrain from adding.\n\n"Cowards," was all she spat instead as she began to turn heels, half to the line, half to her dismissive friend that had already started to attend to another client. "You're just... you're all just..." but she wasn't even sure what she wanted to add. Maybe she'd hoped her sudden eruption would provoke some kind of response. See the guilt rising on their faces. Or indignation. Disgust. Even just... embarrassment toward her quite public outburst. But what she got instead was proof she'd been right about one thing."
BSQ_wars.7.a: "No one cared to listen to her anymore."

BSQ_wars.8.t: "Banality"
BSQ_wars.8.desc: "Depriving man of water makes man desperate. Depriving man of nature makes man dissonant. Depriving man of liberty makes man nothing.\n\nThat's what Alesander was told during his short time in bureaucracy. The short time before the Basques were tired of being nothing, and declared independence from Iberia.\n\nBut sipping the cup of water provided a soulful reincarnation within him. The fresh air of Vizcaya, tinged with salt crystals from the Bay of Biscay, revived Alesander's body, the sharp sensations extracting all the dead grime and muck that fatigued his body.\n\nBut Alesander was still nothing.\n\nAlesander focused his gaze on the young delegate in front of him. He could hardly understand the speaker's sharp Gipuzkoan dialect. But there were words. Phrases. Melodic cadences in his tone. Interactions he could follow.\n\nIt was an offer for him and his fellow political prisoners to work for the new Basque government. A ticket out of the rotting dilapidation he had been surrounded by for the past weeks, perhaps months.\n\nEvidently, some men had not become nothing. Some men held onto the regime's old ideals, and expressed their worries working with a government that clashed against their values. Others worried that this could be a temporary measure, and that they could easily be replaced.\n\nAlesander, however, was a man of nothing. Curing a man of nothing, evidently, would require knowing something."
BSQ_wars.8.a: "And he will learn how to feel liberated."

BSQ_wars.9.t: "Zeru Horiek"
BSQ_wars.9.desc: ""Come on, mum! It's my duty to this country, to this peninsula! You don't want us to go back to the 1940s, do you? You know these fascists want to destroy our language!" Even now, Maria Landaguti felt worried about it, but knew she couldn't ignore the world around her.\n\n"Oh, Maria, you can't join the army, women don't fight!" Her mother shook her head. Since the civil war had started, she'd only dug herself deeper into fear. Deeper into memories of 1937.\n\n"Me cleaning a few plates won't stop this house from being bombed!" She groaned at it all, the conservatism, the sidelining. Enlistment being extended to women only emphasised that. "Don't you remember Silvano being caned on his first day at school for speaking Basque?"\n\n"He's already a soldier! So's Jos-Jobe, so's Ala..." she caught herself as she forgot their names, changed back into Basque equivalents the moment they enlisted. "Oh, what'll happen if you all die? I'll be left alone to care for your father, and he's very sick." She leant closer, failing to hold Maria as she forced herself back. "You can't leave, not now!"\n\nJust then, her father limped into the room, his health more like a man twice his age. "Ilia, please, calm down." He struggled into the chair, sitting down only shakily. "Do you remember the civil war? Fortuna? We grew up on the same street. Best fighter my squadron had. Took down a dozen of those fascists outside Santander before..." His eyes grew misty, before he sighed. "You can go, Maria."\n\nHer bravado suddenly faded as she accepted her responsibility. Struggling to hold back tears, she hugged her father tightly, then her mother even more tightly, and then grabbed her bag. Walking out of the door, she turned around one last time, looking at the room she had been raised in, and stopped to say only one thing."
BSQ_wars.9.a: ""It's Itzal now.""

BSQ_wars.10.t: "Abertzale in Charge"
BSQ_wars.10.desc: "The large square in front of the Bilbao City Hall was packed with people - men, women and children had gathered to experience the spectacle, as well as a group of journalists to record the event for posterity. Armed ETA militia troops surrounded the square, standing in front of the City Hall's doors and flanking the bearded man conducting the entire event from the steps. The theater of regime change had come to the city.\n\nJosé María Eskubi threw his cigarette on the steps below him and stomped on it, reaching for the communique in his pocket - the script for today's grand show. He unfolded it, nodded to the men on each side of him and began reading, the cameras flashing and microphones listening before him.\n\n"Greetings, people of the Basque Country. Owing to the failures of the previous regime, Euskadi Ta Askatasuna has taken upon itself the initiative to restructure the Provisional Government. Telesforo Monzón, the erstwhile Lehendakari, had been invited to step down from his position, which will remain vacant for the time being. Members of the government belonging to the false nationalists of the EAJ have also stepped down, or been arrested on charges of treason. For now, the government will be composed of a broad front of democratic and nationalist forces committed to bringing true change to our Nation, led by the committed Abertzale of the ETA. Long live Euskara!"\n\nThe crowd cheered, and Eskubi knew he had them. The previous government's failings had opened up the opportunity for the true patriots to finally take matters into their own hands with the people's support. The presence of armed militiamen on every corner of the square didn't hurt, either. With the Basque flag fluttering behind him, he raised a fist and smiled for the cameras."
BSQ_wars.10.a: "The regime may have changed, but the show must go on."

BSQ_wars.11.t: "Death and Taxes"
BSQ_wars.11.desc: ""Right there, that's the place." Danel turned without hesitation, leading the cramped SEAT 600 upon the dirt and gravel road that carved through a heavily grassed hill. At the hill's precipice, an estate overlooked the southern Alavan countryside, an opulent addition amongst the rolling hills of the Basque Country. Vineyards sliced through the parcels of flatland alongside the estate, eliciting a frown from Danel. He could only dream of affording a place like this.\n\nDriving through the front gates of the estate, Danel parked the car just outside the steps of its primary manor before turning to his companion. "Alright," said Joanes. A quiet sigh came from him. "Let's get this over with."\n\nThe two men left the car and moved up the manor's steps before Danel rapped against the front door. A middle-aged man appeared before the two after the momentary click of a lock resounded from inside. Danel cleared his throat. "Good afternoon. We are here to inform you of new stipulations regarding the recent increased wealth tax, effective immediately." Joanes quickly handed the middle-aged man a sheaf of documents, much to his bewilderment.\n\n"Another tax increase?" The estate's owner let out an exasperated chuckle. "You bleed me dry, taking all that I have slaved for, and you still want more?" He quickly balled up the papers and angrily threw them to the ground. "I am not your pig to be slaughtered—"\n\nA hefty shove from Danel suddenly threw the man to the ground, letting out a grunt as the two tax collectors stepped into his home. "This is not a request, and you are in no position to refuse us. We must all give something, especially in wartime." Standing beside Danel, Joanes silently opened his left jacket, revealing a holstered pistol within. "You have until the next fortnight to make a full payment, otherwise..." Joanes shrugged. "Adjustments will need to be made.""
BSQ_wars.11.a: "The man could only whimper as the two left his home."


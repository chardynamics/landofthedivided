BSQ_Collective_Leadership: "Collective Leadership"
POLITICS_BASQUE_COLLECTIVE_LEADERSHIP_DESC: "The coalition between the EAJ and the ETA had always been an unlikely occurrence, kept afloat purely by a nominally shared goal and the efforts of Monzón to bridge the gap. However, as the war stalled and the failings of the government became more clear, what little trust was left was finally chipped away. Using its militias, the ETA launched a coup, removing the EAJ from government. The ETA now rules alone, free to implement ther socialist vision for the newborn country.\n\nIt was decided that the posts of Lehendakari and Vice-Lehendakari were to be left vacant, so that no one person may centralize too much power around themselves, a fate that had killed revolutions with far more stable conditions than what the ETA had been given. The vacancy also served another purpose, for while the ETA had stood united during its collaboration with the EAJ, cracks had begun to form now that the ETA ruled alone. The various ETA factions each had their own visions for Euskadi, and those cracks only grew larger as more independent leftist organizations were integrated, each with their own unique vision for the Basque people's future.\n\nOn the streets, the people hear a shift in rhetoric. While in essence it is the same, none can deny the difference in feeling as they hear the cries for the Republic to "secure its independence" have now become cries to "win the war.""

#Ideas
BSQ_eta_idea: "Euskadi Ta Askatasuna"
BSQ_eta_idea_desc: "The restoration of Basque home rule was a collaborative product between the professed legitimacy of the former government-in-exile and significant military sponsor from one of the most prominent local insurgencies — the Euskadi Ta Askatasuna, or the ETA. Despite claiming political neutrality outside of its service as the country's men-at-arms, the ETA's core membership of young, disenchanted partisans has seen an overall shift towards the leftist abertzale movement lately. With the jeltzale within the militant group increasingly ostracized from positions-of-power, the EAJ-controlled government feels its grip on its sword loosening."
BSQ_frente_militar: "The Frente Militar"
BSQ_frente_militar_desc: "The ETA's struggle is not singular, and neither should the administration force a homogeneity that only stifles the self-governance of its constituents. To reflect this reality, the ETA's bureaucracy was divided into four independent "fronts," and likewise, the Military Front was given charge over their training and expenditures. With the ETA's ascent to the country's leadership, however, the Military Front's expertise in organizing urban guerrillas seems no longer sufficient for the day-to-day army operations that an independent state requires. Without a gradual process of decentralization and acquisition, the Front will likely continue to perform at a vastly diminished capacity."
BSQ_jeltzale_abertzale: "Jeltzales and Abertzales"
BSQ_jeltzale_abertzale_desc: "Contemporary Basque nationalism has its roots in the 19th century when Sabino Arana founded the Basque National Party. Since its birth, it has abided by the Catholic identitarian philosophy of jeltzale, encapsulated in the motto "God and Ancient Laws." Primarily drawing its support from the elites of Basque society, its reactionism has led to a recent split amongst nationalist groups, resulting in the emergence of the abertzales.\n\nThe nascent abertzale organizations find their militants from the more impoverished segments of society, incorporating Marxism into the patriotic tradition to reconcile with their wealthier kinsmen's idea. Although currently united through nationalistic fervour, this unamenable ideological divide will pose an obstacle to the integrity of any future Basque state."
BSQ_basque_red_terror: "The Basque Red Terror"
BSQ_basque_red_terror_desc: "There are hundreds of thousands in the Basque Country willing to fight, kill, and die for their nation. But not everyone is. Across the mountains, valleys and hills, there remains a large element of Spanish unionists, reactionaries or individuals generally considered treasonous to the current government. ETA is hard at work to change that. Through mass arrests and hasty executions, the Basque communist government seeks to remove these perfidious elements from the national body. All this is necessary until their beloved Euskal Herria is free from those who would see its loyal sons and daughters murdered or in chains."
BSQ_sectarianism_spectre: "The Spectre of Sectarianism"
BSQ_sectarianism_spectre_desc: "Although much of the Euskal Herria has fallen back into Basque hands, years of assimilation and cultural eradication have resulted in the lands being inhabited by many who do not view themselves as Basques. Outside of the "Spaniards" who have forgotten their heritage, whether it be Navarre's historical settler community or the refugees escaping the civil war's turmoil. Given their now sizable presence within the country, there is no feasible way to be rid of them entirely.\n\nMoreover, as the Basque National Party remains unconciliatory towards these "invaders" and "maketos," it seems increasingly unlikely that there is any hope to incorporate these non-Basques without witnessing deep, ugly sectarian violence."

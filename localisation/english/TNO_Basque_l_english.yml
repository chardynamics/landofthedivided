#Characters & Leader descs
BSQ_Jose_Quesada: "José María Quesada"
POLITICS_JOSE_QUESADA_DESC: "In many ways, ETA and its military wing was a product of the Francoist dictatorship. The brutal attempts to delete Basque language and culture, the exile into which old Basque nationalists were forced, the repression of workers' movements, the rampant industrialization and urbanization of Euskadi with immigrant workers flocking into the region - these were the ingredients that would converge into the sudden appearance of the abertzale movement. And these very same factors led to the appearance of José María Quesada Lasarte, too.\n\nBorn into a mixed Basque and Navarrese working class family, his father would die fighting on the Republican side during the Spanish Civil War, but he soon would soon take up the struggle. One of ETA's first militants, Quesada was directly responsible for several daring paramilitary and political actions, attacking convoys carrying Spanish and Iberian soldiers, publicly burning Iberian flags, and other such public demonstrations - quickly becoming the enemy number one of Iberian intelligence, and always escaping their grasp.\n\nOne of the most prominent commanders of the military wing of ETA, he was elected to take charge of the Basque government after the coup that brought the armed organizations of the abertzale left into power. While some paint him as a puppet of his younger, ambitious generals like Argala and other militant abertzale youths, Lasarte enjoys the widespread support of ETA, and he and his clique have multiple times stated their objective - Basque Country and freedom, whatever the costs."

BSQ_Pablo_Beldarrain: "Pablo Beldarrain Olalde"
POLITICS_PABLO_BELDARRAIN_DESC: "Pablo Beldarrain began his military career in 1930, becoming an officer while maintaining his membership in the EAJ and its trade union. Upon the start of the Civil War, he oversaw the training of EAJ volunteers, later commanding troops in battle himself, but despite his skill, Euskadi could not hold the superior Nationalist forces. He retreated to France by boat, ordered by the Basque government to remain there. During the war, he was smuggled to Britain, to be trained by American intelligence, just before Fascism came onto Britain's shores, seemingly unwilling to let him escape its clutches again. And yet, escape he did: this time, he arrived in Mexico and joined its Army for a time.\n\nBut soon, the call of Beldarrain's homeland grew irresistible. He made his way back to the newly-created Iberian Union and was incarcerated upon arrival. After his release, he continued to maintain a small network of EAJ operatives, with some connections to the OFN. It seemed that he would remain a low-profile insurgent in a doomed insurgency.\n\nBut then, the Union collapsed - and Beldarrain's old compatriots contacted him once more. They required an experienced military man to help create a Basque military, and he took up arms once more. He now struggles against the unruly armed bands which liberated Euskadi: may relish their autonomy, but he knows that they must give it up in order to keep it free."

BSQ_Telesforo_Monzon: "Telesforo Monzón"
POLITICS_TELESFORO_MONZON_DESC: "The recent history of the Basque Country was fraught with conflicts, between the people of Euskadi and their masters in Madrid and between different factions of the Basque movement - and Telesforo Monzón was in the centre of them all. Born into a wealthy aristocratic family in 1904, as a young man he soon joined the Basque Nationalist Party, or EAJ, quickly becoming president of his local section. An intellectual, writer, poet, and fervent supporter of jeltzale ideology, Monzón collaborated with CEDA and other groups against the Frente Popular, but when the nationalist coup d'etat that would lead into the Spanish Civil War took place, Monzón and the rest of his party found themselves fighting on the republican side.\n\nAs the war ended in disaster, Monzón and the rest of the Basque government were forced into exile. Establishing himself just across the border in France, Monzón remained a close friend of EAJ leader and lehendakari of the Basque government José Antonio Aguirre - however, his relationship with the party soon began to deteriorate over diverging positions. Monzón felt that the EAJ was not doing enough to bring about a free Euskadi, and that more radical action was needed. Thus, he kept himself in close contact with the small grassroots organizations that began to spring up in the country - first of all, Ekin, which would later evolve into ETA.\n\nIn time, Monzón became more or less the only person enjoying widespread respect among both the jeltzale right and the abertzale left - and when Iberia fell into chaos and the Basque people took to the street, Monzón was a natural choice as the new lehendakari. Taking upon himself the difficult task of managing the wartime Basque government and attempting to bridge the ideological abyss between ETA, with its numerous affiliated movements, and the old guard nationalists of the EAJ, Monzón is now the lynchpin of the delicate political equilibrium holding the Euskadi forces together - but it's hard to tell for how long it will last."


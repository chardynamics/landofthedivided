BSQ_wars.13.t: "Who Watches the Watchmen?"
BSQ_wars.13.desc: "Jeers cracked through the air like lightning as the door of the house finally caved in against the pressure of the makeshift battering ram. Those handling the block of wood stumbled, before charging into the small semi-detached house, nondescript from all the others on the street.\n\nThe air was alive with mocking chants. "Get the Francoist!" shouted some. "Not so strong now?" shouted others. The atmosphere carried a litany of different derisions and all were targeted solely at the house's single occupant.\n\nThe town had only known him as a quiet old man before; never seemed to talk to anyone else unless he had to. However he was never discourteous when he had to speak, he'd been somewhat of a local point of interest.\n\nNo-one knew where it had started. Whispers began to circulate. "Maybe there's more to that old man," they said, "he speaks with a southern accent. What is he doing here?" A number of conspiracies had circulated, until finally a file had been brought to the mayor; in it was a picture of the old man with an unfamiliar name - identified as Guardia Civil.\n\nA succession of gunshots came from upstairs, earning a cry of shock from the crowd. Moments later the old man was dragged out of the house, one of the men clutching a bleeding arm. "He was hiding, bastard tried to shoot us!" The old man was thrown to the ground of the street, a small clearing between him and the townspeople.\n\n"What do you people want? What are you saying? I've never been a policeman, please -"\n\nHis pleading faded into a yelp as the crowd lunged, enraged at the sight of their bleeding compatriot. A few muffled screams sounded before being lost in the jeering and dull thuds of impacts."
BSQ_wars.13.a: "Behind them stood the mayor and town's police officers, laughing with the crowd"

BSQ_wars.14.t: "Rules of War"
BSQ_wars.14.desc: "A haze hung in the air, the only sound being the wind drifting through the trees. It was picturesque, if not for the overgrown field that had all the signs of abandonment. A rundown farm was next to it, a single homestead and a barn. In the dirt before the home, three soldiers sat in silence. They had been there for some time.\n\n"Why don't we just... go?" the youngest said softly, not raising his eyes from the ground.\n\n"We can't take them with us, they outnumber us. If they turned on us before we got back to safety..." another answered, shaking his head.\n\n"Can't leave 'em in the barn. Most of 'em are same age as my son, just kids." interjected the oldest man. Another silence lingered.\n\nThey'd been lucky. On patrol, they'd seen the farm and decided to take a look. They found a dozen sleeping soldiers - during the day with no sentry. Their rifles were not even close. They'd fired a few shots into the air and barked a few orders, locking them in the barn - but now what?\n\n"We aren't that far from our lines... if we put the fear of God in them they probably won't cause any trouble -"\n\n"How do you propose we do that?"\n\n"Their officer could have gotten them killed today. Looking at his age he's probably some career guy too. Bet he's done a few things for Franco. Why don't we get rid of him, in a way that sends a message...?"\n\n"Thats murder"\n\n"If it gets the boys to not cause trouble, it saves them"."
BSQ_wars.14.a: "The oldest man stood up without a word and took out his bayonet. The others followed him."

BSQ_wars.15.t: "Trespassers Be Warned"
BSQ_wars.15.desc: "The manure cart bounced as it moved along the road, cut into the side of a rocky hill. The road was jagged with rocks, the tarmac worn with disrepair, barely suitable for a horse let alone a vehicle. Artzai paid it little mind. The road had been cut years ago but it suited his horse and cart just fine.\n\nThe cart followed the curve of the road as it ascended, Artzai barely paying attention to it as he gazed off the side of the hill. He knew about the War, who didn't, but he hadn't paid it any mind until soldiers had turned up. There they camped, dozens of tents and vehicles of various sizes, in scrubland down below a few kilometers away. Artzai was an old man, he had little interest in their squabble, but the spectacle was certainly something.\n\nHis horse suddenly cried out and stopped, threatening to bolt, waking Artzai from his mental absence. He calmed the creature best he could, eyes searching for a cause. All he could smell though was manure, and no cause seemed evident.\n\n"Woah girl, what scared you," he said to it, patting its rear from his seat. "Is there something there?" He stepped down off the cart unsteadily to see what had scared his horse. A dead animal in the road perhaps?\n\nAs Artzai walked forward away from his cart a sickening smell came over him and the humming of flies became louder. Hurrying forward he passed the side of the horse, retching at what he saw with a cry of horror.\n\nA man lay in the road, face down. The skin was blackened and bloated. The back had been ripped open, through clothes which appeared to be some kind of military uniform, the man's ribs fashioned like a bird's wings. Held down by the body was a sign, reading "To Invaders. Leave Euskadi, or you will meet the fate of your friend.""
BSQ_wars.15.a: "Artzai never used that road again so long as he lived"

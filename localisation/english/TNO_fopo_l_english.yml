SalvadoranCoup_Bottom_Text: "Protestors and rival §,military§! §&cliques§! seek to topple the [USA.GetFlag] §mU.S.§!-aligned §WGovernment§! of [ELS.GetFlag] §WEl Salvador§!: §&Castrists§! backed by [MEX.GetFlag]§KMexico§! and §,Hispanist§! hardliners backed by [IBR.GetFlag]§OIbe§!§nria§! and [JAP.GetFlag] §xJapan§!.\n\nThe coup will succeed if both §WMilitary Preparedness§! and §WCivilian Anger§! exceed §Y90%§! before the §,Oncom§!§&ing Day§! §Wof [ELS.GetFlag] Reckoning§!."

# [==-==| [1.1] FACTIONALISM |==-==] #

SalvadoranCoup_Factionalism_PieChart_tt: "If the coup succeeds, the faction with the most Popularity will dominate the resulting junta."
SalvadoranCoup_Factionalism_PieChart_tt_delayed: "Dominance is the ratio of the Popularity of the faction with more and the faction with less.\nDominance increases the power of some decisions."

Factionalism_Castrists_Title_text: "§&CASTRISTS§!"
SalvadoranCoup_Factionalism_Castrists_Title_tt: "§&Revolutionary Soldiers§!\nAligned with the [CUB.GetFlag]§KVeracruz [MEX.GetFlag] Pact§! [VEN.GetFlag]"
SalvadoranCoup_Factionalism_Castrists_Title_tt_delayed: "The Cuban Revolution animated an anti-American, reformist faction of the Salvadoran military. Now Puerto Plata has provided them with hardened Caribbean Legion veterans. As workers and peasants protest against the engrained coffee oligarchy, the exiled Óscar Osorio and Rubén Alonso Rosales aim to lead them to national liberation." 

Factionalism_Castrists_Value_text: "--------------\nPopularity: [?ELS.SalvadoranCoup_PopularityCastrists|Y0]\nDominance: [Get_SalvadoranCoup_Castrists_Dominance]"
SalvadoranCoup_Factionalism_Castrists_Value_tt: "If the coup succeeds, the faction with the most Popularity will dominate the resulting junta."
SalvadoranCoup_Factionalism_Castrists_Value_tt_delayed: "Dominance is the ratio of the Popularity of the faction with more and the faction with less.\nDominance increases the power of some decisions."

Factionalism_Hispanists_Title_text: "§,HISPANISTS§!"
SalvadoranCoup_Factionalism_Hispanists_Title_tt: "§,Reactionaries and Nationalists§!\nOpen to [JAP.GetFlag]§xJapan§! and [IBR.GetFlag]§OIbe§!§nria§!"
SalvadoranCoup_Factionalism_Hispanists_Title_tt_delayed: "President Adalberto Rivera's tepid poverty relief efforts and pro-American foreign policy have alienated a faction of fiercely nationalist hardliners, led by Medrano and Faustino Sosa. Now, his failure to quell the popular revolution in the countryside has provided them both motive and means to remove him and his soft government from power."

Factionalism_Hispanists_Value_text: "--------------\nPopularity: [?ELS.SalvadoranCoup_PopularityHispanists|Y0]\nDominance: [Get_SalvadoranCoup_Hispanists_Dominance]"
SalvadoranCoup_Factionalism_Hispanists_Value_tt: "If the coup succeeds, the faction with the most Popularity will dominate the resulting junta."
SalvadoranCoup_Factionalism_Hispanists_Value_tt_delayed: "Dominance is the ratio of the Popularity of the faction with more and the faction with less.\nDominance increases the power of some decisions."

SalvadoranCoup_Dominance_Yes: "[?dominance_display|0W%]"
SalvadoranCoup_Dominance_No: "§sN/A§!"

SalvadoranCoup_Factionalism_Debug_tt: "§F§YDEBUG§! - §WFACTIONALISM§!\n\n> §GClic§! to §Yadd 5 Popularity§! to §&CASTRISTS§!.\n> §GAlt-click§! to §Yremove 5 Popularity§! from §&CASTRISTS§!.\n> §GShift-click§! to §Yadd 5 Popularity§! to §,HISPANISTS§!.\n> §GControl-click§! to §Yremove 5 Popularity§! from §,HISPANISTS§!.§!"


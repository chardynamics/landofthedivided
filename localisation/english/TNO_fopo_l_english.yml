  JAP_PHI_PW_3_desc: "The men demand vengeance, and vengeance shall be delivered. The 14th Army has been ordered to retake the Philippine Islands once and for all. Every last detail has been meticulously accounted for to make sure nothing could go wrong. The battle lines have been drawn, and for now, we can do no more than watch and hope for victory.\n\n[Get14ArmyCampaignStatus]Currently, our supply §Rdecays§! at a rate of §R[?JP_PHI_supply_decay]§!"

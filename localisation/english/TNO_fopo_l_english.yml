  USA_PHI_huks_Irregular_desc: "The Balintawak Blitz, true to its name, was meant to be a quick and relatively bloodless war against the Japanese-aligned government in Manila, in the hopes of crippling Japanese influence in the Pacific. Yet, the Manila government has put up more of a fight than what we anticipated, and the war grinded down to a bloody standstill with no clear winner.\n\nPerhaps the AFRSR might be willing to work with us. Cooperation may just give us enough boost for us to drive the Japanese out of the islands, and perhaps make the future of post-war Philippines certain, once we win that is."


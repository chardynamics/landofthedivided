### JAP

################## Malaya
 JAP_SHO_aid_category_desc: "Shōnan has been one of our most problematic colonies for a considerable amount of time. Ever since we plied it off the British hands, while most have rightfully seen us as liberators, saving Malaya from exploitation at British hands, others have taken up arms against our government, the colony has been stuck in a perpetual cycle between the military government, and the rebels. While our most recent operation has reclaimed Shōnan and all ports from their illegitimate government, we have information that they have stretched their hands for the Americans of all people.\n\nIt's clear that the situation in South East Asia is escaping our control, and harsher measures must immediately be taken, starting with squashing Chin Peng and the UMAJF once and for all, before we turn towards the Philippines, and their own little rebel problem too.\n\nHawaii might have been an overstretch, but the Pacific belongs to us, and we will not let this afront to our hold in the Pacific stand."


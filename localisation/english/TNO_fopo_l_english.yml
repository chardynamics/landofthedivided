  JAP_WAC_defend_gulf_of_guinea_desc: "Our most important priority currently in the West African War is to protect supply to the PALF and to deny it to the Free French.\n\nWhile we don't wish to directly intervene in the conflict yet and risk an escalation, the Free French have a significant naval force which the Cameroonians cannot match. Despite our desires, we will need to provide direct naval support and resources to develop a fledgling Cameroonian Navy in order to protect our interests in the region.\n\nThe §YGulf of Guinea Campaign§! is currently [GetWACGulfAdvantage]"

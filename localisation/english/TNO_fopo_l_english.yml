# [==/==/ ESSEQUIBO CRISIS /==/==] #
# [==============================] #
VEN_ESQ_desc: "After nearly a century of territorial disputes between Venezuela and the United Kingdom's colony of Guyana, Venezuela has finally invaded over the disputed Essequibo strip, a piece of land constituting two thirds of Guyana's territory and a fifth of their population. With Venezuela now under a fascist and so-called "Bolivarian" regime, the invasion was nothing but expected.\n\nStill, it has caught both Guyanese and Canadian forces off-guard, and as a member of the OFN, allied forces are expected to back up the small Guyanese army. However with Essequibo's rural and remote location, the Guyanese will need to hold back their invaders and push them back to the border until the OFN arrives."
VCW_ESQ_desc: "Following their failed invasion of Guyana, any sense of authority in Venezuela has been lost as the nation has fallen to civil war after the assassination of Moncada Vidal by a communist insurgent. The government now battles against the Fuerzas Armadas de Liberación Nacional - Bandera Roja, a leftist insurgent group.\n\nWith the pariah state delving into anarchy, a joint OAS-OFN Expeditionary force has been formed, with aid from exiled Venezuelan democratic leaders, to intervene in the conflict and create a stabler and friendlier government. Taking advantage of the chaos, there is a good possibility of the expeditionaries succeeding, though if they fail, nothing else will save Venezuela."


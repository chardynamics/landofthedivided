# - | Iberia Decisions | - #
IBR_CN_regroup_perezjimenezistas: "Regroup Perezjimenistas"
IBR_CN_regroup_perezjimenezistas_desc: "Former Venezuelan Caudillo Marcos Pérez Jiménez maintains a considerable number of loyalists in the military. We'll stop by his residence in Madrid and prepare some correspondence to officers willing to join our network."
IBR_CN_incite_national_sentiment: "Incite National Sentiment"
IBR_CN_incite_national_sentiment_desc: "Caldera is far too cozy with the Canadians and Americans, a disgrace to the legacy of the Libertador! At least, that's what the rumors we'll spread through Fort Tiuna will say."
IBR_CN_coordinate_with_rightist_legislators: "Coordinate with Rightist Legislators"
IBR_CN_coordinate_with_rightist_legislators_desc: "The revolutionary triumvirate of COPEI, URD, and AD ignore the few rightist legislators as they bicker. Nevertheless, these wealthy and well-connected citizens will be valuable pieces of our network."
IBR_CN_hide_stockpiles_in_el_avila: "Hide Stockpiles in El Ávila"
IBR_CN_hide_stockpiles_in_el_avila_desc: "The forested mountain park of El Ávila is the perfect place for dead-drops and caches for our agents. Let's seed a few amidst the wildflowers."
IBR_CN_tempt_officers_with_vice: "Tempt Officers with Vice"
IBR_CN_tempt_officers_with_vice_desc: "Venezuela's soldiery are disciplined and orderly. But even a good Christian's tongue can loosen after a taste of Baruta's nightlife."
IBR_CN_expand_network_into_miranda: "Expand Network into Petare"
IBR_CN_expand_network_into_miranda_desc: "The growing slums inside Petare create a populous enclave in eastern Caracas. A little diversification and deals with local gangs could open new avenues for our network."
IBR_CN_form_traditionalist_circles: "Form Traditionalist Circles"
IBR_CN_form_traditionalist_circles_desc: "Santa Rosalía bless El Hatillo. High above Caracas, we can intermingle with the religious and the country club set, both alienated from Venezuela's revolutionary politics."
IBR_CN_smuggle_an_exile_back: "Smuggle an Exile Back" #this could be exiles
IBR_CN_smuggle_an_exile_back_desc: "Adherents to the New National Ideal sought refuge in Iberia after Venezuela's rightful government was overthrown. With DIGEPOL in disarray, it's time to bring one influential figure home."
IBR_CN_pump_guns_and_money: "Pump Guns and Money"
IBR_CN_pump_guns_and_money_desc: "We need to show our network that distant Iberia can fulfill their ambitions. Nothing is more convincing than crates of loaded guns and pesetas."
IBR_CN_pressure_from_the_pulpit: "Pressure from the Pulpit"
IBR_CN_pressure_from_the_pulpit_desc: "A limited, but useful, number of righteous clerics aligned with Francoist thinking stand against Venezuela's revolutionary parties - even COPEI's 'Social Christian' heresies. Let's use one to expand our flock."
IBR_CN_plant_explosives_at_politicians_homes: "Plant Explosives at Politicians' Homes"
IBR_CN_plant_explosives_at_politicians_homes_desc: "Actions speak louder than words. And the loudest demonstration of DIGEPOL's failures is a bomb."

# - | Mexico Decisions | - #
MEX_CN_deploy_the_best_and_brightest: "Deploy the Best and Brightest"
MEX_CN_deploy_the_best_and_brightest_desc: "Villalba's URD government boasts impressive technocratic credentials. Let's pull a few members toward the urgent policy challenge of guaranteeing Caracas' security."
MEX_CN_stress_unity_above_all: "Stress "Unity Above All""
MEX_CN_stress_unity_above_all_desc: "Caldera's COPEI government is a unifying force. Let's amplify that message on Caracas' streets with tracts and speakers."
MEX_CN_stiffen_miraflores_guard: "Stiffen Miraflores Guard"
MEX_CN_stiffen_miraflores_guard_desc: "The president's safety must be ensured from Iberian subversion. The DFS began as Alemán's bodyguards, perhaps they can teach their DIGEPOL equivalents a few tricks."
MEX_CN_monitor_altimira_and_la_praza_francia: "Monitor The Plaza Altamira and Golden Mile"
MEX_CN_monitor_altimira_and_la_praza_francia_desc: "The reflecting pool of Altamira Square is a natural gathering point for protestors and intriguers, while the Golden Mile, a financial district with prices among the most expensive in Latin America, may very well paralyze the city if blockaded. Let's establish thorough surveillance over the area."
MEX_CN_establish_commercial_connections: "Establish Commercial Connections"
MEX_CN_establish_commercial_connections_desc: "The businessmen of Baruta always keep their ear to the ground regarding opportunities. A few deals and we'll learn the latest on Iberian smuggling in Caracas."
MEX_CN_stage_student_rallies: "Stage Student Rallies"
MEX_CN_stage_student_rallies_desc: "Sucre's many universities make the district a natural bastion of opposition to Iberia's reactionary politics. Let's put these radicals to good use for once."
MEX_CN_connect_to_caracas: "Connect to Caracas"
MEX_CN_connect_to_caracas_desc: " El Hatillo's height leaves it severed from much of Caracas. We can improve DIGEPOL's access, and soothe residents, by funding new infrastructure."
MEX_CN_send_veracruz_dignitary: "Send Veracruz Dignitary"
MEX_CN_send_veracruz_dignitary_desc: "The Veracruz Forum brings together the great figures of revolutionary Latin America. A high profile visit to Caracas will energize Venezuela's defenders."
MEX_CN_embed_an_agent: "Embed an Agent"
MEX_CN_embed_an_agent_desc: "OCAE has improved our coordination with Venezuela's DIGEPOL intelligence service greatly. They'll doubtlessly welcome another DFS tiger roaming the dark alleys of Caracas."
MEX_CN_mobilize_the_ruling_party: "Mobilize the Ruling Party"
MEX_CN_mobilize_the_ruling_party_desc: "Venezuela's government would not be in power without its loyal organizers in Caracas, the beating heart of the country. Let's give a show of strength with a mass rally!"
MEX_CN_joint_naval_exercise_in_caracas_bay: "Joint Naval Exercise in Caracas Bay"
MEX_CN_joint_naval_exercise_in_caracas_bay_desc: "Larrazábal's mighty navy helped make the Venezuelan revolution, and now they will defend it. Together with Mexican and Cuban vessels, we will overawe the traitors!"


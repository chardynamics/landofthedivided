SalvadoranCoup_MilitaryPreparedness_Icon_tt_delayed: "§WMilitary Preparedness§! must exceed §Y90%§! to overthrow §Wthe Government§!.\nThe higher [ELS.GetFlag] §WEl Salvador§!'s Stability, currently [?ELS.stability|Y0%], the more effectively §Wthe Government§! reduces §WMilitary Preparedness§! when it Combats the §,Pl§!§&ot§!."
SalvadoranCoup_MilitaryPreparedness_Debug_tt: "§F§YDEBUG§! - §WMILITARY PREPAREDNESS§!\n\n> (§GClick§!) §WMilitary Preparedness§!: §G+10%§!.\n> (§GShift-click§!) §WMilitary Preparedness§!: §R-10%§!.§!"


easter_coup_info_tt: "§!In the city of San Cristóbal near the border with @COL §fColombia§!, a §uConspiracy§! against @VEN Venezuela's §SLeftist Government§! grows. As the §SGovernment's§! @IBR §OForeign§! §nEnemies§! increase §RPreparation§!, the plot will spread to dissident officers in additional barracks. §RPreparation§! must be §Y85§! or higher by Holy Wednesday if the conspiracy is to complete its route to the capital, Caracas, and be ready to launch their coup.\n\nThe §SGovernment's§! @MEX @BRA §KAll§!§nies§! abroad can assist @VEN Venezuela in severing the connections between barracks by reducing §RPreparation§!.\n\nAdditionally, they can defeat the §uConspiracy§! by lowering its §MSecrecy§! to §Y0§!, allowing a §Xtargeted crackdown§! against its leadership."


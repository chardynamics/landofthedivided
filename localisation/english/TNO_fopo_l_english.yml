### Iranian Civil War

JAP_ircw_category_desc: "Once one of the few allies belonging to Germany in the Middle East, Iran has recently imploded into civil war following the death of its Shah, Mohammed Reza Pahlavi, a largely unpopular figure following his overthrowing of Prime Minister Mohammad Mosaddegh and establishment of his pro-German regime. As the instability of the region has been threatening to boil over since the beginning of the Oil Crisis, it seems only natural that with the death of its leader, the partisans of Iran have made their move for power.\n\nAmong these rebels moving against the government of Iran are the Democratic Republic of Iran, led by Karim Sanjabi, the Socialist Federation of Iran under Iraj Eskanderi, and the Baluchi Liberation Front, an independence movement in the south of the nation led by Sher Mohammed Marri, among others. Of course, there is also the remnants of the pro-German government holed out of the north of the nation.\n\nAs fresh arms flow into the region, and the anti-German alliance already shows cracks, it would seem as though it's in the best interest of the world powers to send aid the way of their preferred candidates."

### SAF War - Aftermath

TNO_SAF_Aftermath_desc_USA: "We have won a great victory for democracy in South Africa, but our work is far from finished. While the German army is defeated, remnants of their forces still fight on. In addition, many local warlords have established their own forces, and would like nothing better than expel us from their lands. Victory in Africa means nothing if we cannot stabilize the continent.\n\nSome of our officers have suggested continuing our strategy of attrition, using overwhelming firepower and superior tactics to eliminate as many rebels that we can while minimizing our own losses. However, diplomatic officials have suggested using a softer touch to win over the natives, which they claim will stabilize the continent better in the long term. Whichever approach we take, the public demands that our young men return home soon, and leave a stable continent behind. If we fail to satisfy the public, we will surely suffer at the polls."
TNO_SAF_Aftermath_desc_GER: "Larp harder"
TNO_SAF_Aftermath_USA_investment_level: "Investment: "

 ## Generic Ideas
 JAP_Plane_Bombing: "Japanese Bombing Runs"
 JAP_Plane_Bombing_desc: "The outbreak of war with the Japanese puppet has brought the wrath of the Japanese Air Force down upon us. Bombs rain down upon critical infrastructure and military installations and our ability to offer resistance in the air is minimal.\n\nThis will disrupt the organisation of our forces and will damage domestic support for the war effort, but we have little choice but to press on and hope that this bombardment does not escalate further."
 JAP_military_advisors: "Japanese Military Advisors"
 JAP_military_advisors_desc: "Our friends in Japan have seen fit to dispatch advisors from the IJA to aid our armed forces in the current conflict. With their support we shall see a significant improvement in the overall performance of our soldiers, as well as learning important lessons about modern warfare which will improve the efficiency of our armed forces in the future."
 JAP_technician_aid: "Japanese Technical Aid"
 JAP_technician_aid_desc: "Japan has seen fit to dispatch technicians to aid our war effort and we are already seeing significant benefits to a range of different areas of our military and economy as a result. We can only hope that such aid continues to be forthcoming."
 JAP_sabotage_effort: "Japanese Sabotage Effort"
 JAP_sabotage_effort_desc: "The outbreak of war with the Japanese puppet has resulted in Japanese spies being unleashed against us. A wave of sabotage has swept our country as their agents set to work stealing state secrets, sabotaging military operations, and assassinating officials.\n\nThis is proving detrimental to the war effort, not only because of the direct consequences of the sabotage but also because of the paranoia gripping our government as our own agents struggle to prevent further damage."

 JAP_partisan_attacks: "Coordinated Partisan Attacks"
 JAP_partisan_attacks_desc: "Partisan attacks are being carried out with alarming frequency and efficiency behind our lines. Targeting our troop concentrations and lines of supply, these attacks prevent our ability to resupply our troops and effectively hold ground. The highly focused nature of these attacks makes it clear Japanese the Japanese intelligence services supporting our enemies are feeding intel to these groups. We will be able to drive them out, however until we do we must remain vigilant."

 JAP_army_infiltration: "Infiltrated Army"
 JAP_army_infiltration_desc: "Our Army has been infiltrated by Japanese Intelligence. Either through bribes or coercion, a number of out high ranking officers are feeding intel to our enemies. Until we can root out these spies our ability to plan offensives and coordinate troop movements will be hampered."


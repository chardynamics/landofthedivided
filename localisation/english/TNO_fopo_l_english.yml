## GER ##
GER_PP_invasion_desc: "Spies in Havana and Washington have delivered reports to us detailing the training of the "Caribbean Legion," a group of political dissidents and mercenaries preparing for an invasion of the Dominican Republic to overthrow dictator Rafael Trujillo. Despite Trujillo's steadfast alignment to Iberia, we may find that humiliating the Americans in their own backyard could prove valuable.\n\nAmerican air assets will likely be used in the conflict and prove devastating to D.R. forces. In response, engineers in the Wehrmacht have begun strongly advocating for the shipment of anti-air weapons especially new technologies for field testing. We should not pass up valuable experience and photos of downed U.S. pilots on the news."


#Ideas
TNO_SATW_chemical_weapons: "Chemical Warfare"
TNO_SATW_chemical_weapons_desc: "Once considered one of the worst horrors to emerge from the two World Wars, a grim new consensus has emerged in this country's armed forces regarding the use of chemical weapons. Retrieved from forgotten caches and the depths of armories, they have been let loose to wreak havoc on the tense and desperate frontlines of the South Atlantic War.\n\nThe consequences of such an action have been immediate and drastic. Numerous countries are already condemning their proliferation as a war crime. Their enemies in the South Atlantic War decry it as a heinous act publicly, yet privately plot to use such weapons for their own needs.\n\n§eA new level of inhumanity has been reached in this war, pray it does not continue its downward spiral.§!"
TNO_SATW_tatically_nuked: "Tactically Nuked"
TNO_SATW_tatically_nuked_desc: "A lightless burn flourishes in this country, invisible fires of radiation scorching it from within and without, razing many of its military bases from the Earth. A similar fate is shared by select "strategic" targets, a signifier that offers little comfort to the victims left in its aftermath.\n\nThe physical damage is not the only toll taken by this missile. Morale has plummeted in its wake — soldiers talk of their comrades being vaporized within the blink of an eye — years of munitions gone within seconds. The South Atlantic War has reached a new low as midnight ticks ever closer.\n\n§eThere is an exceedingly high chance of a retaliatory nuclear attack — one that will be returned in kind — again and again... until there is nothing left.§!"
TNO_SATW_treaty_of_montevideo: "Treaty of Montevideo"
TNO_SATW_treaty_of_montevideo_desc: "The Sun of May once shone over an entire continent — casting its glow from Punta Arenas to Punta Gallinas — but those days are no more. The Treaty of Montevideo is the latest humiliation for this former hegemony, dictating Brazil's victory over Argentina under terms so punishing as to make Versailles look enviable.\n\nThe Argentinean army is no more, soon to be demilitarized and replaced with self-defense forces unable to exceed a meager number. Their navy rests at the bottom of the Atlantic, scuttled in totality. Even touching the border with a martial intent is prohibited. The government's fate looks grim, deeply unpopular for their part in the treaty.\n\nEventually, a new government will arrive in Argentina. It will remember the day the treaty was signed in anger, and then, it will return for blood."
TNO_SATW_treaty_of_asuncion: "Treaty of Asunción"
TNO_SATW_treaty_of_asuncion_desc: "Where there was once a chance for order and progress to become the defining attributes of the South American continent, there is nothing but bitter nostalgia for what could have been. The Treaty of Asunción has put a firm end to all these notions, nailing Brazil's hopes as hegemon into a coffin and sending it six feet under.\n\nUnder the treaty, the Brazilian army is an empty shell, stripped of anything that could unnerve Argentina. Their navy suffers a similar fate, as their boats sleep with the fishes in a watery grave. Forbidden from even holding a rifle near their border, the days of Brazil's government appear numbered after signing this treaty.\n\nEventually, a new Brazilian government will emerge, marked by the treaty's hardships. They will prepare — looking across the border with fury — looking forward to striking down Argentina with all their hatred."
SATW_loss_treaty_restrictions_tt: "§RCannot train units, disband units, or edit unit templates.§!\n"


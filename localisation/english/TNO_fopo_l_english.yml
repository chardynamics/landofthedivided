VEN_VNS_Peoples_Momentum_tt: "£txticon_left_resistance §VRebel Legitimacy§! will §Rincrease§! slightly.\n\nBased on our observations of the current ground situation, £GNG_product_interest_texticon §*Government Legitimacy§! is predicted to range from [?VEN.predicted_legitimacy_low|Y0] to [?VEN.predicted_legitimacy_high|Y0] next month.\n\nAs it is difficult to truly estimate the level of support the rebels are receiving, §Your predictions may differ slightly from reality§!." 

VR_info_tt: "§R"If I leave, I arrive; if I arrive, I enter; if I enter, I triumph."§!\n\nDue to the amorphous nature of our @VNS §Vcommunist enemy§!, the semi-regular forces we face along makeshift frontlines are not the only threat. We must maintain awareness of §Zguerilla operations§! behind our lines and ensure that the @VEN §SVenezuelan government§! maintains sufficient popular support.\n\nThe higher a side's §YLegitimacy§!, the more §Gbonuses§! its troops receive. Low §YLegitimacy§! will instead apply §Rworsening penalties§!.\n\nStates the @VEN §SGovernment§! controls add to £GNG_product_interest_texticon §*Government Legitimacy§!, and states the @VNS §VCommunists§! control add to their £txticon_left_resistance §VLegitimacy§!. As the war continues, the £txticon_left_resistance §VCommunists'§! §VLegitimacy§! will §Rrise at a faster rate§!.\n\n§JCOIN operations§! are crucial to eliminate §Zguerrilla activity§! in territory under @VEN §SGovernment§! control. States with the @VNS §VFALN modifier§! will see §Ropen revolts§! if £txticon_left_resistance §VCommunist Legitimacy§! is sufficiently high. @VEN §SGovernment§! forces may experience significant §Rloss of command and control§! with revolts behind their lines, so this outcome should be §Yprevented at all costs§!."
VR_info_tt_delayed: "§YTIP:§!\n§.#1 -§! Staff recommend attempting to §Lclear the western, Andean redoubts§!, before throwing the full weight of our divisions against the FALN in the East.\n§.#2 -§! Keeping Government Legitimacy high with a §Lpriority set on COIN operations§! will prevent enemy revolts from spawning inside Government territory.\n§.#3 -§! The Communists' Legitimacy §Lwill continue to rise§!, ensuring that a protracted conflict is in their favor."

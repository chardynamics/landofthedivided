BRA_CCW_reassign_hardliners_desc: "The so-called Hardliners' overambition is their weakness. Assigning some of their rank to the Colombian frontlines will ensure they will be out of our hair for a time."
BRA_CCW_reassign_sorbonne: "Assign £BRA_sorbonne_texticon §QSorbonne§! to the Frontlines"

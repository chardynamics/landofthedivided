### Operation Bin Qasim ###
GER_OBQ_desc: "India burns, and its own armies have lit the match. After the betrayal of the Indian Legion to the Sphere, we have begun to look to other methods of seeing our influence thrive in the region, and we finally found able allies in the form of the Pakistan Movement, a strongly pro-European faction with links to our own Muslim allies and our British friends. India may be beyond our grasp, but seeing part of it cut away forever, now that its military might is on the other side of the country - that is achievable."
GER_OBQ_PAK_claims_overview: "Pakistan's Claims"
GER_OBQ_PAK_claims_overview_desc: "The Pakistan movement claims these lands as their own. We must ensure they control all of it in order for them to succeed. You may view the highlighted regions on the world map."

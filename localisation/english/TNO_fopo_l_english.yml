################## WAC

 BRA_wac_desc: "President Lacerda is eager to prove that his vocal support of a close partnership with the United States and the OFN is more than just empty prattle. With the explosion of conflict in West Africa, the Americans are once again rallying the alliance for an intervention, and Brazil shall answer the call. A wide range of operations are already in consideration: from anti-piracy operations in the Gulf of Guinea, to the deployment of both air power and ground troops to aid Free France.\n\nShould this adventure bear fruit, we will have proven to both our partners and rivals that Brazil is not a nation to be underestimated. Failure to produce quick and decisive results, however, could easily be spun against us; casting a rather dark cloud over the President's foreign policy..."

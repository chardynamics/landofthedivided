VEN_CN_fopo_district_1_tt: "§YLibertador§!\n-------------\n§GNetwork Strength§!: §Y[?global.TNO_caracas_coup_control_var^1]%§!\n-------------\n\n\n\n\n £GFX_caracas_nights_description_district_libertador \n\n\n\n\n-------------\n§FThe vast district of §WLibertador§! forms the historic and administrative core of Caracas. Home to government institutions, old colonial neighborhoods, and dense urban sprawl, it captures both the city's heritage and its challenges.§!"
VEN_CN_fopo_district_2_tt: "§YSucre§!\n-------------\n§GNetwork Strength§!: §Y[?global.TNO_caracas_coup_control_var^2]%§!\n-------------\n\n\n\n\n £GFX_caracas_nights_description_district_sucre \n\n\n\n\n-------------\n§F§WSucre§! stretches eastward from the capital's center, blending bustling working-class communities with key transport corridors. It stands as one of the most populous and dynamic zones of the metropolitan area."
VEN_CN_fopo_district_3_tt: "§YEl Hatillo§!\n-------------\n§GNetwork Strength§!: §Y[?global.TNO_caracas_coup_control_var^3]%§!\n-------------\n\n\n\n\n £GFX_caracas_nights_description_district_hatillo \n\n\n\n\n-------------\n§F§WEl Hatillo§! rests in the southeastern hills, a quieter enclave known for its colonial charm, artistic culture, and cooler climate. It offers a striking contrast to the crowded heart of Caracas.§!"
VEN_CN_fopo_district_4_tt: "§YChacao§!\n-------------\n§GNetwork Strength§!: §Y[?global.TNO_caracas_coup_control_var^4]%§!\n-------------\n\n\n\n\n £GFX_caracas_nights_description_district_chacao \n\n\n\n\n-------------\n§F§WChacao§! is the modern commercial center of the capital, lined with skyscrapers, malls, and offices. Despite its small size, it represents Caracas's economic pulse and cosmopolitan side.§!"
VEN_CN_fopo_district_5_tt: "§YBaruta§!\n-------------\n§GNetwork Strength§!: §Y[?global.TNO_caracas_coup_control_var^5]%§!\n-------------\n\n\n\n\n £GFX_caracas_nights_description_district_baruta \n\n\n\n\n-------------\n§F§WBaruta§! lies on the city's southeastern edge, where residential neighborhoods climb the green slopes. A mix of suburban calm and urban development, it bridges the capital with its surrounding valleys.§!"


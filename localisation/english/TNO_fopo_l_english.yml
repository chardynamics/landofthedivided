### JAP ###
JAP_INDCW_desc: "Originally established by Indian exiles in Singapore as a vehicle for national liberation, the government of Azad Hind represents our interests in the Indian subcontinent. Biweekly flights between Tokyo and Kolkata carried ambitious marketing executives seeking new markets, while Foreign Ministry strategists weighed its potential as a naval outpost in future conflicts. Yet, they overlooked the smoldering embers left behind—a flame ignited by Japanese military officers during the war that was now beginning to take hold.\n\nThis flame, the enduring spark of a free India, had never truly gone out. It had waited patiently, its embers biding their time until they could catch. Now emboldened, this raging fire is poised to set the whole subcontinent ablaze, unless it is extinguished by force.\n\nThis fight for liberation could see the transformation of a remote outpost on the Empire's edge into a central stronghold. The fierce desire for an independent India has been thwarted time and again by American and German imperialism working in tandem. But with fuel to burn and one final push, this flame could bring liberation to yet another corner of the world from the grip of colonialism and imperialism."


GER_PP_ceasefire_desc: "Despite our efforts, the Puerto Plata Invasion has come to a ceasefire with the Legion holding territory in the North while Trujillo has been replaced by Balaguer. More alarming are the rumors that the Americans and Iberians could negotiate some sort of a long term peace settlement. This is unacceptable.\n\nWe have inserted multiple teams of the Brandenburgers, Germany's finest and most elite special forces operatives. Living as if they were guerrillas in the mountains, they will conduct a variety of sabotage and destabilizing operations to trigger continued fighting. And while we need to keep them well supplied, larger more ambitious operations could come with some hefty risks."

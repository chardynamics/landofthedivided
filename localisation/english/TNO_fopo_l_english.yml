## BRA ##
BRA_CCW_desc: "Violence. That's the best word to describe Colombia's current situation. It doesn't matter how many other ceasefires besides the 1956 one were to be put up; peace was never an option for the Colombians.\n\nNevertheless, this coming war is also an opportunity to secure ourselves a new ally in the northern Andes, and if we don't help to end this war as soon as possible, we will suffer from its side effects. It's time for the snake to drink some coffee in Colombia."

BRA_CCW_support_URC_tt: "We will support the §VColombian Revolutionary Union§! in the §RColombian Civil War§!."
BRA_CCW_support_URC_tt_change: "§FDue to the election of §QCarlos Lacerda§!, our loyalties in Colombia have changed. We will now support the §VColombian Revolutionary Union§! in the §RColombian Civil War§!.§!"
BRA_CCW_support_NF_tt: "We will support the §fColombian Government§! in the §RColombian Civil War§!."

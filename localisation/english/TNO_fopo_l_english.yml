  JAP_WAC_offensive_cote_divorie: "Prepare Offensive into Côte d'Ivoire"
  JAP_WAC_offensive_cote_divorie_desc: "We will prepare what is, hopefully, one final offensive to knock the Free French out of this war. By taking and holding Côte d'Ivoire, the rump imperialist state of France will surely be unable to continue standing, and their allies shall surely fall alongside them."
  JAP_WAC_offensive_cote_divorie_stagnate: "The Côte d'Ivoire Front Stagnates"


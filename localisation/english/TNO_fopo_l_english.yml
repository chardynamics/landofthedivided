BRA_CCW_support_Pinilla_tt: "We will support §OPinilla's Regime§! in the §RColombian Civil War§!."
BRA_CCW_negotiations_tt: "We will attempt to negotiate a detente between §fColombia§! and the §mUnited States§!.\nIf successful, both us and the Yankees will aid them in §RLa Violencia§!."

# [==-==| [2.2] IBERIAN DECISIONS |==-==] #

IBR_SalvadoranCoup_TheOldPartiasFavor: "The Old Patria's Favor"
IBR_SalvadoranCoup_TheOldPartiasFavor_desc: "§F-------------\nEvery time this decision is taken its £political_power_texticon  cost increases by §Y5§!. Meanwhile, its cost in §Y$$M§! is §Jdirectly proportional§! to the value of §WMilitary Preparedness§!.\n-------------\n§!El Salvador's weak government has allowed §&Castrist§! filth to permeate the armed forces. By directing them toward leftist conspirators, we keep true Salvadoran patriots safe."
IBR_SalvadoranCoup_TheOldPartiasFavor_CostPP_tt: "(§WDecision £political_power_texticon  Cost§!): §R+5§!."

IBR_SalvadoranCoup_ArmsForTheWorthy: "Arms for the Worthy"
IBR_SalvadoranCoup_ArmsForTheWorthy_desc: "§F-------------\nEvery time this decision is taken its £GFX_weapon_icon  cost increases by §Y100§!.\nIts power is higher if §&Castrists§! are Dominant.\n-------------\n§!The logistics of arming Salvadoran patriots from Iberia is fiendish. We will work to rearm certain... enterprising merchants in the region that supply the §,Hispanists§! weapons."

IBR_SalvadoranCoup_DesordenFromORDEN: "Disorder from ORDEN"
IBR_SalvadoranCoup_DesordenFromORDEN_desc: "Medrano, head of El Salvador's National Guard and its intelligence agency, ORDEN, is a known admirer of Iberian governance. If he were to 'release' a few tortured civilians for public view, the totterring Rivera government would receive another push."

IBR_SalvadoranCoup_HomemadeNationalMartyrs: "Homemade National Martyrs"
IBR_SalvadoranCoup_HomemadeNationalMartyrs_desc: "§F-------------\nThis decision damages §WEl Salvador's§! Stability and War Support in §Jproportion§! to §,Hispanists'§! Dominance.\n-------------\n§!There are so few righteous men willing to lay down their lives for El Salvador. Others can be convinced with a few credible threats to their families."
IBR_SalvadoranCoup_HomemadeNationalMartyrs_Error_tt: "§sERROR: UNKNOWN EFFECT. PLEASE FULLFIL DECISION'S PREREQUISITES TO CONTINUE.§!"

IBR_SalvadoranCoup_GiftsAndFavors: "Gifts and Favors"
IBR_SalvadoranCoup_GiftsAndFavors_desc: "§F-------------\nEvery time this decision is taken its£GFX_green_dollar_sign cost increases by §Y5M§!.\nIf its cost exceeds §Y$15M§!, it will be more powerful.\n-------------\n§!Many Salvadoran officials have too much to lose in a coup to be turned by gifts within our means. Their personal secretaries however..."
IBR_SalvadoranCoup_GiftsAndFavors_modifier_tt: "§WThe Government§!'s Efforts to Combat the §,Pl§!§&ot§! will be less effective at decreasing §WMilitary Preparedness§! and §WCivilian Anger§!."

IBR_SalvadoranCoup_UnderTheTableBargaining: "Under the Table Bargaining"
IBR_SalvadoranCoup_UnderTheTableBargaining_desc: "§F-------------\nEvery time this decision is taken its£GFX_green_dollar_sign cost increases by §Y5M§!.\nIf §,Hispanists§! are Dominant, §WMilitary Preparedness§! increases but the §,Day§! §&of§! [ELS.GetFlag] §WReckoning§! accelerates.\nIf §&Castrists§! are Dominant, the effects are reversed.\n-------------\n§!Corruption worms throughout the Rivera administration, as its predecessors. We can lean on a hardline coffee oligarch to bring their clique alongside."
IBR_SalvadoranCoup_UnderTheTableBargaining_Day_Increase_tt: "Adds §Y15§! days from the §,Day§! §&of§! [ELS.GetFlag] §WReckoning§!."
IBR_SalvadoranCoup_UnderTheTableBargaining_Day_Decrease_tt: "Removes §Y15§! days from the §,Day§! §&of§! [ELS.GetFlag] §WReckoning§!."

IBR_SalvadoranCoup_SpreadingAnInferno: "Spreading an Inferno"
IBR_SalvadoranCoup_SpreadingAnInferno_desc: "§F-------------\nThis decision increases §WMilitary Preparedness§! by §Y20%§! of §WCivilian Anger§!, and increases the Popularity of the Dominant faction.\n-------------\n§!Santa Ana, San Miguel are smoldering. By unleashing rabid troops backing the coup against the governments' loyalists, we can set them alight!"

# [==-==| [2.3] MEXICAN DECISIONS |==-==] #

MEX_SalvadoranCoup_NoRevolutionWithoutInfighting: "No Revolution Without Infighting"
MEX_SalvadoranCoup_NoRevolutionWithoutInfighting_desc: "§F-------------\nEvery time this decision is taken its £political_power_texticon  cost increases by §Y5§!.\nIt increases §&Castrist§! Popularity by §Y30%§! of §,Hispanist§! Popularity if §WCivilian Anger§! is §Y50%§! or more, and by §Y15%§! otherwise.\n-------------\n§!Not for nothing do we maintain state control over paper. Let Mexico's intellectual and cultural titans wield their pens, to get Salvadorans to draw their swords."

MEX_SalvadoranCoup_SwordsIntoThorns: "Swords Into Thorns"
MEX_SalvadoranCoup_SwordsIntoThorns_desc: "§F-------------\nEvery time this decision is taken its £GFX_command_power cost increases by §Y5§!.\nIt decreases §,Hispanist§! Popularity by §Y12%§! if §WCivilian Anger§! is §Y50%§! or more, and by §Y6%§! otherwise.\n-------------\n§!Almazán showed us the dangers of rightist hanger-ons to a Revolution. A DFS-arranged accident for an Hispanist officer now saves the §&Castrists§! trouble later."

MEX_SalvadoranCoup_LessonsFromMorelos: "Lessons from Morelos"
MEX_SalvadoranCoup_LessonsFromMorelos_desc: "§F-------------\nThis decision's £GFX_command_power cost increases §Jproportionally§! to §WMilitary Preparedness§!.\n-------------\n§!Corona del Rosal heads the Morelos Group, an officer network covertly spreading PRI influence through our military. Similar techniques can spread Osorio and Rosales' conspiracy through Salvadoran barracks."

MEX_SalvadoranCoup_DoorToDoorRevolutionaries: "Door-to-Door Revolutionaries"
MEX_SalvadoranCoup_DoorToDoorRevolutionaries_desc: "§F-------------\nThe £GFX_weapon_icon  cost of this decision is three times the difference between §WMilitary Preparedness§! and §WCivilian Anger§!.\nThe lower §WEl Salvador's§! War Support, the more it will increase §WMilitary Preparedness§!.\n-------------\n§!Caribbean Legion vets and §&Castrist§! soldiers are the most credible voices against the government. Our PRI militancy will teach them a new kind of campaign - the political."
MEX_SalvadoranCoup_DoorToDoorRevolutionaries_trigger_tt: "§WMilitary Preparedness§! must exceed §WCivilian Anger§!."

MEX_SalvadoranCoup_AJustCause: "A Just Cause"
MEX_SalvadoranCoup_AJustCause_desc: "§F-------------\nEvery time this decision is taken its£GFX_green_dollar_sign cost increases by §Y5M§!.\n-------------\n§!Alemán can invite a Salvadoran industrialist to Acapulco for business. Explain how profitable it is to be on the right side of a Revolution. They'll get the idea."
MEX_SalvadoranCoup_AJustCause_modifier_tt: "§WThe Government§!'s Efforts to Combat the §,Pl§!§&ot§! will decrease §WCivilian Anger§! by 30% less."

MEX_SalvadoranCoup_EmphasizeTheLegacyOfLaMantanza: "Emphasize the Legacy of La Mantanza"
MEX_SalvadoranCoup_EmphasizeTheLegacyOfLaMantanza_desc: "§F-------------\nThis decision increases the £GFX_flame_texticon of Proletarian Revolts to a maximum of §Y5§!. Current power is [?SalvadoranCoup_UnleashProletarianRevolts_Level|Y0].\n-------------\n§!Just thirty years ago, Martínez killed tens of thousands to protect the land coffee oligarchs stole. Pamphlets, radios warn Salvadorans to never allow this again."
MEX_SalvadoranCoup_EmphasizeTheLegacyOfLaMantanza_trigger_tt: "Popular £GFX_flame_texticon §Zfury§! has not reached its apex."
MEX_SalvadoranCoup_EmphasizeTheLegacyOfLaMantanza_tt: "Unleash Proletarian Revolts becomes more powerful in creating §WCivilian Anger§!."

MEX_SalvadoranCoup_UnleashProletarianRevolts: "Unleash Proletarian Revolts"
MEX_SalvadoranCoup_UnleashProletarianRevolts_desc: "§F-------------\nThis decision's power rises as £GFX_flame_texticon does, to a maximum of §Y5§!. Current power is [?SalvadoranCoup_UnleashProletarianRevolts_Level|Y0].\n-------------\n§!No more shall dispossessed Salvadorans decamp to Honduras in shame. The §&Castrists§! will cry out to the masses to fight for their homeland!"

# [==-==| [2.4] EL SALVADOR DECISIONS |==-==] #

ELS_SalvadoranCoup_CombatTheCombatants: "Combat the Combatants"
ELS_SalvadoranCoup_RestructureThePillars: "Restructure the Pillars"
ELS_SalvadoranCoup_MessUpTheirGame: "Mess Up Their Game"
ELS_SalvadoranCoup_BestToInvestWithInterest: "Best to Invest with Interest"
ELS_SalvadoranCoup_JudgeTheJudges: "Judge the Judges"

# [==-==| [2.5] JAPAN DECISIONS |==-==] #

JAP_SalvadoranCoup_BuildNewORDEN: "Build the New ORDEN"
JAP_SalvadoranCoup_BuildNewORDEN_desc: "§F-------------\nUsing this decision causes our actions to bring forward the §,Day§! §&of§! [ELS.GetFlag] §WReckoning§! at an increasing rate.\n-------------\n§!ORDEN, a paramilitary and intelligence apparatus, run by our foul-mouthed ally, §,General Medrano§! is a key asset for the §,Hispanists§!. Training and arms will ensure it survives the fall of the §WRivera government§!."

JAP_SalvadoranCoup_AlemanistaInsights: "Gather Alemanista Insights"
JAP_SalvadoranCoup_AlemanistaInsights_desc: "§F-------------\nThis decision's power is proportional to §&Castrist§! Dominance.\n-------------\n§!Some prominent §KMexicans§! care far more about yen than would-be Salvadoran revolutionaries. Anything we want to know about the §&Castrists§!, Major Onodera will ask."

JAP_SalvadoranCoup_DirectSales: "Conduct Direct Sales"
JAP_SalvadoranCoup_DirectSales_desc: "§F-------------\nUsing this decision causes our actions to bring forward the §,Day§! §&of§! [ELS.GetFlag] §WReckoning§! at an increasing rate.\n-------------\n§!El Salvador's coffee oligarchs are desperate to defend themselves from marauding peasants. We can undermine their reliance on the §WRivera government§!, and earn a good deal, by selling them surplus arms."

JAP_SalvadoranCoup_RootCoffeeAgency: "Root the Coffee Agency"
JAP_SalvadoranCoup_RootCoffeeAgency_desc: "§F-------------\nUsing this decision reduces the effect of our actions on the §,Day§! §&of§! [ELS.GetFlag] §WReckoning§!.\n-------------\n§!The Coffee Agency, our Latin American intelligence, must make Salvadoran connections. These local go-betweens will increase our efficiency... and hide our presence."

JAP_SalvadoranCoup_AgainstWashingtonStooge: "Against Washington's Stooge"
JAP_SalvadoranCoup_AgainstWashingtonStooge_desc: "§F-------------\nThis decision targets the lower of §WCivilian Anger§! and §WMilitary Preparedness§!, growing more powerful with FBI involvement in El Salvador.\nUsing this decision causes our actions to bring forward the §,Day§! §&of§! [ELS.GetFlag] §WReckoning§! at an increasing rate.\n-------------\n§!Salvadorans are a proud people, and will not stomach an American puppet as their president. So we fund reams of propaganda for the barracks or streets painting Rivera as one."

JAP_SalvadoranCoup_SkilledHawk: "Be the Skilled Hawk"
JAP_SalvadoranCoup_SkilledHawk_desc: "§F-------------\nThis decision resets the effect of our actions on the §,Day§! §&of§! [ELS.GetFlag] §WReckoning§! to zero.\n-------------\n§!§mWashington§! is hypersensitive to our activities in Central America, and cultural affinity lets §KMexico§! and §OIbe§!§nria§! operate more freely in El Salvador. Let's hide our talons... for a time."


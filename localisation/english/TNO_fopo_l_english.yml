# Iberia Decisions
IBR_EC_establish_smokescreen_operations: "Establish Smokescreen Operations"
IBR_EC_establish_smokescreen_operations_desc: "Assasination attempts. Bombings. Pipeline sabotage. A slow-burn infiltration of Caracas. Get DFS and DIGEPOL on the trail of every conceivable threat except a military blitz on the capital."
IBR_EC_reach_out_old_friends: "Reach Out to Old Friends"
IBR_EC_reach_out_old_friends_desc: "Pérez Jiménez, Venezuelan caudillo turned Madrid exile, will only be too happy to tell us which officers are most dissatisfied with the present leftist government."
IBR_EC_call_on_hispanic_sentiments: "Call on Hispanic Sentiments"
IBR_EC_call_on_hispanic_sentiments_desc: "Much of the populace is against the godless leftism now in Caracas, and looks to the Patria as a better model. We will offer it to them - all they need to do is get out of the jeeps' way."
IBR_EC_procurement_in_colombia: "Procurement in Colombia"
IBR_EC_procurement_in_colombia_desc: "La Violencia makes guns and ammo a bargain just across the Venezuelan border."
IBR_EC_bribe_garrison_officers: "Bribe Garrison Officers"
IBR_EC_bribe_garrison_officers_desc: "Most soldiers know Venezuela's government is a threat to the nation. Others can be reminded by bolivar himself. The banknote, not the Liberator."
IBR_EC_cover_our_tracks: "Cover Our Tracks"
IBR_EC_cover_our_tracks_desc: "Make sure we're not followed into the next barracks. And kill the maid that saw us enter into the last one."
IBR_EC_mislead_rival_agencies: "Mislead Rival Agencies"
IBR_EC_mislead_rival_agencies_desc: "The Venezuelans and Mexicans are using our operatives' activities to hunt for the coupists. Let's send them on a wild goose chase near Guyana."
IBR_EC_anti_guerilla_operations: "Anti-Guerrilla Operations"
IBR_EC_anti_guerilla_operations_desc: "An effort to wipe out FALN communists is the perfect excuse for our build-up. Not that we need an excuse."
IBR_EC_from_the_skies: "From the Skies"
IBR_EC_from_the_skies_desc: "Planes let us supply Castro León's forces over the immensely rugged terrain of the Andes. Shame about all the attention they draw."
IBR_EC_fuel_the_monsters: "Fuel the 'Monsters'"
IBR_EC_fuel_the_monsters_desc: "Moncada Vidal and his Bolivarianist radicals are brutal, wild, and loud. As conspiracy turns to coup, give them everything they need to get it done."
IBR_EC_emphasize_hispanic_unity: "Emphasize Hispanic Unity"
IBR_EC_emphasize_hispanic_unity_desc: "Many Venezuelan officers hold deep regard for the overthrow of our illegitimate Republic. As absolute loyalty to Franco was necessary for our victory, absolute loyalty to Castro León is to theirs."
IBR_EC_eradicate_guerillas_en_route: "Eradicate Guerrillas En Route"
IBR_EC_eradicate_guerillas_en_route_desc: "It's a long drive to Caracas, and FALN cells lurk along the way. Put bullets in their heads now, so there's no need to slow down later."
IBR_EC_extract_assets: "Extract Assets"
IBR_EC_extract_assets_desc: "It's all failed. Grab those pesetas and let's get the hell out of here!"

IBR_misleading_rival_agencies_tt: "While this decision is active, we will be unable to take any other decisions."
IBR_misleading_rival_agencies_active_tt: "If §YMisleading Rival Agencies§! is active, we cannot take other decisions."

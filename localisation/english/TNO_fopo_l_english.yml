# Invasion Preparation
MEX_PPI_show_infantry: "§GShow Legion Column Training§!"
MEX_PPI_show_infantry_desc: "The Caribbean Legionnaire is often green, though they are numerous and willing to give all for the cause."
MEX_PPI_hide_infantry: "§RHide Legion Column Training§!"
MEX_PPI_hide_infantry_desc: "The Caribbean Legionnaire is often green, though they are numerous and willing to give all for the cause."
MEX_PPI_show_cuban_forces: "§GShow Cuban Battalion Deployment§!"
MEX_PPI_show_cuban_forces_desc: "Cuban battalions are composed of highly-motivated Cuban veterans of their Revolution."
MEX_PPI_hide_cuban_forces: "§RHide Cuban Battalion Deployment§!"
MEX_PPI_hide_cuban_forces_desc: "Cuban battalions are composed of highly-motivated Cuban veterans of their Revolution."

MEX_PPI_prepare_cuban_intervention: "   Prepare Cuban Intervention"
MEX_PPI_prepare_cuban_intervention_tt: "§FPermits £GFX_decision_icon_small §YRecruitment§! of §YCuban Battalions§!§!"
MEX_PPI_prepare_cuban_intervention_desc: "As our primary ally in the fight against Caribbean Fascism, Cuba has long supported an overthrow of the Trujillo regime. Many revolutionaries and trained soldiers there are chomping at the bit to get at him. Let's not keep them waiting."

MEX_PPI_open_offices: "   Open Legionary Offices in [MEX.GetLegionaryOffice]"
MEX_PPI_open_offices_tt: "§FPermits £GFX_decision_icon_small §YRecruitment§! of §YLegionary Columns§!§!"
MEX_PPI_open_offices_desc: "[MEX.GetLegionaryOfficeDesc]"
PPI_Office_1: "Veracruz"
PPI_Office_2: "Chihuahua"
PPI_Office_3: "the Federal District"
PPI_Office_1_desc: "To build up the Caribbean Legion, we have to recruit, well, Caribbeans. Setting up offices in our major port city is the first step. Then we put out a call for exiles, compatriots, and adventure seekers from all over the Americas."
PPI_Office_2_desc: "There are only so many people in the Caribbean, and only so many ships that go to Veracruz. But if we appeal a little more northwards, we will tap another source of fighting men. Now the Dominican exiles and American mercenaries only need to cross the Rio Grande for fortune and glory."
PPI_Office_3_desc: "It seems our international appeal for a few good men has reached the ears of a domestic audience as well. Our DFS monitor reports a number of Mexicans of leftist and nationalist persuasions have joined as well. So let's bite the bullet and start openly recruiting them too."

MEX_PPI_form_cuban_column: "   Form the [MEX.GetCubanColumnNumber] Cuban Expeditionary Battalion"
MEX_PPI_form_cuban_column_desc: "[MEX.GetCubanColumnNumberDesc]"
PPI_Cuban_Column_1: "1st"
PPI_Cuban_Column_2: "2nd"
PPI_Cuban_Column_1_desc: "Cuba has a number of soldiers that will willingly bring their revolution to the Dominican Republic. Heavily armed, highly trained, and ferocious to no end, this will be the tip of the spear of the invading force."
PPI_Cuban_Column_2_desc: "Castro has said enough of his bearded men have volunteered to go with the expeditionary force that we could easily outfit another unit if we wanted to. And why not? Expanding our elite breakthrough element will give our forces another edge against the Fascist thugs."

MEX_PPI_form_column: "   Form the [MEX.GetColumnNumber] Legionary Column"
MEX_PPI_form_column_tt: "If the initial invasion is successful, the §KLeftists and Nationalists§! will receive an §wopinion§! §yboost§!!"
MEX_PPI_form_column_desc: "[MEX.GetColumnNumberDesc]"
PPI_Column_1: "3rd"
PPI_Column_2: "4th"
PPI_Column_3: "5th"
PPI_Column_1_desc: "Now that plenty of men are present and accounted for in Veracruz, our next step is to actually make them useful. Here's where we hand them guns, drill them, and turn these people into an actual fighting force."
PPI_Column_2_desc: "With Juárez full of soldiers of fortune and dissident exiles, we can put them into another unit of Legionnaires.  Gutiérrez will be happy to know more men will be joining the first wave, but it will make our logistics more complicated."
PPI_Column_3_desc: "The bunch of UNAM communists and street toughs we now have are the basis for our new column. Fortunately now we can have them all where Gutiérrez can keep a close eye on them. Then we sic them on Trujillo and his Iberian friends."

MEX_PPI_training_bases: "   Establish Training Bases in [MEX.GetLegionBase]"
MEX_PPI_training_bases_desc: "[MEX.GetLegionBaseDesc]"
MEX_PPI_training_bases_tt: "Allows the training of an additional brigade."
MEX_PPI_training_bases_yucatan_tt: "([CAL.GetFlag]§YCaribbean Legion§!) Add §YSpecialised Training§! which grants:\nDivision Experience Gain: §G+5.0%§!\nEncirclement Penalty: §G-5.0%§!\nOwn Combat Width: §G-5.0%§!\nHot Acclimatization Gain Factor: §G+15.00%§!"
MEX_PPI_training_bases_holguin_tt: "Modify §YSpecialised Training§! by\nDivision Experience Gain: §G+5.0%§!\nBreakthrough: §G+5.0%§!"
MEX_PPI_training_bases_guantanamo_tt: "Modify §YSpecialised Training§! by\nDivision Experience Gain: §G+5.0%§!\nOwn Combat Width: §G-5.0%§!"
PPI_Base_1: "Yucatán"
PPI_Base_2: "Holguín"
PPI_Base_3: "Guantánamo"
PPI_BaseDesc_1: "The Yucatán peninsula is the closest our country gets to the Dominican Republic. Bases here would allow us to intensively train the Legion in secrecy thanks to its remoteness, and the local geography provides an opportunity to faster acclimatize the troops for the Caribbean humidity, heat, and climate patterns."
PPI_BaseDesc_2: "Holguín in Cuba presents terrain most similar to the Dominican tropical climate, and since the Cuban Revolution the region has been bustling and developing, allowing us to take advantage of the logistical benefits while still have at our disposal plenty of virgin land and hills to simulate a variety of scenarios, including infiltration, airborne, and amphibious landings."
PPI_BaseDesc_3: "Training bases in the Guantánamo region would provide us with an unique opportunity to more closely work with American forces in training. Making use of American infrastructure, we would be able to intensify amphibious exercises while also enabling us to carry out large-scale airborne exercises."

MEX_PPI_train_brigade: "    Train the [GetTrainingColumnNumber] Legionary Column"
MEX_PPI_train_brigade_desc: "[MEX.GetTrainingColumnNumberDesc]"
PPI_Column_1_t_desc: "Now we know just shooting a gun and marching in time isn't going to keep an army alive against the enemy. So we turn up the heat. Extensive and specialized training will keep our men ready, resourceful... and a surprise for Trujillo."
PPI_Column_2_t_desc: "Trigger happy Yankees on their own will not make a Division del Norte. What they need is a cold hard dose of reality of combat. Comandante William Alexander Morgan will make those with actual US military service our leaders. As for the rest, a few weeks of live fire exercises will give them what they need to act tough - not just talk that way."
PPI_Column_3_t_desc: "Ordinarily if a group of leftist types leaves our country we would be happy if they never came back. However it is in our national interest to make sure they stay alive, unhurt, and with their units. So we give them the knowledge and experience they will never get from reading Marxist nonsense."
MEX_PPI_acclimatization_and_guerrilla_training: "    Acclimatization and Guerrilla Training"
MEX_PPI_acclimatization_and_guerrilla_training_tt: "Modify §YSpecialised Training§! by\nDivision Experience Gain: §G+5.0%§!\nEncirclement Penalty: §G-5.0%§!\nOwn Combat Width: §G-5.0%§!\nHot Acclimatization Gain Factor: §G+10.00%§!"
MEX_PPI_acclimatization_and_guerrilla_training_desc: "We are sending a small group of men into uncivilized terrain in order to overthrow a powerful enemy. It is imperative we turn everything that we can to our advantage. Building off of Cuban experiences, the Legion will spend time learning to live off the inhospitable jungle and make maneuverability and surprise their friends."
MEX_PPI_amphibious_training: "    Amphibious Training"
MEX_PPI_amphibious_training_tt: "Modify §YSpecialised Training§! by\nDivision Speed: §G+5.0%§!\nDivision Experience Gain: §G+5.0%§!\nArmy Organization Regain: §G-5.0%§!"
MEX_PPI_amphibious_training_desc: "Let's face it: there's only one way we are getting to the Dominican Republic. So let's give these landlubbers some sea legs! Our Holguín trainees will take an extended cruise with the Cuban navy practicing hitting the beach."
MEX_PPI_airborne_training_1: "    Organise Airborne Forces"
MEX_PPI_airborne_training_1_tt: "Modify §YSpecialised Training§! by\nEncirclement Penalty: §G-5.0%§!\nBreakthrough: §G+5.0%§!"
MEX_PPI_airborne_training_1_desc: "Incorporating light STOL aircraft into our force will offer numerous benefits. We will be able to offer a modicum of resupply for forces in remote areas. We can also form small detachments for scouting and special operations."
MEX_PPI_airborne_training_2: "    Large-Scale Airborne Exercises"
MEX_PPI_airborne_training_2_tt: "Modify §YSpecialised Training§! by\nDivision Experience Gain: §G+5.0%§!\nEncirclement Penalty: §G-5.0%§!\nBreakthrough: §G+5.0%§!"
MEX_PPI_airborne_training_2_desc: "With CIA pilots and American equipment, we aren't just discussing supply drops and small unit operations. Now we can talk about resupply, reinforcement, and dropping formations to seize key objectives. And after a few classes at Leeward Point Field, our men can make this a reality."

MEX_PPI_lease_cuba_air_wings: "Lease Cuba Air Wings"
MEX_PPI_show_supply_decisions: "Show Supply Decisions"
MEX_PPI_hide_supply_decisions: "Hide Supply Decisions"
MEX_PPI_mobilize_resources: "   Mobilize Resources"
MEX_PPI_mobilize_resources_desc: "Sometimes you need to grease the wheels to make them turn. And a warehouse full of stuff not doing anything is really tempting."
MEX_PPI_organize_supplies: "    Organize Supplies"
MEX_PPI_organize_supplies_desc: "Beans, bullets, bandages - if we do not have enough of these, the invasion goes nowhere. Give the word and we'll procure some more for our boys."
MEX_PPI_provide_guns: "    Swell Weapon Stockpiles"
MEX_PPI_provide_guns_desc: "If we have some guns laying around somewhere they would do better work in the hands of the Legionnaires. Doesn't matter if they're Thompsons, Garands, or even Porfiriato-era Arisakas; the gun we have is better than the one we don't."
MEX_PPI_rally_oas_support: "    Rally OAS Support"
MEX_PPI_rally_oas_support_desc: "The Organization of American States may be a tool of Yanqui control over the Americas, but they don't like Trujillo any more than we do. Bringing them into our plan will reap dividends. More than that, it will help assuage the Americans that we want a team effort."
MEX_PPI_unleash_the_dgi: "    Unleash the DGI"
MEX_PPI_unleash_the_dgi_desc: "As fearsome as the DFS is, its primary role is within the field of national security with little capacity for foreign intelligence or special operations. The Cuban Dirección General de Inteligencia, on the other hand, is extremely capable in the field of direct action and more than willing to get their hands dirty. We let them loose, and they will set Ciudad Trujillo ablaze."
MEX_PPI_show_operational_decisions: "Show Operational Decisions"
MEX_PPI_hide_operational_decisions: "Hide Operational Decisions"
MEX_PPI_infiltrate_agents: "    Infiltrate Agents"
MEX_PPI_infiltrate_agents_desc: "False passports, covert diplomatic postings, parachutes, sneaking ashore, or good old fashioned holes in the fence. The more people we have behind the lines, the more we know, and the more we can do."
MEX_PPI_organize_dissidents: "    Organize Dissidents"
MEX_PPI_organize_dissidents_desc: "Trujillo, at long last, has finally gone too far. Men and women all across the Republic are ready to take a stand against the monster. We must prepare them for the next chapter of the Latin American revolutionary struggle."
MEX_PPI_work_with_the_cia: "    Work with the FBI"
MEX_PPI_work_with_the_cia_desc: "Certain American-leaning members of our government have approached us with a proposal. With the FBI working on their own operations to combat Trujillo, would it not make sense to get together on this? There is a lot to be gained by cooperation..."
MEX_PPI_mutually_exclusive_with_redirect_heat_towards_the_cia_tt: "Mutually exclusive with §YRedirect Heat Towards the FBI§!"
MEX_PPI_redirect_heat_towards_the_cia: "    Redirect Heat Towards the FBI"
MEX_PPI_redirect_heat_towards_the_cia_desc: "With the FBI working on their own operation against Trujillo, it may be beneficial if we let them take the fall for our benefit. If the SIM is chasing them, it opens up opportunities for us to exploit. It's just business, and what do the Americans know about Latin America anyway?"
MEX_PPI_mutually_exclusive_with_working_with_the_cia_tt: "Mutually exclusive with §YWork with the FBI§!"
MEX_PPI_bribe_dominican_officials: "    Bribe Dominican Officials"
MEX_PPI_bribe_dominican_officials_desc: "Integrity is a rare commodity in a nation full of men who will not stand between Trujillo and their female family members. But we can offer a stipend for those willing to listen to a higher calling. All they have to do is accept what is coming next..."
MEX_PPI_the_venezuela_connection: "    The Venezuela Connection"
MEX_PPI_the_venezuela_connection_desc: "On the other end of the Caribbean is the nation that has long hated Trujillo as much as anyone else - and with good reason! Venezuela has long been itching to get revenge for the SIM assassination of Betancourt, and we can provide. Bringing them into our little scheme will allow us access to their own window into the black spot of the Americas. Plus, they will also be useful in helping Washington and us get on the same page."
MEX_PPI_connect_with_dissidents: "    Connect Dissidents and Exiles"
MEX_PPI_connect_with_dissidents_desc: "Priests, lawyers, hacienda owners, horse trainers, bandits, garbanzo bean farmers - Mexico knows any man can ascend to revolutionary immortality. Those who detest the monster of Santo Domingo just need to see it in others to feel it in themselves. And when the time comes, they will cry out and strike their blow."
MEX_PPI_cruise_the_caribbean: "    Cruise the Caribbean"
MEX_PPI_cruise_the_caribbean_desc: "Mexico's navy isn't a big one, but it doesn't mean we can't do more with it. Doing a freedom of navigation exercise near the Dominicans will show them we're ready to reach out and touch them. This will hearten the rebels and Americans, but may spook some of the internal forces at work in the regime."
MEX_PPI_coordinate_with_dgi: "    Coordinate with DGI"
MEX_PPI_coordinate_with_dgi_desc: "As our primary foreign intelligence agency in our bloc, we rely on the Cuban Dirección General de Inteligencia to gather information and conduct operations inside the Dominican Republic. Regular meetings with them will allow for an exchange of information and more coordinated operations together."


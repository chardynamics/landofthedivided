TNO_fopo_satw_info: "§YThe cries of war echo again around South America§! - this time on an unseen before scale. §mArgentina§! and §KBrazil§! are going head to head for the fate of the continent, the winner becoming the undoubted hegemon of §YSouth America§!.\n\n§USouth Atlantic War Escalation§! is a measure of how far both sides are willing to go to end this clash of titans. Should it go low enough, §Ga peaceful ending to the conflict may be in sight§! — but as §UEscalation§! increases both sides will gain more powerful options to stop this war and claim a decisive victory. However, go too far and there may not be a §RSouth America to rule over when the dust settles.§!\n\nBoth §mArgentina§! and §KBrazil§! will have to keep their populations' contempt down and their §YWar Exhaustion§! low though, §Rlest their own people force them to admit defeat.§!"

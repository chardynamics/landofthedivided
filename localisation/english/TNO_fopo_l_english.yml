USA_IND_humanitarian_aid: "Deploy US Humanitarian Aid"
USA_IND_humanitarian_aid_desc: "The Indian Civil War has become the largest humanitarian crisis in Asia, and the massive famines that it caused have horrified the world. As international pleas to do something mount, the United States and the OFN shall step up to feed the Republic of India in its hour of need."
USA_IND_start_blockade: "Blockade Azad Hind"
USA_IND_start_blockade_desc: "By cutting off Azad Hind's maritime trade, we can dry up their materiel supply and thus end the war faster. The blockade's effectiveness, however, will be determined by our previous performance in §YMalaya and Madagascar§!."
USA_IND_send_military_advisors: "Send Military Advisors"

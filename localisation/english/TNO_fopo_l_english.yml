## MEX ##
MEX_PPI_desc:0 "The Dominician Republic is the Latin American harbour for the world's most vile ideology, and has made attempts in the past to support various fascist factions in our home. This cannot stand! Together with our allies in America and Cuba, we shall create a multi-national invasion force so that we may crush Mexico's enemies abroad."
MEX_PP_invasion_text:0 "The Legion's current £GFX_PHI_supply_texticon §LSupply§! is §L[?USA.US_PP_supply]/100§!\nThe Invasion's £GFX_PHI_supply_floor_texticon §SMinimum Supply§! is §S[?USA.US_PP_supply_perc]§!"
MEX_PP_mexican_american_cooperation_tt:0 "§KMexican§!-§mAmerican§! cooperation is currently [MEX.GetPPMexican_American_Cooperation]"
MEX_PP_mexican_american_cooperation_ttd:0 "The forces that oppose §LTrujillo§! and the §Lfascist regime§! that rules the Dominican Republic are not from one nation, but several. The relationship between §KMexico§! and the §MUnited States§! will be especially important in working out what will become of the Caribbean's last dictatorship, should it fall."

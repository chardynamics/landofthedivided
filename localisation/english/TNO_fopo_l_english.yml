VEN_selected_city_desc_txt: "[get_ven_city_desc]"

VEN_selected_city_0_desc_key: "Maracaibo is one of Venezuela's biggest prides, the oil city that built an empire of steel and smoke. The lake glitters with rigs and rust alike, its shores lined with refineries. The city's elites still clutch at what power remains, trading favors for barrels. Whoever holds Maracaibo holds the flow of fuel that keeps the nation alive."
VEN_selected_city_1_desc_key: "El Vigía lies nestled between mountains and plains, a humid crossroad of diesel and fog. Trucks move through its streets night and day, hauling supplies across the Andes. Its small airfield is a quiet lifeline, perfect for moving things that shouldn't be seen. This small but key trading hub is one of the arteries that feeds the west."
VEN_selected_city_2_desc_key: "Vega de Aza is a small, quiet town lost in the Andes, little more than a cluster of checkpoints and tired soldiers. Smugglers and travelers pass through, leaving behind rumors, gossip and cash. It's a place where everyone knows when to look away. Perhaps, this might be one of the western border's only reliable gates."
VEN_selected_city_3_desc_key: "The capital city of Táchira, San Cristóbal sits high atop the Andes, a city of trade, contraband, and restless talk. Colombian money flows through its markets, and its people through its streets. The cold air smells of fuel and politics, San Cristóbal may very well be a deciding factor whether the frontier stays open."
VEN_selected_city_4_desc_key: "Guasdualito stretches along the Venezuelan great plains, the Llanos, serving as a key passage between Venezuela and Colombia. Traders, soldiers, and mercenaries cross its bridges every day. The heat never lifts, and neither does the tension. Guasdualito is the roadway through which men and supplies could secure the eastern Llanos."
VEN_selected_city_5_desc_key: "Cabudares grows beside the Barquisimeto metro area, its factories humming with restless workers. Its streets young, growing fast, and filled with restless youth who march once the police look away. At the very heart of Lara, a perfect spark for urban unrest should the country tremble."
VEN_selected_city_6_desc_key: "San Carlos sits alone deep in the Llanos, quiet and steady beneath a blazing sun as the agricultural core and capital city of Cojedes, surrounded by fertile plains and old colonial estates. Convoys refuel here before vanishing into the horizon. As radios go silent, the logistical ghost town will surely keep the army fed."
VEN_selected_city_7_desc_key: "San Felipe rests in a valley characterized by its sugar plantations and silence, its fields swaying under a tired sun. The old landowners, families from colonial times, still whisper in the cafés, waiting to see which flag flies next. Whoever owns the capital city of Yaracuy secures the path to the capital."
VEN_selected_city_8_desc_key: "Puerto Cabello, still scarred by El Porteñazo a few years earlier, lives and dies by its port, a historical major gateway from Venezuela to the Caribbean and the rest of the world. Smugglers, foreign agents, and loyalists all dock here under the same tired cranes. Commanding its harbor means deciding what gets in, and who gets out."
VEN_selected_city_9_desc_key: "Maracay, an industrial and military hub west of Caracas, surrounded by lush valleys and hills. The factories work in shifts that never stop, churning out parts for machines of war. If a conspiracy is to succeed, it must first pass through the gateway to Caracas, among the officers who know which way the wind is blowing."
VEN_selected_city_10_desc_key: "Caracas, the City of Eternal Spring, rises like a mirage surrounded by the mountains, dense and feverish, alive at every hour. Politicians hide in glass towers gleaming above slums while the streets whisper of revolt. Power shifts here by the minute, never truly resting. All roads lead to Caracas, and they end at the palace gates."


# < < < - < < < - < < < | > > > - > > > - > > > #
# < < < - < < < THIRD MOROCCO WAR > > > - > > > #
# < < < - < < < - < < < | > > > - > > > - > > > #

IBR_TMW_desc: "Following unsuccessful incursions into the rebel Moroccan government, Iberian military heads have outlined a clear, decisive plan for reclaiming her most crucial Maghrebian posts. The plan calls for a quick, decisive strike in order to recapture the ports of Melilla and Ceuta and hold off the Moroccan onslaught, and international attention.\n\nAlthough not the main objective, Iberia could seize the rest of the Rif region should the opportunity arise, and give a greater command over the strait. However, such aggressive actions may begin to draw attention to the war and risk further retaliation from the Casablanca government. The war strikes a critical point for Iberia: either a full retreat from the Maghreb or an honorable hold - and possible expansion, of her remaining power."

IBR_The_Shedding_Of_Doubt: "The Shedding of Doubt"
IBR_The_Shedding_Of_Doubt_desc: "We have limited time to complete all of our operations in Morocco, and by the countdown's end, we will have to withdraw from Morocco and make do with what we have gained."

IBR_A_Matter_Of_Pride: "A Matter of Pride"
IBR_A_Matter_Of_Pride_desc: "The enclaves of Ceuta and Melilla are Iberian, and we will not tolerate their illegal Moroccan occupation. It should be in our best interest to secure them as soon as possible."

IBR_The_Pyrrhic_Solution: "The Pyrrhic Solution"
IBR_The_Pyrrhic_Solution_desc: "We have managed to make limited gains in Morocco, notably the enclaves of Ceuta and Melilla. Even though we don't control the Rif, this is an acceptable outcome."

IBR_The_Return_To_1912: "The Return to 1912"
IBR_The_Return_To_1912_desc: "We have managed to secure our previous holdings in Morocco, notably the enclaves of Ceuta and Melilla, along with the Rif. This closely resembles our 1912 borders, making this a more than acceptable outcome."

IBR_TMW_wrapped_up_tt: "We have §Rfinished§! our operations in §YMorocco§!"

# [===================================] #
# [==/==/ VENEZUELAN REVOLUTION /==/==] #
# [===================================] #

VEN_VR_desc: "Our Venezuelan ally nearly fell to a massive offensive by the communist FALN, but maintained their hold with significant force. Now the rebels lick their wounds in the Andes, while mustering their adherents at their bastion of Ciudad Bolivar and traitors within hamlets and universities.\n\nAnother red wave is coming. We must break its crest, or lose Venezuela forever."

USA_meeting_with_generals_VEN_revolution: "Organize A [VEN.GetFlag] [USA.GetFlag] §mJoint§! §SOfficer§! Meeting"
USA_toggle_fortification_decisions_VEN: "Toggle Emergency Fortification Decisions"
USA_emergency_fortifications_VEN: "Build Fortifications in [FROM.GetName]"
USA_incorporate_rural_militias_VEN: "Incorporate Local Militias"

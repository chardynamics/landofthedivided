#solid_frontline: "Consolidated Frontline"
IBR_wac_desc_1: "The foothold of Europe in West Africa is under threat! Under the guise of 'anti-colonialism', the Pan-African Liberation Front - little more than Japanese stooges playing up racial politics - is marching upon our French allies, as well as any fellow Africans who have spurned their home-grown version of imperialism.\n\nIt is our duty - and in our best interests - to stand against nativists and Marxists.\n\nWe have §Rescalated§! the war by §Y[?global.WAC_escalation]%§!.\n\nOur ties with §iFree France§! are at §Y[?IBR_FFR_aid_var]%§!."
IBR_wac_desc_2: "The foothold of Europe in West Africa is under threat! The French and their allies - old friends of ours - are beset on all sides by enemies of freedom. To the west and north: opportunists and the misguided, striking at the French for all manner of petty reasons. To the east: Japan's hypocritical puppets, the Pan-African Liberation Front.\n\nWe have §Rescalated§! the war by §Y[?global.WAC_escalation]%§!.\n\nOur ties with §iFree France§! are at §Y[?IBR_FFR_aid_var]%§!."


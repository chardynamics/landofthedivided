# Mexico Decisions
MEX_EC_coordinate_with_digepol: "Coordinate With DIGEPOL"
MEX_EC_coordinate_with_digepol_desc: "The Venezuelan intelligence service, DIGEPOL, is a whir of activity. Though it'll take us both out of the field, a sit-down meeting in Maracaibo will help weave the threads of the plot together."
MEX_EC_disrupt_compromised_communications: "Disrupt Compromised Communications"
MEX_EC_disrupt_compromised_communications_desc: "Conspiratorial cells are linked by phone and radio - we'll lose valuable intel by intervening, but distant ones will be operating without orders."
MEX_EC_root_out_spies: "Root Out Spies"
MEX_EC_root_out_spies_desc: "Moles in DIGEPOL, Iberians in Valencia, all must be arrested and interrogated if Venezuela is to be safe."
MEX_EC_harness_fidels_reach: "Harness Fidel's Reach"
MEX_EC_harness_fidels_reach_desc: "The Comandante will call Venezuelan peasants, workers, and soldiers to defend their revolution with the vigor and vigilance he has instilled in Havana. The response will be enthusiastic, if untargeted."
MEX_EC_blackmail_potential_dissidents: "Blackmail Potential Dissidents"
MEX_EC_blackmail_potential_dissidents_desc: "Squeezing the usual Perezjimenistas, even if they're not leading this conspiracy, will turn up what they know about it."
MEX_EC_bribe_venezuelan_officials: "Bribe Venezuelan Officials"
MEX_EC_bribe_venezuelan_officials_desc: "Loyalty and patriotism are rare virtures. But greed is a common vice."
MEX_EC_conduct_naval_intelligence_operations: "Conduct Naval Intelligence Operations"
MEX_EC_conduct_naval_intelligence_operations_desc: "The Caribbean's calm waters disguise dark tides. We'll begin a SEMAR operation to search for foreign interference around Venezuela's coasts."
MEX_EC_trace_caribbean_shipments: "Trace Caribbean Shipments"
MEX_EC_trace_caribbean_shipments_desc: "Iberian ships sail off Venezuelan waters, lets follow them to their port of call and investigate."
MEX_EC_penetrate_colombian_arms_market: "Penetrate Colombian Arms Market"
MEX_EC_penetrate_colombian_arms_market_desc: "If we find who's been buying the Colombians' guns with Iberian pesetas, this plot will be laid wide open."
MEX_EC_infiltrate_border_villages: "Infiltrate Border Villages"
MEX_EC_infiltrate_border_villages_desc: "A traitorous army is massing at the Colombian border near Cúcuta, we need to learn everything about it. How to stop it most of all."
MEX_EC_cooperate_with_the_cru: "Cooperate with the CRU"
MEX_EC_cooperate_with_the_cru_desc: "The Colombian Revolutionary Union is not our first choice of partner - but they owe a great deal to Venezuela's government. We'll work with them to determine the nature of this threat."
MEX_EC_trace_border_activity: "Trace Border Activity"
MEX_EC_trace_border_activity_desc: "Venezuela's western border was difficult to guard before La Violencia, now it's havoc. Let's investigate some of the more major crossings."
MEX_EC_support_pinilla_spies: "Support Pinilla's Spies"
MEX_EC_support_pinilla_spies_desc: "General Pinilla is a firm ally of Mexico... but his reach into eastern Colombia where we need assistance is limited by the revolutionaries. Let's help his spies infiltrate."
MEX_EC_intercept_arms_and_supplies: "Intercept Arms and Supplies"
MEX_EC_intercept_arms_and_supplies_desc: "Our sources have news of an arms shipment en route from Bogotá. We'll swoop in to grab the supplies and the plotters waiting for them."
MEX_EC_plot_arrests_with_ocae: "Plot Arrests with OCAE"
MEX_EC_plot_arrests_with_ocae_desc: "We've done it. Now let's bag some Venezuelan traitors and Iberian scum."



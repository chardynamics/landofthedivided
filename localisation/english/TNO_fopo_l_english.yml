IBR_CN_desc_1: "From the heights of El Hatillo to the banks of the Guaire, they speak of Villalba's old foes, the followers of former dictator Pérez Jiménez, slinking in alleyways. Of officers disenchanted with the military's waning influence. Of an opportunity to seize a foothold in the Caribbean.\n\nThese whispers are not yet shouts of anger at the walls of Miraflores. Counterrevolutionary forces are still scattered and weak. But we must use this fleeting moment to build our ties - with dissidents, smugglers, and exiles. So that when Villalba shows weakness, as he inevitably will, they will send him to join his old friend Rómulo Betancourt in hell."
IBR_CN_desc_2: "From the heights of El Hatillo to the banks of the Guaire, they speak of Bolivarianist brutes, skulking in barely concealed rage. Of officers disenchanted with the military's waning influence. Of an opportunity to seize a foothold in the Caribbean.\n\nThese whispers are not yet shouts of anger at the walls of Miraflores. Counterrevolutionary forces are still scattered and weak. But we must use this fleeting moment to build our ties - with dissidents, smugglers, and exiles. So that when Caldera betrays his country, as he inevitably will, they will be ready to plunge the dagger into his back."
MEX_VC_desc_1: "From the heights of El Hatillo to the banks of the Guaire, they speak of Villalba's old foes, the followers of former dictator Pérez Jiménez, slinking in alleyways. Of officers disenchanted with the military's waning influence. Of a threat to the Venezuelan revolution and the Veracruz Pact.\n\nThese whispers are not yet shouts of anger at the walls of Miraflores. Counterrevolutionary forces are still scattered and weak. But the plots of foreign vultures and Villalba's reformist program will give them ample opportunities to metastasize in years to come. We must use the hard lessons taught us by Huerta to scour our ally's streets of infiltrators, reactionaries, and traitors."
MEX_VC_desc_2: "From the heights of El Hatillo to the banks of the Guaire, they speak of Bolivarianist brutes, skulking in barely concealed rage. Of officers disenchanted with the military's waning influence. Of a threat to the Venezuelan revolution and the Veracruz Pact.\n\nThese whispers are not yet shouts of anger at the walls of Miraflores. Counterrevolutionary forces are still scattered and weak. But the plots of foreign vultures and Caldera's ambitions as a peacemaker will agitate warmongers in the years to come. We must use the hard lessons taught us by Huerta to scour our ally's streets of infiltrators, reactionaries, and traitors. Or the rats will gnaw their way into Venezuela's foundations."
caracas_coup_info_tt: "§!As @IBR §OIbe§!§nria§! seeks to entrench its §Gnetwork§! in the §Yfive municipalities§! of Caracas, the beating heart of @VEN §SVenezuela§!, @MEX §KMexico§! looks to aid its @VEN §SVenezuelan§! ally by rooting it out.\n\nTo succeed in its ambitions, @IBR §OIbe§!§nria§! will need to secure §KMilitary Infiltration§! of §Y70.00%§! or more, and either:\n§s-§! §Y25.00%§! §GNetwork Strength§! in all §Ymunicipalities§!\n§s-§! §Y50.00%§! §GNetwork Strength§! in the key §YLibertador Municipality§! and §Y10.00%§! in all other §Ymunicipalities§!.\n\n§KMilitary Infiltration§! and §OPolitical Influence§! passively increase §GNetwork Strength§! in a random §Ymunicipality§! when the 'Time Ticks...' mission completes."

caracas_coup_info_tt_delayed: "§LWhoever comes out victorious in the clandestine power struggle within the nation's capital will ensure the §Gtotal success§! or §Rutter defeat§! of a coup in the §Yfar future§!.§!"


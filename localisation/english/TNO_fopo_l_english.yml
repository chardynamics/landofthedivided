## USA ##
USA_INDCW_desc: "The Indian subcontinent has seen centuries of war against foreign invaders, from Alexander the Great, to the British Empire, to the Japanese fascists. Now a new bloody chapter in India's martial history is written as the Indian Civil War, or War of Reunification, rages between the pro-American Republic of India and the pro-Japanese state of Azad Hind. Any and all peaceful negotiations have failed, and only war can reunite the broken country.\n\nThe ROI is one of the world's largest democracies, and stands to be one of the most important OFN allies by being a major player in Middle Eastern and Asian affairs. Losing India to the Japanese would be a nightmarish fiasco as big to Washington as it was to London all those years ago. But should freedom win over fascism, Japan may never recover from the blow."

pakistan_controls_claims_tt: "Pakistan will take Punjab and Sindh and secure its independence."
pakistan_doesnt_control_claims_trigger_tt: "Pakistan has lost control of its claims."


  TNO_Second_Invasion_Volunteer_anouncement: "New decisions can now be taken to assist the invasion effort. Volunteer Divisions can now be sent as well."
  
  #JAP - PHI Decisions
  JAP_PHI_REC_Oli_1: "We exploited an opportunity to expand our ties with the KALIBAPI Industrialists"
  JAP_PHI_REC_Dem_1: "We exploited an opportunity to expand our ties with the KALIBAPI Parlamentarians"
  JAP_PHI_Completed_Support_the_Loyalist: "We have endorsed the Parlamentarians"
  JAP_PHI_Completed_Support_the_Industrialist: "We have endorsed the Industrialists"
  JAP_PHI_Assist_Reconstruction: "Assist in Reconstruction"
  JAP_PHI_Assist_Reconstruction_desc: "We will directly send aid to the government of the Philippines for reconstruction in many forms, be it material or monetary."
  JAP_PHI_Send_in_Experts: "Send in Experts"
  JAP_PHI_Send_in_Experts_desc: "We will send several experts in economics to help the Republic in its long road to recovery. Their aid is sure to be beneficial to the reconstruction and may even provide us with opportunities to innovate at home."
  JAP_PHI_Exploit_Local_Businesses: "Expand Business Ties"
  JAP_PHI_Exploit_Local_Businesses_desc: "We will assist the government of the Philippines in their reconstruction so long as they'll give our corporations favorable access to their markets."
  JAP_PHI_Promote_Loyal_Democracy: "Promote Filipino Democracy"
  JAP_PHI_Promote_Loyal_Democracy_desc: "We will start campaigns to teach our valiant allies in the Philippines the values of a proper pan-asian democracy. Of course, we will make sure the democracy that takes roots in the Orient Pearl will not stray away from the cause of co-prosperity."
  JAP_PHI_Support_the_Loyalist: "Endorse Quentin Paredes' Campaign"
  JAP_PHI_Support_the_Loyalist_desc: "Mr. Paredes is the erudite kingmaker of the Republic, a champion of Laurelism, he will legitimize the Republic by furthering the reforms of his predecessors. Pan-Asianism will be bolstered by his efforts, as such we will assure his victory."
  JAP_PHI_The_Loyalist_tt: "We will support §gQuintín Paredes§! securing our §RInterests§!"
  JAP_PHI_Support_the_Industrialist: "Endorse Sergio Osmena Jr.'s Campaign"
  JAP_PHI_Support_the_Industrialist_desc: "Mr. Osmena Jr. is known for his technocratic approach to governance and reformist mindset, his ties to Japanese businesses make him by far the candidate most aligned with our interests and thus the one we should ensure wins, by any means necessary."
  JAP_PHI_The_Industrialist_tt: "We will support §gSergio Osmeña Jr.§! securing our §RInterests§!"
  JAP_demobilize_militias: "Demobilize Militias and Constabularies"
  JAP_demobilize_militias_desc: "With the militiamen and constabularies having already done their job, we do not have any more need of them. Keeping them organized is a waste of resources that can be used somewhere else, thus, militias and constabularies that have been ever useful for us during the war shall now be disbanded."
  JAP_dismantle_manila_forts: "Dismantle Manila Forts"
  JAP_dismantle_manila_forts_desc: "The many fortifications in the city of Manila is an unfortunate sight to see. Along with its horrible look, it also hinders the process of reconstruction by taking up space that can be used for more useful buildings or infrastructure. Thus, a demolition and clean-up is in order."
  JAP_emergency_price_fixing_laws: "Emergency Price Fixing Laws"
  JAP_emergency_price_fixing_laws_desc: "The economic situation in the Philippines is at a critical, with the war-torn country struggling to feed and provide the people with their needs as a result of decades of endless war. We must impose emergency price fixing laws to ensure that the people suffer the least, and to ensure that the economic situation does not degrade further."
  JAP_anti_rebel_encirclement_campaigns: "Anti-Rebel Encirclement Campaigns"
  JAP_anti_rebel_encirclement_campaigns_desc: "With our militias on the islands, we will launch numerous campaigns targeted to eliminate rebel holdings within the jungles of the Philippines ourselves. This will aid in reconstruction immensely by eliminating threats to the regime."
  JAP_anti_rebel_encirclement_campaigns_success_tt: "The hunt against the §Rremaining rebels§! in the Philippines §Gsucceeds§!."
  JAP_anti_rebel_encirclement_campaigns_fail_tt: "The hunt against the §Rremaining rebels§! in the Philippines §efails§!."
  JAP_PHI_recon_timeout: "Philippines Reconstruction Deadline"
  JAP_PHI_recon_timeout_tt: "§RThe Philippines dramatically destabilizes...§!"
  JAP_PHI_will_unlock_more_investments_tt: "Will unlock more §GReconstruction Decisions§!."


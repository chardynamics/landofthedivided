USA_IND_start_aid_bill_desc: "We will introduce a bill to Congress to allow future shipments of aid to India, permitting heavier packages in the process. Otherwise, we risk leaving them empty-handed if the situation deteriorates."
USA_IND_aid_bill_submitted_tt: "§YA bill to increase military aid to the Republic of India will be sent to Congress§!"
USA_IND_obq_reaction: "React to Operation Bin Qasim"
USA_IND_obq_reaction_desc: "A Western front has suddenly erupted, with German-backed Muslim militias under a 'Pakistani' flag storming in from Afghan bases on the northwestern frontier, clashing with local police and army reserves. The Pentagon has identified several critical smuggling routes and supply caches that will nip this insurrection in the bud and prevent the Republic from facing the nightmare of a two-front war. Let's hit them, and hit them hard."
USA_IND_operation_big_stick: "Operation Big Stick"
USA_IND_operation_big_stick_desc: "Bose's forces are smashing through the Republic's men on every front, with Japanese arms powering their relentless assault. Some in the Pentagon see worrying comparisons to 1940 - except now, we have a choice to stem the tide. Though it will raise tensions with the other superpowers, we must send men to hold the line."


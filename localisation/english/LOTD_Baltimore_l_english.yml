l_english:
 BAL_Widespread_Discontent: "Widespread Discontent"
 BAL_Widespread_Discontent_desc: "The time is now! After years of unrest, we have managed to push out the Movement occupiers out of Baltimore. To secure independence, we will need fervent support from all walks of life to assist the war effort."

 BAL_Kurt_Schmoke: "Kurt Schmoke"
 POLITICS_KURT_SCHMOKE_DESC: "Schmoke has always been a leader, but this time may be his most consequential yet. As the leader of a Free Baltimore, millions of people lay their trust in him.\n\nHis leadership skills start from his time at Baltimore City College, where he quarterbacked the football team to undefeated and successive championships. While in high school, he helped tutor men in the inner city. While playing football at Yale, he started a daycare center for university workers, and helped dispel a riot during the New Haven Black Panther trials. He later went on to become a Rhodes Scholar and graduated from Harvard Law School.\n\nElected as mayor of Baltimore in a landslide in 1987, Schmoke implemented city programs in housing and education. After the onset of the Second American Civil War, the City of Baltimore assumed a ceremonial role, and Schmoke was forced to indefinitely remain as mayor. Simultaneously balancing Movement control with city functions, Schmoke's position naturally gave him power to coordinate with dissident groups, climaxing into the 2005 Christmas Revolt. It is yet to be seen if Baltimore and Schmoke can keep the Republic alive and well."

 BAL_progressivism_party: "Free Baltimore"

 baltimore.1.t: "Philadelphia Retreats From Baltimore"
 baltimore.1.desc: "It appears that the Baltimore experiment is here to stay. Longstanding discontent with the Movement in Maryland culminated with Christmas protests that haltered the city to a standstill. Clearly unprepared and underequipped, Movement garrisons were pushed out of Baltimore city limits within hours. The Philadelphia Administration has retreated back to Pennslyvania state lines after weeks of intense urban combat. \n\nWhether through pure resolve or whispers of Virginian military assistance, Baltimore, Maryland, and Delaware have been liberated from the Movement. It is yet to be seen what will happen to the fledging republic or the Philadelphia Administration, but after the Wolverine Offensive, the Movement has suffered another major blunder."
 baltimore.1.a: "An American thaw..."

 baltimore.2.t: "Philadelphia Retakes Control of Baltimore"
 baltimore.2.desc: "Just as fast as liberty seemed to light in Baltimore has it been put out. Defeat seemed imminent when Movement forces broke through Baltimore city limits yesterday, and early this morning the yellow and black flag was lowered from Baltimore City Hall. While it may take weeks for the last of urban combat to die down, already columns of Movement garrisons are flooding in from I-83.\n\nThis represents a decisive victory for the Movement, who had successively been dealt defeats and setbacks in battles and territorial control. The establishment wing of the National July 4th Movement under Donald Rumsfeld can breathe a sigh of relief, with Philadelpha secure. And for the whispers of change across the nation, Baltimore has become a martyr for liberty."
 baltimore.2.a: "Nothing ever happens."
 baltimore.1.t: "Philadelphia Retreats From Baltimore"
 baltimore.1.desc: "It appears that the Baltimore experiment is here to stay. Longstanding discontent with the Movement in Maryland culminated with Christmas protests that haltered the city to a standstill. Unable to peacefully disperse the crowd, Movement police violently clashed with protesters, leading many dead and decisively changing public opinion. Simultaneously across Maryland and Delaware, popular uprisings seized control of key cities and buildings, taking advantage of stretched Movement resources. Clearly unprepared and underequipped, Movement garrisons were pushed out of Baltimore city limits within hours. The fighting continued to be successful for the insurrectionists, who have consolidated under Kurt Schmoke. The Philadelphia Administration has retreated back to Pennslyvania state lines after weeks of intense urban combat. With its forces routed, the Administration has been forced to focus on defending more closely out of Philadelphia.\n\nWhether through pure resolve or whispers of Virginian military assistance, Baltimore, Maryland, and Delaware have been liberated from the Movement. It is yet to be seen what will happen to the fledging republic or the Philadelphia Administration, but after the Wolverine Offensive, the Movement has suffered another major blunder."
 baltimore.1.a: "An American thaw..."
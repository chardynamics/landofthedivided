l_english:
 PHI_Donald_Rumsfeld: "Donald Rumsfeld"
 POLITICS_DONALD_RUMSFELD_DESC: "Donald Rumsfeld is no stranger to American politics, but he now rules as a perpetrator of its downfall. How did a Navy aviator, US House Rep, and Secretary of Defense get here?\n\nAs a Navy aviator, Rumsfeld saw firsthand the failure of containment, when the North Koreans and Chinese overran American lines, only barely managing a South Korean rump state in Gwangju under threat of nukes. But no matter, Rumsfeld would be elected to represent Illinois's 13th district in 1962 to strengthen American resolve... to yet again a failure of US force in Cuba. Raising troop deployments, the failure of 'Latinization', and the fall of Habana in 1969, all while in the House.\n\nWhat about directly in the world? Under Nixon's administration, he served as Ambassador to NATO, where he tried to strengthen faltering European faith in America. But his most pivotal stretch would be his 1 year tenure as the youngest Secretary of Defense under Gerald R. Ford. While shortlived, he had access to the problem itself. America was not too weak to win abroad; institutionally, the vision and drive was missing. For the next 3 decades, Rumsfeld held mostly to private world, witnessing from aside America's world prestige slowly dropping. That all changed with Operation Tea Party. While conceding the ideological lead to Buchanan, Rumsfeld would have serious power in working with the military and the establishment to ensure America recorrected back to the right path.\n\nThe forecasts quickly changed. What seemed like an assured operation quickly went ary: missing government and military defections, Congress fleeing to Chicago, and Buchanan's coalition with troubling extremist groups. After Buchanan's failed Wolverine Charge, Rumsfeld had enough and launched the Establishment's Rebellion in 2003. However, not even that fully succeeded, as Virginia broke allegiance and allowed Buchanan to flee. Now, Rumsfeld has to pick up the pieces and start anew."
 
 PHI_The_Diverging_Movement: "Diverging Movement - Level 3"
 PHI_The_Diverging_Movement_desc: "It has long been since 1996, and the prime years of the Movement have long passed. At one point comprising half of the nation's territory during the Second American Civil War, we have been on the back foot since then. Momentum seems to continually bet against us, with state governments betraying away or decisive encirclements of our forces. Add the differing ideological forces within the Movement, and we currently lay as a carcass, slowly being picked off by vultures. If we want to realize the vision of a unified America, we will first need to strengthen within ourselves."
 PHI_Aftermath_Of_The_Wolverine: "Aftermath of the Wolverine"
 PHI_Aftermath_Of_The_Wolverine_desc: "While on paper we maintain one of the strongest professional forces in the United States, it has been years since our armed forces have had success on the battlefield. Although we managed a pyrrhic victory against Federal forces in Michigan, we have slowly been forced to retreat eastward. As our focus has been on consolidating control in Philadelphia, the armed forces have been largely forgotten, with continually decreasing funds and a lack of purpose."
 PHI_The_American_Malaise: "American Malaise"
 PHI_The_American_Malaise_desc: "Ever since the Establishment's Rebellion in 2003, Philadelphia has been in administrative gridlock. Donald Rumsfeld's political purges have been necessary to cleanse the institutional waste that Pat Buchanan permitted, but it has also slowed economic progress achieved post-Civil War. So far though, there doesn't seem to be a stomach to muscle up to the problems, as the establishment continues to consolidate control."
 PHI_The_Southern_Problem: "The Southern Problem"
 PHI_The_Southern_Problem_desc: "It appears that the unrest in Baltimore has come to a head. A large, concerted revolt has taken over major parts of Maryland and Baltimore does not look like it's going to stop. Especially with rumors of Virginian military assistance to destabilize our rule, it is pertinent that this rebellious force be put down."


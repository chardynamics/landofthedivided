  # Leader Descriptions
  POLITICS_COL_ROBERTO_URDANETA_DESC: "Born on June 27, 1890, Roberto Urdaneta Arbeláez is perhaps the perfect example of the modern, well-connected aristocrat. The son of a general and a descendant of one of the original criollo liberators, Urdaneta was already a member of congress for the Conservatives at the age of 26. In 1917, he married into the prestigious Holguín family, further entrenching himself within the very pinnacle of Colombian society.\n\nA man of strict self-discipline and impeccable manners, Urdaneta was appointed foreign minister in 1931, and was crucial in ending the conflict with Peru, where he would later become ambassador. During this time, he would reconcile with Laureano Gómez, his adversary within the PCC and alumnus of the St. Bartholomew school in Bogotá, over their share anti-communism and absolutist ambitions. In time, he would become the closest "the Basilisk" had to a real friend.\n\nTheir fates seemed intertwined until the latter's death during the Civil War. Yet it seems Urdaneta continued to uphold his vision even after the fact. Continuing the violent crackdowns that tore apart the party, signing a truce without honors that broke the Army's allegiance, attempting to pass a totalitarian constitution... How tragic that the vision he upholds is one countless failures."
  POLITICS_COL_ROBERTO_URDANETA_TWO_DESC: "Born on June 27, 1890, Roberto Urdaneta Arbeláez is perhaps the perfect example of the modern, well-connected aristocrat. The son of a general and a descendant of one of the original criollo liberators, Urdaneta was already a member of congress for the Conservatives at the age of 26. In 1917, he married into the prestigious Holguín family, further entrenching himself within the very pinnacle of Colombian society.\n\nA man of strict self-discipline and impeccable manners, Urdaneta was appointed foreign minister in 1931, and was crucial in ending the conflict with Peru, where he would later become ambassador. During this time, he would reconcile with Laureano Gómez, his adversary within the PCC and alumnus of the St. Bartholomew school in Bogotá, over their shared anti-communism and absolutist ambitions. In time, he would become the closest "the Basilisk" had to a real friend.\n\nWith the Corporatist Constitution now passed and the military pacified, their shared vision has been forever enshrined. Yet that does not suffice, to truly reform the PCC into the leviathan they both dreamed, many more sleepless nights would be required. Not just for him, but for entire country."
  POLITICS_COL_ALVARO_GOMEZ_DESC: "Born on May 8, 1919 and son to the infamous Laureano Gómez, Álvaro's followed his father's footsteps in many respects, leading the party's newspaper and bearing witness to all his deeds.\n\nDespite his early fascination with Franco and Hitler, the young Gómez has grown into the voice of a new generation of Conservatives: acknowledging the faults in the system his father established, yet aware that tearing it down will only result in further chaos. His pragmatic stance allowed him to curry favor with the old guard, while ushering for the Colombian people a clean slate with his soft voice, convincing rhetoric, and signature smile.\n\nAs part of his reforms, the heir of the Basilisk wishes to depart the PCC from its characteristic corruption and erase the image of a party above the very laws it writes. At the same time, he seeks to promote a business-friendly environment to restore the country's economy, in spite of stepping back on relations with the Pakt.\n\nIn truth, many of his plans seem contradictory to his father's legacy. In fact, they would appear outlandish, were it not the sea of troubles the party finds itself in. One can only hope that after decades of so-called "Dog Discipline", the PCC can still be taught new tricks."

  POLITICS_COL_GUSTAVO_ROJAS_PINILLA_DESC: "Born to a middle-class family in Tunja on March 12, 1900, Pinilla, affectionately referred to as "Gurropin", advanced rapidly through the ranks of the Colombian army, as well as studying civil engineering in the United States. Rojas's long military career, including stints as attaché to both Germany and the USA, as well as being the intellect behind El Dorado Airport, would land him the position of Supreme Commander of the Armed Forces.\n\nLa Violencia proved that the position was less an honor and more of a burden. Political meddling and squabbles within the PCC foiled his attempts to restore order to the countryside and stained his triumph in retaking Bogotá. He would receive all of the blame for every failure and none of the laurels. The final stain being the insulting truce signed by Urdaneta which conceded more than a third of the country to the insurgents.\n\nWith the PCC now ousted and the FN fleeing the country, Pinilla is the undisputed master of Colombia. In his wisdom, he does not rule alone. With a War Council composed of Colombia's finest generals, industrialists and technocrats, the Caesar of the Andes has sworn to undo all the mistakes of his predecessors. Woe to those who stand in his way."

  POLITICS_COL_LLERAS_CAMARGO: "In spite of his illustrious surname, Alberto Lleras Camargo was born to a humble family. Yet with the aid of his caring uncles, Lleras cultivated an interest in the written word and succeeded in followed the footsteps of his family's grand liberal eminences, become a journalist for Colombia's leading newspapers. As a correspondent in Europe, he gained the trust of Alfonso López Pumarejo, who would later catapult Camargo into politics by calling upon him to serve in his government, first as foreign minister, and, upon recognition of his merits, as Minister of Government.\n\nA committed democrat, Camargo has long been interested in increased dialogue and cooperation between the liberals and the conservatives in order to prevent polarization and radicalization. However, this willingness brought doom to his party, as his support for the moderate Gabriel Turbay instead of Gaitán led to a split in the 1946 liberal vote and a conservative victory. Gaitán's murder and Turbay's impeachment in '55 widened the split into a chasm that tore the party in half.\n\nThe chaos of La Violencia made him a more experienced man, one worthy of his nickname, El Monarco, yet one that still affords to dream. The same dream he bore since the 50s, to free the country. To free it from political turmoil, from rampant inequality and discrimination and from the reign of Caudillos. Now as President, he finally has the means to turn that dream into reality."
  POLITICS_COL_LLERAS_RESTREPO: "Born in a small house in Bogotá on April 12, 1908, Carlos Lleras Restrepo comes from the poorer branch of the Lleras family, offering him more experience with the daily hardships Colombians experience than most establishment politicians. This familiarity has determined him to champion comprehensive reform plans for the country's ailing structures, placing him on the leftmost wing of the loyalist Liberals.\n\nAfter graduating from law school, the stubborn Lleras realized that he would not be able to take on another degree at a privileged university, and so instead became a self-taught economist. His first forays into politics came shortly after in Bogotá liberal scene, where he quickly made a name for himself as a talented firebrand.\n\nHis reputation as the inheritor of Gaitán's cause within the party permitted him to earn a tenure in the country's highest office. Yet Lleras is not prepared to let this new vantage point cloud his view. He seeks a national transformation, guided by heavy state intervention and protection of local industries. One that will bring forth a resurgence of beloved homeland."
  POLITICS_COL_HERNANDO_DURAN_DUSSAN: "From the wave of Colombian bourgeois tenacity arose a hide-bound warrior named Hernando Durán Dussán, an oddity as both a vanguard of reform and scion of the status quo. Coming from a middle-class household with an aspiration for prosperity as any others, his birth on June 17, 1908, during a time of abject poverty, has shaped his views since adolescence into a staunch vision of liberalism. He was made a man no more tolerant of deviations from the true vision of free-market economics than the grim determination of those wishing to destroy its ways.\n\nThe Conservatives think the Liberals have softened through the turmoil, yet Durán Dussán has never been dull. He'd seen through his old foes' tricks long ago, and using the fair hands of the judiciary, he never did become hesitant to hit back wherever it shall incapacitate the serpents the most.\n\nA few called him dictatorial, oxymoronically, yet his reputation as the Liberal Party's "iron fist" has certainly been well-earned. Taking fascism, imperialism, and all other forms of reaction, far or near, as injuries to his honor, here stands alone an old-world knight fighting for new-age morality, a modern Cincinnatus who must carry his broken nation out of decades of deterioration."
  POLITICS_COL_ELIAS_GARCIA: "From a family of well-off settlers, his father a frontiersman who founded a town in the Cauca Valley, Elías Salazar García was born in 1919 and raised around the municipality of Santa Rosa de Cabal, where he'd learned himself a boldly intelligent, yet never belligerent, mannerism. Before La Violencia, Salazar García was a notable labor organizer in Cali, much to many business owners' dismay, though trusted by President Gaitán, the workers, and most importantly, Lieutenant General Pinilla.\n\nStill, no one expected an occasional agitator like Salazar García to earn himself such a meteoric rise, and neither did most recall how he managed to make it so far. But one thing is for certain: he was never one for conformism. Although popular around the lower class, his ideological view of "Authentic Socialism" is neither the old Red ideals nor a fascistic descendent of National Socialism — instead it serves as a bridge between laborist policies and social conservatism, most delicately combined with a staunch sense of nationalism.\n\nSome call him a demagogue, and others call him a madman. But in truth, his true intention now as Colombia's steer master is best summarized in his own words: "In the economic aspects, we are eminently socialist, but in the social aspect we are paternalists.""


  POLITICS_COL_LEON_VALENCIA: "It seems fitting that one of the men who played a key role in the campaign that brought down Pinilla is now the President of a new democratic Colombia and the leader of a new kind of conservatism.\n\nGuillermo León Valencia was born in the bosom of a wealthy family from the city of Popoyán, being the son of the prestigious poet Guillermo Valencia Castillo. From an early age he showed interest in the human sciences, in subjects such as philosophy, history and the grammar of the Spanish language. He quickly joined the Conservative Party and began his career in politics, becoming with time one of the most important conservative leaders, standing out as a moderate in a party which had increasingly become more pro-fascist and authoritarian.\n\nHaving watched the developments of the least years, León Valencia has come to a conclusion about what he shall do during his presidency to heal the country after all these years of violence. The old conservative political doctrines were wrong, and he will make amends for their mistakes. God commands that stability and order must be brought to Colombia, and to do that he needs to work with the Liberal Party, building bridges with them to overcome years of hatred between liberals and conservatives."

  ## Conservatives ##
  CLC_Shoulders_of_Giants: "On the Shoulders of a Giant"
  CLC_Shoulders_of_Giants_desc: "To understand the reasons why Colombia burns, one must look to three souls whose legacy is the violence that now unfolds.\n\nWhile elsewhere in the nation, the assassination of Gaitán is mourned, in New Granada a requiem for a different man. Mariano Ospina Pérez, grand eminence of Conservatism, proud stalwart against the false promises of Laureanism. A man slain, hanged in the Capital's square by a mob whom the Duce and his compatriots yet claim to have its thirst for blood unsatiated.\n\nAn amusing coincidence then, in spite of their differences, a common chant unites Conservatives, Liberals and Socialists. Death to the lackeys of the false prophet Laureano Goméz. Death to their far-off backers in Germania and Madrid. Death to the old order.\n\nVeritias Vincit."

  CLC_Reactionary_Den: "Reactionary Den"
  CLC_Reactionary_Den_desc: "For all the talk about the regime of New Granada being against the degeneracy and chaos of the liberal and Marxist order, the truth is that it Alzate Avedaño's project is nothing more than a den of fascists, reactionaries, spies, mercenaries, arms dealers and other outlaws or lowlifes from across the world that have nowhere else to go.\n\nWhile this has lowered New Granada's political stability to a less than ideal value, it has its benefits. Sustaining and funding the war effort and other activities comes as fairly cheap, and the international connections built by the criminal networks gives the state plenty of opportunities to exploit."

  CLC_Saints_Sinners: "A War of Saints and Sinners"
  CLC_Saints_Sinners_desc: "The radicalization brought on by La Violencia has carved a great divide within Colombian society. While many wars can claim to be brother against brother, few come close to the radicalization and dehumanization that has been plaguing Colombian society since the mid 50s. The sheer vehement for those they fight and the ignorance towards their own champion's crimes has reached a level where the war itself can be likened to one of Saints and Sinners.\n\nPillaging, banditry and murder are a common and ignored sight on every front. Yet regardless of the contender observed, a common element within the narrative remains, the war that ravages this country will be one fought to the death."

  #New 
  CLC_Party_Oedipus_Tyrannus: "Oedipus Tyrannus"
  CLC_Party_Oedipus_Tyrannus_desc: "At the heart of New Granada lies the colossus known as the ANP. An electoral coalition formed in '48, it has grown to become the sole political power within a quarter of Colombia, with influences extending far beyond. Under the banners of the emblematic party of the far-right rally all from Christian Democrats to unrepentant Fascists, united by by a lust for power and nationalist fervor.\n\nLike the mythical Oedipus, the ANP is on a quest to free its homeland and rid it of its worst enemies, in utter ignorance of the fact said enemy is, in the eyes of much of Colombia, itself."

  CLC_Land_of_Blood_Coffee: "A Land of Blood and Coffee"
  CLC_Land_of_Blood_Coffee_desc: "New Granada rules over the most fertile grounds in all Colombia, the rich lands of the Cauca Valley. Across the department lie many sorghum, cotton and most famously, sugarcane plantations, which have been joined by a growing Coffee Industry in the north, centered around Armenia.\n\nThe abundance of this wealth was only truly revealed after the truce, for New Granada's reversal of all land reforms laws and strong funding of the now growing landlord caster has ensured unprecedented productivity for the Economic Boom, even if it comes an unprecedented cost in human lives."
  CLC_Land_of_Blood_Coffee_2: "A Land of Blood and Coffee"
  CLC_Land_of_Blood_Coffee_2_desc: "New Granada rules over the most fertile grounds in all Colombia, the rich lands of the Cauca Valley. Across the department lie many sorghum, cotton and most famously, sugarcane plantations, which have been joined by a growing Coffee Industry in the north, centered around Armenia.\n\nThe abundance of this wealth was only truly revealed after the truce, for New Granda's reversal of all land reforms laws and strong funding of the now growing landlord caster has ensured unprecedented productivity for the Economic Boom, even if it comes an unprecedented cost in human lives."
  CLC_agri_tt: "§RWe will not be able to improve our Agricultural Development unless this situation changes.§!"

  CLC_Promise_of_Palmaseca: "The Promise of Palmaseca"
  CLC_Promise_of_Palmaseca_desc: "The Civil War proved quite fruitful for the growing industrial heart of Cali, whose flames were being choked out by its Antioquian and Bogotan brothers. The split of the rich Cauca Valley and its surrounding departments ensured all productivity was reoriented inwards, building itself up instead of aiding distant and poverty-stricken regions, providing the conditions for an economic boom after the truce.\n\nThe crowning achievement of this golden age is Palmaseca IPZ, a massive industrial complex which acts as the heart of Neograndine production, with factories producing everything the state may require according to the SEC, the entity responsible for its creation. Whose promise to bring this level of growth to all of Colombia proves more than enticing."

  CLC_Birds_of_Prey_A: "Bird of Prey - Carrion and Nothing Else"
  CLC_Birds_of_Prey_A_desc: "The Neogranadine Army is undeniably where the state has drawn the shortest stick. Composed in large part of far-right paramilitary groups of dubious training yet undeniable ferocity, the few division elements that exist are composed of rear-guard Third Division and veterans of the Fifth. In true, New Granada's existence into the 60s is more dependent on a lack of enemy organization than real combat prowess.\n\nWith several failed army reforms behind them, the forces of New Granada can rather aptly be described as a rabble, forced to rely on imported firepower and what few skilled commanders exist to even the odds. Yet all commanders hope the situation will change by the time the war starts once more."
  CLC_Birds_of_Prey_B: "Bird of Prey - Untamed Raptors"
  CLC_Birds_of_Prey_B_desc: "Several attempts had been made to reform the Neogranadine army during the course of the ongoing 'La Violencia.' These all failed until Commander of the Army, César Augusto Cuellar Velandia, took things into his own hands, passing targeted reforms to turn mere militias into proper fighting forces.\n\nThe Pajaros and their assorted paramilitary and militia hangers-on have received training and doctrinal guidance from Italian attachés. Meanwhile, the regular army has imported arms from Tokyo and received significant recruitment that has expanded it beyond the core of Fifth Division veterans, thereby strengthening the Neogranadine armed forces. Despite these improvements, however, command and control from Cali remains quite weak, forcing New Granada to rely on commanders' initiative in the field."
  CLC_Birds_of_Prey_C: "Bird of Prey - The Andean Condor"
  CLC_Birds_of_Prey_C_desc: "Several attempts had been made to reform the Neogranadine army during the course of the ongoing 'La Violencia.' These all failed until Commander of the Army, César Augusto Cuellar Velandia, arrived and took things into his own hands, passing targeted reforms to turn mere militias into proper fighting forces. Once a source of disappointment, the Neograndine Army now becomes the Duce's pride.\n\nThe Pajaros and their assorted paramilitary and militia hangers-on kepttheir ferocity, but tempered it with discipline from the finest Italian officers. The army's ranks have grown, and imported arms go hand-in-hand with bullets from domestic ANDI factories. Most decisive, however, is the complete command-and-control from their capital of Cali, improving coordination among their forces to new heights."

  #Proxy
  CLC_Japanese_Support_dynmod: "Japanese Support"
  CLC_Japanese_Support_dynmod_desc: "Though nominally secondary to the aid offered to the rogue state by Italy, the Empire of Japan has increased the commitments in the region as the conflict flared in a show of force.\n\nMilitary and civilian cadres alike now work to demonstrate the value offered by Sphere Expertise to the Americas. If it earns the Co-Prosperity Sphere an ally in the region, all the better."


  # Leader Descriptions
  POLITICS_GUADALUPE_SALCEDO_UNDA_DESC: "Despite a wish for stronger institutions, Latin Americans cannot help but admire the romantic guerrilla leader. The old revere Bolívar and Sandino, the youths and intellectuals salute Fidel Castro, and the communists hail Che Guevara. For many Colombians, hope is embodied in their very own Capitán Salcedo.\n\nBorn in an Arauca cattle village to a Liberal family, Salcedo like many country boys was imprisoned for cattle theft. Upon release he was swept up in celebration - Dr. Gaitán, the campesinos' hero, had become President. Gáitan created a paradise for the long-suffering campesinos, taught them the power of direct democracy, and kept the fascists who threatened their traditions at bay. To Salcedo and many others like him, Gáitan was the warm and kindly sun in the sky- and when Gáitan was murdered, an eclipse had descended upon Colombia as the Blackshirts marched. A talented horseman, Salcedo rallied the surrounding villages together and expelled the fascists with his daring guerrilla attacks.\n\nNow the Supreme Commander of the Revolutionary Armed Forces of the Eastern Plains, Salcedo has sworn before his hero's portrait to fight for his menaced ideals, to defend the poor and oppressed and wretched. He sees himself as the modern General Rondón, commanding the cavalry into patriotic salvation, and the utter defeat of the fascist oligarchs who want to rob Colombia of its independence. Gaitán told the people to charge forwards to victory, and Salcedo will lead their charge."
  POLITICS_CLL_GILBERTO_VIEIRA_WHITE_DESC: "When the broader world mentions Latin American caudillos, few have in mind the quiet and considerate general secretary of the Colombian Communist Party, especially not as a judicious teacher convening his wisdom to willing disciples. Shaping the landscape of labor politics since he founded the Communist Party 15 years ago, some may say the laid-back Gilberto Vieira White is moreso shaped by his career than he'd shaped it, a man only made full by his decade-spanning works.\n\nBorn in 1911 to a family of declining aristocracy, Vieira White led a childhood defined by intense isolation, which had partly shaped his intimate desire to self-educate throughout much of his life. As an avid reader of Occidental classics and modern literature, his learnings eventually led him during his teenage years to the likes of Neruda, Miguel Hernández, Rafael Alberti, and the many ideologues of the Spanish Republic — and as much as he was inspired by their war against fascism, it is during La Violencia that he has made them intimate lessons.\n\nKnowing fascism as a creeping corruption, Vieira White made the pragmatic choice of stalling the communist struggle for the sake of collaborating with the more progressive parties of the MRL and the FUP. But in his heart, like every reasonable revolutionary that had ever been, beyond his patient façade, he still knows his place as a Red vanguard, hoping one day to bring about a truly socialist Colombia."
  POLITICS_CLL_NICOLAS_BUENAVENTURA_DESC: "A proper, courteous intellectual is atypical for the torchbearer of the radical wing of a Communist Party. Yet, Nicolás Buenaventura has become a shepherd for the proletarian masses — a gentleman revolutionary who is wise yet authentic, measured yet rebellious.\n\nGiven a comfortable start to his storied life on November 25th, 1919, Buenaventura came from a household of well-to-do scholars and artisans, and this environment most certainly fostered a free-spirited intellectualism and democratic ideals. Following a dispute with his father, he joined the Communist Party as the Conservatives took the reins in the 1930s. As he became enamoured by Lenin's theories, synthesizing with his own beliefs, he gradually created the idea of a "left democracy" — where organization takes form in mass action, regardless of its name.\n\nSoon enough, his role as a "teacher" extended beyond the locality of Cali and began seeding across the entire party. Yet as the Second World War ended, the dream for a Socialist Republic first dissipated, only to return as a mockery following La Violencia. The Communist movement failed, plunging into opportunism and decadence, as Vieira White enjoyed "Cocktail Communism".\n\nThe same fervor that pushed him to join the united front as Cali burned urged him to challenge this nadir. A gambit that paid off, for the plenum welcomed him with wide applause, as did the opposition, lured by his promise of democratization. The road to a better tomorrow will be arduous, but Buenaventura will not rest until Colombia turns into a safe port and a beacon inspiring all of South America."
  POLITICS_CLL_ANTONIO_GARCIA_NOSSA_1_DESC: "Born April 16th 1912 to a Spanish Immigrant worker and his housewife bride, Antonio García Nossa endured a childhood of poverty. The second of seven siblings, he lived in a household straining to provide despite the economic boom of the late 1910s, resenting the conditions thrust upon himself and all those around him.\n\nHis fierce mind earned him a University place in 1930, in the midst of economic depression, where he frequently clashed with the Conservative ethos of the institution around him. Taught in Law, Politics and History he immersed himself also in the rising ideas of the age. Socialism, egalitarianism and indigenism were sparks for the young man igniting an unquenchable fire.\n\nGaitán would provide Antonio his calling, his mind leading him to become a signature lieutenant instrumental in the creation of Plan Gaitán in 1947. His mentor's death and La Violencia forced Nossa into the East, where he continued to be a unifier for the forces of Socialism until the Havana Peace Agreements led him both back to the Republic and, now, its highest office. With Gaitanismo again ascendent and the bandit Michelsen finally ousted from power, Antonio knows that Colombia's long night is waning. Soon, all may bask in the coming golden dawn."
  POLITICS_CLL_ANTONIO_GARCIA_NOSSA_2_DESC: "Born April 16th 1912 to a Spanish Immigrant worker and his housewife bride, Antonio García Nossa endured a childhood of poverty. The second of seven siblings, he lived in a household straining to provide despite the economic boom of the late 1910s, resenting the conditions thrust upon himself and all those around him.\n\nHis fierce mind earned him a University place in 1930, in the midst of economic depression, where he frequently clashed with the Conservative ethos of the institution around him. Taught in Law, Politics and History he immersed himself also in the rising ideas of the age. Socialism, egalitarianism and indigenism were sparks for the young man igniting an unquenchable fire.\n\nGaitán would provide Antonio his calling, his mind leading him to become a signature lieutenant instrumental in the creation of Plan Gaitán in 1947. His mentor's death and La Violencia forced Nossa into the East, where he continued to be a unifier for the forces of Socialism until the Havana Peace Agreements led him both back to the Republic and, now, its highest office. With the return of Gaitanismo and the second rebuttal of Michelsen, Antonio knows Colombian democracy can continue to be nurtured and the nation healed in peace."
  POLITICS_CLL_ALFONSO_MICHELSEN_DESC: "It is often said that every rule has an exception. As a rule, the traditional upper class of Colombia have been Conservative and firmly protective of themselves, Alfonso López Michelsen is the exception, to the former part at least.\n\nBorn June 30th 1913, he entered the echelons of the upper class as the son of former president López Pumarejo, one of Colombia's most prominent Liberals and father to the Marching Revolution. The trappings of splendid youth saw a hungry mind evolve into hungry ambition, the young Alfonso entering politics at just 25 as a member of the Council of Engativá.\n\nSeeing a ruling class mired in complacency and inequality, he would join Álvaro Uribe Rueda in supporting Gaitán's presidential bid, earning a short-lived cabinet position as Foreign Minister. Quickly departing, he stayed close to the movement and, at the outbreak of La Violencia, joined forces with those opposed to the Conservative tradition of Colombia in their Eastern exile.\n\nWhile his deeds since could hardly be disputed, the motivation behind them was always the source of many rumors. With a family reputation of wheeling and dealing, even behind the reforms, many saw Michelsen's eagerness and resolve to become the face of the Gaitanist movement as a plot for power and his desire to moderate the movement and promote negotiations with the liberals which abandonned them to be a betrayal of their promise revolution.\n\nNow as the first President of a new left-leaning Republic as result of controversial election, marred by fraud and intimidation, one could say his critics have been vindicated. In spite of that, those closest to him would claim it all to have been necessary to protect the Republic, the only is whose Republic?"
  POLITICS_CLL_ALFONSO_MICHELSEN_DESP_DESC: "It is often said that every rule has an exception. As a rule, the traditional upper class of Colombia have been Conservative and firmly protective of themselves, if the saying is true, Colombians have yet to see.\n\nBorn June 30th 1913, he entered the echelons of the upper class as the son of former president López Pumarejo, one of Colombia's most prominent Liberals and father to the Marching Revolution. The trappings of splendid youth saw a hungry mind evolve into hungry ambition, the young Alfonso entering politics at just 25 as a member of the Council of Engativá.\n\nSeeing a ruling class mired in complacency and inequality, he would join Álvaro Uribe Rueda in supporting Gaitán's presidential bid, earning a short-lived cabinet position as Foreign Minister. Quickly departing, he stayed close to the movement and, at the outbreak of La Violencia, joined forces with those opposed to the Conservative tradition of Colombia in their Eastern exile.\n\nSince then, his deeds have been widely disputed, alongside the motivation behind them. Now is there nothing left to dispute. His family reputation of wheeling and dealing has been proven to extend to Alfonso, his lust for power has proven greater than his love for democracy or the old Caudillo and his friendship with the military ensures the status quo, a dream deferred, will hold for as long as its people don't dare hope for more.\n\nColombia's revolution and its fledgling overtures to democracy were smothered in their crib, the Caudillo's legacy has been stained by the blood spilled by its inheritor, the nation festers akin to an infected wound and the old question has been answered. Long live the new Liberal Hegemony in its hues of red and woe to the dreamers."
  POLITICS_CLL_CAMILLO_TORRES_RESTREPO_DESC: "It is perhaps hard to think of Christianity as anything but the edifice of the establishment; from the Emperor Constantine, to the conquistadors of Hernán Cortés, those who come with the sword in their right hand have often come bearing the cross in their left. Few identify the Christian creed as being antithetical to course that world history has hitherto taken, fewer still identify with the notion of Christ as a quintessentially revolutionary figure.\n\nBorn February 3rd, 1929, Camillo Torres Restrepo had the luck to be a scion to one of Bogotá's bourgeois cruft. Raised in the mould of Colombia's liberal partisan tradition, and educated in the Universidad del Rosario - Colombia's 'Cradle of the Republic' - the radical martyrs of Colombia's 19th Century civil strifes were as venerable to him as those intangible holy saints who lent colour to the spiritual fabric of his deeply felt Catholic faith.\n\nComing of age in the shadow of the premiership of Jorge Gaitán, the policies, and more crucially, the death of Gaitán would loom large in the coming ideological development of the so-called 'Rebel Priest'. Witnessing as a young man the failure and violent repression of the pacifistic tendency of progressivism in his native Colombia, he was further shaken when he was present to witness the iconoclastic violence unleashed on Post-War Europe as Nazism entrenched itself. Any political moderation which had dwelled within him burned alongside Louvain, sacrificed like so much else to the flames of Fascism's advancing entrenchment in Europe.\n\nReturning home by the late 1950s in time to bear witness to such events as the Cuban Revolution, Torres fell in neatly among the growing camp within Colombia opposed to a return to the failed and empty promises of the liberals and the outright reactionary malignance of the Conservatives. Many in Colombia would wish to impose their will upon its people, with the familiar mantra of the sword and the cross - Restrepo will give them the answer of the poor and repressed faithful - that of the cross and the sickle."
  POLITICS_RAFAEL_NAVAS_PARDO_DESC: "Rafael Navas Pardo is a caring father to the troops under his wing and a principled constitutionalist to his opponents. As he commands regiments upon regiments, he has abided by the tenet of "Soldiers never make the rules; they just follow orders" to the limit of his conscience, for long consolidating his place as one of the most resilient bastions of Colombian democracy — and now, the refounder of its lost cause. \n\nBorn in 1908 around the central municipality of Madrid, Rafael Navas graduated from military school in 1933 as a second lieutenant before paving his way to a career of national security. Beginning his service during the heyday of the Peruvian War, he later found his early distinguishment in thwarting the Pasto Cuartelazo coup d'etat in 1944 — eventually, his stubborn mission of protecting the popular institution led to his defection to the URC after the battle of Floridablanca in 1955.\n\nBringing about triumphs leading the Lancero Corps in the revolutionary army, he soon felt the Communist Party had overstepped its boundaries in attempting to dismantle the cabildo after extinguishing the last embers of fascism. Therefore, controversial as it may be, he made it his stand to enforce the people's will, to restore a free Colombia neither Red nor Brown, as a provisional leader awaiting for rightful rule to return."

  ### EVENTS ###
 GER_colombia.1.t: "SUBJECT: Status of the Segundo Ejército Patriótico in Atlántico"
 GER_colombia.1.SPA: "1. At approximately 4:00 AM (UTC-5), the Second Patriotic Army (SPA) initiated a large-scale offensive which in a matter of hours captured the invaluable port city of Barranquilla for use as a springboard in its Laureanist "rebirth" of the Republic. In speed and unit cohesion, the SPA greatly outperformed our expectations, and suffered half the expected casualties.\n\n2. Colombia is of immense geostrategic importance to the Reich, with the potential to provide access to the Pacific Ocean, hinder US efforts to promote far-left groups in Ecuador, Peru, and Paraguay, and enable deeper ties between Germania and other South American countries. Further, the SPA's leadership is all but unconditionally supportive of any potential backer, and has privately indicated enthusiastic willingness to increase ties with the Einheitspakt.\n\n3. Colombian Armed Forces have so far succeeded in containing the SPA to the Northeast, but lack the heavy equipment and manpower needed to launch a counteroffensive for the foreseeable future. However, the civilian population has been generally uncooperative with the SPA, and frequent encounters with insurgents are rapidly depleting military equipment stockpiles. These issues render the SPA unable to expand its territorial control at present, and may become an existential threat to the movement. Without considerable external assistance, the chance of the SPA succeeding against the Republic is slim.\n\n4. Recognizing these circumstances, our agents recommend in the strongest possible terms a further escalation of UNTERNEHMEN CATTLEYA. in particular, the scale of arms-smuggling operations should be greatly expanded, and civilian advisors should be sent to prepare Uribe's administration.\n\nMAY GERMANY BE IN SAFE HANDS"
 GER_colombia.1.COL: "1. At approximately 4:00 AM (UTC-5), the Second Patriotic Army (SPA) has risen up and secured the invaluable port city of Barranquilla for use as a springboard in our efforts to secure Colombia. In speed and unit cohesion, the SPA greatly outperformed our expectations, and suffered half the expected casualties.\n\n2. Colombia is of immense geostrategic importance to the Reich, with the potential to provide access to the Pacific Ocean, hinder US efforts to promote groups in Ecuador, Peru, and Paraguay, and enable deeper ties between Germania and other South American countries. Further, the Urdaneta Government is supportive of the NSDAP, and has privately indicated enthusiastic willingness to align with the Einheitspakt.\n\n3. The détente between the Laureanist Government and José Camacho Carreño provide a shift in the plan to use him to align Colombia. Reports from Heriberto Schwartau detail the new plan of action. In exchange for aid in the Civil War, the PCC has accepted to deepen ties with the possibility of replacing the Iberian as their ally in the future.\n\n4. Recognizing these circumstances, our agents recommend in the strongest possible terms a further escalation of UNTERNEHMEN CATTLEYA. in particular, the scale of shipping operations should be greatly expanded, and military advisors should be sent to secure PCC alignment.\n\nMAY GERMANY BE IN SAFE HANDS"
 GER_colombia.1.a: "Let's see if the Monroe Doctrine holds up"

 IBR_colombia.2.t: "Boots on the Ground"
 IBR_colombia.2.d: "CONFIDENTIAL\n\nTO: DR. ANTÓNIO OLIVEIRA SALAZAR, GENERALÍSIMO FRANCISCO FRANCO, MINISTRY OF FOREIGN AFFAIRS\n\nINVOLVEMENT IN COLOMBIAN WAR COMMENCING\n\nThe time has come. Recent developments in Colombia have colluded to provide us a window into involving ourselves in the war. Already, there have been talks with our chosen side's leadership to begin arranging steady lines of communication. We have pledged or are preparing to pledge diplomatic, logistic, humanitarian, and military support. Now it is only a specifics before we are fully involved in the conflict, with our options for just how we go about backing a side laid out before us. Expect further reports as our presence evolves and solidifies."
 IBR_colombia.2.a: "Time to roll the dice."

 IBR_colombia.3.t: "Good News from Colombia"
 IBR_colombia.3.d: "CONFIDENTIAL\n\nTO: DR. ANTÓNIO OLIVEIRA SALAZAR, GENERALÍSIMO FRANCISCO FRANCO, MINISTRY OF DEFENSE\n\nCOLOMBIA - VICTORY ON THE BORDER\n\nWe've received good news from our allies and agents in Colombia. The bloody skirmishes along the border have relatively ceased. Although casualties were high, our allies prevailed and managed to overpower the enemy lines in a series of increasingly one sided battles. With the enemy's main force broken, Iberian volunteers and local troops set to work rooting out partisans and establishing garrisons to occupy the towns in the area. Although partisans remain an issue, it is negligible enough that we can say for sure that our side has won out in the region.\n\nThat being said, the conflict continues to escalate still, the enemy is rearming, and the partisans in the area will not give up so easily. Soon we will have to take action to hold on to our tenuous advantage in Colombia."
 IBR_colombia.3.a: "At least we have sure footing."

 IBR_colombia.4.t: "Grim News from Colombia"
 IBR_colombia.4.d: "CONFIDENTIAL\n\nTO: DR. ANTÓNIO OLIVEIRA SALAZAR, GENERALÍSIMO FRANCISCO FRANCO, MINISTRY OF DEFENSE\n\nCOLOMBIA - DEFEAT ON THE BORDER\n\nOur agents in Colombia have confirmed the loss of key territories along the disputed borders of the three agitators. The enemy was able to overpower both our allies and our own volunteers, exacting heavier and heavier casualties until morale and supply forced us out of the area. Although a significant partisan presence has remained behind to cause trouble for the foe, who have managed to establish garrisons in there, their presence is not enough to truly dispute enemy control. We must face the fact that the enemy has won this fight and now fully occupies the border territories.\n\nThe situation continues to escalate regardless. We are at a significant disadvantage, but we should not let that stop us from preparing for a more intense conflict. With this in mind, we should be ready to take action decisively and effectively if or when the time comes."
 IBR_colombia.4.a: "This can only get worse."

  IBR_colombia.5.t: "La Segunda Reconquista"
  IBR_colombia.5.desc: "Cartagena traced its history back to the conquistador Pedro de Heredia, who travelled the West Indies in the early 16th century and founded the city with two hundred men. Between the rivers Magdalena and Sinú the city was strategically important for the Spanish Empire in the Americas, and it grew flush with Spanish capital. Three centuries later, Spanish capital returned to Cartagena with the conclusion of La Violencia.\n\nPerhaps it is unfair to suggest it is solely Spanish capital here. There are Portuguese contractors too, such as Atílio Salgado, a specialist in infrastructure who walked along Central Caribbean Road with a notebook, recording road widths, the poor quality of the gravel and the damage it sustained in the battle to capture the city. But most of the Iberians who came to Cartagena were Spanish. Sergio Díaz held secret meetings with the new mayor, seeking favourable terms for his construction company. At the port, Oier Tarragona oversaw the first merchant ships from across the Atlantic docking, bearing peninsular supplies and ready to receive Colombian treasures. Biel Francisco Gallego stepped off one of the ships, suitcase in hand, ready to enter this newly-opened market.\n\nAnd in the streets of Cartagena, a young diplomat goes walking through the bustling crowd, ecstatic with their newfound freedom and an end to the violence that plagued this country for years. José Manuel Peralta held in his hand a large manila folder, inside which was a report from the Iberian embassy. It talks of the new government preparing elections, the hopeful mood in the streets, the eagerness for Colombia to return to the world; it speaks also of the government's appreciation for Iberia, and the assets their liberalisation has opened up. He entered the post office and handed the envelope to a clerk; FOR URGENT DELIVERY is stamped on the front, underneath which is the address of the Iberian Union's foreign ministry. Peralta returns to Cartagena with a light heart, eager to embrace the city he would come to think of as a home away from home."
  IBR_colombia.5.a: "A peaceful land is a stable land; a stable land is good for business."

  IBR_colombia.6.t: "News of Defeat"
  IBR_colombia.6.desc: "The report sat on Franco's desk unopened. There was no point in reading it, he knew what it said. The situation in Colombia had been deteriorating for weeks, this report was just the final pronouncement. He would spare himself the gory details.\n\nThe phone on his desk rang. This did not surprise him either, and he knew exactly who it was. Picking up the receiver, he was met with a slew of Portuguese profanity from his fellow caudillo. He set the phone down on his desk to let Salazar get it out of his system. And it's not like he didn't deserve it. He was the one who had convinced Salazar that this adventure in Colombia would be worth it. He was the one who had spoken of reclaiming old glories, of Iberia once again having a place in the New World. But those days were gone, and this was the proof.\n\nWith a sigh, he picked up the phone.\n\n"I agree, Antonio. It was my mistake. We need to cut our losses and pull out everything.""
  IBR_colombia.6.a: "You can't repeat the past."

  IBR_colombia.7.t: "A Foolish Crusade"
  IBR_colombia.7.desc: "It was late into the night when the cargo ship bearing the defeated cruised into the harbour, emerging from the fog at a languid pace. They had all been woken up by the call of "landfall," and they were all gathered around the edge of the ship to look upon their homeland, but there was no jubilation to be found in returning home. They all felt empty, confused and tired.\n\nThey had lost, and the men who sent them to this defeat were gone. They departed with the knowledge that they had failed Iberia - but on the voyage back home, they wondered what they were fighting for anyway. What was there in Colombia that was worth sending Iberians to die? Their comrades died for a cause they could no longer recall; all the survivors had were their lives, irreparably scarred by this failure.\n\nIn the distance, the lights of the harbour glittered. The air was pleasantly cold and dry, welcome relief from the Colombian jungles. No longer would they suffer the oppressive wet heat; no longer would they suffer communist or republican bullets and blades; and no longer would they suffer the dreams of old men in Madrid.\n\nEach man carried a testimony of regret, failure and betrayal they would not only carry in their hearts, but testify to all Iberia. They would tell it in the family home, fathers recalling sanitised versions of the war for their children. They would tell it in the inns and pubs of Iberia, drunken wretches crying into their cups for lost comrades at three in the morning. Some would even tell it in the courts as men considered what compensation they could receive for their sacrifice."
  IBR_colombia.7.a: "Perhaps they would even tell it on another battlefield, closer to home."

  IBR_colombia.8.t: "The Vultures' Auction"
  IBR_colombia.8.desc: "Twenty rich men gathered in the vast conference room, in the largest hotel in Bogotá that had not been bombed. Across the room from them was an auctioneer, a government representative and a map of New Granada. They had overlaid lot numbers on the map: the positions of rich estates, fertile valleys and fields most suitable to growing Colombia's finest crop.\n\nIn the estates, a colonel enjoys the first day of his retirement. He intended to grow fat on the lucre he had won from the civil war - half of which he had stolen from Jewish families marked traitors to the state by Alzate. The estate was a beautiful colonial holdover, atop a great hill underneath which were vast fields, and a little town that had grown around a small lake. But he did not own it all, not truly. He knew he was but the representative of another man, who let him play landlord for a reasonable fee. "Sold, to the gentleman from Sapporo, for three million."\n\nA group of farmers were held up by the roadside. Patted down, humiliated, struck in the stomach with the butt of a rifle. New Granadan soldiers raided their caravan, took the crops they had wanted to send to market. Their commander thought himself fair, and left behind a bill with El Duce's face on them. Dejected, the farmers trekked back to their fields, only to find more men bearing a deed to the land, and an order to kick out the squatters. "Sold, to the gentleman from Milan, for four million."\n\nThe village tried to put the war behind them, but the scars remained. When they closed their eyes they still saw the militias descending upon the valley like an avalanche. When they left, seven were dead. The soldiers called them Marxist saboteurs - their only crime was being a village in URC territory. But they were poor, and thought themselves below the attention of anyone else, until a strange man had come and taken samples of their soil. Then came a hundred speculators from distant lands. "Sold, to the gentleman from Barcelona, for five million.""
  IBR_colombia.8.a: "Sold, to the richest men from the Old World, for a few thousand lives."

  USA_colombia.7.t: "Bittersweet"
  USA_colombia.7.desc: "In an air-conditioned corner of Bogotá, three floors above the city, Dirk Holden watched the traffic and sipped that ever-delightful Colombian coffee. In his typewriter was the last page of a report that would launch his career in the Company into the stratosphere: a report on the success of our new allies in the Colombian Civil War. Langley would hear of the crucial role he played in the affair, and they would reward his ten long years trapped in what he once thought was a God-forsaken jungle. Perhaps the coffee was a little bitter, but his victory tasted sweet.\n\nThe victors were an odd bunch: from progressive hawks to liberal democrats alongside a myriad of other squabbling factions. Holden would assure his superiors that the latter would not interfere with the general pro-American sentiment growing within the Country. Gaitán was himself a staunch pan-American who sought to warm his country with the torch of freedom, and his successors can now carry that torch. All Langley needed to be cautioned was against overt interference with their markets. He couldn't help but editorialise: let the Colombians develop their economy, offer them capital and let them decide for themselves which foreign companies should be permitted to invest. You'll still get a grip on their economy, and everyone will be happy.\n\nIt wasn't patriotic pride that made Holden smile. It was pride in his own efforts. Ten long years in Colombia, helping run this station, and he had an entire nation to show for it. He took a sip of his bitter coffee, the prized crop of this country. At first he hated it - his cups were once always three-quarters milk - but over time he grew to appreciate its strong, bold flavour. His appreciation for Colombian coffee grew with his appreciation for Colombia, from hated exile to proud caretaker. America had won here, and America - or, at least, her intelligence services - would come to know the vital role he played in securing their position in Colombia."
  USA_colombia.7.a: "He made sure that was clear in the report."

  USA_colombia.8.t: "On the Run"
  USA_colombia.8.desc: "Henry was running for his fucking life. He sprinted through the thick forest, barely avoiding the roots and branches that reached up to trip him. Holden ran behind him. Henry never liked him, and had privately called him a "CIA bastard", but that didn't matter now. The revolutionaries had been routed, and they were on the run. Henry could hear the government soldiers advancing, seemingly just at their heels.\n\nHolden slumped wheezing against a tree. Henry turned and yelled "What the fuck are you doing?"\n\n"Just need to get my brea-" Holden's words were cut off by a gunshot followed by a scream. Henry ran with doubled speed. Bursting through the trees, he found himself staring down at the Orinoco River. Henry took a deep breath and leapt off the edge of the bank.\n\nHe had planned to swim to the other side, but found that impossible. His eyes burned in the murky water, and the rush of the river stole all sound from his ears. He tried to push in the direction he assumed was the opposite shore, but his muscles quickly tired and his lungs burned. When a hand grabbed his back and pulled him from the water, the relief almost drowned out the fear.\n\nHe was sprawled on the deck of a small motorboat, driven by a soldier. Another soldier sat near him, his gun at the ready. Henry sat up and looked to the shore they were headed for. On it he saw several more soldiers and Holden, sitting with a bloody bandage on his leg. The situation wasn't ideal, but it at least seemed like they wouldn't be killed."
  USA_colombia.8.a: "An embarrassing end to the adventure."

  USA_colombia.9.t: "A Torch Snuffed Out"
  USA_colombia.9.desc: "Dirk Holden tried to summon the information in his head: the field manuals, the informational movies, the conversations between veterans he overheard. Only a jumble emerged, thousands of scraps fighting for relevance in his mind as his body marched through the Colombian jungle. He was stripped and blindfolded, forced to march through the unforgiving jungle by a victorious enemy. He tried to explain who he was - not an agent, not a soldier, but a secretary. His captors do not care. He marches to his death with the rest of the Yankees.\n\nPeeled bark and fallen branches crunch and splinter below his bleeding feet. The cold barrel of a rifle presses into his back, driving him forward whenever his body tries to rest. Holden wishes he could hear the birds above him clearly. He would like to die with their song to comfort him, but the jeering of soldiers and the loud crunch of the debris below him drown out their song.\n\nIn the din of his mind, new thoughts emerge, memories of reports terrifyingly clearer than the ones he tries to remember. New Granada's forces had been creative with their torture of local collaborators. Holden read the reports; he even wrote a few of them. They had long eschewed conventional force and developed new ways of inflicting pain on men. They had even taken to mimicking medieval forms of torture. He tried to fend off these thoughts, but once they revealed themselves it was impossible to forget. Holden's legs almost gave out, but another sharp thrust of a gun barrel in his back forced him to keep stable and walk towards horrors he'd only read about.\n\nSome four thousand miles away, a report crosses the Resolute Desk. It puts the Colombian situation in plain terms: assets that have not been extracted at the time of writing are considered lost. The torch of liberty shall not fall on New Granada. With sorrow, anger or boredom - few know now, and none will remember later - the President accepts this information and passes it along the desk like a clerk."
  USA_colombia.9.a: "Another failure for the pile."

  BRA_colombia.1.t: "Amending Plans"
  BRA_colombia.1.desc: "It was already a long and tumultuous day for [BRA.GetLeader], after all, being the leader of Brazil was no easy task. But it seemed that he must now shift his worries outside the land of 'order and progress.' Just as he entered his office in the Planalto, he was met with generals from all over the country, from the Amazonian jungle to the Riograndense pampas. On his table, there were at least ten different maps of Colombia, each differing only in the most minute details.\n\n"Good evening Mr. President, I hope your day has been tranquil. Please, have a seat." said one of the generals as they pulled a chair for [BRA.GetLeader]. "Let's get on with this already, shall we?"\n\n"As you may know from the news, the illusion of peace in Colombia is about to come to an end. Capitão Salcedo's forces have been engaged in heavy combat with the Central Government for the last few days, and it's only going to get worse with each bullet that leaves their guns." - explained the general - "With the collapse of the 1957 ceasefire imminent, it's crucial that we increase our involvement in the conflict and ensure that the victor will be amenable to our interests."\n\n"I must recommend that we support the Revolutionary Union, they-"\n\n"Those Varguists all buddy-buddy with communist bandits? Give me a break!" - One general yelled in protest - "We shouldn't be helping out their lot, their only goal is being the ones doing the looting! If anyone is going to help us, it's the government in Bogotá. They've been a bastion of anti-communism and stability ever since the war started. If it weren't for those..."\n\n"Have you forgotten what Gaitán meant to this damn continent? He may have been a socialist, but he fought for unity in the Americas and democracy, now his dream's under attack by the very fascists he was warning us of. We should be promoting democratic governments around this continent, not tinpot dictators."\n\nThe general who had protested scoffed as soon as the other described the Revolutionary Union as "democratic", then turned to the president. "Well, which one will it be, Mr. President?"\n\nAs he held his chin with his hands, [BRA.GetLeader] responded:"
  BRA_colombia.1.a: "The Revolutionary Union."
  BRA_colombia.1.b: "The Central Government."
  BRA_colombia.1.c: ""We need to think more about this.""
  BRA_colombia.1.e: ""None of them.""
  BRA_colombia.1.e_tt: "§YThe Armed Forces already have enough to deal with internally, best not to entangle ourselves in Colombia as well.§!"

  BRA_colombia.2.t: "Water for the Bird"
  BRA_colombia.2.d: ""Listen, Mr. President, I'm telling you that every other option is either a sockpuppet for the Iberians, the Italians, even worse, the Germans," one general exclaimed to the Crow, who couldn't stop cawing.\n\n"So you're telling me our only option are the goddamned Gaitanistas? This war is already lost, then. I am absolutely not approving this. I loved Gaitán like everyone else, but they're fools if they can't see that his followers are worse than Varguists!" the Crow continued to caw as the generals tried to explain the same thing over and over. Minutes passed until, eventually, the Crow seemed to have run out of energy, one general noticed this and took the opportunity to explain the necessity to support the Revolutionaries.\n\n"I hate those populistic socialists as much as you do, but we must be pragmatic when it comes to who we support in this continent. We don't know how Colombia could end up if we just choose to ignore it. The CRU is a wide front, the Gaitanistas have made clear they are only in an alliance of convenience with those Bolsheviks. Dr. Michelsen has made clear his intentions to end the arrangement once the war is over.\n\nAfter one cup of water to help his hoarse voice, the Crow chirped: "Right, well. I suppose it's better take our chances with them than risk finding out what flavor of tinpot dictator we can end up with. You have my authorization, then."\n\n"Thank you, Mr. President," said one of the generals as they left the room, leaving Lacerda to think for himself."
  BRA_colombia.2.a: ""A self-serving Varguist is the best that country could scrounge up...""

  BRA_colombia.3.t: "Life After Wartime"
  BRA_colombia.3.desc: "There's a kind of hush that settles over a land immediately after war. People stumble out of their shelters and foxholes, tentative steps towards their old routines, instinctively dreading the moment in which chaos returns once again. A man might lose control of his horses, his mind occupied by the wife he lost in a skirmish, and the entire town locks themselves away against the stampede. Fishermen and tappers hesitate to set sail across the border in the Amazonas. Burned-out villages and towns reduced to rubble litter the landscape, the memory of their past fading as the days pass.\n\nBogotá felt that hush at first. People walked hesitantly, close to the entrances of buildings, ready to dive into cover once the shooting started again. But slowly, people understood that it was over. Brazil's men won in Colombia, and peace was in their foreseeable future.\n\nAnd with peace came foreign investment. Though foreign the encroaching foreign ships startled many residents of the Colombia's ruined ports, the Brazilians came bearing heavy purses, not weapons of war, ready to help the rebuilding effort and reap a good reward in response. Delegations met in the least-affected hotels of Bogotá to draw up trade deals, presidents exchanged telephone calls to congratulate Colombia on their newfound victory.\n\nThere's still a hesitation in the air. La Violencia clouds the minds of many Colombians. Indeed, for many not enjoying the luxury of an urban sprawl, the conflict persists. Yer for those lucky few, an alluring sentiment beckons. The call of peace, of a world once present only in their dreams. One where they needn't fear the return of paramilitaries, burning families alive in their homes and pillaging what scraps the flames leave behind. A world without nightmares..."
  BRA_colombia.3.a: "One they will work to turn into reality."

  BRA_colombia.4.t: "The Way Home"
  BRA_colombia.4.desc: "Less than a mile north of the Cuiari River was a small campfire around which lost sons of Brazil huddled for warmth. The collapse of the frontlines had driven them all into the jungle, in a pathetic display of panic and disorganisation that saw agents and officers of the Brazilian army stranded in the Colombian jungle. On the edge of the camp's light Lieutenant Vitor Pires Cabral carved his and six other names into a tree with his clip-point knife: LEAL, ALVARES, CLEMENTE, MARTINS, FONTANA, ESTEVES. He expected them all to die; he did not want them all to be forgotten.\n\nThe other six gathered around the campfire and discussed their next move. All were in broad agreement that they had two options: follow the Cuiari to the Amazon, and follow the waters to somewhere populated. Risky, for they may risk capture by the enemy, no doubt patrolling for the stragglers they routed on the battlefield. Leal proposed the other option: they head south, through the jungle, and hope they hit Brazil.\n\nÁlvares pointed to the map, pointed out they are only twenty klicks from the Içana River, within Brazil's borders. Clemente chewed them both out: don't they know how lost they are in the jungle? Martins tried to calm them all down, but cannot deny that he thinks entering a town is dangerous if they are allied with the new government. Fontana pointed out the obvious: whatever the outcome, if they stay here, they are dead.\n\nWhen Cabral returned to the group, Esteves was putting out the fire. He told him to rest up. They will march south at first light. He crawled into his bedroll and tried to go to sleep, but chirping insects, soft rains and the fear of an enemy patrol kept him from truly resting."
  BRA_colombia.4.a: "So close to home, yet so far away."
  
  BRA_colombia.5.t: "A New Partnership"
  BRA_colombia.5.desc: "Adhemar de Barros was rearranging his desktop when his phone rang for the fifth time today. "Good afternoon, Mr. President." The Colombian Ambassador greeted warmly. "From all of us, we hope you're settling well into your new office." Adhemar chuckled, already wondering what they wanted from him. He still decided to play along.\n\n"I certainly am." He responded, leaning back in his leather chair. "Likewise, I hope all is going well back home." There was an awkward silence as the ambassador seemingly steeled himself. "Hello?"\n\n"Truth be told, Mr. President, things could be far better here." The Ambassador admitted. Away from the telephone's receiver, Adhemar snorted and nodded his head. It was Colombia, things were never going well there. "We understand that the previous administration has been sending aid to the Revolutionary Union."\n\nAdhemar flipped through a stack of papers on an intelligence brief, withdrawing the one on Colombia. "We ask you to shift your aid to the government here in Bogotá. It's in our mutual interest." The President withdrew another paper from the stack as the Ambassador continued his pitch. A half-written memo asking for abandonment of the leftist radicals. "If you are still unconvinced, It will also be in your interest, Mr. President. We can guarantee a possible... gift for your generosity." Adhemar grinned, withdrawing his pen.\n\n"You have my word. Today will mark the day of a great partnership.""
  BRA_colombia.5.a: ""Thank you, Mr. President. We promise you won't regret this decision.""
  
  BRA_colombia.6.t: "A Change in Allegiance"
  BRA_colombia.6.desc: ""Good afternoon Mr. President. I hope you're getting settled in nicely." Lincoln Gordon greeted. Carlos Lacerda took his notepad and a pencil. If the American Ambassador called personally, it would be important. "I've been told that you've been briefed accordingly on the situation in Colombia?" Lacerda exhaled.\n\n"Yes I have, Mr. Gordon." Lacerda responded, pinching the bridge of his nose. God, what a mess. So far, he hadn't modified any policy of the previous administration. Security on the border, and arms to the Bogotá government. "Is there anything further I need to know?" There was a moment of silence before Gordon spoke.\n\n"Actually, I have a request from Washington, Mr. President." The ambassador answered. "We'd like you to shift support from the central government to the Revolutionary Union. They're far more co-operative." Lacerda grimaced, scrawling down "URC support" on his notepad. "That's all we ask, Mr. President. Have a good day."\n\n"You as well, Mr. Gordon." Lacerda placed the phone down, looking at the three letters before him. He knew firsthand that socialists were dangerous people. Yet, if the United States was willing to support the Union, that meant they wouldn't be causing trouble for Brazil should they take control of the country. Besides, it would be far more dangerous for Lacerda to oppose their most powerful friend."
  BRA_colombia.6.a: "He punched in the number for Intelligence."

  BRA_colombia.7.t: "The Colombian Question"
  BRA_colombia.7.desc: "The Itamaraty Palace was quieter than usual, aside from the sound of shuffled papers and murmurs, but President Lott knew that the peace and quiet wouldn't last for much longer. A series of maps and folders documenting the factions in Colombia's Violencia clutter across different desks and bulletin boards. Brazil, officially, had yet to support any faction in the conflict publicly, but had no plans to let fascism run over its northern neighbor. What was not determined, however, was who to support.\n\n"The Americans have made their position on the matter clear," Salles began while gesturing to a map detailing the Revolutionaries' movements and positions in Colombia's jungles, "the Gaitanists are their favorites in this fight, and our safest bet once the battle lines start shifting again."\n\n"Safest? For whom?" Jair Ribero shook his head, "They're in bed with radicals almost as bad as the fascist rats, with just as much potential for harm." The general continued as he pointed a finger at a photo of a military man giving an address before a crowd in Colombia's capital, "If this is about making sure who gets to rule Bogotá, we should side with the man who already holds it; he's shaping up to be another Floriano Peixoto from what we've seen of him."\n\nLott perked up at the comparison and rubbed his chin before Salles spoke up again. "The Yankees find him a touch unpredictable; they're set on working with the Reds. It wouldn't be impossible to change their minds, but Pinilla would need to do a lot of convincing to make it happen.""
  BRA_colombia.7.a: ""Bogotá has potential, let's try to set up a line between him and Washington.""
  BRA_colombia.7.b: ""The Americans have it right, we'll support the Gaitanists.""

  BRA_colombia.8.t: "The Colombian Mess"
  BRA_colombia.8.desc: "The Itamaraty Palace was quieter than usual, aside from the sound of shuffled papers and murmurs. A series of maps and folders documenting the factions in Colombia's Violencia clutter across different desks and bulletin boards. Brazil, officially, had yet to support any faction in the conflict publicly, but had no plans to let fascism run over its northern neighbor. What was not determined, however, was who to support.\n\nNever one to enjoy a long silence, President Lacerda made his feelings on the matter known. "Those Gaitanists aren't any better than those Justicialists in Argentina," he began with a huff, "the day they can establish a working democracy is the day pigs can fly." The rest of the room responded with a round of nodding heads and murmurs of agreement, before another voice broke through.\n\n"Be that as it may, the Americans are dead set on them," Magalhães shrugged his shoulders. "The only other choice that isn't wearing lederhosen or some different type of fascist is [COL.GetLeader], and they don't trust him."\n\n"And they shouldn't! He's no different from the bastards in Iberia!"\n\n"Be that as it may," Golbery interjected, "if we could get ourselves and the Americans a foot in the door inside of his government, it could be a real boost to the liberals and other moderates in Bogotá. Maybe they could put a leash on his worst parts.""
  BRA_colombia.8.a: ""Better than the Reds, let's see if he and Washington can play nice.""
  
  USA.COL_faction_support_tt: "§YIf negotiations succeed, we will abandon the CRU and aid the Republic under [COL.GetLeader] should the Colombian Civil War restart.§!"
  
  COL_USA_negotiation.0.t: "The Colombian Candidate"
  COL_USA_negotiation.0.desc: "It was rarely ever not a busy day at the US State Department, but some days would throw curveballs at you in more interesting ways than usual. Today, the Secretary of State found himself reading a proposal from the Brazilians on the Colombian Crisis: to ditch the Revolutionaries sweating it out in the jungle in favor of the new Bogotá government. Officially, relations between the United States and the Colombian government had frozen for years, and contact between the two had been formally severed since 1957. Brazil's offer to act as an intermediary was surprising but welcome to those with reservations about arming socialist Revolutionaries.\n\nAs such, the Secretary had drawn up a list of proposals for the new Colombian government, to show that they could play ball and distance themselves from the fascist dictatorship they replaced. He took a moment to read over a short version of the list, namely the two most important pieces: the first, a public denouncement of Germania. That, hopefully, was going to be the easy part. The second was compensation for nationalized American assets. That would be the much more difficult of the two.\n\nThe Colombians, doubtlessly, would have requests of their own, but the Secretary was satisfied with what he had, for now. He then jotted down another note to himself: put Lincoln Gordon and his staff in charge of the negotiations, and get him a line to their FBI agent inside the Brazilian embassy in Bogotá."
  COL_USA_negotiation.0.a: "Gordon's a smart man; he can get it done."

  COL_USA_negotiation.1.t: "A Night in Bogotá"
  COL_USA_negotiation.1.desc: "Officially, the USA had withdrawn all personnel from the Colombian mainland since it recalled its ambassador in 1957. Unofficially, it has maintained several contacts and agents across the country, most importantly, the FBI. For Gordon Lincoln, his contact would be a man stationed inside the Brazilian embassy. "Hola, sí, sí, soy Lincoln. Necesito hablar con William. Sí, esperaré en línea."\n\nBarely a minute had passed before a distinctly American accent came onto the line. "William speaking. I understand you have some requests?"\n\n"So to speak." Gordon hummed. "The United States is interested in renewing its relationship with Colombia, with some requirements."\n\n"Of course. To ensure a smooth discussion, I recommend bringing forth these issues one at a time."\n\n"My thoughts exactly. As such, I figured we'd start with something simple: a public denouncement of Germany and its so-called Unity Pact."\n\n"Hmm. I can see the government accepting this. Few men hold the Laureanists and their Germanophilia in high regard. Though I'm certain you understand, we most certainly cannot afford to cast out what aid comes our way without finding a new source first.""
  COL_USA_negotiation.1.a: ""Let's hope he makes the right choice.""
  COL_USA_negotiation.1.tt: "If the demand is accepted:"
  COL_USA_negotiation.1.ttt: "§sThe Governing Coalition's§! furthest right elements will be weakened if @COL §fColombia§! accepts."
  
  COL_USA_negotiation.2.t: "Break with the Reich?"
  
  COL_USA_negotiation.3.t: "Pass the Paper"
  COL_USA_negotiation.3.desc: "Brasília's warm breath fogged up the windows of the embassy and sprayed crystal dewdrops in the leaves. Lincoln Gordon took to the front steps, coffee cup in hand, and found the American and Brazilian staff passing around the morning newspaper. He waited his turn to fumble with the pages.\n\n"How are the Portuguese lessons going? Won't be able to enjoy O Globo much if you can't read," a colleague said with a bump of the shoulder.\n\n"We're getting there." Gordon shook his head, scanning the stories, and there he found it.\n\n"LÍDER COLOMBIANO DENUNCIA GERMANIA."\n\nThere was a picture of the Colombian delegation attached, and while his colleague offered to translate, Gordon politely waved him off for later. A more detailed report would be necessary, of course, but he understood that headline well enough. Bogotá had done the expected and followed American advice, and all was well with the world for now. He smiled, really breathed in that roasted aroma of his coffee, and passed the newspaper to the next guy."
  COL_USA_negotiation.3.a: "Expected or not, a man can be happy for successes."

  COL_USA_negotiation.4.t: "Lunchtime News"
  COL_USA_negotiation.4.desc: "A cable from the Colombian embassy, Mr. President."\n\nNormally, [BRA.GetLeader] would have waved away any aides when eating his lunch, but this had been a long-expected one. He set down his forkful of rice and motioned for the message to read.\n\n"The Colombian government has officially denounced Germania for its involvement in Colombian affairs, including its meddling in the civic conflict." [BRA.GetLeader] read aloud with a broadening smile, shoulders looser. He read over the reaction from the Americans, who were quite pleased of course, and imagined the Germans' fuming.\n\nBogotá had, as hoped, turned out to be the right fit for Brazil's, and by extension, American, interests. He was the right horse to back indeed. [BRA.GetLeader] thanked his aide, already thinking of the next stages in the diplomatic offensive in Bogotá. At least, he was glad his lunch wasn't ruined."
  COL_USA_negotiation.4.a: "Everything tastes sweeter with a side of victory."

  COL_USA_negotiation.5.t: "Leading Our Horse to Water"
  COL_USA_negotiation.5.desc: "The news of developments in Colombia reached Alvorada Palace faster than the rest of Brasília, or, for that matter, the rest of the world. That was how [BRA.GetLeader] learned the magnitude of the mess before anyone else.\n\n"The Colombians are categorically refusing to issue any statements that rile up the Germans," the cables from Bogotá said. "U.S. negotiators are frustrated. We are at an impasse."\n\n[BRA.GetLeader] wondered where this subservient Colombia, which wouldn't dare offend the Germans helping destroy his country, went when it was time to negotiate with Brazil. He wondered, too, if Brazil had picked the wrong horse when it chose to back him over the Gaitanists.\n\n"If it were the Gaitanists, we wouldn't even be discussing Germany," [BRA.GetLeader] muttered."
  COL_USA_negotiation.5.a: "We make do with past choices, wrong or not."

  COL_USA_negotiation.6.t: "Bumbling Bogotá"
  COL_USA_negotiation.6.desc: "A late-at-night phone ring was never a good omen. In the back of his neck, Lincoln Gordon expected sudden bad news as he picked up, and William's sigh on the other end of the line confirmed it.\n\n"You can't be serious."\n\n"Believe me, I wish I wasn't," William said. "They've refused. Bogotá's stalled and rejected our offers so far. Won't break with the Germans."\n\n"The same Germans shoring up the opponents that want to kill them," Gordon muttered.\n\n"Running theory's they're more dependent on the Führer's purse than we thought." And it was so absurd that Gordon would have laughed if he wasn't going to get strung up by the balls in Washington over it.\n\nThe ambassador seemed to notice the bags under his eyes the next morning, and he contacted the Brazilians first thing.\n\n"It was their idea to negotiate with Bogotá, so they better have a Plan B for this," Gordon warned, and the ambassador fidgeted with his collar.\n\n"They say we continue the negotiations. Stay the course until Bogotá accedes, and it will accede."\n\n"Stay the course..." He held back a bitter comment. It wasn't Brasília who would look bad to his superiors if Colombia couldn't be cowed. Still, what did he get from complaining?"
  COL_USA_negotiation.6.a: "One way or another, Colombia would stop eating from the hand that beat it."

  COL_USA_negotiation.7.t: "Compensation for Nationalization"
  COL_USA_negotiation.7.desc: "William read over the instructions from the State Department with a thin expression. Seems they were insisting on compensation for nationalized assets, namely, branch offices seized by the Laureanists back in the 50s, an event that was a major reason American-Colombian relations fell apart.\n\nThe State Department's demand would be a very difficult one, one that would bring up a lot of bad memories for both sides, especially with a man like [COL.GetLeader] in charge. From everything that he had gathered about Colombia's new leader, the nationalization of foreign assets was one of the few things he and the Laureanists seemed to agree on, and he wasn't going to bend on the matter easily.\n\nStill, the matter was important if their governments were to reach an agreement. Hopefully, Bogotá's sense of self-preservation would outweigh its ideological dedications."
  COL_USA_negotiation.7.a: "Extending a thorny olive branch..."
  COL_USA_negotiation.7.tt: "If the demand is accepted:"

  COL_USA_negotiation.8.t: "Fly-By-Negotiations"
  COL_USA_negotiation.8.desc: "When one is the Chancellor of the Imaraty Palace, one tends to learn a few things. One of the less comfortable realizations is how little sleep one gets on the job. One of the more distressing of these realizations is that diplomacy among great powers is a dying art, and the sheer volume of tacklessness they can condense into a single message is almost impressive.\n\nThe Yankees demanded that every company nationalized by the Colombian government return to American hands as quickly as possible. It was as ridiculous as it was insulting, and [COL.GetLeader], whatever his faults, wouldn't be in the wrong if he stood his ground against something so humiliating. The Chancellor drummed one hand on their desk, considering alternatives.\n\nBogotá would balk at compensation for all assets, but negotiations didn't have to end there. Perhaps if [COL.GetLeader] stood his ground against total compensation, but with a counteroffer in mind, a compromise could be made. Of course, the Americans wouldn't be pleased by such a thing. Gingerly, the Chancellor reaches for the phone."
  COL_USA_negotiation.8.a: "Advise Bogotá to make a counteroffer."
  COL_USA_negotiation.8.b: "Better keep the Americans happy."
  
  COL_USA_negotiation.9.t: "Washington Demands Assets"

  COL_USA_negotiation.10.t: "A Colombian Compromise?"
  COL_USA_negotiation.10.desc: ""Just got word back from Bogotá, he says that we're asking for too much-" William began, his voice broken up by some mild crackling, "but he's willing to meet us halfway."\n\nGordon heaved a sigh. "Define what you mean by 'halfway,' please." If Bogotá's latest protagonist wasn't going to give him a headache, he had a feeling that the State Department's response would.\n\n"Ah, well, he's willing to give back some of the shares of all the companies that were nationalized." William paused to let the words sink in before continuing. "He insists that they will be vital for post-war reconstruction, and that Colombia cannot afford to return it all."\n\nAdmittedly, the deal would still be better than getting nothing. Didn't change the fact that the Palacio de Nariño's continued defiance was going to ruffle a lot of feathers. Gordon mulled over the potential consequences before making his choice."
  COL_USA_negotiation.10.a: ""Alright, let him know we can meet halfway too.""
  COL_USA_negotiation.10.b: ""Tell him it's happening our way, or not at all.""

  COL_USA_negotiation.11.t: "Bogotá Refuses to Compensate"
  COL_USA_negotiation.11.desc: "William grimaced as he wrote up his latest report on the negotiations with the Central Government. The Brazilians had sent him the State Department's demands for compensation, or at least a watered-down version. Didn't matter much either way, because the Casa de Nariño had refused, rather decisively too: the Colombian government would not, under any circumstances, return American assets they seized control of.\n\nWilliam could already imagine the reaction from Gordon and the rest of the State Department: indignation, outrage. Wouldn't surprise him if some of them wanted to end negotiations right here. Whatever the case, this was going to be a serious setback, and Bogotá was going to need to act carefully if they still wanted American aid."
  COL_USA_negotiation.11.a: "Better get those phone calls over with..."

  COL_USA_negotiation.12.t: "Cost of Entry"
  COL_USA_negotiation.12.desc: "He actually had done it.\n\nLincoln Gordon was just as blown away from actually reading the affidavit in his hands as when William told him ahead of time over the phone, the call ending right as the piece of paper wound up in his lap at his office in the Embassy in Brasília. By every measure, this was meant to be a unilaterally good thing, at least for Washington, and yet...\n\n[COL.GetLeader] could beat his chest all he liked and have every state-run propaganda outlet paint him as the second coming of Bolívar, but most people already knew the score. No political or military leader had a regime beyond reproach. Not the Colombians, not the Spanish or the Portuguese, not the Italians or even the Germans. There was always someone reliably picking away, little by little, at the underpinnings of the government.\n\nAll the more reason, Gordon presumed, that Bogotá had finally knuckled under the American demands. American former assets in Colombia, the very same ones [COL.GetLeader] had ordered nationalized, were to be summarily returned without complaint. At least, without complaint from [COL.GetLeader] himself, or at least none he was willing to say publicly.\n\nThere was perhaps a chance that Gordon was overthinking it. It could have been a genuine attempt to parlay in the negotiations as an act of good faith, if for no other reason than to give himself leverage. Nonetheless, the US regaining control over their assets in Colombia was a great windfall. Assuming, at the very least, the negotiations continued in Washington's favor."
  COL_USA_negotiation.12.a: "An attempt at detente or the beginnings of a plea bargain?"
  
  COL_USA_negotiation.13.t: "Time for Our Demands"

  COL_USA_negotiation.14.t: "Bogotá's Tropical Conceit"
  COL_USA_negotiation.14.desc: "The President's office at the Planalto greeted the news with quiet relief, a rare thing in the world of South American geopolitics. Both [BRA.GetLeader] and the Itamaratay Councilor were going to have their hands full, but assuming everything went smoothly, Brasília and her allies in Washington might be able to actually get something out of Bogotá for once.\n\nThe Government's demands were relatively straightforward: Colombian sovereignty over San Andrés and its surrounding archipelago. A reasonable demand, considering they used to be a Colombian territory until the Yankees seized it at the start of La Violencia. A less reasonable demand considering the archipelago's natives wanted nothing to do with Bogotá anymore. Still, if this was the carrot to ply the Republic's supporters in Bogotá, the parties involved could work with that.\n\nAt the behest of [BRA.GetLeader], phone calls were made to the Itamaratay in Rio to begin the processes of the Caribbean handover. One might say Brasília could use a win like this and not just for cooler relations with Colombia. Common perception of Brazil's role in the OFN is hard to disentangle from the image of Brazil being a sock-puppet for American interests in the region. Hopefully, with their role in ironing out the agreement with [COL.GetLeader], Brazil's leaders could live down some of this stigma and further legitimize themselves as a proper partner in affirming OFN affairs in South America."
  COL_USA_negotiation.14.a: "Hopefully, we can get this done."
  COL_USA_negotiation.14.tt: "§F§YSan Andrés and Providencia§! will be returned to @COL§fColombia§! after the end of the §RColombian Civil War§!.§!"

  COL_USA_negotiation.15.t: "Dots on the Map"
  COL_USA_negotiation.15.desc: ""Mr. Secretary, Bogotá is seeking the return of San Andrés and Providencia."\n\n"I'll need a bit more context. What are the Brazilians saying? Where even are San Andrés and Providencia? What's the Colombian claim? Why are we there?"\n\n"My apologies, Mr. Secretary, we haven't had time to draft a formal report. San Andrés and Providencia are a Caribbean archipelago - located closer to Nicaragua than Colombia, but Nicaragua recognized the latter's claim in a 1928 treaty. As La Violencia worsened, we occupied the islands to preserve order and prevent criminality after Bogotá lost any ability to project authority that far afield. The islands are lightly populated and have limited strategic or economic value - primarily just a tourist destination. Itamaratay is pushing hard for the handover, saying that returning the land will improve our reputation across the Americas."\n\n"Make Brazil look good in the process, I suppose. Well - get me that report and let me know if any Senators will take issue with giving back the archipelago. On the condition that they put a definitive end to their civil war and... and they keep on good behavior."\n\n"Yes, Mr. Secretary, several Senators have in fact-""
  COL_USA_negotiation.15.a: ""Unless that report says otherwise, start prepping for their eventual return.""
  COL_USA_negotiation.15.b: ""Then we hold on to the San Andes or whatever they're called. Send me the report as a formality.""

  COL_USA_negotiation.16.t: "Uncle Sam Rolls the Iron Dice"
  COL_USA_negotiation.16.desc: "The image of the Casa de Nariño slowly disappeared in the rearview mirror as the state car rolled along the streets of Bogotá, with nothing but [COL.GetLeader]'s own words echoing in William's head. As far as the deal was concerned, everything seemed to be in place. Brazil had given official recognition, the US had (mostly) given the green light, and now [COL.GetLeader] had seemingly finalized it.\n\nEven the Colombian military was enthusiastic about the agreement, something that was rare in William's own dealings with Bogotá. He even received a formal invitation to dinner, a great honor, but William had other obligations. Clearly, Bogotá was at least somewhat genuine in its commitment to the American alliance; better still, Colombia would be gaining territory in the Caribbean in the process.\n\nThis was all still preliminary however, even as the metaphorical ink on the agreement was still wet. The Civil War was still raging, and even if Bogotá came out on top, leftist partisans and Axis-backed belligerents would likely still be a problem for years after. The beleaguered central government would likely lean on the US for aid in that effort too, but for now, [COL.GetLeader]'s regime was on the march."
  COL_USA_negotiation.16.a: "Washington's heirs have thrown in with Bolívar's disciple."

  COL_USA_negotiation.17.t: "A Radio Supernova"
  COL_USA_negotiation.17.desc: "OFN MANDATE TO MAINTAIN CONTROL OF DISPUTED ISLANDS\n\nAs soon as William looked over the article, he could hear the upcoming speech blaring over the radio. The United States had interpreted Pinilla's request for the islands to be returned as a step too far. The response had been relatively delicate in its wording, and had even officially recognised his continued primacy over the island, but the statement, warning of continued instability and of regional security needs, might as well have been written in blood.\n\n"Once again, the Americans have shown their contempt for Colombia's integrity," roared Pinilla, his rage burning through the speaker. "My efforts to simply return the islands unjustly occupied by the United States have failed, and they shall remain as such for far longer. Washington claims that they will safeguard it from the tyranny of national socialism, but their teeth glint with the light of their dagger as they hunger for the right to partition yet more parts of Colombia."\n\nHe sighed, turning down the radio. Of course, the Brazilians would also be frustrated. He wasn't fluent in Portuguese, but he didn't need that to know just how many promises Brasilia had been delivering to him in return for his offer. Whether they included the direct promise or not, he knew what side they'd be taking, and that he'd be expected in Rio within the week. There was nothing he could do, he thought, except prepare himself for the upcoming outrage that both sides would present him with.\n\n"Many people have abandoned you, but I have not. These islands may still be occupied for now, yet as much as I know that Colombia is not fated to eternal civil war, I know that San Andrés and Providencia are not fated to occupation. I will continue to work diligently to ensure they are returned, and will continue to fight for the unification of Colombia by any means necessary.""
  COL_USA_negotiation.17.a: "A promise of violence delivered for the fight ahead."

  COL_USA_negotiation.18.t: "A Letter of Disdain for Washington"
  COL_USA_negotiation.18.desc: "FROM: ITAMARY PALACE OF THE UNITED STATES OF BRAZIL\n\nTO: SECRETARY OF STATE OF THE UNITED STATES\n\nTOPIC: RETURN OF THE SAN ANDRÉS AND PROVEDENCIA ISLANDS\n\nWe are deeply concerned at the continued Mandate over Colombian territories. Since independence, these have legally been part of the Colombian government, and have repeatedly presented their underlying loyalties to the state of Colombia despite past efforts to transfer these territories to Panama.\n\nColombia may be facing unrest, but that alone is not cause to seize territory. The legal President of Colombia still governs a significant portion of the country, including the capital of Bogotá. There is no legal framework, beyond that of the Rome-Berlin Axis, that justifies this occupation, beyond some vague overtures for stability.\n\nThe Bogotá government has been willing to engage with the United States of America and with Brazil, and has opened up negotiations with the Organisation of Free Nations. Its demands are not excessive, and have come solely out of a desire to unify their own country. The US occupation of these islands will weaken their claim, and will hamper their efforts at restoring stability.\n\nAlthough the American government might not recognize the claim, Brazil remains a staunch ally of Colombia, and will continue to treat this occupation as both illegal and arbitrary. We stand behind the Colombian government in its efforts at restoring control over the country, and warn the United States that further violations of sovereignty in Latin America will come with consequences."
  COL_USA_negotiation.18.a: "A united front comes from far below."

  COL_USA_negotiation.19.t: "Do the Right Thing"
  COL_USA_negotiation.19.desc: ""Thank you for your time," said [COL.GetLeader], "but I have one last request. I believe you already know what it is." The Secretary of State nodded, as he adjusted the quimbaya that [COL.GetLeader] gave him as a gift. It was one of many knick knacks that adorned the office.\n\n[COL.GetLeader] continued, "As we're the central government of Colombia, and our civil war is over, I believe it is only right for us to be readmitted to the Organization of American States"\n\nThe two sat in silence for a moment, the Secretary of State tapped his pen on the table. [COL.GetLeader] knew that his demand was a big one, but it made sense. All the radicals were gone and [COL.GetLeader] was certainly not the worst candidate to win. Those New Grenadine freaks wouldn't have made it to the US let alone Foggy Bottom.\n\nThe Secretary of State spoke, "I believe we can accept your reentry." [COL.GetLeader] smiled and thanked the Secretary of State. "Thank you, sir." With that [COL.GetLeader] smiled and left, excited to return to Bogotá."
  COL_USA_negotiation.19.a: "And with that, Colombia returns to the fold."
  COL_USA_negotiation.19.a.tt: "@COL §fColombia§! shall join the §BOrganization of American States§!!"
  COL_USA_negotiation.19.b: "But it was all a lie."

  COL_USA_negotiation.20.t: "Secret Supporter"
  COL_USA_negotiation.20.desc: "For a few weeks, [BRA.GetLeader] had thought the northern border had been surprisingly quiet. Since the dispute over the San Andrés and Providencia Islands had been settled, the Itamaraty Chancellery had mostly moved onto other pressing matters as Bogotá fell silent once more. As the knock came, followed by a familiar tone, [BRA.GetLeader] knew this short reprieve was over.\n\n"Bogotá wants to rejoin the Organization of American States," responded the Chancellor, thumbing through a folder to bring out the most relevant document. "Of course, nothing within the message should be surprising. An internationally recognized government friendly to the United States and to diplomacy wants the prestige and to take part in the broader forum."\n\n[BRA.GetLeader] raised an eyebrow, his eyes glazing over the file. "I don't see the problem with this. It's not like we'll be admitting the Gaitanists or fascists; we could easily suspend Colombia again if they come to power. Have the Americans responded to this request at all?"\n\n"Bogotá and Washington both reached out to us yesterday," he responded, hesitantly, "and Washington seemed to be noncommittal while Colombia's still unstable, but they didn't reject the idea outright. They know our stance, and they wouldn't mention it to us if they fully wanted to reject it."\n\n[BRA.GetLeader] shook his head. "I can understand their fears, but if we stay silent for too long, then Bogotá's team will take this public and jeopardize any negotiations."\n\n"If it's uncertain, then we should privately assure the Colombians of our support. Obviously, making this public now would be a non-starter, but if we reach out to the Casa de Nariño privately, we should be able to buy ourselves enough time to swing the Americans onboard.""
  COL_USA_negotiation.20.a: "Modesty, in this circumstance, is the best policy."

  COL_USA_negotiation.21.t: "A Pleasant Nightcap"
  COL_USA_negotiation.21.desc: "The shrill ringing of the phone seemed to shake Lincoln Gordon from his stupor, his eyes open yet consciousness only returning as his limbic system sensed new stimulation. His tired eyes peered up. Had he been asleep? He looked at the report in his hands, the paper limply fallen back. 'Brazil-Africa Shipping Lane Incidents', dated to the previous three months. When was the last time he had even read a sentence? He shook his head. The barely-read report was thrust on the desk before him as he picked up the receiver. He needed to get some sleep.\n\n"Gordan? William. I don't have much time, so I'll be brief. Bogotá is very satisfied with the prospect of OAS membership reinstatement, doubly so with its public US support. The word amongst our guys is that we are on the brink of our breakthrough."\n\nLincoln smiled, placing the receiver on his other ear and balancing it with his shoulder as he reached for a notepad and pen. "Understood, thank you very much. Do you have any information on how quickly the Colombians are intending to move on this?"\n\n"Aides in the Colombian camp told associates of mine that the mood amongst their representatives is positive, enthusiastic even. From what I have seen, they are eager to move forward as soon as we are. No one outside the circle of trust seems aware of these conversations yet." Lincoln scrawled down the exact wording of his FBI man.\n\n"Noted. I shall communicate this to Washington immediately. Stand by, Mr. William, it may be a late night." Lincoln lowered the receiver with a smile, looking at the scrawled notation. His tired stupor seemed so distant now, in a second dissipated. He looked at the clock on his wall: just past two. In Washington, it was around midnight. The Secretary was probably asleep by now, or similarly beleaguered by the demands of fatigue."
  COL_USA_negotiation.21.a: "But who could turn down a nightcap such as this?"

  COL_USA_negotiation.22.t: "Shouldering Great Expectations"
  COL_USA_negotiation.22.desc: "Lincoln Gordon might have been in the offices of the American embassy in Brasília, but for the past few hours, his phone had sounded no different than if he was in Bogotá. With the United States fully rejecting the possibility of admitting Colombia back into the Organisation of American States, Pinilla had become hostile, launching into tirades at any diplomat he saw. As the phone rang, Gordon felt some concern as he picked it up.\n\n"Hello, this is Lincoln Gordon. Who is this?"\n\n"This is President Rojas Pinilla", spat the receiver, "President of the Republic of Colombia."Gordon breathlessly sighed, holding it further from his ears. "I presume this is about the negotiations on the Or-"\n\n"Yes, and I would very much like answers. We have been open to cooperation, and the compensation I've had in return is to be relegated to the stature of the rebels trying to collapse this country!"\n\n"Look, I'm not the man to ask here. I had no involvement in the deal whatsoever, you'll have to reach out to the American consulate in Bogotá for an-"\n\n"I know how powerful a man you are in Brazil. I know they were meant to come out on our behalf. I really doubt you can't push things further."\n\nGordon struggled to give an answer. He knew how bad the situation in Colombia could get, and that it could happen too quickly for him to justify letting them back in. But he knew how delicate these talks were, and knew how much progress could have been lost. "That kind of news doesn't come down to my offices until a few hours after the President gives a speech. I'm afraid you'll have to talk to diplomats elsewhere." A simple grunt was all that he received in return before the phone line shut off."
  COL_USA_negotiation.22.a: "Cold calling."

  COL_USA_negotiation.24.t: "Mirror Images"
  COL_USA_negotiation.24.desc: "It was early in the morning in the Palacio do Planalto, the warm, orange hue of the sunrise obscured by clouds in the distant horizon. Sipping from a mug of coffee, Henrique Lott took a minute to allow recent difficulties to linger elsewhere, at least momentarily.\n\n"Do you remember the days of Floriano Peixito, Henrique?" asked Jair Dantas Riberio, taking out a cigar.\n\nLott simply chuckled at the question. "I'm not that much older than you, Jair, careful with those questions," he sighed as he put down his glass, "but his legacy is still visible today. Without his careful hand guiding Brazil through those years, the Maragatos and naval officers would've torn this country apart. But why do you bring him up?"\n\n"I was just thinking," replied Riberio, turning his head to waft the smoke away, "Gustavo Rojas Pinilla. He's made a lot of progress since his coup. Bogotá's firmly under his grasp, he's internationally respected, and by the Americans, too. Give him a few years, and he could very well be the Colombian Iron Marshall."\n\nLott thought for a moment, and then shook his head. "I wish that was the case, Ribeiro. I've spoken with the man a lot, and his ambitions go far further than that. He always talks with excitement at projects in ten, fifteen, twenty years. Might even live long enough to see them finish." Clasping his fingers, Lott leant forwards. "He's too powerful to resign. Not if he can help it."\n\nRibeiro looked surprised at the development. "That is a worry, but Floriano never faced this level of strife." He took another draw for his cigar, his head remaining forwards. "Whatever happens, it's not up to us to decide his fate. The Colombians have reason standing alongside anarchy, and it's up to them to decide which direction they want to go in.""
  COL_USA_negotiation.24.a: "The mirror glistens, but does it reflect Cincinattus or Caesar?"

  COL_USA_negotiation.25.t: "Garganta do Diabo"
  COL_USA_negotiation.25.desc: "It was late at night, but the flickers of the lamp above failed to sweep away Lacerda's conscience. He looked over the documents in front of him once again, all the files on Colombia that hadn't been burnt after a single call. They repeated the same points again, discussing Rojas Pinilla's background, his coup, his government's composition, and yet he scoured them again, hoping for some new meaning. As he let one fall back onto the table, he accepted an unchanged defeat once again.\n\nColombia was, as ever, a mess. Pinilla's state had been gathering momentum, but how could he delude himself to view the violence as being over? The Gaitanists remained as dangerous as ever, striking a red dagger through the head of the Amazon. Gilberto Avedaño's forces continued to limp on, holding onto his fiefdoms in the far west and looking hungrily east. Pinilla's forces were the last ones standing for sanity against the radicalism of its opposition, an accolade that should have long earned his respect.\n\nAnd yet, his heart lingered. He had read the reports of Pinilla's ambitions, and they didn't stop at the civil war. Executions of moderate dissidents in the coup, and of journalists being disappeared for "sedition" sat uneasy. Too close for comfort for him; scarcely a decade ago, he could've easily met the same fate. The moment that the last partisan forces were swept up, he knew that Pinilla would simply secure his place as one of an assortment of dictators plaguing the continent.\n\nLacerda sighed, looking outside to watch the Moon. He had made his decision long ago. If he wanted Pinilla to be powerless, the time to ensure that had long since passed. There was more to Pinilla's regime than the man himself, and there were still a few liberals, biding their time until peace to assert their authority. With American and Brazilian backing, perhaps that regime may, in another few decades, move from an unstable dictatorship to a fractured democracy."
  COL_USA_negotiation.25.a: "The Devil went down from Georgia, looking for a soul..."

  COL_USA_negotiation.26.t: "A Dime a Dozen"
  COL_USA_negotiation.26.desc: "Bored, William flicked through a book, waiting in his apartment. It was a crime novel from the 1920s, a detective investigating murders between two Mafia families whilst vying for recognition from his boss amidst prohibition. Nothing more than a dime novel picked up from a random stall, really, but it was the first English he'd seen in weeks beyond State Department missives, and so its sheer novelty brought his gaze. Just as he turned the page, a ring came from behind him.\n\n"Hello, William?" asked Gordon, pausing only to breathe. "I wanted to tell you that your job is done. Everything's gone through."\n\nWilliam's eyes shot up. "The meeting went well, then?"\n\n"As well as you could've hoped. It'll take a few more days and a press conference to be made official, but [USA.GetLeader] agreed that Bogotá is the best faction in Colombia, and is willing to recognize their government and send aid."\n\nWilliam smiled, leaning in. "Great to hear, Gordon! I'm glad that our work has helped bring the President to the right side of the matter." He pushed his chair back slightly, and then stopped. "Is there anything I need to do before returning to Washington?"\n\n"Not yet, William. Bogotá's hold is still tenuous, and things could easily get out of hand. You're going to remain active in Colombia and in solidifying the central government's influence. I hope you understand."\n\nWilliam tried to respond, but found himself immediately hung up on. Still, he took it in his stride. He was obviously successful and had been entrusted to work further with relative liberty. With nothing else to do, he turned back to his novel, reading as the detective gave chase, and then caught the patriarch of one family."
  COL_USA_negotiation.26.a: "That'll be a pay raise for sure!"

  COL_USA_negotiation.27.t: "A Regrettable Development"
  COL_USA_negotiation.27.desc: "The ringing of the phone on his desk snapped Lott out of the work he had been concentrating on. He realized it was late enough in the day that his office had grown quite dark despite the sun still being out, and so he turned on a lamp as he picked up the phone. Lott heard his secretary on the other end. "Mr. President, the ambassador to Colombia says he has urgent news he must speak to you about. Shall I direct him to your desk?"\n\n"Send him through," replied Lott. If all went well, this could be a great boon to the future security of both the OFN and Brazil. After he heard the ambassador greet him on the other end of the line, Lott asked, "What's the status of the negotiations with Bogotá?"\n\n"The Colombians walked out, and Washington's thrown in the towel. The negotiations are over," replied the ambassador. With a tired sigh, Lott dismissed the ambassador and hung up the phone.\n\nLott couldn't say that he was entirely shocked by this outcome; he expected that the negotiations might be rocky. Still didn't make it any less frustrating that they couldn't see the forest for the trees. Nor was Lott particularly enthusiastic regarding the alternative he was now forced to pursue.\n\nWith a heavy hand illuminated only by the desklamp's dim light, Lott began drafting up a new set of orders. With Republic removing themselves off the table, the only option left would be the Gaitanists, and now Brazil had no choice but to throw its support behind their cause."
  COL_USA_negotiation.27.a: "What could have been..."

  COL_USA_negotiation.28.t: "No Good Outcome"
  COL_USA_negotiation.28.desc: "Lacerda stared blankly at the painting hanging behind his desk. It was a modernist piece of art, depicting a man holding a guitar. At the moment, the painting elicited no feelings within Lacerda. The technical work was well-executed, but the only impact the painting held over Lacerda was allowing him to not think about reality for a brief moment longer.\n\nLacerda let out an exasperated groan. The Colombians had walked away from the negotiations. There was no going back now, and the Americans would be supporting those Red Caudillos in Eastern Colombia. America and Brazil would be supporting the spread of socialism all because Bogotá had walked away.\n\nThere'd be no saviors for Colombia, the country would merely burn itself to the ground to determine which arsonists would get to rule the ashes, with Brazil and America footing the bill. The more he thought about it, the angrier Lacerda got. His temple was already throbbing, and as Lacerda realized he was going to have to explain all of this all over again to Golbery, the throbbing transformed into a full-blown headache."
  COL_USA_negotiation.28.a: "Our army supporting Gaitanists... Unbelievable."

  COL_USA_negotiation.29.t: "Out of the Frying Pan..."
  COL_USA_negotiation.29.desc: "It was deep into night, the only light coming from the Moon and emanating from the light above. Under the cover of near-total silence wrought by worry, he searched the flat for anything he had left behind. He couldn't afford to leave anything behind, at least not for the next few days. Opening a cabinet, he found a briefing on intercepted troop movements hidden within. Whatever operative was gathering the information would be damned if it came out, especially now.\n\nWhere had it gone wrong? He folded a shirt into his briefcase. Obviously, the terms had not been negotiated well. The United States couldn't just concede everything, especially to a faction within a civil war. But surely one or two more concessions wouldn't have hurt? The Colombian government was not fundamentally anathema to the United States. They could have easily negotiated down, reduced the most radical point, and survived. Did the United States really need to hold onto the San Andrés islands?\n\nThey clearly needed to now. As he made one final check through the flat, his mind was clear. Washington would publish a statement condemning Colombian action tomorrow. How long the condemnation would be depended on whether any diplomats were arrested, but it was coming. Then, they would quietly start funnelling weaponry elsewhere. The fascists of New Granada were obviously unviable, both in morality and alignment, and so the only clear alternative left was the Gaitanists of Guadeloupe Salcedo.\n\nShutting the door behind him, he debated whether or not to leave his key before choosing to keep it. They probably wouldn't go so far to check a copy of it, he reasoned. Not that they'd be able to do much anyway, even if they were. Within the day, he'd be down to Bucarramanga, and then rural Santander. There, his mediator would make contact with a group of Gaitanists, where they'd discuss terms, offer promises and, hopefully, await pickup. Creeping outside, a van honked, and he turned to enter."
  COL_USA_negotiation.29.a: "Wasting through a contingency."

  COL_USA_negotiation.30.t: "Diving into Insanity"
  COL_USA_negotiation.30.desc: "It had been a long few days, and now, the diplomat struggled in bed. Overstretched by several busy days and now struck with the flu, he could do little else but lie there, reflecting on the course of the negotiations and, when not failing to sleep, listening to the radio. Distracting him from his pain were an array of songs, news reports, and radio shows imported from the rest of the continent, all fading into a haze. As he turned channels again, hearing Lleras Camargo's voice suddenly returned his senses to him.\n\n"...olombia is a friend of freedom. We seek the common good of all, and hope to cooperate with all governments that think this way. For years, I have seen the United States in this light. Both of our countries were founded in a struggle against the colonial masters of Europe, with the goal of respecting the will of their people." He turned himself around, attentive even through his coughs. He knew that some major discussions were about to happen when he was struck off; perhaps it was that?\n\nA moment of silence was overshadowed by everything else. "But we are a proud people. Liberty means that nations are free, not simply to serve as puppets to larger nations, but to operate on their own ends. We should not be expected to respect other nations as they choose to occupy our lands. We do not respect the continued occupation of Korea by the Japanese, of Eastern Europe by the Germans, of Africa by the Italians and Iberians. And we do not respect the occupation of the San Andrés and Providen-"\n\nThe radio crackled as he turned it down, and then off, before burying his face in his hands, his mind clear once more. He had questioned the orders he'd been given for the past few weeks, but this? Lleras Camargo, from both what he'd read and seen, was the perfect man for Washington. Liberal, anti-extremist, pro-American. What would they be gaining from antagonizing him? Falling back into the bed, he dreaded returning to see through another round of negotiations."
  COL_USA_negotiation.30.a: "An ally, negotiated down to a foe."
  
  COL_USA_negotiation.31.t: "Dead to Rights"
  COL_USA_negotiation.31.desc: "Resting in his chair, Lincoln Gordon sighed. There had been a real tension in the American embassy in the last few days, and his latest meeting had only underscored that fact. The negotiations in Colombia had not been going well, as had been repeatedly condemned  since the leaks a few days ago. Being in Brasília was enough to shield him from the fury that many American diplomats in Bogotá had faced, but the icy stares and backhanded comments of many Brazilian diplomats were more than enough. As the phone rang, he didn't expect much from what came beneath.\n\n"Hello, this is Lincoln Gordon."\n\n"Mr. Gordon, this is Alberto Lleras Camargo," replied the line, in accented yet fluent English. Gordon's eyes shot up. "The ambassadors on my end are totally silent, so I wanted to ask you. Why were we barred from reentering the Organization of American States?"\n\nGordon stuttered for a moment. "Well, I, um, am not the one to ask, I'm afraid. I know we talked a bit last month about managing discussions with Venezuela and Panama, but that was in line with the Brazilian government, and I can't discuss Washington's policy without further clarification."\n\n"The same line repeated by everybody else," sighed Camargo, quickly enough not to be spoken over. "But I know you oppose this. You know that your government has betrayed their close ally and partner, and have hurt the aspirations of every Colombian on the ground. You just don't have the power to say so, do you?" Gordon struggled to speak, but his voice faltered in his mouth long enough for the line to die completely.\n\nThat had been an answer in itself, not that Gordon complained. Camargo was right, of course; he viewed the American decision as totally arbitrary. And what power did he have?"
  COL_USA_negotiation.31.a: "He just had to hope that the President wouldn't also turn his ire to Brazil."

  COL_USA_negotiation.32.t: "Portrait of a President on Fire"
  COL_USA_negotiation.32.desc: "Taking one final look through his schedule, Henrique Lott smiled. He had a few documents still to read through, but his work was mostly finished, and his schedule tomorrow would be far more relaxed. The negotiations between Colombia and the United States had concluded, and he would be given a few days to remain with both delegations, offering his presence as an adjunct to Brazilian efforts. He took the document above, and immediately took care as soon as he realized the source.\n\nFROM: PRESIDENT Alberto Lleras Camargo\nTO: PRESIDENT and GENERAL Henrique Teixeira Lott\n\nI want to thank you for the aid you have offered us. I have already made my gratitude to Brazil public, but I wanted to communicate more directly. Your career has been one of standing up for democracy against tyranny, and your pen is clearly as effective as your rifle. Thanks to you and the Itamaraty, Colombia is closer to being a free, democratic nation working alongside its Latin American brothers once more.\n\nI have one final gift for you. I understand it is unusual, but I have chosen to dedicate a portrait to you. It should take a few more days to arrive in Brazil, but I chose to personally deliver it whilst thanking the staff of the Brazilian embassy in Bogotá. I apologize for how amateurish it is; being President, I have been unable to practice my skills to the level of Francisco de Goya. However, I hope that the message of peace and cooperation still comes, even through the poor quality of my art."\n\nTurning his eyes down, he noticed a small communique written from the embassy staff, describing the painting. It was nothing much - a standing portrait of him, done freehand, next to an olive tree - but was apparently well done. As he placed down the document, he laughed, took out his flask of whiskey, and began pouring it."
  COL_USA_negotiation.32.a: "A shame, he thought, that Edna would have to be the one to receive it."
  
  COL_USA_negotiation.33.t: "Phone-a-Friend"
  COL_USA_negotiation.33.desc: "Standing impatiently, Lacerda's eyes jumped between the clock and then the phone. He was shortly to depart for an official meetingmorandum between the OFN and the Colombian government in Bogotá, but had one call first, pre-arranged in the small slot he still had free. As it rang, Lacerda jumped onto it.\n\n"Hello, this is Lleras Camargo." spoke the voice down the line. It wasn't, of course, it was a translator. He couldn't speak Spanish, and Camargo couldn't respond in Portuguese, so they arranged this as the solution. "I wanted to thank you for your support. We'd be in a far worse position without it."\n\n"It was no trouble, Alberto," replied Lacerda, warmly. "We're both rational men, and in a world like this, that brings us together. I'm glad that we could come together for this."\n\n"Considering my opposition, it's nice to have a man who knows what's right. And a former journalist? I had my time writing articles to see my President reelected, but never went into it like you."\n\n"If only I could've been so kind about my leader!" Lacerda laughed, heartily. "Alas, when I started, it was Vargas or nothing."\n\n"Well, if I was in Brazil now, I definitely wouldn't be so critical of my President." He sighed, as though releasing years of anguish, before continuing. "Decades after the memories of this war fade away, I know that Colombians will still repeat your name as our hero. You have it in you to be the hero for the rest of our continent."\n\nLacerda offered his thanks, before being forced to end the call as a staffer burst in. Taking a moment to hover after hanging up, a smile kept creeping onto his face. Brazilian troops may not have been marching over Mt. Fuji or into the Volkshalle, but in his own way, he had helped to bring liberty to a dark corner of the world."
  COL_USA_negotiation.33.a: "Orden y Progreso"

  COL_USA_negotiation.Lleras.tt: "Lleras is a skillful and pro-§mAmerican§! diplomat, reducing our £political_power_texticon costs."
  COL_USA_negotiation.Pinilla.tt: "Pinilla is a staunch §fnationalist§!, increasing our £political_power_texticon costs."

  ###Volunteer Event
  COL_Volunteer.1.t: "Colombia Sends Volunteers!"
  COL_Volunteer.1.desc: "Good news come to the front today as the Colombian Government has announced its intentions to assemble and ship a battalion of volunteers to aid us in the Civil War, alongside several shipments of food rations and combat equipment of our own make that they received for their own conflict.\n\nWhile the Colombian troops may not be many, they will be loyal to our cause and more importantly, battle-hardened from the decade of fighting which ravaged their homeland since the 50s. The news were well-received among the General Staff, with a few officers having warm reunions and the notion that, even if the Union may be dead, the connections our nation has built these past few decades still live on has brought hope to our soldiers.\n\nWe can only hope our other allies remember who stood by their side and join us in this national struggle."
  COL_Volunteer.1.a: "Together, one more time."

  ###WORLD Events
    #Pre-War Republic
    COL_News.3.t: "[Get_newspaper_header]Rojas Pinilla Deposes Colombian Government!"
    COL_News.3.desc: "The ongoing political crisis in Colombia has reached its finale as General Gustavo Rojas Pinilla, with the apparent unanimous support of the armed forces, has couped the government and formed a nationalist coalition following the passage of the PCC's Corporatist Constitution.\n\nThe General has indefinitely suspended elections and outlawed both of Colombia's traditional parties, forming the MAN in their stead with inspiration from Mexico's PRI. Surprisingly, internal opposition has already begun to collapse with leading figures fleeing the country for Iberia and many doubting their capabilities to organize a return.\n\nDuring his inaugural speech, General Pinilla has promised to restore order to Colombia by any means necessary. With ultimatums sent to the rebel government within the day, it seems Colombia is heading towards war once more.\n"
    COL_News.3.a: "From the Athens of South America to Sparta."

    COL_News.4.t: "[Get_newspaper_header]Colombia's New Despot"
    COL_News.4.desc: "It appears General Rojas Pinilla has finally lived up to expectations. Today, the General declared Martial Law and announced the creation of a Security Council composed of the nation's top military commanders, all of whom bear loyalty to Pinilla, to oversee the reunification of the nation.\n\nThe announcement came following the refusal of all insurgent groups to stand down. With the implementation of mandatory conscription and the ramping-up of its industry, it is clear that the Republic's primary goal in the following years will be reacquiring these territories by force.\n\nWhile General Pinilla has stated the measures will be suspended after Reunification, many observers have expressed doubts. The announcement spurred protests in several cities but it appears the public mood is favorable, with many supportive of the Government's decisive action plan, for the time being that is.\n"
    COL_News.4.a: "Caesar, or perhaps yet Cincinnatus."

    COL_News.1.t: "[Get_newspaper_header]The Conservative Party Holds in Colombia"
    COL_News.1.desc: "The years since Laureano Gómez's death have been stormy for the Conservative regime in Colombia. However, the recent passing of the new constitution via the national constituent assembly and the pacification of rogue military elements seem to have stabilized the party and government, ending internal violence and allowing them to solidify their control over Bogotá and its surrounding territories.\n\nOut of the crisis emerged a strengthened President Urdaneta, who has announced his intention to bring peace and unity to the country under the civilista banner. He has also made some favorable hints toward Germania, as was expected of a man of his character."
    COL_News.1.a: "Will they be the force that decides? "

    COL_News.2.t: "[Get_newspaper_header]Hardline Conservatives Deposed in Colombia"
    COL_News.2.desc: "The five year deadlock has finally ended in Colombia, with opposition forces ousting the Laureanist dictatorship and purging its elements.\n\nThe new government, a coalition of the Liberal Party and moderate Conservatives, has announced that elections have been scheduled to take place within the following months. Many expect the already weakened moderate Conservatives to be mere satellites to the Liberals.\n\nThe interim President Alberto Lleras Camargo has also announced overtures towards the OFN and a willingness to negotiate a peaceful end to the Colombian Conflict."
    COL_News.2.a: "Democracy may have been returned to Colombia, but is it enough to prevent a civil war?"


    COL_News.5.t: "[Get_newspaper_header]The First Elections of the National Front"
    COL_News.5.desc: "The 1964 Colombian elections, scheduled by the interim National Front government following the recent ousting of the Laureanist Government, have concluded today with the victory of the Interim President of Colombia Alberto Lleras Camargo of the Liberal Party.\n\nLleras Camargo has promised an ambitious reformist agenda, which includes everything from decentralization by creating new forms of local governance to the promotion of a new industrial base for the reconstruction of the country, while including plans for labor, bank and healthcare reform. The new President is also notably interested in restoring trade and diplomatic relations with the United States.\n\nThe Conservative Party, which did not nominate a candidate in the election, has recognized the result of the election and promised to cooperate with the Liberals and help bring forth a new dawn for the country.\n"
    COL_News.5.a: "And so Colombians dare to hope once more."

    #US-COL Negotiations 1964
    COL_News.6.t: "[Get_newspaper_header]Colombo-American Negotiations Begin" #Unused
    COL_News.6.desc: "Facilitated by Brazil, the United States and Colombia have begun a series of talks aiming to restore amicable ties. Relations broke down in the mid-50s following nationalizations of American firms under the previous, Germanophilic Laureanist government, with Washington recalling its ambassador in protest.\n\nThe negotiations could prove pivotal for the new Colombian government, which is seeking international support and internal legitimacy to resolve La Violencia, an ongoing low-level civil war. Nevertheless, Bogotá will be hard-pressed to settle issues like German relations, the fate of the nationalized businesses, and the return of the U.S.-occupied island of San Andrés without domestic backlash."
    COL_News.6.a: "Latin America holds its breath."
    
    COL_News.8.t: "[Get_newspaper_header]The Renewed Spirit of Mallarino-Bidlack"
    COL_News.8.desc: "In what seems to be the best outcome, the negotiations between the United States and the Republic of Colombia have concluded with a nigh-perfect agreement between the parties involved, a movement that, after the Civil War, seems to return the time to the fresh start that the Mallarino-Bidlack Treaty signified in 1854.\n\nIn the final resolution, the United States and Colombia have agreed to cooperate in commercial affairs, reintegrating Colombia to the inter-American system of diplomacy and committing to not interfere or significantly hinder the other's interests, settling the bases for effective normalization and the return of permanent diplomatic missions to Washington DC and Bogotá respectively.\n\nOptimism has risen as the implementation of the agreements moves forward and a historically friendly relation blooms after decades in the shadows.\n"
    COL_News.8.a: "Off to a fresh start"

    COL_News.7.t: "[Get_newspaper_header]Colombia and the United States Agree on the Fundamentals"
    COL_News.7.desc: "An agreement has been reached in the aftermath of the negotiations between the governments of the United States of America and the Republic of Colombia, although it seems that despite the efforts from both sides to achieve common goals, the recent wounds in bilateral relationships and the tensions of the past decade have hindered the opportunity of full reconciliation.\n\nThe basis of this attempt at reconciliation began when the change in administration in Colombia turned more favorable to the United States and the diplomatic climate after the civil war became adequate enough to push for a solution, albeit an underwhelming one for the time being.\n\nFor now, as both governments have resolved to stand up from the dialogue table, no further conditions will be agreed on or discussed. However, many see this move as positive for the position of democracy and stability in the region.\n"
    COL_News.7.a: "Still, better than nothing"

    COL_News.9.t: "[Get_newspaper_header]United States-Colombian Negotiations Succeed"
    COL_News.9.desc: "Talks concluded successfully between Bogotá and Washington today, with both thanking Brazil for facilitating the meetings. Relations between the two broke down in the mid-50s following nationalizations of American firms under the previous, Germanophilic Laureanist government. The return to amicable ties marks a triumph for the new Colombian government, with the U.S. embassy soon to be re-established.\n\nThe agreement is expected to upend the dynamics of La Violencia, the civil conflict that has plagued Colombia for years. The invigorated central government anticipates greater access to American arms, while Supreme Commander Salcedo of the Colombian Revolutionary Union rebels has decried the reconciliation as "a betrayal of the will of the Colombian people.""
    COL_News.9.a: "A partnership restored."

    COL_News.10.t: "[Get_newspaper_header]United States-Colombian Negotiations Collapse"
    COL_News.10.desc: "Talks between the U.S. and the Bogotá government in Colombia have broken down, with each side accusing the other of obstinance. Brazilian officials, who had facilitated the negotiations, expressed disappointment that the two former partners were unable to "overcome the legacy of the Laureanist era" and achieve reconciliation.\n\nOther parties in La Violencia, Colombia's long-running civil conflict, are overjoyed. Supreme Commander Salcedo of the Colombian Revolutionary Union rebels issued a statement that "the North Americans have recognized the folly of engaging an illegitimate government against the wishes of the Colombian people." Alzate of New Granada attacked Bogotá's "willingness to sell our nation to foreign foes, and incompetence at doing even that.""
    COL_News.10.a: "A decade's damage is not easily set aside."

    #Civil War Events
    COL_News.11.t: "[Get_newspaper_header]The Liberal Reunification"
    COL_News.11.desc: "Outstanding news from Colombia today as the FN Government has announced the success of negotiations for the peaceful reunification of the Revolutionary Front with the Republic.\n\nThe Lleras government has promised amnesty for many within the Front and permitted elements to join the Colombian Armed Forces. Politically, the move guarantees a left-ward shift in the Liberal party and a the revival of Gaitanist policies within the party mainstream.\n\nThe popular reaction to the announcement has been very positive, especially from the OFN who has promised to help the new coalition rebuild. Many have likened this outcome to a new Marching Revolution like that of President Pumarejo in the 30s.\n\nTensions with the right of the political spectrum have risen drastically as a result, though few expect New Granada could pose a threat to this new union.\n"
    COL_News.11.a: "The effect of respect for mutual rights"

    COL_News.12.t: "[Get_newspaper_header]A New Contender in Colombia"
    COL_News.12.desc: "Shocking news have emerged from Colombia today as a new contender in La Violencia appeared. The Second Patriotic Army, capitalized on the weakness of the Bogotá Government and seized the northern city of Barranquilla and much of the North.\n\nThe Second Patriotic Army is comprised of the remaining forces loyal to the Laureanist which were ousted from power in 1962. The SPA's leadership is staffed by pro-German cadres, with one of the SPA's key advisors being rumoured to have worked with the Abwehr and many others bearing ties to the German community.\n\nDue to the Government's unpopularily in a region known as "Colombia's festering wound", the growing momentum of the SPA should not come as a surprise.\n"
    COL_News.12.a: "The Laureanists strike back."
    COL_News.12.b: "The Reich shows its hand."

    COL_News.13.t: "[Get_newspaper_header]Colombian Civil War Resumes"
    COL_News.13.desc: "The armed peace in which Colombians have lived since a ceasefire was agreed in 1956 has ended as the three struggling factions, the Central Government, the Colombian Revolutionary Union, and New Granada have resumed their war operations following the escalation of the brutal skirmishes for control of northern Colombia. The rise of the Second Patriotic Army and their sudden takeover of the Atlántico department has only further destabilized the region.\n\nWhat is to become of Colombia now is not known, but with the warring factions throwing peace out of the window motivated by hatred, desperation, and greed, the country has been violently returned to the bloodshed of the 50s. And as the bodies begin to accumulate in the mountains, streets, and jungles, it might come the day when people look back at La Violencia as a better time, as none is safe from the looming threat of death and the outreach of armies and militias across the scorched land.\n"
    COL_News.13.a: "A peaceful solution always seemed impossible to begin with."

    #Victory Events
    COL_News.14.t: "[Get_newspaper_header]Government Victory in the Colombian Civil War"
    COL_News.14.desc: "The Colombian Liberal Party has come a long way since the start of the decade. Where it was once expected to fade into the long and troubled history of Colombian politics, it has miraculously recovered against the exhausted conservatives and achieved the impossible: restoring the rule of law and ending the Violencia by reclaiming Colombia from all opposition through military action.\n\nUnder President Lleras Camargo, the government has promised to restore democracy and normalcy via reforms while also pledging to protect those values abroad. By doing so, they hope to ensure that the lessons of the Colombian Civil War are understood and that the tragedy may never repeat."
    COL_News.14.a: "May they all live better."

    COL_News.15.t: "[Get_newspaper_header]Government Victory in the Colombian Civil War"
    COL_News.15.desc: "Gustavo Rojas Pinilla, nicknamed the "Caesar of the Andes" by his soldiers, has crossed the Rubicon and ended the Violencia after seizing power from the nation's old government elites and crushing all opposing factions on the battlefield. While some insurgents have refused to give up the fight, the general has vindicated his failed campaigns in '56 and '57; his promises of stability and social justice have swayed the masses.\n\nWhile emphasising Colombian independence from foreign influence, the Generalissimo has not forgotten those who stood at his side, such as the Mexican ambassador at his victory speech, implying plans for a closer relationship with their northern neighbor."
    COL_News.15.a: "Order has been restored to the Andes."

    COL_News.16.t: "[Get_newspaper_header]Government Victory in the Colombian Civil War"
    COL_News.16.desc: "Colombia's political hegemon, the Conservative Party, has persevered over its opposition once again. Its sole leader, Roberto Urdaneta, the viceroy to Laureano Gómez, announced a final victory over the Republic's enemies, reversing the government's losses from the previous years of turmoil and bloodshed.\n\nAlthough the party has maintained its status as the political hegemon of Colombia and preserved its course, much remains uncertain for the party. There is no clear answer as to whether victory will reshuffle the government or if Urdaneta's continuity is out of question. Regardless, the country's radical transformation into a dictatorship of tradition, powered by a growing industry, is becoming more evident to international observers."
    COL_News.16.a: "The force that decides, indeed."

    COL_News.17.t: "[Get_newspaper_header]Revolutionary Victory in Colombia!"
    COL_News.17.desc: "The URC's triumph over the myriad opposing forces in Colombia's long-running civil war was celebrated today with a march down Bogotá's cobblestoned streets. Once rag-tag revolutionary troops displayed discipline as residents of the city assembled to greet them with music and steaming bowls of changua and ajiaco.\n\nThe parade culminated in the Plaza de Bolívar, where, framed by mountaintops and the Palace of Justice, Supreme Commander Salcedo announced that he would be stepping down in three months' time and that a People's Cabildo would then administer free elections. He hailed the sacrifices of his troops, the Colombian people, and that of Gaitán, whose assasination Salcedo claimed was avenged at last."
    COL_News.17.a: "The idealists have won the war, can they win the peace?"

    COL_News.18.t: "[Get_newspaper_header]New Granada Wins the Colombian Civil War"
    COL_News.18.desc: "The Colombian Civil War has finally come to an end today as the New Granadan government led by "Duce" Gilberto Alzate Avendaño declared victory earlier this morning. The Cali-based government has been supported by the Italian Empire since the beginning of the conflict, and the Italian government has issued their congratulations to Avendaño.\n\nAt his address today, Avendaño declared that "the New Granadan State will bring new and old glories" to the Colombian people. Avendaño's government has already begun to implement corporatist policies inspired by Italy and Japan's own policies.\n\nThe big tent coalition of other far-right parties seems to be a fragile one, with political disagreements already flaring up over issues of policy, including minor ones such as the changing of the country's name to New Granada.\n"
    COL_News.18.a: "That's our man!"
    COL_News.18.b: "They'll collapse in a week... surely?"
    COL_News.18.c: "An old name breathed new life."
    COL_News.18.d: "Would Bolívar want this?"

    COL_News.19.t: "[Get_newspaper_header]Second Patriotic Army Victory in the Colombian Civil War!"
    COL_News.19.desc: "Troubling news comes from Colombia as the dust settles from the civil war with the Second Patriotic Army as victor. Composed of the PCC's most far-right cliques, the Laureanists, led by Alfonso Uribe Misas, and José Camacho Carreño's Nacional-Americanista Movement, the SPA victory represents a worrying departure from the previous governments compromise politics.\n\nMore troubling than their totalitarian politics and unrepentant germanophilia, the new government inherits a nation devastated by two decades of Civil War. The prospects for reconstruction and the government's ability to stabilize the country, in light of the continued insurgencies and political infighting, are grim."
    COL_News.19.a: "Our work has only begun."
    COL_News.19.b: "La Patria Boba."
     
    #COL Post-War
    COL_News.20.t: "[Get_newspaper_header]The Basilisk's Heir Takes the Reins"
    COL_News.20.desc: "Important news from Colombia today as President Roberto Urdaneta has announced his retirement. Urdaneta will be remembered for leading the PCC ever since the death of its primarch, Laureano Eleuterio Gómez, during the late 50s and for presiding over the reunification of the country.\n\nThe announcement has been received positively, primarily due to his decision to confirm Gómez's son, Álvaro as the new President. Álvaro is known for his reputation as a more moderate figure, especially in comparison to the arch-conservative reputation of his father. Notably he is also less enthusiastic about the PCC's overtures to Germania, with many expecting him to work towards reversing such developments during his term.\n\nÁlvaro's leadership is likely to bring moderation to the PCC's rhetoric. Though it is undeniable it will remain unchallengeable.\n"
    COL_News.20.a: "May he bring peace and stability to his father's empire."
    COL_News.20.b: "How moderate can a monster's prodigy really be?"
    COL_News.20.c: "He best not forget who won him the Civil War."

    COL_News.21A.t: "[Get_newspaper_header]Gómez's Reforms Survive the Senate"
    COL_News.21A.desc: "President Álvaro Gómez Hurtado successfully passed his landmark reform package through the Colombian Senate earlier today, hailing the legislative achievement as "clearing the way for new development." Political observers had been skeptical that the bill would pass, as multiple Senate hardliners, many of whom had life-tenure in the Senate, had expressed their dissatisfaction with the proposal. Those doubts appear to have been overstated, as the party expressed their broad support for the bill and it passed well above the threshold of success.\n\nThe new reform package has permitted local elections and restored the position of the Vice Presidency. The bill also mandated a minimum wage to address poverty while maintaining Catholicism as the state religion, calling on all Colombians to renew their faith and love for their fellow man in the wake of the brutal civil war.\n"
    COL_News.21A.a: "With open hands and faithful hearts."
    COL_News.21B.t: "[Get_newspaper_header]Gómez's Reforms Fail in the Senate"
    COL_News.21B.desc: "Colombian President Álvero Gómez's proposed reforms have failed following fierce opposition from the Senate. Coming to power with the Conservative party, Gómez's proposed reforms attempted to democratize and streamline the central bureaucratic apparatus, with a reintroduction of the Vice President and local elections being some of the proposed reforms.\n\nWith the death of the reforms, Gómez faces a tight battle to negotiate with hardliners within his party, with some observers speculating that he may need to compromise on Cabinet positions or on critical policy decisions. As many of his political opponents are reaching mandatory retirement age, Gómez may be hoping to wait for a more advantageous political position to advance his reforms."
    COL_News.21B.a: "Such is democracy."

    COL_News.22.t: "[Get_newspaper_header]General Pinilla Appoints Salazar García"
    COL_News.22.desc: "With Lozano and Pabón failing to reach a successful compromise for the leadership of Colombia, the constitutional majority in the Constituent Assembly favored Elías Salazar García, the head of the NCL, Colombia's sole legal trade union since 1956 as the new minister of government. \n\nA friend of General Pinilla, they first became acquainted in Cali during Salazar García's time as an agitator. Since then, through infusing Colombian nationalism with the worker's movement, he made himself the main labor organizer in the western regions. As he fled alongside loyalists during La Violencia, he became the general's favorite in dealing with labor relations. Known for a tendency of erratic actions and having expressed a desire to dissolve the CED, combined with a lack of qualms against violence, many business owners are making exit plans as he comes to power.\n"
    COL_News.22.a: "Just don't shoot the dog."

    COL_News.23.t: "[Get_newspaper_header]The Death of Gustavo Rojas Pinilla"
    COL_News.23.desc: "Former Colombian leader, Gustavo Rojas Pinilla, was announced dead after an alleged air accident thirty miles north of Bogotá. Rumor has it that Pinilla, fearing a loss of power after growing conflicts between the general and minister Salazar García over low export prices, was allegedly heading to exile in Mexico before the plane had crashed. At the accident, Salazar García offered no comment on the matter. The government has yet to issue a statement on if they believe foul play was involved.\n\nHours after the death of Gustavo Rojas Pinllia, a proclamation announcing the Authentic Socialist Alliance as the sole ruling party was made official, coupled with the nomination of Salazar for the role of inteurim, and most likely perpetual president."
    COL_News.23.a: "Has luck never smiled at Colombia?"
    COL_News.23.b: "Scheming socialists strike again."
    COL_News.23.c: "Colombia's chasms widen."

    COL_News.24.t: "[Get_newspaper_header]The National Constituent Assembly is Convened in Colombia"
    COL_News.24.desc: "Following Colombia's recent victory in its civil conflict, General Pinilla has convened the National Constituent Assembly as promised and through which begins a transference of the Security Council's emergency power back to civilian control. Initially intended to be summoned before the war, it has been delayed until present due to the declaration of a state of siege that rendered control to Pinilla's council.\n\nSeeing a return to normalcy for the most part, the assembly is set to revise many laws, including the constitution, in the following meeting. More importantly, it is during this time that Pinilla's successor shall be chosen by the National Assembly representatives, marking a return of democratic rule.\n"
    COL_News.24.a: "Can't make an omelette without cracking some eggs."

    COL_News.25.t: "[Get_newspaper_header]General Pinilla Appoints Lozano"
    COL_News.25.desc: "The military rule in Colombia comes to an end as General Pinilla signs the new constitution under popular vote in the assembly, with Juan Lozano y Lozano chosen as the new minister of government, prompting an immediate transition of power as promised before by the general. As the leader of the restored Patriotic National Economic Action, or APEN for short, Lozano y Lozano had managed to become a darling for businessmen and liberal intellectuals alike, and during La Violencia, acted instrumentally in Pinilla's power brokering.\n\nChosen from a compromise with Lucio Pabón, Lozano y Lozano has earned a poor reputation as a mouthpiece for corporate backers such as Julio Mario Santo Domingo. However, given his experience in wrestling the CED before, though a rather controversial candidate, he may just be able to bring about a promise of national prosperity unheard of for decades.\n"
    COL_News.25.a: "It pays to be patient."

    COL_News.26.t: "[Get_newspaper_header]General Pinilla Appoints Pabón"
    COL_News.26.desc: "The assembly has made its will clear as voting for the new constitution ends, with General Pinilla accepting the confidence vote and appointing Lucio Pabón as minister of government. As leader of the National Action Movement, sponsored primarily by the traditional establishment, Pabón won Pinilla's trust during La Violencia through his unusual economic acumen, notably for drafting the recovery initiative known as the "Three-Year Plan," likely to be soon implemented as he shall assume office.\n\nBehind the scenes, Pabón's appointment was tenuously kept through compromises with Juan Lozano y Lozano, who agreed to break the assembly's gridlock in exchange for a secondary administrative role over the next four years. Though expected, many insiders note this uneasy alliance may soon fall apart with Elías Salazar out of the picture.\n"
    COL_News.26.a: "A house of cards standing on stilts."

    COL_News.27.t: "[Get_newspaper_header]Carlos Lleras Restrepo Elected New President of Colombia" ## Event is over 1000 chars
    COL_News.27.desc: "The Colombian Liberal Party has declared victory after running an unopposed contest in the 1968 legislative elections. Following the collapse of the Conservative Party's leadership, the Liberal Party was the sole legal party standing in the election. After a fierce leadership struggle, Carlos Lleras Restrepo, the former leader of the dissident caucus, will replace his distant cousin Alberto Lleras as the President. The new President cheerfully addressed his supporters following the announcement of his victory, promising to maintain peace in Colombia and provide relief to regions and peoples devastated by the recent civil war, with the hope of restoring democracy in Colombia's near future.\n\nOutside observers express doubt in President Lleras's policy direction, believing that he will be unable to maintain peace without increasing police powers and runs a risk of inflation due to his monetary policy, but the President was able to secure the support of the Liberal Party, and he hopes to similarly win the support of his people.\n"
    COL_News.27.a: "Can the white dove carry a red rose?"

    COL_News.28.t: "[Get_newspaper_header]Hernando Durán Dussán Elected New President of Colombia"
    COL_News.28.desc: "The 1968 Colombian legislative elections have finally concluded to find a surprising result. While the Liberal Party was expected to secure an overwhelming victory due to conservative disarray, many independent legislators secured seats in the Constituent Assembly. The Assembly has named Hernando Durán Dussán, once exiled from Colombia due to his political activism, as the new President of Colombia.\n\nThe President stated that he would fulfill a democratic mandate for Colombia, ending political persecution, and securing the return of those who were exiled for political purposes. He also promised a new economic platform, reducing the state's role in industrialization and dismantling corporatist structures. Opponents decry his economic platform, stating it will increase poverty and inequality, but the President was undeterred, stating that political freedom requires economic freedom.\n"
    COL_News.28.a: "Liberate the mind, liberate the market, and you liberate the people."

    COL_News.29.t: "[Get_newspaper_header]Alberto Lleras Camargo Resigns" 
    COL_News.29.desc: "Following "an exhaustion of political capital", President Alberto Lleras Camargo has informed the country this morning of his intention to step down. Longtime leader of the Liberal party and the man credited with signing the Havana Peace Accords with the insurgents of the Colombian Revolutionary Union, Lleras has announced that the functions of the presidency will be held by Julio César Turbay, standing president of the Senate, until elections can be organized in the coming months.\n\nLleras' announcement comes as little surprise, as plans for a transition to full democratic rule were outlined at the signing of the peace accords. Contrary to the predictions of those who believed Liberal rule would lead to anarchy, this development seems to reveal the surprisingly rapid stabilization of Colombian institutions and political life."
    COL_News.29.a: "Democracy rises from the ashes."
    COL_News.29.b: "An impressive political development."
    COL_News.29.c: "One president or another, Colombia remains bound by degeneracy."
    COL_News.29.d: "They have actually done it. "

    # Recontinuation of COL events - Frosty
    COL_News.67.t: "[Get_newspaper_header]The July Conspiracy Comes to Light"
    COL_News.67.desc: "Following a worsening conflict between Lucio Pabón and Juan Lozano y Lozano, culminating in a series of contradictory messages turning into complete silence over the past week, the details of what has now been dubbed the "July Conspiracy" have come to light. The most direct result of the conspiracy has been the resignation of Pabón from all government positions and the dissolution of his National Action Movement, leaving APEN to head the Colombian government on its own.\n\nWith these events, it seems that APEN and business leaders have succeeded in pressuring Pinilla into allowing them to establish a new oligarchy, with industry leaders playing an outsized role in the reshaping of the regime. It is now expected that the reforms already promulgated during the reconstruction process will pick up steam, and that the growing caste of industrialists will further expand its operations.\n"
    COL_News.67.a: "The General-engineer's great project continues."
    COL_News.67.b: "He has succumbed to the grip of international finance."
    COL_News.67.c: "Reconstruction, but at what cost?"

    COL_News.68.t: "[Get_newspaper_header]Pabón Denounces the July Conspiracy"
    COL_News.68.desc: "The brewing political crisis in Colombia came to a head this week, following a worsening conflict between Lucio Pabón and Juan Lozano y Lozano and growing fears of a government collapse. In a hastily-organized press conference, Pabón had announced the shocking news of Lozano's arrest and the outlawing of his APEN party, for attempting to stage a coup against the government.\n\nWhile it seems that the business magnates known to be connected to APEN have so far escaped any direct consequences, the ousting of their front party likely means that a second three-year-plan is in order, and that it will come at the expense of their political power. The free-market reforms already promulgated by the government during the reconstruction process have not currently been repealed, but few expect them to pick up further steam now."
    COL_News.68.a: "It seems that Colombia needs a steady hand."
    COL_News.68.b: "Their petty squabbles will doom them."
    COL_News.68.c: "At least there wasn't a civil war this time..."

    COL_News.69.t: "[Get_newspaper_header]General Strike in Colombia"
    COL_News.69.desc: "Following weeks of upheaval from the Oil Crisis, the National Confederation of Labors have launched a nationwide strike under interim leader Tulio Cuevas Romero. Colombia, already having been weakened from the Oil Crisis, is now seemingly paralyzed as the nation comes to a halt. The government under Pinilla has ordered police and armed forces into the streets to end these strikes and arrest any agitators.\n\nQuestions surround the involvement of former union leader Salazar García as well as Pinillas current position as his government is weakening as these crises continue."
    COL_News.69.a: "Another nail in the Colombian coffin."
    COL_News.69.b: "Can the general fight back?"
    COL_News.69.c: "They can't catch a break."

    COL_News.70.t: "[Get_newspaper_header]Elías Salazar García Executed in Army Putsch"
    COL_News.70.desc: "Following weeks of paralyzing strikes and increasingly severe conflicts within the government of Colombia, reports indicate that the army has finally decided to intervene. This morning, the Presidential Guard and the 13th Brigade marched on the national capitol, closing the restored congress of the republic.\n\nAny lingering doubts about the authority behind the lockdown were dispelled by a broadcast of General Pinilla in the CATAM airbase, where he denounced the strikers as Salazar's lackeys, intent on toppling the republic and its government. He has announced the restoration of the Security Council, the dissolution of the CNT, and the death of Salazar, who many believe was summarily executed by members of the F2 department in his own home."
    COL_News.70.a: "The Caesar of the Andes, true to his name."
    COL_News.70.b: "Once more the folly of National Syndicalism is proven."
    COL_News.70.c: "Another failure of Military Socialism."

    #URC Post-War
    COL_News.30.t: "[Get_newspaper_header]The Revolutionary Cabildo of Colombia is Inaugurated"
    COL_News.30.desc: "Commander-in-chief of the Revolutionary Armed Forces and interim head of state of Colombia Guadalupe Salcedo Unda has stepped down from his position.\n\nIn accordance with the Basic Law, the socialist revolutionaries now ruling Colombia have moved one step closer to creating a formal governance structure by declaring the establishment of a Revolutionary Cabildo, or governing council.\n\nElections for the legislature and constituent assembly are to begin soon. During the next year, representatives from all of Colombia will meet in Bogotá to discuss the articles of the Union's constitution and hammer out the legal framework of the Republic."
    COL_News.30.a: "May consensus reign among revolutionaries."

    COL_News.31.t: "[Get_newspaper_header]Gaitanistas Victorious in the Cabildo"  #REWRITE NEEDED
    COL_News.31.desc: "The elections to the Revolutionary Cabildo of Colombia have returned a result—that the adherents of the late caudillo Jorge Eliécer Gaitán will have won the majority in both the constituent assembly and the Cabildo.\n\nThe Gaitanistas of the MRL are expected to continue the late Caudillo's grand vision for a fair republic driven by ideals of mutual respect and social justice. While accusations of voter suppression and electoral fraud may have soured the mood in the Capital, it seems much of the population is still celebrating, which should be no surprise with to the Caudillo's popularity.\n\nWhile the OAS has refused to comment on the allegations, OFN delegations across Bogotá have joined in the celebrations and many expect this victory to represent the practical accession of a new member to the grand alliance of the free world.\n"
    COL_News.31.a: "Can they live up his legacy?"

    COL_News.32.t: "[Get_newspaper_header]Democratic Front elected in Colombia"
    COL_News.32.desc: "Church bells ring out throughout Colombia as the elections for the first constituent assembly and Cabildo yield their result, a victory for the Frente Unido del Pueblo, a coalition of socialist parties which refused to submit to the MRL.\n\nThe Coalition, led by Camilo Torres's Christian Socialists, has promised to uphold democratic practices and ensure the church an active role in the preservation of revolutionary triumphs and protocols through the doctrine of 'efficient love'.\n\nWhile many on the right denounced his socialist tendencies as a perversion of Catholic ideals, Torres' leadership has been widely endorsed across the country, especially since the opposition had been hit by allegations of voter suppression and electoral fraud."
    COL_News.32.a: "Christian Revolutionaries? That's something new."

    COL_News.34.t: "[Get_newspaper_header]Communists Storm the Capitol in Colombia"  #REWRITE NEEDED
    COL_News.34.desc: "Shocking news from Colombia today as Communist paramilitaries have stormed the Revolutionary Cabildo and removed the provisional government from power.\n\nTensions between the Communist Party and the Government had been running high ever since the decision to ban them from the upcoming elections and it seems that the recent reports of voter suppression and electoral fraud in multiple regions were the last straw for their cooperation.\n\nIn his inaugural speech, the new president, Viera White, has promised to free the Colombian proletariat from its chains and restore a free and democratic Colombia. Furthermore, the President denounced the United States and OAS for ignoring the so-called clear signs of undemocratic practices in the elections."
    COL_News.34.a: "Colombia, a pariah once more."

    COL_News.33.t: "[Get_newspaper_header]Gridlock in the Cabildo"  #REWRITE NEEDED
    COL_News.33.desc: "Alarm in Bogotá as elections to the Revolutionary Cabildo and constituent assembly have resulted in total gridlock, with no faction having enough representatives even to command a decisive plurality. The new assemblies, having sat down, are increasingly descending into acrimony.\n\nHostile intra-fraction rhetoric has destabilised the coalition. The prior rivalry between Gaitanistas and Communists has been inflamed, and has led to groups of supporters of both factions fighting in the streets of Bogotá and other major cities.\n\nIt is commonly feared that the upcoming result, whatever it is, may result in tragedy for the young revolutionary republic."
    COL_News.33.a: "Uncertainty sprawls from revolution."

    COL_News.35.t: "[Get_newspaper_header]Anti-Communist Coup in Colombia"
    COL_News.35.desc: "It seems tensions in the new Republic of Colombia have once more boiled over as the military, led by Rafael Navas Pardo has violently couped the government and established a "temporary" dictatorship to restore order.\n\nCiting undemocratic practices and and the empowering of dangerous radicals as the reasons for the coup, many believe the military's distrust of socialists and communists as the true reason for the coup. Clashes have taken place around the country but resistance efforts struggle to match the might of the organized military response.\n\nThe leader of the new Junta is the well-known marshal of the FR's Rebel forces during the war, a Pro-Gaitanist figure with a reputation for discipline, General Navas has promised a return to democracy following a brief decommunization period and renewed international ties.\n"
    COL_News.35.a: "Action, and now, reaction."
    COL_News.35.b: "Nothing more democratic than a military dictatorship."
    COL_News.35.c: "The Prodigal Son Returns... again."

    COL_News.36A.t: "[Get_newspaper_header]Alfonso López Michelsen Declares State of Siege"
    COL_News.36A.desc: "It seems that the last few years were built on a false hope. In the wake of a major political crisis, and with claims of clientelism and corruption spreading across Colombia, many observers feared that a wave of protests would erupt. These have been disproven, but only with President Alfonso López Michelsen announcing the implementation of martial law, and the adoption of emergency powers.\n\nThe move, which has suspended the rights to protest, the People's Cabildo of the Republic and has implemented a curfew from 8:00PM, has been vociferously attacked in what channels still survive by the Liberal Revolutionary Movement and the National Workers' Confederation, labelling these moves as tantamount to a coup. Surprisingly, Colombia's partners have not issued a statement in response, but the army's presence on the streets and the mass arrests of political dissidents proves one thing:\n"
    COL_News.36A.a: "Once more, the dream of Gaitán lies dead."
    COL_News.36B.t: "[Get_newspaper_header]The Colombian Military Junta Steps Down"
    COL_News.36B.desc: "Once again, the balance of power shifts in Colombia. The short-lived government of military junta of General Rafael Navas Pardo has announced the end of the reconstruction period and the appointment of Alfonso López Michelsen as President, with power returning to a greatly weakened People's Cabildo, alongside the end to emergency measures such as the curfew system.\n\nWhilst supported by many surviving political parties, Michelsen remains a controversial figure, and his presidency threatens to inflame tensions and further divide the country. The allegations of corruption and his strong ties to the military as well as endorsement by the old Liberal Party paint a grim picture during times of an already growing insurgency, with the whereabouts of most opposition leaders still uncertain.\n"
    COL_News.36B.a: "Those who make peaceful revolution impossible..."

    COL_News.37.t: "[Get_newspaper_header]Gilberto Vieira White Confirmed in 11th Congress of the Colombian Communist Party"
    COL_News.37.desc: "Following the takeover of the Colombian Revolutionary Union and a purge against the army, the 11th Congress of the Colombian Communist Party has been convened, marking the first time the party has been in power. During the congress, party delegates drafted a new constitution and gave a vote of confidence to the Standing General Secretary and Chairman of the Central Executive Committee of the Party, Gilberto Vieira White, who will remain in both positions. White also assumed the presidency of the newly founded Council of Ministers of the People's Republic, making him the de facto leader of the country.\n\nSome experts have compared the process to the congresses of the Communist Party of the now-dead Soviet Union, with the Colombian Communist Party acting as a highly centralized and "bolshevized" organization. White, the General-Secretary since 1947, shall be the man to steward Communism in Colombia.\n"
    COL_News.37.a: "The dream lives!"
    COL_News.37.b: "Marx rolls in his grave."
    COL_News.37.c: "Do all socialists have really long titles?"

    COL_News.38.t: "[Get_newspaper_header]Nicolás Buenaventura Alder Elected in 11th Congress of the Colombian Communist Party"
    COL_News.38.desc: "Following the Colombian Communist Party's takeover of the People Cabildo and a subsequent purge against the army, the Colombian Communist Party holds its 11th Party Congress, and its first as a ruling party. In the congress, party delegates drafted a new constitution and, in a surprising course of action, voted for Nicolás Buenaventura Alder to become the new party secretary and Chairman of the Council of Ministers of the People's Republic.\n\nBuenaventura has been a lifelong activist and has come to lead the left wing of the party. Buenaventura stated that he would pursue a "vigorous Leninst course of action to ensure economic prosperity on behalf of the workers, to bring the victory of Communism from Colombia to the entire region." The new General-Secretary also pledged to follow his predecessor's path in ridding Colombia of the scourge of fascism.\n"
    COL_News.38.a: "The infantiles return."
    COL_News.38.b: "The union lives on!"
    COL_News.38.c: "The mantle passes."
      
    COL_News.39A.t: "[Get_newspaper_header]Antonio García Nossa wins the Colombian Elections of 1970"
    COL_News.39A.desc: "Celebrations can be heard all across Bogotá today as the unified leftist coalition of the Patriotic Union stands victorious in the highly contested popular elections, shattering most expectations.\n\nRunning on a Gaitánist platform, newly elected leader Antonio García Nossa, a former economic advisor of the late caudillo Jorge Eliécer Gaitán's cabinet, takes charge of the country at the closure of a chaotic decade, and has already been quoted reiterating his commitment to bold social and land reforms.\n\nDespite eager expectations that his victory will finally bring relief after the horrors of La Violencia, some international observers offered a more measured response, fearing the new policies might cause further instability by sparking a reaction from the country's large conservative opposition.\n"
    COL_News.39A.a: "A ray of hope in a sea of turmoil."
    COL_News.39B.t: "[Get_newspaper_header]Antonio García Nossa Wins the 1970 Extraordinary Elections"
    COL_News.39B.desc: "A surprising new face appears in Bogotá as socialist candidate Antonio García Nossa emerges as the relatively undisputed winner of the emergency elections held by the People's Cabildo, taking the place of his predecessor Alfonso López Michelsen. The extraordinary process was initiated by a popular motion after the result of recent investigations led many to question the legitimacy of the previous election.\n\nAt the helm of the Colombian Socialist Movement, international observers wonder how the leader of the eclectic Gaitánist coalition, which also includes former members of the Caribbean Legion and the late caudillo's daughter Gloria Gaitán, will prove up to the task as the republic enters the new decade. With the situation slowly returning to normal, many hope that this victory will finally steer the fragile republic into a more humane direction.\n"
    COL_News.39B.a: "The storm settles at last." 

    COL_News.40A.t: "[Get_newspaper_header]Michelsen Secures a Second Presidential Term"
    COL_News.40A.desc: "Michelsen's legacy has been secured. Although he has been swamped by poor relations with his domestic opposition, investigations into his personal conduct and clientelism, the President has maintained a sizable base of support among the Colombian electorate. Some feared that ongoing investigations would jeopardise his long-term ambitions, but as he stands triumphant, it is clear that they didn't prevent his reelection.\n\nWhile the accusations of fraud relating to the election have been rejected by Colombia's electoral authority, this has done little to quell the unrest with protests announced in the capital and other major cities. Irregardless, these results have affirmed the status of the Liberal Revolutionary Movement as inheritors to Gaitán's legacy, but with rising pressures, only time will tell whether their vision for the country will last.\n"
    COL_News.40A.a: "Libertad y Orden, upheld within Bogotá."
    COL_News.40B.t: "[Get_newspaper_header]Alfonso López Michelsen Wins the 1970 Extraordinary Elections"
    COL_News.40B.desc: "Following the resignation of President Camilo Torres Restrepo, the People's Cabildo held new elections. With the collapse of Restrepo's United People's Front due to a rift between the former president's associates, Alfonso López Michelsen and his Liberal Revolutionary Front have secured victory with a sizable majority.\n\nAlfonso López Michelsen, also known as "el Pollo," was a notable popular figure sidelined by President Restrepo after he took office.. With his popularity, some have said that this victory was deferred, and that he should have been President in 1968. Michelsen, with his mandate secured, thanked his supporters and pledged to bring his ideals into reality.\n"
    COL_News.40B.a: "The chicken flies!"
    #Both Need Writing

    #New Granada Post-War Events
    COL_News.41.t: "[Get_newspaper_header]Gilberto Alzate Avendaño Dies!"
    COL_News.41.desc: "The end of La Violencia brought about a new order in the Athens of South America yet now doubts arise about its longevity due to the death of El Duce, Gilberto Alzate Avendaño, following a long fight with cancer, mere months after the Civil War ended. Shortly following the announcement of Avendaño's death, New Granada's Grand Council of Fascism has announced that it will assume emergency powers to elect a new Duce.\n\nThe Grand Council also announced the release of an official testament of the late leader and the publishing of his memoirs within the upcoming days.\n\nIn an interesting twist, the recent meetings of the Grand Council show an empowered nationalist wing and with the ANP allying itself with much of the old Conservative establishment of the Republic, many now wonder what will become of the Duce's plans to bring Fascism to Colombia.\n"
    COL_News.41.a: "Even in death we may yet live on."
    
    COL_News.42.t: "[Get_newspaper_header]Acción Nacional Popular Prevails"
    COL_News.42.desc: "Shocking news from Bogotá as the ANP has announced that an attempted coup by the Oligarchs of the Supreme Economic Council has been violently crushed. It appears the party's position as hegemon of Colombia continues to be unchallengeable\n\nAlongside the expected news of purges among the ranks of capitalists and oligarchs alike, the government has come forward to announce the election of a new Duce, Augusto Ramírez Moreno, who had been serving as Interim Leader since the Alzate died.\n\nMoreno is known for being a founding member of Los Leopardos, the group which inspired Alzate however Moreno appears to be hold more moderate views and is known for being part of the party's Nationalist Caucus. Time will tell what his rule will mean for New Granada."
    COL_News.42.a: "A colossus's unfettered or rotting from the inside?"
    #COL_News.42.b: "It seem" #Japanese Response
    #COL_News.42.c: "Those damned rats..." #Italian Response
    #COL_News.42.d: "The Invisible Hand better not give the Japanese a foothold in our backyard." #US Response
    #COL_News.42.e: "May they both rot." #Communist Response
    COL_News.42.f: "Perhaps this could be played to our advantage..." #Iberian Response

    COL_News.43.t: "[Get_newspaper_header]The End of Fascism in Colombia"
    COL_News.43.desc: "In New Granada, an organization known as the Asociación Nacional de Industriales de Colombia, composed of the nation's leading capitalists and industrialists, has made a surprising putsch. This coup d'etat has expelled the ANP from power, giving the business council full control over the state.\n\nAt the head of ANDI is Diego Garcés Giraldo, the creator of the Supreme Economic Council, the development authority responsible for New Granada's massive economic growth. He succeeds the recently assassinated Julio Mario Santo Domingo which promised a return to democracy and liberalization.\n\nOnly time will tell if the new administration will adheer to his promises or if its purpose is simply strengthening Colombia's latest pack of overlords.\n"
    COL_News.43.a: "Rekindled liberty or just a facade?"
    COL_News.43.b: "An opening is all we need." #Japanese Response
    COL_News.43.c: "Let the good times roll."

    COL_News.44.t: "[Get_newspaper_header]The New Colombian Republic"
    COL_News.44.desc: "Instability continues to rock Colombia as Augusto's Ramírez Moreno's government has survived a coup attempt from the party's hardline wing, led by Silvio Villegas, a close friend of Ramírez, which represented the bastion of Fascism within the ANP. With its members now purged, it appears Fascism in Colombia is its the way out.\n\nIn equally surprising news, in the days following the coup attempt, Moreno has announced a wide range of government reforms, the plans of which likely triggered the coup. Most important among these reforms is the institution of a new Constitution modeled on the Republic's 1886 Constitution which officially names the new state "The National Republic of Colombia".\n\nThe newly declared President has promised to uphold Alzate's ideals while also promising the new Republic be a truly national one.\n"
    COL_News.44.a: "Thesis. Antithesis. Synthesis."
    COL_News.44.b: "All is fair in love and politics." #Japanese Response
    COL_News.44.c: "The best outcome we could have hoped for." #Italian Response
    COL_News.44.d: "Less black but a Black Spot on the Continent nonetheless." #US Response
    COL_News.44.e: "May they both rot." #Communist Response
    COL_News.44.f: "And so adiós it is to our old partner." #Iberian Response

    COL_News.45.t: "[Get_newspaper_header]Hardliners Coup Augusto Ramírez Moreno"
    COL_News.45.desc: "More news out of New Granada today as Augusto Ramírez Moreno, leader of the nation and successor to Avendaño, has been removed from government by what some experts are calling an "internal party coup". Silvio Villegas, previously the Executive Secretary of the Party, has now been sworn in as president.\n\nThis change of leadership has come after harsh internal criticism of Moreno by opposing parties. A vote of no confidence was unexpectedly passed by a slim majority, leading to Villegas' ascension to the presidency.\n\nVillegas is a hardliner in the New Granadan system, especially when compared to Moreno. In his inauguration speech he vowed to "uphold the Fascist ideals of our country in thought and deed." He then pledged to transform New Granada into a fully Fascist country, despite the many challenges and obstacles in its, and his, future.\n"
    COL_News.45.a: "I thought the point of Fascism was to not get voted out?"
    COL_News.45.b: "That's our other man!"
    COL_News.45.c: "More chaos in Colombia?"

    COL_News.46.t: "[Get_newspaper_header]Old Guard Conservatives Coup Government in Colombia"
    COL_News.46.desc: "Developments out of Colombia continue to surprise, as it appears that a coalition of moderate generals and aristocrats have couped the government. Earlier today, the new government has confirmed that Archbishop Raúl Zambrano Camader will lead a temporary national unity government, sheparding the country's recovery from La Violencia.\n\nThe coalition' appear shaky however and concerns rise over the new government's collaboration with the fascist ANP, from which its entire leadership seems to originate. It appears Colombia will be looking to its past for inspiration and unsurprisingly to the Iberian Peninsula, as the new government is largely composed of Hispanophiles.\n\nNo information has been given in regards to a return to civilian governance."
    COL_News.46.a: "A return to 1910?"

    COL_News.47.t: "[Get_newspaper_header]Fernando Londoño y Londoño is Appointed as Interim Leader"
    COL_News.47.desc: "When Colombian President Silvio Villegas announced his intent to nationalize all industries represented in the Supreme Economic Council, he had kicked off months of economic turmoil and political uproar. This crisis appears to have been culminated with a vote of no confidence against Villegas, ousting him from power, but leaving no clear successor in his wake.\n\nIn order to end the deadlock, the party had voted to elect Fernando Londoño y Lodoño, the former Minister of Propaganda, as provisional head of state. An aristocrat and well-connected among the circles which brought about Villegas' downfall, Londoño is widely respected throughout the party as a unifying, unambitious figure. In his inauguration speech, he acknowledged the crisis in the party and vowed to steer the ship of state into calm waters, where someone else will be able to succeed him.\n"
    COL_News.47.a: "And how long will that be?"
    COL_News.47.b: "Hopefully they can settle their differences peacefully."
    COL_News.47.c: "When spineless men lead, the whole community is cast adrift."
    COL_News.47.d: "At least they're not killing each other again..." 

    COL_News.48.t: "[Get_newspaper_header]Double Coups in Colombia"
    COL_News.48.desc: "Following failures to combat insurgencies in northern and eastern New Granada, President Augusto Ramírez Moreno has been removed via a military coup. General Hernando Forero Gómez took control of the nation, dissolving the national assembly, and making the military and national police the sole authority to fight against the insurgency.\n\nGómez's control is not absolute, as General Hernando Currea Cubides has declared himself an interim president. Currea has assured the government and public that he intends to return the nation to normalcy. It is unknown whether or not he will try and ride his momentum to become president, or surrender power back to the party."
    COL_News.48.a: "That's our third... no... fourth man!"
    COL_News.48.b: "Can they just get it under control?"

    COL_News.49.t: "[Get_newspaper_header]Hernán Jaramillo Ocampo Appointed as Moreno's Successor"
    COL_News.49.desc: "Augusto Ramírez Moreno has resigned from his role as President of New Granada, following the death of his son. After a steady departure from politics, his new successor has been announced to be Hernán Jaramillo Ocampo, a skilled economist within the New Granadan government.\n\nOcampo has been dubbed an aloof figure by most, while also being praised for sustaining relationships with the coffee barons of his department of Caldas. His proposals on increasing Colombia's industrial development has raised eyebrows within the party.\n\nDespite the suspicion, his economic approach has yielded stability and economic growth in the wartorn region. Time will only tell if this economist will be able to handle the reins of New Granada."
    COL_News.49.a: "As long as I get my Folgers..."
    COL_News.49.b: "The coffee man can!"
    COL_News.49.c: "Can an economist bring peace?"

    COL_News.50.t: "[Get_newspaper_header]Belisario Betancur Appointed as Moreno's Successor"
    COL_News.50.desc: "Augusto Ramírez Moreno has officially resigned as President of New Granada, citing the assassination of his son as the primary reason for his departure from office. His withdrawal from politics has been expected by many, although most didn't think it would take as long as it has.. Following a short ceremony, New Granada declared his new successor, Belisario Betancur Cuartas.\n\nBetancur is seen as an inheritor of some of Laureano Gómez's ideals. One of 22 children from a poor family, Betancur has concerns for the embetterment of the common people of Colombia, and has stated that his primary focus as President will be directing the state to improve living conditions for the impoverished.\n\n"
    COL_News.50.a: "That's our third man!"
    COL_News.50.b: "Can no one govern them!?!"

    COL_News.51.t: "[Get_newspaper_header]Hernán Jaramillo Ocampo Succeeds Silvio Villegas"
    COL_News.51.desc: "Following an unprecedented campaign of property nationalization and internal purges, President Silvio Villegas has announced his resignation, citing the "completion of the Revolutionary Traditionalist doctrine" envisioned by him and the other Leopardos in the 1920s.\n\nFollowing Villegas' resignation, the reorganized ANP has elected his second-in-command, Hernán Jaramillo Ocampo as President. Party insiders have described Jaramillo as a stubborn and authoritarian man, a nationalist, yet one well-rooted in the Caldas oligarchy. Villegas' success will now allow him to have unprecedented control over the Colombian economy and political sphere. With this stable and firm hand, it is expected that Jaramillo will continue his predecessor's work and further mold the country in the image of its new masters.\n"
    COL_News.51.a: "Colombia falls further down the abyss."
    COL_News.51.b: "Villegas has succeeded in tearing off Colombia's shackles."
    COL_News.51.c: "The strong make their own future."
    COL_News.51.d: "Who's ever heard of a fascist retiring of their own free will?"

    COL_News.52.t: "[Get_newspaper_header]Castor Jaramillo Forms a New Government in Nueva Granada"
    COL_News.52.desc: "When Colombian President Silvio Villegas announced his intent to nationalize all industries represented in the Supreme Economic Council, he had kicked off months of economic turmoil and political uproar. This crisis appears to have been concluded with a vote of no confidence by the Grand Council, leading to Villegas's ouster and a thorough purge of his allies in the administration.\n\nFollowing these developments, Castor Jaramillo has now been sworn in as the new Colombian President. In his inauguration speech, he has proclaimed his intent to cooperate with the Colombian aristocracy, signalling a sea change in the Granadan ruling party's policy. The aristocracy of the old republic has managed to entrench not only its economic power over the new state, but also its political grip, rapidly erasing the lines between state and business.\n"
    COL_News.52.a: "The Fruits of Fascism ripen."
    COL_News.52.b: "A more stable system, hopefully."
    COL_News.52.c: "Capital continues to chain the weak."
    COL_News.52.d: "All this, just to return to the old republic?"

    COL_News.53.t: "[Get_newspaper_header]The Interim Government Steps Down in Colombia"
    COL_News.53.desc: "For the last few months, observers and governments have watched the spiraling protests and strikes in Colombia with growing concern, fearing them to be a portend for something worse. These fears have been disproven today as negotiations between the government and protesters have finally borne fruit, with Camader conceding his position and resigning. In his place, the National Assembly has appointed Guillermo León Valencia as his successor.\n\nThe face of Colombian conservatism, Valencia has long been an ally to the oligarchy, and his appointment signals that Camader's resignation may be as far as concessions go. Valencia's devout religiosity and his relative popularity has provided his ascendancy some much-needed legitimacy. Whether this can translate into stability and protecting the Partido Nacional's interests, however, are a different matter entirely.\n"
    COL_News.53.a: "The dove returns, carrying an olive leaf. But is the leaf truly new?"

    COL_News.54.t: "[Get_newspaper_header]The Interim Government Steps Down in Colombia"
    COL_News.54.desc: "For the last few months, observers and governments have watched the spiraling protests and strikes in Colombia with growing concern, fearing them to be a portend for something worse. Those fears were affirmed as negotiations between the protestors and the government collapsed, and as the army turned to violently suppressing the protests through massacres, assassinations and arrests. Condemning the violence, President Zambrano announced his resignation, but the damage has been done.\n\nWith Zambrano out of power and much of the civilian administration resigning in horror and disgrace, General Hernando Currea Cubides is widely expected to take control of governance, and is unlikely to let it go. With Colombia exhausted by decades of political violence, it seems that the National Party's time in office is truly over, and that Currea's wing of Francoists are set to dominate Colombian politics for years to come.\n"
    COL_News.54.a: "A King, to be coronated in blood."

    COL_News.55.t: "[Get_newspaper_header]The Constitution of the Second Republic of Colombia is Passed"
    COL_News.55.desc: "After much debate, the newly named Second Republic of Colombia has finalized and ratified a new constitution for the state. The new constitution restores gubernatorial elections, while the presidential position remains a purely legislative process. This also comes with an expansion of the president's powers such as an unlimited veto and the ability to appoint ministers without needing confirmation from the legislature, while also streamlining impeachment procedures to prevent executive overreach.\n\nThis new constitution comes during a time of economic renewal for Colombia. Due to the immense power of corporations in the still-healing Colombia, the constitution has granted protections and privileges to these companies, ensuring them with a tight grip on politics.\n\nThe incumbent president, Diego Garcés Giraldo, has announced that he will remain in the executive branch, despite the new constitution."
    COL_News.55.a: "Is this democracy?"
    COL_News.55.b: "A uniquely Colombian creation."

    COL_News.56.t: "[Get_newspaper_header]Londoño y Londoño Resigns"
    COL_News.56.desc: "After being thrusted into power by the stormy politics of Colombia, it appears that interim President Fernando Londoño y Londoño has managed to calm the tempest. In a televised message, Londoño announced his resignation, claiming that the party had survived the crisis and that his duty was now complete. He will now retire to his family, ceding his position to a replacement determined by the party.\n\nShortly afterwards, a press communique by the ANP stated that Belisario Betancur has been appointed President by majority vote. A dedicated civil servant renowned for his focus on transparency and reformism, this choice has signalled that the party may be relaxing its tight grasp on power. Belisario's compromising nature, as shown in his inaugural speech, is a far cry from the methods of his predecessors, one eagerly sought by a war-torn country."
    COL_News.56.a: "A new era, or just a new facade?"
    COL_News.56.b: "A strong man, but can he deliver?"
    COL_News.56.c: "Maybe a strong hand could pull Colombia from its quagmire."
    COL_News.56.d: "A path to stability?"

    COL_News.57.t: "[Get_newspaper_header]Londoño y Londoño Resigns"
    COL_News.57.desc: "After being thrusted into power by the stormy politics of Colombia, it appears that interim President Fernando Londoño y Londoño has managed to calm the tempest. In a televised message, Londoño announced his resignation, claiming that the party had survived the crisis and that his duty was now complete. He will now retire to his family, ceding his position to a replacement determined by the party.\n\nAlmost immediately, the ANP has published a note commending Londoño for his exemplary service to the nation, and informing the country of the decision to appoint Hernán Jaramillo as President. Jaramillo is known as a stubborn and authoritarian man, and a close ally of the rural elites of his native Caldas. Jaramillo has promised to use technocratic expertise to achieve the renewed economic growth that eluded his predecessor, whilst continuing to institutionalize the ANP's reign in all aspects of national life."
    COL_News.57.a: "The coils of fascism tighten around Colombia."
    COL_News.57.b: "Colombia's leash hasn't been dropped."
    COL_News.57.c: "Maybe a strong hand could pull Colombia from its quagmire."
    COL_News.57.d: "To new times, the same ones."

    COL_News.58.t: "[Get_newspaper_header]Military Government Established in Colombia"
    COL_News.58.desc: "The house of cards has finally collapsed in Colombia. In the wake of mass protests over the government's refusal to efficiently deal with the ongoing insurgency, protests were quickly suppressed. However, in the wake of mass resignations, this has only guaranteed the collapse of the past government, with the military now wasting no time in implementing martial law, and rapidly entrenching their newfound position.\n\nThe coup, orchestrated by General Hernando Currea Cubides, has officially rejected some of the tendencies embraced by his predecessor, instead declaring a newfound support for Franco and promising a return to normalcy under the steady hand of the military, with Cubides himself officially declaring a provisional government. Few, however, know where this hand will end, and whether Colombia will see any genuine moves back to a civilian government.\n"
    COL_News.58.a: "A raven flies overhead, promising peace through its brambles."

    COL_News.59.t: "[Get_newspaper_header]Military Government Established in Colombia"
    COL_News.59.desc: "The fires burn yet brighter. For years, Colombia has been wracked by instability and warfare, and that pattern has been extended yet further. Frustrated by moves interpreted as weakening the strength of the government and continued failures in quashing the socialist and nationalist insurgencies, Supreme Commander Hernando Forero Gómez has staged a coup, supported by the military and police detachments.\n\nWhilst the ministries lurch through with little immediate guidance, few debate the intentions of Forero himself. Opening his first speech by condemning the perceived degeneracy of the outgoing regime, he pledged that he would guarantee the implementation of Falangism within a stable Colombia, and to end the long-running violence plaguing Colombia. Whether he can fulfil those promises or not, or if the military will ever stop marching down the streets of Bogotá, one thing is clear:\n"
    COL_News.59.a: "The Chief Torturer's eyes now hungrily search nationwide."

    COL_News.60.t: "[Get_newspaper_header]The Military Retains Power in Colombia"
    COL_News.60.desc: "The tendrils dig deeper into Bogotá. Many may have been taken aback by the events surrounding Currea's initial coup, but few would be surprised by the results of his latest speech. Citing concerns over continued terrorism and accusations of continued subversion, General Hernando Currea Cubides announced in a televised speech that the High Military Council would indefinitely continue its governance.\n\nMost remaining dissent to Currea's plans have been mute, but the implications are clear, with the ANP will be sidelined, with the military and Catholic Church to share power. Reception to these developments have been muted internationally, barring the Iberian Peninsula, which has offered its commendations to the new regime, and cardinals within the Catholic Church have provided quiet hopes that their new, central role will be important for the regime's development.\n"
    COL_News.60.a: "Currea was never a Cincinatus."

    COL_News.61.t: "[Get_newspaper_header]The Military Retains Power in Colombia"
    COL_News.61.desc: "The leaves have been felled, leaving nothing but trunks. Few observers have been surprised as Supreme Commander Hernando Forero Gómez's efforts to install a military junta have come to fruition. Despite some measured resistance over the past months, it is now clear that the last embers of an internal power struggle between the ANP have been silenced by the guns and truncheons of the Colombian Military.\n\nWith an established reputation as a particularly brutal commander, his political sympathies have long been noted as being slavishly devoted to that of Falangism, a view he has only been too happy to foment. Now consolidating his power, it seems inevitable that he will seek to enforce ideological loyalty and purity across the Colombian Republic. If not through the barrel of the gun, then this will surely be enforced through the signing of a cheque.\n"
    COL_News.61.a: "The axe of the Fasces cut through the Amazon."

    COL_News.62.t: "[Get_newspaper_header]The Military Government Steps Down in Colombia"
    COL_News.62.desc: "The sword may have been resheathed, but its glint still gleans. Announcing that the situation had been stabilized and that the need to oversee administrative order had faded, the military has officially announced the end of its junta, and a transition back to civilian rule. In response, the ANP has appointed Hernán Jaramillo Ocampo as President to succeed it.\n\nThe ANP's leading technocrat, Ocampo has already claimed a reputation as a secretive, authoritarian and stubborn figure, but will now be tested in the struggles against the pressures of an entrenched security apparatus, combined with widespread fatigue over factionalism. Whether Ocampo's reputation will truly precede him and will help him to secure his vision, or if the military will continue to intervene, has yet to be seen.\n"
    COL_News.62.a: "The vultures have selected their wolf."

    COL_News.63.t: "[Get_newspaper_header]The Military Government Steps Down in Colombia"
    COL_News.63.desc: "The sword may have been resheathed, but its glint still gleans. Announcing that the situation had been stabilized and that the need to oversee administrative order had faded, the military has officially announced the end of its junta, and a transition back to civilian rule. In response, the ANP has appointed Belisario Betancur Cuartas as President to succeed it.\n\nA scion of Moreno's reformist bloc, Belisario has been regarded as a relatively transparent and diplomatic man capable of maintaining the rough sense of stability felt within Colombia, and will likely loosen some of the tighter mechanisms of administrative repression. However, even with the handover, the military and security apparatus remain strong and continually overstep their bounds, a matter that will likely continue to exacerbate tensions throughout his administration.\n"
    COL_News.63.a: "Mephistopheles makes his presence known."

    COL_News.64.t: "[Get_newspaper_header]Alfonso Uribe Misas Purges the Nacional-Americanistas"
    COL_News.64.desc: "A tense, weeks-long power struggle behind the scenes of the new government of the State of Colombia has burst into the open today with the arrest of José Camacho Carreño and the outlawing of the Nacional-Americanista movement. In a press statement, President Alfonso Uribe Misas claimed that the security services have unearthed a plot by Camacho and his associates to assassinate him, and denounced him as a traitor.\n\nWhile the government has attempted to keep a tight lid on the affair, it is believed that the origin of the dispute lies in Misas' intentions to rehabilitate the Conservative party and slowly rebuild the structures of the old republic, leading the radical Nacional-Americanistas to break with his regime. Now, however - it seems the path forward is paved for Misas to take the crown of Bogotá's deposed leaders and mold it in his image."
    COL_News.64.a: "As usual, the fascists can never settle their differences peacefully."
    COL_News.64.b: "A long knife must be kept sharp."
    COL_News.64.c: "Is the old republic returning?"

    COL_News.65.t: "[Get_newspaper_header]Nacional-Americanista Putsch in Colombia"
    COL_News.65.desc: "While open warfare in Colombia has ended, it seems that political violence continues to determine its path. Today, the new Colombian government has been violently overthrown by militants connected to the radical Nacional-Americanista movement. The movement's leader, José Camacho Carreño, has announced the death of former president Alfonso Uribe Misas and the "beginning of a National Revolution", proclaiming the Free State of Colombia.\n\nCamacho, a former member of the Leopardos and of the Conservative party, has long been known as a radical, and his reputation for indulgent habits was only worsened by his time in prison for the murder of his brother-in-law and for political radicalism. Despite his unquestioned intellectual ability and economic knowledge, it is believed that German policy towards Colombia may shift due to Camacho's tendency towards erratic decision making, though there has been no comment yet from Europe.\n"
    COL_News.65.a: "Just when you thought it couldn't get worse..."
    COL_News.65.b: "What does he think he's doing?"
    COL_News.65.c: "Will Colombia drown in blood once more?"

    COL_News.66.t: "[Get_newspaper_header]Army Coup in Colombia"
    COL_News.66.desc: "With the internal situation growing increasingly out of Bogotá's control and armed conflict once more ravaging Colombia, reports have now come in of the army dismissing President Camacho and his cabinet, with functions delegated to the State Council and the Nacional-Americanista movement purged. General Diógenes Gil has proclaimed an 'end to chaos and a return to normalcy', despite the gunfire still ringing in parts of the city.\n\nThe news comes after a meeting between Camacho and the German ambassador to Colombia over the supply of coffee and other crucial commodities to Germany has apparently ended in failure, leading many to believe that the Abwehr had a hand in the coup's organization. Eyewitnesses have even stated that alleged Colombian-German agent Heriberto Schwartau was present among the followers of General Gil during the execution of the putsch."
    COL_News.66.a: "Try getting extreme nationalists to work together..."
    COL_News.66.b: "Crisis averted."
    COL_News.66.c: "At least he's more moderate..."


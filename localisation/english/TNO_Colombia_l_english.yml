  # Bios - ministers and leaders
  CLD_Jose_Camacho_Carreno_hog_desc: "§YMinister of Government\nPalingenetic Nazism§!\n--------------\n"
  #\n§LIf Uribe Misas is the face of the party, then José Camacho Carreño is its Judas. His quest for political power began early, a 17 year old college freshman when he, along with likeminded right-wing activists, founded 'Los Leopardos' in 1920. The Leopardos initially aimed to push the Conservative Party toward nationalism and corporatism, using newspapers to persuade voters. Carreño proved himself to be an excellent orator, becoming the face of the new generation of conservatives, expertly riling crowds with immense national pride and disdain for establishment politics. In 1938 he became a founding member of the Nationalist Action Party, and from the beginning has been second only to Misas in power.\n\nIn the subsequent decades, the Axis would defeat the Allies, the conservative party would fail to enact their agenda, and the liberal party would be overrun by leftists, all of which enabled Carreño to pull more and more public support towards the AN and its Ariocriollo mission. With the outbreak of La Violencia, Carreño's previous calls for right-wing militias appeared immensely prescient, while his promises that AN would free Colombia from vice, corruption, and Judeo-capitalism, inspired thousands to join the underground Second Patriotic Army. Since the Barranquilla uprising, hundreds of thousands listen to his nightly radio messages, and while his listeners may understand that Misas is the leader, it is Carreño whom they truly follow.§!"
  CLD_Klaus_Wilhelm_Lehder_eco_desc: "§YMinister of Finance and Public Credit\nPalingenetic Nazism§!"
  #\n--------------\n§LBorn in 1904 in Hamburg, Klaus Wilhelm Lehder was but one of many German professionals who settled in Colombia in the first decades of the 20th century. But when he first arrived in 1927, he was one of the only National Socialists on the continent. As a young man Lehder owned a popular hotel in Quindío where he met a number of prominent German business leaders. Among them were Hermann Kühl, the de-facto head of the Deutsch-Kolumbianischer Bund, and aviation industry pioneer Peter Paul von Bauer, who hired Lehder as an engineer for his airline SCADTA. Through SCADTA, Lehder became acquainted with fellow nationalist Uribe Misas, the firm's legal representative at the time.\n\nWhen Misas founded the National Action Party, Lehder was among the very first to follow, his talents in management proving invaluable in shaping the party's internal structure. In the midst of La Violenca, he managed the ever growing pool of plundered goods that financed the AN's growth. When Kühl was killed in a car bombing in 1956, Lehder rushed to acquire his and other Bundists' assets for the party. For this, Misas promised Leider the future position of Economy Minister upon the creation of his Ariocriollo Utopia, a dream which both have absolute confidence in.§!"
  CLD_Luis_Lopez_de_Mesa_Gomez_for_desc: "§YForeign Minister\nPalingenetic Nazism§!"
  #\n-------------- \n§LBorn to wealthy academics in 1884, the 'godfather of Ariocriollo Thought' Mesa spent his formative years immersed in social science literature. This childhood fascination developed into a project to use sociology to perfect Colombian society. As a member of the Liberal Party, from 1917 to 1934 de Mesa rose from city councilor to cabinet member, spearheading education reforms in Pumarejo's first term and being appointed Foreign Minister by his successor, Santos. As the world was engulfed by war, de Mesa used his position to advance his racial ideology. He prohibited the entry of European Jews - including those who were Colombian citizens - as they fled from the Holocaust, while simultaneously working to isolate Colombia from the United States. These deeds made him a legend in the eyes of the far-right.\n\nThe Gaitán administration's decision to enact an open borders policy further fueled de Mesa's certainty of a Jewish plot to destroy Colombia, and he joined the Nationalist Action Party in 1951. For the next decade, he would regularly speak at DKB and AN events and publish papers outlining a Cold-War era agenda for advancing the Criollo race, ideas which would form the core of Misas' Ariocriollo Manifesto. Though today a fragile and sickly old man, de Mesa remains a highly valuable asset for the Second Patriotic Army, enabling it to outwardly portray itself as Colombia's legitimate government, rather than merely a German-controlled terrorist group.§!"
 

  Heriberto_Schwartau_sec_desc: "§YHead of Intelligence\nNational Socialism§!\n--------------\n"
  #\n§LBorn in 1917 to two German immigrant parents in Colombia, Heriberto Schwartau Eskildsen was already infatuated with National Socialism before Hitler became the Führer. After graduating highschool he purchased a ticket for voyage to Hamburg, wh Upon arrival in Germany, Schwartau officially joined the NSDAP and trained to fight in Hitler's army. In 1941, he was pulled from the Heer to serve the Abwehr instead, and Schwartau soon found himself back at sea, returning to Colombia to operate a pro-Axis radio station as part of Operation Bolívar. After the arrest of his superior in 1944, he became Head of Intelligence for the Abwehr in Colombia.\n\nAfter the chaotic elections of 1946, seeing the rise in partisanship and political violence as an opportunity, the Abwehr commanded Schwartau to organize Operation Lafitte, a mission to boost the influence of the National Action Party and further align its politics with that of the Reich, while also undermining public confidence in democracy by fanning the flames of political violence. Through a front company he established in Barranquilla, Schwartau began to smuggle German weapons, which he proceeded to sell to right-wing militias and crime syndicates through a network of locally recruited agents. When Schwartau revealed Operation Lafitte to Uribe Misas, they began a deeper cooperation. Schwartau's intelligence and supplies were essential to planning the Barranquilla uprising. Upon the successful seizure of Barranquilla, Misas appointed Schwartau as the head of the new Security Agency, through which he works to systematically undermine resistance to the new regime.§!"

  CLD_Adolf_Held_Jr_eco_desc: "§YMinister of Finance and Public Credit\nStatist Corpotocracy§!"
 

  POLITICS_ALFONSO_URIBE_MISAS: "Born on December 26th 1898, Alfonso Uribe Misas is a man to whom the promises of Colombia were dangerously fragile. Born into prosperity, he enjoyed the boom years of the 20s, taking up Law and committed himself to Colombia's order, even finding himself excommunicated by the Catholic Church for his efforts when he placed Colombian law above religious law in a civil marriage case he confirmed. \n\nSuch faith led him to politics in 1929 - an entry coinciding with his beloved Republic beginning to fall to chaos and disorder. The economy choked, the people grew restless and the order he held so sacred slipped. He rose the ranks of Colombian politics, in his heart feeling many of the new radicals promising an end to Colombia's struggles were wrong. Untested experiments all, alien to Colombia's soul. He instead began to look back.\n\nNow, he stands as the final arbiter of Colombia's old order. His rift with the Catholics mended, supported by allies in Europe and backed by a coalition of aristocrats, radical conservatives and Laureanistas, he is determined to restore Colombia. The new Bolivarian State will enjoy peace, education, prosperity, and security under his renewed Old Republic."
  POLITICS_HERIBERTO_SCHWARTAU: "Though born on Colombian soil, Heriberto Schwartau has never regarded the country he now rules to be his homeland. Born in 1917 to German immigrant parents, as a teenager he boarded a ship bound for the Fatherland so that he could fight for the cause of National Socialism. Assigned to the Abwehr, Schwartau soon found himself back in Colombia, and became the head of all Abwehr operations in Colombia in 1944. In this position, he masterminded 'Operation Lafitte', a two decade conspiracy to fan the flames of political violence in Colombia, undermine faith in democracy, and provide arms and training to Uribe Misas' so-called Second Patriotic Army.\n\nHowever laughable a distortion of National Socialist ideals his "Ariocriolloismo" was, Schwartau understood the need to work with Misas, and maintain unity of the Nationalist Action alliance to defeat the Reich's enemies in Colombia. But now, with the liberals and communists defeated, Misas himself dead, and the Nationalist Action Party hijacked by General Gil, such ideological excesses can no longer be tolerated. Who but Heriberto Schwartau has both the political acumen and the Aryan blood to bring National Socialism to Colombia? And who but Heriberto Schwartau can guarantee that Bogotá and Germania are forever adjoined?" 
  POLITICS_JOSE_CAMACHO_CARRENO: "A mistake — that was all José Camacho Carreño had been until this point. His life was a combination of random events and personal failings manifested in a chain of unfortunate incidents. He drank himself, in fits of depression, into a pond of wallowing misery, yet he was also the devil who brought the end of his beloved wife's brother in a cold-blooded slight. His now-defunct wife, instead of him, took the comeuppance for his kin-slaying, however, when she died drowning in the ferry that tried fleeing Barranquilla during a fierce skirmish with the republic.\n\nHe has to live with it, and there is not much he can do besides downing bottle after bottle while making use of his only saving grace — his tongue. As he made poisonous words honeyed and turned rational terms inconceivable, his deceiving shows made an entire nation blind. Somehow mustering unimaginable, if ill-conceived solutions, to Colombia's woes while promoting his vindictive, nostalgic ideals. His tenets are beyond dangerous — for it is an immediate downfall to the republic's institution wholly rather than merely another radical strain of conservatism. The first time as tragedy and the second time as farce, reactionism had always bode poorly, but Camacho Carreño's nightmare might just yet end with his path of self-destruction... eventually."


  ## Liberals ##
  CLL_Shoulders_of_Giants: "On the Shoulders of a Giant"
  CLL_Shoulders_of_Giants_desc: "To understand the reasons why Colombia burns, one must look to three souls whose legacy is the violence that now unfolds.\n\nWhile fascists and self-serving despots may seek to proselytize elsewise, of them only one truly cared for the people when he served as president. Only one of them sought to uphold their rights, indifferent of who they were or from what land they came. Only one looked into their eyes and spoke as their equal, not their overlord. Only one died a martyr.\n\nIt is his name they chant in the streets of the East and whisper behind close doors everywhere across the land. It is his banner they fly and his dream they uphold in Tunja.\n\nFor in his own words, "If I die, avenge me.""

  CLL_Far_From_Any_Road: "Far From Any Road"
  CLL_Far_From_Any_Road_desc: "Deep in the hushing plains, the revolutionaries dwell, fighting not only the region's hot and humid climate, but also the threat of time. Deprived of any substantial resources, the insurmountable orient does not offer the best conditions for carrying out the revolution.\n\nThe "Wild East" as it can be called should not be mistaken for an idyllically pastroal land however, and any outsiders who folly venturing towards its green heart will meet an almost certain demise."

  CLL_Burning_Plains: "The Burning Plains"
  CLL_Burning_Plains_desc: "The Eastern Plains possess but two great treasures: their natural beauty and the riches buried beneath their soil. In the grim reality forced upon the revolutionaries, they have forsaken the former to exploit the latter, turning once unspoiled landscapes into scarred mining pits and endless fields of cash crops.\n\nThe rivers run thinner, the serranías grow barren, and with the specter of war darkening the horizon, many wonder whether this fragile system will withstand the toll of a looming conflict against a far mightier enemy—or if the East will finally wither into desolation, and become a shadow of its former vitality."

  CLL_Red_Rose_Army: "The Red and Rose Army"
  CLL_Red_Rose_Army_desc: "The Revolutionary Defense Corps of Colombia stand not as brothers forged by shared ideals, but as comrades bound by the scars of their common suffering. From Navas Pardo's elite Lanceros to Yosa's ferocious Raiders, every faction has glimpsed the cruel face of the Old Republic, a face that has ground them beneath its heel.\n\nTheir thirst for change, born of agony, fuels their relentless march toward revolution. Yet, even as they battle a treacherous shortage of resources and weather the storms of internal strife, their hunger for justice drives them ever forward, ready to reshape the fate of a broken nation."

  CLL_Revolutionary_Coalition: "The Revolutionary Coalition"
  CLL_Revolutionary_Coalition_desc: "Despite the historical American animosity against leftism, the Colombian Revolutionary Union benefits from the backing of a Pan-American coalition of nations, led by the United States.\n\nThe Pro-Democracy and Pro-American ideology of the Gaitanistas, alongside the despotism of the fascist proxies that battle for the country have ensured the Front is democracy's best chance at retaking the Athens of South America.\nFor now, the OFN, Mexico, Cuba and Venezuela have provided plenty of support to the movement, and should they continue to do so, the Front may be able to achieve victory when the howling of cannons haunts Colombia again."
  
  CLL_Revolutionary_Coalition_1: "The Revolutionary Coalition" 
  CLL_Revolutionary_Coalition_1_desc: "A grave blow was struck against the Front when the United States ceased its aid programs, which provided the Front with the bulk of its military and civilian needs. With the state still dependent on foreign aid, its rapid shift towards the Veracruz Pact, of whom all remaining backers participate in, should not come as a surprise.\n\nWhile the Pact may be strong in its will, it cannot be doubted that their aid will pale in comparison to what Uncle Sam could have provided and one can only hope that the revolutionarys' enduring fervor will be enough to carry them to victory."
 
  CLL_Revolutionary_Coalition_2: "The Last Faithful Standing" 
  CLL_Revolutionary_Coalition_2_desc: "The once mighty coalition which supplied the Front has perished by the hand of personal interest. Venezuela is the last nation to which the weakened front clings."

  CLL_Jewel_of_the_East: "Jewel of the East"
  CLL_Jewel_of_the_East_desc: "The crowning achievement of the Revolutionary Army during the Civil War was the capture of Tunja, a city whose political allegiance had been traded many times in the country's history. Tunja, or The Pearl of the East as it has come to be known, stands as the FR's largest stronghold and the only city from which a war can be waged.\n\nIts population has massively swelled in the years since the truce as hundreds flee the oppressive governments in the west and its industry has almost doubled. Though the Front is still undeniably dependent on imports for its survival, it is clear that without the city, the entire war effort would collapse."

  CLL_Jewel_tt: "§RNot holding Tunja or any other major city for a prolonged period of time will result in the collapse of our war effort.§!"

  COL_GranColombia.3.t: "Cold Winds Over the Andes"
  COL_GranColombia.3.desc: "DIRECCIÓN FEDERAL DE SEGURIDAD\nISSUE: Growing Hostilities Between Venezuela and Colombia\n\nEver since the conclusion of the Colombian Civil War, tensions between Colombia and nearby Venezuela have been on a troubling incline. With an increase in the military presence along their border and public verbal bars between either nation's military leaders, foreign speculators worry of a possible armed incursion along the northern Andes.\n\nFor generations now, ideological divisions between Bogotá and Caracas have been more or less the norm. After Colombia's recent civil war, however, reconstruction has been slow to address social issues that have exacerbated the divide between the two nations, from post-war poverty prompting immigration to Venezuela to growing restlessness in the Colombian interior.\n\nIn addition, the Colombian Civil War provided ample cover for recent attempts to stage insurrection in Venezuela, with foreign-backed agitators hoping to use the violence to smuggle themselves over the border to facilitate regime change. This hasn't endeared Caracas to Colombia's post-war plight and has helped fuel further division.\n\nObservers have noted that the possibility of war between Colombia and Venezuela, at least for now, is not likely. It is hoped that this status quo might continue for the duration. In the event of Colombiano/Venezuelano relations deteriorating further, a war in the northern Andes would prove to be just as, if not more bloody, than the Colombian Civil War. Recommend continued observation as the situation develops.\n\nVery respectfully,\nThe Federal Director of Security\nCaptain Gutiérrez Barrios"
  COL_GranColombia.3.a: "La Patria es Primero"
  
  COL_GranColombia.4.t: "Cold Winds Over the Andes"
  COL_GranColombia.4.desc: "CONFIDENTIAL\n\nFROM AGENT TORINO\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: RISING TENSIONS BETWEEN COLOMBIA AND VENEZUELA\n\n1. Ever since the dissolution of Gran Colombia in 1831, Venezuela's relationship with Colombia has been marred by controversy rooted in cultural divisions between Bogotá and Caracas. In recent years, with the conflicting interests of the Cold War converging in the recent Colombian Civil War, Venezuela's relationship with Colombia has taken a turn for the worse.\n\n2. The post-war situation in Colombia has seen systemic poverty spike with poorer migrants emigrating over the Venezuelan border, becoming a long-term issue for the government in Caracas. The simmering tensions in Colombia, via lingering trauma from the Civil War, have seeded unease among the general population.\n\n3. Over the past few months, growing animosity between the governments of Caracas and Bogotá has become increasingly front-facing, with heightened military activity along their mutual border. Military leaders on either side have openly begun positioning forces in opposition to the other, agitating their respective governments to reach a proper resolution.\n\n4. Initial speculation suggests that war between Colombia and Venezuela is unlikely at the current time, but the situation is still malleable. Prospects for a protracted conflict in the North Andes are grim to say the least. With the recent attempts by foreign powers to use the Colombian Civil War for power plays in both Bogotá and Caracas, the best course of action would be to monitor the situation for the duration."
  COL_GranColombia.4.a: "Fidelity, Bravery, Integrity"

  COL_GranColombia.5.t: "Cold Winds Over the Andes"
  COL_GranColombia.5.desc: "CONFIDENTIAL\nTo the Council of Ministers\n\nColombia - Post-Civil War Aftermath - Under Influence By Multiple Foreign PowersIt is well-known that the post-war reconstruction following the Colombian Civil War has been a patchwork affair, with entrenched poverty and murmurs of discontent stemming from both damage to the Colombian economy and long-term political reorganization. This has had the knock-on effect most pressingly with Colombia's northeastern neighbor, Venezuela.\n\nVenezuela's exposure to the prelude, onset, and aftermath of the Colombian Civil War has fed into national and ideological differences between Venezuela and Colombia that have existed since Simón Bolívar's revolution. Adding to this, the economic situation in Colombia has led to an exodus of low-income Colombians to Venezuela, becoming a burden to their economy as well.\n\nForeign actors are known to have used the violence of the Civil War as cover to seed regime change in Venezuela (See attached folder). Combining this with the strain on Venezuela's economy has led to growing tension between Bogotá and Caracas, including public demands for action from their military leaders as well as a surge in military maneuvers along their borders.\n\nAnalysis of the tensions between Colombia and Venezuela seems to suggest that war is still a long way away. The violence of the Colombian Civil War is well-documented, and one can assume that neither Caracas nor Bogotá is in much of a hurry to invite another conflict thus far, but that can change should the situation not improve. Keeping tabs on these affairs would indeed be in our best interests."
  COL_GranColombia.5.a: "Pátria Minha - Plus Ultra"

  COL_GranColombia.6.t: "Cold Winds Over the Andes"
  COL_GranColombia.6.desc: "TOP SECRET\nEYES ONLY\nTO ALL MEMBERS OF THE [getIntelAgencyCaps]\n\nCOLOMBIA - POST-CIVIL WAR AFTERMATH - UNDER INFLUENCE BY MULTIPLE FOREIGN POWERS\n\nThe leadership of Venezuela has become increasingly antagonistic towards neighboring Colombia, with Bogotá's own enmity towards Caracas becoming incrementally mutual. The military presence on both sides has been steadily increasing, as have the demands for an immediate solution from their military leaders.\n\nThe Colombian Civil War left the economy in tatters, with reconstruction efforts slow to redress the damage. Poverty in the Colombian interior is high, coupled with trepidation from the population in the wake of the Civil War. This has led many to immigrate to Venezuela, leading to economic issues and resentment between the two.\n\nForeign interests from abroad have sought to exploit the Civil War in Colombia to attempt to spark similar events in Venezuela, using the violence from the fighting to back political dissidents and smuggle them over the border for their own ends (See attached file). This has only served to feed further animosity between the leadership of Caracas and Bogotá.\n\nOpen conflict between Colombia and Venezuela remains improbable. With recovery efforts in Colombia still ongoing and Venezuela still dealing with the fallout of recent political turmoil, potential warfare would only arise if the current relationship between Bogotá and Caracas deteriorates further. Ongoing surveillance of these events will proceed uninterrupted.\n\nMAY GERMANY BE IN SAFE HANDS."
  COL_GranColombia.6.a: "Führer Mit Uns"

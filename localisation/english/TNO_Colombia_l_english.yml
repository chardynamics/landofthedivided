  ## Colombia ##
  COL_Fall_Old_Republic: "The Fall of the Old Republic"
  COL_Fall_Old_Republic_desc: "The old order, flawed as it was, at least accomplished something none prior could: It forged a Republic, a nation-state that, despite its imperfections, guaranteed a semblance of peace and offered mechanisms for the peaceful evolution of law.\n\nThat order in tatters and in its stead chaos reigns. Corruption, banditry, cynicism, and addiction, the decay is omnipresent at every level. Even if the government were to escape its decade-long deadlock, it may be too late to undo the damage."

  COL_Paradise_City: "The Syndrome of Paradise City"
  COL_Paradise_City_desc: "Bogotá stands akin a a shining oasis. A city of steel and glass isolated from its burning landscape. It is the epicenter of political might, a densely populated sprawl of opulence, housing Colombia's industries and elite. On paper, it's a paradise. In reality, it rots under its overlord's watch.\n\nCrime festers in the shadows and the streets are ruled through fear. Injustice weaves itself into the fabric of a society traumatized, and the promised potential of this grand metropolis slips further away, swallowed by the bleak reality of a country at war with itself."

  COL_Opium_Clouds: "Opium in the Clouds"
  COL_Opium_Clouds_desc: "The introduction of Opium through the illegal smuggling markets of the Pacific and the discovery of recreational uses for marihuana in the northern coast have resulted in a widespread problem of growing demand for drugs and the consequences it has had for public health.\n\nFrom miscarriages to overdose deaths, this demoralizing vice has transformed the life of the lower classes in the republic to a limitless search for satisfaction, and their environments in cruel mixes of violence and exploitation.\n\nYet addiction is merely a symptom, a way for the meager man to distract himself from the unforgiving reality that waits outside their door."

  COL_Fields_Opportunity: "Fields of Opportunity"
  COL_Fields_Opportunity_desc: "The decrepit state of the Republic can best be observed in its benign ignorance of the state of affairs in its rural territories. With the government's influence contracting, paramilitaries and bandits have taken to ruling the countryside in the name of their betters, or merely their greed.\n\nWith the façade removed, violent acquisitions have become merely a sliver of the ruthless displayed by the new unstable yet rather profitable state of affairs. For though they may have been banished from the halls of power, the landed classes of old have not conceded their claim to them.\n\nIn due time they will return, the only question is whose banner will they pretend carry when that day comes."

  #Dynamic Army One
  COL_Fallen_Colossus: "A Battered Colossus"
  COL_Fallen_Colossus_desc: "As Colombia's most storied, professional, and enduring institution, it was only natural that its state of affairs would evolve as well. The once celebrated honor and gallantry of the armed forces fades away, eclipsed by an increasing reliance on crude violence and political campaigns to maintain its privileged place in society.\n\nYet in many ways, the Colossus could not adapt. Despite its enduring superiority to untrained militias, the army now stands as a cumbersome relic. One expensive to sustain, sluggish to mobilize, and plagued with evils deep within its once cherished soul."

  COL_Guardians_Peace: "Guardians of Peace and Freedom"
  COL_Guardians_Peace_desc: "Reform of the Armed Forces had long been thought of as a necessity, yet none had hoped for it to have occurred this way. The failed coup by General Pinilla and his cronies forced a purge of Armed Forces.\n\nWith its numbers pared down, the Colossus was easily conquered and transformed into a a more professional and apolitical force. Efforts to expand the scope of the reform to include modernization bore an unexpected success thanks to a renewal of American support.\n\nNow it is time for a live fire test."

  COL_Grand_Army_Republic: "The Grand Army of the Republic"
  COL_Grand_Army_Republic_desc: "Since the birth of the first Republic, the scornful elites of Colombia have schemed to secure power for themselves, casting shadows over Bolívar's grand project. Their power grabs and hungry maneuvering have only deepened the wounds inflicted by the ruptures of 1831 and 1903. Now they threaten to destroy the remaining shreds of the vision of unity, integrity, and justice that Colombia was designed to be.\n\nUnder General Pinilla's watchful gaze, this fallen colossus has been more than rejuvenated. With unmatched manpower and a will forged in the fires of conviction, the Grand Army is ready to march once more, prepared to end the schemes of those who would see The Republic fall. Like a storm of fire, like nature's wrath unleashed, it will cleanse the fields, leaving no trace of its enemies. The republic shall stand anew, guarded not merely on the battlefield, but in the halls of power as well."

  COL_Holy_Knights: "Holy Knights of Colombia"
  COL_Holy_Knights_desc: "Colombia's gravest mistake has been its departure from the side of Christ, a betrayal set in motion by liberalism and secularism since the Rionegro Constitution of 1863. This forsaking of divine allegiance shattered the vision of a grand nation—a bastion strong enough to guard freedom in the New World—and reduced it to a weakened sovereignty, vulnerable to even the slightest organized threat.\n\nIn answer, the rejuvenated Conservative Hegemony has reshaped it in Christ's image, as a faithful legion dedicated to an unending crusade for peace and order in the realm of the Sacred Heart. Each soldier now stands as a knight of a holy cause, commissioned to serve not merely with weapons, but with the armor of a devout heart and the fire of unwavering faith."

  #Treaty
  COL_The_Collapse_of_Colombo_American_Cordiality: "The Collapse of Colombo-American Cordiality"
  COL_The_Collapse_of_Colombo_American_Cordiality_desc: "Colombia and the United States have never been this distant, ever since the neutrality declaration of 1940 and our negative to participate in the American war effort, tensions began to rise between the two nations, culminating in the definite collapse of diplomatic relations by 1956 when the last American diplomat was recalled from Bogotá, leaving the question of diplomatic proximity with our old partner open for the national government to discuss."

  COL_Off_to_a_Fresh_Start: "Off to a Fresh Start"
  COL_Off_to_a_Fresh_Start_desc: "After a successful negotiations process, the United States and Colombia have restored their relations in full and a bright future awaits for this newfound friendship."
  
  COL_Colombo_American_Treaty_on_Friendship: "Colombo-American Treaty on Friendship and Diplomatic Cordiality"
  COL_Colombo_American_Treaty_on_Friendship_desc: "Our coordinated efforts resulted in the restoration of relations with the US in an almost complete level, with most of the pressing issues of our agendas being successfully conciliated, a healthy relationship begins to be consolidated."
  
  COL_Leaving_past_Grudges_Behind: "Leaving Past Grudges Behind"
  COL_Leaving_past_Grudges_Behind_desc: "After the negotiations, an initial settlement with the United States of America has been worked out, and while there is still a long agenda ahead of us, it's with great hope that we can say that the rebuilding of our friendship has begun."

  COL_Large_Scale_Offensive: "Large Scale Offensive"
  COL_Large_Scale_Offensive_desc: "With the restart of hostilities in Colombia, the factions involved in the civil war have intensified the offensive with the support of their foreign patrons. The conflict rages across the mountains and the jungles, until only one faction remains."

  #Shared Between Tags
  COL_Shoulders_of_Giants: "Shoulders of Giants"
  COL_Shoulders_of_Giants_desc: "To understand the reasons why Colombia burns, one must look to three souls whose legacy is the violence that now unfolds.\n\nWhile elsewhere in the nation, the assassination of Gaitán is mourned, in New Granada a requiem for a different man. Mariano Ospina Pérez, grand eminence of Conservatism, proud stalwart against the false promises of Laureanism. A man slain, hanged in the Capital's square by a mob whom the Duce and his compatriots yet claim to have its thirst for blood unsatiated.\n\nAn amusing coincidence then, for all their differences, a common chant unites Conservatives, Liberals and Socialists: Death to the lackeys of the false prophet Laureano Goméz. Death to their far-off backers in Germania and Madrid. Death to the old order.\n\nVeritias Vincit."

  COL_Saints_Sinners: "A War of Saints and Sinners"
  COL_Saints_Sinners_desc: "The radicalization brought on by La Violencia has carved a great divide within Colombian society. While many wars can claim to be brother against brother, few come close to the radicalization and dehumanization that has been plaguing Colombian society since the mid 50s. The sheer vehement for those they fight and the ignorance towards their own champion's crimes has reached a level where the war itself can be likened to one of Saints and Sinners.\n\nPillaging, banditry and murder are a common and ignored sight on every front. Yet regardless of the contender observed, a common element within the narrative remains, the war that ravages this country will be one fought to the death."

  COL_Eastern_Frontier: "The Eastern Frontier"
  COL_Eastern_Frontier_desc: "The victory over the Revolutionary Front has proven to be a pyrrhic one indeed. In ousting them from Tunja, we have only managed to push them further into entrenched jungle positions. In tearing apart their frontline, we have ensured pockets of resistance all across the East. And In executing their leaders, we have only further enraged what soldiers survived.\n\nThe testament to this "victory" is the newly inaugurated Comisaría del Oriente. A Military Government put in charge to pacify thousands of kilometers and given the means to throw as many men into the Sovereign East as needed. Make no mistake, the Colombian Civil War has not ended, it has only transitioned to a new phase."


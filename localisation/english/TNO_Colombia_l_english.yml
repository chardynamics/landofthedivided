  # Ministers
  CLC_Silvio_Villegas_hog_desc: "§YExecutive Secretary of the ANP\nFalangism§!\n--------------\n§LFew men can claim to rival the Duce in reputation in the ANP, yet Silvio Villegas is one of those few. One of the original Leopardos, a group of far-right thinkers which inspired the Duce, Silvio was viewed as the most theoretical minded of the group and the one responsible for their manifestos, or in other words, its ideologue.\n\nHis expansive knowledge of philosophy, good writing skills and oratory abilities paint the picture of a true eminence of the revolution. This, alongside his close friendship with the Duce dating back to the founding of the party, of which he was one of the first members, means his position as Executive Secretary should be no surprise.§!"
  CLC_Carlos_Echeverri_Cortes_for_desc: "§YThe Duce's Chancellor\nAristocratic Fascism§!\n--------------\n§LCarlos Echeverri Cortes is perhaps one of the most fitting people to represent New Granada on the world stage, for he matches the regime's ruling class' defining characteristics perfectly. An egotistical sycophant known to be rather unscrupulous, a hardline reactionary and anti-communist, a lover of fine art and European culture, particularly that of Italy, with which he fell in love with during his tenure as Ambassador.\n\nIt is this exact appointment that has led him here for he was the first Ambassador to Italy after the Second World War, assisting the Kingdom in entrenching its influence in Colombia, something that would directly lead to the ANP being forged. Now, Echeverri is tasked with ensuring New Granada does not forget who its biggest benefactor is.§!"
  CLC_Diego_Garces_Giraldo_eco_desc: "§YFounder of the Supremo Consejo Económico\nOligarchy§!\n--------------\n§LBorn in 1914 in Cali, Don Diego is one of the most renowned figures in his home department of Valle.A millionaire and polyglot with a long background, possessing a doctorate from Trinity College, with tenures as a diplomat, senator and businessman.\n\nDon Diego is known as the man responsible for New Granada's momentous growth over the past 10 years. Founder of the Supreme Economic Council, a cabal of New Granada's leading industrialists, his portfolio includes ownership of JGB, the sole provider of pharmaceutical goods in New Granada, and Conciviles, its main construction company. For better or worse, all economic decisions in New Granada have to go through him.§!"
  CLC_Leon_Maria_Lozano_sec_desc: "§YEl Rey de los Pájaros\nWarlordism§!\n--------------\n§LLa Violencia has left deep wounds on Colombian society and its scars will be felt for many years to come. Lozano is one such scar. A meager cheesemaker before the death of the Caudillo, the man used the chaos to organize a network of paid killers under his command. The network, known as Los Pajaros or "The Birds", served the interests of the Conservative party, being funded directly by aristocrats like Valle's ex-governor Nicolás Borrero Olano.\n\nThis servitude continues under New Granada, where the organization has evolved to become the regime's blackshirts, expanding both in operations and in manpower accordingly. What stayed the same is their leader, El Rey de los Pájaros, The King of the Condors; León María Lozano, now a shriveled old man.§!"

  CLC_Castor_Arrubla_for_desc: "§YThe Party's Chancellor\nAristocratic Fascism§!\n--------------\n"
  CLC_Guillermo_Valencia_for_desc: "§YChancellor\nOligarchic Conservatism§!\n--------------\n"

  CLC_Ignacio_Rodriguez_Guerrero_for_desc: "§YThe Modern Chancellor\nOligarchy§!\n--------------\n"
  
  CLC_Julio_Mario_Santo_Domingo_hog_desc: "§YMinister of Government\nAuthoritarian Developmentalism§!\n--------------\n§L§!"
  CLC_Lucio_Pabon_for_desc: "§YForeign Minister\nCCivilian Dictatorship§!\n--------------\n§L§!"
  CLC_Carlos_Adila_Lulle_eco_desc: "§YMinister of Finance and Public Credit\nCorporate Paternalism§!\n--------------\n§L§!"
  CLC_Alberto_Gomez_Arenas_sec_desc: "§YSecurity Minister\nMilitary Junta§!\n--------------\n§L§!"
  
  CLC_Guillermo_Valencia_hog_desc: "§YPrime Minister\nOligarchic Conservatism§!\n--------------\n§L§!"
  CLC_Jose_Antonio_Montalvo_Berbero_for_desc: "§YChancellor\nClerical Fascism§!\n--------------\n§L§!"
  CLC_Humberto_Gonzalez_Narvaez_eco_desc: "§YMinister of Finance and Public Credit\nChristian Conservatism§!\n--------------\n§L§!"
  CLC_Hernando_Currea_Cubides_sec_desc: "§YMinister of National Security\nThe Junta's Watchdog§!\n--------------\n§L§!"
  CLC_Hernando_Currea_Cubides_sec_2_desc: "§YMinister of National Security\nPaternalism§!\n--------------\n§L§!"
  
  CLC_Belisario_Betancur_hog_desc: "§YPrime Minister\nNational Conservatism§!\n--------------\n§LMoreno's attempts to reform the party are meant to bring new life into the Colombian Colossus, to make it live up to its founding ideals and to the new order it preaches. It is only fitting then that his right-hand man, Belisario Betancur be the manifestation of this new spirit.\n\nBorn in Antioquia in 1923, Belisario belongs to the young guard of the party and has become a rising star in the last ten years, acquiring a reputation for being a pragmatist, a bold fighter, a poet and yet above all, a staunch nationalist. His exploits caught the attention of Augusto Moreno, to whom Belisario has become something of a protégé.§!"
  CLC_Hernan_Jaramillo_Ocampo_eco_desc: "§YMinister of Finance and Public Credit\nManagerial State§!\n--------------\n§L§!"
  

  # Leader Descriptions
  POLITICS_GILBERTO_ALZATE_AVEDANO_DESC: "Born in 1910 in Old Caldas, Alzate is perhaps the only man who could have unified the right-wing of Colombian politics and achieved the creation of New Granada, and thus is the man most fit to lead it. A lawyer who despised his profession. A doctor, for in his own words every Colombian politician is such. A senator and a poet. He is a man of ability, most renowned for his charisma and fiery speeches; the latter of which he made great use of during his electoral campaign against his rival Laureano Gómez in the fifties and later during La Violencia.\n\nPolitically, Alzate draws heavy influence from the works of Los Leopardos, far-right thinkers who now follow him in his rebellion — indeed 'rebellion' itself being the most fitting word for his ideology of myriad reactions to the old order. Still, his primary political influence comes from Benito Mussolini's fascism, the man he modelled himself off and to whom he is an unyielding adherent. His antisemitism has proven to be equally unyielding, to the point of attempting a Colombian Kristallnacht.\n\nThe list of his acts, done in the name of this rebellion, is considerable and includes the failed march on the capital that plunged Colombia into Civil War. Though it froze in stalemate, the sinking feeling in the hearts of many persists. They know; Alzate will soon be given another chance to add his nation's conquest to his list."
  POLITICS_GILBERTO_ALZATE_AVEDANO_N_DESC: "Born in 1910 in Old Caldas, Alzate is perhaps the only man who could have unified the right-wing of Colombian politics and achieved the creation of New Granada, and thus is the man most fit to lead it. A lawyer who despised his profession. A doctor, for in his own words every Colombian politician is such. A senator and a poet. He is a man of ability, most renowned for his charisma and fiery speeches; the latter of which he made great use of during his electoral campaign against his rival Laureano Gómez in the fifties and later during La Violencia.\n\nPolitically, Alzate draws heavy influence from the works of Los Leopardos, far-right thinkers who now follow him in his rebellion — indeed 'rebellion' itself being the most fitting word for his ideology of myriad reactions to the old order. Still, his primary political influence comes from Benito Mussolini's fascism, the man he modelled himself off and to whom he is an unyielding adherent. His antisemitism has proven to be equally unyielding, to the point of attempting a Colombian Kristallnacht.\n\nWith the ideological illusion now broken, it is clear Alzate surrounds himself not with revolutionaries or ideologues but with sycophants, men who would do his bidding. And so, this shall be how New Granada marches, an army of puppets dancing to his strings."
  POLITICS_RAUL_ZAMBRANO_CAMADER_DESC: "Born in 1921, Raúl, faithful from an early age, became an ordained priest in 1944. Over the years he would become the apprentice of the Archbishop of Popayán, helping him in creating the National Catholic Union meant to handle the Church's public works in New Granada. The Archbishop would place his faith in Raúl to be the Union's first leader, a position he would use to build new schools, hospices and soup kitchens across New Granada.\n\nHis success would be undeniable and the Church would place its faith on him, proclaiming him the next Archbishop following the retirement of his mentor. Now, the redemption-seeking rogues put their faith in him to lead after the fall of the ANPn\nThe coup would warm the hearts of the masses but lingering questions would remain. The Church's relationship with the Fascist Regime remains unclear, as is the reasoning behind the coup. Yet none wishes to answer them, instead placing their faith in the new peace.\n\nAfter all, the chaos that has engulfed the country since the 50s has ended. The entire country places its faith in the regime's new face, Raúl Zambrano Camader, to chart Colombia's course through its healing process. One can only hope that their faith is not misplaced."
  POLITICS_DIEGO_GARCES_GIRALDO_DESC: "Born in 1914 in Cali, Diego is the perfect man to represent Colombia's new ruling class. Son of the millionaire Jorge Garcés Borero, known for founding the sole producer of medicine in Colombia, pharmaceutical company JGB, as well as a descendent of the very founder of Cali, Sebastián de Belalcázar.None can deny he has the heritage for the role.\n\nOne would be a fool for thinking he inherited everything in his life. He is, after all, a graduate of Cambridge University and a polyglot. His merits as ambassador to Washington and Cuba in the 40s are his as well, and it was he who expanded his family's control over their hometown and secured ownership of its largest construction company. One shouldn't forget it was Diego who founded and led the Supreme Economic Council since the 50s, responsible for New Granada's momentous growth.\n\nHe is beloved in his home department for providing scholarships and jobs for his fellow citizens. One shouldn't mistake it for benevolence alone, much hides behind his friendly smile. Whispers persist, rumours of agendas and masked deeds. However the truth, if there is any to such murmurs, lies behind a jungle of NDAs.\n\nHis father built a company renowned throughout Colombia, Diego made a monopoly and with the powers invested in him as President, he will build an empire."
  POLITICS_AUGUSTO_RAMIREZ_MORENO_DESC: "Born in 1900 in Antioquia, Augusto Ramírez Moreno is one of the few men in the ANP whose reputation rivaled Duce Alzate, and with good reason. Moreno, now entering his 70s, has spent his entire youth lighting the fires and paving the way for the revolution that now claims Colombia.\n\nA fervent nationalist militant for a new conservatism since the age of 17, he partook in several intellectual clubs, most famously being one of the founding members of Los Leopardos, a group of far-right thinkers carrying a name of his selection, which forged the framework of the Colombian right's ideology. As he aged he would continue to be afflicted, in his own words, with a disease that "makes one unable to bow". This malady has led many to brand with a term of his own creation; an "arrogant gentleman". To him a statement of manner and conviction, to others a deep eloquent hypocrisy.\n\nPolitically, Moreno is a national conservative, for though he co-signed the group's more radical manifestos, his personal ideology draws heavy influence from the works of Benjamin Disraeli, a man whom he holds in high regard. From his idol has come shape for Colombia's future; Colombia needs to be governed by the aristocracy of probity and the consecrated lineage of intelligence.\n\nPerhaps it is fortunate then that the state is now led by someone with such a track-record, for Colombia is in dire need of someone willing to fight for its future."
  POLITICS_SILVIO_VILLEGAS_DESC: "The renowned ideologue of the Leopardos movement, Silvio Villegas, born in March 19th, 1902, is a man-of-action, an emblem of tenacity, yet most importantly, a burning demagogue of reaction. The man whose protégé, Gilberto Alzate, had become the flag bearer of his corporatist ideals, and the man who brought together the extreme-right — though his leaning towards the Falange is almost out-of-time and his racism seems unusual for Colombians, he still stands tall amongst his lot despite his years.\n\nCalled an erudite by some and a fossil by others, Villegas has been part of the reactionary revolution long before New Granada was founded. A close collaborator with Alzate and founding member of the ANP, his ideological background is one combining Iberian Falangism with a loose conformity to Catholic social doctrines. Utilizing his rhetorical expertise, he had managed to convert much of his fellow fascists into accepting his teachings as a part of orthodoxy, if divergent from Alzate's leanings.\n\nNevertheless, wise Villegas, who hailed from old-fashioned Caldas bearing the fasces, had fully managed to garner himself an admiring crowd not only amongst his lieutenants and underlings, but also coming from the lowliest of faceless bureaucrats. With his iron fist now over the government, conservatism has not merely triumphed, it has found itself a worthy steward to let it grow for another thousand years."
  POLITICS_FERNANDO_LONDONO_X2_DESC: "Born in 1910 in Manizales, Fernando is known as a true son of Old Caldas. At the age of 19, he was already a deputy to the Assembly of Caldas, being appointed two times as Governor of the department by the President and even being publicly elected after the introduction of democratic elections. A selfless doctor and diplomat, he served as Minister of Foreign Affairs during Ospina's term. He is a man who has enjoyed a vibrant career few could aspire to.\n\nHis career would take a rocky turn during La Violencia as insurrectionists threatened the stability of the Republic, personally ensuring such chaos would not reach Caldas...by any means necessary. He would later join the ANP's march on the capital, whose rise he presided over alongside his friend, Duce Alzate.\n\n"Golden Beak", as he has come to be known, is known as one of the best orators in Colombia. The best in fact, according to the 1941 public poll on the matter, and it is these skills he has come to use as Propaganda Minister for New Granada.\n\nNow entering his 60s Don Fernando answers the call once more, for the Party and Colombia need a familiar and soothing voice to calm it while the fires outside burn ever hotter."
  POLITICS_BELISARIO_BETANCUR_DESC: "Twice in five years did the ANP demand a champion, twice in five years did the nationalist wing accept the gauntlet, yet in the Presidential Palace stands not an aged despot but a new man, a strong man.\n\nBelisario Betancur, born in 1923 in Antioquia, is that man. A doctor, journalist, poet and politician starting as a member of his department's assembly in 1945, he continued his rise even after La Violencia, where he sided with Alzate's ANP. Belisario is known for being on good terms with many of the party's hierarchs, including Don Fernando and ex-president Augusto Ramírez Moreno, who would become his backer, though his connections extend even further.\n\nIt is this reputation of a courageous nationalist, a politician to the core and who keeps the people close to his heart, that he established these connections that would cement his rise to power and assure him the backing of such a large amount of the party. Now he stands as the party's champion, the personification of Alzate's courage and Moreno's pragmatic reformism, the face of the New Right."
  POLITICS_JARAMILLO_OCAMPO_DESC: "Interested less in the human side of state-building and more in the numerical end, Hernán Jaramillo Ocampo is a ruthless financier more than a conventional rabble-rousing politician. Born on October 13, 1915 and son of Old Caldas, the geographic cradle of Colombian reactionism, his upbringing unsurprisingly nurtured his mind towards right-wing authoritarianism from conception — and surely, this ideological isolation also turned him into an exceptionally stubborn fellow, even more so than many of his most ardently traditionalist peers.\n\nWith a policymaking stance defined by obsession and focus, Jaramillo Ocampo hardly ever managed to find wrong in his methods, and often proved intolerant of criticism to the extreme. Yet, he remains a foremost expert regarding Colombia's economic matters and, surprising as it may be, on wider national politics, a subject intrinsically tied to him due to his personal friendship with the far-right Leopardos and Alzate. However, the begrudging respect he'd earned amongst his economist peers had always been tested by his connection with Colombia's coffee barons.\n\nNow President of a new Republic, Jaramillo inherits an unenviable position and a singular task, to turn the rot of the 60s into gold, time will tell if he succeeds."
  POLITICS_CASTOR_ARRUBLA_DESC: "Every organization needs men to accomplish tasks its leaders would prefer not to dirty themselves with. Some may call them henchmen, others mere puppets. Either way, Castor Jaramillo Arrubla can be counted as one of them, but he is much more.\n\nBorn in 1914, Castor is one of the longest standing allies of Old Caldas, he would make himself known for turning a blind eye to violence against the liberals during his term as Governor. Some would be quick to label him a Fascist, like Alzate, to whom he swore allegiance when the ANP was formed, but he is much more than that.\n\nA closer glance would reveal his long tenure as Minister of Labour under Ospina in the late 40s and under Alzate from the 50s into the post-war era. A tenure of over ten years of service and a period in which he unquestioningly pushed through policies for the regime, several of which could even be called progressive in nature, for Conservatives that is. A moderate then?\n\nNow he stands as the newly elected head of state of Colombia, following Villegas' departure. Now it is clear who put him in power and whom he serves. Castor is the face of Old Caldas, the hand that writes what greater men may have said. He stands as one of the many faces of Conservatism."
  POLITICS_GUILLERMO_VALENCIA_DESC: "Cultivated, full of pomp, and perpetually filled with a daring, if condescending smirk, Guillermo León Valencia is conservatism taken back to its roots. Born on April 27th, 1909, to a line of landed aristocracy and politicians, his quixotic, almost archaic, manner of conduct is less so a natural product of his character than an imitation of his upbringing — having learned foremost to combine an odd intellectual charm with an oft-pondering appearance, despite a genuine lack of bookish interests.\n\nSon of the one and only "El Maestro" whose name he bears, Guillermo has learnt from an inordinate amount of philosophical lectures to affect the spirit of a sincere Christian, devout to his cause and agreeable to most — and according to some of his followers, even echoing the Bolívarian spirit of fair governance.\n\nGenerally thought of as competent enough despite the evident nepotism which placed him atop the throne, through the lineage of power coming from the nobility of the Cauca department, of the original builders of New Granada's ideals. Though this "princeling," as critics derided him, may not have been a self-made man, his inborn propensity towards leadership must not be in vain. With his many ambitions all concerted towards his now-presidential authorities, Valencia will not let his privilege go to waste."
  POLITICS_HERNANDO_CURREA_CUBIDES_DESC: "A career soldier, decorated hero, and a hard ruler, Hernando Currea Cubides, born in the year of the Lord 1919, had served the republic for decades through its highs and lows — and it took him not long to realize how truly unsalvageable the status-quo in Colombia has become. As he ventured west with a band of his troopers, he maintained the same dignity while serving the old regime, bearing the stock of traditionalism and nobility he'd been instilled with since his youth. Often seen wearing a set of ceremonial uniform during public visits and conferences, Currea kept himself a distant, if not entirely murky, personality.\n\nYet behind closed doors, Currea is a source of many rumors amongst even his liaison, from allegations of esoteric beliefs to odd accounts of unconventional worship; some had even suggested him to have connections with General Franco over the Atlantic, through the infamous Bogotá embassy. Nonetheless, his current leadership is not a choice anyone had, not even himself; and for the most part, he has done well enough to keep a sinking boat afloat amidst a national emergency, inspiring and chastising whenever needed, his will shall not falter so long as his trusted circle of allies can continue their support."
  POLITICS_HERNANDO_CURREA_CUBIDES_NATCATH_DESC: ""
  POLITICS_HERNANDO_FORERO_GOMEZ_DESC: "Very few men honestly know what they want, and even fewer know how to squeeze that out by force. The stone-faced Hernando Forero Gómez, born on October 13th of 1915, has a grim determination to anticommunism so rare that he became a treasured asset to the Republic's institution. As the Chief of Police, he was a ruthless, if resourceful, workhorse who scarcely minded the costs of his job — executing whatever tasks were given with clinical precision, even through seemingly illogical consequences.\n\nLater as he assumed the same role in Cali, he remained ever secretive in his methods, making his way up the bureaucratic ladders through sheer force and determination. As he became more of a public figure, so did he have to play a façade of openness, yet not many know this steeled militarist beyond his image of immaculate duty — for those looking further tend not to make it far.\n\nEver unflinching and quiet as he assumes authority, no one ever knows for certain what Forero thinks, or even what he wants. But no matter how much their curiosity, their desire to witness more about the mysterious general itches their hearts, they still understand wholly that if he ever utters a command, it is finalized."
  POLITICS_HERNANDO_FORERO_GOMEZ_FASC_DESC: ""
 #### Nazis ##
  CLD_Jupiter_Reaction: "The New Jupiter of Reaction"
  CLD_Jupiter_Reaction_desc: "In the cornerstones of Bolívar's grand vision, we find the bedrock of our own struggle. The tragic downfall of Laureano Gómez and Roberto Urdaneta left our movement adrift, orphaned of its guiding hands.\n\nYet, despair has no claim upon us, for out of these darkened times, we have been graced with a new caudillo to lead us forward. Alfonso Uribe Misas, Governor of Antioquia, has risen from the ashes of our once-great party, rallying us to stand tall and fight for the noble cause championed by the leaders of old."

  CLD_Heldanomics: "Doctor Held's Remedy"
  CLD_Heldanomics_desc: "Under the steady guidance of our German allies in the diaspora—those who have generously shared their technical prowess and dedicated their expertise to the cause of renewal—we stride boldly forward.\n\nOur foremost ambition is clear: to reshape our economy and embark upon audacious industrial ventures that will transform this untamed and resplendent land, a realm we hold in fierce and proud defense."
  
  CLD_Last_Knights_Old_Republic: "The Last Knights of the Old Republic"
  CLD_Last_Knights_Old_Republic_desc: "Colombia, the great Bolivarian republic, lies in its death throes, betrayed by its supposed protectors and consumed by dissent, estranged from God and tradition. It bleeds before our very eyes—a wound that has festered for far too long.\n\nIn its darkest all, when no one else answered its anguished call, a small band of veterans from the Leticia War—Villamizar, Gil, Bonitto, and Boy—rose to its defense. Joined by their trusted companions, they forged what we now hail as the Second Patriotic Army: the pride of our cause, the vanguard of restoration, and the final hope for the Old Republic."

  CLD_Birthplace_Old_Republic: "The Birthplace of Colombia"
  CLD_Birthplace_Old_Republic_desc: "The North—Cartagena, Barranquilla, Mompox—a gilded fragment of Colombia's storied past. This was not only the first land graced by the Spaniards' arrival but also the refuge where the union of free peoples, destined to shape Colombia, found sanctuary. While other regions clung to the crown or descended into turmoil, the North stood as a bastion of resilience.\n\nIt is a poetic turn of fate that we, the sworn defenders of this time-honored order, find our strongest allies here. Amidst the sweltering heat and misty marshlands, the North beats as the heart of Colombia—and the pulse of our cause. Just as it did 160 years ago."

  CLD_German_Support_dynmod: "Pakt Support"
  CLD_German_Support_dynmod_desc: "The Second Patriotic Army is joined in its anti-communist crusade by a coalition of nations from the heartland of Europe. Iberia, France, and Germany, all offer military training and experienced advisors that will offer an edge on the battlefield.\n\nThe fact this aid further ties the state to the Pakt and strengthens the already notable Germanophilia present in the PCC is a mere benign consequence."

  CLD_German_technical_assistance: "German Technical Assistance"
  CLD_German_training: "German Training Support"
  CLD_German_advisors: "German Advisors"


#National Spirits
MOR_Lyautey_Kingdom: "Lyautey's Kingdom"
MOR_Lyautey_Kingdom_desc: "Both Iberia's protectorate over Morocco, as well as the Moroccan kingdom's internal structures, are still fundamentally products of Hubert Lyautey, a French colonial officer from the early 20th century. This legacy is still keenly felt today through various administrative structures, such as the language of governance still being French, and the landed nobility being relied on as key vassals of the colonial administration.\n\nChief among Lyautey's legacies is that all of the extractive institutions within Morocco work indirectly, but very effectively, to create a state where the vast majority live in dire poverty, while a class of collaborationists, colonial administrators, and foreign businessmen exploit Morocco for all its worth and live in relative luxury. Those holding the reins of power may change, but the system ultimately remains the same."
MOR_Makhenz_Istiqlal: "Makhzen and Istiqlal"
MOR_Makhenz_Istiqlal_desc: "Morocco's internal politics can be divided into two distinct factions. The first is the Makhzen, who make up the royal court, the nation's security forces, and the Army. The second is the Istiqlal, the elected mass party that dominates Morocco's electoral politics. Both desire Morocco's eventual independence, but the Makhzen possess a far friendlier perspective towards Iberia. Meanwhile, conflicts also emerge over the significant leftist contingent within the Istiqlal, whom the Makhzen despises.\n\nFor now, the two factions exist in uneasy collaboration. That is, until an opportunity for one to safely dispose of the other arises.That tension could very well doom both the Makhzen and the Istiqlal in the coming years."
MOR_Nation_Long_Shadow: "The Nation's Long Shadow"
MOR_Nation_Long_Shadow_desc: "In many ways, Morocco is defined politically by irredentism. Both of the nation's ruling factions are extremely irredentist. The Makhzen and Istiqlal view Mauritania, Western Sahara, and several other regions as rightful Moroccan territory stolen from them by the colonial powers.\n\nWhile some nations may hold irredentist fantasies isolated to segments of its ruling class, such is not the case in Morocco. The nation's people are more than willing to rally to war for what they perceive as Morocco's rightful lands. A mere mention of reclaiming Western Sahara or Mauritania is more than enough for any government official or faction to gain political credibility, for better or for worse."
MOR_Letat_Cest_Moi: "L'Etat c'est Moi"
MOR_Letat_Cest_Moi_desc: "When Iberia gained control over Morocco, it inherited the systems and legacies established by French colonial rule. Now those same systems once imposed by France are once again being grafted onto a fresh regime. This new regime, an independent Moroccan kingdom, certainly possesses more vitality than the old protectorate, but nonetheless it shares a great deal of characteristics with its predecessors. King Hassan's government continues the corruption and extraction that the French established, but has done away with decentralized, aristocratic rule.\n\nThe King has no use for regional elites. All must serve the Makhzen, or be shattered."
MOR_One_Nation_One_Party: "One Nation, One Party"
MOR_One_Nation_One_Party_desc: "Rejoice! The King and his court of thugs, thieves, and foreign stooges have been done away with at last! Now the Istiqlal have the power to establish a new, republican government, based on the ideals of parliamentary democracy! Or at least, such is true in theory. In reality, that democracy is illusory at best. The Istiqlal is by far the most popular party, and wields full control over the nation's civil services and security forces. They command virtually all of Parliament, and can crush opposition groups at their leisure.\n\nAdditionally, with no colonial power to hate, the anti-colonial tendencies that once passed for an ideology have now faded away into nothing. The Istiqlal's new republic is as ideologically empty and ultranationalist as the kingdom that preceded it."
MOR_Glory_Soldier_Glory_Martyr: "Glory to the Soldier, Glory to the Martyr"
MOR_Glory_Soldier_Glory_Martyr_desc: "When the Iberians closed their vice grip around Morocco, and the colonial government in effect directly ruled over the people, Moroccan politics were flipped on their head. Both the royal court and the Istiqlal were shattered, unable to find any purchase in a time where only military force ruled the nation, where only military force made sense.\n\nThe heroes of the Moroccan nation, who struggled to see the Iberians gone for good, were Morocco's soldiers, not its politicians. The Iberians made it clear that freedom only came from the barrel of a rifle, and now Morocco's realized that the same holds true for the government. From now on, Morocco shall always be led by soldiers, the nation's glorious martyrs."
MOR_No_Longer_Fool: "No Longer the Fool"
MOR_No_Longer_Fool_desc: "The old colonial structures of rule that governed Morocco for generations have been well and truly shattered, reduced to nothing but ashes in the wind. The petty pashas and qaids that served their colonial masters in France and Iberia are no more, sent scattered back to their true homes in Europe, never to return.\n\nIn the place of petty warlords, foreign businessmen, and parasitic aristocrats, now only the directors of Rabat shall rule the nation. A centralized system of governors shall be established, so that Morocco can truly be united as a nation."
MOR_National_Reclamation: "The National Reclamation"
MOR_National_Reclamation_desc: "Rejoice! Rejoice as an age-old territory of the Moroccan people has finally returned to the fold. Rejoice as the Sahara is reclaimed, for Greater Morocco is now on the cusp of fruition, lying beyond just a few more conquests yet to be achieved! Morocco's destiny is close at hand!\n\nRejoice as settlers depart to the Sahara to establish order to a land that has forgotten its place in the world! Rejoice as those who do not stand with the Moroccan nation are cast out! Rejoice!\n\nAs the local populations of the Sahara are subjugated and expelled, Moroccan nationalism has reached a fever pitch, and the fervor shows no signs of breaking."
MOR_Modern_Absolutism: "Modern Absolutism"
MOR_Modern_Absolutism_desc: "The old, anti-colonial parties have been broken. Those who attempted to resist royal governance have either been killed, disappeared, or have fled into exile. The dual nature of Moroccan politics has been irreversibly shattered, and now there only remains King Hassan, sole ruler of Morocco and its people.\n\nDespite the calls from his courtiers to do away with mass politics entirely, King Hassan has not abolished the Parliament. There is no need to do so, now that only those loyal to the Crown remain. Now Parliament shall act as the monarchy's faithful shield, enacting unpopular policies on the King's behalf, while being given permission to steal as much as they like in exchange for their loyal service."
MOR_Madrid_Hand: "Madrid's Hand"
MOR_Madrid_Hand_desc: "With Hassan II rendered a mere puppet and the Parliament dissolved, the old structures of Moroccan politics have crumbled beneath Iberia's iron grasp.\n\nThose of the Istiqlal that survived Madrid's crackdown have fled to the mountains, seeking to join with the ALN. Even the Army, who tortured and massacred countless ALN members, now turn a blind eye to their activities, their commander-in-chief having been imprisoned by the Iberians.\n\nWith each passing night, more and more peasants and soldiers disappear into the ALN's ever-growing ranks. Can Madrid's grip on Morocco hold?"

 #Events
 MOR_IBR.1.t:0 "Atlas Chained"
 MOR_IBR.1.desc:0 "Situation Report: Sultanate of Morocco in [?global.date.GetDateStringNoHourLong]\n\n1. The situation in the Sultanate of Morocco is presently stable. However, it is increasingly doubtful the status quo will last.\n\n2. It is crucial Morocco remains stable and under our control, due to its strategic position and wealth in natural resource such as oil and uranium. With many deposits still untapped, Morocco's value to the Iberian Union will only grow further.\n\n3. This value depends on collaboration with King Hassan II and the Royal Court. At this time, the King and Court are collaborating more or less willingly, but their deference is reduced as of late. The fact that Morocco is not a colony but rather a protectorate leaves us reliant on the Moroccan government to exert indirect rule over the country, which in turn limits the amount of demands we can make on them.\n\n4. One reason why the Moroccan court and government are showing signs of defiance is the emergence of an independence movement led by the Hizb-al-Istiqlal (Independence Party) which argues that the Union's economic stagnation exerts unnecessary strain on the region and that continued Iberian presence, described as mere "exploitation", is contrary to the interests of the people of Morocco. This argument, despite its falsity, is gaining traction amidst Moroccan civilians.\n\n5. King Hassan's authoritarian tendencies and desire for reform have led to the government exhibiting increasingly obvious signs of chafing under our rule. Sources within the Palace suggest that the political elite tire of "legal vassalage" to us. If these rumors are true, maintaining stability will become increasingly difficult; however, the ongoing Rif War against the King's enemies provides us a temporary reprieve on that front."
 MOR_IBR.1.a:0 "...but for how much longer?"

 MOR_IBR.2.t:0 "A Meeting of the Despots"
 MOR_IBR.2.desc:0 ""So, your government has finally crushed the revolt in the Rif after all those years of fighting," Franco's tone sounded almost disinterested, and his expression was neutral. King Hassan II had requested this meeting to discuss the ongoing changes within his country with the Caudillo, and both leaders were eager to demonstrate that they held the upper hand within the new status quo. Franco's small jab did not go unnoticed, and it would not go unanswered.\n\n"Yes, Moroccans know how to stop a rebellion. In addition, the Istiqlal and the moderate nationalists have agreed to cooperate," replied Hassan.\n\nFranco's expression didn't change, and after a moment he responded, "If the Istiqlal have agreed to cooperate, then that would imply the Crown has agreed to capitulate to their demands for a more constitutional system."\n\n"While Morocco will officially be transitioning to a semi-constitutional model, in reality I will still retain all of my existing powers," Hassan let his confidence ring through in his tone, and he thought he spied something flicker across Franco's face. The room fell into silence, that the Caudillo seemed content to let hang in the air, until Franco eventually broke the silence."
 MOR_IBR.2.a:0 ""Then we shall see how long this cooperation lasts.""

 MOR_IBR.3.t:0 "REPORT: ARMY OF NATIONAL LIBERATION"
 MOR_IBR.3.desc:0 "CONFIDENTIAL - FOR AUTHORIZED EYES ONLY\n\nACTIVITIES OF REBEL FORCES:\nRABAT:\n\nWhile King Hassan's government has managed to suppress the Rif revolt, independentist guerrilla forces continue to wage resistance across Morocco. In recent weeks, various independentist groups have united under a single banner: the Army of National Liberation. Reports have also been confirmed that this newly-formed organization has established links with aligned forces in neighboring Algeria.\n\nThe Army of National Liberation remains a relatively minor force compared to legalist independence movements and the Crown, however they continue to grow at a nearly exponential rate. This rate of expansion is likely to continue until a solution regarding the status of the Moroccan protectorate is enacted.\n\nCooperation with Moroccan security forces has already been initiated in order to contain the situation."
 MOR_IBR.3.a:0 "Further updates will be provided as the situation develops."

 MOR_IBR.4.t:0 "The Fate of Morocco"
 MOR_IBR.4.desc:0 "King Hassan II once again sat across from Franco within the Caudillo's office. Franco was currently reviewing intelligence reports regarding the situation within Morocco. Hassan figured it was in-line with what Hassan's own government had reported.\n\nFranco eventually set the papers down and broke the silence, "So you are here to request that Morocco's protectorate status come to an end."\n\n"Yes, the status of protectorate isn't sustainable. I think it is in our best interests to renegotiate the relationship between Morocco and Iberia, chiefly that Morocco be granted its full independence," stated Hassan. If Franco had agreed to this meeting, he was fairly certain to agree to granting Morocco independence. Anything else was sure to end in disaster.\n\nFranco remained silent. Hassan explained further, "While Morocco would of course remain close with Iberia on diplomatic and economic matters, the nationalists in my government won't compromise on the matter of the colony in Western Sahara. It's a line in the sand they refuse to concede, they won't agree to any deal that neglects it."\n\nFranco remained silent for an agonizingly long time, although it was surely only measured in seconds. The stability of both of their nations relied on this meeting going well, and Hassan couldn't read the Caudillo's expression. Finally, Franco gave his response:"
 MOR_IBR.4.a:0 ""We can accept those terms.""
 MOR_IBR.4.b:0 ""If they are so stubborn, then they can forget about independence.""

 MOR_IBR.5.t:0 "REPORT: MOROCCAN INDEPENDENCE"
 MOR_IBR.5.desc:0 "CONFIDENTIAL - FOR AUTHORIZED EYES ONLY\n\nTHE POLITICAL SITUATION WITHIN MOROCCO:\nRABAT:\n\nHaving agreed to the Moroccan government's demands for independence, Morocco's protectorate status has come to an end. In addition, all Iberian colonies in the Maghreb have been ceded over to Moroccan control, besides the ports of Ceuta and Melilla. The political situation in both port cities remains stable.\n\nThe political strength of the monarchy is expected to grow more dominant in the wake of independence. Already, we've received reports that King Hassan II has attempted to use his powers to push back against the elected government. Surveillance of the political situation will continue to ensure that Iberian interests are not endangered by future developments.\n\nFinally, Iberian economic dominance over Morocco is expected to continue after formal independence. Many Moroccan assets and resources are owned by Iberian businessmen and corporations, and we have confirmed that King Hassan's government has no intention to undertake any nationalizations. As stated above, the situation will continue to be monitored to ensure that the situation within Morocco remains favorable for Iberian interests."
 MOR_IBR.5.a:0 "Conclusion: Moroccan independence will not hurt Iberian interests within the region."

MOR_IBR.6.t:0 "Wijhat Nazar"
MOR_IBR.6.desc:0 "A merchant in Tangier uneasily massages his chin. With the unification of Morocco with Western Sahara, his motherland had grown even larger. It was an event to be celebrated, of course; his homeland could finally breathe free from the Hispanic yoke, now unified with its southward brethren. And yet, what of the Spanish tourism he so relied upon? Would his business survive the years to come?\n\nA decorated officer of the Royal Army smiles with elation. Hassan II, blessed with divine intellect and intuition, had earned his nation's independence without sullying his hands with the methods of terror employed by the ALN. Such sovereign action could only bode well for the tribulations to come. Under such discerning leadership, what glories awaited the Moroccan people yet?\n\nA Marrakesh intellectual, storied in the teachings of Marx and Barka, delights at the sight of the Iberians vacating his motherland. Still, the monarchy remains; a puppet regime in all but name, enslaved to the whims of Madrid. The siren call of revolution echoed ceaselessly within his mind. By pen or by blood, liberation was fast approaching. Would he be ready?\n\nA group of villagers narrow their eyes upon the horizon, spotting a column of soldiers marching toward their village. The strangers quickly dig their shovels and excavators into the earth, carefully measuring each acre of farmland and dirt-laden street. "Urbanization efforts," they say to the village elders. A military garrison soon emerges from the concrete and sandbags. For the villagers, peace would become a distant memory."
MOR_IBR.6.a:0 "Is this freedom?"

MOR_IBR.7.t:0 "Mirage"
MOR_IBR.7.desc:0 "Blinding light flooded the room as the cell's door opened, causing Jubair to wince. He instinctively tugged against the roping that bound him to his chair. From the light came two shadowy figures, clad in neat uniforms and equipped with truncheons upon their belt. He could just barely make out insignia upon one of the officer's sleeves: "DST." The iron door slammed shut, returning the room to its hazy dimness; whatever poor light could illuminate it came only from a veiled window to his left, obscuring rusted iron bars driven into rugged limestone walls.\n\nAn officer dragged over a chair from a nearby corner, placing it in front of Jubair before sitting upon it himself. In the ensuing silence came a throbbing pain from Jubair's lower lip; he groaned slightly. A previous beating, though not by this man. There were others. Many others.\n\n"So," muttered the officer. "We've had a talk with your fellow fieldhands, and they've already admitted to workplace disruption." Jabair winced. A feckless term for unionisation. "Make no mistake, your comrades have already been handled. Written confessions, statements of guilt; we've procured all that we need from them." He paused, scratching at his left cheek. "All that is left is you, my stubborn little friend."\n\nJabair's lip trembled against his own accord. He could feel the pain drilling into his bones. "We were promised freedom. The Iberians, they..." He paused, sniffling. "They would leave, and we would have land. Our conditions would improve. Our pay would increase. And yet, none of this has happened."\n\nThe officer nodded quietly. "I suppose it hasn't," he responded. Rising from the chair, he nodded to an officer, pulling the cell's door open. Indiscernible mutters were exchanged, yet Jubair couldn't understand any of it. He barely understood why he was here, alone with his pain. Where was the freedom and prosperity they were promised?"
MOR_IBR.7.a:0 "Suffering, then silence."

MOR_IBR.8.t:0 "Overextension"
MOR_IBR.8.desc:0 "The Resident-General's mansion was much larger than it needed to be. Its artificial lake glistened like obsidian as one of the Iberian officers stepped away from the oversized balcony and back into the pristine white walls lined with drab olive uniforms.\n\nWalking up to the Resident-General, the officer found the heels of his boots drilling into the terrazzo. As a viceroy of Morocco, its loyalty reflected on him. "He's... maneuvering," the Resident-General mumbled. "Moving people around — stretching the limit of his power, really." He coughed. "It's... not good."\n\nThe Iberian officer sat down adjacent to the Resident-General. From what he had heard so far, this must be a matter of independence. How vexing. His state had given the puppet-king everything that he ever wanted, and yet he decided to act like a rebellious child. "What do you propose?"\n\nOn cue, every other Iberian in the room turned to face the Resident-General.\n\n"Before we can attempt anything, the Moroccan army... they are loyal. The King made sure of that." Another cough — dry, forced. "Well, certainly... there is the matter of overextension. But the most effective way of dealing with this would be to disband the army and replace it with our forces."\n\nOverextension. This has always been the issue with Iberia. Some even said that controlling Portugal was "overextension" (let alone keeping their combined African territory). But isn't it the nature of any great state to extend its reach? These chickenshits along the coast and one unruly kingdom were nothing compared to a quarter of the world which their two halves used to control."
MOR_IBR.8.a:0 ""The King must have his wings clipped.""

MOR_IBR.9.t:0 "Marionettes"
MOR_IBR.9.desc:0 "Sergeant García sat on the white patio seat, one of the few left standing in the street. The Tangier sky shone with a dull orange, a nearby building across the square burning uncontrollably. No one came to stop it, aside from its crackling no sound remained. What had once been bustling with locals and tourists lay dead, the distant sounds of sirens and occasional gunshots drowned out by the void of sound. García sat, rifle still ready in his hands, and suppressed a tired sob.\n\nHe'd been part of a checkpoint, set up as part of their efforts against the ALN, until hours ago the entire city exploded into an orgy of violence. A few dozen men had manned that checkpoint, half had escaped into the streets trying to flee to the outskirts, their final radio order being to retreat to the coast. Only he remained, his rifle all that remained of his posting after discarding his uniform for civvies.\n\nThe floor at his feet was stained dark scarlet, corpses lying like broken puppets all around the shop front adorned with shell casings. It must have been a cafe, filled with tourists. From the looks of them, most had barely had a chance to react. Their bodies were contorted unnaturally across tables, chairs and the ground, faces ingrained with the shock and fear of their final moments. Men, women and children all motionless, dull eyes staring into oblivion. García tried not to look at them too long, but his nose betrayed him, the stench of death overpowering him. The interior of the shop was black as tar, and he feared it.\n\nAfter his moment's rest, he sat back up, fearfully surveying the square's buildings for any movement. His ammunition was low, he had no radio and no one knew where he was. He was alone, and his heart pounded as his ears strained for any suspicious sound.\n\nHe stood up, and continued his cautious trek. He didn't want to die here. He thought of his wife Emilie, his son Franco. He thought of the coast and thought of them - there had to be a way out. He didn't want to die."
MOR_IBR.9.a:0 "A story with an unknown ending; every victory a tragedy."

MOR_IBR.10.t:0 "Circus Lion"
MOR_IBR.10.desc:0 "To be a king, one above the common people, and to find yourself beneath the boot of the pleb must be quite humiliating one must say. Hassan II is now too familiar with this notion, as he looks out a window, contemplating a scene outside his palace where a Moroccan guard is swiftly told to move out from the place by Iberian commandos, the same people that have been for a couple of hours now following him wherever he went through the facility.\n\nPeasants, lowlives, the lot of them. How could they do this to him? The balance of power between Iberia and his kingdom was no surprise to him, but the Iberians hadn't dared to effectively take him as a prisoner in his own domain and dispatch his own men with a mere handwave. All he could do was grit his teeth and smile politely at his captors while anger brewed in his chest, leaving him ever so closer to lash out in order to put these filthy curs back in their place, or so he imagined - perhaps prayed even - that he'd do.\n\nFor now, he seethed in silence, contemplating his captors moving throughout the compound."
MOR_IBR.10.a:0 "...That guy's hat is put on backwards."

MOR_IBR.11.t:0 "My Enemy's Enemy"
MOR_IBR.11.desc:0 "Just a year ago, if someone had asked Bilal whether he could see himself face to face with a royalist officer without clawing the man's eyes out, he would have laughed them right out of the building, perhaps making a snide remark about their state of mind as they left. Roughly eleven months later, there he was, giving a haughty looking man in a military uniform a look that could genuinely kill.\n\nThe man paid his animosity no heed. When he had been captured following a raid upon the local militia, he had expected death. Now, he was being poured tea by a well-dressed servant as the military man cleared his throat. "Good evening, my friend. Apologies for the way in which we procured your presence - we could not trust that you would cooperate, otherwise." Bilal scoffed. That was an understatement. "We are aware of your past... encounters with his Majesty's forces, but are willing to put those differences aside for a greater goal. Work with us."\n\nBilal would have choked upon his tea, had he drunk any of it. The audacity alone could have killed him. "Is this a joke? Why on earth would I help you?! Or that tyrant, for that matter? Just a year ago, your men were torturing my comrades!"\n\n"Simple. Think of it as less of an alliance, and more as an alignment of goals. It is the Europeans." Bilal clenched his fists. He was right, if there was one group he could not stand, it was the colonists. "They must go, that we both agree. Their attacks upon his Majesty's sovereignty cannot be countenanced. Many of your associates in the ALN have agreed already. And when our combined strength is great enough, we can strike, throwing them out. If you and your comrades cooperate, that is." The man moved to get up, but Bilal's hand shot out, keeping him in place.\n\n"Before you leave, let me make one thing absolutely clear. I care not for what you have heard from my friends, nor my allies. If - and that is if - we ally ourselves, however briefly, the moment the Europeans are gone, we are once again enemies. Am I understood?" There was something harsh and steely behind the man's eyes, before he nodded his head."
MOR_IBR.11.a:0 ""Of course.""

MOR_IBR.12.t:0 "Después de Nosotras la Inundación"
MOR_IBR.12.desc:0 "TOP SECRET\nCOMMUNIQUE TO GIBRALTAR STATION: FOR IMMEDIATE ATTENTION\n\nIBERIAN NORTH AFRICA COMPROMISED. MOROCCO OVERRUN. AUTHORITY PRESERVED ONLY IN:\n\nRIF\n\nIFNI\n\nWESTERN SAHARA\n\n"ARMY OF NATIONAL LIBERATION" MILITANTS CONTROL ALL ELSE. APPEAR TO BE MOROCCAN NATIONALISTS. ASSETS OUTSIDE NOTED REGIONS CONSIDERED LOST. NO OFFICIAL COMMUNICATIONS RECEIVED. REPORTS OF VIOLENCE DIRECTED AT FOREIGN NATIONALS ACROSS REGION. IBERIANS TARGETED. EVACUATION MEASURES ENACTED. CLASHES WITH ALN MILITANTS FREQUENT AND THREATEN COHESION OF SURVIVING FORCES.\n\nASSESSMENT: FLN CONTROLLED REGIONS IMPOSSIBLE TO PACIFY WITHOUT HUGE/PROLONGED COMMITMENT. IFNI AND RIF MAINTAIN DEFENCE CAPABILITIES. PRESERVATION OF IBERIAN AUTHORITY HIGH PRIORITY."
MOR_IBR.12.a:0 "The folder was thick with panicked messages; all read the same."

MOR_IBR.13.t:0 "The Gates of Ifni"
MOR_IBR.13.desc:0 "Aryeh Amar looked through his telescope at the city before him. It was still, little signs of any inhabitation showing. No cars or people were visible. A dead city, nothing but a handful of birds floating ominously over the corpse of a city. He lowered the telescope and sighed. It was time.\n\nHe lowered his telescope and turned back to his tent and the waiting men. They were eclectically dressed, some of them wearing formal officer uniforms and others in little more than civilian clothes with armbands. They all stood before him expectantly however, stood waiting expectantly like stone plinths in a hot sun.\n\n"Gentleman," Amar began, "today the liberation of Ifni begins. This represents the culmination of all our campaigns so far, the unification of the people against the Iberians." He raised a finger to the men. "The people look up to you to drive our oppressors out of their southern fortress, but you?" He turned the finger to himself. "You will look up to me, and I promise you that we will stand in its port soon."\n\nThe men responded in unison with a resounding "Yes Sir!", determination resting on their faces like a mask. Anticipation danced between them, but Amar also saw the trepidation. The fear. The road here had been bloody. The road ahead bloodier still. Perhaps his officers wondered how many of their brothers would have to give themselves to the liberation - a question he himself pondered when all eyes had turned away.\n\nHe shook away such thoughts; now was not the time. Now his men needed their Commander. "Return to your units, memorise your objectives and await the signal. Today Ifni will finally know freedom.""
MOR_IBR.13.a:0 "He whispered a prayer under his breath as they left, a prayer for the dead."

MOR_IBR.14.t:0 "Respite"
MOR_IBR.14.desc:0 "Cameras flashed as the two men signed their names on the document, neither with a hint of emotion on their faces. The reasons were myriad; diplomacy and compromise, but two of a number of things racing through both minds. Together, however, the largest thing was exhaustion.\n\nNeither man had slept in days.\n\nGeneral Santiago Rey had held Ifni ferociously. Using any means he could, he maintained the line. Area denial, ambushes, entrenched lines and luck had held together a thin, but unbreakable, defence. He had never been far from the battlefield, at times forced to fight alongside his men as the enemy had almost overrun them. Radios had failed, weaponry had malfunctioned, and entire city blocks had been hollowed out, but despite everything that had broken he and his men never did. Ifni stood.\n\nNext to him, the ALN commander stood closer than they'd thought possible mere days ago. Commander Aryeh Amar had pushed the Iberians to the brink. Numerous Iberian counterattacks had ended in acrid smoke and the smell of death. Hidden depots and havens reduced to dust and ash. Where their line was weakest, Amar had pressed and pressed hard. He had cheered for every success, and mourned for every failure - the broken bodies of the patriots that littered the city he had sought to liberate hanging always upon his mind.\n\nThey despised each other. Ideas of honour and respect between rivals extinguished upon the bloodied remains of far too many. But, in this moment, their hatred was relieved. This ceasefire ended the turmoil and, while Amar regarded the grimly smiling Iberians harshly behind his tired expression, the failure of the liberation passed for a moment.\n\nHis men had a respite from the carnage. They had done enough, and if the price was to leave Iberia a broken city? So be it."
MOR_IBR.14.a:0 "Across Iberia, the tale of the Miracle of Ifni sounded like a drum promising an end to the humiliations."

MOR_IBR.15.t:0 "Waterfront Garbage"
MOR_IBR.15.desc:0 "The remains of the last boat out swayed back and forth against the dock at the waterline, an avalanche of detritus colliding with dull thumps rhythmically. A mess of metal and oil, it had barely moved before the rocket had hit it. The explosion had been quick, mercifully so, the last ship vanishing in a flash. Only General Rey and some volunteers to make a last stand were supposed to remain. Instead, what was left of his staff, bundled onto that stolen boat, thudded beneath him.\n\nThere were countless ALN men on the dock, as if the entire army had descended onto this singular Ifni port. Perhaps they had. General Rey's men had just surrendered - what else was there to fight for? Denied even being able to save their brothers, defeat stung their mouths like salt. The ALN troopers milled about, laughing with each other but clearly unsure what to do. Perhaps they hadn't expected such a meek surrender? Perhaps they had expected the General to have long since fled? None of the prisoners, sitting on that dock, asked.\n\nEventually, a car and van arrived, men in officer's garb and a camera crew emerging. Small cameras followed the officers as they descended to the dock, filming the cheering men as the officers goaded them with praises. Sensing it was time, General Rey stood up.\n\n"My name is General Santiago Rey, Commander of the Ifni Vanguard. I surrender the city." He spoke loudly, summoning fortitude to maintain some measure of dignity, disrupting the officers and soldiers' jovial greetings. Many stared at the prisoners with annoyance, breaking the spell of the small victory festivity. Cameras recorded as an officer broke from the ALN mass, clearing the space between the prisoners and their new overseers. He was tall, a rough face ill-fitting his new uniform.\n\n"We accept your surrender, General, and we must say: we expected more from you Iberians.""
MOR_IBR.15.a:0 ""So did we," thought Santiago bitterly."

MOR_IBR.16.t:0 "The Jewel"
MOR_IBR.16.desc:0 "Across every radio frequency, the news is the same. Despite attempts to minimise it in the news, on the lips of every Iberian is the same story. Spreading like a wildfire in hours, the ultimate challenge to the nation; the ALN marched for Ceuta and Melilla. All across the Rif, the hordes arise to drive out Iberia. In whispers amongst friends and shouts in the squares, the cries are of both surprise and outrage. How has this happened? Why has this happened? Where is the strength of Iberia?\n\nIn the highest halls there are few who do not hear them. Maps are poured over and logistical arrangements scrutinised at a frenzied pace. Plans and lines are drawn. Harbourmasters across the South look at heavy ships awaiting cargo, munition or human, to be used to throw the ALN back into the desert. After all, this is more than a colonial uprising. This is more than the loss of a vassal. Iberia itself stands in harm's way, the Plazas de Soberania lusted for as a thief craves a treasure. The idea of its loss is an anathema - few can consider it beyond a rallying cry - Iberia will not stand by idly as barbarians breach its God-given land.\n\nThere are a few however to whom the bite of what others call defeatism refuses to recede. Despite the stereotypes of tribal barbarians, they cannot help but see the ALN have become a rather brutally effective force. Further, they fear that Iberia's reaction remains sluggish - is everything needed deployed? Are they truly prepared for what is coming?\n\nSuch questions haunt them at night as countless numbers descend upon Iberian forces in the Rif. Holding them back is essential. To lose parts of Iberia itself?\n\nUnimaginable."
MOR_IBR.16.a:0 "The sun sets on the Iberian Rif, and few know if it will see it rise again."

MOR_IBR.17.t:0 "Pacification"
MOR_IBR.17.desc:0 "The village burned in tidy rows, each thatched roof collapsing in on itself with methodical precision. Captain Eduardo Varga adjusted his sunglasses against the glare of the afternoon sun, watching as his Regulares dragged the bodies into the freshly dug ditch. The smell of petrol and charred meat clung to the air, thick enough to taste. Behind him, the radio in the command jeep crackled to life—a crisp dispatch from Melilla, "ALN force destroyed near Targuist. Mopping-up operations authorized."\n\nLieutenant Soto exhaled sharply through his nose, his fingers tapping against the stock of his rifle. "They say this was a supply village," he muttered, in that soft, disapproving tone he'd been using since Tetouan. Varga didn't bother answering. The stone houses popped and hissed as the flames licked through doorways, finding stashed grain sacks, olive oil jars, the occasional hidden rifle.\n\n"You." Varga pointed to the old man his men had dragged from the olive grove, his hands bound with wire, his face streaked with soot and blood. The interpreter, a young private from Ceuta, stepped forward. "Tell him to identify the collaborators." The private swallowed, then spoke in rapid Arabic. The old man's eyes flickered—first to the burning houses, then to the soldiers standing in a loose semicircle around him. Then he spat, the saliva landing at the private's boots.\n\nA sergeant stepped forward, his pistol already drawn. Varga held up a hand. "Not yet." He turned to Soto."
MOR_IBR.17.a:0 ""Burn the orchards too. And draft the telegram to Melilla—Area secured. Moving on to the next Sector.""

MOR_IBR.18.t:0 "The Last Sunset"
MOR_IBR.18.desc:0 "The wind off the Mediterranean carried the bitter tang of gun smoke as the Iberian flag was hauled down from Melilla's fortress for the last time. Corporal Luis adjusted his helmet, watching from a rooftop as ALN fighters in mismatched uniforms fanned out across the plaza below. Their victorious shouts in Arabic and broken French clashed with the hushed Spanish of the retreating garrison.\n\n"It's over," He muttered, grinding his cigarette into the concrete. The order had crackled over the radio at dawn—withdraw immediately. Do not provoke hostilities. Madrid and Lisbon had written them off. Four hundred years of empire, erased.\n\nDown in the square, a young boy kicked the shattered remains of a street sign as ALN troops directed traffic with sharp, unfamiliar commands. An ALN officer climbed onto an abandoned truck, megaphone in hand. "People of Melilla!" he announced. "Iberian imperialism ends today!" The crowd erupted. A bottle arced through the air, smashing against the old Customs House. Flames began licking at the stone façade where the Iberian coat of arms still stood.\n\nLuis thought of his grandfather's stories—the Rif War, the pride of holding Africa. Now history has come full circle. He glanced toward the harbor where the last transport ship waited, its running lights glowing in the twilight.\n\n"Move out!" their lieutenant barked. The exercises had been good for something, at least. As they descended the stairs, Luis heard a burst of celebratory gunfire. Somewhere, a radio played old music, drowned out by the rising chants of "Maroc libre!" The corporal took one last look at the Moroccan flag snapping taut over the Plaza. Then he turned toward the sea and to the beach and thought to himself."
MOR_IBR.18.a:0 "That his son would never again call this shore his own as he could."

MOR_IBR.19.t:0 "Backs to the Wall"
MOR_IBR.19.desc:0 "Iberia suffered embarrassment, then catastrophe, as it was pushed into its last remaining pocket of its Northern African territories. Gone are the Moroccan metropolises and Mediterranean coastlines upon which the Iberians felt such pride. All that remains is sand, rock, and a final humiliation.\n\nALN forces frequently pass the point of contact, with new sympathetic Sahrawi militias appearing nearly every day. Sometimes Iberian troops, sunken eyes and quiet, destroy them. Shaking hands move through hamlets slaughtered in fear. At others, the militias disappear into the desert, birthing new nightmares for the beleaguered garrison soldiers. In their patrols and bases, the specter of these reapers hangs over all.\n\nThe final confrontation for the Maghreb will come soon, both sides know that, and the Iberian officers looking over maps and supply lists see how disaster dances before them. As the ALN offensive begins, the cry to Madrid is clear. Urgent support is needed, or suffer the death of Iberia's North African Jewel."
MOR_IBR.19.a:0 "Drums, drums in the desert."

MOR_IBR.20.t:0 "The Grand Stand in the Maghreb"
MOR_IBR.20.desc:0 "Against every measure of both the ALN and the high command's gloomy battlefield estimations, the Iberian North African forces have successfully driven back rebel forces from the Maghreb and held the defense in spite of overwhelming odds. This has proven to be a stunning recovery and dramatic shift in the campaign's momentum—but tragically, the damage has already been done. While Iberia has retained control of Western Sahara, Morocco itself is lost. The ALN had taken to consolidating control over the northwest while the fighting in the Maghreb was ongoing, making any potential counterattack a nigh-impossibility.\n\nEven if Iberia had the capital, military backing, and public support to reinvade Morocco and succeeded in toppling the ALN provisional government, its forces would still face an inevitable terror campaign—followed by a counterinsurgency too overwhelming to manage.\n\nAs bitter a pill as it is to swallow, particularly in light of the defiant defence in the Maghreb, Iberian colonial rule in Morocco may be at an end. Any hope for restoring even a semblance of control over the region would have to be taken up by the civilian government in concert with intelligence services, seeding support among sympathetic elements in Marrakesh to aid a long term operation to overthrow the ALN in favor of a regime friendly to Madrid.\n\nOtherwise, little option remains for Iberia or the soldiers on the ground but to scurry back to continental Europe to lick their wounds."
MOR_IBR.20.a:0 "A sour defeat even amidst a gallant victory, a foul state of affairs."

MOR_IBR.21.t:0 "The End"
MOR_IBR.21.desc:0 "General Ortiz sat on the deck of the cruiser, his uniform still caked in grime. He was silent, completely, and none dared disturb him nor the others with him. Across the entire deck men similarly lingered, dazed and unmoving. Some had wounds barely treated, but fought off any ship medics who approached. Others clutched their weapons, refusing to leave a ready stance except for their brothers around them. They were silent, they had been since they had scrambled onboard hours earlier, onto the last boat out of Africa.\n\nThe sun was fierce, nothing but blue ocean around them. The remnants, if they noticed at all, just stared into the horizon. Into this throng a hesitant officer stepped, his pressed uniform a contrast with the bodies around him. "General Ortiz?" he loudly inquired, voice feigning confidence. "You are wanted on the radio. Caudillo's orders."\n\nWithout expressing any sign of understanding, he simply rose and followed the officer. His eyes saw only the past as he stumbled into the ship's interior. A dream led him to a radio, upon it a familiar Caudillo's voice.\n\n"General Ortiz, I have been informed of the utterly calamitous nature of our withdrawal. We've lost Africa, who knows how many sons we have lost, yet you find yourself on an evacuation ship. You-"\n\nGeneral Ortiz reached over and switched off the set, earning a gasp from the operator and attending officers. He looked at them, through them, before returning to the deck. He stepped through the ship and none dared to block him until he returned to his position on the deck. His men gave no recognition, but they didn't need to.\n\nHe sat on the deck of the cruiser."
MOR_IBR.21.a:0 "His uniform still caked in grime."

MOR_IBR.22.t:0 "Canteen Conversation"
MOR_IBR.22.desc:0 "The fans hanging above them struggled to move the air around the countless tables of the canteen, but few of the men noticed as they ate their meals like ravenous wolves and gossiped in their short respite from their duties. Rumours were growing like fungus, and they were turning the mood positive.\n\n"I heard it from a sergeant, he heard it from one of the officers, ALN has gone very quiet recently. Intel guys are really starting to think we've won!" said one soldier, of the many discussing the same thing in the room, to his tablemates with excitement audibly radiating. The others understood it well.\n\n"The patrols have been getting easier... I thought it was just me. Our last casualty was, what? Javier to that kitchen bomb a week ago?" replied another, his voice taking on a more hushed tone.\n\nAnother spoke up. "Yeah, but think. A few months ago it felt like there was a handful a week getting hit. Maybe the officers are right, we haven't had a serious engagement in a while anyway. I mean, for God's sake the forward post on Hill 16 was getting the worst of it. I was part of a supply convoy to it, it was a bloodbath. Now I heard they're losing more to heatstroke than bullets." A few nodded in memory.\n\n"I reckon we'll be heading home soon, turn over this shithole to the local police and security. Some local crazies are never gonna stop throwing the occasional bombs at us, it's in their nature, the least we can do is make sure it's some local policeman with skin in the game rather than us."\n\n"Not to be a killjoy guys, but offensive or no offensive we haven't exactly driven them out of most of Morocco." A cacophony of groans replied."
MOR_IBR.22.a:0 ""Who gives a shit Franco, if it gets us out of this godforsaken place.""

MOR_IBR.23.t:0 "A Deal with the Devil?"
MOR_IBR.23.desc:0 "King Hassan II of Morocco sat in his private study, looking intently at a map of Mauritania. Soon, all of that land would be his, it would become part of Morocco. All he needed was just a tiny bit of European backing...\n\nHe got up and paced a few times, thinking of how much he'd be able to extract from Mauritania. The Europeans would give him the means to conquer it, and he'd have his fill of the plunder. They'd have their due too, of course, and their investments. Perhaps...\n\nHis thought process was interrupted by a ringtone. He looked at the phone and smiled nervously. Surely they would not pass up an opportunity such as this one. Surely they will jump on the prospect of attaching Morocco to their sphere of influence.\n\nHe carefully reached for the phone and held it up to his ear, as a foreign language entered his ear.."
MOR_IBR.23.a:0 ""Uphold your end of the bargain, and you will have our support.""
MOR_IBR.23.b:0 ""We are not interested in your deal, regrettably.""

MOR_IBR.24.t:0 "Report 103"
MOR_IBR.24.desc:0 "Date: [?global.date.GetDateStringNoHourLong]\n\nLocation: Mauritanian-Moroccan border.\n\nOur troops have crossed the border at dawn, after our long standoff with the Mauritanians. Despite our overall victory in the engagement, we have suffered 32 casualties, and the majority of the Mauritanian forces have managed to retreat further south in the country.\n\nLack of modern equipment is almost fully to blame for our failure to secure a total victory in the skirmish. As it stands, our equipment is not much more advanced than our enemies', putting us on a technical equality.\n\nRequesting a delivery of more modern equipment to be sent to us from the capital. Technological superiority will ensure further engagements end with fewer losses and bigger operational gains.\n\nWe remain ready for any further orders.\n\nCapitaine Mohamed Yaktine"
MOR_IBR.24.a:0 "The answer from Casablanca's benefactors came swiftly: Request Approved"
MOR_IBR.24.b:0 "... yet the quantity of the shipment proved disappointing."
MOR_IBR.24.c:0 "The answer from Casablanca's benefactors came swiftly: Request Denied."

MOR_IBR.25.t:0 "To the Victors..."
MOR_IBR.25.desc:0 "Mauritania has fallen. Moroccan troops paraded around Nouadhibou, and soldiers occupied public squares, announcing martial law with loudspeakers. Mariam wept, for her country had been trampled under the Moroccan heel. But life went on.\n\nTwo weeks passed quietly, the entire city still reeling from the shock and the new normal that Morocco had installed.\n\nMariam looked at the good side. Her family was a notable one in her neighbourhood, influential enough to be useful to the occupation, unlike those poor wretches she saw getting marched out of the city to God knows where. She told herself they'd be alright, despite everything.\n\nThen on the third week, Moroccan soldiers knocked on her door. Next thing she knew, her entire family was marching out of the city of her ancestors, carrying only as many belongings as they could hold on their backs.\n\nTheir vacated apartment was given to a Moroccan family, and their abandoned store was bought cheaply by a foreign company. Nouadhibou was declared a "stronghold city", policed by the Moroccan government and owned by their foreign backers who redesigned it according to their needs and desires. Mariam wondered if she'd ever come back, and whether the city she knew would still exist if she did."
MOR_IBR.25.a:0 "A toast to our Moroccan friends!"

MOR_IBR.26.t:0 "The Weight of Failure"
MOR_IBR.26.desc:0 ""A spectacular failure. A military disaster. The debacle of the century.", these were the headlines of various Moroccan newspapers laid on the general staff's table. Discussion supposed to learn from their errors quickly turned into a free-for-all shouting match..\n\nExploiting the silence in the room next-door, a man in military uniform clenched onto his landline tightly, as his foreign liaison spoke, berating Morocco for its failures. "You must understand, they must have had some kind of aid...someone must have leaked our pla..."\n\n"How dare you try to pin the blame on us? We generously donated so much to your cause. We gave you weapons, money, ammunition, everything you could ask for. You had your chance"\n\n"Please..." the Moroccan gritted his teeth, feeling the burning hot shame in his lower-throat, "You must understand, the deal was hinged on our victory we don't hav..."\n\n"I've heard enough. Our government doesn't care for your excuses. You will pay for everything down to the last bullet casing and that's final."\n\nThe line died. The General got up from his seat and grimly entered the busy room. In just a few moments, everyone went quiet. They dreaded the words that would reach them next; "The Europeans want everything back.""
MOR_IBR.26.a:0 "They will pay us back every cent!"

MOR_IBR.27.t:0 ""
MOR_IBR.27.desc:0 ""
MOR_IBR.27.a:0 ""

MOR_IBR.28.t:0 "Cultural Tourism"
MOR_IBR.28.desc:0 "The sun was warm on the seafront, a fantastic view of the Strait of Gibraltar stretched out ahead of them. Next to the road, a small group of Spanish lay lounged in deck chairs, a thick smell of cannabis enshrouding them as a radio played some American rock and roll bootleg tapes purchased from the local markets. They had laid all morning there, small piles of garbage forming around them.\n\nThey earned disapproving glances from passersby, their idleness next to the riviera attracting nothing but attention. Locals and tourists glared at them but they cared little, mocking and laughing as they listened to their music and enjoyed their procured chemicals. Eventually a policeman passed by, his nose detecting the group before his eyes did.\n\n"Excuse me, don't you think you should be moving along?" he asked harshly, entering the group of chairs. The occupants hazily regarded him, little care in their eyes.\n\n"Haven't you got a market pickpocket to go grab?" someone jeered.\n\n"Who said that?" he demanded. "I want all of you out of here before the time I'm back or-"\n\n"Hey hey, easy." One of the tourists lifted themselves from their chair and meandered to the officer. "We're just having a good time, you know how to do that right?" He pulled out a handful of Peseta notes, offering them to the policeman.\n\nHe smiled, taking the notes. "Yeah, I know how to have a good time. Just... turn the music down, ok?"\n\nThe tourist nodded happily and lowered the music's volume, watching the officer walk away. Once he was out of earshot, he turned the music right back up, and began to slowly dance along to the music."
MOR_IBR.28.a:0 "Next morning the policeman found piles of rubbish discarded all around. The smell lingered still."

MOR_IBR.29.t:0 "Atlas Shrugged"
MOR_IBR.29.desc:0 "None of them knew where they were, their only landmarks being the towering mountains under which the camp lay. Where were they? Who were they? The men had tried to speak only to find they didn't all speak the same language. Groups had formed in the courtyard; Spanish, French, and Arabic speakers all nervously eyed each other as they watched the guards in the towers that dotted the tall barbed fences. Some of the men knew their uniforms, which were Moroccan army, although all recognized that the rifles were trained on them. They longed for the shade of the adjacent barracks, but the gate to that section was locked. A concrete building lay behind another gate, fans visible through the windows, and they could do little but imagine the blowing air.\n\nThey baked for hours, the sand reflected the sun. Some unfortunate souls lacked shoes - at first they had taken off their shirts and stood on them, sparing their feet from the hot sand, but then their torsos felt the sun cooking them. Thirst ravaged them.\n\nEventually, a small group emerged from the concrete building, dressed in loose military fatigues designed for the desert. They were the antithesis of the mob in the courtyard, finery against their rags. They passed through the prison's gates, a plethora of armed men leading them through. They watched the men in the courtyard with distrust and disdain, but few of the men had the strength to match the glares.\n\nThe unarmed men stood before the gathered prisoners, and one of them began speaking in Spanish.\n\n"Gentleman, this is your new home. You have come far, from as far as Casablanca, Algiers, or Barcelona. You are sick, a danger to your societies. Special measures are required for you. Your redemption begins now, your sentences decided. Co-operation is your only hope. If you do not, the desert shall swallow you whole.""
MOR_IBR.29.a:0 "The welcome was repeated in the relevant languages. Some prisoners were already beyond the words' reach."

MOR_IBR.30.t:0 "Orderly Retreat"
MOR_IBR.30.desc:0 "Alberto gritted his teeth as he looked behind himself at the long line of Iberians queuing up for boarding on the ship that would take them across the Mediterranean and back into the mainland. He had worked hard for his cushy post in Morocco, and wondered whether he'd be able to bounce back and find another opportunity for a comfortable posting. His only certainty is that the future will be hard.\n\nBehind him, Alicia hugged her mother tightly. The girl was born in Morocco and knew nothing else, yet her parents insisted, despite her kicking and pestering, that she'd never see her pretty home in Casablanca ever again.\n\nOn the other side of the port city, Erico ensured his luxury furniture was undamaged by the handlers placing it in his private ship. He'd leave today and pull some favours for his three luxury cars to follow. He wished there was a way to pull out every single building his money had built from its roots and take it with him to Iberia, but thus is life. He made the best decision he could at the time and didn't blame himself for not seeing the future. He'll try again somewhere else.\n\nWhen the ships departed, and they stood on the ship's deck looking towards a land most of them would never set foot upon again, they all counted their losses and cursed their fortune. But none spared even a glance beyond the white shores of Africa to the people they had shunned and on whose backs their wealth was built... "
MOR_IBR.30.a:0 "...And they remained oblivious to the millions of souls cheering their demise."

MOR_moroccowar.1.t:0 "To Invade, or to Not? That Is the Question"
MOR_moroccowar.1.desc:0 "As soon as [IBR.GetLeader] stepped foot on Torrejón Air Base, he was swarmed by an array of journalists and photographers. Questions swirled around him about the situation in Morocco, about the Iberian forces in full retreat, and about what actions he would take.\n\nPushing through the crowd, [IBR.GetLeader] entered the meeting room, acknowledging the generals with a quick salute before he sat. The general at the opposing end of the table began. "Sir, our forces are currently in full retreat across Morocco, and many battalions from across the Rif have already retreated across the strait via boat and plane. However, we still have significant personnel in Morocco, and several more units stationed in the south ready for your command."\n\n"Well, surely you have come up with solutions. Spit some at me, gentlemen."\n\nA different general stepped forward. "Currently, we have two options available. We can either order a full retreat of all remaining personnel and attempt negotiations with the Moroccans — early attempts at reaching out have borne limited fruit at peacetime — or we can order an invasion of Morocco — my view and that of the General Staff." A fury began to enter the man's eyes. "Reclaiming the Rif should be our primary goal."\n\nThe prior general takes back command. "Although we advise an invasion to reclaim the territory, the option is yours to bear, sir.""
MOR_moroccowar.1.a:0 ""I give you the green light.""
MOR_moroccowar.1.b:0 ""Continue the talks; peace is our only option.""

MOR_moroccowar.2.t:0 "Icarus"
MOR_moroccowar.2.desc:0 "Carlos always thought his nickname was ironic.\n\nAs a kid, he had always dreamed of flying, a dream stemming from the stories his Papá would tell of his time in the Civil War. His Papá would always caution him not to follow his path, knowing the dangers it presented. Yet, young Carlos wouldn't listen and applied for flight school.\n\nCarlos stood ready to board as flight mechanics ran final checks on his jet, validating correct armaments loaded, flaps at correct angles, and all systems in the green. As the last of the crew scurried off to another jet, Carlos carefully loaded himself into the cockpit.\n\nHe ran his final pre-flight checks before pulling out a photo, the last of him and his father. Looking deep into his late father's eyes before shoving it back into his pocket, rolling out onto the runway.\n\nWhile he waited for the control center to get themselves ready, he began to question what the motives of this invasion were, what the purpose of his mission was, and if he'd return home. His father had warned him of the dangers, yet he still pursued his dream, willing to get burned, wondering when his last flight would be. Carlos was snapped from his dream by a crackling radio."
MOR_moroccowar.2.a:0 ""All clear, Icarus.""

MOR_moroccowar.3.t:0 "Failure's Sparring"
MOR_moroccowar.3.desc:0 "Querida Mamá,\n\nI don't know how much longer I can do this, Mamá. I killed my first man today. We were told they were different, that they were the enemy wishing for the death of Iberia. His only possession was a singular photo; it was him, his wife, and two children. It reminded me of Papá. Was this what the Civil War was like?\n\nQuerida Mamá,\n\nWe've been ordered into full retreat by our commander. I was awoken in my tent, being yelled at by a fellow soldier to grab essentials and go before we were overrun by the Moroccans. Don't worry, Mamá, I made sure to grab Papá's old stopwatch and our family photo. What caught me as strange was the fact that we were told to leave crates of ammunition and other supplies.\n\nQuerida Mamá,\n\nThe commander has finally let us know the news. I don't know if it's reached the homeland yet, but we've been pushed back. We came for honor and have failed; all of this has been for nothing, Mamá. I watched friends die next to me, saw people mutilated and maimed. But Mamá, I'll take dishonor for the chance to hug you one more time, something others won't get."
MOR_moroccowar.3.a:0 "Signed, Santiago Gállego."

MOR_moroccowar.4.t:0 "Liberation's Scars"
MOR_moroccowar.4.desc:0 "Querida Mamá,\n\nI don't know how much longer I can do this, Mamá. I killed my first man today. We were told they were different, that they were the enemy wishing for the death of Iberia. His only possession was a singular photo; it was him, his wife, and two children. It reminded me of Papá. Was this what the Civil War was like?\n\nQuerida Mamá,\n\nMy battalion has finally liberated Ceuta. I heard from others that there has been success in Melilla as well. However, we've since been bogged down by the Moroccans from pushing any further. We've been told we'll try one more offensive. The commanders told us we are trying to push to the 1912 line. The Rif will be ours.\n\nQuerida Mamá,\n\nIt still hurts. Ever since that landmine, I've been stuck in the hospital recovering from injury. Doctors say that they can save the leg, say that I'll hopefully be able to walk again. I've sat in this bed praying every day to God that they can fix it. I pray that I'll be able to live again. I can't stay a burden to you, I can't stay home as a crippled man. From my time here, I learned from the other soldiers that we've been able to hold the enclaves but haven't pushed forward. I heard the war might be over soon. I'll get to see you again. Be home soon.\n\nLove you, Mamá."
MOR_moroccowar.4.a:0 "Signed, Santiago Gállego."

MOR_moroccowar.5.t:0 "Success's Victims"
MOR_moroccowar.5.desc:0 "Querida Mamá,\n\nI don't know how much longer I can do this, Mamá. I killed my first man today. We were told they were different, that they were the enemy wishing for the death of Iberia. His only possession was a singular photo; it was him, his wife, and two children. It reminded me of Papá. Was this what the Civil War was like?\n\nQuerida Mamá,\n\nThe offensive at Ceuta and Melilla has been an astounding success; we've completely pushed the Moroccans out. For our successes, we actually got some real food today, anything better than the canned rations they give us. It sort of reminded me of home.\n\nQuerida Mamá,\n\nDue to our successes at Ceuta and Melilla, we've managed to secure the entirety of the Rif. Our commanders have told us we weren't able to take the rest of Morocco, but I've been told it's still been a success. In the meantime, I've been assigned to hold on to Tetouan and help guard logistics. I hope to write to you as soon as we arrive.\n\nDear Maria Gállego,\n\nOn behalf of the General Staff, Iberian Armed Forces, we deeply regret to inform you of the untimely death of your son, Santiago Gállego. He died valiantly outside Tetouan, Morocco, as a result of armed insurgents. While further details are unavailable at this time, you will receive a letter from your son's commander, which will provide additional information."
MOR_moroccowar.5.a:0 "Signed, Iberian Armed Forces."

MOR_moroccowar.6.t:0 "Generalísimo's Decision"
MOR_moroccowar.6.desc:0 "The General Staff gathered around a map, painted and redrawn over and over from the past few days. Tiny clay figures had been pushed around the Rif. Debates over a singular question continued to spur between the generals. A question only a singular man could answer.\n\nThe room was quickly swept with an eerie silence as Franco entered. The entire staff rendered a hand salute to the Caudillo, holding it until he sat. The head of staff spoke first. "Generalísimo, thank you for joining us today. As I'm sure you've already been briefed, the situation in Morocco so far has been largely successful. However, there have been certain disagreements on how to continue."\n\nA second general spoke up. "Currently, we hold two schools of thought: continuing or ending the conflict. We've already reached the 1912 borders; however, we could continue advances and reclaim the entirety of Morocco, sir. I believe we should continue to make sure this threat doesn't strike again."\n\nThe head rose in protest. "On the contrary, we could be satisfied with our current gains. We've already experienced a resounding success and taught the Moroccans a lesson. Our lines are already starting to stretch, and the people won't respond well to an endless slog in the desert."\n\nFranco slowly stood from his end of the table, only uttering a single command before turning to leave."
MOR_moroccowar.6.a:0 ""End it.""
MOR_moroccowar.6.b:0 ""Continue it.""

MOR_moroccowar.7.t:0 "Peace Be With You"
MOR_moroccowar.7.desc:0 "Maria Gállego sat as she did every morning, outside with her breakfast of pan con tomate and the daily issue of the ABC. All Maria could read was the title: Peace. The Caudillos had finally ended the war, celebrations had entered the streets, chants of glory to Iberia circulated around her. Yet all she could think about was her son.\n\nAs she flipped through the paper, she saw the way it was covered. How much the Caudillos had sacrificed, their brave leadership. Another section sat dedicated to the tactical genius of the General Staff and how major the success had been. Only finally on the back page were the names of those who truly sacrificed themselves, the ones who were brave.\n\nMaria pushed her way through the streets. Celebrations of Iberia's success popping up around Madrid, an undoing of previous failures. It was an end to a conflict, whether some agreed or disagreed about its necessity. They all agreed that peace was best. Fathers, husbands, and sons would come home, even if it wasn't Santiago. At least others would live.As she entered Basílica de San Miguel, Maria went straight to a singular candle. One she lit not too long ago. A prayer was uttered as celebratory chants continued on the streets outside."
MOR_moroccowar.7.a:0 "Gloria a Iberia."

MOR_moroccowar.8.t:0 "The Temptation Resisted"
MOR_moroccowar.8.desc:0 "Champagne corks popped across a room draped in the flags of different units. Generals cheered on one another in celebration as the war had proved to be a success. The room was filled with people who, not too long ago, butted heads over whose ideal end result would prevail.\n\nMany men in this room wished to restore the old colonial government, taking over the entirety of Morocco. Yet even with constant pleas, the Iberia state outright refused to keep the war going. Like the Devil's temptation, with Morocco as a fresh apple, the Iberian government wouldn't listen to the snake. Nobody in the room would fess up that they were one of the devils, one of the generals that pushed for full annexation. And at this point, why would they? To the population's eyes, they had succeeded.\n\nYet even with such a backdrop, the general staff would continue to party. As success had come, level minds prevailed, and the Caudillos would be off their back for the time being. And possibly bring a couple of promotions their way.\n\nIn Madrid, Franco took a sip of wine before greeting his counterpart. "Had to back those rabid war dogs from the edge again. Wanted to go for all of Morocco now." He gave a crackled laugh. "Gave me a battle plan showing an offensive to Ifni and the rest."\n\n"And what'd you tell them, Franco?""
MOR_moroccowar.8.a:0 ""We're not stupid enough to do this.""


#Moroccan News Events
MOR_News.1.t:0 "[Get_newspaper_header]Morocco Passes Fundamental Laws"
MOR_News.1.desc:0 "In recent days, the Moroccan government has announced that it shall transition its monarchy to a semi-constitutionalist model, after years of negotiations and mutual opposition between the King and the Istiqlal. This comes in the wake of a crushed revolt in the Rif, which gave King Hassan II increased negotiating power. As a result, he was successful in his efforts to pass a constitution that favors the monarchy's powers, ensuring that he will continue to rule as an autocrat de facto.\n\nHowever, neither the King nor the Istiqlal are satisfied with the current compromise. It remains to be seen if their constitution can survive the tests of time."
MOR_News.1.a:0 "Could this be a step towards Moroccan independence?"

MOR_News.2.t:0 "[Get_newspaper_header]Iberia Grants Independence to Morocco"
MOR_News.2.desc:0 "News emerges from both Madrid and Rabat that the Iberian Union has agreed to grant Morocco independence. Morocco's protectorate status has formally ended, and Madrid has conceded all Iberian colonies in the Maghreb to the Moroccan government, save for the ports of Ceuta and Melilla.\n\nThe independence agreement is expected to result in the political dominance of the monarchy being strengthened, and it has been reported that the Crown has attempted to push back against the elected government. In addition, not all Iberian influence has been severed. Iberia continues to retain extensive economic dominance over Morocco, and there are no nationalizations planned at this time."
MOR_News.2.a:0 "Morocco has made the world its witness."

MOR_News.4.t:0 "[Get_newspaper_header]Moroccan Revolt in [1013.owner.GetAdjective] North Africa"
MOR_News.4.desc:0 "For decades, Morocco has been under Europeans. Living under the Spanish, later Iberians, since the annexation of the French regions at the conclusion of the Second World War, King Hassan II had been noted as trying to earn more independence from their northern overlord. Such efforts have ended in chaos however, as the self-proclaimed "Army of National Liberation" have seized control of wide swathes of central Morocco.\n\nIberian control remains only in parts of their North Africa territories, facing significant pressure from militants eager to drive the Iberians out permanently. Widespread attacks on foreign nationals have been reported, as well as on any the militants deem to be collaborators.\n\nMadrid has denounced the coup as "foreign-backed radicals" destabilising the region for their own gain, and has already committed to defending the regions currently maintaining Iberian authority.\n"
MOR_News.4.desc_SPA:0 "For decades, Morocco has been under Europeans. Living under the Spanish, later Iberians, since the annexation of the French regions at the conclusion of the Second World War, King Hassan II had been noted as trying to earn more independence from their northern overlord. Such efforts have ended in chaos however, as the self-proclaimed "Army of National Liberation" have seized control of wide swathes of central Morocco.\n\nSpanish control remains only in parts of their North Africa territories, facing significant pressure from militants eager to drive the Spaniards out permanently. Widespread attacks on foreign nationals have been reported, as well as on any the militants deem to be collaborators.\n\nMadrid has denounced the coup as "foreign-backed radicals" destabilising the region for their own gain, and has already committed to defending the regions currently maintaining Spanish authority.\n"
MOR_News.4.a:0 "The fire in Morocco burned too hot to contain."

MOR_News.6.t:0 "[Get_newspaper_header]Moroccan Monarchy Collapses"
MOR_News.6.desc:0 "Reports from Rabat indicate that Hassan II and his dynasty of nearly 350 years has been removed from power following a coup. Following the collapse of Iberian authority in the nation, the monarchy had cracked down upon the nationalist-republican Istiqlal Party. Officers sympathetic to the Istiqlal's ideas deposed the king after seizing control of the Royal Residence along with major roads and military posts in the capital.\n\nRadios repeat calls for calm and have declared martial law "for the crisis' duration". The King has been detained, held in an as-yet unconfirmed location, and the military are distributing photos of his arrest. The Istiqlal party has declared a new government, thanking the "patriotic officers" and announcing their own crackdown on remaining monarchists, placing their functionaries in numerous official positions as they prepare Morocco for a new republican future.\n"
MOR_News.6.a:0 "With the fall of a dynasty, comes the rise of a Party."


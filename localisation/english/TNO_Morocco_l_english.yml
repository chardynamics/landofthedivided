#Leader Bios
POLITICS_HASSAN_II_DESC:0 "Hassan II is a brutal, cold man. At the same time, however, he also projects an image of eloquence and wisdom that manages to coexist alongside his terrifying reputation. Within Morocco, he craves power and control, tolerating no defiance to his will. If he has any ability to stop a movement that exists outside of his vision for Morocco, he will do everything to stop them.\n\nOf course, Morocco is but one country, and Hassan II is more than aware that the world is far larger than himself. When it comes to international relations, his fluency in Spanish allows him to navigate well within the space provided to Morocco as a partner and client of the Iberian Union.\n\nIn Hassan II's personal politics, few fixed principles exist beyond one: the monarchy should have as much power as is feasibly possible and none should be able to oppose his will as King. His rhetoric shifts with the tide and the audience. Before one crowd, he's the harbinger of Morocco's modernization. To the next, he's the foremost protector of the nation's old culture and traditions. He himself has adopted Westernization within his own life, but that will never extend to his rule. Morocco shall never give way to the erosion of the traditional powers of the monarchy."

POLITICS_ABBAS_MESSADI_DESC: "Born into a prominent Berber tribe within the Rif region, Abbas Messaadi has spent his life in rebellion against both the Moroccan crown and their Spanish backers. In 1965, inspired by Algeria's National Liberation Front, Messaadi helped form the "Army of Liberation," an organization dedicated to taking up arms against the Spanish protectorate of Morocco.\n\nAs Spain tightened their grip upon their puppet monarch, the people of Morocco lost faith in the crown's ability to protect them. Now that Spain's naked occupation of Morocco had been exposed for what it had always been, the people naturally then turned to Messaadi, who was well-positioned to turn that momentum into a proper large-scale rebellion.\n\nWith the first shots having been fired in Morocco's rebellion against its former masters, and the people flocking to the ALN's banners, it falls to Messaadi to lead them. It falls to Messaadi to lead Morocco forward into a new future, where colonial rule has been dismantled once and for all."

POLITICS_ABDALLAH_IBRAHIM_DESC: "Abdallah Ibrahim was born in Marrakech in 1918, under the rule of the Francophile aristocrat Thami el-Glaoui. Ibrahim's opposition to colonial rule started early, with him organizing resistance against el-Glaoui's feudal government, earning him an exile from Marrakech. In his exile, he became a leading activist for the Istiqlal, a nationalist political party that advocated for independence under a constitutional monarchy. The monarchy would alternate between crackdowns on and alliances with the Istiqlal, quickly brewing a distrust for King Hassan within Ibrahim.\n\nHowever, any personal feelings had to be discarded for a time as the Iberian Union collapsed into civil war. As with every other major Istiqlal politician, Abdallah Ibrahim allied with King Hassan to secure independence. Despite that alliance, however, Hassan would once again launch a purge of the Istiqlal, but that betrayal merely served to give strength to the Istiqlal's republican faction. Ibrahim and the other republicans would begin to organize against the royal dictatorship.\n\nThe Istiqlal would prove successful in ousting Hassan, and Ibrahim would prove a natural choice for President of Morocco's new republican government. However, in the absence of both the monarchy and the colonial administration, the Istiqlal has quickly begun to decay ideologically. If this decay continues, Abdallah Ibrahim and the nationalist party-state risk establishing what could merely be described as a "republican monarchy.""


IBR_refuse_independence_tt: "§RWe cannot afford the cost of governing §oThe Kingdom of Morocco§!. Refusing to grant them independence may have dire consequences in the future.§!"
IBR_continued_dominance_tt: "§GOur economic influence over §oThe Kingdom of Morocco§! has persisted even after independence. We can expect it to remain so.§!"
IBR_Morocco_Exodus_tt: "§Y§oThe Kingdom of Morocco§!'s Culture Map will change.§!"
Mezziane_protest: "§RIn protest to our decision, General Mohammed ben Mizzian has retired from active service.§!"
Mezziane_goes_away: "§FGeneral Mohammed ben Mizzian will return to his homeland of Morocco and serve the newly independent Kingdom.§!"

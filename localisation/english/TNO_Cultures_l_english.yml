  var_nationality.105: "Honduran§F, a predominantly §YMestizo§! culture with a §YCriollo§! minority, small §YAmerican§! and §YLevantine Arab§! minorities, a tiny §YGarifuna§! in the coastal North and a §YSalvadoran§! minority in the West, alongside indigenous groups such as the §YLenca§!, §YMiskito§! and §YChorti Maya§!§!"
  var_nationality.106: "Salvadoran§F, a predominantly §YMestizo§! culture with a §YCriollo§! minority as well as a melting pot of §YEuropean§! cultures, composed of §YItalo-Salvadoran§! §YFranco-Salvadoran§! and §YGermano-Salvadoran§! minorities, alongside indigenous groups such as the §YPipil§!, §YLenca§!, §YChorti Maya§! and §YCacaopera§!§!"

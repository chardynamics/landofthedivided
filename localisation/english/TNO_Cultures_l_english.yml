  var_nationality.9: "Damascene Syrian§F, a §YLevantine Arab§! melting pot culture with §YAramaean§! cultural influence and a sectarian divide, composed of a majority §YSunni§! population, smaller §YDruze§!, §YGreek Orthodox§! and §YMelkite§! populations, as well as §YJewish§!, §YIsmaili§! and §YShi'ite§! populations, alongside a rural §YAramean§! minority, small §YKurmanji§!, §YArmenian§!, §YGreek§! and §YSyrian Turkmen§! minorities, as well as nomadic §YDom§! and §YBedouin§! minorities§!"
  var_nationality.10: "Kurmanji§F, an §YIranic§! subculture[TUR_turkification_process_state] with other §YKurdish§! minorities, including §YZazaki§! in the West and §YShikaki§! in the East, alongside a significant §YTurkish§! minority a small §YArmenian§! minority, as well as tiny §YSyriac§! minorities§!"

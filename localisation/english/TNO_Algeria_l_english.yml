 ALG_a_friend_in_need:0 "A Friend in Need"
 ALG_La_Salle_Guerre:0 "la Salle Guerre"
 ALG_La_Salle_Guerre_desc:0 "Terror looms in every corner of Algeria as it descends into chaos. Bombs are planted in every room, shots are heard ringing in every alleyway. The men and women whose lives they claim matter not in this so called "Dirty War", what is only of relevance is the message it sends and the fear it inspires in the hearts of militants and civilians alike. Conventional methods of warfare are quickly pushed aside as distinctions between combatant and non-belligerent blur.\n\nThe once-beautiful, now bloodstained sights of Algeria are engulfed in flames lit by the burning embers of rage."
 ALG_Mourir_Debout:0 "Mourir Debout"
 ALG_Mourir_Debout_desc:0 "The fighters of the Front de Libération Nationale have correctly chosen to die on their feet rather than live on their knees. Every single Algerian that has picked up a gun is another soldier willing to fight to the death for the freedom of Algeria, and such a dedicated army is impossible to overcome. The flipside of that, however, is that most Algerians who pick up a gun are far from professional dogs of war. Our soldiers will fight to the last, and with their lack of organizational tactics, they may ultimately have to."
 
 ALG_Roots__Oujda_Clan:0 "Roots of the Oujda Clan"
 ALG_Roots__Oujda_Clan_desc:0 "The so-called "Oujda clan" has been an important keystone of the FLN's structure since its inception in the 1950s. Despite its name, it is not a dominant familial unit that enjoys widespread power, nor is it a dynasty from which our leader is chosen. Rather, it refers to the tight-knit clique that has formed around Colonel Houari Boumédiène at his headquarters in the town of Oujda. As the commander of AFN, the FLN's armed forces wing, Boumédiène contributed a good deal to our success in the war for liberation.\n\nWith the fighting over however, the influence wielded by this Oujda clan is beginning to cause serious concern amongst some quarters. Always an exclusive group, the clan has only become more exclusive since the war ended. There are even disturbing reports that members of the Oujda clan hold an almost cult-like reverence for Boumédiène. At the forefront of the rapidly developing anti-Oujda faction is Prime Minister Ahmed Ben Bella. It will only be a matter of time before these two men openly vie for power in the new Algerian nation."
 ALG_Shining_Star:0 "Shining Star"
 ALG_Shining_Star_desc:0 "We have achieved a miracle - after one hundred and thirty years of French rule we have established a nation that bows to no foreign master. Our war for liberation may be the most successful anti-colonial movement in modern times. Oppressed peoples across the world have taken notice of our triumph, none more so than our comrades across North Africa and the Middle East, many of whom sent valuable support during our time of need. We have become more than any individual movement - we are an exemplar for those seeking the independence of their own homelands."
 ALG_Min_Djibalina:0 "Min Djibalina"
 ALG_Min_Djibalina_desc:0 ""From our mountains came the shouts of the free men, calling us to independence."\n\nNow that we have thrown off the yoke of the oppressors we shall never again allow it to be fastened around our necks. It was a brutal struggle, but as all struggles for freedom are, it was necessary. Still, if past experience has taught us anything, it is that we cannot rest upon our victory. We have driven out the Europeans, but there is no reason to think that they will simply abandon Algeria. We will watch from the mountaintops for their return, and we will crush them if they dare return. We have gained our nation at long last and we will never submit to its loss.\n\n"We are the cubs of lions, so let us aid you to face your enemies.""
 FLA_Il_Est_Mort_Sans_Une_Fleur:0 "Il Est Mort Sans Une Fleur"
 FLA_Il_Est_Mort_Sans_Une_Fleur_desc:0 "Despite its military victory in Algeria, the French regime is faced with a great many troubles as victors. The lengths the military administration went to in the name of pacification are deemed extreme even by members of the Pied-Noir community, let alone the native majority faced with stringent limits perpetually placed on their freedoms; In the south, bands of "Fellagha" continue to mount costly sabotage operations against the French government. The Métropole faced with its own periodic crises has fewer resources to divert to Algeria by the month - and both Rome and Madrid are cautious if not openly hostile as a result of their zones of influence in Algeria being violated. Worst of all, greater numbers of Pied-Noir families are seeking expatriation to other Mediterranean states to escape the economic stagnation, whittling away at the ethnic status-quo we fought the war to uphold."
 FLA_Spirit_of_Defence:0 "Spirit of Defence"
 FLA_Spirit_of_Defence_desc:0 "placeholder"

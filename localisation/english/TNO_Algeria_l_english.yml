#Salvaged Events
 ### Events ###
 Algeria_Skeleton.1.t:0 "The End of the Fuse"
 Algeria_Skeleton.1.desc:0 "Henri struggled to keep his eyes open, battling against the sleep that threatened anew to claim him with each passing hour. Late night duty at the Alger Barracks was usually quiet, but tonight had been especially silent. Normally at least one of the division's manned outposts out in El Asnam would've radioed in by this point, but so far nothing had come in. Henri thought that it was probably a good thing all things considered, given how most of the reports in recent nights had been about raids. Nothing too major of course, these glorified bandits were likely all but spent, but enough to keep Henri's attention at his post. But tonight keeping alert any longer would require coffee, and Henri's mug was run dry. He looked at it with sleepy, disappointed eyes.\n\nHenri was halfway through draining the barrack's communal pot into his own mug when the receiver crackled and sputtered. After so many hours of silence the sudden sharp noise caused the young soldier to drop his mug in surprise. Even as the coffee began to spread on the cold floor of the barracks Henri was already jumping into his chair and pulling the receiver free and up to his ear.\n\nThe sharp crackling continued, painfully racketing around his skull, but Henri kept the receiver tight, anxious to hear from any of his comrades. The words that finally came into the still air of the room were choppy, but the voice easily identifiable as Phillipe from Second Battalion's Company B, "...anyone there? This is... post five... El Asnam region... heavy attack... FLN attack... reports of similar attacks across the region... communications unstable... send help... we are outnumbered and outgunned... Merde! Merde! -"\n\nThe line went ominously dead and once again Henri was left in the silence of the night, standing dumbstruck as the reality of the situation dawned upon him. If these attacks were targeting communications, no wonder everything had seemed so quiet. This was a general offensive, an all out assault from the FLN.\n\nSomewhere off in the city, an explosive blast shattered the calm."
 Algeria_Skeleton.1.a:0 "It is but the first of many."
 Algeria_Skeleton.1.b:0 "For a free Algeria!"
 
 Algeria_Skeleton.2.t:0 "If a Tree Falls in the Forest..."
 Algeria_Skeleton.2.desc:0 "SS-HauptsturmfÃ¼hrer Wagner glanced over the missive he had found lying on the floor of the meeting room. Given the general dishevelment of the place - documents of all kinds strewn about like the debris of a storm, it didn't take a genius to guess that its occupants had left in a hurry, fleeing the Burgundian advance. His advance.\n\nThis document was written in French like the rest, but what had caught the eye of the German was its title, set in a large, bold font that could not help but draw the eye.\n\n"LA SITUATION D'URGENCE EN ALGERIE" was how it read and the date was only a few days ago. Now as a proud man of the SS, Wagner had never studied the language despite having spent the last decade of his life stationed in former French territory. To do so would have been to lower himself, to acknowledge that there was anything about a defeated people worth learning about. Still, ten years spent in Calais meant that willing or not he had been forced to hear a fair amount of that detestable tongue. He was therefore able to make out bits and pieces of the message, and where he could not decipher the meaning through linguistics he attempted to infer through context.\n\nFate, it seemed, was not smiling on these so-called "Pied-Noirs." They were under attack by some group or other identified as the "Front de liberation nationale" - that at least was easy enough to understand. Much of the minutiae was lost on the German officer but he could gauge in the letter a sense of desperation and begging. It was pathetic, he thought with a sneer, that a people who at least in theory shared some Nordic blood would be pressed into such dire straits by mere savages. Even more embarrassing still was the inability of the French state to defend its own settlers. The entire affair sickened Wagner and had convinced him more than ever that the French nation deserved to be permanently wiped off the map of the world. Later, when he had returned to his men he would show them the letter and laugh at the ridiculous nature of it all."
 Algeria_Skeleton.2.a:0 "The French are in no state to help anyone it seems."
 
 Algeria_Skeleton.3.t:0 "To Their Excellencies the Caudillos of Spain"
 Algeria_Skeleton.3.desc:0 "Francisco Franco reread the note that had been delivered to him and his fellow Caudillo António Salazar earlier that morning.\n\n"I do not see the need to even consider this plea, it is obvious to me that we have a duty to offer whatever aid we can." Salazar had always been quite adamant in supporting the defense of the Iberian settlers within the nominally French Algeria, and now he seemed to be willing to extend his umbrella over the French Pied-Noirs in their time of need.\n\n"You know António," Franco remarked in quiet, neutral tone, "I will defend our own people of course but I am not sure why we have much in the way of a reason to help these Frenchman who have let things get to this point in the first place."\n\nSalazar was, as ever, willing to state his points bluntly, "My old friend you merely need to think about the issue for a few moments to understand what the significance of abandoning these Pied-Noirs would be. We need to send a message to these FLN terrorists - they will not and cannot be allowed to drive out any settlers from the region. If we allow them to dispose of the French, it will be but a matter of time before they come for the Iberians who make their homes and families along the Algerian-Moroccan border."\n\nFranco's brows furrowed in thought - Salazar might have the right of it on this occasion. Still, to involve themselves in what was likely to be an extremely messy affair complicated by the still recent dissolution of the Triumvirate and the chaos unfolding in Europe as the Reich tore itself apart...\n\n"While I am not dismissive of your concerns António, I think that for now we must hold off. We must wait and see how things develop before wholly committing ourselves to something concrete. If the situation demands it then I will of course support your call to action, but first let us see how the Pied-Noirs and this man, this Jean-Jaques Susini, handle matters."\n\nSalazar shook his head in disappointment but knew it would be useless to protest any further for the time being. Franco sat wondering just bad things were going to get as the world cracked around them."
 Algeria_Skeleton.3.a:0 "Only time will tell."
 
 Algeria_Skeleton.4.t:0 "Salazar Told You So"
 Algeria_Skeleton.4.desc:0 "António Salazar's face was tinged with red as he clutched the report in a vice-like grip.\n\n"I warned you about this! I warned you that we needed to take action against these FLN bandits. I was ignored and now look what has happened!" Salazar slapped the paper down in front of Franco with a loud smack.\n\n"Their deaths are on our heads my friend. They are on your head."\n\nFranco swallowed the outrageous accusation with stoic silence. Truth be told, he had felt the reports of the FLN massacre of the Iberian-born settlers like a blow to his own chest. How could he rebut Salazar when he himself could not say that his fellow Caudillo was speaking falsely? Regardless of how culpable he was in this atrocity, he would not let it be repeated. The settlers would be protected with the full backing of the Union.\n\n"Salazar, I give you full discretion in handling this matter. Do what needs to be done to protect our interests in the region."\n\nSalazar gave a curt nod and walked out of the room, no doubt on his way to deploy Iberian troops that had been prepared well in advance of this meeting."
 Algeria_Skeleton.4.a:0 "The FLN will be brought to heel!"
 
 Algeria_Skeleton.5.t:0 "Tunisian Village Bombed By Iberian Forces!"
 Algeria_Skeleton.5.desc:0 "A few days ago, we received the news that an Iberian plane leading a punitive expedition against the FLN, most likely led astray by a storm, bombed a Tunisian village close to the now-porous border with the former Algerian colony, causing many civilian victims. Immediately, mediation channels were opened with the Iberian command, but the situation appeared from the start to be more complicated than expected.\n\nWhile our two countries are not formally at war with each other, it is still true that tensions in Algeria are rising, and our troops are not exactly neutral in the area. Adding to this is the fact that Salazar, one of the two Iberian caudillos, is hell-bent on "teching a lesson" to the Algerians for the supposed massacre against Iberian pied-noirs: as such, he strongly opposes apologising for the attack, as it would put Iberia in a subordinate position so soon after the collapse of the Triumvirate.\n\nThis refusal to apologise or pay reparations for the victims has sparked outrage among the populations of Tunisia and Egypt, who look at the Algerian struggle with interest. While this comes to our advantage, as it results in more funds and weapons being sent to our supported side, it is still a diplomatic failure, and will most likely impede future relationships for a while with Iberia."
 Algeria_Skeleton.5.a:0 "The situation in Algeria continues to escalate..."

 Algeria_Skeleton.6.t:0 "An Empire's Death Throes"
 Algeria_Skeleton.6.desc:0 "For a decade, the French State has lied to itself and to the world, claiming to be an Empire, a master of peoples, while in truth, it had become a slave. For a decade, our old rival has laid in agony, like a terminal patient on their deathbed: it would choke and wheeze, surrounded by machines, desperately clinging to life and refusing to accept its inevitable demise.\n\nThe keystone of this stubborn resistance, the linchpin of the French attachment to its lost grandeur, has always been Algeria, the last colony left to the mutilated French State. Boasting millions of French colonists, it has been to France like a beggar's heirloom: a golden ring kept between the rags, the last memory of a past long gone, to be looked at when no one paid attention as its owner tearfully recalls events that were, and that would never be again.\n\nNow, the last illusion of the French Empire has disappeared. As the German Reich erupted in civil war, the Burgundian monster decided that France was a perfect hunting ground for new slaves: the invasion was quick and merciless, and whatever shred of national unity and martial pride the French were able to rebuild in fifteen years was quickly quashed like the sand castle it was. This would not be without consequences.\n\nSpurred by the chaos and mayhem in the French mainland, Algerian nationalists have decided to claim their freedom by force. Guerrillas have sprung into action across the colony, and public order has collapsed: as a response, the French colonists have taken up arms to maintain the status quo, to beat the enemy back where the army could not, while Iberian forces prepare to strike, to secure their interests in the area.\n\nThe French Empire is dead, and now we have to deal with the consequences of its demise."
 Algeria_Skeleton.6.a:0 "Summon the High Command! Alert all border garrisons!"

 Algeria_Skeleton.7.t:0 "The Algerian War"
 Algeria_Skeleton.7.desc:0 "Earlier today, the garrison of Algiers announced the beginning of a campaign to "liberate France's rightful territory from the hands of terrorists and Italian occupiers." From their headquarters in Algier, colonial infantry under the command of Raoul Salan have been dispatched to surrounding provinces, taking both the Italian garrison of Algeria and the FLN by surprise. The Algiers garrison is resolute in their goal to see Algeria returned to French ownership, but both Italy and the native Algerians will not surrender easily. This conflict may last years, and any resolution will be bought with blood."
 Algeria_Skeleton.7.a:0 "A Precarious situation finally snaps."

 Algeria_Skeleton.8.t:0 "La Legione Straniera"
 Algeria_Skeleton.8.desc:0 "As expected, the nationalist uprising in Algeria has devolved into a full-blown civil war. Now, three sides face themselves across the beleaguered colony: the Algerian nationalists wish to create a free Algerian nation, one which would then incite unrest and revolution across the Arab world; the OASA, a collection of irregular colonial paramilitaries, remnants of the French army and LÃ¨gion Etrangere elements, fights to preserve the status quo and bring the colony back to France kicking and screaming; finally, the Iberians have decided to intervene in the conflict, wishing to protect their own countrymen who settled Oran a long time ago.\n\nThis war could potentially spell doom for our iterests in the African continent. Should the nationalists prevail, we would face a massive increase in unrest across Tunisia and Libya, while an eventual Iberian victory would see our former allies gaining access to the important Algerian oil fields: as such, the High Command has advised us to intervene in the war, if only to ensure that someone amicable to Italy comes up on top.\n\nIn the past days, the SIM has held contacts with moderate Algerian nationalists, who see with fear their own radical countrymen. They loathe the socialist tendencies of the extreme fringes of the movement, and have asked for our support in allowing Algeria to transition to a moderate government: in exchange, they promise to open the country to Italian investments and not to stoke nationalism across our lands.\n\nIt is clear that this is our only choice. An expedition corps under the leadership of General Giuseppe Castellano has reached Tunisi, and is ready to enter Bona at our command: there, he will join moderate paramilitaries, and begin a reclamation campaign against the other three sides. We can only hope he succeeds."
 Algeria_Skeleton.8.a:0 "All troops, commence operations!"

 Algeria_Skeleton.9.t:0 ""
 Algeria_Skeleton.9.desc:0 ""
 Algeria_Skeleton.9.a:0 ""

 Algeria_Skeleton.10.t:0 "From Algiers to Tamanrasset"
 Algeria_Skeleton.10.desc:0 "General Jean-Jacques Susini watched from the top of a rock as the last of the Algerian partisans and Italian auxiliaries marched from their sundered redoubts, never again to bear arms against the French State. His lips curled into a smile as he surveyed the desert around him. France's desert. For more than a century, his country had ruled over this land, until all Frenchmen saw it as their birthright. They had defended it from barbarians and Gaulists alike in the War, only to have it cruelly wrested from their hands by the former Triumvirate in the wake of the Malta Conference. But thanks to Susini's efforts, the betrayal of their former allies had been avenged. In a week's time, he would be taken to Algier and be sworn in as the new Governor-General of the Departments of Algeria, once again in French hands. And unlike the previous occupant of that office, he would make sure that it would never leave France ever again. Not in a decade, and not in a hundred years."
 Algeria_Skeleton.10.a:0 "L'Algerie est française."

 Algeria_Skeleton.14.t:0 "Hail the Algerian Fox!"
 Algeria_Skeleton.14.desc:0 "Today, a momentous ceremony has been held in Rome, to celebrate what many military scholars are already starting to refer as one of the greatest strategic minds of the century. Massimo Invrea, nicknamed "the Algerian Fox" for his exploits against the Iberian armed forces, has paraded the iconic Via dei Fori Imperiali alongside the veterans of his campaign: at the end of the triumphal way, they arrived to the Altar of the Fatherland, where the General received the Order of the Holy Annunciation - the highest Italian decoration - from the hands of His Majesty Umberto II of Savoy in person. Such extensive celebrations are still nothing compared to the worth of the man in person. Despite inferiority of numbers and equipment, General Castellano and his loyal men have succeeded in the impossible: halting the Iberian advance into Algeria, and securing a victory for the allied Algerian forces, whose government has gone so far as to proclaim the grizzled officer "Saviour of Algeria" and offer him a state pension. The war has been long and hard, but General Invrea never ceased believing in victory. Among his exploits is included the Relief of Bona, considered to be the last successful cavalry action in modern warfare, where the 2nd "Cavalleggeri di Tunisi" regiment broke the siege of the city from encroaching enemy forces, but his most celebrated accomplishment is surely the Capture of Oran, which brought to the encirclement, and eventual annihilation, of an entire Iberian armoured division without the use of a single tank.Men such as Giuseppe Castellano are the proof that Italian valour and skill at arms has not dimmed in the modern era, and that even generals close to retirement can still show their younger counterparts how war is waged. May the future generations find inspiration in his deeds!"
 Algeria_Skeleton.14.a:0 "Gloria alla Volpe dell'Algeria!"

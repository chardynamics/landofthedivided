admin_title_textbox_mapmode_tt: "[AdminTitle_Textbox_MapMode_1_tt][AdminTitle_Textbox_MapMode_2_tt][AdminTitle_Textbox_MapMode_3_tt]----------\n§YAdministrative Title§!, or §YAdmin. Title§! for short, is a feature that provides an in-depth view on a selected state's administrative division(s) (spanning from primary to teritary-level divisions) and additional information concerning the selected state itself. Players can also compare a state's Admin. Title(s) with another state's Admin. Title(s) via the corresponding map mode.\n\nThe §YAdmin. Title§! system is also fully compatible with the §YEndonym-Exonym§! system, which can be accessed via the "§DE§!" shaped button beside the Army overview button on the top right of the player interface."

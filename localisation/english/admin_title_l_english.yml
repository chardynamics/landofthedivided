## STATE DESCS ##
STATE_1706_Desc: "Despite attempts to reconcile during the 1930s and 40s, relations between the Republic of Haiti and the Dominican Republic still remained sour, due in part to differing geopolitical alignments. This tension led to the outbreak of armed conflict known as the "Blitz of '48", which resulted in the seizure of the §YHinche region§!, a Haitian territory formerly part of the Spanish half of Hispaniola, by the Dominican Republic.\n\nEver since then Haitian-Dominican relations have hit rock bottom, especially in the wake of Haitian persecution by Trujillo's government. This needless bloodshed emboldens the Haitian government to take any opportunity it can get to regain its lost territory."
STATE_1706_Desc_spa: "Despite attempts to reconcile during the 1930s and 40s, relations between the República de Haití and the República Dominicana still remained sour, due in part to differing geopolitical alignments. This tension led to the outbreak of armed conflict known as the "Blitz de '48", which resulted in the seizure of the §YHincha region§!, a Haitian territory formerly part of the Spanish half of Hispaniola, by the República Dominicana.\n\nEver since then Haitian-Dominican relations have hit rock bottom, especially in the wake of Haitian persecution by Trujillo's government. This needless bloodshed emboldens the Haitian government to take any opportunity it can get to regain its lost territory."
STATE_2442_Desc: "Between the New River and the Corentyne River lies a disputed territory known as the §YTigri Area§! (or the §YNew River Triangle§! to the British). The Anglo-Dutch Treaty of 1814 established the Corentyne River as the border between British Guiana and Suriname, delineating the boundary using the Kutari River, which was believed to be the Corentyne's source.\n\nHowever, in 1871, British explorers identified another tributary called the New River (or Upper Corentyne to the Dutch), thereby laying the groundwork for the ongoing dispute, as neither side could agree on which boundary was correct.\n\nToday, a military presence from both sides can be felt along the border, with the Dutch waiting to pounce should they sense any weakness from the British."


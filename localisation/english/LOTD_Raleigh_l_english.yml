l_english:
 CHA_Jesse_Helms: "Jesse Helms"
 POLITICS_JESSE_HELMS_DESC: "Jesse Helms has been a steadfast leader of the Movement in North Carolina, but his declining health has raised questions about the future of the state."

 CHA_Leadership_Questions: "Leadership Questions"
 CHA_Leadership_Questions_desc: "Rumors of Jesse Helms' declining health have circulated for some time, and while the Movement continues to deny them, the truth only becomes more apparent to all. When the day comes, there are long standing questions about what a post-Helms Movement would look like and especially about who would lead. He has has long soldified his rule as the leader of the Movement in North Carolina, and such there are not many would be able to easily take his place."

 CHA_Unbalanced_Duopoly: "Unbalanced Duopoly"
 CHA_Unbalanced_Duopoly_desc: "From the beginning days of the 2nd American Civil War, Raleigh has served as the capital of the local regional chapter of the Movement, naturally deriving from being the capital of the North Carolina state government. Ever since, there has been a disproportionate amount of funds and resources to Raleigh, in comparison to Charlotte, which has a larger population and is the economic center of the state. Besides being inefficient to the state's economic growth, this has created a noticable disbalance of power between the two cities. While the Movement has established a stronghold in Raleigh, Charlotte has been home to the state's resistance, and without any signs of change, this seems only to worsen."

 raleigh.1.t: "Jesse Helms Passes Away"
 raleigh.1.desc: "News from Raleigh is bleak. "
 raleigh.1.a: "And we wait..."
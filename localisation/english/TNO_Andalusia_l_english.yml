ADL_Francisco_Lainez:0 "Francisco Javier de Elizalde"

#National Spirits 
ADL_unscathed_now:0 "Unscathed for Now"
ADL_unscathed_now_desc:0 "Outside of the occasional air raid, Andalucía has seen little destruction due to its position far away from the frontlines. Because of its virtually unscathed industry, it can quickly mobilize the economy for war if necessary.\n\nYet, despite the relative safety of Southern Spain, a sense of lingering dread looms over the government and the people. If a major breakthrough happens on the frontlines, it can only be a matter of time until the war comes home to Andalucía."

ADL_pacifism_outburst:0 "Pacifism Outburst"
ADL_pacifism_outburst_desc:0 "Rich in manpower and trade, Andalucians were never warlike, and with the civil war barely out of sight, support for mobilization remains at an all-time low. When peace is an option, no Andalucian wishes to relive the tragedies they had lived through just a generation ago. Thus, isolation turns into a common attitude.\n\nYet the enemies of the Spanish Republic still see Andalucía as a lapdog to be eradicated and nothing more, despite a desire for Andalucians to keep out of northern affairs after many unsavoury encounters. For there to remain any hope for continued sovereignty, the people must endure through just one more tribulation, a war to end all brothers' wars."

#Tree
 ADL_enough_already:0 "Enough Already"
 ADL_enough_already_desc:0 "This new Spanish Civil War has waged relentlessly for months and we have bled much for the Republic. What did we receive in compensation beyond empty promises and exploitation?\n\nThat stops now. Andalucía will be free and the Republic's freedom has shown it is little better than the Caudillo's. Our only option then shall be to make our own freedom, and guarantee our voice is heard."
 ADL_enough_already_tt:0 "§G¡Andaluces, levantaos! ¡Pedid tierra y libertad!§!"

 ADL_restart_the_country:0 "Restart the Country"
 ADL_restart_the_country_desc:0 "Predictably, many of the individuals who made up the previous administration in Andalusia on behalf of the Republic continue to stand with the Republic. They are leaving their posts en masse, leaving large holes in our government that may threaten our ability to function.\n\nWe shall commit time and resources to overhauling our administration, cutting out the inefficiencies of old and recruiting new, loyal civil servants. With some effort we may be able to turn this problem into a great opportunity."

 ADL_create_cama:0 "Create CAMA"
 ADL_create_cama_desc:0 "With our new Republic established, we need to ensure that we can defend our borders against those that would try to take our young state from us. Our remnant land forces are not sufficient to face any serious attack.\n\nTherefore we will create a naval arm of our military, the Cuerpos Auxiliares de Mar, and an air force, the Cuerpos Auxiliares del Aire. Together, our Cuerpos Auxiliares de Mar y Aire will be able to protect Andalucía from wherever our enemies will appear."

 ADL_defend_the_beaches:0 "Defend the Beaches"
 ADL_defend_the_beaches_desc:0 "Currently, the War that rages across the peninsula traps the factions in grueling land warfare. This means that naval combat is few and far between, thanks to the high cost of combat capable ships.\n\nHowever, this war will not last forever. When the War ends and the victor turns to us, we must acknowledge the possibility that they can attack from the sea as well as land. We will create a series of defenses that any seaborne invader will crash into, with terrible results."

 ADL_swat_those_pesky_planes:0 "Watch the Skies"
 ADL_swat_those_pesky_planes_desc:0 "We want no part of the War, but those fighting seem to care little for our neutrality. In particular, the enemies of the Republic refuse to accept our new position and sometimes continue their attacks on our territory.\n\nWe will invest in more anti-air installations to make sure our cities are safe and make sure any attacking aircraft are informed of our neutrality, with extreme prejudice"

 ADL_expand_the_ports:0 "Ships in the Ports"
 ADL_expand_the_ports_desc:0 "We may not be creating a huge navy, however we still need to repair our merchant marine's losses and make sure we can service our fleet. After all, the ports will be vital for our military and economic prosperity in the future. Therefore, we shall allocate funds to expand the ports at Cádiz, Sevilla and Málaga."

 ADL_pump_up_naval_production:0 "Men in the Docks"
 ADL_pump_up_naval_production_desc:0 "Our current Navy is, for lack of a better word, insufficient. Luckily, we boast some of the best ports in the south of the Iberian Peninsula. It is time we put them to wor increasing our naval production so this new republic of ours can trade however we it may like and protect its shores."

 ADL_andalusians_in_the_sky:0 "Andalusians in the Sky"
 ADL_andalusians_in_the_sky_desc:0 "No matter how many Anti-Air guns we point at the north, it is inevitable that some planes will be able to slip past our shield. In order to avoid any tragedies we will focus on training a core of combat fighters capable of protecting our skies. What they will lack in numbers they will make up for with Andalusian skill."

 ADL_from_renfe_to_raf:0 "A Permanent Transition"
 ADL_from_renfe_to_raf_desc:0 "Now that the Republic no longer occupies our lands, we should turn our attention towards improving our infrastructure. Our railroad infrastructure is in dire need of reorganization and investment, therefore we will create the "Red Andaluza de Ferrocarriles", a state company that will allow us the oversight we need. With all our network centralized under the RAF we can begin to modernize our young country yet more."

 ADL_create_the_andalusian_bank:0 "The Heart of a New Economy"
 ADL_create_the_andalusian_bank_desc:0 "Inevitably our separation from Spain has caused a great deal of financial disruption, both for the Government and our citizens. Therefore we shall create a new central bank for Andalusia so that we can begin to stabilize our economy and begin our recovery as fast as possible."

 ADL_draft_a_constitution:0 "Draft a Constitution"
 ADL_draft_a_constitution_desc:0 "There are still those who question the legitimacy of our new nation, therefore we shall begin drafting a new provisional constitution for Andalusia, highlighting both our right to sovereignty and the rights of Andalusians. For the moment however we shall create a more streamlined, simple document.\n\nWe can worry about a more comprehensive Constitution once the chaos of the peninsula begins to ebb."

 ADL_provisional_town_halls:0 "Provisional Representation"
 ADL_provisional_town_halls_desc:0 "The simple reality of our situation is that elections are impossible until such a time as our internal and Iberian situation has stabilized. However many towns across Andalusia still operate under the legislation of the old Republic. Therefore we will begin swapping out incumbent Republican Mayors, Councillors and all those who would seek to damage our young nation in lieu of an election.\n\nThese new provisional local leaders will provide us with the foundation with which to move forward."

 ADL_militant_democracy:0 "Militant Democracy"
 ADL_militant_democracy_desc:0 "All Iberia languished for years under those who were opposed to the will of the people, and it is unfortunate that some people were influenced by such autocracy. Even now, after the bloodshed of the Civil War and our separation from Spain there are those who are opposed to our new nation and its democracy.\n\nTo counter this we must make the people understand that they are the first line of defense against anti-democratic subversives. We will run a campaign encouraging our people to be ever vigilant against those who would seek to undermine our nation."

 ADL_accomodate_everyone:0 "Accomodate Everyone"
 ADL_accomodate_everyone_desc:0 "For years Iberia has been gripped by authoritarians and those with more regard for power than humanity. The Republic started with noble ideas but they proved themselves little better than those that came before them. Now, the torch of liberty is passed to us.\n\nWe must ensure that we become the beacon of light our people have always desired. All will be welcome in Andalucía, all we ask is that they join us in committing to Democracy. In return, we will make a nation where all Andalucians can be heard."

 ADL_this_is_not_our_war:0 "This Is Not Our War"
 ADL_this_is_not_our_war_desc:0 "Many in our young state remain uncertain on how we stand on the War gripping the peninsula. This confusion has not been helped by the deployment of our new armed forces, something which has left some to suggest we are preparing to once more enter the fray.\n\nWe will sponsor a campaign to make it utterly clear across the country that the Spanish War is not our war, and no more Andalucian blood will be shed for anything other than Andalucía itself."

 ADL_create_faa:0 "Create FAA"
 ADL_create_faa_desc:0 "Despite not wishing to involve ourselves in the chaos of the Spanish War, it would be foolish of us to be defenseless. We can not trust that those embroiled in the War do not have designs upon our new nation after all.\n\nWe will reorganize our army into the Fuerzas de Autodefensa Andaluzas. To avoid provoking those around us we will focus on a defensive doctrine. This will also allow us to ensure that any who try to take our freedom will pay a dear price."

 ADL_not_a_step_forwards:0 "Not a Step Forwards..."
 ADL_not_a_step_forwards_desc:0 "Having finally gained freedom for ourselves, we have no interest in subjugating any others on this peninsula. Andalusian blood will no longer be spilled in fields that are not theirs. Our army will mirror this, with a new doctrine prioritizing discipline and cohesion in the face of an aggressor, rather than aggression."

 ADL_nor_backwards:0 "...Nor Backwards"
 ADL_nor_backwards_desc:0 "While we may harbor no imperialist designs of our own, we would be foolish to assume that were true of others. Our troops will be trained in primarily defensive tactics and how to rapidly move to weakened areas to reinforce defenses, with the goal of making them a wall of men more tenacious than any stone or metal barrier.\n\nWith the greatest defensive force on the peninsula, any aggressor will not get far should they seek to subjugate us again."

 ADL_recruitment_propaganda:0 "Only the Bravest Men.."
 ADL_recruitment_propaganda_desc:0 "The legacy of the Spanish War and its conscription requirements has led to many of our citizens being wary of enlisting with our new forces. However, as much as we do not want to maintain a large offensive army, even our defense force requires men.\n\nSince a return to conscription would be completely unacceptable to our people, we shall invest in a new campaign to recruit new Andalucian volunteers. Our military will be made up of those only who genuinely love Andalucía and all we stand for."

 ADL_equipment_quality_checks:0 "Only the Best Weapons.."
 ADL_equipment_quality_checks_desc:0 "That we do not have the same industrial capabilities as most other nations in Europe is beyond doubt, an unfortunate fact given both our small size and youth as a state. Therefore, in order to ensure the proper equipment of our soldiers we shall have to guarantee there will be as few defects as possible in the equipment they are given. This should greatly reduce the strain the military has on our burgeoning industry, as well as losses on general maintenance, allowing vital time and resources to go towards other projects."

 ADL_we_are_in_dispersive_ground:0 "...For Only the Most Just Cause"
 ADL_we_are_in_dispersive_ground_desc:0 "While we are a young country with lots of promise, we cannot forget the fact that we are small. Every building destroyed and every piece of ground lost is something that we will feel grievously. Every step back deprives us of the means to hold fast more and more.\n\nHowever, we are fighting in our own territory. We know this land. We will take steps to make sure that our defenses are strong while also minimizing the destruction any conflict will inflict on our land."

 #Events 
 ADL_wars.1.t:0 "Dictator"
 ADL_wars.1.d:0 "The streets of Sevilla were alight with chants and shouts as thousands moved towards the City Hall. Men and women of all walks of life, some even wearing uniforms of the Republican army or factory overalls. They all marched and raised their fists and voices, their voices echoing off the labyrinth of bricks in which they walked.\n\n"Power to the People!" they chanted. "No more Andalucian blood wasted!" they cried.\n\nAlejandro Rojas-Marcos had heard them coming, even despite the large crowd that had assembled before his scaffold at the town hall. He smiled, he had seen this day in his dreams many times in the previous years. He and others who were due to speak watched as the chanting crowds spilled into the square, until eventually the marchers had to wait in the streets. It appeared all of Seville had come.\n\nAlejandro stood up and walked to the prepared podium as the chanting and noise of the crowd died, leaving an eerie stillness. He took a moment to burn the image of Andalusian solidarity before him into his memory before raising his hands.\n\n"Friends, we have all sacrificed. The Republic promised us freedom, but all they gave us was lies. They tried to keep us as servants while we toiled and bled for nothing more than a new dictator."\n\nHe paused, a moment of reflection for those whom they had lost. He gestured to the others on the scaffold.\n\n"We have heard you, and we will say no more. If the Republic wishes to ask more of us, it will have to do so with an equal Andalusian state!""
 ADL_wars.1.a:0 "The applause and cheers deafened the children."

 ADL_wars.2.t:0 "If We Could Just Talk"
 ADL_wars.2.d:0 "I've seen many people pass by, and despite how I feel my age I still watch them.\n\nSometimes they are mean, and they curse at me in frustration. Maybe they are thoughtless and leave food, drink or god knows what at my feet, dirtying me. But sometimes I see them happy, embracing a loved one stepping into their world, or a tearful departing as they leave. People are so curious to observe.\n\nThey change a lot too. When I was born, the world was much slower. I never really heard other languages, or anyone dressed differently. Maybe it was all the smoke, the steam engines passing through all the time could make it hard to see sometimes. Only occasionally were there cars, and the noise of the crowd deafened me\n\nLater, I remember there was trouble. I remember watching men with guns moving, always moving, through. I remember they began to look so sad after a while, until eventually men with new uniforms arrived, stern faced. I didn't see the old soldiers again.\n\nFor a time it felt like before, I saw no one new and few new seemed to come. However the number of cars began to increase, the roar of the crowd being replaced by the roar of nearby traffic. Their styles even began to change, slowly looking far more sleek compared to the old boxes I remembered. Recently, I have even heard many more languages and many strange styles of clothes. Sunglasses and shorts, miniskirts and cameras. The world I was born into seemed so far away.\n\nBut now they are gone again. The soldiers came and left again and now yet another new uniform replaces them. Everyday I now wonder, who will use the train next?"
 ADL_wars.2.a:0 "Of humanity, the Sevilla San-Bernardo Train Station watches."
 
 ADL_wars.3.t:0 "A Dream Arrived"
 ADL_wars.3.d:0 "Detractors of Andalucía still lingered in the new state. "This is an artificial state, nothing more than an exaggerated local culture" they bemoaned, their eyes filled with memories of Spain. "There is no Andalusia, only Spain," they would declare to any who would listen.\n\nOften, these proclamations would be on town soapboxes, local government meetings or when deeply drenched with local brews in taverns across the country. These had only increased as news about the Constitutional Convention in Antequera had spread. Some reflected on the change with some amusement, once upon a time it had been the Andalucian nationalists that had occupied such a spot, usually to be carted off by the Guardia Civil for a night in a cell.\n\nAs before, people were rising against them in argument. In the taverns it had almost become a popular pastime in the most politically divided areas to watch the drunken sparring over the reality of Andalusia. Vibrant retellings of the 1883 Federal Constitution which had promised recognition of their identity, or the martyrdom of Blas Infante and his preservation of their culture all echoed against the disdain of the Spanish.\n\nSome questioned the reality of some of the stories. To hear of the 1883 Constitution now was to hear the story of a crushed popular liberation which some questioned the exact truth of, but to many it no longer mattered.\n\nThey were free, their sons and daughters were no longer dying in unknown fields. From Antequera there was a statement proclaiming the new values of a Andalusian state. They could afford a little bit of the fantastic."
 ADL_wars.3.a:0 "Andalusia had become both a dream and a reality."

 ADL_wars.4.t:0 "Troop the Colors"
 ADL_wars.4.d:0 "The previous weeks had been awash with excitement, but the crescendo was about to come for Luis Urunela.\n\nHe'd been approached some time ago to become the provisional Mayor of Seville, a post that carried considerable weight for the activist. His reputation as a unifier had preceded him. In years past he had been a leader in the local left-wing movements, one of the few that had been able to gain the respect of both the most moderate social democrat and the most hardened communist. In the dying days of Iberia when the fate of the Francoists had been clear it was he who had founded the Socialist party of Andalusia, which had been able to unify the once disparate socialist forces. After serving the Republic, as the war had dragged on he had advocated louder for Andalusian separation and many had listened.\n\nHe had known Alejandro Rojas-Marcos for years, a partner in the struggle against the Francoists, but he had still felt humbled to be offered such a position.\n\n"Seville in these early days needs someone who could unite them," Alejandro had told him as he asked Luis to lead the new regional Government, "someone who can make it an example for all Andalusia to follow." As far as Luis was concerned, if his skills could aid his comrades then he was happy to be of service.\n\nThere was much to do. New elections had to be organized, with zoning and secure counting to be planned. The rescinding of wartime regulations, not to mention a new evaluation of the local economy. At the start of this first session however, Luis allowed himself to simply reflect on the symbol he was witness to. All the Council had assembled to watch as the Spanish Flag which hung from the balcony of the hall was removed. In its place was the green and white of Andalusia."
 ADL_wars.4.a:0 "A new symbol for the worker."

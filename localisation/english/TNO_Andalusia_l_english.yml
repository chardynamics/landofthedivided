 #CHARACTERS
 ADL_Placido_Fernandez:0 "Plácido Fernández Viagas"
 POLITICS_ADL_PLACIDO_FERNANDEZ_DESC: "Plácido Fernández Viagas was born in the International Zone of Tangier in 1924, and earned his law degree from the University of Seville. What followed would be a long career in the field of law, eventually becoming the judge for the Territorial Court of Sevilla. He was not politically idle, however, and was also a member of Justicia Democrática, a clandestine, pro-democracy organization formed by civil servants who fought against the Franco regime from within.\n\nHowever, as the Union fractured into civil war, Fernández joined the Republic and served as a member of the Interprovincial Council of Andalucía, an organization created by the Republic to better administer the region. It became clear to many within Andalucía, however, that the Interprovincial Council didn't have the authority and autonomy to truly do what was best for the region. As the war continued to drain Andalusian resources, the region's tolerance for the war reached its breaking point, and Fernández was amongst those that drafted the separation of the region from the Republic.\n\nNow Fernández and Andalucía are caught in a gray zone. They have neither declared independence nor do they recognize the Republic as controlling Andalucía. With his lengthy track record, Fernández was chosen to lead the government, but it remains anyone's guess how long Fernández's leadership will be necessary, or what the region's fate shall be at the end of its lengthy negotiations with the Republic."

 ADL_Central_Committee: "Central Committee"

 ADL_Decentralized: "Decentralized Leadership"
 ADL_Unorganized: "Disorganized Leadership"
#Ministers
ADL_Alejandro_Rojas_Marcos:0 "Alejandro Rojas-Marcos" 
ADL_Alejandro_Rojas_Marcos_hog_desc:0 "§YVice-President\nSocial Democracy§!\n--------------\n§LAlejandro Rojas-Marcos has been a member of the Iberian opposition for a while now. His opposition began as a right-wing monarchist, but he eventually moved on to the political left. After some rocky attempts, he would form and lead the Compromiso Político de Andalucía, an Andalusian regionalist opposition group.\n\nAs one of the few leaders of organized opposition within Andalucía, he was chosen to be VP of the Council. His history of support for Andalusian regionalism has also made him skilled at rallying the population to support the new government. More of a hardliner compared to Plácido, he wants Andalucía to have more rights and resources after the war, and won't take "no" for an answer from the Republic.§!"

ADL_Eugenio_Ales:0 "Eugenio Alés Pérez" 
ADL_Eugenio_Ales_for_desc:0 "§YMinister of Foreign Affairs\nLiberal Democracy§!\n--------------\n§LEugenio Alés Pérez was a member of the Sevilla provincial council before Andalucía separated itself from the Republic, and now he serves as Councilor of Foreign Affairs for the new government. It falls upon his shoulders to work with the Republic and establish talks on what Andalucía's fate shall be after the war concludes. To ensure that Andalucía's people feel properly represented by their government again.\n\nHowever, Alés isn't just in talks with the Republic, and has been in contact with the other regional factions, as they have given their recognition to Andalucía as a separate government. However, these talks have been difficult, consistently undermined by the fact that these other regionalist governments do not view Andalucía as an equal due to their reluctance to truly declare independence. Regardless, Alés works to maintain good relations for the sake of Andalucía's future.§!"

ADL_Tomas_Garcia:0 "Tomás García García"
ADL_Tomas_Garcia_eco_desc:0 "§YMinister of Economy\nCommunism§!\n--------------\n§LHaving earned law degrees from universities in Granada and Madrid, Tomás García García has had experience in civil service since 1933. He has also been a member of the Communist Party since 1931, leading the party's economic studies commission, García was forced into exile after serving in the defense of Catalonia. He returned to Iberia clandestinely when the Republic was declared, serving as a member of the interprovincial council before Andalucía's separation.\n\nNow, García works on a plan for comprehensive land reform in Andalucía. His desire is for this plan to be added to the negotiations between Andalucía and the Republic, to ensure that reintegration won't see García's work reversed by a Spanish government.§!"

ADL_Carlos_Navarrete:0 "Carlos Navarrete Merino"
ADL_Carlos_Navarrete_sec_desc:0 "§YMinister of Defense\nSocial Democracy§!\n--------------\n§LCarlos Manuel Navarrete Merino had served on the provincial council of Huelva in the wake of the Republic's declaration of war against the Junta since its formation. He, like many others, had seen the Republic's progress stall, and felt the weight fall upon Andalucía's shoulders. Approached by like-minded politicians, Navarrete joined the new Andalusian government as its Councilor of Defense.\n\nWith no military experience, and there being no need for anything more than a self-defense force, he leaves actual military matters in the hands of the military officers who sided with Andalucía. Instead, Navarrete uses his experience as a labor lawyer to record the abuses that Andalusian soldiers endured under the Republic, to be presented during negotiations. If Andalucía was going to reunite peacefully, every Andalusian soldier who fought for the Republic would require full compensation.§!"

ADL_Manuel_Esquivias:0 "Manuel Esquivias Franco"
ADL_Urbano_Orad:0 "Urbano Orad de la Torre"

 #Leader Bios
 POLITICS_BLZ_HERBERT_FULLER_DESC: "As British Honduras fell into chaos in the 1950s, with fears of a Guatemalan-backed insurgency furthered by growing disdain at Canada's attempts to replicate the long-dead British order, Herbert Fuller emerged as one of the few figures the Canadian government could trust. Ushered into office to the backdrop of a state of emergency, his early tenure marked with a pen held by a gauntlet, one that guaranteed the inauguration of an Anglophile ruling party.\n\nHis initial majority only coming through a rigged election, Fuller's regime has been one marked by budding frustration. When the immediate crisis of 1951 ended, Fuller maintained dictatorial powers, but even the powers of an office that enabled him to ban the PUP and suppress the HDP only barely propelled him to a majority in office. Any hopes of meaningful governance were further undercut by another border war between Canada and Guatemalan-backed guerillas loyal to the PUP, his power undone once more.\n\nWith his regime over a decade old, that crown's edges cut scars into his head. Frustrations have simmered throughout his term, but the destruction of Belize City over a hurricane and the ensuing border war have only brought them back to the forefront. Anger over rumours of corruption, cronyism and of slavish loyalty to Canada have become standard conversation topics among Belizeans, their words filled with ice. Fuller's time as the main colonial collaborator seems to be fast approaching its end."
 POLITICS_BLZ_GEORGE_CADLE_PRICE_DESC: "What happens when the opponent rises to the post he has held such strong criticisms of? Raised to the backdrop of Jesuit teachings and social doctrines, George Cadle Price has always found himself staunchly opposed to the ruling elite within British Honduras, and their Anglophone chauvinism. First entering into politics through the Belize City Council, and coming to power to the backdrop of a collapsing British Empire, Price attempted to seize his chance through the formation of the PUP.\n\nThat initial move only brought setbacks. As Canada found its will to preserve the embers of the British Empire, the PUP faced significant crackdowns, and Price himself fled to Mexico, maintaining contact with allies preparing cells to fight as guerrila units, backed by Guatemala. Whilst the colonial regime slowly inched towards destruction, Price found himself falling into the circles of Gaitán, Árbenz, and Cárdenas, social reformers across Latin America that have provided a novel influence for his views.\n\nPrice may now be in power, but pride often comes before the fall. Whilst his ambitions to secure Belizean independence are clear, he has few true allies. The Canadian government continues to view him as a chaotic, destructive agent of Guatemala, a country that simply views him as a speed bump standing over the road to integrating Belize. He may be in power, but Price will have to rely on more than inertia alone to achieve his vision."
 POLITICS_BLZ_PHILIP_GOLDSON_DESC: "Born to a humble background, Goldson first became notable within British Honduras during the Second World War as a civil servant and firebrand journalist, staunchly supportive of Belizean nationalism. Radicalised into trade unionism, he became an organiser, aligning himself with other nationalists and working to form the PUP in 1951 alongside George Price and Leigh Richardson. However, any hopes of a quick victory were quashed as the Crisis of 1951 escalated, and as Canada implemented martial law.\n\nWith his former allies forced into the hills of inner Belize or into Mexico, Goldson paid the price as he was arrested. Increasingly alienated by calls for integration into Guatemala, and increasingly influenced by Caribbean and Kriol activists, he instead chose to form a new, more moderate alternative, the Honduran Democratic Party, upon release. When Fuller's regime collapsed around him, there were few remaining barriers to Goldson's election.\n\nFinally in office, Goldson's objectives remain clearer than ever. In his vision, Belize will be a proud member of a pan-Caribbean community, its Kriol population able to practice self-rule. However, Goldson is not the only person with influence over Belize. Beyond fatigued frustrations from Ottawa, tensions with Guatemala continue to simmer whilst the PUP insurgency silently curse him as a traitor. Goldson may be at the top, but there is much distance he could still fall."
 POLITICS_BLZ_GILBERT_WALTER_FAIRWEATHER_DESC: "Born to an incredibly wealthy and influential Kriol family, Gilbert Fairweather was raised to the backdrop of a family with little to lose from direct British control, and had even more to gain. As he reached adulthood, he fought in the Second World War, becoming a hero fighter ace over the hills of the United Kingdom. Returning home a regional celebrity, he brought a staunch loyalty towards the British Empire now retreated to Ottawa alongside him, one hard to break.\n\nMaintaining influence within the British Honduras Volunteer Guard, the outbreak of guerrilla warfare deeper into the country was the last straw, and convinced him to stage a coup. With the government around him in a state of panic and desperate uncertainty, there was little stopping him from ousting the incumbent, and even less from elevating him to the position of leader. His celebrity, however, could only go so far in preventing the PUP's insurgency from spiraling further out of control.\n\nNow, Fairweather's project struggles. Under his watch, and fed by his distrust of the Mestizo and indigenous populations, Fairweather has shifted to harshly cracking down on those labelled as socialist, Mestizo, or pro-Guatemalan. Only his personal popularity and the constant dripfeeding of support from American and Canadian caches prevent the country from collapsing entirely to the PUP's insurgency. Fairweather came into office a victor - but if he doesn't change course soon, he may end up a loser."

 BLZ_The_Fading_Order: "Fading Order"
 BLZ_The_Fading_Order_desc: "For a decade now, the Legislative Council of British Honduras has been dominated by the National Party, a hodgepodge of commercial interests and members of the colonial apparatus under a veneer of Kriol nationalism. Premier Herbert Fuller has managed to hold this unwieldy coalition together through explicit Canadian support and maintain the Anglophile status quo in the council through rampant gerrymandering.\n\nYet under this facade, growing tensions are tearing this status quo apart. Fuller's failure to carry out meaningful reforms and his perceived submission to Ottawa have all but ensured his ousting in the next elections. Only one question remains: will the Canadians manage to co-opt a new local leader for their needs, or will they have to give in to more radical demands for change?"
 BLZ_A_New_Home: "A New Home"
 BLZ_A_New_Home_desc: "In the aftermath of Hurricane Hattie, the people of Belize were forced to beg for aid from their partners in the OFN. Faced with the enormity of suffering there, the Government of Canada has agreed to provide Belize with the funding to address the worst of its suffering. It has also agreed to support the construction of a new capital—Belmopan.\n\nNow, miles away from the ruins of Belize City, construction is underway. The nation's government is determined to achieve a new start for itself and for its people."
 BLZ_A_City_Upon_A_Hill: "A City Upon a Hill"
 BLZ_A_City_Upon_A_Hill_desc: "After years of work and millions of dollars in investments, the city of Belmopan has been completed. While the city sports certain design flourishes—a central ring road, ample parkland, and architecture inspired by Mayan temples—the city's real strength lies in its location.\n\nStanding 75 meters above water and protected by hills and rainforest, Belmopan is secure against the forces of Mother Nature. While time will tell how Belize develops from here, the new city stands as a testament to the strength and resilience of the Belizean people."
 BLZ_Insecurity_State: "Insecurity State"
 BLZ_Insecurity_State_desc: "The outside threat of Guatemala, alongside insurgent movements from within, has made the Canadians increasingly concerned about their Central American foothold. For two decades now, the colony has been increasingly militarized, its people subjected to harsher and harsher repression as the situation continued to deteriorate.\n\nWhile this state is supposed to lay an orderly path to future reform, it has mostly served to stifle any talk of change. Political liberties have been curtailed, and the popular PUP has been banned, with much of its leadership still in exile. Even the efforts of moderate politicians are stymied by Canadian fears of instability and growing paranoia in the British Honduras Volunteer Guard. Everybody knows this cannot last, but all dread the inevitable collapse."

 BLZ_A_Nation_Under_Siege: "A Nation Under Siege"
 BLZ_A_Nation_Under_Siege_desc: "While Guatemala has recognized British rule over British Honduras since 1859, it has never fully relinquished its claims on it, and has recently formed an uneasy alliance with exiled insurgents of the People's Unity Party, eager to liberate Belize from British rule. Canada has responded by stationing a large garrison in the colony, bolstered by the British Honduran Volunteer Guard and tasked with preventing hostile incursions.\n\nThese tensions exploded in 1961, when the Canadians entered Guatemala in pursuit of guerrillas with quiet American support, and were attacked by local forces. This incident has sharply increased tensions and has made it clear that the colony could not gain independence until its borders are secured, as much as Canada and the United States wish to be rid of it."

 BLZ_Colonial_Undertow: "Colonial Undertow"
 BLZ_Colonial_Undertow_desc: "While much of the British West Indies has managed to move on from the crisis of the immediate postwar years, British Honduras seems to be stuck in the mid-forties. The small slice of Central America has been ravaged by rampant poverty and underdevelopment, compounded by a series of devastating hurricanes.\n\nMore and more of its citizens leave the colony every year for greener pastures, and the rest are left behind in more ways than one.\n\nWhile the West Indies Commission and even the Colonial Office in Ottawa have made plans for economic reform and development, ongoing tensions on the border with the revanchist government in Guatemala have so far prevented their implementation.\n\nFor now, it seems, British Honduras will continue sinking deeper and deeper into a colonial quagmire."

 BLZ_Citrus_State: "Citrus State"
 BLZ_Citrus_State_desc: "With a new leader comes a new plan for the economy of Belize. Under Philip Goldson, Belize has enacted rapid agricultural development with mass privatization with the aid of the United Fruit Company, the grey eminence of Central American economies and politics.\n\nWhile these new citrus plantations bring development and GDP growth, they have also brought immense inequality between the workers and their foreign employers. While always close to the USA, these UFC investments have only brought Belize closer to them, to the point that trying to leave their influence would be detrimental to the economy."

 BLZ_Democratic_Dawn: "Democratic Dawn"
 BLZ_Democratic_Dawn_desc: "With the fall of Herbert Fuller and his authoritarian National Party, the Honduran Democratic Party, and its leader Philip Goldson, has ended the political stasis in Belize. With many promises, ranging from unbanning the People's United Party, democratic reforms, an economy free of Canada's colonial extraction, and even complete independence from Canadian rule. With the support of his party and the people, Philip Goldson may very well succeed in his plans for the nation."

 BLZ_Old_Wounds: "Old Wounds"
 BLZ_Old_Wounds_desc: "Belize's unfriendly past with the Guatemalans is still a fresh wound in many of her citizens' memories. Lingering above a hope to restore cordial relationships between the two countries is the 1960 Crisis' aftermath. While Guatemalan saboteurs have receded in their activities and the border war has come to an unfulfilling conclusion, the devastation has irreversibly tainted Guatemala's national image.\n\nOpposition at home gained some breathing room after the National Party's fall. Despite this, repression against the PUP remains commonplace as police harassment has become prevalent after sanctioned violence fell out of favor. It will be a long and arduous road to bury the old scars."

 BLZ_Rural_Reform: "Rural Reform"
 BLZ_Rural_Reform_desc: "With George Price and his People's United Party in power, Belize enters a new and ambitious era of rural reform. Like many other Latin American leftists, Price has instituted a policy of breaking up large settler estates. While this policy has been successful, the second component of the reform has been less successful.\n\nThe building of megaprojects has been a mixed bag for the Price government. While they have been built, and they have helped develop the country, these projects have required immense Mexican aid, tying the nation closer to them. Belize has also taken on a vast amount of debt to fund these new and expensive projects."

 BLZ_Look_Latin: "Look to the Latin"
 BLZ_Look_Latin_desc: "The British Empire is a crumbling mess and Anglophone civilization will do nothing to keep Belize prosperous as they struggle to keep afloat. Making friends closer to home is a good idea if stability is more important than greed. As such, furthering ties with neighboring leftist nations has become George Price's priority.\n\nAlthough some of Belize's neighbours may not yet have her best interest in mind, moving away from Anglo-Canadian rule holds more urgency than judging potential allies harshly. Although the Mexicans and the Guatemalans have their own share of problems, they still have more resources than Belizeans can ever gather alone. We can resolve their grievances later, but freedom cannot wait."

 BLZ_Back_With_Bang: "Back With A Bang"
 BLZ_Back_With_Bang_desc: "The land that had once spurned his ways now demands him in charge. For George Price, going from exile to head of state is a drastic change of pace. However, growing complacent now would be folly when conservative opposition is as eager as ever to topple his rule. As rapid economic reforms sideline traditional elites and the government restructures along the way, if Price cannot placate his old enemies, he must outpace them.\n\nAnti-Price propaganda continues to focus on his alleged connection with the militias along the Guatemalan border, for the same accusation which he had once been imprisoned under. The conspiracies will not go away so long as Price remains in power, but if inaction cannot stop them, he may as well act as he sees fit."

 BLZ_Into_Hurricane: "Into the Hurricane"
 BLZ_Into_Hurricane_desc: "British Honduras' stabilization effort has backfired as the Volunteer Guard's coup d'etat has turned border militias into a full-scale insurgency, overtaking the countryside through Guatemala's support. Appeals to Canadian help have grown ineffective as Ottawa sees military support as a resource drain, while garrison apathy further complicates prospects of increased commitment.\n\nNeighboring regimes see British Honduras as a pariah state and are unwilling to sponsor what they see as a colonial dictatorship on life support. Though incoming American capital prevents Belize City's fall at the moment, it can only last so long until the last wellspring runs dry."

 BLZ_New_Masters: "New Masters"
 BLZ_New_Masters_desc: "With the rule of Canada gone, a new sovereign has found itself ruling over Belize with Guatemala. All of the old colonial positions of Canada have been replaced with a new shade of Guatemalan colonialism. A long standing rival now rules over the nation like a king and its vassal.\n\nThe new Guatemalan overlords are not as lenient as the old Canadian ones, taking control of their foreign policy and military. This, combined with the longstanding hatred of each other, has caused resistance fighters, particularly the African-descended Creoles, to surge far greater than the numbers during Canadian rule."

 BLZ_Compromise_Treaty: "The Treaty of Amity"
 BLZ_Compromise_Treaty_desc: "After years of belligerence and border insurgencies, a US-brokered treaty has finally brought some peace to Belize and Guatemala. Outlining a referendum in the future for disputed territories, the treaty is loved by the Belizean people and their government, despite the concessions and fishing rights that have been given to Guatemala. With the remaining guerrillas either fleeing and or disarming, it seems that peace has come to the two rivals."

 # Flavour Events
 BLZ_forpol.0.t: "Wishing for Snow"
 BLZ_forpol.0.desc: "Patrick Newheart had never liked the humidity in Central America. But the Secretary had dispatched the delegation, and Newheart was to be one of them, hopefully to begin the final process of decolonizing British Honduras. It was unlikely that any pen would come to paper in a formal sense today, but if the Guatemalan and Canadian delegations could agree on a few basic points, then they'd have a solid framework to build on over the next few diplomatic meetings. So Patrick, along with a few others, paid a visit to Guatemala City.\n\nThe Guatemalan delegation was led by Edgar Alvarado Orellana, and he had not been shy about Honduras being returned to Guatemala in its entirety. That was certainly not going to happen, but Newheart understood the need to lead with a maximal demand upfront. That was just a good negotiating strategy.\n\n"Good morning, gentleman." Patrick's superior, Richard Ashworth, shook Orellana's hand. "Hopefully, this is just the first of many productive meetings to come. We're hoping to secure a new future for the region and for relations between Canada and your people."\n\n"I think it's quite obvious what needs to happen. When Canada leaves, Guatemala can have her territorial integrity restored and can stand at last as a whole nation instead of a piece of one."\n\n"Now, now." Ashworth waved his hand. "The Honduran territory does have its own vibrant and independent character, and any settlement should reflect that. Certainly, borders can be worked out following a survey commission with representatives from all three parties."\n\n"Independent? You took the territory and changed it to say it was no longer ours!"Richard's mouth turned into a most undiplomatic sneer. "Well, I believe there's no point in discussing this further.""
 BLZ_forpol.0.a: "Newheart left with the rest of the Canadians, hoping for a cold spell to cool the tempers."
 
 BLZ_forpol.1.t: "Breaking the News"
 BLZ_forpol.1.desc: "From: Office of South American Affairs\nMemorandum for the Director\nExecutive Intelligence Report: Honduras Domestic Stability\n\nWith the collapse of the British Empire, British Honduras reverted to de facto Canadian control. With limited resources, Canada has struggled to administer the colony and increasingly has petitioned Washington both overtly and covertly for developing a solution that would satisfy Canadian interests. The State Department believes that it serves US interests for Honduras to remain a colony under Canadian control for the short term. It will require more investment and influence than currently exists at present before we can secure long-term orientation toward the OFN following Canadian departure. Since 1960, there has been widespread activity on the border with activity linked to Guatemalan-sponsored guerrillas, which necessitated American intervention. This ongoing instability must be resolved, otherwise, the risk of a regional conflict is high.\n\nOf more pressing concern is the recent release of left-wing populist George Price and the unbanning of the Honduran Democratic Party. Price has repeatedly articulated the desire to expropriate foreign-owned property owned by the United States, Canada, or other OFN investors. Price is almost certain to have links to Guatemalan guerrillas and may be receptive to German or Japanese intelligence operations should he come to power.\n\nIt is recommended for the agency to investigate and uncover evidence of these links to Guatemala. Many Hondurans have experienced negative effects from the long-running guerrilla campaign, from burned fields and stolen grain to kidnappings and murders. Should Price's ties to these groups be exposed, he will face considerable backlash, de-legitimizing him in the eyes of the Honduran public and ensuring that he cannot cause problems for the US or OFN later."
 BLZ_forpol.1.a: "Fidelity, Bravery, Integrity"
 
 BLZ_forpol.2.t: "Big Break"
 BLZ_forpol.2.desc: "Francisco Soberinas was called Frankie by his friends, but in the offices of the Bulletin, he was known as "the guy who will do anything if he thought it could get him a byline, except schmooze the bosses". So here he was, helping clean the print rollers and sweeping up while the senior reporters drank and cavorted with their mistresses. Frankie knew that it might just be him being a sap, but all it would take is one big break for him to be a real journalist.\n\nAs he took out the trash to the dumpster, he noticed a bag dropped on the front door, too full to fit through the mail slot. He grabbed the bag as he headed back inside, but as he reviewed the documents, not sure of what he'd find, his pace began to slow, and his hands trembled. Documented visits between George Price and known Guatemalan militant groups that had raided across the border and attacked local farmers. A working paper authored by Price suggesting that Guatemala be allowed controlling interest over the economy. This was huge. George Price, the prominent anti-colonial activist, had been seeking to simply change the name of the new colonial overlord and pardon them for all their aggression.\n\nHe was tired before, but this revelation hit him harder than three cups of coffee. He sat down at his typewriter and wrote "Price's Price, by Francisco Soberinas." And he detailed the exclusive exposé, brought to the people by the Belize Bulletin.\n\nThe following day, the morning edition had its new headline. By the afternoon, every paper's second printing carried the story. By the evening, the twentieth tomato had been thrown at the offices of the Honduran Democratic Party, and a crowd had grown, flying banners denouncing Price. The news went fast, and Francisco, sleeping after his big day, dreamed of new headlines and bylines to come."
 BLZ_forpol.2.a: "The only thing faster than a politician's rise is a politician's fall"
 
 BLZ_forpol.3.t: "Simple Demands"
 BLZ_forpol.3.desc: "Philip Goldson was not supposed to be here. Mexico, and its titular capital, were the greatest enemies of Belize second only to Guatemala. Mexico had been thrashing Belize with sanctions since the crisis between Guatemala and Belize in 1960. Goldson would hope to change that today. Surely Mexico would work with a good upstanding liberal like him. Someone leading a more peaceful government.\n\nGoldson entered an upscale restaurant in the city and met with Victor Urquidi, an economist who was educated in London. He would be the middle man for Goldson and Mexico. "Señor Urquidi!" Goldson called out. "Mr. Goldson! Don't worry, I speak English," Urquidi chuckled back at him as he pulled out a seat.\n\nThe two enjoyed their lunch until the check came. Goldson cleared his throat and began, "Mr. Urquidi, it's been a wonderful lunch but I believe we should be discussing business now." Urquidi cleaned his mouth of the pozole he had eaten, "Of course, of course. I assume this is about the sanctions."\n\n"That's it. Now, you're a smart guy. We both know that these sanctions benefit no one, we both lose out on a valuable trade partner." Urquidi let Goldson prattle on for a few minutes. It was the kind thing to do. As he rambled off some numbers and percentages, Urquidi could understand him. The sanctions benefit no one, but Mexico can't be seen buddying up with the colonizers they've rallied against.\n\n"So what do you think?" Goldson finished. "I'm very sorry Mr. Goldson, but as long as the PUP remains banned and their leader, Mr. Price remains imprisoned, then Mexico cannot lift these sanctions. As for now, I wouldn't expect you to be invited back until Mr. Price is free from prison and the PUP are unbanned." Goldson felt himself slumping throughout the whole speech. After a moment he responded with a smile."
 BLZ_forpol.3.a: ""I'll see what I can do.""
 
 BLZ_forpol.4.t: "Urquidi's Trap"
 BLZ_forpol.4.desc: "It had taken a while, but Mexico had opened back up to Belize. Sanctions had been slowly going, and the consulate had been restored. Of course George Price had to be released, but Goldson was sure a loudmouth like would be no threat to his reelection. Flanked by his aides, Goldson shook hands with the new consul and happily announced the reopening to the news cameras and their microphones. Throughout his speech, his eyes wandered to a figure by the new consul, George Price. Only a few months since he was freed.\n\nAs Goldson finished his speech the consul came up to the microphones with Price. "I'm very happy to be here today to reopen the Mexican consulate in Belize. I would like to state that Mexico has never been a country against Belize, Mexico is for Belize. What Mexico is against is the stench of neocolonialism that rots the nation. Nations like Canada have exploited the Americas for years. They've exploited nations like Belize for decades, but now is the time for Belize to be free."\n\nThe consul went into the embassy, his speech ending with applause from George Price and the PUP members that followed him around. Goldson should've expected the 	act. Mexico couldn't just live happily with his Belize, they wanted to overturn it and get their man in charge. Maybe he shouldn't have even taken Urquidi's deal. Nevertheless, he couldn't take it back. His conflict with Price would be at the ballot."
 BLZ_forpol.4.a: "From Prison to PM?"
 
 BLZ_forpol.5.t: "Keri Keri"
 BLZ_forpol.5.desc: "Víctor Urquidi always knew that the sharpest teeth hid behind the widest smiles. A true shark always smiled, and so when he looked at George Price, freed from prison and now the fresh-faced leader of the opposition preparing for a new election, Urquidi saw an apex predator prowling through these political waters. And so here he was, meeting in Mexico City, undoubtedly with a song and a not-so-small favor.\n\n"A pleasure, Señor Price, I am surprised you can spare the time to visit during the campaign season."\n\n"Of course, Señor Urquidi. But if the people are to believe me when I say that Belize must join hand-in-hand with their Latin American sister countries, I must demonstrate it. Belize requires her own independent future, and so I've come this way to tell you how much that means to both myself and my party. Should we win, we will look to end Canadian control of our country."\n\nUrquidi nodded. He expected as much for any candidate that had received the same treatment at the hands of the Canadians.\n\n"But that is not all. I know that there have been difficulties with Guatemala, but that is the past. Should I be elected, I will restore relations with the country, even if it means concessions."\n\nUrquidi stopped nodding. That was what Mexico wanted, but more to the point, Price knew that's what Mexico wanted. It was easy to promise such things now, but when the public could crucify him for conceding, Price would be much less resolute. It was the way of economics - it was easy to sell when the price was low. Urquidi took in Price's pause, and answered the insinuation. "If you receive funding."\n\nIt was Price's turn to nod, and the sharks swam in a circle."
 BLZ_forpol.5.a: ""I'll speak with my superiors. They can provide you with what you need.""
 BLZ_forpol.5.b: ""Mexico's resources, sadly, are limited when it comes to foreign affairs.""
 
 BLZ_forpol.6.t: "A Rising Tide"
 BLZ_forpol.6.desc: "It was a sea of unfamiliar faces, but while he didn't have names for them all, Phillip Goldson knew there was one name that described them all: countrymen.\n\nSo many of his countrymen had gone to the United States, hoping to make their fortunes. While plenty of them worked the farm circuit, others had taken Uncle Sam's entrepreneurial spirit and sought to build businesses that they called their own. Some operated markets, restaurants, or bars, others operated car services or construction firms, many of which hired other Belizeans to work for them. Not only did they provide a vital service for emigrants, but they also provided a lifeline back home to the mother country; remittances that brought in good American dollars that could be spent growing Belize's domestic economy. He needed to ensure that not only would this vital stream of cash continue, but that it would grow and create a mighty river that would carry Belize's ship of state to the promised land.\n\n"My friends. You have done what many would think impossible. You came to another land and built something that you could call your own. Your hands, your hearts have created something to truly be proud of. And you have not forgotten your families back home, sharing your good fortune, which in turn, builds something more in your own homeland.\n\n"But we must not pat ourselves on the back; we must look toward the future. Belize is growing, my countrymen, and there is an opportunity for those to ride these headwaters to a new golden age. Belize will be growing, and to those who are willing to help water the fields, the bounty you receive will be great indeed. So invest in Belize, gentlemen, and let's allow both of us to build a better tomorrow.""
 BLZ_forpol.6.a: "Belize flourishes when shaded with the wealth of its sons."
 

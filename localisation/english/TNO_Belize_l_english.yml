 BLZ_forpol.12.t: "The Ultimatum Game"
 BLZ_forpol.12.desc: "The new decade had come, but for Patrick Newheart, it seemed like all that had changed was that he was getting older. British Honduras had remained a perennial headache in his diplomatic career. It had been that way since he joined the diplomatic service, and while he rose in rank, the affair of British Honduras remained with him, like a permanent limp on an otherwise promising career.\n\n"Mister Newheart," came the stiff greeting of Thomas Adams, his bleary red eyes suggesting that he either didn't sleep well or had a hangover. "Good morning." Patrick had known Thomas as Tommy when he was in a good mood, but today, he was all Thomas. "Looks like we're here to discuss the latest Canadian proposal on decolonizing Honduras?"\n\nThomas spoke of it like it were a passing concern. Canada wanted to be done with the colony, but they couldn't just pack up and leave. It was a considerable headache toward inroads into anyone in Latin America, but the Canadian-held assets were tantalizing for any local leader to snap up and nationalize to give to his cronies. If they did, that would be a guaranteed embargo, which would create even more of a diplomatic nightmare.\n\n"Correct. We are looking for the State Department to lead the effort to decolonize the territory honorably. We'd like Honduras to be an independent nation friendly to our government, without our assets being touched and allowing us to maintain an economic presence. We need to ensure that we don't abandon the Belizeans to the Guatemalans, who'll be itching to invade. They've all but said as much."\n\n"Hmm." Tommy took another large gulp of his coffee. "The State Department agrees, but we need our latitude to make whatever arrangements we see necessary. We'll see what can get done. But Canada is ceding their chair on this; the Secretary and the President can't work with their hands tied.""
 BLZ_forpol.12.a: ""Just remember, you asked for our help, so don't complain when we give it." Thomas muttered, filing away Newheart's papers."
 
 BLZ_forpol.13.t: "This Doesn't Bode Well"
 BLZ_forpol.13.desc: "The sun shined brightly into the offices of the US embassy in Guatemala, but the mood of the US ambassador to Guatemala was hardly sunny. He and the US consul for Belize had been tasked with hearing out Carlos Arana Osorio's plans for union with Guatemala's eastern neighbor, and they didn't sound very promising.\n\n"We cannot be expected to provide those in Belize extensive autonomy," remarked Osorio. "Their interests must be subordinate to the Guatemalan majority in the immediate future. Besides, the Communist problem in the east has not been resolved yet. Our military must deal with it like in Guatemala".\n\nOsorio's grin grew as he continued to go on about how he planned to put down any potential left-wing resistance to his rule; the consul to Belize began to silently squirm in his seat, visibly perturbed by all this.\n\nThe ambassador took note of his colleague's discomfort. "Mr. Osorio, while I...acknowledge your capacity, I'm not exactly sure about this proposal. The only political groupings in Belize that are at all supportive of a union with Guatemala are left-wing. An anti-communist crackdown would be counterproductive to any such prospects."\n\n"Nonsense!" responded Osorio. "The people of Belize will quickly come to see the benefits of a union, regardless of their politics. We don't need to worry about upsetting some communists...if they really support a union they'll be quick to drop all that silliness anyway."\n\n"I'm sorry but I must object to your framing here," replied the consul, locking eyes with Osorio.\n\nAs the two began arguing back and forth over the junta's unification proposal, the Ambassador slumped a bit into his chair, hand clasped over his chin.\n\n"There's no way this union will work," he thought."
 BLZ_forpol.13.a: "Washington's better off suggesting some sort of compromise."
 
 BLZ_forpol.14.t: "We Can Make This Work"
 BLZ_forpol.14.desc: "The US Ambassador to Guatemala sat eating a salad in his office in the US Embassy in Guatemala City. Across from him sat the American consul to Belize, who was eager to discuss the potential for the negotiations between Guatemala and Belize.\n\n"This is a major opportunity," pressed the consul. "If we could improve relations between the two, it could have major positive reverberations across the region and seriously improve our standing with the Guatemalans."\n\n"It's tough working with PAR though," replied the ambassador, swallowing down a chunk of lettuce and taking a swig of water before continuing. "They've hardly toned down all the Yankee go home, anti-imperialist crap."\n\n"I don't especially trust them either Ambassador, but if we act as a productive broker, their negative inhibitions will wither away. PAR aren't so unreasonable as to reject positive interventions outright".\n\nThe ambassador smiled. "I think you're right. Backing a union between them and the Belizeans might just get PAR on our side. Let's try and set up a get together between the foreign ministers so we can get the ball rolling on this."\n\nThe consul beamed."
 BLZ_forpol.14.a: ""Great. I'll start writing the necessary correspondence.""
 
 BLZ_forpol.15.t: "Memo on Guatemalan-Belizean Negotiations"
 BLZ_forpol.15.desc: "SECRET/[GetDateText]\n\nFROM DONOVAN SADLE\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: FORTHCOMING GUATEMALAN-BELIZEAN NEGOTIATIONS\n\n1. Phillip Goldson and the Honduran Democratic Party as a whole are rife with heavy anti-Guatemalan sentiment. Walking in step with much of the Belizean population, they have already stated that they will not accept any sort of union with the Guatemalans and will fight us at every step to prevent one.\n\n2. George Price and the People's United Party, on the other hand, is much more amenable to the idea of a possible union with Guatemala. Early talks have proven fruitful with George Price and the rest of the party. The only problems that could arise is if the left-wing of the People's United Party is pushed away from a union agreement, which is increasingly likely if Guatemala pushes itself rightwards.\n\n3. We do have enough leverage and influence to push forward some alternative compromises - including options that better satisfy most Belizeans, maintaining their sovereignty. However the Guatemalans, having set union as their main goal, will voice great pushback on any sort of compromise from a full union with Belize, and might turn to more drastic actions if negotiations fall through."
 BLZ_forpol.15.a: "Call up the Consuls, let's get this union moving."
 BLZ_forpol.15.b: "The Guatemalans will get over it, look into the alternatives."
 

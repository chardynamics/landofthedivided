 BLZ_forpol.18.t: "The Bride Objects"
 BLZ_forpol.18.desc: "It only took two rings for the State Department to pick up the American consul's call. They had been expecting this call from Belize; the country had been simmering since rumors of the American-backed plan of union with Guatemala were leaked.\n\nThe consul began to speak, ignoring greetings. He came through ragged, surrounded by a roar of chants outside the consulate. "Whoever decided that this union was a good idea should be fired," the consul yelled, "I've got thousands surrounding the consulate, banging down our doors! The press leaked the whole plan!"\n\nThe official in Washington attempted to ease the consul. "Trust me, we understand the tense situation and are closely monitoring it all. We're still working on contacting the Belizean government to help disperse the crowds and get it all under control."\n\n"They won't," the counsel snapped back. "They're aiding the protests, encouraging riots! Half the cabinet was out there rallying the crowd an hour ago." A sharp crash sounded on the counsel's end, glass shattering. Shuffling could be heard being made by the counsel as he continued, "Washington needs to know they aren't letting this go. It'll take a lot longer than a few weeks, or even years, maybe forever. We're praying they disperse by morning, but may only god know." The line quickly cut out."
 BLZ_forpol.18.a: "Stars and Stripes would burn bright that night."
 
 BLZ_forpol.19.t: "But One Snip"
 BLZ_forpol.19.desc: ""And may peace be everlasting between our two nations!" The microphone was placed back on its stand as a Guatemalan soldier carried the scissors. Well, he wasn't Guatemalan to his fellow Guatemalans. Born and raised in America and a full-blown U.S. Marine, to the natives, he was just another gringo.\n\nThe scissors cut, and the ribbon flailed about in the midst of the wind. The onlooking crowd erupted with applause, chief among them were the leaders of the nations for the occasion, with their entourages by their sides.\n\nTheir shared optimism was not at all shared by their citizens, however. To the backdrop of calm trees and swaying flowers, the Belizeans clapped and cheered with enthusiasm. To the backdrop of a rather nasty arrest occurring in Cobán, the Guatemalans only clapped to keep up appearances, with their leader being the only one among them to wear a smile. His entourage being the only thing between him and his citizens' razor-sharp glares.\n\nOne of the Canadian officials turned to a nearby American diplomat. "You know, maybe there is a chance that this region can finally see peace."\n\n"I think so, too, Owen. It makes me kinda sad to leave, honestly. These two nations stand on a precipice, and now, we gotta leave them to their own devices."\n\n"We shouldn't worry. Everything will turn out fine in the end. Like with how things turned out well with my son."\n\nEveryone began to vacate the ceremony, leaving nothing but the ribbon on the ground to remember today by. With light rain gently pushing one piece towards Guatemala, the other towards Belize. Owen turned toward the American diplomat once more. "Hey...""
 BLZ_forpol.19.a: ""...Are you sure we did the right thing?""
 BLZ_forpol.19.tt: "§FWith the signing of the §&Treaty o§!§*f Amity§!, relations between the [GUA.GetFlag] §&Guatemalan§! and §*Belizean§! [BLZ.GetFlag] governments have been §nnormalized§!, something that wouldn't be possible without our help.§!"
 
 BLZ_forpol.20.t: "Two Sides of a Coin"
 BLZ_forpol.20.desc: "The American consul in Belize took his seat for the Guatemala-Belize unification ceremony. The Guatemalan delegation spotted him immediately. "Amigo!" one of them called out to the American. "Today will go down in history, all thanks to you Americans. We owe you everything."\n\nThe consul gave a warm smile addressing the delegation. "We're glad to see our cooperation triumph; a new era between our countries will blossom soon enough." The delegation gave the consul a chuckle and all shook his hand. The shift of the country could be felt, but so could Belize's.\n\nThe square was still littered with scraps of burnt American and Guatemalan flags from the protests the night before. An all-night standoff between protestors and police only cleared by early morning, but the distaste sat in the air. A Belizean minister took the podium to begin the event, his voice strained throughout the whole speech, and at its conclusion, the only applause was heard from the Guatemalan delegation.\n\nThe consul exhaled slowly. The people of Belize wouldn't forgive America anytime soon. But Guatemala was smiling ear to ear, a trade he was willing to make."
 BLZ_forpol.20.a: "One Washington saw as worthwhile."
 
 BLZ_forpol.21.t: "A Puppet Without Strings..."
 BLZ_forpol.21.desc: "My fellow OAS members," George Price announced to the crowd, "I am very happy to be standing here, representing Belize, for its first time as a full member of the OAS." Price glanced over to the Canadian and American delegates before saying, "Belize has never wanted to be a source of division for the Americas, and we're glad to move past this history of division. Today, we are glad to join in unity with our Latin America brothers!" Price gave a nod to the Mexican delegation as he left the stage, with applause leading him out.\n\nThe American delegates spoke amongst each other. "I guess we should just all go fuck ourselves," sighed Joe, "millions gone to them and this is what we get."\n\n"I'm surprised he didn't introduce himself as the Mexican delegate with how many loans he's gotten from them," replied Isaac.\n\n"The guy can't say much of anything, if he does then his whole economics plan goes away."\n\nThe group continued to bicker until the next delegate came up. Price gave them a second glance, and tried to not think about what they were talking about."
 BLZ_forpol.21.a: "...Is still a toy"
 
 BLZ_forpol.22.t: "Passed Around Without Remorse"
 BLZ_forpol.22.desc: "From the moment the announcement reached the radio, Belize's fast tracking of its bid to join the West Indies Federation, the streets erupted. Juan stood near Albert Street in downtown Belize City, watching yet another crowd pass, chanting, arguing, swept into the chaos of Goldson's decision. Juan once backed Goldson, seeing him stand in defiance of Guatemala and pro-Guatemalan policies, only to drag Belize into a different, larger union.\n\n"Move aside, brother," a passerby muttered, shoving Juan. "They say the Americans are thrilled with this. Thrilled! As if it makes us any better."\n\n"Any different from when the Guatemalans tried?" Juan retorted.\n\n"It's all the same: British, American, Guatemalan. Why can't they just leave Belize to the Belizeans!" The man ran to the next man to scream at him.\n\nAcross the street, another group of young Belizeans hoisted handmade signs, all against this new deal with the Federation. First, it was a fight against the Guatemalans, and now it was the Indies. Juan recalled the speeches he had cheered for not long ago, promises of a free, independent Belize. Now those very same leaders spoke of regional strategy and strengthening partnerships.\n\nSirens began to wail in the distance, and crowds began to disperse. Once again, Belize was being folded into something larger, something forced by outside powers. And this time, just like last time..."
 BLZ_forpol.22.a: "...Belizeans would once again fight for their own future."
 
 BLZ_forpol.23.t: "Land Clearance"
 BLZ_forpol.23.desc: "This was the perfect soil for citrus fruit. United Fruit's surveys had come to the conclusion already, but after taking a look at the land and taking just a few cursory readings of acidity and nitrate levels, Carl Fletcher knew, if anything, the predictions had been too modest.\n\nPhillip Goldson had invited a UFC survey group to look at potential locations for cultivation, and the company had been only too eager. Goldson was desperate for investment into his newly-independent country, and that meant UFC could get the land and a sizable percentage quite easily. But Carl needed to know how risky the investment would be before any of the executives would sign off on the bottom line. With the soil this rich, though, they'd see dollar signs no matter the risk.\n\nIt would be perfect if there weren't a small shanty town near the river. It wasn't much, just a few buildings made primarily out of logs and sheet metal. A few fishermen pulled their catches out of the river while small herds of goats were pushed around on the grasslands nearby, an ad hoc arrangement that seemed to crop up whenever there was a good water source.\n\n"Is everything to your liking, Mr. Fletcher. I know that United Fruit was eager to get things started before the growing season so that they could avoid any lost time."\n\n"The soil here is perfect, the water is fresh, and the land is flat enough for large-scale farming. I think United Fruit would be very eager to do business with you. The only issue we have is those squatters over there." Fletcher pointed in the direction of the village. "They'll need to be gone before we can start operations."\n\n"Agreed, we cannot have illegal settlements jeopardizing Belizean prosperity. They'll be cleared off immediately.""
 BLZ_forpol.23.a: "Necessity is the mother of creative destruction."
 
 BLZ_forpol.24.t: "Embrace The Stuck"
 BLZ_forpol.24.desc: "The air was sticky, but despite the humidity, there was barely any water to drink at this border outpost. Staff Sergeant Barnes looked over the ragged platoon that manned the outpost. Three shifts basically meant the camp always had a third of its people on duty, a third trying to get whatever passed for sleep on these humid cots while wrapped in mosquito nets, and a third bored out of their fucking skulls. Every other day, it seemed like a fistfight broke out over a dice game or whatever the privates tried to do to forget the fact that they were sent to the middle of the Motagua after the Canadians just fucking left.\n\nThere was no point in going over to the local town. Couldn't trust the water even if it was boiled, and they overcharged and watered down the booze, so not only did you not get drunk, you usually ended up spending three days in the latrine until you shit your guts completely dry. So Command just said don't bother going there.\n\nHis people didn't want to be here. He didn't particularly want to be here either, but he went where he was assigned and took a grim sense of satisfaction in that. He was a professional, a soldier, and he knew he could put up with anything because he was raised to believe that you never ordered a man to do something you wouldn't do yourself. Old-fashioned and naive, perhaps, but it's what made him a good soldier.\n\n"Sergeant Barnes, another fist fight broke out. Couple of guys broke it up, but we've still probably got a broken nose."\n\nBarnes muttered and got up from the impromptu desk he had. "Alright. No sense in bringing down the hammer any harder. Life already sucks enough here. Send them both to the infirmary and get them patched up. I'll just send them to opposite sides of the post and put the guy that threw the first punch on latrine duty for a few days.""
 BLZ_forpol.24.a: "A cord under tension will often fray if not maintained scrupulously."
 
 BLZ_forpol.25.t: "House of Cards"
 BLZ_forpol.25.desc: "It was well past midnight, but the office was buzzing like a hive. The situation in Central America has taken a turn for the worst. Every second more reports spilled out of the copier, were packaged and stamped, and sent out to the offices of the relevant departments. The words began to blur together. Full-scale invasion. Guatemalan forces flooding across the border. The Volunteer Guard collapsing. American citizens lost in the fighting. Canadians requesting asylum.\n\nThe messages repeated the same story everywhere. Without the support of the U.S. or Canada, there was no hope for the small nation. Decisions made by white-collar bureaucrats have been met with grainy images of their gory consequences. Once morning strikes there will be protests, mobilization, evacuation orders, humanitarian efforts. More paperwork.\n\nEveryhand was on deck between the Department of Foreign Affairs, the FBI, and before long the military would start asking for reports, status updates, and testimonies. In the rush of it all, the details became lost to the overworked office staff. Their hands bent into the correct shapes to do their job, but little else. Eventually, more would replace them, full of the same sympathy and energy that would grind away into the next night. And the next.\n\nAnd the next."
 BLZ_forpol.25.a: "What can we do?"
 

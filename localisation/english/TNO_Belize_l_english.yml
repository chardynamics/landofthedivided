 BLZ_forpol.30.t: "A Tree Falls in the Woods"
 BLZ_forpol.30.desc: "The OAS conference was boring. They slowly rotated out through speakers, airing minor issues, discussing infrastructure policy, and condemning armed conflicts. The Canadian representative was a pencil pushing bureaucrat of little note, head of a department no-one cared about, just high enough in government to warrant being stuck with the job of preparing and presenting a very formal condemnation of the invasion of Belize by Guatemalan troops. Half of the audience wasn't in their seats whenever he began his dry speech, but many more bodies slowly filtered in over the course of it. Not because of their interest in what he had to say, simply because he was the last speaker of the less important introductory portion of the conference and soon they would start discussing the actual issues, like the Oil Crisis.\n\n"... and we continue to condemn the actions taken within Belize and the surrounding territories by..."\n\nThe words blurred together, it's not like they were new. There was a small betting pool amongst the Mexicans as to if the words had been directly stolen from some famous speech in the past, or if it was a patchwork of a few. After a tiring few minutes it finally started to wrap up.\n\n"... We find it abhorrent that the perpetrators of this tragedy sit here, in this very room. We find it abhorrent that they would further destabilize this fragile place we call home. And we find it abhorrent that they sit not in disgrace, but as colleagues to all here. We ask the OAS for action, swift and decisive, and ask to open the discussion for immediate sanctions.""
 BLZ_forpol.30.a: "No one was around to care."

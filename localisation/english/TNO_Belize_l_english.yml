 BLZ_forpol.7.desc: ""
 BLZ_forpol.7.a: ""
 
 BLZ_forpol.8.t: "The Pressure is Mounting"
 BLZ_forpol.8.desc: "The clock ticking filled the silence of the office. The American consul tapped his finger on the desk in time with the seconds ticking away. His eyes locked on the Canadian governor's over the edge of the manila folder he had open in front of him. He set the folder down and slid it back towards the American. "So," the governor began, "you are going to do absolutely nothing."\n\nThe consul sighed and rubbed his temples. "No, Governor, we are going to be providing operational support and auxiliary staffing for your groups that you are sendi-" He cuts himself off in frustration. "Did you even read the damn document!"\n\n"I read that you are unwilling to provide any real support to keep Belize out of Guatemalan hands, letting my troops support the coup alone." The governor took a deep breath and looked the American right in the eye. "You do realize what this coup means, correct? The British Honduras Volunteer Guard are leading the country into chaos, relations with the Guatemalans are crumbling by the minute, and you..." The man leaned forward and spoke in a whisper louder than any shout. "You want to send auxiliary aid? I have a feeling, Consul, that without further support from abroad, there may not be a Honduras left to aid anymore. Someone will need to step up, because I am afraid we may not be seeing the value of this investment anymore."\n\nThe American set his jaw and stood up."
 BLZ_forpol.8.a: ""I will... make some calls, Governor.""
 
 BLZ_forpol.9.t: "Report BHVG #7"
 BLZ_forpol.9.desc: "The recent Oil Crisis has led to the Canadians formally announcing what we have long suspected, the complete withdrawal from British Honduras. This will leave the Volunteer Guard alone in attempting to keep the country together. The Mexico-backed Guatemalan government will invade without intervention, and they will almost certainly win.\n\nAnalysis of the situation makes it clear, the Volunteer Guard is incapable of surviving the pressure alone. The Canadians kept the country stable almost entirely on their own. We could step in and take the place they once had, though the cost would not be low. We would need immediate mobilization of troops to support the guard and enforce peace and interventionist treatises written up and signed before the week is out.\n\nTime is limited here and things are progressing quickly. We advise immediate action, or none at all."
 BLZ_forpol.9.a: "I guess we've got to..."
 BLZ_forpol.9.b: "It's time to cut our losses."
 

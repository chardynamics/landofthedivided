  SUR_forpol.6.t: "The Netherlands in the OFN"
  SUR_forpol.6.desc: "RESTRICTED/[GetDateText]\n\nFROM AGENT CLOVES\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: INSIGHT INTO KINGDOM OF THE NETHERLANDS\n\n1. Prime Minister Samkalden of the Kingdom of the Netherlands is perceived as a "reformist" for his pro-native policies. This frenzy of reforms was exacerbated by the merging of the positions of both PM of Suriname and the Netherlands, which gave a smooth process for its social reforms to shake up the foundations of the Dutch realm and had caused legal complications since his election win in 1963.\n\n2. The Estates of Suriname, the legislative body of Suriname, had its power base grow considerably in the wake of these reforms, rivalling the previously dominating Dutch Parliament and infuriating the conservatives among the exiles.\n\n3. The gradual removal of housing restrictions, improved transportation networks, and increased approval for housing mortgages allowed the interior Surinamese to settle in Paramaribo. This had a lopsided effect on the Dutch population. Though the new government had shown some success in integrating both blocs of a "complicated" society, droves of Dutch people had instead migrated to the Dutch Antilles.\n\n4. The Samkalden government aims to cajole a loan for a hydroelectric plant and a port expansion in hopes of gaining attraction for their growing manufacturing base. Samkalden left Suriname with a brand new public image that can placate some calls for independence, yet it may come at the cost of some reluctance for Samkalden's regime to participate in joint expeditions with the OFN."
  SUR_forpol.6.a: "Approve the loan." 
  SUR_forpol.6.b: "Reject the loan." 

  SUR.forpol.7.t: "Reform in Suriname"
  SUR_forpol.7.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM CHARLIE PACE\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: Results of Dutch Elections\n\n1. Recent elections in the Dutch government-in-exile centred in Paramaribo have seen the incumbent government defeated, to be succeeded by Johan Adolf Pengel of the NPS-VHP. This election was conducted with little fanfare or controversy, but there is growing frustration on all levels with the current state of Dutch politics, including in royal circles.\n\n2. Anger over racial discrimination, the consequences of the Hofmans Affair and general disinterest in maintaining ties with the Netherlands provided room for Pengel's ascendancy. Although unlikely to break with us internationally, his government marks a major shift in policy, and is seen as a mandate among Surinamese reformists.\n\n3. Our agent in royal circles, however, notes that conservatives view Pengel with great scepticism. Many fear that his term would mark a shift towards Surinamese nationalism, with concerns over a potential independence referendum overthrowing the Netherlands entirely. It would be a mistake to antagonise Queen Julianna, but it would be wisest to ensure that governance continues to smoothly function"
  SUR_forpol.7.a: "AND YE SHALL KNOW THE TRUTH AND THE TRUTH SHALL MAKE YOU FREE"

  SUR_forpol.8A.t: "Bernhard Affair"
  SUR_forpol.8A.desc: "The Estates-General building in Paramaribo was often a sleepy place. The long years of exile had settled into an aimless doldrum, only shaken by the occasional crisis, such as the one currently unfolding. Dutch Prime minister Meynen wiped his brow under the scrutiny of the journalists in the gallery. Unfortunately, he would have to be the one answering their questions - the chief culprit couldn't be bothered to come.\n\nAfter a short speech about his government's commitment to transparency and to the rule of law, barely audible above the murmuring crowds and flashing cameras, Meynen opened the floor to questions, leading to a merciful moment of silence before a faceless voice asked the first question.\n\n"Joe Hobson, for the Los Angeles Times. What can you tell us about the recent revelations about Prince Bernhard's business dealings? What will be your government's response?"\n\nOf course the Americans would immediately try to stir the pot. "Our investigation is proceeding apace. However, we will not put the honor of the royal family in jeopardy until we have conclusive evidence, one way or the other."\n\n"Olivia Bakker, De Volkskrant. What is your response to the recent expose about the horrid working conditions in government-contracted mines and their owners' connections to the royal family?"\n\nMeyen knew this question would come, and had prepared accordingly. He would always be the Crown's man, but if the Crown was intent on sabotaging his work, he'd have to cut off his strings. "The situation we have been exposed to in recent weeks is indeed intolerable, and it casts a shadow over this government. As a democratic government, we are dependent on the people's trust, and that trust must be renewed. Towards that end, we have decided to call a snap election.""
  SUR_forpol.8Aa: "It is for the Crown's own good."

  SUR_forpol.8B.t: "Bernhard Affair"
  SUR_forpol.8B.desc: "Piet and Jo were on a smoke break, sitting in the shadow of a small shed for protection from the beating sunlight, as well as from prying ears. Soldiers were not supposed to openly discuss political matters, but being stationed in Paramaribo itself, the heart of the Kingdom of the Netherlands in Exile, they'd heard more than most other soldiers.\n\nPiet murmured between whiffs of his cigarette. "...And now they say that Prince Bernhard himself is down to his neck in all that business. Do you remember Adrian, the guy from the engineers corps? We met the other day. He's a security guard at Shell headquarters now, and he says that on some days it seems like that entire royal household is migrating to a Shell boardroom. He couldn't have not known about it."\n\nJo stubbed his own cigarette on the ground before lighting another one. "Yeah, he's in deep shit. Heard some guys down at the docks say that police came looking into some of the royals' businesses, something about illegal dealings with US firms. The only good news is that it looks like the government is actually taking this thing seriously."\n\nPiet wiped his forehead. "Well, they can't really afford to let this slide. Every day something new comes up. Last week it was bribery, then it was lobbying the Americans under the table, and now its abuse in the mines. Have you seen the pictures? These poor kids are getting worked to the bone down there."\n\n"I hope you're right," Jo leaned back. "But you know how it is with politicians, they'll do anything to save their own hide. They claim they're committed to reform and all that, but I imagine the Queen can't be happy about this. If they want to keep their seats...""
  SUR_forpol.8Bb: "...they wouldn't make the Queen too angry.""

  #SUR_forpol.9 is available for usage

  SUR_forpol.10.t: "1969 Curaçao Uprising"
  SUR_forpol.10.desc: "-CONFIDENTIAL-\n\nFROM THE SURINAME OFFICE OF THE FBI\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: AFTERMATH OF THE CURACAO UPRISING\n\nEver since the establishment of the Dutch government-in-exile in Suriname (hereafter UKN), friction between Paramaribo and the Netherland Antilles has been a recurring theme, particularly in times of crisis. The local inhabitants, disaffected with the stagnant and unrepresentative UKN rule and with its unwillingness to aid the islands' receding economy, have long been a prime target for radicals.\n\nThese crises have now reached a boiling point. Popular anger and frustration have resulted in a loose coalition of various groups - trade union militants (p. 3), black nationalists (p. 4-5), and even liberal reformists (p. 5-6) have banded together to seize control of key locations throughout Willemstad and and Curaçao at large, leading to widespread chaos and looting as UKN forces have been unable to exert control over much of the island.\n\nThe situation is increasingly perilous. Radical figures among the Curaçao rioters (see list of known agitators in appendix A) are feared to have aspirations of seceding from the UKN, with the support of regional socialist powers (see evidence of connections between both sides on p. 6). Following some pressure, the UKN government has expressed its desire to reassert control, but both its claims and FBI assessments indicate that it lacks the logistical capacity to restore order without causing an unacceptable amount of damage and casualties. In order to ensure that the operation does not cause further escalation, American aid is recommended."
  SUR_forpol.10.a: "We can't let the Antilles slip away from our grasp."

  SUR_forpol.11.t: "End of the 1969 Curaçao Uprising"
  SUR_forpol.11.desc: "Piet stepped from the American ship onto the Willemstad pier, surrounded by dozens of other soldiers. Their path was already delineated by the police barriers erected before their arrival, and by the silent crowds which had come to watch the UKN re-assert its presence on the island. He didn't expect to be greeted enthusiastically, after everything that went down in Curaçao, but the quiet still unnerved him and the judgmental stares pierced deep into him.\n\nPiet gripped his American rifle and steeled himself. They were bringing order back to an island gripped by anarchy. Protests were one thing, but burning police stations and looting shops was not something any government could accept, and a country in a position as continuously precarious as the exiled Kingdom of the Netherlands could accept it less than most. Any crack could let them break in and ruin the last shred of a free Europe they have established here in the Caribbean. That could not be tolerated.\n\nAs the military jeep, also provided by the Americans, trundled through the streets, Piet managed to convince himself that everything had turned out mostly satisfactorily. American help had been crucial, but in the end, the blockade had convinced the holdouts among the rioters to surrender. Some of the ringleaders have departed for exile, and the rest were transferred to holding facilities in the mainland until they could stand trial. Air recon allowed the blockading forces to block most attempts to smuggle provisions or men inside or out, leaving Curaçao isolated from opportunistic forces around the Caribbean and further afield.\n\nBut as Piet lay down that night in an American-provided bunk in a hastily-constructed barracks built to accommodate the newly-enlarged garrison, struggling to fall a sleep, a thought kept nagging at his thoughts:"
  SUR_forpol.11.a: "Who was really sovereign in Curaçao - or in Paramaribo, for that matter?"

  SUR_forpol.12.t: "End of the 1969 Curaçao Uprising"
  SUR_forpol.12.desc: "Piet was exhausted, but sleep would not come to him as he crashed down on the American-provided bunk, stuffed alongside his companions in the former school building now hastily converted into a barracks. The nightmares he had seen during the day flashed behind his eyelids, and he knew that if he fell asleep, they'd follow him there, too.\n\nThis was never supposed to go this way. The Americans had provided them with weapons, blockaded Curaçao, and trained UKN forces. Before they had embarked from Paramaribo to restore order, Piet and his companions were told that the uprising in the island had been suppressed, and that their job was only to ensure that the Kingdom of the Netherlands could once more properly manage the realm. And then they landed, and everything crashed around them.\n\nPiet suddenly got up, leaving the room and stomping outside to take a smoke. Leaning on the window of an abandoned classroom, he could not get the eyes of the people who had supposedly come to greet them at the Willemstad port. They weren't thankful, or even afraid. They were furious. Indignant. Defiant. And when the first Zhdanov cocktail was thrown at their convoy as it trundled through the narrow streets, this wave of defiance broke over the troops.\n\nIt was self-defense, Piet told himself. He and his friends were in real danger. But as the cigarette's stub burned his fingers, he could smell the smoke in the streets, hear the bangs of rifles, see the bright red of bloodied rioters falling to the ground, and he knew that even if it was self-defense, it should never have happened. They were being sent to massacre their fellow citizens, led into danger by complacent, deceitful generals. And as Piet stumbled back into the bunk, holding his American rifle tightly, he could see perfectly well that the fault didn't rest solely in the hands of the government in Paramaribo."
  SUR_forpol.12.a: "The Caribbean would be America's lake, even if it ran red with the blood of its people."

  SUR_forpol.13.t: "1969 Curaçao Uprising"
  SUR_forpol.13.desc: "-CONFIDENTIAL-\n\nFROM THE SURINAME OFFICE OF THE FBI\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: AFTERMATH OF THE CURACAO UPRISING\n\nEver since the establishment of the Dutch government-in-exile in Suriname (hereafter UKN), friction between Paramaribo and the Netherland Antilles has been a recurring theme, particularly in times of crisis. The local inhabitants, disaffected with the stagnant and unrepresentative UKN rule and with its unwillingness to aid the islands' receding economy, have long been a prime target for radicals.\n\nThese crises have now reached a boiling point. Popular anger and frustration have resulted in a loose coalition of various groups - trade union militants (p. 3), black nationalists (p. 4-5), and even liberal reformists (p. 5-6) have banded together to seize control of key locations throughout Willemstad and and Curaçao at large, leading to widespread chaos and looting as UKN forces have been unable to exert control over much of the island.\n\nThe situation is increasingly perilous. Radical figures among the Curaçao rioters (see list of known agitators in appendix A) are feared to have aspirations of seceding from the UKN, with the support of regional socialist powers (see evidence of connections between both sides on p. 6). In response to the crisis, the reformist UKN government has opted to begin a process of reform which will likely grant many of the rioters' wishes, possibly even reforming the UKN into a federal kingdom with full representation for the Antilles. This process would be highly dangerous to American interests, as it will grant anti-American voices a strong base to force through disadvantageous legislation in the Estates-General."
  SUR_forpol.13.a: "We can't let the Antilles slip away from our grasp."

  SUR_forpol.14.t: "End of the 1969 Curaçao Uprising"
  SUR_forpol.14.desc: "Piet was sitting alongside his squadmates at their Paramaribo barracks, listening intently as the crackling radio came to life. Ever since the uprising in Curaçao had upended political life throughout the Dutch realm, he and his companions had lived under constant tension. The government had claimed that it was open to negotiations and wanted to reform the realm in order to respond to the protesters' pleas, but Piet knew that any wrong move by either side would lead to their deployment to Willemstad. The mere idea of cracking down on his fellow citizens who had merely protested for better treatment tied his stomach into knots.\n\nBut now, the wait will be over. The Prime Minister was set to announce the results of the negotiations, and Piet had a good feeling. After all, if the negotiations had collapsed, he probably wouldn't be waiting here in Paramaribo by now. But they'd still wanted the official confirmation. As the Dutch anthem blared from the small machine, the soldiers quietened down, waiting with bated breath.\n\n"Citizens of the Netherlands", the voice of the Prime Minister crackled into the room. "It is with great satisfaction and pride that I can tell you today that negotiations with representatives of the Curaçao protesters have managed to reach an agreement which was deemed agreeable to both parties. The Antilles Estates shall be restructured to provide a more fair and equitable representation to the citizens of the islands, and each island shall have its own direct representative to the office of the Prime Minister. In response, the protesters have agreed to peacefully reintegrate the island into UKN control-"\n\nThe rest of the address was lost to the sound of cheers, backslaps, and popping bottles of beer and cheap champagne. Piet slumped back into his bed, relief washing over him. Dutch soldiers would not have to press the boot over Dutch citizens. He thought that the agreement sounded like a bureaucratic nightmare, but that wasn't his problem."
  SUR_forpol.14.a: "Not today, at least."

  SUR_forpol.15.t: "End of the 1969 Curaçao Uprising"
  SUR_forpol.15.desc: "Night was falling over the Caribbean, leaving a diminishing strip of sky in a darkening hue of bloody Red-Brown to reflect the platoon's mood as an ominous, sullen silence weighed over the ship carrying Piet and his companions. Huddled together on the deck or under it, smoking cigarettes or playing cards, one thought hung in everyone's mind: things shouldn't have gone this way.\n\nWhen the protests in Curaçao erupted into violence and an outright uprising a few weeks ago, it was clear that the Dutch government's greatest test had come. For a government claiming its dedication to reform, the crisis was its greatest opportunity to prove that it could sufficiently respond to the growing demands of its people for change while maintaining cohesiveness in the realm, and come out stronger and more unified on the other side.\n\nThat was the hope, at least. While the Prime Minister's voice waxed every evening through the old, crackling radio in Piet's barracks in Paramaribo, talking of the legitimate grievances of the people of the Antilles and of the country's need to rise to the occasion, strange rumors began to swirl, soon followed by strange happenings. Soldiers guarding the royal mansion spread whispers of attempts by the crown to shoot down the negotiations with Curaçao, and then protests began filling the streets of Paramaribo, demanding the government to put down the uprising and to not allow the realm to be "destroyed from within" by radicals.\n\nAnd it worked. Early this morning, Piet's platoon was woken up, given orders to help in the retaking of Willemstad, and loaded onto the American ship waiting at the harbor. They were good soldiers; they'd fulfill their orders. But on their way there, they were free to grumble. It didn't feel like they were serving freedom by putting the boot down on their fellow Dutch citizens. Piet didn't even really feel that he was serving the Netherlands by adding pressure to what was looking like a time bomb in the making."
  SUR_forpol.15.a: "Who were they really serving?"

  SUR_forpol.16.t: "Anti-Corruption Riots in Suriname"
  SUR_forpol.16.desc: "-CONFIDENTIAL-\n\nFROM THE SURINAME OFFICE OF THE FBI\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: RIOTS IN PARAMARIBO\n\nLast year, revelations of Dutch Prince Bernhard's illicit dealings with American interests and desperate working conditions for miners in American-contracted mines inland came to light, considerably tarnishing the royal family's reputation among the Surinamese public. The government of Jo Meynen (see appendix A), consisting of crown loyalists and pro-American voices, has responded by calling a new election, which has, due to restrictive voting rules, returned Meynen to power with a comfortable majority.\n\nHowever, this attempt to win back the public's trust of the Dutch exile establishment is coming undone. No charges have been pressed against Prince Bernhard or any other leading member of the Dutch elite (see Appendix B), and Meynen's new cabinet has also been implicated in related corruption scandals. These crises, as well as a general sense in the Surinamese public and media that the Dutch have run the country with complete impunity, has led to crippling strikes and riots paralyzing Paramaribo and spreading to other cities as well.\n\nWith Meynen's government seemingly unable to offer a meaningful response to the protestors' demands, it appears that its days are numbered. However, it is highly preferable that any transition of power will be mostly peaceful and maintain as much of the current structure as possible, especially as the content and leaders of the riots become increasingly radical in their anti-Dutch rhetoric and demands, some even calling for full independence and the de-facto end of the Dutch government in exile."
  SUR_forpol.16.a: "Let's just calm down, everyone."

  SUR_forpol.17.t: "Budget Crisis"
  SUR_forpol.17.desc: "The harsh sun and humid heat beat down on Piet as he stood watch over the gates of his Paramaribo barracks, but these were minor inconveniences before the huge crowd undulated before his eyes. The crowd rippled before his eyes, with heat shimmers merging into the mass of flags - Dutch flags, Surinamese flags, some red flags, as far as the eye could see. They were peaceful, but Piet could not help but feel the dread of an ant standing before a tidal wave.\n\nWhat an awful business, Piet thought to himself. The mess that was the Dutch government meant that the Prime Minister of the Netherlands in exile was also the Prime Minister of the entire kingdom, including Suriname and the Netherlands antilles. And that, in turn, meant that a crisis affecting the exile government could well affect Suriname, like what was happening before his eyes. What started out as yet another dispute between the Crown and the government about budget allotments and investment programmes led to the former Dutch Prime Minister's resignation, and culminated in the Queen doubling down and sacking him from as the entire Kingdom's premier as well.\n\nA new Prime Minister, Just Rens, was hastily appointed without elections, but Suriname might as well have been without government now. The parties of the previous government, riding on a wave of self-righteousness, and for once, having the public on their side, have declared a unified response to the crisis, culminating in the general strike paralyzing Paramaribo and swelling before Piet's eyes.\n\nBut Piet kept his watch, stewing in the sun and in his thoughts. He was a soldier of the free Netherlands, maintaining the torch of freedom at least in some corner of his homeland, the land he had never seen but that his parents would tell him about every night when he was little. That's the story he had grew up on, the one which made him join the army. But with the crowd swelling more and more, he found it harder to buck a nagging question:"
  SUR_forpol.17.a: "Which side was he on?"

  #Deprecated
  SUR_forpol.18.t: ""
  SUR_forpol.18.desc: ""
  SUR_forpol.18.a: ""

  SUR_forpol.19.t: "Surinamese Riots Suppressed"
  SUR_forpol.19.desc: "When furious protests engulfed Paramaribo around Piet's base, he and his platoon were told to stay in their barracks until further notice. He didn't know what to think about the protests. He was the son of Dutch exiles, and his entire life has been dedicated to the maintenance of what was left of the free Kingdom of the Netherlands. But his time in the army brought many questions, some of which he didn't feel like answering, and the chanted slogans penetrated the base's walls and into his thoughts. So he spent his time with his mates in the barracks, playing cards and hoping that they wouldn't be called upon to quell the protests.\n\nAnd it worked. This morning, Piet was told that the situation had calmed down enough that he could be allowed leave for three days. He was relieved then, but as he left the base for the first time in too long, his stomach began tying into knots. The streets, usually humming and bustling, were not just quiet: they were deserted. In some central thoroughfares, Piet's only company were burnt tires and crushed protest signs. In others, police barricades and vehicles still lined the road, giving him a stern look as he passed by.\n\nWhen he finally got home, Piet noticed the day's newspaper laying on his father's couch. He picked it up, trying to understand what happened in his absence. The paper reported that the protest movement had disbanded due to internal infighting, with some calling for increased autonomy while others denouncing them and calling for outright independence. This, combined with "efficient and focused police response to disorder", has managed to bring order back to Suriname. The report concluded with the Premier's pledge to solve the root causes behind the riots.\n\nPiet leaned back and closed his eyes. This again. The government began its term with grand promises of reforming the Netherlands into the modern age, and every time it did just enough to avert catastrophe."
  SUR_forpol.19.a: "What will happen when it is not enough?"

  SUR_forpol.20.t: "Surinamese Riots Earn Concessions"
  SUR_forpol.20.desc: "Piet was back home after six grueling weeks at base, drilling and working in the expectation that they would be called upon to crush the rapidly mounting riots outside. The foreboding feeling of the eventuality of being called upon to beat or even shoot his fellow citizens hung over Piet like a cloud for days now, no matter how many times he told himself that these were dangerous radicals tearing the realm apart.\n\nAnd then, just like that, the protests dispersed. Piet knew bits and pieces - the police were inefficient, and rumor in the base had it that America was withholding aid until concessions were granted. Now he finally had the time to read the newspaper he picked up at the nearby kiosk, time to digest. Time to think.\n\n"Estates Authorize Independence Vote." He had already seen the words when he had bought the paper, but their meaning hadn't fully impressed itself on him then. Now, however, a sinking feeling was growing in Piet's gut, a fear of a kind he had never felt before but was suddenly aware that his parents knew all too well. He was born in Suriname to a family of Dutch exiles, who had left their homeland when the Nazi terror fell across it. This was the only home he knew, but for his parents, it was only a refuge, a log to grasp in the storm that had befallen their lives. Now, Piet could feel the storm coming to him too.\n\nPiet shook his head. This was different. These weren't Nazis coming to rob his people of their land - these were people who had lived here long before he was born, long before any Dutch person ever came here. They only wanted to be treated with dignity, to know that the government was beholden to them and not to a distant elite, able to act with absolute impunity, as the Bernhard affair had shown this all too clearly. And now, the Meynen government's clumsy attempts to shift blame were crashing all around them. This was only natural, the logical end point of the deep rot that Piet knew all too well."
  SUR_forpol.20.a: "But the sinking feeling remained."

  #Deprecated
  SUR_forpol.21.t: ""
  SUR_forpol.21.desc: ""
  SUR_forpol.21.a: ""

  SUR_forpol.22.t: "Dutch Terminate General Strike"
  SUR_forpol.22.desc: "Piet was once again standing at the gate of the Paramaribo barracks, but the overcast sky overlooked an empty street. Where once the multitude of Dutch and Surinamese women and men filled the street like a rushing tide, threatening to break its banks and drown him in its mass, the sound of a passing police car felt deafening.\n\nIn a way, Piet was certainly relieved. He was an experienced soldier by now, but being the only thing standing between the masses of protesters and a military base was never a pleasant experience even if he could be counted on not to lose his nerve. The capital being freed from its paralysis was also a good thing, he reckoned. Lots of honest people may have been angry about the government, but they'd also wanted to earn their bread, and now they could do that without being branded as scabs or traitors.\n\nBut the feeling that Piet experienced on that searing-hot day, when the crowd protested in front of him, did not leave him. It was a feeling of righteous anger by a people wronged, of solidarity between groups who united for a better future. It was a feeling of power. It was terrifying - but there was something exhilarating about it, even on the other side of the barricade.\n\nAnd now that it was over, Piet could not help but feel a certain bit of sadness, and even shame. These people were fighting for a better future, and even if some of them were misguided radicals, he believed that most of them only wanted the best for Suriname, and for him too. He could see their side - he met the many failings of the Dutch government all too closely. And the way that the government had handled the strike - continuous harassment of leaders and backroom deals with fictitious workers' organizations and employers - well, it had worked, but it felt deeply wrong."
  SUR_forpol.22.a: "He wasn't sure which side was right, but he felt that he was on the wrong one."

  SUR_forpol.23.t: "General Strike Topples Surinamese Government"
  SUR_forpol.23.desc: "Piet and Jo were sitting at the mess hall of their barracks, listlessly pecking at their meals while discussing the recent developments in Paramaribo. They were not the only ones - it was the main topic of discussion among the soldiers surrounding them in the cavernous hall, echoing a maelstrom of opinions and emotions.\n\n"I think it's a good thing, you know?" Jo said, playing with his fork instead of looking Piet in the eyes. "The Queen needed to be shown that she can't just ignore the people. The strikes were chaotic, yes. But now there's a legitimate government again. And the independence thing... well, that's what you get for alienating the people who live here."\n\nPiet stabbed at his beef. "So you want it to pass?"\n\nJo smirked. "No, Piet. But I don't think it will, you know? It's just going to let people blow off steam before they go back to normal."\n\n"But what if it does pass, Jo? What's gonna happen to the Netherlands? What's going to happen to us?"\n\n"Life will go on, Piet. We'll be alright. No one's going to kick us out."\n\nPiet dropped his cutlery on the table. "You don't understand. What will happen if the last free part of the Netherlands just... gives up? What will the people back in Amsterdam think? What will my parents and your mom think? How can we just let our country disappear like that?"\n\nJo grimaced. "Again, I don't think that will happen. And if it does... maybe that means the Netherlands has already disappeared...""
  SUR_forpol.23.a: ""We just haven't realized it until now.""

  SUR_forpol.24.t: "OFN Suspends Kingdom of the Netherlands"
  SUR_forpol.24.desc: "UNDERSTANDING concerns over the process of independence that a prospective Surinamese Republic with the wider circumstances of administration and of the Netherlands' unique geographic position,\nNOTING that the Kingdom of the Netherlands is still mostly occupied by the Greater German Reich, and calling for its full independence to be restored by Germania as per Resolution 04/1947,\nRECOGNISING the risk that economic and geographical insecurity poses to the people within the Netherlands, and to those within Suriname,\nEMPHASISING the importance of Article 4, that ideals of popular sovereignty and democracy are central tenets within the foundation of this alliance,\nHIGHLIGHTING wider issues with discrimination and inequality in the Netherlands on a racial level,\n\nThe Organisation of Free Nations hereby;\n1. Indefinitely suspends Dutch membership until its military junta is dissolved, alongside all military cooperation;\n2. Calls for the referendum on Surinamese independence to be respected and for the pardoning of nationalists currently imprisoned;\n3. Backs the repeal of laws preventing people of certain races from fully partaking in all aspects of Dutch society;\n4. Encourages all members within to take swift action to ensure that all of these tenets are fully implemented."
  SUR_forpol.24.a: "Signed [?global.date.GetDateStringNoHourLong]"

  SUR_forpol.25.t: "Dutch Exile Deployments in Haiti"
  SUR_forpol.25.desc: "The United States is far from the only nation in the Caribbean aiming to curtail Axis-aligned interests in the reason, as can be seen in the many different military missions dropping down in Port Au-Prince following the outbreak of war with the Dominican Republic. Not to be outdone even following the fall of the Netherlands in WW2, the Dutch Government In Exile in Surinam have taken up arms on the ground in Haiti, scratching at the chance to face elements of the old enemy for the first time since 1940.\n\nTrained in counter-insurgency by US military attache, the advisory contingent force in Haiti is largely made up of Dutch, Aruban and Surinamese among other exiled troops, All highly trained by COIN, all more than ready and able to face Dominicans wherever they lie.\n\nAccompanying US and Haitian forces deep in the mountains of the Haitian interior, the Dutch Exile soldiers, despite the precariousness of the Dutch regime in Suriname, nonetheless maintain a high esprit de corps and battlefield proficiency shoulder to shoulder with just about any coalition force in the OFN. Cracking the Reich's iron grip on the European lowlands and the return to Rotterdam are certainly a long way off, but the Dutch expeditionary force in Haiti is giving pro-Axis forces a reminder, just in case Germania doesn't remember, that their former neighbors from Holland haven't forgotten about them."
  SUR_forpol.25.a: "Not so neutral anymore."

  SUR_forpol.26.t: "In the Middle"
  SUR_forpol.26.desc: "The Boer soldier reiterated for the third time what he knew about his command structure, his Dutch fluent but heavily accented. Finn was passingly familiar with the accent, enough to relay the soldier's words to the grim-faced American standing nose to nose with the young Boer. Officer Blanchett somehow looked even more stern for a moment before he turned back to the two translators. "That doesn't make any more sense than the last time you told me."\n\nIt indeed did not make any more sense. The soldier had slipped several puns, only understandable in Dutch, into his explanation. That resulted in the translation being... messy. The American grew more and more reticent (or confused, it was hard to tell) as in each explanation the puns got more sophisticated. Even Finn was having a hard time understanding some of them, and he had a degree in the language. Alfred just laughed a little; the older translator enjoyed trading linguistic barbs with the charismatic Boer.\n\nBlanchett looked at the older man. "What's funny, what did he say?"\n\nAlfred looked at the captive soldier in turn and said, "He is asking what is funny, son. What should I say?" The Boer got a concentrated look on his face, suddenly smiled and opened his mouth, but was cut off by the American yelling, "Do not fraternize with a captive soldier! What do you think this is!"\n\nFinn went pale, but Alfred was nonplussed. "I think this is a wonderful opportunity to converse with a master of my beautiful language so far from home. I spent too long in the KNIL trying to talk to Indonesians, who don't even speak a word of Dutch." He lit a cigarette and continued, "I am enjoying myself, Officer. Try it sometime."\n\nBlanchett looked at the old translator, then at Finn."
  SUR_forpol.26.a: ""Can we please just continue?""

  SUR_forpol.27.t: "Dutch Exiles to Aid De Gaulle in Africa"
  SUR_forpol.27.desc: "With the American intervention in West Africa, other nations in the OFN have followed Washington's lead in backing Charles DeGaulle in his standoff against the pan-nationalists in Cameroon and their backers in Tokyo. Locked in a similar struggle for legitimacy against their Axis collaborator counterparts in western Europe, the Dutch Exiles in Suriname have, at the invitation of DeGaulle, agreed to send their own troops to assist the Free French against the Pan-African Bloc.\n\nIt is not difficult to see how the priorities of the Dutch Exiles dovetail with that of Free France, even though the Dutch exile government has had a comparatively easier time asserting legitimacy against the Reichskommissariot in Rotterdam than DeGaulle's government has against the Vichy regime. Both the Dutch Exiles and Free French have a shared history in tragedy and resistance, therefore it is only right to reinforce DeGaulle's mission for French liberty just as they hope Free France would do the same for the occupied peoples of the Netherlands.\n\nThis however is a very flowery way to present the exile governments of the French and Dutch, as the colonial foundations of either administration is difficult to ignore, especially in the United States. DeGaulle's government in West Africa, as well as the United States' role in supporting his administration, have long been castigated by organized protests sympathetic to African natives along the Ivory Coast, some even favoring the efforts of the Pan-Africanists in Cameroon.\n\nSimilar voices advocating for Surinamese independence from Dutch colonial rule have slowly been gathering supporters, advocacy that has only intensified with the Dutch Exile intervention in West Africa as the cooperation deepens the public image of the exiled Dutch with DeGaulle, including growing opposition to the US involvement with the Dutch in Suriname as well."
  SUR_forpol.27.a: "The US, De Gaulle, The Dutch Exiles, all will be vindicated when OFN soldiers parade through Rotterdam, just give it time!"

  SUR_forpol.28.t: "A Beneficial Relationship"
  SUR_forpol.28.desc: "The USA and the Netherlands have struck a new alliance, beyond what the OFN offers, formalizing a relationship formerly built on favors and politicking. The Defense Treaty's main goal is to secure a US defense commitment to Dutch territories in the Americas and the New World at large. They also will be sending officers to assist with training and consistent shipments of new, state-of-the-art military equipment.\n\nThe deal was only made possible by the pressures of foreign intrusion into the Americas and the recent 1969 Curaçao Uprising. The defence treaty almost died in committee, but favors from the President's allies in the Ssenate made it pass smoothly and with surprisingly little reporting from the media.\n\nThe President and the Dutch Prime Minister are set to meet for a behind-closed-doors meeting regarding the specifics of the second half of the deal: military bases in the Netherlands. New special basing rights that supersede previous Dutch foreign law are being put in place to give America a hand near the heart of Europe. They have been making a large effort to keep this part mostly quiet, and the locations of the bases are mostly classified information.\n\nAn additional clause hidden in the treaty specifies the deployment of a sizable portion of the US nuclear arsenal in the Netherlands as well."
  SUR_forpol.28.a: "The shadow of liberty stretches across the Atlantic."

  SUR_forpol.29.t: "It's Complicated"
  SUR_forpol.29.desc: "General Oliver leaned forward in his chair to focus on cutting the cigars for himself and Suriname officials. "As I was saying, I consider your offer extremely generous. I just worry about what having you here will do towards our relations with Hatta. I don't want him to feel like he isn't fighting his own war."\n\nThe leader of the Dutch contingent nodded as he lit his cigar, taking an appreciative draw. "This is why I offer only supporting staff. We have officials familiar with this land and its people: translators, navigators, cartographers, some bureaucrats to help Hatta organize his government. Not a single gun fired, just a strong, Dutch backbone. So long as our presence and our support are well known here and you help settle some unfortunate talk, that is enough."\n\nThe General squinted his eyes as one of the men handed him a sheet detailing the 'talk' the Dutch were hoping to quash. Mostly some propaganda regarding some of their less-than-favorable actions during the colonial era in the region. It was distasteful, Hatta wouldn't like it, but they could really use Suriname's support. He nodded and said, "I think that can be arranged. I assume you are also wanting your reporters to have full access? So they can document your 'revenge' against Japan."\n\nThe Dutch leader frowned slightly at the emphasis the general put on the word, but nodded anyway, sliding the full agreement across the desk, the addendum somehow already in place. "Yes, we will want as much as you can give. Your support for ours."\n\nOliver rubbed his face and pulled long on his cigar. Hatta is not going to like this."
  SUR_forpol.29.a: "He signed his name anyway."

  SUR_forpol.30.t: "Into the Jungle"
  SUR_forpol.30.desc: "The American ambassador braced himself for the hard landing on the tiny airstrip in the middle of the South American jungle. The small propeller plane was all that could make it out to these somewhat remote, but very important, bases in Suriname. He had previously spent the last few days observing OFN joint military exercises by the naval units and interdiction airforce squadrons. Now he was to observe the conditions of the ground troops.\n\nAs he stepped out of the plane, he was struck by just how many flags were emblazoned across the camp and felt a moment of pride. It was foreign dealings that he himself had played a role, if a small one, in that led to such a congregation. He quickly reasserted his professional demeanor and made his way towards the American flag, clipboard in hand.\n\nThe stench of infection wafted from the US section of the camp, causing an immediate frown on the ambassador's face. Were they housing all the camp's sick here? The answer was immediate. No. There were simply so many Americans sick that they overflowed out of the medical tents. The ambassador, clipboard forgotten, rushed to get a full report.\n\nAs he made his way deeper into the American camp, he found it in utter disrepair. Critical equipment was piled in the mud outside, clearly broken. Uniforms were full of thorn holes, and boots had their tread scraped flat. The ambassador took photographs with his small camera to report back with, including a personal photo for himself. An American, Dutch, and Australian soldier gathered together playing cards.\n\nHe quickly gathered his needed reports and figured out when the next plane to Aruba was."
  SUR_forpol.30.a: "Time to leave the jungle as fast as possible."

  SUR_forpol.31.t: "Surinamese Independence Defeated"
  SUR_forpol.31.desc: "SECRET/[?global.date.GetDateStringNoHourLong]\n\nFROM CHARLIE PACE\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: Results of Surinamese Referendum\n\n1. Our efforts have prevented Suriname from seceding from the Netherlands. Although the nationalist campaign had gained real ground in the last few years, it was not enough to overcome pro-royalist pressure. This will likely feed into Juliana's and [SUR.GetLeader] claims of legitimacy, but has not decisively quashed nationalism.\n\n2. Nationalist forces were strong, but did not have the institutional backing that entrenched unionism did. Juliana herself was uncooperative, and this sentiment was internally widespread. Our agents indicate numerous anti-royalist strongholds faced significant intimidation to back unionism, whilst some reporters highlight small, but decisive irregularities.\n\n3. Most nationalists are too dejected to pursue independence further at present, but frustration remains high, and it is unlikely that [SUR.GetLeader] will pursue further reforms. The monarchy is unpopular, which may feed into anti-Americanism, but no tie currently exists, and the view is gaining new currency. If Suriname might not have emerged from this, perhaps a Dutch Republic still might."
  SUR_forpol.31.a: "The more Paramaribo changes, the more it stays the same."

  ### News Events
  SUR_news.1.t:0 "[Get_newspaper_header]The Death of Queen Wilhelmina"
  SUR_news.1.desc:0 "Queen Wilhelmina of the Netherlands, exiled in Suriname, has died of cardiac arrest in her makeshift residence in Paramaribo where she has stayed since the government-in-exile's decampment to the Caribbean. The death came as no surprise: Wilhelmina had long been ill, forcing her daughter, the now-Queen Juliana, to assume more and more of her duties.\n\nThe Dutch Caribbean - at times plagued by disagreements - unites to mourn her death; mourning has even been reported in the Nazi-occupied Netherlands. At the late queen's request, the funeral was performed in white vestments rather than black in reflection of her Christian belief that death was merely the beginning of eternal life. Due to the circumstances, a special cemetery has been built in Paramaribo to house her remains; however, government sources indicate that if Amsterdam is ever freed, she will join her ancestors in the Royal Crypt there.\n"
  SUR_news.1.a:0 "Our condolences."

  SUR_news.2.t:0 "[Get_newspaper_header]Reformation of the Dutch Basic Laws"
  SUR_news.2.desc:0 "Recent actions by the Dutch government against Surinamese autonomy have sparked protests in the capital city of Paramaribo following revisions to the colonial Basic Laws. The mostly vacant Dutch legislature passed legislation that reduced the exile government to a ceremonial position and established voting privileges for exiles in Suriname. Queen Juliana's advisors then advised her to dismiss the Surinamese Prime Minister and appoint the Dutch Prime Minister, thus further unifying the Dutch realm.\n\nThe move has sparked outrage among the Surinamese population, who view this move as a violation of prior autonomy agreements with the Dutch crown. While the current Surinamese National Assembly will continue to stand until the next elections, the new Basic Laws have produced a rift between the exiles and Surinamese populations.\n"
  SUR_news.2.a:0 "Is this a free nation?"

  SUR_news.3.t:0 "[Get_newspaper_header]Reorganization of the Dutch Realm"
  SUR_news.3.desc:0 "From Paramaribo, the Dutch government-in-exile has agreed with the Estates of Suriname regarding the Kingdom's political future. In exchange for increased crown control over the Surinamese government, the Dutch government-in-exile has decided to dissolve itself and grant Suriname status as the Kingdom of the Netherlands's primary constituent country. This deal comes after months of negotiations and integrates the old Dutch political system into the Surinamese government.\n\nWhile the agreement has received the endorsement of Suriname's United Hindustani Party and a minority of its National Party, nationalists in the Estates have decried the laws as a usurpation of Suriname's sovereignty. Furthermore, the inclusion of Dutch constituencies in Suriname's upcoming elections points towards a double standard in the new government uncomfortable to autonomists.\n"
  SUR_news.3.a:0 "Compromise is key."

  SUR_news.4.t:0 "[Get_newspaper_header]Surinamese Anti-Government Protests"
  SUR_news.4.desc:0 "Protests in the Surinamese capital of Paramaribo have halted the city as anger against corruption in the government of Prime Minister Jo Meynen continues to pour into the streets. Demonstrations remained nonviolent, but students and factory workers conducted political demonstrations for Meynen's dismissal in swelling numbers. In response to the protests, Queen Juliana dismissed Meynen pending new elections in June.\n\nWhile the ordeal is unlikely to produce an investigation, the Prime Minister's dismissal has been hailed by the National Party as a victory for Surinamese democracy. The upcoming elections are already hard-fought, with campaign debates over independence and the royal prerogative polarizing voters.\n"
  SUR_news.4.a:0 "Trouble in the exile kingdom."

  SUR_news.5.t:0 "[Get_newspaper_header]Surinamese Constitutional Crisis"
  SUR_news.5.desc:0 "A political confrontation between Queen Juliana and the government of Surinamese Prime Minister Johan Kraag has led to Kraag's dismissal pending new elections. The dispute originated over the 1969 budget proposed by Kraag and his National Party, which ballooned benefits and state investments with a steep deficit. While Kraag has argued that growth and OFN aid would counteract the accrued debt, conservatives nonetheless have secured his dismissal.\n\nKraag's removal has since caused an uproar in the Estates of Suriname, and members of the National Party are increasingly campaigning on pro-independence platforms. While independence supporters lack a majority in the Estates, issues of the royal prerogative have polarized the upcoming election.\n"
  SUR_news.5.a:0 "Can't they keep a promise?"

  SUR_news.6.t:0 "[Get_newspaper_header]Dutch Army Occupies Paramaribo"
  SUR_news.6.desc:0 "The Dutch Army has swiftly occupied Paramaibo, Suriname's capital city, and declared plans for an independence referendum to be nullified and the Estates of Suriname dissolved. This follows the increasingly rebellious sentiment growing in Suriname leading up to the referendum, which the Dutch Army has since deemed "dangerous."  Officers of the Royal Netherlands Army began a rapid crackdown on pro-independence figures and organizations, forcing the Paramaibo government to resign in acquiescence to a new military junta.\n\nThe military government has reiterated that "the Kingdom of the Netherlands" would return to democracy, though the junta has yet to provide a timeline. For now, autonomy and democracy in Suriname are suppressed by force, and the dreams of independence will rot away in Suriname's most fervent idealists.\n"
  SUR_news.6.a:0 "A return to imperialism."

  SUR_news.7.t:0 "[Get_newspaper_header]Suriname Votes for Independence"
  SUR_news.7.desc:0 "Hours after polling stations closed across Suriname, voting returns confirmed a majority of Surinamese had voted in favor of independence. Dutch polling experts and international observers had long estimated Suriname would remain in the Dutch realm. Still, recent anti-government demonstrations and rallying support for nationalist parties pushed voters toward independence.\n\nProminent native leaders have praised the results as an expression of democracy, while the Dutch government in exile has begun its departure for Aruba. Surinamese independence has reduced the Dutch crownland to the Netherlands Antilles, now the only remaining territory in a once world-spanning Kingdom.\n"
  SUR_news.7.a:0 "The end of the Netherlands?"

  SUR_news.8.t:0 "[Get_newspaper_header]Suriname Remains Dutch"
  SUR_news.8.desc:0 "Hours after polling stations closed across Suriname, voting returns confirmed a majority of Surinamese had voted against independence. This was not surprising to the Dutch government, who had long expected the vote to fail, but still, Queen Juliana issued a note of reconciliation to the independence camp. In Paramaribo was a mood of relief, disappointment, and scattered bursts of anger, but life moved on.\n\nWhile Surinamese nationalist parties vowed to continue lobbying for independence, representatives of the United Hindustani Party supported the results as a basis for further national autonomy. Animosities over past wrongs remain in recent memory for many Surinamese, fueling the continued independence movement. For now, however, the nation has chosen to stay with the Kingdom.\n"
  SUR_news.8.a:0 "Maybe reconciliation is possible."

  SUR_news.9.t: "[Get_newspaper_header]1969 Curaçao Uprising"
  SUR_news.9.desc: "With the Dutch government-in-exile facing riots in Suriname, the island of Curaçao has joined in. With the island's economy receding and the native inhabitants feeling underrepresented, the island has been looted by locals. Black nationalists, socialists, and reformists have been leading the charge against the government, all hoping for their own solution to the conflict to come true.\n\nThe United States government has reportedly been pressuring the Dutch to take quicker action against the riots, lest the country fall apart. In addition to the US getting involved, regional socialists have provided aid to the local insurgents.\n\n"
  SUR_news.9.a: "And they had Indonesia for how long?"


  #Leaders descs
  AAT_VAN_RHIJN_POLITICS_DESC:0 "Dr. Arie Adriaan "Aat" van Rhijn, a civil servant and politician, was born in Groningen in 1892; he studied at the universities of Utrecht and Groningen and served in various functions - for company associations, employee associations, five or six different ministries, and so on - until his appointment to Minister of Agriculture and Fisheries mere days before the German invasion.\n\nFleeing to London, and then from there to Ottawa and Paramaribo, van Rhijn watched as the Kingdom of Netherlands fell to a low from which it has only slightly recovered since, as the Nazi jackboot gouged into the Netherlands and the Yamato 'anti-colonialists' 'liberated' the Dutch East Indies. Van Rhijn was able to come through the last twenty years more or less sane, but others - such as Prime Ministers Dirk Jan de Geer and Pieter Sjoerds Gerbrandy, to say nothing of Queen Wilhelmina - were less well off; van Rhijn had to watch in sadness as so many people he knew and respected declined into misery, sickness, and decrepitude.\n\nGerbrandy, exhausted beyond belief, stepped down in the mid 1950s, choosing van Rhijn to take over; the far-flung people of Suriname have come to consider him a good fit for the job. A competent statesman, administrator, operating as a moderate Protestant conservative with significant respect for non-Protestants and the labor movement, Aat van Rhijn strives to stay the course, reforming only with common consent, for fear of upsetting the modus vivendi created in this country of exiles, immigrants, and colonists."
  POLITICS_SUR_GERARD_HELDERS_DESC: "Gerardus Philippus Helders is among the discarded relics of Dutch imperialism that have washed upon Suriname's shores. He became a lawyer after a promise of a job from his uncle, but his original interest in economics never diminished, and his dual interests would lead to his appointment as a finance inspector in the Dutch East Indies. Helders would spend a decade administering in Batavia and Bandung until the Japanese invasion of the colonies, where his brief commandership was ended with capture. His release at the end of the war was not a triumph, for there was no home to return to in Rotterdam or Batavia, but the kingdom had not truly fallen, and in the Americas he found refuge serving the crown yet again in exile.\n\nHelder's ascension as prime minister will not herald a great change unto the crestfallen kingdom. The power of the exiled Dutch parliament will be exercised in full to ensure its survival. The local Estates are to be kept subordinate and compliant, nothing more than advisors in running the country, and far away from the civilized neighborhoods of Paramaribo.\n\nThe Prime Minister wining and dining in his castle will never receive the Surinamese he lords over, only ever having surrogates deliver pompous orders to remind them to bend the knee and kiss the ring. Helders considers the preservation of the monarchy as his finest work, and by his will, they will reign eternal."
  POLITICS_SUR_IVO_SAMKALDEN_DESC: "Ivo Samkalden is among the relics of Dutch imperialism that have washed upon Suriname's shores. He started his university studies in economics and Indology before gaining his doctorate in law. These studies would propel Samkalden into the colonial administration, where he advised as an economic and legal advisor in Surabaya. His tenure in the Dutch East Indies would only last a few years, as the rapid onslaught of the Japanese would lead to his interment until the end of the year. Samkalden would be left adrift after his release; unable to safely return to the Netherlands, he had no choice but to join his queen's exile in the Americas.\n\nSamkalden's ascension as prime minister has ushered in rapid change that has the Surinamese optimistic and his detractors decrying his radicalism. His first act vacated the Dutch parliament entirely and delegated its powers to the Estates. This bold action has made Samkalden both prime minister of Suriname and the Netherlands, a position that has promoted the power of local politicians long disgraced by the crown.\n\nThis grand reform is an experiment, however, built on a concession that allows the queen to revoke the authority of the Estates and form her own government at will. Samkalden now finds himself navigating dangerous waters as he pushes vital reforms within the kingdom whilst balancing the interests of the monarchists whose resentful eyes wish to see his administration curtailed. He will not allow himself or the kingdom to remain relics; it must adapt to survive."
  POLITICS_SUR_FRANS_VAN_VEEN_DESC:0 "Frans van der Veen was a man respected by all in the Dutch realm. Serving as a lieutenant during the Second World War, van der Veen escaped to Australia after the fall of the Dutch holdings in Europe and Asia. There he stayed until the war's end. Upon his return to the last Dutch lands in America, he was hailed as a hero, and quickly advanced through the ranks.\n\nAfter his return, he served the OFN in a number of operations, from the wastes of Siberia to the deserts of Africa. Now he stands as the savior of the Netherlands, at least in his eyes, doing the dirty work for his country to help it return to Amsterdam one day. If the exiles are to return, he will be a hero, on par with the Oranje that first freed the nation. If they fail, he will be a sad desperate man, desperate for a status quo long gone.\n\n"
  POLITICS_SUR_HERMAN_VAN_ROIJEN_DESC:0 "Born to a prestigious diplomat, Herman van Roijen was poised to have a successful career in the foreign service. He had an advantage against the hundreds if not thousands of others who had dreams for the throne of the foreign ministry. With much of Europe falling to Germany, many of Herman's competitors were gone, taken by the Germans, another step up. After years of work, he has now exceeded his dreams, the new Prime Minister for his country.\n\nIf only it were that good. Van Roijen is a conduit for the queen and her advisors and he will be for years. He will do their dirty work, oppress the people, and do a competent job. By the Surinamese, he will be remembered as a henchman, who oppressed for a far greater evil. By the Dutch, he won't be remembered as anything.\n\n"
  POLITICS_SUR_ISAAC_AREND_DIEPENHORST_DESC:0 "Once a learned man, with degrees in theology and law, and a promising member of the Anti-Revolutionary Party, Isaäc Arend Diepenhorst has fallen far from his dreams. He now governs the new home of the once lavish Dutch realm, the Antilles. Islands ruled by the Dutch elites and oligarchs, far from their old home. This is Diepenhorst's job: to keep the island alive until one day, the queen and her exiles may return to their home long gone.\n\n"
  
  POLITICS_SUR_ADOLF_PENGEL_DESC:0 "For as long as the Dutch have ruled over Suriname, they have ruled as a minority, for it was not white settlers that built the colony, but slaves and migrants from across the Dutch empire. The Dutch elite expected that some reforms and representation would sate the locals long robbed of democratic freedom, so it must've been quite a shock to them that their electoral dominance was toppled in the first free election.\n\nSuriname's first native prime minister is a man of humble origins. Johan Adolf Pengel was the fourth child of a teacher in the Para district. Despite dropping out of law school, Pengel would still gain a job in Suriname's court system and was an active member of his community. In response to a local landlord drastically raising rents, he rallied the neighborhood to protest the landlord and then raised money to buy the land outright for his community. In 1949, Pengel was elected to the Estates and founded the Surinamese Worker's Federation to organize the Surinamese against the colonial elites. Challenging the Dutch crown would propel his career even further and, with help from Samkelden's reforms, push him into the role of prime minister.\n\nPengel now rules with a popular mandate but intense scrutiny from the Dutch crown. Having allied his National Party of Suriname with Lachmon's United Hindustani Party, he has the full support of his Surinamese brethren. The Dutch exiles, however, scoff at having a colonial as their ruler, especially one who isn't white. The conservatives within the Dutch establishment wish Pengel gone, and so he must contend with defending his hard-fought seat from the royalist sharks circling the waters, lest he becomes Suriname's last and only native prime minister. The challenge doesn't dissuade Pengel, however, because the rewards of equality, liberty, and perhaps even independence are well worth the risks."
  POLITICS_SUR_JUST_RENS_DESC:0 "One culmination of the longstanding colonial role over Suriname has been the multicultural society that's bloomed underneath the Dutch boot. Indonesian and Indian contract workers live alongside the Afro-Surinamese descended from slaves forcefully ferried over the Atlantic. There is irony that the crown would solve their crisis of minoritarian rule by looking past representatives of the vast majority of their subjects and instead find their hero in the local Dutch population.\n\nJust Rens was born to the colony's white minority in 1916, from which he'd rise to prominence in Suriname's business community. He would spend eight years serving the government in the Surinamese Post Savings Bank before pivoting into the private sector. Rens would found a successful laundry company and, with a successful American business partnership, bring a 7Up bottling plant to Suriname. His successful pursuits in cultivating local manufacturing paved his entry into politics as a member of the Estates. However, the Dutch government's exile radically altered the trajectory of his career, which has put him at a critical juncture.\n\nRens' selection by the crown to ascend as Suriname's prime minister following the chaos of the 1969 riots has given him unprecedented power. The Estates and the independence movement have amassed behind him as a tidal wave of popular will to be aimed at the Dutch parliament. The exiles must acquiesce to Rens' demands lest they risk losing more of their power over the colony, but Rens' moderate political stances make him at least tolerable. Suriname is entering unknown territory, and whether Rens is the right man to steer the ship is yet to be seen."
  POLITICS_SUR_GAIUS_GAAY_FORTMAN_DESC:0 "Even as Paramaribo's streets burned with the fury of independence following the Meynen Affair, the Dutch knew that patience would work out in their favor. As long as the police continuously repulsed the angry mobs, success was guaranteed. The Surinamese fearful for the welfare of their neighborhoods would come to bargain, choosing safety over independence. The prodigy chosen to lead the alliance born of desperation was Gaius de Gaay Fortman.\n\nFortman, born into a family of Dutch patricians, earned a doctorate in law before bouncing between various government roles. Having served in the ministries of Agriculture, Social Affairs, and Economics, Fortman became a highly versatile lawyer among the Netherlands' most preeminent legal scholars. Fortman would continue his work, helping the Dutch exiles reestablish education and social services within Suriname and the Antilles. In 1947, he would become a law professor at UC Berkeley before becoming the law chair of the newly established University of the Dutch Caribbean in 1956. The royalists, having been imperiled by the riots, needed Fortman's legal mastermind to preserve their power and investments, and so Fortman accepted a new role as Dutch prime minister.\n\nFortman and his coalition of Christian Democratic parties promised moderate reform and gained collaboration from Jagernath Lachmon's United Hindustani Party. Lachmon's fear of how rapid independence could harm his people made it easy to sway him away from Pengel's revolutionaries. The Meynen Affair revealed deep, unsustainable institutional rot within the Dutch micro-empire. Fortman would see it all purged and the Dutch system of government renovated to accommodate democratic collaboration. It will perhaps be his magnum opus, a colonial government that embraces men like Lachmon with a degree of equitable treatment whilst retaining Dutch dominance evermore. Even in exile, the Netherlands and Her Majesty will live on."
  POLITICS_SUR_JAGERNATH_LACHMON_DESC:0 "As the waves of change crashed upon tropical shores, Suriname was left with a choice to either fully embrace the tides or to reinforce the bulwarks against the floodwaters. Ultimately, it was cautious voices that prevailed in the elections following the successful general strikes, and failure to materialize a full native coalition has brought continued compromise with the Dutch SDAP. Leading the uneasy coalition towards the independence referendum is a cordial man named Jagernath Lachmon.\n\nLachmon himself was born the youngest to a family of contract workers and farmers. His teachers advised him to pursue law, and due to colonial restrictions, this could only be done via a mentor. Lachmon would find his salvation in Julius Caesar de Miranda, a Creole lawyer with major political sway in the colony. Astonished that Miranda would teach someone across racial lines, the great impression upon Lachmon pushed him to prioritize ethnic harmony and reconciling the many peoples of Suriname. Even as the Dutch exiles fled to Suriname and the Caribbean, Lachmon would go on to found the United Hindustani Party, the largest Hindu party within Suriname, and allied himself with Pengel's National Party of Suriname for greater rights and privileges from the royalist regime.\n\nNow the captain of Suriname's ship, Lachmon seeks to steer the colony into safer harbors. He fears that independence will not be a shining day overlooking an azure sea but a riptide that will drown the colony in racial conflict like their Guyanese neighbors. There is far too much of the country left to build in Lachmon's mind for him to readily cast off their overlords, especially when his constituents beg for the Dutch to diversify their investments to aid the destitute Indian middle class. A perturbing question lingers in his deepest of thoughts: will an independent Suriname be stronger?"
  POLITICS_SUR_JO_MEYEN_DESC:0 "Johannes Meynen can be characterized by both his business acumen and his unwavering loyalty to the Dutch crown. Born to a preacher, Meynen trained as a reserve officer for the Dutch army before becoming deputy secretary of Arnhem's chamber of commerce. He would rapidly ascend in stature from there, becoming the head of sales for Hercules Powder Company's European office, a position that would initiate his ties with American industrial magnates. He survived the German occupation unscathed managing lamp factories, but the exile of his government and his queen compelled him to leave home behind. Meynen was appointed as Minister of War shortly after arriving and, with his American ties, rapidly reconstituted it into fighting form to boost the posture of the Dutch within the newly formed OFN. After stepping out from government, he tapped his old Hercules connection, selling off colonial capital to the chemical giant DuPont and being rewarded with leadership over their new Surinamese branch.\n\nNow in the present following Helders ascension to the Council of State, Jo Meynen was selected as prime minister of a further entrenched exiled elite. Having spearheaded Royal Dutch Shell's contracts with American oil, he seeks greater investment from Uncle Sam to exploit Suriname's untapped soil. Meynen's ace up his sleeve, a friendship with Prince Bernhard and his Bilderberg Meeting, has given him unparalleled leverage in the government. The royal connection is sold with every trade negotiation, every investment agreement, and every backroom dealing to fund the lavish lifestyle of the crown, and some whisper that the corruption runs deeper than funding the queen. Nonetheless, the crown appreciates the prestige, money, and power that Meynen brings to the table and has been handed a blank cheque, along with his growing American benefactors, to exploit the Surinamese to the fullest, the locals be damned."
  

  SUR_forpol.3.t: "The Netherlands in the OFN"
  SUR_forpol.3.desc: "RESTRICTED/[GetDateText]\n\nFROM AGENT CLOVES\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: INSIGHT INTO KINGDOM OF THE NETHERLANDS\n\n1. Prime Minister Helders of the Kingdom of the Netherlands has strengthened the "Herrenvolk Democracy" policy on the Dutch realm since the election in 1963, which continues to be a contentious evergreen issue between the exiles and the natives of Suriname and has led the pro-independence movement to proliferate.\n\n2. Helders, in recent interviews, intends to maintain the Dutch Parliament as the legislative body for the entire Realm; the Surinamese Estates would maintain its advisory role with no legislative power, reducing the influence of independence activists in legal means.\n\n3. The domestic situation in Suriname in terms of living conditions has been a factor in the growing divide. The Dutch exiles are mostly located in a gated community within inner Paramaribo, as the natives have little to no overlap with the exiles. The closed-off approach and refusal to cooperate between the two small communities had caused the Surinamese economy to stagnate.\n\n4. Suriname occupies a large volume of oil reserves within its territory, yet lacks modern infrastructure to develop refineries and generate revenue. Royal Dutch Shell, a splinter company of the former Anglo-Dutch venture group, intends to cooperate with American oil companies to construct island refineries. The cross-company contract can give the Surinamese economy a lifeline, but also legitimize their policy of segregation."
  SUR_forpol.3.a: "Allow the deal."
  SUR_forpol.3.b: "Tell our people to cut no deals."


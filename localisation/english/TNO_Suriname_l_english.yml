  # Ideas
  SUR_1947_Constitution:0 "The 1947 Dutch Constitution"
  SUR_1947_Constitution_desc:0 "The 1947 Constitution of the Kingdom of the Netherlands, established as the prospect of liberating the homeland from the Reich retreated into a mere delusive longing, established the different realms of the Kingdom-in-exile. As a result of the makeup of the government, the formation of this constitution ended up strongly favouring the extraterritorial Dutch government-in-exile. Thanks to this constitution, the Dutch exiles lord it over the remainder of their realm. Although it infuriates any such exile who hears it, this system is best compared to the so-called "Herrenvolk democracy" practiced in the modern, Germany-loving state of South Africa."

  SUR_Runt_OFN:0 "Runt of the OFN"
  SUR_Runt_OFN_desc:0 "The Kingdom of the Netherlands is widely mocked as being one in name only. To the average observer, even one within the Organization of Free Nations, this exiled government is the "runt of the OFN", a "joke country". It is roundly mocked, especially in the capitals of Europe and Asia, as a "tinpot country", an illegitimate colonial exile government and the most pathetic of America's puppets.\n\nThe Dutch exiles that make up the Kingdom's government can at least profit mightily from these constant blows to their ego. The United States leverages the Organization of Free Nations to reward their dependence."

  SUR_Countries_Within_a_Country:0 "Countries within a Country"
  SUR_Countries_Within_a_Country_desc:0 "As currently constituted, the Dutch realm-in-exile is formulated for the benefit of the white Dutch citizenry that make up virtually all of their government and sociopolitical elite. This favouritism benefits the Dutch minority at the expense of Surinamese and Antillean subjects, even those these two each outnumber the Dutch and form a majority of the population between them.\n\nNeedless to say, this unequal distribution of power has led to significant and growing internal tensions. This is yet another problem that the United States has to confront in exchange for its controlling stake in the last lands left to the old Netherlands."

  SUR_Fleeting_Dutch_Economic_Hegemony:0 "Fleeting Dutch Economic Hegemony"
  SUR_Fleeting_Dutch_Economic_Hegemony_desc:0 "The old Dutch economy has been dead for two decades now, with the Reich occupying the homeland ruthlessly stripping away all connections the exiles had to their lost country. What few smoldering embers of the once-hegemonic Dutch economy remain operate at a reduced capacity and are entirely focused on small production industries and extraction.\n\nWith the death of the old world, a new world arises to take its place. Larger American companies take advantage of their older Dutch rivals' weakness and spread their economic influence throughout Suriname, going ever farther as the days pass by."

  SUR_Countries_Within_a_Country_Reformed:0 "Countries within a Country"
  SUR_Countries_Within_a_Country_Reformed_desc:0 "Historically, the Dutch realm-in-exile was established for the benefit of its white Dutch citizens that dominated its institutions. Yet this state of affairs has been steadily eroded in favor of reforms designed to raise up the Surinamese and Antillean natives. Government reforms that devolve power to both islands at the local level with pushes for federalization coming shortly afterward by the new administration. While a gap still remains between the Dutch and the native-born population, these efforts are slowly closing it behind them. As reforms mount, a new reality is slowly coming into being on the ground."

  SUR_1972_Dutch_Constitution:0 "1972 Dutch Constitution"
  SUR_1972_Dutch_Constitution_desc:0 "The 1972 Constitution of the Kingdom of the Netherlands, established after a successful Suriname independence referendum was nullified by the intervention of the Royal Dutch Army, undid many of the reforms of the 25-year old document that preceded it. Those reforms were supplanted by the installation of a highly-centralised, dictatorial government.\n\nUnder this new constitution, the Dutch exiles lord their authority over the remainder of their realm even more than they did before 1972. In this new exiled Kingdom, the specter of 19th-century European colonial rule in Latin America has roared back to life."

  SUR_1972_Surinamese_Constitution:0 "1972 Surinamese Constitution"
  SUR_1972_Surinamese_Constitution_desc:0 "The new 1972 Surinamese Constitution, established after a successful independence referendum, has transformed the island into a new republic While Dutch political control may be gone, the people have maintained the Dutch parliamentary model. Influenced by the most prominent free nations in the region, the parliamentary model was crowned with an executive presidency on American and Mexican lines.\n\nThanks to this constitution, the Surinamese people are at last masters in their own home. A new dawn bathes Paramaribo in its light as the Surinamese people celebrate their first taste of freedom in a very long time."

  SUR_One_Paramaribo:0 "One Paramaribo, Many Peoples"
  SUR_One_Paramaribo_desc:0 "The Surinamese are a single national identity, but this national identity contains multitudes: Hindustanis, Afro-Surinamese, Javanese, indigenous peoples, and even a few Dutch holdovers. These peoples are bound together by common languages; Dutch dominates in the public sphere and Sranan Tongo is spoken on the streets (though the government, still influenced by colonial attitudes, is ashamed to admit of its existence).\n\nTensions between individual groups ebb and flow, but the lack of a clear-cut ethnic majority of any kind forces the people to cooperate, even begrudgingly. They find themselves well-represented by the governing parties of the Surinamese nation."

  SUR_Consolidated_Dutch_Economic_Hegemony:0 "Consolidated Dutch Economic Hegemony"
  SUR_Consolidated_Dutch_Economic_Hegemony_desc:0 "The old Dutch economy has been dead for two decades now, with the Reich occupying the homeland ruthlessly stripping away all connections the exiles had to their lost country. The remaining ashes of that former juggernaut, however, have recently been kindled to a semblance of their old selves.\n\nThough the old world is dead, Dutch economic hegemony persists in the new world that arises to take its place. Much of the old economy has been transformed into an overwhelming corporatocracy owning much of the economy of Suriname and the Antilles. Oligarchic capitalism on Dutch terms is becoming entrenched as American firms are forced to either coordinate with local companies or be boxed out."

  SUR_Decolonizing_Economy:0 "Decolonizing Economy"
  SUR_Decolonizing_Economy_desc:0 "The collapse of the old way is followed by the ascent of a new way of doing things. The Dutch political system is gone, and with it, the Dutch economic model has followed as well. Paramaribo's economy was once predicated on extraction to prop up the quality of life of the exiles in the Antilles. With a new government in Paramaribo, however, this colonial siphon has been replaced with an eclectic mix of foreign companies, state firms, and local entrepreneurs all hoping to secure their fortunes in this newly independent country. In this chaos, opportunity awaits for those bold enough to seize it."

  #SUR_Runt_OFN_desc:0 "Being one of the last standing members of the old Allied Powers, the exile-government of the Kingdom of the Netherlands in Suriname is a member of the Organization of Free Nations. However, because of the obvious difficulties presented by being a government exiled to a rump portion of its former colonial empire, it is heavily reliant on extensive loans and other assistance to keep itself afloat.\n\nAs a result of the flow of aid to Suriname, the country has become known as the poster-boy of the OFN, a democracy kept alive and made to flourish by the extensive assistance of its free, democratic allies. While this has led to a strong economic situation, that strength is in fact fragile, as the country is quite strongly dependent on OFN assistance."

  SUR_surinamese_independence: "Surinamese Independence"
  SUR_surinamese_independence_desc: "In the days before Suriname became independent—or perhaps that should be "independent"—the present economic privations were regarded as commendable, and a sign of the Organization of Free Nations' benevolence to the country. To the Republic of Suriname in the present day, however, they are nothing if not a burden.\n\nThe Dutch are nominally 'gone', but private Dutch funds still control much of Suriname's fledgling economy. While investment plans from regional powers of Latin America promise to challenge the status quo in due time, the fact remains that the road to true independence has only begun."

  CUR_Exiles_in_the_Antilles: "Exiles in the Antilles"
  CUR_Exiles_in_the_Antilles_desc: "It would be good to believe that this banishment is only temporary, that good will triumph over evil and a day will come when the exiles leave this foreign shore. One can almost imagine that day, in some far-off future, where men and women stand crowded on the deck of some great ship, wiping tears from their eyes, as they return home. They gaze upon the beaches, the dykes, the dunes. They arrive to a pristine Amsterdam, restored to its ancient glory, and are given flowers and laurels to welcome them back to a nation reborn.\n\nBut this dream is a lie. It is a delusion. There will be no restoration of the Netherlands. There will be no return from exile. There will be no smiling faces or brotherly embraces or happy tears. On the arid beaches of Aruba, there is only rot and desolation for a kingdom that once ruled the waves and controlled global trade.\n\nSo the Queen and her court will continue to huddle in their brightly colored palace, clinging to their selfish fantasies as the world passes them by. They will issue edicts heard by no one, as rescued Rembrandts crack in their frames and Vilsco fabrics bleach beneath the cruel sun. And they will shut out the growing anger and frustration from those they have displaced in Aruba. They will ignore those who curse their names and pretensions of noble sacrifice until it is too late and the dream that was the Kingdom of the Netherlands finally vanishes for good."

  CUR_Dependent_Economy:0 "Dependent Economy"
  CUR_Dependent_Economy_desc:0 "The Kingdom of the Netherlands is one in name only. It is roundly mocked, especially in the capitals of Europe and Asia, as a "paper country", the most pathetic of America's puppets. With the secession of Suriname, this impression has been confirmed, and is now reflected in its economy.\n\nWith Paramaribo now striking its own path, the island remnants of the Dutch realm are completely dependent on American support. What few industries existed in the Caribbean islands that make up the alleged Kingdom are propped up by American subsidies. The Americans are also relied upon to ensure free access to the Old-World-esque luxuries that still pursued by the Dutch exiles, who have nothing else to cling to these days."

  SUR_1971_Constitution: "1971 Constitution"
  SUR_1971_Constitution_desc: "Amsterdam was lost, and the rolling fields of Holland would never again grace the exiles' eyes. But they were once able to comfort themselves with the fact that they were at least still free and democratic as their fathers had been since the defeat of the Spanish rule.\n\nNo more. The new coup-installed military government, claiming to be "preserving hope and strength for the Dutch people," wrote a constitution that has essentially cracked down on five hundred years of democratic tradition. Previously democratic institutions have been restricted in a manner that might give a Somoza or a Morínigo pause. Colonial autonomy and the rights of citizens of the colonies have been destroyed.\n\nThe military men may convince themselves—or more accurately try and fail to do so—that by engaging in what is legitimately being called sacrilege they have saved what is left of the Kingdom of the Netherlands. But in reality these jackboots have created a hollowness and conflict in the last of the free Hollanders, a wound that will not be healed even if somehow the Netherlands are freed, and the Royal Standard flies from Paleis Amsterdam once more."

  # Events

  SUR.skeleton.6.t: "March of Suriname" # For america about the upcoming referendum
  SUR.skeleton.6.desc: "On the third pass over the royal compound in Dutch Aruba, the pilot of Girard Dawson's unmarked helicopter concluded the palace had no space suitable for landing such a large aircraft. Dawson, the FBI's bureau chief in Paramaribo, asked what the alternative would be if they couldn't land. "We return to Oranjestad," offered the pilot, "or you take a dip." Without hesitation, Dawson began strapping himself into a life jacket and pointed the pilot towards a yacht berthing.\n\nOnce the helicopter was low enough, Dawson hopped into rotor-whipped waters and began swimming to shore amid the torrents. Once he waded onto solid ground, the soaked FBI agent caught sight of his contacts, Prince Bernhard and a cohort of Royal Army generals, running towards him. One car ride and a warm shower later, Dawson was with the group sipping port wine on a nearby veranda when General Frans van der Veen broached an ugly request. "As you know, the Estates of Suriname has recently voted for a Surinamese independence referendum," said the General through his cigarette-pursed lips, "and we want to stop it." Snickers and glass clinking filled the air.\n\nThese old kingpins of Dutch reaction held Surinamese autonomy in contempt and sought American support in "securing" the Kingdom's future. The Estates of Suriname was de facto the legal parliament of the Netherlands, and thus American involvement in overthrowing an OFN member government would violate the OFN's charter. Conversely, an independent Suriname would certainly exist outside the OFN. Dawson mulled the request and its implications."
  SUR.skeleton.6.a: ""I'll pass your request along.""

  SUR_skeleton.9.t: "Independence Referendum"
  SUR_skeleton.9.desc: "-CONFIDENTIAL-\n\nFROM THE SURINAME OFFICE OF THE FBI\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: INDEPENDENCE REFERENDUM IN SURINAME\n\nThe exiled Kingdom of the Netherlands (UKN) has long existed in a constitutional limbo. While the UKN has been reorganized in exile, the paradox of the "Free Netherlands" maintaining a vicarious existence through its colonies has led to much friction.\n\nThe Estates of Suriname, in particular, have long been at odds with the UKN government. Paramaribo's cooperation is critical to the continued functioning of the Dutch realm, yet the Dutch monarchy has long disliked having to work so closely with Paramaribo, with the aims of the exiles often differing from the locals'.\n\nThese tensions were recently inflamed due to scandals concerning the exile elite, reaching as high as Prince Bernhard, Queen Juliana's husband (details on p. 3). These scandals, as well as the crown's increasing involvement in legislation and governance, have led the Estates to decide on a radical course of action.\n\nA week ago, Paramaribo declared it will hold a referendum for Surinamese independence. Polls (see appendix A) indicate that this referendum is likely to succeed, effectively destroying the UKN. While Queen Juliana has officially given her blessing, TULIP indicates that she is privately extremely anxious and might be won over to obstruct the process. This referendum's success would be highly detrimental to American interests in the region, and the Queen's cooperation, as well as more direct methods of influence, are recommended in ensuring that it fails."
  SUR_skeleton.9.a: "Keeping the torch of freedom lit, one campaign at a time."

  SUR_forpol.0.t: "Dutch Elections of 1963"
  SUR_forpol.0.desc: "STATE DEPARTMENT POLICY MEMO \nFrom: John S. Rice To: President [GetPresidentLastName]\nSubject: American Posture towards Dutch Elections\n\nElections for a new Dutch parliament are set to happen without disruption. State Department efforts to support self-determination have been met with mixed results. The Dutch establishment around Queen Juliana wishes to restore some democratic functionality and liberties, but they also wish to secure greater control over the politics of Suriname's local Estates. Disagreement on how to achieve this goal has resulted in two distinct, opposing forces.\n\nThe conservative royalists, led by Gerard Helders, seek to maintain the status quo and manage Suriname as they did before exile as a colonial subject. Opposite of him, led by Ivo Samkalden, is a coalition of reformers that seek to secure Surinamese loyalty through political integration. Both leaders are courting the Queen's approval to sway the election.\n\nThe electoral results will likely affect our standings within the Caribbean. Agents have increased pressure on the Queen to support integration of her colonial subjects, as continued royal rule will undermine and delegitimize our efforts to cultivate democracy in the region. Diplomatic efforts will be redoubled to ensure a stable transition of power. "
  SUR_forpol.0.a: "Dutch meddling in the tropics? Nothing new." 
 
  SUR_forpol.1.t: "Paramaribo Rumblings"
  SUR_forpol.1.desc: "The people of Suriname woke up to anti-government protests in Paramaribo today. The demonstrations were sparked by budgetary cuts to the colony's domestic services to make up for increased monarchical expenditures. The most egregious of Queen Juliana's lavish spending was on a faith healer named Greet Hofmans who had secretly gained massive influence within her court and caused major division in the royal family. The Dutch government responded to the protestors with overwhelming police force, immediately dispelling the Surinamese from the streets. The extreme heavy-handedness of the Royal Dutch Police has provoked greater outrage, leading to the formation of new pro-independence groups.\n\nThe FBI has reported that the independence movement remains nascent, both few in number and weak in support, but warn that the situation is likely to escalate with time. Without a substantial shift in Dutch policy, the continued exploitation of the Surinamese will stoke greater resentment towards Dutch rule. Future royal scandals may provoke instability from a solidified independence movement which will threaten our reputation abroad as well as business interests in the region. FBI agents are currently assisting with suppressing activist leaders to maintain the peace and will continue to monitor future situations as they develop."
  SUR_forpol.1.a: "The Queen was seeing a Quack?!"


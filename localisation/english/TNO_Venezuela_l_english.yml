### Have fun trying to understand whats going on here
### The general in his labyrinth

### USA Events

USA_VEN.1.t: "Friends Across the Gulf"
USA_VEN.1.desc: ""Though he did his best to maintain an upstanding composure, Charles Allan was still getting used to his new functions. Long gone were the nonchalant journalistic days when the only concern he had to meddle with was the next day's print. From a lowly counselor to Venezuela's diplomatic mission, he had just overtaken the role of Ambassador after the untimely end of his predecessor's tenure.\n\nAnd there he was, sitting in front of a Foreign Minister, sweating like a pig as he displayed his best unprepared charm. God. Was it the stress, or Caracas' unbearable tropical humidity? The heat was far from unsettling compared to what he had to contend with back in Arizona, but the wet, heavy climate was a definite contrast from the dry air.\n\nHe must have been quite a sight to behold, he thought, trying to reassure himself; a poor consolation at the idea that he might have just failed his first proper assignment since reaching his new position. What was he thinking? Minutes ago, he had just tried to convince Minister Burelli to support a clandestinely funded military operation to overthrow a Caribbean dictator barely half a thousand miles from their coast. Sure, Trujillo was at least twice the threat to the Venezuelan government as he was to American interests, but even he had qualms about this whole "Caribbean Legion" shenanigan.\n\nPerhaps he should have tried to strike more smoothly. Crack a few jokes here and there. Do anything to disarm this awkward silence as the Minister went ruminating in his mind, tapping his pen against the counter of his desk. Now, all he could do was wait with a dumb smile as the man facing him pondered an answer. Hiding the concern weighing on his shoulders at least as much as the damp air. And his surprise when Burelli stood up, his face locked in a grin of eager complicity.\n\n"Mr. Stewart," he began, his palm reaching for a handshake..."
USA_VEN.1.a: ""...I had already made up my mind before you even started speaking.""

USA_VEN.2.t: "A Waning Grip"
USA_VEN.2.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM FBI DIRECTOR J.EDGAR HOOVER\nMEMORANDUM FOR THE U.S DEPARTMENT OF STATE\n\nSUBJECT: FALLING ECONOMIC TIES WITH VENEZUELAN REPUBLIC\n\n1. Recent reports of closed-door negotiations between the Venezuelan government and officials from the Mexican state oil corporation further confirm our worries about growing economic interdependence between the state and the Veracruz sphere.\n\n2. This budding new relationship comes at the expense of our own mercantile bonds to the country, and it is now within reasonable belief that Mexico has unfortunately overtaken our position as Venezuela's primary trading partner.\n\n3. While forfeiting what is a relatively minor strategic ally in the region remains a nonetheless undesirable outcome, it is of additional concern that we consider the expected loss in standing it will represent on our future influence for petroleum investments.\n\n4. Despite any official statement having yet to be announced by the Venezuelan administration, we remain vigilant in monitoring the situation for any overtly threatening move from Pemex against our own industrial interests."
USA_VEN.2.a: "Fidelity, Bravery, Integrity"

USA_VEN.3.t: "The Politics of Risk"
USA_VEN.3.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM THE VENEZUELA OFFICE OF THE FBI\nMEMORANDUM FOR THE PRESIDENT\nSUBJECT: IMPENDING VENEZUELAN ELECTIONS\n\nFollowing the ousting of the dictator Marcos Pérez Jiménez, Venezuela is currently under the rule of Wolfgang Larrazábal. Previously responsible for helping restore democratic rule, Larrazábal is nearing the end of his term in office. Our intelligence indicates three parties in prime place to take the Presidency soon.\n\nThe Democratic Republican Union, the incumbent party, is seen by many local commentators as the favourite to win thanks to Larrazábal's successes in office. The party is generally in favor of liberal values and considered compatible with the OFN. However, there is also a significant socialist contingent within the group, anathematic to the military.\n\nThe other most noteworthy party is Democratic Action, a favourite of many after their slim defeat in the last election. They are a Gaitanist party in favor of greater cooperation with us to counter the spread of fascism and secure democratic rule. This has attracted the ire of Venezuela's military, many of whom are still sympathetic to Pérez Jiménez.\n\nLast and likely least of our concerns is the Independent Electoral Political Organization Committee. A moderate and centrist faction, the party is often seen by local pundits as a distinct contrast to the more left-wing inclinations of the other parties. Led by Rafael Caldera, his diplomatic cool-headedness is likely to aid in delicate matters, such as the Essequibo.\n\nOur office advises that only one of these parties is backed out of budgetary concerns, and to avoid overly frustrating our Venezuelan partners, but the choice rests with you."
USA_VEN.3.a: "The invisible hand of freedom prepares an intervention."
USA_VEN.3.tt: "§YNew intelligence missions have been unlocked to influence the upcoming Venezuelan elections.§!"

USA_VEN.4.t: "Venezuelan Government Endangered"
USA_VEN.4.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM STEVE W. HARTFORD\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: MILITARY BUILDUP ALONG COLOMBIA-VENEZUELA BORDER, IBERIAN TIES\n\nA significant military build-up has been detected in the Colombian cities of Bucamaranga, Cúcuta, and Villa Rosario, all surrounding San Cristóbal, Venezuela. Naval observation of Iberian-flagged cargo vessels corroborates in-the-field operatives' reports from the CRU that Franco is backing rogue elements in the Venezuelan military with the aim of toppling Venezuela's government.\n\nBoth Caracas and Bogotá are unaware of the activity on the border; the putschists have taken advantage of the disruption caused by the civil conflict in Colombia. With continued preparation, they are poised to seize San Cristóbal as a first step toward regime-change.\n\nU.S. assets in the region are insufficient for an intervention. The crisis in Africa depleted operational resources. A joint response led by Brazilian intelligence is ongoing. Continued cooperation with Brazil is recommended and essential as they assist Venezuela against the Dominican-backed coup plot."
USA_VEN.4.a: "A conspiracy against the Land of Grace?"

USA_VEN.5.t: "Trujillo Eyes Venezuela"
USA_VEN.5.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM STEVE W. HARTFORD\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: SIM ACTIVITY AND MILITARY BUILDUP ALONG COLOMBIA-VENEZUELA BORDER\n\nA significant military build-up has been detected in the Colombian cities of Bucamaranga, Cúcuta, and Villa Rosario, all surrounding San Cristóbal, Venezuela. A source embedded within the Dominican Republic's SIM corroborates in-the-field operatives' reports from the CRU that Dominican intelligence is backing rogue elements in the Venezuelan military with the aim of toppling Venezuela's government.\n\nBoth Caracas and Bogotá are unaware of the activity on the border; the putschists have taken advantage of the disruption caused by the civil conflict in Colombia. With continued preparation, they are poised to seize San Cristóbal as a first step toward regime-change.\n\nU.S assets in the region are insufficient for an intervention. The crisis in Africa depleted operational resources. A joint response led by Brazilian intelligence is ongoing. Continued cooperation with Brazil is recommended and essential as they assist Venezuela against the Dominican-backed coup plot."
USA_VEN.5.a: "A conspiracy against the Land of Grace?"

USA_VEN.6.t: "The Receiving End"
USA_VEN.6.desc: "In a quaint little office in Brasília, comfortably nested in clear viewfront of the Praça Portugal, Ambassador Gordon held the phone's tip as far as he could from his left ear, firmly hoping a few inches of air would prove to be adequate shielding from the flow of insults that hadn't stopped pouring for the past five minutes.\n\nIt wasn't a surprise for him: all his previous exchanges with the Secretary of State had oscillated between the mildly unpleasant and the agonizing. Today, it was unfortunately leaning towards the latter.\n\n"Care to explain why your boys failed to prevent a bunch of fusspot brass and fascists from overthrowing a friendly government?" As usual, Gordon deftly repressed any thought of engaging. He remained stoically silent, patiently waiting for the word torrent to subside. And eventually, it did.\n\nOnly when he was absolutely sure that the floodgates had dropped did he even begin to answer, slowly unraveling his own thoughts. Calmly explaining that the coup's success was an unfortunate consequence of its overwhelming support by the Venezuelan military, and not to blame on any incompetence from their Brazilian partners. That their hands had been kept clean by the lack of direct American engagement in the conflict. That their diplomatic ties to Venezuela were not only far from unsalvageable, but relatively untainted by this less-than-preferable outcome.\n\nThough it did nothing to sweeten the tone of the conversation, nor make it more bearable, he could feel his interlocutor slowly relaxing. Solace finally came when the Secretary eventually hung up, not without mumbling something barely intelligible about "having to arrange something with the new bloody fascists in charge". He, however, would just fall back on his chair, trying to wrap his head around what had just happened."
USA_VEN.6.a: "Mostly, he was just glad he would keep his job for yet another day."

USA_VEN.7.t: "Unburnt Rose"
USA_VEN.7.desc: "RESTRICTED/[GetDateText]\n\nFROM THE VENEZUELA OFFICE OF THE FBI\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: GOVERNMENT VICTORY IN VENEZUELA COUP\n\nWith former general Jesús María Castro León having reportedly been incarcerated in the Cuartel San Carlos while awaiting military trial for high treason, the recent uprising in Venezuela has drawn to an end, in major part thanks to considerable intelligence support from our Brazilian allies.\n\nClaiming victory in the locally nicknamed "Easter Coup," Venezuelan President Fabricio Ojeda has now officially taken proper functions in the Palacio de Miraflores. Our intelligence suggests that this outcome is only sure to bolster his already soaring popularity, and even the most ardent voices among right-wing opposition figures have grown silent, as many fear association with the putschists.\n\nWhile this is certainly a preferable result compared to a fascist takeover by Castro León's Iberian-backed military clique, Ojeda's platform remains uncomfortably close to a communist rhetoric that is just as sure to clash with our local interests. A former student activist mirroring his own support base, he has since grown closer to the model of the Cuban Revolution, especially following Fidel Castro's visit to Caracas back in 1959.\n\nDespite these concerns, although enjoying a relatively muted opposition for the time being, it is yet to be seen if Ojeda's term doesn't anger the conservative bloc enough for him to be democratically ousted in the next few years, or even spark another attempt at a military coup, which might just offer us an opportunity should he prove to be a thorn on our side."
USA_VEN.7.a: "Plucking it before the prickles show."

USA_VEN.9.t: "Black Gold, White Gloves"
USA_VEN.9.desc: ""Coffee?"\n\nJames blinked a couple of times, shaking the blur that had started to seep in again on his exhausted eyes. He looked almost surprised at the figure holding the still-fuming white cup, gazing at him with genuine concern. She definitely seemed out of place in the room full of disheveled men whose drained stares were still focused on the ABC news report following the press secretary's address. "Thank you," he finally answered as he grabbed the hot beverage from his secretary. "I need to get in line with the State Department," he added. "Quickly."\n\nThe man on TV spoke of an "unprecedented act of aggression against our local industries," labeling the Venezuelan government's recent oil nationalization policies "not only unacceptable from a fellow democratic nation," but "of dangerous similarity to those that would take practice in full-on communist regimes." Then, he warned in absolute confidence that Ojeda's regime would face the "full consequences of its strike on American assets."\n\nBut facing the other side of the screen was a completely different mood. Right here, in the Standard Oil Company's New Jersey headquarters, the spirit was far from outraged statements, but one of livid silence and empty faces of figures who'd just seen their entire livelihood snatched away from them in a fortnight. Some, like James, had stayed here from dusk onward, drawing figures and figuring out numbers. Not great numbers. Not at all. And even staring at the dark liquid now resting in his hands could not make him forget about them.\n\nSomewhere in a D.C office on 2201 C Street NW, a phone rang to a spokesperson who'd just spent the last couple of days putting out fires. "Our administration is already handling the situation," said the voice on the other end of the line. "We will do our best to address these concerns," it continued..."
USA_VEN.9.a: "...and rest assured that it remains a top priority for us."
USA_VEN.9.b: "...however, I hope you understand that other matters..."
USA_VEN.9.tt:0 "§!If the §Mdemocratic§! opposition becomes stronger than [VEN.GetFlag] §ROjeda§!'s government and the §Ymilitary§!, [USA.GetFlag] §mour interests§! in Venezuela will prevail over [MEX.GetFlag] §KMexico§! and [IBR.GetFlag] §OIbe§!§nria§!.\n§F------------------------------------"

USA_VEN.10.t: "The Wedge in the Wheel"
USA_VEN.10.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM THE VENEZUELA OFFICE OF THE FBI\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: ONGOING ISSUES IN VENEZUELA\n\n1. President Fabricio Ojeda's fiery anti-American rhetoric, blaming U.S influence on Venezuela's industries for its ongoing economic troubles, has continued to fuel the nationalization programs occurring across the nation. His administration's deliberate focus on the petroleum industry is already proving its expected destructive impact on our own oil companies.\n\n2. Unsurprisingly, these aggressive policies have sparked outrage beyond our own borders, especially within the country's conservative opposition. In particular, figures from AD and URD's right-wing bloc have started to draft contingency plans to displace the current government, likely through an impeachment process.\n\n3. Even following the purges enacted after the failure of the Easter Coup, there remains a significant number of dissatisfied elements within the Venezuelan military. Our intelligence points to agreements being struck between rogue officers and the previous groupings: an uneasy alliance that would open the door to military action, failing a removal of Ojeda through democratic means.\n\n4. While the situation gifts us with a striking opportunity to replace the ruling socialist regime with one lying closer to our own interests, further instability might provide grounds for another military coup, which is an outcome to be avoided at all costs. Accordingly, our suggested course of action would be to..."
USA_VEN.10.a: "...provide them with adequate funding, and support impeachment efforts through any means."
USA_VEN.10.b: "...divert more field agents to Venezuela to covertly assist opposition efforts."
USA_VEN.10.c: "...closely monitor the situation, and avoid kicking the nest."

USA_VEN.11.t: "A Nose For Trouble"
USA_VEN.11.desc: "The country club in La Lagunita served all kinds: from people walking the halls of power to those bribing them. Six thousand yards of El Hatillo's primest real estate were attended year-round to entertain the crème of Venezuela's high society, across scenic golf courses and exquisite dining venues not even an hour's drive from Caracas.\n\nBut among the charming country club's exceedingly well-off clientele, many fancied themselves as the slightly more conscious kind. The ones with opinions to voice, sometimes even indulging its disciplined workforce in their banters. For his colleagues, it often meant the opportunity for some spectacular tipping, should they mingle with the right minds. For Luis, it meant a first seat to whatever private bits of gossip their owners would spew when they forgot he stood within earshot.\n\nFrom what he'd gathered pouring their glasses back to full, these ones seemed alarmed about the nation's recent direction. One feared the less-educated masses were falling to dangerous populist promises that threatened to steer them into becoming a second Cuba. Too much change, too fast; sweeping reforms that, while well-intentioned, would strip the country of the sensible democracy they'd worked so hard to bring. Another confidently dismissed these worries, hinting at a couple of military figures he knew were just as eager to displace the overstepping Ojedistans; yet a third seemed reluctant to trust the army not to turn on them as soon as their common foe vanished.\n\nBut what startled him most was the general apathy of his coworkers as he returned to share these precious bits. In fact, many actually seemed to concur with the seditious talks. Most, however, would only express indifference as he went on to describe the arrival of another sharply-dressed man, introduced as some kind of lawyer, or representative, for a well-established oil conglomerate; even when the figure mumbled something about an amicable third party within the U.S diplomatic apparatus, and..."
USA_VEN.11.a: "...requiring every tool at their disposal against the socialist menace."
USA_VEN.11.b: "...being curious regarding these officers sympathetic to their cause."
USA_VEN.11.c: "...the need to maybe keep their talks less overt to prying ears."

USA_VEN.12.t: "War By Other Means"
USA_VEN.12.desc: "It all felt so wrong.\n\n"As Mr Stewart said, you can expect the full backing of the American diplomatic mission-" Ever since moving to Caracas, all Charles Allan had done had been some form or another of cloak-and-dagger scheming.\n\n"...and official recognition from the United States, as well as continued support for the new government-" In the span of barely three years, he'd gone through convincing a minister to support a clandestine invasion, to surviving a military coup, and now...\n\n"...you will receive funding and armament supplies, as long as you can ensure they don't fall into the hands of more radical elements," continued the FBI field agent accompanying him. He used to be a journalist, for god's sake; so why, now, was he sitting in a room full of rogue politicians, helping plan the overthrow of the country he was supposed to serve in as ambassador?\n\n"Rest assured that every officer gathered here is just as committed to democratic principles," retorted the URD official, prompting nods from the interested parties. "You can trust their loyalty and cooperation through the entire operation-"\n\n"I'm sorry, but what about the rest of the army?" The ambassador had sat through the conversation largely silent, which added to his surprise when the words slipped from his mouth. Shit. Suddenly, all eyes were turned on him; even the FBI lad rose an eyebrow at his interruption.\n\nBut then, that gaze moved to the group of conspirators struggling for an answer that still would not come. Both could sense the immediate shift in the room. The growing malaise. They just couldn't promise anything. After a long, uncomfortable moment, he would eventually break the silence by suggesting..."
USA_VEN.12.a: "...to cut anyone they couldn't completely trust from the conspirator circle."
USA_VEN.12.b: "...to send more weapons as insurance against the prospect of a counter-coup."
USA_VEN.12.c: "...to let the Venezuelan officials handle the matter themselves."

USA_VEN.13.t: "Hanging The DJ"
USA_VEN.13.desc: "Pictures from the NBS report showed the streets of Caracas packed with thousands of Ojeda supporters gathered in protest of the coup attempt that had just occurred during the morning.\n\nClashes between left-wing demonstrators and the conspirator remnants had continued throughout the day, and the camera panned to officers and officials affiliated with the coup being escorted to the Libertador district after facing arrest by loyalist police and military units.\n\nAs the scenes continued to flash across the screen, it all seemed almost palpable.\n\nThe anger. The outrage.\n\nThe voices denouncing US interference as one of the leading causes for yet another strike against Venezuelan democracy, and vowing to hold those deemed responsible, accountable. Even as the broadcast proceeded to gauge the reaction of various American citizens, it did nothing to ease the growing discomfort.\n\nSome seemed horrified at the prospect of yet another coup occurring in the ever-volatile nation. Others did little to hide their disappointment, having hoped for any off-chance of removing the socialists in power. Nonetheless, most of those interviewed seemed to share some sense of unease at this outcome; unsure what to make of it, or its likely consequences.\n\nYet as this range of emotions continued to ooze from the TV to meet the eyes of the figures watching from the Situation Room, it would only find a single one in return."
USA_VEN.13.a: "Sheer, red embarrassment."

USA_VEN.14.t: "Cutting Losses"
USA_VEN.14.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM FBI FIELD AGENT IN VENEZUELA\nMEMORANDUM FOR THE U.S DEPARTMENT OF STATE\n\nSUBJECT: CATASTROPHIC FAILURE OF VENEZUELA COUP ATTEMPT\n\n1. Despite our significant support, the scheme by disloyal Venezuelan officials to overthrow the country's ruling socialist regime has ended in complete disaster. Many of the liberal conspirators, including President of Congress Luis Augusto Dubuc, have found their way to prison in military vans under fierce harassment from Ojeda's supporters; many of whom had no qualms tossing eggs, fruits, and rocks at them.\n\n2. According to our intelligence, several members of the coupist cabal have reportedly managed to evade arrest by escaping to the neighbouring nation of Colombia. Others have sought asylum in the American embassy, where our local ambassador, Charles Allan Stewart, has remained confined until further notice.\n\n3. While currently remaining out of reach from Caracas authorities, these surviving conspirators have asked for our protection against reprisal by the Ojedistas, with some asking for covert extradition to American or Canadian soil.\n\n4. Considering our illegal association with the group, and to avoid further radicalizing the Ojedistas, we advise immediately cutting all contact with the coupists, as well as proclaiming an official condemnation. While salvaging our relationship with the Venezuelan government might prove impossible, we need to prevent any further distancing with what was once a close ally in South America."
USA_VEN.14.a: "Fidelity, Bravery, Integrity"

USA_VEN.15.t: "Uprooted"
USA_VEN.15.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM FBI FIELD AGENT IN VENEZUELA\nMEMORANDUM FOR THE U.S DEPARTMENT OF STATE\n\nSUBJECT: SUCCESS OF VENEZUELA COUP ATTEMPT\n\n1. Following the forceful overthrow of Fabricio Ojeda by a cabal of disloyal liberal officials, President of Congress Luis Augusto Dubuc has been sworn in as the country's next leader. The long-brewing plot to remove the socialist regime from power was ignited when sympathetic military officers seized the National Assembly to encourage the delegates to vote in favor of impeachment through a constitutional loophole.\n\n2. With the socialist menace now largely under control, the interim government has immediately shifted its efforts to addressing the looming threat of a counter coup by reactionary figures within the armed forces, which is under the process of being purged of its more radical elements by loyalist and liberal-minded officers.\n\n3. Pending further notice, the military has been placed on standby in anticipation of riots sparked by Ojeda's supporters, especially in Caracas' poorer neighbourhoods and other significant left-wing strongholds. For the time being, however, it seems the freshly restored democratic institutions remain safe under the helm of the interim government until new elections occur."
USA_VEN.15.a: "Fidelity, Bravery, Integrity"

USA_VEN.16.t: "What Goes Around"
USA_VEN.16.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM FBI FIELD AGENT IN VENEZUELA\nMEMORANDUM FOR THE U.S DEPARTMENT OF STATE\n\nSUBJECT: MILITARY COUNTER-COUP IN VENEZUELA\n\n1. While the plot by liberal party officials to overthrow the ruling socialist regime showed initial success, a betrayal by anti-communist elements within the Venezuelan armed forces has led to an officer clique being installed as the country's de facto government.\n\n2. Despite clear anti-communist leanings, the junta tries to project a largely apolitical image and has not declared any intent to usher in significant changes to the country's economy beyond reversing Ojeda's recent policies. This was enough to convince many of the more politically indifferent sectors of Venezuelan society to keep their head down and refrain from voicing opposition to the soldier regime, going on as if nothing occurred.\n\n3. Of particular note, the junta declared openness to pursue economic dealings with the United States. This, however, should *not* be considered a diplomatic overture; furthermore, it is now fair to consider Venezuela as falling under the Iberian sphere, with Madrid predicted to be supplying aid to combat any remaining resistance within the country.\n\n4. Even though their operations are expected to face significant civilian resistance, it is believed that the coupists have learned well from the failure of the previous Easter Coup, and retain reasonable odds of remaining in power. Lacking any significant opposition beyond the shattered left-wing bloc, it seems the country has just come to terms with falling under the yoke of yet another military dictatorship for the foreseeable future."
USA_VEN.16.a: "Fidelity, Bravery, Integrity"

USA_VEN.23.t: "Steadying the Course"
USA_VEN.23.desc: "UNITED STATES DEPARTMENT OF STATE DIPLOMATIC CABLE - VENEZUELA\n\n1. Professor Jóvito Villalba is a person of interest in Venezuela. A known statesman and advocate for democracy as well as a prominent advocate for friendly relations and trade with the United States, he is considered a voice of reason with potential to significantly increase OFN standing among the Caribbean and within the Veracruz Pact. Villalba has the potential to help shape Venezuelan democracy into an enduring, robust, and friendly government in South America. The Department of State has outlined two potential means to boost Villalba's public profile and ensure that Venezuela remains on this track.\n\n2. The first is to arrange a prominent goodwill tour in the region with famous Americans that would lend Villalba celebrity status and ensure that he remains within the public's minds. The cost of such a visit would be high, and it has the potential to stoke nationalist fervor against the United States if the visit garners negative reaction. However, this visit has the chance to evoke broad appeal, even among those who might otherwise be politically opposed to Villalba.\n\n3. The second is an investment package into Caracas, focusing on businesses and infrastructure that could boost trade in the country. Villalba can sell these investments as the fruit of cooperation with the United States that provides stability, employment, and an upward trajectory to the economy that would benefit Venezuelans of all stripes. These investments might not create enough appeal to be measurable, and it's possible that Venezuelans won't attribute them to Villalba's influence, which could undermine the ultimate goal.\n\n4. Both initiatives do not require Congressional approval, but have received mild opposition due to their price tag and the opportunity cost for foreign aid to be delivered to other regions."
USA_VEN.23.a: "A high-profile visit would certainly help boost Villalba's appeal."
USA_VEN.23.b: "Tangible investments in Caracas will make an impact. People will believe things they see."
USA_VEN.23.c: "These options are too expensive. Villalba's on his own."

USA_VEN.24.t: "Venezuelan Government Floats Essequibo Talks"
USA_VEN.24.desc: "UNITED STATES DEPARTMENT OF STATE DIPLOMATIC CABLE - VENEZUELA\n\n1. Under Rafael Caldera, Venezuela has been a staunch ally and a strong presence within the Veracruz Pact. They have not made any significant shifts in foreign policy, and have backed American action since he came to office. Where instability has emerged in the Veracruz Pact or in the West Indies, Venezuela has been a broadly stabilizing force and has helped to boost the profile of a free, stable Latin America internationally.\n\n2. American businesses have also been prospering. With existing trade agreements heavily advantaging American businesses, Venezuela has become both a valuable ally in the export of goods such as oil and fruit, and has increasingly become a destination for both tourists and for the import of American-manufactured goods, such as cars, tractors, and furniture. Some frustrations have been noted by local manufacturers in competition, but the potential application of tariffs should not be pushed immediately, and could risk harming our relations.\n\n3. In recent weeks, Caldera has sent out feelers to us, as well as to the foreign offices in Ottawa, Canberra, and Georgetown, stating interest in resolving the current territorial dispute they have with Guyana. The dispute, which is over the Essequibo Delta, involves a significant portion of its territory and is not currently active, but has remained a frustration of many Venezuelan nationalists and has historically brought tension between both them and the Commonwealth, which remains a significant partner for us.\n\n4. There is little risk that this could blow into a wider issue from Venezuela, with the discussions raised only as a possibility. The discussions will likely see some concessions to them on trade, but could also see them abandon their claim, which would be a major boon for regional stability. Although the talks will likely have to be further in the future, we could help to shore up his government to limit the damage that his concession could do to relations with Venezuela after his term."
USA_VEN.24.a: "Caracas is rich, but not as rich as it could be. Let's invest in local businesses."
USA_VEN.24.b: "Get Air Force One fired up. Let's see if we can organize a Presidential visit."
USA_VEN.24.c: "This dispute isn't currently active. Let's not go overboard with our support."

USA_VEN.25.t: "MEMORANDUM ON FALN UPRISING"
USA_VEN.25.desc: "MEMORANDUM FOR:                 HS, PARAMARIBO Office\nSUBJECTS:                                   1. Historical Notes\n                                                     2. Rapid Loss of Government Control\n                                                     3. American Interest\n\n1. The Fuerzas Armadas de Liberación Nacional (FALN) has been a thorn in the side of the Venezuelan Government since it cut ties with the Communist Party in 1961. Since then, the PCV, and their subsidiary front the Frente de Liberación Nacional, have engaged in armed resistance. Efforts to crush them have had limited success. Rather, they have seen rising support in Venezuela's impoverished classes.\n\n2. Following recent successful communist uprisings in the Americas, the Domino Theory hypothesis has received another proof as the FALN-FLN attempted an armed coup. Despite being able to secure several major cities and much of the countryside, in the Western regions the uprising stalled and was pushed behind the Andes. Countryside control is contested.\n\n3. The Venezuelan Government is beset by a huge insurgency and open civil war but maintains an effective military. Should it fall, another unfriendly nation will arise in the region increasing instability in South America and the Caribbean. White House must be directed to preserve the current Government to prevent an oil rich communist nation threatening regional interests. Every indication is the strength of the uprising will only grow: support must be prompt.\n\nSigned: WL, Caracas Office"
USA_VEN.25.a: "Forward this to Washington. Now."


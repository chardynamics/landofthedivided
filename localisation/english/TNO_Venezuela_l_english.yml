IBR_VEN.40.t: "Road to Nowhere"
IBR_VEN.40.desc: "The army truck bounced over the potholes like a skiff in a storm. The road to San Cristóbal resembled the descent into Dante's Seventh Circle of Hell - cracked, pitted, and covered in fresh asphalt patches that guerrilla landmines would likely tear up again tomorrow. The sticky, suffocating heat of the lowlands was left behind; now, as the truck climbed into the Andes, a prickly mountain cold seeped into the bed.\n\nCorporal Rafael Torres pulled his collar tighter, trying to keep warm. His squad had been attached to the National Guard for "joint exercises," but so far, the only joint action had been swallowing dust.\n\n"And then that butterfingers from the 'Águilas' drops the ball! In the ninth inning, can you imagine?" Lieutenant Gustavo Méndez, the Venezuelan commander, roared with laughter, slapping his knees. His soldiers cracked up, discussing a match from ten years ago in Maracaibo.\n\nTorres understood the language - Castilian was native here - but the humor remained alien. To him, raised in the shadow of the Giralda in Seville, this passion for baseball was as incomprehensible as this endless war. He tightened his grip on the handguard of the CETME rifle resting across his knees and stared at the green slopes drifting by.\n\nIn Madrid, they were told they would gain "invaluable experience" here. But watching the wary gazes of peasants along the road, Rafael realized: "experience" was just a pretty word for things he would never write to his mother about. He closed his eyes, trying to summon the scent of Triana's orange groves, but all he could smell was cheap gasoline."
IBR_VEN.40.a: "The road is long, but memory is short."

IBR_VEN.41.t: "Bread and Circuses"
IBR_VEN.41.desc: ""...As my old friend, a contractor in Gran Canaria, used to say: "If the foundation is poured concrete and the roof is pure gold, it doesn't matter a damn whose flag hangs on the pole - what matters is who has the keyring to the entrance in their pocket."" - Matías Vega Guerra laughed boisterously, pleased with his own metaphor, and swept his gaze over his interlocutors. Beside him, António Fontes, maintaining an expression more suited to an undertaker at a funeral than a diplomat at breakfast, silently slid a map of the La Guaira port zones across the polished table.\n\nIn the cool hall of the new "Flor de Altamira" bakery, smelling of vanilla, cinnamon, and fresh croissants, the conversation flowed smoothly and mundanely. Extraction concessions, deep-sea fishing rights, contracts for laying pipes through the jungle-they carved the country into neat slices as easily and casually as they cut hot croissants with silver knives.\n\nTwo steps away from them, Elena scrubbed the already perfectly clean countertop with frenzy. The drone of their voices, mixed with the clinking of porcelain, echoed in her head like the echo of a nightmare. She remembered that accent - the characteristic "seseo," imperious, harsh, and self-assured. Just like the masked men who had kicked in the door of her house near Apure a month ago and dragged her brother into the darkness of the night. Who was it? Soldiers? Guerrilla? She wasn't told. She knew only one thing: now there were too many foreign uniforms on the streets of Caracas, and in this room, at the best table, rang the voices of the new masters of life, for whom Venezuela was merely an asset in a ledger.\n\n"More coffee, caballeros?" she asked quietly, approaching the table when Matías's laughter died down."
IBR_VEN.41.a: "Business as usual."

IBR_VEN.42.t: "True Intentions"
IBR_VEN.42.desc: "Father Carvalho was Portuguese, born and raised in Lisbon, not Venezuelan. He never questioned his posting to San Juan de Los Morros. He had joined the mission right after his priestly vows, years before the war. If God sent him to guide Guárico's flock amid these troubled times, then it was his divine calling.\n\n"And remember, my children, that God loves you. Put your entire faith in His Grace..." His voice held steady despite older boys peering out windows at military trucks rumbling by. Barely visible Venezuelan and Iberian helmets in equal numbers stood straight in the back. Comfort came in knowing his Spanish had improved, and that his accent was no longer the reason for their distraction.\n\n"In truth, children, these are hard times, and some among you may doubt God's plans for this land and your lives. If Divine Grace and Providence don't comfort you as they do me, trust earthly authorities—parents, teachers, government..." He paused longly after the last word, even for a small orator like himself "...Order underpins society, ordained by God. Render unto Caesar what is Caesar's, and unto God what is God's. You may leave now. I am always present for anything you may need."\n\nThe boys filed out to the Catholic School's dormitories. Once alone, Father Carvalho hurried to the basement. A dozen guerrilleros, undoubtedly saved from certain death by his open Church doors, huddled in panic from the trucks. He comforted each individually and prayed for war's quick end and easy family reunions. A boy, barely older than the students, asked why an Iberian like him risked himself to help them. Calmly, he grasped the boy's hand in a gentle caress."
IBR_VEN.42.a: ""By this we know love, that He laid down His life for us, and we ought to lay down our lives for our brothers.""

IBR_VEN.43.t: "Ghosts of Toledo"
IBR_VEN.43.desc: "San Fernando de Apure melted in the midday haze. The dust of the Llanos clogged pores and gritted between teeth. For the squad, it was routine: a kick to the door, a quick sweep of the kitchen, a check of the backyard, move on to the next house. Retired Brigadier General Salvador Mola walked behind, leaning on a cane, more for show than out of necessity.\n\nBehind one door, painted in peeling sky-blue, they found an old man. He sat in a wicker rocking chair, thumbing wooden rosary beads. Click. Click. Click. He answered the lieutenant's questions quietly, looking not at the soldiers, but at the crucifix on the wall. "No, señores. There is only me and the Lord here." They left him in the gloom.\n\nMola lingered on the threshold, feeling an unnatural chill run down his spine. Thirty-three years ago. Toledo. He, then just a young "Requeté" captain, had entered the homes of his neighbors just like this, hunting for Republicans. The same whitewashed walls, the same old men with rosaries swearing ignorance.\n\nIn '36, one such old man also said he was alone. A few minutes later, a machine gun opened fire on Mola's platoon from his basement.\n\nThe General wiped sweat from his brow with a silk handkerchief. Was this Venezuelan lying? Mola didn't know. But he knew one thing for certain: civil war wears the same face everywhere - the face of a neighbor smiling at you while gripping a knife in his pocket."
IBR_VEN.43.a: "Some doors are better left unopened."

IBR_VEN.44.t: "After The Storm"
IBR_VEN.44.desc: ""Let's leave the lyrics for the newspapers, gentlemen. Numbers speak clearer. The expansion of the Bajo Grande terminal's capacity requires a review of insurance premiums." - A heavyset Venezuelan industrialist tapped a pen on the unfolded map, outlining the contours of future profits. - "If Madrid guarantees the delivery of dredging equipment by this year, we will increase crude oil shipments by 15%."\n\nMatías Vega Guerra nodded benevolently, breaking off a piece of pastry. Beside him, António Fontes, looking like a bird of prey in a severe suit, was already making corrections in a notebook, crossing out unnecessary expenses. At this table, sheltered from the street heat by the hum of air conditioners, the recent war was discussed exclusively as an annoying logistical glitch - a traffic jam on the road to prosperity which, fortunately, had cleared.\n\nElena, frozen with the coffeepot in her hands, tried to become invisible. This morning, making her way to her shift along Avenida Francisco de Miranda, she realized with horror how quickly the city had changed its face. A week ago, foreign presence meant the clanking of tracks, checkpoints, and the shouting of patrols. But today, the strangers vanished from the armor and materialized in cool bank vestibules, in the soft armchairs of hotel lobbies, at the tables of expensive restaurants.\n\nShe saw them everywhere: confident men in impeccable Italian suits, speaking with the same characteristic accent as the soldiers who had searched her home.\n\nHer brother disappeared several weeks ago. No letter, no body, no grave. For these people, his death was just a line item in the "security costs" column. They divided the country, drank its oil, and ate its bread, not even noticing they were walking on bones. The girl bit her lip, suppressing a scream, quickly wiped a spot with a napkin. In this new, glittering world, there was no place for her grief."
IBR_VEN.44.a: "Coffee served, contracts signed, dead forgotten."

IBR_VEN.45.t: "Emptiness in Briefcases and Hearts"
IBR_VEN.45.desc: "Matías Vega Guerra and António Fontes descended the marble steps of Miraflores Palace, their hurried footsteps echoing with the hollow sound of final failure. Their briefcases, usually swollen with draft concessions and secret protocols, swung in their hands unnaturally light today, like sails without wind. Inside reigned a sterile void: no oil contracts, no security guarantees, no port rights. The game was over, and the dealer had taken all the chips.\n\nThe Iberians walked to the car quickly, exchanging no banter, their faces frozen masks of restrained fury. They were hurrying to the runway before the country's new masters changed their minds about letting them out alive.\n\nAnd at the other end of the city, where the air had recently been saturated with the scent of pastries, the wind chased grey ash over a pile of broken brick. The "Flor de Altamira" bakery, that symbol of metropolitan gloss, had ceased to exist-turned into a smoking crater after a strike by the UTC urban guerrilla, clearing the path for the march of leftist forces.\n\nElena stood before the ruins, clutching a bundle with her meager belongings. Now she had neither a job nor a home. She looked at the spot where the diplomats' favorite table had stood, and physically felt their absence. The strangers were gone. The hated accent had vanished, swept away by revolutionary slogans. But this ringing silence pressed on her ears harder than their arrogant orders. Her brother did not return. The "imperialists" were expelled, but her world did not become better. Elena turned away from the rubble and wandered into nowhere, just another nameless grain of sand ground down by the millstones of history, which never cares for little people."
IBR_VEN.45.a: "The war ended, the questions remained."

IBR_VEN.46.t: "The Sword is Drawn"
IBR_VEN.46.desc: ""Withdraw?! Give up our land to those bastards?!" - The scream dissolved into the sound of shattering glass. Juan de Dios Moncada Vidal swept a heavy marble ashtray off the desk, sending it smashing against the wall, leaving a deep dent in the plaster. The General stood in the middle of the office, his uniform unbuttoned, chest heaving, his face flushed with crimson, apoplectic rage.\n\nThe adjutant who had delivered the order decided to beat a hasty retreat before Moncada Vidal's wrath, in the form of a wine bottle, struck him too.\n\n"Caldera... that pathetic, spineless piece of shit!" - Moncada kicked an armchair as if it were the President himself. - "Coward! Traitor! How did that desk rat dare raise his hand?! Essequibo is our land! It is a gift from God and the legacy of Bolívar! And he sells it like a cheap whore, to a bunch of English degenerates in Canada, just to get a pat on the head from Washington?!"\n\nHe stormed over to the portrait of the Liberator and punched the wall beside the frame.\n\n"I will not allow the Army to be turned into a gathering of eunuchs! We swore to defend the Homeland, not to spread our legs for foreigners! Street dogs have bigger balls than this entire liberal circus put together!"\n\nSuddenly, the frenzy in his eyes was replaced by a cold, predatory glint. Caldera is flying to Trinidad. To sign this shameful pact. The throne in Miraflores will be empty.\n\nMoncada exhaled slowly. He has the men. He has the support of Madrid and Lisbon. It is time to end this elitist farce.\n\nHe picked up the phone receiver, gripping it so hard the plastic creaked piteously. - "Connect me to the garrisons. And prepare a cipher for our friends in the Old World.""
IBR_VEN.46.a: "He who cannot wear the uniform shall not wear the crown."

IBR_VEN.47.t: "Breakout"
IBR_VEN.47.desc: "The men snapped to attention as Moncada Vidal walked into the room. The patriots had been prepared to defend their country, and now, Moncada was about to give the order to seize the country back from those who would seek to undermine it. The socialists would sell the country to Canada in a heartbeat, and now, they would pay for their treachery in blood.\n\n"You have all been prepared, so I will make this brief. Our target is the Palacio Blanco first, then we will move onward to Miraflores. Once we have both buildings under control, we will demand a surrender of any forces loyal to Caldera and march out into the street to secure the capital. Any socialist who stands in our way will be eliminated. Men, this is the greatest moment in our history since Bolívar, and like Bolívar, we will..."\n\nThe door was kicked open, hammers clicked as men began to pour in. "DIGEPOL, throw down your weapons!" National Guard and DIGEPOL forces, with masks and body armor, held up their weapons.\n\nWeapons discharged, the room filled with the smell of gunpowder. Screams punctuated the gunfire. As the haze cleared, over fifteen of the National Guard and DIGEPOL forces were dead or downed, the rest fleeing as some of his men led the pursuit, firing upon the cowards as they fled. Moncada Vidal looked over the room. His men had a few casualties, the first martyrs of national liberation. He pointed his pistol at a National Guardsman, dazed on his back from a gunshot that his armor saved him from, and with a single pull of the trigger, turned the traitor's head to paste.\n\nOne of his men went to another room to grab an undamaged radio. "My loyal soldiers, we now stand at the moment of national liberation. All who believe in our nation, and in the strength of our men to lead it. Any who stand against us, soldier or civilian, is an enemy that will be dealt with as enemies are. Forward!""
IBR_VEN.47.a: "His men saluted, and began their march, singing Gloria Bravo Pueblo as they went."

IBR_VEN.48.t: "Breakdown"
IBR_VEN.48.desc: "With a loud clatter, the last of the military trucks were turned over to the cheers of the cursed Calderists. His own forces had ceded the ground floor of the White Palace, taking up better positions as the National Guard and disloyal army breached the main doors. Moncada Vidal's early momentum had broken down not long after taking the Palace. Several of his units had been arrested in their barracks before they could secure their weapons. Infiltrators had discovered which units were loyal to him, and they had robbed him of his strength before they could fight.\n\nHis Iberian contact had said as much, saying that they would have succeeded had they just conducted themselves with more discipline. Hollow words, the Iberians didn't have the stomach to fight. "Retreat, Moncada. Your position is untenable. We can extract you to Madrid and push for the country in a few years." The first part of the offer was undoubtedly sincere. The latter was a lie, either deliberate or negligent, Moncada Vidal didn't care which. He would not be a subject of gawkery in Madrid, the failed plotter.\n\n"Never! I am a patriot. I will fight to my last breath to free my country!" He slammed the receiver down on the phone, nearly cracking the handset.\n\nA loud burst came as the traitors breached the next floor. Moncada grabbed his rifle, peeked out from the door, and fired at the first enemy shape he saw. He moved back to an overturned desk, firing on the entryway. He may have hit the first two men, but then two more, and then two more, their bullets sending splinters flying.\n\nHis rifle went dry, and rather than fumble for another magazine, he grabbed the weapon of a fallen soldier next to him. This time, however, a bullet hit his shoulder, and as his body lurched from the impact, another bullet struck home, then another.\n\nHis dreams of coup leaked out onto the Palacio Blanco's floors, and his exaltations of a new Venezuela ended in a raspy gurgle."
IBR_VEN.48.a: "Moncada Vidal followed the example that Caracas gave."

IBR_VEN.49.t: "Spilled Beans"
IBR_VEN.49.desc: ""What is it, Fernando?" Franco was seated behind his desk, sorting through some files. "You wanted to see me?"\n\nFernando María Castiella y Maíz did not, in fact, want to see the Caudillo. But as Minister of Foreign Affairs, he was obliged to bring the latest news to his leader, even if he would rather be anywhere else in the world right now. "Yes, Señor. There is news from South America, and I'm afraid it's bad."\n\nFranco gritted his teeth and began fidgeting with his pen. "Get it out, then. I don't have all day to hear about the failures of our esteemed diplomatic corps."\n\nCastiella y Maíz swallowed hard. "Well, Venezuelan President Rafael Caldera has released a trove of information about our involvement in the Moncada Vidal fiasco. Presented everything to the OAS and to the public, with the names of dozens of involved officers. Some of our people working with the Bolivarianists were also implicated. We could deny our involvement, but... it's not looking good, Caudillo. Caldera had already blasted us as a sponsor of fascist violence and claimed that the Bolivarianists weren't true nationalists but merely our jack-booted puppets. And he has the documents to back this up."\n\nAfter spilling the burst of information, the slightly shaking Minister looked once more at Franco. The Caudillo was still seated in his seat, impassively looking down at him. Castiella y Maíz took a deep breath and continued. "This will be a grave blow to our efforts at expanding diplomatic and economic ties throughout the region. I... apologize. We have failed Iberia."\n\nFranco's mouth twisted into a grimace. "It's no matter. We won't have to hear so many foreign dignitaries fumbling over their Spanish here in Madrid." His mouth straightened, but the steel in his eyes remained."
IBR_VEN.49.a: ""Dismissed.""

IBR_VEN.50.t: "Gloria al Bravo Pueblo"
IBR_VEN.50.desc: "In the stifling barracks of Fort Tiuna, there was no room for doubt. Moncada Vidal stood before the ranks of conspirators, and his voice sounded like hammer blows. No politics, only naked, fanatical resolve. "Caldera is in Trinidad. While he gives away our land, we will restore Venezuela's honor. Your objective is the Palacio Blanco and Miraflores. Anyone standing in the way - socialists, liberals, guardsmen - are enemies of Bolívar. Cleanse the city. Take no prisoners. Forward!"\n\nCrates stamped with the marks of Spanish arms factories creaked as they were pried open with crowbars. Brand-new rifles, still in factory grease, settled into soldiers' hands. Minutes later, the avenues of Caracas shuddered from tank treads and the roar of APCs.\n\nAnd then they began to sing. "Gloria al Bravo Pueblo...".\n\nThe tracks of a "Moristel" tank screech as they bite into the asphalt, grinding down a hastily erected barricade of trash cans and abandoned cars. A student winding up to throw a stone falls, cut in half by a machine-gun burst.\n\n"...que el yugo lanzó..."\n\nAn RPG shot blows away the wrought-iron gates of the Palacio Blanco. The blast wave hurls two guardsmen onto the pavement, turning their dress uniforms into bloody tatters. Shards of glass rain down on the heads of the screaming crowd.\n\n"...La Ley respetando, la virtud y honor."\n\nA Bolivarian officer coolly finishes off a wounded policeman trying to crawl away. In the smoke of the burning city, to the majestic melody of the anthem, Venezuelans killed Venezuelans with a frenzy not seen since the War of Independence."
IBR_VEN.50.a: "The streets will wash in blood in the name of Bolívar."

IBR_VEN.51.t: "Live Broadcast"
IBR_VEN.51.desc: "The phone receiver in Moncada's hand was slippery with sweat. Through the blown-out window of the White Palace, a view opened onto Urdaneta Avenue. Smoke from burning tires obscured the sun, and thousands of people - students, workers, clerks - merged into a single howling mass, a living shield blocking the approaches to Miraflores Palace. They did not retreat even under warning shots. "Enrique, they've blocked every meter!" the General snarled into the receiver, the hysteria of a cornered beast in his voice. "I will order the tanks to crush them. I will pave the road to the palace with their bones if I have to!"\n\nEnrique Valenzuela's voice sounded dry and squeamish in the speaker - "Curb your bloodlust, general. If you smear them now, the world will see a monster in you. Form the armor into a wedge and punch through to the palace gates. When the crown is yours, any execution becomes a 'restoration of constitutional order.' Feel the difference?"\n\nMoncada breathed heavily, looking at the raging sea below. Then, clenching his teeth, he barked into the radio: "All crews! Full speed! Objective - Miraflores gates. Do not bypass obstacles. I repeat: do not bypass obstacles!"\n\nDiesel engines roared, drowning out the screams of the crowd. Thirty-ton machines surged forward. The first rows of protesters vanished under the tracks; barricades of buses crumpled like cardboard, spraying glass and twisted metal.\n\nHalf an hour later, stepping over the corpses of guardsmen in the palace corridors, Moncada stepped out onto the famous Balcony of the People. Before the camera lens, he threw his hands to the sky, and his voice, torn by shouting, carried over burning Caracas:"
IBR_VEN.51.a: ""Look, Venezuelans! Look at how the legacy of the traitor Caldera burns!""

IBR_VEN.52.t: "The Smell of Victory"
IBR_VEN.52.desc: "At the gates of the White Palace, the wreck of an overturned truck smoked - a black skeleton caked in burning rubber. The protesters' final attack had choked instantly: "Bolivarian" machine gunners turned the living wave into a pile of broken dolls scattered on the asphalt in puddles already starting to thicken in the heat. Moncada Vidal stepped over someone's hand without breaking stride and dived into the cool interior of the waiting limousine.\n\nWhen the car started moving, the officer behind the wheel asked - "General... what should be done with the Minister of Internal Affairs and the staff in Miraflores? If they surrender..."\n\nMoncada chuckled coldly, looking at his reflection in the dark glass. - "History is not interested in the fate of bureaucrats, Lieutenant. Let them run, let them burn, let them pray. I need the palace, not the rats inside. Forward."\n\nThe motorcade tore down Urdaneta Avenue, and a panorama of agonizing Caracas unfolded before the General's eyes. The city looked as if it had been gutted. Building facades, riddled with heavy caliber fire, gaped with black window holes like empty eye sockets. The cobblestones were strewn with broken glass that crunched under the tires. Everywhere - from San Bernardino to El Silencio - columns of smoke rose, veiling the sun in a funeral shroud.\n\nBut where others saw destruction, Moncada saw birth. In this chaos, in these burning barricades, the chains of the "International Order" that suffocated the nation were melting. He pressed the button, lowering the window. Hot, stifling air burst into the cabin - a mixture of burnt flesh, gasoline, and sweetish cordite. Moncada took a deep breath, filling his lungs with this poisonous bouquet. This was the smell of freedom. This was the smell of victory."
IBR_VEN.52.a: "A new sun rises over Miraflores."

IBR_VEN.53.t: "Empty Chairs of Miraflores"
IBR_VEN.53.desc: "In the air-conditioned silence of the Miraflores annex, the clink of a coffee spoon against porcelain sounded louder than ever. Martín Vegas, the Minister of Foreign Affairs, sat at the long polished table with an expression of polite boredom, shuffling stacks of documents. Across from him, the Iberian delegation sipped cooling espresso, swallowing their growing irritation along with it.\n\nThe meeting was impeccably correct, but every word Vegas spoke, every paper about "tariff adjustments" and "shipping delays" was a slap in the face. Pedro Tinoco did not come. Diego Cisneros, the regime's Minister of Internal Affairs, didn't even send a secretary. Those empty chairs at the head of the table screamed louder than any note of protest: "You are no longer important."\n\nVegas spoke softly, evasively, chalking up every refusal to "changing conditions in the region." The word "Colombia" was never spoken aloud, but it hung in the air like heavy smog. Having lost Bogotá, Iberia had lost face, and Caracas had noticed. Venezuela was drifting away like an iceberg driven by the current of pragmatism.\n\nAs the delegates left the hall, they felt the cold truth on their backs: the era of "special relations" was over. Iberia was no longer the center of gravity, but just another petitioner in a crowded line for oil. And against the backdrop of the looming Oil Crisis, this revelation was akin to a death sentence."
IBR_VEN.53.a: "Silence is the loudest sound on earth."
IBR_VEN.53.tt: "§RWith the loss in [COL.GetFlag] §fColombia§! representing our §Vbiggest defeat§! in the Americas thus far, our [VEN.GetFlag] §SVenezuelan§! partners have deemed it necessary to seek [USA.GetFlag] [GER.GetFlag] §malternative§! §bsponsors§!.§!\n§F------------------------------------"

IBR_VEN.54.t: "The Tight Uniform of the Old World"
IBR_VEN.54.desc: "Diego Cisneros dissected the Iberian economy with the cold dispassion of a pathologist. His pointer slid across the charts: plateaus, stagnation, missed opportunities. Arturo Uslar Pietri listened silently, fingers steepled. There was no hostility in his gaze-only the weary condescension with which a professor looks at a negligent student.\n\n"They have become... insignificant, Diego," the President said thoughtfully, looking through his interlocutor. "Venezuela has outgrown this alliance, like a teenager outgrows children's clothes. We are too rich, too ambitious to tie our fate to a fading star."\n\nUslar Pietri stood and walked to the window, beyond which Caracas hummed. "Many years ago, I said: 'We must sow the oil.' But you cannot grow a baobab in the clay pot Madrid offers us. We need space. We need markets that grow, not decay."\n\nAt subsequent receptions, Iberian diplomats encountered the most terrible kind of refusal-polite indifference. They were thanked, treated to the best coffee, and... forgotten. The shadow of the Colombian failure lay on them as an indelible mark of weakness. If Iberia had held Bogotá, Caracas might have wavered. But now, on the threshold of the Oil Crisis, Venezuela stepped over its former patron, fixing its gaze on a future where there was no longer a place for decrepit Europe."
IBR_VEN.54.a: "They grew up. We didn't."

IBR_VEN.55.t: "A Polite Refusal"
IBR_VEN.55.desc: ""These figures look respectable, Jóvito, but every line here is written in ink diluted with old fear. This is the legacy of an era when we paid not for goods, but for protection. But I suppose the time for racketeering has passed."\n\nMiguel Ángel Burelli Rivas slowly, almost with ritual solemnity, closed the folder, as if slamming the coffin lid on an entire era. Across from him, arms crossed, stood Jóvito Villalba. The President stared fixedly out the window at Caracas sprawled below, as if trying to discern in the labyrinth of streets traces of that very "abnormal dependency" they were about to shed. Iberian influence had seeped into the city's foundation: into bondage contracts signed at gunpoint, into debts owed to generals whose names were already history.\n\nBut the wind had changed. The collapse of Iberian ambitions in Colombia was a signal: the lion had grown old and lost its teeth. If they couldn't hold onto Bogotá, who were they to dictate to Caracas?\n\n"We will call it a 'rebalancing,'" the Minister continued in his soft, enveloping baritone. "A course correction. No notes of protest, no loud accusations. We will leave the door open, let them see us leaving the room."\n\nIn the embassies of Madrid and Lisbon, this polite, quiet refusal would sound louder than a cannon shot. For Iberia, standing on the threshold of the Oil Crisis, the loss of its richest partner in the Americas would be a gut punch from which it was unlikely to recover."
IBR_VEN.55.a: "Nothing personal. Just geopolitics."

IBR_VEN.56.t: "Requiem for Sovereignty"
IBR_VEN.56.desc: "In the damp concrete belly of the bunker beneath Miraflores, fluorescent lights flickered in time with the dull thuds of artillery above. The air here was stale, soaked in the smell of old fear and cheap tobacco. Edito Ramírez, the Minister of Foreign Affairs, resembled a melting wax figure: sweat streamed down his face, turning the collar of his dress uniform into a wet rag.\n\n"...Exclusive rights to the shelf... full immunity for your personnel..." he mumbled, trembling fingers shuffling papers. "We are also prepared to consider transferring port terminals in Puerto Cabello to your jurisdiction..."\n\nJuan de Dios Moncada Vidal slowly leaned back in his chair, his gaze losing focus as it fixed on a crack in the ceiling. Ramírez's voice, listing the points of national humiliation, became distant, irrelevant - like the buzzing of a persistent fly. The General stopped processing the details of the concessions. Instead, he listened to a different rhythm seeping through meters of earth and concrete: the dull vibration of tank engines and the staccato of machine guns. Up there, his city was burning. Up there, fate was being decided, while down here... here...\n\nReality snapped back with the sharp, scratching sound of a fountain pen on expensive paper. Moncada blinked. The Iberian diplomat was already standing, extending a hand across the table with an inscrutable smile.\n\n"We accept, General. The papers are signed."\n\nMoncada shook the offered palm mechanically, feeling nothing but the coldness of another man's skin."
IBR_VEN.56.a: "Allies or property?"

IBR_VEN.57.t: "Rats, the Ship, and the Captain"
IBR_VEN.57.desc: ""...Madrid assures of the immutability of fraternal ties and offers an expanded package of economic cooperation in light of regional instability..." read the dry voice of Leónidas Sánchez Carrero. The Minister of Foreign Affairs put down the dispatch, removed his glasses, and wearily rubbed the bridge of his nose. He knew the value of these words, just as the man standing by the window did.\n\nMarcos Pérez Jiménez looked at his official portrait from the 50s hanging on the wall. That young general on the canvas, in a shining uniform and with the Order of the Liberator, was naive. He believed in allies. This one, returned from exile, believed only in reinforced concrete and force.\n\nHe remembered 1958. He remembered the roar of the turbines of the plane carrying him away from the enraged mob. Where was "fraternal Iberia" then? They looked away when the knives came out. They loved his oil, but were ashamed of his friendship.\n\nAnd now, when Iberia had crashed out of Colombia, losing its main foothold in the Andes, they came crawling for support? Pérez Jiménez laughed a short, barking laugh.\n\n"Enough, Leónidas." Pérez Jiménez turned. "For the press, call it a 'pragmatic reorientation within the framework of the New National Ideal.' Pretty words for fools."\n\nHe walked to the table and slapped his palm on the Iberian dispatch. "And tell the ambassadors plainly, this is their last visit to this office. They cost me too much. Goodbye.""
IBR_VEN.57.a: "Ballast jettisoned."

IBR_VEN.58.t: "Mail from El Chivo"
IBR_VEN.58.desc: "Matías Vega Guerra, held the cipher with two fingers, as if it were not diplomatic mail, but a dead rat thrown onto the embassy doorstep. "Did you read this nonsense from Abbes, António?" the Spaniard snorted, tossing the sheet onto the table. "Our friend in Ciudad Trujillo is in hysterics. His goons from the SIM claim that the Venezuelans are ferrying a revived 'Caribbean Legion' to the Dominican Republic. Via Cuba. Can you imagine? They see the ghost of Rómulo Betancourt in every shadow."\n\nAntónio Fontes, the Minister-Counselor, without looking up from studying the nautical charts, carefully adjusted his glasses. "Abbes, for all his brutish stupidity, is right this time. Look here." The Portuguese poked his pencil at a point north of the Paraguaná Peninsula. "Agents report the departure of 'Nueva Esparta' - class destroyers. These aren't the rusty tubs the Mexicans sail. This is the best fleet in the Caribbean Basin - the Venezuelan navy."\n\nMatías stopped smiling. He walked over to the map, and understanding flashed in his eyes. The murder of the father of Venezuelan democracy had not gone unpunished. "So, a vendetta..." the Spaniard drawled, and involuntary respect sounded in his voice. "Betancourt is dead, but his fleet is coming to sink Trujillo. Beautiful. Even poetic."\n\n"More like a problem," António cut him off, already feeding a clean sheet into the typewriter. "Madrid needs to know about this before our friend is put in the ground. Dictate, Ambassador. 'Urgent. Santa Cruz. High activity of the Venezuelan Navy observed...'"
IBR_VEN.58.a: "In this part of the world, even the dead know how to shoot."

VEN_forpol.100.t: "Trophies of Holy Week"
VEN_forpol.100.d: "The folder of embossed leather with a gold crest landed on the mahogany table with a dull, solid sound. It was not just a report - it was, in essence, a bill of sale for an entire country. The consolidated memorandum from the Foreign Ministry, the Ministry of Economy, and Iberian intelligence services read like the best poetry of the Golden Age: Venezuela, the prodigal daughter, had returned to the bosom of the family, and this time the leash in Iberian hands was shorter than ever.\n\nAt the center of the report towered the figure of the victor - Jesús María Castro León. A man of the old school who preferred the bitterness of voluntary exile to the humiliation of serving populists who had seized power. His swift dash from the misty hills of San Cristóbal to the gates of Caracas proved: steel is still stronger than demagoguery. Now, occupying the chair in Miraflores, the General wastes no time on empty speeches.\n\nHe has begun implementing his "Five National Points" - a grandiose surgical project to reshape the state. The new Constitution he is writing will not be a collection of liberal dreams, but a charter where the army becomes the backbone of the nation, and discipline - the law.\n\nFor Madrid and Lisbon, this means the dawn of an era of abundance. Venezuelan oil will flow into Spanish tankers, markets will open for Portuguese goods, and the strategic foothold in the Americas is now cemented tight. While the rest of the world looks with anxiety at the coming economic storms, Iberia has secured for itself the safest and richest haven."
VEN_forpol.100.a: "The investment paid off a hundredfold."

#Ven Forpol Multiple Countries
VEN_forpol.102.t: "Symphony from the New World"
VEN_forpol.102.desc: "Sunrise dawned in Caracas to the tune of a meticulously devised orchestra.\n\nCarrying the chords were countless columns of APCs and military trucks riding along the main street toward the national assembly.\n\nCurious onlookers found their approach barred through carefully placed roadblocks, and by the time confused loyalist units understood the meaning of this peculiar spectacle, it was already far too late to prevent its occurrence.\n\nLike clockwork, opposition delegates pouring from a cortège of black Cadillacs descended upon a mostly empty Capitolio far earlier than its usual opening hours, and promptly declared an emergency session. Then, the choir began.\n\nJust as he'd practiced, the URD spokesman proclaimed Fabricio Ojeda's presidency invalid on constitutional grounds, followed by a whole flow of accusations ranging from gross economic mismanagement to dangerous, undemocratic conduct.\n\nOne by one, all the dominoes fell right into place. The martial curfew. The reversal of the recent nationalization policies. The swift dismissal of any officer who could present a threat to the ongoing coup. And at last, the grand finale.\n\nBut only from the confines of the Cuban embassy, where he and his cabinet had hastily found shelter within, would the Venezuelan President learn of the unanimous results of the impeachment vote that had just been carried against him.\n\nAnd his powerlessness to do anything about it."
VEN_forpol.102.a: "A magnificent ensemble, with Washington as its maestro."

VEN_forpol.103.t: "The Music Stops"
VEN_forpol.103.desc: "If one could embody the streets of Caracas on this particular day, they'd bear witness to not just one, but several spectacular displays.\n\nThey would first behold the morning break to military convoys waltzing along the main road toward the National Assembly.\n\nBy noon, they'd watch the same conspirators who had just poured from these trucks find their exit from the Capitolio swarmed by a tide of Ojedistas supporters. Then, faced with the realization that one of their missing pieces might have harbored slightly different aims.\n\nNot long afterward, their arteries would ring with the sounds of an address from the nearby military headquarters, denouncing the illegitimacy of the self-proclaimed provisional government and condemning its illegal attempt at usurping power.\n\nThe following hours would see them painted with pictures of ferocious clashes, as both the coup's orchestrators and those objecting against it found their way into the clutch of rogue army units sent to restore order across the capital.\n\nOne by one, they'd attest to the cries of protestors being smothered by the blare of loudspeakers and, eventually, gunshots.\n\nAnd when evening came on the now-empty streets..."
VEN_forpol.103.a: "...there would be nothing more to observe than silence."

VEN_forpol.104.t: "Fall of Venezuelan Government to Organisation of Free Nations Imminent"
VEN_forpol.104.desc: "TOP SECRET\nEYES ONLY\nTO ALL MEMBERS OF THE MINISTRY OF FOREIGN AFFAIRS\n\nVENEZUELA - LATIN AMERICA\n\nVenezuela is lost. Moncada Vidal's attempts to seize Essequibo and ensure the creation of a Guyanese satellite state were quickly repulsed by the garrison present and has quickly escalated into a full-scale conflict. Shore bombardments have commenced and the deteriorating security situation has resurrected Bolshevik elements within Venezuela. Civil war within the country seems both imminent and likely to be short-lived, a possibility that German elements in the country regularly warned him about.\n\nAt this stage, it is incredibly unlikely that Caracas will be able to reclaim lost ground, and will fall to Washington in a matter of weeks. Significant concessions are likely to be demanded beyond a recognition of Guyanese sovereignty in return for aid in quashing Bolshevik insurgency, and Venezuela will likely become an American puppet state. At this stage, little can be done beyond damage control. Place priority on removing personnel who moved to work in area and officially recognise Guyanese claim to Essequibo."
VEN_forpol.104.a: "All that money, thrown away for nothing?"

VEN_forpol.105.t: "Things to Come"
VEN_forpol.105.desc: "Troops move to the border. The factories are producing everything required as fast as they can. Material flows through the railroads and highways. Every possible preparation is being made for one of the most important moments in recent history.\n\nWe intend to make a stand against American imperialism, against their chokehold over the Americas. We ask you to aid us in that effort.\n\nIn 1887, we turned to America to aid us against the British, to make good upon their promises of being a new answer to the imperialists that took what they wanted without care. We asked them to mediate the Essequibo affair, even to be our representative, foolishly believing that they would stand up for us. They betrayed us, siding with the British while choosing influence and prestige over what was right. Even today, they use their OFN puppets to hold the land, a Canadian garrison just across our border, in order to maintain their ultimate control of the area after the British fell.\n\nWe now have the strength to rectify this mistake. The Americans and their chained thralls are strong, of that we have no delusion, but they are weak-willed. Their failure 30 years ago showed us that; the American public has no appetite for long wars that disturb their comfort. Meanwhile we possess the sense of will that only comes from righteousness. Our cause is just, and Venezuela's lands will no longer be held captive by foreign occupiers.\n\nWe ask you, as our closest ally, to aid us in this struggle. We can destroy the Canadians at the border and take our claims, but with you we can march all the way to Georgetown and send a message the whole world can hear. That the American beast can be beaten, their slaves can be pushed back, and that they need no longer fear the ugly American."
VEN_forpol.105.a: "A note from the Venezuelan ambassador, deposited discreetly at the highest desk."
VEN_forpol.105.tt: "§RVenezuela's ambitions over Essequibo will soon reach their climax...§!"

VEN_forpol.106.t: "Marching Forward, In Step"
VEN_forpol.106.desc: "The campaign to reclaim Essequibo, the rightful Venezuelan territory under the occupation of Guiana, has begun. The troops and material that for so long has been collecting at the border, preparing for this very moment, have begun their operation and crashed into the unsuspecting Canadian garrison. No foreign force or Guyanese battalion shall be able to hold us; the success of our campaign is all but certain.\n\nHowever, to complete our victory it is vital that we march forward together. The Americans have been slow to respond, but now their bluster and our intelligence has informed us that they are coming with their total superiority on sea and in the air. Troops shall pour into Georgetown and march to the border to attempt to hold us. The means of the American beast is infamous the world over, and we have no illusions as to its might. As such, we must ask you to aid us in this time of need - help us to strike a blow not just for Venezuela, not Latin America, but the whole world.\n\nIf we march forward, in-step with bayonets forward, the whole world can know that the age of American imperialism has ended, as America's humiliation shall be undeniable. We have shared with you our operational objectives in recent weeks, the operational plans have been made available to your officers. Now is the time to make use of that preparation, and help us liberate Essequibo."
VEN_forpol.106.a: "A discreet note, followed by an order to the generals. Aid would come to Venezuela."
VEN_forpol.106.tt: "§YYou can now send volunteers to Venezuela.§!"

VEN_forpol.107.t: "A Blow Heard Around the World"
VEN_forpol.107.desc: "Across the nation, fireworks shoot into the air. People chant in the streets and flags are raised; flags of Venezuela and flags of yours. Today, our victory has been achieved. Together we have liberated a region of Venezuela so long subjected to foreign enslavement, and we have struck a blow against the American monster upon our door.\n\nThe might of our combined efforts have rendered the OFN impotent, our forces standing strong even against their efforts to destroy us from afar. The American media already are turning upon their own nation like dogs, tearing at rancid meat. Questions over America's purpose, its ability to continue its empire faltering. Across Venezuela, we have speakers ensuring that our populace know this; this was no abortive coup nor FBI debacle. Venezuela fought the Americans and their thralls in open combat and came out the stronger.\n\nBut, as our speakers make clear in everything from radio broadcasts to television addresses, this achievement was not made alone.\n\nOur government considers this an indication of the possibilities of continued cooperation, in light of our success driving back the imperialist clutches within Latin America. Collaboration offers an ever stronger future, one forged in the flames of liberation."
VEN_forpol.107.a: "For we made the world know that the strong must fear those they foolishly consider weak."

VEN_forpol.108.t: "Bloodied but Unbroken"
VEN_forpol.108.desc: "We stood together, however our efforts to liberate Essequibo came to naught. Still it lingers under foreign occupation, our forces driven back to their starting positions by the might of the OFN-OAS response. From sea, air and land there was little chance to match the might of the American beast.\n\nBut, despite the unfortunate failure of the liberation we must not consider the operation a failure. Together we have bloodied the nose of the American giant, the corpses of their soldiers as well as those of their puppets will linger within their consciousness. We have made clear our position as a cornerstone of the resistance to the Empire, and wars are rarely won on their first battle.\n\nWhat is clearer than ever is the importance of further collaboration. The might of America cannot be broken by a single nation, regardless of how committed they are to the cause of righteousness. America's military exists as a hammer more than adequate to squash the notion. Even now, the cowardly OAS continues to indulge American objectives, discussing the possibility of 'intervention' within our nation as if we were a mentally ill family member to be rectified. Should such discussions bear fruit, Venezuela may face a final crucible with the combined might of the OFN and OAS - if such an event, your aid will be essential. Only together can we continue to stand against the Americans, until the next opportunity for victory comes."
VEN_forpol.108.a: "The fire of defiance is dimming in Caracas."

## Germany Events
GER_VEN.1.t: "Attempted Bolshevik Revolution in Venezuela"
GER_VEN.1.desc: "TOP SECRET\nEYES ONLY\nTO ALL MEMBERS OF THE [getIntelAgencyCaps]\n\nVENEZUELA - LATIN AMERICA\n\nOur worst fears surrounding Venezuela have come true surrounding the Fuerzas Armadas de Liberácion Nationale (FALN). FALN-FLN troops in Venezuela seized control of Ciudad Bolívar and several other cities in the East, after the front declared a general uprising against the government. Sympathetic civilians have assisted the rebels in their offensive, allowing them to seize almost the entire east in a matter of hours. Despite the FALN intending a swift, large-scale revolution across the country, units in the west appear to have been pushed back to the Andes, allowing the central government to survive and reconsolidate. However, the uprising has escalated into a full-scale civil war.\n\nThe group first emerged in 1961 following a split with the former liberal government of Wolgang Larrazábal and the Communist Party of Venezuela, but has become far stronger since the new, amenable government came into power. With the end of Venezuelan democracy, they have gained considerable support, both from general opponents as well as some radicalised liberals. With leftist success across much of Latin America already in play, excitement among Bolsheviks allowed the FALN to gain significant momentum. This civil war has already seen early fighting, but this will not stop at the frontlines; there is significant partisan warfare already, and an extended civil war will likely break down surviving civilian infrastructure.\n\nIt would be dangerous to allow this revolution to be completed. Not only would this allow for the extension of Judeo-Bolshevism further in the Americas, it would also greatly hamper the strength of our sphere across Latin America and the Caribbean, and lead to the loss of a major trade partner. Defeating this movement would help us to build credibility in the region, and would help preserve our access to a major international oil reserve. Currently, the west of the country has resisted this rebellion, reducing it from a full revolution, but the communists will only gain more power as the revolution goes on. If we hope to conduct an effective extermination campaign of the Venezuelan rebels, we should aim to do so quickly.\n\nMAY GERMANY BE IN SAFE HANDS"
GER_VEN.1.a: "Best to get to it, then."


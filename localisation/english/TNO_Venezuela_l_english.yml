MEX_VEN.52.a: ""

MEX_VEN.53.t: "Green to Red, Message Received"
MEX_VEN.53.desc: "The 'Papillón', officially just El Gran Café, was one of the more well-known hot spots in Sabana Grande. Situated outside a government building in Caracas, it sat beside an almost chaotic orchestra of buses, bikers and other heavy afternoon traffic hustling past the parade of policemen, street venders and well-to-do salarymen.\n\nA DFS officer sat in a parked car outside the Papillón, the engine off, tinted windows up and a pen and pad gripped in steady hands. He had spied the labor union boss around 10 minutes prior, scrawling down their name around a dozen other names along with license plates numbers for any vehicles they arrived or left in. He would be sure to pass along the information to his liaison at the Interior Ministry later that day; after all, it wasn't paranoia if they really were out to get you.\n\nThe ignition was as far as the officer got. With the itinerary penciled down and the traffic letting up, he figured to not to linger. As turned the key, the block of Semtex strapped to the undercarriage, set by the UTC commandos, the FALN's urban wing, that had tracked him down, sent him into an early retirement and his vehicle straight up into the air, scattering smouldering pieces of both into the street and sidewalk.\n\nNo one else lost their life, no one else was even injured, even the damage to the front of the Papilion was minimal. A rare, clean kill by the FALN. It would not be the last one like it, but the others would not stay so clean for very long."
MEX_VEN.53.a: "No arrests tonight."

MEX_VEN.54.t: "Green to Red, On The Air"
MEX_VEN.54.desc: "The community radio station in Maracay was as plain and unassuming as the city it called home. Quaint, homey and, blissfully, far away from the fighting. La Mura was precisely as insistent as her name implied. 'The Wall' could be impatient, perhaps overly direct and not one to be told no. Yet strangely, blessed with a voice as gentle and warm as even the most ancient of abuelas. She used that voice to great effect; reading out messages from local families, job postings, weather updates and public service announcements.\n\nThat last part was what had been harrying her since the war broke out. As she sat in front of her microphone on her cigarette break, she eyed the missive on the desk in her recording booth with an increasingly jaded eye, the same one she had been receiving from the producer via his secretary for multiple weeks now.\n\nEvery now and again, she would get calls from people asking about the government in the ongoing crisis. They would ask whether the government was negotiating peace with the FALN or not, to which La Mura would read the typed-out statements urging some version of patience or unity or restraint. The prepared statements she received came in unmarked letters with no return addressed. Maybe she was thinking too much, but she suspected that they were coming from the Mexican Embassy in Caracas, even if she had no proof.\n\nA hand-wave from her producer and the red light came on; They were about to go live, she dashed the cigarette, pulled on her headphones and readied herself for her show, prepared statements included. Someone had to read them out, didn't they?"
MEX_VEN.54.a: "The lights above the recording studio door lit up: "NOW LIVE""

MEX_VEN.55.t: "Green to Red, Early Departure"
MEX_VEN.55.desc: "Nino could not have been more normal. Tall and lean with a thin mustache, rounded glasses, and short black hair. His voice was high and whispy, his demeanor level-headed, and his mood subdued at nearly all times. Nino could not have been more normal, yet his nation was rapidly divorcing itself from any sort of normalcy by the day.\n\nHe had been filling out the necessary forms at a law office in Barquisimeto, walls lined with certificates and dusty photos of past mayors sharing handshakes with foreign diplomats. As a lawyer, he was used to red tape like this, yet that word, 'red', wasted little time in gaining a very different meaning in Venezuela. For weeks now, families from all over the city had come, gone, and would likely continue to do so for weeks to come, all inquiring how to apply for Mexican residency. 'Fleeing' was not a word people used; 'Escaping' was an absurd idea; 'Refugee' was too insulting to ponder. 'Just in case' was the word people had settled on. No one needed to know the reason behind it anymore; it was known.\n\nWhen Nino was done with the paperwork, he headed straight to the consular window he knew would review them the fastest. Blissfully, respectfully, they did not ask why, but Nino knew all he needed to. With the land routes along the Colombian border no longer safe to travel since La Violencia and the Dutch forcing illegal refugees back over the border from the shores of Curaçao and Aruba, seeking sanctuary within the Veracruz Pact nations was the only legitimate way to escape the civil war worth considering.\n\nAs he walked out the front door to his car, Nino could hear the distant sounds of the Turbio River, something that used to give him calm. Now? He couldn't tell what was louder, the rushing of the Turbio or the screams of Little Andrés in the hospital burn ward, burned shin to scalp from the bombing last month, dead at 14, another so-called 'martyr' of the UTC's revolution."
MEX_VEN.55.a: "Whatever future there was in Mexico, if there was any, was for him to find out, but not to know."

MEX_VEN.56.t: "Green to Red, Over the Road"
MEX_VEN.56.desc: "One did not need to be told where the border road near Santa Elena de Uairén led to, for even the most uneducated foreigner could not fail to recognize the Amazon rainforest, the greater breadth of which lay further on beyond the borderline into northern Brazil. Two paper cups of cheap coffee sat on the hood of a rusty yellow Chevrolet truck, situated between a Venezuelan intelligence captain and an agent of the Mexican DFS who sat next to each other.\n\nThe idle engine hummed underneath them, the headlights beaming into the deep, thick jungle brush as they sat and drank. There was no identifiable uniform between either of them, just plain clothes for a plain pair of people with a pair of plain goals. There was no introduction needed, they did not shake hands. Between when they arrived and when they would leave, there would not be a word said between them.\n\nThe envelopes said everything, as they were the reason for their arrival. One contained the names of supply couriers collaborating with the UTC guerrillas in the interior, backing the FALN's war effort. The other contained the requests for political asylum, thoroughly unofficial from the lack of a civil seal or government letterhead, all listed for individuals with the same last name, including that of the intelligence captain.\n\nThe DFS federale received his letter, the intel captain received his. They finished up their coffee before setting off on their separate ways, taking a brief moment to enjoy the local flora and fauna."
MEX_VEN.56.a: "You take what peace you can find in a place like this."

MEX_VEN.57.t: "Green to Red, Bad to Worse"
MEX_VEN.57.desc: "The records were a literal litany of the history of the country that was now to be irrevocably changed. The folders contained baptism records from the early 60s, marriage papers from the 50s, old passports from the 40s, and even further back, all carried by the growing line of people that had formed outside the Mexican consulate since before sunrise. This was the vision of the FALN victory in Venezuela, of pleading eyes, of shaking hands, of racing hearts.\n\nThe consulate staff, to their credit, was utterly devoted around the clock to clearing as many people for emigration to Mexico as they could. They stamped documents, filed requests and approved residency as quickly as their system, however much of it still officially existed, could allow.\n\nMexico was no stranger to conflict and neither was Venezuela. They both had seen conflicts like this, just not on their own soil. The men and women of the Mexican consulate did not dare lecture anyone and didn't ask for explanations. This was cruelty that the Venezuelan people were enduring, and the stall would do as much as they could to alleviate it.\n\nYet for all their efficiency and tact, they could only work so quickly for the number of people hoping to flee the Reds and whatever fate they had in store for them. Outside the consulate, the heat was building, the line was growing, and no one was leaving. Inside the consulate walls, the staff could barely hear their own voices, burying their heads in a sea of paper and ink while line after line of people begged for mercy, for any chance for a way out, for any hope of a future away from the one that awaited them on the next sunrise."
MEX_VEN.57.a: "The trials of Venezuelans are only just beginning."

MEX_VEN.58.t: "Green to Red, Business as Usual"
MEX_VEN.58.desc: "The clatter of the filing cabinet drawer was the sound of the last unofficial act of the DFS on the ground in the Venezuelan theater, or at least that concerning the Civil War. The files within contained lists of names, personal notes, and observations on key persons of interest that were never formally filed, yet the Venezuelan government was sure to use them for the future. The FALN and UTC may have been driven into the jungle, but keeping tabs on their former allies hiding in the crowd was a worthwhile endeavor. If they were to return to civilian life, that could be acceptable. If not, something more acceptable could be arranged.\n\nThe official statement from Mexico City was nothing short of dignified, if sounding a little detached. The defeat of the Communist insurgency was a real victory for the Veracruz Pact, but you almost wouldn't know that a principal ally of the VP just went through a harrowing civil war. No one along the Caribbean wanted to admit that Venezuela almost went the way of Castro, but who would after everything they had worked so hard to build, free from corrosive influences abroad?\n\nThe DFS agent left his temporary office with nothing but the clothes on his back, a doctored ID in his pocket, and a small, black suitcase. As he made his way outside, the air in Caracas was strangely in tune with the Mexican statement. Traffic ebbed and flowed like water in a stream, street vendors shouted while dogs barked on sloped sidewalks. No smoke, no fire, not anymore.\n\nThe agent ducked into the back of a taxi he had hailed, not even bothering to look back through the rear window. He would be on the first charter flight back to Mexico City and another quick taxi back to his townhome in Colonia Juárez. There was no report left to deliver, nothing else left to catalog. It was Venezuela who remained, she and her ever-enduring people."
MEX_VEN.58.a: "The sun would soon set on Lake Maracaibo, with many cool, quiet nights to follow."

MEX_VEN.59.t: "One Ant of the Colony Squashed"
MEX_VEN.59.desc: "A cell of Bolivarian military conspirators sat in an empty warehouse outside Caracas. The group was sorting through newly-delivered crates of rifles and intelligence briefings with their Iberian contact. "Coming all the way from Madrid, must be the best."\n\nThe contact with a heavy Castilian lisp responded. "Make thure everyone ith up to date. Can't have anything go wrong thith deep into the plan."\n\nIn the corner of the warehouse a small box television played the nightly news. Images showed President Caldera signing the Port of Spain Accords, flanked by the Guyanese President, [GUY.GetLeader], and the Canadian Prime Minister, [CAN.GetLeader]. One of the conspirators watching lashed out at the screen. "Just imagine, by daybreak that cocksucker will be wishing he never surrendered to the Guyanese bastards, he's a damn shame to Venezuela."\n\nA crack, the conspirators grabbed their new Iberian rifles. A combination of DIGEPOL agents and National Guard soldiers burst into the warehouse to arrest the group. When the conspirators attempted to fire, a grave expression quickly took their faces, these new guns weren't real, they'd been duped.\n\nThe Iberian, or so they had thought, dropped the lisp to speak in the clear Mexican accent of a DFS agent. "Drop them, otherwise you'll be killed." The DIGEPOL agents moved in to apprehend the conspirators and haul them out of the warehouse.\n\nAs the Mexican was leading the last one out, the conspirators' radio, left sitting on the table, crackled with Moncada Vidal's voice. "My loyal soldiers, we now stand at the moment of national liberation. All who believe in our nation, and in the strength of our men to lead it are called! Any who stand against us, soldier or civilian, is an enemy that will be dealt with as enemies are! Forward!.""
MEX_VEN.59.a: "Tonight, Caracas will burn."

MEX_VEN.60.t: "Rather Die Standing, Then Live Kneeling"
MEX_VEN.60.desc: "As President Caldera's plane descended upon Caracas, all that could be seen were rivers of people, with a sprinkle of armored vehicles, filling what were once the city's streets. As soon as the plane landed, Caldera nearly jumped right onto the tarmac and was ushered into the DIGEPOL director's car by the sharply-dressed man himself. While the car sped toward the control tower, the director briefed the President.\n\n"Luckily, Your Excellency, the majority of the attack was thwarted from our infiltration, several conspirators throughout the military have already been arrested. However, their leader, Moncada Vidal, did get away with his detachment and has seized the White Palace. He's rallying for a revolt because of the Essequibo resolution."\n\n"That rat Moncada Vidal... just get me to the people, they need to hear from me." The car arrived at the tower and the entire detail rushed inside. From inside, Caldera was patched through to national radio to address the nation.\n\n"People of Venezuela, this is President Caldera, I'm alive and well. The rebels led by Lieutenant Colonel Moncada Vidal have seized the White Palace. They have struck in the heart of Caracas using an idea of national pride to hide their oppressive goals."\n\nCaldera paused to steady his voice, continuing. "I call on all the people of Venezuela, to rise up. No matter who you are or where you are at, we must fight the threat to our revolution and democracy. The only way to beat the putschists is a united front of the people. A people who love liberty will, when all is done, be free."\n\nShortly after the broadcast had ended a plume of smoke began rising from Urdaneta Avenue. The people not only listened to their President's call, but answered it."
MEX_VEN.60.a: "The battle for Caracas had begun."

MEX_VEN.61.t: "Viva la República, Viva Venezuela"
MEX_VEN.61.desc: "Venezuelan nationals working in the Mexican embassy flowed into the streets of Caracas. Within the crowd, "Miguel" The Clerk joined the revelry, maintaining the cover that the DFS so scrupulously demanded of him, all being absorbed into the swelling crowd following President Rafael Caldera's escort. The crowd waved Venezuelan flags and sang the anthem. "¡Gritemos con brío: Muera la opresión!"\n\nThe convoy passed burning military trucks and abandoned armored vehicles, remnants of Moncada Vidal's coup, as they approached Miraflores Palace. President Rafael Caldera emerged from the convoy, with a megaphone, addressing the crowd. "From the deepest of my heart I extend my thanks, a thanks to all of you that have defended Venezuela's democracy, and her future."\n\nThe crowd occupied all of central Caracas and roared in cheers for Caldera as he continued. "The vast majority of the conspirators in this plot have already been apprehended. All of these men will face trial with their full legal rights. No matter how much they claimed otherwise, this country's strength is its constitution and its people. Just because they would break it against us, doesn't give us cause to break it against them."\n\nThe crowd erupted into applause as Caldera handed the megaphone off as he was escorted away by security. Miguel cracked a slight smile, joining the Venezuelans now signing the anthem once again. "Gloria al bravo pueblo, que el yugo lanzo, la ley respetando, la virtud y honor..." and he put greater emphasis at the start of the new verse..."
MEX_VEN.61.a: ""¡Abajo Cadenas!""

MEX_VEN.62.t: "Bad News From Home"
MEX_VEN.62.desc: "One last wave to the cameras, and Caldera was on the plane. He took his seat, breathing a sigh of relief. Despite everything, the negotiations had been a success. Another foreign-policy feather for his presidential cap. In a few minutes, he would leave Trinidad behind and return to his real work. Just as he closed his eyes to catch some much-needed sleep, a sweating, pale-faced aide rushed onto the plane.\n\n"Sir, we got word-" stammered an aide, hardly more than a boy.\n\n"Slow down, son," Caldera said.\n\n"Sorry," the aide swallowed. "Well, we called to make sure the troops near the Guyanese border got the order to stand down..." The aide gave Caldera a nervous glance. "We can't get in touch with them, sir. Any of them. And not just at the border. Whole sections of the military aren't responding."\n\n"Which ones?" Caldera asked. Maybe only a few had backstabbed him, but the aide kept rattling off names, each one slamming into him like a punch to the gut. Generals. Sergeants. Every rank had betrayed him, but rank hardly mattered in these times of shifting loyalties. And between all of them, he could still piece together one common denominator.\n\n"Moncada Vidal's people... This is his move." Caldera stood, rattling out his own set of orders. "Get in touch with Air Force Headquarters. Tell them to assume all ground forces are compromised." He turned to his stable of aides, all of whom were listening intently. "Call the Mexican embassy, I need to know what's happening in Caracas."\n\nLeaving them to their tasks, Caldera made for the cockpit. If he could beat them to the presidential palace and rally enough loyal troops to defend the capital, he might have a chance. He leaned over the pilot's chair."
MEX_VEN.62.a: ""Get me to Caracas! Now!""

MEX_VEN.63.t: "Freefall"
MEX_VEN.63.desc: "Caldera felt a slight bit of turbulence as the plane continued its steady path toward Caracas. He looked outside to see bright bursts of flame burning throughout the city and masses of people in the streets. Moncada Vidal's attempted coup had created a roiling air of discontent as the people turned against him and his Iberian masters. Once he could land at La Carlota Air Base, then he could help lead his people to final victory.\n\nAnother jolt, but this time it was worse than mere turbulence. González, a young and particularly headstrong policy aide, looked outside the opposite window. "Your Excellency, it's anti-aircraft fire!"\n\nCaldera's eyes went wide. If Moncada Vidal's forces were able to take control of La Carlota, then it meant a good portion of the military infrastructure of Venezuela was compromised. He took a look at the staff on the plane with him, their mouths pursed, and knew that they had come to the same conclusion. As he felt the plane alter course, a staffer brought him an encrypted comms system, explaining that the loyalist leadership cadre was trying to contact him.\n\n"Señor Rafael, are you ready to land? We need your support, the situation down here worsens by the minute." Caldera couldn't tell whose voice it was over the crackling line, but Caldera believed it was his Minister of Defense, Martín García Villasmil.\n\nCaldera's voice trembled. "There isn't a secure place where the plane can land. But I implore you to hold out until we can retake La Carlota, then we will return."\n\nAs he spoke the words, Caldera looked out the window and knew that it was a lie. This moment, in a plane wracked by anti-aircraft fire flying over a burning capital, would be seared into his brain as the last sight of his country he would ever see. He couldn't muster the strength to admit that he failed, to implore his loyalists to flee across the border to make it to Mexico."
MEX_VEN.63.a: "Once verbose, Caldera found that he had not the words."

MEX_VEN.64.t: "Crash Landing"
MEX_VEN.64.desc: "Rafael Caldera couldn't help but think of the plane he was in as his hearse. This was the plane that had taken him to Venezuela, the plane that showed him his capital awash in flame, the plane that had rocked back and forth against an old air-defense explosive shell that let him know that he was never coming back. While no official request had come, Caldera knew it was only a matter of time before he had to leave Trinidad, and so he decided to make it easy for the island and depart for his permanent asylum in Mexico City.\n\nThe skies were smooth, but no one felt at ease. Many could barely compose themselves, this final admission of defeat cut through any remaining illusions. They were going to a foreign land, to live and die on unfamiliar soil. They might return, but it would never be by their own hands. They had tried that already and had failed.\n\nCaldera saw González, head in his hands, and walked over to him. "González, was it? How are you doing? Did your family make it to an embassy?"\n\nGonzález looked dazed for a second, as if his brain struggled to form any sort of coherent thought. "I...don't know, Your Excellency. I haven't heard a word from them. I've been praying every night, twice even when I heard that Moncada Vidal's forces were gunning down protesters in the streets and kicking down the doors of suspected loyalists."\n\nCaldera nearly choked. The legacy of his quest for peace was blood in the streets that ran like rivers. The people who had believed in him were being hunted down by Moncada Vidal's forces. His desires for peace had burned in the fires of war. Just like González, his mind went to others who were in Venezuela. How many of them would have reached safety, finding an embassy or crossing the border? How many faces would he see in Mexico City, and how many lives would end dumped into a mass grave, known only to the fascists and the worms?"
MEX_VEN.64.a: "The dead, buried in graves. The living, buried in guilt."

MEX_VEN.65.t: "Green to Red, Red to Black"
MEX_VEN.65.desc: "From the Office of the Mexican Embassy in Caracas, Venezuela.\nTo the Office of External Relations of Mexico in Mexico City, Mexico.\n\n- With the progression of the Venezuelan war not going in the government's favor, Caracas has ceded authority of the government to a military junta led by General Pablo Antonio Flores following a bloodless coup.\n\n- Position of the military regime is entrenched, with General Flores backed by large portions of the Venezuelan military. Elections have been suspended for the duration of the conflict. Many are worried about the possibility this will continue even with the FALN defeated.\n\n- Under the current conditions, it is difficult to recommend continued support as has been up to now. But with the civil war still raging, Venezuela and her people are still in need of support from the Veracruz Pact.\n\n- Mexico City would be within legal rights via international law to justify Venezuela's expulsion from the VP, but this is to be avoided if possible. It is advisable that material aid to Venezuela should continue for the duration, with the threat of expulsion to be used as leverage to ensure the return of democratic processes on the eventual defeat of UTC/FALN forces."
MEX_VEN.65.a: "Maintain intel and material support while quieting discussion in the Veracruz Forum."
MEX_VEN.65.b: "Work to prop up the image of Flores' Junta and send further aid to the war effort."
MEX_VEN.65.c: "Allow the Veracruz Forum to condemn the Junta and cease aid until democracy is restored."

### Brazil Events

BRA_VEN.1.t: "The Client and the Contractor"
BRA_VEN.1.desc: "The Itamaraty Palace hovered over the mirror - like the surface of its reflecting pool like a concrete mirage materialized from Kubitschek's dreams in the middle of the plateau. Walther Moreira Salles stood by the panoramic window of his office, through which the harsh, almost surgical light of the capital poured, bouncing off Niemeyer's snow-white arches. In this temple of modernism, where silence seemed part of the architectural design, the presence of the bustling FBI men felt like a violation of the laws of aesthetics - as if someone had tracked construction mud into a sterile operating room.\n\nGrainy photos landed on the polished surface of Salles's table: empty barracks in Venezuela, silhouettes of Dominican frigates off the Colombian coast, lists of missing officers. Socialists in Caracas, a mutiny on the doorstep, the Dominican Republic preparing an invasion.\n\n"We are stretched thin, Mr. Minister," the FBI agent spoke harshly, chopping his sentences. "Our resources are burning in South Africa. Washington cannot open a second front. This is your job now. Brazil must become the shield of democracy on the continent."\n\nSalles turned slowly, adjusting the impeccable knot of his tie. Another 'polite' request. Brazil was being asked to pull the chestnuts out of the fire while Uncle Sam was busy with another blaze.\n\n"We understand the gravity of the situation," Salles said. "Brazil will fulfill its duty to continental security. I will contact the SFICI immediately. If a storm breaks in Caracas, we will be ready."\n\nWhen the Americans left, he sank wearily into his chair and poured himself a whiskey. He had just been handed a dirty shovel to clear the shit that Nixon was afraid to touch with his own hands."
BRA_VEN.1.a: "Atlas shrugs... involuntarily."
BRA_VEN.1.tt: "§!With the [USA.GetFlag] §mU.S.§! stretched thin, [BRA.GetFlag] §nBrazil§! must take on the responsibility of aiding the §<OFN§! [VEN.GetFlag] §Sally§! in the Northern Andes to protect democracy against the [IBR.GetFlag] §Oforces of§! §nreaction§!.\n§F------------------------------------\n§YIn the coming days, an event chain will be unlocked to aid Mexican efforts in the proxy.§!\n------------------------------------"

BRA_VEN.2.t: "Meeting In The Andes"
BRA_VEN.2.desc: "The throbbing pain on his knees was familiar to Carlos. He remembered it from that morning with Pa, hiking up Pico Alto in Ceará. The view was familiar, too, with rolling blankets of fog surrounding the hillsides, and orange sun hatched onto the trees.\n\nA nice view to build a base around, he supposed, marching towards the red flag hanging off a branch ahead. From green shadows appeared the iron glint of gun barrels. It was well known to the SNI that the Colombian Revolutionary Union had forces embedded in the mountains of Mérida, across the border in Venezuelan territory. To "facilitate cooperation," it was said. The rifles pointed to his every side didn't inspire that sentiment.\n\n"Of course we have heard of the fascists at the border," spat one fighter, flies dotting his face. "We were the ones to verify your intelligence."\n\n"And what will you do?" Carlos paced, guns trailing his steps.\n\n"Is it your business?" Asked the oldest of the guerrilleros, gaunt and covered in gauze.\n\n"We have utmost concern for the security of Venezuelan democracy," Carlos declared, earning snickers from all around. Good. Laughs were oil for diplomacy.\n\n"Not more than us. Venezuela is our closest friend," said the senior. "We will help them against the invasion, as much for their sake as for ours."\n\nCarlos clasped his hands, and dug out a map. "Then you won't have a problem making a short trek to El Vijía, as well."\n\nThe guerrilleros glanced at where he pointed. "The air base in Zulia?"\n\n"Involved in the coup, we believe. Pay them a visit, won't you?"\n\nThey shook their hands on it, and Carlos descended back down the trails of gray clouds. The ghost of their guns pinned to his back never left."
BRA_VEN.2.a: "The guerrilla poises for a fight."

BRA_VEN.3.t: "Bloody Search For Truth"
BRA_VEN.3.desc: "The air stank with sweat and iron, and Carlos was having a bad day. He dangled his gun between his legs.\n\n"I know you really, really want it to stop. Can see it in your eyes."\n\nA brief silence, filled by the mewls of that man, the man they'd captured, SIM Dominican bastard, that they'd tied to a chair here on a pretty, newly-painted shack outside of San Cristóbal, where the screams wouldn't be heard.\n\nPop! Rodrigo pulled nails clean like a mother removing bandaids. He shushed the Dominican, put his bloody hand on the vomit-stained gag. It failed to quell the squealing, and so Carlos waved and Rodrigo removed the gag, and the prisoner convulsed between strained, deep breaths and groans. His third removed nail landed with a neat clank on Rodrigo's tin plate.\n\n"Are we going to lose you too?" Carlos asked, nodding to the other prisoners. One was sprawled on the floor, simmering in his own blood. Made a stupid move and forced Carlos to shoot him. The other didn't have the stomach and passed out on the first nail. They didn't have enough cold water to wake him.\n\n"I'm not," the man mumbled. "I'm not Dominican."\n\n"And we're Brazilians in Venezuela. Don't care who you are. We care for information. For the last time: What do you know about the attack on San Cristóbal?"\n\n"They have eyes on me."\n\n"We can protect you from harm," Carlos lied.\n\n"I can't," he screamed. "They know where my mother lives. They know where I live."\n\n"We know that too." Carlos lifted his gun, and finished the interrogation with a shot to the neck and chest. Another bullet was spent on the unconscious victim."
BRA_VEN.3.a: "Another dud. Let's hatch a better plan after disposing of these."

BRA_VEN.4.t: "Holding Breath"
BRA_VEN.4.desc: "ULTRA SECRETO\nSOMENTE PARA OS OLHOS DO PRESIDENTE\n\nDO ESCRITÓRIO DO SERVIÇO NACIONAL DE INFORMAÇÕES\nSubject: Imminent coup in Venezuela\n\n1. Rising levels of military activity along the Colombian border suggest that the coup attempt is expected to occur in a matter of days. While it is not currently within our means to pinpoint a specific timeframe and location for the initial assault, suspicious troop movements all across the country ensure that no area can remain outside our vigilance.\n\n2. With potential insurgent forces lying in the vicinity of every major population center, it is of paramount importance that these isolated groups must not be allowed to communicate with each other. Striking at the rebels' organisational structure is to be considered our number one priority if we are to prevent their success.\n\n3. Despite the best efforts of our local field agents, constant sabotage operations from meddling fascist parties have left the issue of the impending conflict uncertain. Given its proximate nature, it is almost certain that whatever operations we have already conducted will unfortunately have to suffice.\n\n4. Nonetheless, we remain confident that our mission in Venezuela was, by and large, a success, and will prove critical to the region's defense, should worse come to worst.\n\nFor the time being, the cards are in the hands of the local government."
BRA_VEN.4.a: "ORDEM E PROGRESSO"

BRA_VEN.5.t: "Signing Off"
BRA_VEN.5.desc: "Carlos granted a passing smile at the pair of armed guerrillas he met along the way, earning not much more than a vaguely annoyed grunt by way of response as they kept driving a restrained, hooded figure in military fatigues. He'd gotten used to this treatment: most of the people here held nothing but either contempt or confusion over his presence among them; and that was for those even aware of it. Not that he minded, though. He was in quite a good mood now that he had just finished filing his report, and had decided to take a final stroll outside before his upcoming departure from Venezuelan soil.\n\nBy now, most of the bodies had already been cleared from the Air Base's floor, with the remaining stragglers still clumsily ordered in lines of nameless bags in front of a nearby hangar. The other lucky few had either been picked off as they tried to flee, had scattered to the hills, or probably fallen to an ambush along the banks of the Turbio. Either way, the putschists had failed to grasp a proper hold on the city. Whatever lingering pockets of resistance would either be dead or arrested by the next few hours.\n\nHis intel had been correct. Hours ago, Castro León's goons had tried to seize Barquisimeto from the southwest, with the attempt finding an unfortunate stop at the hands of the pro-government militias that had received advance warning. Without this crucial logistical line to Puerto Cabello, it was only a matter of time before insurgent forces east of Valencia would fall like dominoes. He had already heard reports of disorganized rebel cells in San Felipe getting caught off-guard by DIGEPOL raids.\n\nFighting was still raging in most of the country, yet for all intents and purposes, the coup had been smothered in the cradle before it could even reach Caracas. Though it was a close call, he couldn't help but feel a sense of satisfaction at this turn of events. His own part in it, though, was over. He smiled, making his way back inside to pack his things."
BRA_VEN.5.a: "In most minds, his part will never have even existed in the first place."

BRA_VEN.6.t: "Kingmakers"
BRA_VEN.6.desc: "ULTRA SECRETO\nSOMENTE PARA OS OLHOS DO PRESIDENTE\n\nDO ESCRITÓRIO DO SERVIÇO NACIONAL DE INFORMAÇÕES\nSubject: Report on the coup attempt in Venezuela\n\n1. Despite finding initial success in seizing the city of San Cristóbal, insurgent forces led by former General Jesús María Castro León failed to build sufficient momentum to push toward other key areas, even after being shortly joined by Colombian reactionary dissidents from Cúcuta and the support of Iberian intelligence.\n\n2. Facing disorderly communication and unreliable supply lines, attempts to capture cities such as Maracaibo, Barquisimeto, and Maracay were all met with failure, thwarting any hope for the putschists to gain enough hold to undertake a decisive assault on the country's capital of Caracas.\n\n3. Efforts from the coup leadership to regroup and organize their scattered forces were further paralysed by a crippling worker strike in their home base of San Cristóbal. After hours of continued fighting with government loyalists, Castro León ordered his troops to stand down, and is now in the process of being incarcerated in the Cuartel San Carlos while he awaits a military trial for high treason.\n\n4. With the position of Venezuela's democratic government secured in major part thanks to our activities in the region, this fortuitous outcome is not only expected to bolster our diplomatic ties with local authorities, but also represent an increase in trust from our American partners; all while proving to be a serious blow to Iberian efforts to pull the nation into their own sphere."
BRA_VEN.6.a: "ORDEM E PROGRESSO"

BRA_VEN.7.t: "Lights Out"
BRA_VEN.7.desc: "As soon as he'd finished typing the last words on the fax machine, Carlos slumped back on his chair. He briefly considered catching a few minutes of sleep, ignoring the better part of his mind warning him otherwise. He wondered how much time he truly had. For now, in the dead of the night, the streets of Tamaca were still eerily quiet; though by morning, the chaos down south would have probably spilled over here too. At least, he thought, he still had the luxury of rewarding himself with a smoke.\n\nEarlier in the day, the putschists had seized control of the air base back in Barquisimeto, while he had barely managed to scrape away with his life. By now, the entire city was probably under their control. He pondered his own options. With the whole west of the country falling into rebel hands, any hope of fleeing toward Colombia was compromised. His only hope would be to continue northward and chance upon a ferry that would bring him to Curaçao.\n\nFor now, he enjoyed a quiet moment of pause, the fumes delightfully filling his lungs as he strolled to fetch a jerrycan laying in the other corner of the safehouse. Neatly gathered at the center of the basement was a significant stack of records. Mission briefings. Networks of contacts. Intel files of potentially useful informants. Guerrilla boys he had sent to their deaths. Forged passports. Associates from other cells. He shook his head, before starting to pour the gasoline.\n\nHis eyes lingered on some of the faces that were slowly getting tainted by the thick liquid. Even now, a part of him still hoped that the radio would spark with anything but the same static it had sprouted for the past few hours. He had tried in vain to reach his fellows in San Cristóbal, Maracaibo, or even Cabudares. Nothing to comfort him that they'd had much better luck than he. He sighed, drawing one last puff from the cigarette before it met the document pile, watching as the flames swiftly engulfed his efforts for the past few months."
BRA_VEN.7.a: "He still had a long night ahead of him."

BRA_VEN.8.t: "Bad Beat"
BRA_VEN.8.desc: "ULTRA SECRETO\nSOMENTE PARA OS OLHOS DO PRESIDENTE\n\nDO ESCRITÓRIO DO SERVIÇO NACIONAL DE INFORMAÇÕES\nSubject: Report on the coup attempt in Venezuela\n\n1. Hours after seizing the city of San Cristóbal, insurgent forces led by former General Jesús María Castro León managed to secure control of most of the western half of the country. With backing from allies in the neighbouring Colombian city of Cúcuta, the putschists proceeded to capture other key areas, such as the southern Vega de Aza road or a major airbase in El Vigía.\n\n2. A worker strike in San Cristóbal, hoping to cripple logistical efforts, was promptly crushed by local rebel troops. With loyalist military personnel unable to easily threaten the coup's home base, Castro's León mutineers found little to no resistance as they went on to subdue critical cities such as Maracaibo and Barquisimeto, further pushing toward the heart of the country.\n\n3. Mere 12 hours after the fighting began, Caracas officially fell, with the government being promptly evacuated when rebel forces entered the confines of the city. With the capital firmly under their control, the coup leadership wasted no time in relocating their headquarters to the vacated Palacio de Miraflores, where Castro León has now been sworn President.\n\n4. Owing to the total collapse of the Venezuelan democratic apparatus, this outcome is a disaster for our diplomatic efforts in the region, with the putsch leadership openly hostile to our administration. While the country is now set to grow further ties to the Iberian sphere, we must also expect American authorities to be seriously displeased by our mishandling of the situation."
BRA_VEN.8.a: "ORDEM E PROGRESSO"

BRA_VEN.9.t: "A Defector Sequence"
BRA_VEN.9.desc: "The man in the brown zoot suit entered the embassy building at 10:23 PM, Sunday, and had yet to be seen again five days later. At 11:59 AM on Friday, his status as an asset for DIGEPOL was terminated, his name crossed over, and his handler reprimanded. Promptly, a cable was sent from the Venezuelans to Brazilian authorities; the Iberian embassy was harboring a defector.\n\n"Nothing we can do about it," it was said. "The pig's got diplomatic refuge."\n\nA cigarette was smothered. "And we won't be stepping on the Iberians' toes over this shit. Their defector, their problem."\n\nIt seemed a closed matter for Brasília's intelligence bigwigs, and the Venezuelans wouldn't make a big deal of it, if just to save face. It didn't reach the ears of any higher offices, let alone the president, and nobody wanted the international incident that would erupt. The meeting was closed until a young officer spoke up.\n\n"Could we not take advantage of this? We could make it up to the Venezuelans by monitoring the embassy, letting them know of any other suspicious visitors."\n\nA senior took a pause. "What do we gain?"\n\nHe grinned. "They'll owe us a favor.""
BRA_VEN.9.a: "And in the world of intelligence, favors are everything."
BRA_VEN.9.b: "Shut the upstart down. This is the Venezuelan's mess, not ours."

### Iberian Events
IBR_VEN.1_trujillo.t: "Audience with the Executioner"
IBR_VEN.1_trujillo.desc: "The office of the SIM chief in Ciudad Trujillo resembled an expensive recording studio: walls lined with sound-absorbing panels, reels of the latest Ampex tape recorder turning slowly on the desk. Johnny Abbes García, with the appearance of a bored clerk and the reputation of a butcher, didn't even take off his dark glasses. He lazily turned a dial as Castro León hammered out his words.\n\n"I chose exile not out of fear, Señor Abbes," the Venezuelan General stood at attention, but his jaw muscles were twitching. "I left because Caracas is choking on Red bile. The democrats let socialists into the Senate while officers sit in barracks like castrated dogs. Give me resources, and on March 25th, I will burn out this infection."\n\nAbbes pressed "stop." The click of the key sounded astonishingly loud to Castro León's ears.\n\n"Exile..." the SIM chief's voice was insinuating, devoid of emotion. "Prudence is a virtue of a clerk, not a soldier. But El Jefe understands your hatred. Do you know what Generalissimo Franco answered when asked if he was ready to shoot half of Spain to defeat the Reds? He said: "I will do it at any cost." Venezuela now demands the same price."\n\nHe stood up, adjusting the impeccable knot of his tie, and approached the former General.\n\n"El Jefe is ready to pay this bill. Iberia will provide the tools. But remember: the SIM keeps strict accounts. If you fail, we will write you off. And believe me, you won't like it.""
IBR_VEN.1_trujillo.a: "The enemy of my enemy is my tool."

IBR_VEN.1_rebel.t: "Missione Caracas"
IBR_VEN.1_rebel.desc: "In the spacious penthouse of the Hotel Courtleigh, massive mahogany blinds sliced the dazzling Caribbean sun into thin golden strips falling onto the cool polished terrazzo floor. In the corners of the room, furnished with low rattan furniture, ceiling fans spun their blades lazily, vainly attempting to disperse the cigar smoke.\n\nLuis M. González-Mata, lounging languidly in an armchair, hypnotized the ice cube in his glass of rum with his gaze. "...In Tangier, a contact tried to sell me a list of CIA agents. I bought it. And a week later, he came back to sell me the names of those interested in that list." The Spaniard laughed quietly, raspily. "I paid the second time too, General. Only in lead this time. In our trade, greed is forgiven, but stupidity - never."\n\nCastro León did not smile. He sat on the edge of the sofa, straight as a bayonet, his face grey with tension. "Save your memoirs for the publishers, González. Trujillo is dead. Who will pay for my 'adventure'? Who gives the guarantees?"\n\nThe spy instantly tensed, shedding the mask of a bored playboy. His gaze became sharp. "Trujillo was a useful but blunt instrument. Now we work directly. Madrid is taking this project under its wing. The ships are already en route, holds packed to the brim with rifles."\n\nHe leaned forward, and a strip of light fell across his eyes, turning them into slits. "But take note, my friend: Iberia pays generously, but demands more strictly than the late 'Chapitas'. On March 25th, you must take San Cristóbal. If you fail Madrid's investment... I fear my next tale will be about how a Venezuelan general 'accidentally' fell overboard in the open sea.""
IBR_VEN.1_rebel.a: "New sponsor, old methods."

IBR_VEN.2_trujillo.t: "Frequency of Redemption"
IBR_VEN.2_trujillo.desc: "San Cristóbal, Venezuela was drowning in a dense milky shroud of "neblina" - the Andean fog that muffled footsteps and blurred the outlines of reality. In this haze, the headlights of rare cars seemed like wandering wisps, and steep streets climbing up the slopes vanished into nowhere after just ten meters. The SIM agent shivered, watching moisture settle on his coat lapels in heavy, mercury-like drops. The agent pulled his coat tighter. Accustomed to the sticky heat of Ciudad Trujillo, this city seemed like a refrigerator where someone forgot to turn off the light. The streets climbing the slopes were deserted-a perfect setting for a conspiracy.\n\nHe walked beside the Venezuelan officer, whose stride betrayed the nervousness typical of amateurs.\n\n"Forget the tanks, Colonel," the Dominican spoke. "Tanks are brute force. If Caracas doesn't hear us in the first half-hour, we are corpses. Radio stations, local repeaters here in Táchira - that's where the power lies. Without the airwaves, your garrisons will remain blind kittens.\n\nThe agent knew what he was talking about. In the basements of the secret police, he had spent years learning how information breaks the will faster than pliers.\n\nThey turned a corner, and the silhouette of the Iglesia del Divino Redentor church emerged from the fog. Its modest, almost ascetic facade seemed like a fortress wall in the twilight. The agent stopped at the steps, looking at the cross dissolving into the sky.\n\n"Comms must be established before the first rooster crow, Colonel. Otherwise, the only thing left for us is confession inside.""
IBR_VEN.2_trujillo.a: "Silence on the airwaves is death."

IBR_VEN.2_rebel.t: "Frequency of Redemption"
IBR_VEN.2_rebel.desc: "San Cristóbal, Venezuela was drowning in a dense milky shroud of "neblina" - the Andean fog that muffled footsteps and blurred the outlines of reality. In this haze, the headlights of rare cars seemed like wandering wisps, and steep streets climbing up the slopes vanished into nowhere after just ten meters. The Iberian agent shivered, watching moisture settle on his coat lapels in heavy, mercury-like drops. The agent pulled his coat tighter. Accustomed to the sticky heat of Córdoba, this city seemed like a refrigerator where someone forgot to turn off the light. The streets climbing the slopes were deserted-a perfect setting for a conspiracy.\n\nHe walked beside the Venezuelan officer, whose stride betrayed the nervousness typical of amateurs.\n\n"Forget the tanks, Colonel," the Spaniard spoke. "Tanks are brute force. If Caracas doesn't hear us in the first half-hour, we are corpses. Radio stations, local repeaters here in Táchira - that's where the power lies. Without the airwaves, your garrisons will remain blind kittens.\n\nThe agent knew what he was talking about. In the basements of the Dominican secret police, before the regime fell, he had spent years learning how information breaks the will faster than pliers.\n\nThey turned a corner, and the silhouette of the Iglesia del Divino Redentor church emerged from the fog. Its modest, almost ascetic facade seemed like a fortress wall in the twilight. The agent stopped at the steps, looking at the cross dissolving into the sky.\n\n"Comms must be established before the first rooster crow, Colonel. Otherwise, the only thing left for us is confession inside.""
IBR_VEN.2_rebel.a: "Silence on the airwaves is death."

IBR_VEN.3.t: "Hollow Minds"
IBR_VEN.3.desc: "The Puerto Cabello airbase was quiet, save for the distant groans of the ocean and windy gusts beating down on rusted plane parts. Three men, two of them pilots, stood beside a grounded bomber. In the midnight dark, their low voices stuck out in the hangar, echoing talks of dissent, revealing the calm before the storm.\n\nThe stranger, talking with a slighted Spanish accent foreign to Venezuela, took out a folder, passing annotated pages to the hands of both pilots. "These are your targets. Loyalist encampments within Puerto Cabello. Munition depots. Fortín Solano too, just in case."\n\nOne pilot stood up straight, broad-shouldered and eager, directing his arm into an unwavering salute without even glancing at the details. His comrade lingered on the pages, still staring at the pictures of neighborhoods he'd have to bomb. "This... this is too close to the neighborhoods. Thousands live there. What if we accidentally hit them?"\n\nThe stranger walked up to the hesitant pilot, fixing his gaze and laying his hand over the pilot's shoulder. "Don't miss then, comrade. History will not remember who you killed, but what part you played in our grand reclamation of our home, Venezuela."\n\nA long silence followed, with the pilot's face physically shifting in accordance with his emotions. His loyalty clashed with his hometown. Puerto Cabello was where he'd grown up, where his memories lay. But he couldn't truly call it his home anymore, nor its people his neighbors, as long as the socialist mob ruled Venezuela.\n\nThe pilot closed the folder, tucking it under his arm. "Anything for the reclamation. I only hope God will be forgiving.""
IBR_VEN.3.a: ""God will have no part in this. All of Venezuela is already damned to hell.""

IBR_VEN.4_trujillo.t: "One-Way Ticket"
IBR_VEN.4_trujillo.desc: "Kingston was drowning in a blinding white haze of midday sun that ricocheted off the colonial balustrades of the hotel terrace and dissolved the silhouettes of the Blue Mountains on the horizon into the trembling air. Oscar Tamayo Suárez, former commander of the National Guard, pushed away a glass of warm gin with disgust. Even in a colorful tourist shirt, he looked like a loaded mortar - massive, with a heavy, sullen gaze, he clearly didn't fit into the relaxed rhythm of the Canadian colony.\n\nWhen a shadow fell across his table, Tamayo didn't even flinch. He recognized the walk. "You'll rust here, Oscar," Jesús María Castro León sat down opposite without invitation, nodding to the waiter. "Enough drinking this English piss. Time to return to proper rum in Caracas."\n\nTamayo smiled crookedly, remembering the Barcelonazo that cost him his epaulets. "Last time I listened to enthusiasts like you, I had to flee the country in a trunk," he rasped. "I have no desire to play suicide-hero for pretty headlines again."\n\n"This time we play for keeps." Castro León lowered his voice, leaning closer. "Iberia is paying. Chapitas, El Jefe, is covering. San Cristóbal is just the spark. I need a man who will take the National Guard by the throat when the fire starts. I need you."\n\nTamayo was silent, twirling a cigar in his fingers. Caution and old, unquenched ambition fought in his eyes. "Fine," he finally threw out. "I'm in. But on one condition. When we kick these democrimpotents out of the palace, I'm not going to stand in the honor guard. A seat on the Junta. An equal among equals. Or go to hell with your revolution."\n\nCastro León smiled and extended his hand. "Agreed, General. Now finish your drink.""
IBR_VEN.4_trujillo.a: ""A plane awaits us, and Venezuela awaits a good thrashing.""


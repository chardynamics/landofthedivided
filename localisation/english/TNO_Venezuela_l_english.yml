IBR_VEN.4_rebel.desc: "Kingston was drowning in a blinding white haze of midday sun that ricocheted off the colonial balustrades of the hotel terrace and dissolved the silhouettes of the Blue Mountains on the horizon into the trembling air. Oscar Tamayo Suárez, former commander of the National Guard, pushed away a glass of warm gin with disgust. Even in a colorful tourist shirt, he looked like a loaded mortar - massive, with a heavy, sullen gaze, he clearly didn't fit into the relaxed rhythm of the Canadian colony.\n\nWhen a shadow fell across his table, Tamayo didn't even flinch. He recognized the walk. "You'll rust here, Oscar," Jesús María Castro León sat down opposite without invitation, nodding to the waiter. "Enough drinking this English piss. Time to return to proper rum in Caracas."\n\nTamayo smiled crookedly, remembering the Barcelonazo that cost him his epaulets. "Last time I listened to enthusiasts like you, I had to flee the country in a trunk," he rasped. "I have no desire to play suicide-hero for pretty headlines again."\n\n"This time we play for keeps." Castro León lowered his voice, leaning closer. "Iberia is paying, more eager than ever after the fall of Chapitas with Puerto Plata. San Cristóbal is just the spark. I need a man who will take the National Guard by the throat when the fire starts. I need you."\n\nTamayo was silent, twirling a cigar in his fingers. Caution and old, unquenched ambition fought in his eyes. "Fine," he finally threw out. "I'm in. But on one condition. When we kick these democrimpotents out of the palace, I'm not going to stand in the honor guard. A seat on the Junta. An equal among equals. Or go to hell with your revolution."\n\nCastro León smiled and extended his hand. "Agreed, General. Now finish your drink.""
IBR_VEN.4_rebel.a: ""A plane awaits us, and Venezuela awaits a good thrashing.""

IBR_VEN.5_trujillo.t: "The Last Hour of Silence"
IBR_VEN.5_trujillo.desc: "IBERIAN INTELLIGENCE SERVICE - INTERCEPTED CORRESPONDENCE\n\nAn incoming letter from exiled Venezuelan general Jesús María Castro León addressed to the head of Dominican SIM, Johnny Abbes, has been seized. The following is its unaltered content:\n\nTo my esteemed friend, Johnny Abbes,\n\nThe mission of our forces will commence at 0420, March 25th. The hour is steadily arriving, and our banners are poised to rise once again over Caracas. Once the signal is sent, Venezuelan loyalists will be decimated. The barrack doors will open. The bombs will drop. And San Cristóbal will surrender.\n\nWe have thousands of troops anxiously waiting. We have hundreds of pilots trained to the best of their ability. We have hearts and souls driven by nothing but the will to drive these socialist bureaucrats out of Venezuela. And of course, we have allies, like the Dominican Republic, ready to come to our aid.\n\nHowever, as confident as I may sound, and even as I have unwavering confidence that my men can carry out their duties, I am no fool. Should we fail, all I ask is one seat on a plane to Santo Domingo. Not only is it about survival, but also about continuing the fight.\n\nI will accept nothing less than total victory. And I only ask that we beseech God for this noble day.\n\nWith unshaken resolve,\nJesús María Castro León"
IBR_VEN.5_trujillo.a: "Godspeed."

IBR_VEN.5_rebel.t: "The Last Hour of Silence"
IBR_VEN.5_rebel.desc: "IBERIAN INTELLIGENCE SERVICE - INTERCEPTED CORRESPONDENCE\n\nAn incoming letter from exiled Venezuelan general Jesús María Castro León addressed to the office of the Iberian intelligence services has been received. The following is its unaltered content:\n\nTo my esteemed friends in Madrid,\n\nThe mission of our forces will commence at 0420, March 25th. The hour is steadily arriving, and our banners are poised to rise once again over Caracas. Once the signal is sent, Venezuelan loyalists will be decimated. The barrack doors will open. The bombs will drop. And San Cristóbal will surrender.\n\nWe have thousands of troops anxiously waiting. We have hundreds of pilots trained to the best of their ability. We have hearts and souls driven by nothing but the will to drive these socialist bureaucrats out of Venezuela. And of course, we have allies, like the Iberian Union, ready to come to our aid.\n\nHowever, as confident as I may sound, and even as I have unwavering confidence that my men can carry out their duties, I am no fool. Should we fail, all I ask is one seat on a plane to Madrid. Not only is it about survival, but also about continuing the fight.\n\nI will accept nothing less than total victory. And I only ask that we beseech God for this noble day.\n\nWith unshaken resolve,\nJesús María Castro León"
IBR_VEN.5_rebel.a: "Godspeed."

IBR_VEN.6.t: "The Road Winds South"
IBR_VEN.6.desc: ""Where the fuck is Maracaibo? Did it drown in that damn lake?" - Matías Vega Guerra flicked his cigarette butt into an overflowing ashtray and collapsed into an armchair, violently loosening his tie. "El Cabito took San Cristóbal, great. Fanfares, flowers, the whole lot. But where is the support from the north?"\n\nAntónio Fontes, imperturbable as a tombstone, merely turned a page of the report with care. In the smoke-filled chaos of the safehouse, he looked as if he were dressed for the opera.\n\n"Quiet. Your temper is jamming the airwaves more than the loyalist saboteurs." - The Portuguese offered his colleague a glass of water, but Matías waved it off and reached for the bottle of brandy. "The situation is shit, Matías. Castro León sits in San Cristóbal. Maracaibo is silent. The El Vigía garrison is on the line, but without the "City by the Lake," they are cut off."\n\n"Silent?" Matías let out a nervous chuckle, pouring drinks into two glasses. "If they stay silent for another hour, the loyalists will nail the coffin shut. And our General will turn from the savior of the nation into just another idiot shot against a wall."\n\n"Either treachery, or cowardice, or someone cut the wires." Fontes accepted the glass, and for a second, a weary solidarity flashed in his eyes. "In any case, we are screwed. A drink, Matías?"\n\n"To us not having to flee this place in women's dresses, António.""
IBR_VEN.6.a: "Let's hope for the best."

IBR_VEN.7.t: "...And Experience Comes From Bad Judgement"
IBR_VEN.7.desc: ""Weep like a woman for what you could not defend like a man!"" Matías Vega Guerra slammed the newspaper onto the table so hard the ashtray jumped. "Remember what his mother told Boabdil when he surrendered Granada? El Cabito just outdid the last Sultan. Did you see this photo? He's handing over his cap! His cap, António! Not his sword, not his life, but his fucking cap, joder!"\n\nAntónio Fontes methodically fed documents into the fireplace. Zip. The crackle of fire. There was more fatalism in that sound than in the Spaniard's entire tirade, now barking "...La madre que lo pario!".\n\n"Leave the Reconquista to the historians, Matías. This isn't Granada, it's San Cristóbal, and it wasn't defeated by Catholic Monarchs, but by a bus drivers' union." The Portuguese adjusted his glasses, watching the lists of agents burn. "Prosaic? Undoubtedly. But our little Napoleon forgot that an army cannot march if there is no one to bake bread and pump gas."\n\nMatías collapsed onto the sofa, covering his face with his hands, as if trying to erase the image of the humiliated General from his memory.\n\n"And now he's going to San Carlos, while we sit here like rats on a sinking galleon, burning the sails. Madrid will draw and quarter us."\n\n"Madrid is far away." António walked to the bar and filled two glasses without spilling a drop. - "Drink. Tomorrow we'll think about how to get that idiot out of his cage before he starts singing. But today... today we drink to the fact that experience is just a pretty name for our mistakes."\n\n"You're a callous son of a bitch, António."\n\n"I know. I know.""
IBR_VEN.7.a: "And somewhere, the ghost of Simón Bolívar is laughing."

IBR_VEN.8.t: "Learning from Defeat"
IBR_VEN.8.desc: ""The Château d'If has fallen, António!" - Matías burst into the room, waving a cipher like a winning lottery ticket. "Our Edmond Dantès has slipped out of the bag! "Package delivered, sea calm." They smuggled him right out from under the jailers' noses while they were probably still finishing their morning coffee!"\n\nThe Spaniard poured himself a brandy without even sitting down, his energy filling the cramped safehouse to the brim.\n\n"It's a plot straight out of a novel! San Carlos, an impregnable fortress... and there's General Castro León, already breathing the salty air of Aruba, making obscene gestures toward the Venezuelan coast."\n\nAntónio Fontes, standing by the window watching a patrol on the street, allowed himself a rare, barely perceptible smirk. He did not share his colleague's enthusiasm but appreciated the flawless mechanics of the execution.\n\n"Iberia doesn't throw away tools, even if they've been blunted by the owner's stupidity." The Portuguese turned, glasses glinting. "A living martyr in Madrid is more useful than a dead loser in Caracas. Now we have a ghost. We will rattle this ghost's chains in the newspapers until the local "democrats" develop a nervous tic."\n\nMatías clinked his glass against his friend's glass, which the latter hadn't even had time to raise.\n\n"You're an incorrigible cynic, António. But, damn it, what a beautiful move! To ghosts?"\n\n"To those who always return.""
IBR_VEN.8.a: "Sometimes victory lies in simply not losing."

IBR_VEN.9.t: "Judgement Day"
IBR_VEN.9.desc: """Fuente Ovejuna," António!" - Matías Vega Guerra circled the safehouse in downtown Caracas, brandishing a fresh telegram like a rapier. Behind the tightly drawn curtains, the capital slept uneasily, unaware that the provinces were already burning. "Maracaibo, Barquisimeto... Cities are falling at El Cabito's feet like overripe fruit."\n\nAntónio Fontes, settled in a deep armchair with a glass of port, merely raised a skeptical eyebrow, wiping his glasses with the corner of a handkerchief. Unlike his colleague, he preferred the prose of accounting reports to the poetry of barricades.\n\n"The main thing is that our Don Quixote doesn't mistake windmills for giants, Matías. Epics are good on paper, but reality is more complicated."\n\nThe radio on the table, tuned to the rebels' frequency, interrupted their banter. Through the static, Castro León's voice broke through - dry, hard, devoid of any theatricality:\n\n"...Soldiers and citizens! Do not let initial victories cloud your vision. The liberation of the provinces is only the beginning. The enemy is still dug in at the heart of the nation, in Caracas, and as long as he is there, Venezuela is in danger. We will not stop halfway. We will not sheathe our swords until the banner is raised over Miraflores Palace. The march on the capital continues. Victory will be absolute!"\n\n"Did you hear that? No windmills. This guy has the grip of a conquistador. Let's drink, António. Looks like we'll be signing new treaties soon!""
IBR_VEN.9.a: "There was no jubilation, only the work that remained to be done."

IBR_VEN.10.t: "Dinner on the Edge of the Abyss"
IBR_VEN.10.desc: "Matías Vega Guerra stabbed a juicy piece of meat with his fork, demonstratively ignoring the moans of wounded officers behind the wall of the Iberian embassy's dining room. War is war, but dinner must be served on schedule.\n\n"Leoni..." the Spaniard drawled, examining the ruby wine in his glass against the light. "You know, António, this is a perfect example of a chronicle of proclaimed infirmity. He dared to try on Betancourt's boots, but his withered legs drowned inside them; he stumbled on level ground, tangled in the laces of his own power. On the surface - a man who belongs on a park bench feeding pigeons. He sat in Miraflores with a blissful smile while the horizon turned black, likely not even grasping the essence of the papers slid under his nose for signature. Poor bastard. And the army looked upon him with the same cold impatience with which heirs await the passing of a senile uncle."\n\nAntónio Fontes, methodically cutting his steak into geometrically perfect squares, merely nodded coldly, not lifting his eyes. "Weakness provokes a predator far more than cruelty, Matías. Did that senile fool think his dignified grey hair commanded respect? Like hell. It commands nothing but squeamishness and the urge to shoot him out of pity, like an old dog."\n\nMatías sighed, saluting his colleague with his glass. "To those who have rotted alive but forgot to lie in the coffin, António."\n\nThey didn't have time to finish their drinks. The doors burst open with a crash that made the candle flames in the candelabras shy away. On the threshold stood a captain in uniform.\n\n"Señores!" he exhaled, sliding down the doorframe. "It's all over. The Guard is fleeing. Miraflores has fallen!""
IBR_VEN.10.a: "Tell the kitchen to open the champagne."

IBR_VEN.11.t: "Dinner on the Edge of the Abyss"
IBR_VEN.11.desc: "Matías Vega Guerra stabbed a juicy piece of meat with his fork, demonstratively ignoring the moans of wounded officers behind the wall of the Iberian embassy's dining room. War is war, but dinner must be served on schedule.\n\n"Barrios..." the Spaniard drawled, examining the ruby wine in his glass against the light. "You know, António, this is the tragedy of a pacifist matador. He entered the arena against an enraged bull armed only with a perfumed handkerchief and a copy of the Constitution. He thought he could 'dance' the beast, charm it with his exquisite manners and that..." Matías made a vague, effeminate gesture with his hand, "...silky style of his. Fool. He forgot the main rule of bullfighting: the bull does not appreciate such things."\n\nAntónio Fontes, methodically cutting his steak into geometrically perfect squares, merely nodded coldly, not lifting his eyes. "Barrios mistook politics for ballet. Poor devil."\n\nMatías smirked, saluting his colleague with his glass. "To elegant corpses, António. They make a beautiful exit."\n\nThey didn't have time to finish their drinks. The doors burst open with a crash that made the candle flames in the candelabras shy away. On the threshold stood a captain in uniform.\n\n"Señores!" he exhaled, sliding down the doorframe. "It's all over. The Guard is fleeing. Miraflores has fallen!""
IBR_VEN.11.a: "Tell the kitchen to open the champagne."

IBR_VEN.12.t: "Dinner on the Edge of the Abyss"
IBR_VEN.12.desc: "Matías Vega Guerra stabbed a juicy piece of meat with his fork, demonstratively ignoring the moans of wounded officers behind the wall of the Iberian embassy's dining room. War is war, but dinner must be served on schedule.\n\n"Ojeda..." the Spaniard drawled, examining the ruby wine in his glass against the light. "You know who he reminds me of, António? Girolamo Savonarola. That Florentine also thought he could rule a city of sinners with nothing but sermons about virtue and 'bonfires of the vanities.' Our schoolteacher sincerely believed that if he read Marx to the generals from a balcony, they would weep with emotion and hand over the keys to the tanks."\n\nAntónio Fontes, methodically cutting his steak into geometrically perfect squares, merely chuckled coldly, not lifting his eyes from his plate. "Savonarola was eventually burned in the same square where he preached. History has a wicked sense of humor, Matías. Ojeda set himself on fire when he decided that friendship with Havana would serve as a bulletproof vest."\n\nMatías nodded, saluting his colleague with his glass. "To unarmed prophets, António."\n\nThey didn't have time to finish their drinks. The doors burst open with a crash that made the candle flames in the candelabras shy away. On the threshold stood a captain in uniform.\n\n"Señores!" he exhaled, sliding down the doorframe. "It's all over. The Guard is fleeing. Miraflores has fallen!""
IBR_VEN.12.a: "Tell the kitchen to open the champagne."

IBR_VEN.13.t: "Just Like Old Times"
IBR_VEN.13.desc: "The camera flashes in the Joaquín Crespo Hall at Miraflores Palace are as blinding as muzzle flares, but General - now President - Jesús María Castro León does not even flinch. He stands tall in an immaculately pressed uniform, the very personification of order returned to Venezuelan soil. At his right hand is Matías Vega Guerra. Unlike haughty envoys from Madrid, this native of the Canaries speaks with a soft accent that sounds almost kin to Venezuelan ears. A seasoned lawyer and administrator, he smiles like a returning cousin. To his left stands the complete opposite: António Alexandre da Rocha Fontes, a man of cold calculation whose gaze betrays the ruthless efficiency of Salazar's "Estado Novo."\n\nWhen protocol is satisfied, the procession moves to the Council of Ministers Room. The heavy doors slam shut, cutting off the noise, leaving only the ticking of the clock. Castro León gestures to his guests to the long oval table, overseen by the portrait of Simón Bolívar, hanging like a silent judge at the head. Servants silently place cups of steaming café cerrero.\n\n"Madrid and Lisbon send their warmest congratulations," says Vega Guerra, reaching for a cup. "It is a pleasure to see a man of honor ruling Caracas again, rather than a demagogue."\n\n"We appreciated your... discreet assistance in our hour of need," the President nods, looking toward Fontes. The Portuguese does not waste time on pleasantries.\n\n"Let us leave sentimentality to the historians, Señor Presidente," Fontes states dryly, retrieving a folder stamped with an embossed coat of arms from his briefcase. "Iberia invested in stability. Now, it is time for dividends. Your predecessors flirted with Mexico and Washington, but the oil of the Orinoco must flow in the right direction. Towards old friends."\n\nCastro León smirked, signing the document without looking. For the first time in a long while, he felt safe."
IBR_VEN.13.a: "Black gold in exchange for ironclad guarantees."

IBR_VEN.14.t: "Rumors of a Rumor"
IBR_VEN.14.desc: "The air across the barracks in Valencia was turning rancid, the rations prepared swallowed with some disdain from the officers complaining through lunch. Overhead, a speech came from Fabricio Ojeda, proclaiming a new vision for the Venezuelan economy, much to the chagrin of those huddled within.\n\n"That fucking atheist swine, daring to force us to bow to his socialist vision," complained one, Rafael Cadavel, leaving his fork in his soup. "Makes me ashamed to serve in this army."\n\nAnother, Alfredo Barrueco, simply chuckled to himself. "We'll at least get some front-row seats when somebody finally gets the guts to march into the Miraflores and throw Ojeda off his roof."\n\nThe comment brought silence, but only in contemplation. "You know," replied Óscar Tejedor, allowing his spoon to dip into the soup in turn, "I don't think we'd be alone in that presumption. I've seen how angry some of my family has been at Ojeda, and I know they're not the only ones."\n\n"But where would we get the money?" groaned Cadavel, clutching his fork but not bringing it up. "If anger alone could topple that bastard, we'd have succeeded on Holy Wednesday."\n\nAnother moment of contemplation, before Tejedor raised a spoon. "You know, Franco is probably still pissed at losing his stake in Venezuela. I'm sure they've still got a few ears somewhere. Let's talk about this with a few others. Trusted friends. Once we can contact the Iberians..." As the covenant was signed, one ear turned away, registering the course of conversation into Portuguese as he considered how to raise the conversation."
IBR_VEN.14.a: "It's not over yet. Let's see if we still have enough men here for another shot."
IBR_VEN.14.b: "Let's see how serious this is before getting involved again."
IBR_VEN.14.tt:0 "§!If the §Ymilitary§! opposition becomes stronger than [VEN.GetFlag] §ROjeda§!'s government and the §Mdemocratic§! opposition, [IBR.GetFlag] §Oour int§!§nerests§! in Venezuela will prevail over [MEX.GetFlag] §KMexico§! and the [USA.GetFlag] §mU.S.§!\n§F------------------------------------"

IBR_VEN.15.t: "A Beachhead Back to the Andes"
IBR_VEN.15.desc: "FROM THE OFFICE OF S.I.M TO THE OFFICE OF THE PRESIDENT: FOR THE CAUDILLO'S EYES ONLY!\n\n-The Iberian Embassy in Caracas recently received a seal letter from high-ranking officers in the Venezuelan military, containing details about an ongoing conspiracy against President Ojeda stemming from the URD party (establishment opposition) alongside sympathetic elements of the military.\n\n-Largely composed of ardent Venezuelan nationalists, the cadre of party opposition and military leaders believe that under the current administration in Caracas, Venezuela's democratic apparatus is swiftly becoming a pipeline for leftist infiltrators seeking a possible communist revolution.\n\n-While some more liberal-minded officers are implicated in the plot to overthrow the Ojeda government, many believe that the democratic system in Venezuela to be untenable in the current political climate, even in the event of the president's ouster. They are planning to conduct a counter-coup of the provisional government and establish direct military rule from Caracas.\n\n-They promise exorbitant economic benefits as well as diplomatic prioritization for the Iberian Union and her allies, including with regards to Venezuela's vast oil wealth. In return, they ask for funding and material aid for the operation to overthrow Ojeda and consolidate power against popular upheaval and any other form of resistance."
IBR_VEN.15.a: "Donate Iberian weaponry to the patriots in Venezuela."
IBR_VEN.15.b: "Pesatas will purchase us as an ally in Caracas."
IBR_VEN.15.c: "South American ventures can backfire easily..."

IBR_VEN.16.t: "The Groundwork"
IBR_VEN.16.desc: "A speedboat glided through the water. The whir of its engine pierced the night, punctuated with backfires and men's curses. It had been a while; the coast of Grenada had long disappeared from view; Venezuela loomed in the distance as a dark wall that jutted out from the ocean, replete with threatening movement. Deep in the night, the boat slowed and turned. An inlet opened like a gate, and a quiet forest gently welcomed the boat beneath its canopy.\n\nLieutenant Martínez pulled the cover away roughly, sending some of the boat's contents spilling onto the sand. Thousands of stony faces on thousands of paper bills stared up at him. His eyes narrowed. The smugglers watched him expectantly. "Where are the radios?"\n\n"We will drop them in about a week."\n\n"Where, when?"\n\nOne of the smugglers shrugged, gesturing at the air. He huffed, glibly tipped his hat, and gestured for his men to bag the money. He watched the Iberians float away lazily into the horizon.\n\nDawn illuminated the distant airfield. Martínez stepped on the gas, the car jolted, and the countryside blurred. He cast nervous glances at the back of the truck; beneath the car parts lay thousands of dollars' worth of bribes, soon to find their way into the hands of all those disaffected or apathetic enough regarding the new Socialist tyranny to stand aside and let it fall. He slowed.\n\nMartínez pulled in, studying the faces of his comrades as they waved the truck inside. Any of them could destroy the whole operation if they bothered to investigate. Yet none did, and never would. He breathed a sigh of relief as he passed into a dark hangar. The plane was ready."
IBR_VEN.16.a: "Let's show off our new toys."
IBR_VEN.16.b: "Let's make some new friends."
IBR_VEN.16.c: "Nothing can stop us now!"

IBR_VEN.17.t: "The Final Touches"
IBR_VEN.17.desc: "The Hotel Tamanaco was always bustling with activity. Thus, nobody paid any mind to the party of sixteen who had reserved a dining room. They did not look the part, but they were officers of the Venezuelan Army, and they were here to discuss their role in a coming coup.\n\n"The radio station goes to Guteriez; you will move units in to take the building by noon. Olabarri, you'll move in to take the Presidential place from the Viaduct."\n\nThe officers stole glances at each other. Lieutenant Zarzo placed them like chess pieces as he pored over the map of the city, filled in with each monument, church, police station, and base. Some grimaced; they would be in the thick of it. Others smirked; they would get the glory. Most had no local contacts; the few who did thought themselves ill-placed, their planned actions ill-timed.\n\n"Captain Peraza will take up supportive positions for Sergeant Olabarri."\n\nSome were already making plans for after, others stared out the windows, planning their maneuvers. The air began to feel heavy. The streets below hummed with activity, backfires and shouting wafting to the assembler's ears like desperate warnings.\n\n"As for myself, I will move near the Plaza Panteón."\n\nThe officers knew that there was still so much to do, yet, as Zarzo was so keen to point out, there was already champagne in crates stashed in the corners. They all had their dispositions- determined, resolute, utter terror. The plan was so absurd, Zarzo so cavalier and cocksure, that a real confidence descended on the room. Surely, they reasoned, someone somewhere must have it all figured out, the Iberians, perhaps."
IBR_VEN.17.a: "We go over the plan, one more time."
IBR_VEN.17.b: "Let there be no doubt, no wavering, on the eve of our triumph!"
IBR_VEN.17.c: "Drink and be merry!"

IBR_VEN.18.t: "Ojeda and the Tanks"
IBR_VEN.18.desc: "Guillermo eagerly drank in the jubilation that pervaded the Palacio de la Moncloa. No longer would he be an exile. The forces of law and order would prevail. His people would finally reject red subversion, though, regrettably, only after an education with tanks and Iberian arms.\n\nHe cheered as images flashed of military units securing street after street in Caracas. The entire staff of the Palacio, ministry officials, secretaries, and the numerous exiles like him, watched in rapt anticipation as the panicked Ojedists were ejected from the radio stations, their jittery voices replaced by the cool, sonorous tones of military officers.\n\n"I can assure you all that gasoline will soon become much, much cheaper," Guillermo joked, to the resounding laughter of his colleagues.\n\nThe illusion shattered. As if from nowhere, thousands of police and National Guard units loyal to Ojeda cordoned off the National Assembly, stopping the coup's tanks in their tracks. Guillermo and others howled themselves hoarse at the televisions, demanding they break through. Then, a little after noon, there was silence.\n\nThe tanks turned. The televisions were filled with images of unionists, communists, and workers all descending on the streets, coming from the slums on the hills, throwing rocks and bottles at the soldiers who scurried away in the wake. The coup's defeat was announced on reclaimed television and radio, with footage of a grinning, resolute Ojeda waving to cheering crowds playing on repeat.\n\nThe whole Palacio was then filled with prayers, recriminations, shouting matches, but only until nightfall. Guillermo's colleagues went to their homes. Only Guillermo remained, thinking of his home, there on a little street in Caracas, surely despoiled by looters and police. He sat, picking up a half-empty bottle of liquor. He drank, weeping."
IBR_VEN.18.a: "Only God could save his country now."

IBR_VEN.19.t: "Venezuela's On the Line"
IBR_VEN.19.desc: ""Can you repeat that, I didn't quite- Hello? Can you hear me?" asked Iberia's ambassador to Brazil, as chaos reigned within the embassy offices. Writing down chicken-scratch notes to try and memorize the information coming through the failing call, he relayed the information to the rest of the office, shouting over the noise, "The nationalists have been unable to roll into the streets of Caracas, and they're attempting to force entry into the city with military force." In a quieter tone, the ambassador added, "It doesn't seem to be going very well..."\n\nThe ambassador's attention snapped back to the call, and he relayed the words of the officer on the other end of the line as he received them. "You're holding out inside Hotel Tamanaco? And the liberal national guard have breached the building's premises? Are you- You'll call back? Alright, I'll wait on this end, then..."\n\nFor the rest of the day, the ambassador waited by the phone, amidst the chaotic frenzy of the embassy staff. After a day or two, the embassy had slowed down to a more manageable state, but the phone still hadn't rung. After the third day, everyone knew what had happened. The nationalists had been defeated, the coup stopped in its tracks before they had even pierced Caracas. The opportunity had passed them by, and Venezuela had slipped out of Iberia's grasp."
IBR_VEN.19.a: "Perhaps this time forever."

IBR_VEN.20.t: "It's Good to Be Back"
IBR_VEN.20.desc: "Manuel and the other Iberian diplomats were greeted by the officers at Miraflores not with a rigid salute, but by smiles and jokes. The successful coup clearly had the men in high spirits, and Manuel and his colleagues certainly weren't going to try and dampen the mood. As they entered the palace, that joyful mood only soared higher, and the diplomats passed various men and their wives dancing to Merengue as the procession sat down at a large table. As the champagne was served, the Venezuelan officers were the first to speak. "We must thank you and your country for all of your support. Venezuela is in your debt."\n\nManuel spoke for the diplomats: "We're flattered, but I must ask, why invite us to your night of celebration? Surely we could have given you some time to get all your affairs in order."\n\n"Don't worry, we simply wish to reward your support by fulfilling our end of the deal here and now, so that there's no doubt about it," replied the officer. Accepting their cue, Manuel and his diplomats pulled out their books to begin negotiating Iberian stakes in Venezuelan businesses. However, they were soon interrupted by the sounds of rubber bullets being fired and cars crashing into other cars in the distance.\n\nManuel shot a worried glance at the rest of his colleagues, but one of the officers soon gave out a chuckle as he sipped from his glass. "Ah, growing pains... What a pain, am I right?" The rest of the officers soon began cracking jokes about the unrest, and the brief tension popped like the bubbles in their champagne. Manuel simply shrugged. Once these negotiations were over and the stakes had been sorted out, he'd be going home anyway, so it wasn't his problem to worry about anyway."
IBR_VEN.20.a: "And also the appetizers had just arrived."

IBR_VEN.21.t: "New World, Old Benefactor."
IBR_VEN.21.desc: "The early afternoon sun was half-hid behind an overcast sky, occasionally peaking through the clouds onto the plaza below. A fountain churned as Fernando María Castiella y Maíz walked the promenade around it, another Iberian diplomat at his side. Somewhere afar, he could sense the eyes of a security detail eying the meeting with twitchy eyes and twitchier trigger fingers. "If he's of no use to the Yanquis, what use is he to us?" The Minister of Foreign Affairs prompted.\n\n"To avoid another Puerto Plata." His colleague had served in the Iberian Embassy in Ciudad Trujillo, assisting the foreign relations operation with the regime in the Dominican Republic. "Our allies along the Caribbean are under threat, both Washington and Mexico City can sense it. Caracas offers us inroad in the Andes, Pérez Jiménez just needs the machinery to get behind him."\n\nHe was referring to General Pérez Jiménez, the former lapdog of the Americans and front for all of their dealings in Venezuela. He insisted that the various dissident military revolts after the 1958 Coup were evidence of an opportunity, citing that Villalba, the President-elect of Venezuela, had estranged a lot of Pérez Jiménez' contacts in the military. Seeding a coup d'état in Caracas, if Castiella's colleague was to be believed, would give the Hispaniphone bloc a foothold and kneecap a principal ally of the Veracruz Pact.\n\nCastiella stopped walking for a brief moment, looking up at the pale gray sky, seeing something that resembled the enmity of fog and the unknowability of the future. Maybe he was just being paranoid, but Venezuela was an unruly beast, evident from, if nothing else, historical precedent. Were Mexico and her allies really as much of a threat to Madrid as they seemed, or was Puerto Plata just a fluke not to be repeated?"
IBR_VEN.21.a: ""I can give no guarantees, but I will make the call." Castiella told his colleague."

IBR_VEN.22.t: "A Militar's Vehicle"
IBR_VEN.22.desc: "The tram was uncharacteristically empty, save for two people sitting beside each other. This was precisely because at least one of them was among the few who had a real say in the government of the Iberian Union, even if the Minister of Foreign Affairs only represented a medium-sized cog in Franco and Salazar's orderly machine. Fernando María Castiella y Maíz scratched at the bridge of his nose. "Why in hell should we get involved this time?" he blurted. "Suffer even one more unnecessary setback while the knuckle-draggers bang their heads off each other?"\n\nHis associate, a diplomat who worked at the Iberian Embassy in Ciudad Trujillo, posited his point a different way. "We cannot simply stand off to the side and allow Puerto Plata to foul the air." He suggested. "There are many actors in the Caribbean who want to see the Hispanosphere's influence driven back across the Atlantic, we need to rebound and decisively. Venezuela is the perfect place to do it." He was referring to the mounting opposition against the Venezuelan President-elect, Caldera, an unimpressive moderate who seemed to be earning the ire of the military for that reason.\n\nEven though military conspiracies against the government of Caracas seemed to be becoming a thing of the past, there remained a small, but growing core of fervent nationalists and Bolivarianists among the officer corps, something that Castiella's associate argued presented an opportunity to seed an ally in the northern Andes and dismantle a key ally of the Veracruz Pact all at once.\n\n"Mexico wasn't sitting on their hands with Puerto Plata either." His colleague pointed out. "They are just aching to force Iberian interests out of the hemisphere, I suggest we strike first." The first drops of rain began falling outside, another overcast afternoon."
IBR_VEN.22.a: ""I'll talk to some people, but no promises." Castiella replied."

IBR_VEN.23.t: "Troublemaker's Trove"
IBR_VEN.23.desc: "Below, the interns and diplomatic staff at the Brazilian Embassy on Calle de Goya picked away at their daily itineraries, the perennial shuffle of office files and telephone calls went on uninterrupted. Above, in a sequestered officer suite on the embassy's upper floors, something more sinister was going on.\n\nForeign Affairs Minister Fernando María Castiella y Maíz poured over the files with almost mounting disbelief. Here, a dossier on right-wing dissenters in the Venezuelan military, including multiple high-ranking generals. There, portfolios on multiple dissident politicians, both in the interior and agitating from abroad. Further in, details on criminal elements on the ground, from street gangs to organized cartels, all amply rewarded for their trouble, all perfectly willing to operate at the behest and in the interest of, a kindly benefactor.\n\nThe projector rattled and an another grainy blue image appeared on a distant wall, a Portuguese general sounding off names and information as the face went by with each slide; Personnel IDs, criminal mugshots, stately portraits, and on and on they went, a visual representation of the endeavor they were about to become involved in.\n\nThe time window they had to work with wasn't ideal, but if it all worked as planned, Iberian intelligence and 'commercial interests' across the Caribbean would fashion this strange gathering of Caracas' best and worst into a poison arrow, aimed right at the heart of Venezuela. In this environment, the word of the Minister of Foreign Affairs was God."
IBR_VEN.23.a: ""Send the word." It was all Castiella had to say."

IBR_VEN.24.t: "Monumental Echo"
IBR_VEN.24.desc: "Enrique Valenzuela felt ill at ease. The Paseo de los Próceres was too open, too well-lit. The marble statues of the heroes of the War of Independence seemed to look down judgingly at the Iberian agent trying to merge with the shadows near one of the fountains. His contact, Rubén Massó Perdomo, on the contrary, stood frighteningly erect, as if he himself were part of this architectural ensemble.\n\nWhen Enrique approached and asked through gritted teeth to keep it down, Rubén merely waved his hand dismissively, gesturing around the geometrically flawless alley.\n\n"Keep it down? Enrique, you think like a petty smuggler. Look around. This is our architectural pride and joy: the 'System of Nationality' complex. The grand axis connects the University with the Military Academy. General Pérez Jiménez carved this concrete and marble to remind us: Venezuela is not a market square."\n\nThe Venezuelan nodded toward the looming masses of Fort Tiuna, the country's main military base. "Up there sit officers who are sickened by the democratic 'bochinche' - this eternal mess bred by politicians. And they are waiting for the 'Necessary Gendarme'. Someone who will step into the light and say: 'Order has returned.' If we cower in corners like rats, they will crush us. But if we stand here, beneath these statues, as heirs of Bolívar... they will remember how to salute properly."\n\nValenzuela looked at the barracks, then at the fanatical glint in Rubén's eyes. It was madness - or the boldest calculation of his career."
IBR_VEN.24.a: "Perhaps he is right. Boldness attracts soldiers."
IBR_VEN.24.b: "It is suicide. Better to stay in the shadows."

IBR_VEN.25.t: "The Cycle of Violence"
IBR_VEN.25.desc: "The bead of sweat hung suspended on Generalissimo Rafael Trujillo's face. Immobile. Even as his legs churned, his eyes never left Johnny Abbes' porcine form as the Dominican spymaster spoke.\n\n"SIM agents have taken into custody three criminals residing in the Venezuelan city of Coro. Records recovered from two June 14th encampments indicate the trio were active in funding traitors to our nation."\n\nThe Generalissimo grunted, and Abbes continued, "An operative retained the services of a local gang in Maracaibo to damage a key pipeline flowing to an export terminal. The explosives used failed to breach the pipe, but the incident was enough to cause mass panic in the city."\n\nTrujillo's response came in a high-pitched voice. "Should have used the bombs we blew up Betancourt with." A thin laugh that Abbes quickly matched.\n\nThe bead of sweat at last fell, trailing down a wrinkle on the Goat's wizened face. Abbes' watery eyes almost drifted to it, but he forced himself to hold Trujillo's gaze. "The SIM is currently evaluating whether we have an opportunity to eliminate any high-profile politicians. The Iberian partnership you have fostered is allowing us to pursue longstanding Venezuelan enemies of our government. Their efforts in Caracas-"\n\nTrujillo ceased pedalling abruptly, and stepped off the exercise bike. He beckoned his mayordomo for a towel. "Go kill an adeco. I need to change.""
IBR_VEN.25.a: "The wheels of Dominican justice keep turning..."

IBR_VEN.26.t: "A Diplomatic Nightmare"
IBR_VEN.26.desc: "The crystal chiming of glasses in the Palace of Santa Cruz suddenly seemed deafening to Fernando María Castiella. Just a minute ago, the Iberian Minister of Foreign Affairs was discussing trade quotas with a German attaché, but the moment his aide, pale as a sheet, touched his elbow, the world around him collapsed.\n\nIn the quiet of the corridor, away from prying ears, the aide's whisper sounded like a verdict: "There were mass raids in Caracas last night. They took three liaisons and the resident. Señor Ministro... they didn't have time to destroy the cipher pads. Contact lists, codes, safehouse addresses - the Venezuelans have everything."\n\nCastiella felt an icy cold grip inside. If DIGEPOL published these documents, the scandal would bury Iberia's reputation in the region for decades.\n\n"Pull everyone out," the Minister's voice was hoarse; he barely recognized it himself. "Immediately. Diplomats, trade representatives, even the janitors if they've ever laid eyes on our operatives. Burn the embassy archives. Cut the wires. I want not a single Iberian left there who can be put in an interrogation chair within the hour."\n\nHe adjusted his cuffs, preparing to return to the hall and smile, knowing that across the ocean, everything they had built was crumbling."
IBR_VEN.26.a: "It is going to be a very long night."
IBR_VEN.26.tt: "§FWith the collapse of the §jdissident§! §gconspiracy§!, in the event of a §scoup§!, the [VEN.GetFlag] §SVenezuelan government§! will §Rprevail§! against our allied efforts to depose them.\n\nThe failure of [IBR.GetFlag] §Oour infi§!§nltrators§! will now be a §Rcertainty§! for many §Yyears§! to come.§!"

IBR_VEN.27.t: "Vacancies for Patriots"
IBR_VEN.27.desc: "Enrique Valenzuela pushed the heavy wooden door of the bar, leaving the stifling noise of the Caracas street behind. The bartender, without even asking, placed a bulbous glass of "Pampero Aniversario" before the Iberian. Enrique nodded, took a sip, enjoying the burning warmth, and headed to the back room, hidden from prying eyes by a heavy velvet curtain.\n\nThe atmosphere inside differed strikingly from the nervous meeting on the Paseo. Rubén Massó Perdomo sat at the head of the table, his tunic collar unbuttoned, surrounded by young officers. Seeing the agent, he raised his glass in greeting, and the tension on the faces of those present was replaced by broad smiles.\n\n"Gentlemen," Enrique sank into an empty chair, surveying the company. "I hope you aren't too attached to your current ranks. I fear you will soon have to change your insignia."\n\nHe held a theatrical pause, enjoying the silence. "Our friends in the government, in their infinite wisdom, have decided that DIGEPOL is not coping with its duties. A great purge has begun. They are firing the very people who could have stopped us, calling it 'incompetence'." The Iberian smirked, looking into Rubén's eyes. "A vacuum is forming. Many empty chairs, much power, and a total lack of oversight. This is a unique chance for ambitious young men loyal not to a paper constitution, but to the true Venezuela. Who among you is ready to take these seats?""
IBR_VEN.27.a: "It seems civilian dress will soon come back into fashion."
IBR_VEN.27.tt: "\n§FWith the triumph of the §jdissident§! §gconspiracy§! over the [VEN.GetFlag] §SVenezuelan§! government and their [MEX.GetFlag] §Kallies§!, in the event of a §scoup§!, the [VEN.GetFlag] §SVenezuelan government§! will §Gcollapse§! like a house of cards.\n\nWhether it be weeks, months, or §Yyears§!, the success of [IBR.GetFlag] §Oour infi§!§nltrators§! is now a §Gcertainty§!§!."

IBR_VEN.28.t: "Bread, Bullets, and Resentment"
IBR_VEN.28.desc: "The morning sun of Maracay struggled through the dusty blinds, striping the worn mosaic floor of the garrison mess hall with strict lines of light and shadow. Under the high vaults that remembered the times of the dictator Gómez, the blades of huge ceiling fans turned lazily, rhythmically slicing the thick, stagnant air where dust motes danced. The clatter of cheap aluminum spoons against metal trays echoed under the dome, creating the dreary symphony of an army morning.\n\nPrivate Méndez stabbed the paper with a calloused finger, nearly tearing the page.\n\n"See? That dandy in Miraflores wants us to eat dirt." He looked around at his comrades, their faces dark from sun and fatigue. "Who among us joined the army for a good life? We are here because there is nothing to eat in our towns. We slept in the mud to send a few pitiful bolívares to our mothers. And now he takes even that?"\n\nA murmur rose around the table. It was the voice of the real Venezuela - rough, poor, and angry.\n\n"Villalba rides in a Cadillac with air conditioning and looks at the country from the window of a private plane," another soldier spat. "What does he know about us? To him, we are numbers in a ledger. But he forgets who really holds this country. We are not his servants. We are the people given rifles. We are the only ones protecting poor devils like ourselves."\n\nWhile the argument flared, turning into a declaration of hatred for the well-fed, one soldier silently pushed his tray away. He took out a crumpled sheet of paper and began writing a letter to his uncle in Madrid. There, in Spain, they would understand. There, they know what happens when politicians start spitting in the faces of men holding loaded weapons."
IBR_VEN.28.a: "A hungry soldier is a dangerous soldier."

IBR_VEN.29.t: "Lessons of History"
IBR_VEN.29.desc: "Playa Parguito welcomed them with the dazzling turquoise of the Caribbean Sea and the rustle of coconut palms leaning over the water. Margarita still retained the charm of the wild "Pearl": fishing boats bobbing on the waves, and an endless strip of white sand. Captain Ortega watched his children building a castle at the water's edge, his wife laughing as she brushed sand from her skirt. Idyllic. But in the Captain's head, this picture was already coming apart at the seams.\n\n"How long can I afford this?" - the thought, sharp as a shard of glass, gave him no peace. Villalba's reforms. Ration cuts. The humiliation of the Venezuelan army. This paradise was about to become inaccessible to a man in uniform.\n\nA shadow fell across his lounge chair. Grandfather Manuel, who had flown in yesterday from Seville, sat down heavily nearby. The old man, whose skin resembled the tanned leather of an old saddle, followed his grandson's gaze.\n\n"I know that look, Miguel," - his voice sounded hoarse, like the noise of pebbles. "You look at them and fear they will take away your future. In '48, when Rómulo Gallegos decided he could tell the army its place, we felt the same. And in '36, back home in Spain, when the Reds wanted to bring us to our knees... Do you know what we did?"\n\nThe grandfather leaned closer, and the fire of youth flared in his faded eyes. "We found each other. Officers in mess halls, sergeants in smoking rooms. Alone, you are a target. Together - a legion. Franco was just a soldier too, until he decided to become the Savior."\n\nOrtega felt as if he'd been struck by lightning. The realization was frighteningly simple. The army is not empty. The Perezjimenistas haven't gone anywhere; they are simply waiting for a signal. They would take advantage of a coup and, subsequently, oust the more liberal-minded officers of the Junta and worm their way back into power. And who better to help them than those who have already walked this path? Those who won in '36.\n\nThe Captain looked at the horizon, beyond which lay the Iberian Peninsula. Salvation would come from there."
IBR_VEN.29.a: "Sometimes the past holds the keys to the future."

IBR_VEN.30.t: "On the Outskirts of Puerto de la Cruz"
IBR_VEN.30.desc: "Luis and his squad sat by their jeep in the dead of night, smoking as the minutes ticked by. They had been up for hours, and were exhausted, but they had their firm orders. Félix Román Moreno, one of the leaders of the conspiracy, had ordered Luis and the others to maintain their post in this flat field, which was probably once an airstrip or something.\n\nFinally, another jeep arrived from the darkness, shattering the endless monotony of the soldiers' vigil. The driver of the other jeep leaned out to talk to Luis and the others, introducing himself as Gabriel, "Heads up, a plane's gonna be landing here soon with supplies for the coup." Sure enough, an old German cargo plane landed on the field a few minutes later. The plane was staffed by Spanish mercenaries, who opened up the hold as Luis greeted them.\n\nLuis and his squad looked through the supplies. There was everything one could possibly need for a coup: crates of ammunition, rifles, grenades, and even false documents "verifying" their purchase by the Venezuelan government.\n\nThe crates clearly hailed from Iberia, with weapon manufacturers' logos and names stamped on all of them. The soldiers all celebrated, made jokes about getting the crates back to "the Venezuelan government," and as they stepped foot off the aircraft were greeted by rifles pointed at their heads.\n\nThe soldier from the other jeep named Gabriel stepped forward, "We're with DIGEPOL and the Federal Security Directorate of Mexico. This is an order for all of you to stand down, your little conspiracy is over."\n\nAs the intelligence agencies seized the plane and the conspirators, Gabriel returned to the jeep to inform headquarters of the good news."
IBR_VEN.30.a: ""We should have thanked Llovera Páez for the tip.""

IBR_VEN.31.t: "Pride Cometh..."
IBR_VEN.31.desc: "It was 3:30 AM, but Juan felt like he could conquer the world. He was standing with his fellow soldiers around a large military truck, eyes and ears trained. He didn't want to miss this. At the top of the truck, General Llovera Páez was exhorting the troops. "The senile old man in Caracas is paranoid that we will go against the interests of the people, but we are the ones who represent them! No true Venezolano wants to see our country torn apart by party interests, and no one wants a government that tries its hardest to ruin our soldiers!" Juan cheered along with the rest and boarded the truck. It was time to bring common sense back to Miraflores Palace.\n\nThe truck tore through the black night air, rapidly advancing towards Caracas surrounded by dozens of other trucks and armored cars. The chilly night air brushed against Juan's face from a crack in the hold, but he couldn't care less. "We're going to save Venezuela, mis compañeros! Can you believe it?" The other men were just as ecstatic as Juan. "It's going to be an incredible day", said Alfonso. "We're actually making history", Miguel piped up. "Imagine the picture", Alberto cracked a smile. "All of us, standing outside Miraflores-"\n\nAlberto was knocked to the floor of the truck, and Juan was flung on top of him. After a dazed moment, Juan realized that the whistle of the wind had stopped. The truck braked suddenly. "What happened?" Miguel groaned as Alfonso picked himself up. Juan stood up and dusted himself. "Let's find out."\n\nThe four soldiers came out of the truck only to be blinded by the glare of flashlights and the barked orders of what seemed to be a whole battalion. When Juan figured out what he was seeing, he wished he hadn't. Tanks and APCs were blocking the road, disgorging soldiers who had remained loyal to the government. In front of his eyes, the soldiers dragged the men from the truck before them to the floor and handcuffed them. For a moment, Juan almost wanted to fight, but the call died on his tongue."
IBR_VEN.31.a: "It was at a place beyond pointless."

IBR_VEN.32.t: "...Before the Fall"
IBR_VEN.32.desc: "Luis Felipe Llovera Páez could barely hear his frantic breathing and the shuffling of piles upon piles of paper through the roaring of the gas stove, set to full blast. He had managed to run for his life when the first vehicle in his ill-fated convoy was stopped by government forces, but he was not out of the fire, not by a long shot. Peering out of the window, he could see the rows of his men being loaded on trucks and led off through streets lined with tanks. The sight was almost as panic-inducing as Villalba's furious speech on the radio, denouncing him and all his men. But this wasn't the end, either.\n\nLlovera Páez reached forward and threw another envelope full of papers onto the stove. The kitchen was full of ash and steam, all that remained of his glorious stand against Villaba. When DIGEPOL came here, they must not have been able to find anything tying him to Iberia, and particularly not to the Perezjimenistas. Of course, they won't be able to find Llovera Páez, either. The moment he'd burned the final document, he was going to get away from here and catch the first helicopter from the Iberian embassy. As the Yanquis say, if at first you don't succeed-\n\nA short rap on the door disturbed Llovera Páez from his idyll. It only took him a moment to pick up three different piles of documents and turn to the stove in an attempt to burn everything he had left at once, but by then, the door had already been broken down. A crowd of DIGEPOL men swarmed into the small apartment, tackling him to the floor and filling the air with fluttering papers. Llovera Páez was shoved onto his stomach, his arms tied behind his back as someone declared that he was under arrest for conspiracy and espionage."
IBR_VEN.32.a: "From the floor, he could see a file with the Iberian seal on it next to him, and knew his fate was sealed."

IBR_VEN.33.t: "Ghost Divisions"
IBR_VEN.33.desc: "Whiskey spilled over the map of Caracas, drenching it, though not completely ruining it. Llovera Páez shot a glare at the drunkard responsible for the mess.\n\n"Ay, amigos!" Páez shouted, banging the table with the butt of his knife. "Let's not celebrate too hard before we even succeed. We still have to go over the plan one last time." The room slowly hushed down, save for the few drunken giggles and hiccups. "We'll storm the palace, just like in '48, and arrest the bastard Villalba before breakfast. By lunch, he'll have been sent off far away from Caracas."\n\nThe room erupted in cheers. Men already started pouring liquor again, but Lieutenant Barrios raised his hand, hushing the other conspirators. "I'm afraid it won't be that simple, Páez." He gestured his head towards the window, out into the dark streets of La Castellana. "There's been cars outside my house for the past week. No license plate, no nothing. DFS and DIGEPOL are onto us."\n\nEveryone looked to Páez for answers, but he couldn't offer any. "Caracas will be on higher alert then. A bloody coup's no good for anyone..."\n\n"How 'bout we fucking distract the pendejos or some..." The drunkard slurred his words, almost faceplanting into the table. "Those cunts... always chasing after those commies..."\n\n"The FALN?" Páez grinned. "I suppose we could falsify some reports... Leave them at the barracks... Send them on a wild goose chase outside Caracas just long enough for us to take Villalba... Keep drinking that alcohol, Luis. You're a lot smarter drunk."\n\nLaughter filled the room again. Glasses clinked. Toasts were given. Letters were sealed with ink spelling out the coordinates of ghost divisions lurking in the countryside."
IBR_VEN.33.a: ""To our favorite terrorists, the FALN.""

IBR_VEN.34.t: "End of the Carnival"
IBR_VEN.34.desc: "Luis Felipe Llovera Páez had been waiting for this moment since that cursed January of 1958. As the truck slowed down, he greedily scanned the outline of the Capitol against the dark mass of Mount Ávila. On the roof of the "temple of democracy," silhouettes of soldiers were busily setting up a machine gun nest. The doors of parliament were wide open, like a mouth in a silent scream, and lights burned only in the vestibule. The talking was over. It was time to work.\n\nThe formerly exiled General jumped onto the asphalt, adjusting his holster. A young lieutenant immediately ran up to him, saluting.\n\n"Report situation!"\n\n"Perimeter is ours, my General. Awaiting orders."\n\n"One order, son." Llovera Páez smiled predatorily. "Take Miraflores. Arrest Villalba. If he hides behind the constitution - smash his teeth with a rifle butt. We've had enough of this circus."\n\nHe shifted towards Félix Román Moreno, his aide in the conspiracy to bring Perezjimenistas back to power, and signaled him to walk into the Chamber of Deputies. But instead of pomaded lawyers in expensive suits, the seats were occupied by simple soldiers in sweaty uniforms. Faces burned by the sun, hands accustomed to hard labor. The real Venezuela.\n\n"Look around!" Román Moreno's voice, used to shouting over the roar of engines, filled the hall. "For years these walls heard only lies. They promised you bread but gave empty speeches. We are here to sweep away this trash. We will bring back the glory of our country!"\n\nOf course, many officers present didn't know that what he meant was returning to Pérez Jiménez's 'New National Ideal', instead of a temporary setback of democracy. The hall responded with a murmur of approval. Behind him, Llovera Páez beckoned to an adjutant. "Drag the newsreel crew in here. Lights, cameras, everything proper. We want to make a statement that will be remembered. And for now..." He tore a sheet from his notebook and quickly scribbled a few lines. Dissolution of parties, cancellation of reforms, total military control. Demands Villalba would never accept. "Take this to the President. Let it be his epitaph.""
IBR_VEN.34.a: "The show begins."

IBR_VEN.35.t: "Another New Day"
IBR_VEN.35.desc: "Morning in Caracas began as usual. As the sun lazily crested the mountain slopes, Ignacio was buttoning his shirt in his bright apartment, located in the 23 de Enero - one of the neighborhoods built during the golden years of Pérez Jiménez's infrastructure boom. In the kitchen, a cornmeal arepa sizzled appetizingly in the pan, while the honking of Fords and Buicks drifted in through the open window. With a habitual morning gesture, he flicked the radio switch, expecting the weather forecast.\n\nInstead of the familiar announcer's voice, the heavy brass of the national anthem blared from the speakers. Ignacio froze, cup in hand. The anthem abruptly cut off, giving way to the dry, measured baritone of General Félix Román Moreno.\n\n"People of Venezuela," the receiver broadcast coldly, "I address you at an hour when the incompetence of Jóvito Villalba has driven our nation into a dead end. His so-called 'reforms' have paralyzed the country." The general ranted about how the armed forces—the true defenders of the people against poverty-had been humiliated, how partisanship had fractured society, and how the government remained blind to everything beyond the capital. "It seems even the Spanish kings, who never set foot on this land, understood it better than he does!" Moreno's voice strained.\n\nIgnacio took a sip of his coffee. The coffee was excellent; but the speech was a broken record.\n\n"Since our just demands were arrogantly rejected, the army is forced to take responsibility into its own hands. I announce the creation of a new civic-military junta, called upon to-"\n\nWithout waiting for the end of the sentence, Ignacio clicked the radio off. At that exact moment, the echoes of similar clicks rippled across the city: from the elite villas to the labyrinthine barrios. People silently returned to their routines. In his lifetime, Ignacio had seen too many coups, juntas, and fiery "saviors of the nation." The faces in the newspapers changed, new promises and old propaganda poured forth, but none of these generals could alter the immutable fact that by nine in the morning, Ignacio had to be at work. Life went on, and the reality remained exactly the same."
IBR_VEN.35.a: "Another footnote in the newspapers."

IBR_VEN.36.t: "Lunch at The Edge of the World"
IBR_VEN.36.desc: "A low hum fills the cramped bodega on the Guyanese border, drowned out only by the persistent buzzing of fat flies. Above the counter hangs a calendar from five years ago - a busty blonde smiling through spots of cigar ash. A group of recruits, their sweaty tunics unbuttoned, greedily devour greasy reina pepiada, dropping chunks of avocado onto the sticky oilcloth table. For these boys, plucked from the bustle of Maracaibo and Valencia, service in this backwater is deadly dull, and they hungrily catch every word from the crackling radio.\n\n"...President Caldera reports success in negotiations with Guyana and Canada..."\n\n"Did you hear that? Goodbye, fucking mosquitoes; hello, hot blondie sifrinas of Caracas! I've forgotten what a woman with all her teeth looks like!"\n\nThe laughter is cut short by the slam of a bottle against the table. The soldier opposite, his face dark from the sun.\n\n"Shut up," - he snarls. - "Is getting your dick wet all you care about? That impotent in Miraflores is selling us to the fucking English! The ones who couldn't even hold onto their own island!"\n\n"Come on, man, we just want to get out of here..."\n\n"And I want to take back what is ours!" - he barks, jumping up. - "I know a hundred guys in the company who would swim across this piss-river tonight and slaughter everyone there. Orders or not. We are the Army, not watchdogs for bureaucrats. If Caldera thinks he can be a jalabolas for the gringos... I bet my paycheck he won't be sitting in that chair for long.""
IBR_VEN.36.a: "In the barracks, something worse than boredom is brewing."

IBR_VEN.37.t: "Attempted Bolshevik Revolution in Venezuela"
IBR_VEN.37.desc: "CONFIDENTIAL\nTO: [IBR.GetLeader], Minister of Foreign Affairs\nVenezuela - South America\n\nOur worst fears surrounding the stability of our Venezuelan ally has come to be. 5 hours ago, The Fuerzas Armadas de Liberácion National (henceforth FALN) has managed to seize large portions of the country in an armed coup, and is currently making an effort at fully capturing the country. FALN-FLN troops in Venezuela seized control of Ciudad Bolívar and several other cities in the East, after the front declared a general uprising against the government. Sympathetic civilians have assisted the rebels in their offensive, allowing them to seize almost the entire east in a matter of hours. Despite the FALN intending a swift, large-scale revolution across the country, units in the west appear to have been pushed back to the Andes, allowing the central government to survive and reconsolidate. However, the uprising has escalated into a full-scale civil war.\n\nAlthough their initial attempt at a revolution failed, with resistance present in the west of the country limiting their forces to reorganize in the mountains, guerrilla and clandestine movements within government territory are still active and their base remains present in the east, with the FALN setting a new base in Ciudad Bolívar.\n\nThe FALN was formed in 1962 as the certification of efforts from the Communist Party of Venezuela after their removal from the old, liberal government. With the end of Venezuelan democracy, they have gained considerable support, both from general opponents as well as some radicalised liberals. With leftist success across much of Latin America already in play, excitement among Bolsheviks allowed the FALN to gain significant momentum. This civil war has already seen early fighting, but this will not stop at the frontlines; there is significant partisan warfare already, and an extended civil war will likely break down surviving civilian infrastructure.\n\nThe FALN succeeding would jeopardise our aims in Latin America. Not only is the FALN explicitly communist, but would also be hostile to us going forwards, thus removing further portions of Latin America from comfortably aligning with us. Defeating this movement would help us to build credibility in the region, and would help preserve our access to a major international oil reserve. In addition, we could feasibly use the strategies learnt for dealing with guerillas here for our combat against subversives.\n\nOur campaign must be quick, however; the longer this war goes on, the more reduced civilian infrastructure becomes and the more jaded Venezuelan civilians become, the stronger the FALN's case will be."
IBR_VEN.37.a: "Critical support for a critical time."


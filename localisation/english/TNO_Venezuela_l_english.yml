VEN_news.70.t: "[Get_newspaper_header]The Reunification of Gran Colombia"
VEN_news.70.desc: "Today in the city of Cúcuta, the Presidents of Venezuela and Colombia proclaimed the creation of the People's Republic of Gran Colombia, a nod to the once-thought-lost Bolivarian dream. This united Republic was enabled by the success of the Venezuelan communist revolution and the victory of the Colombian Revolutionary Union against its enemies in the Colombian Civil War, and the subsequent consolidation of their leftist regimes.\n\nParty members and the revolutionary armed forces have launched parades across the newly reunified nation as the states begin the lengthy process of integrating.\n\nInternational reception to this development ranges from cold to actively hostile, with many governments condemning the new Republic's alleged 'invitation' to neighboring countries to join the pact.\n"
VEN_news.70.a: "An unkempt backyard full of weeds."
VEN_news.70.b: "Is Bukharin young again?"
VEN_news.70.c: "A matter to be dealt with in the future."

# MPJ

VEN_news.33.t: "[Get_newspaper_header]Caretaker Government Formed in Venezuela"
VEN_news.33.desc: "Following an extended period of military rule in Venezuela, the incumbent Junta has announced its own dissolution in favor of an interim civilian government. However, opposition figures have already made sceptical remarks regarding the credibility of the incoming government, citing the overbearing presence of Luis Felipe Llovera Páez, a figure of some notoriety due to his involvement in the 1948 coup against President Rómulo Gallegos.\n\nOthers have questioned Llovera Páez's connections to the deposed dictator, Marcos Pérez Jiménez, and have publicly questioned whether or not the ex-Caudillo will be allowed to return to Venezuela. Llovera Páez's silence on the matter in the face of intense scrutiny has led to many assuming his return is imminent once a sufficient level of stability is restored to the fractured nation."
VEN_news.33.a: "A caretaker to take care of the rabble."
VEN_news.33.b: "Another temporary suspension of freedom to add to the pile."
VEN_news.33.c: "Another step back for Venezuela."

VEN_news.39.t: "[Get_newspaper_header]Perezjimenistas Seize Power in Venezuela"
VEN_news.39.desc: "The unending turmoil of Venezuela seems to have only further evolved today as yet another faction has clawed its way into power within the governing Military Junta. Following the sudden assasination of General Oscar Tamayo Suárez by supposed communist agitators, Roberto Casanova, Minister of Defense, has stepped in to lead the Junta.\n\nSome claim supposed government interference that was truly responsible for General Tamayo's death. Casanova has, however, reportedly used the opportunity to react with a brutal crackdown on the recognized opposition cliques as an act of retaliation. Owing to Casanova's long service in the cabinet of former dictator Marcos Pérez Jiménez, many speculators suggest that his rise to office will only act as interim for the former dictator's inevitable return. However, such a move requires far more unity that Casanova seems to currently hold over his own government.\n"
VEN_news.39.a: "They couldn't live with their own failure, it led them back to him."
VEN_news.39.b: "Old tricks from the same man."
VEN_news.39.c: "A folly most concerning."

VEN_news.42.t: "[Get_newspaper_header]Marcos Pérez Jiménez Returns to Venezuela"
VEN_news.42.desc: "To the surprise of few, Marcos Pérez Jiménez has been given a state welcome on his return to Venezuela today, greeted off the plane from Iberia by noted ally General Luis Felipe Llovera Páez. Llovera Páez is expected to announce his resignation as President to pave the way for Pérez Jiménez to be inaugurated, with the general to be named Minister of Internal Affairs.\n\nInternational observers predict Pérez Jiménez will employ the developmentalist and repressive measures that characterized his previous authoritarian government. Already, embassies in Caracas have received requests for asylum from notable dissident figures."
VEN_news.42.a: "A scarce few years before they went running back to their master."
VEN_news.42.b: "And yet, she chose him again? Perhaps, he truly is destined."
VEN_news.42.c: "Democracy was suffocated in her cradle."

VEN_news.46.t: "[Get_newspaper_header]Assassin Strikes at Pérez Jiménez"
VEN_news.46.desc: "An unknown communist assailant fired shots against Marcos Pérez Jiménez during a military parade today in Caracas, before being quickly apprehended. However, Pérez Jiménez has fallen into a deep coma. Rushed to get medical help, his prognosis indicates that he is likely to be incapacitated for some time.\n\nPérez Jiménez's comatose state is likely to facilitate a growing factionalism within the government. Though information is scarce, it seems there is a plot to depose the ailing dictator.\n\nLuis Felipe Llovera Páez, the Minister of Internal Affairs and a confidante to Pérez Jiménez, has already been sworn in as Interim President. Only time will tell if Llovera Páez and his fellow loyalists will be able to preserve Pérez Jiménez in power while he is indisposed.\n"
VEN_news.46.a: "Just desserts for the Iron Tyrant."
VEN_news.46.b: "Whatever you think of the dictator, think more of Venezuela's future."
VEN_news.46.c: "The guns of the jungle finally found their target."

VEN_news.43.t: "[Get_newspaper_header]Marcos Pérez Jiménez Recovers"
VEN_news.43.desc: "Following a failed plot by the Seguridad Nacional's chief Pedro Estrada and the Minister of Finance Laureano Vallenilla Planchart to depose the comatose Pérez Jiménez and his second-in-command, Luis Felipe Llovera Páez, the 'Iron Tyrant' has returned and regained control of the country.\n\nVenezuela's security services and other areas of the state have been purged, with the returned President citing their treason and incompetence as rationale. In parallel, a major crackdown on the underground opposition movement both inside and outside Venezuela has begun, with key figures being targeted for assassination. Leaked documents indicate cooperation with the fascist Condor Legion to accomplish this. According to international observers, Pérez Jiménez's hold has only solidified after this crisis.\n"
VEN_news.43.a: "They tried, failed, and he still remains."
VEN_news.43.b: "A foundation stabilized with thousands of bodies."
VEN_news.43.c: "Our vigilance was not enough."

VEN_news.44.t: "[Get_newspaper_header]Marcos Pérez Jiménez Dies, Margot Inaugurated"
VEN_news.44.desc: "After tense weeks with little news from Venezuela, Margot Pérez Jiménez-Chalbaud, daughter of the former Venezuelan dictator, has announced the death of her father after an assassination attempt left him in a coma. A reorganization of the Venezuelan government is already underway and has noticeably purged many loyalists to the late tyrant, among them Luis Felipe Llovera Páez, formerly the Interim President.\n\nPedro Estrada, the Seguridad Nacional's chief, in cooperation with Minister of Finance Laureano Vallenilla Planchart, swiftly rallied the Civic National Crusade and Senate to install Margot in her father's place. The intelligence chief is expected to dominate the inexperienced Pérez Jiménez-Chalbaud's government. Estrada's dark reputation has some diplomats whispering that Pérez Jiménez's assasination may have been at his hands.\n"
VEN_news.44.a: "Weak fools hiding behind a skirt."
VEN_news.44.b: "Caesar is gone, yet his assassins remain clueless."
VEN_news.44.c: "One firm kick, and the rotten structure will fall."

# 1968 Elections

VEN_news.19.t: "[Get_newspaper_header]Francisco Arreaza Inaugurated as Venezuelan President"
VEN_news.19.desc: "A small miracle has occurred for the Democratic Republican Union it seems, as following the disastrous Presidency of Fabricio Ojeda, they have found themselves reelected with a narrow margin. Many have speculated the divisive campaigns of Democratic Action and COPEI contributed to this bizarre development.\n\nFrancisco Arreaza Arreaza, the political protégé of the party's chairman Jóvito Villalba enters Miraflores today on a promise of stability and prosperity, promising a calm maintenance of the status quo. This seems to have struck some type of accord with the national conscience, though detractors of the regime accuse Arreaza of being little more than a figurehead for Villalba's continued political vision.\n\nRegardless, Venezuela is one to watch."
VEN_news.19.a: "Another of Villalba's golden boys, tied by his puppet strings."
VEN_news.19.b: "The party of good governance, it seems."
VEN_news.19.c: "Respect and discipline will always make party politics better than populism."

VEN_news.20.t: "[Get_newspaper_header]Alirio Ugarte Pelayo Inaugurated as Venezuelan President"
VEN_news.20.desc: "Crowds gather in Caracas today as Alirio Ugarte Pelayo is inaugurated as President of Venezuela. A smoking Ugarte assured his supporters that a political transformation would soon begin. Promises he made during the campaign such as healthcare, education, and welfare reform, appear forthcoming.\n\nBorn the bastard son of the caudillo José Gabaldón, Alirio's rise from the lowest of Venezuelan society has been nothing short of inspirational. Building a reputation as an intellectual and orator over the last decade, his ideas have helped transform the Unión Republicana Democrática.\n\nFor today, at least, the people of Venezuela celebrate, and let out a small sigh of relief."
VEN_news.20.a: "Bastards will do as bastards do."
VEN_news.20.b: "An amicable, sensible man in a turbulent time."
VEN_news.20.c: "Let's hope he is more collected than his predecessor."

VEN_news.21.t: "[Get_newspaper_header]Miguel Burelli Inaugurated as Venezuelan President"
VEN_news.21.desc: "Venezuela has chosen its next leader, as Miguel Ángel Burelli Rivas ascends to the Presidency of the Republic. A renowned statesman, businessman and linguist, Burelli carries the torch of Jóvito Villalba and the Unión Republicana Democrática party's liberal traditions.\n\nHaving previously served as Foreign Minister, Burelli has earned a reputation as an internationalist and a deal maker. In his victory speech, the new President promised that pragmatic diplomacy and continued economic prosperity would be his core policy objectives.\n\nAs the Republic of Venezuela enters a new chapter, its people remain optimistic about their government and their future."
VEN_news.21.a: "Hands greased thickly with oil win out above real politics again."
VEN_news.21.b: "A careerist will always find a home in Venezuela."
VEN_news.21.c: "A known quantity, and good news."

VEN_news.22.t: "[Get_newspaper_header]Reinaldo Leandro Mora Inaugurated as Venezuelan President"
VEN_news.22.desc: "Elections have come to an end in Venezuela, and the candidate of the Acción Democrática party, Reinaldo Leandro Mora, has emerged victorious in the race for the presidency.\n\nHaving served for nearly two decades in the civil service, the foreign office, and as a congressman, few men can claim to be more experienced than the new President. During his campaign, Leandro Mora outlined plans to not only reinvigorate Venezuela's oil industry, but promote growth across the nation.\n\nFew are certain what this next decade brings, but many Venezuelans believe their country is in safe hands."
VEN_news.22.a: "Yet another feckless careerist, no surprise."
VEN_news.22.b: "The man's reputation precedes him, we hope for great things."
VEN_news.22.c: "Seems to be a measured man of great repute."

VEN_news.23.t: "[Get_newspaper_header]President Alirio Ugarte Pelayo Assassinated"
VEN_news.23.desc: "Tragedies strike thrice in Venezuela as, for the third time in two decades, a national leader is assassinated for the whole nation to see. Earlier today, Alirio Ugarte Pelayo, the helmsman of the ruling Democratic Republican Union party, was assassinated.\n\nThough Alirio may have proved a controversial figure within his own party, nationally he enjoyed widespread public support. It was during a visit to the Ministry of Defense, meant to secure support for his ministry, that a young army lieutenant would shoot him, delivering wounds that would place the President in a critical condition, with him passing in the early hours of the next morning.\n\nVenezuela's institutions lie in disarray, and much like the death of Rómulo Betancourt years before, few can predict what comes next."
VEN_news.23.a: "Socialists will always tear themselves to shreds."
VEN_news.23.b: "A man who served his country well, to the bitter end."
VEN_news.23.c: "Yet another tragedy befalls Venezuela."

VEN_news.24.t: "[Get_newspaper_header]Carlos Andrés Pérez Inaugurated as Venezuelan President"
VEN_news.24.desc: "Carlos Andrés Pérez was inaugurated as President of Venezuela today, representing a remarkable shift in the fortunes of Acción Democrática. After the party suffered a humiliating defeat in the 1963 election, Carlos Andrés Pérez, or CAP for short, brought it back to its popular, youthful roots.\n\nHaving joined the party in its early days as a student organizer, Carlos Andrés would make a name for himself through his charisma and fiery speeches. Now he has led the party to a historic victory.\n\nThe new President has positioned himself as a 20th century statesman, looking to grow the Venezuelan economy as well as battle the gripping inequality rife within it. AD supporters across the country now wait eagerly for the President's next moves as Venezuela steps into a new decade.\n"
VEN_news.24.a: "A populist like him is not always what they seem."
VEN_news.24.b: "A towering figure against the meritocratic traditions of Venezuela."
VEN_news.24.c: "A charming, reinvigorated figure - high hopes indeed."

VEN_news.25.t: "[Get_newspaper_header]Luis Beltrán Prieto Figueroa Inaugurated as Venezuelan President"
VEN_news.25.desc: "A new chapter is made in the history of Venezuela's ruling party, Democratic Action, today as she turns a new page, one flooded with new dreams and new ideas.\n\nLuis Beltrán Prieto Figueroa, a patriarch of Democratic Action since its inception, comes from a more left-leaning, egalitarian wing of the party, one that has long struggled for its place against the ruling Betancourtists. Riding a huge wave of public support for his policies and character, Prieto was able to win not only his party's nomination, but also the latest presidential election by a large margin.\n\nThis result will surely send ripples throughout Venezuela. For the first time since the death of her founder, AD has been reinvigorated, and holds the revolutionary flame aloft once again."
VEN_news.25.a: "Bowing to the pressure of the masses."
VEN_news.25.b: "A life spent fighting for the desperate and unprivileged."
VEN_news.25.c: "Acción Democrática opens a new chapter in its history."

VEN_news.26.t: "[Get_newspaper_header]Rafael Caldera Inaugurated as Venezuelan President"
VEN_news.26.desc: "A vibrant campaign and a message of peace and unity, it seems, have prevailed against all challengers in Venezuela, as Rafael Caldera, veteran political operator and stalwart of Christian democratic values, has swept into the Presidency. A career spent in the political wilderness developed Caldera's reputation as a man of integrity and pragmatism, which has allowed him to lead his COPEI party to a historic victory.\n\nCaldera has promised a renewed focus on agriculture and the rural sector while continuing to grow the economy. He also plans to resolve longstanding schisms between Venezuela and its neighbors, going so far as to propose negotiations with Guyana to resolve the Essequibo territorial dispute."
VEN_news.26.a: "Preferable to all their other poor options."
VEN_news.26.b: "A pragmatist, above all else."
VEN_news.26.c: "A real powerhouse in Venezuela's politics."

VEN_news.27.t: "[Get_newspaper_header]Lorenzo Fernández Inaugurated as Venezuelan President"
VEN_news.27.desc: "For the second time in a decade, the COPEI party has swept into power in Venezuela alongside its charismatic rising star, Lorenzo Fernández. A longtime ally and friend of former President Rafael Caldera, observers have said his victory represents a vote of approval for the programs and policies of the Social Christian party as a whole.\n\nCertainly no veteran to party politics, Fernández's unique personal charm and reputation made him the logical choice to succeed Caldera. In addition to continuing the policies of his predecessor, Fernández has promised to expand free trade and enterprise across the nation, ushering in a new age of economic prosperity."
VEN_news.27.a: "And so, the rot has set in for Venezuela."
VEN_news.27.b: "A capable successor, and a skilled orator to boot."
VEN_news.27.c: "Fernández will help safeguard our shared interests."

# Ojeda 2nd Coup

VEN_news.15.t: "[Get_newspaper_header]The Impeachment of Fabricio Ojeda"
VEN_news.15.desc: "In one of the more shocking situations to come from Venezuela, the sitting President, Fabricio Ojeda, known for his leftist revolutionary views, has been ousted in what is being considered an internal government coup.\n\nOjeda's socialist revolutionary rhetoric was always controversial nationally as well as within his own party, the Democratic Republican Union, being forced to appease the party's liberal majority.\n\nIt would, however, be this same faction, led by chairman Jóvito Villalba, that would spell the downfall of the President. As the Senate and the Palace of Miraflores are engulfed in a sea of arguments regarding the path forward, Luis Augusto Dubuc, President of the Venezuelan Congress, has been appointed as interim President until the next Presidential elections."
VEN_news.15.a: "Poking at the eagle's talons will never result in less."
VEN_news.15.b: "Ambitions are one thing, delivery is another."
VEN_news.15.c: "Ojeda was spirited, though went too far in his aims..."

VEN_news.16.t: "[Get_newspaper_header]Military Coup Topples Venezuelan Government"
VEN_news.16.desc: "Alarming news from Venezuela today, as once again the Armed Forces have seized power. The coup plotters, led by General Félix Román Moreno, stormed the Presidential Palace and arrested sitting President Fabricio Ojeda, whose socialist platform was an anathema to the Perezjimenista-era officers of the Venezuelan military.\n\nAfter months of rising tensions and increasing encroachment by the President on the military's hierarchy, General Román Moreno finally made his move, denouncing President Ojeda as a "national disgrace." Though the fate of Ojeda is yet to be determined, few expect a fair trial. Already, the General has announced his desire for changes to be made to the Venezuelan constitution, to ensure the nation is never again entrusted to socialists."
VEN_news.16.a: "The ever-unquenchable fury of the Armed Forces."
VEN_news.16.b: "Venezuelan democracy never stood a chance."
VEN_news.16.c: "Pérez Jiménez's meddling will come back to bite him, sooner than he may think."

VEN_news.60.t: "[Get_newspaper_header]Venezuelan Coup Foiled, Oil Nationalization Proceeds"
VEN_news.60.desc: "Chaos and celebration in Caracas today as thousands of citizens thwart the second coup attempt against Venezuelan President Fabricio Ojeda by blocking the military's route to the National Assembly. Loyalist police, National Guard and military units used the delay to surround and arrest the conspirators, including President of the Congress Luis Augosto Dubuc and several legislators.\n\nAfter fending off a military putsch in 1964, Ojeda's controversial push to nationalize Venezuela's oil industry united a broader coalition against him, including military nationalists, members of the opposition Acción Democrática, and the right-wing of his own Unión Republicana Democrática. Nevertheless, popular support and intelligence efforts by his Veracruz Pact allies overcame the threat. With key opponents now jailed and U.S. oil companies implicated, Ojeda's nationalization plans appear unstoppable.\n"
VEN_news.60.a: "Hoisted by our own petard."
VEN_news.60.b: "He can't keep getting away with it!"
VEN_news.60.c: "Their own Cárdenas - a hero of the Veracruz Pact!"
VEN_news.60.d: "At least there won't be blood."


GER_VEN.4.t: "Black Gold, Fool's Errand."
GER_VEN.4.desc: "If nothing else, Lake Maracaibo was certainly one of the prettier sights Kelker could find in this sorry venture. The view from the office space in downtown Maracaibo could have been better, but it offered one where the afternoon sun still shone off the water like a great, glistening sapphire. Just as attractive, for different reasons, was the series of titanic Oil rigs far along the horizon.\n\nOtherwise, logistical support for Venezuela was about as harrowing as a trip to the bathroom for the Deutsches Expeditionkorps. With the map laid out before him and a wax pencil in hand, Kelker's afternoon was one of 'dotting'. Dotting routes for fuel convoys to Guárico, dotting ammunition shipments to the frontline in Apure, dotting spare rotor part allocations for helicopters in Barquisimeto. At times, He had to stifle urges to 'dot' his own eyeballs, harshly.\n\n"-and reports of theft, again!" Colonel Carmona was well into his rant. "Men taking bribes, supply leaks on the motorway south, this is chaos!" Carmona could have been a lot worse, decent as he perhaps was to commandeer the upper floors of this office building for the ExKor. Kelker kept a tight lip, listening and nodding and not deigning to take any notes.\n\nKelker thought of a line by Junger, the chestnut about how men in the officer's club can 'talk' about goings-on at the frontlines. He recognized the scene, even if the backdrop was different. Gaps in supply, holes in infrastructure, with men at the front were struggling to simply not die. A bitter lesson, learned late, dotted in the paper trail on the road to Moskowien during the West Russian War."
GER_VEN.4.a: "Kelker drew a line: "No more trucks on that route, you're just feeding men to guerrilleros.""

GER_VEN.5.t: "Black Gold, Hard Hats."
GER_VEN.5.desc: "Up and down, up and down. The churning Oil derricks in the distance was at once benign and hypnotic, such was life working the refineries on the Orinoco Belt. That's how Solano saw it. As a Foreman, it was on him to keep the machine of the Venezuelan Oil industry, vital to the nation's economy, working at capacity. It was gritty work more of than not, but it was an everyman's kind of work. That was what made their presence in Orinoco so odd. The plant Solano worked at did so under the new safety and efficiency protocols, the ones created by the German technical mission since their arrival years ago. No one working at the refinery had an issue with the new rules anymore than Solano did, it was rather the... other additions to their work life.\n\nSitting in the cafeteria with the workers from his site, Solano spied the signs above the counter, written in both Spanish and in German, denoting both the caraotas and arepas they had on tap alongside boiled potatoes and weißwurst. The dual signage continued well outside the cafeteria, all the way to the front gate practically.\n\nIn that cafeteria were Solano's colleagues from the technical team, almost all German, who ate opposite to them. The technicians and the workers, the latter of whom were almost all Venezuelan, might have been a mirror image of one another, were it not for the obvious differences.\n\nHowever, the Germans were far from the most threatening presence in Orinoco. Plumes of black smoke billowed over the outline of the Oil derricks, somewhere beyond the fence where a truck had been hit by the guerrilleros just the other night. It had even Solano paranoid, checking and double checking security tapes for any sign of rebel sabotage. His supervisor, a stout German named Steinman, even he was weirdly helpful and accommodating in that regard; No anger, no dogma.\n\nHe just watched and took notes."
GER_VEN.5.a: "If there was any animosity, none was spoken aloud."

GER_VEN.7.t: "Black Gold, Black Eagles."
GER_VEN.7.desc: "Táchira was a different beast, one that Ulrich didn't expect to find so familiar. The Obersoldat remembered the stories of the march through Belarus, where his father had fought, and the dire tales he regaled his son with. Dark forests, long shadows, the eerie stink of wet leaves and rusting metal traps erected by Soviet partisans. One might say the apple didn't fall far from the tree, but one would have to ask where the tree was planted for him to wind up here, of all places.\n\nThe hinterlands of the Andes in western Venezuela wasn't like anything the ExKorps could have expected. One might have pictured South America as one giant jungle rimmed by a snaking mountain range, yet Táchira was closer to the mountainous forests of Europe than anything. Cold at night, breath misting up in front of you. It might as well have been the bloody Black Forest as opposed to the mouth of the snake the men of Wehrmacht found itself in.\n\nSergeant Budde motioned for the patrol to stop, pointing to ground. Tripwires, half-buried under the moss, guerrillero work. The Venezuelan soldiers, with whom the ExKorps detachment was to accompany on patrol, were quick to go to work, carefully disarming the trap with the point of a knife. No one said a word, something of a trend between the two of them. 'Ideas of nationhood were hardly welcome to any man in a place like this' His father's words.\n\nAs the patrol continued on, the crack of a gunshot was heard, somewhere well behind them, likely from one of their number, either grouping. One might ask why or what for or for who, but after Ukraine, Budde learned it was better not to think about it."
GER_VEN.7.a: "It always meant the same thing anyway, or so Budde told himself."

GER_VEN.8.t: "Black Gold, New Venice."
GER_VEN.8.desc: "The cafeteria at the Oil Refinery in Puerto la Cruz along the Orinoco was still open the day peace was declared, and while all were surely relieved on some level, it was received with the same uncanny banality as just about everything else at the plant. Solano and the Venezuelan workers toiled in the field, the German technicians walked the floors with clipboards while they checked readouts, inspected pressure gauges and logged maintenance cycles. What seemed strange before was only strange now in that it wasn't so strange anymore.\n\nAgain, Solano sat with his team at their table and ate. Again, Steinman sat with the technicians at their table and ate. Again, the cooks were serving arepas and caraotas alongside boiled sausage and potatoes, with signs denoting either written in both Spanish and German. By now, the Venezuelan crew had grown accustomed to the rhythm of things. Don't talk too much, do your job, keep your hard hat tipped low. No fuss, no muss.\n\nIn the distance past the cafeteria window, Solano could hear the tell-tale signs of his country rebuilding itself, the groaning of construction machinery along the highway dismantling the military barricades mingling with the churning of the oil derricks. Up and down, up and down. But as before, everything in the refinery was much the same, an engineering marvel, backed by the Venezuelan working class and German industrial science.\n\nIf anything, it looked as if the extraction and refining operation in the Orinoco was only just the beginning, with plenty of room to advance and grow. "
GER_VEN.8.a: "Everyone had their place in the sun."

GER_VEN.9.t: "Black Gold, White Feather"
GER_VEN.9.desc: "Gabriel Turmero was cleaner cut than his service record should have implied. Between the head-to-toe kevlar coverall and the well-maintained, working sniper rifle, he might have been mistaken for riot response or private security. The receding brown hair and close-cropped side burns added to the image of a professional soldier, something that the mercenary prided himself on, as not all hired guns necessarily had to look like one.\n\nTurmero couldn't say for sure, but he half-suspected that was part of the reason the catires had hired him. The Germans weren't always so picky about freelancer auxiliaries, especially now what with the Reds now in charge in Caracas, but Nazis were just another flavor of aristo and might prefer people more... pleasant to their eyes.\n\nRushing to escape the Reds, the last of the equipment had been loaded on the trucks. Yet despite the haste, the Germans remained precise, folding their maps, packing their rifles, sealing their crates. The trucks kicked up a cloud of dust, pushing past the checkpoint outside Barquisimeto like an olive-green caterpillar. Turmero and the Venezuelan mercenaries, rifles slung over their shoulders, said little, sharing a cigar while watching the Germans with muted curiosity as they pulled onto the highway and disappeared behind a curve of tall grass and eucalyptus trees.\n\nThere wasn't any hostility between them, weirdly, just the knowledge that the situation had changed. With the fall of the old regime, Turmero and the former men of the armed forces were just as out of a job as the former German advisors were."
GER_VEN.9.a: "The checkpoint would still be there the next day, as would Turmero, now paid by a Red manager."

GER_VEN.10.t: "Black Gold and the Deal of the Century"
GER_VEN.10.desc: "The doors to the conference hall at Miraflores Palace swung open at exactly 14:03, as if obeying an invisible chronometer. Hermann Josef Abs entered first, wielding an "H. Upmann" cigar - a trophy from a batch found in the wine cellar of the Hôtel Ritz Paris in the summer of 1940.\n\nHis entourage followed like a silent shadow: stone-faced men in grey suits of worsted wool, woven in the mills of the Ruhr. They clutched pigskin briefcases made in Offenbach. The clasps clicked shut with a dry, sharp sound, reminiscent of a hammer being cocked.\n\nAbs took his seat opposite the Venezuelans, not bothering with polite smiles. "Let us get straight to business, caballeros," he said. His Spanish was flawless, devoid of caricature, dry and functional. "The Siemens concern is ready to deliver the G-400 series pumping complexes, developed specifically for viscous crude, by March. Pipes of Krupp steel, rolled in Essen, will withstand pressures that would tear American counterparts to shreds. Our double-hulled tankers are already anchored offshore..."\n\nPedro Tinoco nervously twirled a Parker 51 fountain pen with a gold nib in his hands - a graduation gift from his father in 1948. He looked at the German and saw not a man, but a functioning machine.\n\n"...Washington and Madrid can offer you nothing, but we..." Abs continued, tapping ash into a massive crystal ashtray. "... Eight percent annual GDP growth. Guaranteed markets within the EEC. A seat in the engine of the global economy, not in the rear car."\n\nTinoco felt cold sweat forming beneath his shirt collar. To sign this contract was to shake hands with the devil. But the devil paid in gold, and the world stood on the precipice of the Oil Crisis. He unscrewed the cap of his Parker."
GER_VEN.10.a: "The Reichsmark has no conscience, but it carries weight."
GER_VEN.10.tt: "§!With our §Grecent victories§! in the Americas and the fading presence of [IBR.GetFlag] §OIbe§!§nria§! in the region, their [VEN.GetFlag] §SVenezuelan§! partners have deemed it §Rnecessary§! to seek [GER.GetFlag] §bour sponsorship§!.§!\n§F------------------------------------"

GER_VEN.11.t: "Black Gold and Yellowed Paper"
GER_VEN.11.desc: "Arturo Uslar Pietri stared at the folder lying on the mahogany desk, a piece of furniture confiscated from the estate of Pérez Jiménez back in the last decade. The signature on the document had already dried. The ink had soaked into the paper permanently, like blood into sand.\n\nThe German offer was flawless. The economic forecasts, typed on crisp paper, promised explosive growth. The green line on the charts shot into the stratosphere, promising to realize Pietri's greatest dream - to "sow the oil," turning black sludge into schools, hospitals, and roads. The Reich was winning in the Americas, and its shadow was covering the continent, offering protection and prosperity.\n\nDiego Cisneros, the Minister of Foreign Affairs, stood by the window, pretending to study the treetops in the courtyard. He avoided meeting the President's eyes. The oligarchs, the true architects of power, the ones who had put Uslar Pietri in this chair, had already made their choice. Cisneros was a friend, perhaps the only person in that clique of oligarchs with whom one could speak sincerely, but even he, one of its key members, dared not contradict the "Masters of the Valley."\n\nGerman capital flowed faster than American capital; it was more efficient and, most importantly, asked no unnecessary questions. Uslar felt nauseous. Nazism, that refined barbarism, evoked physical disgust in him, an intellectual and a writer. Cisneros felt the same.\n\nAnd yet, the deal was done. They had sold their souls to buy a future for the country. One could only hope that history would be a far more lenient judge than their own conscience."
GER_VEN.11.a: "Money has no smell."

GER_VEN.12.t: "Black Gold and a Distant Howl"
GER_VEN.12.desc: "The soundproof panels made of compressed cork were failing. The dull thuds of tear gas grenades and the crackle of automatic fire from the street leaked inside, creating a grim accompaniment to the Foreign Minister's speech.\n\nEdito Ramírez was spewing words, choking on his own panic. Drops of sweat fell from his nose onto the polished surface of the table, leaving spots next to the ashtray. He offered everything: oil concessions for ninety-nine years, full control over the ports of La Guaira, extraterritoriality for German garrisons.\n\nMoncada Vidal sat beside him, motionless as a statue. He stared at the German ambassador's cufflink - a gold disc with an engraving, gleaming dully under the light of fluorescent lamps that flickered treacherously due to power surges. The "Dance of the Dogs" was devouring Caracas. The streets were drowning in blood, and the Bolivarian regime was burning out like a discarded cigarette butt.\n\nOne thought revolved in Moncada's mind: they had bet on the wrong horse. Iberia turned out to be a decrepit nag that stumbled at the start. If ten years ago they had pledged allegiance to the Reich... perhaps now he would be drinking schnapps instead of listening to the mob outside demanding his head. He didn't give a damn about history. History is a fairy tale for survivors.\n\nThe German diplomats sat with faces hewn from granite. No emotion, no sympathy. The head of the delegation nodded slowly, cutting off Ramírez's stream of words. They saw before them a cornered, wounded beast that could be squeezed for every last drop of blood before being put down or chained up."
GER_VEN.12.a: ""We accept," the German lead diplomat said."

GER_VEN.13.t: "Black Gold and Cold Concrete"
GER_VEN.13.desc: "The air conditioner was running at full power, yet Hermann Josef Abs seemed to have brought the chill of northern Europe with him. In his hand smoldered a cigar - Brazilian, "Dona Flor" brand, from a special batch.\n\nAbs spoke calmly. His heavy German accent grated against the Spanish vowels, but the meaning was clear: growth. Not abstract liberty, but tons of steel, cubic meters of concrete, and kilowatts of energy. Leoch, the head translator, scribbled furiously in a notebook, trying to keep up with the technical terms.\n\nPérez Jiménez listened without interrupting. Inside him, a cold contempt for the rest of the world was festering. The Americans had betrayed him, bogged down in their own softness and flabby democracy. The Iberians were weak, like an old widow living on memories. Germany, however... Germany understood the language of strength.\n\nThe dictator's gaze slid over the map of the Americas hanging on the wall. The German eagle was spreading its wings over the continent, and only an idiot could fail to see which way the wind of history was blowing. Pérez Jiménez saw in Abs not just a banker, but a reflection of his own ambitions. There was no need for hypocrisy here.\n\nLeónidas Sánchez Carrero, the Minister of Foreign Affairs, nervously adjusted his horn-rimmed glasses, observing the scale of the concessions, and the growth that would come with them. But the General had already made his decision."
GER_VEN.13.a: "The Adler and the Troupial look in the same direction."

GER_VEN.14.t: "Black Gold and Apple Crumbs"
GER_VEN.14.desc: "Hans-Jürgen Meissner, senior analyst for the South American desk, carefully brushed a flake of puff pastry off the folder stamped "Vertraulich". The apple strudel from the "Buchwald" bakery, bought during his lunch break, was particularly good today - with just the right amount of cinnamon and warm vanilla sauce, which was now threatening to drip onto the report.\n\nThe document dryly outlined the facts regarding the regime change in Caracas. Meissner turned the page, licking the sweet sauce off the silver spoon. The situation was most curious. Venezuela, that oil barrel sitting on a powder keg, had changed owners once again.\n\nThe analyst chuckled. The Iberians, of course, consider this their victory. In Madrid and Lisbon, they are surely popping champagne corks right now, believing they have kept their wayward colony on a leash. Fools. The new masters of Miraflores Palace are clearly desperate for cash and technology, and the Iberian Union possesses neither in sufficient quantities.\n\n"Sphere of influence," Hans-Jürgen muttered, spearing a piece of apple with his fork. "Is a flexible concept."\n\nFor the Reich, this was a chance. The Americans had been kicked out, their "backyard" is burning, and the smoke from that fire smells of opportunity. Venezuela is not German yet, far from it, but the door that Washington tried to slam shut, and Iberia tried to brace with its shoulder, is now slightly ajar. And the toe of a German boot is already wedged in the crack\n\nMeissner closed the folder, wiped his lips with a napkin, and stamped it "FOR REVIEW." The strudel was finished, and with it, his interest in the suffering of a distant tropical country."
GER_VEN.14.a: "The door is ajar, and the German enters without knocking."
GER_VEN.14.tt: "§!The [GER.GetFlag] §bReich§! will only be able to claim [VEN.GetFlag] §SCaracas§! if\n [IBR.GetFlag] §OMad§!§nrid§! §Rloses its foothold§! in the [COL.GetFlag] §fNorthern Andes§! and [GER.GetFlag] §bGerman influence§! is sufficient to §Gfill the void§! in the region.\n§F------------------------------------"


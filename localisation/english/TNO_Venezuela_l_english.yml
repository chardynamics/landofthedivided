# USA_VEN.17.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM THE VENEZUELA OFFICE OF THE FBI\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: INTERNAL DISSENT WITHIN URD\n\nThe Unión Republicana Democrática represents a significant alliance of more nationalist elements within Venezuelan politics.\n\nWhile sporting a broad range of left-to-center ideologies with a significant appeal to many spheres of the local population, the party finds itself in a de facto split between the moderate liberals of Jóvito Villalba and a younger flank headed by socialist firebrand Fabricio Ojeda; the latter being, of course, our primary source of concern.\n\nThe hazard introduced by this growing radical wing is especially troubling when we consider its uncomfortable proximity to communist rhetoric. Accordingly, it is of paramount importance that we prevent these voices from overtaking the rest of the party.\n\nFollowing this intel, and as will be further explained in the attached document (see Addendum 1B), we hereby suggest that the best course of action would be to..."
# USA_VEN.17.a: "... aggressively push Villalba's image as a beacon of reason to empower the party's liberal-nationalist wing."
# USA_VEN.17.b: "...sabotage Ojeda's bloc via a covert disinformation campaign, supplemented by blacklisting and student group crackdowns."
# USA_VEN.17.c: "...avoid any intervention, and let both blocs fight one another."

# USA_VEN.18.t: "The Coming Storm"
# USA_VEN.18.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM THE VENEZUELA OFFICE OF THE FBI\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: MILITARY INTERFERENCE IN VENEZUELAN ELECTIONS\n\nUnfortunately, the best efforts of our agents on the field have not proven sufficient in completely silencing the rising voice of Fabricio Ojeda's bloc within the left-wing URD. Every day, more crowds are lured by the promises of "real, revolutionary change" pledged by these demagogues, especially among students and younger voters.\n\nWith the threat of the country's leadership falling under the yoke of communist radicals becoming even more likely as elections grow near, prominent reactionary wings within the Venezuelan military are growing more and more restless.\n\nWhat used to be ushered in officers' barracks is slowly turning into overt dissident talk across the whole rank-and-file, likely motivated by significant funding from the Trujillo regime. Our intelligence suggests that some major figures in high command are even considering the option of military action against the sitting government, should "the worst happen."\n\nAs the country's democratic institutions hang by a thread, their future might very well be dependent on whether or not we push in the right direction. Accordingly, we intend to..."
# USA_VEN.18.a: "...further our backing of URD through massive media campaigns, while ensuring proper election processes are duly respected."
# USA_VEN.18.b: "...fabricate a plausible scandal involving AD covering up sordid affairs of public suppression during the Trienio Adeco, to secure a win for URD."
# USA_VEN.18.c: "...cut our losses and withdraw all support from the URD, to prevent any form of coup from happening."

# USA_VEN.19.t: "In With the Old"
# USA_VEN.19.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM THE VENEZUELA OFFICE OF THE FBI\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: A NEW FACE FOR AD\n\nSitting in the dead center of Venezuela's political checkerboard, the old Acción Democrática arguably deserves credit for the founding of the Republic itself.\n\nFollowing the overthrow of the Medina Angarita regime in the 1940s, it is still fondly remembered as the one to lead the country's first democratically elected government, establishing most of the institutions that it still relies on today.\n\nToday, however, the party is only a shadow of its former self. With its previous shine as a popular vanguard having been snatched by the URD in the 1958 elections, the AD has been left with nothing but a rotting mess, festering with corruption and despised by socialists and reactionaries alike.\n\nWhile still retaining some measure of support among more moderate voters, pushing it again at the forefront of the ballot scene might prove to be a challenge, which suggests that we..."
# USA_VEN.19.a: "...encourage a new generation within the AD while addressing the corruption concerns, to provide the party with a fresh new face."
# USA_VEN.19.b: "...embrace the party's underhanded approach, and slowly elevate its relevance through the use of bribes and blackmail."
# USA_VEN.19.c: "...leave it to its own devices, and let the party implode without our involvement."

# USA_VEN.20.t: "Exposed"
# USA_VEN.20.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM THE VENEZUELA OFFICE OF THE FBI\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: SOCIALIST OBSTRUCTION IN VENEZUELAN ELECTIONS\n\nAs elections approach, recent polls have yet to guarantee a win for the old Acción Democrática. However, an even more pressing concern has recently been sparked, as members of the party's leadership are suspected of being involved with some groups of student activists in rigging almost a dozen electoral districts.\n\nWhile investigations remain ongoing, alerted left-wing opposition figures are now threatening to release the scandal to the general public. The party has asked for our support in the matter, or at least our silence as they work on covering it up on their own.\n\nWe are now standing at a crossroad. Maintaining our current support for AD would mean preserving the current, corrupt, but stable structure, entrenching it into power should they win the ballot. However, refusing to bail them out would risk providing further justification for reactionary military elements to launch a coup.\n\nFollowing these concerns, our next course of action has been resolved to..."
# USA_VEN.20.a: "...dedicate all our efforts to burying the info, and silence the whistleblowers, forcefully, if needs be." 
# USA_VEN.20.b: "...ensure the scandal gets leaked, then discredit it as a cheap propaganda tactic by fascist dissidents."
# USA_VEN.20.c: "...refuse to involve ourselves one way or another, and let it all blow over."

# USA_VEN.21.t: "Shifting the Dice"
# USA_VEN.21.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM THE VENEZUELA OFFICE OF THE FBI\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: EMPOWERING COPEI\n\nComité de Organización Política Electoral Independiente, founded by respected academic Rafael Calcerda, is a coalition of independent liberals, Christian democrats, and social conservatives united in support of their vision for a republic rooted in moral ideals.\n\nIn stark contrast to the varying controversies surrounding its main competitors, the party surprisingly stands out for its apparent lack of corruption and internal scheming. At least on the surface, they successfully maintain a rather "clean" and honest public image, consistent with their claimed goal of a more transparent democratic process.\n\nPredictably, this message of reason, compromise, stability, and cautious modernisation struggles to connect with any significant voter base, most finding themselves way more easily swayed to the fiery populism presented by their counterparts.\n\nOf course, it is nothing that cannot be changed with just a nudge in the proper direction. To stimulate an increase in their future relevance, our office encourages efforts towards..."
# USA_VEN.21.a: "...providing funds to Christian activist movements and other Church-linked NGOs to further the reach of existing civic campaigns."
# USA_VEN.21.b: "...assisting them in siphoning discontent union moderates from their rivals in the AD."
# USA_VEN.21.c: "...doubling down on the party's platform of restraint by condemning its more radical internal wings."

# USA_VEN.22.t: "Hail Mary"
# USA_VEN.22.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM THE VENEZUELA OFFICE OF THE FBI\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: WORRYING OPPOSITION PERFORMANCE IN VENEZUELAN ELECTIONS\n\nDespite our previous actions having clearly proven their effect in elevating the Christian-democratic COPEI's popularity across the right and center, our intelligence predicts that most voters, especially young and lower-class urban residents, remain overwhelmingly attracted to URD and AD, which is further confirmed by recent pollings released by the Caracas press.\n\nIf an electoral victory for COPEI is a considerably more realistic prospect than a few months ago, it remains far from being a certainty. Furthermore, the party's campaigning efforts will soon end up being limited by the narrow reach of its current voter base; yet attracting the ear of other spheres of Venezuela's population risks proving just as difficult.\n\nIndeed, while Rafael Caldera's public speaking ability is not especially lacking, it just does not hold the same fire and raw magnetism of figures like Ojeda to rally the crowds. With this option off the table, and finding ourselves short on alternatives, we might end up having to resort to..."
# USA_VEN.22.a: "...pursuing our current course, and ensuring their core voter base doesn't slip from their grasp."
# USA_VEN.22.b: "...trying to appeal to students and more skeptical activists to steal the young vote away from URD."
# USA_VEN.22.c: "...taking the cover of Catholic charities to infiltrate the urban slums, and draw working class voters from AD."

# USA_VEN.69.t: "The Purge of Pride"
# USA_VEN.69.desc: ""The Yanquis for decades have told us proud Venezuelan people that we are equal, and then they put us in chains. They shackle us to their foreign capital and demand that we be grateful for the privilege. Their plutocrats grow fat off our people and say, 'You are free, free to enslave yourself to us with a smile.' Here is where I say no more. It was the blood and sweat of the Venezuelan people that turned this land into a paradise, and it is to them that the bounty belongs. And I say now, it shall be taken back by those same hands."\n\nVidal's paramilitary forces were already ready for his announcement. At oil wells in the Orinoco Basin, American executives were beaten with the butts of their rifles, and engineers pulled from their work sites and dragged off. Most were handcuffed, insulted, and dragged back to Caracas to be paraded as the visible effects of their victory. Those who resisted were beaten, sometimes dying from their injuries. Still others were never heard from again. If it was owned by a Yanqui, it was free game. Everything from hard currency held in Venezuelan banks to cars driven by American workers. Vidal's paramilitary forces demanded that most of the more lucrative gains be turned over to senior leaders, but no one cared when someone suddenly had a few extra rings on his finger.\n\n"I swear this to you as your leader, I will stop at nothing to ensure that Venezuela is the vibrant and prosperous nation that I already know it can be, and it starts by purging ourselves of corrupt influences. The United States and their puppets, whether that be their slave-nations in the OFN or their bootlicking dogs in the OAS, will be expelled from our shores. Our lives, our destiny, shall only be seized by our own hands, and no one else's. Venezuela, I am here before you to say, greatness is within our grasp, if only we have the will to seize it!""
# USA_VEN.69.a: "Nothing could be heard but rapturous cheers."

# USA_VEN.70.t: "We're (Not) Going To Take It"
# USA_VEN.70.desc: "From: Office of South American Affairs\nMemorandum for the Director\nSubject: Venezuelan Unrest\n\nFollowing Moncada Vidal's nationalization of oil companies, expropriation of foreign-owned resources, and expulsion of foreign nationals in Venezuela, the Vidal regime has been gripped by crippling protests and labor strikes. The seizure of these industries and the arrest of several prominent Venezuelan managers, foremen, and technicians as accused collaborators with foreign powers have had significant negative consequences. Families of the arrested individuals and people who fear the Vidal regime may turn upon them have protested the regime, and numerous individuals have taken up arms against state facilities.\n\nPredictably, the Vidal regime has acted with a heavy hand, deploying riot police to city centers and employing very loose rules of engagement that have resulted in numerous dead and wounded. This has only galvanized protests further. These protests cross multiple political persuasions and appear to have the idea of opposing Vidal's repression as the sole unifying force. Factions within this protest movement are numerous and uncoordinated; however, the sheer mass of protest, including strikes in several key industries, including construction and teamsters, has brought the country to a state of near-economic paralysis. The Vidal government is considered to have a high likelihood of facing a serious threat to its internal stability, with a very credible chance of government overthrow or collapse.\n\nThis message has been sent to the Department of State with instruction to produce a diplomatic response and to create possible action options for the President, from economic sanctions and a blockade to an invasion, which may or may not be conducted under the auspices of the Organization of American States. It is expected that our agency will be included in a National Security Council crisis session within 96 hours."
# USA_VEN.70.a: "Fidelity, Bravery, Integrity"

# USA_VEN.71.t: "Dog Days"
# USA_VEN.71.desc: "The conflict in Venezuela had been called the Dance of Dogs due to the rapid militarization in the streets, but within the highest halls of American power, dogs danced all the same.\n\nIt was an illustrious meeting at 935 Pennsylvania. The President had seen fit to attend the meeting, along with several members of the OFN High Command and the Secretary of State. J. Edgar Hoover knew that this would be a monumental meeting and needed to ensure that all of his reports were perfect. He had demanded his aides go over every single piece of paper to look for the smallest infraction of grammar or punctuation. When the dogs assembled, the slightest misstep could give a signal that you could be eaten alive.\n\n"Intervention has the highest degree of success. The Vidal regime has state capacity to handle its own internal affairs absent any foreign intervention, and they are sure to receive intelligence from abroad," the representative from the South America division finished their presentation to a mix of enthusiastic murmurs and ambivalent facial expressions.\n\n"Unilateral action by the United States will galvanize Venezuela. We need to use the OAS to secure local buy-in. That will rob Vidal of one of his principal messaging pillars." Hoover looked over at the Secretary of State as he spoke unprompted. Someone had been as well prepared as he, a dog eager to ensure he could chew his bone until he reached the marrow.\n\n"It will take time to secure the vote. Wouldn't Venezuela have the time to prepare?" President [USA.GetLeader] offered.\n\n"Better this than the logistical nightmare of operating without local support. Venezuela is hated by the OFN and OAS both, Mister President." Hoover offered, ensuring that the bowl was ready for the dog to have his meal."
# USA_VEN.71.a: ""Ready the OAS vote. I want every base covered.""

# USA_VEN.72.t: "Executive Update: Militarization of Bandera Roja"
# USA_VEN.72.desc: "To Director Hoover:\n\nThe recent militarization witnessed in the urban center of Caracas, dubbed the Dance of the Dogs by local reports, has prompted mass mobilization of rural communist cells in the southern regions of Venezuela. The cells, while heavily decentralized under local commandants, are primarily a continuation of Fuerzas Armadas de Liberación Nacional (FALN), now referred to as the FALN - Bandera Roja (Red Flag). \n\nAlthough previous assessments in the agency showed a growing extent of leftist guerrilla activities within Venezuelan borders, which had accelerated following the takeover of Moncada Vidal's Bolivarian regime, its full membership remained unclear until the present moment. The re-established FALN is currently under the command of Américo Silva, a former FALN caudillo adhering to the communist Amazonist ideology. As the Vidal regime mobilizes its resources for the ongoing conflict inside urban areas, the FALN has initiated a large-scale takeover of the state's southern countryside.\n\nThe FALN officially espouses a staunchly nationalist, anti-colonial rhetoric in opposition to both the Bolivarian government and American institutions across the region. Therefore, it is prudent to consider any damages to the organization as collateral in future peacekeeping missions. Regardless of their political goal, for the time being, they have proven valuable in diverting the government's forces. US infantrymen will need any bit of help we can afford in the next few days."
# USA_VEN.72.a: "All agents are to be at full readiness for the imminent invasion of Venezuela, per the Director."

# USA_VEN.73.t: "A Hundred Objectives, One Mission"
# USA_VEN.73.desc: "The view from on high was exceptional. The OFN had quickly seized control of the skies from the Venezuelans and had used that opportunity for everything from recon to ground attack. Second Lieutenant Alexander Cooper saw his target and radioed in to ensure that everything was good for launch. He had a fighter accompaniment, not that he particularly needed it. He could not be contested in the air. When his computer locked onto his target, a Venezuelan depot, he knew that the country could not contest his presence in their airspace, and they could not stop the missile about to streak home. The targeting computer lit up, and Cooper knew that he was ensuring that the Venezuelan vehicles were not going to do anything in this sector but look pretty as they were destroyed.\n\nThe reports from earlier in the conflict had given Ron Hembrecht cause for alarm. The Venezuelan army had been said to be unstoppable when they first crossed the border. Hembrecht knew that wasn't the case, given the changing circumstances, but under thick canopy, artillery was chancy and air support was worthless. But he was a soldier of the rightful Dutch government, and he would not fear the fascist tendrils of the Vidal regime. As his squad came upon the Venezuelan firing point, they saw a curious sight. Abandoned tanks, without fuel to spur on their retreat. The Vidal regime hadn't pushed for supplies, and their equipment was a bounty for Suriname to take. For a brief, guilty moment, Ron envisioned these tanks being used to take back Antwerp and liberate his home, but he divested himself of the thought; he needed focus to ensure his mission was a success.\n\n"We have expelled the Venezuelan invaders. The Essequibo is where it should be." The words were what they needed to be, as was he. He was put in place to administer the Venezuelan portion of the disputed territory until a formal arrangement could be set. With the OFN and Dutch military governorates, everything was secure. All that needed to be done was secure the territory and wait for Vidal to be beaten back."
# USA_VEN.73.a: "A thousand voices with one singular purpose. Vidal never stood a chance."
# USA_VEN.73.tt: "§FWith the success of the operation, the §J@VEN fascist invaders§! has been expelled from §<Essequibo§! region forevermore, and the §mOFN§! has entrusted it back to the @GUY §IGuyanese§! government, temporarily under supervision of the §U[SUR.GetNameWithFlag]§!.§!"

# USA_VEN.8.t: "The People's Voice"
# USA_VEN.8.desc: ""Esteemed members of Congress", began Rafael Antonio Caldera Rodríguez, "I would first like to properly thank you for granting me the honor of being invited within the confines of this historic edifice; one I have the utmost respect for. I pray your administration will show the same eager ear and goodwill to my country as it has shown to myself today." The recently inaugurated Venezuelan head of state waited a moment for the applause to subside before resuming his address.\n\n"Just like you, I've been elected to embody the will of my fellow countrymen. To serve the millions of voices that have chosen us to represent them, and ensure they will always be heard. This duty, I would argue, is our shared burden as democratic nations, and what this very Capitol around us stands for." A brief pause, before he pursued. "Yet as I speak, republican values are hanging by just a thread in my home region, threatened by forces wishing nothing more than to smother these voices and see Latin America fall to despotic rhetoric. It is no surprise to me that the United States has safeguarded these sacred institutions for more than a century. Now, God willing, I ask you to do the same for your democratic partners, and help me preserve peace and stability in my own home." Another round of clamor rolled across the Hall, joining his own words as he went on.\n\n"In return, I reaffirm that Venezuela remains committed to these very same goals across the entire OFN. In fact, we gladly intend to cooperate with Canadian and Guyanese authorities toward quickly resolving our regrettable ongoing dispute over the lands lying west of the Essequibo River; in a way that, I hope, will be satisfactory for all of our nations. Thank yo-"\n\nBarely a mile away, in a quiet office on Pennsylvania Avenue, the TV screen turned to black, images of the House Chamber replaced by a glossy reflection of J. Edgar Hoover releasing the remote, as the glass of champagne in his other hand slowly rose in silent toast."
# USA_VEN.8.a: "One to democracy."

###CUT OAS INVASION EVENTS

  # GUY_US.56.t: "Away"
  # GUY_US.56.desc: "In the tiniest corner of Minnesota, nestled on a quiet hill a couple of miles from little Melrose, stood an old apple tree where still dangled the aging swing upon which three generations of Peterson children had all sat in high spirits. Climbing its chains would lead one to reach the crumbling remains of the old tree fort that the four of them had erected back in better days. From there, one would only need to keep balance for a couple more steps until reaching the tip of the branch; then, one could just extend their arm and almost touch the faded timber walls surrounding the only home they'd ever known.\n\nThere, resting under the shade of a roof whose rusting tin had long been peeled off any scrap of paint, one window stood of particular note. Their "secret passage," their childhood self would dub it: a dozen-or-so feet jump in and out of Mark's old bedroom, completely unbeknownst to their parents. Of course, the room itself now held not much more than sorrowful mementos, and a dusty picture of his brother in marine fatigues standing on some beach near Manila. Grinning, like, oh, how much he hated that stupid grin. His brother, oblivious that his final cruelty would be to forever mock them in mourning.\n\nSo when the camera's flash would find Private Miller Peterson's squad raising the OAS standard in the midst of Carúpano's city hall, it would not find him grinning. The picture would paint him bearing the same composure as when they'd emerged hours prior from the Sucre coastline to fall upon the overwhelmed Venezuelan national guard units. As committed to free this land from the Bolivarist yoke as he was to never inflict upon his family the pain of a second grinning absence.\n\nWhat it would never show was what he saw staring right back at him, as his gaze wandered around the streets he and his peers had just reclaimed. From the curious kids trying to steal a glance at their peculiar liberators, to the mothers nudging them back inside their home in hushed, urgent tones."
  # GUY_US.56.a: "The hatred."
  # GUY_US.56.tt: "§YAs the OAS intervention penetrates deeper into Venezuelan territory, [USA.GetFlag] §MPrivate Peterson Miller and his platoon§! will uncover the horrors that await them within.§!\n§F------------------------------------\nNew decisions in the §YVenezuelan Civil War§! tab will be unlocked."

  # GUY_US.61.t: "Keepsakes"
  # GUY_US.61.desc: "Screw it.\n\nThey were so close now, he could almost see them: blurry grey mounds stretching along a speck of the horizon above the sea. Trinidad was only a few miles away, and Lieutenant Olson's last hope had been that they'd chance upon a fishing boat large enough to pack some of them. But as expected, the beach stood just as empty and bare as the previous ones. A bit further along the eastern coast, nearer to the Columbus channel, and perhaps a few could have tried their luck to swim across. Yet months on the run had exhausted all of them. Guerrillas had chased their lot through half the bloody land until there was nowhere else to fly.\n\nYeah. He was so, so tired, and that place was as good as any for a last stand. All he could do now was sit and wait for death to come. And right now, it was closing in as faint flashes of red and orange light behind his iron sights, evolving in the distance across the thicket. Searching for them. Drawing nearer by the hour. All had heard the stories about what awaited the captured rank and file, but he knew the worst was saved for officers like himself. Both the reds and fascists had their own special little rituals, and he'd rather not guess which was the one expecting him. \n\nSo his thoughts instead went to the missing spots in his platoon that would be spared the treatment. Those they'd lost to lead, illness, or just had to be left behind. Those he'd failed. Multiple names ran through his head, the ones he could remember. For some, only faces stood out, among which the one of a quiet fellow. Youngest of his platoon. He used to wonder where the lad's mind always went; even now, he lingered a split moment on that trivial riddle he'd never get the answer to. Then, a sigh, and the face was gone for another.\n\nBut in the tiniest corner of Minnesota, nestled on a quiet hill a couple of miles from little Melrose, still stood an old apple tree."
  # GUY_US.61.a: "One that would soon be faced by another dusty portrait."

  # GUY_US.62.t: "Cinders"
  # GUY_US.62.desc: "In the tiniest corner of Minnesota, nestled on a quiet hill a couple of miles from little Melrose, stood an old apple tree. And it was right there.\n\nIt had always been there, of course. He'd carried it with him all this time, through hell and back, the one constant in a mind filled with all the horrors that the last months had forcefully funneled into him - a story obviously much less frightening than musing on when it had stopped being the truth.\n\nBut it had never been this close. There, surrounded by the chants, the cheers, and the clanks of Polar Pilsens, amidst the thick cigarette smell mingling with the stench of rotten fish that permeated La Guaira's harbor, filled with all manner of dockworkers giving a wide berth to the celebrating soldiers. Others, too, had chosen to partake closer to the wharf, staring at the formidable expanse that was all that stood between them and home. The Caribbean, solemn, blue and beautiful, shining under the morning haze... and across it, something that now, as it was almost within reach, felt just as dull as the myriad memories he'd strived to deaden his mind toward rather than face. So as he prepared to board with the remnants of his platoon, Private Miller Peterson stopped right in front of the steps to instead glance the other way. \n\nHe wasn't sure what he expected. The sand, the streets, the scents: it was more or less the same coastline that had seen him land so many months prior. And one last time, it stared right back at him. Mangled. Muted. Utterly indifferent, not unlike him, or the locals who so avoided meeting his gaze. No, not exactly indifferent; it was a form of silent, numb anger, too worn and wearied to display, but there all the same. A scar that would never quite fade away, of the same breed as the one it had imprinted on him, too. And had only grown since their passage.\n\nBut it was the same. And it still hated him."
  # GUY_US.62.a: "How much he wished he could hate it, too."

# USA_VEN.61.t: "Seeds"
# USA_VEN.61.desc: ""Hey, loosen up. He's unarmed," he said, without removing his eyes from the shirtless figure he was kneeling in front of. "Just wants a couple of cans in exchange for-"\n\n"Tell him to piss off. We've got none to fucking spare," answered one of the platoon's men, iron sights still raised at the youth. "What's preventing us from just taking his bloody pet and be done with it?" raised another. "Maybe even dump the lad in the river, in case-"\n\n"It's just a fucking kid," cut Private Miller Peterson again. Dim firelight flickered on the boy's tanned face. Numb, empty eyes, too old and red for his age, blankly gazed at the handful of 5.56 the soldier dropped in his frail little hand. Then, at the leash that had been holding the goat by his side, now being gently led away by the man.\n\nWith a bit of luck, the boy would be able to trade the bullets for a hot meal or two in a nearby village - though he wasn't sure if he truly believed that, or if it was just an attempt to assuage his guilt as he peered at the flames where was now roasting the animal. The image kept running through his mind. His ribs, clearly visible through the rags, betraying a body already battling on the edge of starvation. And as all around the camp rang hollow cheers in anticipation of the feast awaiting the men, it just kept coming back - right until gunfire raining from the thicket found him cowering on the ground alongside his squad.\n\nHe wasn't sure if it was the FALN, or the Bolivarians. Some tried shooting back toward the darkness, others were crawling as low as they could toward their bags and whatever else was within grasp. Then, in the blink of an eye, it was already over. Bodies laying lifeless under the trees as all around sprouted cries for medical assistance. And all the while, Miller could only stare at the penumbra where the guerrilleros had retreated, wishing a young, tan-skinned boy wasn't staring back."
# USA_VEN.61.a: "But something had already started to snap, and he would never get it back."
# USA_VEN.61.tt: "§!The §Lfall of §YCiudad Bolívar§!§! means a §Gsignificant success§! for our war efforts inside [VEN.GetFlag] §SVenezuelan§! territory."

# USA_VEN.62.t: "King"
# USA_VEN.62.desc: "In the tiniest corner of Minnesota, nestled on a quiet hill a couple of miles from little Melrose, stood an old apple tree surrounded by... nothing. Everywhere you'd look beyond his family's timber cabin, more grass and fields and empty roads awaited to brim the horizon. Growing up there, would it surprise anyone that a child's bored mind would attempt to fill the void with his own minute world? High and proud on his feeble tree fort, gazing at his domain like a tiny lord. The wooden fences would become mighty walls, the rare passerbys his loyal subjects, and the dirt lanes connected every speck of his domain. There wasn't much to replicate this feeling. Yet, peering at the endless plains of the Venezuelan Llanos almost came close.\n\nOf course, that corner of the world lacked not for its own lot of differences from the one he longed for. Ground was wetter, for starters; a fact not helped by the eight days of constant rain that had begun assaulting Private Miller Peterson's platoon shortly after taking San Fernando, though he was glad the Apure still proved much less of a nightmare to cross than the Orinoco. The list went on, and he tried to look around for even more, and stare at anything that wasn't-\n\nBut the flames rising from the hacienda were getting harder to ignore, and so were the distant screams of its occupants. FALN raid, maybe. Or just as likely, the estate's workers were riled up to lynch its owner and family along. The kind of stuff the platoon was getting used to, just like being ordered to stay put and not get involved. How did they even do it? Staying numb to it all? At which point he, too, had grown to accept not being sickened by the thought?\n\nWhen the shrieks eventually stopped, a very slight hum he caught from his Sergeant was all that was left to disturb the quiet. Some Elvis tune, he recognized; perhaps the sole human sound there was in this Godforsaken place. And when he began to hum along was when he decided that numbness was, in fact, quite soothing."
# USA_VEN.62.a: "Like a sweet song of a choir."
# USA_VEN.62.tt: "§!The §Lfall of §YSan Fernando de Apure§!§! means a §Gsignificant success§! for our war efforts inside [VEN.GetFlag] §SVenezuelan§! territory."

# USA_VEN.63.t: "Ghosts"
# USA_VEN.63.desc: "In the tiniest corner of Minnesota- no, what was the point anymore? All he could think about right now was pushing one step in front of the other, drawing grunts from his exhausted body that only ended up being swallowed by the mountains. Rain had finally ceased mere days after they'd left Mérida, its parting gift being a mist as thick as milk now engulfing them on all sides, as if uncontent to leave without mocking them a final time. Blurry silhouettes silently proceeding through the brume was all he could discern from his fellows, which, for all he knew, could have just as well belonged to the guerrillas tracking them. In truth, he didn't even have the faintest idea of where they stood now. Adrift across some nameless place in the northern Andes, heading towards God knows where. If there was any direction to begin with. Maybe the fog was their whole world now.\n\nSomewhere, perhaps above, Private Miller Peterson believed he could almost perceive the hint of a church bell's toll. Carried by the wind from a nearby village, or maybe just the product of his mind. He noticed the shape ahead of him had gone still. Then, slowly emerging from the fog, the figure of his sergeant raising a hand in motion for the patrol to stop. He took advantage of this rare moment of respite to rest his weary limbs, lying against a rock, awaiting the others to join them at the ridge. He overheard an anxious corporal whisper something about being followed, stating that it was "how they moved", though he wondered if "they" referred to the FALN, or something else hiding in the mist.\n\nHe noticed he couldn't hear the bells anymore, and tried not to entertain the thought too much, ignoring the hammering in his chest as if his own heart was trying to escape his miserable body. Rummaging through his pack in quest of something to smoke, his hand instead marked a pause at something else: a tiny chunk of charcoal chalk he'd forgotten he traded for half a piece of hardtack with some Barinas local. Without much thought, he began scribbling the first words that came to his mind on his helmet."
# USA_VEN.63.a: "God forgot this place."
# USA_VEN.63.tt: "§!The §Lfall of §YMérida§!§! means a §Gsignificant success§! for our war efforts inside [VEN.GetFlag] §SVenezuelan§! territory."

# USA_VEN.64.t: "Fireflies"
# USA_VEN.64.desc: "There was a strange sort of beauty to it.\n\nEverywhere beneath, the city extended as far as the eye could see, filling the horizon with tiny golden patches of life scattered around lakes of darkness here and there where power had failed.\n\nBut more than Caracas' lights, the young soldier's gaze was set on what stood right above, wreathed by a crown of clouds that made it stand even more surreal. There, from the vantage point he'd chanced upon on the nearby Valle Arriba residential area, Private Miller Peterson was watching the mountain burn.\n\nEven half a dozen miles afar, glowing orange lines clearly pierced through the night, like oozing wounds seeping into El Cerro El Ávila's core. The Venezuelan capital's signature landmark, which he'd heard described in all kinds of awe as they'd pushed their way through the Mirandan countryside, was now scorching in front of his very eyes.\n\nOne desperate attempt from the guerrillas to cut the voltage lines to stall their advance, he'd heard some of the locals claim. Others, more quietly, still shared the rumors that it had been the army trying all they could to root the former out. He wasn't certain which option he actually believed. Or preferred. Fuck. Did it even really matter? Same fire, all of it, ever since he'd landed in this wretched country. Spreading far and wide, and engulfing everything in its path. No halt in sight, nor did it concern itself about who or what had sparked it. So why should he?\n\nHe almost unconsciously snapped the radio shut, silencing the chatter about government officials found dead in the Miraflores Palace by besieging OAS forces in an apparent mass suicide. There. Peace, if only for a fleeting moment, was all he wished for right now. And muzzling down that corner of his mind that appeared so hell-bent on spoiling it."
# USA_VEN.64.a: "Miles below, another speck of light went dark."
# USA_VEN.64.tt: "§!The §Lfall of §YCaracas§!§! means a §Gsignificant success§! for our war efforts inside [VEN.GetFlag] §SVenezuelan§! territory."

# USA_VEN.65.t: "Eve"
# USA_VEN.65.desc: "In the tiniest corner of Minnesota, nested on a quiet hill a couple of miles from little Melrose, stood an old apple tree whose snow-covered leaves would every year find themselves adorned with garlands and colorful hangings.\n\nAnd although he'd found some solace in the palm that he and his platoon had spent the evening decorating with shell casings and cigarette foil in a drunken haze, and the cheers they'd shared in this precious brief instance where they didn't have to worry about incoming bullet hail, Private Miller Peterson wondered why none of it quite felt right.\n\nHe'd just woken up in the middle of the night, in a bed that wasn't his own and a house that neither felt familiar, with a parched throat and a searing headache that gave him hints at how last night might have proceeded.\n\nPiercing through the muddled fog of his mind to fetch some scattered memories gave him more flashes of recollection. Oh, he'd partaken, eaten, and sang, drank and indulged a little more than was reasonable, danced with a lovely girl who was still lying peacefully asleep beside him. Perhaps even exchanged a few bold promises that they'd both earn to regret as morning came. God, he hoped not. He struggled even to remember her name.\n\nThough maybe it was the point, and all of this pretense had provided them all with exactly the escape and solace they needed, however fleetingly. Even that late in the night, he could still hear the aguinaldos echoing across the street from the half-collapsed chapel the locals had chosen to spend the festivities in. Yeah. It was a good night. One that, scarcely hours ago, he could have caught himself wishing it'd last forever and more. And yet...\n\n"Merry Christmas," he whispered as he watched the lights fade in the distance."
# USA_VEN.65.a: "But no one answered."
# USA_VEN.65.tt: "§!The [USA.GetFlag] §Mgovernment's§! failure to get §&our boys§! participating in the [VEN.GetFlag] §SVenezuelan§! war effort by §yChris§!§xtmas§! represents a §Rdefeat§! in the eyes of our civilian population.\n§F------------------------------------"

# USA_VEN.66.t: "Rot"
# USA_VEN.66.desc: "In the tiniest corner of Minnesota, nestled on a quiet hill a couple of miles from little Melrose, stood an old apple tree that'd stubbornly kept bearing fruit every fall without fail for the past decade and more. Blessed, his old pa' would swear to whoever deigned to hear him, though mom would soon quip that the bountiful harvest could just as well be attributed to hard work and honest care. But all the Peterson siblings would concern themselves with in these moments was the sweet, sugary flavour filling their palate as they bit into the red fruits without a care in the world.\n\nPrivate Miller Peterson wondered how long he'd dwelled there, lost in these thoughts. He didn't quite know what had even caused him to stop. Perhaps it was the humming of the radio, still crackling with life through the humidity, bathing the empty hamlet with the joyful tunes of Billo's Caracas Boys. Distorted plucks of bandolas echoing through the silent streets.\n\nAll around him, rotting shacks on stilts erected above the swamp lay without their former owners, with only pots still hanging over cold embers betraying their until very recent occupation. Somewhere behind him, the rest of his platoon was still waddling through the half-flooded Delta Amacuro to reach the abandoned village. But what had drawn him stood right ahead: a pristine mango tree, where still-unplucked fruits patiently awaited him.\n\nHe absentmindedly reached for one, turning it in his palm. God. How long had it been since he'd tasted something fresh? And right there, for just a moment, he found himself transported to some place he longed for; right until his jaw was filled with the taste of gasoline and the putrid sourness of a fruit probably spoiled by leaking drums from the last supply convoy.\n\nHe would spit, retch, try to wipe down his throat with a few gulps of his whiskey canteen..."
# USA_VEN.66.a: "...yet the bitterness relentlessly clung to his mouth."

# USA_VEN.67.t: "Sick"
# USA_VEN.67.desc: "In the tiniest corner of Minnesota, nested on a quiet hill a couple of miles from little Melrose, stood an old apple tree that-\n\nAnother gunshot rang outside the tent, snapping him back to a present he wished he could escape for just a few moments more. The crumbled paper in his hand smelled faintly of gasoline, just like everything else, really, yet he treasured it all the same. He'd read it twice already, then once again, even as the ink had begun fading from the sweat of his palm. Chinook had brought it bundled with the rest of the morning's supply run: a letter from his younger sister back home.\n\nOh, she went on and on. Minnesota's weather this time of the year. That college that mom was nagging her on about, the one she'd soon abandon them for, as if the Twin Cities weren't right next door. He could barely repress a chuckle as he pictured their father rambling again about his back sores. God, after two weeks without a single mail, even the neighbor's new dog was everything Private Miller Peterson could care about, however much he tried to ignore the-\n\nOne more bang. Eager cheers from the corporal attested that he'd got it this time. "Zamuros," locals would call them: ugly black vultures that had been circling their trash pit ever since the platoon had set up camp along the Orinoco's banks. Yesterday, or perhaps the day before, the man had started hunting them, probably to avoid growing insane from days of sitting still and awaiting orders. Or maybe he'd just already lost it.\n\nHe wondered when they'd start moving again. Peering outside, the river dominated the horizon, stretching as far as his eyes could venture, splitting the whole country in two. His thoughts went back to some boatman who had stumbled upon them a couple of days earlier. His frown, as he spat over the side, muttering something about "el río ya esta enfermo." And even though Miller could not utter a word of Spanish..."
# USA_VEN.67.a: "...he could already guess what the man had meant."

### CUT GERMANY EVENTS

# GER_VEN.6.t: "Black Gold, Bright Minds."
# GER_VEN.6.desc: ""-but you can see here why stress tolerance is vital to its use in construction." Professor Diáz pressed a button and the projector rattled forward to the next slide, clacking with mechanical cadence. "Steel is indeed meant to bend to some degree, but you are typically encouraged not to tempt fate with how much." The lecture slides were all written in Spanish, but the text books that they pulled from, like the diagrams themselves and his old studies in Hamburg years ago, were all German.\n\nOne of the students studying engineering at the Universidad Central de Venezuela lifted his head from one of those text books, raising his hand. "Professor, these infrastructure designs are different from last week, just like the week before, why is that?" Diáz tried not to show obvious concern. "New logistics, d-developments along the motorways, you understand." He blurted, the attempt only seemed to half work.\n\nIn his own defense, he had reason to be wary. Even on the way into the University that morning, student and faculty alike had to step over a growing stack of sand bags as Venezuelan soldiers set up a checkpoint at the intersection outside, one they would have to gingerly step past on their way out after class.\n\nEstablishing a defensive line for security reasons was an easy explanation, but it ran deeper than that. Truth be told, the UCV was a well-known enclave for FALN sympathizers, some even calling it a recruiting ground for the UTC paramilitaries, the guerrilla's urban wing. Honestly, Diáz couldn't tell if the soldiers outside were on guard duty or running a secret anti-communist sweeping operation."
# GER_VEN.6.a: "The bell rang, students began leaving. Out in the hallway, a wall scrawling, in bold: "DEATH TO THE NAZIS AND THEIR JALABOLAS!""

### CUT MEXICO EVENTS

# MEX_VEN.21.t: "The Pact Frays"
# MEX_VEN.21.desc: "REPORT ON VENEZUELAN INSURGENCY\nDIRECCIÓN DE SEGURIDAD INTERNACIONAL\nISSUE: Suspected Cuban Involvement in Venezuelan Insurgency\n\nDespite the collapse of Castro León's putsch, the situation in Venezuela still remains unstable. The Venezuelan Acción Democrática (AD) government has tightened its grip over the cities, employing mass arrests from Caracas to Maracaibo. Despite the crackdowns, guerrilla activity is still intensifying. Small, well-armed cells continue to emerge.\n\nHowever, disturbingly enough, intelligence has revealed that our ally, Cuba, is behind Venezuela's unrest. Their dislike of Venezuela's moderate government has led them to funnel weapons, funds, and liaisons into the nation. Not only does this pose a significant challenge in onboarding Venezuela as a Veracruz member, but it is also a breach of trust between Mexico and Cuba.\n\nWe assess that at this rate, the insurgents could very well hinder Caracas with Cuban support. Should we intervene and discipline Cuba, this could splinter our bloc. However, remaining passive would erase all our hard work in bringing Venezuela into our sphere of influence.\n\n:The choice is yours, Su Excelencia.\n\nWith cautious urgency,\nColonel Rangel Escamilla"
# MEX_VEN.21.a: "Cuba needs to know their damn place..."
# MEX_VEN.21.b: "I'd take Havana over Caracas any day..."

# MEX_VEN.22.t: "Caution For The Cause"
# MEX_VEN.22.desc: "Fidel was attempting to puff a chain of cigar rings of progressively smaller diameter into one another when his secretary entered into his office, with a large yellow envelope in hand. "I apologize for intruding, El Comandante, but an urgent report from Mexico just came in."\n\nFidel smirked. "No need to apologize, my dear. I wish you came around more often. Just leave it on my desk." His secretary blushed. As he watched her exit out, Fidel tore open the envelope with a pen knife. It was a report from the SNI. "Here we go," he sighed. The Venezuelans had found out about the support he had been providing the communist guerillas in their country, and they were pissed.\n\nFidel mumbled the letter softly, each word intonating itself with more anger towards the SNI. "We demand that you immediately end this illegal meddling in our country's domestic affairs, or there will be serious conseque-"\n\nHe crumpled the report up, tossed it aside, and lit a new cigar. "Who do these people think they are?" he thought to himself. The revolutionary fight against the corrupt, autocratic jackboot regimes of the Americas wasn't going to be put down by some strongly worded letters. All the same, it would be wise to be more careful going forward and limit the amount of aid Cuba funneled into that country in particular. He didn't want to attract too much ire."
# MEX_VEN.22.a: "Sometimes you have to take a step back before you jump forward." 

# MEX_VEN.23.t: "Over the Mountains"
# MEX_VEN.23.desc: "For those in the capital, Lara state was thought of for little other than its rich agricultural produce. But for others, the extreme levels of its urban-rural divide offered opportunity. And this was what the 11th Brigade of the Simón Bolívar Guerrilla Front recognized.\n\nThey were assembled here, on the outskirts of El Tocuyo and well away from prying eyes - not that anyone who might have seen them and who was not already sympathetic to the revolutionary cause would live to tell the tale. They had an appointment to make and, as a smaller party emerged into the small clearing, still well-hidden by the deep hills, they did so.\n\nComandante Carlos Betancourt, better known as Jerónimo, strode forward in front of his men and shook the hand of the Cuban who came forward to meet him. The man was one of a small cell who had been infiltrated into Venezuela, together with modern weaponry and large amounts of supplies, to assist in the cause. The help was warmly appreciated.\n\nThe men claimed that Comandante Castro had sent them to join the Brigade and further the revolution. Jerónimo had some suspicions about their ultimate goals, but neither he nor his men could refuse the weaponry offered. So the new comrades clasped hands and sang revolutionary songs.\n\nAnd looked forward to employing said weapons against the regime."
# MEX_VEN.23.a: "It will be an unpleasant surprise."


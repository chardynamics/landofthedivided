##Ministers
VEN_Jovito_Villalba_hog_desc: "§YMinister of Internal Affairs\nNational Liberalism§!\n--------------\n§LTo take a man of middling stature like Jóvito Villalba lightly would be to greatly mislead oneself. Though his well-mannered demeanor and weary appearance may incite visions of a civil servant or accountant more than a revolutionary, without Villalba, Venezuela would not breathe today. What an Amazonian soldier does with his rifle and spirit, Villalba has done with equal fervor through impassioned speeches and late nights of writing.\n\nFrom his days as an idealistic student campaigning against Gómez to his stand against Pérez Jiménez, vigor and integrity remained core to Villalba's values. Though he would suffer for it, from jail to exile, he remained unbroken. In 1952, he would stand against Pérez Jiménez, defeating the dictator in a military election at the zenith of his influence. For the years following, an exiled Villalba would become the mouthpiece of resistance against the regime, lighting a match that would explode into a wildfire in 1958.\n\nLarrazábal would see a kindred spirit in Villalba, stepping down from office to run alongside his newfound ally. A populist campaign of restoration would follow, in which Larrazábal would become its grinning public face, and Villalba its arms and legs.\n\nJóvito has built the government he was denied in 1952, with the trust of the people and faith in his government, hoping to usher in a wave in politics, one where his vision for URD and the country may come to fruition. Not just a party of hope, but one of national unity to bring together all of Venezuela's lost children and give them the torch to light their way forward.§!"
VEN_Alfredo_Tarre_Murzi_sec_desc: "§YMinister of Defense\nChristian Progressivism§!\n--------------\n§LWriters and politicians usually come hand in hand, the frantic scurrying of ideas, the chaotic drumming of mental noise, the fuel of caffeine and alcohol, and the somber bliss of completion of said work. For Alfredo Tarre Murzi, this has made the marriage of the two in his career a perfect compliment.\n\nWhen Tarre Murzi writes, he is a critic - ever at the typewriter, infallible and indomitable, and when he is a politician he is frugal, warm, and a keen negotiator. Such skills have made him an indispensable pick for Jóvito Villalba's cabinet; a man able to read the turning tides of the new decade of Venezuelan history built in the fallout of the Pérez Jiménez dictatorship.\n\nTarre Murzi has worked tirelessly to create a Venezuela of compromise, between the military, the police and the people. Though this has never been easy, riots plaguing the first two years of Larrazábal's presidency, and military dissidence remaining a core issue within the country, the forces that once were at one another's throats have settled their daggers at ease, at least for now.\n\nAs for Tarre Murzi, he remains the conciliator in all of this. Where lesser men may have perhaps bowed to one or the other, or cowed to both, he, with all the warmth an aging statesman can give, reminds the disparate of Venezuela they owe allegiance not to him, but to their country.§!"
VEN_Miguel_Angel_Burelli_for_desc: "§YMinister of Outer Affairs\nLiberal Conservatism§!\n--------------\n§LIn backrooms filled with the ashy air of cigar smoke, and sweaty men pouring over policy reports and documentation, hastily desperate to ensure their own horse wins in the proverbial constant race of politics, Miguel Burelli Rivas stands as a man at ease. The gristle of the underside of politics has long remained his forte, whether that be the schizophrenic world of foreign affairs or the nail-biting psychosis of economic policy - Burelli Rivas remains a careerist through and through.\n\nBorn to an Italian father, languages would come easily to the young Rivas, learning several before even leaving university in Madrid. A core internationalist, he traveled vast distances before being ushered under the wing of Jóvito Villalba, who quickly recognized a protégé within him. When traveling, his thick jowls, smoker's voice, and bulldogged persistence would soon win him comparisons to a young Republican front-runner, to mixed reactions from Burelli himself.\n\nGoing forward, Burelli has placed his trust in Villalba - Venezuela needs leadership above all else, politics aside. After the decade his country has seen, all Burelli seeks is competence, from whom and where, irrespective.\n\nGood politics require good men.§!"
VEN_Fabricio_Ojeda_eco_desc: "§YEconomic Minister\nRevolutionary Gaitanismo§!\n--------------\n§LAmongst the heroes of the 1958 Venezuelan Revolution, the downtrodden and lost Venezuelan society sings only one man's name from the bell towers to the slums.\n\nFabricio Ojeda, one of Venezuela's youngest politicians at only seventeen, became a pillar of the emerging Unión Republicana Democrática. Hopes of a republican society, truly free of the ties that had bound it, were scattered to the wind, however - Venezuelan democracy, like its founder, Rómulo Betancourt, would perish on a cold January morning.\n\nIn the hushed society built by Pérez Jiménez, his lofty ambitions would crush those on society's lower rungs like ants. Ojeda would stand in open defiance with the people of his birthplace. Though Larrazábal may have led the Revolution, without Ojeda's rallying call or communications across all of Venezuelan society, no coup would have ever been possible.\n\nIn the post-war government, Ojeda had won Larrazábal's trust as an apt Economic Minister. In a few short years, the boot of Perezjimenismo had been lifted from the people's necks. In Ojeda's deepest wishes, however, the boots that once wished to crush them would soon be on the feet of every man and woman in the barrios - not just to walk towards a brighter future, but to dare to run to it.§!"
#Traits
ojeda_eco_trait: "Champion of the Poor"

#Leader Bios
POLITICS_VEN_WOLFGANG_LARRAZABAL: "For a man of the Navy, a long voyage becomes a thing of simple beauty - the whistling wind on weather-beaten faces, the cold lapping of the tides, and duty, most importantly, to both one's sailors and vessel. Though the Palace of Miraflores may have whisked this sailor far from the shore, that duty has never died - like the sound of the tides, it follows him through sleep and wakes and guides him even in the most tumultuous storm. Wolfgang Larrazábal may now pilot a vessel far larger than he ever did as an Admiral, with a crew far larger than he ever thought possible, and yet duty remains.\n\nFrom sea to land, Wolfgang Larrazábal would find himself elevated to astronomical heights in the coup of 1958. In its wake, it would be he, alongside his colleagues, who would carve a new Venezuela from the ruins of the Pérez Jiménez government. Larrazábal's commitment to the principles of democracy would bring his winning smile and charming demeanour into the hearts of the Venezuelan people. Unsatisfied with the Venezuela he left behind, Larrazábal's charm would ensure his victory in the 1958 election and allow him to build something from the ashes - a Venezuela with promise against the tumultuous tides of history.\n\nAnd so, from the wheels of the Navy of the Caribbean Sea to that of a nation, Wolfgang Larrazábal steers his burgeoning country with care. Struck with tragedy after tragedy, it is Larrazábal's dream that the decade of punishment will end for Venezuela, and in its place, the modern Venezuela built by Betancourt so many years ago will thrive - with a careful steer and a keen eye dead set on the horizon."

#1963 Candidates
POLITICS_VEN_FABRICIO_OJEDA: "After a decade of slumber, Venezuela and all her peoples have finally awoken. Though Ojeda tried to wake her once before, guide her hands through the black, only now, armed with the instruments of a party, has he taken the reins. Venezuela will not transform through guns and smoke as the vanguards of the revolutionary left believe, but through the shattering applause of a nation, gifted with a party to truly serve them.\n\nUnión Republicana Democrática stands transformed, Venezuela set alight with hope and the people's rest vindicated.\n\nBut can a decade of change happen in only five years? As Fabricio Ojeda flings open her dusted curtains, he finds a nation laid bare. Inequality and corruption are not the fault of her politicians, grown fat on the delicacies of power, but indeed her system, built haphazardly by parties more focused on their image than their people.\n\nThe revolution Venezuela so desperately craves must be a quiet one. The anticipated voices of the masses must hush, if only for a moment, and lie in wait to not tempt the wrath of the nation's wolves. For with hope comes fear, and with fear comes vulnerability, and the admonitions of the pasts and her ghosts. Ojeda must walk a line far thinner than expected, lest he summon those phantoms to suffocate his young revolution in her infancy."
POLITICS_VEN_RAUL_LEONI: "The rise and fall of Acción Democrática's fortunes in the last ten years have been nothing short of monumental - from the party that ushered in change to a new republic, to the one stripped from politics, and with its leader dead, laid bare to the elements. To think AD died with Betancourt, however, would be to fall exactly into a facade presented by Raúl Leoni's enemies as he gracefully plays a full hand.\n\nSkill and intelligent maneuvering have remained pivotal to the success of Leoni's career. He prefers assurances of certainties rather than the flashy charm of populism or brief respite of socialism. In the wake of Gómez, it was he who drew out a constitution in Barranquilla, and it is he who knows for the good of Venezuela that a plan is only half in motion.\n\nVenezuela in the wake of surging tides needs consensus - an end to the extremists which pervert the democratic vision and to the men of the military's tiring arrogance. However, this Venezuela is one still in the making, and as Raúl Leoni leans back in his chair, in the last hours of the nation's longest card game, he rests assured.\n\nHe holds half the deck."
POLITICS_VEN_RAFAEL_CALDERA: ""Unity, above all," said Andrés Bello - these words, among many others spoken from Simón Bolívar's teacher, have become the doctrine of his fiercest student, Rafael Caldera. At only nineteen, Caldera would first sway a population and then a president with his writing, entering office a year later.\n\nHis political career began with the National Labor Office, but his burgeoning career as an outspoken reformer won him a place within Betancourt's first government. A master of his art, whether it be political science or language, he soon founded the Comité de Organización Política Electoral Independiente (COPEI) - a party the first of its kind, one that the peasant in Apure and the businessman in Zulia could nod in agreement to. COPEI, alongside her sister parties in URD and AD, would fight tirelessly for the end of the Pérez Jiménez years, and Caldera would emerge the champion of cooperation between the three.\n\nAs Venezuelan divisions only build up walls, Caldera seeks to tear these down, to heal the wounds his nation has inflicted upon itself and reconcile Venezuela's wayward children under one roof again. Through reconciliation and compromise, maybe some good may come from all the tragedy of the last decade. It will be no easy role, indeed it is to battle against the tides of history, but as Rafael Caldera stares upwards at the painting of Simón Bolívar that sits tall opposite his timeworn desk, he only worries that he won't be able to heal her soon enough."
POLITICS_VEN_GONZALO_BARRIOS: "The death of Rómulo Betancourt at the hands of Trujillo's assassins sent the nation into a stage of violent, wailing grief. First, she wept for her favorite son, second she denied, third she burst into fury. In the wake of this national tragedy, it would be Gonzalo Barrios who, in such a short time, would harness the nation's anger. Now, the streets of Santo Domingo feel the fruits of that grief in their plainest possible terms.\n\nBarrios earned his right of passage in Venezuelan politics after his first exile in 1929. Reentering politics in the wake of Gómez's death, his distinguished charm and earnest ways would win him easy acclaim within the public eye. A string of short-lived attempts at building his own party would soon see him conceding to his political adversary, Rómulo Betancourt - an early animosity that would blossom into deep mutual trust.\n\nWith Betancourt's death, Barrios' career and the fate of Acción Democrática were scattered to the wind. In exile, it would be Barrios who matched the ferocity of Pérez Jiménez from New York, Ottawa, and Mexico City - whether by his passionate delivery or moving words, at least a little of Betancourt's vision lived in the hearts of thousands, spurred awake by the words of a single man.\n\nIn this new Venezuela, a tragedy may still linger in the spirit of AD, but, if he is able, Barrios will seek to finally lift the clouds that have so fogged his mentor's legacy - inspiring hope rather than bitterness, to set a nation free."
POLITICS_VEN_GONZALO_BARRIOS_78: "Many statesmen carve their names into the hearts of the masses through the chaos of fiery speeches, or the image of strength, or cunning. It is strange, perhaps, that the calm, warm and hospitable familiarity of Gonzalo Barrios has won the people of Venezuela over. While none could call a man of imposing, or one of ferocity, he has no less proven himself a man of passion and one of hope.\n\nBarrios earned his right to passage in Venezuelan politics after his first exile in 1929. Reentering politics in the wake of Gómez's death, his distinguished charm and earnest ways would win him easy acclaim within the public eye. A string of short-lived attempts at building his own party would soon see him conceding to his political adversary, Rómulo Betancourt - an early animosity that would blossom into deep mutual trust.\n\nFrom the scattered jigsaw of Betancourt's death, Barrios, alongside Raúl Leoni, would win back the mandate of trust from the people of Venezuela. Now, on the backs of the foundations laid by Leoni, Barrios embarks on setting Venezuela off the shore into a new decade.\n\nWith the beating sun of his forefathers behind him, and the bellowing cheers and hollers of a nation whose trust he holds to his heart Betancourt sets sail as captain of a party reawakened."

#Jovito Villalba
POLITICS_VEN_JOVITO_VILLALBA: "The short, unassuming figure of Jóvito Villalba may not strike the image of a Great Caesar, a seasoned revolutionary hero, or a charming, grinning statesman. However, as Villalba takes his seat at the table of his entrusted cabinet ministers, both he and his ministers know his work past, present and future will speak far fiercer in the annals of history than any glitz and glamor.\n\nLooking forward to a decade of change, Villalba casts his mind back to his party's founding in the tumultuous tide of the Trienio Adeco. Even in the face of the dictatorship's imposing fist, Villalba held strong, and so will he in the decade to come.\n\nSurrounded by the intellectuals of Venezuelan society, its scholars, captains of industry and career politicians, Venezuela is ripe to enter the 20th Century. From the sparkling rubies of the Venezuelan coast, to the rugged emeralds of its great south, Venezuela finds herself approaching a decade of transition - one which will be driven by her greatest minds and most level of heads."
POLITICS_VEN_JOVITO_VILLALBA_MENDOZA: "History, they say, is the study of circles of constant repetition - a great cycle of politics, culture and society. Though time and time again the turbulent winds of transformation may batter that precedent, nevertheless is that proven right. Once again, as he did a decade before, Jóvito Villalba stood tall against the pillars of tyranny - and this time, he won.\n\nThe Easter Coup smothered the young Venezuelan Republic he helped foster in its crib. Through reckless ambition and reckless militancy its potential was squandered, and alongside it, the ambitious dreams of the 1960s. A decade later, an older, more emboldened Villalba stands ready to make sure nothing of the same repeats again - that this new republic stands strong against her worst inhibitions.\n\nYet he fights against a challenge tantamount to the last, the nation's very spirit - her constitution, which lies in the hands of the nation's oligarchs, with the haciendas left to bathe in their spittle. To heal a nation is one thing, to break such a system remains impossible.\n\nAs much as he may plan and dream, Jóvito Villalba remains confined by the systems which surround him, of which inhibit his chances of true progress. Through screwed political craftsmanship, careful planning and dedicated effort, Venezuela may one day become what he envisioned. If so, at the cost of a long shadow lingering over his shoulder."
POLITICS_VEN_JOVITO_VILLALBA_78: "The people of the state are mercurial, on one day they may condemn you as hopeless, on the other they may sing your praises. Time waits for no man, and yet, as he is inaugurated in the twilight of his years, Villalba feels a strange vindication within himself, as a man who, irrelevant of time, remains a pillar of the national conscience.\n\nThough he would announce his retirement from party politics, the father of the Unión Republicana Democrática would never quite be able to let his vision for the country leave his mind. Even in the quiet countryside home, a worry enraptured him that never could quite be shaken.\n\nYounger hands proved incapable of taking the party's wheel, grappled with the reality of party politics. In the face of that all, the worry that enraptured Villalba's heart turned to desperation, of - at all costs - to bring his party back from the brink.\n\nAnd so, a decade and a half after his first stand, Jóvito has done so again and won. Though the spirited dreams he had a decade before may lie shattered, new ideas have emerged, ones he can only hope will stand to define a new decade, even if not the one he originally envisioned."

#1968 Candidates

#URD
POLITICS_VEN_Francisco_Arreaza: "The inscrutable ambition of a ranch boy has proven an unshakeable force within the shifting Venezuelan political scene. Francisco Arreaza Arreaza, born to a long line of Anzoáteguian politicians and ranchers, shone as bright as the state's beaming sun with the Unión Republicana Democrática, one that quickly won him the attention of Jóvito Villalba.\n\nFueled by easy confidence, voracious speeches and ferocious dedication to his craft, it is no surprise that Arreaza easily climbed the meritocratic ladder of URD. From the ranches to the front benches of the Senate, Arreaza proved that in the young Venezuelan republic, any man can make himself a king within his craft.\n\nLeft with a nation in turmoil in the aftermath of the Ojeda Presidency, Francisco Arreaza plans to not just restore respect for the party's image, but for the Venezuelan nation as a whole. From the lowest slums to the highest balconies, in the new Venezuela, every man serves a purpose in a nation where they may all be their own kings."
POLITICS_VEN_ALIRIO_UGARTE_PELAYO: "Luck was never on the side of the young orphan discarded outside a pharmacy on a hot summer eve by the great caudillo José Rafael Gabaldón. The curse of bastardy lay heavy from boy to man, and yet perhaps it was such adversity, such condemnation for the manner of his birth, that lit a fire in him that has never dimmed since his days as a firebrand student.\n\nA diamond amongst the rough of his upbringing, Alirio excelled against the rest - impeccable intelligence, a quick wit and faster tongue brought the man to dazzling heights. Novels from eight, a lawyer by nineteen. For Alirio, the glass ceiling has never been a barrier, but a goal to shatter.\n\nA rising star within the Partido Democrático Venezolano, Alirio's ideas soon found themselves too large to be contained within a mere party, a vision inspired by his life perhaps, of opportunity and equality, in a land coming to stand tall after centuries of turmoil.\n\nIt is this that he so seeks now, a land of opportunity - where no man by birth or creed will be denied his chance to strive, and every man may reach out his hand, to find it clasped back in solidarity."
POLITICS_VEN_MIGUEL_ANGEL_BURELLI: "A deep grin smothers the face of Burelli's face as the Presidential sash is laid across the broad chest of the President. Ideas, once passionately flicked around the tables of smoky boardrooms, run through the head of the President-elect as those dreams dance towards the light of a new day.\n\nAn internationalist by trade, through sweaty handshakes, tedious negotiation and riotous laughter, Burelli Rivas was able to reimagine the new Republic in the eyes of the world in 1958. Now, it is that same tenacity and character that has won the love of the people as well, and a country to lead into a fresh decade.\n\nBureaucrats scurry and pens fly as Venezuela is laid bare by the countries natural scholars, intellectuals and artists - above them all Burelli Rivas assures a crowd of those charmed by the Unión Republicana Democrática - a new beginning, and a greased palm in a world of opportunity and progress.\n\nBut for now, this vision subsides, as the grandeur of the office overtakes the President and, even if, for a moment, he lets himself indulge in all its grandeur."

#AD
POLITICS_VEN_LUIS_BELTRAN_PRIETO_FIGUEROA: "The young Republic may have been built by Betancourt, but it is on the backs of the cheers of the people. In a quiet revolution, Betancourtism would sweep the nation into a decade of prosperity. With the winds of change beating his brow, Luis Beltrán Prieto Figueroa, "The Big-Eared", now stands in the place of the titan, his words never forgotten.\n\nA teacher by trade with that same passion would enrapture an already experienced Prieto in the transformation of his country following the fall of the Andean caudillo - Juan Vicente Gómez. During the founding of Acción Democrática, his voice and tenure proved one to aspire to, to inspire, one that would prove vital to the party's founding.\n\nTo think now, against the wishes of Adecos past, Prieto has come out triumphant against the malaise that has struck his party, is something that will never feel quite right with the aging statesman.\n\nNow, as he stands the barricade against the howling winds that threaten to rupture his beloved country he wonders how a small man from Maiquetía could ever hope to usher in a new decade, a new country and a new people.\n\nAcción Democrática is transformed - and with it, Venezuela."
POLITICS_VEN_REINALDO_MORA: "Oh, the man so cast off, the man devoid of party populism, devoid of the vanity of Presidency, a career built not on sand but on soil, on success rather than promises. It is true he may not possess the flash of his compatriots, nor the poise of his adversaries, but through candour, not circusery, Reinaldo Leandro Mora has won the nation's love, and soon he will win their respect, without any dirty tricks.\n\nA long-term careerist and diplomat, Leandro Mora spent his time on the floor of Congress, or in the bustling halls of party headquarters, or in decadent offices of ambassadors. For him, a career was not built on lies and promises, but brick by brick, accomplishment by accomplishment.\n\nWas that from the persistence of Acción Democrática? From a long career of bridge building, of mending the damaged political scene, of stretching out a hand to the broken soldiers of the Amazon? The answer is a resounding no, he won because he ran on a campaign of trust, of a man that Venezuela knew, one they could trust even in her most tumultuous storms.\n\nNow an army of bureaucrats, businessmen and kingsmen stand to Leandro Mora's call - and for what? A nation redefined, where party popularity no longer defines the individual but instead every man moves together, as citizens of Venezuela and patriots of the nation.\n\nAfter a decade of division, a harrowed country, with Leandro Mora's hope, may finally come together as one, to deliver its people a future they will be proud of."

#cut
POLITICS_VEN_JAIME_LUSINCHI: "Around her delicate slopes and valleys and curves Venezuela is scarred, cut and left to bleed by the horrors of the Perezjimenista Dictatorship. Those wounds may have now closed but within them rests a parasite, one waiting to surface within its host. It is ironic therefore that when a doctor would take the reins of her Presidency, one committed to stitching up these old wounds, lest a parasite as deadly as the last overwhelm Venezuela again.\n\nDuring his student years in Medical School, Lusinchi would more and more find his eyes drifting away from ambitions of a surgeon and more and more distracted by the rapidly transforming status of his nation. A brave and confident speaker within Student Organizing, a boldness matched in the new Democratic Action party would soon attract the two together.\n\nSharp, relentless and quick witted, it would not take long for Lusinchi to elevate the upper echelons of the party's management. Lusinchi's willingness to compromise and endless drive towards progress has led to him becoming the fiercest ally of Gonzalo Barrios, of whom both men share a like-minded view towards progress.\n\nYet for Lusinchi that progress is not enough, Venezuela's rapid transformation is half turned. For a caterpillar to transform into a butterfly she needs rest, reform and resurgence, until she can fly unfettered."

#COPEI
POLITICS_VEN_LORENZO_FERNANDEZ: "To win one man's trust in the dog-eat-dog disarray of Venezuelan politics is hard; to win the trust of two of the most defining men of the decade takes exceptionalism - something that Lorenzo Fernández has long demonstrated in spades. From a child prodigy to the second-hand man of Rómulo Betancourt and Rafael Caldera, Lorenzo Fernández's career has already accomplished so much and yet not half enough.\n\nA promising student from his youth, it would be a well-fated meeting with a young Rafael Caldera that would propel the young man into prominence. First came Acción Electoral, then COPEI - the brainchild of a triumvirate of bright young minds, a party of unity and intelligent politics for every man.\n\nWithout Fernández, Caldera knows COPEI would have remained a pipe dream. Though he would briefly leave the party upon Betancourt's request to host him in cabinet, he returned triumphant to its fold after the 1958 exile and has crafted opposition policy long since.\n\nNow in office, Fernández seeks to revolutionize the nation's Interior Relations, its defense, and its attitude towards its people. With luck, allies aplenty, and patience, Caldera and Fernández will carve a Venezuela the likes of which have never been seen before."

POLITICS_VEN_LUIS_AUGUSTO_DUBUC: "Through bespeckled glasses, a withering look and a constant shuffling of papers, few would have expected Luis Augusto Dubuc to be material for the Presidency. As Dubuc looks over the chaotic enmity, riotous impassioned shouting and chaos of the Congress he once called home, he, of all, feels ill-prepared in the thunderstorm that has enraptured him.\n\nLuis Augusto Dubuc began his career in Acción Democratica at its birth, a scholar by trade, the party's early image was grown by his tireless battling on its behalf in a young and untested Congress. When his party, alongside the honesty of the Congress, was cast away with the Perezjimenista dictatorship, Dubuc continued his dedication as a party man, retreating into the grass rather than facing arrest.\n\nFew would expect a scholar to be a guerilla, but it was so that Dubuc would become a warrior, as the OFN battled the forces of the dictatorship. From the rapid distribution of anti-Perezjimenista propaganda to political sabotage, it was him who took the fight of those exiled home for the regime to beat. Yet even in all the flurry and chaos of those years - predictability came with them, now chaos has subsumed his every moment.\n\nThe same liberators of the nation now turn inwards as a vicious cycle envelops his beloved Congress. Party-man turns on party-man as sabotage is named, threats fly loose and resignations amass his desk.\n\nLuis Augusto Dubuc has found himself in the same state of challenge, opposition and hatred that he himself fought against just a decade before. Rarely fate can be predicted, more rarely is she so cruel."

#Carlos Andrés
POLITICS_VEN_CARLOS_ANDRES_PEREZ: "To seize a moment requires gravitas, skill and timing. To seize a mind takes precision, charisma and leadership. To seize a people, requires all of which in abundance. For Carlos Andrés Pérez to do any of the three only requires himself alone.\n\nBorn to a coffee plantation family, the young Carlos Andrés, or CAP as he would become known nationally, would escape the rustic world that dominated his life with books. Whether history, politics or language before his teenage years, he had mastered Voltaire, Marx and Rousseau, the synthesis of which would inspire a growing ideology within himself, a blend of visions, set alight in the mind of a farm boy.\n\nLeadership came easy to Carlos Andrés, at the age of fifteen founding the Venezuelan Youth Association and, years later, utilizing his proliferating skills to join a burgeoning Acción Democrática. Possibly a dissatisfaction with the Venezuela he was born into, or such a belief it could be so much more would set him on a path to the parties upper echelons.\n\nAnd so, as Venezuela casts off the instability and authoritarianism, the sun sets on her decade of shame. Those who have basked in the sun too long wither, ill-prepared for the long, biting night, they falter, and, like the Caesars they served, are relished to history. Many question her, expect a return to failure, for her to falter in the cold night, but Carlos Andrés knows better, he is here to remind them that rather than a return to old, something new is coming.\n\nThat will usher in the dawn."
POLITICS_VEN_CARLOS_ANDRES_PEREZ_MENDOZA: ""
POLITICS_VEN_CARLOS_ANDRES_PEREZ_78: "The Republic stands upon a precipice in her destiny, a decade haunted by rebellion and dissent that shook her fragile democracy, the enraged masses falling only further in decline, a system intangible with the new horizon creeping over the misty rolling Andes. Any man could see that change was coming, it was from where that posed the question.\n\nPerhaps it was inescapable, then, that one of the most mercurial, defining and decadent figures who helmed the inception of the Republic would take its reins. Perhaps it was just false promises and smothering grins. Regardless, the return of Carlos Andrés Pérez has marked a shift in not just the man himself, but Venezuela as a whole.\n\nMaking a firm name as a man as equal parts fierce and loud, Carlos Andrés rose up quickly through the youth dissident movements that would give way to Acción Democrática as a sharp firebrand amongst them, an inspiring voice, articulated enough to force men to their feet.\n\nNow, however, after almost a decade since he first ran for President, Carlos Andrés has a vision. A vision idiosyncratic from the withering party he serves under, an economic restructuring of Venezuela completely, made from the bones of the old Republic, and the bright young minds of the future.\n\nAnd this time, Carlos Andrés Pérez will see his vision through, or die trying."

#1973 Candidates

#URD
POLITICS_VEN_LEONARDO_MONTIEL_ORTEGA: "With gallant attire, elegant presence, charismatic charm and inseparable tobacco, Doctor Leonardo Montiel Ortega strikes the model of party reinvigorated. A man of many talents, Montiel Ortega went from inspiring the Venezuelan people first through television as a striking up-and-coming actor. It soon seemed, however, the much greater stage proved to be in the halls of Congress, as Montiel quickly rose to become the Unión Republicana Democrática's fiercest speaker.\n\nThrough such overpowering character, Montiel has positioned himself as a politician of the new millennium, a charismatic performance that has contrasted sharply against the meritocratic traditions that long dragged the heels of the party. A gauze of easy charm, flashing cameras, champagne and raucous laughter has swarmed Miraflores, quite in contrast to the stuffed collars of his predecessors. A government people aspire to, rather than yawn at.\n\nMontiel holds to himself a spark of an idea of new liberalism, internationalism clutched to its heart, and through flair, change and mobilisation, Montiel seeks to send Venezuela left dizzy as he drives to spin her into a new age."

#Military

POLITICS_VEN_JESUS_MARIA_CASTRO_LEON: ""To thine own self be true, above all else"; a proverb of an old poet, tested in the fires of time. Yet in a ballad determined so much by history, it only seems apt for such a similar story of family to drive our own.\n\nStalked by the ghost of his grandfather, the great caudillo Cipriano Castro, the young Castro León would find a burgeoning military career cut short by the same family legacy, being fired by Gómez himself out of fears of the young officer's motives. Until Gómez's death in 1935, Castro León lived from job to job. His determination to be something greater was carved in the same heat of the laboring midday sun, as he worked tirelessly for something more.\n\nReturning to the military, Castro León would find redemption in the oddest of callings. Though he proved himself as a born leader, it would be the regime of Marcos Pérez Jiménez that would see Castro León rise through his adaptability of command and ruthless efficiency among the military who once despised him. And yet, it proved not enough.\n\nWhen Wolfgang Larrazábal launched his coup in 1958, Pérez Jiménez's call for arms would fall on deaf ears. In this new Venezuela, Castro León waited with bated breath for a fresher regime to be born, one free of the old elites of Acción Democrática, and the faithless killers of the far left. Yet that never came.\n\nIn Venezuela's darkest times, Castro León has taken the heaviest burden upon his shoulders. A man only born to serve and to prove himself now must reorganize a country riddled with issues, yet so close to perfection. All those who mocked him, named him unworthy, now look up at his colossal figure, as he rewrites history with first the pen, and then the bullet."

POLITICS_VEN_FELIX_ROMAN_MORENO: "Spanning the last decade, the great monolith of the modern Venezuela was carved from the ruins of the Andean Hegemony. For many in the nation, hopes bloomed into promising dreams of the future, but like much of what is hopeful in Venezuela, the dream soon became the farce.\n\nDemocracy, instead, raptured and divided the nation, allowing the vulgar masses to dictate to those born to lead. It substituted strength for ambition and, in doing so, that was her downfall. Félix Román Moreno served his nation above politics regardless of her decisions. He followed dutifully even in the darkest times, and it had him longing for the lost dominance of her past under the Perezjimenista dictatorship.\n\nAs Miraflores drew further and further into itself and away, its intentions became clear - the once proud and admonished Armed Forces fell into decay, and more and more flew the nest. Román found himself unwittingly at the centre of all this, as slowly a clique of equally concerned officers formed under his banner. And so, they watched with bated breath, and when the regime finally lost its way, Román pounced, seizing the means of power by force, given no other choice.\n\nThough the politicians may condemn them and the people may label them monsters, what they did will be absolved in the annals of history, as Venezuela is once again set on her natural course..."

#MPJ

POLITICS_VEN_OSCAR_TAMAYO_SUAREZ: "Little can be done to sway the tempers of fate. She is a foul mistress - ill-tempered, poor mannered, unpredictable. In all regards to his life, Oscar Tamayo Suárez sought to serve the illusive concepts of duty and honour rather than pursue fate. And yet, she found him and dragged him into this, much to his chagrin.\n\nTamayo Suárez dreamt of the past, of the days of the great Andeans, the glamour and pomp that possessed the military in such a day - when the allure of the glimmering institution brought in brave young boys, and they left as men, christened in the service to their nation.\n\nYet El Cabito's return was only a hollow shell of such a bygone age, and as the General further declined, those hopes were dashed yet further. Though Tamayo dedicated his time following the coup to the renewal of the Armed Forces, certain elements of it are tainted, lost to cliques and factionalism. The men who serve have forgotten discipline - that they fight for the people, not ideals.\n\nThrust into the Presidency by the infuriated armed forces, Tamayo feels he is left with his only choice to weather the storm. As fate throws and tears at his ministry, he delegates its control to those most apt, to satisfy its divided movements. Standing over the parade, colours draping the battlements and a radiating sash around his waist, he truly hopes the damage is not irreversible, and some hope may come yet."

POLITICS_VEN_ROBERTO_CASANOVA: "Once, tall amongst the decadent woodland, one grand old oak stood behemoth amongst skirmished weeds, her stature dazzling, awe inspiring to the marshy flora below her. Such a beacon lathered shade to those under her vast trunk, fueled fires of the lost and desperate and above all, stood as a testament to the unyielding testament of nature unbound.\n\nDecades of decay have overtaken her - her branches snapped for firewood, her fruits harvested by children who greedily scoff them. Her history has been forgotten and she has been laid bare. The once towering oak of a proud nation has been ravished by the ghouls which overwhelmed her. When Roberto Casanova joined the Easter Coup, he believed some form of rebirth would come from it, he hoped, and was left wanting.\n\nIf Castro León let the rot take hold of Venezuela's great oak, Tamayo spread it to her roots. Inaction and incompetence laboured her mending as the ego of careerism and decadence of power corrupted him from inside out, to save the core of it all, the last vestiges of a nation long gone, the rot had to be ripped out.\n\nOnly chaos has followed the death of his predecessor. And yet, even as Casanova organises a cabinet less united and more bickering than ever, he sees himself less of a woodsman and more of a gardener. Seeds are laid, and even through the tense and arid days of uncertainty, comes hope of a future of pride and renewal for it all.\n\nVenezuela turns to its past and to its greatest gardener of all - Marcos Pérez Jiménez."

#Mendoza
POLITICS_VEN_EUGENIO_MENDOZA: "In some way, the history of Venezuela itself is reflected in the life of Eugenio Mendoza Goiticoa. Born from a great and rich tapestry of his forefather - Venezuela's first President Cristóbal Mendoza, he reaped none of its luxuries, and, like the nation, he is dedicated to salvage his own legacy in the fires of 20th century business and industry.\n\nThe same firm hand that guided him into many successful ventures now must hold the future of a nation as firm. Taken closely back from the brink of civil disorder, the dream denied to Castro León is now the burden of Mendoza as Venezuela's brightest and boldest attempt to reorganize the mess of the past year into a government of coherence and responsibility.\n\nThe doctrines of the last two decades have failed, and Venezuela, as stark as it may be, will be dragged into the twentieth century. Independent from the scions of ideology and weight of ego, a new Venezuela will be lifted up - one of opportunity and promise. A great garden, the fruits of her harvest the envy of none, and the feast of all."
POLITICS_VEN_EUGENIO_MENDOZA_AUTHDEV: "Smoke rises and falls, whether it be from the plumes of the mechanized industry of Maracaibo or Caracas, or the fat cigars of the kings of industry, as they drive Venezuela's dreams into coal to power their industries of commerce. Too many red hands shook have stained Mendoza's suit a deep burgundy - an inescapable truth of his participation in the death of a dream.\n\nVenezuela is transformed into a beacon of unassailable capitalism, a machine almost in which the greatest dreams of commerce have been achieved. For the highbrows of New York, Madrid and Germania, she is a beacon of success, for the resident of the barrios of Caracas, or the farmers of Apure, it is a grim punishment for trusting a man who allowed greed to build a nation rather than hope.\n\nMendoza may retire to endless applause and commendation, yet he feels empty. Statues of him adorn the greatest complexes and academies, yet posters of him fester in the mud of hovels his actions made. The great cogs of a decade of transformation however, have only just begun."
POLITICS_VEN_EUGENIO_MENDOZA_DEM: "In only a few years, a decade has occurred - a rusted stone found abandoned and destitute has been transformed into the most lustrous gem in the crown of South America. A jewel to inspire, a transformation to idealize. Eugenio Mendoza ends his Presidency to a volley of exhausting cheers and handshakes and feels the weight of a career well lived settle upon his shoulder.\n\nWhat was once a shambolic caretaker government propagated by nationalist fervour has reached out a great hand to the nation of Venezuela, in which the people have feasted upon. From the nation's colleges to her slums, opportunity arises for those with the cunning to take it, and the legacy of the Mendoza family is complete - the builders of nations.\n\nYet to such appraisal the old man feels himself tiring. The endless drones of bureaucracy is droned out by the hollers of his grandchildren playing, and as he settles back, feeling a cool breeze blow through the strands of his hair, he finally lives the Venezuelan dream he helped build."

#Moncada Vidal Path
POLITICS_VEN_JUAN_DIOS_MONCADA_VIDAL_PAZ: "Within the veins of Venezuela lies the ideals of fate, of great men, kings, and conquerors, of Bolívar - where oil permeates the veins of the land, running thick and hot. Juan de Dios Moncada Vidal was born into a land of such great hope, of limitless aspirations, and bottomless ambition. As a young man, he championed Juan Vicente Gómez, who showed the true spirit of Venezuela's makers, whether by smile or sword. It would be that same dogmatic loyalty to his homeland that would drive the young man towards the military to serve her.\n\nHowever, he was quickly shown that some seem to pervert the illustrious fate of his country. Vampires who whore her nation's blood to kingmakers in Washington, while bartering her soul. Venezuela has been left a decimated corpse, discarded to the roadside like a stray dog, to fester and rot under the hot Orinoco sun.\n\nYet she breathes still - Moncada Vidal knows it. The leeches must be shaken, but she will live. Already, the winds of fate are shifting, and Moncada watches the sunset on her ruined body, knowing time is short. One thing remains certain - Venezuela shall breathe again, and its people will be shown exactly why blood runs thicker than oil."
POLITICS_VEN_JUAN_DIOS_MONCADA_VIDAL_PAZ_70s: "As the fires settle under the dimming sun of the Venezuelan evening, a country breathes. Not a breath of relief, but one of a death rattle, as the spear of the conquered is once again dug into her core. Though the Bolivarian fist may once again grasp that spear, she does rattling with shaking hands, none trembling more than those of Juan de Dios Moncada Vidal.\n\nEvery war has its casualties, young men who, with such valiance, die in the spirit of the cause. A decade ago, Moncada Vidal would have counted himself among those such men, rallying cries driving a soul of gleeful passion to carve a chunk of Venezuela from ash if need be. Only in the fire of war, the blood that threatened to overflow Venezuela and boil in the Caribbean Sea, was it shown what a lie that dream was.\n\nMoncada believed Bolivarianism was that dream, a hope of rebirth, of relighting a torch left guttered for decades. In truth, it was a machine, one fueled by the spirits of animosity, and driven by the ghosts of the past. Once the wheels turned on such an engine, she took a life of her own. Now he grips limply and tightly to the reins of a beast who threatens to throw him with every roar she makes.\n\nFrom Miraflores, the streets of Caracas stand embossed only by the smoke of gunfire, one he dares to never descend into, and yet distantly he hears a chant, one that now echoes from the lowest of the slums, to the dreams of the aged commander.\n\n§R"¡Viva Bolívar, Viva Venezuela, la bandera está firme y sus hijos libres!"§!"

POLITICS_VEN_MANUEL_AZUAJE_ORTEGA: "Minds molded in the Bolivarian Revolution, dreams conjured up by the nationalist dreams of Moncada Vidal and boots made for the art of warfare are now taken to the test. Not just Venezuela, but the spirit of the Bolivarian dream are now facing their greatest challenge.\n\nManuel Azuaje Ortega stands bitterly upon the outskirts of such a battlefield. Venezuela's colonizers, displeased by her wayward sons' dirge to freedom, have shivved the nation in her back. Moncada Vidal, the hero of the revolution, lies dead, and the ghosts of Venezuela's great past that haunted him, have come down to cling to Azuaje's shoulders.\n\nHe has none of the grandeur of Moncada, little of his wit and stoicism, but possesses something akin to it - A great drive, a dedication to save his nation from the chaos of war at whatever cost. The bellows of a military clambering for war accost him for all angles, and who is he to deny their patriotic zeal?\n\nBolívar's sword rests in his hands unsheathed, shimmering in the fires of war. She will not be sheathed again until bloodied by the arteries of imperialists. "

POLITICS_VEN_NICOLAS_HURTADO_BARRIOS: "The last beads of sweat evaporate as day turns to night, and Venezuela's long summer finally ends and alongside it, after nearly a decade of brutality and anguish. For Hurtado Barrios, his shame does not come with the cost it took to stagger the vitriol of his former mentor, but the fact it, indeed, took him as long to realize as it did.\n\nThrough fire comes rebirth, and Venezuela set so ablaze for the last decade rests in her ashes. And yet a flicker remains. Bolivarianism emerges transformed by the revolutionaries of her society like the Phoenix. Once the somber blade that slashed across the Venezuelan proletariat, that hand now only wields an open palm - laid bare for the people to clutch.\n\nAs a new government assets itself against the fallout of the Dance of the Dogs, so too does the military take a new face. Under Hurtado Barrios, an interior revolution is happening, and the military, long swayed into the shadows by tyrants and fascists, finds within herself the final national idea.\n\nAnd that revolution will guide the wayward people, as the military always has, towards the long red road. §RThis time, truly in the name of Bolívar.§!"

POLITICS_VEN_MARCOS_PEREZ_JIMENEZ: "Sparrows migrate east for summer. Away from the burning heat of the southern continent and the Venezuelan sun, bringing with them their flock and the sweet morning lullaby of birdsong. Their nests, for the most part, lay dormant, with the weakest of the flock left to burrow away from the heat. Yet for winter they return, as winter's shadow falls over Europe. With it, the cycle continues, irony, rebirth and revival.\n\nAnd so, to the ravenous applause of a nation lost, so too does Marcos Pérez Jiménez return to the Miraflores Palace where upon which he fled so many years before. Its doors ajar, itss windows smashed in - his once beautiful nation, laid bear to wolves who, like time, have taken all but the hinges.\n\nMuch is to be done, so many drawn pointed swords threaten to sink the careful balancing act of the nation. Its soul lies tormented and raptured in the mud, broken by children who never understood her. A calm hand takes the reins, one willing to guide, and to choke in equal certainty.\n\nSome may call it destiny, others fallacy. To the Venezuelan Caesar, it was certainty, the last decade of storms have finally calmed - and whether by the carrot or the stick, Venezuela will be dragged screaming into the Twentieth Century.\n\n§YHis Twentieth Century.§!"

POLITICS_ENRIQUE_TEJERA_PARIS: ""

#Guyanese Puppets
POLITICS_VEN_AVERELL_MELVILLE: "The dispute, long-simmering, has finally come out into the open. Born on November 20th, 1944, Averell John Nicholas Melville was born in Essequibo during a period of heightened tensions, radicalised into supporting the Venezuelan claim to its territory. A rancher by trade, he became a key organiser of the Rupununi Revolt, channeling anger at long-term racism towards local native populations to fears of being exploited by Georgetown as the source of cheap labour.\n\nBut as the Rupununi Revolt faltered, their escapades claimed the hungry eye of Venezuela. Hoping to relieve the bruise of having its territory seized decades ago by the British Empire, and hungry for a justification, Melville rewrote his past, treating the rebellion as a grand effort to decolonise from Anglo-American repression. With Guyana's withdrawal from the Organisation of Free Nations, that opportunity was left wide open - and after a brief period as a local governor, Melville seized it.\n\nNow, Melville serves as the President of a land well beyond his former remit, a happy puppet of its older sibling in Venezuela. Too unpopular in Georgetown to be comfortable, yet too popular in Caracas to leave, Melville relaxes into the image he has of his own legacy. As the OFN smarts, it is clear that only a strong ally will protect states across America from foreign invasion. And over Georgetown, the talons of the Bald Eagle dig themselves ever deeper into its prey."
POLITICS_VEN_ALBERTO_CHALBAUD: "Even in Venezuela, rarely has family elevated a man to the level that it has for Alberto Pauli Chalbaud. Born in Santiago de Los Caballeros de Mérida in 1912, he was already the nephew of former President Marcos Pérez Jiménez and his wife, and the nephew of Carlos Chalbaud, ties that he has always been aware of. Joining the military in 1928, he attended the Infantry Application School and enjoyed a steady stream of promotions, rising through the ranks to become Lieutenant Colonel.\n\nFinally entering politics under Pérez Jiménez, he rose yet further, moving from the Head of Service to Head of Section and then to the Cabinet Directorate, all in the Ministry of War and Navy. Running out of further promotions yet again, he became Governor of Mérida, proposing the creation of a cable car system, before fate found him one further promotion as Head of the Military Household in 1953. However, with Wolfgang Larrazábel's coup, he found himself demoted, and exiled.Quickly tying himself as a close confidant to Pérez Jiménez served him well, both in exile and for Jiménez's return, with loyalty finally promoting him yet further. As Guyana left the Organisation of Free Nations, the swift seizure of Essequibo finally gave him a fiefdom, with Chalbaud elevated to leading its integration into Venezuela. Here, at least, Chalbaud will finally call something his own, ensuring a swift integration in the Perezjimenista tradition and, for once, a legacy of his own."
POLITICS_VEN_PEDRO_SILVA: "The west has sowed the fury; now, it reaps the whirlwind. Born to a Llanero family in Guárico, Pedro Medina Silva found himself drawn to the ideals of revolution as a young man, idolising Simón Bolivar as a liberator happy to fight alongside fellow Llanero. Joining the Venezuelan army, he took part in the Porteñazo Rebellion as a young man, finding himself jailed alongside many co-conspirators. He didn't find himself captured there for long, however, escaping a year and a half later to the Isla de Tacarigua, helping to organise the FALN alongside Manuel Azuaje Ortega, Gastón Carvalon and German Lairet.\n\nEscaping once again, Pedro Medina fought across the globe. From Luis Taruc and the All-Filipino Revolutionary Socialist Republic to Felix-Roland Moumié and the Pan-African Liberation Front and the fight against Rafael Trujillo, he more than earned his rise to being an officer in the FALN. Moncada Vidal's ascendancy saw him rise among the Julianos, and then receive further promotion for loyalty in the July Coup.As Guyana left the Organisation of Free Nations, Medina became central in organising the recapture of Essequibo, and in the liberation of Eastern Guyana, now a key plank of the new Bolivar's liberation campaign. With its quick success, and with Pedro Medina decidedly in charge, he will be happy to ensure that capitalism is broken within Berbice and Demerara, and he will be happy to instill the leftism of the Bolivarian Revolution in its place."

### National Spirits ###
VEN_black_gold_raw_gold: "Black Gold, Raw Gold"
VEN_black_gold_raw_gold_desc: "As Italy's lifeblood flows like wine, and Russia's like Vodka, Venezuela's flows like oil, twice as thick and double as strong. The Venezuelan economy, since the nation's inception, has been one built on the banks of the Orinoco River, and the belt which runs throughout it. Such a boon has won her a special candor with the other nations of the Organization of Free Nations. Though Venezuela may, in a season of plenty, cultivate a great harvest, she has grown too comfortable from a long spring - one which may soon turn to fall."

VEN_black_gold_raw_gold_alt: "Black Gold, Raw Gold"
VEN_black_gold_raw_gold_alt_desc: "As Italy's lifeblood flows like wine, and Russia's like Vodka, Venezuela's flows like oil, twice as thick and double as strong. The Venezuelan economy, since the nation's inception, has been one built on the banks of the Orinoco River, and the belt which runs throughout it. Such a boon has won her a special candor with the other nations of Latin America. Though Venezuela may, in a season of plenty, cultivate a great harvest, she has grown too comfortable from a long spring - one which may soon turn to fall.\n\nAnd now, with the establishment of the new regime, the King of Oil opens the gates of its palace to new, foreign visitors. No longer do the Bald Eagle and Golden Eagle feast on Venezuela's oil reserves, monopolizing the riches like a prey, as investors from the Old World have begun flooding the country's market. Unbound to the chains that formerly kept her tied to Mexican and American interests, Venezuela stands now as the master of her own destiny."

VEN_game_of_the_three_kings: "Game of the Three Kings"
VEN_game_of_the_three_kings_desc: "The fall of one tyrant, as it tends to do, leaves his kingdom shattered and its people lost - shattered between fiefdoms. Since the fall of Pérez Jiménez, and the death of national hero Rómulo Betancourt, three giants have been stuck in perpetual competition: AD, led by Raúl Leoni, COPEI, led by Rafael Caldera, and URD, led by Jóvito Villalba, have been locked in a bitter political rivalry over the nation's future.\n\nThough in 1958 that unease may have been sufficed by the election of the people's admiral, Wolfgang Larrazábal, the hero of the 1958 Coup, as the next elections approach, so does factionalism - and the ghosts of past enmity."
VEN_game_of_the_three_kings_barrios: "Game of the Three Kings"
VEN_game_of_the_three_kings_barrios_desc: "The fall of one tyrant, as it tends to do, leaves his kingdom shattered and its people lost - shattered between fiefdoms. Since the fall of Pérez Jiménez, and the death of national hero Rómulo Betancourt, three giants have been stuck in perpetual competition: AD, led by Gonzalo Barrios, COPEI, led by Rafael Caldera, and URD, led by Jóvito Villalba, have been locked in a bitter political rivalry over the nation's future.\n\nThough in 1958 that unease may have been sufficed by the election of the people's admiral, Wolfgang Larrazábal, the hero of the 1958 Coup, as the next elections approach, so does factionalism - and the ghosts of past enmity."
VEN_game_of_the_three_kings_prieto: "Game of the Three Kings"
VEN_game_of_the_three_kings_prieto_desc: "The fall of one tyrant, as it tends to do, leaves his kingdom shattered and its people lost - shattered between fiefdoms. Since the fall of Pérez Jiménez, and the death of national hero Rómulo Betancourt, three giants have been stuck in perpetual competition: AD, led by Luis Beltrán Prieto Figueroa, COPEI, led by Rafael Caldera, and URD, led by Jóvito Villalba, have been locked in a bitter political rivalry over the nation's future.\n\nThough in 1958 that unease may have been sufficed by the election of the people's admiral, Wolfgang Larrazábal, the hero of the 1958 Coup, as the next elections approach, so does factionalism - and the ghosts of past enmity."

VEN_democracys_fraying_lifeline: "Democracy's Fraying Lifeline"
VEN_democracys_fraying_lifeline_desc: "With the fall of Marcos Pérez Jiménez, so was felled 150 years of Venezuelan militarism, and the brief experiment of Venezuelan democracy, launched by Betancourt and Gallegos in 1945, was vindicated. Those in the military, however, shaped to rule by previous military regimes, rest uneasy with this break from tradition, from the high offices to the lowly academies.\n\nIdeas, new and old, are fostered in the name of Venezuela, above democracy or dictatorship, and should the military believe its interests are jeopardized, dissident forces will do anything possible to save the Republic."

VEN_the_crimson_spectre: "The Crimson Spectre"
VEN_the_crimson_spectre_desc: "$VEN_CrimsonSpectreEffects$\n§g--------------§!\nIn the rural landscapes and mountains, a lowly song plays - half of tragedy for a past lost, half of hope. In 1958, these people were nearly vindicated, and yet their hope, under the watchful eye of right-wing traitors and the American eagle, stole a truly free Venezuela from them.\n\nNow, under the guise of another generation of revolutionaries, the MIR and PCV have united under the burgeoning FALN's banner and taken up arms. From the tropics of Zulia to the plains of Bolívar a slow hum plays, ever present but low - however, as Venezuela enters her most uncertain decade to date, what is a hum may turn to a shout, to a scream, to a cry for all the country to hear."

VEN_CrimsonSpectreEffects: "§F§gFrom the level of £fervor_texticon §RFALN Strength§! ([?VEN_Commies|0Y]/§V8§!):§!\n - $war_support_modifier$: [?VEN_CrimsonSpectreEffects^0|+=%2]\n - $security_policy_monthly_rate$: [?VEN_CrimsonSpectreEffects^1|+=%2]\n - $taxable_population_factor$: [?VEN_CrimsonSpectreEffects^2|+=%1]\n - $MODIFIER_ARMY_ORG_REGAIN$: [?VEN_CrimsonSpectreEffects^3|+=%2]\n - $MODIFIER_PRODUCTION_SPEED_BUILDINGS_FACTOR$: [?VEN_CrimsonSpectreEffects^4|+=%2]\n - $MODIFIER_LOCAL_RESOURCES_FACTOR$: [?VEN_CrimsonSpectreEffects^5|+=%2]\n - $MODIFIER_DRIFT_DEFENCE_FACTOR$: [?VEN_CrimsonSpectreEffects^6|+=%2]§!"

VEN_el_esequibo_es_nuestro: "¡El Esequibo Es Nuestro!"
VEN_el_esequibo_es_nuestro_desc: "§Y"First stolen by the Anglos, then by the Yankees."§!\n\nThough the fires of nationalism were tempered with the Guyanese and Venezuelan alliance under the OFN, there is no hiding the ruse of land that cannot be held. For now, the Venezuelan matriarchal anger may be calmed, but only on the comfort of their lost sons and daughters across the border - and should that change, so will the wrath of the mother."
GUY_Venezuela_border_dispute_tt: "§RThe dispute may threaten the unity of the OFN.§!"

VEN_One_Under_Bandera: "One Under the Bandera"
VEN_One_Under_Bandera_desc: "The path to revolution as it was in Russia, as it was in Cuba, is never the bright, blinding flash that the revolutionary mind may idealise. The petty feuding, squabbling, and bickering, although callous and hollow, eventually gives way against all its doubters.\n\nThe Democratic Republican Union has fulfilled its destiny even in the wake of its greatest detractors. The revolution sparked first in the fifties has now, against all the forces that sought to weaken it, been vindicated by unrelenting success.\n\nLeft unopposable and unapologetic, Venezuela has chosen its fate, one that lies solely in the hands of its most principled revolutionaries."

VEN_vanguards_of_the_flag: "Vanguards of the Flag"
VEN_vanguards_of_the_flag_desc: "Men who serve pledge their life to an ideal rather than a state, that of servitude and loyalty to a nation. Such ideals embolden men to choose, above all, the good of the nation above all. This is what it means to be a soldier of Venezuela, to be bound to this brutality of reality and its hard decisions.\n\nHenceforth, Venezuela has been taken into the hands of men rigid in such beliefs and, with it, who know their duty is to lead their nation when it has lost its way.\n\nAgainst those of the street who call them monsters, butchers, the children who hurl fruit at them. They know what they do is right."

VEN_the_brightest_and_boldest: "The Brightest and Boldest"
VEN_the_brightest_and_boldest_desc: "Ideals born in the impassioned university halls, boardrooms and smoke-fueled backrooms, governed by cigars and imported school alumni, unexpectedly rule the nation they spoke of in such high spirits.\n\nThe transitional government of Eugenio Mendoza's defining characteristic was to be run by intellectuals and scholars rather than politicians, those chosen by mind rather than votes, such high ideals have invoked a nation of gathering hope. Yet with the hope of ambition comes recklessness, such that will only become tested with the turning of time, and the brutality of reality that come with it."

VEN_the_jewel_of_the_caribbean: "The Jewel of the Caribbean"
VEN_the_jewel_of_the_caribbean_desc: "Against the fraying tethers of division that enraptured her, Venezuela has seen through its most tumultuous decade and, with it, been rewarded with countless fortunes. Its once burdensome factionalism and the oil that threatened to drench her have become the lifeline to which she has become the darling of the Americas.\n\nWhat the future will bring for the ever-young democracy is still to be seen, though she has shaken off the ghosts of the last decade and emerged unshackled and, in such a way, allowed something to blossom that has been long lost in her history.\n\nHope, and the joys that come with it."

VEN_Venezuela_Reborn: "Venezuela, Reborn?"
VEN_Venezuela_Reborn_desc: "Like the Phoenix, the ill-begotten spirit of democracy shall be reinvigorated in Venezuela, not by the sword, but by the pen and the slow and tumultuous efforts of Eugenio Mendoza and his disciples. This democracy as of the nation it serves, however, is being transformed into a being wholly anew.\n\nShackled by the visions of intellectuals and magnates, this new democracy is one fueled by progress and pragmatism. The once bright-eyed populism that governed it dead, now divided by the funding ideals of new monarchs, the burgeoning middle class and all of their flaws.\n\nFor this time, let us hope it will hold."

VEN_the_quiet_revolution: "The Quiet Revolution"
VEN_the_quiet_revolution_desc: "The drum that beats to herald change is rarely noticed by even by the common man - the raucous of the streets, chattering of politicians and steam of industry too caught up to notice the quiet echo, until it becomes deafening. The Democratic Republican Union, the party that felled a dictator, have served as the stick of which those drums were beaten to for now over a decade which now deafen the nation itself.\n\nFrom the spirited Fabricio Ojeda, to the charming Alirio Ugarte Pelayo, the fathers of this revolution have not issued change from the barrel of a gun, but rather the slow methodical reformation of a state from its very inception. Born in the spark of revolution, Venezuela's is finally complete."

VEN_charter_of_the_masses: "Charter of the Masses"
VEN_charter_of_the_masses_desc: "The cries of mud-slinging peasants, of soot-covered industry men, of working girls and boys from the street have been the song of history - ever trodden into the foot beneath the feet of their betters. Now, unlike ever before, their forlorn cry has been heard, and reciprocated with the rage of a nation in anguish.\n\nCaudillos, Adecos, Copeyanos, Urredistas - they all now lie to the wasteside. In their place, a charter drawn against a great red banner - a people under a party indivisible against itself, bound by the humility of the common man and against the tyranny of the bourgeois that have so long haunted it."

VEN_along_the_shores: "Along The Shores of the Orinoco"
VEN_along_the_shores_desc: "In a matter of months, the world split in seems and, suddenly, the man's grip on his gun in Arabia starved the suburbanite in Chicago. For most of the world, they went mad as the engine of their lifestyles was put on auction and thousands wrestled for a taste of such sickly black ooze.\n\nIn Venezuela, the sound of bursting champagne is far louder than the rest of the world's bickering. The nation, ever rich, has found itself engulfed in a period of unfathomable economic growth as barrel after barrel, dollar after dollar, changes hands. Venezuela has entered the new decade not to the sound of gunsmoke, bullets or wailing - but to the sound of rapturous laughter."

VEN_Port_of_Spain: "The Port of Spain Treaty"
VEN_Port_of_Spain_desc: "Two fencers lay down their sabres after a century-long session. Though neither has truly won out, and hot-headed rivalry still takes precedence over sound mind and body, for now the Essequibo River stands quiet - its bubbling streams and rivers left only to nature instead of the beating drums of war.\n\nDesigned by Rafael Caldera, the Port of Spain Treaty guarantees the collaboration between both Venezuela and Guyana, as well as their Canadian overlords, over continued peace in the region. Though only a twelve-year memorandum, the Treaty has done much to simmer the bubbling heat between the two nations over the banks of the Essequibo River."

VEN_Port_of_Spain_HMMLR: "The Port of Spain Treaty"
VEN_Port_of_Spain_HMMLR_desc: "Two fencers lay down their sabres after a century-long session. Though neither has truly won out, and hot-headed rivalry still takes precedence over sound mind and body, for now the Essequibo River stands quiet - its bubbling streams and rivers left only to nature instead of the beating drums of war.\n\nDesigned by Rafael Caldera, the Port of Spain Treaty guarantees the collaboration between both Venezuela and Guyana, as well as their British overlords, over continued peace in the region. Though only a twelve-year memorandum, the Treaty has done much to simmer the bubbling heat between the two nations over the banks of the Essequibo River."

VNS_Blood_of_Proletariat: "Blood of the Proletariat"
VNS_Blood_of_Proletariat_desc: "With the turning of the industrial age, the once tranquil lakes and rivers of Venezuela's heartlands were turned black as her arteries were slashed and the thicken black ooze poured forth - to be devoured by the vampiric forces of capital which long leered over them. The revolution has come to bring an end to her era of tragedy, with this oozing wound now wrapped tight.\n\nSickening greed and ambition have been curtailed as the hands of the proletariat inherit their birthright and the riches of the oil that once made Venezuela the playground of empires, is hers once again."

VNS_National_Chorus: "The National Chorus"
VNS_National_Chorus_desc: "Many times, in times of war, men are made monsters. Some are true to their nature, others more embellished. But it is not that what matters, rather the power of fear. For fear stokes anxiety, desperation and woe, until suddenly, to beat back the same monsters they so feared, they let demons into their house and find themselves torn limb from limb.\n\nAfter a decade of unassailable murder, those left to sing the internationale are not hopeful visionaries or poets, but men bathed in the smoke of war and the blood of their comrades, the survivors of a dying breed. Those who, at any cost, will claw their way to retribution in Venezuela's final hour."

VEN_the_invisible_hand: "The Invisible Hand"
VEN_the_invisible_hand_desc: "Some philosophies do not die, even as the centuries past the theories of a Scotsman hold firm the puppet strings of the international order. Venezuela, a nation once governed by the fiery will of the masses, now sees its strings tugged by a far more unfeeling master.\n\nBound by its new constitution, the powers that be in Venezuela are now bound by its upper echelons, its oligarchs and magnates, a system broken on graphs and reports, and with it the dazzling rays of limitless development."

VEN_drowned_in_pitch_black: "Drowned in Pitch Black"
VEN_drowned_in_pitch_black_desc: "The rich, black veins of Venezuela have been slashed through. Once plentifully flooding, its arteries have stopped. In doing, so the ire of the vampires which lap at her exposed nerves have been sent into a rage - the eagle, the bull and the adler. In the glory of the Bolivarian Revolution, the colonial forces and their puppets which have so long bled her dry have been repelled, and in doing so returned Venezuela's lifeblood unto her, for her to control as she wishes.\n\nThe once neverending waterfalls of oil to the Americas has been damned, and it is left to its Bolivarian masters whom has won the honour to drink from her again."

VEN_bolivar_anew: "Bolívar, Anew"
VEN_bolivar_anew_desc: "The folly of weak men has led to this.\n\nIn their vanity, petulant bickering, weak wristed rule and blatant corruption, the blood of Venezuela has been shed - and to its scent, the wolves have descended. Emboldened by the spirit of their long lost forefather, Simón Bolívar, the flag of the Fourth Republic has been torn down, and old spirits and animosity have begun to feast on her corpse.\n\n§RAnd now, the Bolivarian Republic stands anew, drenched in the blood of her forefather.§!"

VEN_the_young_bolivar: "The Young Bolívar"
VEN_the_young_bolivar_desc: "Often, it is the folly of the revolutionary to never learn from history. Drunk with the vigour of change, they are left open to the passions they themselves ignited and are butchered from inside - rather than out.\n\nSuch was the fate of the Bolivarian Revolution, once an ideological symphony of nationalist xenophobia, the movement and icons of its principles have been remolded and refitted. Emerged from it are the renewed principles of the new, young Bolívar, and his erstwhile disciples.\n\nA socialist republic, entrenched into immortality by the strong hand of her most erstwhile patriots - the unbreakable Bolivarian Armed Forces."

VEN_all_roads_led_to_rome: "All Roads Led to Rome"
VEN_all_roads_led_to_rome_desc: "One king fell to the pitchforks of his angered peasants, another to the heresy of his kin and the last crushed beneath the weight of the crown he attempted to wear. In their squabbling, the petty feudals would fail to hear the sound of the drums long echoing, until, of course, it became deafening - The victory march of not kings, but emperors.\n\nMarcos Pérez Jiménez is not a symptom, nor a cause, he became an inevitability. A nation, carved solely in his image and finely tailored over the years to his suiting. For him, and indeed for Venezuela, his return marks a merge of nation and leader into one as once again Caesar seizes his long lost crown."

VEN_all_roads_led_to_rome_margot: "All Roads Led to Rome"
VEN_all_roads_led_to_rome_margot_desc: "One king fell to the pitchforks of his angered peasants, another to the heresy of his kin and the last crushed beneath the weight of the crown he attempted to wear. In their squabbling, the petty feudals would fail to hear the sound of the drums long echoing, until, of course, it became deafening - The victory march of not kings, but emperors.\n\nMarcos Pérez Jiménez was not a symptom, nor a cause, he became an inevitability. A nation, carved solely in his image and finely tailored over the years to his suiting. For him, and indeed for Venezuela, his return marked a merge of nation and leader into one as once again Caesar seized his long lost crown.\n\nBut the end of this tragedy came unexpectedly. In a moment of weakness, the court tore apart the monarch's rotting corpse, and, almost ironically, the heir to the throne ascended, now trapped within the ivory tower in her gilded cage and her own decay."

VEN_sins_of_history: "Sins of History"
VEN_sins_of_history_desc: "Hatred was the gravedigger of what Venezuela became. In the squabbles of division, the once smouldering torch of democratic hope was extinguished, and those who used it to guide their way were torn apart by the wolves.\n\nThe Bolivarian regime has left a long, unmistakable gash across the heart of the nation, thousands left flung in hasty graves, families shattered, a people divided, a war fought as much in the minds of its people as it was in the fields of war.\n\nIn the decades to come she will heal. For now, leave her to weep."

VEN_sins_of_history2: "Sins of History"
VEN_sins_of_history2_desc: "Hatred was the gravedigger of what Venezuela became. In the squabbles of division, the once smouldering torch of democratic hope was extinguished, and those who used it to guide their way were torn apart by the wolves.\n\nThe Bolivarian regime has left a long, unmistakable gash across the heart of the nation, thousands left flung in hasty graves, families shattered, a people divided, a war fought as much in the minds of its people as it was in the fields of war.\n\nIn the decades to come she will heal. For now, leave her to weep."

VEN_to_aspire_to_better: "To Aspire to Better"
VEN_to_aspire_to_better_desc: "The wounds torn bloody by the dogs of Bolívar will take decades to heal. The death of Venezuela's fertile democracy's still leaves many hopeless and, for now, the scrabble for its future remains vague and aimless. Many, left with no hopes in the crippled nation, have taken to its shores, leaving the ill-begotten nation behind.\n\nBut those left have begun the slow efforts of reconstruction to a nation many see as hopeless. Enrique Tejera París, though regarded by many as a mere gringo puppet, through close cooperation with the OFN and OAS, has taken upon himself the responsibility and burden of the guardianship of his country to care for, represent and administer his people. As the years to follow will show, time heals all wounds."

VEN_gringos_fuera: "Gringos, ¡Fuera!"
VEN_gringos_fuera_desc: ""Yankee, go home" they sing as the foreign riflemen watch them from the rooftops - the same men pelleted by stones from wayward children, and spat on by woeful grandmothers. The memory of the Americano is fleeting, but for the Venezuelan, unending such is the woe that has begotten their country.\n\nThose most taken by their anguish turn to the slums and mountains once more, sequestered into invisible armies for such men the war never ended, never faltered and they fight on, whether that be a soldier vanished into the night, or the cities set alight by the smoulder of napalm."

VEN_outside_the_enclosure: "Outside the Enclosure"
VEN_outside_the_enclosure_desc: "Day after day, hour after hour, the diplomats scurry back and forth from the bruised walls of the half-destroyed Miraflores Palace. Reports, proposals, rebuttals, plans, graphs and charts, endless as they are bleak - Yet to process a nation's woe is little to experience it.\n\nA small stretch from the palace, you will find a nation embittered by division in the rural landscapes. Burnt plainslands, scourged rainforests, communities slaughtered. Much is to be done, but for now, Miraflores counts its cards and does the little it can."

VEN_civilization_and_barbarism: "Civilization and Barbarism"
VEN_civilization_and_barbarism_desc: "Truly, as they say, reality often beats fiction. As the late former President Rómulo Gallegos wrote in his novel 'Doña Bárbara', §Y"Progress will penetrate the plain, and barbarism will retreat, defeated."§!\n\nOutstretched along the vast plains of this nation is the grand opportunity for life uncurtailed, of hope and family, and yet now all she speaks is that of atrocious death. Those who watched their land turn to the barbarism of the last decade may only blame themselves, the vindication of history does little to subsume guilt.\n\nIn such, they live a life to bring some small redemption to brutality, to redeem great ideas and great men and to rebuild a civilisation that once lit the fires of democracy in the continent.\n\nNever will be it be easy, but they have their lives to do it.\n§g--------------§!\n§R"You're wrong, Santos, the times of barbarism haven't passed; I am barbarism, and I'm still here. There's still plenty of Doña Bárbara to go around."§!"

VEN_peacekeeping_force: "A Peacekeeping Force..."
VEN_peacekeeping_force_desc: "We gathered on the shorelines to watch them, our cerulean liberators who emerged from their boats to raucous applause. They stood back to back with our community leaders, our kinsmen and exiles, they rode into towns with no hope like some azurean knights from a fairytale.\n\nIn the Venezuela left by the Bolivarians, they at first seemed like salvation, an end to horror of the last few years, and when my son rode on the shoulders of some young corporal I could almost forget..."

VEN_or_an_unwanted_presence: "...Or an Unwanted Presence"
VEN_or_an_unwanted_presence_desc: "...what I saw them do in the streets of our cities, their drunken hands in the bars, the women left ashamed, fooled into dreams of escape, hands bloodied with those of our sons, their callous mockery, their careless orders.\n\nOne master was traded for another, as we have forsaken Bolívar, we have let Uncle Sam in, a man not so forgiving to our ways, one ready to trample our culture and people into the dirt, to leave a stamp where democracy used to tread."

VEN_democracys_decimated_corpse: "Democracy's Decimated Corpse"
VEN_democracys_decimated_corpse_desc: "It tried, in all that it could, to uplift the spirits of men, to build a nation on the foundations of hope, the spirits of freedoms and the optimism of a new decade. That is all that can be said for a dream dead in its cradle, torn asunder by infighting, stark division and the vultures of nationalism - such demons taunted the young democracy into a shallow grave and scattered the visionaries which laid her.\n\nNow, under the watchful grip of the zealotry of her military protectors, she has been returned to the immortal cycle of nationalism that has defined her history. They say it is for Bolívar, for the good of her people, yet in the eyes of the lowest infantryman, the grim truth is irrefutable. "

VEN_caesars_gambit: "Caesar's Gambit"
VEN_caesars_gambit_desc: "History will reflect that it is not with the dread of the marching boots Venezuelan democracy rotted, nor with the death rattle of a people crushed, but rather the flashing of cameras, the scurrying of the middle classes to get a better view, and the almost mocking grin of her new dictator, one vindicated by the failings of democracy and emboldened by a nation's short memory.\n\nThe democratic revolution will not be remembered fondly, Venezuela's new Caesar will be sure of that. Its failings are obvious to all who look up to see, towering above all, the statuesque figure of Perezjimenismo. Carved in marble by the complacency of its people, under it a pedestal reads.\n\n§Y"I am Ozymandias, King of Kings, Look Upon My Works Ye Mighty and Despair"§!"

VEN_eagles_in_the_sky: "Eagles in the Sky"
VEN_eagles_in_the_sky_desc: "Time is a fickle mistress, ever the strumpet she does not lay down for men of ambition, nor that of good intentions.\n\nRegularly, the men to take her eye are those who herald the unexpected, such bachelors bring visions of change and new horizons, her favourite boon indeed.\n\nSo, Venezuela changes from a nation of meritocracy and democracy to one of commerce and wealth, as she sways to the sweet tune of fortune, a song in which she will make many new bedfellows, from the bureaucrat in Madrid, to the officer in Berlin, to the statesman in Washington.\n\nThe bald eagle, schwarzer adler and águila imperial circle the skies, watching for the movement of their prey below - in a competition where the one that dies of hunger, loses."

VEN_esequibo_avenged: "El Esequibo, Avenged"
VEN_esequibo_avenged_desc: ""

VEN_thrown_to_wolves: "Thrown to the Wolves"
VEN_thrown_to_wolves_desc: "Almost three decades ago, three friends met with the shared spirit of a dream. One died by the assassin's bullet, one was consumed by the wolves he so sought to keep from the doors of his home, and the last was left confined to a small office in Mexico City. That Venezuela is dead, its flag chewed and torn as its wolves turn against those it once served to protect.\n\nYet in the face of hopelessness, a destiny once denied is flung open, left to the elements of a great storm."

VEN_govt_legitimacy: "Thrown to the Wolves"
VEN_govt_legitimacy_desc: "$VEN_GovtLegitimacyEffects$\n§g--------------§!\nMany will question its inevitability, the slowly burning match of revolution lit first in the 1920s under the Gomecista dictatorship left to scorch down to the nation's fingertips. Others will blame the scions of the state, grown bloated and fat with the nation's black blood and earthly temptations.\n\nLittle of what the historians say will bring much peace to the men who now draw arms, of the brother who turns against brother, sister against sister, as the nation finds itself in the flings of civil war. Whether men stand by the red flag or the tricolor, all that is clear is... that they are all true Venezuelans."

VEN_GovtLegitimacyEffects: "§F§gFrom the total amount of £GNG_product_interest_texticon §*Legitimacy§!:§!\n - $war_support_modifier$: [?VEN_GovtLegitimacyEffects^0|+=%2]\n - $MODIFIER_TERRAIN_PENALTY_REDUCTION$: [?VEN_GovtLegitimacyEffects^1|+=%2]\n - $MODIFIER_ARMY_SPEED_FACTOR$: [?VEN_GovtLegitimacyEffects^2|+=%2]\n - $MODIFIER_ARMY_MORALE_FACTOR$: [?VEN_GovtLegitimacyEffects^3|+=%2]\n - $MODIFIERS_ARMY_CORE_DEFENCE_FACTOR$: [?VEN_GovtLegitimacyEffects^4|+=%2]\n - $MODIFIER_POLITICAL_POWER_GAIN$: [?VEN_GovtLegitimacyEffects^5|+=%2]§!"

VEN_commie_legitimacy: "The National Chorus"
VEN_commie_legitimacy_desc: "$VEN_CommieLegitimacyEffects$\n§g--------------§!\nFirst it began with whispers, the hushed voices of those who dared against their Caudillos. But as their will carried forth, it became chants, until, on the backs of brothers lost in the name of the cause, it became a cacophony - a people marching in unity towards the vision of a red dawn.\n\nDecades of silencing, oppression and polarity led to the red tide that is sweeping Venezuela, the men once martyrs rise as magnates and the nation now hums to a new tune: the everlasting song of the internationale."

VEN_CommieLegitimacyEffects: "§F§gFrom the total amount of £txticon_left_resistance §VLegitimacy§!:§!\n - $war_support_modifier$: [?VEN_CommieLegitimacyEffects^0|+=%2]\n - $MODIFIER_TERRAIN_PENALTY_REDUCTION$: [?VEN_CommieLegitimacyEffects^1|+=%2]\n - $MODIFIER_ARMY_SPEED_FACTOR$: [?VEN_CommieLegitimacyEffects^2|+=%2]\n - $MODIFIER_ARMY_MORALE_FACTOR$: [?VEN_CommieLegitimacyEffects^3|+=%2]\n - Division Attack: [?VEN_CommieLegitimacyEffects^4|+=%2]\n - $MODIFIER_SUPPLY_CONSUMPTION_FACTOR$: [?VEN_CommieLegitimacyEffects^5|+=%2]§!" #MODIFIERS_ARMY_ATTACK_FACTOR doesn't work fsr

VEN_faln_state_modifier: "FALN Guerrilla Activity"
VEN_faln_state_modifier_desc: "Frontlines are often nothing more than lines on a map the jungle refuses to recognize. The Fuerzas Armadas de Liberación Nacional have turned the landscape itself into a complex network of partisan cells. To our soldiers, the war is no longer a matter of simple tactical maneuvers, but a marathon of paranoia.\n\nMany locals within this state do not look at us with hope, but with a hollow, watchful resentment. We are, to them, merely an ecosystem waiting to be dismantled. Every step forward is a struggle - marching through sabotaged trails, fighting against constant ambushes, and realizing we are not conquering territory.\n\nWe are trespassing into a graveyard."

VEN_ucmb_state_modifier: "UCMB Paramilitary Activity"
VEN_ucmb_state_modifier_desc: "Operating with the legitimacy of a militia and the brutality of a death squad, the Unión Cívico-Militar Bolivariana's paramilitaries cling like parasites to the Venezuelan heartland, fighting to ensure there is nothing left for their enemies to inherit. Shadows around the corner, smoke on the horizon.\n\nTheir scorched-earth tactics are not merely strategic. They leave behind villages of ash and cities of whispers, using terror as a force multiplier to paralyze any thought of dissent. These bandit soldiers are loyal only to the survival of the regime and the spoils of war.\n\nThis state has traded its soul, and it is the civilian population that must bleed to keep its blade sharp."

VEN_falncvw_state_modifier: "FALN - BR Guerrilla Activity"
VEN_falncvw_state_modifier_desc: "Once a flickering ember of resistance has been forged into a cauterizing iron. The Fuerzas Armadas de Liberación Nacional - Bandera Roja did not just survive the Bolivarian extermination campaigns, they were hardened by them. No longer are they the idealistic students of the past, but the jaded remnants who decided that mercy was a luxury that their enemies did not deserve.\n\nTheir brand of Amazonist Marxism is a synthesis executed with a fanatical precision. They don't raid depots, they liquidate them. They don't harass patrols, they erase them.\n\nIn these regions, the red flag waved against the wind and has become a warning that the war has entered its most desperate, uncompromising phase."

### OLD NATSPIRITS

VEN_Puntofijo_Pact: "The Puntofijo Pact"
VEN_Puntofijo_Pact_desc: "Ever since the collapse of the Jiménez government in a coup and its replacement by a democratic polity, various measures were taken in order to ensure that Venezuelan democracy would never again fall apart in the face of tyranny. The Puntofijo Pact was the crystallisation of these plans; it was a written guarantee that the signatory parties would respect election results, prevent single-party hegemony, and work together to fight dictatorship.\n\nHowever, all good things must come to an end, and that end seems to be coming rather quickly for the Puntofijo Pact. The once ironclad agreement is beginning to show cracks, and whether that will lead to its renewal or to its ruination no one can tell with certainty."

VEN_Essequibo_Dispute: "Essequibo Is Ours!"
VEN_Essequibo_Dispute_desc: "Guayana Essequibo is to Venezuela what the east is to Bolivia and the Falklands are to Argentina. As is the case with all such disputed territories in Latin America, it is a land forever claimed by its neighbour and a perennial problem for the people of the region.\n\nAny and all Venezuelan politicians elected to any office above that of environmental health officer (that is, rat-catcher) breathes fire when asked about the region; they all aim to reclaim it, and that desire has brought even socialists and conservative hardliners together even if only for a few moments.\n\nObviously, if this is not controlled or solved in a rational manner, the Organisation of Free Nations—to which both Venezuela and Guyana currently belong—is at risk of being split over this."

VEN_King_of_Oil: "The King of Oil" # (Pandas)
VEN_King_of_Oil_desc: "Verily, Venezuela is the King of Oil, and we are doing remarkably well with this position. The economy is doing marvellously, and since previous governments successfully nationalised it all we have total control over it. Yes, you heard it correctly: it's ours, all ours.\n\nOur control over this large oil reserve enables us to punch well above our theoretical diplomatic weight. We can make friends and enemies as we please and suffer less than, say, the Colombians might if they copied our actions—all thanks to our oil."

###  News Events  ###

# Porteñazo

VEN_news.1.t: "[Get_newspaper_header]Venezuela's El Porteñazo Revolt Crushed"
VEN_news.1.desc: "Grave news emerges from Venezuela today as a standoff in the city of Puerto Cabello has spilt blood over the city's streets, with many calling this one of the bloodiest government responses since the last days of Pérez Jiménez. The latest in a long line of insurrections, a collection of communist military dissidents, under the command of Officer Manuel Ponte Rodríguez, attempted to seize the city. A period of brutal fighting between the revolting officers and Armed Forces has left the city strewn with the bodies of the dead, and the rebellion ultimately failed.\n\nThe supposed aim of the revolt has been left up in the air, however, it seems much of the blame has landed on the Venezuelan Communist Party, which has experienced a sea of arrests, investigations and tribunals over the last few days, which has only increased public support for the communist movement."
VEN_news.1.a: "To give your all and be condemned for it is the leader's curse."
VEN_news.1.b: "The eagle is quick to pick off the mice that scurry near her nest."
VEN_news.1.c: "And so, the policy of reconciliation ends."

VEN_news.2.t: "[Get_newspaper_header]Venezuela's El Porteñazo Revolt Surrenders"
VEN_news.2.desc: "The June 2nd Movement, which had staged an armed uprising in Puerto Cabello, has unexpectedly peacefully surrendered to the Venezuelan military. Fostered by Minister of Finance Fabricio Ojeda, a roundtable was held between Captain Manuel Ponte Rodríguez and President Larrazábal, who agreed on terms for the surrender.\n\nThe peace represents a breaking point in the hostility that has emerged between the Venezuelan government and its former partners in the socialist and communist left. This approach, however, has sparked hope for many of a peaceful future and calm collaboration moving forward. Rodríguez will face charges for the revolt, but he urged his followers to lay down their weapons peacefully. Although peace has returned to the city, the communist movement resumes in the interior of the country."
VEN_news.2.a: "A bone is thrown to the wolves."
VEN_news.2.b: "More to the man than his smiles would tell you."
VEN_news.2.c: "A tactful show of resolve in a dangerous interregnum?"

# 1963 Elections

VEN_news.3.t: "[Get_newspaper_header]Jóvito Villalba Inaugurated as Venezuelan President"
VEN_news.3.desc: "The meritocratic traditions of Venezuela have won out once again in the battle for the Presidency as Jóvito Villalba, the helmsman of the ruling party, and leading democratic advocate over the last decade, has won the recent presidential elections. Many initially expected Villalba to have taken this office years earlier, in the fallout of the Pérez Jiménez dictatorship after a long career fighting for a democratic transition.\n\nHowever, his years serving as party chairman seem to have paid off, with Villalba viewed as the respectable, calm and stable individual in the cabinet amidst the chaos. Villalba has assured the Venezuelan public of his commitment to both peace and democracy, promising the gradual building of bulwarks to ensure a repeat of the military dictatorship remains impossible."
VEN_news.3.a: "So it would seem."
VEN_news.3.b: "Pérez Jiménez's shadow lifted step by step."
VEN_news.3.c: "A most warm friendship over the Caribbean."

VEN_news.4.t: "[Get_newspaper_header]Fabricio Ojeda Inaugurated as Venezuelan President"
VEN_news.4.desc: "Fabricio Ojeda, Minister of Finance under the previous Larrazábal administration, has led a starkly different Democratic Republican Union to another victory. With a nail-bitingly close leadership election against chairman Jóvito Villalba, Ojeda secured a major upset over the URD's party establishment, and then used firebrand rhetoric to rouse the nation's masses in the recent 1963 Venezuelan elections.\n\nFrom the raucous streets of the slums to the babbling party headquarters of the URD, Venezuelans once again chose change above all else. Ojeda's message of peace, transparency and equal opportunity held broad appeal - though some, particularly in the armed forces, have called the election a fluke and a dangerous uncertainty.\n\nWhile Ojeda's supporters hope the need for peace will sheathe foes' daggers, few know for sure if this regime will last.\n"
VEN_news.4.a: "A break in America's personal oil field."
VEN_news.4.b: "Such is the doom of socialism in South America."
VEN_news.4.c: "Bright flames burn out fast."

VEN_news.5.t: "[Get_newspaper_header]Gonzalo Barrios Inaugurated as Venezuelan President"
VEN_news.5.desc: "The progressive wave sweeping Latin America in the aftermath of Puerto Plata has finally reached Venezuela, as Gonzalo Barrios assumes the presidency. The political protégé of the late Rómulo Betancourt, Barrios never ceased his indignant attacks against fascism in the Americas after his mentor's death, a position now vindicated by the downfall of Rafael Trujillo.\n\nAfter a hard-fought battle against Raúl Leoni for leadership of the Democratic Action party, Barrios managed to win the Presidency against all odds. With his reputation as a level headed and calm statesman, Barrios has promised a renewed fight for prosperity, education and equality. More than all, however, he has declared that fascism will have no home in Venezuela, and indeed in Latin America."
VEN_news.5.a: "A fool in shoes far too big for him."
VEN_news.5.b: "The torch never stopped burning in Venezuela."
VEN_news.5.c: "An under-appreciated man from a gentler time."

VEN_news.6.t: "[Get_newspaper_header]Raúl Leoni Inaugurated as Venezuelan President"
VEN_news.6.desc: "One of the founders of Venezuelan democracy, Raúl Leoni has been swept into the Presidency today on a monumental return of Democratic Action. The legacy of Rómulo Betancourt, the architect of not just AD, but of modern Venezuelan history, has today been vindicated in such a victory.\n\nTo some, it was a simple inevitable return of the old status quo, to others, following Leoni's sinking defeat in 1958, it seemed almost miraculous. Regardless, Leoni's past promises of stability, economic reliability and democratic virtues have remained his guiding objective. Already, the President has promised increased opportunities for Venezuelans, including the beginning of a battle against crime, terrorism and extremism, wherever it may be found, as Leoni begins to lay out his future plans for the development and stable growth of the nation.\n"
VEN_news.6.a: "A firm hand from a weak man."
VEN_news.6.b: "Trujillo's great ploy has failed entirely."
VEN_news.6.c: "In the company of good friends."

VEN_news.7.t: "[Get_newspaper_header]Rafael Caldera Inaugurated as Venezuelan President"
VEN_news.7.desc: "Reports arrive from Venezuela that Rafael Caldera, the renowned silver-tongued orator, has won the 1963 presidential election. From paperboys hawking headlines on the streets of Caracas to lively chatter, the legendary politician's victory has stirred the populace. Renowned for his eloquent speeches upholding moral leadership, Caldera stood out as a calming voice of unity amid division.\n\nCaldera has laid out an ambitious vision to deliver long-awaited reforms. He promised to empower rural communities, strengthen worker protections, and safeguard religious freedoms for all. Most significantly, Caldera has vowed to reach a compromise with Guyana over the Essequibo dispute, much to the dismay of Venezuelan nationalists.\n\nHowever, as COPEI gears up to lead the country into a bold new era of progress and prosperity, many feel Venezuela's best days are yet to come.\n"
VEN_news.7.a: "The oil reserves are further distanced from us."
VEN_news.7.b: "Seems sanity has returned to Venezuela."
VEN_news.7.c: "The sharpest tongue in Venezuela has out-waggled all others."

# Coups

#Other
VEN_news.8.t: "[Get_newspaper_header]Military Coup Topples Venezuelan Government"
VEN_news.8.desc: "Alarming news from Venezuela today, as once again the Armed Forces have seized power. The coup plotters, led by General Félix Román Moreno, stormed the Presidential Palace and arrested sitting President Jóvito Villalba, quickly displacing the civilian government. Many observers claim that Villalba's failure to properly pacify the armed forces and de-politicize the organization led to their sudden revolt.\n\nGeneral Róman Moreno, an ex-confidant of former dictator Marcos Pérez Jiménez and a leading figure among his supporters, has taken charge of the country. Promising that the new junta will only be temporary, the General claims the country needs a "grand restructuring" of the current constitution. For now, it seems Venezuela has not escaped the shadow of military strongmen."
VEN_news.8.a: "The ever-unquenchable fury of the Armed Forces."
VEN_news.8.b: "Venezuelan democracy never stood a chance."
VEN_news.8.c: "Pérez Jiménez's meddling will come back to bite him, sooner than he may think."

VEN_news.9.t: "[Get_newspaper_header]Venezuelan Military Leashed After Failed Coup" 
VEN_news.9.desc: "From Ayacucho Hall, Venezuelan president Jóvito Villalba has announced a series of reforms to depoliticize the nation's military and subordinate it fully to civilian authority. While Villalba had previously been working with experts and his URD party on similar restrictions, their scale, scope, and likelihood of passage grew immensely overnight following a failed coup by military followers of the former dictator Pérez Jiménez.\n\nVenezuelan intelligence and their Veracruz Pact allies were able to infiltrate the plot, allowing loyalist forces to bloodlessly capture the rebels as they attempted a midnight putsch. With senior military figures like Generals Félix Román Moreno implicated, Congress is expected to pass Villalba's reform agenda swiftly."
VEN_news.9.a: "A long night, but few knives for Villalba."
VEN_news.9.b: "Spies outfox soldiers."
VEN_news.9.c: "Handled like a Commander-in-Chief."

VEN_news.45.t: "[Get_newspaper_header]Military Coup Amidst Venezuelan Revolution"
VEN_news.45.desc: "A tense and divisive day in Venezuela today as the government in Caracas has agreed to a temporary suspension of the nations's democratic institutions. With the current stalling on the frontlines, many within the military have pressured government officials to resign in what is being considered a bloodless coup.\n\nA temporary military junta has been formed, led by Pablo Antonio Florez Álvarez, a well-respected General renown for his efforts to restore apoliticism and respect to the previously divided and radical Armed Forces. While protests have broken out in major urban areas, with many feeling apprehensive about signing away democratic power to the military once more, they have been met with a brutal crackdown, much to the dismay of Venezuela's allies inside the Veracruz Pact and OFN.\n"
VEN_news.45.a: "The last scream of a dying nation."
VEN_news.45.b: "A bold choice considering her history of military rule."
VEN_news.45.c: "A necessary measure, a temporary setback..."

#Easter Coup
VEN_news.11.t: "[Get_newspaper_header]Easter Coup Topples Venezuelan Government"
VEN_news.11.desc: "Only six years after the last military coup in Venezuela, another has been launched today under the leadership of General Jesús María Castro León. Castro León, a prominent figure in the regime of former dictator Marcos Pérez Jiménez, has long been outraged by the return of the so-called "institutionally corrupt" Democratic Action and has sought their removal.\n\nAfter seizing control of telecommunication and radio stations, the military was able to capture the Palace of Miraflores. Castro León has publicly promised to eliminate subversive elements within Venezuela by establishing a temporary junta to enact his "5 National Points", a proposed reorganization of the nation's constitution. While the military and the oligarchs firmly support Castro León, many Venezuelans are uncertain about the end goal of his "reorganization."\n"
VEN_news.11.a: "The strong topple the weak."
VEN_news.11.b: "The American facade slips again."
VEN_news.11.c: "A dangerous individual of unknown quantity."

VEN_news.12.t: "[Get_newspaper_header]Easter Coup Against Venezuelan Government"
VEN_news.12.desc: "Only six years after the last military coup in Venezuela, another has been launched today under the leadership of General Jesús María Castro León. Castro León, a prominent figure in the regime of former dictator Marcos Pérez Jiménez, launched the coup in response to the election of Fabricio Ojeda, a Cuban Revolution-inspired socialist, as President.\n\nAfter seizing control of telecommunication and radio stations, the military was able to capture the Palace of Miraflores. Castro León has publicly promised to eliminate subversive elements within Venezuela by establishing a temporary junta to enact his "5 National Points", a proposed reorganization of the nation's constitution. While the military and the oligarchs firmly support Castro León, many Venezuelans are uncertain about the end goal of his "reorganization."\n"
VEN_news.12.a: "The strong topple the weak."
VEN_news.12.b: "The American facade slips again."
VEN_news.12.c: "A dangerous individual of unknown quantity."

VEN_news.10.t: "[Get_newspaper_header]Military Coup Attempt in Venezuela Fails"
VEN_news.10.desc: "A sigh of relief could be heard across Venezuela today, as the country has narrowly avoided another military coup. General Jesús María Castro León, a staunch critic of the country's left-leaning President, attempted to seize several of Venezuela's government institutions. However, due to a lack of communication between the barracks, the coup was halted by a combined police and military effort.\n\nFollowing the attempt, General Castro León stood down and was taken into custody, justifying his actions as "in defence of the country he loves." While the general surrendered, his co-conspirators have scattered. Several officers have been arrested in the aftermath, while others have fled abroad. Some suspect that the plot has simply moved underground, with this being only the first boulder in an avalanche that may yet come."
VEN_news.10.a: "A sad, pathetic attempt."
VEN_news.10.b: "Venezuelan democracy seems to be built to last."
VEN_news.10.c: "A failure in all things he attempted to do."

#Moncada Vidal
VEN_news.13.t: "[Get_newspaper_header]White Palace Uprising Fails"
VEN_news.13.desc: "The strained relationship between the Venezuelan government and Armed Forces came to a head today, as the country narrowly avoided a military coup. This attempt, led by General Castro León's protégé, Juan de Dios Moncada Vidal, has left hundreds around Caracas wounded, and the nation shaken.\n\nAfter seizing the White Palace, the coup plotters entered a bitter skirmish with protesters and military police over the Palace of Miraflores, which gave the government time to mobilize loyal units. Though Moncada Vidal's forces were eventually pushed back, the use of artillery against Miraflores and other areas of Urdaneta Avenue has left the capital scarred. Once again Venezuela is haunted by her military past, which she seems to never be able to shake."
VEN_news.13.a: "Playing dictator in America's sandpit will always end up with sand in your eyes."
VEN_news.13.b: "A brutal last strike by the worst of the Armed Forces."
VEN_news.13.c: "Moncada Vidal's remaining dogs best scurry off to the jungle."

VEN_news.14.t: "[Get_newspaper_header]The White Palace Uprising"
VEN_news.14.desc: "The strained relationship between the Venezuelan government and Armed Forces came to a head today, as General Juan de Dios Moncada Vidal has seized power. President Rafael Caldera's negotiations over the Essequibo, which drew the ire of nationalistic military officers, seems to have been the last straw.\n\nMoncada Vidal - protégé of the retired General Jesús María Castro León - is the leader of this nationalist clique. Seizing the Palace of Miraflores in what spectators are calling a violent and ferocious assault, Moncada Vidal and his radical followers, nicknamed "the Bolivarians," have made several bold proclamations of changes to come. Though the future remains uncertain, it appears that Venezuela's young democracy has come to an end."
VEN_news.14.a: "Patriotism and pragmatism are not completely dead in Venezuela, then."
VEN_news.14.b: "Dark skies over Caracas."
VEN_news.14.c: "The Organization of Free Nations does not take kindly to tyrants."

VEN_news.47.t: "[Get_newspaper_header]The End of the National Governing Board"
VEN_news.47.desc: "The seeming last hope for Venezuela has spluttered out abruptly and without ceremony as the National Governing Board, the interim council constructed by Jesús María Castro León before his death, has been dissolved by force today following a violent revolt in the nation's capital.\n\nSpeculators have long expected tension between the board and the increasingly radicalised military. However, it seems the supplanting of the former dictator's protégé in favor of entrepeneur and philantropist Eugenio Mendoza struck too deep of a nerve in the Bolivarian clique of the military to be ignored.\n\nThe presidency has been reassumed by the military, now under the leadership of Juan de Dios Moncada Vidal. Moncada Vidal is a well-known nationalist ideologue, reputed for his fierce doctrinal rule over the military and authoritarian tendencies. Internationally, many worry what this will mean for Venezuela.\n"
VEN_news.47.a: "Ever the inevitability."
VEN_news.47.b: "A brutal end for men only trying their best in trying times."
VEN_news.47.c: "Breaking treaties with us will cost dearly."

# Castro Leon/Mendoza

VEN_news.18.t: "[Get_newspaper_header]" #unused apparently
VEN_news.18.desc: ""
VEN_news.18.a: ""
VEN_news.18.b: ""
VEN_news.18.c: ""

VEN_news.28.t: "[Get_newspaper_header]Moncada Vidal Assumes Control of Venezuela"
VEN_news.28.desc: "Military rule continues in Venezuela as Juan de Dios Moncada Vidal, protégé and right hand man of the former dictator Jesús María Castro León, has been named his successor. Though the General long claimed an eventual return to democracy, it appears the failed implementation of his 5 Point Plan caused him to reconsider.\n\nMoncada Vidal is well known within military circles for his fervent, radical and ultranationalist approach and belief in the need for national renewal across Venezuela's political scene. Though his dedicated followers have done much to burnish Moncada Vidal's image within the populace and barracks, many Venezuelans express concern about his aggressive stance at home and abroad. Nevertheless, a grand parade throughout Caracas celebrated the nation's new leader."
VEN_news.28.a: "A man driven by his commitment is always welcome."
VEN_news.28.b: "A man whose intentions remain unknowable."
VEN_news.28.c: "El Cabito has signed Venezuela's death warrant."

VEN_news.29.t: "[Get_newspaper_header]Eugenio Mendoza Assumes Control of Venezuela"
VEN_news.29.desc: "In news coming shortly after the retirement of General Jesús María Castro León from Venezuela's government, a National Governing Council has been created to act as an interim authority to begin the transfer of power from the military to civilian hands. Led by Eugenio Mendoza, Castro León's designated successor, the Council seeks radical reforms to undo the excesses caused by the military's overwhelming presence Venezuelan institutions.\n\nSpecifically, a recent programme leaked to the media has highlighted the need for a sharp reduction of radical elements within the military and the removal Bolivarian influence. Supporters of Mendoza believe these are necessary steps to see Venezuela return to both stability and democracy, while critics have alternated between labelling him as a puppet of the oligarch, or as a crypto-communist seeking to poison Venezuela with "international capital."\n"
VEN_news.29.a: "Hopefully, a man with his head screwed on tighter than his predecessors."
VEN_news.29.b: "Venezuela has called upon its brightest and boldest."
VEN_news.29.c: "A skilled statesman and excellent politician."

VEN_news.30.t: "[Get_newspaper_header]The End of the National Governing Board"
VEN_news.30.desc: "What once acted as the seeming last hope for Venezuela in its darkest decade has spluttered out abruptly and without ceremony as the National Governing Board, the interim council constructed by Jesús María Castro León before his death, has been dissolved by force today following another military coup.\n\nPresident Eugenio Mendoza resigned following the military dissolution of the council today, citing his inability to restore order and stability to the nation and apologising to the Venezuelan people. In his place, a longterm peer of General Castro León, Oscar Tamayo Suárez, is expected to lead an interim military junta, focused on restoring stability to the nation.\n\nTamayo Suárez is a known quantity in Venezuela and political force within the former government. Many point, however, to this likely leading to months - or worse - years, of continued inaction on the suspended state of the nation.\n"
VEN_news.30.a: "Dragged and forgotten, the Generals take back what's rightfully theirs."
VEN_news.30.b: "A thin ray of hope, dashed."
VEN_news.30.c: "The breaking of our treaty cannot stand."

VEN_news.31.t: "[Get_newspaper_header]Reorganization of Venezuelan Government" #NO NEWS EVENT COMING IN MT
VEN_news.31.desc: "modern venezuela bill reorganized, oligarchs led by pedro tinoco soft coup mendoza and make him an oligarch puppet, fake democracy. woe is me."
VEN_news.31.a: "A fabrication that serves the interests of fat oligarchs."
VEN_news.31.b: "Mendoza once again calls on his disciples."
VEN_news.31.c: "It is shameful to cast doubts..."

VEN_news.32.t: "[Get_newspaper_header]Reorganization of Venezuelan Government" #NO NEWS EVENT COMING IN MT
VEN_news.32.desc: "whulsum mendoza overpowers his enemies and does oligarchic liberalism paradise"
VEN_news.32.a: "Another democratic project? Only a fool trips over the same stone twice."
VEN_news.32.b: "Much is promised, delivering on those promises is the issue."
VEN_news.32.c: "A promising event, let's hope it's followed through."

VEN_news.34.t: "[Get_newspaper_header]Mendoza Resigns from Venezuelan Governing Board"
VEN_news.34.desc: "Eugenio Mendoza, leader and richest man of Venezuela announced his resignation on a short but firm national broadcast today, citing "health issues and personal matters". The position of head of state is now filled by his Minister of Internal Affairs, Pedro Tinoco, a wealthy businessman known for his in-depth relationship with the current regime.\n\nMany pundits and international observers saw this move coming following the reorganization of the Modern Venezuela Bill, which promised a return to free elections, threatening the powerbases of many of the oligarchs who supported Mendoza. It is suspected that these oligarchs and magnates forced Mendoza to "retire" by threatening to support a military coup against him. It is unclear what direction Venezuela will take now, but one thing is clear: the power of the oligarchy will not be challenged."
VEN_news.34.a: "Outpaced by the greed of his compatriots."
VEN_news.34.b: "A titan in Venezuelan history - fallen."
VEN_news.34.c: "A sad end for a titan of a man."

VEN_news.35.t: "[Get_newspaper_header]Eugenio Mendoza Announces Venezuelan Elections"
VEN_news.35.desc: "Eugenio Mendoza, leader and richest man of Venezuela, has announced new elections scheduled for 1970 on a national broadcast. Immediately, celebrations have broken out across the country in most cities and metropolitan regions. Cheered by the move, liberal dissidents forced abroad by General Castro León's coup have also begun making their way home.\n\nThese changes come as a result of Mendoza's Modern Venezuela Bill, legislation opposed both by military conspirators and many business magnates of the National Governing Board. However, with the passing of the bill, the most radical elements of the military have either been removed or cowed, while the opposing oligarchs look to the next election as a chance to rebuild their power structures."
VEN_news.35.a: "Another democracy built on the black veins of Venezuela."
VEN_news.35.b: "A reliable trade partner for the future to come."
VEN_news.35.c: "Working alongside such a figure was a pleasure."

VEN_news.36.t: "[Get_newspaper_header]Pedro Tinoco Inaugurated as Venezuelan President"
VEN_news.36.desc: "Pedro Tinoco, an elite lawyer and banker, was sworn in today following Venezuela's first elections since General Castro León's coup in 1964. His inaugural address promised stability and prosperity for Venezuelans, backed by sensible macroeconomic management and infrastructure spending.\n\nTinoco's Integración Republicana received support from Venezuela's businessmen and industrialists, and the noted developmentalist has named leading executives to his cabinet.\n\nMost observers attribute IR's electoral dominance to advantages rendered by the 'Modern Venezuela Bill', which was heavily amended by Tinoco and his associates on the National Governing Board. Eugenio Mendoza, a prominent former member of the Board who had called for free elections, could not be reached for comment.\n"
VEN_news.36.a: "Finally - a man who understands the value of what his nation sits on."
VEN_news.36.b: "A man surely apt of business, though lacking in morals."
VEN_news.36.c: "Making Venezuela a whore to the highest bidder...?"

VEN_news.37.t: "[Get_newspaper_header]Arturo Uslar Pietri Inaugurated as Venezuelan President"
VEN_news.37.desc: "With the results of Venezuela's first free election since its military coup and return to democracy finally counted, it seems that Arturo Uslar Pietri has won a firm majority, allowing him to become President and putting his National Democratic Front into power. A noted artist and intellectual, as well as a political moderate, Uslar Pietri is widely expected by observers to use his first term to expand on civil liberties in tandem with economic liberalisation.\n\nHowever, sceptics are concerned regarding whether or not these ambitions will actually bear fruit, citing the outsized impact that Venezuela's oligarchs had on his campaign, and how their aid was vital to his success. The question of oligarchical influence seeping into the actual running of government remains in the air, flaunted loudly by the opposition, despite a quiet gratitude for the return of democracy.\n"
VEN_news.37.a: "A new Republic as fragile as the old one."
VEN_news.37.b: "A pawn, too simple — too naive — to realize."
VEN_news.37.c: "A man we can work with."

VEN_news.38.t: "[Get_newspaper_header]Jóvito Villalba Inaugurated as Venezuelan President"
VEN_news.38.desc: "Venezuelan political heavyweight Jóvito Villalba has won a stunning victory today, finally taking the presidency after previous failed attempts. With the end of Mendoza's government and a restoration of democracy, Villalba's success has been credited to the growing backlash against oligarchic control in the country. His victory comes as a surprise given the colossal electoral advantages that the rival party, Frente Nacional Democrático, possessed.\n\nThough Villalba briefly fled the country after the Easter Coup, he remained leader of the URD party in exile. After returning to Venezuela he created a big-tent coalition, riding a wave of popular discontent against the governing elites. Villalba is expected to re-establish ties with Venezuela's old allies in the Veracruz Pact."
VEN_news.38.a: "An old titan, well past his prime."
VEN_news.38.b: "Villalba's record precedes him."
VEN_news.38.c: "A most warm friendship, even in such troubling times."

# Bolivarians

VEN_news.17.t: "[Get_newspaper_header]Bolivarian Republic Declared in Venezuela"
VEN_news.17.desc: "In the wake of military ideologue Juan de Dios Moncada Vidal's seizure of power in Venezuela, a so-called "Bolivarian Republic" has been declared, formally ending the Fourth Republic.\n\nThe new government, under the leadership of the highly nationalistic Bolivarian Military Civic Union, has denounced the imperialism they claim has plagued Venezuela for decades, stating that the formation of this Republic signifies an end to the nation's humiliation.\n\nMany within the Organization of Free Nations and Veracruz Pact have urged strong condemnations for what is becoming an increasingly insular, totalitarian and xenophobic regime. Within Venezuela, the declaration has been marked by vibrant military parades and a day of national celebration."
VEN_news.17.a: "A promising return from the decay of the last few years."
VEN_news.17.b: "A dangerous, unstable and radical idea."
VEN_news.17.c: "Bolívar was felled once, and died a long death, and will do so again."

VEN_news.40.t: "[Get_newspaper_header]Venezuelan Government Prevails in Dance of the Dogs"
VEN_news.40.desc: "After massive, months-long riots and demonstrations, the Bolivarian government of Venezuela has prevailed and strengthened their grip on the nation. The socialist movement has nearly been exterminated, with the small remnants forced to go into hiding in urban centers or the Andes. Exiled democratic politicians have condemned the "wanton bloodshed" to no visible effect.\n\nWhile the intensification of the riots led to a coup attempt by a radical dissident Bolivarian faction led by Nicolás Hurtado Barrios, the coup failed completely, leading to the execution of its leaders and several other opposition figures. Appearances by the regime's leader, Juan de Dios Moncada Vidal have grown less frequent, with younger, more zealous officers taking on larger roles. Regardless of who is truly in charge of the South American pariah state, the Bolivarian Revolution has been cemented.\n"
VEN_news.40.a: "A divided legacy in history..."
VEN_news.40.b: "A tiny sailboat amongst a river of blood."
VEN_news.40.c: "The chaos of that cursed regime lingers on."

VEN_news.41.t: "[Get_newspaper_header]July Coup in The Bolivarian Republic of Venezuela"
VEN_news.41.desc: "Following domestic turmoil after the violent nationalization of foreign-owned oil assets, indiscriminate massacres conducted by Bolivarian paramilitaries and the complete severance of ties with the United States, dissident Bolivarian forces within the regime have appeared to take advantage of its woes, sieging the Miraflores Palace and executing President Moncada Vidal on live television to calm widespread rioting.\n\nThe leader of the coup, Nicolás Hurtado Barrios, later appeared in an address where he announced a programme of land reform and economic redistribution. While still a committed Bolivarian and participant in the White Palace Revolution, Hurtado Barrios is considered the leader of the relative "left" faction of the junta, associated with a peasantist and populist power base, both of whom have helped calm rioting since his takeover and redirected the anger towards America.\n"
VEN_news.41.a: "A full circle of nationalism, decline and decay."
VEN_news.41.b: "From ideology to ideology she has been tossed."
VEN_news.41.c: "The Bolivarian engine turns a wheel."

VEN_news.69.t: "[Get_newspaper_header]The Reunification of Gran Colombia"
VEN_news.69.desc: "In shocking news today, the Presidents of Venezuela and Colombia announced in a joint speech the unification of their respective nations to reform the Bolivarian Republic of Gran Colombia. They stated the creation of the new state was to ward off foreign imperialism, particularly from the United States.\n\nAlready, the drafting of a new constitution is underway, as both militaries launch joint parades to commemorate the occasion. More pressingly, the new Republic has sent communiques to neighbors inviting them to become part of the new state. International observers are fearful that the new regional power may choose to forcefully annex them into the Republic. Superpowers wait and watch for what will happen to South America, as the duopoly of Argentina and Brazil is challenged like never before.\n"
VEN_news.69.a: "A rottweiler let loose in America's backyard."
VEN_news.69.b: "Weak alone, strong together."
VEN_news.69.c: "A threat to freedom across the continent."

# Venezuelan Civil War

VEN_news.62.t: "[Get_newspaper_header]The Essequibo Crisis"
VEN_news.62.desc: "War erupted today as the Bolivarian Republic of Venezuela launched an invasion to seize the disputed Essequibo region from neighboring Guyana. Its soldiers aim to march to the Essequibo river, covering roughly two-thirds of Guyana's territory to conquer a Spanish imperial claim.\n\nThe dispute persisted for decades due to nationalism and a longstanding disagreement between the British and Gran Colombia. The emergence of the militaristic, ultranationalist and fascist Bolivarian Republic in Venezuela only heightened tensions.\n\nAlready, Guyana, a long-standing member of the Organization of Free Nations, has called its allies to arms. Though the response of OFN forces to mobilize has been slow, being caught by surprise, many expect the campaign to end poorly for the Bolivarian Republic.\n"
VEN_news.62.a: "A crack in Monroe's window."
VEN_news.62.b: "A feud that far outdates both nations."
VEN_news.62.c: "And so, the hammer will come down on the Bolivarians."

VEN_news.63.t: "[Get_newspaper_header]Venezuelan Victory in Essequibo Crisis"
VEN_news.63.desc: "Venezuelan forces have succeeded in seizing the disputed Essequibo region from Guyana in a full-scale invasion. With a disorganized and unprepared Guyanese army and Canadian garrison, the OFN failed to mobilize rapidly enough to defend the small nation.\n\nMounting casualties and a failed counteroffensives have forced Canada and the United States to the negotiating table, allowing Venezuela to annex the Essequibo in exchange for the establishment of a Eastern Guyana rump state. Surinamese forces, vital in defending their neighbor, have helped instate a temporary junta while the Canadian authorities organize what remains of Guyana. The move has largely reinforced Venezuela's status as an international pariah in the Americas, but has been met with rapturous nationalist reception at home.\n"
VEN_news.63.a: "The Organization of Free Nations licks its wounds."
VEN_news.63.b: "What ever happened to the Monroe Doctrine?"
VEN_news.63.c: "A show of incredible, shocking and, worst of all, humiliating might."

VEN_news.64.t: "[Get_newspaper_header]The Venezuelan Civil War"
VEN_news.64.desc: "Recent domestic conflict in Venezuela has evolved into civil war, following the failure of the Bolivarian regime's invasion of Guyana and the subsequent assasination of President Moncada Vidal. Escalating communist insurgencies against the incumbent Bolivarians have led the OAS to intervene against both parties to restore stability.\n\nWith a three-way conflict between the Bolivarianist Republic, the communist insurgents, and the OAS interventionary force extending across rough terrain, peace is not anticipated to return soon. The open use of the American military in this conflict has drawn criticism from some Latin American intellectuals, who argue that the show of force is to cow other potential "troublemakers" into submission.\n"
VEN_news.64.a: "A more... direct approach than usual."
VEN_news.64.b: "Sunset on the Bolivarian Republic."
VEN_news.64.c: "Every warning was given."

VEN_news.67.t: "[Get_newspaper_header]Government Prevails in Venezuelan Civil War"
VEN_news.67.desc: "To the surprise of many, the government of the Bolivarian Republic of Venezuela led by Juan de Dios Moncada Vidal's successor, Manuel Azuaje Ortega, has managed to become the sole authority over Venezuela once again. Having conducted a vicious and extensive extermination campaign against the communist revolutionaries of the FALN, they also decisively pushed the OAS-OFN joint invasion back into the sea and over the border with Guyana, securing full control over national territory.\n\nIn his first speech since the victory, Azuaje Ortega proclaimed a full mobilization against remaining enemies of the state within Venezuela. The OAS has furiously condemned him as a tyrant, but its failed intervention is already being seen as a serious blow to the organization's prestige and capabilities.\n"
VEN_news.67.a: "A welcome surprise?"
VEN_news.67.b: "The pariah state that refuses to be a pariah."
VEN_news.67.c: "The engine of Bolivarianism continues to be fueled with the blood of its kinsmen."

VEN_news.66.t: "[Get_newspaper_header]Communist Victory in Venezuelan Civil War"
VEN_news.66.desc: "Against all odds, the communist movement of FALN - Bandera Roja has managed to overthrow the Bolivarian Republic and drive out the invading OAS-OFN task force. International observers attribute their victory to ample popular support and the ability to mobilize overwhelming numbers. Nationalist backlash against the OAS intervention drove revolts across Venezuela's urban centers, which lead to government buildings being ransacked and the lynching of officials accused of 'collaboration'.\n\nAmérico Silva, leader of the group, has proclaimed the establishment of the People's Republic of Venezuela and a people's mobilization against counterrevolutionary enemies inside the government's territory. His success may inspire similar movements within Venezuela's neighbors and across the Americas.\n"
VEN_news.66.a: "An absolute farce."
VEN_news.66.b: "It feels awfully like 1922 again..."
VEN_news.66.c: "How could we have let this happen?"

VEN_news.65.t: "[Get_newspaper_header]OAS Victory in Venezuelan Civil War"
VEN_news.65.desc: "After an arduous campaign, the OFN-OAS joint forces have successfully ended their pacification of Venezuela. Soldiers across the Americas and the OFN celebrate as they are shipped back to their home countries, though the reaction of Venezuelan civilians has been apathetic at best. As the pariah state was liberated, footage and evidence showed all manner of atrocities from torture centers and concentration camps to mass graves and ghost towns.\n\nThe work of the task force now shifts to preparing the country for a return to self-government and democracy, as the Latin American nation works to rebuild its institutions, trial remaining regime figures, and remove extant fascist influence in favor of OFN-aligned values. While both communist and Bolivarian resistance remains in the countryside, peace has returned to Venezuela.\n"
VEN_news.65.a: "The winner writes history it seems."
VEN_news.65.b: "At the very least, it's over."
VEN_news.65.c: "Now comes the long peace."

VEN_news.48.t: "[Get_newspaper_header]Enrique Tejera París Assumes Control of Venezuela"
VEN_news.48.desc: "With the beginning of the Oil Crisis and the worldwide financial shock, the OAS administration of Venezuela has, after pressure from the United States, officially ended. Power is currently being transferred to Dr. Enrique Tejera París, a leader of the democratic movement-in-exile in the U.S. with limited popularity in Venezuela. Pacification campaigns in the countryside continue against Bolivarian and communist insurgents, as the nation slowly rebuilds itself.\n\nThough OAS rule has ended, significant American presence remains, with Venezuela confirmed as an official OFN member. Sporadic protests have occurred in the U.S. against the continued occupation, though the response in Caracas and Maracaibo has been muted."
VEN_news.48.a: "Another lapdog to add to America's collection."
VEN_news.48.b: "Tamed and brought to heel."
VEN_news.48.c: "They have been taught obedience."

# Venezuelan Revolution

VEN_news.49.t: "[Get_newspaper_header]The Venezuelan Revolution"
VEN_news.49.desc: "Venezuela has descended into civil war after a massive communist uprising by the Armed Forces of National Liberation, or FALN, failed to oust the government. Despite the FALN's overwhelming numbers, the national army managed to regroup and oust organized FALN forces from coastal regions and plains.\n\nInternal pressures and communism's spread in Latin America have radicalized much of Venezuela's population, allowing the FALN to recoup its losses. Already, fresh troops are gathering at its makeshift capital of Ciudad Bolívar, as bloodied survivors of its initial assault gather in the Andes. Compounding the government's difficulties are sabotage campaigns by radical students and insurgent bands in reclaimed rural areas."
VEN_news.49.a: "To be crushed without mercy."
VEN_news.49.b: "The llanos stained with reds' blood."
VEN_news.49.c: "Venezuela has more communists than it has oil!"

VEN_news.50.t: "[Get_newspaper_header]Government Prevails in Venezuelan Revolution"
VEN_news.50.desc: "Military parades were held simultaneously in Caracas, Maracaibo, and Ciudad Bolívar to celebrate the defeat of the communists in Venezuela's grueling civil war. During the Caracas event, Marcos Pérez Jiménez proceeded down the 'System of Nationality' promenade to lay a wreath at the monument to Venezuela's deceased heroes, before launching into a passionate speech promising rapid development to repair the damages of the failed revolution and enrich those who fought for their nation.\n\nPérez Jiménez is anticipated to reach out to his foreign backers, key in the war effort, to capitalize these ventures. To reassure investors, the robust state security apparatus built by Pérez Jiménez acolyte Pedro Estrada is hunting down the few members of the FALN politbureau that remain at large."
VEN_news.50.a: "Dead communists and oil. All one can hope for from Venezuela."
VEN_news.50.b: "The New National Ideal triumphs over international revolution."
VEN_news.50.c: "Coups, revolutions, nothing can keep Pérez Jiménez down."

VEN_news.51.t: "[Get_newspaper_header]Government Prevails in Venezuelan Revolution"
VEN_news.51.desc: "Members of Venezuela's National Governing Board were present in Caracas and Maracaraibo today to pay respects to troops returning home from the long campaigns to defeat the FALN. The Board's chair announced an increase in pensions for war widows and the wounded, a symbolic measure aimed at those who accuse its elite members of failing to stem the inequality that led to widespread FALN support.\n\nA more detailed policy program is expected in the coming days. A leaked draft suggests that the Board will double down on the developmentalist strategy it pursued prior to the failed revolution, but pursue closer ties with its foreign backers to secure the financing needed to repair oil and transportation infrastructure damaged in the conflict. The leak from the highest echelons of the Board suggests internal disunity following the chaos of the war.\n"
VEN_news.51.a: "They can fling their coin around all they like. But keep a firm grip on the gun."
VEN_news.51.b: "Venezuela is the country of conceited nonentities and enshrined reputations." #Quote about Venezuela
VEN_news.51.c: "Invest across the Caribbean? We'd be buying low..."

VEN_news.52.t: "[Get_newspaper_header]Government Prevails in Venezuelan Revolution"
VEN_news.52.desc: "Sober military parades were held throughout Venezuela's major cities today before troops filed back to their barracks. The muted celebrations commemorated the final defeat of the FALN, which at points nearly won the nation's devastating civil war. General Pablo Antonio Flores assumed control over Venezuela after the nation's civilian administration became discredited by its inability to prosecute the war.\n\nFlores, in attendance at the Caracas event, proceeded down the Paseo Los Próceres promenade to lay a wreath in honor of those who died in the conflict. A short speech followed in which the general reiterated his promise that a swift and effective national reconstruction would allow a return to democracy in 1973. The general pledged to then retire from public life."
VEN_news.52.a: "The communists will return as soon as they lighten the yoke."
VEN_news.52.b: "A genuine Cincinnatus."
VEN_news.52.c: "Perhaps more Washington than Bolívar."

VEN_news.53.t: "[Get_newspaper_header]Communist Victory in Venezuelan Revolution"
VEN_news.53.desc: "Popular celebrations broke out across Venezuela today, from the dormitories of Central University to isolated plains hamlets, as Gustavo Machado of the Communist Party announced the total victory of the Armed Forces of National Liberation. The last extant forces of the Venezuelan military, hamstrung by sabotage, guerilla attacks on their rear, and defections in the wake of the Caracas government's crisis of legitimacy, surrendered in the face of overwhelming numbers.\n\nAmidst energetic joropo music, communist agitators announce to crowds the coming nationalization of the oil industry and ambitious land reform. Despite the movement's apparent popularity, many Venezuelans have taken refuge in their homes or churches, fearful of coming turmoil. Latin American states and oil firms have reacted with similar trepidation, condemning revolutionary seizures and violence.\n"
VEN_news.53.a: "A hateful outcome. But at least the Americans will be kept busy fighting the disease."
VEN_news.53.b: "What's going to happen to all that oil?"
VEN_news.53.c: "An ignorant people is a blind instrument of their own destruction."

VEN_news.54.t: "[Get_newspaper_header]Government Prevails in Venezuelan Revolution"
VEN_news.54.desc: "Venezuelan troops escorted captured members of the FALN politbureau to Caracas today, where they are expected to stand trial for treason. The communist revolutionaries nearly overthrew Venezuela's democratically elected government at the start of the nation's civil war, but firm action by the nation's military and support from the United States and Veracruz Pact allies steadily drove the rebels back.\n\nIn a televised address from Miraflores Palace, President [VEN.GetLeader] mourned the immense loss of life and vowed to rebuild a more just Venezuela, one free of the specter of communism. Noting that towns, families, and friends had been divided by the conflict, he called for a spirit of reinvigorated brotherhood, referencing Bolívar's adage "Unity makes everything possible; we must preserve that precious principle."\n"
VEN_news.54.a: "How trite."
VEN_news.54.b: "A principle preserved in blood."
VEN_news.54.c: "A veritable Lincoln of the tropics."

# Post Revolution Victory

VEN_news.55.t: "[Get_newspaper_header]The Assassination of Gustavo Machado"
VEN_news.55.desc: "The Condor Legion, the armed Latin American fascist youth organization, has claimed responsibility for the assasination of Venezuelan Communist Party leader Gustavo Machado and for a bomb attack on his state funeral. While the bomb itself killed few, FALN paramilitaries, unsure of the nature of the threat, opened fire on the panicking crowd.\n\nThe elderly Machado had been a unifying figure for revolutionary Venezuela, and was respected in far-left circles across Latin America for his role in founding the communist parties of Cuba and France. With his absence and the subsequent disaster at the funeral, analysts predict a worsening of factionalism within the Politbureau and on the streets. Already, various leaders of guerilla groups during the Revolution have expressed outrage over the egregious security failures, with some seeking to rearm their men against domestic and international rightists.\n"
VEN_news.55.a: "Soak the Condor's beak in blood."
VEN_news.55.b: "Killing the man, and his idea?"
VEN_news.55.c: "And not a word about the FBI. Well-done, team."


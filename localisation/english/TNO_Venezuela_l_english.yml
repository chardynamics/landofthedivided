USA_VEN.28.t: "Perpetual Intrusions"
USA_VEN.28.desc: "A great buzzing sound came down to the hacienda. The cattle scattered as the helicopter and its American riders set down, its rotors kicking up dust. A group of men in fancy uniforms and suits materialized from inside the machine.\n\nNearby, Isidro leaned against a wooden post, bleached by the sun, chewing a stem of moriche grass in his mouth. He watched as a squad of Venezuelan soldiers, in ragged mismatched uniforms holding guns from World War 2, waited outside the hacienda. They escorted the US advisors to a military base far off the hacienda, rifles slung low, boots cracking in the heat and dryness of the vast Venezuelan llanos.\n\nBeneath his hat, Isidro frowned, pressing his lips tightly together as he watched the group of men disappear into the distance. The old llanero had seen this before. He had lived through Cipriano Castro and the subsequent Andean Hegemony under the great Caudillo Gómez, followed by the period of transition, Betancourt and Gallegos, God knows how many coups and juntas. He had seen many flags and heard many slogans, all from men who promised certainty and stability. And yet, he had not seen it.\n\nThe helicopter flew off and gave the cattle some peace. Isidro stayed, watching the hacienda and chewing on the stem."
USA_VEN.28.a: "The man was used to this, after all."

USA_VEN.29.t: "Justice Under the Shade of the Banana Tree"
USA_VEN.29.desc: "Captain John Davis wiped away drops of sweat stinging his eyes and tried to maintain a posture worthy of a representative of the free world. The village he found himself in was the devil's asshole - a stifling, dusty hole where even the air smelled of hopelessness. Yet, here he was, under a sprawling banana tree, trying to instill the concept of a "community tribunal" in these people.\n\nIn his impeccable Castilian, honed in the lecture halls of Virginia, Davis spoke of the rule of law and transparency. He felt like a missionary among pagans. The local peasants, huddled in a semicircle, listened in silence, exchanging glances. Their rapid, rough dialect, swallowing endings, sounded to the Captain's ear like the barking of yard dogs.\n\n"Justice must be visible..." he began, but was interrupted by a hunched old woman stepping out of the crowd.\n\nDavis expected gratitude but met a gaze full of such ancient fatigue that it seemed heavier than the Andes themselves. "My son was killed by soldiers in uniforms just like those standing behind you," she creaked, pointing a knobby finger at the convoy. "And my brother was butchered by those tied up over there, for a sack of maize. You speak of law, gringo? There is only one law here: whoever has the machete is right. And you are all the same."\n\nDavis pursed his lips. "Savages," he thought with habitual irritation, getting into his jeep, enroute back to San Juan de Los Morros. He had followed the instructions: conducted the procedure. What happened next, he preferred not to see. As the jeep disappeared in a cloud of dust, the Venezuelan infantrymen silently pulled up the guerillero prisoners and led them into the thicket. That night, the jungle screamed with human voices, but Captain Davis slept soundly - his report stated: "Law and order restored.""
USA_VEN.29.a: "Civilization ends where the asphalt begins."

USA_VEN.30.t: "Shadows Among Fireflies"
USA_VEN.30.desc: "Sergeant Reyes hated night-time Caracas. From the heights of the hills, the city looked like an overturned starry sky, a black ocean where the slums shimmered like swarms of fireflies. But down here, in an alley of the Cota 905 slum as narrow as a throat, romance died, yielding to the smell of urine and rotting refuse.\n\n"God, what a stench," whispered Private Perez, walking on the left. "Like someone died here a week ago."\n\n"Shut up," Reyes hissed without turning. "Watch the rooftops. 'Cocktails' fly here more often than greetings from mommy. Hold the sector, like the Yanks taught in Panama."\n\nSuddenly, a metallic clatter tore the silence. Perez had snagged a rusty oil can with his boot. The sound of it hitting stone rang out like a gunshot, and a wave of fat cockroaches, feasting on scraps, poured out of the tin. Somewhere in the distance, dogs barked hysterically.\n\nReyes instantly raised a fist, halting the group. A small figure appeared in the shack's doorway. A child, barefoot, in a t-shirt three sizes too big.\n\nThe tactical flashlight's beam slid past the boy and snatched a wall from the darkness. Simón Bolívar was painted on it. But not the one from ceremonial portraits in ministries. This one looked furious, and scarlet paint screamed over the uniform: "EL PUEBLO NO SE ARRODILLA" - "The people do not kneel."\n\nThe Sergeant lowered his barrel. In the capital's center, Bolívar was a symbol of power; here, an icon of rebellion. And gripping the handguard of a rifle stamped "Made in USA," Reyes felt a pang of conscience: if the Father of the Nation is one for all, why do they look at him from different sides of the gunsight? And which of them is truly betraying his will?"
USA_VEN.30.a: "In the dark, all cats are grey, and all ideals are blurred."

USA_VEN.31.t: "From Valencia"
USA_VEN.31.desc: ""Dear mom, dad, and Liz,\n\nIt's been a while since I wrote, but don't worry, I'm alive.\n\nI've been moved to Valencia and the heat is as suffocating as in Barinas, but this time there's the constant noise of bikers, or 'motorizados' as they call them here, on the highway next to us. Despite this, it is a very nice place. The sunsets are beautiful, look like paintings, and the girls here look even better.\n\nIt seems that the war is ending, and thankfully in our favor, so expect me back soon!"\n\nFred stared at the letter he wrote, tapping his pencil to the table. The letter mentioned nothing. It didn't mention the constant ambushes. It did not mention how he got separated from his platoon. It did not mention how they got killed later on somewhere in the Andes. It did not mention the boy he shot in the alley, or how he closed his eyes when he killed him.\n\nHe folded the letter carefully into an envelope, wrote the address and set it aside.\n\nBut the mail truck was shot and stolen three days ago by guerrilleros. He knows it will never be sent.\n\nHe reached for another piece of paper and envelope anyway."
USA_VEN.31.a: "Dear mom, dad, and Liz..."

USA_VEN.32.t: "The Sound of Silence"
USA_VEN.32.desc: "Though it wasn't an entirely unusual occurrence for the U.S embassy in Venezuela to be brimming with as much activity in the hours before dawn, what'd strike anyone as much less familiar was the odd silence that permeated from the imposing brick structure erected upon the hills near Caracas.\n\nNot odd in how much it lacked of sound. It was actually quite the opposite: the entire embassy bathed in the tunes of the shredders that hadn't yet jammed from a whole night of tearing extravaganza, and the crackle of flames emerging from barrels beside piles upon piles of more crates awaiting their contents to be consumed.\n\nNo. It was odd in the way of what was precisely lacking. Which, in this case, was because in the entire multifloored edifice, absolutely no one could be heard saying anything.\n\nNot the sleepless staff members thoroughly walking the halls to ensure no scrap of paper would be left to discover. Neither the livid-looking diplomats, nor the marines in light tactical gear who were slowly escorting them outside the building.\n\nNothing would be heard but the car's engine roaring through the night as they carefully rode towards the airport, or the rattle of the chopper's blades carrying the American officials away from the city as they watched the sunrise dim through the tinted windows in a hazy orange blur.\n\nOf course, neither would they hear the scarf-clad youth in the slums miles below them running away from their piece, still dripping on the concrete floor in wet, perfect red. Nor would the 'YANQUIS GO HOME' in bold letters be seen by any of its intended recipients, which was perhaps a subtle victory in itself, like the fact that, for once, this graffiti would remain long after this dawn and the one that'd follow, forever echoing a sentiment shared by many, many others."
USA_VEN.32.a: "Many whose voices, from now on, would assuredly be heard."
USA_VEN.32.tt: "Opportunities to utilize the §oCondor Legion§! as a tool to §Rassassinate§! §eGustavo Machado§! can be found in the Intelligence Tab."

USA_VEN.33.t: "Victory's Taste"
USA_VEN.33.desc: "It wasn't much of a fanfare.\n\nIn fact, nothing about the flat, robotic speech of the junior attaché as they read through the press release that the U.S embassy in Caracas had hastily prepared to congratulate the Venezuelan government in its triumph against the communist threat rang like any triumph at all.\n\nIts sole flavor was of the same weariness that was reflected upon the faces of each attendee, clearly unmoved by all the hollow praises of their success in "restoring national stability."\n\nOne that was also found in the soldiers, advisors, liaison officers, and other American personnel who were now packing their meager belongings after having spent one last, joyless night in the air base. Packing plain crates in solemn quiet. Hoping to avoid the gaze of the Venezuelan troops stationed on the other side of the perimeter fence. Likely in fear of what they might spot in it.\n\nNot that there would have been much of note to find. No hint of the hate they'd expect, nor of anything else, really, other than the same fatigue they all shared. There was nothing to say, nothing to shake hands on, and especially nothing to remember from operations that, officially, had never existed at all, and never would.\n\nPerhaps a stubborn few would nonetheless try to cling to a handful of keepsakes. Maybe some crude patch bearing the Venezuelan flag that they'd bought for a buck or two from some unremarkable street vendor in the slums. For most, however, their only wish was to forget and move on.\n\nAnd if some on the other side harbored fear that the Americans would never truly leave, observing the last helicopters fade into tiny dots amidst the Caribbean skyline at least provided some measure of solace."
USA_VEN.33.a: "And soon, it would be as if nothing had ever even occurred."

USA_VEN.34.t: "The Crimson Spectre"
USA_VEN.34.desc: "CONFIDENTIAL/[GetDateText]\n\nFrom: Office of Central American Affairs\nMemorandum for the Director\nSUBJECT: INCREASED ACTIVITY FROM VENEZUELA'S ARMED FORCES OF NATIONAL LIBERATION\n\n1. There has been a significant uptick in activity from the Fuerzas Armadas de Liberación Nacional (FALN), a communist guerrilla organization. Domestic turmoil, combined with victories for the FALN, has given it a much stronger profile, and much of Venezuela's eastern, Amazonian, and Andean territories are under their control, while students and urban workers offer a broader support base.\n\n2. This conflict has been monitored with increasing focus, but the true scale of this insurgency has only recently become clear. A raid on student dormitories in the Central University of Venezuela in Caracas has revealed a sizable presence and backing for the UTC, an urban terror movement associated with FALN, and has coincided with a series of bombings against local military posts.\n\n3. Disrupting the FALN should be considered, and is still possible for now. Aid to the Venezuelan government would likely need to be more substantial than a few bullets, but even a small troop deployment should be feasible without much backlash, save from Havana. Alternatively, the Venezuelan government still seems capable of responding to the FALN, and it might be wisest to save our diplomatic and military strength for larger targets."
USA_VEN.34.a: "The choice rests in your hands."
USA_VEN.34.tt: "Opportunities to meddle in the ongoing §lSouth American§! crises can be found in the Intelligence Tab."

USA_VEN.35.t: "The Hidden Hand"
USA_VEN.35.desc: "In a plain building of fading stucco east of Plaza Altamira, a cluster of men looked around a map of Venezuela pinned up to a peeling wall. These men, field officers, intelligence analysts, and attachés, alternatively took drags of their cigarettes and pointed things out on the map.\n\nOne man grunted. "The leftist insurgency has been steadily gaining power in recent months. Rumors and whispers were one thing, a slogan spray-painted in an alley could be something or just some kid with more balls than sense, but pamphlets in the barrios are increasing. 'Join us in the Andes.' 'Take back your country.' 'Be the hidden hand of liberation.' We can't ignore this."\n\n"They're getting bolder," another man with the stout neck that marked him as an infantry officer commented. "More strikes against armories and granaries. It's one thing to burn them down, but when you break it and steal it, it's because you need it. Their training camps have at least a third more mouths to feed and hands to fill with guns now, I'm certain."\n\n"Then we need to take action. We need to decide exactly what course of action we'd take and what level of intervention we'd need to keep our involvement at. We can just wage a simple information war, fight pamphlets with pamphlets. Otherwise, we could attempt to hit their critical lifelines. Their leaders are well-protected, but if we expose the people that the leftists depend on - supply drivers, message couriers, pamphleteers - we let them be arrested, and the movement withers. Otherwise, if we want to go full scorched-earth, we'll need to do something massive and find a way to blame the leftists, galvanizing popular support against them.""
USA_VEN.35.a: "A simple information war. Expose leftist atrocities and corruption within FALN with leaflets in the barrios."
USA_VEN.35.b: "Expose mid-level figures, propagandists, and couriers for arrest, and if necessary, arrange a few "accidents.""
USA_VEN.35.c: "No half-measures. Arrange a bombing on an oil pipeline and release information to publicly accuse FALN."

USA_VEN.36.t: "Service With a Shark's Smile"
USA_VEN.36.desc: "The rust-red bricks and fading tin defined the buildings of Caracas's cerros. Petare was the largest slum in Caracas by population, and those faded and collapsing walls held a rich tapestry of the misery of human poverty. Yet even still, life went on, and when people could, they tried to lend a hand with whatever meager power they possessed. A small clinic operated at all hours, with two overworked doctors helped by an assortment of middle-aged midwives, medically-discharged soldiers using first-aid training, and priests providing semi-professional mental health counseling. Two men, undercover agents for the FBI, took a break from setting a broken bone to discuss the next element of their strategy.\n\n"This clinic isn't just preserving lives. Every illness we treat and broken bone we set is a victory over the guerrillas. They say that they serve the people, but they're not the ones driving food and vitamins into the barrios. They preach that the Church must be exterminated, but the Church faithful are the ones who actually put in the hours here. This is what we need to do to discredit them, show them that this is the better way. Once the word gets out, the people they claim to be fighting for will give them up."\n\n"In a decade maybe! The reason why the guerrillas get support is that their message is simple. Nothing is your fault; everything bad in your life is the work of the nefarious Yanqui. You're always going to find suckers who eat that garbage up. We need to work fast, get the word out that these people are monsters. If we can produce materials about them provoking attacks as false flags, that will win over the people in a heartbeat."\n\n"We have to give a report soon. Washington is going to want a tangible next step. Do we pressure the government to devote more money to the clinic, or do we go for the throat?""
USA_VEN.36.a: ""Keep the clinic working and the food aid flowing. People will believe in a government that works for its people.""
USA_VEN.36.b: ""Go aggressive. Make inroads with opposition newspapers and plant salacious rumors to get people to turn on the guerrileros."

USA_VEN.37.t: "In and Out"
USA_VEN.37.desc: "From the rest of the crowd he was indistinguishable, a nobody in a sea of nobodies just buying an empanada. Maybe he was on his lunch break, maybe it was his day off. One wouldn't expect him to be a terrorist, certainly not Frank.\n\nFrank sat in the back of a stuffy hot van in Caracas, surrounded by three other sweaty FBI agents. They were hunting Gustavo Montoya, an urban coordinator who had orchestrated a bombing in a cafe a week prior. At least Frank thought it was. He was brought on a few days ago after one of the agents was killed. Conrad, the new lead, was briefing him.\n\n"Now, the guy in the black there," he pointed to a man approaching Gustavo, "is gonna hand him a photo."\n\n"What's the photo of?" Frank asked.\n\n"It's his family. It doesn't really matter much. From there he'll either follow our man there, or we'll chase. He might also try shooting. Either way he's trapped. Now, just watch."\n\nJust as Conrad said, the man handed Gustavo a photo and walked away with his hand in his pocket. Gustavo stood, looking at the photo for a while, before acting."
USA_VEN.37.a: "He walks with the man in black, and enters a police station. No one will hear of him again. Frank and Conrad will go on to someone else."
USA_VEN.37.b: "Gustavo tries to run. Guns are drawn and badges are pulled out. Cameras flash as he's handcuffed."

USA_VEN.38.t: "Burn After Reading"
USA_VEN.38.desc: "The envelope felt like a weight in his hand as he rode in the back of the wagon along with his three other companions. Santiago's men were a deniable ops team headed toward an idyllic village in provincial Barinas. Across the great plains of the state, the men herded goats while the children played by chasing dragonflies in the marshlands that lined its numerous rivers. The people there were largely apathetic toward national life and the vagaries of politics and simply kept to themselves. A few would go into town, with trucks of animals to sell to butchers, to bring back salt, medicine, and other modern essentials that the rich land couldn't provide for itself. They paid their taxes, but otherwise, the village abided and let the nation abide around them. It was perfect, and thus, the perfect backdrop for a terrible crime.\n\nHe had been paid handsomely to do deniable operations for the United States for years. Santiago had simply never fit in anywhere else: he wasn't violent but never felt right at peace, and the thought of a job working standard hours bored him to tears. His father worked himself to the bone for a pittance, and that gave Santiago the feeling that he would always need more. The Yanquis could provide more in three months than he'd earn in six years. The insurgents would kill for a man like him, but they could never afford him - they'd pay him in promises when the Yanquis gave him gemstones, the currency of the man who didn't exist.\n\nThe envelope would have the mission outline. Santiago knew that this envelope contained what he was to do, and what this village would see. The goal would be to de-legitimize the leftists, blaming them for a terrible atrocity. Santiago knew that they would probably do it, sooner or later, but this way, his paymasters could spin it and keep him flush. He opened the envelope, got his lighter ready to burn it, and read the contents."
USA_VEN.38.a: "Keep things clean. Burn a grain silo and run the story that this neutral town was attacked for refusing to support the leftists."
USA_VEN.38.b: "Massacre the village, release photos of guerrillas who were refused by town leaders. Let the world know that they are monsters."

USA_VEN.39.t: "Monroe in Bolívar's Country"
USA_VEN.39.desc: "The safehouse meeting in the warehouse in Santa Bárbara del Zulia was barely that more welcoming than anything else in Venezuela. Ever since Gustavo Machado and the FALN took power, red militias had been skulking around in every urban center and on every country road for infiltrators. Cutting the head off the leadership in Caracas and sending the communists into political infighting was going to be tricky in this environment, but this was the least Washington could do to kneecap Caracas and cut America's losses in the Andes.\n\n"So? Just shoot the old fart then!" The Condor Legion's point-man, Uruguayan and 21, was a blithering fascist idiot, but at least his aim was decent. "Give me a few weeks to scout out the parade route, Machado will never see it coming and most of the Venezuelan military won't either." Training a sniper team to attack the president in the open was maybe a bit too straightforward, but maybe that was all they needed.\n\n"Explosives could do the job just as well." The Condor Legion's commander, Colombian and 25, was even worse, talked big and liked to plan big. "Charges along the motorcade route can be hidden out of sight, take Machado out that way." Bombing the motorcade was likely to come with additional casualties, but had a much better chance at killing Machado outright.\n\nThe FBI Station Chief rolled his eyes, adjusted his glasses: "What about something up close, poison maybe?" He scratched his head. "Somebody on his staff we can lean on, put something in his food, maybe pull something during one of his hospital visits?" Machado was like a lot of leaders in that stress equaled health issues needing regular check ups. It was a bit old hat, but history showed that it could be done."
USA_VEN.39.a: "Train a sniper team to take Machado out."
USA_VEN.39.b: "Plant a bomb along the motorcade."
USA_VEN.39.c: "Have a third party that can get closer to him."

USA_VEN.40.t: "A View of the Terror"
USA_VEN.40.desc: "The afternoon sun beat down on the Plaza O'Leary as men of the Condor Legion's cell spied the surrounding area below, just as they had done almost every day across every rooftop they had access to and even a few they legally didn't. They kept a low profile in this process, taking in the view of the Plaza as they settled on a rooftop that offered overwatch, sharing beers while reviewing notes on nearby escape routes and Machado's itinerary, trying to key in the timing for the fatal shot they both knew was coming.\n\nThe FBI attaché scanning the Plaza below was tabulating the options available for the operation. Particularly, how to handle the most important part of the plan: The shooter. American intelligence was no stranger to political assassination and even less so to sharpshooter-based geopolitics, but the potential for this to backfire was far too real for Quantico's liking and preferred some assurances that it was going to go their way.\n\nRelying on Condor Legion to be the shooter was iffy at best, giving the FBI just enough believable distance to cover their rear. That said, all the cover in the world didn't mean much if the bullet missed its mark. There was the option of having the FBI supply one of their own professional shooters to be on the marquee for Machado operation, but while that yielded a better chance for the assassination to go through, there was very little wiggle room if things went bust, especially if it was one of their guys left holding the bag."
USA_VEN.40.a: "Set up one of the FBI's agents in the sniper's role."
USA_VEN.40.b: "Let Condor Legion do what they're here to do."

USA_VEN.41.t: "Pressure and Time"
USA_VEN.41.desc: "The car shop in Petare was a place of pride once upon a time, maybe it still was, just for different reasons. The owner had all but wept in pleading with Condor Legion about the true nature of his business, knowing full well that the many communist sympathizers in the area wouldn't be sympathetic to the local explosives workshop was in dealings with the infamous international "fascistas de mierda". The bribe that the Station Chief had provided to ensure his cooperation doubtless alleviated some of his fears.\n\nThe Condor Legion's plan had acquired the device for the upcoming operation; high-grade plastic explosive satchel charges, intermediate blast radius, enough to blow Machado's limousine sky high before the motorcade could realize. Placing the bomb under a traffic median would work well-enough to disguise the device from sight long enough for the motorcade to pass near it. This method was cleaner, but there was no pretending Machado was not the victim of a political assassination.\n\nThis was what informed the other option that came with it, one that had a heavy price attached. Planting the bomb on a fuel tanker carried via truck and arranging it to be in the motorcade's path would make it believably look like an accident, but would very likely put bystanders in the blast zone. It would give Washington and the FBI some cover, but how necessary is the loss of life for optics?"
USA_VEN.41.a: "The bomb will be rigged on the fuel truck, take no chances."
USA_VEN.41.b: "A precision bomb is enough, minimize the loss of life to Machado."

USA_VEN.42.t: "Care Most Urgent"
USA_VEN.42.desc: "Not all of the political establishment in Venezuela went the way of the Dodo when the reds took Caracas, even the most diehard communist can make a concession for a true believer in the cause. Failing that, they can make exceptions for someone loud enough, desperate enough or lucky enough to ride the tiger just long enough not get eaten themselves.\n\nThere's a young nurse at the private clinic that services Gustavo Machado regularly who can attest to this first hand, her father being a URD senator who dipped his flag for the FALN after the Revolution. All's fair in love and war, even in class war as it turns out. Maybe that's how his daughter got such a prestigious job, working in close proximity with the president, a perfect opportunity to slip something lethal into whatever cocktail Machado's doctors are mixing for him.\n\nIf her father's decision making was any indication, maybe the daughter could be brought around in a similar fashion. The assassination was geared to throw the establishment into turmoil as multiple figures in the FALN tried to fill Machado's shoes, the kind that would likely see class traitors like the senator targeted first by a lot of the hardliners during the chaos. Offering asylum in the US to the nurse and her family could mollify this fear, so long as she plays along.\n\nThat having been said, it might be worthwhile to play hardball. You can never know someone's commitment until they're put under pressure and for all we know the woman and her father are true believers in the FALN, this might require a heavy hand just to make sure. The reality of the 'threat posed' by the Condor Legion was something very different, but the idea of the threat they would pose for her family might be enough to frighten her into cooperating."
USA_VEN.42.a: "Convince her. If her father served democracy, she can too, and be rewarded for it."
USA_VEN.42.b: "Threaten her. If the reds don't get to her loved ones, the Condor Legion will..."

USA_VEN.43.t: "Gone in A Puff of Smoke"
USA_VEN.43.desc: "Agent Silverado Pérez took one gulp of the rum for himself, coughing as the cheap rotgut burned his throat. The rest of the bottle was being poured into a trashcan with a lifetime's worth of files. Every correspondence with the Condor Legion, every supply shipment, every complaint about the perennially malfunctioning toilet, all dumped into a can that had doubled as a barbecue pit just yesterday.\n\nMachado was dead, but that was only the beginning of the nightmare for Venezuela. During Machado's state funeral, a bomb placed in a trash can ripped through the assembled people. It was a small-yield bomb, but it had caused the crowd to surge forward. The poorly-trained paramilitary forces panicked, opening fire on the crowd with live weapons. Naturally, the people ran in an attempt to save themselves and trampled each other in an attempt to get away. Hundreds more perished, either from gunfire, from trampling, or just being in the wrong place at the wrong time. One man's death seemed to echo again and again.\n\nIn the halls of power, the Revolutionary Council turned on each other. Everyone and their mother was accused of soliciting foreign support: the Gringos, the Germans, the Japanese, the Mexicans, the Brazilians, it didn't matter. Emergency votes and demands for internal inquiries were flying freely in Caracas's capital, and the factions began mobilizing their street armies to protect their enclaves from rival attacks. Already, whispers of alliances and intrigue abounded as each sought to secure themselves in the chaotic aftermath.\n\n"Mission accomplished." Silverado braved one more quaff of the fiery brew, then tossed the bottle in the can. He took a match from the box, lit the rest still in their cardboard confines, then tossed the whole package in. Between the rum and the fuel already in the bottom, the evidence would burn quickly. Silverado turned away as the blaze spurted to life and looked forward to his next posting."
USA_VEN.43.a: "The FBI's fires burned, just one more fire in a country aflame, and the Condors swooped into the night."

USA_VEN.44.t: "Up In Smoke"
USA_VEN.44.desc: "Agent Silverado Pérez took another drink of the cheap rum, hoping that it would cure his headache. The damn fools in the Condor Legion had botched what was supposed to be a routine operation. The old bastard had survived, even had the strength to gloat about it the next day. He saw it on the television, with children waving red flags as he, leaning on the balcony to support him, proclaimed his survival as a testament to the tenacity of his revolutionary spirit. "Make no mistake, the gringos fear what we have done here. They fear a people's victory and will stop at nothing to silence it. That should embolden all of us to continue our path, to continue to see the gringos quake in the wake of the people's victory."\n\nPérez would have thrown a bomb at the smug bastard if he weren't surrounded by so many human shields. It was a mistake trusting those unprofessional pesky fascist teenagers. They had local connections that he lacked, but could do nothing with them. Incompetents, the lot of them, all they did was expose themselves and leave them open for an inevitable retaliation. Now they were being hunted, and Silverado knew it was only a matter of time before someone gave up American involvement. Few would actually believe it - Machado was already speaking about American involvement in everything from accidents at oil refineries to bad weather. The people who believed it would have already believed it; the people who didn't wouldn't trust a mere confession extracted after pulling a few molars.\n\nStill, the revolution had hardened itself in the wake of its first trial, a true baptism by fire. They could unite themselves in that they were attacked and survived. The mark of any true revolutionary movement was enduring the reactions that followed. That meant his time in Venezuela was at an end. With the Condor Legion being hunted on the streets, Silverado had an opportunity. By the time any hint of his agency would be murmured, he'd be long gone. Leave the failures to reap the consequences, and he would simply vanish into the night."
USA_VEN.44.a: "A lifetime to build, a moment to have it all slip away."

USA_VEN.45.t: "The Monterrey Protocol"
USA_VEN.45.desc: "It was stifling in the conference room of the "Gran Hotel Ancira" in Monterrey, even though the ceiling fans were running at their limit, slicing through the humid Mexican air. This location was chosen specifically: close enough to Texas to be convenient for the Americans, but far enough from Caracas not to taunt the Iberian hawks.\n\nEugenio Mendoza sat at the table with a straight back. He wore an impeccable light linen suit that distinguished him from everyone else in the room. He was a civilian to the bone - a philanthropist, a businessman, a man of numbers.\n\nOpposite sat the American delegation. They smiled at Mendoza. They knew his name, they knew his reputation. With him, one could speak of dividends and charitable foundations. But their eyes kept sliding to the space behind Mendoza.\n\nThere, against the wall, sat the generals. Throughout the entire meeting, they did not utter a single word. Their uniforms were buttoned to the top, despite the heat. The Military Depoliticization Act had been signed just a week ago; the ink on it was fresh, but confidence in it was even thinner than the paper itself. The Americans saw hope in Mendoza, but in the generals, they saw a threat.\n\nThe "Monterrey Protocol" lying on the table was a masterpiece of diplomatic minimalism. No loud words about an "eternal alliance." No military bases. Just dry points: supply guarantees, technical maintenance of pipelines, sharing of "low-level" intelligence. It was a document that could be hidden in a desk drawer if Iberia started asking questions.\n\nMendoza unscrewed the cap of his pen, recalling the rule he had derived while building the "Vencemos" empire: the strongest cement takes a long time to cure. In 1958, when he was part of the Junta, they tried to build democracy too quickly, and the structure cracked."
USA_VEN.45.a: "Now, he did not intend to repeat that mistake."
USA_VEN.45.tt: "§!The [USA.GetFlag] §bUnited States§! will only be able to claim [VEN.GetFlag] §SCaracas§! if [IBR.GetFlag] §OMad§!§nrid§! §Rloses its foothold§! in the [COL.GetFlag] §fNorthern Andes§! and we regain our rightful place as the region's hegemon.\n\nFor now, though, relations with the [VEN.GetFlag] §SVenezuelan government§! will remain §Gopen§!."

USA_VEN.46.t: "A Week In Caracas"
USA_VEN.46.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM KEVIN RAWLINGS\nMEMORANDUM FOR THE U.S DEPARTMENT OF STATE\n\nSUBJECT: OVERTHROW OF VENEZUELAN GOVERNMENT BY GENERAL JESÚS MARÍA CASTRO LEÓNn\n\nFollowing an election that resulted in a left-wing government being put in power, self-exiled former Venezuelan Air Force General Jesús María Castro León has overthrown the government in the so-called "Easter Coup". Rallying barracks to his cause, he was able to quickly march to Caracas from the Colombian border while taking minimal casualties. Upon taking control, Castro León announced a policy called the "Five National Points," focused on reconstruction of Venezuela after recent turmoil and the creation of a constitution that gives the military more power.\n\nDespite these lofty goals, contacts within the new government have reported that General Castro León is in ill health, and has been delegating more and more duties to Eugenio Mendoza, a business tycoon, and Colonel Moncada Vidal, the minister of internal affairs and Castro León's military protégé. The coup marks a change in Venezuelan foreign policy, with a harsh shift from the Veracruz Pact to the Iberian Union's sphere of influence. Most consequential is Castro León's reluctant anti-American beliefs. Due to his ailing health, contacts recommend getting in touch with Mendoza, a more moderate figure in the government."
USA_VEN.46.a: "Fidelity, Bravery, Integrity"

USA_VEN.47.t: "A Pleasure, Mr. Mendoza"
USA_VEN.47.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM GEOFFREY MACFAYDEN\nMEMORANDUM FOR THE U.S DEPARTMENT OF STATE\n\nSUBJECT: COMPLETION OF THE "FIVE NATIONAL POINTS" IN VENEZUELA, MENDOZA TAKES POWER\n\nJesús María Castro León has announced in an address in Caracas that the "Five National Points" have been completed and that he will be retiring before the end of the year. Contacts in the government speculate either his rapidly failing health or a genuine commitment to the government. The address was met with mostly positive press, although this may have been because of press censorship.\n\nTaking leadership is the National Governing Board, a body of the nation's most important families, tycoons and technocrats, which is watched closely by the military. The leader of the board is the richest man in Venezuela and a reluctant associate of Castro León, Eugenio Mendoza. A philanthropist and believer in the social responsibilities of businesses, contacts within the government have said that Mendoza is preparing the nation for democratization, only accepting Castro León's proposal to prevent a more radical alternative from taking power and secure a stable future for Venezuela and her people.\n\nThis process has only received tepid support from the board members, with Pedro Tinoco being the leader of the opposition. The military also remains in fierce opposition to the process. Considering the current situation in Venezuela, Mendoza is the best option for American interests, especially when considering the radical Bolivarianists represented by Moncada Vidal."
USA_VEN.47.a: "Fidelity, Bravery, Integrity"

USA_VEN.48.t: "Democracy Returns to Venezuela"
USA_VEN.48.desc: "NATIONAL INTELLIGENCE ESTIMATE\nTHE PROBLEM\n\nVenezuela's long period of chaos is over, and it has reemerged as a democratic society, an American ally, and a place to do business. Eugenio Mendoza has successfully fended off threats from within the National Governing Board and the Army to enact his reformist agenda. Elections are set for 1970, which merits monitoring to ensure this newfound stability persists.\n\nConclusions\n\n1- Eugenio Mendoza took power in the wake of a period of political turmoil at the head of the National Governing Board, an assembly of Venezuela's most powerful oligarchs with, initially, heavy influence from the Armed Forces, united by a desire to secure their interests by any means necessary. Mendoza cut an unusual figure among this group, as its most powerful member and a liberal democrat. The Board immediately set about stabilizing Venezuela, largely by stamping out political violence with state power.\n\n2- Mendoza faced opposition from two powerful groups: The so-called "desarrollistas", led by board member and magnate Pedro Tinoco, who advocated maintaining emergency powers indefinitely and enriching themselves via state corruption, and two dissident factions within the military: the Bolivarianists led by Colonel Moncada Vidal and the Perezjimenistas, primarily led by Luis Felipe Llovera Páez. Mendoza crippled the former with corruption investigations and deftly purged the latter. With his position secure, Mendoza declared the Board's purpose fulfilled and a restoration of democracy necessary.\n\n3- Mendoza has ensured Venezuela will remain in our orbit. His actions have ensured the country will remain our strongest ally in the Caribbean, but also a stable and prosperous nation with a democratic future. Yet a nascent democracy is a playground for radicals and malcontents. We must remain vigilant."
USA_VEN.48.a: "Fidelity, Bravery, Integrity"

USA_VEN.49.t: "The Board Reigns in Venezuela"
USA_VEN.49.desc: "NATIONAL INTELLIGENCE ESTIMATE\n\nTHE PROBLEM\n\nVenezuela has left behind both the recent catastrophes and its tentative democratic tradition. The National Governing Board, composed of the country's most prominent oligarchs, has ousted its liberal head, Eugenio Mendoza, in favor of the dictatorial Pedro Tinoco. Tinoco will return Venezuela to democracy, however elections will be tightly controlled and vested interests' power never to be relinquished.\n\nConclusions\n\n1- Using the connections gained during his period running an elite Caracas law firm, Pedro Tinoco attained a position as Managing Director of the Banco Mercantil, solidifying himself among the capital's elite. Tinoco began his political career under the dictatorship of Juan Gómez, and it was then that he began building up the basis for what would be his faction.\n\n2- Pedro Tinoco leads the "Desarrollista" faction, which advocates primarily for maintaining corporate oligarchy, strident anti-Communism, and developmentalist policies to be fueled by the country's massive oil wealth. Opposed to Mendoza's democratic instincts from the very start, Tinoco undermined him everywhere, but especially in his efforts to curb his faction's corruption. The Desarrollistas resistance paid off, forcing Mendoza to retire, and exalting Tinoco in his place.\n\n3-Tinoco is a banker at heart and is primarily concerned with preserving his and his allies' wealth. He will implement a nominal democracy under his new party, Integración Republicana, and hold perfucntory, rigged elections. Nevertheless, Tinoco shall prevent the country from slipping into the control of anti-American radicals."
USA_VEN.49.a: "Fidelity, Bravery, Integrity"

USA_VEN.50.t: "Little Hitler Across The Pond"
USA_VEN.50.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM FBI DIRECTOR J.EDGAR HOOVER\nMEMORANDUM FOR THE U.S DEPARTMENT OF STATE\n\nSUBJECT: COLONEL JUAN DE DIOS MONCADA VIDAL SUCCEEDS CASTRO LEÓN IN VENEZUELA\n\nFollowing the retirement of Castro León, close confidant and protégé Colonel Juan de Dios Moncada Vidal has succeeded him as president of Venezuela. Moncada Vidal is quite possibly the most anti-American figure in Venezuela and the worst possible outcome for our interests. Speeches and memoirs transcribed by contacts in the country reveal extreme nationalism and plans to expel American firms. Throughout his rise to power he has used violence extensively against his enemies, and it should be expected that he will use the same violence against American influence.\n\nHis faction of the military, calling itself the Bolivarianists, is an awkward blend of Julianos, soldiers inspired by the communist Porteñazo rebellion, Falangists, including members of the "Hitlerite Battalion," and his personalist followers, who are extremely ideological, creating a unique rabidly nationalist fascist militarist ideology following a cult of personality around Venezuela's independence hero, Simón Bolívar. This mix of left and right politics have been united in their xenophobia, promises of national renewal as shown in the Five National Points, and anti-imperialist attitudes.\n\nDespite his leftist support, he has been brutal in his repression of the domestic communist movement of Fuerzas Armadas de Liberación Nacional, leaving a weakened but radicalized core. With the FALN also staunchly anti-American, the best bet for returning American influence to Venezuela lies with the exiles who have fled to Mexico and the Sun Belt."
USA_VEN.50.a: "Fidelity, Bravery, Integrity"

USA_VEN.51.t: "Fascism in Venezuela"
USA_VEN.51.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM FBI DIRECTOR J.EDGAR HOOVER\nMEMORANDUM FOR THE U.S DEPARTMENT OF STATE\n\nThe Republic of Venezuela, once one of our staunchest allies in Latin America, has transformed into a pernicious foe. Colonel Juan de Dios Moncada Vidal, a man who cuts a sinister and erratic figure, has led a coup reforming Venezuela into a Fascist dictatorship. The press has been prohibited from speaking out against the military regime, with disobedient opposition presses put to the torch, and countless others cowed into becoming regime mouthpieces. All parties besides the Colonel's own Bolivarian Military Civic Union have been outlawed.\n\nColonel Moncada Vidal has headlined his ambitious political program with the declaration of a "Bolivarian Republic", a gesture rife with implications of Simón Bolívar's Gran Colombia that stretched from Ecuador to Essequibo. The move has dovetailed with the Colonel's dictatorial persona, loudly evocative of Bolívar. The Colonel has compared his own program of nationalization, militarization, and belligerence with the exploits of the eponymous General, and regime propaganda lauds him as a reincarnation of El Libertador.\n\nAlready, we have felt the consequences of the takeover: Americans in the country are harried by mobs, exiles have flooded our shores and newspaper columns, and oil and gold assets owned by American corporations have been seized and placed under the direct control of the military. Any response must be undertaken carefully, as the Colonel has launched a massive militarization campaign that has conscripted thousands of new soldiers, clear preparation for a possible intervention.\n\nYet, fissures within the regime and threats from outside manifest: Colonel Moncada Vidal's lieutenant, Hurtado Barrios, has flown his superior's coop and taken up with the leftist Julianos. Dissident forces within the country, the largest being the Communist FALN, have begun arming themselves. We can only hope they can do what we may be unable to."
USA_VEN.51.a: "Fidelity, Bravery, Integrity"

USA_VEN.52.t: "Pérez Jiménez Returns to Venezuela"
USA_VEN.52.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM FBI DIRECTOR J.EDGAR HOOVER\nMEMORANDUM FOR THE U.S DEPARTMENT OF STATE\n\nA transitional government has been declared by a military clique, led by Venezuela's former Caudillo, Marcos Pérez Jiménez. The new government has legitimacy, broad support, and a clear vision for the country, but the former dictator's predilections remain as worrying as they were in the 50s.\n\nCONCLUSIONS\n\n1-Marcos Jiménez was overthrown by Wolfgang Lazarrábal in 1958 for a variety of reasons, and, despite his regime being overall in our favor, we did next to nothing to prevent the coup. Pérez Jiménez had opened up the country to foreign investment, not only to our corporations, but to those closely tied to Fascist states as well. Pérez Jiménez clearly emulated these regimes in many ways, especially in his repressive methods in dealing with Communist rebels. He maintained a close relationship with Juan Domingo Perón in Argentina and attempted to craft a similar persona.\n\n2-Following his overthrow, Pérez Jiménez went into exile in the Dominican Republic and subsequently Iberia, where he, by all accounts, only became more rabidly anti-Communist, telling associates that he would "do what he did before, only tenfold". Directed by his secret police chief, Pedro Estrada, curfews, torture, public executions, and military occupation have already returned in force.\n\n3-Jiménez's more positive policies are also echoes of his previous administration. We can expect him to implement the same New Deal-inspired, Keynesian policies as before. His primary focus appears to be infrastructure megaprojects like hydroelectric dams and highways. We recommend aiding him in his constructive measures and offering some aid in his anti-Communist crackdowns. We must make him dependent on our aid and our aid alone."
USA_VEN.52.a: "Fidelity, Bravery, Integrity."

USA_VEN.53.t: "Another Pérez Jiménez In Venezuela"
USA_VEN.53.desc: "NATIONAL INTELLIGENCE ESTIMATE\n\nTHE PROBLEM\n\nAn attempt to restore Marcos Pérez Jiménez to power in Venezuela ended with him comatose, soon to be dead, and the nation in chaos. His daughter, Margot, has emerged out of the power vacuum as a puppet for the powerful secret police chief Pedro Estrada. The situation is unstable and subject to change.\n\nConclusions\n\n1-Marcos Jiménez's attempt to retake power has ended in failure. While it is true that Jiménez acted against our interests in many ways, he nevertheless ensured stability. His daughter is a political nonentity, a puppet installed by regime elites, namely the Security Minister Pedro Estrada and General Laureano Vallenilla Planchart. Both men are ardent anti-Communists who have used extreme methods to eradicate the left from Venezuelan society.\n\n2-The power bid by General Luis Llovera Páez, one of Jiménez's closest confidants and the obvious choice for a successor, was halted by Jiménez's death and the elevation of Margot. According to our sources, Páez believed that Jiménez would recover and therefore made none of the necessary steps to secure support within the ruling FEI party. We cannot discount the possibility that Jiménez was murdered not by the assassin's bullet, but by Margot's puppeteers. They stood to gain, and given Estrada's control over the hospitalized President, certainly had the opportunity.\n\n3-The situation is changing as we speak. Forces within and outside the government are making moves; The countryside is aflame as the rebels take advantage of the chaos, and the new regime brutally counters them. The country is on the brink of Civil War. We must prepare for the worst."
USA_VEN.53.a: "Fidelity, Bravery, Integrity"


USA_VEN.54.a: ""

USA_VEN.55.t: "Bolivarian Countercoup in Venezuela"
USA_VEN.55.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM FBI DIRECTOR J.EDGAR HOOVER\nMEMORANDUM FOR THE U.S DEPARTMENT OF STATE\n\nSUBJECT: NATIONAL INTELLIGENCE ESTIMATE ON VENEZUELAN SITUATION\n\nWhile the outcome of Venezuela's recent coup may seem desirable on the surface, in reality, little has changed beyond the abeyance of outward aggression. The new regime has signaled hostility towards our government and has publicly refused to return our confiscated assets.\n\nConclusions\n\n1-'The Dance of the Dogs,' as Caracas' top paper called it, is over. The regime of Colonel Moncada Vidal, by severing ties with us, set off a chain of events it could not control, which rocked the foundations of the Venezuelan economy and led to a surge of anti-state rebel activity. The dictatorship had no internal cohesion, with the Colonel's cabinet containing fractious personalities who constantly butted heads over trivialities. This led Hurtado Barrios, the Colonel's closest ally, to seek allies among the leftists in the military, namely Jesús Mollina Villegas and Pedro Medina Silva, to restore order.\n\n2-Incensed by the chaos and increasingly despondent at Colonel Moncada Vidal's ability to fight it, Hurtado Barrios and his allies gathered forces and swiftly moved against the Colonel, overthrowing his regime and executing him. The new regime retains "Bolivarian" principles as a unifying ideology. Barrios has also proclaimed himself a Socialist, and many leftist guerrillas and exiles have reconciled with the new regime, though skepticism and resistance remain.\n\n3-Nicolás Hurtado Barrios remains staunchly opposed to American interests in Latin America. It is advisable that we treat his government as a continuation of Colonel Moncada Vidal's dictatorship, and continue to aid Liberal Democratic forces within the country."
USA_VEN.55.a: "Fidelity, Bravery, Integrity"

USA_VEN.56.t: "The Morning Editorial of "El Universal""
USA_VEN.56.desc: "NEW HORIZON: WASHINGTON AND CARACAS SIGN "STABILITY PACT"\nMinister Martín Vegas: "The Era of Uncertainty is Behind Us"\n\n"...Yesterday at 11:00 PM, following a marathon of negotiations, the government officially announced the full normalization of relations with the United States. The agreement, which Minister of Foreign Affairs Vegas has already dubbed a 'return to hemispheric normalcy,' provides for the immediate opening of credit lines and security guarantees for our tankers in the Caribbean Sea.\n\nAnalysts note that the decisive factor was the recent 'pacification' of Colombia. With the end of the civil war on our borders, trade routes to the North are free once again, and Washington has unequivocally demonstrated who holds the keys to the Caribbean Basin.\n\nIn the corridors of Miraflores Palace, it is reported that the tone of the negotiations was strictly business. In the face of the looming global oil storm, Venezuela is choosing the most reliable home port. As a source close to President Tinoco remarked: 'We look at the map, and all arrows point North. To ignore this is to deny the fact that the Earth is round.'""
USA_VEN.56.a: "Vegas overdid it with the pathos, but the essence is correct."
USA_VEN.56.tt: "§!With our §Grecent victories§! in the Americas and the fading presence of [IBR.GetFlag] §OIbe§!§nria§! in the region, their [VEN.GetFlag] §SVenezuelan§! partners have deemed it §Rnecessary§! to return to their rightful place, [USA.GetFlag] §munder the Eagle's wing§!.§!\n§F------------------------------------"

USA_VEN.57.t: "Valores Humanos"
USA_VEN.57.desc: "The familiar strains of the piano - Johann Sebastian Bach's "Jesu, Joy of Man's Desiring" - floated from television speakers across the country. This melody meant one thing: it was time to learn.\n\nThe familiar, ascetic image appeared on the screens: a writing desk, an "Electro-Voice" microphone, and a massive silhouette of Venezuela carved from dark wood on the wall. It loomed over Arturo Uslar Pietri like a silent judge.\n\nThe President sat motionless, hands clasped over a volume in a worn binding. He was not looking at the camera. He was staring into the void, as if seeing things inaccessible to the lens. "One hundred years ago," he began quietly, "on the other side of the earth, there existed an empire that decided to stop time. They closed their ports. They banned foreign books. They believed their katana - the soul of the samurai - was stronger than any machine."\n\nPietri finally raised his eyes. In the glare of the studio spotlights, his glasses glinted with cold steel. "And then the 'Black Ships' entered their harbor. Huge, smoking monsters of metal. And the proud empire realized a terrible truth: to save one's soul, one must learn to pilot the dragon's body. One cannot defeat a steam engine with verses about cherry blossoms."\n\nHe slowly turned to the map behind his back. His shadow fell across the Orinoco Delta. "Some say that letting in foreign capital is dangerous," Pietri turned and looked straight into the lens, as if peering into the soul of every viewer. "But was Peter the Great afraid of Dutch carpenters? Did he become less Russian when he built a fleet according to London's blueprints? No. And we, Venezuelans, face the same choice. We can sit proudly in the dark, or we can take the torch from the giant to light our own home."\n\nHe smiled. "Do not be afraid to learn from the strong. Be afraid of remaining weak. Until next time on 'Valores Humanos'.""
USA_VEN.57.a: "What is he hinting at?"

USA_VEN.58.t: "Toast in the Hall of Mirrors"
USA_VEN.58.desc: "A bottle of "Grand Old Parr" whisky - squat and dark glass - stood on a low lacquered rosewood table. This whisky had been the unofficial currency of the Venezuelan elite since the 50s, and now Jóvito Villalba generously splashed the amber liquid into two massive tumblers.\n\nThe atmosphere in the Hall of Mirrors at Miraflores Palace was that of a meeting between old buddies. President Villalba was in his element. He paced the carpet, gesturing energetically with an unlit cigar.\n\n"Leave that nonsense about 'imperialism' for the students on campus, Bob!" laughed Villalba, addressing US Ambassador Robert McClintock. "We live in the real world. As those Castro León and those who followed im demonstrated with the Easter Coup, democracy can't be just pretty words in the Constitution. It's working factories, full shelves, and, damn it, it's security!"\n\nMcClintock, sitting in his armchair with the relaxed confidence of a man backed by the Sixth Fleet, smiled. He liked Villalba. With this man, there was no need to play spy games. He wanted the same thing Washington did: to turn Venezuela into a showcase of the Western way of life in Latin America.\n\n"Washington appreciates your enthusiasm, Mr. President," the ambassador said, adjusting his cufflink. "President [USA.GetPresidentLastName] believes that Caracas must become an anchor of stability. And we are ready to gild that anchor."\n\n"Precisely." Villalba finally struck a match. "We give you the energy to keep your world spinning. You give us the shield to keep our world from collapsing. It's a fair deal."\n\nHe raised his glass. The light of the massive crystal chandelier played in the facets of the glass.\n\n"To partnership, Bob. Tell the White House: as long as we are here, Uncle Sam will always have a full tank and an open door. We are one family, and relatives must stick together.""
USA_VEN.58.a: "The Stars and Stripes goes perfectly with the Venezuelan tricolor."

USA_VEN.59.t: "The Shop Windows of Fifth Avenue"
USA_VEN.59.desc: "Dinner in the family dining room of the "La Casona" residence was coming to an end. For dessert, bienmesabe was served - a coconut cake Marcos loved but rarely ate, watching his figure. Today, he allowed himself an extra slice.\n\nThe atmosphere at the table was lively, quite unlike state receptions. "Daddy, so what about Saks?" Margot, the eldest daughter, who had recently turned twenty-four, tapped a manicured finger impatiently on the tablecloth. "The new catalog arrived a week ago, but Mom still isn't in the mood to look at it."\n\nPérez Jiménez wiped his lips with a napkin and leaned back in his chair, unbuttoning his jacket, tailored in Madrid. "You can look," he answered lazily. "And not just at the catalog."\n\nDoña Flor María, slicing the dessert with a silver fork, raised her eyebrows. "Was McClintock amenable?"\n\n"McClintock was ready to lick the parquet floor, Flor," Marcos chuckled. "They unfroze the accounts. All the accounts. The one at Chase Manhattan, and the trust fund in Florida."\n\nFlorángel, the middle daughter, squealed with joy: "Does that mean we can go back to the house on Pine Tree Drive? I left my record collection there!"\n\n"You can fly to Miami, to New York, even to Disneyland," Pérez Jiménez swept his gaze over his women. "The Americans have given us, let's say... a 'platinum loyalty card.' They need my oil so badly that they are ready to turn a blind eye to anything. Want new fur coats? Buy them. Want to update the fleet? Order those Cadillacs you saw in the magazine."\n\n"But, daddy, what about the 'crimes of the regime'?" asked the second youngest, María Sol, sarcastically mimicking the intonation of American newscasters.\n\nMarcos laughed - a rare, barking laugh, startling the youngest, Flor de María, named after her mother. "Well, darling. In Washington these days, crimes are forgiven if they are paid for with high-quality oil. So, Flor, book the tickets. I think it would be good for you all to get some fresh air and go shopping.""
USA_VEN.59.a: "On Uncle Sam's dime, of course."

USA_VEN.60.t: "Merry, Goes Around"
USA_VEN.60.desc: "CONFIDENTIAL/[GetDateText]\n\nFROM THE VENEZUELA OFFICE OF THE FBI\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: MILITARY COUP IN VENEZUELA\n\n1. Under the stated goal of ensuring national security in the face of the threat posed by the Fuerzas Armadas de Liberación Nacional, a rogue military faction has seized power in Venezuela in a bloodless coup. At the time of writing, all executive authority has been relinquished without any resistance from the now-deposed civilian administration and subsequently transferred to a provisional officer's junta helmed by General Pablo Antonio Flores.\n\n2. With the former government having lost any public legitimacy it had retained after its disastrous response to the current civil war, it is expected that Antonio Flores' clique will remain in power for the foreseeable future. While far from an ideal outcome, an entrenched military regime should be regarded as a preferable alternative to any prospect of the communist guerrillas seizing lasting power over the country, as the latter case would assuredly lead to a complete severance of any diplomatic or commercial ties we may hope to maintain within Venezuela.\n\n3. Accordingly, and despite the heightened hazard to the public perception of our ongoing operations in Latin America, we strongly urge our administration to offer the necessary resources and support for their continuation until the FALN threat is dealt with. Furthermore, it is believed Antonio Flores' junta could prove amenable to our position, and providing them with the breathing room to properly focus their efforts on the rebels could be just what they need to finally stabilize the situation in the fractured state..."
USA_VEN.60.a: "...starting with a public diplomatic overture to help them solidify their leadership."
USA_VEN.60.b: "...as long as our logistical support remains covert and away from official channels."
USA_VEN.60.c: "...but we trust them to handle it more than adequately without our direct interference."

USA_VEN.68.t: "Marionette"
USA_VEN.68.desc: "Hundreds of miles from the leftover rubble and strained bureaucracy in Caracas, the powers that be in Venezuela prepared to hand back power to its native people. One end of a Pentagon conference room sat Enrique Tejera París and his soon-to-be cabinet, all that was left of the governing class after a bloody coup, a brutal dictatorship, a devastating civil war, and now, a global financial crisis threatening to tear down what remained. On the other sat a row of mostly American OFN generals, with President [GetPresidentLastName] sitting at their head.\n\nThe leader of the OAS intervention himself, Rathvon Tompkins, spoke first in a gravelly voice. "Alright, Dr. París. Recent political and economic developments have caused us to expedite the nation-building process in Venezuela. Direct military administration is costing us forty million a week - this is unacceptable. We aim to formally announce the return to civilian governance shortly after this meeting. We have here a list of terms for your new government; you are welcome to make suggestions as you see fit."\n\nTejera París nodded along - not that anything he could have said would matter, of course. The Americans already controlled their true prize - the gushing black rivers that were just about the most coveted thing in the world at the moment. With the economic downturn at home and military conflicts raging abroad, the costs of running the mandate directly were just weighing Washington down.\n\nTompkins pulled out a briefing and began reading. "Memorandum on the Transitional Period. Item 4, Paragraph B. OFN membership and continued OAS security presence. Uninhibited access to the Venezuelan oil trade. American oversight of political and security decisions..."\n\nHe droned on and on, but the point got through to Tejera París - despite the return of Venezuelans to their government, the Americans would still be the ones running the show. This was the only option, or else the Americans would surely be able to find someone less... scrupulous. No, all he could do now was agree to the American terms and prepare to be paraded about his own nation like a puppet on strings."
USA_VEN.68.a: "He mustered a smile, and gave his assent."
USA_VEN.68.tt: "([VEN.GetFlag] §YVenezuela§!)Though the occupation ends, with Dr. §YEnrique Tejera París§! rising to the seat of §YPresident of Venezuela§!, §SVenezuela§! will remain an American protectorate for many years to come."

USA_VEN.69.t: "Executive Report: The Venezuelan Interim Government"
USA_VEN.69.desc: "Director Hoover:\n\nThe OAS peacekeeping mission, including all troops stationed in Caracas and the Guyanese border region, has formed an interim government after the Venezuelan Civil War. Low-level insurgencies are active across both major cities and rural areas. Most of which are local fiefs operated by the old regime's commandants and caudillos. The administration is focused on re-establishing order in urban regions to construct the bureaucratic apparatus necessary for a planned post-transition election.\n\nThe former Venezuelan government's destruction has led to an increase in partisanship. Such a shift has since enabled a few pro-American contacts to gain political credibility. As a result of this newly formed network, future stabilization efforts, such as post-transition legislative actions, will have no significant opposition. However, many of them lack the capital to lobby without steady American funding, which limits their adherence to our doctrine by our capacity to afford their expenses. Similarly, many caudillos may also require such low-return investments to relinquish their fiefdoms for municipal governance.\n\nAlthough there is a significant prospect of creating a functional nation from Venezuela's remains, it is, by and large, reliant on our willingness to support its unprofitable enterprise. If we opt to quell the states' decentralization with monthly payouts, our method might also create high levels of corruption. The reforms required to rectify such will cost about the same to implement. Unfortunately, without making Venezuela indebted to us, it is impossible for the OAS to patch up a junior partner out of the failed state."
USA_VEN.69.a: "In short, we made this problem for ourselves."

### Mexico Events

MEX_VEN.1.t: "The Barons Arrive"
MEX_VEN.1.desc: "Those people comprising the business community of Caracas were very familiar with the arrivals lounge of the Maiquetía International Airport. The quality of the coffee stand, the lumpy seats and, above all, the faces of the other members that they recognized.\n\nAnd so when the large party of new arrivals de-planed, off of the direct flight from Mexico City, they were immediately noticed. As was the high quality of their suits, their similar body language, and the rapidity with which local handlers from the Mexican embassy met them and directed them to waiting cars.\n\nFrom those who had been close enough to the group to overhear, it was reported that the group was from Pemex, the Mexican state oil conglomerate, and were here to discuss contracts regarding oil exploitation with government officials. With great disappointment, however, none of the community were able to hear any of the group's negotiation strategies - which would have been immediately exploited.\n\nStill, to those who heard it first, it was a small advantage, and they rushed to leverage it. Who knew what arrangement Pemex would come to with the government?"
MEX_VEN.1.a: "What, indeed?"

MEX_VEN.2.t: "Viva Nuestra Amistad"
MEX_VEN.2.desc: ""Our countries' friendship shall...shall...shoot", Larrazábal sighed as he struggled to remember his words. Though the man always was one for speeches, already used to being received with thunderous and deafening applause, it didn't help that on this occasion, he would be giving a speech not in Caracas but instead to thousands of Mexicans in Veracruz's Zócalo. It was López Mateos' idea, and considering the circumstances, he felt compelled to go. Suddenly, from the corner of his eye, Larrazábal spotted his Mexican counterpart, and received a hearty greeting. "Señor Presidente," López Mateos extended his arm, and both men shook hands. "How are you feeling?"\n\n"Not great, if I'm being honest," Larrazábal admitted.\n\n"Don't worry about it, Wolfgang," replied López Mateos. "Just hit them with the classics - death to the fascists, death to the imperialists, eternal Venezuelan-Mexican friendship yadayadayada, they'll be eating out of your hand". López Mateos guided them up to the balcony from which they would be giving their speeches. The Mexican President instinctively grabbed the Admiral's hand and raised it into the air. The crowd roared, and the Mexican began his speech. After about ten minutes, López Mateos finished and gestured for Larrazábal to take the microphone.\n\nFor a moment, the Admiral stared blankly, as the crowd in front of him stirred in anticipation. 'Oh, what the hell, forget the speech', he thought to himself, 'just speak as you usually do.' Larrazábal then cleared his throat and spoke softly into the microphone. "My friends, my compatriots. God bless all of you, and God bless Mexico!" The crowd cheered. Larrazábal continued for a few more minutes, praising the anti-imperialist brotherhood between Venezuela and Mexico and tying themselves together economically. Just like back home, the crowd was enamored by his folksy charm, and the crowd gave Larrazábal a grandiose applause as he finished his speech. "See?" López Mateo whispered into his ear as they left the balcony "Everything went great.""
MEX_VEN.2.a: ""You're among friends here.""

MEX_VEN.3.t: "Constant Rebranding"
MEX_VEN.3.desc: "For the small crew of the ARV Los Monjes T-13, the orders of their few officers made little sense. They were used to joking about the origins of their ship, formerly the USS LSM-548 and sold as military surplus, but were less used to the cargoes they were now loading.\n\nTo the Venezuelan sailors, the stacks of crated weaponry that had arrived from Mexico were of great interest, and they had spoken with elation at potentially getting to try them out. But that had not happened, and they had further been told, in the strongest terms, that they were to tell nobody about either the crates or their shipment of them.\n\nThey were careful to do just that - knowing that the watchful eyes of the officers were upon them - but they took every opportunity to speculate on what the weapons were to be used for. The most confusing thing was their destination - Santiago de Cuba. The Cubans could get weapons far more easily and directly than by shipping them from Mexico through Venezuela. And with the increased Caribbean activity over the past few weeks, it made even less sense. Why all this secrecy?\n\nThe sailors couldn't come to a conclusion, but they knew that whoever got the weapons would make good use of them. And as they finalized preparations and ran to carry out the lieutenant's orders, the questions seemed less important than avoiding punishment."
MEX_VEN.3.a: "A present - for someone at least."

MEX_VEN.4.t: "Threat To Venezuelan Democracy"
MEX_VEN.4.desc: "DIRECCIÓN FEDERAL DE SEGURIDAD\n\nISSUE: Dominican intelligence activity near Colombia's border with Venezuela accompanies military buildup.\n\nSources in Colombia coming from URC guerrilleros report the presence of rogue Venezuelan forces in Bucamaranga, Cúcuta, and Villa Rosaria, border cities near San Cristóbal, Venezuela. Accompanying this is a spike in activity by Dominican SIM operatives in the area, cooperating with the insurgents in their struggle against the elected government of Venezuela.\n\nTheir activity has gone unnoticed due to a breakdown of communication along the border amidst Colombia's civil war. The DFS will continue to diligently monitor the actions of the SIM to ascertain their next steps.\n\nIt is strongly recommended that the Venezuelan government is made aware of the situation if an advance response is to succeed.\n\nVery Respectfully,\nRegional Director of Security\nColonel Emilio Torres"
MEX_VEN.4.a: "Troubling developments to our south."

MEX_VEN.5.t: "Plots Uncovered"
MEX_VEN.5.desc: "DIRECCIÓN FEDERAL DE SEGURIDAD\n\nISSUE: Dissident officers inside Venezuelan military plot rebellion with foreign backing.\n\nThe recent socialist victory in Venezuela's national elections has invigorated the subversive, right-wing sector of the Venezuelan military. According to various sources within the army, an armed insurrection is imminent. The scale, timetable, and details of such an event are still unknown.\n\nPossible targets include the seat of power in Caracas and the various air bases and key points of entry around the country, which could put the putschists in control in a matter of hours. Some reports indicate that renegade officers in exile may also be planning an incursion through neighboring Colombia.\n\nThere is credible evidence of involvement by both Argentine and Dominican intelligence. In supporting a potential coup they seek Venezuela's political re-alignment, away from Mexico and the Veracruz Pact. The loss of Venezuela would constitute a defeat for Veracruz only comparable to losing Cuba, or Mexico itself.\n\nIt is paramount that Mexico provides the utmost support to the Venezuelan government as it confronts the subversives' next steps.\n\nVery Respectfully,\nRegional Director of Security\nColonel Emilio Torres"
MEX_VEN.5.a: "Caracas has our back."

MEX_VEN.6.t: "All Quiet in Maracaibo"
MEX_VEN.6.desc: "The Venezuelan DIGEPOL intelligence camp outside Maracaibo reeked of sweat, ink, and an anxious desperation. Venezuelan officers leaned over maps with their Mexican SNI counterparts, their eyes tracing over a faint line from Colombia's border straight into San Cristóbal.\n\n"Villa de Rosario... Cúcuta... Bucaramanga..." the SNI agent muttered under his breath, underlining each name on the map with a worn-out pen. "All roads point straight to Maracaibo. This is how they're getting their information."\n\nThe Venezuelan officers soured, exchanging grim looks with each other. They had already suspected San Cristóbal to be the first domino in a coming coup by dissident officers. And Maracaibo seemed to be the second domino.\n\nA folder slid across the table, grainy photos fanning across to show shady couriers hopping the Colombian border on their way to Maracaibo. No doubt they were the ones coordinating and masterminding the coup's follow-up after San Cristóbal.\n\nThe Mexican agent took out his knife, slamming it downwards onto the map. "This is one of their main arteries. Blockade Maracaibo. Shore up the border patrols. Maybe shoot some of those pests running around the countryside." He looked back at the Venezuelan officers. "And after that, my friends, there'll be nothing left of the coup, nothing after San Cristóbal."\n\nThe camp fell silent. Although they didn't know it yet, the decision at the Maracaibo camp would not only ripple across Venezuela but also light the fires of a new friendship between two nations."
MEX_VEN.6.a: "Veracruz never leaves her allies."

MEX_VEN.7.t: "Eye of the Storm"
MEX_VEN.7.desc: "The blue-grey smoke from Fidel Castro's Cohiba floated under the ceiling of the office in Miraflores like a storm cloud. The Cuban leader stood by the window, gazing at the lights of Caracas, but his eyes reflected another city-the one boiling with rapture in January of '59.\n\n"Do you remember Plaza O'Leary, Fabricio?" Castro's voice sounded unusually quiet, almost intimate. "Do you remember that sea of people? You introduced me to the crowd as a brother back then. And when I, foolishly, mentioned Betancourt's name, they booed him so hard my ears popped." Fidel turned, steel flashing in his gaze. "Your people knew who their enemy was even back then. They waited for a revolution, but got a compromise. Do not repeat this mistake."\n\nOjeda wearily rubbed his temples. The memory burned him: back then he was a hero who toppled a dictator, and now he felt like a cornered beast. "Now they aren't whistling at politicians, Fidel. Now they are cleaning weapons in the barracks to take my head off."\n\nAdolfo López Mateos, sitting in the shadows with the impassivity of a sphinx, coughed delicately. "Historical parallels are beautiful gentlemen, but we need a strategy. DIGEPOL and the SNI are working to exhaustion, we are exposing conspirator cells, but time is working against us."\n\n"To hell with time," Castro cut in, chopping the air with his hand. "In '59, I said in that square: 'Venezuela is the homeland of the Liberator, and she must lead America.' Do not let some parquet generals take that right away from you, brother. My 'tourists' are already on planes. If the army rolls out tanks, they will meet veterans of the Sierra Maestra. We will turn this palace into a fortress against which they will break their teeth.""
MEX_VEN.7.a: "Revolutionaries don't abandon their own."

MEX_VEN.8.t: "An Uncomfortable Alliance"
MEX_VEN.8.desc: "Silence hung in the office, heavy as the pre-storm sky over Mount Ávila. Fidel Castro nervously paced the room, and every glance he cast toward Raúl Leoni was steeped in coldness. The Venezuelan President, whose massive, husky frame towered over the desk, maintained a monumental calm. He did not interrupt, but merely listened intently, clasping his large hands together as the Cuban vented his energy.\n\n"Fate loves cruel jokes, Raúl," Castro said, stopping by the map. "Your rangers hunt my students in the jungles, yet today I offer you the only thing that can hold up your throne - Cuban bayonets. Say the word, and we will turn Miraflores into an impregnable fortress that the generals will break their teeth on."\n\nLeoni slowly shook his head. There was no fear in his voice, only the reasonableness of a man accustomed to finding the safe path. "I appreciate the gesture, Fidel. But Venezuela is a complicated family. If a single one of your soldiers steps onto the cobblestones of Caracas, the army will rise against a 'Red intervention.' I cannot risk civil peace for the sake of my own security."\n\nAdolfo López Mateos, sensing the moment, intervened gently. "Then let the guns speak, but from the sea. The Mexican squadron will anchor in the roadstead of La Guaira. Destroyers in the distance will restrain those barracks hotheads better than foreign infantry in Libertador."\n\nLeoni paused, weighing the risks, and finally nodded. Mexican steel on the horizon was the most sensible and measured choice."
MEX_VEN.8.a: "Pragmatism over feelings."

MEX_VEN.9.t: "Silk Gloves"
MEX_VEN.9.desc: "The atmosphere in the cabinet was taut as a guitar string before it snapped. Fidel Castro shifted in his chair, trying not to meet the Venezuelan President's eyes. The Comandante, accustomed to the company of rough "barbudos" and the smell of gunpowder, felt out of his element next to Gonzalo Barrios - a man of impeccable manners, subtle perfume, and soft gestures. To Castro, this "intellectual" was the embodiment of everything the revolution should sweep away, but politics dictated its own strange alliances.\n\n"The situation is shit, Gonzalo," the Cuban grunted, studying the toe of his boot. "Your generals smell weakness. They see before them not a leader and they need the language of strength. My boys can provide that language. A special forces regiment in Miraflores - and any colonel will think ten times before ordering an assault."\n\nBarrios carefully adjusted his shirt cuffs. He read the squeamishness in his guest's posture perfectly, but his voice remained even and calm. "I appreciate your candor, Fidel. But the legitimacy of my government rests on the crystal foundation of the constitution, not on foreign bayonets. If the people see Cubans on the palace balconies, they will decide I have sold the country to the communists. That would be a gift to the rebels that I do not intend to give."\n\nAdolfo López Mateos, for whom personal antipathies mattered little in the face of geopolitics, intervened with his usual businesslike manner. "Then we will demonstrate strength without touching the ground. The Mexican squadron will enter territorial waters. Blockade the ports, control the coast. This will show the army that the world is on our side, but will not give them grounds to scream about occupation."\n\nBarrios nodded, a flicker of relief in his eyes. The grey hulls of Mexican destroyers - that was an elegant argument, quite in his style."
MEX_VEN.9.a: "Subtle diplomacy versus brute force."

MEX_VEN.10.t: "My Dear Friend Fidel..."
MEX_VEN.10.desc: "I hope you have been doing a lot of good in Cuba. I always hear the most excellent things about the state of affairs under your rule.\n\nAs you know, fate has not been as kind to us here in Venezuela. I write to you today to kindly request your aid in maintaining the legitimacy of our government in the unlikely case that the reactionaries, with their devious machinations, manage to destroy our hard-won gains. Should they succeed, Fidel, I am sure that you will jump to an old friend's aid and help me get out of Venezuela, where my life would be threatened. From the safety of your country, we will continue our struggle for the just rule of our people.\n\nAlthough I did not start this letter with the most optimism, I truly believe we will be able to push the putschist swine back and do away with their stink once and for all, especially if you provide us with your support. When the dust is settled, Venezuela and Cuba will stand side by side against imperialism, colonialism and usher in a new age for the common people of Latin America. I await the day with glee..."
MEX_VEN.10.a: "Your dearest of friends, Fabricio"

MEX_VEN.11.t: "To His Excellency..."
MEX_VEN.11.desc: "President López Mateos.\n\nTime is short and of the essence, and so I ask you to forgive me if I do not fill this missive with all the platitudes you deserve.\n\nI'm sure you have already been notified of the plot by reactionary elements in our army to depose our democracy. I ask you, therefore, for two things.\n\nFirst, my government will, of course, require all support you can afford to give us in the upcoming trial, particularly should the putschists succeed in their endeavour and exile us. Of course, all of this is moot if we end up in their hands, and so I personally humbly request that you allow me and the rest of my men refuge in the Mexican embassy, followed by swift transport to Mexico, from where we can continue our operations until the illegitimate government collapses.\n\nTrust me when I say that I do not ask for your help without due cause; rather, I find there is no other choice as the worst scenario we could have conceived unfurled, threatening the security of both of our nations and Latin America as a whole.\n\nWarm regards,"
MEX_VEN.11.a: "President Raúl Leoni"

MEX_VEN.12.t: "To the President of Mexico..."
MEX_VEN.12.desc: "His Excellency, López Mateos.\n\nAs you have surely been informed already, shortly there will begin a struggle for the soul of Venezuela. It is not simply our revolution that is threatened here, but the very fabric of our Latin American societies. Mexico must be involved in this clash of ideologies. Should the reactionaries win, not only shall it severely weaken the Veracruz Pact by overthrowing one of its founding members, but it will also set the stage for further counterrevolutionary activities across national borders, allowing the shackles of imperialism and colonialism to reappear and imprison us all.\n\nEvery Venezuelan who has yet to fall to the honeyed words of the enemy is currently toiling to prevent the worst from passing. But the non-negligible possibility of the coup's success cannot be ignored, and so we must prepare for it just as well. For that dreaded future, I humbly request your oath that we will receive asylum in the embassy, then swift transport to Mexico, where we will be able to continue our fight against the illegitimate and tyrannical government that will undoubtedly spring up in our stead.\n\nAs we continue the battle on the ground, we await your response with worry and bated breath."
MEX_VEN.12.a: "President Gonzalo Barrios."

MEX_VEN.13.t: "That Which Soothes The Soul"
MEX_VEN.13.desc: "Luis Ignacio Rodríguez Taboada did not expect evacuation planning to be part of his ambassadorial duties. And yet, here he was, talking with the President of Venezuela on the topic. "Certainly, certainly, but just in case you need it, do know it is an option... Oh, I understand, I am certain that we will be victorious as well, but it remains... yes, no worries, I will have someone wait for you." Luis hung up and sighed his stress away. Around him, staffers were working around the clock to prepare everything for potential evacuation. Taboada smiled at their dedication to preserving Venezuela's own revolution. A seed for internationalism, perhaps.\n\nThe Mexican ambassador checked that all the curtains were drawn, a safety measure only. Receding gunshots could still be heard at regular intervals in the city and, if one listened carefully, the shouts of men engaged in battle were also audible. Still, the President's tone seemed certain that the putschists would be beaten back.\n\nAs he approached the last room he had yet to check the windows of, he heard the faint mutterings of someone inside. As soon as he opened the door, he saw one of his staff members kneeling down in prayer: "Hail Mary Most Holy, Beloved Daughter of God the Father..."\n\nTaboada stood there observing for a few seconds, somewhat shocked by the display.\n\n"Grant your good success to this request..."Then, with a headshake, he continued his round, internally scoffing at the backwardness of it all. But if these superstitions made these hard-working people feel better and did not interfere, he was willing to accept them."
MEX_VEN.13.a: "Defend this good country from those who seek its destruction." 

MEX_VEN.14.t:0 "Strike in San Cristóbal"
MEX_VEN.14.desc:0 "Taboada lowered the telegram onto the lacquered surface of his desk. In the silence of the Mexican ambassador's office, broken only by the hum of the air conditioner, the old diplomat felt a lump rise in his throat. Not from fear, but from a fierce, triumphant satisfaction.\n\nBefore his eyes flashed the gray, despair-soaked Marseille of the forties. He remembered that sticky terror: endless columns of refugees clogging the roads of France, fleeing the Nazi darkness. He remembered the eyes of Spanish Republicans begging for a visa before the Vichy police handed them over to Franco's executioners or sent them in cattle cars to the East, to the ovens of the death camps. Back then, roads were arteries through which the blood of a dying Europe flowed.\n\nBut the report from San Cristóbal told a different story. The Venezuelans used their trucks and buses not for flight, but as weapons. They turned the streets into steel clots, stopping the infection of fascism. Castro León, that pocket-sized Führer in epaulets, counted on a fast win, but he hit a wall against which far more formidable armies had shattered - the fury of people with nothing left to lose.\n\nTaboada wiped his hand across his face, erasing the haunting past. In Europe, he had watched nations break under the tracks of a "Tiger." Here, force broke against the crossed arms of workers. He reached for the phone to relay the news to Mexico City. This time, unlike in the cursed year of 1942, he would not have to issue visas for the doomed."
MEX_VEN.14.a:0 "This time, the Republic fought back."

MEX_VEN.15.t:0 "The Caudillo's Last Dance"
MEX_VEN.15.desc:0 "Taboada allowed himself a rare luxury - undoing the top button of his shirt and pouring two fingers of mezcal, which he had been saving for a special occasion. The burning liquid reminded him of the taste of dust on the roads of Guanajuato, the taste of those distant years when they smoked the fanatic "Cristeros" out of mountain ravines. General Castro León, that hapless little Napoleon, painfully reminded the ambassador of the old Mexican caciques: just as much arrogance, just as much gold on the uniform, and the same fatal misunderstanding that the time of the haciendas was gone forever.\n\nThe Iberian puppeteers thought they could smuggle the counter-revolution through the back door, using secret paths from Cúcuta like contraband tobacco. They counted on a blitzkrieg, on fear, on apathy. But they forgot an old revolutionary truth that Taboada had learned as a lieutenant: if you go against the people, make sure you have enough bullets to shoot every last one of them. León did not. His "Grand Army" crumbled, colliding with the icy contempt of the streets and the locked gates of the factories.\n\nThe ambassador smirked, looking out at the lights of evening Caracas. History loves to rhyme: reaction had once again choked on its own bile, just as it had half a century ago in his homeland. He finished the mezcal, adjusted his tie, and called for a car. It was time. The President was waiting for him at Miraflores - and this time, not to trace evacuation routes with trembling hands, but to smoke the cigar of victors."
MEX_VEN.15.a:0 "Worthy heirs of Bolívar. Send our congratulations to Caracas!"
MEX_VEN.15.a.tt: "§!With the triumph of the [VEN.GetFlag] §SVenezuelan§! people over §sreactionary coupists§! and their [IBR.GetFlag] §Obac§!§nkers§!, our [MEX.GetFlag] §KVeracruz ally§! will now be a §Gvital partner§! for many §Yyears§! to come."

MEX_VEN.16.t: "Desperation"
MEX_VEN.16.desc: "When Luis Ignacio Rodríguez Taboada left Mexico and its hectic politics to serve as ambassador to Venezuela, he never thought he would have to plan for their exfiltration from their own country. And yet, this was the task laid out for him now.\n\n"Yes, of course. I will have someone at the embassy's gates to look for you. Please be safe." Luis slammed the telephone down and rested his head on the table for just a moment. Then, he fixed his posture and looked around at the staff, paralyzed by the frequent shouts and gunshots that resounded in the city. "Come on, comrades! Don't stand there doing nothing. I understand you are scared, but we cannot let our Venezuelan comrades down." He sighed as the staff only reluctantly obeyed, and massaged his temples to soothe the pain of his migraine, muttering profanities under his breath.\n\nTaboada checked items off his mental list. The curtains were drawn, the families of senior officials taken care of, and Mexico City had been contacted for evacuation. He exited the building onto the embassy's premises to ensure the rounds he had set were being completed, only to find the three staffers he had assigned kneeling, their hands joined in prayer: "We seek refuge under your protection, O Holy Mother of God..."\n\n"What the hell are you..." Taboada's hands turned into clenched fists. He took a deep breath in, deciding that yelling and anger would not solve anything. "My friends, your superstitions could cost the President of our brotherly Venezuela his life, you can't let it cloud your judgment. We must act, not pray."\n\nThe staffers did not even look at him as they continued reciting."
MEX_VEN.16.a: "Do not despise our petitions..."

MEX_VEN.17.t: "The Final Scene"
MEX_VEN.17.desc: "From the balcony of the Miraflores Palace, Fabricio Ojeda felt the city shiver. Caracas at night was always glimmering, not only by the city lights, but also by hope. However, some glimmers didn't shine like the rest. In the quiet night, Fabricio Ojeda could barely hear shells. In the distance, he could see tanks moving below the hill. The ground underneath him trembled faintly, but its shockwaves didn't remind him of a military parade, more so invasion.\n\n"President Ojeda," a hurried voice called from behind him. A uniformed officer, gasping for breath. "San Cristóbal, Mérida, and Maracaibo have fallen. Enemy insurgents have already entered Caracas. You need to go. Now!"\n\nThe next moments felt like hours, dissolving into fragments. The hurried footsteps, his wife clutching his arm, the rotors tearing through the night.\n\nAs he looked below the helicopter, he saw Caracas up in fiery infernos, neighborhoods filled with nothing but smoke and screams of horror. There was no story to be told here, no lesson to be learned, for words could not tell the sheer scale of hopelessness he could feel.\n\nThe helicopter jolted as it landed at the Mexican embassy, a fortress even Castro León wouldn't dare fire at. Floodlights scanned the perimeter. Soldiers scrambled around, with no one sure if the insurgents were crazy enough to invoke Mexico's wrath. But Luis Ignacio Rodríguez Taboada, the Mexican ambassador, was waiting patiently for Ojeda. His weary face had already foretold the dire news.\n\n"Caracas has fallen.""
MEX_VEN.17.a: "We are sorry, Venezuela."

MEX_VEN.18.t: "The Final Wish"
MEX_VEN.18.desc: "In the dead of night, the Miraflores Palace still whispered with activity, though it would be the last time Gonzalo Barrios and Raúl Leoni would see their lavish chandeliers, would dig their feet into the velvet cushions, would admire the exquisite portraits of the great leaders that preceded them. It was the last oasis of friendship in a country with a dying light.\n\n"You ever think," Leoni mused, staring at the bottom of his wine glass, "we might live long enough to see Venezuela stop tearing itself apart?"\n\nBarrios gave a dry chuckle. "I think she's already found her peace."\n\nJust then, the door burst open. A young officer, pale with urgency, quickly saluted before blurting out his report. "Señor Presidente, Eastern Caracas has fallen. You both need to be evacuated immediately.\n\nBarrios jolted from his chair. "What is going on out there?"\n\nLeoni slowly rose. "Seems like we can never be too complacent in a country like this." He exhaled with disappointment. "Go. I'll gather my family."\n\nBarrios hesitated, but the officer was already pushing him out. Within minutes, they were airlifted to Venezuela's last asylum left: the Mexican embassy. The trip blurred, clouded by more despondency than actual fear. Venezuela was always a ticking time bomb; Barrios just expected a little more time.\n\nLuis Ignacio Rodríguez Taboada waited at the embassy gates. The Mexican ambassador's words would deliver the final death blow to the Gaitanismo that thought they could revitalize Venezuela:\n\n"Caracas has fallen.""
MEX_VEN.18.a: "We are sorry, Venezuela."

MEX_VEN.19.t: "The Final Hour"
MEX_VEN.19.desc: "The clock in Leoni's office ticked louder that night, each second reminding the Venezuelan leader that his time had already run out. The door burst open; a pale officer stood at attention. "Sir - Eastern Caracas has broken into infighting. We must evacuate you to the Mexican embassy, now!"\n\nLeoni jolted to his feet, pushing his chair back. "What's going on?" Before he could even get an answer, he was pulled out of his office, leaving the pens behind that had forged Venezuela into a republic.\n\nOutside, his wife, Menca, called for a headcount of their children: "One. Two. Three. Four." But her voice stopped and her face turned pale. Álvaro, their youngest, was missing.\n\nPanic swept through the group. Thoughts ran through Leoni's mind. What if his son were lost? Injured? Dead? All Leoni could think about was saving his son, being there for someone who needed his guidance. He must be able to save his son, for he couldn't save his country.\n\nThe boy's wails revealed his position, and in no time, a guard quickly scooped him up before delivering him to his mother's arms. One last salute was exchanged between Leoni and the guards before the family flew off into the night sky to the one last asylum in Caracas.\n\nCaracas burned below. But the whizzing of shells and thundering of tanks made the guess as to who was winning trivial. Waiting at the embassy, Luis Ignacio Rodríguez Taboada greeted the family as they landed. Leoni helped each one of his children down from the helicopter, his wife still trying to calm down the crying Álvaro. But Álvaro was young enough not to understand the weight of the words that would come out of the ambassador's mouth:\n\n"Caracas has fallen.""
MEX_VEN.19.a: "We are sorry, Venezuela."

MEX_VEN.20.t: "The Still Hour Hand"
MEX_VEN.20.desc: "REPORT ON VENEZUELAN COUP\nDIRECCIÓN DE SEGURIDAD INTERNACIONAL\nISSUE: Coup in Venezuela Topples Government\n\nAt 4:20 AM, Jesús María Castro León and dissident Venezuelan officers crossed the Colombian border into San Cristóbal, forcing the local garrison to retreat. Within hours, Vega de Aza and El Vigía fell to the putschists, allowing them to control both the roadways and the skies. Maracaibo and Barquisimeto subsequently fell.\n\nTwelve hours since the coup began, Caracas was abandoned to the insurgents. The president and his family have been exiled under Mexican protection.\n\nFollowing the evacuation, Castro León had been sworn in as President, ending democratic rule in the country.\n\nThe importance of Venezuela cannot be underestimated. A pillar of the Veracruz Pact has been broken. Besides Cuba, Mexico now stands alone in the proxy battleground that is Central America. Venezuela has been torn from our grasp, and we fear there is nothing we can do now that the coup has finished. History will remember us bitterly for allowing this transgression.\n\nWe should have done more, Su Excelencia.\n\nWith great remorse,\nColonel Rangel Escamilla"
MEX_VEN.20.a: "Apologies cannot forgive us for our hesitation."
MEX_VEN.20.a.tt: "§!With the fall of our [VEN.GetFlag] §SVenezuelan§! ally to §smilitary rule§!, our [MEX.GetFlag] §KVeracruz§! dream has been dealt a dire, perhaps §Rfatal§! wound."

MEX_VEN.24.t: "Ambassador Mediation"
MEX_VEN.24.desc: ""Su Excelencia, a call from the embassy in Caracas."\n\nA curt nod, with a barely suppressed grimace. Ordaz brought the handset to his ear, and before the ambassador could speak he began, "He's done it hasn't he?"\n\n"Si. He will announce it today, sir, from Miraflores," the ambassador said. They had discussed the rumblings in Caracas in their last call, about Venezuelan President Ojeda's decision to nationalize his country's oil industry. A terrible headache, to think what the Americans would say about that.\n\nOrdaz was already scrambling to the closest television, tuning to Telesistema Mexicano. Yellow, blue and red flooded the screen. Ojeda spoke to a teeming crowd from a balcony, denouncing the "long darkness of subjugation to the dollar."\n\nOrdaz rubbed his temples raw as Ojeda announced the introduction of a bill to nationalize the oil industry for the people of Venezuela. The people erupted into wild cheering, pushing Mexico's reporters along a tide of drums and chants towards the National Assembly palace.\n\n"Send the Venezuelans a message," Ordaz rattled off, "tell them this is a sensitive issue."\n\n"But, Mr. Ojeda..."\n\n"Secure a meeting with him as soon as possible. Try to talk him out of this, please."\n\nThe call that followed was with another ambassador: America's, in Mexico City. Ordaz chewed the sides of his mouth as he calmly assured the furious American that, no, Venezuela would surely be stopped by her Mexican older brother. The U.S would not have their industries stolen from them.\n\nThe complaints still ringing in his ear, Ordaz hunched over his desk. He needed to figure out his next steps, quickly."
MEX_VEN.24.a: "Lean hard - get Ojeda to tone this nonsense down and moderate his message."
MEX_VEN.24.b: "The gringos trust us... but there's not much we can do."
MEX_VEN.24.tt:0 "§!If [VEN.GetFlag] §ROjeda§!'s government remains stronger than the §Ymilitary§! and §Mdemocratic§! opposition, [MEX.GetFlag] §Kour interests§! in Venezuela will prevail over [IBR.GetFlag] §OIbe§!§nria§! and the [USA.GetFlag] §mU.S.§!\n§F------------------------------------"

MEX_VEN.25.t: "Interruption from Caracas"
MEX_VEN.25.desc: "A secretary peeked her head into Salinas's office. "Su Excelencia, a call from the embassy in Caracas."\n\nSalinas waved her away, and shushed the governor of Zacatecas, who'd come for some nonsense meeting. Handset to his ear, he said, "Good morning. Ojeda's announcement?"\n\n"It's happening today, sir," he said, breathless. They had discussed the rumblings in Caracas in their last call, about Venezuelan President Ojeda's decision to nationalize his country's oil industry, but there was no timetable then. Salinas had been anticipating this call.\n\n"He is announcing it from Miraflores," the ambassador added, and Salina motioned for the governor to find the remote and tune to Telesistema Mexicano. Yellow, blue and red flooded the screen. Ojeda spoke to a teeming crowd from a balcony, denouncing the "long darkness of subjugation to the dollar."\n\nSalinas was tight-lipped, watching Ojeda reveal a bill to nationalize the oil industry for the people of Venezuela. The people erupted into wild cheering, pushing Mexico's reporters along a tide of drums and chants towards the National Assembly palace.\n\n"Su Excelencia, our response?"\n\nThank you for notifying me quickly," Salinas said, slowly. "As for our response... I want a message delivered to President Ojeda. Keep it brief. Polite."\n\n"Is there anything you'd like the President to hear, sir?"\n\nSalinas breathed sharply. "I don't want my thoughts to be revealed if this gets leaked to the press.""
MEX_VEN.25.a: ""Let him know, at least, that this is a step in the right direction.""
MEX_VEN.25.b: ""Tell him I send my regards, but be non-committal.""

MEX_VEN.26.t: "A Rubicon Crossed"
MEX_VEN.26.desc: "A secretary peeked her head into Madrazo's office. "Su Excelencia, a call from the embassy in Caracas."\n\nA curt nod. Madrazo adjusted his tie out of habit, as if for a face-to-face meeting. Handset to his ear, and before the ambassador could speak, he began, "Ojeda's announcement?"\n\n"It's happening today, sir," he said, breathless. They had discussed the rumblings in Caracas in their last call, about Venezuelan President Ojeda's decision to nationalize his country's oil industry, but there was no timetable then. Had that changed?\n\n"He is announcing it from Miraflores," the ambassador added, and Madrazo was already scrambling to the closest television, tuning to Telesistema Mexicano. Yellow, blue and red flooded the screen. Ojeda spoke to a teeming crowd from a balcony, denouncing the "long darkness of subjugation to the dollar."\n\nMadrazo laughed dryly, as Ojeda announced the introduction of a bill to nationalize the oil industry for the people of Venezuela. The people erupted into wild cheering, pushing Mexico's reporters along a tide of drums and chants towards the National Assembly palace.\n\n"Thank you for the information," Madrazo rattled off, and immediately called Miraflores. Ojeda picked up quickly enough, his voice on the other side still winded from the speech.\n\n"I take it you know," he said, and there was also excitement coursing through those historic words. Madrazo grinned to himself.\n\n"Yes, Mr. President, and I congratulate you. No one else has dared take such a bold step against our northern neighbor's imperialism before. These next few months will surely be difficult. Mexico and Veracruz are with you," he said, then paused, frowning..."
MEX_VEN.26.a: "And we'll give you full support. Everything we have."
MEX_VEN.26.b: "As long as it is reasonable."

MEX_VEN.27.t: "An Ally in Flux"
MEX_VEN.27.desc: "DIRECCIÓN FEDERAL DE SEGURIDAD\n\nISSUE: Suspect officers building ties with Venezuelan opposition.\n\nSurveillance indicates developing relationships between military circles and civilian opponents to Venezuelan president Fabricio Ojeda. Led by members of Acción Democratica and the right-wing section of the URD, concerns about President Ojeda's decision to nationalize the oil industry has spurred them to action.\n\nThe military and civilian opposition share anxieties of Ojeda as a "second Fidel." Together, it's clear they intend to compel his abdication by force, if necessary.\n\nIt's urgently advised that Mexico take all necessary measures to bolster the legitimacy of Ojeda's government. Otherwise, it may face a fatal crisis.\n\nVery Respectfully, \nRegional Director of Security\nColonel Emilio Torres. "
MEX_VEN.27.a: "We'll flag suspect officers and notify our Venezuelan partners."
MEX_VEN.27.b: "Surveil the opposition's activities, find the skeletons in their closet."
MEX_VEN.27.c: "Hold a photo-op at the Veracruz Forum, celebrate Venezuela's Ojedista leaders."
MEX_VEN.27.d: "Our hands are tied."

MEX_VEN.28.t: "Premonition"
MEX_VEN.28.desc: "It started with DIGEPOL's warning as part of the daily briefings. "Suspicious exchanges" between his most bitter enemies in Acción Democratica and the military. He read every line in a crawl, tongue going numb. "Surveillance indicates growing radicalization of the opposition."\n\nA hard knock. Ojeda staggered, going upright behind the vastness of his desk. As if it would protect him from...\n\nIt was only an aide, cracking the door open. No gun barrel glint. "Mr. President, five minutes to leave for the conference."\n\n"Cancel." A dead silence. Ojeda snatched his documents, the DIGEPOL report, with sweaty hands. "Cancel the conference, Gladys. I'm not going."\n\nThat night, he made international calls. Fidel Castro's voice echoed in his office, and Ojeda let out a bitter chuckle, knowing such a conversation was the exact sort of thing his enemies would call him a traitor for.\n\n"Something's shifting, Fidel. It isn't a petty squabble anymore, with the Adecos and Urredistas."\n\n"What do you mean, Fabricio?"\n\n"I don't know how many dissident officers remain after Holy Wednesday, but they do. Only a matter of time before a coup." Ojeda rubbed the bags in his eyes. "I already asked the Mexicans. If you sent intelligence personnel here it would be a game changer..."\n\n"That would be very risky, Cuban soldiers in Venezuela." Fidel sighed on the other side of the line. "But your opposition already thinks we're too close. The Veracruz Pact binds us, so I could send a few militiamen to Caracas, for your sake.""
MEX_VEN.28.a: ""Intelligence only. That will reduce the risk and stop this threat.""
MEX_VEN.28.b: ""Damn the risk, without Cuban security assets, I and the revolution are as good as dead.""

MEX_VEN.29.t: "The Oncoming Storm"
MEX_VEN.29.desc: "Chaos. Ojeda had long accepted that the nationalization bill wouldn't go through that day, much to his chagrin. The floor of the assembly had been uncontrollable from the moment the nationalisation bill had been introduced, and nothing could help it. He had used the time to negotiate with a few moderates - some progress had been made, but even with some opponents gone, he could feel hesitation beginning to creep in. Turning his head, Ojeda shouted swears at Rafael Caldera, for morale if nothing else.\n\nAnd then, it stopped ahead of schedule. A police officer first advanced a statement to a speaker long rendered useless, then chose to proclaim, foghorn and all, that a car had crashed into the barricade. Suddenly rendered mute, the assembly chose to heed his warning and chose to disperse. Enraged, Ojeda excused himself to the bathroom, only leaving after them with dejection visible on a face he hadn't dried.\n\nAs he stormed home, everything was quiet. No guitars strummed from the walls, and the radios didn't even blare with static. The bars were totally empty, with no queues streaming out like usual. No street vendors struggled to sell their wares, nor did cars pass him by. If it wasn't for distant creaks, Ojeda would have been totally alone. But his thoughts, by now, were racing, as were his legs. Back to Cuba. Back to Batista, and the night before his ousting. The calm before the storm.\n\nSlamming the door shut, he quickly turned to his bags. He threw a few items in - clothes that had just been washed, identification he didn't need - before stopping. Through the mail, he could see familiar insignia. Both Fidel Castro and [MEX.GetLeader] had written. With how important the nationalization bill was, he didn't need to be told the significance of their contents. Choosing to take himself to bed, his fingers nonetheless floated over the Mexican envelope, and his eyes flicked over a random line."
MEX_VEN.29.a: ""...it will take unity between you and the Venezuelan people to withstand the reactionary...""
MEX_VEN.29.b: ""...maintain your resolve in these times, and stick to your liberatory agenda...""
MEX_VEN.29.c: ""...situation is too dangerous right now, but our embassy remains open should you wish...""

MEX_VEN.30.t: "The Deluge"
MEX_VEN.30.desc: "The scenes on screen almost played out like a movie. As the first cracks of dawn began to rise across the skyline, tanks and trucks rolled down streets surrounding the National Assembly. Behind them roared a mass of cars, filled with demonstrators and congressional opponents to the nationalization bill. They knew what was coming next; they'd block any Ojedistas from the chamber, advance a no-confidence motion, and then leave the nationalization bill to die. All it would take was time.\n\nA mess of cars met them. This coup had been expected, and these loyalists had been preparing to counteract them. From a mass of cars and counterdemonstrators, and guided by agents with Mexican and Cuban accents, a barricade was quickly brought up, backed by protesters on both sides. Soon, any progress was halted, and a small corridor opened only so that socialists could come through; a confidence measure by itself.\n\nThen, just as the wave crested, it buckled. Rumored arrests soon became replaced with real ones, lists of coup-plotters being dragged out of the crowd in handcuffs by loyalists within the Venezuelan military. A military presence remained, watching over the bands of Ojedistas with mild disgust, but did little more than shake their heads at chants. As the sky tipped from navy to light blue, the military began to disperse, their withdrawal immediately celebrated by those who hadn't yet escaped.\n\nWithin the rooms of the Presidential Palace, work had basically stopped. The first parts of this live broadcast were now reaching virtually every room, flat reports from the Telesistema Mexicano being watched, and cheered on, by a growing number of staff members, eschewing their work for a brief moment to celebrate the survival of Ojeda's government. For a brief moment, [MEX.GetLeader] appeared behind them, hovering only to watch the news confirm that nationalization was still going ahead. "
MEX_VEN.30.a: "Hovering, but not speaking."

MEX_VEN.31.t: "Designated Survivor"
MEX_VEN.31.desc: "For the briefest of moments, Fabricio Ojeda sat down in relief. There were still ways he could lose, and for the coup to resurge, but it looked less likely by the minute. With how embedded the opposition had been, too, they would likely not be able to make up the numbers, as he had feared the night before. As long as this peace held, it could just go through. Just then, a phone rung, and by impulse, Ojeda lunged for it.\n\n"So, I hear that you survived another coup, Fabricio?" asked a familiar voice.\n\n"Ah, Fidel, glad that the news have escaped Caracas!" he replied, smiling. "Have to say, it could've easily gone the other way last night."\n\n"I could imagine, with how many forces tried to oust you. The Noticiero Nacional is filled with scenes of celebration within Caracas, but looking out of my window, it almost feels like I'm right there with you."\n\n"I'm very happy to hear that. With this nationalization bill coming up, I know we're going to do wonderful things for Latin America." His eyes drew up to the clock. The vote was almost about to happen. "Look, I'd love to talk further, but the vote's coming up, and it'd be grim if I missed it." A brief farewell came from the other side, cut off as he hung up.\n\nRising from his chair, Ojeda paced into his car, looking at the streets. Cars were strewn about, but most people still remaining simply walked past, idly looking ahead. Entering into the chamber to a chorus of applause, he looked around. No sign of many assemblymen; it seemed that they had largely taken leave, either to prison or the streets. With nary a complaint, the nationalization bill passed through. Tighter than he hoped, and a few moderates seemed to have moved against it, but there were far too many abstentions to jeopardize its majority."
MEX_VEN.31.a: "Ordinary procedure befits extraordinary times."

MEX_VEN.32.t: "The Lights Going Out"
MEX_VEN.32.desc: "For a brief moment, the Cuban embassy in Caracas was completely silent, enraptured by the news above. Luis Augusto Dubuc, stressed and unkempt, hesitated as he gave his presidential speech, promising fire, fury, and peace at once. Below, and well outside of the halls of the Senado, Ojeda gathered with his wife and remaining loyalists, straining to remember every phone line still open. As the room continued to speak, attempted calls to the Mexican embassy gave nothing but a ringtone, a muted wa-\n\n"Fabricio, is that you?" asked a familiar voice from down the line. Ojeda gave a sigh of relief as he raised a thumb.\n\n"Fidel, it's good to hear from you." Ojeda turned around to look at his cabinet, now huddling closer to his edge of the table.\n\nSilence came down the line, but only for a moment. "Your misfortunes won't end here. The Venezuelan army is under Congress's control, arresting anybody who looks red. You'll be prosecuted the moment you step out of that embassy."\n\nThe news came as no surprise, but Ojeda still swore under his breath. "Well, we can't stay here, surely? Mexico's embassy is larger, but they've not reached out to us since the nationalization bill failed."\n\nAnother silence came, this time longer, and now even more unnerving. "I can't answer for Mexico. Havana will welcome you with open arms, but you'll have to get there first. Our agents might be able to help, but you'll have to act fast, and that's as far as my influence will go."\n\n"Thank you, I'll bear that in mind," replied Ojeda, his smile collapsing into a grimace. How could he escape? Every second wasted was one in which another agent was found, another street swarmed, another lifeline cut. And yet, where could he start?"
MEX_VEN.32.a: "All the while, the lifelines northwards remained totally mute."

MEX_VEN.33.t: "Skeleton Crew"
MEX_VEN.33.desc: "Across the office, the flames burnt softly, their flickers drowned out by frantic calls between Cuban agents, and by the desperate cataloguing of rumors and military interviews blaring from the television overhead. Papers detailing minutes of calls between Ojeda and Cuba burned amidst files on military positions and profiles on individual generals whose loyalties had now been made very clear. A knock came on the door, forcing the guns of every agent upwards, readied as one inched towards opening it.\n\n"Damn it, Yolanda, are you trying to alert everybody in Caracas?" asked the agent, only lowering his gun slightly as he noticed the crowd behind her. "And who the hell are these people?"\n\nYolanda forced herself in, momentarily remaining quiet as they streamed in. "Mexican agents, and socialist deputies from the Democratic Republican Union, Emilio," she growled, looking over the remaining piles. "Have you heard the news? The military has called a state of emergency, and is going through each building for more Ojedists to arrest."\n\nThe other Cuban agents sullied themselves, before one deputy, wiping his forehead of sweat, raised a hand. "I wasn't able to call Ojeda before being swept up in this. Do you have any clue where he is?"\n\nThe agent to the back shook his head. "No clue. He and the Minister of Internal Affairs have just disappeared. Most of their cabinet didn't attend the vote, and those who did are being taken by us to Aruba now. Best to presume that they're dead."\n\nBy now, a few sirens could be distantly heard. Finally, Yolanda sighed, halting one agent. "Most of this office is clear, and I don't think we have enough time for the rest," she peered outside, and then to the new group, "and our planned escape should still have enough room for these people. Best to leave, at least for now.""
MEX_VEN.33.a: "And so, the withdrawal heads north."

MEX_VEN.34.t: "Venezuelan Intelligence Integration Requested"
MEX_VEN.34.desc: "Diplomatic Cable from Luis I. Rodríguez, Ambassador to Venezuela\nTop Secret - Exclusively for Secretary Manuel Tello Baurraud\n\nMexican - Venezuelan relations proceeding smoothly following the inauguration of Unión Republicana Democrática politician Jóvito Villalba as President. A liberal, Villalba made remarks during the campaign that could be construed as critical of our revolutionary governing system, primarily as attacks on his leftist Acción Democrática opponent. Since assuming office, however, Villalba has maintained cordial and extensive contact with our embassy, taking on the role of a pragmatic and cooperative statesman.\n\nHis government is almost exclusively focused on further reforms to institutionalize Venezuela's democracy. Should President Villalba succeed, our Venezuelan ally will be further strengthened and stabilized. The dominant performance of the URD, AD, and the Christian social democrat COPEI parties in the past elections has shown that reactionaries are incapable of competing at the ballot box in Venezuela. Our contacts in Caracas suggest that the rightists may be forming dissident groups in response.\n\nHaving discussed the matter with President Villalba, he has requested that Venezuela's intelligence service, DIGEPOL, be formally admitted into the Oficina Conjunta de Asuntos Externos. He believes that OCAE, the intelligence coordination body established between our DFS and the Cuban DGI, should be sufficient to identify and address any threats to the Venezuelan government and revolution."
MEX_VEN.34.a: "I consider this a significant victory for the Veracruz alliance."

MEX_VEN.35.t: "Venezuelan Intelligence Integration Requested"
MEX_VEN.35.desc: "Diplomatic Cable from Luis I. Rodríguez, Ambassador to Venezuela\nTop Secret - Exclusively for Secretary Manuel Tello Baurraud\n\nMexican - Venezuelan relations proceeding following the inauguration of COPEI politician Rafael Caldera as President. A self-described 'Christian Social Democrat', Caldera was perhaps the least desirable candidate in contention, representing the reintroduction of clerical influence into Venezuelan politics. In personal matters, however, I have found Caldera to be both amiable and reasonable, with multiple high-profile visits to our embassy to discuss proceedings at the Veracruz Forum. Additionally, he has made anti-fascism a key part of his domestic platform and recent speech to the OAS. Diplomatically at least, Caldera could be a significant asset.\n\nPresident Caldera's victory, while unfortunate, reassured many religious conservatives about the course of the Venezuelan revolution, further stabilizing the country. With COPEI dominant at the ballot box, our contacts in Caracas suggest that the small contingent of irreconcilable rightists will drop out of the electoral system entirely and may organize into armed dissident groups.\n\nAfter discussing the matter with President Caldera, he has requested that Venezuela's intelligence service, DIGEPOL, be formally admitted into the Oficina Conjunta de Asuntos Externos. He believes that OCAE, the intelligence coordination body established between our DFS and the Cuban DGI, should be sufficient to identify and address any threats to the Venezuelan government and people. "
MEX_VEN.35.a: "Under the circumstances, I consider this a significant victory for the Veracruz alliance."

MEX_VEN.36.t: "Urgent Request for OCAE Support - Caracas "
MEX_VEN.36.desc: "Your Excellency,\n\nAt 22:30 yesterday, DIGEPOL, the intelligence service of our Venezuelan allies, notified the Cuban DGI and the Directorate of Federal Security through encrypted OCAE channels of a major breach in the city of Caracas. A DIGEPOL agent, recently recommended for termination based on several suspicious activities identified as we integrated Venezuelan intelligence into OCAE, fled the country with a significant portion of the agency's archives. The theft of these materials, focused on suspect military and police officials, political dissidents, and criminals in the nation's capital, has left DIGEPOL near blind in Caracas.\n\nThe traitorous agent is believed to have taken refuge in Iberia's Brazilian embassy. It is unclear if the theft was prearranged with the Iberians, or if the agent provided the information solely to facilitate defection. Either way, a hostile power has been given a significant opportunity to infiltrate and disrupt Venezuela.\n\nI strongly recommend that all available resources be made available to support our Veracruz partner. DIGEPOL plans to conduct a series of arrests in three months' time to reestablish effective monitoring and preemption in Caracas. If these should fail, Venezuela's security situation may become unsalvageable."
MEX_VEN.36.a: "Captain Fernando Gutiérrez Barrios"

MEX_VEN.37.t: "Evening at the Municipal Theater"
MEX_VEN.37.desc: "Below, in the shining abyss of the stage, the dramatic finale of the first act thundered, and the crescendo of violins seemed to try and outshout reality itself, hanging over Caracas. Meanwhile, a different atmosphere reigned in the shadowed private box. Fernando Gutiérrez Barrios sat in the velvet armchair, straight as a blade. His suit was impeccable, his parting ideal - a living embodiment of the era of President Alemán, when style was an extension of state discipline.\n\nBeside him, DIGEPOL Director José Jesús Patiño González presented a sorry sight: his jacket was rumpled, his collar unbuttoned, and the man himself emanated the sour smell of fear and three days of insomnia. As the Cuban liaison began reading the intercept summary, the Venezuelan's head fell heavily onto his chest. He began to snore, cutting into the orchestra's score.\n\nBarrios grimaced with disgust and lightly, but insistently, tapped the toe of his patent leather shoe against his colleague's leg. "Wake up, Señor, you are missing the climax," he said in an icy tone. The Venezuelan jerked, rubbing his eyes. Barrios shook his head with a slight, almost sympathetic smirk. "You know, President Alemán used to say that a rumpled suit is a sign of a rumpled mind. For such an appearance at a briefing, he wouldn't have had you shot... he would have destroyed you with a look so withering you would have gladly tightened the noose around your own neck."\n\nThe smile vanished from the Mexican's face as quickly as it had appeared. "Pull yourself together. Your service is bursting at the seams. You are trying to hold water in a sieve. You don't have the men for the whole city. Decide now: either we barricade ourselves in the Libertador government district, spitting on the outskirts, or we go into the slums to crush the infection in the bud, leaving the center naked. The choice is yours.""
MEX_VEN.37.a: ""We cannot lose the seat of power. Fortify Libertador.""
MEX_VEN.37.b: ""The enemy hides in the shadows of the outskirts. We go there.""

MEX_VEN.38.t: "Cold Reception"
MEX_VEN.38.desc: "The airstairs touched the scorching concrete of Maiquetía Airport, but instead of the usual motorcade and welcoming smiles, Fernando Gutiérrez Barrios was met only by the lonely figure of a junior adjutant with darting eyes. No Patiño, no honor guard. The air was thick with humidity and tension.\n\nThe messenger, stammering, conveyed the gist: the OCAE meeting was cancelled. The reason - "critical instability." Worse, DIGEPOL was undergoing "deep internal restructuring." Barrios knew this euphemism perfectly well. It meant a purge. The Venezuelans, having failed to uncover the Iberian network, had decided in a panic that their intelligence was either incompetent or infiltrated, and were now chopping off the head that ached.\n\nThe Captain slowly, with almost theatrical calm, took a thick cigar from his case. The lighter clicked. Barrios dragged deeply, blowing a stream of blue-grey smoke into the face of the harbinger of disaster, and his thoughts returned for a moment to the start of his career - to the dusty offices of Mexico City in '47, when the DFS was just being born from chaos and paranoia.\n\n"Convey to your leadership," he said, "that when we hunted enemies of the Revolution, we did not burn our own archives out of fear. What you have started is suicide. You are voluntarily gouging out your own eyes, hoping that way the Iberians won't find you."\n\nHe turned sharply back to the stairs, not dignifying the adjutant with a parting glance. Venezuela had signed its own death warrant, and he had no intention of standing nearby when the executioner's axe fell."
MEX_VEN.38.a: "Empires crumble due to stupidity, not enemy strength."
MEX_VEN.38.tt: "§!§!With the collapse of the [VEN.GetFlag] §SVenezuelan§! internal security apparatus, in the event of a §scoup§!, the [VEN.GetFlag] §SVenezuelan government§! will §Rcollapse§! like a house of cards.\n\nWhether it be weeks, months, or §Yyears§!, the fall of our [MEX.GetFlag] §KVeracruz ally§! is now a §Rcertainty§!."

MEX_VEN.39.t: "Impeccable Cut"
MEX_VEN.39.desc: "Fernando Gutiérrez Barrios snapped the folder stamped "Top Secret" shut and placed it on the table. In the air-conditioned cool of the DIGEPOL Director's office, the report read like a gripping spy novel with a happy ending. The summary was flawless: targeted arrests had mowed down the conspiracy's leadership, personnel rotation had decapitated disloyal garrisons, and the fake "rightist cells" created by intelligence had worked like flypaper, luring the most cautious traitors out of the shadows.\n\nThe Captain raised his eyes to the office's occupant. José Jesús Patiño González no longer resembled the rumpled clerk dozing at the opera. This time, he sat upright, radiating confidence. His suit was an exact replica of Barrios's own style, down to the width of the lapels and the shade of the tie.\n\nThe Mexican allowed himself a spare, approving smile.\n\n"Brilliant work, Señor José. You have halted social dissolution and purged the rot from the system. Alemán would be proud of you," Barrios stood and, walking around the desk, demonstratively adjusted the handkerchief in the Venezuelan's breast pocket. "And I see you have mastered my main lesson: order in the country begins with order in one's attire. An excellent choice of tailor."\n\nHe paused, critically examining his colleague's face. "However, you will still have to work on the mustache. It lacks... let us say, the requisite luster and volume. But do not despair; Rome wasn't built in a day, either.""
MEX_VEN.39.a: "The apprentice exceeded expectations (almost)."
MEX_VEN.39.tt: "§!§!With the triumph of the [VEN.GetFlag] §SVenezuelan§! internal security apparatus over §jdissident§! §gforces§! and their [IBR.GetFlag] §Obac§!§nkers§!, in the event of a §scoup§!, the [VEN.GetFlag] §SVenezuelan government§! will §Gprevail§! against those who seek to depose it.\n\nThe survival of our [MEX.GetFlag] §KVeracruz ally§! will now be a §Gcertainty§! for many §Yyears§! to come."

MEX_VEN.40.t: "Paper Tiger"
MEX_VEN.40.desc: ""Extra! Extra! President cuts rations for generals! Villalba against the Army!"\n\nA newsboy's piercing cry sliced through the sleepy Caracas morning, making Don Ricardo grimace. The bulky man in an immaculate ivory linen suit stopped at the entrance to a bakery. He fastidiously dabbed the sweat on his fleshy neck with a starched handkerchief and, with a careless flick, sent a coin into the grubby palm.\n\nThe newspaper settled into his manicured hands. The headlines did not lie. Villalba, that quiet intellectual with a bull terrier's grip, had decided to commit political harakiri. Pay cuts, purges, restrictions on voting rights - a slap in the face to every man in uniform who considered himself a sacred guardian of the nation. "Jesus," thought Ricardo, skimming the text. "What an idiot."\n\nThe President wanted to subordinate bayonets to paragraphs of the constitution, to turn "saviors of the Fatherland" into boring civil servants. A noble goal for a political science textbook.\n\nThe businessman folded the paper and chuckled bitterly, watching an army truck drive by. "Good luck, Señor Presidente." Villalba dreams of a "peaceful and stable state," but the only thing he guarantees with these measures is that the coup that overthrows him will be carried out with perfect and frightening efficiency. Stability will come, without a doubt. But it will be ensured by the very people he has just humiliated."
MEX_VEN.40.a: "No one likes it when you reach into their pocket, especially men with rifles."

MEX_VEN.41.t: "Determined Reforms For a Determined Enemy"
MEX_VEN.41.desc: ""While such reforms are very important, caution must be exercised when trying to implement them," said Luis I. Rodríguez, the Mexican Ambassador to Venezuela. He had come to speak with President Villalba and discuss the man's agenda over a pleasant lunch in Miraflores. Gabriel was officially Rodríguez's assistant, which allowed the DFS to have a voice at the meeting and keep up-to-date on Villalba's security.\n\nRodríguez took a sip from his drink before continuing, "The soldiers will be outraged when they catch word of the pay cuts and political restrictions. A silent group of officers still loyal to Pérez Jiménez within the ranks may cause a repeat of the 1948 coup if they aren't sated."\n\nA member of Villalba's staff walked up to the table and deposited a hefty stack of papers. From where Gabriel was sitting, they seemed to be stacks of orders and reform decrees in need of signatures. Villalba looked at Rodríguez and let out a small sigh, "Respectfully, Ambassador, while I agree with your government's concerns, do you have any other ideas on how I should go about things?"\n\nGabriel spoke up to give his suggestion, "You could water them down, place officers in key positions that would prevent a conspiracy from-"\n\nVillalba shook his head, "Absolutely not. Have you heard of how many coups Venezuela has suffered in the past three decades? With such a determined enemy, Venezuela must have determined reforms. If that threatens my presidency, then so be it."\n\nA heavy silence sat in the air. Eventually, Rodríguez cleared his throat and steered the conversation away from the topic, but Gabriel couldn't keep himself from glancing at the soldiers posted at the door."
MEX_VEN.41.a: "After all, they had overheard the entire conversation."

MEX_VEN.42.t: "A Normal Stroll in the Park"
MEX_VEN.42.desc: "Gabriel and Rafael purchased breakfast at a street vendor in Chacaíto, took a seat on a bench, and began to chat, the two friends catching up on their personal lives over the past few days. From the outside, they looked like any old pair of friends passing time. In reality, while the two men were friends, Gabriel was a Mexican DFS agent, and Rafael worked for DIGEPOL. Between bites of their food, they glanced around the park. Apparently, former Perezjimenistas had picked up a habit of going on morning walks with unknown companions in these areas.\n\nWhile Rafael was asking Gabriel about the answer to a crossword puzzle in his newspaper, Gabriel elbowed him and whispered, "On the other side of the fountain, passing by the street vendor, that's definitely Luis Felipe Llovera Páez. He's back in Caracas, apparently. You know who he's with? I don't recognize him." Rafael shot a glance to where Gabriel had described, and while the stranger looked like another military man, Rafael didn't recognize him. Without a word, they threw out their half-eaten breakfasts and began to trail Llovera Páez.\n\nSoon they could overhear the former exile's conversation, "It'll be a lightning, bloodless coup in Caracas, Villalba will be out of the way before he knows what hit him."\n\nLlovera Páez's mysterious buddy had a noticeable Spanish accent to his words, "And what about the rest of the country?"\n\nRafael and Gabriel had scribbled down everything they heard onto the backs of their newspapers and rushed back to the field headquarters. As they mapped out the notes they had obtained, Gabriel quickly began calling Miraflores. From where troops would be deployed to where supplies were stashed, the pair had stumbled upon a gold mine of information."
MEX_VEN.42.a: "And it wasn't even noon yet."

MEX_VEN.43.t: "First Thing in the Morning"
MEX_VEN.43.desc: "The ringing of the phone startled Villalba and his wife awake. Rubbing his eyes as he fumbled around in the dark, Villalba reached over to his nightstand and brought the phonepiece to his ear. It was the director of DIGEPOL on the other end. "Sir, you need to come downstairs, the Minister of Defense and I are in the main room of Miraflores. It's urgent." Villalba took a moment to register the words as his brain caught up to his body, before heading downstairs in his pajamas.\n\nWhen he arrived in the room, Villalba's grogginess had mostly faded, and he felt exposed as he saw the sharply dressed men ready to greet him. The sky outside the windows was still pitch-black. As Villalba sat down, he asked, "So what's so important that you've woken me up at 3 in the morning?"\n\n"As you are aware, DIGEPOL and the DFS have been monitoring the growth of a conspiracy within the army following you announcing your reforms. The conspiracy is set to launch their coup in just half an hour," Villalba swore he felt the room lurch a bit at the news, "They seem to have been hoping they'd catch us off-guard, but we've already placed units and roadblocks on their planned paths, and set an alert for all loyal units to intercept and arrest conspirators on sight, wherever they are."\n\nVillalba's head was still spinning a bit from it all when the Minister of Defense handed him a coffee. Villalba stared at it blankly for a moment before asking, "Wait, that's good news. What is this coffee for, then?"\n\nThe DIGEPOL director laughed, "We figured you'd need something to wake you up. After all, you'll want to address the nation once we've bagged the conspirators, right?"\n\nVillalba smiled, "Yes, yes, I guess I will. Thank you, gentlemen, and thank God for this wonderful news.""
MEX_VEN.43.a: "Now if you'll excuse me, I'll be heading back upstairs."

MEX_VEN.44.t: "A Different Kind of Address"
MEX_VEN.44.desc: "Villalba sat in Ayacucho Hall, rereading his planned address over and over again, making occasional tweaks along the way. It wasn't something he did often, but on such a special and important occasion, he believed that his address had to be perfect.\n\nMost presidents would stand before the nation and give a grand victory speech full of inflammatory, machista rhetoric after thwarting a coup. That wasn't what Venezuela needed right now. While he would denounce the armed forces, he'd place emphasis on the importance of his reforms and the need to implement them to their maximum effectiveness.\n\nAccording to the clock hanging above him, it was around 7:00am. Only a minute or so later, a staffer told him he was on air. It was time to begin.\n\n"Good morning, Venezuelans. A few short hours ago, a conspiracy within the armed forces attempted to overthrow our nation's government. They had attempted to storm the streets of Caracas, but fortunately were apprehended before any serious harm could be inflicted. These conspirators sought to use their place within the military to interfere into our democratic process, and overturn the will of the people. It is an abuse of their power of the highest order, and behavior that is incompatible with a stable, progressing, and democratic Venezuela."\n\n"That's why I call upon you, the people. It is only through your support that we can limit the army, to ensure that they will not interfere with politics. This conspiracy was launched in order to stop the reforms I had planned to limit the military's power within our politics, and it is only through the complete implementation of those reforms that we can safeguard our democracy from those who would seek to topple it.""
MEX_VEN.44.a: "Thank you, God bless you, and may God bless Venezuela."

MEX_VEN.45.t: "Driving Against Traffic"
MEX_VEN.45.desc: "The last notes of the saxophone remained behind the heavy doors of the elite club in Chacaíto. Don Arturo, a well-known lawyer in Caracas, paid for his share of the tab and generously tipped the waitress, whose green eyes lit up with a wide smile. Adjusting his brown felt hat, he stepped into the cool night, anticipating the soft seat of his Cadillac. But instead of the silence of the pre-dawn city, he was met with a low, vibrating rumble that rattled the glass in the shop windows.\n\nThe street was clogged with iron. Canvas-covered trucks, APCs, and even light tanks crawled past, filling the air with blue-grey fumes. Soldiers in full gear roughly pushed indignant revelers back onto the sidewalk.\n\n"What the devil?" - Arturo grabbed the sleeve of a running sergeant. "My driver is on the other side! What circus are you running here?"\n\nThe soldier, eyes wild with adrenaline, barked. "Emergency situation! An attack on the Fuerte Tiuna barracks in the south. All combat-ready units are on alert. Move back, Señor!"\n\nThe lawyer stepped back, trying to focus his drunken gaze. South. Fuerte Tiuna. That made sense. But then he looked at the road.\n\n"Wait, son..." he muttered, pointing a shaky hand at the convoy of trucks rushing past. "If the fight is in the south, why are these vehicles heading north? Straight into the city center?"\n\n"That's... reinforcements! Reserves!" shouted the soldier, already jumping onto the running board of a departing Dodge.\n\nArturo was left standing in a cloud of exhaust fumes. "Reinforcements" driving away from the battle? The alcohol in his blood said everything was fine, but his survival instinct, honed by years of legal intrigue, whispered that something very, very wrong was happening in Caracas tonight."
MEX_VEN.45.a: "The military's compass is clearly broken."

MEX_VEN.46.t: "The Cage Snaps Shut"
MEX_VEN.46.desc: ""¡Señor Jóvito Villalba!"\n\nThis guttural shout, devoid of any respect, tore through the viscous silence of pre-dawn Miraflores like a gunshot. It was 4:30 AM. The Venezuelan Presidential Guard, stumbling from sleep, rushed to the main entrance, only to find there was nothing left to defend. The gates were wide open, the perimeter breached without a single shot fired-the cruel irony of "night maneuvers" that had led loyal garrisons south left the heart of power exposed.\n\nIn the vestibule, the guardsmen found themselves chest-to-chest with a forest of rifles from an entire infantry company. "Lower your weapons! No one gets hurt if you don't do anything stupid!" barked a rebel officer.\n\nA solitary figure appeared at the top of the marble staircase. Villalba descended slowly. Slightly disheveled, without a tie, but in his invariable business suit, he tried to maintain a shred of presidential dignity in the face of an armed mob. Below, not dialogue, but an ultimatum awaited him. The coup leader, not even bothering with a salute, unfolded a crumpled sheet of paper and began reading a list of demands from an unknown General.\n\nWith each point, Villalba's face grew longer. It was not a political manifesto, but a surreal collection of absurdities canceling the constitution.\n\n"I will not sign this paper, Captain," the President cut him off quietly but firmly. "This is madness."\n\nThe officer sighed with feigned sadness, tucking the paper into his pocket. "In that case, regrettably, you are under arrest, Señor. You will remain here, under supervision, until further notice."\n\nThe heavy bolt of the main doors slammed into place with a clang. The sound of the cage snapping shut echoed off the high ceilings of the palace."
MEX_VEN.46.a: "Democracy died with the sunrise."

MEX_VEN.47.t: "How Did We Come to This?"
MEX_VEN.47.desc: "The VIP lounge of the Mexico City International Airport resembled a cold, modernist cavern. Endless rows of concrete columns stretched into the distance, reflected in the mirror-like sheen of the terrazzo floor. Beyond the panoramic windows, airliners with VARIG and SAESA logos roared into the sky, carrying happy people off to their quiet lives.\n\nVillalba sat motionless, mechanically stroking the head of his sleeping child. The booming echo of dispatcher announcements mingled with his wife's quiet sobs, but to Jóvito, the noise sounded as if it were coming from underwater. One thought pounded in his head: "Where did I go wrong?"\n\nJust twenty-four hours ago, he woke up in Miraflores as the President of a sovereign nation. And then reality crumbled: tanks under the windows, humiliating house arrest, and that slick colonel with the deportation order. "Leave immediately, for the sake of your children." And here he is, in a foreign country. What about his parents? His wife's family? The ministers left in Caracas to be torn apart by wolves?\n\nLeaden fatigue weighed on his shoulders, his eyes were closing, but Villalba's gaze accidentally caught the TV screen in the corner. Through the veil of exhaustion, the image of a news broadcast emerged: the new junta leader shaking hands with... the Iberian delegation. Smiles, embraces, promises of eternal friendship. He recognized the shit-eating grin of Matías Vega Guerra, the Iberian ambassador, which now looked down almost mockingly at him.\n\nVillalba felt as if he'd been struck by lightning. Those two bastards... Franco and Salazar. They were in on it from the start. They knew every step and recognized the usurpers before the corpse of democracy had even gone cold. Villalba buried his face in his hands, feeling his impotent rage dissolve into a black, hopeless void."
MEX_VEN.47.a: "What can man do against such reckless hate?"

MEX_VEN.48.t: "The Price of Peace"
MEX_VEN.48.desc: "TOP SECRET // OCAE OPERATIONAL SUMMARY\nSUBJECT: Domestic Reaction to the Essequibo Negotiations\n\n1. President Rafael Caldera's diplomatic maneuvers are bearing fruit. His "silver tongue" and policy of appeasement are resonating strongly with the urban elite and business circles of Caracas. For them, the normalization of relations with Guyana and its backers is the key to Western markets and investments. Optimism reigns in the offices of the capital: peace promises to be profitable.\n\n2. However, our agents are recording a critical rise in tension within "patriotic" organizations and the officer corps. What businessmen call pragmatism, nationalists brand as high treason. To them, the Essequibo is a sacred part of "Greater Venezuela," amputated by colonialists.\n\n3. Any compromise is perceived by these groups as capitulation to the "English usurpers." The rhetoric at closed meetings is shifting from criticism to direct calls to "save the nation's honor" by force. We are witnessing the consolidation of radicals willing to set the country on fire just to keep the ink from drying on a peace treaty.\n\n4. RECOMMENDATION: Initiate a heightened alert status for the residency in Caracas. Caldera's diplomatic triumph could become the detonator for an armed uprising."
MEX_VEN.48.a: "Peace for some is treason for others."

MEX_VEN.49.t: "Thunderous Applause and Grinding Teeth"
MEX_VEN.49.desc: ""...For the greatness of a nation is measured not by the caliber of its guns, but by the firmness of its moral obligations," Rafael Caldera's voice, amplified by the speakers, floated over the OAS assembly hall, hypnotizing the delegates. The President paused, sweeping the room with his gaze. "Next month in Port of Spain, we will meet with the leaders of Guyana and Canada to close the chapter of enmity forever. I thank our friends from Washington and, of course, our partners in the Veracruz Pact for their invaluable assistance in this dialogue."\n\nCaldera took a deep breath, preparing to deliver the decisive blow. "To prove to the world that our intentions are pure, I announce: tonight I will sign a decree for the full, indefinite withdrawal of the Venezuelan Armed Forces from the disputed borders."\n\nThe hall exploded. Diplomats leaped from their seats, giving the peacemaker an ovation worthy of a rock star.\n\nBut the Mexican representative did not clap. His sharp gaze was fixed on the figures behind the President's back - the escort officers in dress uniform. He saw how the cheek of the colonel on the left twitched. How his knuckles turned white as they gripped the hilt of his ceremonial saber. In this sea of elation, the men in uniform stood like rocks against which the waves of applause broke. In their eyes, there was no thought of peace.\n\nOnly one word could be read there, written in the blood of their ambitions: "Betrayal.""
MEX_VEN.49.a: "He hears the applause, but he does not hear the knives being sharpened."

MEX_VEN.50.t: "Report on the Civil War in Venezuela"
MEX_VEN.50.desc: "DIRECCIÓN FEDERAL DE SEGURIDAD\nISSUE: Communist Uprising in Venezuela\n\n5 hours ago, FALN-FLN troops in Venezuela seized control of Ciudad Bolívar and several other cities in the East, after the front declared a general uprising against the government. Sympathetic civilians have assisted the rebels in their offensive, allowing them to seize almost the entire east in a matter of hours. Despite the FALN intending a swift, large-scale revolution across the country, units in the west appear to have been pushed back to the Andes, allowing the central government to survive and reconsolidate. However, the uprising has escalated into a full-scale civil war.\n\nThe FALN has been a thorn in the side of the government since their formation in 1961 and formalization in the following year. Once considered marginal, the success of leftist movements in the Americas, along with civilian support from within, has emboldened them. Guerrilla operations also plague the countryside, and are expected to intensify as the war goes on.\n\nIt is imperative to our nation and the Veracruz Pact that we destroy the communist movement. Venezuela is a staunch ally of Mexico and a vital economic partner, holding the largest oil reserves in the world. Should they fall, our interests in the northern Andes and Caribbean will be greatly threatened, and our economy will undoubtedly suffer. Furthermore, the war must be ended quickly, as analysts predict that over time, the communists will only get stronger.\n\nVery respectfully,\nFernando Gutiérrez Barrios"
MEX_VEN.50.a: "Caracas must hold."


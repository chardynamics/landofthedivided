 ##News Events
 
 HON_news.1.t: "[Get_newspaper_header]Honduran Military Announces Temporary Junta"
 HON_news.1.desc: "In the early morning hours, Honduran soldiers seized radio stations, including the popular 'Voice of Honduras', to broadcast General Oswaldo López Arellano announcing the annulment of the elections and the imposition of a military junta "until national stability is restored." President Villeda Morales was once again deposed by troops marching amidst the colonial architecture of the Central District.\n\nThe coup was precipitated by a breakdown in Honduras' two-party structure. Modesto Rodas Alvarado, the Liberal candidate, alienated his party's elite backers with a left-leaning platform, while the National Party grew increasingly divided between pro- and anti-U.S. factions. Already, figures from the pro-U.S. Nationals have announced their support for the coup, as Arellano is believed to desire continued alignment with Washington, a major supplier and trainer of the Honduran military.\n"
 HON_news.1.a: "A la orden."
 HON_news.1.b: "They call them chafas for a reason."
 HON_news.1.c: "The only surprise is that Villeda Morales lasted this long."
 
 HON_news.2.t: "[Get_newspaper_header]Military Nationalists Coup Honduras"
 HON_news.2.desc: "The humiliating defeat in the recent 'Football War' became a death sentence for Honduras's fragile democracy. Amidst the mounting chaos, the armed forces struck.\n\nIn his address to the nation, Melgar Castro bluntly stated that the republican experiment had failed. According to him, weak politicians, forever seeking the protection of foreign powers, had failed to defend the country's honor. Now, power has passed to 'true patriots'. The junta promises to drag Honduras out of poverty and humiliation with an iron fist, building a prosperous state.\n\nHonduras's neighbors and international observers are watching the situation with overt anxiety. The openly revanchist rhetoric of the new government in Tegucigalpa threatens to undermine the already fragile balance of power in Central America.\n"
 HON_news.2.a: "Our firmest ally in Central America becomes a bitter foe."
 HON_news.2.b: "A bitter and bloody echo of the 'Football War'."
 HON_news.2.c: "The neighbors should double their border patrols."
 
 HON_news.3.t: "[Get_newspaper_header]Socialist Revolution in Honduras"
 HON_news.3.desc: "Socialist forces under the command of Lorenzo Zelaya have established control over Tegucigalpa, marking the collapse of the former Honduran regime. Shortly after, Zelaya announced the creation of a new government and the launch of a large-scale agrarian reform program. Initial decrees mandate nationalization of key infrastructure, including the assets of the Tela Railroad Company, as well as the expropriation of unused lands belonging to foreign agricultural corporations.\n\nThese actions provoked an immediate reaction: a rapid outflow of American capital, mass evacuation of foreign specialists, and a sharp increase in the budget deficit. The formation of an openly anti-American government in Honduras and the confiscation of private property threaten market stability in Central America, leaving open whether the new authorities will be able to cope with the looming financial crisis.\n"
 HON_news.3.a: "Yet another banana republic turns red."
 HON_news.3.b: "The land finally returns to those who work it."
 HON_news.3.c: "Naked idealism will not feed empty stomachs."
 
 HON_news.4.t: "[Get_newspaper_header]Honduras Joins the OFN"
 HON_news.4.desc: "This morning, speaking before an immense crowd in the shade of the trees in La Leona Park, Modesto Rodas Alvarado officially announced Honduras's entry into the Organization of Free Nations as a full member. This triumph of democracy has caused a real sensation in the United States. The American press is already calling him a 'true liberal caudillo,' and Time magazine has put his portrait on its cover.\n\nWashington is jubilant, having secured not just a loyal, but an ideologically aligned ally. However, this idyll is not absolute: ambitious public works projects and the strengthening of the Honduran labor code are already provoking quiet irritation in the boardrooms of United Fruit and other American companies. But today, these voices are drowned out by the festive roar - the OFN crows that the alliance of the free world has grown one nation stronger.\n"
 HON_news.4.a: "A new Roosevelt south of the American border."
 HON_news.4.b: "How soon will United Fruit try to clip his wings?"
 HON_news.4.c: "I'm shaking in my boots."
 HON_news.4.d: "A longtime follower becomes an ally."

 HON_news.5.t: "[Get_newspaper_header]Honduran President Rodas Alvarado Inaugurated"
 HON_news.5.desc: "Following a tightly contested election between the Liberal Party's Modesto Rodas Alvarado and National Party's Ramón Cruz Uclés, the incumbent Liberals prevailed, with current president Villeda Morales happily turning power over to his chosen successor.\n\nTensions haunted the entirety of election season, stemming from the possibility of military intervention due to the Honduran Armed Forces' unease with Modesto Rodas Alvarado's progressive rhetoric, but such fears never materialized. Alvarado's vision for Honduras includes programs modeled after former American President Roosevelt's New Deal. Modesto Rodas Alvarado has already begun talks to strengthen Honduras' relationship and ties with the United States. Rumors have already spread throughout Tegucigalpa that Alvarado plans on eventually growing these ties into an OFN application.\n"
 HON_news.5.a: "Liberty's light reaching Central America."
 HON_news.5.b: "Upsetting, but workable."
 HON_news.5.c: "American power reinforced."

 HON_news.6.t: "[Get_newspaper_header]Honduran President Cruz Uclés Inaugurated"
 HON_news.6.desc: " Following a tightly contested election between the Liberal Party's Modesto Rodas Alvarado and National Party's Ramón Cruz Uclés, the National Party has pulled off a surprising upset. Outgoing president Villeda Morales' legacy of liberalizing Honduras and expanding ties with the United States is on the rocks following his Liberal Party's loss.\n\nRamón Cruz Uclés secured victory campaigning against these ties and arguing for an independent Honduran foreign policy. However, given the United Fruit Company's intertwining into the bedrock of the Honduran economy, and the United States being the main supplier and backer of the Hondurian military, the Americans remain a significant presence in the country . While the political winds may have blown slightly off course, Honduras will still remain a bastion of American influence in Central America.\n"
 HON_news.6.a: "Uclés might need to recheck his beliefs."
 HON_news.6.b: "Washington's puppet begins to slip away."
 HON_news.6.c: "Americans rebuked, slightly."
 
 CA_Football_War.2.t: "[Get_newspaper_header]Football War Ends, Honduran Forces Bloodied"
 CA_Football_War.2.desc: "Central America reels as the short-lived "Football War" concludes. The night before the 1970 FIFA World Cup qualifier between Honduras and El Salvador saw the latter cut off diplomatic relations with the former, citing the recent expulsion of many Salvadorans within Honduras as a genocide. Ensuing border skirmishes escalated into a short, brutal conflict.\n\nThe Honduran military, despite aid from the United States in recent years and its supremacy in the air and numerically, was forced to retreat from the border to new positions around Tegucigalpa. The nation's south lay open to El Salvador, the more wealthy and industrialized of the two. However, fuel shortages limited the Salvadoran advance, prompting a negotiated settlement. Honduras will guarantee the rights of Salvadoran migrants as well as pay reparations - terms the poor and divided Honduras may struggle to cope with.\n"
 CA_Football_War.2.a: "And El Salvador qualified with a 3 - 2 as well!"
 
 CA_Football_War.3.t: "[Get_newspaper_header]Honduras Wins the Football War"
 CA_Football_War.3.desc: "Central America reels as the short-lived "Football War" concludes. The night before the 1970 FIFA World Cup qualifier between Honduras and El Salvador saw the latter cut off diplomatic relations with the former, citing the recent expulsion of many Salvadorans within Honduras as a genocide. Ensuing border skirmishes escalated into a short, brutal conflict.\n\nEl Salvador's wealth and industrialization was unable to be translated into military successes. The Honduran military, benefiting from US development and supremacy of both air and numbers, was able to break Salvadoran lines and threaten San Miguel, prompting El Salvador to request a negotiated settlement. Alongside indemnities, Salvador must cede valuable resource rights on the border and accept the mass repatriation of Salvadoran migrants - terms that may be difficult for the Salvadoran public to accept.\n"
 CA_Football_War.3.a: "At least El Salvador got the World Cup qualifier victory..."

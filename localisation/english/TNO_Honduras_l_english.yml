 #Leaders
 HON_Ramon_Villeda_Morales: "Ramón Villeda Morales"
 POLITICS_HON_Ramon_Villeda_Morales_DESC: "Some in Honduras call Ramón Villeda Morales boring. They hear no booming speeches, no cries for the people, and no threats to his enemies. He is not young, his hair is graying, and he wears a freshly pressed suit instead of the traditional attire of the campesino. Yet, those who say this do not know their president at all.\n\nMorales's calm exterior hides a political acumen built from both poverty and privilege, unlike most in the country. His parents, despite their humble means, sent him to study, where he excelled to the point he was able to attend Humboldt University in Berlin on the eve of the Second World War. The tight-knit and well-meaning world of his upbringing was shattered by the state-mandated hate of the NSDAP, hearing the night raids of apartments or the screaming voice of Hitler over the airwaves. His disdain of the brutality and corruption led him to join the PLH in Honduras, where he rose through the ranks until he found himself the victor of the 1960 elections, but the loser of a subsequent coup.\n\nYet decades of goodwill seemed to convince God to force the military to step down, and allowed him to return to power. With this in mind, Morales does keep his mouth shut, but doing so allows him to sign the laws that he knows will help his people from corruption, poverty, and exploitation. To Morales, he and his country can only march forward, never back, no matter the pace or size of their step."
 HON_Modesto_Rodas_Alvarado: "Modesto Rodas Alvarado"
 POLITICS_HON_Modesto_Rodas_Alvarado_DESC: "Modesto Rodas Alvarado has worked tooth and nail to bring himself to the presidency of the Republic. Born on March 15, 1921, in the small, humble town of Sabanagrande, Alvarado was pushed by his family to study and move on to greater things than the rural world he grew up in. After growing up, he moved on to University, but political instability forced him and his family to flee to Nicaragua. Yet he refused to stop studying.\n\nWhen he returned to his home country, he was privy to the plight of his people: poor masses working on the vast lands of the fruit companies, the beggars in the streets, and the antiquated homes of those lucky enough to live in the cities. Yet Alvarado saw a different solution, one inspired by his generation's front row seats to the death of Gaitán, Batista's coup, and the descent of his continent into dictatorship. Alvarado threw himself into the ranks of the Liberal Party, where his charisma and dedication to his people paved the way to the presidency of the National Congress, where he proved to be the force behind Morales's steady reforms.\n\nWhen the elections came, there was only one natural choice for the PLH. Alvarado walks into the presidential office with the passion of the generation of Gaitán, holding his people, his landscapes, and democracy close to his heart, determined to break the corrupt traditions of his country, or condemn it to that past for good."
 HON_Roberto_Suazo_Cordova: "Roberto Suazo Córdova"
 POLITICS_HON_Roberto_Suazo_Cordova_DESC: "In a land rife with coups, colonels, and caudillos, many overlook the equally treacherous battle that is democracy. Yet, on the USS Honduras, wars are not solely fought with rifles, they are fought with words on the battlefields in the minds of those who attempt to govern it. One would look at Roberto Córdova and think that his upbringing as a physician and his right-hand position to Rodas Alvarado within the Liberal Party would have made his life or career easy. They would be wrong.\n\nWhen Alvarado stepped down as head of the Liberal Party, the torch smoothly passed onto Córdova, a man of Rodas's generation who witnessed the same events. He knew the common man's struggle, and like Morales, he was a physician, making him the perfect man for the Liberal political machine. Ascending to the presidency, Suazo thought it may have been too good to be true, and he was correct. Central America is not the subdued land it once was. It is rife with guerrillas, disgruntled peasants, and men who have taken to its dense jungles to fight for their view of justice, usually painted in a coat of red.\n\nIt is now up to Córdova to balance the impossible: those in Washington and the National Palace who implore him to send the army, quell the guerrillas, secure the border, and the angel on his shoulder who begs him to think of the poor, and ensure the protection of human rights in his country. Perhaps the road to the presidency was pleasant, but now facing an ever-changing world, his road to keeping it may collapse."
 HON_Oswaldo_Lopez_Arellano: "Oswaldo López Arellano"
 POLITICS_HON_Oswaldo_Lopez_Arellano_DESC: "To any student studying the history of Latin America, Arellano would seem like the cookie-cutter tinpot dictator, but the truth is much farther from that. Arellano is not an uneducated brute, forcing himself into the presidency. As a matter of fact, he grew up in an influential family, but left his cushy life in Tegucigalpa and joined the army at 18, just on the eve of the Second World War in Europe.\n\nCarías's presidency instilled within him the fierce nationalism of the Old World for his own country, and, utilizing his education and fluency in English to study in the United States, he became close with his future benefactors. When the National Party began to disintegrate, Arellano lamented the fall of the man he attributed to Honduras's development and prominence. When Carías declared the military to be the inheritor of "nacionalismo," this attempt to bring the military to his side did much more for the soon-to-be General. To Arellano, it was a calling, one to save his hero and his homeland.\n\nArellano did not become "president" to enrich himself or soak in the glory of power. Arellano is committed to saving his country from whatever he deems a threat. Politics, legality, corruption, damn it all to hell. Arellano will make Honduras rich, he will make it safe, and he will make it the envy of its neighbors. Arellano is here to do what must be done, no matter what it takes, for his people, for Carías, and for his country."
 HON_Juan_Alberto_Melgar_Castro: "Juan Alberto Melgar Castro"
 POLITICS_HON_Juan_Alberto_Melgar_Castro_DESC: "Imagine you were born into abject poverty. You work menial jobs, hoping to have enough money to eat every day. You decide your only way out of poverty is to join the army, so you show up to the first day of training in sandals when all of your comrades have shoes. Imagine you are the only indigenous man in your unit. Your comrades expect a redskin savage, pounding on war drums while screaming out unintelligible warcries. Imagine instead that you excel in military school, demonstrate leadership capability not expected of your race, and a personal discipline that would make any general blush. You are Juan Alberto Melgar Castro.\n\nMelgar found solace in the discipline and bare necessities given to him by the army. He was inspired by Carías's speeches, how the army was the inheritor of nationalism, how he himself was a continuation of the great Mayan peoples, and how he was the future of his country. That future was shattered by bleeding heart liberals and corrupt, spineless imbeciles who were accidentally made generals. Yet he stayed quiet, following orders, until he could no longer. When his country was humiliated, even violated by the Salvadorans.\n\nHis country had come far from what it once was. It bent over backwards for gringos who never set foot on its shores. It grew fat on corruption. It degenerated into something Melgar could not bear to watch, and remembering the speeches that propelled him out of poverty, he knew only he could be the one to save it."

 HON_Ramon_Ernesto_Cruz_Uccles: "Ramón Ernesto Cruz Uclés"
 POLITICS_HON_Ramon_Ernesto_Cruz_Uccles_DESC: "In Maslow's Hierarchy of Needs, once a human has their basic necessities, they begin to yearn for more. Carías brought Honduras development, giving the people infrastructure and lifting them from crushing poverty, something Uclés saw growing up in Cantarranas. When the people began to reach for more, the PLH welcomed this idealistic and starry-eyed generation into its ranks. Uclés is of this generation, but he is not one who decries the "corrupt" and "brutal" methods that fulfilled those needs. On the contrary, he champions them even after they fell out of style.\n\nUclés has seen what this irrational idealism does to nations. He remembers his university years in Guatemala City fondly, and laments seeing the chaos of coups and riots brought by those who have the right intentions, but lack the means to carry them out. One cannot rip the system apart; they must work with it. It was not a dream that brought Honduras this far, but reality, of which Uclés is an expert. His time on the Supreme Court taught him that the corruption of politics was just the oil necessary to keep the gears turning, that even those who bled blue and white would engage in the habit. Although he personally refrains from the practice, he does not wish to rain hellfire down on those who do. He was elected to better his country, not its system, and he is determined to do whatever it takes to bring his country the best. No more puppetmasters, no more exploitation, and no more a country where the elderly need to beg as they do on the streets of his hometown."
 HON_Andres_Alvarado_Puerto: "Andrés Alvarado Puerto"
 POLITICS_HON_Andres_Alvarado_Puerto_DESC: "Andrés Alvarado Puerto was born into wealth and prominence. He never suffered as a child; he was sent to the best schools. He studied alongside many of the lions of the Honduran Liberal Party, instilling in him a fierce belief in helping the poor. Why, then, is he on the ticket of the National Party, his great enemy for his entire political career?\n\nWhile Andrés was denied the exposure to Honduran poverty his compatriots experienced, Puerto still broke through the bubble of wealth and fantasy. Years of schooling on the Ten Commandments, the importance of integrity, and the just hand of God thrown out of the window. What did it matter? Lifting up the hood, Puerto saw the true power political corruption and cultural patronage had in his country, and he felt helpless. He stood there when his party lost the 1966 elections, and he watched, disassociated, as the party whose ideals he held and fought for disintegrated. He was faced with a choice: to stay or to jump ship. To save his career or fight the futile struggle for his ideals. Ideals weren't what made his family rich.\n\nWhen he jumped, Puerto only changed the party he was registered under. Puerto holds the same beliefs as he did when he worked with Villeda Morales, never losing the commitment to his people and their welfare. What he lost was his honor, standing disgusted atop a machine of corruption that he cannot stop. Yet, the visceral feeling fades when he closes his eyes and imagines the family who finally replaced their thatch roof or dirt floor thanks to his latest bribe."

 HON_Lorenzo_Zelaya: "Lorenzo Zelaya"
 POLITICS_HON_Lorenzo_Zelaya_DESC: "Honduras may have had social stigma, but it was never codified that peasants would be peasants and the rich would be politicians. Yet, for those peasants lucky enough to read, they noticed the same last names and facial features in the papers. When the American companies put radios in the warehouses and canteens, the youth began to listen to the speeches from Guatemala, Colombia, and Cuba, and they began to get ideas. Unions formed, figures emerged from the brown masses, and the most recognizable one became Lorenzo Zelaya.\n\nFrom strikes, to riots and protests, Zelaya has been at the head of it all. At 29, Zelaya formed the first national peasant's committee in the entire country, and promptly led a march in protest of the Tela Railroad Company seizing the lands they lived and worked on. After its success, Zelaya pushed harder, using paralyzing strikes to force the government's hand in enacting agrarian reform. Yet, such power wielded in the hands of a leftist has never gone well in Central America, even when the president has their interests in mind. That's when the soldiers came, and the "reformist" president approved the killings of the men Zelaya grew up with.\n\nFor years, he lived in the jungles with the poorest of the poor, running for his life, praying the olive green men didn't reveal themselves with the sunrise. He saw and lived the plight of his people, and committed himself to finding the political cure to their suffering. When the situation in the capital deteriorated, he finally saw an opportunity: liberation. Liberation from the rifle butts and poverty. A chance to storm the streets and make his hollowed-out country whole again."

 ##National Spirits
 HON_USS_Honduras: "USS Honduras"
 HON_USS_Honduras_desc: "Nowhere else in Central America can such an absolute loyalty to their Yanqui masters be found than in Honduras. Despite the existence of a national government, nearly every politician is at the beck and call of their backers in Washington, but this loyalty is not without its benefits.\n\nIn exchange for their subservience, the US Army stations their soldiers around the country suppressing revolts before they start, they patrol the skies watching for Japanese spycraft, and dock their ships in our harbors protecting Honduran commerce from Dominican piracy.\n\nThis unique relationship seems to be here to stay, but if some national tragedy were to befall Honduras, their symbiotic co-existence may be changed irreversibly."

 HON_Banana_Kings: "Banana Kings"
 HON_Banana_Kings_desc: "United Fruit. Coca-Cola. Standard Fruit. These names are well known throughout the region. Like in many Central American countries, they dominate the economic sphere - but nowhere else do they do so like in Honduras. Over half of the country's arable land is owned by megacorporations, who rule over the national economy as if they were kings, but the time of empires in the region ended long ago.\n\nThey forget they do not rule over medieval peasants, but conscious workers who look to the world around them for inspiration. As time passes, workers unionize and nationalistic sentiment grows in the country, and despite their less draconian treatment of workers compared to other countries, there may come a day when the sun finally sets on the Banana Kings, but that day is not anytime soon."

 HON_Creeping_Colonels: "Creeping Colonels"
 HON_Creeping_Colonels_desc: "The modernization of the military under President Gálvez has ensured the Honduran military is ready to face the dangers of the Cold War. However, the brief period of military rule in 1960 led the military to amend the constitution, installing their commander-in-chief as a general, rather than president.\n\nThis lack of civilian control has turned it into a highly toned and effective political weapon able to serve its own interests and one of the most institutionally strong and trusted in Honduras. Perhaps if a politician dares to deviate a bit too far from the beaten path, these eager officers will launch themselves to restore stability, as they seemed far too eager to do in 1960."

 HON_Border_Tensions: "Border Tensions"
 HON_Border_Tensions_desc: "El Salvador and Nicaragua continue to occupy territories claimed by Honduras, and every good Honduran knows it is their duty to retake them. Furthermore, their neighbors compete with them economically, hampering their own attempts at industrialization and modernization. Specifically, El Salvador, whose rampant overpopulation has caused a spillover into the Western territories, taking much of the scarce available land the native Hondurans could live on.\n\nAs tensions rise in these areas, and their respective governments have made no attempt to help them rectify the situation, Hondurans know that these are no friends of theirs, but merely wolves in sheep's clothing."

 #Liberal Path
 HON_Honduran_Gaitan: "The Honduran Gaitán"
 HON_Honduran_Gaitan_desc: "With the victory of Alvarado and the Liberal Party, Honduras has proved to itself that, despite its neighbors and its own history, democracy can survive in the region. Alvarado shines as a gleaming example of a Central American ally that is not ruled by some oppressive strongman, but a dedicated democrat who plans to embark on a crusade of slow, steady reformism.\n\nAn admirer of the New Deal, Alvarado plans to expand public works and social programs to alleviate the poverty and underdeveloped regions of the country, as well as expand greatly on its ties to the OFN.\n\nHowever, he may find some struggle with the UFC and American interests in the country, despite his warm welcome by the Yanks to the presidency."
 #Oligarch Path
 HON_If_It_Aint_Broke: "If It Ain't Broke..."
 HON_If_It_Aint_Broke_desc: "For over 16 years, Tiburcio Carías Andino held the title of president of Honduras. Much of the relative stability, economic progress, and our entire foundation as a country can be attributed to him and his policies. Why would we change the system? It seems every time the country strays from the path he set out for us, there is a national tragedy. The liberals even sell our politics out to the Yanquis.\n\nNow, the people have spoken. They don't want new paths or lofty ideals. They want practicality. They want work, stability, and peace, and that is what Ramón Uclés and the PNH seek to bring to Honduras: An independent, stable nation. If the system isn't broken, why try to fix it?"
 #Military Path
 HON_Just_Like_Anyone_Else: "Just Like Anyone Else"
 HON_Just_Like_Anyone_Else_desc: "Honduras, for much of its recent history, saw relative political stability unlike their neighbors. However, the past two years have seen a rapid decline of this American-backed blessing.\n\nOnce again, the PLH and the PNH can't see eye to eye on anything and have brought the country to a standstill. Once again, with the blessing of the Americans, the military has stepped in to close the curtains on our national Greek tragedy.\n\nOnce again, Oswaldo Arellano stands before the nation, swearing a return to democracy and to stability, repeating the same statements he made in 1960. He has already embarked on a campaign of restructuring the regime to make it even more pro-American than it already is. As the Honduran people watch history repeat itself before them, they cannot shake the feeling that they have become like any other banana "republic" around them."

 #Football War Liberal Win
 HON_Sobreviviendo: "Sobreviviendo"
 HON_Sobreviviendo_desc: "When one looked at a map, they would assume Honduras had the upper hand in the Football War, just by the size of our country versus that of El Salvador. The reality was quite different. We were the underdog, the less populated, less industrialized, and far less developed state. Yet, by the grace of God, our people, and our benefactors, we have triumphed over the Salvadorans, and though the ceasefire may claim "status quo ante bellum", we know exactly who won.\n\nReparations flow into the national treasury, and Salvadorans begin their hike back across the border, while in Tegucigalpa, crowds cheer in the plazas and parks of the country. It seems politics have dissolved into national pride, and perhaps the misfortune of the decade will melt away into history. Against all odds, Honduras has survived."

 HON_La_Republica_Liberal: "La República Liberal"
 HON_La_Republica_Liberal_desc: "Honduras has proved to the world that an American-backed state in the world's backwater doesn't have to be some strongman, impoverished dictatorship. President Alvarado is hailed as the Honduran FDR, a shining star of liberalism in a dark sky of despots.\n\nHis republic has consolidated a system of liberal democracy after years of struggle to break through the corruption and strongman culture within the country, even managing to restore civilian control over the military, leading men like Arellano to lose their influence in the country.\n\nIt's rumored that the young, but stable democracy plans to join the OFN, joining the crusade against fascism and authoritarianism, as Honduras stands proud and tall, side by side with the greatest democracies of the world."

 HON_King_Banana_Queen_Land_Reform: "King Banana and Queen Land Reform"
 HON_King_Banana_Queen_Land_Reform_desc: "Any expert could tell you that the outright exploitation of Honduras by the United Fruit Company, Coca-Cola, and megacorporations alike was incompatible with democracy. That expert is right, as the specter that haunts them has come: Land Reform.\n\nHowever, the strongly pro-American regime does not seek to chase the companies out with machetes in hand, as over half of their country is owned by them. Instead, the government seeks to co-exist with them, to find a more equal solution for the people of Honduras and the companies that employ them.\n\nThe sun has set on the Banana Kings, but they have not been ousted from the throne, but joined by their new queen."
 #Football War Oligarch Win
 HON_Viva_El_Cariacismo: "Viva el Caríacismo"
 HON_Viva_El_Cariacismo_desc: "Since their election in 1966, the PNH has faced pushback on its "independent" foreign policy program and expansion of government powers. Claims of "reactionary politics" fell on deaf ears when their policies were proved correct when Honduras defended itself. Reform has been tried, but it failed. The military tried to take power, but failed. It is only tradition, with its tried and true methods, that can lead the nation to prosperity.\n\nWith their victory, the people have allowed the PNH to return to its former, more corrupt style of governance without any complaint. Their construction of a new, local investor class and Honduran economic cartels has given them a loyal base.\n\nIt seems for the majority of people that the bare necessities of life the PNH has provided for them have led to their consent to rule how they wish. For as long as Honduras can continue chugging along, the legacy of Caríacismo will remain in power."

 HON_Leaving_the_Nest: "Leaving the Nest"
 HON_Leaving_the_Nest_desc: "The PNH, influenced by their more nationalistic factions, set out on a crusade of creating an independent foreign policy for their country. Aligning with some of the barons, the government has attempted to consolidate small industries and other economic assets under their wing under the guise of "self-determination".\n\nWhile economically, the PNH and Honduras will likely remain under the American thumb, President Uclés has tried his damn hardest to pursue a less fervently pro-American diplomatic position."
 HON_Leaving_the_NestEffect: "§FThe §mAmerican-aligned§! faction withing the§! §sPNH§! is [Get_HON_PNH_Alignment_tt]"
 HON_PNH_Alignment_low_tt: "§VFeeling the§! §KInstitutional Revolution§!"
 HON_PNH_Alignment_med_tt: "§fIn Control§!"
 HON_PNH_Alignment_high_tt: "§*Utterly Dominant§!"

 #Football War Military Win
 HON_All_Thanks_to: "All Thanks to..."
 HON_All_Thanks_to_desc: "The Honduran Military. Everywhere in the country, you hear the 3 words in nearly every conversation. How could they overtake the Republic? How could they take away our democracy? Do you think they'll bring back the elections?\n\nAs of late, you hear a change in their tune, "We won thanks to the Army." While before their rule was illegitimate, a time bomb delayed by rhetoric of stabilization, their victory against El Salvador has vindicated the regime and Arellano himself.\n\nThere is no need for squabbling parties and meaningless rivalries, because it was a strong-willed rule that kept them from ruin. No longer is he a tinpot dictator with a sham party; now the PNH is the party of national pride, and Arellano is the man who saved the nation. "

 HON_The_Second_Somoza: "The Second Somoza"
 HON_The_Second_Somoza_desc: "Arellano is not just some upstart general who overthrew a weak, Central American government. No, he is President, not a Caudillo. The Republic of Honduras is just that, a republic. There is a legislature, representatives, elections, even for the president. But there is only one winner. Arellano. Just like the infamous Somozas of Nicaragua, Arellano has crafted a perfect show of democracy and legality to his junta, based in his Partido Nacional Hondureña.\n\nEven further, he has emerged as a perfect lapdog to the Americans, reminiscent of the most loyal episodes of Somoza's reign, doing whatever he is asked, eager to work with the companies that oftentimes are more present than the government throughout the country.\n\nOpposition is harassed, the socialists are nowhere to be seen, and Honduras falls further into the grip of Captain Oswaldo Arellano of the USS Honduras."

 #Football War Loss
 HON_La_Tragedia_Nacional: "La Tragedia Nacional"
 HON_La_Tragedia_Nacional_desc: "The entire country mourns their pride. Perhaps Honduras was never outstanding, or even stood a chance, but that makes no difference to the people. There is a sour feeling among them, anger at the Salvadoran migrants that inhabit their land, anger at the United States for stabbing them in the back, and anger at their leader for their inability to take their advantages and capitalize upon them.\n\nWhat they find now is decline, economically and politically. There are riots daily by the most ardent communists and diehard nationalists alike. The ceasefire has bled Honduras dry and solved none of its problems.\n\nThe country mourns its spilled blood, and as it nurses its wounds, it won't forget who inflicted them."

 #Fascist Coup
 HON_A_New_Direction: "A New Direction"
 HON_A_New_Direction_desc: "When chaos befell the country, the only force that had the capacity to restore stability was the military. Yet, they went further. This time, there are no pledges to return to democracy or the republic. As a matter of fact, the military saved Honduras from the republic.\n\nThe inept civilian government was unable to defend the country, constantly reliant on some power propping them up, but now they are gone. Now, true patriots can grasp the helm of the nation and guide it to glory. Never again will a fate like that of the Football War's mutilated "ceasefire" fall upon the nation.\n\nNever again will Honduras see defeat in any metric. The nation is to prosper, and Juan Alberto Castro will drag it to prosperity, kicking and screaming if he must. One day, each and every person in his country will be proud to say that they are Honduran once again"

 HON_Scuttling_the_Ship: "Scuttling the Ship"
 HON_Scuttling_the_Ship_desc: "Whose fault is the nation's defeat? Not the lowly peasant, nor the valiant soldier. Nor truly is it the politicians, who, despite being grotesque and incompetent in every sense of the word, were simply playing the game they all played. The fault lies with the exploitative, imperialist, imposing men in Washington who designed the game.\n\nThe Yanquis, who have used our country like a man uses a prostitute, have betrayed the nation they sought to stabilize, leaving it defenseless against the Salvadoran wolves. We will not stand to be exploited, to be subjugated, and to be robbed of our own country.\n\nHonduras will be free, free of Yanqui influence, free of shame, and free of masters. We will not be pawns nor servants of any power's outpost, for we will scuttle and scrap the USS Honduras."

 HON_Tearing_at_the_Seams: "Tearing at the Seams"
 HON_Tearing_at_the_Seams_desc: "Standard Fruit, Coca-Cola, United Fruit, and all the Yanqui megacorporations that have exploited our people and land will do so no longer. Mobs surround their regional headquarters, peasants burn their crops as an anti-American fervor spreads across the country, chasing out executives and their employees with machetes and Zhdanov cocktails.\n\nThe question is, how will Honduras patch itself up? The loss of the extensive corporations has left an economic vacuum that must be filled, and it is now up to Melgar Castro to find who will fill it."

 #Military Survival
 HON_Second_Somoza: "The Second Somoza"
 HON_Second_Somoza_desc: "Arellano is not just some upstart general who overthrew a weak, Central American government. No, he is President, not a Caudillo. The Republic of Honduras is just that, a republic. There is a legislature, representatives, elections, even for the president. But there is only one winner. Arellano.\n\nJust like the infamous Somozas of Nicaragua, Arellano has crafted a perfect show of democracy and legality to his junta, based in his Partido Nacional Hondureña. Even further, he has emerged as a perfect lapdog to the Americans, reminiscent of the most loyal episodes of Somoza's reign, doing whatever he is asked, eager to work with the companies that oftentimes are more present than the government throughout the country.\n\nOpposition is harassed, the socialists are nowhere to be seen, and Honduras falls further into the grip of Captain Oswaldo Arellano of the USS Honduras."

 HON_Rapid_Reshaping: "Rapid Reshaping"
 HON_Rapid_Reshaping_desc: "With the loss of the Football War, the country is devastated. Every Honduran is ashamed, ashamed of their country's history, performance, and leader. There is anger in the streets, anger against Arellano's illegitimate military junta and their American backers. What is Arellano to do? Step down? Allow for elections? Of course not, because if you do not succeed, you try, try, and try again.\n\nArellano has allowed for elections, yes, and he has turned his junta into a civilian regime, but a farcical one. The people can relish in national embarrassment and mourn their dead, but there will be no more attention paid to the continuing border disputes and the Salvadoran migrants. Any attention will be swiftly distracted by Arellano's security forces, and if that is too weak, his American backers who now keep him in power."

 #Communist Takeover
 HON_Peasants_Honduras: "A Peasant's Honduras"
 HON_Peasants_Honduras_desc: "Zelaya was never a rich man. He had always pushed for agrarian reform, seeing the impoverished swathes of Honduras outside of the capital city. He organized the peasants into unions, marched on the streets, promoted their livelihoods and work.\n\nWhen he took to guerrilla struggle against the government, he always had a vague hope this day would come. The day that he would sign the orders seizing the idle lands of the Banana companies, of the foreign old railroads, of the land that was robbed from the Honduran people so long ago.\n\nNow, his nation will be one of the peasants, a country that works for them as they work for it. Finally, his vague hope has been realized, and he and his party will see it through."

 HON_In_The_Red: "In The Red"
 HON_In_The_Red_desc: "Honduras has been plunged into red in every way it could be. While Zelaya and the new government are well-intentioned and hopeful in its future, the reality looks quite different.\n\nOn a map, Honduras is highlighted in bright red, as a former ally turned cultural foe after its socialist revolution. Fearing losing their assets, those American companies whose properties have not already been seized have packed up overnight and fled the country, plunging our finances into the red and sending us into freefall.\n\nAgainst the former regime's collaborators and repressors, the formerly oppressed see only red. All of Honduras could be described by the color: chaotic, vibrant, and energetic.\n\nWhile the regime is idealistic and strives to better the lives of its people, one can only wait and see if Central America's new red spot can pull itself out of the hole it finds itself in."

 ##Events

 HON_forpol.1.t: "Central America & Puerto Plata"
 HON_forpol.1.desc: "Mikel's eyes darted back and forth as he attempted to make sense of the numbers on the document, rereading it over and over again. He hadn't slept a wink in days, staying up powered only by the coffee in his cup and the fiery hatred of fascism in his heart. The OFN's planned intervention against the jackboot Trujillo was scheduled for just a few weeks from now. As a captain of the Caribbean Legion, it was his job to make sure all the logistical externalities and contingencies relevant to his unit were accounted for, sleep be damned.\n\nThe Americans and Mexicans were providing most of the munitions, vehicles, and equipment for the Puerto Plata invasion. Quality was obviously not an issue, but Mikel was concerned about whether the amount of ammunition afforded to him would be enough and if his men would be able to figure out all the kinks of their new toys before zero hour. The constant bickering between the American and Mexican consultants didn't help. Our Honduran hosts, on the other hand, were everything we could ask for and more, Mikel thought to himself. Tegucigalpa handled its role professionally and efficiently, drawing from a pool of pro-OFN veterans and volunteers across Latin America to bolster the collective ranks of the invasion force. Jamaican communists, Cuban Gaitanistas, Costa Rican leftists, Panamanian liberals, and local students; in the face of such evil, anti-fascist forces need to be united despite their differences. The Hondurans were pragmatic enough to understand we couldn't afford to discriminate. Most invaluable of all was the training the Hondurans were providing. Experienced and competent officers from the Honduran army were whipping the Legion's men, in particular the new recruits, into real fighting shape. Mikel only hoped their collective effort would be enough.\n\nAs the light of dawn began to creep its way into Mikel's room, he turned off the lamp on his desk, made his way out of his quarters, and walked toward the nearby port. He took a moment to appreciate the way the sun's beams reflected off the waters of the Honduran coast, shimmering like nuggets of gold."
 HON_forpol.1.a: "A new day is about to break for the people of Quisqueya."

 HON_forpol.2.t: "USS Honduras"
 HON_forpol.2.desc: "Morning at the Antigua Casa Presidencial. The habitual tropical heat already permeates the air, settling over the castellated walls that loom above the waters of the Choluteca River. Ramón Villeda Morales steps away from the window, watching the noisy awakening of Tegucigalpa. He removes his heavy horn-rimmed glasses and wearily rubs the bridge of his nose. On the massive mahogany desk lies a fresh newspaper edition, where the National Party headlines scream of betrayal once again.\n\n"Washington's puppet," they declare. "A sellout of the Homeland." Villeda lets out a bitter chuckle, catching his reflection in the dark glass. These critics forget that it was precisely his "sellout" politics that granted social benefits to the simple peon and a Labor Code to the worker, protecting them from the very tyranny of those same critics. While wealthy merchants complain that American monopolies are suffocating them, the President sees a different picture.\n\nSuddenly, the glass in the tall window frames begins to rattle - a flight of American fighter jets roars over the city. The Eagle has spread its wings over Honduras. Yes, its shadow is vast, sometimes frightening, but beneath this wing, the country can breathe easily for the first time in years. American dollars build schools, and American bayonets guarantee that no rebellious general or communist will kick down these doors... at least, not today."
 HON_forpol.2.a: "In a world of predators, a wise ruler keeps close to the strongest beast."

 HON_forpol.3.t: "Excerpt From El Cronista's Saturday Editorial"
 HON_forpol.3.desc: ""...On paper, our Honduran Constitution shines with a purity worthy of a display case. Washington nods with satisfaction as it looks upon us: behold, the model republic, where every few years citizens cast their ballots. But let us cast aside diplomatic etiquette and look the truth in the eye. Our democracy is a closed club, where membership dues are counted in the millions of lempiras, and the doormen at the entrance wear the uniforms of foreign corporations.\n\nOn the political stage, only two actors are permitted to play the leading roles: the Liberal Party (PLH) and the National Party (PNH). The 'Colorados' and the 'Azules'. The Liberals, whose ties to the conglomerates of Boston and New Orleans are no secret, offer us a cosmetic repair of the facade - mild reforms to ensure the steam does not blow the lid off the kettle. The Nationalists, meanwhile, relying on a motley coalition of landowners, glance with undisguised envy at Mexico, dreaming of constructing here their own version of the 'Institutional Revolution' - a monolithic vertical structure where the opposition becomes nothing but a shadow.\n\nBut do not be deceived by their rhetoric. Both parties drink from the same source, and that source is by no means the will of the people. Until a tectonic shift occurs, our electoral process will remain little more than a complex ritual to legitimize the power of those who own the banana plantations. Stability? Undoubtedly. Freedom? That depends on who is paying for the banquet...""
 HON_forpol.3.a: "At least it is a stable regime."

 HON_forpol.4.t: "Honduran Armed Forces"
 HON_forpol.4.desc: "The midday sun mercilessly scorches the parade ground of Toncontín Air Base, yet Sergeant Reyes's platoon stands motionless, like a terracotta army. Reyes absently runs his finger along the cold receiver of his M1 Garand - a weapon forged at a distant factory in Springfield, thousands of miles from here. A short distance away, a heavyset instructor from Texas watches the formation in silence, spitting tobacco onto the dust.\n\nIf Reyes were asked to describe his army in a single word, he would say: "proper." Everything here is in its place. Along the runway, kicking up clouds of red dust, C-47 Skytrain transports taxi in, unloading crates of canned meat, ammunition, and new uniforms. Willys jeeps, radio sets, field manuals, even the cigarettes in the soldiers' breast pockets - everything conforms to a single standard. The Honduran army has become the most organized in the region. And the most dependent.\n\nThe night before, in a noisy cantina near the market, one of the students at a neighboring table had tossed out words that lodged in Reyes's mind like grit between his teeth: "Pitiyanquis. Watchdogs for the banana kings." He had held his tongue then. He knew what he was ready to die for-for the land, for the flag, for the country. But today, watching foreign aircraft trace lines across his own sky, Reyes caught himself thinking something new for the first time: if that flow were ever to dry up, if the engines across the ocean were to fall silent, would everything they call an army collapse with them?\n\nSomewhere deep inside, a sense of unease stirred for the first time: honor, discipline, and loyalty count for much."
 HON_forpol.4.a: "But without oxygen, even the most disciplined soldier cannot live for long."

 HON_forpol.5.t: "Politics of Honduras"
 HON_forpol.5.desc: "CONFIDENTIAL/[GetDateText]\nFROM FBI DIRECTOR J. EDGAR HOOVER\nMEMORANDUM FOR THE US DEPARTMENT OF STATE\nSUBJECT: ASSESSMENT OF THE REPUBLIC OF HONDURAS\n\n1. Analysis of the current political landscape in Honduras indicates the persistence of a bipolar system dominated by the PLH and the PNH. However, signs of deep factional division requiring our attention are observed within both structures.\n2. The PLH is traditionally loyal to the interests of American capital; however, a reformist wing led by Modesto Rodas Alvarado is gaining influence within the party. Rodas enjoys broad popular support and demonstrates a willingness to engage in dialogue with leftist elements, causing concern among the party's Old Guard. Without significant external injections of political capital, his program risks being sabotaged by the internal establishment.\n3. The PNH, relying on the local oligarchy, is similarly divided. A pro-American faction is opposed by a group of 'Hispanists' oriented towards rapprochement with Iberia and Japan. Analysts note the leadership's aspiration to import the model of the Mexican PRI to establish a monolithic vertical of power.\n4. The Armed Forces of Honduras, despite total dependence on US logistics, are subject to ideological erosion. General Oswaldo López Arellano remains the guarantor of our interests, whereas a group of officers surrounding Juan Alberto Melgar Castro displays sympathies toward Co-Prosperity Sphere doctrines. Any increase in the army's role in politics will require the preventive neutralization of anti-American elements.\n5. The non-systemic opposition, specifically the PCH, currently lacks the mobilization capacity to destabilize the regime but retains growth potential in the event of a collapse of the existing duopoly."
 HON_forpol.5.a: "Rodas is our man! Let him know we support his campaign."
 HON_forpol.5.c: "The military will ensure that Honduras remains a loyal friend of America."
 HON_forpol.5.b: "Let's see if we cannot bolster the PNH's pro-Americans against other factions; it might save us if they win."
 HON_forpol.5.d: "The Hondurans must decide their future themselves."
 HON_election_boost_tt: "§YOur choice will influence Honduras' future.§!"

 HON_forpol.6.t: "Querida Honduras"
 HON_forpol.6.desc: "Alfonso left a bloody handprint on the glass door. Slumped over, barefoot, dressed in the thin rags that fit every worker in the banana plantation, he forced himself towards the reception desk.\n\n"Good morning, excuse me," he said, shuffling over the red dripping from the side of his head. A young nurse hurried to the back, yelling for help.\n\n"Supervisor beat me," Alfonso said, to no one in particular.\n\nWeeks later, officials from the Ministry of Social Welfare snooped around the plantation and found everyone blind and deaf, like in every United Fruit Company property. A report was made. It was filed.\n\nPicking up her boss' leftovers and replacing his newspapers and documents, Cecilia imagined herself in his place. A delegate to the National Congress, shaking hands, sharing cigarettes, and earning "sponsorships" from the Americans. She thought it such a simple job, to learn a little English and smile and nod, sign a paper once or twice, and then close your eyes.\n\nThey were laid in rows, under buzzing, pale lights. Hands reached out and plucked the golden ingots, turned them around and sideways, looking for blemishes, bumps, black spots, but not blood stains. They weighed the plastic shop baskets much less than the supervisor's boot. Only after getting home was the United Fruit stamp scratched off the bananas. It would never be scratched off Honduras."
 HON_forpol.6.a: "It was the sigil of its masters, after all."

 HON_forpol.7.t: "Opportunities Everywhere"
 HON_forpol.7.desc: "Takenaka Kurou saw opportunity in the hardest places. While his brothers played it safe working for the Zaibatsus in ultimately dull careers, Kurou sought the chance to make his fortune abroad, right in the Americans' own backyard. Others saw likewise, that their fortunes lied beyond Japan's shores. Some were academics, hoping to publish papers on everything from agronomics to Mesoamerican history. Others were professionals that didn't fit in the rigid hierarchical structures of Japanese corporate life and sought a freer, more flexible hand in a smaller enterprise environment. If Japan could grow its presence here, then all of them would benefit, and so Kurou knew he could count on the expatriate community, should he need them.\n\nThey weren't the only ones. Many of the people in Central America resented the United States and their meddling. Much like the growth of Japan earlier in the century, Kurou saw that Japan found that people, long-exploited by Western chauvinism and colonialism, would serve as an effective local source of power. When laborers broke their backs for United Fruit, at least some of them became angry. They questioned why a Honduran couldn't own the land that grew coffee beans and bananas or operate a business as well as any American. They asked why they felt like second-class citizens in their own countries while the Americans drove fancy cars and drank expensive champagne. Those questions stoked a fire, a fire that could burn down American control of the country, if it was carefully controlled. And those ashes could fertilize the soil for sakura trees.\n\nAnd so Kurou bided his time, making connections, keeping his fingers on the pulse of society. He bought drinks for workers after a hard day and was a friend to every potential ally he could meet. If they were the fire, Kurou was the firefighter, carefully corralling the energy to ensure a controlled burn."
 HON_forpol.7.a: "Kurou worked with the precision of a surgeon."

 HON_forpol.8.t: "Dissident Hispanism"
 HON_forpol.8.desc: "Oscar Morel smiled when he looked out at the meeting hall. Today's Hispanist meeting had the largest attendance yet. Several members were clearly military or ex-military, their close-cropped hair and severe expressions left no room for doubt what their professional life entailed. He had to take pride in that, because he knew that in truth, the movement could barely muster anything more than nighttime rallies in empty warehouses. They had members of the military, but no generals or base commanders. They had members from the PNH but not its political leadership. They were on the fringes looking in.\n\nHe shook the thought from his mind as he took the podium, flanked on one side by a prominent portrait of two great men: Caudillo Franco and President Trujillo, taken during the last Iberian state visit to the Dominican Republic. They were men unafraid to stand tall, to show strength, and it was that strength that Oscar was hoping to embody in himself and impart to the attendees tonight. They could not see his insecurity, they must see a man who was every bit the strong leader that those two men were.\n\n"I see a lot of new faces tonight, and that gives me great pride. It means more people are waking up to what we've known all along: that we are a great people who reside in a great nation. That more people see what we see, and are disgusted. Everywhere you look, there you see the Yanquis strangling our people and our potential. We slave away for pittance wages at their fruit plantations while they drive away in their fancy cars. They buy our politicians with bribe money while we struggle to keep the roof over our heads. They steal our country's wealth, but what they are truly trying to steal is our dignity! So that we have nothing to support ourselves with and so must rely upon them. But I tell them that I am a proud Hispanic man!"\n\nBeing against the Americans pleased the crowd, but soon, Oscar knew, he would have to provide something the crowd could be for."
 HON_forpol.8.a: "Every week, the attendance was a little larger, and the cheers a little louder."

 HON_forpol.9.t: "Stowaway on the USS Honduras"
 HON_forpol.9.desc: "Víctor Urquidi adjusted his glasses and took a sip of mineral water, sitting in the cool lobby of the Gran Hotel Lincoln. At the next table, United Fruit managers were loudly demanding whiskey, behaving as if they owned not only the plantations but the entire Tegucigalpa. Urquidi, with his British reserve acquired in the corridors of the London School of Economics, offered only a faint, barely perceptible smirk.\n\nThe Americans viewed this country as their unsinkable aircraft carrier. But in their imperialist overconfidence, they failed to notice new passengers on board. While the Yankees drew the ire of nationalists, the Mexicans methodically occupied niches the giants deemed too insignificant.\n\nUrquidi's gaze drifted to the window. Where the Americans charted routes to export bananas, engineers from ICA quietly won tenders to lay the asphalt. Foundations for new hotels were poured with concrete from Cemex, and the very bottles for the Coca-Cola that American tourists drank were blown in Vitro factories.\n\nUrquidi made a neat note in his pad. Mexican firms permeated everything. And while the ship's "captain" paid for the tickets with political capital, Mexico enjoyed the ride as a stowaway, reaping profits in the shadows."
 HON_forpol.9.a: "A low profile brings its own rewards."

 HON_forpol.10.t: "Compounding"
 HON_forpol.10.desc: "Even small percentages had a way of growing. Takenaka Kurou remembered when he first arrived in Honduras, less than one business in a hundred had a Japanese owner. But in a few short years, that had changed. Law offices with Japanese surnames hung their shingles and took clients without anyone thinking it odd. It wasn't unusual to see a Japanese consultant speaking with a business owner discussing the pros and cons of his annual strategy. There were Japanese owners of cargo vessels and Japanese investors owned stakes in the ports, but many ships still had to transit the Canal, lengthening the journey and increasing shipment costs.\n\nNippon had seen some return in trade, but not much. The Sphere had ample access to many goods that Honduras could grow natively, making the competitive environment fierce. The Sphere already took advantage of low labor costs in Asia among component nations, making it hard for businesses in Honduras to beat other nations in price. The best way to make returns was to buy out businesses and provide seed capital for new ventures; the taxes investors had to pay back home were the primary benefit that the homeland saw from Kurou's efforts half the world away.\n\nThe greatest benefit that Japan saw was in sidelining the Americans. As part of the cut-and-thrust of the Cold War, anything that harmed America strengthened Japan. Each great power fed on the blood of another. That was a benefit in its own right, and Kurou had seen his prestige grow along with his stock portfolio. His brothers had thought him too much a maverick to go so far from home, but now, they had to stop and wonder if he wasn't tapping into the pulse of the future. Kurou was a modern day prophet of profit."
 HON_forpol.10.a: "To greater heights."

 HON_forpol.11.t: "Honduras in the OFN?"
 HON_forpol.11.desc: "Tegucigalpa didn't sleep tonight. The city has been engulfed by the Red Tide. Thousands of Liberal Party supporters, waving crimson banners, chant the name of their idol. When Modesto Rodas Alvarado steps onto the balcony of the Antigua Casa Presidencial, the roar of the crowd drowns out even the church bells.\n\nHe raises his hands, calling for silence, and his voice, rings out over the square: "For too long we have lived with our eyes cast down! For too long we were told that our destiny was merely to harvest crops for foreign tables. But today, we answer in unison: Enough! We are a nation with the blood of Morazán in our veins. We will build schools where once there were only barracks. We will bring light to where ancient darkness reigned. Today, we cease to be spectators of our own history!"\n\nAn hour later, the atmosphere in the President's office was different. Rodas wearily sank into his chair, shedding the persona of a vox populi, and poured himself a whiskey. "Impressive theater, Modesto," Ambassador Burrows smirked. "Our friends at United Fruit in Boston breathed a sigh of relief to hear that your 'radicalism' was confined to pretty metaphors about light and schools."\n\nRodas took a long sip, eyeing the American over the rim of his glass. "Let's harbor no illusions, Charles. I know who is paying for this banquet. Coca-Cola, Standard Fruit... they own the land, the roads, and probably this chair. But the crowd down below... if I cannot give them bread right now, I must give them pride."\n\nHe casually slid a folder toward the ambassador. "OFN Membership. It costs you nothing - just another flag on the flagpole. But for my people, it is an illusion that we sit at the same table as giants. Give me this trump card, Charles, give me this lapel pin, and I guarantee that your bananas will be loaded at the ports without strikes.""
 HON_forpol.11.a: "Big plans to support big dreams."

 HON_forpol.12.t: "Honduran New Deal"
 HON_forpol.12.desc: "Modesto Rodas Alvarado loved Honduras so much that he wished it was larger. A nation needed to be built, and for that, it needed a government willing to build large and dream even larger. The Americans had that sentiment, only a few decades ago. The Tennessee Valley Authority brought power to what was seen before as a backwater. A pension program for retirees was established so that the aged could be comfortable in their golden years while workers could feel confident that when their turn came, they too would be taken care of. Highways, dams, all of the vital infrastructure that a nation needed came because a deal was struck between the government and the people it represented. Alvarado knew that such a deal could be made, and it would have to be made, between his office and the people if the Honduran people wished to know prosperity.\n\nThe naysayers would say that they lacked the money, that they lacked the capacity, but what they truly lacked was belief. History was full of people that could tell everyone they came across what couldn't be done. Doing nothing was easy, that was why so many people did it so regularly. When you did something, you ran the risk of putting yourself into something to see it falter, and that cowardice had defined political life. Risk nothing, gain nothing, and insulate yourself from any harm - that was the dominant political thought. The people paid the price, but that was something for the people to worry about.\n\nNo more. Honduras needed something from the past to secure her future. It worked before and it could work again. It would require the courage to take a chance that Honduras could be greater than it already was, and one man had been elected to do it. Alvarado just needed to take the risk and be willing to go larger than any Honduran politician had before."
 HON_forpol.12.a: "For the dreamers."

 HON_forpol.13.t: "Liberal Prophecy"
 HON_forpol.13.desc: "Rodas Alvarado was the leader of both an entire nation and the political party that led it, and yet, these past few weeks, he felt like he was perhaps the loneliest man in Honduras.\n\nWhen he had spoken after his inauguration about the need to institute new programs to uplift the people from poverty, and to build great works for them to enjoy, everyone in the entire National Congress had cheered him on. The public had called him "the Builder" and eagerly awaited the new nation he would construct. His own party had called him the Great Man of Hope and urged him forward as the new symbol for the PLH.\n\nNo longer. His own party began checking his ambitions, voicing their concerns in committee that he was pushing the country too far leftward, and that the party would increasingly alienate the people and destroy any chance of re-securing their mandate in the next election. He no longer was a Great Man of Hope, now he seemed to be held up as a millstone around the party's neck. Rodas had defended his programs by citing the results in the United States in the 1930's and 1950's to only moderate effect. For every man he seemed to win over, another would cite American failures as a reason to chart a different course. Rather than coming to committee meetings hoping to get projects started, he was increasingly having to defend his own initiatives, sometimes from the same men who had even helped craft them.\n\nIt was even worse in the streets. There, the people were calling him "the Irresponsible" and openly fearing inflation and an economic recession. Rumors circulated that he would outlaw the church or abolish private property with increasingly less levels of hyperbole. In the National Congress, Rodas could make an argument, but how exactly was he supposed to counter arguments that he was secretly preparing the nation to transform it into a new Soviet Union? Every public statement he made was ridiculed, twisted, and fed back by the opposition to their constituents until Alvarado was little more than a leftist specter, a boogeyman to frighten the people."
 HON_forpol.13.a: "His opposition seemed limitless, and Alvarado felt increasingly tired."

 HON_forpol.14.t: "Flying off the Shelves"
 HON_forpol.14.desc: "Hondurans celebrate the electoral victory of Cruz Uclés of the Partido Nacional de Honduras in the 1966 elections. Uclés celebrated his victory at the PNH headquarters in Tegucigalpa, and inaugurated his victory in a speech calling for Honduras to assert itself as a sovereign nation. Uclés expressed his skepticism in currently-existing partnership with Honduras, citing that American presence has weakened Honduran economic strength and hindered Honduran development.\n\nThe PNH as a whole is divided on OFN presence. A slim majority supports a reduction in ties with the United States and the OFN without cutting ties entirely, and focus primarily on increasing Honduran domestic control of its economy and the promotion of Honduran businesses over that of American foreign-owned businesses. Some PNH members support promoting increased Honduran ownership stakes in American companies operating within Honduran businesses, others support protectionist measures to grant Honduran firms to increase their competitive advantages. Another faction, smaller in number, supports an official downgrade in relations with the United States and the OFN. Some among these factions support local ties to other Central American nations, other seek partnerships from larger nations from more distant shores.\n\nThe nuances of the PNH's divides on the issue of the United States is lost on the press, which run headlines ranging from "New Honduran President Desires to Reduce OFN Ties" to "Will Honduras abandon its OFN Partner Status?" all the way to "Uclés Despises America, Seeks Departure." The anxiety of the nation drives a population to buy newspapers, and so the headlines continue to be run, and papers continue to be bought. The news, meant to inform, found that enough ambiguity could be quite profitable."
 HON_forpol.14.a: "A whirlwind of paper."

 HON_forpol.15.t: "Meet the New Boss"
 HON_forpol.15.desc: "Cornering the market was never easy to do. You had to deliver a top-notch product at a great price, and that meant having a crack team of employees, excellent equipment, and more than a little luck. You had to know exactly who to sell to, where to set the price to maximize profit, and the ability to gather information faster than anyone. It required all of your heart and soul to succeed so utterly that your name became a byword.\n\nIt was next to impossible to do well, and even harder to do consistently, but Melvin Crisanto found a simpler way - simply donate to the ruling political party and they could eliminate your competition for you.\n\nWhen government assets needed donations, Melvin knew that a simple donation would be all that he needed to ensure a controlling interest. Smaller firms often found themselves faced with sudden needs for cash due to government regulations, and when they couldn't pay, they had to sell, and Melvin knew that they'd be desperate enough before they ever did. All the larger firms seemed to set the same price, and set areas where each could enjoy exclusive rights to be free from competition. It seemed like magic the way they could coordinate, but in truth, it was only the power of organization.\n\nThe PNH wanted Honduras to be a vibrant and independent nation, and that required its people to work together. If they were to stand strong, they could not brook any mavericks that could topple the structure from within. Those who decried the unfair practices were those who simply did not know how the game was played. There were ruthless people everywhere, and you had to be ruthless to take advantage. Better Melvin than some faraway Yanqui."
 HON_forpol.15.a: "Same as the old boss."

 HON_forpol.16.t: "Institutions of State"
 HON_forpol.16.desc: "From: Office of Central American Affairs\nMemorandum for the Director\nExecutive Intelligence Report: Eroding Democratic Norms in Honduras\n\nThe ruling party of Honduras, the Partido Nacional de Honduras (PNH), have enacted several anti-democratic measures within their country to immunize themselves against future election losses due to popular dissatisfaction with the party and the rising popularity of the opposition Partido Liberal de Honduras (PLH). These measures will embed PNH party apparati in previously free institutions, compromising the credibility of elections within the nation by using social levers of power to undermine opposition candidates.\n\nAnalysts predict that these measures will not only weaken Honduras's democracy, but serve to reduce the efficiency of state institutions with these party organs as loyalty replaces competence as criterion for leadership roles within these structures. Analysts predict that the PNH measures may clamp down on dissent in the short-term, but will only serve to increase popular resentment against the party in the medium-to-long term.\n\nThe erosion of democratic norms also creates a new threat to American interests in Honduras should the PNH abandon pro-American sentiments to curry foreign direct investment with Germany or Japan. If a new leader of the PNH with anti-American leanings should come to power, the personalist leadership of the party would serve as a detriment, allowing for a faster turn away from American influence than a comparable institutionalist leader would be. At the same time, opposition leaders are likely to become more extreme in anti-American beliefs should the US continue to maintain a positive working relationship with the PNH, lending Germany, Japan, or Mexico an opportunity to influence opposition leaders much more easily."
 HON_forpol.16.a: "Are they still pro-American though?"

 HON_forpol.17.t: "Can A Coup Save Democracy?"
 HON_forpol.17.desc: "José remembered 1960 all too well. He remembered the same sticky fear hanging in the scorching air and the same metallic taste on his tongue. He thought those days were in the past, that Honduras had outgrown the disease of "generalissimos" that plagued its neighbors. But today, history punched him in the gut again.\n\nIt all started at the town hall. No sirens, just the growl of Studebaker trucks and the stomp of heavy boots. José stood in the crowd, clutching a pack of cigarettes in his pocket, watching as the mayor - the man he had voted for just a month ago - was dragged into the street. The official's shirt was torn, his face bloodied, but most terrifying was the look in his eyes: complete, devastating incomprehension. Beside him, the pale vice-mayor bustled about, babbling something about "temporary measures," but the officer leading the arrest didn't even look at him. He stared over the heads of the crowd, as if searching for someone in the windows opposite.\n\nAnd in the evening, the radio came alive with the voice of Oswaldo López Arellano. The same timbre, the same words about "saving the nation from chaos" as six years ago. Like a broken record no one asked to play. José's neighbor, an old dockworker, spat on the ground: "They saw gringos at the port yesterday. Those ones... with the suitcases." José nodded silently. He knew this script. The curtain of stability had fallen, revealing the same ugly stage behind it, where local actors dance to a foreign tune. Honduras is no longer an exception."
 HON_forpol.17.a: "Honduras has become just like the rest."

 HON_forpol.18.t: "Americanization"
 HON_forpol.18.desc: "In the banquet hall of the Hotel Honduras Maya, the clinking of silver cutlery drowns out any thoughts of what is happening outside the walls of this air-conditioned paradise. At the head table, General Arellano exchanges jokes with the Vice President of Standard Fruit, while waiters in snow-white gloves pour ice-cold Californian sparkling wine.\n\nAt a nearby table, a young technocrat, recently returned from the States, fervently explains something to a gray-haired landowner: "You must understand, Don Héctor, the state is an anachronism. It shouldn't heal, teach, or build. It should only guarantee the sanctity of the contract." The landowner nods, stroking his mustache with satisfaction. For him, these buzzwords mean one thing: no one will ask why his workers live in palm-leaf shacks while the profits flow like a river.\n\nThe word "corruption" is considered a faux pas here, like belching at the table. No one says aloud that the contract for northern electrification went to a firm registered to the Minister of Infrastructure's wife. No one mentions that the tax breaks for United Fruit were written by the company's own lawyers in this very room a week ago. Here, it is called "partnership," "synergy," "creating a favorable climate." It is a wondrous world where the nation's interests miraculously always align with the interests of a dozen families and two or three corporations from Boston.\n\nAnd perhaps most importantly-the approving nods of the American guests. Their smiles shine brighter than the chandeliers. They see the "triumph of free enterprise." If the capital is happy, they are happy. And if Washington is happy, then the local elite can sleep soundly, knowing their small, cozy world is securely protected from any storms raging below, in the valley of poverty."
 HON_forpol.18.a: "All is for the best in the best of all possible worlds."

 HON_forpol.19.t: "Security Threat"
 HON_forpol.19.desc: "Colonel Mendoza of the Honduran Army watched from his office window as, down below on Plaza Morazán, a patrol in brand-new American gear slammed a group of students face-first into the asphalt. The dull thud of a baton, then another. No wasted movements, only cold efficiency. For Mendoza, this spectacle was the best proof that the system worked.\n\nIn his view, life without security wasn't worth a penny, and the American instructors from the FBI had only confirmed this truth, providing the tools to enforce it. The road to order, the Colonel believed, inevitably lay through the application of force. Communists, fascists, union agitators - the labels didn't matter. All that mattered was the presence of "nails" for the American hammer now held by the police.\n\nThe Colonel's gaze slid over a random passerby hurrying past the scene of the arrest. The ordinary man shuddered but quickened his pace, glad that today the baton was not coming down on his back. Perhaps among those detained was an innocent man, simply in the wrong place at the wrong time. But for Mendoza, this was merely a statistical error. Police work is dirty labor, and if some poor devil spends a couple of days in a cell counting his bruises - it is a small price to pay for general tranquility. After all, in Mendoza's world, innocence was merely a temporary state, and fear was the most reliable foundation of order."
 HON_forpol.19.a: "Security is the key."

 HON_forpol.20.t: "After-Thoughts"
 HON_forpol.20.desc: "Congratulations on your resounding victory. Yes, of course..." James rolled his eyes. His Honduran interlocutor's excitement did not seem to be hampered by the many miles of separation between them.\n\n"If what you say is true, then surely we can expect President Rodas to maintain his promise... yes, I understand, but I am not talking about that. We have supported you greatly throughout the war. I'm simply asking if, as you say, the political capital acquired will allow him to strengthen... yes Honduran-American cooperation..." James rested his head on one hand. trying not to fully ignore everything the Honduran said. Social programs, democracy, and...\n\n"Can you repeat that last part please? What does support mean? What do you need exactly? The war is over and we've..." Of course they wanted more. They always do, everything done for them already is not enough. It's never enough.\n\n"Fine, fine, you will have what you need. Just please remind the President that we warmly congratulate him and support his vision, as he described it to us..." James slammed the phone down. "Fucking leeches." But he couldn't afford to antagonise them now; the Bureau would not allow him to, particularly not for the relatively small sum they were asking for.\n\nThe line went dead. Juan got up from his desk, proud of himself. Americans were easy to deal with; all you needed to do was know how to talk to them. Their aid will both help the President's campaign, and Honduras will be able to swiftly recover from the war. Joining the OFN is a good idea for that reason alone. The Americans will provide..."
 HON_forpol.20.a: "And all you need to do is ask politely."

 HON_forpol.21.t: "Honduras Requests American Aid"
 HON_forpol.21.desc: "SECRET/[GetDateText]\n\nFROM MORRIS ROBERSON\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: MILITARY AID TO HONDURAN GOVERNMENT\n\n1. We have received direct requests from Honduras to further our support of its government, both through increasing arms and in directly stationing troops within the region. Although not explicitly stated, this increase will also likely lead to some form of American intervention in the region, at least in the short-term, to help stabilize them against the Communist Party of Honduras.\n\n2. A direct communique from Honduras saw a request made for 1,000 American soldiers to be stationed there, highlighting the upsurge in resistance to Oswald Arellano's current regime. They have offered us relative freedom in selecting where the base would be, but local American attaches are pushing for us to expand existing bases in the region, and we would likely be integrated into the Honduran militia.\n\n3. Foreign interventions are always costly, but the benefits far outweigh the costs. Tegulcipalca has been a staunchly loyal ally, and Arellano himself has been a firm ally of American corporations there. The rise of the CPH has become an increasing concern for them, and has been fed back to us, especially by the United Fruit Corporation. Having additional training in jungle terrain should also help us in preparing for conflicts in Southeast Asia and Africa."
 HON_forpol.21.a: "It seems that Haiti rears its head once again."

 HON_forpol.22.t: "What Remains of Olancho"
 HON_forpol.22.desc: "Luis tried to speak, the blood in his throat choking down his words. He craned his neck upward, his shoulder still oozing blood as he grasped at the soil beneath him, to see a village in flames. A mother soon rushed by, clutching her child close to her chest. He had seen this woman before. Many times, in fact. Had he not lent her family a cart the previous month? The crack of a pistol firing stifled his moment of recollection, the woman's body stiffening before crumpling onto the ground entirely. Then, a capped man stepped into view, clutching the smoking gun. Olive green, Luis thought. He had seen this uniform before, and the stars and stripes that emblazoned its sleeve. For the rest of his life, he would never forget it.\n\nOutside of Catacamas, representatives of the United Fruit Company inspect a plantation atop a nearby hill, following damage inflicted by a worker's strike the previous day. Standing beside the pressed suits dampened by jungle sweat, American soldiers kept careful watch upon the workers below, tending to the harvest. One worker, his face tanned and lined with wrinkles, looks up to the soldiers with tired eyes. He is met only with an apathetic gaze in return.\n\n"Right there, right there!" In the borderlands of San Esteban, Honduran soldiers had surrounded a small, decaying concrete complex after armed militants had seized one of the buildings. From the windows, one could spot civilians teeming within the ground floor; a family, or several, laid inside. An American advisor for the contingent of soldiers barked an order, and an M20 Super Bazooka was brought up.\n\nWith a shout of "Disparar," the rocket flew through one of the windows and let out a blast of light and smoke from within the building's interior. A militant, clutching the remnants of his bleeding left arm, stumbled out from the building and was met with a flurry of bullets from the soldiers. Admiring the scene from afar, the American smiled."
 HON_forpol.22.a: ""Mission accomplished," he nodded along to the roar of the flames."

 HON_forpol.23.t: "Ideologues and Pragmatists"
 HON_forpol.23.desc: "Ever since Cruz Uclés got elected, Ambassador Joseph Jova knew that at some point, he'd have to decide on his negotiation strategy - he just couldn't get a read on the new Honduran President. He had spoken extensively on the campaign trail about Honduran sovereignty and exploitation at the hands of the OFN, but quietly, the PNH had still largely supported a relationship with the Americans - either out of profit or practicality at the US being so close. So was he an ideologue, or did it court anti-American sentiment because it plated well in the polls?\n\nHe could always play hardball with the new president and threaten to withdraw investments from the Honduran economy unless some measure of continuity was. The loss of capital and equipment would definitely create an economic shortfall that would be directly blamed on the new president regardless of how he spun it to the media. Jova didn't like playing hardball when he had the choice, but he knew that sometimes, some political actors simply didn't play well with others unless you yanked on the chain.\n\nIf Cruz was a true ideologue, however, that would give him all the ammunition he needed to further pull away from the OFN. The Veracruz Pact would be happy to step in, but Jova knew that the real backers would be the Sphere. They were the only ones with the money and the willingness to invest in far-off Honduras, and Cruz would undoubtedly swallow their lies in exchange for a song. If he was an ideologue, the best option would be to offer greater investment in the form of joint partnerships, granting Hondurans a greater stake in their economy.\n\nOf course, if he was just the self-same corrupt politician, there was always the option to simply bribe the key party officeholders. American investment that ended up in the pockets of the PNH would mean a pliable party that would talk a great deal, and end up changing nothing."
 HON_forpol.23.a: ""Perhaps some contributions to key PNH members can change your opinion on the USA.""
 HON_forpol.23.b: ""We can demonstrate our partnership by sponsoring some joint Honduran-American initiatives.""
 HON_forpol.23.c: ""We may see the need to withdraw some investment without a firmer commitment to the OFN.""

 HON_forpol.24.t: "Southern Strategy"
 HON_forpol.24.desc: ""Take a look at this." Arthur spat out the words with building frustration, sliding a newly printed report onto Robert's desk. The latter's brow furrowed at the words, his expression soon settling into a slight frown. "And the worst part? They just might win it, too. Fuckin' Hondurans."\n\nHaving successfully rallied their nationalist base to electoral victory only a few years ago, the National Party of Honduras is vying for another term in power, much to the chagrin of the Federal Bureau of Investigation. Indeed, the Bureau had invested significantly over the previous years into producing a stable Liberal Party that could both govern and campaign; yet, they had still underestimated the momentum garnered by the nationalists. With the institutions and electoral base in place to achieve yet another victory, the prospects for the Liberal Party were fading quickly. Something had to be done, lest the Bureau end up with nothing to show for its efforts.\n\nRobert leaned back in his chair, his gaze still narrowed upon the report. Then, he clasped both of his hands together. "We can make this work," he surmised. "The Nationals appeal to a nationalist base? Fine, then. Good for them. The Liberals can play this game, too." He rose from his desk, soon striding across the office with Arthur close in tow. Reaching a nearby elevator, he pressed for the third floor; he needed to analyze some financials before making their next move.\n\n"...What exactly is your plan, Rob?" Arthur raised an eyebrow, standing uneasily next to the elevator as its doors slid open. Robert turned around, smiling slyly."
 HON_forpol.24.a: ""I think we just found our new angle!""
 HON_forpol.24.b: ""Leave Honduran nationalism to the Nationalists, Rob. Lord knows they don't have much.""

 HON_forpol.25.t: "A Map of Things Before, and to Come."
 HON_forpol.25.desc: "SECRET // FOR OFFICIAL USE ONLY\nSUBJECT: Assessment of the Post-War Situation in Honduras\n\nUpdated intelligence from Tegucigalpa paints a picture painfully familiar to every veteran of the Latin American desk. It is the classic dilemma that has haunted US foreign policy since we first set sail in search of monsters: how to reconcile our ideals with our interests.\n\nThe victory in the conflict with El Salvador has radically altered the internal landscape. The regime of General López Arellano, which we delicately term a "legalist dictatorship," has upheld its end of the bargain: order is restored, borders are secured. Formally, democratic institutions function - Congress sits, courts operate, elections are held. But let us be honest, at least within this office: it is a facade. The shadow of intelligence services covers even the most remote villages, and political opposition exists only so long as it does not become too loud.\n\nNevertheless, we are forced to admit: Arellano has won not only the war but the minds. On the streets, they no longer ask when democracy will return. The General has transformed from a usurper into the savior of the nation, and his PNH into the sole legitimate force.\n\nThis banal but effective authoritarianism inspires mixed emotions. We have created a stable monster to counter the region's chaos. The only question is whether we will ever be able to fix what we helped build when the dust settles..."
 HON_forpol.25.a: "If it ever settles at all."

 HON_forpol.26.t: "From a Personal Diary..."
 HON_forpol.26.desc: ""Tegucigalpa, [?global.date.GetDateStringNoHourLong].\n\nThe rain is drumming on the tin roof, and the third glass of bourbon is finally starting to kick in. Damn this city. And damn Washington with their pamphlets about the "beacon of freedom."\n\nHonduras was supposed to be a pretty picture for the press. A democratic experiment, a showcase of success. The locals nodded, smiled, and fed us promises of elections while the country hung in stasis. And today, the farce ended. Their tame Congress finally "elected" a President. And who rides into the palace to the sound of fanfare? Oswaldo López. The very general whose overthrow we sold as a great victory.\n\nThe Pentagon is furious right now. Not because of the suffering of the local peons - they don't give a damn about the peons as long as the bananas are loaded onto the ships. They are furious because we look like idiots. We spent years and millions to replace a loyal dictator with... a loyal dictator, only now with a mandate from parliament. We handed him the keys on a silver platter ourselves.\n\nIn essence, nothing has changed. López is our son of a bitch, he knows how to hold the line and keep out the Reds or the Fascists. But, God, it feels lousy to realize that this whole circus of "democratization" was needed only to put the old dog back in the same kennel.""
 HON_forpol.26.a: "Close the notebook and pour another."

 HON_forpol.27.t: "Honduras in the OFN"
 HON_forpol.27.desc: "It felt like half of all Honduras was packed into La Leona Park, gathering around the platform where Modesto Rodas Alvarado gave his speech. The cool breeze shook the trees that shaded Rodas and carried his voice across Tegucigalpa even without the microphones.\n\nRodismo blossomed in the crowd; Rodas had successfully parlayed a military victory into a sweeping program of political and economic reforms, winning the heart of the Honduran public alongside. His most recent achievement was the successful conclusion of negotiations for Honduras to join the OFN as a full member. The American public's interest was piqued, so naturally, a good handful of American journalists were there for the occasion.\n\nThe New York Times had a fine spot, pretty close to the platform and at an angle where the sun's glare didn't dominate the photos. The Los Angeles Times nearly overlapped, and they shuffled against each other for the best view. The Chicago Tribune had somehow trapped himself in a crowd of smiling old indigenous women who held up beautiful floral wreaths.\n\nIn Rodas' campaign against corruption, New Deal-like economics, and personal charisma, Americans saw a new FDR - a real liberal caudillo. It went beyond novelty to a genuine sort of affection for the newest member of the alliance against tyranny. That month, Rodas was on the front cover of Time magazine."
 HON_forpol.27.a: "Rodismo is for Yankees, too."

 HON_forpol.28.t: "Heredero Aparente"
 HON_forpol.28.desc: ""Well," Arthur scratched at his stubble, letting out a sigh, "guess it all worked out in the end, didn't it?" He settled near Robert's desk, a distant phone ringing across the office floor; Robert himself could only shrug, his sentiment similar to Arthur's own. What else could be expected of Rodas' stranglehold over the Partido Liberal de Honduras and, by extension, Honduras as a whole? It was only natural that a successor palatable to his taste would arise, carefully groomed according to his exact measurements and standards, who would carry on his legacy for decades to come. That man, it seemed, would be Roberto Suazo Córdova. For the FBI, it was just business. A job well done, as fortunate as it appeared on paper.\n\n"Not as if Rodas is gonna disappear after this," Robert responded, eliciting a sharp shake of the head from Arthur. "Many in Honduras see him as, well..." The term eluded him, and he'd gesture to the air. "The statesman, you know? A source of stability in Tegucigalpa." He'd let out a slight chuckle at the thought. "Rare as that might be, down in Central America."\n\n"Oh, definitely." Arthur moved to pull a carton from his left pocket, producing a cigarette. "His influence'll linger for a while..." He looked, momentarily, with longing eyes at Robert. Taking the hint, he dug for a lighter within his shirt pocket, lighting his friend's cigarette as Arthur leaned over his desk. Taking a drag, he sighed once more. "Still, what about the communists? Not that they'll win, obviously, but..."\n\n"I get it. They'll react poorly," Robert responded, before shrugging again. "It's nothing Suazo can't handle, at least for now." With this final thought, Robert returned to his typewriter, clacking away at a half-finished report regarding Honduras' less fortunate neighbours. "All quiet on the Honduran front.""
 HON_forpol.28.a: "Where Suazo rises, Rodas remains."

 HON_forpol.29.t: "Address by General Melgar Castro, 1970"
 HON_forpol.29.desc: ""Citizens of Honduras! Sons and daughters of Morazán!\n\nToday I speak to you not merely as a general, but as the defender of an honor that has been trampled by foreign boots for far too long. Look at our ports - do you see the ships leaving, carrying away those who have considered us their property for decades? To them, we were nothing more than a garden in their backyard. They bought our politicians like cattle and thought they had the right to dictate how we live.\n\nBut we proved them wrong. In the fire of war, in the trenches on the border, we forged something greater than victory. We forged dignity! Honduras will no longer stand on its knees, begging for handouts from Washington. Today, we reclaim our land, our resources, and our destiny.\n\nI know there are those among us who tremble with fear. Those used to the master's collar, who now whine as we cast off the chains. They whisper of "rights," of "freedoms"... But whose rights do they care for? The rights of the plunderers? Let them remember: in the new Honduras, there is no place for a fifth column.\n\nHard times lie ahead. They will brand us in the newspapers of New York, they will try to strangle us. But we are not alone. The world is changing, and we have new friends who respect strength. We will go our own way - the way of national pride. And if anyone finds this path unpalatable - let them leave, following their masters.\n\nLong live free Honduras! Long live the Armed Forces!""
 HON_forpol.29.a: "Turn off the radio."

 HON_forpol.30.t: "The Business of Honduras"
 HON_forpol.30.iberia.desc: "Good news from our outreach organizations in Central America - the Hondurans have approached our trade representative in Tegucigalpa with an offer too good to be overlooked. We must move quickly.\n\nIn exchange for very favourable rates on their exports - in particular fruits and bananas - to Iberia (and Europe beyond that), they are offering unprecedented access to their economy. Relaxing restrictions on foreign ownership and investment, reducing duties and transaction fees, and removing a number of troublesome banking protocols that have caused issues would cause the value of Iberian investments currently in the country to increase significantly. To say nothing of the benefits to come.\n\nIf accepted, this agreement would effectively allow us to replace the United States as the major player in the Honduran economy. While this would no doubt cause some disagreements with the Americans, the value of the agreement is too good to be passed up. Were we to obtain such a position in Honduras, our business community would be very well positioned to expand across all of Central America.\n\nWhat should our response to Tegucigalpa be?"
 HON_forpol.30.italy.desc: "Good news from our outreach organizations in Central America - the Hondurans have approached our trade representative in Tegucigalpa with an offer too good to be overlooked. We must move quickly.\n\nIn exchange for very favourable rates on their exports - in particular fruits and bananas - to Italy (and Europe beyond that), they are offering unprecedented access to their economy. Relaxing restrictions on foreign ownership and investment, reducing duties and transaction fees, and removing a number of troublesome banking protocols that have caused issues would cause the value of Italian investments currently in the country to increase significantly. To say nothing of the benefits to come.\n\nIf accepted, this agreement would effectively allow us to replace the United States as the major player in the Honduran economy. While this would no doubt cause some disagreements with the Americans, the value of the agreement is too good to be passed up. Were we to obtain such a position in Honduras, our business community would be very well positioned to expand across all of Central America.\n\nWhat should our response to Tegucigalpa be?"
 HON_forpol.30.germany.desc: "Good news from our outreach organizations in Central America - the Hondurans have approached our trade representative in Tegucigalpa with an offer too good to be overlooked. We must move quickly.\n\nIn exchange for very favourable rates on their exports - in particular fruits and bananas - to Germany (and Europe beyond that), they are offering unprecedented access to their economy. Relaxing restrictions on foreign ownership and investment, reducing duties and transaction fees, and removing a number of troublesome banking protocols that have caused issues would cause the value of German investments currently in the country to increase significantly. To say nothing of the benefits to come.\n\nIf accepted, this agreement would effectively allow us to replace the United States as the major player in the Honduran economy. While this would no doubt cause some disagreements with the Americans, the value of the agreement is too good to be passed up. Were we to obtain such a position in Honduras, our business community would be very well positioned to expand across all of Central America.\n\nWhat should our response to Tegucigalpa be?"
 HON_forpol.30.japan.desc: "Good news from our outreach organizations in Central America - the Hondurans have approached our trade representative in Tegucigalpa with an offer too good to be overlooked. We must move quickly.\n\nIn exchange for very favourable rates on their exports to Japan (and the Sphere beyond that), they are offering unprecedented access to their economy. Relaxing restrictions on foreign ownership and investment, reducing duties and transaction fees, and removing a number of troublesome banking protocols that have caused issues would cause the value of Japanese investments currently in the country to increase significantly. In particular, and given the weakness of the Asian markets at the moment, the introduction of a new market, small as it is, would send a powerful signal of confidence.\n\nIf accepted, this agreement would effectively allow us to replace the United States as the major player in the Honduran economy. While this would no doubt cause some disagreements with the Americans, the value of the agreement is too good to be passed up. Were we to obtain such a position in Honduras, our business community would be very well positioned to expand across all of Central America.\n\nWhat should our response to Tegucigalpa be?"
 HON_forpol.30.a: "Yes. Arrange to sign the deal as soon as possible."
 HON_forpol.30.b: "No. We don't want to antagonize the Americans."

 HON_forpol.31.t: "HONDURAS"
 HON_forpol.31.desc: "RESTRICTED [?global.date.GetDateStringNoHourLong]\n\nFROM JAMES ANDERS\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: STATUS OF HONDURAS WITHIN THE OFN\n\n(R) The Honduran government has cut many of its previously held ties to the OFN.\n'n(R) The Partido Nacional de Honduras (PNH) has won a second term, beating the pro-OFN Partido Liberal de Honduras (PLH)\n\n(R) While the PNH is overall far more anti-American than its rival, it maintained a decently sized pro-American faction. After an internal power struggle, this faction has been removed from power by its rivals\n\n(R) The FBI shall continue to support the remnants of the pro-American faction, as the PNH continues to expand its influence across all sectors of public life, and the prospects of a PLH victory in the future grow smaller."
 HON_forpol.31.a: "Fidelity, Bravery, Integrity."

 HON_forpol.32.t: "HONDURAS"
 HON_forpol.32.desc: "RESTRICTED [?global.date.GetDateStringNoHourLong]\n\nFROM JAMES ANDERS\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: STATUS OF HONDURAS WITHIN THE OFN\n\n(R) The Honduran government has announced that it would abide by all its previous OFN commitments.\n\nFollowing the defeat of the pro-American Partido Liberal de Honduras (PLH) to the incumbent Partido Nacional de Honduras (PNH), and the current expansion of PNH influence in all sectors of public life, it became a worry that Honduras would cut some of its extensive ties with the OFN\n\n(R) The PNH's pro-American faction has won decisively in an internal power struggle against its neutralist opponents. While it is not as pro-American as the PLH, the government has assured us through diplomatic channels that it would not seek to change Honduras' status or any agreements with the OFN\n\nThe FBI shall provide aid to the PNH in suppressing the anti-American faction to secure the United States' interests in the region."
 HON_forpol.32.a: "Fidelity, Bravery, Integrity."

 ##Football war events

 CA_Football_War.4.t: "In the Field, Dissent"
 CA_Football_War.4.desc: "SECRET/[GetMonth], [GetYear]\n\nFROM MICHAEL NAZ\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: SALVADORAN THREAT TO HONDURAS\n\n1. El Salvador's authoritarian regime poses a serious security threat to Honduras, our primary partner in Central America. Citing Tegucigalpa's recent land reform initiatives, which have cleared Salvadoran migrants illegally occupying Honduran land, San Salvador has hyperbolically accused Honduras of genocide and begun a limited mobilization. (CONTINUED)\n\nTOP SECRET/[GetDateText]\n\nFROM CLAYTON DALE\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: FLAWED FBI ASSESSMENT\n\n1. The attached FBI report contains serious errors. Salvadoran peasants are being violently expelled from Honduras, after the latter refused to renew the joint Immigration Act. It is the CIA's determination that the friendly PCN government in San Salvador would likely collapse if refugee flows dramatically increased. Honduras must be restrained. (CONTINUED)"
 CA_Football_War.4.a: "Honduras is our principal ally in the region, and has our full support."
 CA_Football_War.4.b: "Condition Honduran military aid on leniency toward Salvadoran migrants."
 CA_Football_War.4.c: "The turf wars in Washington are worse than in Central America! What is going on?"

 CA_Football_War.5.t: "Deep Play"
 CA_Football_War.5.desc: "SECRET/[GetDateText]\n\nFROM MICHAEL NAZ\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: SALVADORAN THREAT TO HONDURAS\n\n1. El Salvador's anti-American, authoritarian regime poses a serious security threat to Honduras, our primary partner in Central America. Citing Tegucigalpa's recent land reform initiatives, which have cleared Salvadoran migrants illegally occupying Honduran land, San Salvador has hyperbolically accused Honduras of genocide and begun a limited mobilization.\n\n2. We believe this to be more than sabre-rattling. Honduran reports, verified by our attache, confirm that El Salvador is transporting its limited stockpiles of war material to staging grounds. Additional confirmation could be provided by the Central Intelligence Agency, which is believed to have intercepted communications with El Salvador's foreign partners. Despite repeated requests, they have not provided this information.\n\n3. Honduras possesses a larger military than El Salvador and high-quality American equipment. In particular, its air force is superior to its Salvadoran counterpart. However, civil-military relations in Honduras are tense, and the military itself is factionalized. A lack of command and coordination could provide El Salvador an opening in a short conflict.\n\n4. A joint exercise with Honduran forces would address this weakness by forcing cooperation across cliques. Alternatively, providing Honduras with additional military equipment would lift morale while directly increasing force readiness."
 CA_Football_War.5.a: "Proceed with the exercise. Should be easy with all our bases down there."
 CA_Football_War.5.b: "Arm the Hondurans. The Salvadorans will back down in the face of American firepower."
 CA_Football_War.5.c: "This seems alarmist. Our current support is enough."

 CA_Football_War.6.t: "A Demand from San Salvador"
 CA_Football_War.6.desc: "General José Alberto Medrano was prone to wrath on a good day, but his rage redoubled whenever he had to deal with Hondurans. "Who do these Honduran sons of bitches think they are? Threatening our hardworking farmers with force, violently kicking them out? Fucking whoremongers, all of them! I won't let them injure our national pride any further, Sosa; this World Cup qualifier is the perfect opportunity. Our people will already be plenty enraged and we need to put that chance to use and show Tegucigalpa its goddamn place beneath us!"\n\nHis interlocutor, the senior officer General Julio Faustino Sosa, nodded solemnly. "I am in complete agreement, General, on every point you have raised. But there is one major problem,"—here he continued over the scoff from his colleague—"namely, that our munitions stockpiles could get used up if the contract drags on. General Medrano, I have to recommend seeking material and strategic support from Tokyo."\n\nMedrano scoffed again. "Nonsense. The Hondurans are a bunch of prissy good-for-nothing imbeciles. No threat whatsoever. You don't need to waste your effort on bothering Tokyo."\n\nSosa set his chin, giving Medrano pause. "You say so, General, but I cannot assuage my doubts with a heroic spirit alone. I am going to request the Empire give us whatever they can." Medrano, somewhat mutinous, acquiesced, whereupon Sosa reported these deliberations and his requests to the Japanese ambassador."
 CA_Football_War.6.a: "So far away? Well, start preparing some dual-use supplies."
 CA_Football_War.6.b: "Get them some attachés."
 CA_Football_War.6.c: "Are you mad, to antagonise Washington over something so minor?"
 CA_Football_Japan_alone_tt: "\n§FDue to our former §OIberian§! §npartners§! being unable to assist us, we must double our efforts to support our foothold in §DCentral America.§!\nThe fate of the [ELS.GetFlag] §BSalvadorean regime§! falls soley on §eus.§!§!"

 CA_Football_War.7.t: "Grudge Match"
 CA_Football_War.7.desc: "An affront to El Salvador's national dignity. A long piss taken on our flag. A moist dump splattered over everything I-we've built here, Julio," General José Alberto Medrano paced across the Yellow Room of the National Palace. "Hondurans seizing our people's land, throwing them penniless to scavenge... The humiliation will not stand!"\n\nGeneral Julio Faustino Sosa nodded, "I firmly agree, José. There simply is not enough land here to accommodate the dispossessed poor that Honduras is expulsing. I assume you called me here to discuss what we're to do about it?"\n\nMedrano looked Sosa in the eye, then clapped him on the shoulder, "Oh I know damn well what we're going to do about it. We're going to attack Honduras. Put a gun to the head of every politician in Tegucigalpa that didn't renew the Treaty on Immigration and squeeze the trigger so slow that they shit themselves before and after dying."\n\nSosa, stunned by the unexpected contact as much as the plan, remained silent, so Medrano continued, "Hate for the Hondurans is a weapon. And that hate will be sharpened to a point when we play them for the World Cup qualifier. Three games, we let it build up, up -" he lifted his hand from Sosa's shoulder, then thrust it just past his ribs, "then spear the fat little pig!"\n\nSosa spoke at last, "I'd... certainly want to get all the support we could from our allies. Best to write Iberia now, request aid since it'll take some time to arrive."
 CA_Football_War.7.a: "Guns begin the long journey from Sevilla to Acajutla."
 CA_Football_War.7.b: "Crates of pesetas can get to San Salvador by air."
 CA_Football_War.7.c: ""Perhaps it was just wasted ink.""
 CA_Football_War_Iberia_max_aid_tt: "\n§FGoing toe-to-toe on aid with a superpower might be out of our capabilities, but will be necessary if we do not want §BEl Salvador§! to fall into the arms of the §eJapanese.§!§!"

 CA_Football_War.8.t: "Mexico Football War Prelude 1"
 CA_Football_War.8.desc: "No need for loc yet"
 CA_Football_War.8.a: "Rush the Salvadorans ammo, peace can be won through intimidation."
 CA_Football_War.8.b: "We must take a strong moral stand against Honduran violence."
 CA_Football_War.8.c: "We're well-placed to mediate this dispute."

 CA_Football_War.9.t: "Return of the B Team"
 CA_Football_War.9.desc: "SECRET/[GetMonth],[GetYear]\n\nFROM CLAYTON DALE\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: IMMINENT WAR IN CENTRAL AMERICA\n\n1. Violent harassment of the Salvadoran national team at a World Cup qualifying match in Tegucigalpa has further escalated tensions with Honduras. Both countries are preparing for war to resolve the underlying migration dispute. El Salvador's PCN is unable to make concessions on the issue due to commitment to the welfare of the refugees. The CIA's determination is that the only way to avert conflict is to suspend Honduran access to ammunition needed for its almost exclusively American weaponry.\n\nTOP SECRET/[GetDateText]\n\nFROM MICHAEL NAZ\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: INACCURATE CIA ASSESSMENT\n\n1. The attached CIA report is from an unauthorized operation within an area, Central America, that is under the FBI's jurisdiction. Additionally, it is factually incorrect. El Salvador is preparing for an aggressive war of choice against a long-standing American partner. Curtailing military aid at the moment when it is most needed would discredit our reliability and condemn Honduras to an invasion. Honduras' defensive mobilization should be supported through the transfer of surplus arms and ammunition readily available at our in-country bases."
 CA_Football_War.9.a: "Honduras is a staunch ally, free up the supplies they need."
 CA_Football_War.9.b: "El Salvador is defending its people, cut off Honduras temporarily."
 CA_Football_War.9.c: "The war we need to end is between Langley and the FBI! What the hell is going on?"

 CA_Football_War.10.t: "Last Man"
 CA_Football_War.10.desc: "SECRET/[GetDateText]\n\nFROM MICHAEL NAZ\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: IMMEDIATE THREAT TO HONDURAS\n\n1. Tensions between El Salvador and Honduras have spiked after Salvadoran football hooligans set fire to a portion of Chelato Uclés National Stadium in Tegucigalpa following a Honduran victory in a World Cup qualifier match. El Salvador has continued to accuse Honduras of genocide for its efforts to remove illegal immigrants, and rebuffed efforts to mediate. War between the two Central American states is likely imminent.\n\n2. The FBI believes El Salvador has issued orders to advance over the Honduran border, with the incursions to begin following the nations' third World Cup qualifier match. We know the Central Intelligence Agency to possess a copy of the latest Salvadoran general staff meeting notes. They have refused to provide this document, despite their presence in El Salvador being unauthorized and the FBI's jurisdiction over Central America. These actions by the CIA are of serious concern, and could jeopardize American national security interests.\n\n3. El Salvador is an aggressive authoritarian government with ties to hostile powers. By contrast, Honduras is a consistent supporter of US priorities in the OAS, open to U.S. investors like the United Fruit Company, and has given us basing rights that enable critical power projection in Central America. A serious commitment, such as immediate transfer of military helicopters or a political intervention to cohere the Honduran military in the face of the threat, is warranted."
 CA_Football_War.10.a: "Air superiority is the Hondurans' chief advantage. Send them the choppers."
 CA_Football_War.10.b: "Military dysfunction is the Hondurans' greatest weakness. Give them a call."
 CA_Football_War.10.c: "Honduras can see off these tinpots. I'll not put America in another quagmire."

 CA_Football_War.11.t: "Salvadoran Consternation"
 CA_Football_War.11.desc: "The first hurdle came quickly and sent El Salvador stumbling: Honduras won the first qualifier match at home in Tegucigalpa, causing angry Salvadoran visitors to set fire to the stadium. As démarchés and propaganda posters flew back and forth, Salvadoran military preparations became too blatant for Honduras to ignore. As a result, the frontier militarised at a rapid pace.\n\nJulio Faustino Sosa put his head in his hands. "God damn it, I should have known better than to trust promises of a quick and easy triumphant war. Medrano's going to drive us off a cliff, leave us humiliated at the frontier, unless I do something."\n\nSome papers came into Sosa's field of view, causing him to sigh deeply. Having warned Medrano of a risk of a shortage of military equipment, Sosa had ordered an immediate inventory of all matériel in all armories and garrisons throughout the country. The results had caused him to grit his teeth.\n\n"Yes, I know the Japanese ambassador said he couldn't provide anything more so close to the United States. God damn it, it hurts my pride, but I don't think I have a choice," Sosa muttered, bunching his officer's cap in his fist. "I need to go the embassy again and see what else they can provide.""
 CA_Football_War.11.a: "Who cares about Washington? Blatant aid is fine, our ally must survive!"
 CA_Football_War.11.b: "Smuggle in as much as is humanly possible."
 CA_Football_War.11.c: "Medrano at least has a man's confidence; Sosa is a damn paranoiac."

 CA_Football_War.12.t: "Travelling Army"
 CA_Football_War.12.desc: "Like half the Salvadorans on the street, General Medrano was cursing Honduras.\n\nHis mind, however, was not on the 1 - 0 loss that El Salvador had just experienced in the first of three World Cup qualifying matches. And the vocabulary filling the Yellow Room of the National Palace would have made the most rabid fan of La Selecta blush.\n\n"They're mobilizing goddamnit! Their Yanqui pimps must have whispered what we were going to give to them," Medrano threw back another slug of rum, "So many fuckin' wenches they're squeezing into uniform, it's gonna take months to-"\n\nGeneral Sosa, hands poised at the typewriter, interrupted, "Please get to the point, José. I need something I can write to Generalísimo Franco, ideally something that won't get you excommunicated if it fell into the wrong hands."\n\nMedrano growled, "In short, we're outnumbered. We'll throw in the National Guard, of course. Volunteers will line up outside the recruiting office. But there's so many Hondurans. We'll still win. But they'll stretch our line from here to Hell's most frozen pit. I want to concentrate our men to punch through to Tegucigalpa," he thwacked his palm with force, "not send little body blows along the border."\n\nSosa raised an eyebrow, "And how will Iberia provide us the manpower we need so quickly? I'm unsure if Franco can build an air bridge from Morocco to San Miguel.""
 CA_Football_War.12.a: ""The Caudillo'll talk to his friends in the Condor Legion.""
 CA_Football_War.12.b: ""Surely, Iberia can afford some mercenaries.""
 CA_Football_War.12.c: ""Dammit Julio, help me think here!""

 CA_Football_War.13.t: "Prelude 2 Mexico"
 CA_Football_War.13.desc: "No loc needed yet"
 CA_Football_War.13.a: "Get the whole Veracruz Pact behind El Salvador - fuel, ammo, guns, everything!"
 CA_Football_War.13.b: "We stand by our ally, send what we can."
 CA_Football_War.13.c: "We're not going to jeopardize the World Cup over this."

 CA_Football_War.14.t: "Barra Brava"
 CA_Football_War.14.desc: "The whistle of the rock lasted a moment, then came the explosion of glass.\n\nJulio was no weakling. He went through first, taking a few scrapes for the cause. For his brothers.\n\nJulio was no thief. It was the rich Salvadorans who were thieves, stealing land across Honduras when his people couldn't feed themselves. He would have taken the land back, but he lived in the barrio. Had never left Tegucigalpa in his life, couldn't afford to.\n\nJulio was no thug. Sure he got rowdy after a game. After a 3-0 loss. After the Salvadorans flew a dirty rag instead of the Honduran banner. After those thugs killed Hondurans where his team was staying in San Salvador. \n\nJulio was no murderer. The Salvadoran shopkeeper, with wild eyes and a gun in his hand, he was. He would have been. Julio threw him to the ground and kicked. And stomped. And the murderer stopped moving.\n\nJulio was a football fan. As his fellow fans poured into the shop, grabbing whatever they could, he went first for the radio. The radio where he could listen to the third World Cup qualifying match between Honduras and El Salvador."
 CA_Football_War.14.a: "The radio where he'd hear that El Salvador had dissolved diplomatic relations."

 CA_Football_War.15.t: "Offside"
 CA_Football_War.15.desc: "The buzz of two Honduran T-28 Trojans, flying all too nearby, drew Marco's head out the window of the bulldozer. Peering up into the all too blue, all too Honduran sky, he spotted them, flying away from the Salvadoran column. "We're clear," he shouted, thumping his hand on the sheet metal welded to the bulldozer's side as armor.\n\nHe expected the major to bellow and the roar of twenty engines to drown out the planes' buzz, growing more distant as they sought out different Salvadorans to slay. But no order came.\n\nAfter a minute or two of waiting, two minutes of not advancing down the Sula Valley or shooting Hondurans, Marco opened the door and strode to find the major. He found the older man consulting a yellowed map and the fork in the dirt roads ahead.\n\nMarco said, "The shortest route to our objective is left, sir." The major visibly bristled, and opened his mouth - but Marco spoke first, "We lived not far from here. Farmed the land. I walked these roads to get to market. They forced us out last year."\n\nThe major appraised him with brown eyes before giving a slight nod, "All left!" he shouted.\n\nAs he walked back to the bulldozer, Marco would have felt pride,"
 CA_Football_War.15.a: "If rage had not consumed his heart."
 CA_Football_War_tt: "§FThe Football War between [ELS.GetFlag]§BEl Salvador§! and [HON.GetFlag]§MHonduras§! has §Rbegun§!§!"

 CA_Football_War.16.t: "Upset Win"
 CA_Football_War.16.desc: "SECRET/[GetDateText]\n\nFROM MICHAEL NAZ\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: HONDURAN VICTORY IN 'FOOTBALL WAR'\n\n1. Honduras defeated El Salvador in a short conflict, using its more numerous military and American aircraft and training. U.S. intelligence support through the FBI was also instrumental in achieving the decisive breakthrough near San Miguel. El Salvador sought a negotiated peace through the OAS, which allowed us to settle the war on U.S. terms.\n\n2. Key Honduran officials and citizens' groups have expressed gratitude for U.S. support, before, during and after the war. The peace treaty has seen an upsurge in public support for the administration: the indemnity from the Salvadoran government and the orderly repatriation of illegal Salvadoran migrants are both viewed as critical for the impoverished and land-constrained country.\n\n3. El Salvador's government, closely tied to its military, has been thoroughly discredited by a failed war of choice. It is probable that the returning peasants and budgetary strain of the war reparations will destabilize El Salvador's economy and government. A return to that nation's cycle of coups and counter-coups is probable. FMLN communist guerillas may also seek advantage.\n\n4. While the conflict was resolved successfully for U.S. interests, the unauthorized CIA operation in San Salvador greatly complicated intelligence activities in the region. This operation should be ceased, and its resources transferred to appropriate FBI offices."
 CA_Football_War.16.a: "Fidelity, Bravery, Integrity."
 CA_Football_War_16_ELS_Help: "Our contributions to El Salvador appear foolish in the wake of Honduras' victory."
 CA_Football_War_16_NO_Help: "Our balanced approach prevented reputational damage in the Football War."
 CA_Football_War_16_HON_Help: "Our contributions to Honduras' victory in the Football War have not gone unnoticed..."

 CA_Football_War.17.t: "Promotion and Relegation"
 CA_Football_War.17.desc: "SECRET/[GetDateText]\n\nFROM CLAYTON DALE\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: SALVADORAN VICTORY IN 'FOOTBALL WAR'\n\n1. El Salvador defeated Honduras in a short conflict. Though its forces were less numerous, they exhibited greater discipline and were backed by a more modern, industrial economy. Salvadoran troops succeeded in approaching Tegucigalpa and advancing up the Sula Valley, forcing Honduras to turn to the OAS for a negotiated peace. The U.S. was accordingly able to mediate an end to the conflict on favorable terms.\n\n2. The ruling PCN of El Salvador is anticipated to benefit from the war reparations secured from Honduras, reinvesting them into growing the nation's burgeoning chemical and long-dominant coffee sectors. Additionally, it is experiencing a surge of popular backing because of its successful protection of Salvadoran migrant rights.\n\n3. Honduras, long under-developed, is expected to experience political instability following its defeat. Civil-military relations and military factionalism, already concerning, are expected to worsen. Accordingly, it may benefit the U.S. to continue the transition toward El Salvador as our preferred Central American partner.\n\n4. Separately, the tradecraft errors of our FBI colleagues in Central America are concerning. Their territorialism and limited competence would have resulted in the U.S. tying itself to Honduras' failures."
 CA_Football_War.17.a: "AND YE SHALL KNOW THE TRUTH AND THE TRUTH SHALL MAKE YOU FREE."
 CA_Football_War_17_ELS_Help: "Our contributions to El Salvador's victory in the Football War have not gone unnoticed..."
 CA_Football_War_17_HON_Help: "Our contributions to Honduras appear foolish in the wake of El Salvador's victory."

 CA_Football_War.18.t: "Benched"
 CA_Football_War.18.desc: "SECRET/[GetDateText]\n\nFROM MICHAEL NAZ\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: HONDURAN VICTORY IN 'FOOTBALL WAR'\n\n1. El Salvador has defeated Honduras in a short conflict. Benefiting from covert support from their foreign backer, the Salvadorans blitzed toward Tegucigalpa and up the Sula Valley. The threat of U.S. intervention in favor of Honduras was able to force the two to OAS-brokered negotiations, where the damage of the defeat was partially mitigated.\n\n2. The impact on Honduras, a U.S. commercial, political, and military partner, is likely to be substantial and negative. Leftist and rightist groups are already protesting the government's failure to prosecute the war. Figures from both the PLH and especially the PNH are seeking to distance themselves from the U.S., decrying our 'betrayal' to provide adequate support and the peace agreement's imposition of reparation payments to El Salvador. The Salvadoran illegal migrants also must be allowed to remain, stalling the previous land reform initiative.\n\n3. The anti-American Salvadoran regime, by contrast, has emerged stronger, cementing its military reputation and popular backing while firming up its ties to hostile powers abroad. Heightened monitoring of San Salvador is necessary for regional and U.S. security. This will necessarily entail the dissolution of the unauthorized CIA operation there, and the cession of all resources and information to the relevant FBI office."
 CA_Football_War.18.a: "Fidelity, Bravery, Integrity."

 CA_Football_War.19.t: "Yellow Card"
 CA_Football_War.19.desc: "General Medrano stopped twisting. The screaming took a little longer to stop.\n\n"You answer my questions, and this all gets easier," he paused and took a sip from his flask. Then drew close to the mangled pulp his prisoner's face had become. "How could a bunch of flaccid Honduran fucks get to the outskirts of San Miguel? Did you help them in the war? Did your little communist friends from the FMLN help them?"\n\nMedrano started twisting again. What was left of a man started crying out. "Answer, you sack of scum! Answer me, damn it! Are they sending more of you back? Are they trying to tear us down?" His only answer was sobs and what might have been a plea to stop, from what might have been a mouth.\n\nMedrano stepped away, pulled off his blood-stained gloves and picked up the phone. "Sosa, more are coming amongst the refugees. You know it, I know it. And instead of buying bullets to put in the head of these commies, we're giving half the budget to Tegucigalpa as reparations. Put some letters together asking Tokyo and Madrid for money. They're all we've got now."\n\nHe slammed the phone down. And went back to work."
 CA_Football_War.19.a: "Provide El Salvador the support it needs..."
 CA_Football_War_Save_Nationalist_Regime_tt: "Or we risk it §Rfalling apart§!."
 CA_Football_War.19.b: "Not another cent for those failed soldiers."

 CA_Football_War.20.t: "La Selecta"
 CA_Football_War.20.desc: "Salvadoran National Guardsmen had sealed off the Savior of the World Plaza, allegedly to prepare it for the triumphal military parade that would be passing tomorrow. But General Julio Faustino Sosa had actually given the order to prevent citizens from seeing their newly minted war hero so sloppily drunk in public.\n\nPresently, the inebriated General José Alberto Medrano was praying at the base of the Divine Savior of the World Monument, words ascending up the cross-pillar, past the globe, to the figure of Jesus atop. And perhaps to Heaven beyond.\n\n"Lord, we thank you, thank you for the valor and might you have granted the Shalvadoran Armed Forces. May those who died in glorious war, find peashe in your arms."\n\nHe opened his eyes, just a mote, and caught sight of the globe on which Jesus stood, "And Lord, we thank you for the strength of Japan and the zeal of Iberia. They shtood beside us to defend the innoshent and our nation. Shalvadorans will keep the land you gave them."\n\nThen his tone hardened, "And sh-smite down the Honduran dogs, and their Washington masters. That took us to the OAS instead of letting us march through Tegucigalpa. They'll pay us reparations, yes, but we'll be paying widows pensions with thirty pieces of silver."\n\n"Amen," Medrano stood, wobblingly,"
 CA_Football_War.20.a: "But with a victor's grace."
 CA_Football_War_Nationalist_helped_tt: "Our contributions to El Salvador's victory in the Football War have not gone unnoticed..."
 CA_Football_War_Nationalist_didnt_tt: "El Salvador must have triumphed by divine will alone."


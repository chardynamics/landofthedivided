 SSC_The_Rest_Remaining_desc: "For all of the accomplishments we have achieved with free rule, half of our state can only watch from aside. After Helm's integration of extremists into the Raleigh Administration, Beasley's brave decision to lead a free and unified South Carolina lasted only hours. So began the Carolina War. Even though we managed to hold the line on the Santee River, our forces were unable to counterattack the numerically superior Movement forces. Ever since, the issue of liberation has been one of the state's top priorities. With Raleigh's strong prescence on our border and a fundamental lack of resources to mount an offensive, we can only wait for an opportune moment to strike."
 SSC_Productive_Administration: "Productive Administration"
 SSC_Productive_Administration_desc: "The State of South Carolina has entered a renaissance, at least in comparison to the rest of the American states. Maybe it's because the government is free from high defense spending or constant war, but the South Carolina government has been able to properly function, restoring stability. While not perfect, it has been good enough to spur on economic growth, which has improved local quality of life."


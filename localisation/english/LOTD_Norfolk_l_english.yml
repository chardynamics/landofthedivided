l_english:
 NOR_Military_Civilian_Administration: "Military-Civilian Administration"
 NOR_Military_Civilian_Administration_desc: "As the home of the Federal resistance to the Movement in the DMV area, our government has been blessed with major parts of the pre-war bureaucracy. As such, our state has been able to maintain normalcy, even during this 'extended emergency' crisis. The major difference has been the role of the military. Under martial law, the state has become a tool of the military, rather than the other way around. In many ways this has been beneficial to our administration; we have been able to maintain order and stability at a better level than other states. However, this has importantly come at the cost of civil liberties, as the military can move with impunity against freedom of speech and assembly."
 NOR_A_Powderkeg: "A State On Edge"
 NOR_A_Powderkeg_desc: "Although our forces managed to hold on at length against the Movement, we have been forced to retreat to our current precarious territory. While it helped secure the lines and stopped the Movement from overrunning us completely, our miniscule remaining territory could capitulate at any time. As such, the frontline has been well fortified, and our military has maintained a constant state of readiness. Whether it be the last stand or the next offensive, our men are ready to fight vailantly."
 NOR_Naval_Heritage: "Interservice Favoritism - Navy"
 NOR_Naval_Heritage_desc: "The Norfolk area has long been a stronghold of the United States Navy, and as such our state naturally has a strong naval tradition. This strong relationship with the Navy has been beneficial to us, as we have been able to use their extensive resources to maintain our state and military. However, this has not come without its drawbacks, as the Navy usually is given uncompetitive, preferential treatment over the other military branches, most notably the Army. As our state is a unified military command, with parts of all of the armed forces, this has deepened interservice rivalries. While not a currently paralyzing issue, pragmatically speaking, this is an issue better solved than ignored."

 norfolk.2.t: "Norfolk, South Carolina Cross Borders"
 norfolk.2.desc: "Reports this morning about skirmishes in Raleighite-controlled South Carolina appear to coincide with confrontations near the Norfolk State, confirming a wider war in the South Atlantic. After the death of Jesse Helms, Regulator protests in Charlotte allowed the South Carolinian government to liberate their territory. At the same time, Norfolk forces crossed the Raleighite and Virginian borders to complement the southern offensive and as a gambit on capitulating the Raleigh and Virginia states.\n\nWith fronts on all sides, it seems that the Raleigh Administration is in a precarious position. All eyes will be on Virginia, whose forces will likely play a decisive role for the defending sides. All is to lose for both sides in the conflict."
 norfolk.2.a: "So the dominos fall."

 NOR_William_Fallon: "William J. Fallon"
 POLITICS_WILLIAM_FALLON_DESC: "Maybe Fallon wouldn't be the first choice to be a state leader, but his background and choices have led him to be the man for the Norfolk State. His experiences as a A-7 Corsair pilot during the final years of the Cuban War allowed him to witness the worst of the American war machine: an unclear strategy, political flipflopping, and systemic ineffiencies. From flying sorties on insurgent positions to safeguarding the withdrawing convoy of American ships out of Cuba, Fallen saw first hand how the United States had effectively accomplished nothing in Cuba for all the men and time spent. Fallon learned what many saw, but instead of taking an extreme approach, he sought to clean up the military bureaucracy from the inside and preserve what made it great.\n\nSlowly assuming more responsibility in the following decades, Fallon's powers allowed him to begin the change he sought. On the eve of the 2nd American Civil War, Fallon was posted at Naval Station Norfolk as Commander of the 2nd Fleet. Most importantly, his vital decision to stand and fight when other leaders flipped or stayed silent let him to rise to Commander of a quickly reformed Atlantic Command. His decisions and reforms allowed Federal forces to withstand and hold on, even against numerically superior Movement forces.\n\nToday, Norfolk operates as a highly efficient yet rump state. It will be under his own judgement whether Norfolk is able to free itself from its borders, or be overrun."
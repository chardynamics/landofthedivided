NIC_Their_Son_of_a_Bitch_ARG_desc: "There was only so far the American government could push Managua. Facing continual rejection, Managua has now shifted its rhetoric, condemning Washington as simultaneously imperialist and degenerate, and embracing a new ally instead. Whilst not as geographically close, Nicaragua seems likely to tie themselves deeply into their new partnerships, not expecting to be pressured into reforms\n\nPrivately, the Somozas are relishing in their newfound freedom. Every new programme that comes from Eurasia provides not a call for free elections or the protection of dissidents, but a smiling diplomat and a firm handshake. Free of one more external threat, Nicaragua has forged a new, firm alliance, perhaps for decades to come."

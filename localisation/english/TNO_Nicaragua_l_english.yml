 NIC_forpol.1.t: "Friends in Broad Daylight"
 NIC_forpol.1.desc: "The sun was merciless on Nicaragua that day. Nevertheless, the American ambassador, Adlai Stevenson, gracefully walked down the stairs smiling, not just for the surrounding flashing cameras, but also for the man below.\n\n"Adlai!" President Luis Somoza stood erect, flanked by military generals and ministers with a smile more polished than sincere. "Welcome to the Land of Lakes and Volcanoes."\n\n"Thank you for the welcome, Mr. President." Stevenson grinned. "And of course, congratulations on your recent election. However, Washington is... growing increasingly concerned with your government, Mr. Somoza. Arrests, censorship, disappearances..."\n\nSomoza chuckled under his breath. "Yet, Mr. Stevenson, Washington still signs our checks."\n\n"Not out of charity, my friend." Stevenson politely waved to reporters as he passed by, trying to keep their conversation under wraps. "We operate an Organization of Free Nations, and one rotten apple spoils the barrel."\n\n"So long as the rifles arrive on time..." Somoza said, stopping right before the limousine convoy, "... I assure you, Nicaragua will remain the most loyal ally this side of the canal."\n\nStevenson looked at him dejectedly. American foreign policy rewarded loyalty more than anything, not democracy. He sighed before stepping into the car, intending to uphold liberal ideals, but leaving with lousy pictures."
 NIC_forpol.1.a: "Just renew our trade agreements. Let's not get too eager."
 NIC_forpol.1.b: "Renew our trade and offer government aid. Stability is a priority as well."
 NIC_forpol.1.c: "Trade, aid, and bullets. Let's go the full mile for the Somoza Dynasty."
 NIC_stolen_money_tt: "§YThis investment will not reach the Nicaraguan people.§!"
 
 NIC_forpol.2.t: "Somoza & America"
 NIC_forpol.2.desc: "You took a plane from Miami to Managua. The plane had LANICA on the fuselage. At the airport, you stop for a coffee. Later, you took lunch with a friend, and you ordered beef. You bought a local newspaper. You checked into a hotel. You had fish for dinner. Somewhere, in all these transactions, the Somoza family has taken a cut.\n\nSuch are the many entries of Somoza's economic portfolio. Its hooks are dug deep into the Nicaraguan economy. There are few sectors in-country where the Somoza's presence is not felt: across primary, secondary and tertiary sectors; from resource extraction to refinement; from banks to farms, from mansions to apartment blocks. Even if you were to go back, you might still feel their hand brushing on your shoulder. They own condos in Miami, clubs along the beachfront.\n\nYou looked up. A LANICA plane flew overhead. Representatives of the Somoza family were onboard, heading to their mansion in Palm Beach, Florida. It may have been registered to a company in the Virgin Islands, but when President [USA.GetLeader] visits, he knew who it really belonged to.\n\nYou read the newspaper. Somoza's on the front page, talking about further economic ties with the United States. On the page, it's all promises and praise. There's a photo with him and Adlai Stevenson. You see the smile on Somoza's face, too wide to be true. You read between the lines. There's tension in that smile. Somoza just got out of a bad meeting when that photo took place. Something about how the Somoza government presents itself, how it deals with dissidents. Too much like Japan. Too much like Germany."
 NIC_forpol.2.a: "Still, Somoza's America's man. But for how long?"
 NIC_Somoza_tt: "§FThe §sSomoza Dynasty§! are a §Ychallenging§! partner for the §QOFN§!, if we desire to keep them aligned, we must be willing to make §Yconcessions§!.§!"

 NIC_forpol.3.t: "Somoza & Trujillo"
 NIC_forpol.3.desc: "You woke up. You left your hotel room. You picked up a newspaper from reception. It's exactly what you feared: Puerto Plata defeated, American power deflated. You put the paper away and pick up a taxi. There were meetings to attend, deals to make, contacts to manage. Outside you saw the streets of Managua; taxicabs and pedestrians passed by without urgency.\n\nThe meetings were cut short. Some deals fell through, others renegotiated. Your contacts seemed more quiet than normal. You felt the ripple of Puerto Plata running through the country in the hesitancy within the voices of your contacts. The day ended with little profit. You went to sleep thinking about it all.\n\nDespite the many economic ties between Nicaragua and the United States (but you correct yourself: ties between the Somoza family and the United States), you could hardly call Somoza anything more than a fair weather friend. He was quite happy to take American aid, and certainly more than happy to buy up American real estate. He was less enthusiastic about accepting the obligations and commitments that came with the aid. Reforms were slow-rolled, momentum only acquired when the ambassador pushed it through, while the repression and brutality endemic among even the friendliest of strongmen regimes became increasingly brazen under the Somoza government.\n\nYou figured that something was going to give, sooner or later.\n\nYou wake up. You leave your hotel room. You pick up a newspaper from reception. On the front page was Somoza's face. Headline/subhead: "SOMOZA ANNOUNCES CENTRALISATION LAW" / "PRESIDENT CITES ONGOING CRISES IN LATIN AMERICA: 'WE MUST BE STRONG IN THESE TIMES'"."
 NIC_forpol.3.a: "You curse under your breath and stuff the paper back into its shelf."
 NIC_forpol.3.b: "You curse under your breath and think of the price to keep Nicaragua aligned."
 NIC_Trujillo_tt: "\n§ROur failure to oust Trujillo has cemented an authoritarian vision with the §SSomoza Dynasty§!.\nIt will be harder to convince them to reform in the future.§!"
 
 NIC_forpol.4.t: "Somoza & Balaguer"
 NIC_forpol.4.desc: "You woke up. You left your hotel room. You picked up a newspaper from reception. It's exactly what you suspected: Puerto Plata stalled out. Trujillo's out, Balaguer's in. As far as Caribbean strongmen went, Balaguer seemed like a reasonable sort. He and Somoza would get along well. You put the paper away and took a taxi. Through the streets of Managua, the taxi slithered past street hawkers and kids playing soccer.\n\nYou met with a few representatives of the Somoza government. Under the cover of trade deals and diplomatic protocol you gauged their interest in the Dominican Republic. They spoke positively of Balaguer. They were pleased that a more reasonable leader has found himself in Santo Domingo. Their criticism of Trujillo seemed perfunctory in your presence, but you'd come to expect that of Somoza's officials. Over a steak dinner, you hear that some of Balaguer's men flew up to meet one of the Somoza kids, the ones who could be trusted to hold court in their Palm Beach mansion and represent the interests of their father's country.\n\nYou returned to your hotel room. You turned on the radio. You briefly considered a nightcap at the hotel below, but you put that aside and made do with a glass of scotch from the hotel room cabinet. You opened the balcony door and take a seat on the patio furniture. Outside, you took in the lights of Managua at night. You took a sip. It all worked out so conveniently, didn't it? All they wanted was a man who reflected their own behaviour so that they could excuse their own indulgences. They wanted a model for a Central American dictator who could still cash American cheques. Balaguer, at least, was a better role model than Trujillo.\n\nYou wake up. You leave your hotel room. You pick up a newspaper from reception. On the front page was Somoza's face. Headline/subhead: "SOMOZA TO VISIT DOMINICAN REPUBLIC" / "A NEW CHAPTER IN NICARAGUAN FOREIGN POLICY"."
 NIC_forpol.4.a: "You put the paper away without a second thought."
 
 NIC_forpol.5.t: "Somoza & The Legion"
 NIC_forpol.5.desc: "You woke up. You left your hotel room. You picked up a newspaper from reception. It's exactly what you wanted: the hammer of liberty smashed through Puerto Plata and into Trujillo. You left the hotel in a good mood. You took a taxi to meet your contacts. Your good mood didn't rub off on them. A cloud of frustration like radio static covered their eyes and ears. They couldn't hear your reassurances.\n\nYou found a bar on the beach, and waved down a visiting friend from the Bureau. It was the Legion, they said. It's exactly what they fear when they go to sleep at night: America deciding that its commitment towards regional and international democracy isn't just for show. Sure, Trujillo wasn't a friend to the United States. But now America's starting to push its weight around, and now Somoza's boys are wondering if they're going to feel the same hammer that fell on the Dominican Republic. You turned around on your stool. The waves rolled against the beach gently. The sun is high above you, illuminating and uncaring. You took a sip of beer. The wind carried the taste of something bitter.\n\nYou went back to the hotel. Room service brought up your dinner. You barely touched your steak. You were busy staring out the window, into the Managua cityscape, distant lights bouncing off the glass. Somewhere amongst those lights is Somoza. What must he think of America now? For a moment, you thought he was staring right back at you. Then, you realise, he's not looking here. His eyes were west, across the Pacific; east, across the Atlantic. Looking to patrons that'll accept him for the stable authoritarian that he is.\n\nYou wake up. You leave your hotel room. You linger at the front. There's a meeting with a Somoza official. Someone high up enough to have his ear. You've also been told that he isn't exactly interested in seeing you. You could press him further. But if you skipped it, he wouldn't mind. It would merely confirm what Somoza's already thinking about the United States."
 NIC_forpol.5.a: "You took the meeting, reassuring Nicaragua and Somoza of their importance."
 NIC_forpol.5.b: "You skipped the meeting; nothing you could say would help here." 
 
 NIC_forpol.6.t: "Somoza & Gaitán"
 NIC_forpol.6.desc: "You woke up. You left your hotel room. You picked up a newspaper from reception. You had nowhere to be that morning, so you settled into the hotel café, ordered a coffee and thumbed through the newspapers. News on the ongoing German clusterfuck dominated the international section. You skipped over who the New York Times thinks is winning, trying to parse information between the lines. There's nothing there that you can see. It's not your continent; it's not your world. Flecks of apple cruller litter the half-page on Guangdong's ongoing election for Chief Executive.\n\nBuried in the international section was a brief item on the Colombian conflict. This caught your eye. You read closer, but there's nothing there for you. Most of what they wrote was already known to you: the Central Government's fighting nationalists and fascists in all direction but East.\n\nYou set the paper down on the table, taking a sip of your home-grown coffee. You recall a photo you saw (you forgot where), Somoza shaking hands with President Laureano Gómez Castro. This was before the stroke, before Roberto Urdaneta Arbeláez got shoved into the presidency, before everything else that ripped apart the heart of Colombia. Even with all this in mind, Somoza might still be willing to work with the Central Government. You took another sip, looking at the picture of your man in Colombia, and the reason why he can't work with them anymore.\n\nCapitán Salcedo was hardly what Somoza wanted in a friend. A Gáitanista, a revolutionary and a socialist; three flavours not on Nicaragua's palate. The cards were on Uncle Sam's hands, who they backed, who would win, all Somoza could do was watch. Deep down, you know he's afraid of what another Cuba could mean. Gaitán's spirit will flow out from a Revolutionary Colombia, and Somoza fears his dread spirit haunting his dictatorship."
 NIC_forpol.6.a: "You put the paper away, and went about your day."
 
 NIC_forpol.7.t: "Testing Nicaragua"
 NIC_forpol.7.desc: "SECRET/[?global.date.GetDateStringNoHourLong]\n\nFROM SCOTT BYRNE\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: Tensions with Nicaragua\n\n1. Our aid to the URC has brought consternation beyond the country's borders. Nicaragua's government has begun to shift away from its long-running support for our shared interests within Central America, which may escalate. With the strength of left-wing elements in the country, and with Castro's revolution in Cuba, many worry that they could be next.\n\n2. Many Nicaraguan diplomats view our stance in Colombia with real fear. The rise of left-wing opponents of Somoza's regime, such as Carlos Fonseca Amador, has sown paranoia that a left-wing uprising could receive tacit American support. Little has currently occurred beyond private condemnations, but intercepted signals show that Somoza is considering a geopolitical realignment.\n\n3. Currently, there is a clear, if manageable risk of this escalating further, but offering our support to Somoza could assuage these fears. Nicaragua is still an ally, but there are now."
 NIC_forpol.7.a: "AND YE SHALL KNOW THE TRUTH AND THE TRUTH SHALL MAKE YOU FREE."
 
 NIC_forpol.8.t: "Voter Security"
 NIC_forpol.8.desc: "Across the room containing the impromptu gala, most diplomats, American and Nicaraguan alike, engaged in reverie and entertainment, laughing at muttered jokes. Not Michael Rees. He had never wanted to be part of this mission; indeed, he had initially been assigned to Peru, then to Venezuela. However, rumours that Nicaragua was seeking realignment had been enough to upend American policy, forcing a massively expanded diplomatic corps to work overtime to woo him back over.\n\nA toast. Luis Somoza Debayle first dragged himself to the front of the room, his stature catching an eye that quickly turned to a crowd as he tapped a fork unto his cup. Vivified, he begun to speak, his voice immediately taking on a stronger twang, words loosening as he bragged about his past doubts, and his reconversion to the American way. To cheers, he pronounced his endorsement of American actions across the globe, right down to the Colombian issue that had once been a pivotal form.\n\nThe applause came, relief blended imperceptibly with general support. In the morning, of course, this speech would become more formal. Somoza would send new missives to the press, their articles on Colombia turning from existential dread to total apathy. Over the next few days, money would quietly make its way through to Managua, and Somoza's events would become just slightly more lavish. Once more, the regime, nestled in its spot within America's hegemony, would go on.\n\nStill standing on the sidelines, Rees struggled to justify it. He knew what the Somoza dynasty stood for, and what their continued regime would lead to. And yet, he knew where it would have otherwise gone. Had the United States truly eschewed Nicaragua, they simply would've rushed into the arms of Germany, or Iberia. This was the best that could be done to prevent that hole from opening. As his internal calculus worked to justify the measure, Rees pushed himself further into the crowd."
 NIC_forpol.8.a: "Thoughts, lost to the status quo."

 NIC_forpol.9.t: "Silver Linings"
 NIC_forpol.9.desc: "SECRET/[?global.date.GetDateStringNoHourLong]\n\nFROM SCOTT BYRNE\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: American relations with Nicaragua\n\n1. Although the defeat of the URC in Colombia has set back American interests in the region, this defeat has not left us totally helpless. Many strongmen uncomfortable with our past support for the Gaitanists, such as Somoza in Nicaragua, have begun to make efforts to restore ties, and have reduced their cooperation with geopolitical rivals.\n\n2. Discussions between American and Nicaraguan diplomats have been more positive in recent weeks. Some consternation still remains over our support for the URC, but has been expressed in the form of seeking reassurance, rather than outright condemnation. Recent efforts to attain new American contracts have also been made by numerous Nicaraguan businesses, indicating a reversion to pre-war relations.\n\n3. Without a totally conciliatory policy, it is unlikely that Somoza will totally abandon his recent measures. However, there is no reason to presume that such moves will go beyond rhetoric. Nicaragua, should there be no unforeseen developments, should remain aligned with the United States, and should alleviate the cost of our defeat in Colombia."
 NIC_forpol.9.a: "AND YE SHALL KNOW THE TRUTH AND THE TRUTH SHALL MAKE YOU FREE."
 
 NIC_forpol.10.t: "Dictatorial Betrayal"
 NIC_forpol.10.desc: "SECRET/[?global.date.GetDateStringNoHourLong]\n\nFROM SCOTT BYRNE\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: American relations with Nicaragua\n\n1. Our support of the Gaitanists has not come without cost. Many of our authoritarian allies, view our moves as a sign of wider policy shifts that risk coming against them, whilst strongmen such as Somoza have begun to formalise past efforts to shift away from their previously close ties to the United States.\n\n2. In Nicaragua, rhetoric targeted against American efforts has only intensified. Diplomatic missions have been recalled, whilst trade and military cooperation has drastically declined. Intercepted messages also indicate outreach efforts from Nicaragua to regimes within Europe. Fear of an incoming left-wing uprising has become neurotic, albeit one given some credence by Fonseca's insurgency.\n\n3. At this stage, I struggle to see how this can be resolved, even if we fully withdraw support from Colombia. Many of the measures taken by Nicaragua are irreversible, and would take years to reconcile, especially considering their shifts towards Europe. With the wider frustrations of strongmen once loyal to us, though, any response to Somoza's shift has to be carefully measured."
 NIC_forpol.10.a: "AND YE SHALL KNOW THE TRUTH AND THE TRUTH SHALL MAKE YOU FREE."
 
 NIC_forpol.11.t: "Exit Nicaragua"
 NIC_forpol.11.desc: "The first sign that something was amiss was the very presence of Lillian Somoza de Sevilla Sacasa. She had never been one to attend meetings for the OAS; instead, her position had always been moving through meetings and events held around New York. To see her present in the meeting, and the typical Nicaraguan representative completely missing, was already cause for expectant discussion. She remained quiet, but only barely, as the meeting slowly drew to her.\n\n"For years, we have worked diligently within the Organisation of American States, hoping that our efforts would help to ensure a stable continent." she shouted, leaning into the microphone. "But we now see we have been working for the wrong cause. The United States does not care about the countries within this group. It just sees us as pawns for its geopolitical games." As she spoke, a furour washed over the room, if only in shock at her being the one within Nicaragua to give the speech.\n\n"We now know where the United States stand. They stand with radicalism, with the extremism of global Marxism. Refusing to learn from the failed ideology that destroyed Russia, they have backed Bolsheviks the world over! From Puerto Plata to Colombia to Indonesia, they have chosen chaos over order. If the President had his way, we would all be Soviets!" The frenetic discussions continued, but had begun to die down. Everybody knew where this was heading, and even those uncomfortable with Bogotá begun to quieten.\n\n"With this in mind, I see no future for Nicaragua in this Organisation. Our President has made efforts to bridge the past gap, but all of our overtures have come to nothing." At last, the final grouping became silent, her speech echoing through a mute corridor. "In this state, we see no reason to remain here, and we will leave this Marxist organisation for good." None of the attendents clapped, only a handful of coughs marked the finale, of both the speech and America's ties with Nicaragua."
 NIC_forpol.11.a: "They will not be missed."

 NIC_forpol.12.t: "Enter Nicaragua"
 NIC_forpol.12.desc: "The United States has found that mythical moral backbone it purports to have. The great Somoza family, suzerains of Nicaragua have broken off relations with their former benefactors. The US could no longer tolerate the extreme accumulation of personal wealth and power by this ruling family. A dynasty in every sense of the word, ruling in that old tradition of divine right. They have personally enriched themselves to an astounding degree. Rough estimates have them owning 18% of the Nicaraguan land mass, and assets under control of the family making up 25% of the nation's GDP. It should hardly be a surprise this all comes with quotidian suppression of all dissent, and dismantling of any opposition.\n\nA terrible shame that the Americans seem to lack a stomach for what is a demonstrably important strategic asset. Nicaragua straddles a continent and two oceans, with a regime that is mercurial yes, but undoubtedly stable and seeking a better deal from anyone who will give it to them. We must still at pains to be aware of all possible risks and must state that the Somoza's did knowingly push their relations with the United States past a point of no return.\n\nThere is an amount of risk we can tolerate in this space. The regime's total capture of the state it controls is at least a partial guarantee that agreements with them will be kept, not burned up in the fires of a revolution. The groundwork has been laid to act on this diplomatic spat, and our conclusion is that we should take full advantage."
 NIC_forpol.12.a: "It's time to get in on the family business."
 
 NIC_forpol.13.t: "Enter Nicaragua"
 NIC_forpol.13.desc: "As we speak, Iberian arms and manpower continue to depart for the New World in a bid to restore the austere influence of the Old. Like Columbus and the Queen of Castile, our noble Union seeks to bind itself to her former colonial subjects. Where once Spanish and Portuguese ships arrived to these then unfamiliar waters as conquerors, they return this epoch as liberators from the tyranny of the Monroe Doctrine.\n\nWith the Republic of Colombia at last ending its Civil War, the capabilities of the albeit modest Iberian Armed Forces and industry have been proven. This military triumph has been celebrated almost as much in Madrid and Bogotá as within the numerous villas and estates of the Somoza dynasty in Nicaragua, often by the same dignitaries.\n\nIn between these celebratory galas and the accompanying military parades, the upper echelons of the trio of nations compose a diplomatic triumph as well, two in fact. One forming a formal alliance between Bogotá and Managua and another solidifying their mutual ties with Madrid. Furthermore, both countries have shown interest in expanding this treaty into a proper organization, to bind together the anti-American states in the region into a unified shield.\n\nPerhaps this is the moment that will in years to come be shown as the spark to an Iberian Decade, if not outright an Iberian Century. Of course, only a meager man would not dream for more. If the Somozas, once staunch supplicants to Washington can be turned, who else could be brought under Iberia's umbrella?"
 NIC_forpol.13.a: "Havana? Lima? Mexico City? Maybe those old maps of ours still have some use..."

 NIC_forpol.14.t: "Bogotá Falls, Managua Flails"
 NIC_forpol.14.desc: "Notes from conversation with President of Nicaragua Somoza Debayle - to be transcribed and cabled. Highly sensitive.\n\nPresident Somoza looked notably nervous and unwell. Pale, sweaty. Barely touched steak dinner. Rapid speech focused on Colombia, lamenting the fall of anti-American Bogotá government. Had been building close partnership following own recent decisive break with Washington and withdrawal from OAS. Forceful that there is no going back, and will be looking for new international partner. Clear overture to us, though he has also reached out to our rivals. Desperation could allow us to set terms.\n\nSomoza remarked on increasing popularity of fascism within Nicaragua's National Guard - influenced in part by deployment to Colombia. Some discomfort visible on Somoza's face. Aiming to salvage Colombian situation and demonstrate regime capability to his troops by switching alignment from defeated central government to Second Patriotic Army or New Granada. Naturally, recommended our own Colombian partner to Somoza.\n\nDeparted dinner for waiting limo to embassy offered by Somoza. Clear that if we demonstrate military might in Colombian civil war and secure the nation for our camp, Managua will follow. Recommend increased resourcing for our efforts there - enticing these kleptocrats to our sphere of influence will be more than worth it."
 NIC_forpol.14.a: "Two birds wait, we only have to cast the stone."

 #Japanese Alignment
 NIC_forpol.15.t: "Somoza In Cali"
 NIC_forpol.15.desc: "Transcript of Nicaraguan President Somoza's Speech at University of Valle in Cali, Colombia\n\n"I'm thankful for the Association's invitation to speak today. As I look around the hall and as I look around your city, I see the fruits of security and prosperity. ANDI has been an indefatigable force for them in Cali, in New Granada, and will soon be extending both throughout Colombia as a whole. I congratulate ANDI and all those in this room on the resolution of La Violencia, and know great wealth awaits you and your countrymen.\n\nBut it is no slight to acknowledge that you did not do it alone. Japan has been a firm friend to your country, as it has been to those who stand for prosperity and security across all of Latin America. While Washington dithers against or, worse, decides to back the atheistic communists that threaten to destroy our societies and our property, Tokyo acts.\n\nI, my family, the National Guard, and the Nicaraguan people thank you, and thank the Empire of Japan for vanquishing the specter of socialism from this vital part of Latin America. We look forward eagerly to realizing the commercial opportunities now blossoming among our three nations.""
 NIC_forpol.15.a: "Follow the money, and there you'll find the Somozas."
 
 NIC_forpol.16.t: "The Managua-Tokyo Axis"
 NIC_forpol.16.desc: "With the initial inros by the Somoza regime successful, Nicaragua has formally announced their newfound alliance with the Empire of Japan and its recently victorious Colombian allies. Even as we speak, military and diplomatic attaches from Tokyo have begun ingratiating themselves to the Somoza family while Colombian troop exercises are planned alongside the Nicaraguan National Guard. The consolidation of the Japanese presence in Latin America, though still very fresh, seems to be progressing smoothly.\n\nJust as important as the Co-Prosperity Sphere's expansion into Nicaragua is the effect of the Somozas' newfound allegiances on the Nicaraguan government. Or, perhaps that would have been the case in any other country. The Somoza dynasty's hegemony over most aspects of economic life has ensured that the change has largely been contained to the flags of cargo ships in docks.\n\nThere is, however, one domain in which a change has been visible. Due to Tokyo's more industrialist focus and lack of a market for Nicaragua's cash crop economy, plans have begun being drafted to open several new factories in Managua, marking a turn towards developmentalism for the Somoza regime. The success of such a shift is yet uncertain, but one can take respite in knowing it will lead to a stronger Nicaragua... assuming the funds are not wholly embezzelled."
 NIC_forpol.16.a: "A reminder to Washington and their Wall-Street backers that Tokyo can play dirty just as well."
 NIC_forpol.16.b: "They forsake the Old Patria for new capital."
 NIC_forpol.16.c: "If the Japanese think we'll merely watch them grow their tendrils in our backyard..."

 #Italian Alignment - Unused
 NIC_forpol.17.t: "New Granada Victorious"
 NIC_forpol.17.desc: "Who can dare to say that the Italian Empire was ever a bit player on the world stage of global politics? Who is to say that Italian diplomatic history does not share lineage with the names of Mark Antony, Machiavelli and Garibaldi? Ours is not merely just one more piece on an ever shifting board, but the very game the whole world plays is built on a Roman foundation, whose flights of diplomatic fancy were as high as for it all to seem as just a game to be played!\n\nLook no further than to the countenance of New Granada, where the Fascist revolution has swept over the Andes, bringing our most celebrated way of life all the way to South America and the Caribbean, all the way to the foot of the American Colossus! Yet our fortunes do not end there, as others in the region now bare witness to the Latin American Fascist renaissance and seek to imitate it for themselves.\n\nFar flung Nicaragua, once the very image of American collaboration in Central America, dared to break away from the capitalists in Washington, but foolheartily sought the embrace of their former overlords in Iberia. With the collapse of the Bogotá government, so too did Madrid's influence in South America retreat, leaving Nicaragua adrift in a sea of mounting distrust fueled by American agitation.\n\nAs could be expected, the Somoza family in Managua hopes to rectify this momentary lapse in judgement by announcing support for the new regime in New Granada. While their attempt to undermine Fascist influence in Latin America will certainly not be forgotten, we are not so allergic to detente as to turn down a happy accomplice in expanding the Empire's reach further into the Americas.\n\nTo this great campaign, we shall let bygones be bygones and allow the Somoza's into our embrace! This is certain to rile the United States in stealing their former comrade out from under them, but let that be the lesson in learning to respect the auspices of Rome!"
 NIC_forpol.17.a: "Our new allies will do much to complement Italy's newly found position of strength in the Americas!"
 
 NIC_forpol.18.t: "Italy-Nicaragua Alignment"
 NIC_forpol.18.desc: "The New Granadian victory in the Andes represents a true moment shift in the conduct of state affairs in Latin America, as the Fascist ascendency in Bogotá shall serve as a manifest proof to all maligned nations in Central America and the Caribbean that the American Colossus only holds as much power over them so long as they deny themselves the strength of their national character. They need only dispense with archaic institutions and doctrine to see their true potential realized.\n\nEven the Yanquis supposed allies are able to see this, for the victory of New Granada has driven long-time collaborators with Washington to see the fruits of Rome's ambitions in the region. In Nicaragua, well-established as a happy advocate for the United States' interests under the Somoza's presidential dynasty, the government has seemingly conceded any pretense for their alliance with America to continue. Seeing a more kindred spirit in New Granada's new affinity for Fascism, the Somoza Family formally announced their support for the Italo-Colombian Bloc, firmly aligning itself with the interests of the Italian Empire.\n\nThis comes as an absolute coup to the leadership in Rome, as Anastasio Somoza's love affair with American entanglement goes back generations. Where Somoza was once considered a staunch ally of the US President, now many draw comparisons between him and Rafael Trujillo as the newest face for Italy's South American alliance. For Italy and New Granada to rattle such an ardent Ameriphile into the fold of the Fascist bloc, however minor a victory that may seem, it is a victory well-worth celebrating."
 NIC_forpol.18.a: "Grazie, Nicos!"

 #German Alignment
 NIC_forpol.19.t: "Goosestepping in Managua"
 NIC_forpol.19.desc: "Anastasio Somoza was a cadet at West Point. He had been a guest at the coronation of the exiled British Queen Elizabeth in Toronto. He had been friends with President Nixon, in as much as men like Somoza and Nixon had friends. The bond between the Somoza dynasty and the 'Free World' was, in other words, historically fairly established.\n\nBut there was a change in the air when the SPA goose-stepped into Bogotá. The unexpected victory of the Germanophiles in Colombia almost immediately encouraged Germanophiles across Central America to become bolder - and Nicaragua was no exception.\n\nIn the Presidential Palace, Somoza watched over the rim of his glasses as the situation developed - one day, a police report about a fascist-sympathising intellectual selling out a lecture hall, the next, an unwelcome polemic from one of his generals about Hitler's virtues. In fact, fellow travellers in his government encouraged Somoza more and more to strengthen the national relationship with Germany, now that they had made such a significant foothold in the neighbourhood.\n\nThe government, that is to say, his family, wavered on the decision, and not just because his father declared war on Germany back in '41; opening one door, this particular door, would close other ones, and the businessman in Somoza wanted to know he was following a good lead before putting his American holdings at risk of confiscation by the FBI. Then again, what about the new opportunities this opened for his portfolio? The Führer was neither here nor there, but the Führer's money was good."
 NIC_forpol.19.a: "Anastasio Somoza began dialling his accountant's number."
 
 NIC_forpol.20.t: "Somoza in the Riviera"
 NIC_forpol.20.desc: "In a quaint little cafe in the French Riviera, Anastasio Somoza enjoyed a coffee and a cigarette as the afternoon sun retreated towards the horizon. On his table were folders containing photographs and bills of sale of his new properties in the area. The two tables flanking Somoza were occupied by serious-looking men in suits, his personal security. In the corner, two local old women gossiped innocently.\n\nThat the President of Nicaragua had taken his bodyguards and accountants for a trip on his private plane was not unusual, but the trip being trans-Atlantic was. But recent developments - the most significant of which being the SPA's victory in Colombia - had encouraged Somoza to expand his portfolio into new markets, and with every handshake, the prospect of making investments in German-aligned Europe was more and more tolerable. What was the difference, after all, between speculating on beachfront property in the French Riviera or the Florida Everglades?\n\nAnyway, it was a good idea to look after his own pocket since his government had a new one-off expenditure to look after; some of the Germans who were expelled from Nicaragua had returned and could expect compensation from the government. His ministers had dogged him with the details back on the runway - a pharmacologist and his family, a theatre actor - and Somoza had waved them away.\n\nSomoza leaned back into his chair and contemplated current events, an internal distaste soured within him for this Hitlerian wave in Colombia, Nicaragua and wherever else. There were men in the Americas who could be little Hitlers - Trujillo came to mind, but even within the OAS, there were some - but he himself could never be that kind of leader. He had too much clout for it."
 NIC_forpol.20.a: "He wondered if there was any money in holiday homes on the Black Sea."
 NIC_GER_Alignment_tt: "§FWith the §xColombian Civil War§! now over and §jPakt§! influence dominant, §$$Nicaragua§! will find a new backer in §jGermania§!."
 NIC_JAP_Alignment_tt: "§FWith the §xColombian Civil War§! now over and §eSphere§! influence dominant, §$$Nicaragua§! will find a new backer in §eTokyo§!."

 NIC_forpol.21.t: "Goodbye, Old Friend"
 NIC_forpol.21.desc: "Information on a very troubling development has been brought forward, independently and almost simultaneously, from both the FBI and the State Department. And we must decide upon action.\n\nIt has been discovered that the Nicaraguan government, in a clandestine agreement with the unfriendly regime in Bogotá, is sending by air and sea large amounts of 'equipment' and other aid, the contents of which are currently unknown. However, given Nicaragua's relatively limited military-industrial resources (compared to ourselves) and the specific needs of the Bogotá regime, it is considered very likely that said aid includes large amounts of American military equipment formerly transferred to the country.\n\nThough it is certain to be older in model, and therefore less capable than current inventories, the acquisition of American equipment by the Bogotá regime represents a dangerous escalation and is simply unacceptable from a diplomatic and military standpoint.\n\nContingencies have been developed - primarily involving both naval and aerial interdiction. If the ships are seized, and the planes shot down, the equipment cannot be transferred. Furthermore, if sufficient losses are incurred it is likely that the Nicaraguan regime will eventually cease to conduct transfers.\n\nWe only need the order."
 NIC_forpol.21.a: "A serious decision to consider."

 ##Fires during Iberian Wars Sphere Creation
 NIC_forpol.22.t: "Somoza & Santiago"
 NIC_forpol.22.desc: "The State Department has informed us of an inevitable development in Latin America. Through the regional influence of other countries in the area, Nicaragua has signed the necessary protocols to join the Santiago Forum as a full member and partner.\n\nGiven the significant wealth of the Somoza regime and the many organizations it controls, both inside and outside the country, they possess both the capability and the will to invest in and develop the infrastructure and military capabilities of other Forum members, independent of American influence. This is very troubling, especially as it regards the Bogotá regime and its strong anti-American stance, and we are predicting a considerable increase in their proficiency level in the near future as a result.\n\nWe will need to remain vigilant for opportunities to influence and interdict these developments, as they represent a further drift of our soft control over the area, of the perception of the strength of the OFN, and of a potential vector for foreign powers to meddle in South America. Uncle Sam must not be found wanting to any greater extent."
 NIC_forpol.22.a: "Very worrying."
 
 NIC_forpol.23.t: "Colombian-Nicaraguan Alliance"
 NIC_forpol.23.desc: "The State Department has delivered, with cautious optimism, an update on the bilateral relationship between Nicaragua and Colombia, following the very recent signing of a mutual alliance and defense agreement in Bogotá.\n\nAccording to our ambassador in the country the agreement, signed by both countries' foreign ministers and respectively ratified almost immediately thereafter, lays the foundation for mutual assistance during domestic unrest as an initial starting point. Given the respective situations of the nations, it is likely that this is a cover to prepare for significant Nicaraguan intervention, in both equipment and personnel, within the Colombian war. It also opens the door to further collaboration down the line.\n\nThis is a conflicting development. Such independent action further showcases the ever-growing independence of Nicaragua, and its intention to act without prior consultation to the State Department, but it also demonstrates their very close understanding of American foreign policy desires. This action aligns perfectly with our long-term goals of influence in Latin America, even if we do not fully control it.\n\nThe agreement itself is already active. We must be vigilant for further actions, and determine to what extent we wish to involve ourselves, especially when the autonomy of smaller states facilitates the goals of Uncle Sam."
 NIC_forpol.23.a: "Very interesting. An opportunity?"
 NIC_COL_Alliance_tt: "§YThis newly formed alliance ensures §$$Nicaragua§! shall aid our §fColombian§! partners should §xLa Violencia§! escalate further.§!"
 
 NIC_forpol.24.t: "Unexpected Heights"
 NIC_forpol.24.desc: "The bilateral Nicaraguan-Colombian relationship has expanded further and, yet again, the State Department is cautiously optimistic, though with a greater emphasis on the need for clear instructions as to the administration's intent in such a situation.\n\nThe previous agreement between Colombia and Nicaragua has recently been amended - again in a fully autonomous manner and without State Department consultation - to permit full and immediate, if desired, Nicaraguan military support and intervention. This significantly expands both volunteer and equipment support by the Nicaraguan government, and similarly significantly augments the position of Bogotá in the Colombian War.\n\nOnce again, this represents a conflict. Such assistance by regional partners on behalf of a friendly government is tremendously helpful from a foreign policy standpoint, reinforcing America's stated desire to promote acceptable governments in Latin America. No doubt this was the exact intention of Nicaragua in their framing of the agreement. However, and as before, it again shows an assertiveness and autonomy from American consultation that could lead to conflict down the line.\n\nLike before, the amendments are already active. But the State Department has been clear that they will soon need more clarity on how to respond - as it is not unlikely that this 'autonomy' will continue to grow."
 NIC_forpol.24.a: "Always complications."

 ## US Negotiations - Occurs for the 5 or Higher Path
 NIC_forpol.25.t: "Democratizing Dictatorship?"
 NIC_forpol.25.desc: "Luis Somoza once called it "Security." The resistance fighters rotting away in prison called it "the death of the republic." Newspapers disappeared overnight. Coffee barons lined their pockets. A judge was found dead in an alleyway after ruling against the National Guard. Despite that, D.C. still sent weapons and trained the very soldiers that dismantled Nicaraguan democracy.\n\n"We both know why you're here." Lillian Somoza sat cross-legged across an American diplomat in her Georgetown townhouse, stirring her coffee. "America's been... reconsidering her friends."\n\nThe official didn't budge. "Friends don't run death squads in schoolyards."\n\n"Those squads keep our country stable." Lillian rolled her eyes. "We don't want a repeat of Puerto Plata, do we?"\n\nThe envoy tossed a folder onto the table. Photos slid out, grainy, but undeniable. "So start with the basics. End the arrests. Loosen the press. And your brother? He better not be on the next ballot. Your secret police runs on American bullets, don't forget that."\n\nLillian took a long sip. "You want gestures. We want guarantees. There's a deal to be made here... if you're in the mood to offer concessions, of course."\n\nThe man stood up from his chair. "If your brother will only listen to bribes, how long until he stop listening altogether?"\n\nLillian coldly smiled. "Until Tokyo strikes a better deal." She set down her cup. "And while you're up, be a dear and get me something better than this American brew. It's undrinkable.""
 NIC_forpol.25.a: "Pressure the reforms unilaterally. They will learn to listen to us."
 NIC_forpol.25.b: "Some bribes could help our reforms pass. Give them something Tokyo can't."
 NIC_forpol.25.c: "Don't bother with the reforms. They may be bastards, but they're our bastards."
 NIC_USA_Push_Reforms_tt: "§FSuccessfully convincing the §sSomoza Dynasty§! to reform will affect the future of §$$Nicaragua§!.§!"
 NIC_USA_Push_Reforms_Rude_tt: "§FUnilitaral pressure is a risky move and one that may have §Rdire consequences§! for our ties to the §sSomoza Dynasty§!."
 NIC_USA_Abandon_Reforms_tt: "§FAbandoning the chance to reform the Regime may §Ypreserve§! our ties with the §sSomoza Dynasty§!§!... but is it worth dooming its people to who knows how many more decades of repression?§!"
 
 NIC_forpol.26.t: "Somoza Redoubles American Ties"
 NIC_forpol.26.desc: "The past week has seen Interim President of Nicaragua Lorenzo Guerrero enacting a series of political reforms, to be applicable for the coming election. Independent Electoral Commissions have been introduced, clauses amended to bolster press freedoms, and hundreds of political opponents formally pardoned.\n\nHowever, despotism still lingers in other parts of the government. Votes are still being counted behind barrack doors. The Somozas retain control of most media outlets. Thousands of leftists continue to languish away behind bars.\n\nNevertheless, we can call this a victory. Various OAS representatives have praised Somoza's "democratic efforts." Domestically, public unrest has diminished, and American flags can be seen flying side by side with the Nicaraguan triband."
 NIC_forpol.26.a: "We can't expect roses from a thornbush, but we can still trim it to look presentable."
 
 NIC_forpol.27.t: "Somoza Dismisses Americans"
 NIC_forpol.27.desc: "Nicaragua has decisively rejected all American requests to pass democratic reform, denouncing them as "unwarranted interference on Nicaraguan sovereignty." Despite the numerous diplomatic missions and generous economic offers during the past years, the Somoza dynasty remains steadfast in its authoritarian ways. Political dissidents remain detained and the press is still under tight control.\n\nThis morning, the American flag was notably lowered for the first time in decades outside Nicaragua's National Assembly. Reports have indicated that the Somozas are seeking out alternative international partnerships. American influence has eroded in the region, complicating our politics and dynamics within Central America.\n\nFurther diplomatic negotiations or additional financial incentives may help, but the relationship may prove hard to rebuild."
 NIC_forpol.27.a: "Send another envoy. We can still salvage this."
 NIC_forpol.27.b: "Send money their way. Remind them who's keeping their army running."
 NIC_forpol.27.c: "Abandon our efforts. We've bled enough trying to prune this thornbush."
 NIC_USA_Push_Reforms_Again_tt: "§FContinuing to press the Regime may yield results, but our ties with the §sSomoza Dynasty§! will §Rsuffer§! for it.§!"

 ##Flavor Events for other possible backers
 #Fires After Puerto Plata
 NIC_forpol.28.t: "A Tale of Two Continents"
 NIC_forpol.28.desc: ""...and I promise you, gentlemen, that nothing will beat the beauty of Lake Managua," bragged Anastasio Somoza Debayle, a smile planted onto his lips as he shook the hands of local business leaders. Most of the Iberian leadership had yet to arrive, a delay Somoza felt in the heat, but he refused to let that change his attitude. Even business leaders would provide much-needed investments.\n\n"Not even Cambados?" asked one man, already introduced as Sebastián Figueredo, involved in a local timber company and already proving himself to be friendly.\n\nDebayle chuckled slightly. "Maybe if I had more time in this wonderful country, but alas!" A few cameras clicked, but he paid them a rare lack of heed. Some photos would trickle down to the press, perhaps, but most of these would be for private use, in collections for business leaders to present their influence.\n\nA few months later, Somoza took additional care not to arrive late. Iberia's investments into a Hispanist Centre of Culture in Managua were welcome, but he hadn't begun this diplomatic shift for investments to stop there, nor had he gathered so many recent immigrants for an opening ceremony. Just as he begun to question his schedule, the Iberian delegation arrived.\n\n"Ah, Laureano, welcome!" spoke Somoza, a strong emphasis placed towards the end as he turned to face Manuel Augusto José de Mello.\n\n"I'm glad to be here," responded Laureano Lopéz Rodó. "I hope you weren't lying about the beauty of Lake Managua."\n\n"I haven't been!" Somoza replied, chuckling more firmly. "Just ask Sebastián Figueredo over here. He owned a lumber company down in Galicia, but he moved when that immigration law was signed...""
 NIC_forpol.28.a: "Yet more passes through the Atlantic."

 #Fires for Nicaraguan Alignment with Iberia during the CCW
 NIC_forpol.29.t: "The Fish That Ate The Whale"
 NIC_forpol.29.desc: "The collapse of relations between Nicaragua and the Americans were well-received in Madrid, and equally so were the invitations the Union's officials received to attend numerous events in Managua. The new partnership outlined certain expectations, from both sides of the negotiating table. Security, investments, beach-side properties... yet among them stood one that differed. A mutual prerequisite, offer and obligation, for a true alliance, Bogotá had to achieve victory in the Civil War and the Socialist menace threatening the entire region removed without restraint.\n\nTo match the new tune, the Somoza dynasty has began to detach from the Dollar and from the restraint it demanded in handling the Marxist resistance roaming around the countryside. Economically, the shift manifested in the form of uncharacteristic seizures of property, followed by promises of privatization to more beneficial business partners.\n\nBut Iberia was not the only one invited to the dance, as would be shown once the replacements for the OAS' departed cadres arrived. Japanese, Italians, even a scarce few Germans, the competition was large, the prize grand to match, yet the challenge remained the same for all.\n\nOne day, not so far, the victor would be revealed. Until that day comes, the dance and games would continue, never too close, never too far, and Iberia's seat always kept warm."
 NIC_forpol.29.a: "Here comes the money."

 #Fires After Puerto Plata
 NIC_forpol.30.t: "Legacy of Expulsion"
 NIC_forpol.30.desc: "The heat in Jinotega hadn't changed at all in the twenty-one years he'd been driven out. The flora still smelled of damp earth. The mountains, ancient and unmoved. The coffee, sharp and unforgettable, filled the air like perfume.\n\nAdolf Eitzen hadn't seen this paradise since the Somoza dynasty ransacked his estate and used it as an incarceration camp while his family was scattered back across the Atlantic. However, part of his fatherland lingered in Nicaragua's emerald jungles.\n\nEitzen stepped out of his rented car, his suit too stiff for the heat, his boots too heavy for the damaged soil. Before him were the bones of his rotting home. Vines swallowed and suffocated every opening, the gate rusting away. Despite the abandoned estate, wafts of the luxurious beans reminded Eitzen of his glory days.\n\nHe waited a lifetime to come back to this place—a place where he was someone, where he could have been more. American blunders in Puerto Plata had weakened the yoke on Nicaragua, allowing Berlin to open the door to an opportunity, to seek out retribution and influence.\n\nAs he stood there, tears of nothing but nostalgic pride rolled down his face. Only one question plagued Eitzen now. Was he returning as a pawn in this grand game of politics, a harbinger of the Einheitspakt? Or was he a ghost, chasing back what he had lost so long ago?"
 NIC_forpol.30.a: "Offer support, more influence within the Americas may be useful."
 NIC_forpol.30.b: "Heims ins Reich, not in Managua."

 #Fires for Nicaraguan Alignment with Japan during the CCW
 NIC_forpol.31.t: "The Sakura and Sacuanjoche"
 NIC_forpol.31.desc: "The American diplomat had barely left before Lillian Somoza's second appointment of the evening was ushered into the room. The princess of Nicaragua had only recently returned from a most unpleasant and final discourse at the OAS. Of course, there was little time to unwind for the web her family had woven required a more delicate touch.\n\n"No lectures this time?" The Nicaraguan oligarch asked dryly.\n\nMasaru Ikawura chuckled with a faint smile before sitting himself down across from her. The Zaibatsu representative remembered how their last meeting went. Cordial, but fruitless. "Not this time, Señora Somoza. I assume your last guest wasn't too friendly?"\n\n"You know how the Americans are," Lillian sighed. "Accusations of 'butchering democracy.' Calls for pardons, elections, the sort you'd expect from liberals born with a silver spoon in their mouths."\n\n"Tokyo," Iwakura said, adjusting his glasses before unlatching his leather case, "prefers partnerships over one-sided gestures."\n\nSpreadsheets, letters, and contracts leaked on the table. In return for Nicaraguan property investment in Tokyo and Kyoto, Japanese capital would open up plants and warehouses in Managua and León. Cheap labor for Japan. Free jobs for Nicaraguans. Deepened pockets for the Somozas.\n\nLillian paused before looking out her window to see Washington's lights shimmer behind the lazy Potomac River. In the quiet night, she could sense Congress's desperation. Picking up the ballpoint pen Nixon had gifted her, she returned her eyes to the contracts.\n\n"Let's call it for what it is," she said, scribbling her signature. "An agreement between friends.""
 NIC_forpol.31.a: "America's had its chances. Japan simply asked for less."
 NIC_Alignment_tt: "§F§$$Nicaragua§! will §Gjoin§! our §YEconomic Sphere§!.§!"
 NIC_Alignment_2_tt: "\n§FWith the collapse of American influence, §$$Nicaragua§! draws closer to our §YEconomic Sphere§!, however, in order to fully align them, we will require our §fColombian§! allies to achieve victory in §xLa Violencia§!.§!"

 #Fires After Puerto Plata
 NIC_forpol.32.t: "All Roads Lead to Rome"
 NIC_forpol.32.desc: "A curious - and most welcome - development from Nicaragua has been reported to our Ministries this morning.\n\nThere has been, for some time, a significant migration of Italian intellectuals into Nicaragua, for both business and academic reasons. Of course, given the urbane sophistication of our magnificent people, what passes for the local aristocracy quickly took them into their circles. The rhetorical mastery imparted from our universities soon overwhelmed them and now many of them share our ideological outlook.\n\nThough it is of course difficult to publicly avow oneself as a fascist in the Americas and not suffer ostracization, within the bounds of what they can do, they do. Speaking circles, political organizations, and more have been reported, and it is likely that, in time, there will be an opportunity for the state to significantly expand its reach in that country.\n\nIndeed, many of their sons are being sent to elite universities in Milan and Rome, where they will of course be provided with the correct outlook, and an Italian Centre of Culture is being opened in Managua, where exhibitions of Italian art, industry, and more will soon be shown.\n\nA great accomplishment, and one where very little was needed on our end to make happen!" 
 NIC_forpol.32.a: "Excellent."

 ## US Relations 5 or Higher Path
 NIC_forpol.33.t: "Death of Luis Somoza"
 NIC_forpol.33.desc: ""So, what now, Anastasio?"\n\nLorenzo Guerrero sat next to the corpse of the former most powerful man Nicaragua had known—Luis Somoza. Right across from him was a man in a brown uniform, clad with medals. General Anastasio Somoza was brooding, over the loss of his brother, but also over the future of the country.\n\n"You tell me, Guerrero. You're next in line for succession." Anastasio spoke with clarity, suppressing his emotions without even looking up to meet Guerrero's eyes. "However, that does not make you a Somoza."\n\nGuerrero swallowed. He had taken the mantle of the presidency for barely a day now, and yet the burden was already too much. Every conversation with the General sounded less like a conversation and more like cryptic death threats. "I intend to serve my term, Anastasio. The people need some peace during these trying times."\n\n"Incorrect answer, Guerrero," Anastasio said, still keeping his eyes on his brother lying on his deathbed. "This isn't your country. It was my father's country. It was my brother's country. It will remain the Somozas' country."\n\nGuerrero said nothing, only mechanically nodding, making sure to only swear silent loyalty to Anastasio's iron rule. Guerrero's hopes of giving Nicaragua a fresh leader were withered away in a single exchange.\n\nAt the end of the day, Nicaragua will always be a family with a nation."
 NIC_forpol.33.a: ""Keep the seat warm for me, Guerrero.""
 NIC_Prevent_Anastasio_tt: "§FFor the Sake of §$$Nicaragua§!'s stability, we must ensure §sAnastasio Somoza§! does not come to power.§!"

 NIC_forpol.34.t: "Hope Somoza Portocarrero Nominated as President"
 NIC_forpol.34.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM MATT WEBER\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: Line of succession in Nicaragua\n\n1. Hope Somoza Portocarrero, wife to Anastasio Somoza, the brother of former dictator Luis Somoza, has won 92% of the votes during the intra-party election. Her candidacy comes as a direct result of pressure to reform the Nicaraguan regime, however she is unlikely to be an active political actor. Instead, her candidacy represents an attempt of Anastasio Somoza to rule beyond the spotlights.\n\n2. The news have not illicited any excitment amongst the local population, but has raised eyebrows among Washington's more conservative circles, and her American heritage has spurred claims of the country becoming an "American puppet".\n\n3. The opposition to the dictatorship displays growing fervor, with the meager concessions offered having been proven insufficient to appease them. Additionally, growing scorn amongst the American public and even within Washington D.C. against the dictatorship, paints a grim picture for Somoza family's prospects.\n\n4. Due to the calcified structure of the PLN and the hegemony of the Somoza family over establishment politics, any possibilities to shift this perspective are slim. Any potential crisis could set the country ablaze."
 NIC_forpol.34.a: "AND YE SHALL KNOW THE TRUTH AND THE TRUTH SHALL MAKE YOU FREE."

 NIC_forpol.35.t: "Anastasio Somoza Debayle Nominated"
 NIC_forpol.35.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM: MATT WEBER\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: Line of Succession in Nicaragua\n\n1. Anastasio Somoza, the son of former Nicaraguan strongman Luis Somoza has won 92% of the votes during the intra-party election to determine a candidate for the upcoming election. Due to Nicaragua's illiberal practices, his victory in the election proper is certain and his term is unlikely to be any positive change to the country.\n\n2. Anastasio has long been known to our agents in the region as a natural successor. He has attempt to channeled the image of his predecessors to gain appeal. Nevertheless, his lack of charisma and poor public perception comparative to his brother has lent him the status of the least popular Somoza\n\n3. The opposition to the dictatorship displays growing fervor, with the PLN's reluctance to offer any reforms only worsening its popular perception. Additionally, growing scorn amongst the American public and even within Washington D.C. against the dictatorship, paints a grim picture for Somoza family's prospects.\n\n4. Due to the calcified structure of the PLN and the hegemony of the Somoza family over establishment politics, any possibilities to shift this perspective are slim. Any potential crisis could set the country ablaze."
 NIC_forpol.35.a: "AND YE SHALL KNOW THE TRUTH AND THE TRUTH SHALL MAKE YOU FREE."

 NIC_forpol.36.t: "Nicaragua's [GetYear] Presidential Election"
 NIC_forpol.36.desc: "Greeted by a set of documents sprawled out across his desk, Edward — an inexperienced staffer at the U.S Embassy in Nicaragua — was feeling reluctant to do his job. Once enthused by the prospect of his posting, the reality of Nicaraguan politics had soon dawned on his conscience. He had once believed that the United States was supporting democracies around the globe, helping people everywhere to overthrow the jackboot. The truth, by contrast, was more than a little disheartening. As he dragged his eyes across the latest vote counts for Nicaragua's Presidential elections — projected to be another landslide victory for the Somoza dynasty's PLN — Edward wondered aloud whether the US had made the correct choice in siding with the despots of Central America, once again. Mr. Walker, Edward's supervisor, had overheard this and approached: "Having doubts? If it helps ease your mind, the Somozas are a useful instrument for our interests." Edward suddenly seemed impassioned, and peeled his fingers away from the documents, which he had been gripping a little too tightly. "If they're an instrument, why don't we change the sheet music? We have the power to make things better, even if it's risky."\n\n"Power rarely deviates from self-preservation," Walker replied. "But that is unimportant. Whether Somoza is aligned with us or the Nazis is of considerably more significance than his politics. And right now, thanks to the efforts of men like us... he will continue to listen to America when it counts. We must remember the dynasty is not uncontested in their reign - they need us, in the end."\n\nEdward sank into his chair, and heard Walker speaking with his secretary. When his supervisor returned, the young staffer barely managed to contain his sadness as the news was delivered: "The PLN has won — all they need now is to reassure the National Guard, and the US will back them accordingly.""
 NIC_forpol.36.a: "Edward tendered his resignation later that night."

 #Despotist Nicaragua Path
 NIC_forpol.37.t: "Death of Luis Somoza"
 NIC_forpol.37.desc: "For many in Nicaragua, a great tragedy had struck; for others, a long-sought triumph had finally been realised. Plastered across newspaper headlines throughout the Americas, the words "President Somoza Dead!" were firmly entrenched in the minds of the populace, and the chance that the Somozaist dynasty might have been in a state of decline, so soon after the deceased's re-election, aroused the imaginations of FSLN rebels the second the news broke.\n\nOne member of the FSLN, Alejandra Lacayo, did not share such illusions. Through crowds in Managua, she appeared altogether composed, unassuming; but in the recesses of her mind, a tempest brewed. The deceased Somoza was relatively popular, or was regarded as affable — this "tragedy" would be the best opportunity for the regime to galvanise opinion in its favour. She knew that the President shared power with his brother, Anastasio Somoza, leader of the National Guard, sympathiser to the fascists in Europe; and everyone knew that he was extremely ruthless in his attempts to maintain his family's dynasty, a sadistic despot whose lust for autocracy was very rarely satiated. And given that relations with the United States were at a significant low, it was certain that the facade of a democratic system would soon vanish, and a geopolitical realignment would follow.\n\nAlejandra's fists tensed with anger, but that would not suffice to dislodge the Somozaist regime from power, and the FSLN were not yet ready for a sustained uprising. It felt hopeless — why did it seem like she was the only one who could see that? In the distance, a protest was forming — small and pitiful. Rather than join them, she slid into the shadows of an alleyway. She was tired, old. Alejandra noticed an anti-Somoza poster, half-torn down and blowing in the wind, leering at her like a cruel joke. Another Somoza was ascendent.\n\nAcross Managua, the ascendant Somoza was indeed triumphant; departing the acting president Lorenzo Guerrero's office, Anastasio smirked and delivered news to his secretary: "Guerrero has been informed. Now, let us prepare for the days to come." As they vanished into the evening, Guerrero's face was crumpled with age and shame."
 NIC_forpol.37.a: "The total eclipse of the Heart, the ascendancy of the Fangs."

 NIC_forpol.38.t: "Anastasio Somoza Debayle's Putsch"
 NIC_forpol.38.desc: "When Walker, a member of the diplomatic staff at the US Embassy in Nicaragua, had first heard the news, he couldn't quite believe it; Anastasio Somoza had really done it. With the National Guard behind him, he had stormed every government building in Managua and ensured total compliance to his rule. A putsch had occurred. The older man lingered in his office for a few hours, as sporadic noises of cheering, violence, and terror from outside became the soundtrack to his despair.\n\nWalker made a number of calls in the days that followed, as the calamity of the coup subsided and some normalcy began to prevail; yet a sense of unease lingered, especially in the US Embassy. Anastasio had practically spat in the face of the United States, and despite a promise to keep in close coordination, it was immediately apparent that this would merely be used as a pretext to cement his own power. In his attempts to mend relations, Walker had suggested meetings with certain in-the-know state officials, but thus far, had hardly any luck.\n\nOne evening, while smoking on the balcony, Walker received a visitor; Marco was a personal acquaintance and Nicaraguan civil servant, whose unofficial ties with the US had drawn some degree of ire in the last few months. He arrived in the office like he was returning home from war, bloodied and bruised. "Walker, for the love of God-" "Marco, you're injured." Walker rose from the balcony, put out his cigarette and hurried over.\n\n"It's fine, it's fine", Marco said through groans of pain, propping himself up against a filing cabinet; "You need to listen to me. Anastasio is planning a putsch, not an election..." Walker, anxious, interrupted: "That son of a bitch..."\n\n"He's dropping all pretenses as soon as he proves he has the popular mandate. He will strike against you once the last ballot drops"\n\nMarco staggered to a chair as Walker's secretary rushed in, apologising for missing Marco's arrival. Walker gestured for her to leave, then kneeled beside his friend. "You were never here, Marco. We'll find you a way out.""
 NIC_forpol.38.a: ""Washington should have preempted this...""
 NIC_Too_Late_tt: "... yet with the election date being tomorrow, we cannot prevent Anastasio from seizing power.\n\n§RA day will come, however, when the §sSomoza Dynasty§! will receive what it deserves.§!"
 NIC_forpol.38.b: "A few hours later, a voice in Washington would say: "A man after my own heart.""
 NIC_Nixon_Bromance_tt: "§YDue to President Nixon's particular stance on the Somoza dynasty, they will remain aligned with the OFN.§!"

 NIC_forpol.39.t: "1967 Nicaraguan Presidential Elections"
 NIC_forpol.39.desc: "The contents below are from a newspaper story being run through the Nicaraguan press. Intelligence officers on the ground believe this is a sign of the American hegemon cracking from within Latin America, and their hold has become increasingly volatile. The following report is unaltered:\n\n"In yet another demonstration of Nicaragua's proud democratic tradition, the citizens of our Republic have spoken with clarity at the ballot box. Anastasio Somoza Debayle, brother of Luis Somoza, has secured an overwhelming mandate from the people, ensuring the continuation of peace and prosperity from the Somoza dynasty.\n\nJubilant crowds wave flags across the streets of Managua, celebrating another peaceful transition of power. Anastasio has committed himself to not only further modernizing the nation, but also to prosperity for all Nicaraguans.\n\nNicaragua stands united, its armed forces steadfast and political institutions strong. Already, Anastasio has reached out to the Partido Conservador and commanders of the Nicaraguan National Guard for their support, with promises of cabinet posts and expanded autonomy in return for loyalty.\n\nLet there be no doubt that the republic's enemies have been vanquished and defeated by the will of the people!"\n\nNicaragua has broken from the White House's grasp, but is now left stranded without resources and leverage. Perhaps a deal can be struck to help Somoza regain the loyalty of the National Guard... in return for some favors..."
 NIC_forpol.39.a: "Who ever needed fair elections anyway?"

 #Earthquake Chain
 NIC_forpol.40.t: "Almsgiving"
 NIC_forpol.40.desc: "The newspapers were abuzz, all of them declaring the same things. Relief. Aid. Salvation. The headlines were unanimous, the most popular at this stand on the City's outskirts being limited editions of La Prensa; their headquarters destroyed in the earthquake yet still pushing whatever issues they could. Its cover declared simply:\n\n"OFN ANNOUNCES HUGE AID PACKAGE"\n\nThe swarm of people passing the stand in the street saw many buying a paper, a few cheers from the most enthusiastic or affected. Most of the papers carried images of the Tampa Conference, smiling delegates from across the OFN and its allies standing together at the close of discussions. The universal declaration of aid that they had given, and lists of declared objectives.\n\nFew had heard of USAID before, who seemed to be the major force in the relief approaching their city, but their stated objectives were heartening to read by almost all. Infrastructure rebuilding, coordination of OFN nation investments under the program, direct aid to the Nicaraguan economy. Uncle Sam seemed to have opened his coffers and, despite the devastation of the earthquake and their complicated history, good news had finally reached the nation. News that many had so desperately needed to hear.\n\nEarlier, amongst the crowd, a man had been eavesdropping. Conversations about the USAID officials already in the capital, debates over what areas should be prioritised, praise for the Americans finally using their power to get the free world to help Central America. That man now watched the stand from above the crowd, smiling. It had been a simple job, just monitor the stand and gauge the reactions, his open apartment window letting in all the sounds of rush hour. It was a sound he was well used to however, and the swarming readers and enthusiastic cheers from the stand were unmistakable. They thanked the OFN, but they were blessing the Americans."
 NIC_forpol.40.a: "FBI Agent Miles smiled as he wrote it down. Uncle Sam truly was appearing the responsible party."

 NIC_forpol.41.t: "Aid Funds Corruption"
 NIC_forpol.41.desc: "America's magnanimous gesture of reconstruction aid to Nicaragua, though both morally correct and politically advantageous, does not come without risk. Namely, that the horrifically corrupt Somoza regime will merely steal funds for themselves.\n\nUnfortunately, and in the interests of preserving the favored position of the United States within Nicaragua, we must accept some level of misappropriation and fraud. That is not say, that the vipers that inhabit every level of the Nicaraguan administration, top to bottom, will be permitted to act in such a manner, not in regards to the majority of the funds, that is.\n\nWe can and will carefully control the avenues of distribution, permitting only trustworthy NGOs and vetted religious groupings to participate in the process.\n\nUncle Sam might accept some losses in view of the bigger picture of American influence in the region - and there is a much bigger picture indeed - but he is no idiot." 
 NIC_forpol.41.a: "Do not bite the hand that feeds."

 NIC_forpol.42.t: "Managua Earthquake"
 NIC_forpol.42.desc: "News regarding the Managua Earthquake continues to spread, and it is clear that the damage is both extreme and extensive.\n\nThough Nicaragua has had a tumultous, to say the least, relation with the OFN and OAS within recent years, it continues to be within the sphere of the Monroe Doctrine and thus, aiding it contributes to gaining goodwill with the region and maintaining stability. Economic aid will immediately be mobilized, and USAID officials will be sent to oversee its distribution and assist directly in reconstruction, in partnership with firms both local, but excluding those owned by the Somoza family, and American. This will permit much faster rebuilding and, hopefully, the growth of pro-American sentiment among the Nicaraguan people.\n\nOf course, for the purposes of diplomacy other OAS and OFN members will be allowed to contribute, but their aid will be carefully monitored and integrated into our delivery schedules. We naturally welcome their assistance, but it is critical that America maintain the lead role in this coordinated response to ensure funds do not line the pockets of the Somoza family.\n\nThe cost of the response to the American taxpayer is minimal, and the potential gains substantial. Our first responders leave within the hour." 
 NIC_forpol.42.a: "A helping hand from Uncle Sam."

 NIC_forpol.43.t: "Aid Funds Corruption"
 NIC_forpol.43.desc: "America's magnanimous gesture of reconstruction aid to Nicaragua, though both morally correct and politically advantageous, does not come without risk. Namely, that the horrifically corrupt Somoza regime won't just steal everything for themselves.\n\nUnfortunately, and in the interests of preserving the favored position of the United States within Nicaragua, we must accept some level of theft. But action can still yet be taken. Naturally the vipers that inhabit every level of the Nicaraguan administration, top to bottom, will try to take everything that they can, but with our close connections in the government we can make it clear that this must be tempered - lest other forms of aid extraneous to this occurrence be redirected. America doesn't give up so easily.\n\nWe can, and will, also carefully control the avenues of distribution, focusing on American NGOs and religious groupings to handle the funds and control disbursements. Naturally, those within the Nicaraguan government will find some way to 'officially' rob those organizations and transfer as much as they can to corrupted Nicaraguan organizations - and thus Somoza's trusts, but we can make efforts to restrict this as much as possible.\n\nUncle Sam might accept some losses in view of the bigger picture of American influence in the region - and there is a much bigger picture indeed - but he is no idiot."
 NIC_forpol.43.a: "An acceptable strategy."

 NIC_forpol.44.t: "Managua Earthquake"
 NIC_forpol.44.desc: "News regarding the Managua Earthquake continues to spread, and it is clear that the damage is extensive in every regard.\n\nWhile this does of course reduce the effectiveness of our position in Nicaragua, given that their government will focus on reacting to it, it does offer further opportunity to ensure that our influence over the Somoza regime continues. It has been decided that a comprehensive campaign of aid will commence, consisting of volunteer civilian and military personnel, reconstruction funds, specialized machinery and supplies, and more.\n\nThis will greatly accelerate the repair and reconstruction of critical infrastructure, and help Nicaragua return to its feet in much reduced time. The people there will, of course, thank us for it, and it will serve as a message to the other, American-aligned or sympathetic states in the region that largesse need not come only from Washington. The cost to us, relatively, is minimal." 
 NIC_forpol.44.a: "Excellent."

 NIC_forpol.45.t: "Aid Funds Corruption"
 NIC_forpol.45.desc: "The provision of aid to Nicaragua, while prudent and an excellent opportunity for the expansion of influence, doesn't come without risk. Namely, that the Somoza dynasty and the countless cronies within their administration will simply steal everything that is passed to them.\n\nThis cannot, and will not happen. There will always be some level of theft, of course, that is true in every system, but the absurd levels of institutional graft that have become commonplace in Nicaragua - and especially in their dealings with the OFN and the Americans - will not be permitted to affect the Managua Reconstruction aid.\n\nThere will be some within it who try to test the boundaries, and we will be on the lookout for them. Once identified, named, and turned out from their comfortable positions at the demands of our Ambassador there, the message will be clear. We will rebuild Managua, but we will not be taken advantage of.\n\nWe are not Americans, after all." 
 NIC_forpol.45.a: "Keep a watchful eye."


 ##Endgame Coups
 NIC_forpol.46.t: "Revolution in Nicaragua"
 NIC_forpol.46.desc: "RESTRICTED\n\nFROM MATT WEBER\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: NICARAGUAN REVOLUTION\n\nWidespread unrest in Nicaragua has escalated into an armed revolution by the democratic opposition. Despite countless attempts at deposing the regime over the past years, the Nicaraguan people have finally reached a breaking point. The revolution is led by the Unión Nacional Opositora (UNO), a big-tent party uniting conservatives, socialists, and liberals.\n\nUNO units have already seized multiple provincial cities, with control of Managua weakening by the hour. With how unpopular and unstable the incumbent dictatorship had been, thousands have flocked to the UNO to take up arms against the government.\n\nMultiple leftist insiders part of the Frente Sandinista de Liberación Nacional (FSLN) have expressed discontent that UNO had usurped leadership of the revolution. Communications are breaking down between the two sides as leaders try to work out a compromise.\n\nIntelligence is still actively being gathered on the ground. Despite that, the outcome is clear. Nicaragua's people have finally broken their shackles. Aiding the Nicaraguan regime will hardly change the conflict's outcome. It is unlikely the UNO will cooperate with the Organization of Free Nations (OFN)"
 NIC_forpol.46.a: "Fidelity, Bravery, Integrity"

 NIC_forpol.47.t: "Revolution in Nicaragua"
 NIC_forpol.47.desc: "RESTRICTED\n\nFROM MATT WEBER\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: NICARAGUAN REVOLUTION\n\nWidespread unrest in Nicaragua has escalated into armed revolution. Currently, the Frente Sandinista de Liberación Nacional (FSLN), made up of leftists and communists, is leading the revolt against the Nicaraguan regime.\n\nFSLN units have already seized multiple provincial cities, with control of Managua weakening by the hour. With how unpopular and unstable the incumbent administration has been, thousands have flocked to join the FSLN and bear arms against the government.\n\nMany moderate leaders part of the big-tent party, Unión Nacional Opositora (UNO), have felt alienated by their leftist counterparts. Distrust has begun to form between FSLN and UNO leaders, with some UNO members refusing to take part in the revolt.\n\nIntelligence is still actively being gathered on the ground. Despite that, the outcome is clear. Nicaragua's people have finally broken their shackles. Aiding the Nicaraguan regime will hardly change the conflict's outcome. It is unlikely the FSLN will cooperate with the Organization of Free Nations (OFN)."
 NIC_forpol.47.a: "Fidelity, Bravery, Integrity"

 NIC_forpol.49A.t: "Spared Change"
 NIC_forpol.49A.desc: "Ota Hirotada reclined into his desk, poring over the numbers in front of him. Kubota's international expansion had been going well and had greatly diversified their markets. As a phone call was forwarded to him, he turned down his radio and fielded the call. "Hello, this is Ota Hirotada, Kubota offices in Japan. What is your call about, Ma-"\n\nThe line fettered to life, interrupting Ota as the employee rushed to explain what had happened. "Kirishima Tsuruki, head of operations in Central America. Nicaraguans just broke into our warehouse. Olive fatigues. Civilians. Burnt it down."\n\nOta shook his head. "Slow down, Kirishima. Can anything be recovered?"\n\n"No, sir, everything's gone," replied Kirishima, slowing down as he explained the total loss. Ota noted it down, grimacing. That was a lot of stock. "We need Kubota to charter our flights immediately. Tokyo, Xinjing, Jakarta, anywhere. Please, sir, even just a man to drive us to Honduras would be enou-"\n\nOda laughed down the receiver at the request. They had long accepted the risk of investing in such an unstable country. A bang suddenly reverberated over the line, and after another litany of pleas from down the receiver, he sighed as he placed the caller on hold, turning up the radio.\n\n"...and whilst civilians take to the streets to welcome the Sandinistas, they have instead turned their attention to looting any factories or warehouses built under his old governmen-" the radio blared, before being turned off. No wonder, he realized, poor Tsukuri had been so scared. Trapped in a collapsing country an ocean away, likely about to be captured and lynched by radicals? He picked up the line, hoping that the other side was still there."
 NIC_forpol.49A.a: "Does the wire still hold, an ocean apart?"
 NIC_forpol.49B.t: "Revolution in the Airwaves"
 NIC_forpol.49B.desc: "The waves roared over the bay, but their crashes were obscured by the window and by the blaring of the phone. It was the middle of the day, but for Samuel Saldaña, not enough had been happening to justify him staying awake. Unlike the other airports, which had mostly been turned into international hubs, his airport was largely for intra-Canary travel and ignored by most. Until today. As he picked up the phone, he found himself confused by the strange request and passed it on to his supervisor.\n\nAn hour later, Elpidio Moniz picked up in turn. At first, he shrugged it off. Tenerife was an international destination for tourism, and Iberia had been opening up to Latin America for years. Even if it was smaller, he struggled to understand why a flight from Managua was so unusual. After a few quick words, Moniz shrugged his shoulders, consented, and raised the curiosity to the foreign secretary before moving to field another call.\n\nHe did not act so blasé. A quick word consenting to the landing was quickly followed by a call to the Iberian ambassador in Managua, whispered as the ambassador warned of roaming rioters. It was only as the sun set that he got back word. Calls flooded in from the Iberian embassy, warning that the site wasn't safe, that diplomats, businessmen, and attaches had been fired on, and trying to charter flights from Las Mercedes in Managua to virtually anywhere in Europe. Just as he fielded a third call, a report was thrown on his desk.\n\nSANDINISTA REBELS ENTER MANAGUA\n\nThe Foreign Secretary's stomach dropped. He had followed events in Nicaragua for months and had been imploring Franco to intervene for weeks, but now, reality had set in. Nicaragua had fallen to communism, and it was up to him to pick up the pieces of Iberia's strategy to counter American influence. Sighing, he picked up the phone to another civilian, preparing for a long week."
 NIC_forpol.49B.a: ""Get me some coffee. This is going to take a while.""

 ##News
 NIC_news.1.t: "[Get_newspaper_header]Democratic Revolution in Nicaragua"
 NIC_news.1.desc: "Advocates for liberal democracy around the world smile today, as the perennially unpopular American-backed regime in Nicaragua has been overthrown by the democratic opposition. Following several years of ever-worsening instability and increasingly fewer people willing to support the regime, the Unión Nacional Opositora - a broad coalition of democrats and centrists - has positioned itself at the head of a revolution, deposing the government and promising greater freedoms than before.\n\nWhile the majority of Nicaraguans are grateful for the change in leadership, there is still dissent amongst many, particularly on the political left - due in part to the UNO's commitment to economic partnership with other Latin American countries, there is a belief amongst them that they have merely exchanged one pair of capitalist chains for another."
 NIC_news.1.a: "Time will tell."

 NIC_news.2.t: "[Get_newspaper_header]FSLN Revolution in Nicaragua"
 NIC_news.2.desc: "The Frente Sandinista de Liberación Nacional, a leftist revolutionary front, has seized power in Managua and most of Nicaragua's departments. While conflict continues against the Somocista National Guard in the highlands, the FSLN has announced the creation of a Junta of National Reconstruction headed by their leader Carlos Fonseca. \n\nTheir youthful, socialist supporters and much of the populace have taken to the streets to celebrate the fall of the Somoza dynasty. The Somozas' kleptocratic rule grew untenable after the family embezzled vast quantities of aid intended to rebuild Managua following a devastating earthquake. This blatant theft radicalized Nicaraguans - enabling the FSLN to defeat both the regime and sideline the moderate democratic opposition, UNO. With Fonseca nationalizing Somozan properties and decrying U.S. influence, Nicaragua appears to have shifted irrevocably left.\n"
 NIC_news.2.a: "Somoza's old foe gets his final revenge."
 
 NIC_news.3.t: "[Get_newspaper_header]Hope Somoza Portocarrero Wins Nicaraguan Presidency"
 NIC_news.3.desc: "The leadership crisis that enveloped the ruling Somoza family of Nicaragua has ended today, as rigged elections elevate Hope Somoza Portocarrero, sister-in-law of late President Luis Somoza, to the presidency. Born in Florida, and wife to the Commander of the National Guard, Anastasio Somoza Debayle, she has distinguished herself as a social reformer, helping to create a number of Nicaraguan institutions, as a supporter of charity, and for her past role as a consistent hostess for diplomats.\n\nDespite the efforts of the opposition coalition UNO, her election was wholly unsurprising. International reactions have been muted, but broadly lean negative. Beyond some fascination from American tabloids, observers view her as merely a mask unable to properly veil the brutality of her husband and the National Guard, and with her charity only serving to underscore the corruption central to her family.\n"
 NIC_news.3.a: "A perfect woman for the National Enquirer!"
 NIC_news.3.b: "A change in name only."

 NIC_news.4.t: "[Get_newspaper_header]Anastasio Somoza Debayle Wins Nicaraguan Presidency"
 NIC_news.4.desc: "The leadership crisis that enveloped the ruling Somoza family of Nicaragua has ended today, as rigged elections prove that Anastasio "Tachito" Somoza Debayle, Commander of the National Guard and brother to the late President Luis Somoza, is now its patriarch. Although his election was never in doubt, the massacre of a hundred protestors only further reduced turnout by the democratic opposition UNO.\n\nWith the image of his father once more elevated, and with the same disdain towards dissent, observers expect Anastasio to reverse the last years of measured, limited liberalisation, and for the Nicaraguan state to be flung fully into personalism. With the massacre on Roosevelt Avenue fresh in their minds, some Nicaraguans turn to the Sandinista revolutionaries of Carlos Fonseca for reprieve, and activity from them has risen significantly in recent weeks.\n"
 NIC_news.4.a: "Here's hoping the Somozas discover the carrot soon..."
 NIC_news.4.b: "Nicaragua sinks further into the abyss."
 
 NIC_news.5.t: "[Get_newspaper_header]Anastasio Somoza Debayle Seizes Nicaraguan Presidency"
 NIC_news.5.desc: "With the death of former President Luiz Somoza Debayle at just 44, Nicaragua was briefly thrown into a leadership crisis. Although a pro-Somoza government came into play, Commander of the National Guard Anastasio "Tachito" Somoza Debayle overthrew it. He called elections overseen by the Guard, with victory declared within an hour of the polls closing. With suppression of the UNO opposition, nobody remains who can remove him from office without arms.\n\nNicaraguan democracy has largely been aesthetic since the Somozas' ascendancy in 1937, but Anastasio has abandoned even that veneer, with accusations of fraud and violence from La Prenza quickly repressed. The United States has issued a condemnation, but with Managua largely distancing itself from the US in the past few years, Anastasio has issued no response beyond criticisms of American social practice in Somoza-linked newspapers.\n"
 NIC_news.5.a: "The jailor becomes a butcher of his own friends."
 NIC_news.5.b: "Yet again, corruption and arms rule the day."
 
 NIC_news.6.t: "[Get_newspaper_header]Earthquake Devastates Managua, Nicaragua"
 NIC_news.6.desc: "Grim scenes have emerged from Managua today as a major earthquake has devastated much of Nicaragua. Ranking at 6.3 on the Richter Scale, the earthquake levelled much of the city, and rendered it without power, water or most local government. Emergency services are still searching for survivors in the rubble, but it is likely that thousands have already died, and that thousands more lives will be claimed by disease, exposure or thirst.\n\nWith hundreds of thousands rendered homeless in the impoverished country, a humanitarian crisis seems inevitable. Across the Americas, charities and governments have already pledged significant aid, especially from the United States, and the first shipments have arrived. However, with members of the National Guard roaming the streets for "looters", and the Somozas' reputation for corruption, some fear the effort is just filling the reserves of one family.\n"
 NIC_news.6.a: "Here's hoping the aid gets through."

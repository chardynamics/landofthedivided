#Leader Bios
POLITICS_NIC_LUIS_SOMOZA_DEBAYLE_DESC: "Destiny has a habit of reaching those who least expect it. Born in 1922, Luis Somoza Debayle lived the life of any Latin American elite. He was sent to study in Catholic academies in Tampa and New York, and was even part of a Fraternity at Louisiana State University. He married Isabel Urcuyo for love in 1947, joined the Nicaraguan National Guard like his father, and was on track to one day take the presidency. To Luis, that day was far off. For the moment, he was just the son of the president.\n\nThen, destiny came. In 1956, a poet shot and killed his father in their hometown. It was time for Luis to take the throne. Yet, Luis did not maintain his father's iron grip. He never had to rise to the top, nor contend with an extensive insurgency like Augusto Sandino's. As a matter of fact, Luis took it upon himself to lighten the pressure off Nicaragua. When the Cuban Revolution sent shockwaves through his country, Luis reformed the constitution to ban immediate reelection and forbid relatives from running. He paved the way for a boom of investment in the country, and bits and pieces of agrarian reform have trickled down from his office. Yet, one cannot be fooled. Luis is no reformer; he is still a Somoza. There is no opposition, and those not given the formality of existing languish in his jails. Luis may be a milder flavor of his family name, but he is still his father's son. As the Cardinal of New York said to him when he took the presidency: "I am sure your father would have been very pleased to know that you will be his successor"."
POLITICS_NIC_ANASTASIO_SOMOZA_DEBAYLE_DESC: "Anastasio Somoza Debayle is not known by his name in Nicaragua. They call him "Tachito", or "little Tacho", after his father. Born in 1925, Tachito lived a life much like his brother, attending the same schools in the United States. However, while Luis took the route of a civilian, Anastasio took that of a soldier, graduating from West Point as an engineer. When his father called him back to Nicaragua, he became Commander of the National Guard. There, he used his position to enrich himself, fostering the connections he would need to eventually seize the presidency.\n\nWhen his brother passed away, he did not mourn for long. Theatrical elections were held, and the dynasty continued with him. Tachito, though, is not an intellectual like Luis. He inherited a booming nation, and filled his pockets with the nation's coffers. Nearly half the country is owned by one of his many companies, and the populism that kept the people satiated under his relatives is utilized less and less. Like his father, Tachito has no room for dissent. Token opposition continues to deliver diluted criticism from the National Assembly, but the guerrillas in the backwaters of his country find themselves facing much stronger reprisals. The veneer of democracy of Nicaragua remains, as Tachito sits as its stick and his wife stands as its carrot. Rumors swirl around the country that he can hardly speak Spanish or that his brother tried to prevent his presidency.\n\nHis system has begun to show wear and tear, and a people long apathetic to their government can only think: "The apple does not fall far from the tree"."
POLITICS_NIC_ANASTASIO_SOMOZA_DEBAYLE_DICTATOR_DESC: "Anastasio Somoza Debayle is not known by his name in Nicaragua. They call him "Tachito", or "little Tacho", after his father. Born in 1925, Tachito lived a life much like his brother, attending the same schools in the United States. However, while Luis took the route of a civilian, Anastasio took that of a soldier, graduating from West Point as an engineer. When his father called him back to Nicaragua, he became Commander of the National Guard. There, he used his position to enrich himself, fostering the connections he would need to eventually seize the presidency.\n\nTachito seized the presidency, and for a while ruled like his father before him. Nicaragua continued its theatrical democracy, and he kept up his act as its democratic executive. However, when the tides of geopolitics brought Tachito away from the pressure of the Yanquis, the curtain on his democracy was pulled.\n\nNo longer did he need to contain his excesses or follow stipulations to the aid he received. Tachito has come forth with the truth: He, and his family, are Nicaragua's only true institution. He rules as he sees fit, as he is the fountain of power. Everything that happens in his country must pass through his desk, and no longer will powerless politicians and protesters influence his actions.\n\nSay what one will, but Tachito knows that he has made his father proud. Now, Nicaragua is Somoza, and Somoza is Nicaragua."
POLITICS_NIC_HOPE_SOMOZA_PORTOCARRERO_DESC: "Born in 1929 in Tampa, Florida, Hope Portocarrero found herself part of one of Nicaragua's wealthiest families. Descending from a long line of former presidents, generals, and even a Hungarian veteran of the 1848 revolution, her family found their place as socialites. Her mother was even known as the "most beautiful woman in Nicaragua". Hope spent most of her life in the United States, in places such as Miami, California, and New York. In 1949, she was sent to study in Switzerland where she too was renowned for her beauty, her manners, and her pleasant attitude. Upon her return, she found herself married to the son of President Somoza, and had an extravagant ceremony in the National Cathedral.\n\nShe spent her time in Nicaragua advocating for social welfare, building hospitals in the poorest of regions, attempting to reform the penal system, and creating programs for orphans throughout the country. Famous for her beauty and charm in diplomatic meetings, she served as a human face to the cold exterior of the regime. Growing to become a beloved figure in Nicaragua, it was only natural for her husband to thrust her into the presidency following his brother's passing. The Somozas expected Hope's rule would lighten the pressure on a decaying, unpopular system that excluded their own people for the past 30 years.\n\nWhile the people cheer for Hope, Anastasio remains behind the scenes, maintaining their control under a new, vibrant coat of paint on Somoza's "Republic". Hope may hold the heart of the people, but Anastasio remains the true power behind Nicaragua's "Esperanza"."
POLITICS_NIC_GOVERNMENT_TRIUMVIRATE_DESC: "Long excluded from any meaningful political power, the Conservative Party remained a persistent thorn in the side of the Somozas. At first, it seemed they were content with existing in the National Assembly, but with time, they grew to want more. As they evolved into a real political threat, the Somozas came to realize they would need to be dealt with. With the prisons full, Somoza initiated a political dialogue to bring democracy to Nicaragua - or so he claimed. While the most radical opposition opened fire on Guardsmen prompting a massacre in the streets of Managua, the Conservatives under Dr. Fernando Agüero Rocha entered an agreement for a three man Triumvirate to rule the country to prepare it for free elections.\n\nDespite the pompous ceremonies and countless reforms dissolving the National Assembly and convening a Constitutional Board, their agreement left the National Guard as the de facto executive of the country. At its head sat Anastasio Somoza Debayle. In Nicaragua, laws are merely for show, and the true power now sits with the army, as it always did.\n\nPerhaps, by some miracle, Somoza and his lackeys will give up power in far off elections when the conditions are finally satisfied. For now though, three men lead the country, but only Somoza wields the power."
POLITICS_NIC_CORNELIO_HUECK_DESC: "Who is Cornelio Hüeck? To the rest of Nicaragua, he was the President of the National Assembly. The quiet, short, bald, fat man that always stood beside one of the Somozas. To the residents of Masaya, he was known as "El Señor", the man you went to in a rough patch for a favor, or a gift of cash. To his family, he was the man that brought them wealth, honor, and fame. To Somoza, he was his right hand man. To himself, he was the Nicaraguan success story.\n\nBorn in 1911 in Masaya, Cornelio grew up in a landowning family with ties to Anastasio Somoza before his first presidency. His elite family of European descent gave him access to quality education. Initially pursuing a pharmaceutical degree, he became interested in taxation, becoming head of the National Income Tax Office in 1953. He used his connections to acquire a job as Minister of Finance, and later into Congress under the Nationalist Liberal Party. Through his rise to the top, he was always the loudest voice in the room, recommending populist measures to keep the "will of the people" in the party, while personally supporting measures that bolstered Somoza's power. A man of conservative and traditional views, he used his acumen to write his vague political philosophy into policy, many of his ideas signed into law by Anastasio himself.\n\nNow, he finds himself succeeding the Somozas, continuing the game he helped design. Was the election that brought him to his seat free and fair? Who cares? All that mattered to Cornelio is that the people were satisfied, and that he was the one on top."
POLITICS_NIC_PEDRO_JOAQUIN_CHAMORRO_DESC: "In every young republic in Latin America, there was always a tragic story. A young, idealistic fighter, hellbent on bringing change or his version of freedom to their nation. For Nicaragua, that man was Pedro Joaquín Chamorro, the Editor-In-Chief of La Prensa, the loudest voice against the Somozas. The man who was imprisoned, tortured, and almost met God five separate times. The man who nearly saw himself assassinated, all for the goal of bringing freedom for his people.\n\nBorn in 1924 to one of the many wealthy Criollo families of Managua, Pedro spent his early years in the United States attending a number of Catholic academies, including La Salle, where he was a classmate of one Anastasio Somoza Debayle. He continued his studies in Mexico, and upon his return to Nicaragua, took over his father's newspaper: La Prensa. From the headlines every morning, Pedro denounced Somoza like no other, gaining fame for his brave denunciations that put his life at risk. He involved himself in plots to overthrow each Somoza that held the presidency, being arrested and nearly killed for each. He found himself landing the support of the Cubans in 1959 on the Chontales Plains, and gained enough supporters to split from the Conservatives and found the UNO. Through blood, sweat, words, and tears, Chamorro and the UNO fought to depose the corrupt tyrants who pillaged their own country.\n\nNow having freed it, he finds himself spearheading an agenda written in thousands of articles.Perhaps politics will get in his way, but Chamorro will not stop until Nicaragua is free and fair for all."
POLITICS_NIC_CARLOS_FONSECA_DESC: "Carlos Fonseca is many things. To the Somocistas, he is a bloodthirsty communist. To the UNO, he is a dangerous radical. To the rest of the world, he is a wake up call. Carlos Fonseca has toppled Somoza's regime and brought to the world the newest form of revolution, one inspired by Cuba, and has given every despot one more thing to keep them up at night.\n\nBorn the illegitimate son of a working class mother and a wealthy landowner turned Somocista, Fonseca grew to resent the corrupt elite of Nicaragua from a young age. His rich father helped him obtain education, but he switched his last name to his mother's to honor her struggle and work ethic. He became a fervent reader of Marx, bouncing from student groups whenever he found them too bourgeois. When the Cuban Revolution came, he was already a diehard Marxist, and went to study the revolution and their guerrilla struggle. Inspired by Augusto Sandino and the M26, Fonseca saw himself in failed revolts, including the first days of the FSLN. It wasn't until the Managua Earthquake and the grotesque behavior of the Somozas that society was willing to go further than the traditional opposition. The poor were recruited in droves, and the FSLN's numbers swelled to drive Tachito out. Fonseca now leads a popular revolution, having deposed Somoza as Sandino long dreamed of.\n\nHe stands atop of a country he can build from the ground up, to shape however he wishes. But no amount of education or fighting could have prepared him for the question: What now?"

#Ideas
### Somoza Dynasty State
NIC_The_Heart_and_the_Fangs: "The Heart and the Fangs"
NIC_The_Heart_and_the_Fangs_desc: "For half of a century now, the Somoza family has been Nicaraguan politics. Since the USA left the country in 1933, the Somozas have been its faithful stewards. Even before, when the country was first occupied, the Somozas ruled the political scene. Luis Somoza has instituted some reforms to keep the people happy, but the family will keep its dominance as the kings of the nation, with all the wealth and power in Nicaragua at their fingertips."

NIC_Somocismo: "Somocismo"
NIC_Somocismo_desc: "For half of a century now, the Somoza family has been Nicaraguan politics. Since the USA left the country in 1933, the Somoza's have been its faithful stewards. Even before, when the country was first occupied, the Somozas ruled the political scene. Luis Somoza has instituted some reforms to keep the people happy, but the family will keep its dominance as the kings of the nation, with all the wealth and power in Nicaragua at their fingertips."
NIC_Somocismo_2: "A Little Bit of Hope"
NIC_Somocismo_2_desc: "To the shock of increasingly few in Central America, the Somoza family have retained their position as the presidential imperials of Nicaragua, further tightening the long-standing stranglehold of the family on the levers of government. Yet despite the naked powergrab, the Somozas have utilized an uncharacteristically liberal tact to ensure the future of the regime, opting to appoint Tachito Somoza's wife to the office of the presidency.\n\nDespite the tokenistic overtones surrounding the first woman president in Nicaragua's history, the move proved to be surprisingly popular. The darling socialite La Presidenta is largely adored by the average Nico and is likely to serve well in keeping public discontent to a minimum, even if the real authority in Nicaragua still remains in the hands of her infamous husband, Tachito Somoza."
NIC_Somocismo_3: "Old Habits Die Hard"
NIC_Somocismo_3_desc: "Crowned at the ballot box once again, the republican imperialism of the Somoza family has been affirmed for a new generation of incrementally disaffected Nicos. Content to stuff the family treasury under the pretense of presumed stability, the new heir to the Nicaraguan regime has fallen on the brow of Tachito Somoza, the head of the Nicaraguan National Guard and the youngest son of the late Anastasio Somoza.\n\nConsiderably more of a hardline authoritarian than his elder brother, the younger Somoza's ascension signals a continuation of the rule of presidential nepotism and manufactured democracy. Nicaragua's broader future may be as unknowable as anything else under the New Order, but the Somozas, much like their coffers, are all but certain to reap the benefits of their continued opulence."
NIC_Somocismo_4: "The Gloves Come Off"
NIC_Somocismo_4_desc: "Following the departure of the Americans from the background of Nicaraguan politics, the foreground of the Somoza regime in Managua has taken on a noticeably different hue. Tachito Somoza's heavy-handed use of his family's political machine is all but an open secret now, with Nicaragua's democracy all but a well-choreographed theater for public consumption.\n\nParadoxically, the average Nico has seemingly acclimated to this new paradigm with a kind of muted resignation. Most people are content to go about their lives in anonymity, as long as the presidential dynasty maintains a relative peace in Nicaragua with consistency. Perhaps there wasn't ever much of a democracy for Nicaraguans to really mourn, so much as an acknowledgement of what once was as what now is. Nicaragua is the Somoza Family and the Somoza Family is Nicaragua."

### Internal Situation
NIC_Bracing_for_Impact: "Bracing for Impact"
NIC_Bracing_for_Impact_desc: "The Somozas' greatest fears came true on January 1st 1959. Idealists, spurred on by Castro, rose up against the family and made the people want something, change. For two years the FSLN has only grown in power, pledging to do what Sandino dreamed of. For the Somozas' rule to continue, the skirmishes and robberies must end, through negotiation or, more likely, violence."

NIC_The_Tremors: "The Tremors"
NIC_The_Tremors_desc: "With the Puerto Plata invasion seeing the downfall of one long-running, right-wing regime in Latin America all too happy to flirt with Iberia and Germany, many members of the FSLN have become ecstatic, viewing this as a sign that their success in overthrowing Somoza's regime is imminent. New offensives have been announced, backed by idealistic and excited guerrillas.\n\nNicaragua's government is currently struggling to keep its hold. Almost daily forest skirmishes deplete the Nicaraguan soldiery, whilst a growing number of villages hail the FSLN. What few symbolic reforms have been passed have barely dented this advance, but provided American aid continues to come, their red tide might eventually crest."

NIC_Silent_but_Deadly: "Silent, but Deadly"
NIC_Silent_but_Deadly_desc: "While the continuation of the Somoza Regime was a bitter pill to swallow, the leftist opposition in Nicaragua refused to give up the fight. Rather than be deterred, the FSLN and other guerilla movements are using Somoza's pestilential presence in Managua to further galvanize agitators against the regime.\n\nNot to be outdone, the Sandinistas have been working around the clock to this initiative. Soldiers are on the move, guerilla outposts are being fortified and where weapons aren't finding their way into the interior from abroad, they disappear from armories into the mountains of Nicaragua's hinterlands. How much of an effort was spent liberating themselves from Spanish rule? How much more was spent to make the Soviet Union? A great deal, yet people like the Somoza's are often little more than a stepping stone on the way to revolution, even if it takes some time."


NIC_Somoza_in_Heaven: "Somoza in Heaven, Sandino in Hell"
NIC_Somoza_in_Heaven_desc: ""

### USA Relations
NIC_Our_Son_of_a_Bitch: ""Our Son of a Bitch""
NIC_Our_Son_of_a_Bitch_desc: "Throughout their rule the Somozas' largest benefactor has been the USA. While unable to be an official OFN ally due to their authoritarianism, the state still receives aid from the organisation.\n\nAs Central America enters a new age, and American citizens grow increasingly wary of the Somozas' dictatorship, the United States may come to reconsider its partnership with Nicaragua, and the Somozas may have to find a new best friend."

NIC_Our_Son_of_a_Bitch_2: ""Our Son of a Bitch""
NIC_Our_Son_of_a_Bitch_2_desc: "Any chance of Managua drifting over to a Eurasian backer has faltered, and their alliance with the United States has been secured. Even if he may privately grumble about Cuba's latest initiative or about the latest article decrying his reign from the Washington Post, Somoza once again realises that it is best not to bite the hand that feeds, and relishes in the new aid and trade programmes coming over from the Americans.\n\nHe also knows better than to go back on past commitments. Whilst Nicaragua is small, it still has a firmly established army, and Somoza is happy to commit both its men and any money he can spare to funding the international initiatives of the United States, and in providing yet another eye for Washington to watch over developments across Latin America."

NIC_Falta_de_Respeto: "Falta de Respeto"
NIC_Falta_de_Respeto_desc: "On paper, Nicaragua remains a firm ally, and will continue to publicly back American efforts in the region where it suits their interest. But Somoza is unhappy. Continual American backing for Castro and the Gaitanists, alongside consistent condemnation of Somozan authoritarianism, have convinced him that Washington is, at best, an unreliable backer, and at worst, an active threat to his regime and its interests, waiting impatiently to push him out.\n\nAlready, he has reached out to other international benefactors, and has proven himself to be a suave businessman. If this current trend is to continue, and if Somoza isn't convinced otherwise, it's likely he'll find a way to make the jump. The consequences this has for American interests could be dire."

NIC_Our_Son_of_a_BitchEffect: "§gLevel of Alignment with the £GFX_GNG_USA_texticon United States:§! [?NIC_US_alignment|0Y]/§V10§!"

NIC_Their_Son_of_a_Bitch_IBR: ""Their Son of a Bitch""
NIC_Their_Son_of_a_Bitch_IBR_desc: "There was only so far the American government could push Managua. Facing continual rejection, Managua has now shifted its rhetoric, condemning Washington as simultaneously imperialist and degenerate, and embracing a new ally instead. Whilst not as geographically close, Nicaragua seems likely to tie themselves deeply into their new partnerships, not expecting to be pressured into reforms\n\nPrivately, the Somozas are relishing in their newfound freedom. Every new programme that comes from Eurasia provides not a call for free elections or the protection of dissidents, but a smiling diplomat and a firm handshake. Free of one more external threat, Nicaragua has forged a new, firm alliance, perhaps for decades to come."

NIC_Their_Son_of_a_Bitch_BRA: "You Got A Friend In Me"
NIC_Their_Son_of_a_Bitch_BRA_desc: "American policy may have incensed Somoza, but the risk of total isolation from the rest of Latin America has forced his hand. Rather than taking the risk of alienating the continent to embrace disinterested Eurasian powers, Somoza has instead forged strong ties with Brazil's military junta. It may not quite be an internationally regarded superpower, but the image of a large benefactor had outlasted isolation in Managua.\n\nIt may not be that significant a jump for its geopolitical setup either. With Brasília's ties to the United States, the Americans have attempted a rapprochement, hoping to plug their newfound vulnerabilities. Somoza's personal scorn and frustrations aside though, he will eventually buckle. There is too much to gain with dollars for cruzeiros alone to suffice."

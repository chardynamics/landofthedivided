NIC_Their_Son_of_a_Bitch_DOM: "Nuestro Buen Amigo"
NIC_Their_Son_of_a_Bitch_DOM_desc: "However incongruous it might have seemed even a decade ago, the primacy of the Somoza family in Nicaragua remains, only now having crept away from the American umbrella into the arms of pro-Axis elements in the region.\n\nMaybe the presidential dynasts are simply tired of kowtowing to Washington's increasingly mercurial demands, perhaps they genuinely believe in the cause of their new benefactors. Regardless, the Somoza regime always had more in common with the Trujillos' in Santo Domingo than just about anyone in the White House. This is a relationship that can be properly built upon, showcasing that the developing Central American state can offer something of true merit to their erstwhile allies, regardless of any...ideological divides that might exist between the lines."

### Economy
NIC_Coffee_Cattle_Control: "Coffee, Cattle, and Control"
NIC_Coffee_Cattle_Control_desc: ""I don't want educated people, I want oxen," has been the motto of the Nicaraguan economy since the Somozas first took power. While there has been expansion in agriculture and industry, the economy is hampered by the Somozas, with their ownership of nearly every industry in the country.\n\nNicaragua isn't treated like a country by the family, and instead more like a business or a feudal title. Profits come first, and all else second.\n\nRecently, however, Luis has invested a fair amount into infrastructure and development. Whether good intentions or just an investment for future riches, the cities and roads have seen the effects, although the rural areas have been left to untouched."

NIC_Developmental_Death_Grip: "Developmental Death Grip"
NIC_Developmental_Death_Grip_desc: "Nicaragua has grown far from its agricultural roots. Now with a sizable manufacturing industry, the Somozas have made Nicaragua the economic powerhouse of Central America. With their cities towering above their competitors, Nicaragua is far ahead of its neighbors.\n\nDespite this economic growth, the Somozas are still the sole owners of Nicaragua. All these factories are owned by the Somozas, and the developments of Luis go into the bank account of Anastasio. While the country may develop at a slower pace, this progress would be unimaginable without the Somozas' leadership."

NIC_Managuas_Magic_Trick: "Managua's Magic Trick"
NIC_Managuas_Magic_Trick_desc: "Leave it up to the Somoza family to do the impossible: they have made tens of millions in foreign aid disappear! In its place, only a few million can be found. Surely this is the mastercraft of an expert financial magician such as Anastasio Somoza, only he has the sleight of hand to pull off such a trick.\n\nHowever, Somoza's audience found no entertainment in the performance. Thousands lie dead in the aftermath of the earthquake, and only scraps have been given to the people to help them rebuild. To them, it is simply another robbery, and one that has occurred in the country's darkest hour."

NIC_Somocismo_sin_Somoza: "Somocismo sin Somoza"
NIC_Calm_Before_the_Storm: "Calm Before the Storm"
NIC_Somocismo_Moderno: "Somocismo Moderno"
NIC_Somocismo_Moderno_desc: "In 1936, Anastasio Somoza's word was the voice of God in Nicaraguan polity. 36 years later, his son knows all too well that his father's word, much the same as his own, only carries so far. The precarious turmoil of the Second World War and the Cold War that followed only offered so much of an excuse to hold on to power, a lesson that the past three and half decades have made quite clear.\n\nRather than tempt the winds of fate to sweep the Somozan regime out of power, Tachito Somoza has opted for a kind of 'rebranding' of the presidential dynasty. Nicaragua's forward-facing facade is couched as a 'developmentalist state', ideologically unaligned to keep the great powers conveniently at arm's length. All the while, predetermined orchestration of elections and party opposition continues, all in the name of keeping the civilian population placated and ensuring the Somoza Family remains the only real voice that matters."
NIC_Somocismo_Moderno_2: "El Triunvirato"
NIC_Somocismo_Moderno_2_desc: "All organisms go through the process of evolution, including the theatrical democracy of Nicaragua. In an attempt to release some of the mounting pressure on the Somoza family, Anastasio has reached out to the Conservative Party to form a Junta to work towards a new constitution and free elections. On paper, this Junta shares power between the government and the opposition, leaving the position of Executive to the National Guard.\n\nBut in reality, democracy in Nicaragua has died. Why? Because the commander of the National Guard is none other than Anastasio Somoza. Any semblance of opposition parties and republican processes aimlessly draft a constitution that will never see the light of day. The dictatorship of the National Guard has at last stepped into the spotlight as the real authority in Managua, the mask of liberty finally slipping to reveal the reign of rot and reaction."
NIC_Somocismo_Moderno_3: "Somoza Para Siempre"
NIC_Somocismo_Moderno_3_desc: "Anastasio Somoza was not just the boss of Nicaragua; he was the boss of everything within. The years since 1936 had once taught the Somozas a lesson in modesty, but gone are the days with such need for fake courtesy; for old tricks ceased being practical in modern times. Some in the family speak of adopting a liberalized image, but why not go the other way?\n\nIt was a mistake from the start to create a guise of democracy at all. Tachito Somoza has no eyes watching him, no critics scrutinizing him, and now there is no reason to hide the fact that he alone is the single wealthiest, most powerful man in Central America. Nicaragua had always been the Somozas' fiefdom, and that will never change."

NIC_Eruption: "Eruption"
NIC_Eruption_desc: "The time has come. The city dwellers, long the typical silent supporters of Somoza, have finally been pushed too far. In the wake of the grotesque robbing of the foreign aid meant for Nicaragua's earthquake victims, the city dwellers have turned their backs on Somoza, and riots have spread through the streets like wildfire. Within these riots, the UNO and the FSLN have finally found allies within the city, finally found footholds within the heart of Somoza's base of support.\n\nAs the resistance to Somoza grows, and guerillas descend into the cities, one thing has become clear: the volcano of rebellion has finally erupted."

NIC_Callado: "Callado"
NIC_Callado_desc: "Rebellion had erupted within Nicaragua, and the UNO and the FSLN had taken the chance to try and finally depose the Somoza regime. Now, they retreat back into the hills and shadows, battered and beaten. It was no easy fight. Somoza had bombed cities, executed prisoners en masse, and countless lie dead across the country.\n\nHowever, while Somoza may have killed many of the men, the ideas they clung to still live on. One day, the people of Nicaragua will rise up again, but for now they will remain silent and oppressed. First, they must allow time to heal their wounds."


NIC_From_La_Prensa: "From La Prensa to El Pueblo"
NIC_From_La_Prensa_desc: "Since his early days as editor in chief for Nicaragua's largest opposition journal, Pedro Joaquín Chamarro took pride in standing at the forefront of popular contest to Somoza's rule.\n\nEver the advocate for broad participatory democracy and sensible policymaking, it was reflected in the makeup of the movement he helmed; hastily molded together from various unseated political parties and other defectors.\n\nNow, he finds himself handed the chance to finally put into practice the ideas he'd been shouting for the past couple of decades, and shape the UNO from a rogue big-tent coalition of former dissidents into something capable of steering the Republic into a new, democratic era."
NIC_An_Old_Friend: "An Old Friend"
NIC_An_Old_Friend_desc: "A decade earlier, a much younger Chamorro would shake hands with Fidel Castro, narrowly earning his backing for an ambitious military invasion of Nicaragua.\n\nNot so long after, a hundred and twenty men, high in revolutionary fervor and bearing Cuban weapons, would land on Boaco and Chontales, boldly attempting to overthrow Somoza Debayle. An endeavor that would lead Chamorro to spend the next few years within the confines of a jail cell.\n\nWith his goal finally achieved under radically different circumstances, Chamorro has chosen to align his newly liberated country with the Veracruz Pact, standing shoulder to shoulder with the men who once supported his dream for a free and fair Nicaragua, and now brought him to its highest seat."
NIC_The_Sour_Sandinistas: "The Sour Sandinistas"
NIC_The_Sour_Sandinistas_desc: "Just as all were glad to defy Somoza's oppressive rule, all are now euphoric to revel in the aftermath of his regime's fall. All, except for the FLSN.\n\nIf the big tent UNO was happy to bring along a wide coalition ranging from all manner of liberals to conservatives alike, those seeking to go further and shake the country's deeply traditional society and its Catholic institutions were unsurprisingly not invited to the dance.\n\nAnd so, the communists and others sitting on the left-wing fringe are taking their resentment to the very streets that had once seen them take up arms alongside those who would now steal their revolution and claim it for their own."
NIC_Foundations_on_Sand: "Foundations on Sand"
NIC_Foundations_on_Sand_desc: "Disappointing most expectations, Somoza's final gift to Nicaragua was a debt as impressive as his family's outrageous wealth; which would also vanish just as they did.\n\nAlthough aid from the Veracruz Pact provides a more than generous boon to the country's struggling economy, it won't be enough to refill the enormous hole in the treasury left behind by the land's former owners.\n\nAnd while Chamorro's new administration begins to salvage the industry and tackle the illiterate backwater that is the rest of the country, the road to recovery will remain an unfortunately long one."
NIC_Foundations_on_Sand_2: "Foundations on Sand"
NIC_Foundations_on_Sand_2_desc: "When Somoza fled Nicaragua, the people expected to inherit his wealth. The reality of the situation is far more disappointing. Instead, the people discovered an empty treasury and a mountain of debt; one last financial magic trick from the Somozas.\n\nThe Somoza's looting of the nation's wealth has left Nicaragua in a spiral, and now it falls to Fonseca and the FSLN to find a way out.\n\nThe first steps have already begun; mass literacy programs and reconstruction in Managua have already begun implementation. Alongside the aid pouring in from fellow socialist states, the FSLN can only hope that it's all enough to escape the economic black hole they've inherited."
NIC_Nicaraguas_Jan_1: "Nicaragua's January 1st"
NIC_Nicaraguas_Jan_1_desc: "On January 1st, 1959, Cuba gave something to the world. Now, Fonseca and the FSLN have brought that gift to Nicaragua.\n\nMasses of guerrillas parade through the streets of the capital and other cities in celebration, praising the FSLN and Sandino, celebrating the nation's long-awaited liberation from Somoza's grasp. Meanwhile, Fonseca and the FSLN have spent time in exile in Cuba following Castro's revolution, and studied the process that Cuba went through in the revolution's wake. Now, they apply that same experience and knowledge to Nicaragua.\n\nHowever, the Junta of National Reconstruction must now contend with a new obstacle: the many different factions bickering over how exactly to rebuild Nicaragua in the Socialist Model."
NIC_Theory_Into_Practice: "Theory Into Practice"
NIC_Theory_Into_Practice_desc: "Aligned with the Internationale, socialist allies have funneled aid into Nicaragua to assist in reconstruction. It is the question of what that reconstruction will look like that Fonseca and the FSLN must now answer.\n\nFonseca bore witness to Castro's revolution, and now attempts to apply the Cuban model to Nicaragua, albeit reformed into an improved socialist form. However, he must also balance his vision for the country with the factions within the Junta of National Reconstruction. Some now argue for a slow transition, while others call for mass government intervention."
NIC_Revolutionary_Inertia: "Revolutionary Inertia"
NIC_Revolutionary_Inertia_desc: "It is a fundamental rule of this world that for every action, there must be an equal and opposite reaction.\n\nNicaragua is no exception.\n\nThe democratic opposition has grown tired of being paid mere lip service. The more anti-socialist factions of the National Guard and democratic opposition have begun taking up arms against what the Sandinista menace. The FSLN's grasp on power has begun to drift off its course. If they can not quell the dissatisfaction of the opposition, they could face a true counterrevolution."


#Events

 NIC_Relations_Secured: "§FOur ties with the §sSomoza Dynasty§! have been §Gsecured§!.§!"
 NIC_Relations_Improve: "§FOur ties with the §sSomoza Dynasty§! will §Gimprove§!.§!"

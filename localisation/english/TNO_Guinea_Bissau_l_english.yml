 ### Ideas ###
 GNB_finite_status_quo:0 "A Finite Status-Quo"
 GNB_finite_status_quo_desc:0 "Spínola's forces were stationed in Guinea-Bissau with what they thought was a simple goal: Defend the colony on behalf of the Portuguese (and by extension, the Iberian) government.\n\nHowever, there is an issue with that mission: the Portuguese government no longer exists. It has descended into civil war, and chaos reigns within the mainland. Guinea-Bissau was now on its own.\n\nWithout a government backing them, it is only a matter of time before Spínola and the Portuguese forces within Guinea-Bissau are either overrun or invaded by external forces." 
 GNB_fling_terrorism:0 "FLING Terrorism"
 GNB_fling_terrorism_desc:0 "The PAIGC has been put into power within Guinea-Bissau. However, officially being in charge is not the same as holding true control over the nation, and the PAIGC's rule is very much still contested.\n\nThe main opposition to the government is currently originating from another group known as FLING, who oppose the Marxist doctrine that PAIGC adheres to. As such, FLING currently carries out a series of attacks against the government in an effort to unseat the PAIGC and put themselves into power."
 GNB_bissau_crisis:0 "Bissau Political Crisis"
 GNB_bissau_crisis_desc:0 "The Portuguese have been ousted from Guinea-Bissau, but there still remains much to be done. With several African nations involved in the reorganization of the former colony, no local government has had the chance to form, and instead Guinea-Bissau becomes the battleground for a different kind of conflict.\n\nThe various nations involved don't wage this conflict with direct bloodshed, but instead through funding and encouragement of Guinean factions most aligned with their individual interests. Until one side emerges as the clear victors, Guinea-Bissau's fate will continue to be tugged in various different directions."
 GNB_paigc_offensive:0 "New PAIGC Offensive"
 GNB_Foreign_Occupation:0 "Foreign Troop Presence"
 GNB_Foreign_Occupation_desc:0 "In the aftermath of the West African War, Guinea-Bissau's brief freedom from Portugal's fist ended with its grasping by another one. A new hand which will not let go until it has ensured its grip is firmly secured.\n\nUntil then, the citizens of Bissau will have to endure the constant watch of a garrison of foreign soldiers patrolling its still-recovering streets, perhaps entertaining a doubtful hope that this new master might prove gentler than the former." 
 GNB_hell_on_earth:0 "Hell on Earth"
 GNB_hell_on_earth_desc:0 "Portugal has re-asserted its control over Guinea-Bissau, the Portuguese flag once again flying above the colony's various coastal cities, but at what cost? While Lisboa may have declared the return a success, the situation can only be described as extremely dire.\n\nThe PAIGC may be cornered, but they have quickly pivoted to urban guerrilla tactics, making Portugal bleed for every inch of pavement they expand their control into. Portuguese troops present in the area for years now push their way onto boats back to Europe, never wishing to look back. Spínola is functionally a governor of a small network of coastal settlements due to a lack of manpower and an exhausted local economy. It's no small wonder that nobody in Lisboa wants to touch the issue with a ten-foot pole."

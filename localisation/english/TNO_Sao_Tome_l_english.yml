##Events
SAO_FOR.1.t: "Status of São Tomé and Príncipe"
SAO_FOR.1.d: "The collapse of the Iberian Union has led to the creation of several new nations across the African continent. One such nation is the Republic of São Tomé and Príncipe located on islands west of our allies in the Congo region.\n\nThe young nation's need for trading partners and aid to supplement its development capabilities has fortunately led to it draw close to our Economic Sphere, opening them up for further actions in the future. While their usefulness pales in comparison to their neighbour, more control over the continent can only serve to benefit us."
SAO_FOR.1.a: "The light of freedom shines brighter each day."

SAO_FOR.2.t: "Status of São Tomé and Príncipe"
SAO_FOR.2.d: "The collapse of the Iberian Union has led to the creation of several new nations across the African continent. One such nation is the Republic of Republic of São Tomé and Príncipe, located on islands west of our allies in the Congo region.\n\nThe young nation's need for trading partners and aid to supplement its development capabilities has fortunately led to it draw close to our Economic Sphere, opening them up for further actions in the future. While their usefulness pales in comparison to their neighbour, more control over the continent can only serve to benefit us."
SAO_FOR.2.a: "Joyful News!"

SAO_FOR.3.t: "Status of São Tomé and Príncipe"
SAO_FOR.3.d: "The collapse of the Iberian Union has led to the creation of several new nations across the African continent. One such nation is the Republic of Republic of São Tomé and Príncipe, located west of the Congo region.\n\nThe young nation's need for trading partners and aid to supplement its development capabilities has fortunately led to it draw close to our allies in West Africa, and thus to our Economic Sphere, opening them up for further actions in the future. While their usefulness pales in comparison to their neighbour, more control over the continent can only serve to benefit us."
SAO_FOR.3.a: "Their success is our success."


#Ideas
SAO_Civic_Association: "The Civic Association"
SAO_Civic_Association_desc: "As much as the MLSTP is idealistic in their mission to liberate São Tomé, they have the unenviable handicap of having to convince the island they are the face of the new regime despite being an entirely foreign entity. Between the heavy-handed rule of the Portuguese and the relative isolation of São Tomé, the Pan African movement operating underground in Portuguese Africa was unable to seed much of a support base among the island population. This has made ingratiating the locals to the ideals of the revolution a difficult sell to say the least.\n\nHatched as a means to bridge this gap between the movement and São Tomé itself, the MLSTP and the transition council have formed the Civic Association. In charge of organizing political rallies and distributing Pan Africanist propaganda, the CA has quickly evolved into the principal wellspring of leftist radicalism on São Tomé, even more so than that of the party they represent."

SAO_Glorified_Naval_Base: "Glorified Naval Base"
SAO_Glorified_Naval_Base_desc: "With the formal entry of the island of São Tomé into the Pan African alliance, the arch anti-colonialists have taken to fortifying and repurposing the formerly Portuguese facilities for the revolutionary armadas. As much as this has proven an easy vehicle for improving the economy on São Tomé, this has the knock-on effect of relegating the island's diplomatic relevance to a naval installation at Kameroon's beck and call.\n\nWhile São Tomé's presence is vital for the power projection of their allies, it doesn't reflect well on Kameroon's reputation to have the island's contributions reduced to a tertiary role in the larger theater of the Pan-African revolution."
 GUA_Jose_Manuel_Fortuny: "José Manuel Fortuny"
 
#Ideas

 GUA_Disloyal_Military: "Disloyal Military"
 GUA_Disloyal_Military_desc: "Military men ran Guatemala before the Revolution. In the Revolution, some officers like Jacobo Árbenz and Francisco Javier Arana were instrumental in sweeping away Ubico's lackeys from power. Arana would then run Guatemala through a controversial presidential term, and might still be running it had his loyalists' coup not failed.\n\nMilitary men, beholden only to the Chief of the Armed Forces, still run much of the country. They run the borders, watching for imperialist weakness or Mexican perfidy. They run security for the UFCO and its plantations, watching for strikes and communists. And they watch the Palacio Verde, waiting for the misstep or lurch toward communism that will allow them to run all of Guatemala once more."

 GUA_Revolutionary_Tutelage: "Revolutionary Tutelage"
 GUA_Revolutionary_Tutelage_desc: "The Revolution of '44 failed. Guatemalans were again subjected to tyranny, and only rescued by their northern neighbor's determined efforts. Mexico, their foe turned tutor, now shows them how to institutionalize a renewed Guatemalan Revolution, cementing their eternal friendship.\n\nChapínes need only look north to see what awaits. Democracy will be reintroduced, but only after a broad party incorporates all of Guatemala's revolutionary currents and elections are firmly secured. The military will be rebuilt to ensure it defends, not threatens, the nation. Corporatist cousins to the CTM and CNC will mobilize workers and peasants in favor of land reform, social justice, and national sovereignty. Studious chapínes will see that it is not a Revolution being institutionalized, but a farce."

 GUA_Pleading_Pesos: "Pleading for Pesos"
 GUA_Pleading_Pesos_desc: "If one could travel Guatemala's cratered roads and busted rails, abandoned homes and farms would never leave the window. But the investors, whether Japanese, American, or criollo, have left, and show no signs of returning.\n\nThat leaves the Mexican occupiers themselves. Private enterprise from Monterrey and Guadalajara is salivating at the chance to turn a quick profit by denuding Guatemala of resources. By contrast, Mexico City is loath to lavish scarce development resources on humanitarian aid or reconstructing its loathed southern neighbor. But such generosity will be needed for the Land of Eternal Spring to become the long-term trade partner that Mexico seeks."

 GUA_Counterrevolutionary_Elements: "Counter-Revolutionary Elements"
 GUA_Counterrevolutionary_Elements_desc: "Beneath the ceiba's sprawling branches, the Armed Forces of Mexico hunt the growing Guatemalan insurgency. The guerillas draw from the bastards that humiliated Mexico's military in '58, the soldiers who lobbed artillery shells at them in the short, sharp war just ended, the policemen deserting en masse, the Communists and fascists this ruined land breeds in abundance. And they draw from the Maya.\n\nRacial prejudice from FAM officers has turned misunderstandings into resistance, neutrals into foes, and villages into cinders. While Ladino dissidents are hauled off for covert executions in military camps, entire Mayan communities suspected of sheltering guerillas are massacred. At war with half of Guatemala, the FAM is growing exhausted, dejected, and ever more hateful."

 GUA_20_Years_Of_Spring:0 "20 Years of Spring"
 GUA_20_Years_Of_Spring_desc:0 "Amidst the dark days of 1944, as fascist victories swept the globe, the Guatemalan people won one triumph for liberty. Their revolution in defense of the constitution and open elections united students, trade unions, the middle-class, and elements of the military to topple the autocratic and violent dictator Jorge Ubico.\n\nThis ushered in two decades of democratic opening in Guatemala, as the Partido Acción Revolucionaria expanded suffrage to women and the illiterate and worked to protect civil liberties. Though coups remain a threat, the nation's long history of military rule is slowly receding from memory. Perhaps the light and warmth of this thaw can spread—Guatemala's gift of spring in a cold and dark world."

 GUA_That_Uncomfortable_Presence:0 "That Uncomfortable Presence"
 GUA_That_Uncomfortable_Presence_desc:0 "Guatemala could be the United States' exemplar in Central America. A stable, developing democracy vociferously opposed to fascism, a stern opponent to Trujillo and his ilk, and a vigorous participant in the OAS.\n\nCould be. But there is one wedge that stands between the ruling PAR and the United States. A wedge that owns the nation's railroads, ports, and over half of its arable land. A wedge that has links to senior diplomatic officials in Washington and a lobbying budget of hundreds of thousands annually. A wedge named the United Fruit Company.\n\nIf the PAR cannot balance its reforms against the Company's interests... that wedge may break Guatemala apart."

 GUA_Limited_Agrarian_Reform:0 "Limited Agrarian Reform"
 GUA_Limited_Agrarian_Reform_desc:0 "The cry for land is, without any doubt, the loudest and most desperate in all Guatemala. Ubico and his forbears handed the nation's vast patrimony to the United Fruit Company and bestowed near-feudal privileges on a constellation of smaller landowners. Violence and coercion provided them their labor.\n\nThe UFCO's immense power frustrates any attempts to reform this brutal system. Yes, Presidents Arévalo and Montenegro have offered dispossessed peasants state lands and mandated school construction on plantations. But the new labor laws exempt the rural workforce, and any substantive land redistribution is blocked. As the misery of the Ladino and especially Mayan peasants continues, radicals in the government yearn for a bolder champion. And radicals outside it begin to look for other means."

 GUA_20_Years_Extinguished:0 "20 Years, Extinguished"
 GUA_20_Years_Extinguished_desc:0 "In 1944, Guatemala set aside its long history of military rule with a twenty-year democratic revolution. That aberration has ended.\n\nBoots and uniforms once again patrol the halls of power. They break their regimented stride only to press down upon those who would lift their voices against this order.\n\nTwenty years have seen such traitors multiply. Labor unions fattened under the PAR squeal as their communist-granted 'rights' are stripped away. And so the boots press harder. Scholars and students at San Carlos have gotten used to speaking their mind, even as they parrot Marxist filth. And so the boots press harder. The Maya take up arms and refugees take flight. And so the boots press harder."

 GUA_Reign_Of_The_Fruit_Company:0 "The Reign of the Fruit Company"
 GUA_Reign_Of_The_Fruit_Company_desc:0 "As the fears of PAR radicalism reached fever pitch, the nationalist officers of Guatemala's military pacted with the United Fruit Company against their common foe. Now the terms of this contract are honored.\n\nUFCO wields its influence in Washington and across Central America to secure aid and recognition for the Guatemalan junta. In return, the military has given the UFCO near absolute authority over its fief - over half of Guatemala's arable land and growing by the day. But with UFCO's tribute of quetzals shrinking, who was made vassal and who sovereign is no longer clear."

 GUA_Unequal_Land_Distribution:0 "Unequal Land Distribution"
 GUA_Unequal_Land_Distribution_desc:0 "The cry for land is, without any doubt, the loudest and most desperate in all Guatemala. The PAR sought to answer that cry with agrarian reform proposals that ranged from tepid to radical, none fully realized. And so the call grew louder, deafening.\n\nGuatemala's military junta that succeeded them seeks to silence it. The PAR's meddlesome regulations, barely enforced, are shredded, returning the nation to the harsh but profitable practices of the Ubico era. But the end of the false hopes peddled by the PAR has not quieted the peasantry's desperate howls.\n\nPerhaps paramilitary bullets will."

 GUA_The_Militarys_State:0 "The Military's State"
 GUA_The_Militarys_State_desc:0 "Having seized the state that it operated nigh-autonomously from since the Revolution, Guatemala's military now shapes the nation's government in its own image. Debate is curtailed in favor of unquestioned obedience to the junta, especially the president. Vigilance is promoted against the enemy without: the imperialist squatters to the east and the revolutionary scum of Mexico, Cuba, and the Caribbean Legion lying in wait. And utter ruthlessness against the enemy within - the MR-13 guerrillas and restive Mayan peasantry foremost among their number.\n\nNot to mention a certain taste for institutional and personal enrichment, as the country's foreign aid and limited budget are plowed back into the military and into generals' pockets."

 GUA_A_Fistful_of_Pesos:0 "A Fistful of Pesos"
 GUA_A_Fistful_of_Pesos_desc:0 "Following the devastation of the brief but violent Mexican-Guatemalan War, few thought Mexico would provide more than a fistful of pesos to rebuild its neighbor. Bitter blood between the nations ran too deep, and as a developing nation itself, Mexico was assumed to have too little to spare.\n\nBut Mexico has rebuilt Guatemala - into a miniature of itself. Mayan ejidos till their land alongside co-opted latifundistas; URD-controlled unions manage the workforce of private enterprise and state-owned corporations alike. Economists may critique the structure as an inefficient, incoherent mess, but it is a durable one. That fistful of pesos, invested wisely, has bought Mexico a long-term trade partner and a strong revolutionary foundation in the Land of Eternal Spring."

 GUA_For_A_Few_Pesos_More:0 "For a Few Pesos More..."
 GUA_For_A_Few_Pesos_More_desc:0 "Following the devastation of the brief but violent Mexican-Guatemalan War, few thought Mexico would provide more than a fistful of pesos to rebuild its neighbor. Bitter blood between the nations ran too deep, and as a developing nation itself, Mexico was assumed to have too little to spare.\n\nOh, how naive they were. Mexicans instead descended with unrestrained rapacity to plunder Guatemala. Latifundistas across the border scrambled to seize land, replicating the worst of the United Fruit Company's abuses. Industrialists and enterprising PRI politicians grabbed any property they could, scrapping it if no quick profit could be obtained. As Guatemala descends deeper into poverty and violence, Mexico's hunt for a few pesos more has bought it an eternal enemy in the Land of Eternal Spring."

 GUA_Counterrevolutionary_Elements_2:0 "Counter-Revolutionary Elements"
 GUA_Counterrevolutionary_Elements_2_desc:0 "Guatemala's military, rebuilt from the ground up following the Mexican invasion, is now a force for revolution, rather than the deadliest dagger aimed at the nation's heart. But these loyal troops are direly overstretched fighting the countless foes seeking to overthrow the Revolution: reactionary guerrillas full of well-trained former soldiers and police, communists that never laid down their arms, and Maya peasants incensed by the brutal and prejudiced Mexican occupation that birthed Guatemala's new order.\n\nFor the sake of national pride and international respectability, Guatemala does not acknowledge the Mexican military and security services' frequent intrusions to fight these threats. Nor will these vicious cross-border operations cease until Guatemala can secure its own Revolution."

 GUA_Saker_Ti:0 "Saker-Ti"
 GUA_Saker_Ti_desc:0 "After the darkness of Ydígoras' repressive military government, a new dawn has arrived in Guatemala. It illuminates MR-13's red and black banners hanging within the Palacio Verde, the crowds of students celebrating in the streets. The firearms of Cubans and Caribbean Legionnaires gleam under its rays, as the Mexican advisers keep to the long shadows of morning.\n\nFar from the festivities, soldiers of the old regime cling to their weapons in caves and rural redoubts yet untouched by the new sun. But as their leaders scurry to crevices abroad, the union of Guatemala under a new day is just a matter of time."

 GUA_The_Great_Uprooting:0 "The Great Uprooting"
 GUA_The_Great_Uprooting_desc:0 "The Revolution spearheaded by MR-13 would not have succeeded without the guerrillas promising radical and comprehensive agrarian reform. But as the militants establish themselves and new governing institutions in Guatemala City, thousands of eager calloused hands are outpacing their program and decrees by taking the land they know is their own.\n\nJoyous peasants and agricultural laborers seize one plantation after another, as the defending paramilitaries break at the sight of United Fruit Company personnel and elite landowners fleeing the country. While statistics cannot be kept amid the chaos, a sharp drop in agricultural production is visible in the lack of bananas and coffee piling up at ports. Nevertheless, the new regime has cemented a deep loyalty in the countryside, if not control."

 GUA_Men_Of_Maize:0 "Men of Maize"
 GUA_Men_Of_Maize_desc:0 "Jacobo Árbenz, a key figure in defeating Ubico in '44, has achieved victory over the Revolution's other great foe, the United Fruit Company. By launching a well-planned and escalating agrarian reform over his term, the PAR president was able to expropriate and redistribute uncultivated land from the nation's vast plantations to peasants as well as improve the wages and conditions of rural laborers.\n\nThe UFCO is far from finished, fighting ferocious rearguards alongside allied landowners in the courts and in the fields. But the professional and dedicated bureaucracy Árbenz built in the National Agrarian Department and the engaged peasantry participating in the Agrarian Committees are prepared for the long campaign ahead. Their triumph can already be seen in field upon field of ripening corn."

 GUA_Land_Of_Eternal_Spring:0 "Land of Eternal Spring"
 GUA_Land_Of_Eternal_Spring_desc:0 "Democracy has reached full bloom in Guatemala. When the people planted liberty's seed in the Revolution of 1944, few could predict it taking root in soil laid bare by decades of military rule. But grown it has - with suffrage and education expanded and the near-serfdom of its rural poor ended. As the country celebrates the most competitive elections in its history, chapínes will plant new bulbs in this flowering garden.\n\nWhichever choice they make in this world of cruel, dark winters, the Guatemalan people have made their home truly the Land of Eternal Spring."

## Events

#Leader
 GUA_Mario_Mendez_Montenegro: "Mario Méndez Montenegro"
 POLITICS_GUA_Mario_Mendez_Montenegro_DESC: "As his term comes to a close, Mario Méndez Montenegro prepares to make his most important contribution to Guatemala's October Revolution: the handover of power to his long-time opponent, Árbenz. None could claim it was his only one. Méndez Montenegro was a law student at the National University in 1944, taking up the fight against General Ubico's dictatorship. Quickly becoming a leader of the movement, he would be personally menaced and briefly escaped to Mexico. Upon his return, Méndez Montenegro would found and lead the Frente Popular de Liberación to compete in Guatemala's newly-freed elections, taking Doctor Arévalo to the presidency and himself to the mayoralty of Guatemala City.\n\nMéndez Montenegro would cement his reputation and popularity through a series of public works in the capital, extending water and sewage to impoverished neighborhoods and improving transport links. Few were surprised when his close ally Arana offered him the Ministry of Interior upon assuming the presidency. A tumultuous term followed, with Arana's sidelined rival, Colonel Árbenz, nearly splintering the revolutionary movement. Méndez Montenegro brokered a deal acceptable to the clashing titans - he would run for the presidency in 1956 on the PAR ticket, then pass leadership to Árbenz. His own presidency has seen development and the deepening of the Revolution in its urban strongholds. But the military has grown restive, strengthening its ties to rural reaction and intensifying border conflicts with Mexico. These few remaining months will put Méndez Montenegro and his Revolution to a sharp test."
 
 GUA_Jacobo_Arbenz: "Jacobo Árbenz"
 POLITICS_GUA_Jacobo_Arbenz_DESC: "What can stop Jacobo Árbenz? The bankruptcy of his family cutting him off from a university education? Árbenz went to the military academy instead. The suicide of his humiliated father? The morose gravitas of the sharp cadet led to profound honors and rapid promotion. Guatemala's vindictive high society after this uncultured and impoverished soldier married María Cristina Vilanova, its brightest and most beautiful debutante? They found comfort in each other's arms and in their dreams of a fair Guatemala. The military junta which would crush those dreams? He and Colonel Arana assaulted the Palacio Verde and overthrew it.\n\nFor a time, some may have answered Arana. The Commander of the Armed Forces turned President worked to set aside his rival Árbenz. But those years in the wilderness only gave Árbenz time to plan - to lay the groundwork of his great project with María. They distributed land from their own estate, assembled reformers, drafted laws and propaganda.\n\nGeneral Ydígoras thought a coup would stop him. Instead Árbenz assumes the presidency as a hero of democracy, the shocked PAR rallying to his vision. A vision of agrarian reform, to rectify the spectre of inequality and poverty that has bedeviled Guatemala since Mayan times. The United Fruit Company, the rightist MLN, the bitter military and its paramilitary allies await. But nothing has stopped Jacobo Árbenz yet."
 
 GUA_Oscar_Adolfo_Mijangos_Lopez: "Oscar Adolfo Mijangos López"
 POLITICS_GUA_Oscar_Adolfo_Mijangos_Lopez_DESC: "Dr. Mijangos, universally called Fito, is a lover of drink and women, an amiable man who gallivants all night. But sociability should not be mistaken for unseriousness. Fito, a top student at the University of San Carlos, received a scholarship to complete a doctorate in Labor and Agrarian Law in Quebec. A fall would render him paraplegic, but would not slow him down. Upon his return to Guatemala, he founded the journal 'Combate', attracting a cohort of young intellectuals that sought to extend the October Revolution over a rebellious military and feudal interior.\n\nElected as a PAR legislator, Fito soon became a smiling but formidable force for President Árbenz's reform agenda, investigating latifundistas' abuses and evasion of land redistribution. With Árbenz's backing and a vigorous campaign by his protégé Colom Argueta in Guatemala City, the wheelchair-bound lawyer decisively won the 1968 presidential elections.\n\nWith rumors of a military coup swirling, Dr. Mijangos has dedicated his term to protecting Guatemala's legal and constitutional order against its old foes. By bolstering the prestige of the Revolutionary government abroad, he aims to sever plotters' ties with the U.S. By welcoming responsible investment into Guatemala's mining sector, he hopes to curb business' hostility to the PAR and diversify away from the United Fruit Company. And by nurturing municipal democracy, Fito seeks to overthrow the thugs and petty despots that still rule much of Guatemala."

 GUA_Julio_Mendez_Montenegro: "Julio Méndez Montenegro"
 POLITICS_GUA_Julio_Mendez_Montenegro_DESC: ""And so begins a new stage in the history of the glorious feat of October 20th," said President Julio Méndez Montenegro as he began the Fifth Government of the Revolution. Méndez Montenegro was there from the start, part of the tight-knit student networks at the National University that confronted General Ubico and the succeeding junta. Méndez Montenegro would garner his peers' acclaim and the regime's opprobrium by leading the fight for university autonomy in their ultimatum to the dictator. Next, he would become a leader in his older brother Mario's new party, the Frente Popular de Liberación, campaigning for President Arévalo's triumphal election. As Arévalo led Guatemala and his brother Guatemala City, Méndez Montenegro graduated from San Carlos as a lawyer and notary, departing to further studies in labor law in Chile. This, and Mario's influence, secured him a cabinet post in the Arana administration. But when Mario himself became president, to avoid perceptions of nepotism, Julio decamped from politics to become dean at the University of San Carlos.\n\nThere Méndez Montenegro built his relationships with the nation's intellectual and bureaucratic elite. In them, he found a yearning to end Guatemala's ceaseless conflicts, to professionalize and modernize the Revolution. A yearning for a new stage - one that he could deliver. With the endorsements of several PAR ministers, he secured the presidency. As he works to accommodate the military, pardon guerillas and paramilitaries alike, and reconcile the PAR and the U.S., October 20th is taking a new direction indeed."
 
 GUA_Rene_de_Leon_Schlotter: "René de León Schlotter"
 POLITICS_GUA_Rene_de_Leon_Schlotter_DESC: "The kingdom of God in Guatemala will be built by humble hands. Brown hands. This was the revelation through which René de León Schlotter overcame the secularist Revolution.\n\nIn the '50s, his party, Democracia Cristiana Guatemalteca, was primarily religious students at the University of San Carlos in Guatemala City that sought a Christian Social alternative to the PAR's anti-clericalism and the higher clergy's support for authoritarian reaction. Upon becoming party president, he set the DCG on a new direction - these privileged youths must go amongst the deeply Catholic, deeply impoverished Maya and share the good word. His wife Carmen Escribano, an immigrant from Spain, would share it as well - publishing the party journal 'El Pueblo' year after year.\n\nThe PAR's godless strength made progress slow. He would not be elected the first time he ran for Congress in Quiché. Or the second. But he would break through, and others in the DCG would follow. Vote by vote, they would overcome the socialists. Vote by vote, they showed the Church that the humble Christians, not generals, would save Guatemala from atheism.\n\nThe path to the Presidency that followed was narrow, but it was not straight. De León Schlotter had to weave a coalition that could defeat the PAR - stretching as far as the rightists he had so long decried. But to bring faith, hope, and love to all Guatemalans, it was worth it."
 
 GUA_Mario_Sandaval_Alarcon: "Mario Sandoval Alarcón"
 POLITICS_GUA_Mario_Sandaval_Alarcon_DESC: "Mario Sandoval Alarcón is a fighter. If not, "El Mico", the Monkey, would not have made the symbol of his Movimiento de Liberación Nacional a crossed dagger. He would not have added the red to his party's colors - the red of the blood that must be shed for Dios, Patria, Libertad. He would not have survived torture in Salamá prison. He would not be trailed by a legion of bodyguards, ones he pays a $$50 bonus per hit.\n\nEl Mico is a fighter because he is white. Raised on a plantation in Guatemala's wild east, he learned that the few whites could only control their Mayan labor with a machete in one hand and a pistol in the other. Through organized violence. The Revolution threatened that order, threatened his people, and so it must go. And so he organized the MLN, and plotted coup after failed coup from his sala. They failed.\n\nBut he could not, did not. El Mico studied reams of socialist literature for weaknesses, beloved white poodles by his side. He renounced his past Falangist sympathies, to get the gringos' backing. He tore into every PAR failure, intimidated the peasants with death squads, and got the Fruit Company to fund his campaign. He beat the Revolution on its own terms, at the ballot boxes it built. But its thirty years of disorder and socialism have made the Maya and the Ladino proud, rebellious.\n\nPresident Mario Sandoval Alarcón is a fighter, and his fight has just begun."

 GUA_Carlos_Manuel_Arana_Osorio: "Carlos Manuel Arana Osorio"
 POLITICS_GUA_Carlos_Manuel_Arana_Osorio_DESC: "Carlos Arana Osorio was a mediocrity. Despite being the nephew of President Arana, he followed a normal track for Guatemalans of his class. Grew up in the southeast. Got an education in the capital. Failed his medicine degree. Joined the military. Ascended at a leisurely pace to the rank of major. Carlos Arana Osorio could have faded from history, if he hadn't been assigned a zone command. If his gift hadn't been discovered.\n\nUnfortunately for the FAR and MS-13, his genius was for counter-insurgency operations. Arana Osorio met with ranchers and planters, merchants, MLN rightists, MANO paramilitaries, assembling a vast net of informants and auxiliaries to track down and destroy the guerrillas of his zone. Reports of his 'excesses' only brought "the Jackal" greater fame as an anti-communist hero.\n\nThe weak government tried to exile him after that, to hide his glory with an ambassadorship to Nicaragua. Colonel Arana Osorio built his ties with the Somozas and the FBI, and watched as General Árbenz plunged the country toward ruin. Just as before, Guatemala's greatest foes came from within. Just as before, he assembled a network. And struck.\n\nCarlos Arana Osorio is no longer a mediocrity. He is the spider in the web of violence enveloping Guatemala, the one link between the soldiers, the death squads, the latifundistas, the Fruit Company, Washington- he is Guatemala's savior."

 GUA_Hermenegildo_Cuencia_Diaz: "Hermenegildo Cuenca Díaz"
 POLITICS_HERMENEGILDO_DIAZ: "General Hermenegildo Cuenca Díaz now rules, as he has long sought. Did that dream arrive during his childhood in Mexico City? Or was he, a young cadet of the Heroic Military College, inspired marching alongside President Venustiano Carranza to the latter's doom in Puebla? Was Cuenca Díaz convinced of his grandeur in the battles that followed, or did he seek power to compensate for the two wounds he took fighting?\n\nCertainly, Cuenca Díaz displayed ambition in the Alemán presidency, ascending to Chief of the Presidential General Staff through his ties to the 'Lemon' faction. Certainly, he nursed his hunger in Cortines' sexenio, complaining vociferously over his relegation to the Tlaxcala military district. Certainly, his yearning exploded under López Mateos as the general threw himself into PRI party politics in the Baja military district, chasing a governorship by leveraging old ties with Echeverría. But all he managed to acquire was a post as Senator.\n\nUntil the war with Guatemala broke out, and a leader with the perfect mix of desire, military acumen, and brutality was called for to stabilize Mexico's subjugated neighbor. Their charge would be short but clear: hunt leftist guerillas, destroy the remnants of the old regime, and establish a new, pliant one in Mexico's image. And that is why General Hermenegildo Cuenca Díaz now rules Guatemala. And how the General is one step closer to ruling Mexico, as he has long sought."
 
 GUA_Manuel_Colom_Argueta: "Manuel Colom Argueta"
 POLITICS_GUA_Manuel_Colom_Argueta_inst_dep_DESC: "Like every suit of cards, every revolution has its Ace. Guatemala's is Manuel Colom Argueta.\n\n"Meme's" revolutionary credentials are impeccable. At only age eleven, he volunteered directing traffic to support the Revolution of '44. He organized students at San Carlos, leading them to support the progressive promises of the ruling PAR. When reaction snuffed out that dream, he entered 'Combate', his friend Dr. Fito Mijangos' journal, fiercely decrying the regime's corruption and violence until he was imprisoned and exiled to Mexico.\n\nColom Argueta's intellect, skills, and connections are unquestioned. A distinguished law student, he was awarded the Galván prize, using the resulting scholarship to study with the Mexican scholarly elite at UNAM. There he would return in exile, ascending academically while forming the Unidad Revolucionaria Democrática from Guatemalan refugees and intellectuals. Even as president, he personally leads the team of economists and engineers helming Guatemala's ambitious reconstruction and development initiative.\n\nBut even an Ace can lose in a bad hand. Bedeviled by accusations of collaboration, Colom Argueta's charismatic speeches have an undercurrent of sadness. Opportunists flock to the URD, a big tent expanding beyond even his energetic control. Worst of all is the spiralling violence, drops of Guatemalan blood staining even its highest card."
 POLITICS_GUA_Manuel_Colom_Argueta_soc_DESC: "Manuel "Meme" Colom Argueta has kept the flame of the Revolution of '44 blazing bright into its thirtieth year.\n\nMeme first felt its heat as a young teen, directing the celebratory traffic through his native Guatemala City. He would enter its burning heart at the University of San Carlos, emerging as a student leader and brilliant mind. The Galván scholarship that followed sent him to UNAM to continue his studies in law - but his return was inevitable. He was drawn to the flame.\n\nWithout ceasing his academic work at San Carlos, Meme threw himself into the dynamic and tense Árbenz administration, a rare politician from the urban PAR that could animate the campesinos behind the vast agrarian reform. In 1968, as his friend and ally Dr. Mijangos López ran for the presidency, Colom Argueta's bold mayoral campaign would set Guatemala City alight. He would keep that spirit stoked by delivering on his ambitious urban development plans and strengthening ties with the city's boisterous unions.\n\nAs the exemplar of Mijangos' decentralization initiative, Colom Argueta rallied the national municipal association along with the left-wing of the PAR to secure the 1974 presidential nomination. Despite the anxieties of superpowers and the vituperative MLN opposition, the Revolution's fiery promise of a just and free Guatemala will not dim on his watch."
 
 GUA_Marco_Antonio_Yon_Sosa: "Marco Antonio Yon Sosa"
 POLITICS_GUA_Marco_Antonio_Yon_Sosa_DESC: "For once, Commandante Marco Antonio Yon Sosa is fighting on unfamiliar terrain - the halls of the Palacio Verde. Born in eastern Guatemala to Chinese immigrants and adopted into a merchant family, 'El Chino' lived well, minding the store and playing soccer. The Revolution came when he was fifteen, helmed by brave soldiers and National University students. So when the time came to find a career, Yon Sosa chose the army.\n\nThe army showed him discipline, taught him to aim a gun. However, its Ubico-era officers fell far short of the Revolutionary ideal - they made deals with the Fruit Company, with the oligarchs and the gringos. Lieutenant Yon Sosa kept his mouth shut and kept training to be a ranger, the rough mountains and jungles a welcome respite from the conspiratorial barracks. Then the army seized power. Lieutenant Yon Sosa left for the mountains and jungles, taking a couple rangers and the Revolution with him.\n\nYon Sosa and MR-13 went to war. Robbing banks, blowing up barracks, rallying peasants, flitting across the Mexican border, receiving Árbenz's blessing in Cuba and with it, guns and Caribbean Legion vets. Firefights in the hills of Chiquimula became bombings on Guatemala City streets. He moved easily across all of Guatemala, inspiring and attacking. But the Commandante could not keep his movement from splintering repeatedly over ideology. As a guerilla, that was costly. But now that Yon Sosa leads the nation he fought for, it could cost his Revolution its victory."
 
 GUA_Miguel_Ydigoras_Fuentes: "Miguel Ydígoras Fuentes"
 POLITICS_GUA_Miguel_Ydigoras_Fuentes_DESC: "Guatemalan black coffee flows through the veins of President Miguel Ydígoras Fuentes. A patriotic vice, one of the few suitable for a general.\n\nBorn at the close of the 19th century, Ydígoras grew up on a coffee plantation, imbibing its aristocratic values: he, with his European features, would organize and command, the Ladinos and Mayans would toil in the dirt below. Coffee kept him sharp, fueled his rise - he graduated top of his class at the national military academy, took prestigious embassy postings, and became a governor at 27. Ydígoras drank and led, led and drank until General Ubico made him a general as well.\n\nThen the Revolution of 1944 toppled Ubico. Before, giving orders by the light of day, Ydígoras had drank coffee; now, plotting by night, he inhaled it. His coups failed, his presidential run lost to that traitor Arana, and the PAR sank communism's twisted roots into Guatemala's soil bit by bit. But General Ydígoras did not despair. He took another cup, black, and struck true.\n\nGuatemalan black coffee flows through the veins of President Miguel Ydígoras Fuentes. It lets him work as hard as ten men, he has no need for his cabinet. It leaves him bitter, hateful to the people he claims to protect. It leaves him vigilant - paranoid some say, ever alert to the guerrillas creeping about in the dark. Ydígoras' night is long, but there's always another cup waiting."
 

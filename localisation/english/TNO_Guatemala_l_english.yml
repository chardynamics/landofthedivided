 GUA_forpol.1.t: "A Smuggler's Dilemma"
 GUA_forpol.1.desc: "Agent Díaz blew air over his cup of coffee before going in for a sip, scanning over sheets of paper strung out over his desk. Something strange had happened at the border with Guatemala, and the case file was wrecking his brain. He took a ballpoint and began to click. "Once more over the story, in shorthand..." Díaz tore off blank paper and began to write, glasses firmly pushed up his nose.\n\nIt began with a certain Corporal Ramos—a fairly unremarkable specimen from what his squadmates said in DFS interviews—leaving his barracks in Ciudad Hidalgo without permission, having commandeered a truck in the dead of night. He had apparently been doing this often but on this occasion had somehow alerted a sentry, so they sent out men to go look for him as a possible deserter. The border guards caught him just before he crossed the Rodolfo Robles bridge and turned out his pockets, going through every nook and cranny in the truck with scent dogs and such.\n\nThey found out he had stolen several crates of ammunition, weapons, and many tons of dynamite—some of the sticks even being taped around his body—and proper high explosive ordinance. Corporal Ramos was also carrying up to 10,000 pesos in hard cash and even larger amounts of foreign currencies. He was naturally arrested, and after a night in the cells and a nice persuasive chat, he gave everything up.\n\nApparently, military types in Guatemala had been bribing their Mexican counterparts to look the other way as they sought out weaponry and material, with these ordinary squaddies playing courier. There had been a few more arrests in the intervening days but this was the part Díaz struggled with.\n\n"Why did they want the guns? And why from us?" he murmured to himself, leaning over to pick up his telephone receiver. This was far above his pay grade."
 GUA_forpol.1.a: "Investigate further."

 GUA_forpol.2.t: "A Covert Plot"
 GUA_forpol.2.desc: ""Did you get the shipment?"\n\n"Intercepted. The police got Ramos right before he crossed."\n\n"Shit! But is the plan still on?"\n\n"It's over when I say it's over. One way or another, my friend, the Government will fall."\n\nThe line went dead at the other end with a click. Agent Jiménez turned a few dials on the wiretap as he looked over the conversation he had just transcribed. "So the rumours were true," he mumbled to himself as he quickly jotted. On assignment in Guatemala City with the DFS, Jiménez had been briefed on some smuggling operation over the border—firearms, whatever—but he hadn't been told how serious it got. The phones he had just tapped into belonged to an army headquarters in San Marcos, the other to a hacienda owner in a town called Sibinal. Both the military and the local planters wanted to stick it to the PAR and were importing guns and explosives to do it.\n\nJiménez spun the rotary dial on the telephone, and when the operator asked who to connect him to, briefly paused. Díaz in Chiapas had got the lead... but whoever reported first to the Federal District would get a commendation.\n\nFernando Gutiérrez Barrios' office phone rang once, and was raised smoothly to his ear. With his free hand, the first fragments of a DFS report took shape on his typewriter - GUATEMALA COUP THREAT. Smuggled weaponry. Guatemalan military, United Fruit Company, reactionaries aim to prevent leftist President-elect Árbenz from taking office."
 GUA_forpol.2.a: "Recommend infiltration through known smuggling channels."
 GUA_forpol.2.b: "Recommend heightened monitoring through the Guatemala City operation."

 GUA_forpol.3.t: "Border Control"
 GUA_forpol.3.desc: "Dr. Samuel León Brindis was no fool. He had eyes and ears everywhere in the state of Chiapas—of course, he was its governor—that had noticed the many rumours coming from across the border. Guatemala's PAR government was going to fall, that was guaranteed, but the question Governor Brindis posed to himself was how could he make the most out of the mayhem. And then it hit him like a flash.\n\nThose bastard smugglers had been running back and forth over the border and those damn Guatemalans would never go as far to lay a finger to bring them to justice—hell, they were probably in on it—and cry that their sovereignty was being violated. Well, he would give them something to cry about!\n\nHe had spoken to his men in the state police and they were going to launch coordinated raids on various smuggling dens, some of which conveniently sat over the border. This was no coincidence. The Guatemalan authorities would be humiliated, cut down to size. Put in their boots. And it was going to be him, the old physician, to sock them a surgical strike.\n\nWhat Dr. Brindis neglected to realise was that one of his secretaries, a totally banal fellow who may or may not be in the employ of the DFS, had been reading his private papers and caught wind of his grand scheme. In fact, a copy of them was sitting in Los Pinos that very afternoon. López Mateos wondered what to do." 
 GUA_forpol.3.a: "Give Brindis a talking to and let's work a joint operation out with the Guatemalans."
 GUA_forpol.3.b: "Punish him? He'll get any help he needs! We need to take these bastards down a peg."

 GUA_forpol.4.t: "Dormant Coup Plot Revived"
 GUA_forpol.4.desc: "SECRET/[?global.date.GetDateStringNoHourLong]\n\nFROM: FBI DIRECTOR J. EDGAR HOOVER\nMEMORANDUM FOR THE PRESIDENT\nSUBJECT: PROSPECTIVE COUP IN GUATEMALA\n1. The Bureau has become aware of a development in the Republic of Guatemala. Intelligence suggests that various members of the Guatemalan Armed Forces and representatives of the United Fruit Company (UFC) are conspiring to overthrow the left-wing Partido Acción Revolucionaria (PAR) Government, following the PAR's victory in this year's elections. The personnel and network involved are similar to a coup plot formulated in early 1958, indicating that this current conspiracy is a 'revival' of the plot that was not previously put into action.\n\n\n2. Although relations between PAR and the United States have been generally friendly, the UFC has repeatedly expressed concerns that its holdings in Guatemala are in danger of confiscation should President-elect Árbenz implement his radical land reform agenda. Potential tension with America and concerns over domestic radicalisation have also encouraged pro-US and anti-Communist military officers to plot PAR's overthrow as a preemptive measure, although reports suggest more recent recruits to the plot are not universally in favor of increased American influence in the country, exhibiting a more nationalistic character."
 GUA_forpol.4.a: "We'll keep an eye out."

 GUA_forpol.5.t: "Circle Tightens"
 GUA_forpol.5.desc: "It had been some time since Agent Michaels had to play these spy games. He had tailed the guy out of the Defense Ministry, picked up a dead drop outside the Cathedral, and had been led here, to a Freemason Lodge in the hills overlooking Guatemala City. In full uniform, the two army officers waited for him in the center of the dark oaken hall. He would've been happy to get a phone call, but guys who plot to overthrow the Government always feel like they have to do the whole song and dance.\n\n"The lodge is a beautiful building, isn't it, my Yankee friend?" said one of the officers - tall and slim, skin like milky coffee. "In the world of the mob, the discerning man finds himself drawn to the wonderful ideas of old Europe - such as Masonry."\n\n"I'm still waiting for my station chief to invite me," Michaels said dryly. "Thanks for beating him to the punch, so long as you gents aren't too fond of the ideas of new Europe."\n\nThe tall officer shrugged. "There's nothing either good or bad, but thinking makes it so."\n\nThe other officer piped up - he was short and stocky, like he lived behind a desk, but his manner was impatient. "Cut it out, we all know why we're here." He wiped his forehead on his sleeve. "We represent the concerned patriots of Guatemala, who don't want to stand by while PAR turns us into another Cuba."\n\n"If we had a representative of the UFC here," this was the tall one again, "he'd tell you in your own language how dangerous Washington's continued complacency is. Help yourselves, at least. What would your station chief say?""
 GUA_forpol.5.a: ""Don't count on us, cowboys, I trust your outfit even less than I trust PAR.""
 GUA_forpol.5.b: ""If you guys can do it, then do it. We'll talk again after you win.""

 GUA_forpol.6.t: "Japanese Insight"
 GUA_forpol.6.desc: "Troubling reports flooded in, whispering of a Guatemalan coup. From Japanese steelwork managers to local textile workers, they repeated the same unnerving pattern—run-ins with the Guatemalan garrison, questioning from their zealous officers, and whispers of a new friendship with Tokyo. A persistent name haunted each report: Miguel Ydígoras.\n\nHatano nervously read each one of them. And then again. And each pass made his breathing ever so heavier. He thought working in the Americas would prove to be more relaxing compared to home. Yet, now he sits in front of the very letters that would spell out the collapse of Central America's last beacon of stability. Why did it have to be a coup? Why did it have to be here?\n\n"Papa?" A voice cut through the Embassy office.\n\nHatano turned to see his daughter standing in the doorway. She was holding a plate of hot tamales she bought from the Sunday market. "Why are you still working? Aren't you hungry?"\n\n"Your papa has important things to send to Japan," Hatano forced out a chuckle. "They want to know what's going on here."\n\nThe girl walked in and set her plate on his desk. The banana leaves dripped oil on the reports, but Hatano didn't care. "Does that mean we have to go back?"\n\nHatano looked at her, regret clouding his eyes. His daughter had never seen Fuji's grace nor wandered the vibrant Tokyo streets. Her words began to have a slight Spanish ring to them instead of a Japanese lilt. Her home was here, in Guatemala, and it was about to be torn apart."
 GUA_forpol.6.a: "A home he must protect."
 GUA_forpol.6.b: "And for her sake, Japan must choose the winning side."
 GUA_forpol.6.c: ""Stay calm Hayato. Keep perspective.""

 GUA_forpol.7.t: "Part-Time Paramilitant"
 GUA_forpol.7.desc: "How you can travel a thousand miles and somehow end up in the same place?\n\nA smarter person than Tenta had likely coined the phrase, but the words kept ringing in his head the more he stood there. The rustling of leaves, the buzzing of insects and the blistering equatorial sun that seemed to almost judge him being there at all. One would think that an unassuming-looking Yasuda salaryman, far from Tokyo though he was, would not look that out of place in an otherwise tranquil jungle country like this.\n\nTenta knew better though, as it didn't take much for a place like this, with perhaps with the right or wrong man in it, for it to become a very different beast.\n\nAnother rifle cracked and pieces of glass went flying, the guerillas' aim was improving with every burst bottle. Tenta wiped sweat from his brow as the line of soldiers took aim and let off more shots in front of him, a scattering of empty shell casings gathering in the dirt below. One could hardly call it 'moonlighting' at this hour, but what was a retired IJA major to do if not spread a little prosperity in his off-time?\n\nIt wasn't as if Yasuda wasn't aware of Tenta's military-grade vacation haunt, as they stood just as much to gain from this as he did. Not all business connections had to mercantile, nevermind legal. The quetzals they paid him with weren't a lot, but they did go towards American-made gifts for his family in the home islands. As much Tenta could grouse about the weather for how it reminded him of Java, it was, certainly by American standards, rewarding work."
 GUA_forpol.7.a: "An errant thought made his eyes roll; Heaven was Guatemala...can you put that on a brochure?"

 GUA_forpol.8.t: "Cooperate with Méndez?"
 GUA_forpol.8.desc: ""Good day from Guatemala City, señor. You must be wondering why we're using the hotline. Get your superiors and tell them this..."\n\nA call, and another, and another, until all the wires to Los Pinos start bouncing with conspiracy. There the Great Human President sat at his mahogany desk, hands nested tight, as DFS Captain Gutiérrez Barrios and the relevant zone commander, General Barragán, took their own chairs.\n\n"Your Excellency, they know about the agency poking around with the smugglers. Normally this would mean the entire operation would be compromised," Barrios began, "but they have an offer for us."\n\nBarragán shifted in his seat, "President Méndez Montenegro is asking for intel on these coup plotters, anything we can give them. And they also want to know what the Bureau and their G-men are up to."\n\nLópez Mateos got up, buttoned his coat, and broke into a slow amble through the room, eyes upcast as he paced in thought. "This is a big ask, licenciados. This would mean going against the full force of the FBI in Guatemala."\n\n"I say we keep out of it, Your Excellency. Méndez was useless when his airforce strafed our fishermen. He'd be just as useless now," Barragán grunted, looking askance at Barrios who shook his head.\n\n"Helping the Guatemalan administration would mean our agents aren't deported, General. We can pass something on."\n\nUltimately, it was up to the President. The two of them went silent and awaited his commanding word."
 GUA_forpol.8.a: ""The PAR are friends. Let's give them everything we have.""
 GUA_forpol.8.b: ""Limited intelligence. We're not going to war with the FBI.""
 GUA_forpol.8.c: ""If he wanted help, he should have leashed his military before they killed Mexicans.""

 GUA_forpol.9.t: "Goodbye Forever"
 GUA_forpol.9.desc: ""Fight for the nation," the lieutenant peered through the haze across the river. "Safeguard the revolution." The Río Chixoy rushed, working tirelessly at its sole task of separating the two nations; Mexico and Guatemala. "Protect the pe-" The cloud exploded. He dropped to cover, but it took only a moment to determine that he was not the target. The chapínes across the Chixoy were firing on each other.\n\nIn distant Guatemala City, soldiers streamed into the streets. President Méndez did not call the PAR's loyal unions or the students to arms - the new junta's opening address would claim he committed suicide.\n\nMateos inside his office read every report, heard every detail from the DFS and SEDENA. It was all over. 1944. Gone. General Ydígoras usurped the dream, powered by the FBI, the United Fruit Company, and planters, he had broken the revolutionary dream, broken the PAR regime. It was gone- his refuge in 1929 when the PNR was hunting him. His - But it was gone. It was gone and the yanquis killed it. His only reason for not acting against this coup. Those pinches gringos.\n\nMateos' mind snapped back to the present, the two agencies and their men promising him they would continue monitoring the destroyed dream, and that they would wait. They would wait and see how Guatemala would develop, without its flames."
 GUA_forpol.9.a: "Another revolution crumbles, only tears left."

 GUA_forpol.10.t: "A Different Face, A Darker State"
 GUA_forpol.10.desc: "President Mateos felt his heart pang as he picked up the promised report. Nearly two years had passed since Ydígoras overthrew the Guatemalan revolution. Each page flipped illustrated another way he had done so. The people were sidelined, press censored, unions repressed, Mayans slaughtered. Ydígoras held the nation under his military dictatorship, loyal to only to the United Fruit Company's dollar.\n\nYet, Guatemala's descent went beyond being a vessel for foreign exploitation. Ydígoras's regime was not a mere client state, it had its own will- that of turning the entire nation into a fascist graveyard. Of mobilizing the entire nation to prepare for something akin to their own Puerto Plata. Preparing for conflict with Mexico, with Cuba, with the Veracruz Pact as a whole.\n\nMateos laid the report down. He glared hatefully, impotently at the name Ydígoras as if it would summon the general to Los Pinos, ready to be struck down with pure and unadulterated anger. But no.\n\nGuatemala had become a threat to Mexican security, with security and defense staff agreeing on the assessment. Mateos would not be able to finish this; his successor would need to deal with the reactionary threat. For now, he could only prepare."
 GUA_forpol.10.a: "The revolution would not be extinguished here."

 GUA_forpol.11.t: "Profile of the Ydígoras Regime"
 GUA_forpol.11.desc: "SECRET/[?global.date.GetDateStringNoHourLong]\nFROM ISAAC UZARCEWITZ\nMEMORANDUM FOR THE PRESIDENT\nUPDATE ON GUATEMALA\n\n1. President Miguel Ydígoras has consolidated his hold over Guatemalan politics since leading a coup two years ago. Despite nationalist posturing, his government is welcoming to US commercial interests and is permissive toward growing US intelligence networks and military ties. However, his domestic repression and hostility toward the Veracruz Pact may harm internal and regional stability.\n\n2. Guatemalan officials contacted over the last four months describe other members of the junta as being sidelined by General Ydígoras, and describe a paranoiac atmosphere within government that suppresses any internal opposition. Separately, the United Fruit Company has reported record profits, with managers in Quiché and Baja Verapaz crediting the Ydígoras government's laissez faire approach to agrarian development. Lastly, Ydígoras is embarking on a sizeable military buildup to satisfy his powerbase, fight Mayan dissidents and guerillas like MR-13, and to provide border security after an escalation against Mexico earlier this year.\n\n3. Given Ydígoras' secured position, cultivating personal ties through a visit by a prominent administration official could substantially strengthen the US position in Guatemala, at the risk of a negative reaction from Veracruz. Alternatively, we could maintain public distance while encouraging UFC investments and arms sales. Lastly, we could pressure Ydígoras to moderate his hostile rhetoric and internal repression."
 GUA_forpol.11.a: "Send what's-his-name to Guatemala City for coffee with our partner Ydígoras."
 GUA_forpol.11.b: "A troublesome but useful figure. Let's make as much money as we can quietly."
 GUA_forpol.11.c: "Get the Fruit Company to tell him all this paranoia is bad for business. Will calm things down."

 GUA_forpol.12.t: "ATTENTION: SECRETARY OF NATIONAL DEFENCE"
 GUA_forpol.12.desc: "The investigation into last week's skirmish has concluded. Border Patrol Units, on a standard patrol circuit in the Campeche zone command, came across a small number of armed men from Guatemala engaged in an incursion into our territory. Their motives remain unknown, however we can say with certainty that their number was between 15 to 20 soldiers crossing the Usumacinta River with munitions and supplies. Border units elsewhere in the area reported no hostile sightings, and further investigation has demonstrated no evidence to the contrary.\n\nAs stated in the initial report, neither unit was armed and so no serious casualties were reported. As such, while the Guatemalan unit was forced back across the border through a melee, the situation did not immediately escalate beyond deployment of armed units.\n\nExamination of aerial reconnaissance and local observation since the incident has confirmed the presence of further Guatemalan military units in the region. There are indications of at least three new supply posts hidden in the forests near the contact line. 3 B-29s have recently arrived at the Dos Lagunas Airstrip with ordnance visibly loaded onto them. Local reconnaissance operations have encountered further patrols and encampments on the Guatemalan side of the border. At least 1 fresh battalion is active in the area.\n\nOur assessment, to be presented to the President and Cabinet, is that the Guatamalans know they are being watched post-incident and are engaging in intimidation signals. However, should they choose to pursue a conflict in the region using these newly deployed assets, we would be unlikely to contain it with our current local strength.\n\nVery respectfully, General Jorge Álvez"
 GUA_forpol.12.a: "Reduce operations in the area and indicate our peaceful intentions to the Ambassador."
 GUA_forpol.12.b: "Summon the Ambassador to formally protest the action, maintain current operations."
 GUA_forpol.12.c: "Increase operations in the area, both patrols and reconnaissance, to show our resolve."
 GUA_forpol.12.d: "Mobilise our local forces with extra men and aircraft, ready the border."

 GUA_forpol.13.t: "FBI M/G Border Incident Report #0142"
 GUA_forpol.13.desc: "SECRET/[?global.date.GetDateStringNoHourLong]\nLocation: Eastern Chiapas, 16°45'57.6"N 90°46'27.7"W\n1. Sources inside both Guatemala and Mexico have informed us of a border incident in the vicinity of the provided coordinates. While details remain unclear, the general situation has been verified. Anti-PRI dissidents using Guatemala as a safe haven attempted a crossing into Mexico over the Usumacinta River using rafts, carrying munitions and supplies. A Mexican Naval Patrol Boat came across them and a firefight broke out, escalating with a quick response unit deployed by the Mexican military. The dissidents' retreat into Guatemala was pursued by this force for approximately a mile before being halted by responding Guatemalan forces. Rather than submit to the requested disarmament and internment the Mexican unit retreated back across the border.\n\n2.Units have been deployed by both sides to the region with both governments denouncing the other as breaching their sovereignty. Mexico accuses Guatemala of continuing to facilitate dissident crossings, an unverified claim, while Guatemala describes the Mexican incursion as everything but an act of war. Both sides may yet change course but analysts are unanimous, this may escalate further - even to war.\n\n3. Supporting Mexico may improve relations with Veracruz nations but the Mexican incursion is hard to justify under our doctrine of demanding international norms. Supporting Guatemala would be in line, however would also require us to turn a blind eye to the ongoing issue of Mexican dissidents, alienating Mexico and their allies. Silence on the matter would be most accepted by OFN partners, providing us with the neutrality to chair a settlement, but risks being seen as weakness within the region."
 GUA_forpol.13.a: "Mexico was attacked, and responded. Ydígoras cannot think these actions are supported."
 GUA_forpol.13.b: "Mexico overreacted and risks war. It cannot think its actions are supported."
 GUA_forpol.13.c: "Neither Mexico nor Guatemala are innocent. When the chips fall, a neutral voice will be needed." 

 GUA_forpol.14.t: "Tensions Cool"
 GUA_forpol.14.desc: ""Well done." The words rasped out of General José Agustín Olachea's throat, from age or lack of practice. "Three separate reports from Guatemala have confirmed what we suspected - Ydígoras was unprepared to fight and the Guatemalan economy couldn't maintain war footing long. Expect their build-ups to slow and then reverse in the weeks ahead."\n\nDel Rosal kept his eyes trained on the Secretary of National Defense, but it was hard to not shoot a glance at General Barragán. The former leftist had wormed his way into this meeting with the southern zone commanders. Another sign the man would be influential in the coming administration.\n\n"But we reached this point only because of our strict vigilance along the Guatemalan border. You held your men firm, denying the Guatemalans both opportunity and provocation to act," Olachea continued. "Throughout this next period, as the politicians and the press celebrate our victory, then grow distracted with the next completed dam or yanqui fad, the vigilance must remain."\n\n"Because Guatemala will remain militarized and hateful, an enemy of the Mexican Revolution so long as Ydígoras lives. Because Guatemala will remain," Olachea's filmy eyes met first del Rosal's then Barragán's."
 GUA_forpol.14.a: "The vigilance must remain."

 GUA_forpol.15.t: "MEMORANDUM ON US-GUATEMALA RELATIONS"
 GUA_forpol.15.desc: "MEMORANDUM FOR: TS, MIAMI Office\n\nSUBJECTS:\n1. Ydígoras' Position on Mexican Relations\n2. Current American Presence in Guatemala\n3. Prospects for Further American Penetration\n\nThe Guatemalan coup has seen a period of increased tensions between Guatemala and its neighbors. The new administration under General Miguel Ydígoras Fuentes has seen a campaign of anti-leftist action in the nation. Despite initial expectations however, the new government has reached out to Mexico City and hostile relations have improved. There is little indication this will cease in the foreseeable future.\n\nYdígoras' policies have improved market access for US firms like the United Fruit Company, but have had little impact on US political ties. See Report 4439-1.\n\nWe are well placed to exploit the improved relations in the region within Guatemala. Using current assets we can move to open deeper, more visible ties within both the military and administration which could not have been pursued prior. Connections within the military would serve to deepen our intelligence penetration into Guatemalan capabilities, as well as political influence given the military's influence in the regime. It is probable that the US ability to influence policy will increase if appropriate efforts are taken.\n\nSigned: BF, Guatemala City Office"
 GUA_forpol.15.a: "Fidelity, Bravery, Integrity."

 GUA_forpol.16.t: "Unpleasant Neighbor"
 GUA_forpol.16.desc: "DIRECCIÓN FEDERAL DE SEGURIDAD\nISSUE: Ongoing Threat from Ydígoras' Guatemala\n\nGeneral Ydígoras' Government has maintained hostile relations with the United Mexican States since seizing power in 1962. While border incidents have declined this year, Guatemala's armed forces remain in forward positions and have violated Mexican airspace twice in the last three months.\n\nThe recent Secretariat of External Relations report on Guatemala does not foresee any substantial opportunities for improved relations. Ydígoras falsely maintains that our Revolution is Socialistic, and that we and the other members of the Veracruz Pact are seeking to export our ideology to Guatemala and across Central America. An atmosphere of paranoia has led to increased repression nationwide.\n\nWorryingly, the regime appears to be rectifying the economic and military constraints that caused it to back down in last year's war scare. Labor and commercial protections instituted by the previous left-leaning PAR Government have been revoked, resulting in a wave of investment by U.S. firms. Guatemalan army, air force, and naval officers are receiving specialized training in the United States, and U.S. military facilities are being opened in multiple locations.\n\nGiven this evolving situation, a revised posture toward Guatemala is recommended. Options include: a rapid, temporary build-up of forces on the border to damage perceptions of Guatemalan security, resulting in rapid disinvestment by North American businesses; construction of additional border fortifications and improvements to regional logistics to prepare for, but not provoke, potential conflict; and investments in Guatemalan intelligence networks to disrupt Ydígoras' political and military efforts. The decision is Your Excellency's."
 GUA_forpol.16.a: "Make a show of force."
 GUA_forpol.16.b: "Prepare our defenses."
 GUA_forpol.16.c: "Keep a low, subversive profile."

 GUA_forpol.17.t: "MR-13 & the Dirty War"
 GUA_forpol.17.desc: "To the Secretary of Interior,\n\nThe Chamber was pleased to hear your report about your Secretariat's efforts against Communist guerilla groups in our countryside. Given the threat of the GPG, your focus on northern Mexico, particularly Chihuahua, made sense.\n\nHowever, several deputies from Chiapas and Campeche wished to hear more about your work in fighting the MR-13 Communists. I understand that your Secretariat might have temporarily tolerated, or even supported, such a group given its opposition to General Ydígoras' Government in Guatemala. If true, such actions would have been a grave error.\n\nThe MR-13 Communist organization may have been formed in Guatemala, but like all of its internationalist ilk has no respect for borders. Any success that it would deliver against Ydígoras would quickly endanger the workers and peasants of our southern states.\n\nBut I don't need to go into what-ifs, MR-13 is already threatening Mexican lives today. MR-13 is providing guns, funds, supplies, and recruits to so-called Zapatista guerillas in the Yucatán peninsula, Tabasco, and Chiapas. Local police have found the group's propaganda in Guatemalan refugee camps - their calls for Socialist revolution are worryingly vague on their first target. A well-respected farmer with property near the border was injured and forced from his land, so that MR-13 can use it as a base for their Mexican operations.\n\nI would like to inform the deputies that this matter is resolved. Please let me know of your response.\n\nAlfonso Martínez Domínguez, Head of the Chamber of Deputies"
 GUA_forpol.17.a: "Expulse some Guatemalan refugees, get him off our case."
 GUA_forpol.17.b: "A thorough investigation will uncover if MR-13 is supporting our domestic enemies."
 GUA_forpol.17.c: "Perhaps we can use our MR-13 links to track down home-grown guerillas."

 GUA_forpol.18.t: "Military Connections"
 GUA_forpol.18.desc: ""I've talked to the six Guatemalan Naval officers, they've said that their semester abroad at Annapolis was excellent." The Defense Attache to Guatemala reported. "We've had eighteen Guatemalans get their jump wings at Bragg, and six go through Ranger school." The American Ambassador nodded, turning through the documents he was handed.\n\n"What do you advise that we use the remainder of the budget on?" The ambassador asked, tapping the highlighted number on the finances page of the report.\n\n"I can see it going three ways, sir." The Attache replied. "First, we could buy up some land outside Puerto de Champerico. Build up a Joint Naval Base. That way, we can put up a lot more pressure on the Japanese in the South Pacific, and hopefully deter them from reaching into Central America.\n\n"The second option is to bolster our Air Force presence in Guatemala City. Right now, the hangars aren't big enough for some of our bigger aircraft, and we have space to build a few additional runways."\n\n"Of course, we could always keep this remainder as a rainy day fund. With the way R&D's moving, it's only a matter of time before we need to modernize the Guatemalan military again...""
 GUA_forpol.18.a: "Let's build that Joint Naval Base."
 GUA_forpol.18.b: "Our Air Force could use the money."
 GUA_forpol.18.c: "Let's hold off on spending for now."

 GUA_forpol.19.t: "Cuban Proposal"
 GUA_forpol.19.desc: ""And just how many do you have landing?" The military attache asked El Jefe.\n\nFidel Castro was as self-assured as ever, even over the telephone. "Around 4,000, Caribbean Legionnaires, armed and very, very dangerous."\n\n"Armor?" The Mexican ambassador had nothing but reservations on the matter.\n\n"Too noisy, but plenty of anti-armor to go around." Castro's chair audibly creaked, likely leaning back.\n\n"Rocketry?" The attache probed.\n\nCastro was non-plussed. "RPGs, Mines, incendiary grenades. Failing that, TNT where it works."\n\n"And where would that be?" The ambassador's dread deepened by the minute.\n\nA brief pause. "Where dynamite tends to go off; It's a matter of when, not so much where."\n\n"Your confidence is reassuring." The ambassador rubbed his temples, wincing.\n\n"You can give us some credit, we mean to build something beautiful." Castro spoke with a hint of defensiveness.\n\n"A southern strike then?" The attache asked for clarity. "An operation in the Yucatán, along the border?"\n\nThe ambassador spied the map of North America on a distant wall, eying Washington D.C, paranoid that US intelligence had to be listening to the conversation. "And the Yanquis?""
 GUA_forpol.19.a: ""Let them eat popcorn!" Castro beamed haughtily. "Guatemalans will not know what hit them!""

 GUA_forpol.20.t: "Economic Leverage"
 GUA_forpol.20.desc: "Sunlight flooded into the dining hall where the economic future of entire countries was decided. John M. Fox, CEO of the United Fruit Company, was holding court in his Florida mansion, bending national economies to his will. He leaned back in his chair, wiping his mouth with a handkerchief and offering his counterpart a cigar.\n\n"I must congratulate you, Ambassador. Your principled stand has been crucial in preventing the Communists from undermining American interests in Guatemala as well as the entire region. I apologize for inviting you here during your well-deserved vacation, but I trust that the food, at least, was to your liking".\n\nJohn O. Bell, Ambassador of the United States to Guatemala, graciously took the offered cigar. "It is no trouble at all, Mr. Fox. I was merely doing my duty, and the food was, indeed, well worth the trip. But I assume that you have not invited me here just to offer your congratulations."\n\nFox took a puff. "That is correct, Ambassador. As you are aware, we have already begun to rebuild our business in Guatemala. Their Government has opened new opportunities for us with the repeal of the Communists' labor regulations. However, we must still work with local authorities throughout the production and export process, which can be... inefficient. We could use the help of other American companies in streamlining production and entrenching our presence in Guatemala, which would also be in the national interest. It would be wonderful if you could put in a word with the Chamber of Commerce and let them know that Guatemala is a great place to set up shop right now. What do you say?"\n\nBell leaned back. American presence in Guatemala was indeed in the national interest, but the idea of corporations exporting their labor violations abroad was bound to run into legal trouble. Perhaps it was best to cut them off before they became a liability?"
 GUA_forpol.20.a: ""I'll talk to them. We need more American companies to expand operations in Guatemala.""
 GUA_forpol.20.b: ""I'll see what I can do, but I'm afraid I can't commit to concrete policy at this juncture.""
 GUA_forpol.20.c: "Bell made a mental note to himself to contact the DOJ and make sure this was properly sorted out."

 GUA_forpol.21.t: "Economic Opportunities"
 GUA_forpol.21.desc: "While many expected Guatemala's Military Junta to pursue a more isolationist position, under the leadership of General Miguel Ydígoras Fuentes, recent legislative actions seem to hint in the opposite direction. With the regime incentivizing mass privatization to reverse the Socialist policies implemented by the PAR, many state-owned industries are being sold off to the highest bidders, and for foreign corporations, the Central American state has become ripe for investment.\n\n\nIntelligence officials in Tokyo have indicated that the United States has yet to take action in establishing communication with the ruling Junta. In addition, some economists have also posited that the immediate acquisition of certain Guatemalan industries, particularly of agricultural products, can permit Japan to establish a stronghold on the region through a command on significant consumer exports.\n\n\nAlthough this chance to extend the influence of the CPS to an uncharted economic zone has proven lucrative to speculators, conservative elements within the Diet remain sceptical of expending Japan's limited capital on an unproven concept. As the prospective initiative finds no strong opposition, it is up to the administration to decide whether this opportunity is worth taking."
 GUA_forpol.21.a: "The Art of War is to subvert your enemy."
 GUA_forpol.21.b: "An unnecessary risk tied to an unnecessary investment."

 GUA_forpol.22.t: "Guatemala City Embassy"
 GUA_forpol.22.desc: "Though the corner office of the Japanese Embassy had air conditioning, courtesy of the Hitachi Corporation, Mr. Sakaguchi still wafted the little paper fan into his face - a native of wintry Sapporo, he struggled with Guatemala's heat. His wife sat properly next to him, concealing her annoyance, while the Embassy clerk behind the desk checked some papers.\n\n"I didn't have the Spanish to tell those hooligans to just take our money and leave us our travel papers, you see," Sakaguchi explained amiably. He was amazed how even being held up had failed to ruin his good feelings about his vacation, in fact he rather enjoyed the novelty of it. His wife, always the voice of reason, had gotten them a taxi to the Embassy right away, and they were eventually able to flag down one of the abundant staff members who seemed perpetually busy.\n\nSakaguchi felt like the only Japanese here not on business, as men with briefcases shook hands and mingled on the Embassy floor. Presumably it was these men keeping the Embassy staff so busy. Sakaguchi had nothing to sell anyway - he was just a dentist who had a good year. He watched as an important-looking fellow made his way down the stairs, staff parting as he passed, flanked by a group of beautiful men and women in fine kimonos, and made a small hum of interest.\n\n"The ambassador, and a theatre troupe from home," explained the clerk, "they're performing kabuki in one of the big concert halls tonight. Ydígoras is the guest of honor."\n\n"Who?" asked Sakaguchi, still waving his little fan.\n\nThe clerk just looked at him dimly, like his wife had done the other night when he did the salsa with that stunning local girl at the bar."
 GUA_forpol.22.a: "A good-fortuned fellow can't have fun on vacation?"

 GUA_forpol.23.t: "The Incoming Deluge"
 GUA_forpol.23.desc: "DIRECCIÓN FEDERAL DE SEGURIDAD\n\nISSUE: The Guatemalan Crisis\n\nREPORT:\n\nOver the past weeks, the Guatemalan Government, led by Miguel Ydígoras Fuentes, has escalated its accusations against the Pacto de Veracruz and Mexico in particular. Following the unsuccessful landing of the Caribbean Legion and the failed uprising of MR-13, Guatemala accuses Mexico and Cuba of involvement in plots to topple its Government.\n\nGuatemalan military intelligence believes that the Directorate has infiltrated their ranks. This assumption has triggered purges within their institutions. Intercepted communications indicate growing paranoia within their high command, with specific orders to eliminate suspected infiltrators.\n\nReports from different sources confirm increasing troop mobilization near border crossings. Evidence suggests the Guatemalan General Staff is discussing preemptive attacks at the Mexican border outposts.\n\nIn response SEDENA has begun defensive preparations. Positions near the Suchiate River are being reinforced, and additional troops have been deployed.\n\nWar appears imminent and unavoidable. We believe it will be a simple and swift operation.\n\nRespectfully, Fernando Gutiérrez Barrios"
 GUA_forpol.23.a: ""Forward immediately to the President.""

 GUA_forpol.24.t: "Hostile Waters"
 GUA_forpol.24.desc: ""José, did you check the fishnets?" Javier asked, his voice barely audible over the deep rumble of La Esperanza's diesel engine. The sturdy trawler rocked gently on the Pacific waves as the setting sun bathed the Chiapan coast in warm hues. Around them, other fishing boats dotted the horizon.\n\nBut the crackle of static interrupted José. One of the boats' radios blared a warning: "Vessels approaching! Guatemalans!" The transmission cut off abruptly, replaced by static. Javier's stomach tightened. His eyes scanned the horizon until he saw them - three Guatemalan patrol boats barreling toward the flotilla. Javier barked at José to get the signal ready, sending him scrambling below deck. The men aboard La Esperanza braced as the patrol boats closed in, their imposing hulls glinting in the dying sunlight.\n\nThrough a loudspeaker, a harsh voice demanded, "Stop your engines, Communist scum!" Javier raised his hands, motioning to comply. But before anyone could act, gunfire erupted.\n\nBullets tore into the hull and deck, splintering wood and ricocheting off metal. José clutching a hand-held radio, shouting into it, "We're under attack by the Guatemalan navy! They're firing on us-" An explosion silenced him as a nearby boat erupted into flames. Above, the scream of engines announced the arrival of Guatemalan bombers. Fire and smoke filled the sky as bombs obliterated the fleeing vessels.When the assault ended, the sea was eerily calm, littered with debris and the smoldering remains of the fishing fleet.\n\nPresident [GetLeader] addressed the country that evening, his voice trembling with rage, "Today, innocent Mexicans lost their lives in an unprovoked and cowardly act of aggression," he declared. "Guatemala has chosen war, and we shall meet them on the battlefield. Justice will be swift,""
 GUA_forpol.24.a: ""And the blood of our people will be avenged.""

 GUA_forpol.25.t: "Crossing the Line"
 GUA_forpol.25.desc: ""How long do we have to stay in this fucking, god-forsaken jungle?" grumbled Private Ramón Ortega, swatting at the relentless mosquitoes. Mexican soldiers of the 7th Infantry Battalion huddled in their jungle outpost near the Suchiate River. The constant drone of insects and the distant rush of water were the only sounds until the sudden, sharp noise of gunfire shattered the night.\n\n"Contact! Contact!" Ramón shouted before the bullets splattered his brains across the muddy ground. Guatemalan forces surged from the underbrush, their camouflage blending seamlessly with the dark jungle. Sergeant Alejandro Cruz barked orders, his voice was steady even as chaos erupted around him. "Hold the line!" The Mexicans, seasoned by years of preparation, responded swiftly. Sandbags and machine gun emplacements provided some cover as they returned fire, their worn rifles fired at the inexorably advancing Guatemalans.\n\nBy dawn, the Suchiate's once-clear waters were stained with the mingled blood of soldiers from both sides.\n\nThe response was swift and decisive. By mid-afternoon, the Ciudad Tecún Umán, El Carmen, Toquían Grande, Sibinal and other towns lay in ruins, reduced to smoldering rubble under relentless Mexican airstrikes. Entire communities were obliterated in an effort to cripple Guatemala's logistics, leaving no ammunition depot, or supply hub. Streets once full of life were now filled with rubble and the bodies of civilians.\n\nMeanwhile, at the General Staff in Ciudad de México General José Agustín Olachea Avilés stood at the head of the table. General Marcelino García Barragán sat beside him. Reports lay scattered across the table, each one more grim than the last. "They wanted this fight," Olachea growled, slamming a fist down. "And we'll give it to them. No retreat. No mercy.""
 GUA_forpol.25.a: "Barragán nodded. There was no room for peace now."

 GUA_forpol.26.t: "For Whom the Bell Tolls"
 GUA_forpol.26.desc: "Ambassador John O. Bell was usually asleep at this hour, but tonight, he was sitting in his office in Guatemala City and feverishly attempting to coordinate the American response to the crisis between Guatemala and Mexico. Not that he could sleep if he tried, with the crowd protesting outside the Embassy, burning American flags, and calling for his head. He was glad the windows were made of reinforced glass, but he sat deeper inside the office than usual, just in case.\n\nYdígoras was completely out of control. His latest actions have proved beyond all doubt that he was a loose cannon, absolutely unfit for the promotion of American interests in the region. Of course, Bell had known this was the case for months now, but the bigwigs at the State Department just wouldn't listen. This whole mess could have been avoided if only they had helped put in power someone more responsible, less of a saber-rattling tinpot dictator. Someone who could actually govern a country without turning the entire public against America, and who wouldn't attempt to save his own reputation by caving to that public sentiment.\n\nA thud startled Bell from his frustrated thoughts. A spiderweb of cracks spread through his office window where a brick was lobbed at it. The guards at the front of the Embassy shouted something before the sound of gunfire - hopefully just warning shots - pierced the riotous noise and silenced it for a moment. He stepped gingerly towards his desk, hoping to avoid further projectiles, and picked up his phone. He was too deep inside the mess that the State Department had brought upon itself with its arrogance and ignorance. They needed to be made aware of their failure..."
 GUA_forpol.26.a: "...and hopefully get him to safety."

 GUA_forpol.27.t: "Leftist Insurgency"
 GUA_forpol.27.desc: ""Well it was hot, terribly so," Yon Sosa said to the radio as he tried to cool off in the shack his brigade called a camp. It didn't work. "The little building you told us to raid, or rob, or whatever... It should've been easy, there were only five or so people there, maybe a gun or two. Nothing a brigade of leftist liberators who constantly fight each other, calling the others fascist, or foreign bootickers, or some other name, couldn't handle."\n\n"The second Gabriel stepped in he was shot in the chest, and then Marcos got shot in the stomach. Ortega shot the clerk with the gun, and then chased after another Government guy. She turned a corner and got hit in the head with a hammer, and then Gabriel, the other one that didn't get shot first, he went around back. I was stuck shooting someone hiding behind the corner, apparently they had a second gun, or they just grabbed the first one off the floor. Most of the guys there got killed by Gabriel. We took some documents from there, they might be important."\n\nThe voice on the radio cut in, "they probably aren't, the point is that the office was burnt down. You did burn it down right?" Sosa continued, "Yeah we did, but two people are dead and Marcos is bleeding out in this shack."\n\nThe radio remained silent, Yon Sosa sat in anticipation for the operator to respond. Marcos' ragged breath and the buzzing of insect were the only sound in the shack now.\n\n"
 GUA_forpol.27.a: ""Just... come back to base, we'll see if we can help out Marcos.""
 GUA_forpol.27.b: ""In a day a truck'll get to you, it'll have supplies, straight from Mexico.""

 GUA_forpol.28.t: "Palabrería Barata"
 GUA_forpol.28.desc: "Much to the shock of her allies and the consternation of her neighbors alike, Mexico has officially announced the pacification of all Guatemalan forces and the successful occupation of Guatemala City, following a brief revolution that seized control of the Guatemalan government. Torn between revolutionary actors and foreign soldiers, there was little the regime could do as Mexican forces from Chiapas and Campeche poured into the Central American nation and snuffed out the revolt before it could take flame.\n\nReactions from Washington and Cuba have been notably muted, though many of Havana's denizens have decried Mexico's actions as nothing short of an "act of imperialism." Regardless of international reactions, the Guatemalan Revolution has been met with a violent end, replaced with another revolution of Mexican make and form."
 GUA_forpol.28.a: "One ends, another begins."

 GUA_forpol.29.t: "The Breaking Point"
 GUA_forpol.29.desc: ""The country will not falter, nor will it forgive! I can assure our brave defenders of Mexican sovereignty that their Government won't tolerate fascist aggression and there will be no acts of diplomatic cowardness! And I promise you, my fellow citizens, I will not rest until this threat is crushed, until our people are avenged, and until peace is restored! ¡Viva la Revolución! ¡Viva México!" Ordaz's words echoed across the plaza, meeting with thunderous applause from the gathered crowd. The national address concluded, but within the Palacio Nacional, His Excellency's fury still simmered.\n\nInside the chamber, the air was heavy with tension. Luis Echeverría, the Secretary of the Interior, spoke first. "We must move swiftly, Your Excellency. Guatemala's audacity cannot be allowed to stand."\n\nGeneral Marcelino García Barragán nodded in agreement. "The army will strike decisively. We'll secure the border and push toward Guatemala City." Ordaz sat down on a chair, his exhaustion momentarily masked by his anger. "Good. General Barragán, your orders are to ensure we bring them to their knees. No half-measures. We will replace the Ydígoras junta with a Government that respects order."\n\n"Understood, Your Excellency," Barragán replied. "We aim to neutralize their capacity for prolonged resistance - quickly and brutally."\n\nEcheverría leaned in. "And the Americans, Your Excellency? We've heard nothing but silence from Washington."\n\nOrdaz's face darkened, his jaw tightening. "They let this happen. Whether by incompetence or design, I'll know soon enough."\n\nOutside the room, Antonio Carillo Flores prepared statements to unite the Pacto de Veracruz against a common threat and denounce Guatemala at the OAS. The die was cast:"
 GUA_forpol.29.a: "War was not just inevitable-it was already here."

 GUA_forpol.30.t: "The War Room"
 GUA_forpol.30.desc: ""Quite the speech, Your Excellency," said Alemán, "Televisa will be rebroadcasting every hour-"\n\n"Good," replied Salinas brusquely, "Now you and Campos Salas get this letter," he brandished one in his own curling script, "to our Japanese and American investors. I will not have fear of Washington's little fascist destroy our project."\n\nAlemán nodded, motioning for Campos Salas to join him in one of the Palacio Nacional's adjoining rooms. Next to emerge from the mayhem of clattering typewriters and aides was Reyes Heroles. The party president kept his report brief, "The party and the public are fully behind you. General Secretary Velázquez has offered the full backing of Mexican labor. In ten minutes, I'm meeting with Senator Madrazo to discuss how his group can support the war effort."\n\nAnd with that he departed, replaced by Gutiérrez Barrios and del Rosal. General del Rosal spoke, his counterpart standing in silent agreement, "In short, we will blockade the ports, sever their southern logistics, then launch a surgical strike on Guatemala City to depose the Government. Given the geography involved, the subsequent national occupation will be challenging, but decisive force now will minimize casualties and costs."\n\n"Proceed," said Salinas, lifting the receiver from a black telephone, "I'll expect a full update this afternoon." Gutiérrez Barrios lingered for a moment, placing a report before the president. Salinas only managed to read the headline, 'Preliminary: No Evidence of U.S. Backing for Ydígoras Attack', but his lips were already curling as Margáin came on the line.\n\n"Expecting near unanimity at the Organization of American States when I deliver the condemnation at 12. More surprising is the depth of the response from the Co-Prosperity Sphere, Japan and Man-""
 GUA_forpol.30.a: ""War reveals our friends," remarked Salinas, eyes on the report, "as well as our enemies.""

 GUA_forpol.31.t: "Crossing the Usumacinta"
 GUA_forpol.31.desc: "A staffer held open the doors for Carlos Madrazo as he stormed into the Conference Room, flanked by Echeverría and his dim shades. Gutiérrez Barrios and Cárdenas, having already got their respective summons, were already sitting at the big table. They each stood to greet His Excellency. He did not acknowledge them as he marched into a seat. "Gentlemen," Madrazo said after an elongated, piercing pause, "we are at war." Nobody spoke, mere nods. The President had only just arrived back at Los Pinos, having been sped off in a limo after giving a fiery speech at the Zócalo that was televised nationwide right as the news of the invasion broke. Sitting at the table's head, hands clasped tight in indignation, he continued.\n\n"The foreign powers have always tried to undermine us, but this? They have crossed the threshold!" Madrazo knocked his knuckles on the oak. Echeverría nodded, briefly looked over Barrios and Cárdenas and chimed in with his own "hear, hear!" Of course, he knew that the President was wrong, and was simply letting all of that anti-imperialist rhetoric get to his head. Ydígoras was just a rogue actor—but it suited him to butter up Madrazo's paranoia. The Cyclone rose, rubbed his temples for a moment, and excused himself for an urgent telephone call with Secretary García Robles. The OAS and Veracruz Pact were to be rallied.\n\nCárdenas, Gutiérrez Barrios, and Echeverría were left to discuss the particulars of the ground war, the latter adjusting his shaded glasses as the old revolutionary spoke. "Our armed forces have been extensively modernised in recent years, so there shouldn't be any difficulty in engaging the Guatemalan forces in conventional battle. The problem will be in enforcing a peaceable occupation once they've surrendered. We should be up for the task, however."\n\nEcheverría nodded along, but he knew this was to be no walk in the park."
 GUA_forpol.31.a: "There will be blood."
 
 GUA_forpol.32.t: "Our Man in Havana"
 GUA_forpol.32.desc: "Director Gutiérrez Barrios waited for the operator to patch him through, idly clutching a cigarette between a few fingers. "Hello?"\n\n"Fernando. I can't say that any of this is a surprise. You told me months ago that a war was going to happen, sooner rather than later." There was a pause at the other end of the line. "You also know very well that this is more than politics. It is personal. Good men died when they defeated the Legion, and I don't intend on making their sacrifices for naught."\nGutiérrez Barrios nodded to himself. "We can count on your support, of course?"\n\nAnother pause. "You don't even need to ask, my friend. I have mobilised the navy to implement a complete blockade of the Atlantic Coast, we have men coming to Chiapas and we have even more men coming via sea to the Honduran border. They are finished."\n\n"And the Legion will be of assistance?"\n\nCastro drew out a long, wry laugh."
 GUA_forpol.32.a: ""They'll be there to finish the job.""

 GUA_forpol.33.t: "Together Against Reaction"
 GUA_forpol.33.desc: "Per the terms of the Veracruz Pact, El Salvador has been called into the war against Guatemala. Despite their recent bout of instability, it seems the ruling junta seeks to reaffirm its commitment to regional security and to the Pact itself. The Salvadoran army, navy, and airforce that has been mobilized on the borders of Guatemala has begun its 'surprise' attacks against the dictatorship, forcing it into a two-front war.\n\nWith ships already in position, a total blockade has been placed on Guatemala's west coast, with aerial bombardment of Guatemala City being fervent. Salvadorian jets can be seen dog-fighting with their adversaries across the front, drawing more resources from the military state's ability to fight Mexico."
 GUA_forpol.33.a: "A new ally against madness."

 GUA_forpol.34.t: "To Know No Rest"
 GUA_forpol.34.desc: "In spite of any exhaustion that occurred to the Dominican Republic after the recent overthrow of the Trujillo regime, the nation has accepted the call to war against El Salvador. While there was little choice in the matter, it being a stipulation of the Veracruz Pact, their addition to the war effort will be incalculable. While the nation cannot provide much in aid, its airforce and navy is already moving to reinforce Cuban efforts in the Caribbean.\n\nAlong with this, Legion detachments inside the Dominican Republic are beginning to re-mobilize to face another fascistic threat. Their preparations are all for another landing..."
 GUA_forpol.34.a: "Another coast to liberate."

 GUA_forpol.35.t: "From Both Americas..."
 GUA_forpol.35.desc: "Despite previous doubts, especially with the distance involved, Caracas has decided to answer the call and honor the Veracruz Pact. While they won't be taking a major military role in the operation against Guatemala, their diplomatic weight at the OAS is invaluable. Along with this, Venezuela has pledged to send substantial economic and reconstruction aid to occupied Guatemala after the war ends."
 GUA_forpol.35.a: "...Sounds the cry of anti-fascism."

 GUA_forpol.36.t: "¡Juntos Luchamos Por Victoria!"
 GUA_forpol.36.desc: "With each arms factory churning more ammunition, as every man enlists, as all those against reaction march with vigor, it becomes clearer the scene occurring in Central America; all the Veracruz Pact is united against the dictatorship of Guatemala. The regime is besieged on all sides, its future bleak as the revolutionary coalition turns its sights toward the state.\n\nWhile the war is yet to conclude, this diplomatic unity and military vigor represents the approaching victory of anti-fascism across all of Latin America.\n\nNevertheless, the show of force is concerning for the thus-far subdued United States of America, with the newly ascendant power of Mexico spreading out the wings of its own eagle. Other reactionary regimes, Nicarauga in particular, express only fear at the new state of affairs."
 GUA_forpol.36.a: "Reaction will have no place in the New World."

 GUA_forpol.38.t: "Report on Situation in Guatemala"
 GUA_forpol.38.desc: "RESTRICTED/CONFIDENTIAL/SECRET/TOP SECRET/[?global.date.GetDateStringNoHourLong]\n\nFROM: FBI DIRECTOR J. EDGAR HOOVER\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: 'RED' GUATEMALA; RETURN OF US EMBASSY STAFF\n\n1. With fighting between Government and rebel forces in Guatemala City resolved, evacuated staff have returned to the US Embassy and resumed work, with feelers sent out to establish relations between the United States and the new left-wing regime. Embassy staff on-site report that the building and grounds appear mostly untouched despite proximity to government centers in the city; it is likely rebels were directed to avoid damaging US property.\n\n2. The victory of the rebels over the Ydígoras Government was undeniably due to outside support from the Republic of Cuba, via the Caribbean Legion (still containing US-trained veterans of operations against the Trujillo regime in Hispaniola) and the United Mexican States. The Cuban and Mexican governments evidently conspired together over months and jointly organized the operation to overthrow a US-aligned government.\n\n3. Rebel leaders such as Marco Antonio Yon Sosa of the prominent guerrilla group MR-13 have indicated the new regime will be socialistic in character, emphasising national sovereignty, support for trade unions, and nationalization of industry, looking to the Cuban Revolution for inspiration. Due to the large influence of US business in the country, they will likely be the main target of the new government. The United Fruit Company has reported land seizures are already underway in some areas. With this being said, the revolutionaries are not hostile to US diplomacy."
 GUA_forpol.38.a: "A sly trick, but not really worth making a stink over."
 GUA_MEX_Alignment: "§F§&Guatemala§!'s §sNationalist Junta§! has been ousted. The new §VSocialist§! Regime will move away from the §QOFN§! and align closer to the §KVeracruz§! §VPact§!.§!"

 GUA_forpol.41.t: "Report: FBI Operations in Mexican-Occupied Guatemala"
 GUA_forpol.41.desc: "-SECRET-\n\nFollowing the Guatemalan invasion of Mexico and Mexico's following declaration of war, former Guatemalan president Miguel Ydígoras Fuentes moved to distance his administration from the United States and pro-US personalities, on the pretext of US support for Mexico. While some FBI networks managed to survive this purge, many valuable assets were sidelined, compromised, expelled or imprisoned.\n\nWith the following collapse of Ydígoras' administration, FBI work in Guatemala has been further disrupted. The chaotic conditions on the ground and the disintegrating administration have resulted in various assets losing their usefulness or being lost in the widespread violence and societal upheaval.\n\nHowever, with the Guatemalan army's capitulation and the establishment of the Mexican reconstruction administration under General Hermenegildo Cuenca Díaz, FBI has been intensively rebuilding local intelligence assets and expanding networks, so far to great success. The Mexican administration has mostly been kept busy with maintaining the peace and rebuilding local institutions, allowing ample space for intelligence work to proceed unimpeded. While expansion of networks to prewar levels will take some time, it is not expected to face significant challenges.\n\nEarly reports from extant sources indicate that the reconstruction authorities will attempt to entrench Guatemala within Mexico's sphere of influence and integrate it into the so-called "Pact of Veracruz" and the corresponding economic bloc, with Cuban cooperation. Further plans may include the establishment of a party-state apparatus similar to that of the Mexican Institutional Revolutionary Party and aligned economic development.\n\n-Truncated for Brevity-"
 GUA_forpol.41.a: "Spreading the revolution, huh?"

 GUA_forpol.42.t: "MEMORANDUM ON AMERICAN PRESENCE IN GUATEMALA"
 GUA_forpol.42.desc: "MEMORANDUM FOR: TS, MIAMI Office\nSUBJECTS:\n1. Mexican Political Reconstruction\n2. US Interests\n3. Future\n\n1.Guatemala now functions as an extension of Mexican power. Sovereignty is compromised at multiple levels of governance. While possessing genuine popular backing, acting mayor of Guatemala City and presumptive presidential candidate Manuel Colom Argueta cultivated extensive ties in Mexican academia and politics during his exile. Additional installed officials with significant ties to Mexico, ideologically or otherwise, are in Appendix 1.\n\n2.Mexico has done little to directly impact US interests in the nation. While US influence has been reduced, our business presence has - save for war disruption - seen little interference. Proxies meeting with new officials have confirmed there are no plans to push against US-owned portions of the economy. Officials maintaining their position have been guaranteed to support the continuance of US influence.\n\n3.US presence in Guatemala is much reduced but the Mexican government has demonstrated a policy of deference and caution regarding US assets. Political influence has reduced; measures to restore some political presence should be considered.\n\nSigned: BF, Guatemala City Office"
 GUA_forpol.42.a: "Fidelity, Bravery, Integrity"

 GUA_forpol.48.t: "Report on Guatemala"
 GUA_forpol.48.desc: "RESTRICTED/CONFIDENTIAL/SECRET/TOP SECRET/[?global.date.GetDateStringNoHourLong]\n\nFROM: FBI DIRECTOR J. EDGAR HOOVER\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: STATUS OF THE ARANA REGIME IN GUATEMALA\n\n1. The government of Carlos Arana Osorio has proven to be a reliable partner to American interests in the country since being installed, with the ruling Junta deepening ties to the US military, the United Fruit Company, other American business interests, and the FBI itself. President Arana's security forces maintain an intense suppression campaign on socialist and anti-American forces.\n\n2. The Arana regime has come under scrutiny from international press, and increasingly-less from domestic press, for its heavy-handed approach to quelling dissent; credible reports indicate the unlawful detainment, disappearance, torture, and/or extrajudicial killing of individuals including pro-democracy activists, PAR loyalists, trade unionists, and others suspected of anti-Government sentiment. The openness of such methods has the potential to reflect negatively on the United States as Arana's chief backer. The Arana Government can be influenced to scale down or conceal excessive repression for image concerns.\n\n3. The United Fruit Company and others have taken advantage of land privatization, confiscation and Arana's more pro-business attitude compared to the prior PAR regime to expand their operations in Guatemala, leading to record profits. American companies are noticing that Guatemala is a favorable market due to relaxed labor laws, export-based economy, etc. Further encouragement in this sector would benefit both nations economically.\n\n"
 GUA_forpol.48.a: "If you gotta do that stuff, do it quietly, for God's sake."
 GUA_forpol.48.b: "Enough bleeding hearts. Pick the bananas."

 GUA_forpol.49.t: "The Triumph of '44"
 GUA_forpol.49.desc: "It was a dull morning at the checkpoint. Máximo was put on radio duty, assigned to speak with the authorities on the other side of the Guatemalan border at regular intervals. They were due to check in right about then—but then a minute passed. And another. And another. He switched dials. Nothing. He then heard the hustle and bustle of shouting and commotion outside, so stormed out of his post. His colleagues were all huddled around in a crowd by the chain link fence, beyond which smoke plumed black on the horizon. Artillery fire thudded. Someone shouted. "They're all fighting each other! It's happening!"\n\nAnd then it was afternoon in Los Pinos, and it had been several hours since the news of the putsch in Guatemala City had broken. López Mateos was again sitting at his mahogany desk, again being briefed by Director Gutiérrez Barrios, General Barragan, and other close advisors.\n\n"Ydígoras has been apprehended, Árbenz assumed the presidency as planned. No foreign interference. Just another day at the office, licenciados." The President cracked a gentle chuckle, which they all naturally reciprocated. It was a fine day's work.\n\nBarrios broke his smile gradually. "Before you write those letters of support, Excellency, it may start becoming a problem if or when the new government starts moving to the left..."\n\nLópez Mateos felt his elation slip away into ambivalence. He shook his head and one hand. "Send me a report later with your recommendations. We'll adjourn for now." As they all shifted away out the double doors, he reached for his fountain pen and a crisp sheet of paper.\n\nDear His Excellency, Jacobo Árbenz..."
 GUA_forpol.49.a: "A triumph for the poor and underprivileged everywhere."

 GUA_forpol.51.t: "Testing the Boundaries"
 GUA_forpol.51.desc: "Ramón was sitting on the porch of a small cafe, keeping a keen eye on the waterfront. Ciudad Hidalgo was a small town, much less impressive than its role as the gate to North America would have suggested. Its streets and shops were usually quiet and sleepy, despite the passage of everything from immigrants seeking a better life to the weapons capable of cutting those lives down. Ramón's job for American intelligence was quiet too, but at least it paid the bills.\n\nUsually, at least. Today, the main street of Ciudad Hidalgo was full of commotion and rushing troops. It seemed as if the town's small garrison was mobilized in its entirety to the place where the street gave way to the Suchiate river, where a white gunboat was training its guns directly at Ramón. He did his best to maintain an impassive look, but it was growing increasingly difficult to sip his coffee in front of a cannon that was able to blow the ramshackle porch to smithereens. He bit his lip and continued sitting. He needed to see where this was going.\n\nFinally, an old Mexican armored car rumbled to the riverbank. An officer peeked out of the vehicle, brandishing a megaphone as if it could banish the unwelcome intruder. "GC-505, you have trespassed the international border and are now within Mexican territory without permission or cause. Retreat back to the Guatemalan side of the border before we are forced to open fire. This is your final warning."\n\nRamón swallowed hard as the boat stood in place for what felt like an eternity. They weren't going to start firing, were they? He almost made up his mind and ran away when the ship began sailing further away in the river, back towards its side of the border. Once it was in Guatemalan territory, the men on board brandished their rifles and fired into the air in defiance. Standing up as nonchalantly as he could, Ramón paid for his coffee and went home."
 GUA_forpol.51.a: "The Yanquis would want to hear about this."
 GUA_forpol_51_tt: "For the sake of our - and the §wUFC's§! - influence in §<Guatemala,§! we should aim to not exacerbate §Rtensions§! any further.\n§gYou best monitor this situation closely.§!"

 GUA_forpol.52.t: "Profile of the PAR Regime" #Limited rewrites for lore
 GUA_forpol.52.desc: "DIRECCIÓN FEDERAL DE SEGURIDAD\nISSUE: Profile of Jacobo Árbenz Administration\n\nPrior to the Árbenz administration, the reach of the Guatemalan revolution was effectively limited to urban areas. Presidents Arévalo and Méndez improved working conditions and expanded political liberties in line with their base of trade unionists and students, but avoided significant change in a countryside dominated by reactionary landowners and the dominant United Fruit Company.\n\nEmboldened by the latter's sponsorship of the failed coup against him, Colonel Árbenz has taken the opposite tact, making rural reform the defining feature of his presidency. Guatemala City has fast tracked land redistribution proposals and labor protections for the Ladino and Mayan peasantry, while plantation owners and United Fruit fight to prevent enforcement with hired thugs and right-wing paramilitaries like the Movimiento de Acción Nacionalista Organizado (MANO).\n\nIn this febrile atmosphere, the recent trespass of armed Guatemalan troops across the border may have been an attempt by Colonel Árbenz to shore up his support within the military, or an attempt by military opponents to discredit the president. Regardless, Árbenz has reached out to Cuba via backchannels for security assistance. Through our OCAE contacts, we are attempting to determine if this is a ploy to divide the Veracruz Pact, a genuine response to domestic instability, or to gain the upper hand in a potential conflict with Mexico.\n\nVery respectfully,\nThe Federal Director of Security\nColonel Rangel Escamilla"
 GUA_forpol.52.a: "I'm not risking Veracruz unity over Guatemalan antics. Just monitor the situation."
 GUA_forpol.52.b: "Havana has plenty of other radicals to aid. Tell Fidel to stay out of Guatemala." 
 GUA_forpol.52.c: "Let the Cubans in, and get them to tell us what the hell the guatemaltecos are doing."

 GUA_forpol.53.t: "MEMORANDUM ON GUATEMALA GOVERNANCE POST-ELECTION"
 GUA_forpol.53.desc: "MEMORANDUM FOR: TS, MIAMI Office\nSUBJECTS:\n1. 1962 Election\n2. Attitudes towards US\n2. American Presence Post-Election\n\n1. Election renewed the mandate of the PAR under Jacobo Árbenz, the Conservative PRDN failing to assault their dominance of Guatemalan politics. While paranoia persists all threats of organised subversion of the Government seem to have passed. The Árbenz Administration seems likely to continue the left wing policies of previous Governments.\n\n2. The PAR regime has followed a policy of careful relations in the previous decade and seems likely to continue this outlook. While not anti-US in outlook, reasonable distance should be maintained.\n\n3. Árbenz is not expected to attempt a targeted campaign against US influence within politics with the FBI's position currently assessed as stable. However, paranoia within the state does not preclude the possibility that the PAR may conduct a campaign against foreign interests in the wake of the attempted coup. There are greater concerns within the economy, the US presence being a known source of contention within the PAR conflicting with their more Socialist policies. With a combination of paranoia and reduced domestic resistance, action against US industry and capital is possible.\n\nSigned: BF, Guatemala City Office"
 GUA_forpol.53.a: "Fidelity, Bravery, Integrity"

 GUA_forpol.54.t: "Botched Assassination Attempt Against Guatemalan Rebels"
 GUA_forpol.54.desc: "[GetDateText]\n\nWhile it is no secret that the DFS sent out a few of their own detachments in Guatemala to counteract anti-government cells, today's operation had likely tipped off Árbenz's bottom line. Although his staff is still reluctant to act, the reported civilian death toll from the border bombing means we cannot rule out military responses later on.\n\nRebel activities, combined with a delayed update from the DFS, made ascertaining the extent of damages difficult. But the Guatemalans remain unwilling to accept our anti-terrorism narrative, and they are closely surveying our Guatemala City embassy even after clearing out the ruined vicinity near the incident. Communication delays caused persisting DFS operations during the evacuation, of which I am not privy to the full extent either. Nevertheless, Árbenz saw fit to issue an official condemnation on El Diario regarding our continued interference in Guatemalan territories for that reason.\n\nAs a note, I had observed an increase in uniformed patrols around the metropolitan area, meaning my prediction may not be unfounded. For the time being, however, I shall keep this journal updated. There is not much information coming from Zócalo, and this is the best I have to organize the mess."
 GUA_forpol.54.a: "God help us if it ever comes to tanks rolling."

 GUA_forpol.55.t: "For Your Excellency,"
 GUA_forpol.55.desc: "I write this letter personally and, as I'm sure you can understand, privately as a representative of many others.\n\nAs you know, the border has substantially cooled. While the occasional incident still occurs, evidence of organised incursions or subversions are greatly reduced. Us overseeing the region feel more secure. Such a situation has not occurred in years and it is a great relief to all manning the border.\n\nBut, the intelligence isn't unanimous. There no longer being a clear state of readiness in Guatemala does not mean the means for a quick reversal aren't present. Aerial photos show signs of military movements and obscured tracks that, while obviously used, are impossible to fully observe to determine use volume. Patrols continue near the border and sources in the Guatemalan Air Force say they remain on standby to deploy to the North.\n\nThis isn't to imply deployments will occur or the easing of tensions is false but we must remain mindful lest this becomes sinister very quickly; trusting peace too much may invite disaster. I, and many others, appeal against further detente for now to avoid embroilment in cooperation. With their prior hostility, blindly hoping for good faith may allow them to manipulate us into a position of weakness.\n\nMe and my men hope this isn't the case. We pray otherwise, but we appeal to you to consider for the sake of us manning the first line of defence; what if peace fails? Will we trade effective defence for false promises? Mexico will match such treachery righteously, however many of my men may not live to see that justice.\n\nYou do not share the faith of me and my men but still we pray that God guides you, Your Excellency.\nGeneral Jorge Álvez"
 GUA_forpol.55.a: "Summon the General for a reprimand, with his efforts to derail cooperation he should be thankful it's only that."
 GUA_forpol.55.b: "Summon the General for a private assurance, we intend to do just that."

 GUA_forpol.56.t: "Tensions Cool"
 GUA_forpol.56.desc: "MEMORANDUM FOR: TS, MIAMI Office\nSUBJECTS:\n1. Árbenz Position on Mexican Relations\n2. Current American Presence in Guatemala\n2. Prospects for Further American Penetration\n\nThe recent Guatemalan-Mexico border incident engendered increased tensions between Guatemala and its neighbors. The new left wing nationalist administration under Jacobo Árbenz has been pronounced in its criticism of Mexico's ruling PRI and its campaign of anti-left repression during the Dirty War. Despite this, however, the new Government has reached out to Mexico City and relations have significantly cooled. There is little indication this will cease in the foreseeable future.\nJosé's policies have (so far) done little to impact US presence politically or economically. See Report 4439-1.\nWe are well placed to exploit the improved relations in the region within Guatemala. Using current assets we can move to open deeper, more visible ties within both the military and administration which could not have been pursued prior. Connections within the military would serve to deepen our intelligence penetration into Guatemalan capabilities, as well as political influence given the military's influence in the regime. It is probable that the US ability to influence policy will increase if appropriate efforts are taken.\n\nSigned: BF, Guatemala City Office"
 GUA_forpol.56.a: "Fidelity, Bravery, Integrity"

 GUA_forpol.57.t: "Estranged Neighbor"
 GUA_forpol.57.desc: "Silence reigned over the office, a change from the hustle of the day. The corridors and offices that usually held bustling civil servants were instead held in stasis, half lit and subdued. The outside ambience barely penetrated the building's interior. Nothing stirred; a temporary death.\n\nA cough disturbed the tranquil dirge.\n\nJosé Salvador Gallástegui coughed ferociously, aware of the violent disturbance he was to the silence. He sat at his desk, the last holdout of the night that he could see. Perhaps there were other lonely souls like him working by lamplight elsewhere, perhaps they were hearing him echoing down the hallways - if any were they gave no sign. His cough stopped, and he reached for his coffee. He was working too hard.\n\nAround him were half a dozen discarded memos, his typewriter waiting ready with the next attempt. To his side was a complete readout of the recent statements of the PAR down south. Denouncements of Mexico, rejections of anti-communism, accusations of political oppression by the PRI. It made for aggressive reading. Scary reading. José's thoughts turned to the boys on the border, were they even now dealing with Guatemalan incursions? With guerillas? Would Guatemala help those trying to kill them? His thoughts turned to his family, the image of his children being told about soldiers bearing down on them. Fear touched his throat.\n\nHe sighed, placing his fingers again on the typewriter's keys. The Secretary would want a complete summary of the statements and potential responses by morning and he didn't want to delegate such a task to anyone else. As he wrote though, his fear only grew as he found few suggestions within him.\n\nGuatemala was breaking ties, and he wasn't sure how Mexico could fix them."
 GUA_forpol.57.a: "Or even if they should."
 
 GUA_forpol.58.t: "Military Connections"
 GUA_forpol.58.desc: "RESTRICTED/[GetDateText]\n\nFROM AUSTIN CORNELL\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: STATE OF AMERICAN INVOLVEMENT WITH GUATEMALAN ARMED FORCES\n\nGuatemalan cooperation with U.S. military institutions has considerably deepened in recent years. Guatemalan officers continue to undergo training at American institutions. Likewise, all branches of the American armed forces maintain facilities within the country.\n\nFINDINGS:\n\n- Army: Multiple Guatemalan officers are receiving instruction at Fort Benning and Fort Leavenworth for infantry doctrine and leadership training.\n\n- Air Force: Joint reconnaissance and communication programs have been established between both countries. American liaisons are stationed at La Aurora Airport.\n\n- Navy: Port facilities in Puerto Barrios have been expanded to accommodate American vessels. Some Guatemalan students have enrolled at the United States Naval Academy in Annapolis.\n\nGuatemala has effectively become dependent on American training and doctrine. This grants Washington considerable leverage in the region. We may develop these ties further through further construction of military bases and increased enrollment of Guatemalan officers in American war colleges."
 GUA_forpol.58.a: "Expand our presence. We'll keep Guatemala safe."
 GUA_forpol.58.b: "Let's not get too tangled up in Guatemala. Keep things the way they are."

 GUA_forpol.59.t: "Building Bridges"
 GUA_forpol.59.desc: "The dull hum of vehicles controlled the night, filling a silence with a strangely peaceful drone. Yellow street lamps gave Mexico City a golden glow, illuminating deserted roads where no one walked. Few did this time of night, life had moved elsewhere and wouldn't return for some hours. A secluded moment in existence that few in government enjoyed in office, one that Antonio Mena appreciated greatly.\n\nHe leant against the ornate edge, old architecture cool against his skin. Guatemala had him awake, as it often did. In a perverse sense it was almost refreshing - in recent years they all had someone else to worry about other than the Americans, though at least tonight's musings were not based in fears of war.\nHe held the telegram still that had triggered such pondering. An idea had come from the President's desk to find some developments in the border regions to indicate goodwill to the Guatemalans. As Secretary of Hacienda, finding the cash was ultimately his responsibility - a responsibility that gave him influence over what the endeavor would be.\n\nThe military had already called, subtly suggesting the construction of yet more border defences. Cheaper, a boost to the construction economy and helping Guatemala with the shared issue of their dissidents fleeing across the border - with no mention of the Guatemalan reaction to also having hundreds more rifles pointed at them. An old affiliate of Mateos had called too, happening to mention an infrastructure project with the Guatemalans he wanted to get off the ground: funding from both governments to build proper roads along the border. More expensive but with longer lasting boons to the local economies, not to mention the relations boost. He didn't mention that it might soon be Guatemalan tanks using those roads.\n\nEvidently, a feud was going on somewhere in the bureaucracy and Antonio felt he was being used to mediate it with these conveniently timed proposals. He sighed, mulling it over in the quiet dark. Who to listen to?"
 GUA_forpol.59.a: "The military are the best judges of what is needed for the border."
 GUA_forpol.59.b: "Bunkers don't breed strength, economies and relations do."

 GUA_forpol.60.t: "UFC's Ghost"
 GUA_forpol.60.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM JAMES CARVER\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: REMOVAL OF UFC INFLUENCE BY PAR Government\n\nPresident Jacobo Árbenz and the PAR government in Guatemala has begun to, expectedly, reduce the influence of the United Fruit Company on their country.\n\nThe UFC has had a stranglehold on fruit production and large influence on Guatemalan politics since the beginning of the 20th century, with Samuel Zemurray, president of the company from 1933 to 1951, staging a coup in the country in order to keep the business productive.\n\nWhile the PAR had previously concentrated on socialist-leftist policies for its union and student powerbase, Colonel Árbenz campaigned on an ambitious land reform program. Alleged UFC financial support for the 1962 coup attempt against him appears to have further radicalized his agenda. Substantial portions of UFC cultivated land have been seized. Rural labor conditions are increasingly stringently regulated and the firm's Guatemalan operations have faced punitive taxation. Attempts by the UFC to seek legal redress have been blocked by due process violations by the Árbenz administration.\n\nDomestic awareness of the UFC's influence in Guatemala is low, and among those aware, most support the PAR regime against the UFC.\n\n"
 GUA_forpol.60.a: "We shouldn't involve ourselves in this."
 GUA_forpol.60.b: "They think they can bully an American company?"
 GUA_Sanctions_tt: "§RThose bananas will rot in their warehouses. Deploy sanctions.§!"

 GUA_forpol.61.t: "Putting a Pin in It"
 GUA_forpol.61.desc: "The bunker room was small and shadowed, tightly fitting the table and board that had been placed before it. A variety of uniformed men sat and stared at the board in silent contemplation under a single weak neon light, tired from the long journey to this border base, furrowed brows and narrowed eyes almost glaring at the map hung upon it. It held no good news. It never did.\n\nThe map displayed the Guatemalan border, from sea to sea, with a variety of pins placed near the national edge. Two dozen almost, in the most rural areas where the terrain was rough and Mexico more easily accessible. Four more since the last meeting.\n\n"Licenciados, His Excellency must have impressed upon him," said one of the men, breaking from his ponder, "that this cannot continue. These are just the encampments we are finding, it is likely that there are more. We are letting Guatemala hang a Sword of Damocles over us."\n\nAnother man stood up, walking to the map and feeling some of the pins with his fingertips. He turned to the others. "If we take a stance on this, it will frustrate the border situation more. These dissidents are smart enough to avoid using Guatemala as any more than a sanctuary for now. If we escalate, both the PAR and these dissidents may feel more willing to operate from somewhere we cannot easily counter. Not to mention the possibility of more overt support or even -" he stopped, the worst case scenario hardly needing verbalisation.\n\nSome nodded before the door suddenly opened and an aide walked in. Sheepish, he barely looked at his superiors in the room besides a mumbled apology. "What are you doing here, Private?" asked the general beside the map.\n\nHe watched in silence as the Private pushed another pin into the map and mumbled that another likely encampment had been identified."
 GUA_forpol.61.a: ""Ah.""

 GUA_forpol.62.t: "Economic Opportunities"
 GUA_forpol.62.desc: "For the Attention of the Information Review Board\nRikasute Kikan\nAttachment: Overview of Japanese Expatriate Community in Guatemala\n\n1. The Japanese expatriate community is thriving in Guatemala. After overcoming initial language barriers and cultural misunderstandings, the Japanese community in Guatemala has grown to form an integral part of the professional class, frequently flourishing in managerial and highly technical fields.\na. The increased visibility of Japanese individuals with authority has increased acceptance and integration into Guatemalan society.\nb. Japanese managerial practices have become increasingly popular among Guatemalan light manufacturing firms, with multiple business magnates soliciting interest in learning best practices and incorporating them into their business operations.\nc. While Japanese expatriates are ineligible for employment in civil service, knowledgeable Japanese individuals have found success acting as project consultants for local officials and civic planners.\n\n2. It is our recommendation that the Guatemalan government can be brought into our sphere of influence by leveraging well-placed Japanese consultants to subtly guide the government via advice that ensures our continued presence.\na. Place individuals with specific regional expertise into the area where they can be introduced to Guatemalan civil officials. Introductions are best done through already-established Japanese expatriates of impeccable loyalty and moral fortitude.\nb. Agents should be instructed to act with caution, as proximity favors American intelligence interests, and the risk of exposure could significantly impair foreign relations."
 GUA_forpol.62.a: "Success in clandestine activities comes from sincerity."

 GUA_forpol.63.t: "A Sakura Amongst Orchids"
 GUA_forpol.63.desc: "For the Attention of the Information Review Board\nRikasute Kikan\nAttachment: Outline of Little Tokyo, Guatemala City\n\n1. As Japanese presence continues to expand within Guatemala, a small neighborhood has quickly expanded in size and scope to form a Japanese ethnic enclave within the Guatemalan capital named Little Tokyo. This area features predominantly Japanese residents who offer Japanese restaurants, service industries, and recently, a small Shinto shrine.\na. The neighborhood is a middle-class neighborhood, with most residents employed in technical fields. This has caused significant wealth concentration within the neighborhood and drives a significant amount of consumptive economic activity in the city.\nb. This wealth has led to a rise in cultural expression, with neighborhood festivals and celebrations on Japanese holidays.\nc. The relative prosperity of Japanese expatriates within Guatemala has led to Japanese culture being seen as aspirational to the native Guatemalans. Locals have expressed significant interest in participating in Japanese culture, learning the Japanese language, and increasing ties to Japan.\n\n2. It is our recommendation that Little Tokyo is a critical bastion and can be utilized to pursue the Empire's interests in Guatemala.\na. Agents can be placed as new emigres with minimal suspicion, along with living spaces and cover employment being readily available.\nb. The neighborhood acts as a font of soft power, allowing for the expansion of the Empire's cultural hegemony into the Americas.\nc. Businesses within Little Tokyo would be receptive to investment to continue to expand and gain economic influence within Guatemala."
 GUA_forpol.63.a: "Success in clandestine activities comes from sincerity."

 GUA_forpol.65.t: "Guatemala's Persistent Light"
 GUA_forpol.65.desc: "RESTRICTED\n\nFROM JONATHAN LAXOR\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: GUATEMALAN GENERAL ELECTIONS AFTERMATH\n\nDespite persistent whispers of a military-backed coup, the 1968 Guatemalan elections went on without a hitch. Oscar Adolfo Mijangos López of the Partido Acción Revolucionaria (PAR) secured a clear victory, with international observers praising the process as legitimate. Multiple OAS representatives have praised the country as a model for democratic maturation.\n\nHowever, loose ends remain untied. Right-wing officers in the Guatemalan military—many of whom were trained by American liaisons—have voiced skepticism over the country's direction. Whispers in the barracks report many officers, most notably Carlos Arana Osorio, vowing to drive back the "Communist terrorists" in their nation.\n\nMany civilians have reported cautious optimism for the electoral victory. Memories of the 1962 failed coup haunt them, and although many had hoped for a PAR victory, they have learned not to celebrate too loudly yet.\n\nThe Embassy recommends immediate support to the PAR regime. We will continue to monitor the situation, but peace in the Land of Eternal Spring is not without end."
 GUA_forpol.65.a: "Fidelity, Bravery, Integrity."

 GUA_forpol.66.t: "Choices in the Land of Eternal Spring"
 GUA_forpol.66.desc: "SECRET\n\nFROM JONATHAN LAXOR\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: IMPENDING GUATEMALAN ELECTIONS\n\nGuatemala's 1974 elections will likely be the most contested in its history. With ongoing democratic consolidation, the threat of a military coup has receded.\n\nPrimaries are approaching for the dominant Partido Acción Revolucionaria, which has governed Guatemala since 1944. President Mijangos is backing Manuel Colom Argueta, the charismatic and dynamic leftist mayor of Guatemala City, as his successor. However, the PAR moderates are coalescing around Julio Méndez Montenegro, dean at the University of San Carlos and brother of former president Mario Méndez, as a stabilizing and pro-business figure.\n\nGuatemala's opposition is likewise divided, though poised to capitalize on the growing fractures in the PAR. René de León Schlotter's Democracia Cristiana Guatemalteca, a Christian social democratic party, has built a voter base among the highly-religious Mayan populace that Presidents Árbenz and Mijangos sought to enfranchise. An opposing force is the Movimiento de Liberación Nacional, a rightist organization backed by planters, including the United Fruit Company. Mario Sandoval Alarcón has changed tactics toward electoralism, but is also using the group's paramilitaries to secure votes through intimidation and fraud.\n\nBoth Méndez and de León have expressed pro-OFN sentiments, whereas Sandoval is poised to cooperate with American business."
 GUA_forpol.66.a: "A chance to moderate the PAR is too good to pass up. Channel funding to Méndez."
 GUA_forpol.66.b: "Christian social democracy can heal Guatemala's divides. Publish DCG propaganda."
 GUA_forpol.66.c: "Cheaper bananas, cheaper coffee, happier shareholders. Train those MLN boys."
 GUA_forpol.66.d: "Guatemala's on a good trajectory. No need to get involved."
 GUA_forpol_66_tt: "\n§FDue to the §VPAR's§! immense popularity on account of §<Guatemala'§! success in the negotiations with §*Belize,§! this party's chances of victory in the election are slim to none.§!"

# News events

 GUA_news.1.t: "[Get_newspaper_header]Military Coup in Guatemala"
 GUA_news.1.desc: "The Guatemalan army has seized the Palacio Verde, preempting the inauguration of recently-elected Colonel Jacobo Árbenz by mere hours. Outgoing Guatemalan president Mario Méndez Montenegro has also been reported dead. Despite scattered clashes, the military, in collaboration with local landowners' and the rumored financial backing of the United Fruit Company, appears to have secured all major cities and much of the countryside.\n\nConservative general Miguel Ydígoras, presumed head of the new military junta, has announced prompt elections and his own candidacy for the presidency. The until-now dominant Partido Acción Revolucionaria has been banned, with the general citing Árbenz's land reform program as a socialist threat to national unity. International reactions have been mixed, with fierce condemnations from neighboring Mexico and conciliatory rhetoric from the U.S.\n"
 GUA_news.1.a: "A rotten banana gets thrown away."
 GUA_news.1.b: "A devastating blow to national security."
 GUA_news.1.c: "No need to make a show when you have the means."

 GUA_news.2.t: "[Get_newspaper_header]Failed Military Coup in Guatemala"
 GUA_news.2.desc: "Brief combat broke out at multiple barracks and fortified positions in Guatemala today as loyalist units were ordered to subdue members of a military conspiracy seeking to prevent the inauguration of recently-elected Colonel Jacobo Árbenz. General and conservative politician Miguel Ydígoras and several high-ranking officers have been arrested and charged with attempting a coup.\n\nDespite, or perhaps because of, the danger, Guatemalans turned out en masse to celebrate the start of the Árbenz presidency. The leftist Partido Acción Revolucionaria has rallied to their leader in response, pledging to enact his ambitious land reform program in full. But where many see a hero of democracy, Guatemalan landowners and the United Fruit Company allege tyranny and claim that Ydígoras is a victim of political persecution.\n"
 GUA_news.2.a: ""United Fruit Company is on the line, sir.""
 GUA_news.2.b: "Certainly better than the alternative."
 GUA_news.2.c: "The Revolution of '44 takes another breath."

 GUA_news.3.t: "[Get_newspaper_header]Incident on the Mexican-Guatemalan Border"
 GUA_news.3.desc: "One of the most militarised borders in America again sees renewed deployments of troops and material after an incident at the border further frustrated tensions between the two difficult neighbours. Unidentified militants crossing the Usumacinta River were discovered by Mexican patrols. Retreating into Guatemala, the militants were pursued by some responding Mexican troops who themselves fled from the Guatemalan response.\n\nThe Guatemalan Government has already condemned the Mexican incursion, as almost an act of war, while Mexico accuses Guatemala of facilitating dissident crossings using the slow Guatemalan response as evidence. Many questions remain over exactly what occurred, however the fallout is clear as both nations brace for potential war."
 GUA_news.3.a: "The thin line between mistrust and conflict has been crossed."

 GUA_news.4.t: "[Get_newspaper_header]Guatemala Attacks Mexico!"
 GUA_news.4.desc: "Tensions on the Guatemalan-Mexican border have steadily increased over the past months, with several incidents devolving into violence and Guatemalan president Miguel Ydígoras consistently denouncing "Mexican-Cuban socialist aggression". Many believed that this was mere patriotic bluster, designed to rouse domestic support for Ydígoras's unstable regime and coerce Mexico to concessions for the sake of regional stability.\n\nThese beliefs have now been comprehensively shattered. Earlier today, Guatemalan army units attacked Mexican border positions, and Guatemalan navy ships attacked Mexican commercial vessels deep in Mexican territorial waters. The surprise attack seems to have caught Mexico unprepared, but observers are not certain whether Guatemala has a long-term plan which could see it emerge victorious from the conflict with its vastly larger neighbor.\n"
 GUA_news.4.a: "What are they thinking?"
 GUA_news.4.b: "They will pay a heavy price for this."
 GUA_news.4.c: "This won't end well..."

 GUA_news.5.t: "[Get_newspaper_header]Mexico Puts Down Guatemalan Revolution" #Build out further if characters allow
 GUA_news.5.desc: "What the Mexican military thought was to be a quick war against Guatemala has since turned into a stalemate. Yet, even as Guatemalan forces have held back their much stronger northern neighbor, things are far from perfect behind the lines.\n\nLeftist revolutionaries have taken the opportunity of the distracted military to begin an uprising, forcing the Guatemalan army to take forces away from the frontlines to fight the threat within. With their foes divided, the Mexican Army broke the stalemate, swiftly crushing both the regime and the guerrilla forces."
 GUA_news.5.a: "Only the true revolution can stand."

 GUA_news.6.t: "[Get_newspaper_header]Revolution in Guatemala"
 GUA_news.6.desc: "In a joint proclamation from the capital, the coalition of anti-government revolutionaries in Guatemala has declared that the country has been "liberated" from military rule. The previous regime led by General Ydígoras, which violently repressed civil liberties and political opposition, has buckled from the pressure of an uprising of domestic guerrillas and a concurrent naval invasion landing in Puerto Barrios by the Cuban-backed Caribbean Legion, similar to the one in Puerto Plata in 1963.\n\nThe Cuban government, who openly supported the left-wing rebels now in control of the nation, have congratulated the new revolutionary republic. So too has Mexico, although they have pointedly not commented on their alleged involvement in Ydígoras' overthrow."
 GUA_news.6.a: "Another revolution in the Americas for the books."
 GUA_news.6.b: "Another tyrant dead."
 GUA_news.6.c: "These Reds get everywhere."

 GUA_news.7.t: "[Get_newspaper_header]Pro-American Coup in Guatemala"
 GUA_news.7.desc: "Guatemala City has recently been stormed by troops under the command of several senior army officers. Under threats of violent overthrow, the former president has been forced to flee from the country as the Armed Forces proclaimed the elected government's deposition and began establishment of a transitional junta to "restore societal order".\n\nThe junta's leadership, mostly under the United States' employ, appears to have originated from a coalition of disparate military cliques — solely unified by their financial ties to American organizations. While popular support to the new regime remains abysmal, it seems that with sponsorship from the northern hegemon, little can be done to shift Guatemala's course in the near future.\n"
 GUA_news.7.a: "America's backyard isn't for sale."

 GUA_news.9.t: "[Get_newspaper_header]Mijangos Elected President of Guatemala"
 GUA_news.9.desc: "Despite the turbulence of the election season, Guatemala has preserved its fragile hold over democracy. The Partido Acción Revolucionaria (PAR), led by wheelchair-bound lawyer Dr. Oscar Adolfo Mijangos López, has secured victory, with celebrations echoing across the small nation.\n\nBut peace in Central America has always been relative. Resentment simmers among officers who have missed their chance to intervene, with their fears of socialism keeping a potential coup alive.\n\nFor now, the PAR weighs its alignment between the OFN, Veracruz, and other partners abroad. The world watches closely to see whether Guatemala is proof that democracy can endure in Central America, or if it's just a pause before the storm returns.\n"
 GUA_news.9.a: "A proof that it can be done."

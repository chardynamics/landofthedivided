 PAN_news.0.t: "[Get_newspaper_header]Remón Consolidates Power in Panama"
 PAN_news.0.desc: "The status quo has maintained itself in Panama, as José Antonio Remón Cantera, the small Central American nation's dictator, has managed to survive the most serious challenge to his rule to date. The recent Martyrs' Day protests saw thousands of Panamanians take to the streets in opposition to President Remón. In the end, however, Remón has managed to weather the storm and has begun to respond to the protests by imposing a harsh crackdown on Panamanian opposition parties and figures in an effort to consolidate his power.\n\nThough Washington is glad that their man has survived this most recent scare, America's support for Remón will not be without consequence. The US's backing of the President has emboldened leftist and liberal opposition to America within Panama, and it's likely that similar sentiments will spread across the rest of the Americas.\n"
 PAN_news.0.a: "The American lapdog barks on, may he choke on the leash."
 PAN_news.0.b: "Stability... If only that were more common."

 PAN_news.1.t: "[Get_newspaper_header]National Guard Coup in Panama"
 PAN_news.1.desc: "In a shocking turn of events, the Panamanian National Guard has overthrown President José Antonio Remón Cantera and his government in a coup. The Martyrs' Day protests against President Remón had rocked the small Central American country in recent weeks, with many fearing that the civil unrest in the streets could escalate into a full-scale revolution. However, the National Guard has seemingly tried to preempt such a possibility by wrestling power away from Remón, tearing up the Panamanian constitution, and installing a thoroughly autocratic, militarized government in its place.\n\nThe international reaction has been largely condemnatory in the face of the National Guard government's reactionary nature and subsequent crackdowns on the Panamanian opposition, though the United States' response has been largely muted.\n"
 PAN_news.1.a: "The Policemen of nations have been robbed of their position."
 PAN_news.1.b: "With the right tinpot in charge, this development might not be a complete disaster."

 PAN_news.2.t: "[Get_newspaper_header]Remón Falls, Arias Wins Panama Election"
 PAN_news.2.desc: "The National Patriotic Coalition and its leader, Arnulfo Arias, have won the Presidency in Panama. The country's previous president, José Antonio Remón Cantera, chose not to run for re-election despite having the support of the United States, in light of the unrest caused by protests against his government in recent weeks. Arias and his CPN took advantage of the resulting power vacuum, thrusting themselves into power.\n\nArias, an unabashed nationalist, is a critic of the United States' influence in Central America and has been accused of being a closeted fascist by his detractors. The new president will focus on consolidating his control over the country, starting with targeting the power of the National Guard, whose influence over Panamanian politics Arias has long bemoaned."
 PAN_news.2.a: "Is the tide turning against the OFN in Central America?"
 PAN_news.2.b: "Salt upon a wound so close to home."

 PAN_news.3.t: "[Get_newspaper_header]Panama's Dictatorship Lapses, Democratizes"
 PAN_news.3.desc: "The National Liberal Party has won the Presidential Election in Panama. While there was speculation that the country's previous president, José Antonio Remón Cantera, would choose not to recognize the election result if it did not go his way, Remón has publicly acknowledged the PLN's victory. Remón's reaction was likely the result of pressure imposed on him by the United States to accept the election outcome.\n\nThe new liberal government rode to power on the wave of widespread resentment against Remón following the events of the Martyrs' Day protest that shook the small Central American nation. The Panamanian opposition has contested the result of the election, however, given the PLN's close alignment with Washington."
 PAN_news.3.a: "The tide turns in the OFN's favor."
 PAN_news.3.b: "A victory for democracy."

 PAN_news.4.t: "[Get_newspaper_header]Panama's Dictatorship Ousted from Power"
 PAN_news.4.desc: "The Martyrs' Day protests that have been plaguing Panama over the past months have reached a violent conclusion with a popular revolution overthrowing President José Antonio Remón Cantera and forming a new left-leaning government.\n\nPanama's new leader, the renowned socialist Floyd Britton has promised democratization and a dismantlement of the economic cartels dominating the country as part of his governing program. More concerningly, his party, the PPP has shown a clear anti-American stance, spurring a new source of worries over the future of Atlantic trading.\n\nThe international reaction has been largely condemnatory as the new regime struggled to find partners within the region. Panama and the world wait with bated breath to see what United States' response will be.\n"
 PAN_news.4.a: "A few more weeks and Marxists will dine in the Canal..."
 PAN_news.4.b: "Our failure and now our mess to clean."

 PAN_news.5.t: "[Get_newspaper_header]OAS Intervenes in Panama Canal Crisis"
 PAN_news.5.desc: "After months of escalating tensions between the United States and Panama, open conflict has erupted between the two as the Nationalist government of Panama seized control of the Panama Canal. Declaring the Panamanian seizure to be illegal and a violation of OFN sovereignty, the United States has authorized the deployment of the IAPF to force the Nationalist regime out of power and place control of the Canal back under the auspices of Washington D.C.\n\nControversy over this decision is palpable across the OFN sphere of influence, as it is difficult for America's allies to couch the US deployment of the IAPF in Panama in terms that sufficiently mask America's thinly-veiled imperialism in attempting to retake the Canal, despite the technical legality of the American intervention."
 PAN_news.5.a: "Not even a hundred years later and Yankee boots are back in the mud of Panama."
 PAN_news.5.b: "It had to be done."

 PAN_news.6.t: "[Get_newspaper_header]Panama's Dictatorship Lapses, Democratizes"
 PAN_news.6.desc: "In a stunning turn of events in Latin America, the American-backed regime in Panama, led by President José Remón, has collapsed due to his failure to appease opposition movements amid the current economic crisis. The Panamanian dictatorship has fallen to popular protest exacerbated by the lack of access to American oil. Remón has fled into exile as opposition protesters seized critical government institutions, declaring a new era for a revolutionary Panama.\n\nThe fall of the Coalición Patriótica Nacional was immediately followed by national elections, in which the progressive and anti-American Partido del Pueblo de Panama secured victory. Led by President Thelma King, Panama now looks towards Mexico and other independent nations, rebuffing American influence."
 PAN_news.6.a: "We are losing the hemisphere..."
 PAN_news.6.b: "Another nation slips free from imperialism's chains"
 PAN_news.6.c: "Another American pawn falls"

 PAN_news.7.t: "[Get_newspaper_header]Colonel Torrijos Takes Control of Panama"
 PAN_news.7.desc: "The Panamanian National Guard, long a player in the Central American nation's politics, intervened yet again. Seizing the Palace of the Herons and key positions in the capital, the Guard captured Panama's leader at a local movie theater. The relative calm of U.S. forces in the nearby Canal Zone and the former administration's hostility to the Americans' presence have sparked widespread rumors that Washington incited the coup.\n\nColonel Omar Torrijos, an earthy graduate of the School of the Americas, has declared himself as Panama's new leader, and that he will govern "for the poor, not for the owners". Analysts suggest Torrijos' use of nationalist and egalitarian rhetoric is to build a base of legitimacy independent of his American backers."
 PAN_news.7.a: "A little worrisome, but at least the Canal is secure."
 PAN_news.7.b: "Washington's found a stooge with personality."
 
 PAN_news.8.t: "[Get_newspaper_header]United States Cedes the Panama Canal Zone"
 PAN_news.8.desc: "In a landmark foreign policy decision, the United States has ceded the Panama Canal Zone to Panama. The five-mile buffer around the Canal had long served as a flashpoint within the Central American nation, especially following 'Martyr's Day' in 1964 in which Panamanians were shot by U.S. forces stationed in the Zone.\n\nThe cession has proved extremely controversial within the United States, with the needed backing in the Senate only marginally secured following temporary exemptions for certain military facilities and various security and trade guarantees over the Canal itself. Across Latin America however, reactions have been jubilant - as a long-standing controversy with Washington is decisively addressed. And nowhere are the celebrations larger than in Panama itself, where citizens with flags and mejoranas have poured into the land they view as their own.\n"
 PAN_news.8.a: "Trade a Zone for a country. And perhaps a continent."
 PAN_news.8.b: "Reuniting a divided land."
 PAN_news.8.c: "Weakness masquerading as magnanimity."
 PAN_news.8.d: "The Canal's scar begins to heal."
 
 PAN_news.9.t: "[Get_newspaper_header]Panama Invades the Canal Zone"
 PAN_news.9.desc: "Panama's government has seized the Canal Zone that runs through the country. This five-mile buffer for the Canal contains numerous U.S. military facilities, but most members of the garrison chose to surrender rather than face overwhelming force.\n\nPresented with this fait accompli and overstretched in the evolving Oil Crisis, the U.S. government has made no armed response. Many domestically have condemned the administration's perceived weakness, and allies have expressed grave concerns about the setback to the OFN's geopolitical position.\n\nIn Panama, and in much of Latin America, the reaction has been exuberant, with the hitherto controversial government succeeding in its boldest gambit.\n"
 PAN_news.9.a: "Roosevelt rolling in his grave."
 PAN_news.9.b: "An unimaginable victory in the Cold War."
 PAN_news.9.c: "The Heron waited for its moment to strike."

 PAN_news.10.t: "[Get_newspaper_header]Panama Joins the OFN"
 PAN_news.10.desc: "In a ceremony at Washington, the nation of Panama has become the newest member of the Organization of Free Nations. The move follows years of increasingly close cooperation between the incumbent Liberal Party and the U.S. Government following the Martyrs' Day riots against America's ownership of the Panama Canal.\n\nCritics have slammed the ceremony as merely cementing America's enormous influence over the Central American state, citing the widespread corruption within the Panamanian government, and the lucrative ties between American businessmen and many of Panama's oligarchs and its political class. However, proponents of the alliance believe that Panama's alignment will allow for America to maintain peace within the region, and further the spread of democracy. Others have stated their belief that the alignment should allow for a quicker restoration of Panamanian ownership over the Canal.\n"
 PAN_news.10.a: "We look forward to working with them!"
 PAN_news.10.b: "They talk like lions, and act like sheep."
 PAN_news.10.c: "Only a fool would expect America to honour its promises."
 PAN_news.10.d: "Another peg put in place."

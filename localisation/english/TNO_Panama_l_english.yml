#Characters#
PAN_Jose_Remon_Cantera: "José Antonio Remón Cantera"
PAN_Jose_Remon_Cantera_desc: "When Washington first divided the isthmus, it chose not to impose colonial rule as it did with Puerto Rico, preferring a controlled disorder. However, Panamanian politics and the Canal eventually gave way to José Antonio Remón Cantera, America's policeman in Panama.\n\nAn obscure figure until he entered Panama's security forces, Remón joined during its lowest point, devastated by the Great Depression. Amidst American worries of Axis infiltration, a Panamanian was allowed for the first time to head the National Police. Remón was appointed due to being the only candidate who studied at a military academy.\n\nIn power, he molded Panama's democracy to his liking, rigging elections and couping Presidents to his and America's content. After he overthrew Arias again for attempting to curb the Police's influence, Remón decided it was not enough to influence Panama's politics from behind the scenes, and became President himself.\n\nSince then, he has amended the constitution, served multiple terms in office and survived an assassination attempt in 1955. With no one daring to oppose him since he ordered the death of one of his Vice Presidents, José Ramón Guizado, a suspected conspirator of the assassination attempt. He possesses absolute power with resistance at an all-time low, enacting progressive and nationalist reforms so long as they don't upset America or the oligarchy too much.\n\nWith America's continued backing, Remón will likely rule Panama for another decade unless something radical happens."
king_maker_remon: "The Kingmaker"

#Democratic Path
PAN_Roberto_Chiari_Ramon: "Roberto Francisco Chiari Remón"
PAN_Roberto_Chiari_Remon_desc: "Is it fate, rather than toil and turmoil, that ultimately divines our place in society? For a man such as Chiari, to suggest otherwise seems ludicrous, as his path to the Presidency appears predetermined by higher powers.\n\nThe son of Rodolfo Chiari, a onetime President, Roberto Francisco Chiari Remón, he was fortuitous enough to secure prime employment in his father's company. Of his many brothers, he was the only one who took an interest in his father's other business, politics. A natural Liberal, he was a minister by his thirties, and acting President by the forties, before his rise was swiftly halted.\n\nColonel Remón's seizure of power may have stopped Arias, but it also stopped his ascent past leading the Liberals, for which having the Colonel as his cousin meant that the grouping could be allowed some small mercies in the new regime. So, Chiari was left to twist in the wind, trying to convince American policymakers that Remón was unsustainable, something proven correct on St. Martyrs' Day.\n\nKeeping power safe from thugs on both sides, America's backing for democracy has allowed Chiari and his Liberals to retake control over the strongmen. Now, his job is to maintain this hard won peace, and all the pillars that maintain it, lest another Remón makes his name."
PAN_Aquilino_Boyd: "Aquilino Boyd"
PAN_Aquilino_Boyd_desc: "If politics merely is a more sophisticated form of war, then Aquilino Boyd is a barbarian, bombarding his opposition under a litany of litigation and threats. For when it comes to nation, no quarter can be given to its enemies.\n\nAn inheritor of the mantle of the ruling class, Boyd was educated in America under the guidance of a private Catholic college, his education left him slotted into a diplomatic post of some importance to represent Panama in America. His time spent in America was shadowed with salacious rumors regarding inebriety and a propensity for violence, all swept under the rug thanks to diplomatic immunity.\n\nThe rumors never fully followed him home — aided by a healthy dose of legal threats — allowing him to make a name in politics as a dogged defender of Panamanian interests, entering the assembly under a nationalist platform. With displacement of Arias, his following gradually took to Boyd as a replacement as anger grew towards the perceived complacency of the Liberals toward American imperialism.\n\nUnder his Presidency, some believe Panama has taken a step back to the strongmen, but his supporters believe they have stepped up to make their nation whole again. To them, Remón and Chiari were lapdogs, but Boyd has the power necessary to make America kneel, and take back what was always theirs."
PAN_Aquilino_Boyd_canal_desc: "If politics merely is a more sophisticated form of war, then Aquilino Boyd is a barbarian, bombarding his opposition under a litany of litigation and threats. He has fought, he has conquered, and his nation is his bounty.\n\nAn inheritor of the mantle of the ruling class, Boyd was educated in America under the guidance of a private Catholic college, his education left him slotted into a diplomatic post of some importance to represent Panama in America. His time spent in America was shadowed with salacious rumors regarding inebriety and a propensity for violence, all swept under the rug thanks to diplomatic immunity.\n\nThe rumors never fully followed him home — aided by a healthy dose of legal threats — allowing him to make a name in politics as a dogged defender of Panamanian interests, entering the assembly under a nationalist platform. With displacement of Arias, his following gradually took to Boyd as a replacement as anger grew towards the perceived complacency of the Liberals toward American imperialism.\n\nUnder his Presidency, Panama has been made whole again, yet the streets are quiet. The champagne is doled out to friends on their days-off, paid for in labor and blood, as its citizens are subdued with nationalism. There is even tepid acceptance, as Boyd begins to take a second term, as a new strongman makes his name."
PAN_David_Samudio_Avila: "David Samudio Ávila"
PAN_David_Samudio_Avila_desc: "Can genuine change emerge from a system dictated by men whose institution of choice increasingly seems to be the graveyard? Samudio knows the answer, and yet, he continues to work to prove himself wrong.\n\nThe first of a new breed among Panama's political class, David Samudio Ávila is not one of the gilded elite preordained to lead people, but someone who has fought their way to hold this mantle. Unlike his predecessors, Ávila descends from the middle-class, those able enough to peer onto the table but not sit at it. Earning his bread as an engineer, his life would have been just that, if not for the Liberals.\n\nÁvila joined the party as a way of offering the only legal, if minimal, form of opposition to the incumbent dictatorial regime. He was elected as an assemblyman in time to secure democracy in the aftermath of Remón's fall, being made a minister as a peace offering to laborist and agrarian groups. Robles kept him on, and found him favorable enough to leave the Liberal candidacy to him.\n\nWith the withering away of Conservative groups, Ávila's candidacy was met with little opposition, allowing him to move into the Presidency with ease. A reformist figure, Ávila is left trying to nudge Panama incrementally to a more authentic democracy, even if he knows four years' work will be far from enough. Nor will his fellow Liberals let him do so without a fight."
PAN_Marco_Aurelio_Robles: "Marco Aurelio Robles"
PAN_Marco_Aurelio_Robles_desc: "Where Chiari was able to win over the hearts of the people, Robles won over the pockets of the oligarchs, a man reminiscent of the "good old days" where politics was a more private affair.\n\nBorn into class, he studied at the Panama University with distinction, the very same university his grandfather was rector of. Following this and a stint at the Sorbonne, he moved onto the career ladder, ending it as the general manager of the Panamanian National Bank. This position aided his jumping off into politics significantly, helping him get elected as a parliamentary deputy for the Liberals.\n\nWorking closely with Chiari, Robles was responsible for assuaging the concerns of monied interests, helping inform them of the plan to transition regimes as if they were moving assets. To thank him for his work, Chiari made him Minister of Justice — the same role his father served in Chiari Sr.'s cabinet — with assurances to the oligarchs that Robles would be his designated successor.\n\nNow, with the election behind him and without Chiari, Robles is left with the task of ruling the people. Standing as an unimpressive figure who speaks in slow drawl, his work is to keep the classes in place, and keep the peace with America. Everything else is a task for the ministers, just so long as the boat isn't rocked."
#Army Path
PAN_Arnulfo_Arias: "Arnulfo Arias Madrid"
PAN_Arnulfo_Arias_desc: "If there ever was an authentic Panamanian nationalist, that man is Arnulfo Arias, a lone political voice above the traditional oligarchy and strongmen who have dominated his fatherland for far too long.\n\nBorn into a family steeped in politics, Arnulfo could only look to their history to see what could potentially await him, with such an illustrious lure proving to be irresistible for him. His raison d'etre in Panama's political sphere became the canal, the scar that ran the width of their nation, branded with an American flag like the livestock they were.\n\nIt was this cause that led him to establish the Panameñista Party with his brother. Together, they scored several victories against the dominant Liberal Party, but the oligarchy were always one step ahead. When Arnulfo first became President in 1941, they orchestrated his removal using the police, repeating the feat once again when he was re-elected in 1951.\n\nThese experiences have made it clear to Arias that if he must get anywhere — to make a serious difference to the lives of the average Panamanian — that cancer on the body politic known as the National Police must be expunged. The present may call him authoritarian, but the future will thank him." #Baseline NatCon
PAN_Arnulfo_Arias_aristocratic_desc: "Arnulfo Arias is described as the President of Panama, a patriot, a protector, a plotter, and a parasite. These words matter little to the man himself, content that he knows himself almost as much as he knows what makes Panama tick.\n\nWhy, if he didn't know what made Panama tick, how did he get elected to its highest office four times? The left can protest that the people want to be their own bosses, to act like the foreman, and to run the country into the ground offering handouts for any scrounger that raises their hand. The liberals claim it's their right to hold power, protesting about how they founded the state.\n\nHowever, Arias understands that each side holds some elements of truth to their claims. The people do want a revolution, but a national revolution, one that will free them from America's imperial severance on the Isthmus. Similarly, there is a need for a distinguished group of patriots to lead their country without interference, just not those loyal only to the dollar.\n\nThese are the virtues that Arias will carry with him into his next term as President, a man adored by his loyal constituents, and hated in equal measures by his enemies in overflowing prisons. In due time, even Washington will know the extent of his fury."
PAN_Arnulfo_Arias_fascist_desc: "At his most recent turn, some might say that Arnulfo Arias is proof that an old dog can learn new tricks, but they would be very mistaken. This is his natural form, unveiled after decades in disguise.\n\nWhen Arnulfo was first posted to Italy as a diplomat, he found that fascism fit him well, putting steel into the glove that his brother's terms as President were lacking. Upon his election, his 1941 draft for the constitution — which promised to strip voting rights and citizenship from non-white Panamanians — proved to be a step too far for Washington, already wary of his pro-German leanings.\n\nDeposed by an American-backed coup, Arnulfo found his re-election challenged again in 1948, couped by Remón to maintain the Star-Spangled Banner over the Canal. And so, he waited, watching until America's grip began to falter. As it did, a new iron grip formed, a mettle that demanded Panama for the Panamanians alone. That grip claimed Panama as a whole, all for itself.\n\nPanama, today, is independent if not free. It is better than free — it is structured, given order where only Yankee greed prevailed. Their order is pure, free from the scars of their past, and primed for the great days of their future history."
PAN_Omar_Torrijos: "Omar Torrijos Herrera"
PAN_Omar_Torrijos_desc: "There is honor in being a policeman, honor in following orders, and knowing your betters. There is less honor in playing an actor. Omar Torrijos finds a compromise between both his roles.\n\nTorrijos was always one to zoom in on an opportunity, to find ways past obstacles... to slither. Life in Panama made such skills prerequisites for survival, especially after Remón's seizure of power. His first great opportunity came at the age of eighteen when he won a military scholarship that accelerated his rise through the officer ranks, assisted by his friendship with his fellow officer, Boris Martínez.\n\nHis second opportunity came through the School of the Americas, ostensibly a purely educational pursuit, but one that brought him to the attention of America's Panama experts. To them, he was a blank canvas, complete with a stars and stripes watermark. Torrijos did not refuse their advances, accepting their money, and then their orders. Others in his circles were similarly malleable, folding their flag, and returning Panama to the rule of the gun... or just a different type of gun.\n\nAs Torrijos extols from speakers, the previous regime was cowardly and weak, while the new President represents strength and unity. His strength comes at the pace of a Wall Street stock ticker while unity is found through a lack of division, as all those able to divide have left Panama by airplane or bodybag."
PAN_Omar_Torrijos_puppet_desc: "There is honor in being a policeman, honor in following orders, and knowing your betters. There is less honor in playing an actor. Omar Torrijos finds a compromise between both his roles.\n\nTorrijos was always one to zoom in on an opportunity, to find ways past obstacles... to slither. Life in Panama made such skills prerequisites for survival, especially after Remón's seizure of power. His first great opportunity came at the age of eighteen when he won a military scholarship that accelerated his rise through the officer ranks, assisted by his friendship with his fellow officer, Boris Martínez.\n\nHis second opportunity came through the School of the Americas, ostensibly a purely educational pursuit, but one that brought him to the attention of America's Panama experts. To them, he was a blank canvas, complete with a stars and stripes watermark. Torrijos did not refuse their advances, accepting their money, and then their orders. Ultimately, he did not even need to pull the trigger, emerging from the wreckage as a secret dissident ready to lead a Panama more acceptable to America.\n\nWhen President Torrijos speaks, his speeches come through as orders, but never his orders. Maybe, he secretly hopes for a chance to give his own orders, but such a day seems distant. The appearance of power has come at the price of power, and so, Torrijos must continue to wait."
PAN_Boris_Martinez: "Boris Martínez"
PAN_Boris_Martinez_desc: "There are things that are above politics. Things too sacrosanct to be left in the hands of careerists. It is unfortunate that the nation was not considered one of these things, but now, not anymore.\n\nThe cause of Panama is now championed by one Boris Martínez, a soldier down to his fingers. His coming of age was heralded by the reign of Remón, a man who outwardly imposed strength, but was nothing more than a lap-dog to America. His studies at the Heroic Military Academy in Mexico only strengthened a latent dislike of Panama's suzerain, the cause of their liberal weakness.\n\nThe Martyrs' Day protests only cemented this perspective, as Remón could only dictate orders like a corpulent slug, decadent and dizzy off of America's opium. The final straw was his attempted surrender of power to Arias, a figure worthy of even more loathing than Remón. A moral solution — a moral revolution — was required to wipe the slate clean, to teach discipline.\n\nIn years to come, they will thank him, there will be places of honor for him. Today, there is only duty, work in replacing Coca Cola cans for a moral backbone. Washington can watch, and they will watch Washington's holdings. And soon, the greatest injustice of all will be avenged."
PAN_Max_Devalle: "Max Devalle"
#Socialist Path
PAN_Floyd_Britton: "Floyd Britton"
PAN_Floyd_Britton_desc: "Floyd Britton wakes up each day in a country foreign to him, bought and sold decades before he was born, and treated as if he was a squatter. Floyd Britton will not die in this country, even if he is not evicted from its land.\n\nIt was the same alien feeling that his parents felt in the country, having come to Panama to find employment, but left with only the crumbs from the table. Whatever they had, they had enough to put a young Floyd Britton through secondary school, where he found his flair for rallying people as a student leader. His work put him in contact with leftist groups, particularly after an illuminating trip to Cuba.\n\nMartyrs' Day was the culmination of not his, but a whole generation's worth of lives, as the repression they had suffered under was repelled with Remón's fall. However, he is not the only casualty. The oligarchs, even the frail Liberals — prepared to erase their complicity and rule as if they were the only adults in the room — have been scattered, observers to a new Panama.\n\nHowever, that foreign feeling remains, as the American flag flutters in his horizon. As long as it remains, so does their repression. If Panama is to be a homeland, it must be whole, as one nation and one flag. Washington will hear them and be forced to respond, one that could make or break him." #Base Gaitanist version
PAN_Floyd_Britton_canal_desc: "Floyd Britton woke up each day in a country foreign to him, bought and sold decades before he was born, and he was treated like a squatter. This is not the country he lives in now.\n\nHis parents felt the same way he once did, having come to Panama to find employment, but left with only the crumbs from the table. Whatever they had, they had enough to put a young Floyd Britton through secondary school, where he found his flair for rallying people as a student leader. His work put him in contact with leftist groups, particularly after an illuminating trip to Cuba.\n\nMartyrs' Day was the culmination of not his, but a whole generation's worth of lives, as the repression they had suffered under was repelled with Remón's fall. However, he is not the only casualty. The oligarchs, even the frail Liberals — prepared to erase their complicity and rule as if they were the only adults in the room — have been scattered, observers to a new Panama.\n\nIn the confrontation that wasn't, Washington — against all odds — agreed to return the Canal to Panama. While it has torn many on the left regarding whether this imperial power can be truly trusted, it has aligned Panama firmly with America at present. Others may question the legitimacy of this freedom, but for Britton, it has marked the first day he felt at home in Panama." #Gaitanist version, successful negotiations
PAN_Floyd_Britton_amazonist_desc: "Panama was a country bought and paid for by America, but its people were not part of the deal, those who were never asked and only told. Now, these people will be telling the world, and America will listen.\n\nFor Floyd Britton, such a time was too long to come. His life until Martyrs' Day had been spent listening to others, the alleged adults in the room, dictate decisions that only lined their own pockets. It never made sense to him, and as the anger in the room grew, it became clear the people like him outnumbered the rest. On the day, they came out in force, and everyone else packed up.\n\nAnd yet, America did not listen. Even when brought to the highest office in the state, the Americans dug their heads into the Canal, and pretended as if he was never there. Soon, it became clear to Britton that they would never listen, unless he made them stand up and pay attention. As touted liberal opponents found themselves swept away to their sponsor states, it was clear change had come.\n\nToothless condemnations erupt from an emasculated bourgeoisie, patriots crying out for foreign powers to pillage their homeland, as their hated President makes his own plans. It will not be by documents or speeches that Panama will be made whole again, but by blood alone, as their gunshots will echo across the world." #Amazonist
PAN_Floyd_Britton_amazonist_canal_desc: "Panama was a country bought and paid for by America, but its people were not part of the deal, those who were never asked and only told. Now, its people have let their actions speak for them, and the world has listened for once.\n\nFor Floyd Britton, such a time was too long to come. His life until Martyrs' Day had been spent listening to others, the alleged adults in the room, dictate decisions that only lined their own pockets. It never made sense to him, and as the anger in the room grew, it became clear the people like him outnumbered the rest. On the day, they came out in force, and everyone else packed up.\n\nAnd yet, America did not listen. Even when brought to the highest office in the state, the Americans dug their heads into the Canal, and pretended as if he was never there. Soon, it became clear to Britton that they would never listen, unless he made them stand up and pay attention. As touted liberal opponents found themselves swept away to their sponsor states, it was clear change had come.\n\nToothless condemnations erupt from an emasculated bourgeoisie, patriots crying out for foreign powers to pillage their homeland, but they remain exiles to a Panama worshipping its President as an idol who defeated America in its own backyard. Might has proven right, and their neighbors have taken notice, as the poor and downtrodden whisper their own plans for liberation across the continent." #Amazonist, successful takeover

PAN_Thelma_King_Harrison: "Thelma King Harrison"
PAN_Thelma_King_Harrison_desc: "When King proclaimed that only when Panamanians find the courage to stand up to the Americans will God be able to protect them, it felt more like a cry for help than a call to action. Times have changed drastically since then.\n\nHalf-scholar, half-revolutionary, and a full-time thorn in the Remón regime, Thelma King's trajectory in life found itself turning in the direction of Havana, following the ousting of dictator Batista. Castro and his policies provided a model for all future revolutionaries in Latin America, and King took it upon herself to get a front row seat, as she worked to become a prime provocateur for change.\n\nWorking within the insurgent leftist movements domestic to Panama, King took the role of an efficient organizer and speaker, able to operate in the front and the back even if others took a more central role. While her contacts with Havana were well-known, rumors circulated regarding a rapport with the FBI that went nowhere, but were never fully dispelled. Nevertheless, her work in the party led her to be seen as a safe if still fiery pair of hands.\n\nNow ruling Panama, Thelma King has promised to make her earlier words into actions, as their country strikes an independent pose. Of course, true independence requires allies, chief among them being the revolutionary state of Cuba. And with allies, anything is possible, even the accumulation of more allied nations..."

PAN_OAS_OFN: "Panamian Governance Council"
PAN_OAS_OFN_desc: "§YWHEREAS§! the megalomaniacal ambitions of prior Presidents in pursuit of revanchist aims were in fact the undoing of his entire regime, a source of misery for the ordinary people, and the cause of the current regrettable military presence in our nation;\n\n§YWHEREAS§! forces of the Organization of Free Nations and the Organization of American States have graciously been placed at the disposal of the people of the Republic of Panama, so as to ensure safety and the present stable situation in the area and of those residing in the Panama Canal Zone; and\n\n§YWHEREAS§! the Panamanian people require the continuation of governance and preservation of national rule for as long as OFN and OAS forces remain present and assisting; now, therefore, be it\n\n§mRESOLVED§! that a Governance Council of the Republic of Panama be formed;\n\n§mRESOLVED§! that the composition of this Council be of those community leaders, figures of commerce, and military officers who — internally or otherwise — opposed the previous regime in a manner that redounded to Panamanian welfare and goodwill between all nations; and\n\n§mRESOLVED§! that the Governance Council shall cooperate with the OFN-OAS transitional authorities for as long as their presence may be required in the Republic of Panama."

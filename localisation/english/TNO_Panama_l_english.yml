 ##Canal
 PAN_Divided_at_the_Isthmus: "Divided at the Isthmus"
 PAN_Divided_at_the_Isthmus_desc: "A scar runs around the nation, slicing it in half ever since the Americans saw fit to complete the job left by other empires. Foreign ships and cargo run rife through it daily, guarded by Washington's watchmen overseeing the world's trade. This is the Panama Canal Zone and its "zonians" — as they are derisively referred to by Panamians — the barriers to Panama's sovereignty and its self-sufficiency.\n\nHowever, there is no denying that the Canal has made many men monied, even if most wealth trickles upward to the oligarchy. The incision of 1904 has given Panama a far higher standard of living than many of its Central American neighbors, allowing for vast economic booms only furthered by the post-war influx of Sphere trade. Yet, some still long for something richer than wealth — a destiny not tied to the USA."

 #Canal Retaken
 PAN_El_Pais_Istmeno: "El País Istmeño"
 PAN_El_Pais_Istmeno_desc: "What makes Panama "Panamá"? Some might say the food or music, but every good Panamanian knows it is the isthmus, and the canal. Even during the days of Panama's provincial status in Colombia, it was known as the Province of Isthmus.\n\nYet ever since the construction of the canal, the continental division that is Panama was divided. The zone that drove a wedge between the Americas was a source of both national success and shame.\n\nBut no longer. No longer is Panama divided by a foreign power's strip, sucking up the profits and pride of the nation. Now, for one of the first times in its history, it is whole. From Boquete to Yaviza, the country rejoices as one. In every city, nationalists and socialists alike celebrate, singing the anthem of the Isthmus, drinking, laughing, and celebrating.\n\nThe canal remains, yes, but now it is Panamanian, and the Isthmanian Republic is whole again once more."

 ##American Relations
 PAN_Two_Flags_One_Nation: "Two Flags One Nation"
 PAN_Two_Flags_One_Nation_desc: "Atop each flagpole in the Panama Canal Zone, the Stars and Stripes fly proudly on top. Meanwhile, Panama's flag sits below it, if it is lucky enough to be even flown at all. To numerous Panamians, this is only emblematic of a grander problem, the Yankee exploitation of their nation.\n\nEncapsulated in the word Panameñismo, or Panama for Panamians, it signifies the rising nationalist trend in the country. The most recent climax of this was the 1959 anti-American riots, where Panamians who tried to raise their flag in the Canal were met with brutal force by American troops, leading to a spree of vandalism against American properties. Due to this, the current flag status quo was enacted, an unsatisfying compromise serving only as a rallying point for further nationalist discontent."

 #anti-American
 PAN_One_Flag_One_Nation: "One Flag One Nation"
 PAN_One_Flag_One_Nation_desc: "Atop every building in the nation flies only the Panamanian flag, and next to it is a piece of concrete where the Stars and Stripes once was. Just like the solitary flag, Panama stands on its own in a coalition of likeminded nations fed up with Washington's boot. Finally, every citizen of the nation can say that Panama, now, is truly for the Panamanians.\n\nThe anti-American ideology of Panameñismo grew in popularity as long as the Canal Zone remained part of the United States. The perceived imperialist domination of the Yanquis over the nation festered among the population until Panameñista fervor reached a breaking point.\n\nNo longer would the people accept their leaders bending over backwards for the Gringos. American firms throughout the nation are ransacked, as their owners are chased from their homes. No longer will Panama be suffocated under the grip of those who only seek to suck it dry.\n\n¡Panama Sí! ¡Yanqui No!"

 #Arias Anti-American
 PAN_One_Flag_One_Nation_2: "One Flag One Nation"
 PAN_One_Flag_One_Nation_2_desc: "The people dance in the street around piles of smoldering Stars and Stripes. Where it once flew are the flags of the Patria and of the Partido Panameñista.\n\nAround the country, Arias's speeches can be heard blaring on loudspeakers, his slogans spray painted on the walls of Yanqui firms, their homes broken into and ransacked. Now, they join the crusade of the nations who resist and stand up against the diktats and gagging of the oppressors of North America.\n\nArias's new nation represents the struggle of the Panameñista.Panama will be whole once more, for those never allowed to have their own nation now seek to reclaim it.\n\nThey break the chains that kept their country tied to Washington and expel the West Indian and Asian imported by the Yanquis. No longer will Panama be the whore of Washington! No longer will they live in a country that sells out its own people!\n\n¡Panama Sí! ¡Yanqui No!"

 ##Canal Treaty
 PAN_Half_measures_and_handshakes: "Half-Measures and Handshakes"
 PAN_Half_measures_and_handshakes_desc: ""Neither millions nor alms, we want justice."\n\nRemón first uttered the statement after he was elected, and three years later, the Remón-Eisenhower Treaty was signed — the latest piece of legislation covering the running of the Panama Canal. Notably, it saw America make numerous concessions to the Panamian government, including the return of territories, gains in Canal worker and trader rights, and increased payments to Panama for the Canal.\n\nHowever, despite it being one of the high points of Remón's reign, many believe the treaty granted them no justice. Nationalist dissidents such as Arnulfo Arias have railed against Remón for his alleged bending of the knee to continued American hegemony, legitimizing the Isthmus division. His views are far from a minority, meaning that the matter of the Canal must be revisited sooner rather than later."

 #Violence
 PAN_Clashes_At_Canal: "Clashes at the Canal"
 PAN_Clashes_At_Canal_desc: ""FUERA YANQUI ASESINOS", "YANKEE KILLERS", "PANAMA IS NOT FOR SALE".\n\nAll around the capital of Panama, and on the streets surrounding the canal zone, statements like these can be seen plastered on the walls. Has anything changed since Remón's treaty? No, not legally. But in the hearts and minds of Panamanians, it seems half-measures no longer suffice.\n\nAlong the borders of the canal zone, people hold up signs, they shout, hurling rocks and rotten fruit at American soldiers who hold steadfast on their orders to not engage. The more ardent of these activists wield machetes, belching threats and insults at the soldiers and their families. Some say the tension has already broken, but those on the ground will tell you that it's just beginning.\n\nNo paper, no treaty, no promise of peace can stop what is coming to the Canal Zone, and when it does, rest assured it will not be pretty."

 #Negotiations
 PAN_A_Deal_Fair_and_Square: "A Deal, Fair and Square"
 PAN_A_Deal_Fair_and_Square_desc: "If one were to walk through the streets of Panama 10 years ago and today, they wouldn't notice anything different, except the lack of a Canal Zone. To a universal amount of fanfare, a deal was struck between Panama and the United States. Posters of the presidents of both countries litter the walls of the capital. For years, it felt impossible, but was it really? What kind of an enemy was Panama to the United States, and what kind of enemy was the Yanqui to Panama? \n\nIt's a bright day in Panama. No longer can ardent nationalists curse the Zonians. No longer can the opposition claim the incumbents are selling out their greatest pride. They have been defanged. The Americans have come to their country, given them riches, and despite their mistakes along the way, they returned the canal back to Panama.\n\nLike old friends, Panama and the United States have come to an agreement, and all is forgiven."

 #Occupation
 PAN_All_Along_the_Watchtower: "All Along The Watchtower"
 PAN_All_Along_the_Watchtower_desc: "America tried concessions, they tried negotiations, and they tried to be civil. As a matter of fact, they never gave an order to fire upon the hordes of armed Panamanians when they flooded into the Canal Zone. What did that bring them? Nothing, except the loss of innocent American lives at the hands of furious, rabid mobs.\n\nNow, all the little bits of meaningless paper have been ripped up. To hell with the concessions. Panama is now back at square one, with any progress having been made on concessions and the canal itself undone. Along the borders of the Canal Zone now stand a large contingent of U.S. soldiers next to the returning zonians.\n\nFor all their efforts, the reclamation of the Panama Canal has ended in nothing except a long line of barbed wire, soldiers, and American flags where those of Panama once flew."

 ##Political
 PAN_policemen_of_nations: "The Policemen of Nations"
 PAN_policemen_of_nations_desc: "Regimes must stick together, and even if Remón finds the excesses of those such as the Trujillistas abhorrent, he knows it is not enough to just rely on the Americans. Considering this, it was little surprise to those in the know when Panama began cultivating ties with the Somoza regime in Nicaragua, a dictatorship Remón gradually came to view as a model for his own.\n\nSince then, both countries have combined their powers to stomp out any dissent to their regimes. Prisoner exchanges have become common between the two, capturing any dissidents unfortunate enough to stray too close to Costa Rica's borders before being shipped back home to a grisly fate. Intelligence agencies cooperate concerning information, as do regular security forces in training exercises, all doing their part to police their nations for America."

 #Pro-OFN
 PAN_Red_White_Bright_Blue: "Red, White, and Bright Blue"
 PAN_Red_White_Bright_Blue_desc: "Regimes must stick together, but what does one do when you are the sore thumb of Central America? If Central America is a region of Banana Republics, then Panama is Canal Country. It is only evident then, that Panama's closest geopolitical ally is the one they can attribute their independence to: The United States of America.\n\nYet, this is not the same dynamic that countries like Nicaragua or Honduras have with their Yanqui masters, Panama is treated preferably. The canal has enriched their country, with even the poor of Panama being in a significantly better position than their cousins at the whim of the banana megacorporations.\n\nIn return for their loyalty and commitment to preserving American interests, Panama is rewarded with aid, political assistance, and protection. After all, how could two countries hate each other when they share the same colors on their flag?"

 #Pro-Veracruz
 PAN_Memories_of_59: "Memories of '59"
 PAN_Memories_of_59_desc: "For any country in Latin America, it seems that their only options are the Americans, or their adversaries. Following the Cuban Revolution, aspirations of revolutionary self-determination spread like wildfire. Panama remembers Cerro Tute and the Cubans' attempt at intervention, the last time the people rose up not for some treaty or provision, but for a chance to bring revolution to Panama. Now, revolution has come, and Panama sees its third option: The Pact of Veracruz.\n\nPanama sees itself right at home next to the nations that aided their struggle not too long ago. For the first time, Panama is not some proxy or afterthought of an intern or bureaucrat in an office of a superpower's capital. Now, Panama is an equal, and that is something that no amount of aid or investment can buy. Panama is an open door, come one, come all, for no one except Panamanians decide their destiny."

 ##Path Specific
 PAN_Coroneles_and_Criollos: "Coroneles and Criollos"
 PAN_Coroneles_and_Criollos_desc: "Of the interest groups dotting Panama, the two that dominate its establishment are the military and the oligarchy. Remón's status as dictator is the most overt indicator of the National Guard's supremacy, but their despotism can't be maintained as the ends. So, while the military wields the stick, the oligarchy holds the carrot.\n\nThe predominantly white oligarchy doles out a sufficient level of welfare to keep the masses tame, spurred by Remón's progressive moods. On both sides, animosity exists toward this relationship. However, its symbiotic nature prevents any disruption owing to the self-preservation of its leaders, knowing that one without the other would guarantee a revolution."

 PAN_Reinado_de_Chichi: "Reinado de Chichi"
 PAN_Reinado_de_Chichi_desc: "There was once a time in Panama when the army was abolished. It was done so to avoid its influence against the oligarchy's political hegemony. Despite their efforts, over time the police was slowly reformed, and the National Guard took its place as the army. For all their hard work to retain their power, they have failed, for now the Coroneles run the show.\n\nThankfully for the United States, these former officers, cousins, and corrupt politicians care not for any principle of honor or independence, only their power. For Remón and his allies, they have flushed the stuffy and zealous oligarchy out of power, terminating the relationship they felt always kept Panama on the brink of a revolution.\n\nWhile the oligarchy continues to exist, they keep their hands stuffed in their deep pockets and their mouths sewed shut, watching on as their place is taken by men with chevrons on their sleeves."

 PAN_Republica_de_los_Coroneles: "República de los Coroneles"
 PAN_Republica_de_los_Coroneles_desc: "There was once a time in Panama when the army was abolished. It was done so to avoid its influence against the oligarchy's political hegemony. Despite their efforts, over time the police was slowly reformed, and the National Guard took its place as the army. For all their hard work to retain their power, they have failed, for now the Coroneles run the show.\n\nYet while Remón pursued a balance, Martínez does not believe in dealing with "fat monkeys". Those sellouts have given up Panama to their friends and family, while fooling the masses with tales of democracy to keep them distracted from the embezzlement of our coffers and dignity. But not to worry, Martínez has the solution.\n\nThere will be no democracy and no balance, there will only be order and progress. The oligarchs can go cry into their bags of money, Martínez has a country to fix, and his National Guard will be the only ruler of Panama."

 #Arias Path
 PAN_Presidente_Para_Panamenos: "Presidente Para Panameños"
 PAN_Presidente_Para_Panamenos_desc: "Panama has long been a game of tug-of-war between the two principal interest groups of the National Guard and the oligarchy, but what about the people? With the National Guard in complete disarray following the protests against Remón, it would be natural for the oligarchy to strike and regain their dominance, and their longtime enemy is now their man.\n\nA champion of the nationalistic sentiment in Panama, Arias crafted his persona as a humble man and fierce advocate for the independence of his nation to appeal to Panama's poor and disaffected, putting him at odds with both the oligarchy and National Guard.\n\nBut he has struck a deal with the oligarchy to keep him in power. Arias will use the mobs that chant his name to eradicate the influence of the National Guard. Third time is the charm, and it does not matter to Arias if the oligarchy sits atop Panama, for the presidency is finally his."

 PAN_El_Presidente_Panamenista: "El Presidente Panameñista"
 PAN_El_Presidente_Panamenista_desc: "Arias has done it. From the days of exile declaring "¡Volveremos!", he now stands atop the nation unopposed. The oligarchy now stands with him in tandem as the ringleaders of Panama. The masses chant his name, harass his enemies, and wave the flag like never before. It's as if no one can even remember when the National Guard had a say, but rumors persist surrounding Arias's affinity for power.\n\nRumors, however, are just rumors. Arias now can spearhead his vision. Welfare for the masses, and Panama for Panamanians. No need to cosy up to Washington. Arias seeks to rid his country of the dregs that keep his people suffering: the black West Indian and Asian workers imported by the Yanquis that steal the jobs and homes of Panama's needy.\n\nNo longer will American firms leech on the most arable land while native farmers live in squalor. Every inch of Panama will serve its people, and only its people."

 #Dem Path
 PAN_Republica_de_la_Dignitad: "República de la Dignidad"
 PAN_Republica_de_la_Dignitad_desc: "With Remón gone, the balance of power has shifted once again back into the hands of the oligarchs. With a complete dominance of the political scene since independence, one must realize that not all oligarchs are power hungry or disconnected from their people. On the contrary, some have studied political thought, and have used their riches to enrich themselves intellectually. These can be found in the National Liberal Party.\n\nTheir shining star is Roberto Francisco Chiari Remón, a man known as the "President of Dignity". A firm believer in democracy, he seeks to ensure that not only Panama's political scene is honest and free, but that its international standing is as well.\n\nHis opponents struggle to find a divisive issue, for everything they accuse him of, they are themselves. He may be a pro-American man of privilege, but he also may be the most dignified man to hold the presidency yet."
 
 PAN_Republica_de_la_Dignitad_2: "República de la Dignidad"
 PAN_Republica_de_la_Dignitad_2_desc: "With a complete dominance of the political scene since independence, one must realize that not all oligarchs are power hungry or disconnected from their people. On the contrary, some oligarchs have studied political thought, and have used their riches to enrich themselves intellectually. Oligarchs like these can be found in the National Liberal Party.\n\nWith their first term a rounding success, the PLN has secured control over the political scene of Panama. They hold the attention of the people, utilizing mass welfare and national development to sway the masses. Their consolidation of reliable democratic institutions has spurred their successive reelection in processes that, for one of the first times, are free and fair.\n\nThe National Liberal Party has done the impossible, they have taken a republic split between oligarchic businessmen and colonels, and created a republic of dignity."

 PAN_Downsides_of_Democracy: "Downsides of Democracy"
 PAN_Downsides_of_Democracy_desc: "The National Liberal Party was able to tear down the Somoza-style system that was in place under Remón. They were able to consolidate a democracy, but not their power. Power in Panama no longer comes from who you know or how many soldiers you command, now, it comes from votes, and the National Liberal Party and its oligarchs have lost their mandate.\n\nComing to power on a wave of anti-American sentiment, Boyd has used a democracy sponsored by the United States to turn it into their foe. A conservative strongman, championing the traditional statements wielded by every Latin American Caudillo, has captivated the people of Panama by shifting their attention to the Canal.\n\nFor all of their work, the PLN and their American-backed oligarchs had failed to take account of the downside of democracy, that despite the campaigning and work you can put in - you can always lose at your own game."

 PAN_El_Proximo_Domino: "El Próximo Dominó"
 PAN_El_Proximo_Domino_desc: "Following the Cuban Revolution in 1959, the world saw how a people could come together and gut their country of strongmen. As revolutionary fervor swept across the region, it first landed upon the shores of Panama in April of '59. The uprising was crushed, but bullets cannot kill ideas. With American influence shattered with Remón's fall, subsequent elections have led to a revolution by the ballot.\n\nFloyd Britton, a survivor of the expedition, sits atop of a nation that has long been oppressed, and there is only one way to fix it: from the ground up. Already crowds of leftist, anti-American students swarm the streets, as militiamen march into oligarch's firms and declare them nationalized.\n\nOfficers of the National Guard find themselves dismissed, if not having already fled. Panamanian society will be flipped on its head, as it is ruled by neither oligarch or soldier, but the common man."

 PAN_Una_Revolucion_Cultural: "Una Revolución Cultural"
 PAN_Una_Revolucion_Cultural_desc: "Panama has never truly had its own country. Its people have always been smothered, either by tinpot dictators, or by oligarchs who have laughed at their people's anguish. How can a people's revolution make do with the systems of a country that has never been for the people? Floyd Britton is not some sellout. He is the leader of the Panamanian Revolution. He and his country will not be stopped by laws imposed on them by the spokesmen of the Yanquis.\n\nChange will come to Panama. Britton's militiamen will rip out the memory of the Guardsmen and the ultra-rich, and return their wealth to the people. The Yanquis have bled this country dry far enough, and Panama will stand for it for not a second longer.\n\nEver since the uprising of Cerro Tute, Britton has been waiting to break the chains that keep his people under domination, and he will not allow the past to betray his dream of a free Panama."

 PAN_A_Calm_Revolution: "A Calm Revolution"
 PAN_A_Calm_Revolution_desc: "Panama's political scene has long been a chaotic tragedy of oligarchs, National Guardsmen. American hegemony over the country has seen only illegitimate dictators or sellouts take the presidency, fostering opposition that would explode into extremes when given the chance to govern. Where does that leave the people, the eternal victims of Panama's presidencies? Without a chance to choose their own destiny.\n\nThe PdPdP seeks to bring change inspired from the Cuban Revolution to Panama, without Caudillos and upending the political systems of the nation. To tame the National Guard excesses, and put a muzzle on the oligarchs. Too much fervor will only bring about a dictator of the opposite extreme to Panama.\n\nNo longer may the Americans dominate our country, but neither can we call for their heads. Change will come to Panama, to make it a country of its own people, but it must come within reason."

 PAN_Coroneles_y_Calma: "Coroneles y Calma"
 PAN_Coroneles_y_Calma_desc: "Panama has long been a cacophony of diametrically opposed views and rabid hatred of political enemies. The oligarchs hate the National Guard, who despise them in return. Remón was too corrupt for his own good. What resulted was an extremist takeover, a David against Goliath, but life not the Bible and God is surely not on the side of Panama. Who is to bring back reality? Omar Torrijos.\n\nEnough of these compromises that have brought nothing but universal hatred among every interest group in the country. Torrijos presents a novel solution: Just give everyone what they want. He dishes out land grants and welfare to keep the people satiated. To the oligarchs, he lets them retain their businesses. To the Americans? He keeps Panama the loyal country they always wanted.\n\nThere may be another strongman desecrating the presidential office, but for the first time in years for Panama, there is calm."

 PAN_Peace_for_Panama: "Peace for Panama"
 PAN_Peace_for_Panama_desc: "The sight of camo-fatigued soldiers strolling down the streets of Panama City was never an uncommon sight. Yet, to a degree like this? Unheard of. Jeeps, armored personnel carriers, tanks, even policemen on horses swarm the streets. Around them are the grumbling citizens of Panama, grateful to be alive, but regretful at the state of their country. Panama is just a figment of their imagination to them.\n\nThe national flag is nowhere to be seen, banned due to the fear of inflaming the nationalist cause in the country if anyone merely dirties it. Their buildings bear the scars of shrapnel and bombs, done so by the peacekeepers and the rabid defenders of the city. Although the people may complain, cursing the Yanqui occupiers, they care more about getting by day to day. No one could care less who is in charge when you have no food on your plate, or money in your pockets."

 #######################
 ##Leader Descriptions##
 #######################

 POLITICS_RIDLEY_DESC: "Alright so if your expecting some obscure Panamanian madman that would fit the BurgSys ideology or a funny joke, i got neither.\n\nSo Ridley is commonly put on the lower end of mid-tier, and this placement is clearly bullshit and heres why. First off, all of Ridley's smash attacks are crazy, with side B K.Oing at like 40% and his down smash having enough range to cover any ground recovery from a ledge. Thats not even bringing up Ridley's up smash which is almost as destructive as Ganondorf's up smash with the same range, and faster. *Almost* every Ridley arial is good, with back air dealing considerable damage and front air being easy to land and can easily keep the other person from recovering properly. Then theres his up air that completely dicks over any character even close to the top blastzone. His spike sucks, but thats really it (even with the spike though it has it's uses).\n\nThen there's his specials, which are all decent to fantastic. Ridley's side B is an incredibly useful commmand grab that instantly grants you control of the stage. Then theres his up special which, admitedly, isn't the best recovery, but coupled with Ridley's extra jump makes it servicable. Plus it's high damage output and knockback leave it as a solid attack too. His neutral B is a great projectile move, which is basically just Mario's fireballs but better and more of them. Finally, skewer is cool.\n\nRidley's biggest weakness is it's size and lack of armor to justify it. But, its solid air maneuverability keeps it from just being a sitting duck, and it's multitude of great attacks, atleast in my opinion, make up for it.\n\nSo, to conclude, make Ridley high mid-tier to low high-tier.\n\nAlright, TED Talk over."


 #### Pre-1968 Election
 PAN_Martyr_Day_tt: "§RPanama burns...§!\n§YA new intelligence Mission has been unlocked.§!"
 PAN_Back_Remon_tt: "\n§FAs the saying goes, better the Devil you know...§!\n§YWe will choose to back §sRemón's Dictatorship§! in the §xMartyr's Day Riots.§!§!\n\n§RThis will radicalize the §Vprotesters§!.§!"
 PAN_Back_Protests_tt: "\n§F...and we are here to add to the fire.§!\n§YWe will choose to back and coopt the §Mprotestors§! in the §xMartyr's Day Riots.§!§!\n\n§RThis will radicalize §hPanama's§! §LOligarchy§!.§!\n§FPicking a fight with §Lthem§! will be costly, but it may draw §hPanama§! closer to the §mOFN...§!§!"
 PAN_Operation_Over: "§YWe have done all that we could, time will tell if it has been enough.§!"
 PAN_Martyr_Day_Lost_tt: "\n§FWe have §Rfailed§! to handle the §xMartyr's Day Riots§!, and §lPanama's§! §mOFN-backed Government§! has been ousted. Already the new §sAnti-American Regime§! is agitating against our ownership of the Canal\n\n§xWe best be prepared to answer them.§!§!"

 PAN_forpol.1.t: "Martyr's Day"
 PAN_forpol.1.desc: "The phone call came just after midnight, and though Ambassador Farland had anticipated it, the sheer force of President Remón's anger caught him off guard.\n\n"Your boys think Panama is a playground!" he snapped. "They push our people around in Colón, wave rifles like they own the damned Canal, and you expect me to keep smiling and waving?"\n\nThough rage choked his words, the seasoned ambassador caught the undertone of fear. Remón had staked his political future on cooperation with the United States, but every incident chipped away at his credibility with the people, and more dangerously, with the National Guard. That nationalism, once his greatest political tool, was now a loaded gun pressed to his own back. Farland responded in his usual calm tone.\n\n"We understand your concerns. I'll speak with the base commander. We both want a stable, prosperous Panama, don't we? This was just a one-time incident, you know how soldiers can be. There'll be some extra allocations made for the families, it'll work out just fine. "\n\nBut as he hung up, Farland's mind was elsewhere. Remón was useful, but volatile. If unrest escalated, or worse, if the strongman lost the oligarchs - which was the single reason he was even tolerated - would the other excesses of his administration come back to bite Washington in the ass? Even now he could see some upstart young journo sniffing around for whispers of the FBI's dirty laundry. Perhaps, just perhaps, it was time to start laying groundwork for a different path. After all, it wasn't Remón who really ruled the roost in Panama, and 'democratization' was a very powerful method of shitting away political outrage."
 PAN_forpol.1.a: "He's been useful so far. With a little more leverage, he'll be even more so."
 PAN_forpol.1.b: "Come and mop up, boys. We're done here."

 PAN_forpol.2.t: "The Fix Is In"
 PAN_forpol.2.desc: "From: Office of Central American Affairs\nMemorandum for the Director\nExecutive Intelligence Report: Remón Consolidates Power\n\nFollowing Bureau involvement during the Martyrs' Day protests and subsequent unrest, conditions on the ground in Panama have stabilized. As projected, limited but well-timed support enabled President José Remón Cantera to reassert control over the security apparatus and neutralize key opposition figures ahead of the scheduled vote. Agents were able to infiltrate opposition offices and redirect concerns about protocol and procedure into rendering them ineffective.\n\nThe election proceeded with minimal interference from rival actors or foreign parties from the Pakt or Co-Prosperity Sphere. President Remón's re-election was successfully executed with Guard backing and minimal foreign media access. Our channels report morale within his inner circle is steady, though paranoia remains high. Since securing his position, Remón has moved swiftly to disband or absorb opposition unions, reassign dissident officers, and strengthen his control of the legal system. Press outlets flagged as "unreliable" have seen increased scrutiny or closure, which has also helped in keeping American outlets that fail to respect our mutual agreement out of Panama City.\n\nMembers of the OAS and OFN have issued statements of concern, but U.S. policy remains noncommittal, and sufficient evidence to connect the Bureau with Remón's victory is lacking. As of this writing, the Bureau maintains active influence within the Guard's leadership and with any potential planners of another coup. Remón has kept to his side of the arrangement. For now, his value as an asset holds strongly."
 PAN_forpol.2.a: "Fidelity, Bravery, Integrity."

 PAN_forpol.3.t: "An Avalanche in Twenty Years"
 PAN_forpol.3.desc: "From: Office of Central American Affairs\nMemorandum for the Director\nExecutive Intelligence Report: Rising Authoritarian Actions in Panama\n\nPanama City continues to fall deeper and deeper into authoritarianism. While [PAN.GetLeader] has previously limited himself to covert means to secure power, these have no longer been seen as sufficient. By order of the Panamanian administration, the National Liberal Party, the chief political opposition in Panama, has been outlawed, its leaders jailed, and its assets nationalized as the latest effort to crack down on national dissidents.\n\nPrimarily the party of Pro-America, Pro-OFN, liberal-leaning elites, the National Liberals has seen their substantial wealth divided between cooperative oligarchs and cronies of Remón's government, lending the dictatorship a public opinion coup amongst the remaining members of the upper class.\n\nWhilst the government has attempted to reassure our ambassador that this was a move of necessity, Remón's standing with Washington will undoubtedly suffer. The internal reaction to the coup amongst middle and lower class Panamanians has been largely negative as well, with consensus being that it further justifies the recent Martyrs' Day protests and cements the decline of Panama's democracy.\n\nThis shift against the government will inevitably affect the populace's opinion of Panama's partners in the OFN, OAS, and even of the United States directly. It is possible this may lead towards a reorientation of the remaining opposition, the left-leaning PPP, but also the dissident nationalists in the Guardia Nacional and CPN, towards anti-American regimes."
 PAN_forpol.3.a: "Fidelity, Bravery, Integrity."

 PAN_forpol.4.t: "Panama Canal Negotiations"
 PAN_forpol.4.desc: ""You've backed me into power. Now let me have actual governance." President José Antonio Remón Cantera leaned forward, fixating his eyes on the American senator who flew down here to negotiate the status of the Canal Zone. The rain outside knocked on the window with the rhythm of a ticking clock. "All we want is partial governance of the Canal, just a seat at the table."\n\nThe senator's face remained still, tapping his fingers lightly on the table. "President Remón, Washington understands your plight. However, the Canal is vital to our economy, to our navy, and to global trade." The senator took off his glasses before wiping them with a handkerchief. "No one in Washington will celebrate giving up one of our most prized possessions."\n\n"What about my people, Senator?" Remón couldn't hide his desperation. "We silenced the radicals, kept the communists out, and put Panama in line with your ideals. I will tell you this now, Senator. If you deny us our right to the Canal, you will lose this country."\n\nThe senator didn't budge. A heavy silence lingered in the air, with only the rain making the faintest of sounds in the negotiation room. Outside, past the buildings and streets, the Canal stood as a testament to human ingenuity. A wonder of the world, carving through the isthmus, only possible through Panamanian and American labor.\n\nRemón's words may have been a warning, not a threat. Is the Canal worth losing Panama?"
 PAN_forpol.4.a: "Dissolve the Canal Zone but maintain some strings."
 PAN_forpol.4.b: "Yes, yes it is. The rest is Remón's problem, not ours."
 PAN_Remon_Warning_tt: "§RIf Remón's warning proves true, they will rapidly become our problems as well.§!"
 PAN_Overjoyed_tt: "§GThe Panamian people will greatly appreciate this decision§!... §RAmerica's business circles will not.§!"

 PAN_forpol.5.t: "Persistent Remónism"
 PAN_forpol.5.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM: CECIL LANDRY\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: Extension of Remón's power in Panama\n\n1. Thus far, José Antonio Remón Cantera has defeated all real opposition to his regime. However, recently, he has begun trying to install a local cult of personality, potentially based off of the Somoza model in allied Nicaragua. This is not likely to be a major issue, but could risk him becoming more erratic and, should he perceive us being a threat, anti-American.\n\n2. There is no firm programme for building his cult of personality, but its progress is visible nonetheless. Several people close to us and Remón have noted that a shift towards paranoia as of late. Media outlets in the region now treat him as the ultimate realisation of Panamanian nationhood. Efforts to define his own state ideology are in an early, but visible stage.\n\n3. Whilst not desirable in the long-term, these developments aren't a significant concern immediately. However, there have been signs of anti-Americanism within his earlier term, especially in the treaty of 1955. Unmoored from external pressures beyond us, and increasingly erratic, there is the risk that he could begin acting out against us."
 PAN_forpol.5.a: "AND YE SHALL KNOW THE TRUTH AND THE TRUTH SHALL MAKE YOU FREE."

 PAN_forpol.7.t: "Martínez's Junta"
 PAN_forpol.7.desc: "Per internal memorandum from Ambassador Farland, Bureau activities in Panama have shifted in recognition of the shift in domestic politics. Following sustained unrest after Martyr's Day and mounting public pressure, President José Remón Cantera was forced to withdraw from the upcoming election. Initial assessments pointed to a likely victory for Arnulfo ARIAS Madrid, raising alarm within the National Guard, oligarchs, and in Bureau assessments leading to the possibility of external involvement increasing dramatically.\n\nOn the eve of the scheduled vote, Colonel Boris MARTÍNEZ Salazar, acting with the backing of senior Guard officers and economic stakeholders and with our support, declared a state of exception and assumed control. ARIAS and several opposition figures were placed under detention or house arrest. Colonel MARTÍNEZ has since dissolved the electoral commission and suspended constitutional deadlines.\n\nPublic justification focused on the threat of "radical destabilization," but journalists of the international press will most likely portray this shift as an effort to preserve the Guard's autonomy and prevent a populist civilian from undermining its position. MARTÍNEZ has made no pretence of democracy, despite advisors from the State Department suggesting otherwise, openly stating his intent to govern "until stability is assured," and has begun reshaping the government to reflect a permanent military presence. Civil ministries remain, but direction flows from the Guard's command council with no competition existing even in the form of a controlled opposition. Prominent business figures have signalled cooperation, seeing the junta as preferable to renewed disorder, and the new regime remains hospitable to Bureau activities for the time being.\n\nThe State Department recommends minimal public comment, which we concur with. Should MARTÍNEZ prove to be more trouble than he is worth, other options remain (see pages 23-25 of this report)."
 PAN_forpol.7.a: "Let's hope he remembers who gave him his bronze crown."

 PAN_forpol.8.t: "Panama: Update on Martínez Junta"
 PAN_forpol.8.desc: "SECRET\n\nFrom: LEONARD FRANKLIN\nMEMORANDUM FOR THE PRESIDENT\n\nSubject: PANAMANIAN GOVERNMENT ALIGNING WITH HOSTILE INTERESTS\n\n1. General Boris Martínez's military government is increasing overtures with regional anti-US leaders in an attempt to assert independent foreign policy. Coupled with increasing rhetoric against US interests, it is apparent that this is more than political rhetoric designed to pacify the population, Martínez seeks to break Panama away from American influence and align with other powers.\n\n2.HUMINT sources within Panama have highlighted Martínez has made closed-room deals with anti-US forces in an attempt to secure arms and have increased drills among several of his most elite and trusted military units. Sources indicate that Martínez's most likely target would be the Panama Canal Zone. The Canal is a tempting prize for Martínez to secure national prestige along with gaining transit fees for ships to use the Canal. The effect of losing control of the Canal would be significant for US military readiness and deployment capability as well as providing a devastating effect to the US economy.\n\n3.Martínez's hold on the country is not secure. Opposition groups have criticized Martínez's junta since he took power, and supply shortfalls and other economic hardship have created a not-insignificant dissident movement within the country. Intelligence efforts in the region will be directed toward destabilizing his base of power with the goal of ensuring that the Canal remains secure within American hands and preventing anti-American powers from gaining a secure foothold in Central America."
 PAN_forpol.8.a: "AND YE SHALL KNOW THE TRUTH AND THE TRUTH SHALL MAKE YOU FREE."

 #Deprecated
 PAN_forpol.11.t: "Arias's Anti-Americanism"
 PAN_forpol.11.desc: "Interesting overtures have been made to the Foreign Ministry in recent days, from diplomats aligned with the new Panamanian government under President Arnulfo Arias. Although Panama has, in general, been under the American thumb for many years now, Arias seemingly desires to change this.\n\nAccording to our resources in the region, he has been taking steps during this first term to purge the Panamanian National Guard, traditionally a focus of pro-Americanism (beyond any obvious military potential), of such elements. Replacements for those purged have been, uniformly, much less pro-American. This trend has been observed to be happening across many other state and government agencies within Panama as well.\n\nArias himself has worked to portray himself as a Panamanian nationalist, committed to the country and people, a sentiment attractive to the general population. However, he has made it clear that he is more than willing to work with us - or potentially others, should we not respond - to remove American influence and realign his nation. It is considered likely that he will want personal enrichment or direct support to strengthen his authority in return for doing so. Or, even more likely, both.\n\nIf we are to take advantage of this opportunity, we must move quickly. The Americans will doubtlessly have noticed Arias' actions as well, and they will not sit quietly by while a nation as strategically vital as Panama drifts out of their orbit."
 PAN_forpol.11.a: "A new alignment."

 PAN_forpol.12.t: "Arias Strikes First"
 PAN_forpol.12.desc: "With the Martyr's Day protests now at their loudest, it was perhaps only a matter of time before a regional player took advantage of the chaos to forward their own agenda, especially if it meant a chance for putting the boot to American interests in Panama. With protesters' demands for Remón not to seek reelection tying the government's hands, the plurality of the vote was inevitably going to wind up in the hands of an Anti-American agitator.\n\nThis arrived in the form of the new President Arias and the CPN, who wasted little time in taking the situation from bad to worse. Almost immediately upon assuming power in Panama City, the National Guard came under siege by paramilitary irregulars. With the tacit endorsement of Arias and the CPN's backing, the Nationalist militiamen conducted joint attacks on prominent military figures alongside any and all party opposition.\n\nThis coup at the ballot box is as much a disaster for American foreign policy as it is for Panamanian democracy, one that charts a map of things to come as America's sovereignty over the Panama Canal comes under immediate threat. It will take some time before Arias' regime is fully consolidated and the military brought under his influence, but the target of the CPN's irredentia is clear for all to see."
 PAN_forpol.12.a: "The fires reach the Canal."

 ### REWRITE ME
 PAN_forpol.13.t: "Arias's Anti-Americanism"
 PAN_forpol.13.desc: "Since Remón's fall from grace in Panama, our influence in the country has waned in the year since Arnulfo Arias took power. Dedicating his first term to eradicating the National Guard's political influence, Arias has also gone out of his way to replace the older and more experienced officers with his own loyal lapdogs.\n\nThe Panamanian National Guard, one of the more Pro-American factions within the country's politics, has been severely handicapped under the Arias regime. Several high-ranking officers, most notably General Bolívar Vallarino, have been fired from their positions in the Panamanian National Guard due to their loyalties towards America and opposition to Arias. However, a few pro-American officers have been able to avoid the purges and may prove useful should we consider our contingencies.\n\nAdditionally, the Arias government has made friendly overtures to foreign powers with influence in the region. He has explicitly stated his intention to realign himself with any power willing to liberate Panama from American control. It is highly likely that at least one nation will heed his call. This will threaten our control over Panama, and very likely our control of the rest of the Western Hemisphere, should we let this one country fall to tyrannical hands.\n\nOther nations undoubtedly have already noticed the chink in the Western Hemisphere's armor and are moving to exploit it. We cannot, and should not, sit idly by while the waters of Panama grow ever more troubled and turbulent."
 PAN_forpol.13.a: "We have many contingencies..."

 #CIA Op for Coup Success - PAN_forpol.40 is the follow-up
 PAN_forpol.14.t: "For Want Of A Hero"
 PAN_forpol.14.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM: CECIL LANDRY\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: PANAMANIAN COUP CANDIDATE - NATIONAL GUARD OFFICER OMAR EFRAÍN TORRIJOS HERRERA\n\nIn order to secure American interests in Panama, the FBI has conducted screenings within the Panamanian National Guard for potential candidates to lead a coup in the country. The most likely and competent candidate is Omar Efraín Torrijos Herrera. A successful coup will have the potential to align Panama with the Organization of Free Nations (OFN) again.\n\nMultiple American sympathizers within the Panamanian National Guard have vouched for Torrijos' personable and charismatic character. Private investigators have noted Torrijos visiting campesino peasants in the countryside every weekend. It's likely that he will be popular amongst the rural base of Panama.\n\nIn terms of Torrijos' ideological positions, it remains unclear the extent to which he will collaborate with American needs. However, being both a Panamanian strongman and having voiced resentment against the incumbent administration, he could be useful in creating a stable Panama away from the unfavorable status quo.\n\nIn securing our interests in Panama and protecting the Canal Zone from the current administration, it is best to support Torrijos and the Panamanian National Guard. Operations to funnel cash and arms to Torrijos are underway."
 PAN_forpol.14.a: "Fidelity, Bravery, Integrity."

 #Dem Path
 PAN_forpol.17.t: "Panamanian Liberalism"
 PAN_forpol.17.desc: "Despite the bloodshed of Martyrs' Day, Panama—after for what felt like an eternity under Remón's iron rule—has finally returned to the ballot box. In a tightly monitored election, Roberto Francisco Chiari Remón of the Partido Liberal Nacional (PCN) has emerged victorious.\n\nAlthough his candidacy was quietly championed by American backchannels, Chiari's ascent was celebrated with optimism. Panama City was flooded with crowds waving the vibrant tricolor, celebrating not just a candidate, but the return of liberalism to the isthmus. Beyond some nationalists worried about potential American influence, the elections have been widely regarded as legitimate.\n\nStill, the shadow of Martyrs' Day lingers. Across the country, candles flicker in windowpanes and names of the fallen are carved into crosses and tombstones. The carnage in the canal is now etched into the soul of Panama. Chiari's administration is expected to back American interests, but the memories of those gunned down would not vanish in a single election.\n\nThis is no return to utopia, at least not yet. But it marks the beginning steps towards healing a broken nation. In the eyes of the State Department, the right man won—and he won it the right way."
 PAN_forpol.17.a: "The canal flows with water—and now blood."

 PAN_forpol.18.t: "Democracy in Panama"
 PAN_forpol.18.desc: ""We're not asking for miracles here, Senator." The Panamanian president locked eyes with the American official from across the table, voice taut like a bowstring. "We only ask for some concessions in the Canal Zone."\n\nAcross the table, the American leaned forward, expression unreadable, eyes clouded by the glint of his glasses. "And we're not asking for miracles either, President Chiari. Our fleet needs to defend two oceans, and we can't do that if we don't control the Canal Zone."\n\nChiari's jaw tensed. On the streets, chants grew louder and louder as the memories of the Martyrs' Day sacrifices remained unforgotten. How many students had to die for Panama to be recognized as more than a gateway to the Pacific? How many more would die if he failed to secure Panama's dignity?\n\n"If I walk out of this room with nothing, Senator," Chiari said, pointing at the windows, "my party's finished. I'm finished. The OFN here is finished. And god forbid the next man in power thinks Tokyo or Madrid could strike him a better deal. We just want a cut of the transportation fees and Panamanian soldiers with American soldiers there."\n\nChiari looked through the windows. Past the stone streets and buildings. Past the tangled arteries of the city, waiting for an answer from the room. He could hear the waves, reaching for one another through America's Canal. Two halves of his nation vying for each other through America's Canal.\n\nOne day, it would be Panama's Canal. One day, his nation would be whole."
 PAN_forpol.18.a: "Give them the Canal in its entirety. It's about time they have it back."
 PAN_forpol.18.b: "Economic concessions and Panamanian soldiers won't hurt."
 PAN_forpol.18.c: "No deal. We built this Canal, we're going to keep it."

 #Red Path - Also includes some 1968 election events due to formatting issues
 PAN_forpol.21.t: "The Red Flag Briding the Isthmus"
 PAN_forpol.21.desc: "Despite our best efforts in stabilizing the Remón dictatorship, the blood of Martyrs' Day did not readily dry. The massacre of Panamanians became a rallying cry against Remón and against the OFN. Mass demonstrations swept Panama and under the unrelenting pressure, Remón was forced into exile.\n\nThe elections that followed did not go in our favor. Floyd Britton's Partido del Pueblo Panameño (PPP) swept into office in a landslide, a coalition glued together by a common hatred for American imperialism. A formerly fringe political party now governs the isthmus that intends to drive our troops out of the Canal Zone.\n\nSweeping reforms are underway. Oligarchic assets? Seized. The National Guard that had been under our thumb? Purged. Land belonging to our corporations and the United Fruit Company? Distributed back to local cooperatives. Our influence within the region is slowly cracking and Britton's goal is clear: Panama for Panamanians.\n\nYet, behind the revolutionary fervor is a time for mourning. Makeshift shrines can be found every couple of streets in Panama City and Colón. Their candles flickering alongside marigolds and chrysanthemums. The flames glow illuminate the faces of young students who believed in an independent Panama. Beneath all the rhetoric is a silence too heavy to ignore.\n\nPanama has chosen a new path. It is almost certain that we will not be a part of their journey."
 PAN_forpol.21.a: "Through loss, they have charted a new path away from us."

 PAN_forpol.22.t: "Canal Through Troubled Waters"
 PAN_forpol.22.desc: ""Let's keep the negotiations short, Senator." President Floyd Britton of the Partido del Pueblo de Panamá (PPP) looked dismissively at his American counterpart before sorting through some of his papers. "We're not here to bargain over anything. We want the Canal Zone in its entirety."\n\nThe American senator scoffed at his arrogance. Everyone in the White House knew this day would come, but it still didn't soften the impact of those words. He adjusted his glasses before gathering some diplomatic words together. "President Britton, Washington has made it clear that these transfers of territory take time. There are logistics, contracts—"\n\n"Time?" Britton snapped, his voice rising. "We've given you decades! We've given you blood, sweat, and tears! We've given you everything, and we got nothing but dead children in the very Canal our ancestors built for you! And all you did was ship oil and steel to your global empire like Panama is nothing but a corridor!"\n\nBritton leaned across the table, knuckle pressing on the hardwood desk, spit sprayed all over. The senator adjusted his tie, trying to get some words out. "President Britton, if we could just come to an understanding—"\n\n"Perhaps I haven't been speaking your language." Britton interrupted, calming his volume down while still keeping his cold demeanor. "Return the Canal. Dismantle all military presence. Pay restitution for this occupation. Otherwise? We walk away from your sphere of influence for good."\n\nThe senator remained silent. Nothing could be heard in the room other than the distant chants of protesters, growing louder in the streets. And they were getting impatient."
 PAN_forpol.22.a: "He will see what becomes of America's foes."
 PAN_forpol.22.b: "Concede the Canal."
 PAN_Political_Shift_tt: "§YThis choice will have a massive effect on how Latin America as a whole perceives us.§!\n"

 PAN_forpol.23.t: "US-Panamanian Split"
 PAN_forpol.23.desc: "The microphone turned on.\n\nThe stage was not large, but the backdrop - the passing freighter, the rushing waters, and the distant U.S. flag flown above barbed wire - was perfect. Floyd Britton, President of Panama, walked to its bare center, tie fluttering in the breeze. There was no need for podiums, no need for notes. Not when it was all so clear.\n\n"The Panama Canal is more than our people's opportunity for economic prosperity, it is our sovereign right. This occupation, against the express wishes of the Panamanian people, is more than a plot to seize our natural wealth and the fruits of our labors. It is a crime. Let it remind our Latin American brothers and sisters that there is a country - yes, one all too near, which will rob you as it has robbed us. So long as this Canal is kept from Panama's waiting hands, remember this wrong and join with us to right it!"\n\nThe microphone would carry his voice to the roaring crowd, full of veterans of the protests that toppled Remón and students eager for their own chance at glory. It would blare through the radio of the offices of the Partido del Pueblo de Panamá, with its exuberant staffers, and through the tinny speakers in the alleyways of Colón. It would force his words through the new television sets of Panama City and into its furnished rooms, where anxious hands were knit together. It would, just barely, provide an inaudible whisper to the distant Yanqui soldiers watching the proceedings through binoculars with a mix of incomprehension and curiosity.\n\nAnd soon its vibrations would spread still further."
 PAN_forpol.23.a: "Across Latin America, and the superpower beyond."

 PAN_forpol.24.t: "Radical Turnover"
 PAN_forpol.24.desc: "Top Secret Memo from the Embassy to Panama\n\nPresident Floyd Britton, former student activist and head of the leftist Partido del Pueblo de Panamá, has canceled his nation's upcoming presidential elections. He declared that retaking the Panama Canal is a national imperative, and that the elections offered a chance for unspecified 'malevolent' forces to intervene and frustrate that mission.\n\nMarches by the ruling PPP, university students, and labor organizations in Panama City and Colón, and David forestalled any serious opposition protests immediately following the cancellation. Additionally, toughs forced their way into the offices of La Estrella de Panamá to prevent publication of critical coverage.\n\nThis step toward dictatorship follows the suppression of leading opposition parties, as well as widespread seizure of private businesses. These range from factories owned by North Americans, to humble bakeries. It is my determination that Britton and the PPP are seeking to create a one-party socialist state.\n\nWith tensions escalating rapidly between the United States and Panama's government over the Canal and economic measures, our current ambivalent stance is becoming untenable. In the coming weeks, I anticipate the U.S. will move to expel Panama from the Organization of American States."
 PAN_forpol.24.a: "And what will become of the Canal then?"

 ### 1968 Election Onwards
 #MARTINEZ
 PAN_forpol.26.t: "Ambitions of General Martínez"
 PAN_forpol.26.desc: "CONFIDENTIAL\n\nTO MINISTER OF FOREIGN AFFAIRS\n\nPANAMA - CENTRAL AMERICA\n\nPanama plans to imminently annex the Panama Canal Zone. Our agents within the Panamanian military have discovered that plans are now in motion to ensure the annexation. Most expectations skew towards the idea of a quick war, with negotiations moved on at pace, hoping to turn the seizure into a fait accompli and a potential American counteroffensive into a propaganda coup for Martínez internationally.\n\nPropaganda toward reconquering the Canal is now a key focus of Martínez's public image. Citing past agreements as insulting to Panama's security, and often targeting past governments and scapegoats, the media highlighted American injustice, committed through the decades, to ensure its continued control over the zone. Government policy seems to have slowed down on other topics, and government bureaucracy is increasingly preparing for integration.\n\nThere is little we can do to support this without greatly escalating the war, although Panama has directly sought our backing in this. The seizure of the Canal will disrupt international trade, and could have ramifications for us, but the American and Japanese economies will likely see greater damage. We could potentially offer some clandestine help, either through arms or sabotaging American positions, but those carry grave risks if discovered or if the invasion totally fails."
 PAN_forpol.26.a: "America's Achilles' Heel could soon be broken."
 PAN_Economic_Destabilization_tt: "§RInstability near the Canal is bad for business.§!"

 PAN_forpol.27.t: "The Colonel's Letter"
 PAN_forpol.27.desc: "Extract from a classified message by Boris Martínez\n\n"To Washington, anyone who refuses to kiss the boot on their neck is a criminal.\n\nFor sixty years, the American empire has choked our nation, slicing Panama in half for their own commercial interests. They have built a state within a state, where our laws hold no weight and our people are treated as servants. But the National Guard no longer protects corrupt oligarchs. We have taken the destiny of our country into our own hands. And now, our primary objective is to tear the splinter of American imperialism from our flesh and reclaim the Canal Zone.\n\nYou are the ones who have challenged American hegemony on the world stage. We share a common enemy, and right now, my soldiers are tightening the noose around his most vulnerable trade artery. We are ready to sever Uncle Sam's jugular. But for this decisive strike, we lack the proper tools.\n\nWeapons. Rifles, explosives, ammunition. Arm Panama, and we will deliver a blow to the United States in their own backyard from which they will spend decades recovering.\n\nThe choice is yours. But remember this: the Canal will be ours, with or without your help.""
 PAN_forpol.27.a: "A blow to Uncle Sam's trade routes?"

 #ARIAS
 PAN_forpol.28.t: "Arias's New Regime"
 PAN_forpol.28.desc: "CONFIDENTIAL\nPANAMA - CENTRAL AMERICA\n\nNow in his third term as President, Arnulfo Arias seems to have fully embraced fascism. With little remaining domestic opposition, he has managed to reimplement the fascistic constitution he previously attempted to implement in 1941, concentrating power in himself and tightening citizenship laws. Unlike his prior terms, the military seems to have been brought into supporting his policies, and any remaining internal opposition is unwilling to make themselves known.\n\nHis moves have led to some protest, especially from Panama's non-white population. Although currently small, anger is widespread, and early protests in Panama City and La Chorrera showed a disconcertingly high circulation of anti-fascist ideals. However, this should not be seen as a real worry; our agents on the ground seem to agree that this is a largely disorganised protest, and that any centralised organisation would immediately be outlawed, with many organisers already facing legal sanction.\n\nThese recent measures have brought real condemnation from the United States, and this provides an opportunity for us. Arias is a true, committed fascist, and it would be foolish to leave him geopolitically isolated. His proximity to the Panama Canal, and the measured interest in seizing it floated to us by representatives of the new regime, could have a major impact. However, Panama is small and relatively isolated, and it could be forced out through even light American action. If we want this to survive, then it would be best to offer some aid."
 PAN_forpol.28.a: "A step in the right direction from the isthmus connecting the Americas."

 PAN_forpol.29.t: "Arias's New Regime"
 PAN_forpol.29.desc: "TOP SECRET/[?global.date.GetDateStringNoHourLong]\n\nFROM: CECIL LANDRY\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: PANAMANIAN PLANS FOR INVADING THE CANAL\n\n1. The worst case scenario has arrived in Panama as President Arias' Fascist sympathies have been brought to light with the reinstatement of the Fascist Constitution of 1941, signaling the reemergence of Panama as an avowed enemy of the United States.\n\n2. The public reaction to this measure has been nothing short of fury. Panama's citizens have persistently been protesting the government's actions in spite of the harsh response offered by Arias' militarized police force. While their discontent is most encouraging, current public action is insufficient to collapse the regime and is likely to remain so.\n\n3. The United States continues to retain notable influence within the country, particularly so with Panama's oligarchy and some sections of the Guardia Nacional. It is very plausible to assume the significant portions of both will begin turning away from Arias once the danger his radical ambitions pose to their continued dominance is made clear.\n\n4. Be it through under-the-table funding to political agitators or applying pressure to our military connections, the opportunity for ousting Arias' dictatorship is still within our grasp."
 PAN_forpol.29.a: "Arias will soon find out a bundle of sticks burns twice as hot."
 PAN_OP_Reminder_tt: "§YWe can still pursue the operation to oust Panama's hostile government before they attempt the invasion.§!\n"

 #DEM PATH
 PAN_forpol.30.t: "Liberal Democracy"
 PAN_forpol.30.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM: CECIL LANDRY\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: Results of the 1968 Panamanian Election.\n\n1. The Panamanian elections have concluded, and with results favourable to the United States. A new President, Marco Aurelio Roblés Méndez, has been elected, and remains aligned with the National Liberal Party. Méndez has been a staunch supporter of the PLN for years, having served as Minister of Justice under Remón, and is known by many older diplomats as being a former representative.\n\n2. The election was relatively free, but most institutions remained dominated by Remónist factions, and coverage was mostly biased towards the ruling PLN. Free regional coverage is unhappy, but not to a significant level. Our concessions in the Panama Canal Zone seem to have helped to reduce dissent, and less priority was placed on alterations by either Méndez or the wider campaign on annexing it.\n\n3. This result was expected, and there doesn't seem to have been much direct response against this. Under Méndez, Panama will remain a staunch American ally, and will mostly remain stable. However, should there be another crisis, either political or economic, we shouldn't write off the risk that anti-American sentiment could resurge, and could lead to Méndez taking a harsher tone against our presence there."
 PAN_forpol.30.a: "AND YE SHALL KNOW THE TRUTH AND THE TRUTH SHALL MAKE YOU FREE."
 PAN_Economic_Stabilization_tt: "§GStability near the Canal is good for business.§!"

 PAN_forpol.31.t: "Panama's Rightward Turn"
 PAN_forpol.31.desc: "It would seem even the hard-won democracy that Panama had fought for and America had championed was not immune to the temptations of reaction. The newly elected Panamanian president is everything Washington had hoped Panama City would be able to avoid, yet the rightist nationalist powermonger that President Boyd embodies emerged victorious regardless. Panama's democracy has been hijacked by a strongman, who sets his sights on the Panama Canal.\n\nNot all is lost in Panama, however. The recent purges of the Panamanian national guard in the leadup to the election left a number of incredibly dissatisfied soldiery, something that can be leveraged in our favor now that Panama's democracy has started down a dangerous slope. The National Guard might be weak for the moment, but it is a temporary affair, particularly if they manage to find a kindred spirit in old Uncle Sam.\n\nAs much as the current plans for dealing with the emerging Panamanian issue put a little bit of balm on Washington's concerns over the Canal, one cannot help but lament this turn of events. America prides itself as a beacon of hope, something to inspire neighboring nations to strive towards in the name of freedom. Even in small Panama, so isolated on the world stage, distant echoes of Petrograd in 1917 and Weimar in 1933 can be heard.\n\nThe Monroe Doctrine isn't just a policy, it is a promise, one that was made to all nations in the Americas and is owed to Panama. We cannot pretend to know the future, but we must try to honor that promise, come what may."
 PAN_forpol.31.a: "It can't happen here, we must not let it happen in Panama!"

 PAN_forpol.32.t: "Panama's Rightward Turn"
 PAN_forpol.32.desc: "CONFIDENTIAL\nPANAMA - CENTRAL AMERICA\n\nThe incumbent National Liberal Party has been ousted by Aquilino Boyd of the Third Nationalist Party (TPN) in the recent election. Boyd is a highly conservative and authoritarian figure, and has placed significant attention on the Canal issue. Trappings of democracy likely to remain under him.\n\nFurthermore, Boyd is decidedly anti-American, and has already begun making moves towards exiting the American sphere of influence, which has brought him to the negotiating table with our representatives within the region.\n\nProjected economic benefits do not outweigh the risks of an American response, however, especially if Boyd is determined to follow his vision for the Canal by any means necessary.\n\nWhile military aid to Boyd's regime is not advised, passively accepting his integration into our economic sphere can prove lucrative. Limited investments are recommended to precede the potential losses incurred by his inevitable and forceful removal from power."
 PAN_forpol.32.a: "Panama takes one step in the right direction."
 PAN_Alignment_tt: "§F§hPanama§! will §Gjoin§! our §YEconomic Sphere§!.§!"

 PAN_forpol.33.t: "A Concerned Note"
 PAN_forpol.33.desc: "From your reply to my previous memo on Panamanian policy, it appears that a significant contingent of the U.S. Department of State persists in the mistaken belief that President Floyd Britton and his Partido del Pueblo de Panamá are the same U.S.-skeptic reformists that took power in 1964. I aim to thoroughly disabuse them of that comforting notion, and spread the necessary awareness that Britton and the PPP are now ravening Marxists that will cause a conflict with the United States over the Panama Canal in the near future. Please see the attached.\n\nAppendix 1. Floyd Britton Personality Cult. Contains: Catalogue of the 52 schools, hospitals, libraries, public parks, streets, university buildings, and military barracks renamed for the President, Photo of the statue of Britton being erected in Colón, "Viva Britton" propaganda poster.\n\nAppendix 2. Incitement of Cultural War. Contains: Article detailing firing of conservative rector from University of Panama, Lists of prohibited books, including prominent Mexican works such as 'The Underdogs', Letters from Archbishop detailing incidents of persecution.\n\nAppendix 3. Preparation for Canal Zone Conflict. Contains: Photographic evidence of the arming of Britton-affiliated student group 'Revolutionary Student Front', Interview with National Guard members describing PPP infiltration in the institution, Transcript of speech adjacent to Canal concluding with, "There is no turning back, all that is left is to march forward. To our final victory!"\n\nI trust that the thorough efforts of our embassy here in Panama City will be thoughtfully evaluated, and will prompt action, thoroughly coordinated with our partners, to address the worrisome situation."
 PAN_forpol.33.a: "Brittle Britton, quite the troublemaker."

 PAN_forpol.48.t: "A Joke"
 PAN_forpol.48.desc: "On the day of the OFN's conferring of membership to Panama, Robert Sayre became acutely aware of the sun's oppression. Not even the most buttoned-up National Guard soldier could hide their discomfort, let alone the politicians, punished for being arrogant enough to wear white suits to such an occasion.\n\nAmerica's man in Panama could only mutter a small prayer that he slurred through his speech with enough decorum as to not embarrass nor pass out in front of either President. The limey — half-limey maybe — on stage seemed to be doing well, but it wasn't as if anyone was listening. His speech was a mere opening act for the eminent Miguel J. Moreno Jr. — Panama's man for America.\n\n"Thank you, thank you for the kind words..." At least, Miguel had the sense to wear something darker, but the heat had not escaped him either. His forehead could guide oncoming ships to safe harbor, and the less said about the glistening rolls of fat substituting a neck, the better. "...and in our young yet storied history, we have always looked to America for guidance."\n\n"However, we knew America always had our backs, and even our land!" Sayre's eyes darted momentarily for a sleepy stare, what was he doing? Even the birds stopped singing, as if to watch in their own shock, as the seconds ticked down like bombs. Miguel broke into a nervous smile, and so did the audience, as everyone knew it was a joke. "Tough crowd."\n\nSomewhere, an invisible neck was cut. "In the interest of good time-keeping, I will now move onto the official ceremony. Thank you all for your time, I look forward to what we can all do together." As polities commenced, it felt as if someone was moving Miguel offstage, that he was not the one walking. Sayre suspected he will be dealing with a new Miguel in the future."
 PAN_forpol.48.a: "The clapping continued without him, as did everything else."

 ### REWRITE ME
 # This is the Panama Canal not American Samoa, it needs tension and fury
 PAN_forpol.34.t: "Panama Invades Canal Zone"
 PAN_forpol.34.desc: "The news that Panamanian soldiers had, only hours ago, overrun the Panama Canal Zone, disarmed the token American garrison present, and declared sovereignty of the 'reclaimed' territory, reverberated across Washington like a cannon shot.\n\nThough there had been rumors, and though State had issued their usual warnings to other agencies, nobody had seriously thought that the Panamanians would pull the trigger. But they had. [PAN.GetLeader]'s regime had been an increasing topic of concern as it restricted freedoms, installed complicit functionaries, and systematically dismantled the rule of law. But it was Central America - what else could be expected but a nation receptive to the odious nature of authoritarianism?\n\nCertainly not aggression towards - and the capture of - American forces. Stunned confusion quickly gave way to rage, both civilian and military alike. How dare Panama - Panama - attack America. How dare it disarm and intern - intern - American soldiers. How dare it, during the worst economic contraction in years, close the Panama Canal - the Panama Canal - and cut global and military trade links.\n\nRage soon gave way to action. The Pentagon, without being asked, immediately submitted plans for intervention. OAS representatives hurried to confer, knowing that a request for an intervention mandate was certain to soon come. Panama stood no chance, of course, but State knew that they were relying upon America's many other difficulties preventing it from taking meaningful action.\n\nThe only question was, were they right?"
 PAN_forpol.34.a: "Absolutely not. We must intervene!"
 PAN_forpol.34.b: "They are. We cannot respond - yet."
 PAN_Canal_Invasion_Loss_tt: "We are unable to respond due to our §xrepeated losses§! in the region."

 ### REWRITE ME
 PAN_forpol.35.t: "Panama Invades Canal Zone"
 PAN_forpol.35.desc: "The news that Panamanian soldiers had, only hours ago, overrun the Panama Canal Zone, disarmed the token American garrison present, and declared sovereignty of the 'reclaimed' territory, reverberated across Washington like a cannon shot.\n\nThough there had been rumblings, and though State had issued their usual warnings to other agencies, nobody had seriously thought that the Panamanians would pull the trigger. But they had. [PAN.GetLeader]'s regime had, after all, been an increasing topic of concern. It had won free and fair elections, yes, but the spectre of the strongman had made itself present. The patterns of authoritarian capture were clear to see for those well-versed in such, and the presentation of a military 'victory' against a much more powerful 'opponent' was a classic avenue for further power consolidation. Aggression was to be expected.\n\nBut certainly not aggression towards - and the capture of! - American forces. Stunned confusion quickly gave way to rage, both civilian and military alike. How dare Panama - Panama! - attack America. How dare it disarm and intern - intern! - American soldiers. How dare it, during the worst economic contraction in years, close the Panama Canal - the Panama Canal! - and cut global and military trade links.\n\nRage soon gave way to action. The Pentagon, without being asked, immediately submitted plans for intervention. OAS representatives hurried to confer, knowing that a request for an intervention mandate was certain to soon come. Panama stood no chance, of course, but State knew that they were relying upon America's many other difficulties preventing it from taking meaningful action.\n\nThe only question was, were they right?"
 PAN_forpol.35.a: "Absolutely not. We must intervene!"
 PAN_forpol.35.b: "They are. We cannot respond - yet."

 PAN_forpol.36.t: "OAS Authorizes IAPF"
 PAN_forpol.36.desc: "The inevitable response from Washington to the seizure of the Panama Canal has arrived, in force of arms. Citing both the illegality of the Panamanian seizure and the existential threat it poses to the United States, The United States have invoked the necessary OFN articles for a military incursion by the IAPF to depose the regime in Panama.\n\nWhile it is not exactly a subtle move by the US Administration to use the IAPF as an obvious cover for restoring their influence over the Canal, most are in agreement of the legality of the American opposition to Panama. OFN coalition forces are already mobilizing for seaborne operations to assist the IAPF with naval support in the invasion.\n\nNeedless to say, for the American military to make an armed return to Panamanian soil, even through the use of a politically convenient proxy, is not one without a historical weight to it. Panama is, quite literally, familiar territory for the United States, even if the expansionism of Teddy Roosevelt's era is a distant memory for those back in Washington."
 PAN_forpol.36.a: "The experience for the Americans and Panamanians on the ground is about to become all too real..."

 PAN_forpol.37.t: "Aftermath of Canal Concession"
 PAN_forpol.37.desc: "Another crisis rocks the United States as American security in the Free World is threatened. With the recent seizure of the Panama Canal, political opposition in Washington is an uproar. Politicians on the left and right shout across the aisle over the loss of face on the world stage while the President sits in the Oval Office to lick their wounds in light of this direct assault on America's sovereignty.\n\nAs much as the political ramifications of this are unfolding, most average Americans are relieved that the situation has reached a conclusion. American influence over the Canal has been a sore point for isolationists and others who view America's presence there as asking for provocation eventually. Whatever anxiety over the Fascist presence in Panama, some simply want the matter dropped while others see it as a springboard for detente and rebuilding relations with the new Panama.\n\nThis last notion is unlikely to occur, as the influence of Fascist-aligned powers abroad are already known to be backing the new regime in Panama. As much as the loss of the Canal is a major one, Washington is adamant that this is only a temporary state of affairs. Simply put, there is no chance the United States of America is going to take the Canal's seizure lying down. The idea of American troop deployment so close to the United States' borders is an ominous idea indeed, but America may have little other option."
 PAN_forpol.37.a: "An American engineering marvel, in the hands of the enemy?! This will not stand!"

 PAN_forpol.38.t: "Weathering the Storm"
 PAN_forpol.38.desc: ""Fuck, fuck, fuck!" - José Antonio Remón Cantera, President of Panama, had been repeating these words for the third hour straight. Beyond the armored glass of the Palacio de las Garzas, thick plumes of black smoke rose into the sky. Panama City was burning. The muffled roar of the mob bled through the walls of his office. The Oil Crisis, an ocean away in the Middle East, had slammed into Central America with the force of a hurricane.\n\nThe economy had shattered against the jagged rocks of hyperinflation and shortages. With it, his grip on the streets evaporated. The opposition-nationalists, radicalized students, and opportunistic politicians-smelled blood. They had cast aside their differences, united by a violent purpose: to tear Remón's regime apart. Every new day brought grim reports of paralyzed ports, sabotaged grids, and riots.\n\nBut the most terrifying thing was the silence from the barracks. The National Guard held the line for now, but how long would they gun down their countrymen for worthless paper? He cast paranoid glances at his own oak doors, half-expecting men in uniform to march in and offer him the traditional choices: exile, or a bullet to the head.\n\nHis entire rule now hung by a single, fraying thread tied inextricably to his foreign backers. Remón clenched his fists until his knuckles turned white. He didn't need their sympathies. He needed oil, stabilization loans, and, if it came to it, their guns. If they didn't throw him a lifeline right this second, this storm would drown not only him, but all of their strategic interests on the isthmus."
 PAN_forpol.38.a: "Ensure Remón's regime has whatever it requires."
 PAN_forpol.38.b: "He'll have to make do with less."

 PAN_forpol.39.t: "Regime Feed"
 PAN_forpol.39.desc: "Agent Thomas chewed thoughtfully on a lukewarm, greasy hot dog, completely ignoring the 'No Food in the Operations Room' sign. A large dollop of bright yellow mustard dripped from the sausage and landed squarely on the top-secret diplomatic cable sitting on his desk.\n\n"Son of a bitch," Thomas muttered. He grabbed a napkin and tried to wipe it off, ultimately just smearing the mustard across the official seal of the Republic of Panama.\n\nThe cable was from the PLN, Panama's ruling party. The Oil Crisis had turned the Middle East into a powder keg, and the shockwave was now tearing through Central America. Unemployment in Panama City was skyrocketing, protests were raging, and local politicians were terrified of being dragged out of their offices by angry mobs.\n\nTheir brilliant solution? Beg the Americans. The PLN was politely, yet desperately, demanding that Washington delegate more administrative powers over the Canal Zone to the Panamanian government. The letter dressed it up in pretty words: 'stabilizing the economic climate' and 'cooling public tensions.'\n\nThomas took another bite of his hot dog, chewing loudly in the empty office. "Oh, give us access to the Canal revenue so the peasants don't chop our heads off, please!" he scoffed.\n\nGiving up even an inch of control over the Canal Zone during a global energy meltdown was a dangerously slippery slope. Thomas washed the hot dog down with stale coffee and stared at the ruined diplomatic seal, pondering his next move."
 PAN_forpol.39.a: "Wipe off the mustard, stamp it 'URGENT', and forward it upstairs."
 PAN_forpol.39.b: "Use the classified cable as a napkin and toss it in the trash."

 #Torrijos
 PAN_forpol.40.t: "Torrijos Coup in Panama"
 PAN_forpol.40.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM DAVID HANNA\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: TORRIJOS' PANAMANIAN COUP SUCCESSFUL - IMMEDIATE DEVELOPMENTS AND POTENTIAL ISSUES\n\nOmar Efraín Torrijos Herrera's coup in Panama has been a success, with the former administration being exiled from the capital. However, there are growing concerns that Torrijos' nationalistic ties and rhetoric may alienate American interests. It is imperative that we ensure Torrijos' administration remains aligned with the Organization of Free Nations (OFN).\n\nOur previously planted bugs within Torrijos' headquarters have noted Torrijos' apathetic attitude towards American aid. Torrijos has repeatedly snubbed American operatives and diplomats. Behind closed doors, Torrijos has also diverted arms away from the Panamanian National Guard and into the hands of his own nationalist paramilitary groups.\n\nIn ensuring Panama falls within the OFN's interests, it is advisable that we curb Panamanian nationalism. Successful operations could entail spreading pro-American propaganda within the civilian population and suppressing nationalist protests. We have worked hard to support Torrijos' coup. We cannot waste this opportunity."
 PAN_forpol.40.a: "Fidelity, Bravery, Integrity."
 
 PAN_forpol.41.t: "Torrijos Consolidates Regime"
 PAN_forpol.41.desc: "RESTRICTED/[?global.date.GetDateStringNoHourLong]\n\nFROM ROBERT SANDLER\n\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: TORRIJOS CONSOLIDATES PRESIDENCY - DEMOCRATIC REFORMS PASSED\n\nOmar Efraín Torrijos Herrera has loosened up his military junta by curbing executive powers and implementing more social reforms. Recent amendments have been passed within the Panamanian government, limiting Torrijos' presidential authority. His land reforms and focus on education have created an increasingly stable Panama.\n\nIn the streets of Panama City, civilians celebrate Torrijos' sweeping reforms towards a democratic Panama and towards normalcy. Torrijos has also lightened nationalist rhetoric. Although the Martyrs' Day protests still haunt the Panamanian people, anti-Americanism is no longer as dominant.\n\nOur Panamanian operatives have reported that most counterrevolutionary cells have lost motivation to destabilize Torrijos. It is unlikely there will be any opposition to Torrijos in the upcoming years.\n\nIt is recommended that we stay diplomatically connected to Torrijos and we keep monitoring his inner cabinet. The Panamanian commander has secured a stable, democratic Panama, aligned with the goals of the Organization of Free Nations (OFN). As long as Torrijos remains in power, our interests in the Canal Zone will remain safe."
 PAN_forpol.41.a: "Fidelity, Bravery, Integrity."
 
 #FBI Missions post-Martyrs' day
 PAN_forpol.42.t: "Captured Pawns"
 PAN_forpol.42.desc: "José Antonio Remón Cantera, president of Panama, wore a grin from jowl-to-jowl as he strode through the conquered rows. Ambassador Farland scuttled at some distance behind, asking God why Remón couldn't meet with him in the presidential palace like a normal dictator. Or at least choose a building. Not an open-air, barbed-wire enclosure in which the two men could be photographed with-\n\nRow-upon-row of protestors. Hands zip-tied behind their backs. Mouths gagged. Noses inches from the asphalt. Eyes glassy, teary, full of hatred, or some combination of the three. Bruises across their bodies, some limbs bent in inhuman ways.\n\nRemón stopped inspecting the nearest trophy, a small teenager quivering with fear, and said to Farland, "We appreciate the assistance. Your FBI boys did good."\n\nThe Ambassador kept his eyes on the asphalt below, "With the streets more stable, perhaps now is the time to reach out to your cousin. Let him know you're lightening up on this next election. With Chiari and the Liberals-"\n\n"Now's not the time to lighten up, Ambassador. Give an inch and these traitors will think they pried it out of me. Streets fill up again and your men's hard intelligence work goes to waste," Remón said, positively jolly.\n\n"Not the time to lighten up at all." With a speed that belied his size, Remón drove a boot into the teen's stomach. The prisoner's face bashed the ground, coming up a mess of blood and scraped skin. "Perhaps the time to press." The corpulent president placed his boot on the back of his captive's head. "Down." The teen's nose was jammed into the pavement, grinding to one side. "Harder." Teeth could be heard on the asphalt.\n\nRemón stepped off, and walked away smiling."
 PAN_forpol.42.a: "Bile rose in Farland's throat."
 
 PAN_forpol.43.t: "A People's Justice"
 PAN_forpol.43.desc: "The first session of this revolutionary tribunal is now in session, presided over by the Panamanian people." Britton’s orations from the judge’s seat could be heard from outside the courthouse, which was just as well, as the sea of people spilled out from the seats all the way to the steps. "Our first defendant is the dishonourable José Antonio Remón Cantera."\n\nAs a testimony to his "dishonor", Remón had fled the capital days ago in an attempt to deny the revolutionaries this pleasure, being instead represented by a straw man adorned with a Colonel’s cap. "Prosecutor, in light of the defendant’s cowardice, would you like to begin?" The prosecutor stood, an activist, and with the scars to show it.\n\n"The defendant is guilty of numerous crimes. Extortion, rape, murder, nothing is too vile for him. He is a tyrant, who collaborated not only with the oligarchs, but with the Yanquis too. We have submitted evidence to the court detailing correspondence between the FBI and Remón, how they colluded in their violence to suppress an authentic Panamanian nationalism."\n\nThe gavel shot down as the crowd got antsy. "This is very compelling. However, we must let the defendant speak. Unlike those silenced by his regime, everyone has a voice here, even the guilty."\n\n"Remón" elected to remain silent, hopeful that a taciturn straw-faced look might beat the charges.\n\n"Very well. In the eyes of this tribunal, I see no other choice but to sentence José Antonio Remón Cantera to death." As swiftly as the last word left his mouth, the straw man was ripped into the crowd, torn asunder by the hordes of happy executioners.\n\n"Now, for our next defendant, another Yanqui collaborator, Bernardino Gonzáles Ruíz...""
 PAN_forpol.43.a: ""Are you working, or have you ever worked, with the Federal Bureau of Investigation?""
 
 PAN_forpol.44.t: "Family Reunion"
 PAN_forpol.44.desc: ""FBI got you past the herons on the lawn then," President of Panama José Antonio Remón Cantera squinted at his cousin from darkened, piggy eyes. "We'll meet in the Tamarind Room. Drink? Cigar?"\n\n"I'll smoke, yes." Roberto Francisco Chiari Remón of the opposition National Liberal Party followed the president's sagging bulk to a set of ornate chairs beneath a lavish hunting mural. He paused before taking a seat, "You make light of the protestors, José Antonio. But they want your head. Neither I nor anyone else will offer you amnesty; the people wouldn't accept it anyway. But Ambassador Farland and the FBI can arrange a comfortable life in Miami."\n\nRemón said nothing, hunching forward to light his own cigar before proffering one to his cousin. They sat in silence, smoke clouding the room.\n\nBefore Remón's eyes, the twists of smoke took on the shape of hands, all reaching, reaching for him. And in their midst, the burning cherry of his cousin's cigar became a pyre, drawing him onward, drawing him in, until his skin was heating, crackling, his eyes popping with he-\n\nRemón shut his eyes and whispered, "I'll think it over." And then with a snarl, "While you're talking with Farland, ask him for the house next door. Washington will get tired of you too, soon enough.""
 PAN_forpol.44.a: "He discarded the cigar butt without a second glance."
 
 PAN_forpol.45.t: "One Last Night at the Opera"
 PAN_forpol.45.desc: "It was a pitch black night, illuminated only by runway lights, and all Marco Aurelio Robles Méndez and his family could do was run.\n\nThe positive of an illustrious career in politics was the ability to charter a private plane out of it, the flip side being he could only ride it when an angry dictator wanted his head. However, the most pressing negatives were the assets bundled into their suitcases and dragging them down; Pepita begged him otherwise, but he didn’t want to spend his new life in America begging.\n\nHis ragged breath was only sustained by the bright red glow of his plane’s tail light. He could reach out to it, taste the sand on Miami Beach, just a couple more-\n\nThwack!\n\nA baseball bat — marshalled by a loyal National Guard cadre in their Ford chariot — had snapped Robles’ left leg into two. He didn’t taste sand when he fell, only cold asphalt and blood. Pepita couldn’t even shriek in fear, catatonic at the thoughts of what was next.\n\n"Leaving without saying goodbye, sir? Colonel Remón invited you as the guest of honor for his retirement party. It would be rude to not at least say hello." Robles wanted to scream, to tell his family to run to the plane, to resist, but he was broken. "We've got a private car to take you there. It'll be fun." He smiled daggers, bundling Robles into the backseat.\n\n"Colonel insisted that we only bring you, no family." One of the thugs raised his bat to Pepita's head. "A real shame for you, sweetheart, but you can find me if you need me. Lord knows you'll need a real man to support you now." A disgusted laugh emitted from the group, as the car spun off. Robles took one last look at his family. His family saw him again on the front page."
 PAN_forpol.45.a: "POPULAR POLITICIAN FOUND DISMEMBERED IN THE CANAL"

 # IAPF Occupation
 PAN_forpol.46.t: "IAPF Occupies Panama City"
 PAN_forpol.46.desc: "Denis was a hero, San Miguelito was liberated, as was Colón, and La Chorrera. He sat in an empty apartment, evacuated during the battle, with its windows shot out and bullet holes in the walls. Turning on the radio which survived the shootout, Denis heard the voice of General Omar Torrijos announcing the capture of Panama City and the setup of a transitional government led by the good general himself and his fellow IAPF members.\n\nAs Denis looked out the window, he saw a city in ruins, with sandbags piled up, corpses on the streets, and American soldiers telling civilians to go back home. It was a disparate sight of a country in chaos, but Denis saw something else, a city given a second chance. Maybe he was being foolish and naive but there was a new breath of life in the country. Gone were the authoritarians who oppressed and stole. Panama was free. At least he hoped that."
 PAN_forpol.46.a: "A bow for the new revolution."

 # Canal Concessions
 PAN_forpol.47.t: "The Price of a Free Canal"
 PAN_forpol.47.desc: ""No Man! No Plan! No Canal!"\n\n"Panama." What the protestors marching down Pennsylvania Avenue lacked for palindromes, they made up for with media attention. A CBS reporter and cameraman flagged down a middle-aged Washingtonian in a bulging suit, who broke off from the crowd for an interview.\n\n"The administration is completely wrong here. America should not have bent to Panama's empty threats, especially not with Japan and Germany watching."\n\nA more photogenic young union man took to the proffered microphone next, "You know who built that canal? American workers. Now we're giving away their sweat and our tax dollars to a bunch of greedy foreigners. For what? Nothing!"\n\nAn elderly woman had paused, clearly tired by the brisk pace of the marchers. But she had plenty of breath in her lungs to vent when the reporters approached, "The President is handin' everything away to that Negro communist Britton, just like he is the Negros here at home - why..." The news team scrambled off before the diatribe could go fully off on a tangent.\n\nBecause the news of the day was Panama. And the President's unforgivable weakness in surrendering it without a fight."
 PAN_forpol.47.a: ""No Man! No Plan! No Canal! Panama!""

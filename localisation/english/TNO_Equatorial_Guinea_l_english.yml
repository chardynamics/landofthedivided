 ##Events
 EQG_FOR.1.t: "Status of Equatorial Guinea"
 EQG_FOR.1.d: "The collapse of the Iberian Union has led to the creation of several new nations across the African continent. One such nation is the Republic of Equatorial Guinea, located west of our allies in the Congo region.\n\nThe young nation's need for trading partners and aid to supplement its development capabilities has fortunately led to it draw close to our Economic Sphere, opening them up for further actions in the future. While their usefulness pales in comparison to their neighbour, more control over the continent can only serve to benefit us."
 EQG_FOR.1.a: "The light of freedom shines brighter each day."


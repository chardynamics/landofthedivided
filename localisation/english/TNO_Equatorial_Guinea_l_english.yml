 #Ideas
 EQG_Preelection_Shock: "Pre-Election Shocks"
 EQG_Preelection_Shock_desc: "Despite the promise of impending elections still a far-away uncertainty, the various factions contending for the rule of Equatorial Guinea have already taken their battle to the streets.\n\nArmed skirmishes between militias belonging to one or the other party are a daily occurrence, from the alleys of Bata and Malabo to as far as the countryside, mostly in hopes of preemptively removing their opposition before the vote even begins.\n\nYet until the climate is deemed stable enough for the ballots to finally open, every day the Provisional Government fails to contain the rampant chaos is another day the people of Equatorial Guinea will have to keep waiting for an answer to the question of their country's unclear future."

 EQG_Towards_Integration: "Towards Integration"
 EQG_Towards_Integration_desc: "With the socialist Idea Popular de Guinea Ecuatorial emerging as an unexpected victor to the chaotic struggle of its first elections, the matter of the country's uncertain future has been settled by the most peculiar of answers: its fate lies not on its own, but among the rest of its African comrades.\n\nStarting of course with Cameroon, from which the newly elected government unsurprisingly earns considerable backing.\n\nSo for now, all administrative endeavours of the soon-to-be short-lived republic will be directed towards federating with their northern neighbour. Until one day, Equatorial Guinea will be able to join the arms of her brothers and sisters in materializing the pan-African dream."

 EQG_Grand_Coalition: "The Grand Coalition"
 EQG_Grand_Coalition_desc: "In a surprising turn, the protracted contest for the rule of Equatorial Guinea has been won by the moderate voices of the MUNGE and MONALIGE, allies of circumstance in a vast centrist bloc whose only purpose seems to keep their more radical opponents on all sides of the political spectrum at bay.\n\nDespite pledging a long-awaited stability after the chaotic years surrounding the young republic's first elections, the new government's united veneer hides a flimsy coalition of clashing personalities and conflicting ambitions threatening to shatter at the slightest pressure.\n\nYet if it somehow managed to avoid collapsing under the weight of its own contradictions, this unholy alliance could just become the first of many to fulfill the promise of a free and democratic Equatorial Guinea."

 EQG_Bioko_Nationalism: "Bioko Nationalism"
 EQG_Bioko_Nationalism_desc: "Reflecting the rest of Africa, the folk who call the land of Equatorial Guinea their home are far from being of a homogeneous mold.\n\nWhile the provisional government was mostly born from a core of Fang people from the continental mainland, the islands scattered across the Gulf's shore feature a myriad of ethnic groups who feel unrepresented in the country's newfound independence; most notable of which being the Bubi people from the main island of Bioko, also host to the young nation's capital.\n\nWith more moderate outliers expressing their wish for at least some degree of autonomy to others claiming outright independence for their islet, these voices could prove to be a more immediate concern if they found the ear of a rival state that might see itself profit from the growing dissent."
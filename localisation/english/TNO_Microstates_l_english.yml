l_english:

#Leaders
POLITICS_John_XXIII_DESC:0 "His Holiness John XXIII, baptized Angelo Maria Roncalli, is the current pope of the Catholic Church, vicar of Christ on Earth and spiritual leader to the millions of Catholics of the globe. Born into a family of sharecroppers in northern Italy, Angelo joined the Franciscan Order: once ordained as a man of faith, young Angelo showed his talent as an administrator, rapidly climbing the priestly ranks. Serving in WWI as a chaplain in the Regio Esercito, Angelo later became an emissary of the Holy See: when WWII began, Angelo, now a bishop, was in Bulgaria, secretly helping the local Jews escape persecution and flee to the Levant.\n\nAfter the war, Angelo was recalled to Rome and elevated to the rank of Cardinal by Pope Pius XII. In 1958, when Pius XII died, the Church was bereft of the man who had led it across the turbulent years of WWII. Bitterly divided between opposing political factions, the Conclave opted to elect an uncharismatic, old Pope who'd do next to nothing during his pontificate, allowing the cliques of the Church to continue their squabbles: thus, they picked the humble former Nuncio, Angelo Roncalli, and they couldn't have been more wrong.\n\nPope John XXIII proved himself to be an energetic and charismatic reformer; despite his doctrinal traditionalism, the new Pope became a harsh critic of the fascist regimes of Europe, speaking in favour of democracy and denouncing those in the Church who collaborated with oppressive policies. As a symbol of hope, inspiring even non-Catholics, he became universally loved among the populace, with the Italian people even nicknaming him "the Good Pope" despite his frictions with the fascist government. However, the Church John XXIII leads is still divided, and with his age growing and his health declining, no one knows whether the path set forth by the Good Pope will be followed by his flock - perhaps, only God, in his infinite wisdom, knows."

POLITICS_SEDE_VACANTE_DESC:0 "With the death of the current pope, St. Peter's Throne lies vacant for the time being. The College of Cardinals will, after a period of mourning and time for the burial of the deceased Pontiff, convene at the Sistine Chapel to begin the process of electing the next Bishop of Rome and pope of the Catholic Church. Voting is kept strictly secret and anonymous, at least within the Chapel itself. Despite that, every Papal election produces its own score of rumors relating to intrigue amongst the cardinals, not to mention the pressures of outside governments seeking to influence the direction of the Church to their own ends. Regardless of those rumors however, millions of Catholics across the globe wait expectantly for the white chimney smoke that proclaims the election of the next pope."

POLITICS_GREGORY_XVII_DESC:0 ""You will be a priest, a bishop, and a patriarch."\nThat is what Pope Pius X is said to have told Ghazaros Aghajanian, then a student at the Urbaniana in Rome. Whether a true story or not, Ghazaros has more than fulfilled that prophecy - he has surpassed it by becoming His Holiness, Pope Gregory XVII. Born under the Russian Empire in 1895 to an Armenian family Akhaltsikhe, Aghajanian was ordained a priest in Rome just in time for the October Revolution in Russia. In 1921 he fled back to Rome from Tbilisi as the Soviet Union advanced into Georgia, leaving behind his community and his family. He has not seen either since that fateful day.\n\nIn 1937 Aghajanian was elected as the fifteenth Patriarch of Cilicia - in effect becoming the head of the Armenian Catholic Church. He took Gregory Peter as his patriarchal title and led his community with distinction even as the world was once again plunged into chaos during the Second World War. Gregory Peter could do little but watch in horror as the Soviet Union collapsed, only to be succeeded in its rule of the Caucuses by the German Reich and the Turkish Republic, neither of which were inclined to treat the Armenians with any kindness, much less the Armenian Catholics.\n\nIt was thought by many that the liberal Patriarch was the top contender entering the Papal Conclave of 1958, but this was not to be. It was claimed in subsequent years that the Italian government, afraid of offending their Turkish allies, applied pressure to ensure that Peter Gregory, an outspoken critic of Armenian oppression, would not sit on St. Peter's Throne. That concern seems to have ended however, as for the first time the Conclave has elected an Armenian to serve as the Vicar of Christ on Earth. Gregory XVII sees a faith both divided and under pressure across the globe, and while he may not command armies of soldiers to solve such crises, the armies of the faithful may accomplish what bombs and bullets cannot."

POLITICS_JOHN_XXIV_DESC:0 "Giacomo Lercaro believes in Christ, he believes in the Catholic Church, and perhaps most importantly to understand his goals as pope, he believes in the mission left to him by John XXIII.\n\nBorn in 1891 to a large Genoese family, he was one of three brothers to enter the clergy. Ordained in 1914, young Father Lercaro became a military chaplain in the Italian army. Lercaro has always been a staunch foe of fascism and Nazism within the Church, a stance that has put his safety at risk on more than one occasion.\n\nIn 1947 Giacomo was made Archbishop Lercaro of Ravenna. Promotion to Archbishop of Genoa followed in 1952, and to cardinal in 1953 - signs of the high esteem he was gaining within the Church. He was even considered one of the leading papabile of the 1958 Conclave, although a desire for a merely "transitional" pope led him to be passed over for Cardinal Roncalli. He worked closely with John XXIII, both sharing an interest in modernizing and reforming the Church. Cardinal Larcero was a major supporter of the Second Vatican Council and became the chairman of the Body on Liturgy when it opened in 1963.\n\nAs pope, John XXIV has vowed to carry on the work of his predecessor, including the continuation of Vatican II and efforts to bring the Church into line with the realities of a rapidly changing world. The signaled changes have already aroused a good deal of traditionalist backlash, but behind Pope John XXIV stand many in the Church, clergy and laymen alike who agree that the legacy of reform begun by John XXIII must be fulfilled."

POLITICS_PAUL_VI_DESC:0 "Born Giovanni Montini in 1897, Pope Paul VI has been close to the centers of Church power for decades. Now, finally, he has the power to make use of his vast experience and connections.\n\nMontini began his rise to prominence within the Vatican in 1937, when he was named Substitute for General Affairs under Cardinal Secretary of State Pacelli. When Pacelli was elected to the Papacy as Pius XII in 1939, Montini quickly became a close friend and confidant of His Holiness, as well as his informal personal secretary. During the war Montini was often criticized by the Duce's government for failing to steer clear of political matters. Had the Holy See not defended him against such attacks, Montini's position would certainly be very different today.\n\nBy the time of Pius XII's death and the Conclave of 1958 there were already suggestions that Montini was in consideration for the position of Pontiff, although in the end it would be Cardinal Roncelli who would emerge Pope John XXIII. By then the Archbishop of Milan, Montini was a natural pick for elevation to Cardinalship in the same year.\n\nFive years later the name "Montini" would once again be whispered amongst the Cardinals of the Conclave, and this time it was more than a simple passing interest.\n\nThere are many theories as to why Montini left the Conclave of 1963 as Pope Paul VI. Many point to his close relationships with both of his predecessors, others to his decades of diligent work at the highest levels of the Church's bureaucracy. Still others note that, despite his well established reputation as a progressive theologian and Cardinal, Montini never suffered from accusations of radical reformist tendencies. Accurate or not, Paul VI is believed to be an excellent choice to negotiate between the various camps now vying for power within the Church. How even the most prudent of men might be able to maintain the peace between reformists, moderates, and reactionaries will be a question that His Holiness will be forced to confront in the coming years."

POLITICS_PIUS_XIII_DESC:0 "There are those who believe that just because an institution is old and values its traditions, it cannot be compatible with the modern world. Giuseppe Siri - Pope Pius XIII - knows otherwise.\n\nSiri was born in Genoa in 1906 and was ordained in 1928 at the young age of 22. By 1930, Siri had become an academic professor of theology alongside other public duties. During Pius XII's papacy Siri became the auxiliary bishop of his home city and during his tenure he showed a willingness to tolerate the fascist regime that concerned his liberal peers.\n\nWhen Pius XII died in 1958, Siri, now a Cardinal and Archbishop of Genoa, was widely seen as a natural successor and was said to be the late pope's personal preference. This was not to be, however, as Cardinal Roncalli was elected and became John XXIII - an outcome Siri was far from satisfied with given Roncalli's highly liberal and reformist tendencies. Now however, Pius XIII will have a chance to undo many of the mistakes of his predecessor's papacy.\n\nWhile Siri has never publicly tied himself to any ideological camp within the Curia, it is hardly a secret that his views are firmly against the sort of modernizing sentiments that led to the opening of the Second Vatican Council under John XXIII. Where many of his peers suggest that the Church must adapt to a swiftly changing world, Siri counters that to do so would only debase two thousand years of tradition in favor of misguided innovation. Whether Pius XIII is merely swimming against the tides of history or is to be the herald of a traditionalist ascendency remains to be seen."

POLITICS_CLEMENT_XV_DESC:0 "Even had he never been elected pope, Sebastiano Baggio would certainly have left an indelible mark upon the Catholic Church. Born in Venetia in 1913, Baggio soon found his calling in the Church and was ordained at the young age of 22. From there, he became a member of the Church's diplomatic corps, with his first posting being to the Austrian Apostolic nunciature in the fateful year of 1938. As the years passed, so too did Baggio's experience and capabilities grow. He was sent to Chile, Canada, and Brazil in turn. Then, in 1965 he found himself appointed Cardinal by pope Gregory XVII, the honor coming as a surprise to none more than Baggio himself due to his relatively young age. The rise of his fortunes did not stop there though, as after the unexpected death of Cardinal Confalonieri that same year, Baggio was elevated to the position of prefect of the Congregation for Bishops, giving him extensive influence in shaping the foundations of the Church as a whole. He held a great deal of knowledge about prospective candidates, knowledge that gave him no small amount of leverage over the men he dealt with.\n\nAs pope, Clement XV has continued to take an interest in the appointment of bishops, working closely with his own successor as prefect to ensure that only the best men are chosen to represent the faith around the globe. Doctrinally, he is much more of a moderate than either Gregory XVII or John XXIII were, although he has shown no desire to abandon their legacy to any real degree. For this pope, it seems that organizational soundness is more of an immediate concern than either reform or reaction."

POLITICS_INNOCENT_XIV_DESC:0 "Coming on the heels of popes John XXIII and Gregory XVII, Innocent XIV is striking in that he is so un-striking. Having by far the lowest profile when compared to the other papabiles at the 1971 Conclave, Cardinal Corrado Ursi's election came as a surprise to many who were not well versed with the internal politics of the Curia. It is only when one puts together various pieces of information, supposition, and rumor do explanations emerge.\n\nIt must be remembered that Innocent XIV's two predecessors, Gregory XVII and John XXIII were both liberal reformists, the latter to an exceptional degree. Before them, however, came Pius XII, whom Ursi served as chamberlain to and was confirmed to the bishopry by. While reformist sentiments are now a major force in the Church, it is not yet the overwhelming majority opinion. It is just possible, according to the rumors, that Ursi was chosen as, if not reaction, then as a counterweight to the developments of his predecessors.\n\nIf the pope is aware of the role he has seemingly been cast to play, he has certainly been silent on it - but that is only to be expected. With such a quiet man as Pontiff, the direction of the Church has become a good deal more inscrutable."

POLITICS_LAWRENCE_I_DESC:0 ""In a world as divided and chaotic as ours, it falls upon good Christians of all denominations to come ever closer together and forget the disputes and squabbles of the past."\n\nSo says his Holiness Pope Lawrence, formerly known as Cardinal Johannes Willibrands, Primate of the Netherlands. Hailing from a region that had been a major battleground of the Reformation, it is perhaps fitting that the pope has been at the forefront of the Eucumenical movement for years prior to his election at the Conclave. The fostering of stronger ties between the various branches of Christianity was also a personal project of Gregory XVII, Lawrence's predecessor. Whereas he focused on cooperation with the autonomous eastern Churches however, Willebrands has greater connections with the Protestants in Northern and Western Europe.\n\nThis has not come without controversy however, as while Lawrence is far from sympathetic to the Nazis, the same cannot always be said for the Protestant groups he is attempting to reconcile with. This has given rise to no small amount of discomfort within and without the Catholic Church from those who fear that it may lead to a softening stance on National Socialism. For the Pope and his supporters however, the prospect of pulling their fellow Christians away from Germania's corrupting influence is too great an opportunity to pass up."

POLITICS_LEO_XIV_DESC:0 "When the Cardinal Protodeacon announced the name of the new Holy Father of the Church, members of the crowd waiting expectantly below the loggia of St. Peter's gave audible gasps. Cardinal Hélder Câmara, a self-described socialist, would be Pope Leo XIV.\n\nA longtime proponent of social justice, Câmara has been one of the most visible proponents of the growing "liberation theology" movement that has become popular amongst oppressed groups around the world. Well known and beloved by many, Câmara's work as the "bishop of the slums" in Olinda and Recife during the 1960s caught the attention of Pope Gregory XVII. His ability to formulate doctrine had already been made clear during Vatican II, in which he worked on several documents and proposals relating to the situation of the Church in the modern world. In recognition of all this, Câmara was made a cardinal in 1969. At the time of the 1971 papal conclave following Gregory's death, Cardinal Câmara was not considered by many observers a likely candidate - being deemed simply too radical for the position.\n\nAnd yet, whether through some strange twist of fate or backroom politicking, it was he who came out the winner after an extraordinary 24 ballots. Despite this historic triumph, Leo XIV is far from secure. Aside from any plans aimed at reforming the Church he may have, he must also grapple with the great beast of a global institution that the Roman Catholic Church has evolved into, shot through with conservative and even reactionary views. The greatest threat to his grand dreams of a more equitable world may end up being the very vehicle he hopes to use to effect that change."

POLITICS_PIUS_XIII2_DESC:0 "To say that Marcel François Marie Joseph Lefebvre was never expected to become pope would be an understatement. Then again, few had expected the controversial arch-conservative prelate to even rise to the position of cardinal. He very well may not have, had not the French State leveraged every bit of influence it had within the Church to make it happen. Lefebvre was a rising figure in the French West African ecclesiastical establishment at the time of the Second World War, though the collapse of France's authority in the region at the end of the 1940s forced him to return to the métropole. Like many of his conservative peers, he quickly became a strong supporter of the Petain government. It was around this time that he was further raised to Apostolic Vicar of Dakar and Bishop of Anthedon by Pius XII. A token gesture, as Lefebvre expressed a strong distaste for the new states forming in the wake of France's de facto abandonment of the region.\n\nLefebvre's ascent up the Church hierarchy would eventually culminate in his creation as cardinal in early 1958, the waning days of Pius XII's papacy. It was an all but open secret that the new cardinal had Paris to thank, as they had pressured the ill Pius to elevate Lefebvre further. During Pope John XXIII's tenure, Lefebvre became a leading conservative during Vatican II, working alongside his more prominent colleague, Cardinal Giuseppe Siri. His frustration with the new reformist, liberal direction that had seized the Church grew under Gregory XVII, John XXIII's old supporter and successor.\n\nThen came the death of Gregory and the conclave that followed. To the surprise of the watching world and the horror of Church reformists, a decade of progress was about to be abruptly halted by the ascension of Pope Pius XIII. Deeply reactionary, Pius XIII seeks to take the Church back to the time of his two most recent namesakes - perhaps farther back still."

POLITICS_GREGORY_XVIII_DESC:0 "Paul-Émile Léger, now Pope Gregory XVIII, is an evangelist and missionary through and through, determined to bring the Gospel of Christ to all the peoples and nations of the Earth. Born in Quebec in 1904, Léger might also be called a pope of "firsts" - the first North American pope, the first Canadian pope, the first Quebecois pope. Many are already speculating that his ascension, following as it does on the heels of the first Armenian pope, suggests that the Church is finally shedding off the Eurocentric domination of its leadership and may be entering into a new period of greater global perspective.\n\nEven from his earliest days as a priest Léger has been concerned with spreading Catholicism around the globe. He spent much of the 1930s in Japan, engaged in missionary work and the difficult task of organizing a "grand séminaire" for the training of local clergy. At the start of the Second World War in 1939, the exhausted Léger was recalled to Montreal where he would remain until he was called to Rome in 1948. He was soon made Archbishop of Montreal and then Cardinal at the relatively young age of just 48.\n\nFor much of his proceeding career, Léger had been aligned with the views of Pius XII, but this had begun to change in the 1960s and by the time of the opening of the Second Vatican Council in 1963, the Archbishop of Montreal had become a firm believer in the vision of "updating" the Church in line with then pope John XXIII. This change of attitudes cost him more than one friend and made him several enemies amongst the conservative wing of the Church. All the while he continued his missionary work, especially in Africa, work that he considered even more important than time spent in Rome at the Council.\n\nGregory XVIII firmly believes that just as Christ came to save all of mankind, so does all of mankind have the right to hear His word and to be able to accept them without coercion or threat. Even as pope he maintains a more hands on approach than many of his predecessors. Regions traditionally seen as on the periphery of the Church's reach are experiencing a good deal of attention under his papacy, and missions to areas ravaged by the victors of the Second World War have dramatically increased in volume."

POLITICS_CHARLOTTE_DESC:0 "Princess Charlotte Louise Juliette Grimaldi is the current ruler of the Principality of Monaco, but most days she really wishes she wasn't. Her path to rulership was fraught with strife and conflict since her very birth in 1898: an illegitimate child of prince Louis II, who had no siblings nor legitimate children, she was only made the heir apparent (despite this being against Monegasque law) to prevent the Principality from being inherited by the legal successor, a German prince, in order to avoid an international crisis between France and the German Empire.\n\nThe young princess married a French count: however, as he was homosexual, her marriage was unhappy and she had a well known affair before finally divorcing. During WWII, when Monaco was occupied by Mussolini's troops, Charlotte asked prince Louis II to let her renounce her succession rights, allowing her son Rainier to become the heir. Prince Louis refused this proposal, as Rainier was a well known sympathizer for the Allied cause, and with the Axis triumphing across the world, the Prince feared that having him as the heir would seal the doom of the tiny nation.\n\nDespite the Axis's final victory, doom did not come: Monaco bent itself to the new European overlords, and when Louis died in 1949, Charlotte became Princess. However, her role in politics was very limited, and most power ended in the hands of a clique of ministers and administrators revolving around her son, the ever more energetic Rainier. With Monaco growing ever richer and more glamorous, as foreign stars and businessmen come to squander their wealth in its beaches and its Casino, the Princess sits in her palace, gazing at the luxurious hotels and rivieras. To some, a speck on the European map, an oversight of history; to others, a wonderland of excess and refined hedonism; to the Princess, Monaco will always be a cage, no matter how gilded."

POLITICS_LEONIDA_SUZZI_VALLI_DESC:0 "His Excellence Leonida Suzzi Valli is the newly elected Captain Regent of the Most Serene Republic of San Marino, the tiny republic nested on the Monte Titano, in the Apennine mountains. A mathematics and physics high school teacher by trade, Valli also later became involved in the political life of the Republic, pursuing a diplomatic career and becoming the envoy of San Marino to Italy and Germany during WWII. Despite resenting fascism and its negative effects on the once free and democratic life of his small nation, Valli was forced into joining the Partito Fascista Sammarinese in order to continue his political career.\n\nAfter WWII, Valli continued his political activity, despite the country being dominated by the fascists and the powerful Gozi family, which placed its members in the position of Captain Regent multiple times. Over the years, Valli became the most prominent members of the opposition against the Gozi, finally managing to become Captain Regent with the goal of reverting the undemocratic and illiberal policies of the past and restore a semblance of freedom to the ancient Republic.\n\nDespite having its ancient tradition of democracy tarnished by the stain of fascism, San Marino developed greatly in the last few decades, and new troubles afflict the old republic. With industrialization and urbanization increasing ever faster, the economy of the country depends more and more from Italy, chipping away at San Marino's prized independence, and the workers and proles are becoming more and more resentful towards the institutions of the Republic. Now, Valli and his allies have to navigate this tangled web of problems ensnaring the Monte Titano, being careful not to draw too much unwanted attention from their Italian neighbors."


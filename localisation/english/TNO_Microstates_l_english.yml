## Vatican City ##
VAC_lateran_pacts:0 "The Lateran Pacts"
VAC_lateran_pacts_desc:0 "Signed in 1929 by Benito Mussolini and the Holy See, the Lateran Pacts are the legal and diplomatic basis for the existence of the Vatican City State. Ending almost 60 years of animosity between the Papacy and the Italian state, which began with Italy's seizure of Rome during the Risorgimento, the Lateran Pacts not only restored a proper Papal State (albeit limited to the sole Vatican), but also gave other concessions to the Church such as state financing, recognition of Catholicism as the Italian state religion, and allowing the Church to maintain teaching of Catholic doctrine in public schools. As long as the Lateran Pacts are still in force, we can rest assured that our country suffers no threat under Italy's protective wing."

VAC_tension_with_italy:0 "Tensions With Italy"
VAC_tension_with_italy_desc:0 "While the Lateran Pacts are still in legal force, there is a noticeable and growing discordance between the will of Rome and the will of the Vatican. Of course, all of this goes largely unspoken in public, and to the unobservant it might seem as if there has been no change in the dynamic at all. A closer view will reveal the cracks beginning to show on the facade however. Correspondence between Italy and the Church is terse and less frequent while in the halls of power politicians grumble privately about attempts at "clerical interference" and "wayward courses". The only thing stopping more public denunciation on the part of the Italian state is the knowledge that such a move would surely invite significant backlash from faithful citizens. Italy may ring in the Vatican, but in a very real sense the Church rings in Italy. For now, things remain at an uneasy standoff."

VAC_non_expedit:0 "Non Expedit"
VAC_non_expedit_desc:0 "Recent events have caused the once-cordial relations between Italy and the Vatican to all but collapse. For the first time since the signing of the Lateran Pacts in 1929, the Pope is once again a prisoner in the Vatican in all but name, just as he was in 1870. The discord between Church and state has naturally placed many Italian Catholics in a very uncomfortable position: do they risk their eternal soul for their nation or their mortal one for their faith? The choice for many is far from clear."

VAC_one_holy_catholic:0 "One, Holy, Catholic, Divided Church"
VAC_one_holy_catholic_desc:0 "Being the largest religious organization in the world and the spiritual home of millions of Catholics, it is only natural that, despite its divine unity, the Church suffers from some very human division. Faced with the challenges of a changing world, the Church is divided on what is to be done to preserve its role as the worldly house of Christ: to continue working with the numerous oppressive and tyrannical regimes of the world as long as they pay lip service to Christian doctrine, ignoring their violent excesses? To instead take a stance against the brutality of fascism and imperialism, and to truly help the poor and the meek? Or to distance from worldly politics altogether, only tending to the souls of the Catholic flock? These and more questions divide the Church, and God only knows how they will be resolved."

VAC_good_pope:0 "The Good Pope"
VAC_good_pope_desc:0 "After the controversial papacy of Pius XII, the election of John XXIII marked a significant shift in the politics of the Holy See. Where Pius XII was austere, solemn and distant, John XXIII has always been perceived as close to the common man, preaching to the masses, revitalizing the activity of lay Catholic political associations, and criticizing the oppression of the fascist regimes of Europe and beyond. The far reaching popularity of pope Roncalli earned him the nickname of "il Papa buono" in Italy and beyond, and the suspicion of several governments the world over. However, with his health ailing, the Good Pope knows he only has a limited time to guide the Church in the direction he wishes it to take, before God recalls him by His side."

VAC_missionary_patriarch:0 "The Missionary Patriarch"
VAC_missionary_patriarch_desc:0 "Gregory XVII likes going around to Eastern Chruches and making friends :)"

VAC_soldier_of_god:0 "The Bearer of the Torch"
VAC_soldier_of_god_desc:0 "John XXIV will uphold and expand John XXIII's legacy"

VAC_grey_theologian:0 "The Grey Theologian"

VAC_iron_cardinal:0 "The Iron Cardinal"
VAC_iron_cardinal_desc:0 "Before he became Pope Pius XIII, Cardinal Sirri had been the heart of the conservative movement within the clergy. He was adamantly opposed to the reforms of John XXIII and judging by how the Papal Conclave turned out, so did most of his peers. Now, as the Vicar of Christ on Earth, he has full authority to resist any calls for change with the full weight of papal authority. Whereas John XXIII bent to every misguided whim, Pius XIII will stand as firm as iron. This will certainly upset those hoping to see changes in Church practices among the clergy and laity alike but this matters little. The pope is not ordained to follow public opinion nor to base the Church's teachings on their every shift. No, he follows God's Word and His laws as revealed through the Scriptures and taught by the Holy Church and that is how it must always be."

VAC_prefect:0 "The Prefect"
VAC_prefect_desc:0 "Clement XV is really into selecting bishops and knows all about each of them"

VAC_old_monsignor:0 "The Surprise Pope"
VAC_old_monsignor_desc:0 "No one really expected this Innocent XIV guy to be pope, he's just a compromise"

VAC_ecumenist:0 "The Ecumenist"
VAC_ecumenist_desc:0 "Lawrence wants to bridge caps with the prots"

VAC_humble_evangelist:0 "The Humble Evangelist"
VAC_humble_evangelist_desc:0 "Gregory XVIII places a high value on hands on missionary work"

VAC_pope_of_the_poor:0 "The Pope of the Poor"
VAC_pope_of_the_poor_desc:0 ""

VAC_arch_conservative:0 "The Arch-Conservative"
VAC_arch_conservative_desc:0 ""

VAC_vatican_ii:0 "Second Vatican Council"
VAC_vatican_ii_desc:0 "In preparation since 1959, the Second Vatican Eucumenical Council has finally opened. This is the first such council since Pius IX called for the First Vatican Council of 1869-1870. From global secularization to the state of the Church under the Reich's hegemony, many questions demand answers.\n\nWhile many in the Church have welcomed this push for "aggiornamento", or updating, there is just as strong a faction that is highly skeptical of the need for the kind of sweeping changes that the Council has been called to deliberate on. No matter what happens though, Vatican II will likely set the trajectory of the Church for the foreseeable future."
VAC_quoniam_ipsi_possidebum_terram:0 "Quoniam Ipsi Possidebum Terram"
VAC_et_faciam:0 "Et Faciam Vos Fieri Piscatores Hominum"
VAC_quaerite_prime_regnum_dei:0 "Quaerite Prime Regnum Dei"
VAC_the_conclave_of_1963:0 "The Conclave of 1963"
VAC_the_conclave_of_1963_desc:0 "His Holiness the Pope John XXIII may have only led the Church for five years, but there is no doubt that what he has set in motion will last for generations. While he was elected as little more than a seat-warmer in 1958, he showed a burning desire to modernize the Church, including his stunning decision to call for a Second Vatican Council.\n\nNow it is up to the College of Cardinals to convene and decide who will follow such a model Christian as the Vicar of Christ on Earth. Currently, four leading candidates have emerged in the hectic race to once again fill St. Peter's throne. Gregorio Pietro Agagianian, Patriarch of Cilicia; Giacomo Lercaro, Archbishop of Bologna; Giovanni Battista Montini, Archbishop of Milan; Giuseppe Siri, Archbishop of Genoa. One of these men will become the next Pope. The legacy of John XXIII, as well as the direction of the Catholic faithful, will then rest in his hands.\n\nCredo in unum Deum,\nPatrem omnipoténtem,\nfactórem cæli et terræ,\nvisibílium ómnium et invisibílium.\n\nAmen."
VAC_the_conclave_of_1971:0 "The Conclave of 1971"
VAC_the_conclave_of_1971_desc:0 "Once again the Church has been left without its Holy Father. His Holiness Gregory XVII has passed on and a successor must now be found. Even as discussions intensify in the halls of the Vatican over who can fill the shoes of such a dedicated prelate as Gregory XVII, a select few names are on the lips of all cardinals.\n\nSebastiano Baggio, Prefect of the Sacred Congregation for Bishops; Johannes Willebrands, Primate of the Netherlands; Paul-Émile Léger, Archbishop of Montreal. These papabile each have a chance of shepherding the Holy Church, but the old saying must always be remembered: "He who enters the conclave as pope, leaves it as a cardinal." In the end, God's favor may play just as much a role in determining the Conclave's outcome as any well laid plan.\n\nCredo in unum Deum,\nPatrem omnipoténtem,\nfactórem cæli et terræ,\nvisibílium ómnium et invisibílium.\n\nAmen."


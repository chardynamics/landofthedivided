### San Marino ###
SNM_princely_sovereign_council:0 "The Princely and Sovereign Council"
SNM_princely_sovereign_council_desc:0 "San Marino, the most ancient republic in the world, has a long tradition of democracy and freedom.\n\nOr rather, it used to have: ever since 1923, the Partito Fascista Sammarinese has dominated the political life of the small country, with all opposition declared illegal, and the ancient Grand and General Council turned into its current incarnation, the Princely and Sovereign Council.While this was partially done to appease Italy, this also enshrined the power of the wealthy families like the Gozi, who formed the original core of the party, who have been firmly in control of the republic for forty years.\n\nWhile internal opposition has been mounting, it seems unlikely that the PFS will be ousted from power any time soon."

SNM_burgeoning_indust:0 "Burgeoning Industrialization"
SNM_burgeoning_indust_desc:0 "Since the times of Mussolini, Italy and San Marino began to work on a series of coordinated infrastructural works such as the railway connecting San Marino to Rimini. This had the effect of increasing our economic dependency on Italy, but also also of shifting our historical agrarian economy into a process of strong industrial development.\n\nAs more and more countryside villagers flock to the developing industrial towns to take up jobs in the factories, the traditional fabric of Sammarinese society, once dominated by the landowning elite, is also shifting, with the urban masses becoming ever more important to the political equilibrium of the country."

SNM_rising_discontent:0 "Rising Discontent"
SNM_rising_discontent_desc:0 "Despite the recent industrial development, economic inequality is still a serious problem in the Republic. This, combined with the curtailing of labour rights by the fascist administration and the dominance of the PFS reducing political freedoms, is causing a serious wave of discontent among the working and lower classes.\n\nWhile our law enforcement is still keeping things under control for now, we have reason to suspect that the clandestine Partito Comunista Sammarinese is exploiting the situation to spread its seditious doctrine among the proles.\n\nUnless we deal with the situation, we might have trouble down the line."


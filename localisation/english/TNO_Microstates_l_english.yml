### Monaco ###
MOC_casino_monte_carlo:0 "Casino de Monte Carlo"
MOC_casino_monte_carlo_desc:0 "The Monte Carlo Casino is what Monaco is mostly well known for, attracting rich foreigners from all over the world seeking to gamble their fortunes away in its luxurious halls. The glamour and elegance of the Casino is not just for show however: it plays a fundamental role in the finances of our small state. However, since the end of WW2, the casino's traditional clientele, the European aristocracy, largely found itself impoverished, exiled, or dead, causing serious economic trouble to our Principality. If we don't find an alternative source of revenue, the glamour and hedonism associated with Monaco might soon become a distant memory as we find ourselves broke."

MOC_rainier_reform:0 "Rainier's Reformism"
MOC_rainier_reform_desc:0 "The current heir to the throne, prince Rainier III, is arguably more famous abroad and at home than his mother, the reigning princess.\n\nTo the international tabloids, he's known for his marriage to American film star Grace Kelly, and to the international diplomats, he's known for his open sympathizing of the Allied cause during WW2, which almost cost Monaco its very existence as Axis troops occupied the small principality.\n\nNevertheless, Rainier is still very politically active today: while his mother is mostly preoccupied with her affairs, Rainier manages the country to a significant degree, to the point of forming a clique of ministers and bureaucrats that are very influential in the country's government."

MOC_italian_oversight:0 "Italian Oversight"
MOC_italian_oversight_desc:0 "The very fact that our country still exists is a small miracle.\n\nSuccessively occupied by both German and Italian troops during WW2, Monaco only managed to save itself because of her economic value to the Axis invaders. With its casino functioning as a steady source of valuable foreign currency, Monaco continued existing as a de jure independent state, later falling firmly in the Italian sphere of influence.\n\nHowever, Rome has not shown a light hand in governing the affairs of Monaco, and every move that may decrease the principality's dependency from Italy is looked upon with suspicion by the fascist government.\n\nShould we be too careless in our attempts to raise the fortunes of our country, the consequences might be dire indeed."


ELS_forpol.39.t: "Horror in El Salvador"
ELS_forpol.39.desc: "News broke this morning of a coup within the Central American state of El Salvador by radical socialist rebels. A state that has seen decades of turmoil, from the exploitation of the banana companies to their own oligarchs profiting from corruption, last night organized militia units aligned with the 'Partido Comunista Salvadoreño (PCS)' moved into government compounds and military barracks with the aid of collaborators and commenced a sudden, brutal decapitation of the State."\n\n"Popular unrest dominated the early hours with a new government declared within hours, its initial public address declaring the nationalisation of all foreign owned businesses amid a state of emergency. Spontaneous acts of violence upon foreigners and their property are reported, authorities doing little to obstruct such violence except for the largest industrial assets. Many [ROOT.GetAdjective] citizens' well-being is currently unknown."\n\n"The Ministry of Foreign Affairs has condemned the violence of the revolution and seizure of [ROOT.GetAdjective] businesses as supposed reaction to "economic subjugation". Citizens are instructed to avoid travel to the country as it appears that the new state positions itself as hostile to all spheres of influence present in the region. The Ministry has further demanded a guarantee of the safety of [ROOT.GetAdjective] citizens, however no response has yet elaborated upon the situation."
ELS_forpol.39.a: "The man shook his head and turned his attention to the next page of the newspaper."

ELS_forpol.40.t: "The Board Always Gets Its Way"
ELS_forpol.40.desc: "The day shone outside Hank's window, a beautiful morning if ever he had seen one. He raised himself from his bed, taking care not to disturb his still sleeping wife, with a long yawn. The rays of heat seemed to linger on him as he rose, and he relished in their feeling.\n\nHe stumbled downstairs, his morning robe loosely attached as he slumbered towards the dinner table, the sounds of a frying breakfast meeting him just as the smell of home comforts reached him. He breathed them in and smiled. He sat at his usual place, smiling as breakfast was placed before him and reached almost by instinct for his paper. It seemed to appear in his hand. Its headline was majestic and he smiled as he read it. "Victory", a sweet word, one that he had been praying for.\n\nHe was driven to work in the business district, to offices in one of the more expensive buildings. He'd told his friends about coffee work in Latin America and it had sprung to mind hot toiling on prehistoric plantations, notions he'd shot down. He was a company representative, "Uncle Sam's man to the locals" he'd joked. He wouldn't be on some coffee plantation, his work was far better than that.\n\nThe office was abuzz, nearly every conversation he caught wind of was about the end of the War. He kept himself aloof, but still found himself smiling all the way to his office. If he was being honest with himself he too felt like hollering. He'd studied politics back in Princeton, but it didn't take a genius to guess the Government would have a new wave of popularity. Stable governance that liked the US just as he had a whole range of expansion proposals to pitch to the guys in Houston.\nYes, his mind was full of Government reconstruction contracts, gullible investors and local bureaucrats with rich tastes. A boom was coming, hell the economy was already diversifying. Why should he be limited to just exports?" 
ELS_forpol.40.a: "The Board always likes a positive chart after all."


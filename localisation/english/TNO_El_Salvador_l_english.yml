ELS_forpol.19.t: "Binding the Americas"
ELS_forpol.19.desc: "The recent victory of New Granada in the Colombia Civil War was a victory for Japanese interests in more ways than one, as the connections between the Colombian nationalist regime and the Empire of Japan are starting to turn heads along the equator and not just in terms of the Americans and their allies. A burgeoning nationalist bloc to counteract OFN interloping has some appeal and recent overtures from another Latin American nation seem to confirm this.\n\nEl Salvador, another developing country in Central America, has made public its interest to draw closer with the Empire of Japan. Like Japan's similar ties with nearby Mexico and Guatemala, the government in San Salvador can see which way the wind is blowing and looks to build a rapport with the far east in hopes of a mutually beneficial arrangement. Clearly, whatever reservations their leadership may have had were convinced otherwise following New Granada's victory.\n\nInitial talks with the Salvadorans were a quiet affair, but proved otherwise fruitful. It may take a little time before a greater Japanese presence is felt in El Salvador, but the groundwork for it has at least been laid. If speculators' concerns over New Granada's overtures with Italy prove true and Tokyo's alliance with Bogotá becomes strained, El Salvador's newfound closeness with Japan proves that the Empire is an increasingly viable alternative to American influence in the region." 
ELS_forpol.19.a: "Perhaps one day, Japanese naval vessels will grace the gates of Panama, raising the banner of solidarity with her allies in the west!"

ELS_forpol.20.t: "Port Works"
ELS_forpol.20.desc: ""Colonel, you must understand. First, the Americans, then the Japanese."\n\nThe Salvadoran foreign minister's voice was overpowered by the crashing waves. He walked down the Acajutlan piers, his footsteps echoing over cracked pavement. The colonel beside him kept pace while the minister rubbed his temples, trying to push the stress out.\n\nRumors of an American-led putsch in Salvador had been running through the telephone wires for the past week, paralyzing the government. Having just thrown off their American shackles, some radical elements of the administration looked abroad for allies.\n\n"It's only a small amount of favors, minister," the colonel said, placing a reassuring hand onto his diplomatic counterpart. "Just some reassurances."\n\n"It always starts small, colonel," muttered the foreign minister, gently shrugging his hand off. He looked around at the barren ports around. Rusted cranes and fishing trawlers. Even the local seagulls stopped flying by. "Today, it'll be words of assurance. Tomorrow, it'll be Japanese ships in our harbors. Our sovereignty is at stake."\n\nHe stopped walking to face the minister directly. "Japan stood against America as well. They know what it's like to have their sovereignty at stake—and to win it back. They'll understand our plight."\n\nThe minister stopped as well, but not to face the colonel. He stared off into the vast Pacific, a direct pipeline to Japan. They could either give Salvador new hope, or new shackles.\n\n"Everything comes at a price, colonel. How long until the Japanese become just like the Americans?"" 
ELS_forpol.20.a: ""Offer diplomatic guarantees. We can't risk a conflict.""
ELS_forpol.20.b: ""Promise them some financial investment.""
ELS_forpol.20.c: ""Send a small naval convoy. Show America what a benevolent empire looks like.""

ELS_forpol.21.t: "New-World Economy"
ELS_forpol.21.desc: "Ever since Japan's emergence as the principal leader of Asia's economy, expansion into the world markets was bound to follow. Despite heavy opposition from Washington and Germania, nothing was going to prevent Tokyo's mercantile dominance from finding a market beyond her shores. Mexico was certainly a decent starting point in the Americas and an excellent springboard for further expansion into the Caribbean, places such as nearby Guatemala.\n\nAn otherwise quaint tropical country at the foot of the Yucatán, the post-war peace has allowed for the fledgling nations of Central America a chance for economic growth, finding opportunities to find investments outside of the American sphere. Japanese dealings in Guatemala have found fertile dealings on the ground over the interregnum, through investments in coffee plantations and other cash crops in the region.\n\nLocal manufacturing has also formed a large portion of Japanese investment in Guatemala, with a lot of imported goods from Guangdong and Manchukuo for finishing processes and sold elsewhere in the Americas. Along with the Japanese financial presence in Mexico, the growing Japanese presence in the Central American economy will only rile the United States as the Japanese Yen starts to compete with the Yankee Dollar for priority spending along the western equator." 
ELS_forpol.21.a: "As innocuous as it may appear, Guatemala is a firm enough foundation for something more."

ELS_forpol.22.t: "On the Cauldron's Rim"
ELS_forpol.22.desc: "In Cuba, the Puerto Plata invasion was a tragedy. In the US, it was an embarrassment. In El Salvador, it was something thrilling. This was no mere rebellion. The entrenched elite of the Dominican Republic had been able to send Uncle Sam packing and defend their sovereignty, and had done it with minimal assistance from their friends in Europe. No concessions, no surrender. Rafael Trujillo, whatever one might say about him, was a model for autocrats across Central America to emulate.\n\nFor days, the victory in Hispaniola was front of mind for Salvadoran coffee magnates and right-wing army officers, discussing the news in their country clubs, their lodges and barracks, or after church. They admired Trujillo's magnanimity, his strength, some even the excitement of his fascist beliefs. If El Salvador ever needed salvation, the right people could save themselves if they knew how.\n\nIn these conversations, cooler heads would always prevail, of course. President Adalberto was no Trujillo, nor did he need to be - relations with the Americans were currently fairly good, and the Yankees weren't too imposing for the moment. Every day, coffee was still harvested in the plantation and shipped north without complaint. Thus had it been for decades, and thus, hopefully would it continue."
ELS_forpol.22.a: "No need to get excited."

ELS_forpol.23.t: "Political Military"
ELS_forpol.23.desc: "The Salvadoran Armed Forces are less so an actual force for war than they are an ever-present political party which dominates over every aspect of national governance — but for the White House, they can prove as much a "dangerous element" as they can turn into a leashed hound.\n\nIn parts sponsored by American networks, the military of El Salvador has thus far proven relatively aligned to the interest of Northern corporations solely for financial concerns, if not for an ideological loyalty to democratic ideals. However, as reports of human rights abuses and declining living standards trickle outside of the nation's gated media in recent days, transparent support to the Salvadoran regime may draw unnecessary scrutiny to the U.S. government from unfriendly critics.\n\nBut political currency comes from monetary currencies — and the Salvadoran Armed Forces' domestic influences can be tempered with so long as funds from Washington continue to flow. Whether by setting conditions to our aids or further expanding them as a show of goodwill, they cannot act much in opposition, and to whatever ends we hope to achieve, it is sure to be a valuable vehicle." 
ELS_forpol.23.a: "Beggars can't be choosers, condition our continued support."
ELS_forpol.23.b: "Amicable regimes come and go, we need to keep them afloat."
ELS_Pressure_to_Democratize_tt: "§YWe will put more pressure on §BEl Salvador§!'s ruling junta to democratize.§!" 

ELS_forpol.24.t: "Raising the Honduras Issue"
ELS_forpol.24.desc: "The long session of the OAS' assembly was drawing to a close with the matter of Honduras was finally raised. Almost to a one the representatives groaned internally, knowing what was to come, but professional diplomats that they were, a mask of polite respect was worn.\n\nAs the Salvadoran representative took the lectern, he thanked the chair and launched immediately into his prepared speech. It was carefully crafted, well researched, eloquent, and focused on its message. It denounced Honduras in clear terms, castigating their constant border posturing, raising of tensions, and lack of engagement or dialogue on the disputed territories between the two countries. It was received with similarly polite half-smiles.\n\nIt was also totally ineffective, as was expected. The motion for a vote to be taken subsequently on the allegations was raised - and defeated. The motion to refer it to committee was raised - and defeated. Finally the motion to move on to the next issue was taken - and passed.\n\nThe Salvadoran took his seat, expecting all of this. He had done his part, and the record would reflect that. One more step, he thought, in the constant dance of diplomacy required of the modern age." 
ELS_forpol.24.a: "Appearances must be maintained."

ELS_forpol.25.t: "Undemocracy"
ELS_forpol.25.desc: "RESTRICTED/[GetDateText]\n\nFROM ALLEN MACPHERSON\nMEMORANDUM FOR THE PRESIDENT\n\n1. Since his unopposed victory in the El Salvador elections of 1962, pro-US president Julio Adalberto Rivera has aimed to balance popular opinion and elite interests. The head of the PCN, a party composed of military officers and supported by coffee oligarchs, Rivera's attempts at gaining the people's approval are often at odds with his fundamental support base.\n\n2. Rivera previously passed poverty relief measures, aiming to cut off support for communism and fascism from what he considers to be the source. Now, further aiming to stabilize El Salvador, he is working with Fidel Sánchez Hernández, his right hand and likely successor to the presidency in next year's elections, in attempting mild union and agrarian reforms.\n\n3. Regardless of Rivera's energetic demeanor, his reforms have limited scope, with most land expected to remain in the hands of its original owners. Nevertheless, they are encountering strong resistance from both military officers and coffee planters.\n\n4. This is Rivera's last year in the Palacio Nacional and he faces a choice, either to push the reform through, or limit the reforms further to maintain the Partido de Conciliación Nacional's base." 
ELS_forpol.25.a: "A little reform goes a long way."
ELS_forpol.25.b: "Stability is what we need most in El Salvador. Get him to tone down the reforms."

ELS_forpol.26.t: "Bully Business"
ELS_forpol.26.desc: "These days in San Salvador, you couldn't even get a brochure printed with Chinese characters on it, let alone a sign. The very last printer's that kept kanji letterplates had found its main premises looted and firebombed, and draped over the shattered windows was the national flag. When he went to inspect the damage, careful to cover his eyes with sunglasses, Kenji Kikuchi noted that in small print behind the flags was the phrase, "MADE IN THE U.S.A.".\n\nHis small office near the city centre was practically the last stand of Japanese business in this wretched, boiling country. It was also relatively incognito, bearing the name "Cruz del Sol Comercio Internacional" - pedestrian enough that most of the regime's goons would fail to realise which 'Sol' it was referring to. Most of its exports went to Sphere-adjacent countries from where they could be funneled in to the spider's web of Japanese commerce, but this was costly. The business was just barely made profitable by the heavy demand for coffee across Asia, how cheap Salvadoran labour was, and Kenji's own business acumen. But even this couldn't last much longer.\n\nHe knew that though the regime had been fooled, the FBI had not been. It didn't take a genius to track the shipping manifests back to this company staffed almost entirely by foreigners and led by a pale-skinned man who refused to take his shades off even indoors and seemed to quite enjoy tea and fish. It was at this point a waiting game - would the Home Islands send support and help keep Washington's goons at bay, or would he be left to vanish ignobly in this irrelevant nation?" 
ELS_forpol.26.a: "We cannot let ourselves be pushed out of Central America. Our kinsman calls for aid!"
ELS_forpol.26.b: "A bowl is most useful when it is empty. We shall wait for a better chance."

ELS_forpol.27.t: "Salvadoran Opposition"
ELS_forpol.27.desc: "For the Americans, the Monroe Doctrine of implanting friendly regimes may have already become archaic decades ago, but for Mexico, there are more than a few good reasons to not immediately abandon their southern friends. With the upcoming Salvadoran election being a chance occasion to secure this turbulent neighbor's political fealty to the Zócalo, there are more than a few visible gaps which can be exploited to bring this goal into fruition.\n\nDespite a most fervent effort to eradicate meaningful opposition on the Salvadorans' end, we remain wealthier, more populous, and better-equipped to fight in a protracted war-of-attrition than they can ever be. At the present moment, whatever actions we take will most definitely not face substantial retaliation. As such, from hereon, whether it be through sanctioning covert support from the DFS to willing collaborators or merely sending in some diplomatic mouthpieces, the future of El Salvador can be determined with just a few phone calls in Mexico City.\n\nStill, overtly aggressive intervention will deeply upset both domestic activists and international critics, neither of which will reflect well on our already-poor outward image. Therefore, the stake at hand is less so regarding how much we may gain, but rather how much we can afford to lose." 
ELS_forpol.27.a: "Words are sharper than daggers, a few envoys will do."


ELS_forpol.37.t: ""HORROR IN EL SALVADOR""
ELS_forpol.37.desc: ""News broke this morning of a coup within the Central American state of El Salvador by radical socialist rebels. A state that has seen decades of turmoil, from imperialists in the region such as the United States to their own oligarchs profiting from corruption, last night organized militia units aligned with the 'Partido Revolucionario de Abril y Mayo (PRAM)' moved into government compounds and military barracks with the aid of collaborators and commenced a sudden, brutal decapitation of the State."\n\n"Popular unrest dominated the early hours with a new government declared within hours, its initial public address declaring the nationalisation of all foreign owned businesses amid a state of emergency. Spontaneous acts of violence upon foreigners and their property are reported, authorities doing little to obstruct such violence except for the largest industrial assets. Many Japanese citizens' well-being is currently unknown."\n\n"The Ministry of Foreign Affairs has condemned the violence of the revolution and seizure of Japanese businesses as a 'reaction against imperialism through social tyranny rather than anti-colonial cooperation'. Citizens are instructed to avoid travel to the country as it appears that the new state, which has already been warmly received by other nations in the region such as Cuba, has positioned itself as a hostile nation to Japan. The Ministry has further demanded a guarantee of the safety of Japanese citizens, however no response has yet elaborated upon the situation."\n\nRyuichi paused his reading, leaning back on his metro chair as the shunting sounds surrounded him. The newspaper today made for sour reading, flakes of anger settling with each word. He recalled his wartime service - so long ago it felt - being a part of the great anti-imperialist crusade when he and others of the Empire's youth drove out the British in Malaysia. If that was El Salvador's desire, to drive out the imperialists, why give their soul to barbarians in a jungle?"
ELS_forpol.37.a: "If anti-imperialism is what they wanted, why have they driven out the Empire?" 

ELS_forpol.38.t: "Reflection"
ELS_forpol.38.desc: "The office had a wall painted with the map of Central America, stretching out across the room for many meters. The nations were clearly marked, black lines delineating the national boundaries clearly and unequivocally, the nations themselves painted with a colour appropriate to their allegiance. When Gustavo Ruiz had first come to this office, much of it had been painted blue, both due to poor assumptions and the Americans' strength in the region. How much difference a decade makes. He stood before the map, running his fingers along the nations.\n\nEl Salvador was on his mind, painted a dark brown some years ago after Medrano had saved the nation from the socialists the Americans had been too incompetent to stop. It had stood up to internal subversion and Honduran invasion, a beacon of Hispanism in the region. Ruiz had made his career in supporting them, in making sure every resource possible went to creating a free Salvadoran state.\n\nBut there was the problem, resources. His eyes went back to the report in his hand. Intelligence reports on the resources being funneled into the country by their partner of convenience, the Japanese. Years ago it had seemed so smart, to use them to bolster Iberian influence. He'd earned accolades from it, been personally congratulated by Franco for his cunning. Now, seeing their aid dwarf what he could possibly supply, foreboding took him. He had invited the power of the Co-Prosperity Sphere into El Salvador and it seemed impossible to imagine they would see Iberia as their benefactor much longer.\n\nRuiz walked to his desk and keyed in the number for the director, this report needed to be discussed immediately. Contingencies arranged and, most importantly, scapegoats designated. As the phone rang, his eyes never left El Salvador and its brown, Iberian hue.\n\nRuiz stared at it until the phone rang out, and he slowly put down the receiver." 
ELS_forpol.38.a: "How long before it was painted to a Sphere maroon?"
ELS_forpol_38_tt: "\n§YDespite our best efforts, we cannot hope to match [JAP.GetFlag]§eJapan's§! influence in [ELS.GetFlag]§BEl Salvador.§!\nOur grip is slowly fading away...§!"
ELS_forpol.38.b: "Madrid cannot let up without a fight."
ELS_forpol_38_tt2: "\n§YBecause of our strong presence in Latin America and the Caribbean,§! we can fight against the §einevitable...§!\nfor a time."


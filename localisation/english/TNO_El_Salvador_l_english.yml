#Leader
ELS_Rodolfo_Cordon_Cea: "Rodolfo Cordón Cea"
POLITICS_ELS_Rodolfo_Cordon_Cea_DESC: "What can be said about the man who took power in El Salvador after the coup of '61?\n\nSorely, not much.\n\nBound to stand remembered more for his seat at the head of the Constituent Assembly that brought about the new Salvadoran Constitution than his subsequent short year as the republic's Provisional President, Doctor Eusebio Rodolfo Cordón Cea tragically remains a pawn in a play much grander than him.\n\nA quiet, uncontroversial figure of the conservative establishment, he lacks both the ambition to be more than a consensual middle ground between the players of the Salon Azul's political theatre, and the charisma to pose a threat to any of them.\n\nA transitory step between decades of authoritarian rule and the pending hope of reviving the democratic dreams of '48.\n\nA harbinger of a change that his declining health might prevent him from even glimpsing, leaving him powerless to do anything but his utmost to ensure it will at least come to pass.\n\nAnd the clock is slowly running out."
ELS_Julio_Adalberto_Rivera: "Julio Adalberto Rivera"
POLITICS_ELS_Julio_Adalberto_Rivera_DESC: "For the first time in more than thirty years, power in El Salvador is held in the palm of a democratically elected leader.\n\nBut Lieutenant-Colonel Julio Adalberto Rivera Carballo has yet to persuade the protesting students and rural folks that he is their President. For Rivera was the only man on the ballot.\n\nA sensible military man holding as much contempt for the fascists as for the Marxist opposition, the founder of the Partido de Conciliación Nacional argues that the best bulwark against both evils is to fight the poverty and injustice at their root by following the American model.\n\nWishing to embody the new unity between the Salvadoran military and the country's entrenched 'coffee oligarchy', Rivera helms a coalition of conservatives and moderate dirigistes with a claimed aim in restoring stability and finally attending to the republic's decade-long scars.\n\nBut his adventurous reform plans might soon face the challenge of irritating the very elite at the base of his support, while proving far from enough to quell the growing ire of the betrayed masses that already begin to decry him as yet another in El Salvador's perpetual carousel of autocrats."
ELS_Collective_Leadership: "Collective Leadership"
POLITICS_ELS_Collective_Leadership_DESC: "Ashen notes of the Partido de Conciliación Nacional lay cooling in the fireplace of the National Palace. A coat and motorcycle belonging to Colonel Julio Adalberto Rivera remain untouched at the Casa Presidencial.\n\nNo one and everyone has taken their place. Castrists and hard-right soldiers, defecting coffee oligarchs and industrialists, socialist academics and student leaders scramble to claim a seat at an ever more unsteady table. The men pouring into the Blue Room are Salvadoran patriots, all decrying the slavishness of the former administration to Washington. But that is their only commonality, the cacophony within the Palace growing as loud as the street protests roaring outside.\n\nFormer president Osorio and Major Rubén Alonso Rosales, perhaps inspired by their Mexican exile, look to institutionalize this chaotic revolution within a single party, the Partido Acción Renovada. But as the PAR grows one handshake at a time, reactionary officers convene in the ample foyers of conservative planters, demanding a harder line. General Medrano maneuvers the National Guard forward, only too willing to oblige.\n\nOne way or another, change is coming to El Salvador. And soon."
ELS_Ruben_Alonso_Rosales: "Rubén Alonso Rosales"
POLITICS_ELS_Ruben_Alonso_Rosales_DESC: "Born in a modest village in southern La Paz, the third of seven children whose mother's insistence on acquiring a proper education would spare him from a lifetime of drudgery at the family farm. Yet an early interest in military matters would instead lead a young Rubén Alonso Rosales to enroll in the academy at merely 15. There, his road would eventually entwine with future president Óscar Osorio Hernández; a man who'd grow into perhaps the most influential figure in his life, and whose rise to power he'd aid by using his elite artillery regiment to overthrow José María Lemus.\n\nFollowing his mentor in exile to Mexico after the '61 countercoup of the Maquis, Rubén Alonso Rosales' plans to start anew with his family in the United States were thwarted when the spark lit by Puerto Plata made him cross paths with his mentor yet again to seize what both saw as a once-in-a-lifetime opportunity.\n\nNow, having succeeded in deposing the officers' cabal at the helm of El Salvador, Rosales finds himself propelled to take the mantle of his aging teacher. While he may lack in the latter's raw magnetism, he makes up for it with enough discipline and ambition to potentially be written down as one of the finest Salvadoran presidents in recent memory.\n\nAll he needs is to play his cards right."
ELS_Ricardo_Falla_Caceres: "Ricardo Falla Cáceres"
POLITICS_ELS_Ricardo_Falla_Caceres_DESC: "Doctor Ricardo Falla Cáceres is the first Salvadoran president in decades to have not held a rifle. His weapon instead is a polished black briefcase filled with file folders.\n\nHow long has it been at Cáceres' side? Was it filled with notes from his legal studies, the ones that propelled him through the University of El Salvador to his doctorate? Did the bright young man lug it around as he reorganized the Salvadoran coffee sector, creating massive productivity gains and the export-led growth of the Época de Oro? Did it rest under the table as the baby-faced academic and economic expert gathered with the other members of the '61 junta? Did Dr. Cáceres carry it with him into exile in Mexico, as the hard men with guns ousted that junta to put in their own?\n\nThe briefcase has rarely left Cáceres' hands since the Mexican DFS smuggled him back to his homeland in '63. From it, he withdrew the policy papers that convinced select coffee oligarchs to back the Castrist coup. He wielded it to append university leaders and professionals to the PAR's base of officers. It packed the drafts of the reforms that would accelerate El Salvador's industrialization and mechanization under Rosales' presidency, making him a star of the party. The speaking notes it contained were dry, but sufficient to propel the technocrat to the Yellow Room. And now, held tightly, it holds the greatest treasure of all - sketches of a Constitution that will ensure men of briefcases, not guns, rule El Salvador. Forever."
ELS_Jose_Alberto_Medrano: "José Alberto Medrano"
POLITICS_ELS_Jose_Alberto_Medrano_DESC: "For many Salvadorans, '48 is still envisioned as the year that saw the brief birth of the dream of a better future. Much fewer hold in their heart the one upon the ashes of which it was born.\n\nErratic. Impulsive. Mercurial. Alcoholic. Born in 1917, General José Alberto Medrano's fecund military career is as chaotic as the demeanour of the man himself.\n\nHis earliest notable accomplishment was, perhaps, his role in the '44 Palm Sunday Coup against the administration of Maximiliano Martínez. Yet, his infamy would only truly emerge during his assignment as the head of ORDEN, El Salvador's paramilitary-intelligence network, which allowed him to indulge his vicious whims throughout the brutal repression of opposition to the Rivera regime.\n\nJuggling allegiance between Japan and Iberia, 'El Chele' is not shy about his assumed fascist propensities nor about hurling obscenities at politicians or fellow officers earning his ire. Now seeking to revive the spirit of the Marroquín era alongside other Palm Sunday figures such as General Julio Faustino Sosa, Medrano's zeal in ensuring it will never die again is perhaps the one constant in his mind.\n\nAnd it's all the more fitting if it, too, should come from the ashes of another."
ELS_Fidel_Sanchez_Hernandez: "Fidel Sánchez Hernández"
POLITICS_ELS_Fidel_Sanchez_Hernandez_DESC: "General Fidel Sánchez Hernández bears a small smile as he dons the presidential sash over his spotless uniform. He radiates a faint warmth as he chats with the civilian members of his cabinet about his plans for investments in education and limited land reform. And then, with a pivot of his polished boot, he provides the cold discipline the soldiers surrounding him require. Calmly, General Sánchez Hernández goes over the plans for dissidents' arrests and to guard the Honduran border.\n\nFrom his youth in rural eastern El Salvador, Fidel Sánchez Hernández has held that balance of amiability and firmness. That tact would impress professors and fellow cadets at military academy, and he would graduate with their honors and regards. He would climb the military's ranks steadily, respectfully, until he attained a prestigious posting as El Salvador's military attache to Washington. Thus, it was little surprise when President Rivera designated him Interior Minister.\n\nThere, the General would play a pivotal role in crushing widespread rural unrest and defeating military coup plotters. The respect this earned him throughout the Partido de Conciliación Nacional and in Washington made him a natural successor. The populace proved less receptive - awarding him only a plurality of votes in the presidential election. So he again aims to strike that balance - between reform and order, between oligarch and peasant, and between ballot and barracks. That is the only way General Sánchez Hernández knows."
ELS_Fidel_Torres: "Fidel Torres"
POLITICS_ELS_Fidel_Torres_DESC: "Once, the new decade rang with the hope of fulfilling some long-held dreams of democracy for El Salvador.\n\nBut if the cracks in Rivera's grandiose promises had long become obvious to even the most oblivious observers, his successor has finally pushed the crumbling structure aside. Rivera beat back the Castrists and the students, but in the face of the military and coffee barons, Rivera's reforms wilted.\n\nThe rare press remnants left free to deride General Fidel Torres equate his authority to one reminiscent of the Martínez days, though perhaps with a hint more guile. Far from troubling his mind with any notion of his predecessor's reforms, his sole endeavour appears to be ensuring the country's readiness for its inevitable conflict with Honduras. Farmers routinely expand their farms across the porous, long-conflicted border. War will come, and General Torres must win. Whatever the cost.\n\nTorres is no General Medrano, he will not rant and rave in the Yellow Room of the National Palace. But every calmly issued order brings to mind the question: is it comforting to know the man ready to send a generation of Salvadorans to die is ordered and composed? Or is that the most unsettling of all?"

ELS_Julio_Faustino_Sosa: "Julio Faustino Sosa"
POLITICS_ELS_Julio_Faustino_Sosa_DESC: "Taking a key role in the '44 Palm Sunday Coup, Julio Faustino Sosa would nonetheless maintain a rather low-profile in the short-lived Marroquín administration, escaping the worst of the reprisals that would follow its fall and even earning a promotion to General in the 50s. A pilot by trade, he would quietly rise to become a leading figure within the Salvadoran Air Force, and one of the informal heads of the military's pro-Reich bloc, lurking in José Alberto Medrano's shadow until the latter's haphazard governance and brutal repression crossed a line that pushed him to plot the deposition of his former ally.\n\nConsidered much stabler than his predecessor, the calculating officer brings a marked contrast with his thoughtful demeanor and polite eloquence. And though he remains no less unequivocal in his sympathies towards the Pakt, his seizure of power within the junta concurs with a surprising receptiveness towards U.S investment. Calm brings its own rewards and finds many receptive partners.\n\nYet if his manners are undeniably gentler than his counterpart, they carry the same iron fist as he strives towards institutionalizing fascism in every strata of Salvadoran society.\n\nBut perhaps this time, it will be donning a velvet glove as well."
ELS_Arturo_Armando_Molina: "Arturo Armando Molina"
POLITICS_ELS_Arturo_Armando_Molina_DESC: "Yet another in the long sequence of military men earning presidential acclaim, Colonel Arturo Armando Molina commands respect for his dignified service during the latest conflict against Honduras, which saw his surprising rise from a rather unknown figure among El Salvador's general staff to his currently-held rank.\n\nAs the country now licks its wounds from the devastating war, "El Mostachón's" precarious mandate is built upon reviving the populist promises of the early 60's, carrying a fervor almost reminiscent of Rivera's early days - with the risk of running against the exact same hurdles.\n\nWhile bolstering meager support from the country's rural populace through bold new plans for land reform and regular visits to local agricultural workers, Molina's has yet to outshine the taint of his party's ever-dwindling legitimacy through his ever-grander pledges, even when those go as far as vowing to build a new school every day.\n\nA new face from the same mold as his predecessors, it remains to be seen if his presidency will finally breathe life into the mangled republic, or if history is doomed to repeat.\n\nAnd one is left to wonder whether the second time will prove to be the farce... or the tragedy."
ELS_Jose_Napoleon_Duarte: "José Napoleón Duarte"
POLITICS_ELS_Jose_Napoleon_Duarte_DESC: "Born in 1925, José Napoleón Duarte's political career began as one of the countless student activists who expounded their opposition to the regime of Maximiliano Hernández Martínez in the 40s. Escaping to the United States to pursue his engineering degree away from Marroquín's and Calvo's fascist diarchy, he would return just in time to see the dream of a free, democratic El Salvador almost take shape during their fall, only to fade away in the tumult of the following decades. But what he had glimpsed back then would never leave him.\n\nJoining the Partido Demócrata Cristiano soon after its inception during the chaos that followed Osorio's coup, Duarte was soon elected as the party's general secretary. But his true acclaim would emerge from his repeated mandate as San Salvador's mayor, during which the capital saw significant developments in education and infrastructure. Nestled in the heart of the country, he would grow to become its leading public opposition figure, even as most of the conservative wing of his own party fled to form the PCN. The years would lead him to become admired for his charisma, coolheadedness and commitment to protecting human rights, all of which would forge the base for his moonshot at Presidency.\n\nHaving now wrestled the country away from the PCN's decade-long grip, José Napoleón Duarte still has one thing lingering in his mind. How he'll never let democracy vanish again."
ELS_Antonio_Rodriguez_Porth: "Antonio Rodríguez Porth"
POLITICS_ELS_Antonio_Rodriguez_Porth_DESC: "Born the scion of a middle-class family owning a small pharmacy in San Salvador, José Antonio Rodríguez Porth's successful legal career would lead him to become Dean of the University of El Salvador's Law School.\n\nA staunch conservative, 'Don Toño' remains an odd figure in Salvadoran politics, standing out not solely because of the blonde hair that betrays his German heritage, but for being a vocal proponent of strict economic libertarianism, especially outspoken about his support for the works of American economist Milton Friedman.\n\nThough decried by most of his opposition as nothing more than a cold-hearted technocrat, he nonetheless managed to build sufficient influence within right-wing academic circles and the business sector to maintain relevance. Making no efforts to conceal his disdain for communism, or whatever he deems akin to it, he earned repute for his strong criticism of the recent land reform programs, likening them to the failures of the Bukharin regime. But he only truly kickstarted his political career by forming the Partido Popular Salvadoreño in 1966.\n\nNow at the nation's helm thanks to domestic anticommunists and Washington's mercenaries, Don Toño is free to mold this brave new experiment into his corporatocratic dreams: the most industrialised nation in Central America, on course to become the OFN's very own Guangdong."

ELS_Salvador_Cayetano_Carpio: "Salvador Cayetano Carpio"
POLITICS_ELS_Salvador_Cayetano_Carpio_DESC: "Born the son of a modest cobbler in '19, an early exit from school would lead Salvador Cayetano Carpio to an irregular streak of various low-end jobs that he was almost poised to crown as a baker, had he not already become fervently entangled in trade union activism just crawling out of adolescence. With a front-row seat to the brutal repression of labor movements that'd follow Óscar Osorio's rise to power, repeated stints in prison would end in forced exile in Mexico during the 50s. Already known as a gifted organiser, it'd only be a year after his return that the grizzled revolutionary would come to be appointed general secretary of the Partido Comunista, making fruitful use of his new position to turn his former comrades into a well-trained guerrilla inspired by João Amazonas' model, soon earning a reputation for his periodic skirmishes against the reactionaries in power.\n\nDespite evoking a stern, almost domineering aura, the man with the moniker of 'Commander Marcial' still carries a surprising softness toward his inner circle, and rejects any of the personalism that plagues some of the fellow firebrands within the movement. Well educated in Marxist theory during his years in exile, his ideological commitment remains tempered with a pragmatism that opens him to aligning with supportive outside powers, especially after his ruthless treatment of the former Salvadoran oligarchy resulted in near-complete international isolation.\n\nOr is it desperation?"
ELS_Fabio_Castillo_Figueroa: "Fabio Castillo Figueroa"
POLITICS_ELS_Fabio_Castillo_Figueroa_DESC: "A brief member of the short-lived left-wing junta that would eventually be deposed by the '61 Coup of the Maquis, Fabio Castillo Figueroa's name nonetheless carries significant prestige within Salvadoran politics by virtue of his grandfather, twice president in 1885 and 1907.\n\nHaving never quite managed to raise his little Partido de Acción Renovadora to prominence, Figueroa's appointment as rector of the University of El Salvador was perhaps the one thing that saved him from falling into obscurity. A strong supporter of the Cuban Revolution and the Colombian Revolutionary Union, Figueroa has since earned a reputation as a combative idealist, a pragmatic political player, and a staunch supporter of human rights.\n\nMaking generous use of his new connections to weave bonds with like-minded figures such as Arturo Romero, Rubén Alonso Rosales, and even former president Osorio, it seems a near decade of pulling strings has finally borne its fruits, allowing him to seize the momentum of the Oil Crisis to topple the PCN's decade-long rule with Mexican assistance. Now, he finds himself at the head of an eclectic gathering of student and progressive militias, flimsily held together through nothing but the hope of finally breaking an axle in the nigh-unbroken wheel of autocratic governance in El Salvador.\n\nMaybe, this time, even for good."

ELS_Feliciano_Avelar: "Feliciano Avelar"

#Ministers

##Ideas
#Starting
ELS_King_Coffee: "King Coffee"
ELS_King_Coffee_desc: "With the arrival of the late 19th century, a revolution took place in the Salvadoran economy when indigo exports were replaced by the much more profitable coffee. In just a matter of years, those coffee landowners became the absolute rulers of the country, and while their influence has decreased since 1931, these elites are still, to this day, planning the return of another Meléndez-Quiñonez era."

ELS_Memories_Epoca_Oro: "Memories from the Época de Oro"
ELS_Memories_Epoca_Oro_desc: "For the majority of the countries in the Americas, the fall of Colombia into Civil War is a tragedy that has undermined their national politics, but for El Salvador is a one in a million opportunity. During the 1950s, the presidency of Óscar Osorio increased coffee exports in his promises to increase standards of living and diversify the economy.\n\nWhile everyone knows the "miracle" won't last forever, at least their rulers can brag about the ongoing national prosperity."

ELS_House_Divided: "A House Divided"
ELS_House_Divided_desc: "Ever since independence, tensions and war between two or more political factions were a daily occurrence, and that tradition continued for years after the Revolution of 1948, where conservative, reformist, and fascist factions of the military endlessly plotted coups against each other. Only a new strongman can end this conflict."

ELS_48_Forevermore: "'48 and Forevermore"
ELS_48_Forevermore_desc: "President Rivera represents the ideals of the 1948 Revolution. He stands at the helm of the Salvadoran anti-fascist crusade; however, this captain does not tolerate deviation. With him, there are no soft and comfy socialist ideas, for that is not the defense against fascism.\n\nOnly hard work, dedication, and justice can lead a people to freedom. While he may be a dictator, that does not stop him from trying to gain support from his people. Rivera cracks down on injustice and attempts to take down the specter of poverty and corruption in order to defend his country from so-called extremists.\n\nOnly time will tell if he can get these reforms through without aggravating the coffee oligarchs that hold his country by the balls."

ELS_Salvadoran_Spillover: "Salvadoran Spillover"
ELS_Salvadoran_Spillover_desc: "Owing to a chronic lack of land and overpopulation, a large number of the Salvadoran campesinos have crossed the hardly enforced border into Honduras to pursue their livelihoods. This spillover not only hurts the country as the workforce and people seek easier lives outside of their borders, but it has enraged Hondurans, who view the Salvadoran migrants as stealing what little land they already own.\n\nBorder disputes, and now ethnic tensions, create a hostile relationship between the two countries, and god forbid a spark lights this pool of gasoline into an inferno."

#Proxy
ELS_Westward_Wind: "Westward Winds"
ELS_Westward_Wind_desc: "El Salvador has always been faced with domestic and political crises, always on the brink of a coup or civil conflict. However, with Fidel Castro's revolution and its exportation to the shores of Puerto Plata, the students and military of El Salvador see a new example to follow to prosperity. As Havana's revolutionary fervor spreads throughout the region, they are met with a temporary, unlikely ally. Hispanism, inspired by the ideas of Falangism and Francoist Spain prior to the formation of the Iberian Union, has found its supporters within the ranks of the military.\n\nThese ultra-conservative, rabidly nationalist officers would jump at any chance to depose what they view as a bloated and undeserving, corrupt government that plagues the country they love so much. As rumors of conspiracies and coups flow with the wind down the streets of San Salvador, the government must prepare itself for its newest domestic foe."

ELS_Whirlwind: "The Whirlwind"
ELS_Whirlwind_desc: "El Salvador finds itself in a state of chaos. Now that the old order has been overthrown, Castrist military officers quickly try to outmaneuver the conniving Hispanist foes as they vie to seize power in a race to the top. All the while, left-wing students are repressed to ensure power does not fall into the hands of radicals, and the old order doesn't get the chance to return.\n\nCar bombs can be heard at night, police arrests seem to be targeted, and anxious civilians peer out of their windows watching the street brawls. There may be a number of officers in the halls of power, but throughout the country there is chaos."
#Castrist Takeover
ELS_Con_Su_Sange_Escribo: "Con Su Sangre Escribió..."
ELS_Con_Su_Sange_Escribo_desc: "Inspired by the Cuban Revolution's anti-imperialist struggle to rid the country of American influence and Castro's instillation of revolutionary fervor, El Salvador has become the next domino in Latin America. Students across the country have banded together with Castrist-inspired military officers, overturning the American-backed military dictatorship. Now, Rosales finds himself atop a country turned upside down, and he will utilize it to the highest degree.\n\nA former soldier, Rosales plans to strictly control the country's new revolution, guiding it down a path of PRI-styled progress, and complete El Salvador's new guided revolution. For with the blood of the students and military men that have been spilled in their struggle, Rosales will ensure that their sacrifice will not be in vain. It will be with their blood that they bring freedom to El Salvador."

ELS_Hand_in_Hand: "Hand in Hand"
ELS_Hand_in_Hand_desc: "El Salvador stands as a firm ally of the Veracruz Pact in Central America. They are eager students, aligning themselves fully with the bloc and seeking the guidance of both Mexico and Cuba in the formation of their new government, their long-term policies, and their strategies to retain power.\n\nAs El Salvador seeks to emulate Cuba in emptying out the American influence of the country, both Mexican and Cuban capital eagerly wait to fill up the vacuum. Mexico and Cuba are given the unique opportunity to help craft a state from the bottom up in their preferred image. For as long as Rosales and the PAR sit atop El Salvador, the country shall walk hand-in-hand in the ranks of the Veracruz Pact."

ELS_Wringing_the_Towel: "Wringing the Towel"
ELS_Wringing_the_Towel_desc: "El Salvador has always been on the brink, but now the PAR is set out to pull it back. Hispanist officers cry out in horror as communist students walk freely in a country whose politics are the most left they've ever been, even if just a copy of the PRI. Members of the old order conspire with some sympathetic oligarchs to bring them down.\n\nBut this does not faze the PAR, as they are determined to bring a new era of political stability in El Salvador, even if this era only includes them."

ELS_King_Coffee_New_Court: "King Coffee's New Court"
ELS_King_Coffee_New_Court_desc: "In an attempt to increase production and eliminate the oligarch's hold on society, Rosales has appointed Cáceres to revolutionize the vital coffee industry of the nation. No more will these fat, rich oligarchs sit atop their estates and watch their people suffer, while hoarding the profits for themselves.\n\nIn order to bring the second golden age to El Salvador's economy, the state must take charge of the large swathes of plantations, as only they can be entrusted to have the interest of the men who toil there. Through technocratic measures, improving their living conditions and wages will, in turn, increase production, which will allow for further industrialization of the country, and finally, a chance to bring themselves into the modern world."

#Nationalist Takeover
ELS_Honor_Nuestra_Divisa: "El Honor es Nuestra Divisa"
ELS_Honor_Nuestra_Divisa_desc: "Finally, El Salvador is in the hands of true patriots. No longer will the country suffer under the hands of soft, wishy-washy politicians from 1948, who don't have the principles or determination to forge a true path for the nation. Neither will the homeland be under threat from godless, naive leftist idiots who seek to make El Salvador a den of poverty and suffering.\n\nNow El Salvador is ruled by men who only love God more than their country, and they will ensure that this love will wipe out every subversive element from every political sphere in this country. El Salvador will prosper, it will bloom, and it will be glorious, for the men who watch over this land know no other motto than honor."

ELS_Cara_Al_Sol: "Cara Al Sol"
ELS_Cara_Al_Sol_desc: "While we are not Falangists, the anthem of Franco can be heard in the streets. Men of the national guard, supporters of Medrano, have embraced and begun to push forward the National Revolution. This new El Salvador takes their model from the junta that saved Spain from Bolshevism and brought it to a patriotic golden age.\n\nThe hands of the Old World reach out, and we face sunward as we gladly accept their help, militarily and politically. Not to mention, on the other side of the Pacific, the Japanese rising sun makes its overtures to a new potential partner. The future looks bright... for those worthy to be part of it."

ELS_Mano_Dura: "Mano Dura"
ELS_Mano_Dura_desc: "Like a father disciplining his son, we cannot allow this country to misbehave. For El Salvador to grow and mature, we must rid it of its bad habits: The communists, the fat, corrupt oligarchs, and the proponents of the old order.\n\nMoreover, we must rid it of its bad influences: The pathetic Hondurans who posture on the border, terrorize our people, and seek to turn us back into ruin. There can be no leeway, and Medrano has just the solution. Arm his supporters, form them into paramilitaries, and deliver his fatherly discipline across the nation."

#Government Victory
ELS_Fading_Memory_Grey_Future: "A Fading Memory, a Grey Future"
ELS_Fading_Memory_Grey_Future_desc: "Despite their "best" efforts, El Salvador is stagnating. The military is overbearing, constantly exerting pressure on their puppet government. The economy is beginning to decline, and the people are beginning to fester. Despite this, El Salvador will limp on, strongly celebrating their small victories. Yet, the speeches have become emptier and emptier.\n\nAs the growth slows, the prices rise, and the politicians never change, El Salvador remains a pressure cooker, and changes will come. The question is: how much will things really change?"

ELS_Downing_the_Hatches: "Downing the Hatches"
ELS_Downing_the_Hatches_desc: "While El Salvador has staved off the inevitable, they have done so only temporarily. The nationalists keep in contact with their Japanese benefactors after those in Iberia have been cut off. The students still protest, even with their Castrist military allies silenced.\n\nLegally, the PDC continues to be a fringe opposition party unable to take power, but their voices grow louder. The establishment knows that they cannot be silenced, but rifles still speak louder than signs. For now, the military has beaten off the storm, but the seas remain rough, and they must secure their ship before the next tempest comes."

#1967-68 Election
ELS_48_More_More: "'48 and More, and More"
ELS_48_More_More_desc: "As Rivera steps down to allow the new president of the nation to take his place, the ideals of the 1948 revolution seem to seep away into history. A sham election has brought El Salvador right back to its tradition: A weak civilian government, backed strongly by the military. These piecemeal reforms just add to the long list of methods to skirt around the bush of opening up the country.\n\nFortunately for the Salvadoran people, their new president emulates Rivera. A peaceful man, one who truly tries to improve the country to some degree. Salvadorans can expect some small land reform and some big investments into education. Despite his best efforts, it seems these small changes will just add more and more to the lackluster results of the 1948 revolution."

ELS_Drawing_Back_the_Curtains: "Drawing Back the Curtains"
ELS_Drawing_Back_the_Curtains_desc: "Rivera has failed, and as he steps down, the show is over. Without any pressure from the United States to pursue democratic reforms, El Salvador finds itself back at square one. No longer will the state pursue meaningless laws that change not even a percent of the current state of things. Now the military, the backer of power for all of our history, will show themselves for who they are: The masters of El Salvador.\n\nThe only thing that preoccupies President Fidel Torres is preparation. The country must be stabilized, the peasants appeased, and the soldiers readied. Soon, Fidel Torres will be the man who faces the Honduran foe, and so help him God, he and his country will win. No matter what it takes."

#Football War Win
ELS_A_Righteous_Victory: "A Righteous Victory"
ELS_A_Righteous_Victory_desc: "El Salvador emerges as the victor, but did they ever doubt it? No outside conspiracy or hatred of such resilient people could vanquish their spirit. Although we suffered under the grip of corruption and weakness for years, the new government has led the nation to victory, to liberation from the Honduran yoke. Even its detractors, the vendepatrias that resist ot, celebrate in the streets alongside the most rabid of nationalists at their victory. This resounding show of defiance and independence has inspired the nation to strengthen its ties abroad. El Salvador is its own country, and no stooge of a giant can bring it down!""

#Castrist Win
ELS_PAR_for_the_Course: "PAR for the Course"
ELS_PAR_for_the_Course_desc: "For the 1970 elections, the winner was known before the ballots were issued. Yet, riding off victory over Honduras, Salvadorans' cheers drown out the protests.\n\nThat Ricardo Falla Cáceres takes the presidency is a sign of the many changes El Salvador has undergone. A civilian economic expert, he marks the end of military rule and populism.\n\nInstead, he calls for the brightest minds and greatest talents of the nation to come forth and continue their revolution. Technocracy, he claims, is the only path to the future.\n\nHe calls for freedom, democracy, and civility to take place in the country, even though it is clear this is democracy for the elites, the some, and not the whole. Despite this, though, the nation cheers him on as the man who continues El Salvador's revolution."

ELS_Hand_in_Hand_2: "Hand in Hand"
ELS_Hand_in_Hand_2_desc: "El Salvador stands as a firm ally of the Veracruz Pact in Central America. No longer are they students, but equals. The 1970 constitution, passed in the wake of their victory in the Football War, was modelled closely after the PRI's, and the revolution here is no less institutionalized.\n\nWith the PAR standing as El Salvador's only true polity, they look towards the future with their allies at their side. El Salvador is the Veracruz Pact's shining example, their golden boy, and will continue to be so for years to come."

ELS_Sitting_on_the_Sidelines: "Sitting on the Sidelines"
ELS_Sitting_on_the_Sidelines_desc: "Where is the opposition? Where are the communists and fascists? Where is the old order? With the Constitution and ascension of Cáceres to the presidency, you could hardly even see them on the ballot; but they were there.\n\nThe Constitution has brought forth a solution to El Salvador's instability and division: just get rid of the opposition. Not by bullets, arrests, killings, and fear, but by legal means. Restrictions on candidates, some number fudging, and denying access to the media. Let them talk all they want, for no one can hear them.\n\nThe opposition can remain there, but they will never get on the field. The revolution has forced them to sit on the sidelines, watching the political game of the PAR."

#Nationalist Win
ELS_Segunda_Epoca_de_Oro: "Segunda Época de Oro"
ELS_Segunda_Epoca_de_Oro_desc: "José Medrano has led the nation into its greatest conflict yet, and has emerged victorious. The factory gears churn and the harvests are full. If not looking at the repressive government over El Salvador, one would say they have returned to their golden age, and as the nation celebrates their victory, it seems they have turned a blind eye to the government as well. Speeches of independence, of victory despite their struggles, and their gleaming future occupy the airwaves of the country.\n\nThe economy stands strong, their people stand united in victory. For as long as this could last, the Salvadoran people have achieved their second golden age."

ELS_Cara_Al_Sol_2: "Cara Al Sol"
ELS_Cara_Al_Sol_2_desc: "In preparation for the war, El Salvador reached out to its closest allies, Iberia and Japan. It was their goods, their guns, and their bullets that brought them to victory over the slimy Hondurans. After the victory, though, their purchases and orders didn't stop.\n\nDiplomatically, they have long been on both of their sides, but now the nations compete over whose hands the Salvadoran foothold will fall into. As ships sail into Salvadoran harbors, it seems that the superior economic machine of the Rising Sun simply outclasses Iberia in production and reach, and day by day, the regime stands closer to the Sphere."

ELS_Escuadros_de_la_Muerte: "Escuadros de la Muerte"
ELS_Escuadros_de_la_Muerte_desc: "A chilling specter haunts those who dare to oppose the regime in El Salvador. Some say that some peasants have been bestowed arms to repress their fellow poverty-stricken campesinos, some say that it is the army units that have been ordered to carry out the killings. Who they are is not clear, but their existence is well known by the chilling notes they leave behind on the mutilated bodies of their victims.\n\nThe "Death Squads," as they are known in the country, roam through the backwaters and the cities, following the rumors of communist guerrillas and regime opponents into their workplaces and homes, and murdering them in cold blood.\n\nWhat resistance there is has gone quiet, or deep into the hills, fearful of the now iniquitous armed bands that rape, pillage, and murder their own countrymen."

#Government Win
ELS_Saving_Grace: "Saving Grace"
ELS_Saving_Grace_desc: "Thank God, all the angels and saints, and whatever being is above. Exactly what we needed to save our government, the order that has always been on the brink, has been given to us by this victory. El Salvador sees itself stabilized as the general feeling of dissent is diluted by patriotism following what could have been a resounding defeat.\n\nWith a post-war boom in stability and the regime legitimized, it seems its unpopularity has been wiped away. For the foreseeable future, the people may not be happy with their government, but they are happy with their country."

#1971 Election
ELS_48_More_More_2: " '48 and More, and More, and More..."
ELS_48_More_More_2_desc: "Just barely scraping enough support, Arturo Molina stands as the country's next president, following a long line of PCN presidencies, keeping the balance in the joint civic-military dictatorship. Just like his corrupt predecessors, Molina will continue with the piecemeal populist reforms to keep the population just placated enough to stave off revolt.\n\nBut the country seems to be tired of faux reform, not just the opposition, but the oligarchs and military as well. Time will only tell if the 1948 Revolution will live up to its warped and desecrated ideals, or if the cycle of massacres and violence will return to El Salvador."

ELS_Party_of_Hope: "The Party of Hope"
ELS_Party_of_Hope_desc: "A mix of pressure for democratic reforms and oversight by the PCN led to freer and freer elections in the country. However, in 1971, the Salvadoran illusion of democracy was shattered when the PCN lost. Napóleon Duarte, the longtime head of a crippled opposition, now stands proudly as the president of the nation, a nation that now tastes democracy for the first time.\n\nEloquent, charismatic, and a man who leads "the party of hope" has done just that for the nation: brought hope. Hope for a peaceful future. For a stable future. For a democratic future.\n\nThe sun shines bright on El Salvador, for the man whom the country is named after has blessed it for the first time in what seems like centuries."

#Football War Defeat
ELS_The_Impossible_Defeat: "The Impossible Defeat"
ELS_The_Impossible_Defeat_desc: "For all of their rhetoric, all of their preparation, all of their pompous existence, the defeat in the Football War seems impossible. And for the government, it isn't possible. The war has revealed the dichotomy of the country: The Salvadoran government speaks of prosperity, of countless victories and the strength of its people. And their reality? Absolute poverty, crushing defeat, and a people overpopulated and underserved by a government that does not acknowledge reality.\n\nWhen those brave and foolish few question the party line, they disappear as victims of the death squads rolling around the country.\n\nEl Salvador has already suffered one defeat, but the government seems sure not to suffer another, if they have even suffered any, for despite being the first to go onto the offensive, the government has already coined their failed operation as "The War of Legitimate Defense"."

ELS_Enemy_Within: "Enemy Within"
ELS_Enemy_Within_desc: "Since the defeat and the migrant crisis, rumors have spread from the richest streets of San Salvador to the shacks in the poorest villages of Chiltiupan.\n\nRumors of the communists taking up arms, side by side with their indigenous neighbors, in their same clothes, inciting widespread fear and paranoia among the population. These indistinguishable guerrillas are said to recruit from all levels of society, channeling their disaffection with years of incompetent rulers, crippling poverty, and the national defeat into another guerrilla campaign. These communists have begun their campaign, attacking military patrols and civilian targets.\n\nAs another war comes to El Salvador, the question is, can the government survive?"

#Castrist Defeat
ELS_Guided_Revolution: "The Guided Revolution"
ELS_Guided_Revolution_desc: "The Salvadoran Revolution stands discredited, defeated, and humiliated. Having failed to achieve victory against the Hondurans, there is no fanfare amongst our people. When the new constitution was announced and Cáceres was elected, there was no applause, only apathetic acceptance.\n\nThe PAR now stands like the PRI, as the sole party to rule El Salvador, institutionalizing the revolution as the single polity. This is a move, clear to the people, to avoid any other movement coming to take them down."

ELS_Hand_in_Hand_3: "Hand in Hand"
ELS_Hand_in_Hand_3_desc: "Thankfully, with the new constitution and our close ties to Mexico, this defeat is not as devastating as it could be.\n\nMexican aid flows into the country and makes its way to the public, helping stave off total disaster.\n\nThe overpopulation and abject poverty that plague the country are slowly being tackled by this aid, and without it, we'd likely already be deposed like the long list of short governments in this country. All of this aid has drawn us even closer to Mexico, as we are reliant on them to make it out of this crisis."

#Nationalist Defeat
ELS_Se_Acoba_La_Fiesta: "Se Acabó La Fiesta"
ELS_Se_Acoba_La_Fiesta_desc: "The drums of war had beat. The peasants and city dwellers marched together to Honduras with their chests puffed up, hopeful in their country to bring home victory. They believed their new, dedicated leaders prepared them for, if anything, this war. They came home hunched over, shamed, and defeated.\n\nNow, their party is over. There is no pride in the country, there is no hope. There is now a demographic crisis of epic proportions, with poverty ruling the country outside of a few scant areas of the capital. There is no pride, there is no strength, there is only the depressing, sinking defeat of the country, and now the government must make the music play once again."

ELS_Cara_Al_Sol_3: "Cara Al Sol"
ELS_Cara_Al_Sol_3_desc: "With our equipment seized and our stockpiles running low, the country is in dire need of help as soon as possible. The orders are placed to firms in Iberia and Japan, but as the boats roll in, it is the Japanese who see their products roll out. Outproducing the Iberians by far, the regime falls closer into the hands of the Japanese, whose vital military and economic aid will help Medrano break the spine of the resistance that rises throughout the country.\n\nThe downside is the regime is now tied to the Sphere to maintain its insatiable military, its death squads, and the disintegrating economy. The longer the insurgency continues, the more El Salvador sees itself in the hands of the Rising Sun."

#Sosa
ELS_Como_Al_Hizo_Maximiliano: "Como Lo Hizo Maximiliano"
ELS_Como_Al_Hizo_Maximiliano_desc: "Maximiliano fell in good part by trying to pass land reforms that affected the interests of our oligarchs who are only interested in keeping their luxuries rather than bringing prosperity to El Salvador and its people, however Sosa has learned from his mistakes in 1944 and knows he has the opportunity to finish his job.\n\nWith the war won and his power consolidated, La Patria can begin to clean itself from the communist guerillas who attempt to destroy our nation to those oligarchs who seem more loyal to capitalism than our country. In fact, we can go even further than what Marroquín did by re-inviting European officials to lead our military academies, fully adopt corporatist economies and institutionalizing the idea of fascism beyond the military or even better, to every aspect of society!"

ELS_Pragmatic_Duce: "El Generalissimo Pragmatico"
ELS_Pragmatic_Duce_desc: "While the OFN and the rest of Central America should respect the authority of our "Duce"; we consider that people like Trujillo, Morínigo or even Marroquín did a fatal mistake by antagonizing and isolating with the rest of our neighborhoods and the U.S.\n\nThere is much to do before El Salvador no longer depends on the trade of primary resources and while we are definitely on the right track, during these crucial years we could offer the OFN businessmen the ability to operate in our country if they are interested in doing so. Of course, as long as they respect our alliance and don't attempt to become oligarchs. In that way we can keep a stable economy while keeping our project and avoiding any foreign coup attempt."

ELS_Saving_La_Patria: "Saving La Patria"
ELS_Saving_La_Patria_desc: "The corrupt, stale "democracy" that has plagued the country can rule it no more. Years have gone past with the Patria barely limping by, crossing the decade in wooden crutches. But no more. After the government was unable to get its basic affairs in order following the Football War, the tide that had befallen other countries in the region befall those useless oligarchs. With the help of Trujillo, Faustino Sosa had led a lightning coup to bring his country to prosperity. With the old regime gone, Sosa steps in, restructuring the country, and creating a fascist regime to finally bring about El Salvador's overdue golden age."

#Commies
ELS_Legacy_La_Matanza: "Legacy of La Matanza"
ELS_Legacy_La_Matanza_desc: "In 1932, an indigenous communist revolt broke up following the coup of Maximiliano Hernández. The resulting repression of the revolt killed nearly 5% of the nation's population. The communists would not make the same mistake twice. Their revolution was swift, their insurgency fierce, their terror drenched in fire and blood, and now their power absolute.\n\nNow, it is time to consolidate the revolution. To take the wealth of the oligarchs and give it back to the hungry, impoverished masses, to find the oppressors and their collaborators at all levels of society, and deal with them as needed. It is time to avenge La Matanza, and the rape of our people that followed it."

ELS_Redistribution_of_Little_Wealth: "Redistribution of Little Wealth"
ELS_Redistribution_of_Little_Wealth_desc: "Without adequate international aid, we have been reduced to the most autarkic means of facilitating the reconstruction and the remedying of the country and our demographic crisis following the repatriation of Salvadorans across the border. Revolutionaries kidnap the richest men of the country, seize their assets or hold them for ransom, and attempt to form welfare and outreach programs to lessen the burden of life that is the current state of the country. However, we are not a rich country, and money is quickly evacuated from our territory as we run out of oligarchs and leaders from whom to nationalize. We try to redistribute the wealth to all of El Salvador, but it seems that there are just too many people and not enough wealth."

ELS_Lonely_Liberation: "A Lonely Liberation"
ELS_Lonely_Liberation_desc: "With a clear lack of a true Amazonist block, we stand uniquely alone as the most dedicated communist power in the region. We have no backers, no true allies. As a country, we are on our own. No allies means no help, no outside aid to supplement the lack of anything we have in our country.\n\nWhile we have defeated the fascists and the reactionaries, at what cost did we do it? Whatever communist allies there are in the world, their aid is not enough. Have we doomed our people to suffer as Central America's new pariah?"

#Anti-Commie
ELS_Back_To_Square_One: "Back to Square One"
ELS_Back_To_Square_One_desc: "When the Amazonists took power, the country prepared itself for a change. And change there was, but not in the methods of rooting out the regime's enemies. The violence was ferocious, and the country braced as its social order was turned on its head. But one day, they were ousted, and now Antonio Porth has brought El Salvador back to square one. Holding the full support of the traditional, conservative oligarchy, he champions a campaign of returning to tradition, returning to the American fold. Perhaps his campaign runs a change, a 180-degree turn back to the past, but the people do not protest. They want peace, and if the government does nothing for them, it is fine with them, because the last thing they want is to hear from any government."

ELS_Crawling_Back_Home: "Crawling Back Home"
ELS_Crawling_Back_Home_desc: "Having been spared the worst of the purges in the brief stint of Amazonism in El Salvador, the quiet, pro-American cliques of the country watched in horror as the political system changed, but their methods didn't. Reaching out to the Americans, a group of mercenaries has joined the remaining anticommunists in the country, funded by the traditional oligarchy and CIA to overturn the communists and restore a traditional government to El Salvador.\n\nAfter a long, grueling decade for the country, El Salvador returns to its roots. The same oligarchs meet with the same American agents and diplomats as they used to, and they are welcomed back into the fold. El Salvador has returned to where it always was."

ELS_Fires_Must_Burn: "The Fires Must Burn"
ELS_Fires_Must_Burn_desc: "Antonio Porth is a champion of the oligarchs and traditional rulers of El Salvador. Why? He is a true believer in Milton Friedman's economic theory, where companies must only care about making profits, avoiding the concepts of social causes and charity. This means that El Salvador will have no problems rebuilding and industrializing. They will do so at a rapid pace, and they will be wildly successful.\n\nThe American Guangdong, they call it. Yet, just like Guangdong, they will not measure drawbacks in the poverty, the overworked masses, the suicides, and the living standards of the peasantry. That, to them, does not matter. It is a mark of progress, because to make an omelette, you must crack eggs."

ELS_Worn_Out_Tired: "Worn Out and Tired"
ELS_Worn_Out_Tired_desc: "When the new government came to take power for itself, they found themselves a tired people. Expecting fierce resistance from the leftists, the revolutionaries, or the nationalists, they found nothing. There was no pushback, no protests, no organized opposition. They found a people willing to take whatever they were given, hoping and praying for the privilege of living a normal life.\n\nAs the government creates a new dominant political system, opposition remains, but it is so unpopular and disorganized that it means nothing. The PPS finds the unique privilege of easy governance of the nation, even if it is for the worst of reasons"


#Government Defeat
ELS_Traditional_Tragedy: "A Traditional Tragedy"
ELS_Traditional_Tragedy_desc: "As if El Salvador was a Greek Tragedy, one more crushing defeat has been added to the list. The widespread poverty and overpopulation the government has never been able to rectify have only worsened. As the oligarchy and authoritarian PCN prepare their response to the crisis, they only have one more trick up their sleeve to keep power: Open up the votes, make the ballot a little more free, give the opposition a little more slack on the political rope.\n\nIf the government can seek enough aid and recover sufficiently, they may just barely scrape by their now much more real election. But if not, they may be deposed by their own game."

ELS_On_the_Brink: "On the Brink"
ELS_On_the_Brink_desc: "With a defeat in the Football War, the ensuing crises of food security, overpopulation, and poverty have fueled leftist guerrillas. Now, we are faced with the reality that a civil war may be upon us, and the country must be secured. Yet this is not your typical war; here, the insurgents sit next to the factory worker on the bus and cultivate coffee next to the peasant.\n\nThe crackdown will be intense in a war with no frontlines, and the bodies and burnt skeletons of buses sit on the sides of the roads leading into the capital. What will come will be brutal, even if we try our best to limit it."

#Rev Gait
ELS_Rector_of_the_Republic: "The Rector of the Republic"
ELS_Rector_of_the_Republic_desc: "Fabio Castillo Figueroa has spent most of his life within the left-wing universities of El Salvador. He was a massive proponent of the 1948 Revolution and the PAR, and an admirer of the M26 in Cuba and their revolution. A starry-eyed idealist, he became rector of the University of El Salvador in 1963 and channeled the left-wing students of the nation into activism. Having survived the regime's crackdowns and witnessing its failures, he led the students to overthrow the government following the Oil Crisis and the ensuing instability.\n\nNow, Figueroa intends to administer El Salvador as he administered the University, following the revolutionary model of Latin America, and finally trying to shape El Salvador into a free nation."

ELS_Welcome_Addition: "A Welcome Addition"
ELS_Welcome_Addition_desc: "With Mexican aid, the students were able to arm themselves to overthrow the ailing government quickly. Now that the new revolutionary government has stabilized, Figueroa feels the need to join their ideological compatriots diplomatically.\n\nWithout any coercion, the new republic has approached the Mexicans and the Veracruz Pact, to which they were happily accepted.\n\nThe Veracruz Pact's influence grows in the region, and positive media light shines over what can be considered a much freer system in a country long languishing under corrupt dictatorships."

ELS_Sigh_of_Relief: "A Sigh of Relief"
ELS_Sigh_of_Relief_desc: "While the old order and more extreme figures in the country have been chased out by mobs, the opposition of the country still stands disenfranchised, but not chased down to their deaths.\n\nThey can organize, they can protest, and even if they are met with police, for the first time, they are not met with death. Hope is beginning to fester in men like Napoleón that one day, they may be able to bring a true democracy to their land."

## Events
# Not *exactly* sure if these should be here. If anything, possible to move. // Anna 

ELS_forpol.1.t: "The Broken Thumb"
ELS_forpol.1.desc: "It was in 1948, after the guns fell silent in El Salvador and the fascist regime of General Marroquín was deposed by the CIA and the Caribbean Legion, that U.S President Thomas Dewey said, "A ray of freedom's light has come down on the little thumb of the Americas."\n\nFourteen years later, and the skies over San Salvador are overcast. Outside the national university's campus, a truck bleats out the same old slogans for Julio Rivera's candidacy in the upcoming elections. It carries its banners, sagging in the humidity, across barren streets and insists, pleads, the people to go out and co-sign the inevitable election of another military man, another of the coffee kingpins.\n\nThe excitement for democracy had run dry years ago. Even as El Salvador's coffee-powered economy boomed in the past decade, its wobbly democracy withered in coups and counter-coups by officers and elites too shy for land reform, dragging their feet when the people surged ahead.\n\nFrom the clouds the levees break over the city, and the campaign posters are washed into the gutter. In the university the lights stay on. The kids that came of age after General Marroquín now debate in classrooms adorned by the Cuban flag. They argue about Castro's revolution, the Caribbean Legion's exploits, and the PRI.\n\nSome of them take what they learn back to the military barracks. Others go into the rain and scratch off what's left of Rivera from the walls. All of them sit by the radio, waiting for the next 1948, the next revolution. For their turn."
ELS_forpol.1.a: "Drag your feet. The people find a future all the same."
ELS_forpol.1.tt: "[ELS.GetFlag]El Salvador's government, a friend to the U.S., will face its share of §&radicals§! and §,reactionaries§! soon enough."

ELS_forpol.2.t: "Dying Gasp of American Influence"
ELS_forpol.2.desc: "Very concerning news from El Salvador.\n\nFollowing a number of missed reporting periods from our various resources in that country, an investigation was conducted, and has now concluded. In a way not desired.\n\nAmerica is under attack. Or, at least, our influence is.\n\nA coordinated effort, from parties currently unknown, is targeting our various networks in El Salvador. The FBI organization there has lost numerous agents, and those not lost are not returning calls, despite confirmation of receipt of them. American firms there are being frozen out of deals, and those still ongoing have plummeted in profitability owing to exorbitant increases in materials prices. Anti-American propaganda is being observed on the streets, via flyers, graffiti yes but also recently through mainstream outlets.\n\nThough the perpetrators are not known, it is assumed that they are aligned with the Castrists, as their ongoing 'revolution' against the Salvadoran state has rapidly grown in rural regions and across the countryside. We must acknowledge this, and redouble efforts to maintain our position in the country.\n\nAnd when the ultimate originators of this campaign are found? We will need to ensure retribution."
ELS_forpol.2.a: "Find them. Now."

ELS_forpol.3.t: "Anti-Radical Proactivity"
ELS_forpol.3.desc: "In the heart of San Salvador stood the Angel of Freedom, the centerpiece of a monument to national heroes. She rose above the heads of passers-by, holding aloft two laurel wreaths. A Japanese man stood before the angel. Casual observers looked over his hunched posture and cheap suit; he read as a tourist of no significance. He picked up his briefcase and walked away from the Angel.\n\nNorth of the Plaza Libertad was a billiards club, frequented by names with dignity and status. Kenji Mori entered the club; eyes lazily fell on him, then snapped away when they recognised him. A club employee took his name. "Welcome, Mori-san," said the servant, taking his coat. "They're expecting you." Mori nodded, his mind struggling through his Spanish phrasebook he read an hour ago to thank him.\n\nThe club held billiard tables on the second floor; Mori thought it must be bustling on regular nights. Only a few men gathered around one table, wearing ill-fitting civilian suits. When Mori approached, they stopped their game and welcomed him. One of the younger officers offered him a cup of coffee and introduced himself as a translator. "Do you play?" asked one of the generals.\n\nThey regarded themselves as nationalists with a brain, revolutionaries with common sense. "We want to preserve the dignity and security of our revolution," said the leader, "and that means preserving it against the radicals." He sloshed around a drink in his glass. "That means Rosales has to go." He downed the glass' contents. "If he stays, we'll become Mexico's newest pawns." He set down his glass, and sat down next to Mori. "Japan has been an ally of reasonable revolutions in the past with Colombia. If the Empire could extend the same support to us, we would ensure El Salvador does not forget its patronage."\n\nThrough the window, Mori caught a glimpse of the Angel of Freedom, holding aloft laurel wreaths, honours for the victorious."
ELS_forpol.3.a: ""What did the Americans call it, the Domino Theory?""
ELS_forpol.3.b: ""Our support to the Americas must be measured. I'm sure you can understand, General.""
ELS_Support_Coup_tt: "§YWe will offer support to El Salvador's anti-OFN military coup plot.§!"

ELS_forpol.4.t: "Taming the Castrists"
ELS_forpol.4.desc: "Clutching the latest briefs from El Salvador, Secretary of External Relations Tello Baurraud stepped through the threshold. Instead of López Mateos' smile, he was greeted by a glowering Ordaz and a brusque, "His Excellency is indisposed. I will chair this meeting."\n\nBaurraud took his seat and fanned the reports before him, mind racing through the various meanings of 'indisposed'. "Very well. Today was to decide the level and type of support we plan to offer the Salvadorans following their recent revolution. Their military junta is sharply factionalized -" photos and bios were slid across the table to Ordaz, who left them where they lay, "with divisions between and among the Castrists, our allies, and right-wing elements."\n\nOrdaz responded, "If you've been too busy profiling Salvadoran colonels and majors to notice, we're dealing with the largest economic setback since the Cárdenas administration and nationwide unrest."\n\nBaurraud stammered out, "Th-there are national security implications here. The rightists are reaching out to Japan and Iberia for backing. Major Rubén Alonso Rosales, by contrast, looks to maintain El Salvador's independence, in concert with the Veracruz Pact."\n\nOrdaz's eyes narrowed and he pronounced,"
ELS_forpol.4.a: ""Send the Japanese evidence to Rosales. When the time comes, he will charge his enemies with treason.""
ELS_forpol.4.a.tt: "The success of this option hinges on the idea that Rosales can strike first."
ELS_forpol.4.b: ""Tell Captain Gutíérrez to get Castro and his Salvadoran fan club behind Rosales.""
ELS_forpol.4.b.tt: "The DFS are overstretched at the moment, this could harm our stability."
ELS_forpol.4.c: ""We wait for His Excellency's thoughts - however long that may take.""
ELS_forpol.4.c.tt: "In a revolution, time is of the essence."

ELS_forpol.5.t: "De-Amerification" #Use of Caceres is intentional, as he'd be handling the econ side of things post-coup even if Rosales is more important politically.
ELS_forpol.5.desc: "Secretaries Tello Baurraud and Salinas flanked Antonio Mena as the telephone rang once, twice, and then-\n\n"Doctor Cáceres, it's a pleasure to speak with you. This is Mexico's Secretary of the Hacienda, Antonio Mena. I've been following your proposals for investment in El Salvador's coffee sector for some time, quite impressive."\n\n"Oh, you're too kind, Doctor. Mexico's recent growth has very much been a team effort." Salinas' eyes rolled as Antonio continued. "Unfortunately, I'll be relaying somber news today. A financial contact in New York has informed me that the United States will be placing a fresh round of sanctions on El Salvador."\n\n"Yes, the pressure that must be putting on you and the junta is immense. I did not hear of the precise cause of the sanction, no - but the North American businessmen with ties to the government you overthrew are doubtlessly petitioning their friends in Washington."\n\n"What can Mexico do for El Salvador in these times of crisis?" Mena's hand trembled, twitching the phone receiver back and forth. Salinas and Baurraud each sprang into action, the economist trying to whisper in Mena's ear while the diplomat gestured emphatically to the bulleted list assembled before him.\n\nMena closed his eyes and spoke as calmly as he could into the phone,"
ELS_forpol.5.a: ""As a trade partner of both El Salvador and the U.S., we could find alternative routes for your exports.""
ELS_forpol.5.a.tt: "Helping El Salvador evade sanctions will not endear us to the U.S."
ELS_forpol.5.b: ""We will work our contacts in the U.S., perhaps we can convince them to weaken the sanctions.""
ELS_forpol.5.b.tt: "Is this the cause we wish to call in these favors for?"

ELS_forpol.6.t: "In With the New"
ELS_forpol.6.desc: "As planes took off north from El Salvador, planes from the west landed on its runways. As military officers sympathetic to the United States were offered pensions or prison sentences, military officers sympathetic to the Japanese Empire took on greater commissions. As dollars fled banks and businesses, their proprietors found themselves flush with yen.\n\nSuch was the geopolitical trend in El Salvador following the Castrist victory of 1963. The victory had primarily been Mexico's and Cuba's, the two guardians of Central American independence safeguarding the nationalist revolution. But no matter how instrumental they were to the coup, they were not a superpower, and the world around them was still defined by the meddling and patronage of these titans. The flight of the United States from El Salvador drew the attention of the Japanese Empire, who saw in the Castrists' victory a chance to establish another foothold in America's backyard.\n\nSo as the new regime established itself, keen observers could feel Japan's hand creeping along the country's shoulders. Young officers spoke of their commitment to modernisation, echoing rhetoric third-hand from Azad Hind. Container ships from Acajutla travelled west more than north. The revolution broadcast itself through Sony radios.\n\nAnd across the Pacific, the Foreign Ministry offices responsible for Latin American outreach were abuzz with activity. The bureaucrats and planners in these offices all knew this was a campaign born of opportunism. The revolution had been conducted by Castrists, and they regarded Japan as much of an intruder as the United States. They had their use, but the Castrists merely saw them as useful; they were already spoken for, and Japan would need to use their opportunities wisely to replace one set of foreign interests with their own."
ELS_forpol.6.a: "At any moment, Mexico's hand might tear theirs away."

#Apparently 7-8 don't exist

ELS_forpol.9.t: "El Salvador in the Veracruz Pact" 
ELS_forpol.9.desc: "Calling Gustavo Ruiz's present circumstances a rough start to the day would have been an understatement. It started with whispers, as it often did. A shift in the balance, Hispanist officers being watched, new faces in every barrack. It is only when the whispers stopped coming all together that he realized the jig was up.\n\nBy the time he could get a cable back to Madrid, the ink on the deal between Mexico and El Salvador was fresh on the page and the bodies of his new "friends" within the Salvadoran armed forces were fresh in the soil. By the time his briefcase had been packed and the room he spent the last months in deserted, news of the deed was being broadcast across the nation.\n\nIt had always been something of a long shot, reinserting Iberia at the center of a visage that had been in flux for centuries. Still, those were his orders, and those of the other special representatives the Union had deployed into the region. Don Ruiz carried them, to the best of his abilities...\n\nThere was no silver lining. Mexico was about as reprehensive to Iberia as one could get. Ties to El Salvador's business world were now cut. Ruiz was certain Madrid was in a panic, but it was no longer his concern. Not for the time being anyhow.\n\nNo, as he went down the many flights of stairs of an inconspicuous apartment in San Salvador, the only thing on his mind was that he had a plane to catch."
ELS_forpol.9.a: "Truly, Madrid looked better this time of year."

ELS_forpol.10.t: "El Salvador in the Veracruz Pact" 
ELS_forpol.10.desc: "A dozen panicked cables from the embassy in El Salvador sent the Foreign Ministry spiralling into agitated inquiry. It started with whispers—the Castrists are removing our men from the army—and then concluded with dire warnings sent too late—Rosales' flying out to Mexico, wait, shit, he's already crossed the border. By the time that the Foreign Ministry could respond, the ink on the deal between Mexico and El Salvador was fresh on the page. By the time that the next round of army purges began, the Foreign Ministry was already discussing how to guide this controlled descent.\n\nPanic turned to frustration for only a brief moment, and then resignation set in. Files were shuffled into archives, plans were shelved, assets were quietly severed. It had always been something of a long shot, inserting themselves into an extant revolution and turning their eyes from north to west. Failure made it easier to swallow, let them acknowledge that it was always going to be impossible, gave them the excuse not to beat themselves up too badly over it. In the break rooms of the Foreign Ministry, the tea was as bitter as the coffee they lost.\n\nStill, there were some silver linings. Mexico was friendly enough to Japan—enough that they still had a route into Salvadoran markets. Business would be mollified, though the hawks in the Ministry were less pleased with losing access to their military. They had been making in-roads there, seeding pro-Japanese sentiment in the minds of younger officers, looking to Azad Hind and Thailand for inspiration in how to guide and safeguard their revolution. All of that was gone now; Castro was the model of the day, not Bose." 
ELS_forpol.10.a: "Acceptance came disappointingly easy to the Foreign Ministry."

ELS_forpol.11.t: "Going the Distance" 
ELS_forpol.11.desc: "Mateos stared out at the runway, ruminating on recent events. Foreign policy, he realized, wasn't much like boxing at all. Boxing was a gentleman's sport, boxing had rules. Global politics was more like a street fight, with knives and guns drawn. Yet sometimes, just like in boxing, the underdog could pull off an upset victory.\n\nWhen the plane came to a stop and Rubén Alonso Rosales appeared in the doorway, Mateos broke into a huge grin. "Welcome back to Mexico City!" he called out.\n\n"It's an honor to be back, Your Excellency," replied the Salvadoran.\n\n"Now, now" Mateos chided, "I'll have none of that. You're a visiting head of state now, just 'Adolfo' is fine, Rubén."\n\nRosales smirked. "A partner who treats us as equals... my people will see that as a nice change of pace."\n\n"That's just the beginning, Rubén. Once you've joined the Veracruz Pact, we'll invest in El Salvador's development, so your people can share in the prosperity we've built here."\n\n"Then let's not waste time. Off to the signing ceremony."\n\nAs the pair exited the airport into a sea of camera flashes, Mateos decided to give the press a memorable moment. Grabbing hold of Rosales' left hand, he raised it into the air in a show of triumph." 
ELS_forpol.11.a: "El Salvador stands with Mexico."

ELS_forpol.12.t: "Guided Tour"
ELS_forpol.12.desc: "The bottle popped in celebration, spraying champagne onto the visiting Salvadorans and their colorful vessel. The PAR men, stiff military types, had at last loosened their ties and were thumping their feet to the mariachi's beat on the floor of the trajinera. Alfonso Corona del Rosal, their host and PRI party president, grinned - the Federal District's gondolas and canals had long charmed official visitors.\n\nGeneral del Rosal opened his lips and half of the Salvadoran delegation reflexively stood at attention. He muttered, "These Castrists..." And then louder, "I'm glad to hear the PAR is growing - slowly but surely. I wanted to show you a small part of what Mexico's revolutionary party encompasses."\n\nThe trajinera pulled alongside a lively marketplace; pork rinds and popcorn proffered - for a price - to the visiting PAR dignitaries. Del Rosal waited until his Salvadoran guests finished before continuing, "Every one of those small business owners is part of the PRI, through the CNOP. Your party could encourage sellers at public markets to join. Their ambitions and annual licenses make them a valuable and quick addition."\n\nThe general turned to a passing red trajinera, stuffed with singing and drinking young men in workmen's coveralls. "These youths are members of the CTM, the confederation of unions affiliated with our party. They get the wages for a night out, Mexico gets monetary and social stability."\n\nThe boat came to a halt in front of a flowering floating garden. Del Rosal let the Salvadorans gape for a minute before saying, "Now, I can't show you peasants in the heart of Mexico City. But in their multitudes, they belong to the CNC, our covenant with them to provide 'Land and Liberty'."\n\n"But with our tour at an end Licenciados, where would your party go first?""
ELS_forpol.12.a: "El Salvador's business class would provide a stream of talented recruits."
ELS_forpol.12.a.tt: "§F\nThe §CPAR§! will become more §bdynamic.§!§!"
ELS_forpol.12.b: "Coffee growers are at the heart of the Salvadoran revolution, and must be the heart of our party."
ELS_forpol.12.b.tt: "§F\nThe §CPAR§! will become more §doligarchic.§!§!"

ELS_forpol.14.t: "The First Overture"
ELS_forpol.14.desc: "A late night in the Foreign Ministry: tired functionaries around an oak meeting desk; a crumpled pile of cigarettes burning in the ashtray; a map of Central America with a dozen pins stabbed into the isthmus, concentrated around El Salvador. The agenda: figure out how to respond to the morning's news of a successful coup against the Castrist government.\n\n"Well, isn't this what we wanted?" asked a functionary, lighting up his second cigarette of the hour. "We sent Mori out there, and he helped swing the army to our side."\n\n"Hardly our side," said another, approaching the map and pulling out a small telegram from their agents in El Salvador. "They hated the Castrists, the Castrists are gone. What none of our agents on the field picked up until now was how many of these officers were turning east." His hand sailed across the Atlantic; his finger landed in Madrid.\n\n"They can play at Hispanism all they want," said a third functionary, "but at the end of the day all they need is security from America. Iberia cannot protect them like we can."\n\n"That all begins," said yet another functionary, "with promises and gifts. So far, we've done nothing but send one spy and a welcoming basket to the new regime."\n\n"So?" The first functionary raised an eyebrow. "We can't go too far. We have to pace our support, or else America will kick up a fuss. That's not a headache we need right now."\n\nThe second functionary, finger still on the edge of Iberia, trailed his eyes back down to the isthmus, where El Salvador lay ringed with pins."
ELS_forpol.14.a: ""Military aid might be worth investigating. They need rifles, don't they?""
ELS_forpol.14.b: ""We can send advisors. They might help them see things our way.""
ELS_forpol.14.c: ""They lost a lot of foreign investment when America pulled out. Let's fill that gap.""

ELS_forpol.15.t: "Corridor to San Salvador"
ELS_forpol.15.desc: "The Colombians in Bogotá are to be commended for rallying the nation to the cause of national sovereignty in the Civil War, just as the mother country in Iberia is fiercely proud to have defended the international heirs of the real New Granada through force of arms and foreign aid. As Iberia reestablishes a sphere of influence among her former colonies, other Spanish-speaking nations along the Caribbean and Central America were bound to see similar benefits to realigning themselves with Madrid.\n\nThe minor nation of El Salvador is a keen example of this. Caught in the gears of hardline nationalist agitation from within and Yanqui interloping from without, they have been forced into the pestilential balance act defined by the Monroe Doctrine along with many of their immediate neighbors. Despite the ostensibly anti-colonial stance of the Norteamericanos, Washington has made a habit of practicing their own dancing steps of empire, even if they would never admit it.\n\nThis precisely what made the Salvadoran affidavit so unsurprising to the leadership in Madrid. With Colombia still being rebuilt following the Civil War, the government in El Salvador in conjunction with their private sector shortly announced their intentions to offer their services to the reconstruction efforts in the northern Andes.\n\nThe ramifications of this are not difficult to discern, not if recent events in the region are anything to go by. Ever since their defeat in the Second World War, America's influence along their southern peripheries has been in a protracted decline. Between the Dominican Republic's recent revival and Bogotá's triumph, El Salvador clearly sees the merit in seeking an audience with their progenitors in Europe." 
ELS_forpol.15.a: "And the heirs to the Spanish Empire are more than happy to oblige..." 

ELS_forpol.16.t: "The Old Master in Madrid"
ELS_forpol.16.desc: "Our former Axis allies along the Iberian Peninsula have long been a strange bed-fellow in global geopolitics, even after each of our sour departures from the alliance with Germany. Since the unification of Spain and Portugal, the Iberian Union has been a convenient thorn in the side of Germany. The doctrine where it relates to Latin America bares some surface level similarities to our own bloc in East Asia, hoping to cultivate the natural history with their former colonies into a larger alliance against foreign containment.\n\nWe in the Greater East Asia Co-Prosperity Sphere have not been spared the ire of this thinly-veiled recreation of old European imperialism, as seen in the recent interference in the Colombian Civil War and the subsequent response of nations along the Caribbean and in Central America. President Faustino, the leader of El Salvador, hoping to hitch their wagon to the Iberian sphere following Bogotá's recent victory, has formally announced his intent to establish further relations with the Iberian Union.\n\nIt is not abnormal for a former subject nation to seek an alliance with the mother country, America's former alliance with Great Britain being a well-known example. That said, this fly squarely in the face of Tokyo's own efforts to ingratiate itself with San Salvador, salting the wounds of New Granada's recent collapse.\n\nJapan's interests are far from ended merely because of the Iberian ascendancy, and even that can be a useful tool in penetrating America's grip over the Caribbean. Still, it is unfortunate that the Salvadorans appear so eager to sell their soil back to the very empire they sought to rid themselves of, clearly a further indicator that Iberian influence in the Americas is something to be monitored for the duration." 
ELS_forpol.16.a: "Iberia has never been a pushover, we should be careful not to underestimate them." 

ELS_forpol.17.t: "Reconquista"
ELS_forpol.17.desc: "A grand event took place in San Salvador today as representatives of the Iberian sphere met in the National Palace to affirm El Salvador's commitments to solidarity with Latin America. President Medrano was there to represent his country, the Trujillos were there, as were envoys from Bogotá, Madrid, and Lisbon. Among the many issues discussed among the delegations, the topic of El Salvador's commitment to mutual defence in the region was addressed.\n\nNaturally, the simple matter of geography meant that Salvadoran contributions to the defense alliance with Iberia were going to be minimal. This was an accepted fact with all parties involved and little in the form of ill will towards anyone for it. That having been said, El Salvador's military presence within the Iberian sphere can hardly be considered an afterthought. Small as they are, the Salvadoran military can hold its own as well as any of Castro's legionaries or the OFN's intervention forces.\n\nThe problem lies in supply to match the demand, as El Salvador's geographical size and developing economy doesn't accommodate much in terms of its military industrial capability. This means any advancement militarily must come from abroad, namely their benefactors in Europe. Iberia's leadership was aware of the Salvadoran request before it was made and had plenty of options to offer San Salvador for building up their armed forces. From military expertise to technical advancements to bulk armaments surplus." 
ELS_forpol.17.a: "Our best officers will bring El Salvador's tactical know-how up to par."
ELS_forpol.17.b: "Iberia military research will bolster Salvadoran performance in the field."
ELS_forpol.17.c: "There is scarcely a lack of things that need shooting in the jungle..." 


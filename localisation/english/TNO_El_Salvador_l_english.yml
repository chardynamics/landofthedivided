ELS_forpol.47.t: "EL SALVADOR ELECTIONS - PRIORITY"
ELS_forpol.47.desc: "MESSAGE FOR: BD, MIAMI Office\nElection results place the coalition of democrats ascendant. José Napoleón Duarte and his Christian Democratic Party are poised to lead a coalition government committed to democratic ideals.\nArmy has deployed. Dissent over results being met with force. Repression is considered likely to secure transition of power.\nOutreach to the new Government recommended.\nSigned: HG, San Salvador Office" 
ELS_forpol.47.a: "Fidelity, Bravery, Integrity"

ELS_forpol.48.t: "MEMORANDUM ON EL SALVADOR RELATIONS"
ELS_forpol.48.desc: "MEMORANDUM FOR: BD, MIAMI Office\nSUBJECTS:\n1. Assessment of Previous Decade\n2. US Interests\n3. Future\nIn response to the recent requests of Agent DR, assessment has been made of the US position within El Salvador when viewed upon the timeline of the previous decade, using the aborted 1963 coup as a start point. A more detailed breakdown can be found in Appendixes 1-5; in summary relations remain stable and positive with the administration with US influence remaining strong in both politics and the economy.\nEl Salvador, despite a difficult start to the 1960s, has maintained sufficient stability within the nation and there is little indication of a significant reverse of fortunes. The Office remains vigilant but the current situation allows our operations to continue without major hindrance. Current administrations are friendly to current regional objectives.\nUS presence in El Salvador offers a reliable check on hostile power expansion into Central America. The nation enjoys substantial economic investment and political aid from American industry, and our operations where necessary, which should continue into the foreseeable future.\nSigned: RB, San Salvador Office" 
ELS_forpol.48.a: "Fidelity, Bravery, Integrity"

ELS_forpol.49.t: "Short Calls"
ELS_forpol.49.desc: "The office was chaotic, the sounds of it barely restrained through the frosted glass of the office windows. Its occupant was happy for it at that moment, an ambience to distract from the receiver in his hand. The phone rang for barely seconds before it was answered, a gruff voice speaking sharply through the long distance distortion. It was a voice everyone in the office avoided hearing, and one that never had good news. There was no other option now; he had to be told.\n\n"It's done. We... it's all over. The front of the house has changed at the Salvadoran place. Clean sweep, and they aren't a fan of the competition down the street. Looks like they had some contractors to help them out. One of our boys got a look at some of them, maybe some immigrants from Andalusia and Kansai. What should we do about it?"\n\nBreathing, shifted demonic by the low grumble of the poor connection, seemed deafening and the caller felt every piece of information physically move down the line. He closed his eyes and rubbed his forehead. What a mess.\n\n"What is the threat to our assets?" came the reply, barely a hint of malice nor curiosity hidden within it.\n\nThe caller sighed. "We aren't sure. Not good, we hear the new guys really like their immigrant friends and they don't like us. There's a lot of irons in-"\n\n"Cut this cloak and dagger talk son, make a plan and do it to try and unfuck the situation your office has made. We'll be in touch."\n\nThe caller almost felt the reverberation of the receiver being slammed through the line. He put his down, slowly and carefully. No plan sprung to mind, only the seemingly louder chaos outside the door." 
ELS_forpol.49.a: "All the resources of the FBI, yet he felt no more powerful than a street sweeper."

ELS_forpol.50.t: "The Rising Sun Across The Pacific"
ELS_forpol.50.desc: "Hundreds gathered at Acajutla - San Salvador's largest port - to watch the first Japanese ships steam in, Rising Sun flags on full display. Many hoped that the influx of foreign money coming from this new, faraway empire could help turn the muddy paths they took to the plantations into actual roads, and their wood-and-corrugated-metal shacks into actual houses. For the one old man who leaned heavily against his gnarled cane, however, these ships and their flags meant very little. He had lived enough of his life to know that real change rarely came with a foreign symbol.\n\nIn a backroom of the Ministry of Foreign Affairs in Tokyo, a small committee had been assembled to discuss the fate of this potential new entry to the Sphere. Though their names were not relevant enough to appear anywhere but in CIA flowcharts, the men whom they stood in for were certainly were.\n\n"We have already sent in several hundred technicians, engineers, and consultants for the Salvadoran military to better establish itself. In a few months we expect they will sign several contracts for hardware and ammunition, amongst other things. In the long term - "\n\n"With all due respect, we first need a clear statement from them. El Salvador is a small country, but it is right in the backyard of the Americans - and a prime place to launch further overtures to the rest of Central America. We need admission into the Sphere, and prompt bilateral announcements before we send in anything military."\n\n"I agree. Better still, however, that we have them clearly dependent on us before we take this step that we cannot reverse on. My suggestion is this - over the next few months, send in civil engineers instead. My department has allocated a budget for state-building - literally and figuratively. Let the Salvadoran's first impression of the Japanese be engineers and builders, instead of businessmen or soldiers. Then, we will invite them in. Sound good?"" 
ELS_forpol.50.a: "They bowed, and left, and across the Pacific a nation waited."

ELS_forpol.51.t: "Full Alignment"
ELS_forpol.51.desc: ""And with this agreement, may the prosperity - that is, the co-prosperity - of El Salvador and Japan be forever guaranteed!"\n\nCameras flashed as the Fascist dictator of El Salvador, [ELS.GetLeader], shook hands with the Prime Minister of Japan. His nation was now officially a member of the Co-Prosperity Sphere - spitting directly in the face of Washington as it glared spitefully from up north. A few streets away, in one of the posher districts of San Salvador, representatives from the major Japanese conglomerates sampled specialities like coffee and pupusas, eagerly eyeing production reports and sales figures. Nearer to the steaming jungle, in the military bases, steely-faced lieutenants scanned the surroundings and called in their old war buddies from the Malaya and Burma campaigns, ready to begin training the Salvadoran military to fight and win battles - and die with honour when they lost.\n\nAlready, international correspondents wondered openly how America would respond. Maps of Japanese influence - previously showing lines like octopus' tentacles spreading from Tokyo across Asia - now included thin snaking appendages reaching across the Pacific into the small Central American nation. Full Sphere membership meant that Salvadoran independence and security was now secured - a permanent naval, air, and military presence would guarantee that. But would this be an alliance such as that of India - genuine independence -, of Indonesia - heavy influence and resource rights - or like the most dreaded option, of China, bound to submission and slavery?\n\nOne thing was for certain - the 'East Asian' part of the name of Japan's bloc had been rendered obsolete. The Cold War was now truly being fought, between three poles, on every continent and region in the world." 
ELS_forpol.51.a: "A toast, to our new allies!"

ELS_forpol.52.t: "When Juanito Comes Marching Home"
ELS_forpol.52.desc: ""Again!"\n\nThe word cracked louder than the rifles. North spat his cigarette stub into the dry dirt as he watched blanks slam uselessly into the Salvadoran hillside. The liquor bottles lined up in neat rows stared back at the shooters.\n\n"At least back in Puerto Plata," North barked at the tired recruits, "they could hit something other than the damn ground."\n\nThe recruits remained silent. They didn't know Puerto Plata. They didn't know anything. Kids in oversized boots, old men with shaking hands, wild-eyed exiles who never saw anything outside the comfort of their own offices. All of them held together by only American dollars and hatred for communism.\n\nWhen Carpio's red thugs swept into power, most of the real soldiers quickly disappeared. Shot, exiled, or just outright vanished. North got lucky and managed to dodge a bullet—literally—when they decided to spare the pro-American elements in the military.\n\n"Again!"\n\nAnother volley. This time, a clean pop. A bottle exploded. The range went quiet. A few heads turned, whispering praise to the sharpshooter. North smiled, lighting another cigarette. He repeated the same order he'd been shouting all morning. And he'll keep doing it for months to come." 
ELS_forpol.52.a: "Let's make sure San Salvador can hear it next time."

ELS_forpol.53.t: "The Hinterlands of Old"
ELS_forpol.53.desc: "In the heart of San Salvador stood the Angel of Freedom, the centerpiece of a monument to national heroes. She rose above the heads of passers-by, holding aloft two laurel wreaths. A Spanish man stood before the angel. An expensive suit, a tensed posture and a confident look scouring his surrounding; he read as a military officer off-duty. The man held a briefcase in his hand and soon departed.\n\nNorth of the Plaza Libertad was a billiards club, frequented by names with dignity and status. Gustavo Ruiz entered the club and many pairs of eyes lazily fell on him, then snapped away when upon recognition. A club employee took his name. "Welcome, Don Ruiz," said the servant, taking his coat. "They're expecting you." Gustavo nodded subtly.\n\nThe club held billiard tables on the second floor; he itched for a match but alas, his schedule did not permit. The room was almost desolate, only a few older men gathered around one table, wearing fanciful black suits. When Gustavo approached, they stopped their game and welcomed him. They oldest of them offered him a glass of whiskey. "Do you play?" asked a different member of the ensemble.\n\nEach of them shared that special sort of military rigidity. "They say black clouds are gathering." said the leader, "One should expect a storm soon." He sloshed around a drink in his glass. "The weatherman should be fired, he foretells the wrong forecast" He downed the glass' contents. "He's been taking one too many vacations to Mexico City." He set down his glass, and sat down next to Gustavo. "We both know Madrid looks much better this time of year. Shame then, we ain't cash to spare for a trip. I'd love to shake hands with old friends right about now."
ELS_forpol.53.a: ""We can offer you a loan, quid pro quo.""
ELS_forpol.53.b: ""Indeed, it's a shame, but I'll have to call a raincheck.""

## ELS Proxy Events
ELS_forpol.54.t: "In the Land of Volcanoes"
ELS_forpol.54.desc: "SECRET/[GetDateText]\n\nFROM MICHAEL NAZ\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: INSTABILITY IN EL SALVADOR\n\n1. The pro-American administration of President Julio Adalberto Rivera, a moderate military figure, is facing escalating student protests and unrest from dispossessed rural laborers. The deepening crisis is fracturing the government's bases of support, the military and coffee oligarchy, which are increasingly radicalizing behind 'Castrist' left-nationalism or hardline reaction. Without decisive action, one or both groups may coup Colonel Rivera, harming our interests in Central America.\n\n2. Interior Minister Sánchez Hernández provided documented confessions from several junior officers that they had joined a Castrist plot led by former President Osorio. Station head Scott in Mexico City has corroborated that the exiled Osorio and his protégé Major Rosales have returned to El Salvador with Mexican intelligence assistance.\n\n3. Sánchez Hernández presented circumstantial evidence of opportunistic Japanese and Iberian influence operations, centered on abnormally high yen exchanges and a transcript of a conversation in the Santa Ana barracks repeatedly mentioning Madrid. There is a moderate-high likelihood these nations are backing reactionary forces to gain a foothold in Central America.\n\n4. Given extensive operational commitments elsewhere, the temporary transfer of two to four additional specialized staff are requested to support counterintelligence operations in El Salvador. This 'Operation Granite' will identify and eliminate anti-Riverist cells in the Salvadoran military in collaboration with local partners."
ELS_forpol.54.a: "Fidelity, Bravery, Integrity."
ELS_forpol.54.tt: "The FBI can now perform Operation Granite in Central America, up to four times, to reduce the risk of a hostile coup in El Salvador."

ELS_forpol.55.t: "An Opponent With His Guard Down"
ELS_forpol.55.desc: "The chairs in front of López Mateos were empty, but he could still feel the presence of the men who had just sat there - former Salvadoran President Óscar Osorio and his young protégé Rubén Alonso Rosales. The weight of their words threatened to bring on a migraine.\n\nEl Salvador's government, a mere fig leaf for the coffee oligarchs and their American allies, was under siege by peasants and students, inspired by Castro and the Caribbean Legion. Now these two exiles had requested an audience with Mateos. Supported by reformists within the military and coffee oligarchy, they promised to channel the protests into a durable revolution. They were close to seizing power, so they said, but needed Mexican intelligence support to seal the deal.\n\n"Nothing but a fairy tale." Mateos muttered, slumping over his desk with his head in his hands. Hearing the sound of paper being placed in front of him, he looked up to find Manuel Tello Baurraud.\n\n"The situation in El Salvador is volatile, but according to our reports, they have the support necessary for a coup."\n\n"Even so," Mateos countered, "if they overthrow the current government with Mexican backing, the Yanquis will have my head."\n\n"Not necessarily. We can say our goal was to support moderates who will temper the excesses of the students. And honestly, with their shameless support for strongmen, the Americans have had it coming."\n\nA memory flashed across Mateos' mind: during his boxing days he'd been challenged by a far larger, more skilled man, but refused to back down. Even though he'd lost the match, Mateos left his opponent with a nasty bruise, and earned his respect. After what the Yanquis had put him through in the Aleutians, it was time to land a hit on them."
ELS_forpol.55.a: ""Let's give Uncle Sam a black eye.""

ELS_forpol.56.t: "The Heated Cauldron"
ELS_forpol.56.desc: "Please find enclosed a letter, original and translated copy, from Generals Sosa and Medrano of El Salvador.\n\n"To His Imperial Majesty's government,\n\nWe recognize that, due to distance, you may be unfamiliar with the situation in El Salvador. Yet we believe that El Salvador presents a strategic and commercial opportunity for Japan. Our land is the most prosperous in all of Central America, having industrialized significantly in the past decade. This growth took place amidst chronic political instability, with two coups in this decade alone.\n\nOur current president, Colonel Rivera slavishly follows the orders of his masters in Washington, offending the defenders of our nation and alienating its coffee growers, the bedrock of our economy and society. He has proven ineffective in quelling the communist peasants and students that now run wild. To prevent them and their Castrist kin from infesting our nation, a firm hand is necessary.\n\nInstitutions that we represent, the National Guard, the Air Force, and ORDEN, seek to establish stability. A stability impossible under the yanqui yoke. Salvadoran patriots are eager to take up arms against chaos and Washington's imperialism alike. Provided your assistance, our success is guaranteed.\n\nWith a common foe to bloody and mutual prosperity on offer, we eagerly await your reply,\n\nGenerals Medrano and Sosa.""
ELS_forpol.56.a: ""Tell Agent Mori to look into this. A potential foothold in the Americas...""
ELS_forpol.56.tt: "\nAfflicted by Yasuda and monitored by the §mU.S.§!, we should consider discreet moves to ensure the coup's success while letting §KMexico§! and §OIbe§!§nria§! take on the bulk of the effort."

ELS_forpol.57.t: "20th Century Conquistador"
ELS_forpol.57.desc: "The suited man with an athletic build declined the rum with a single, smiling shake of his head. The Iberia airline hostess tried again, flirtation in her voice, "You work hard, Don Ruiz, surely you can relax a little before we arrive in San Salvador."\n\nRuiz leaned forward, obscuring what lay in front of him. "Ah, my employers wouldn't stand for that, señorita." The hostess' quick eyes saw what he sought to hide - a photo of the Salvadoran president, Colonel Rivera; multiple of protesting students and peasants; clippings of the Puerto Plata landings... Noticing her stare, Ruiz grinned, "They own Salvadoran coffee plantations. Best not to arrive inebriated."\n\nShe set the rum back on the cart, and took a harder look at Ruiz. The military bearing was clear on a second look, the close-cropped hair - "And what do you do for those coffee planters, Don Ruiz? Must be something... special to fly you across the Atlantic and Central America."\n\nAn edge entered his voice, "Revolutionaries are running amok in El Salvador, and the government has failed to put them down. Some have even infiltrated the military. Salvadoran patriots are looking to the Patria's methods to handle the situation. And I know more than a little about the Patria's methods.""
ELS_forpol.57.a: "The words were new, but a centuries-old gleam of conquest shone in his eyes."

ELS_forpol.58.t: "Summer Plans"
ELS_forpol.58.desc: ""What is the difference between you and the people who are not here today?" Ernesto discreetly glanced over at the rest of the groups, where voices echoed the same rhetoric with equal conviction. A handful of Cuban and Dominican veterans of the Caribbean Legion were tasked with training a bit over a hundred Salvadorans, and splitting them up into smaller groups was deemed the most effective way to do so.\n\n"What drove you to brave the border guards, to be here today in this humid, hot and sweltering corner of the Yucatán's jungle?" Ernesto shifted his attention to the young men, fresh out of school, barely any older than his own son before continuing. "You were driven past your breaking point."\n\n"The People's ability to endure hardships is unparalleled, yet somehow the corrupt, elitist fascist pigs in your government have forced your hand. They have driven you to revolt. How does one inspire this courage to the masses, who believe themselves able to endure a little bit more? It is simply a matter of showing them how much they stand to gain, and how little they stand to lose. Pamphlets, graffiti, and crucially, comrades, word of mouth." Ernesto took a moment to let it sink in.\n\n"In response, undoubtedly the fascists will seek to arrest or kill you. This repression will also further drive the people on your side. That does not mean you should let them martyr you without a fight. So ensure that you remain active and moving, that you act swiftly and under the cover of night. That you never betray your comrades under duress, just as they would never betray you. And of course, if you must flee, flee abroad. You will return once we are victorious." At his last words, one young Salvadoran man sprang to his feet, chanting about Salvador's incoming liberation. Ernesto smiled. If this was Latin America's youth, then victory was a matter of when, not if."
ELS_forpol.58.a: "The People's future lies in the students."

ELS_forpol.59.t: "Rope's End"
ELS_forpol.59.desc: "The Mexican Ambassador's driver strained to avoid collisions with the young demonstrators as they threaded through San Salvador's narrow streets. Ángel Cano del Castillo had heard reports of protests at the University of El Salvador earlier that morning when he asked his driver to take him to a restaurant in the city centre to meet Japanese businessmen. Yet the scenes before him resembled a civil war: police cars burned, students screamed as they were struck by batons, coughed from smoke grenades, or lay motionless on the pavement.\n\nHe sighed with relief when the car turned into a quieter side street, hoping the chaos would soon fade and he could return to the embassy to escape the turmoil. But his relief vanished as a surge of protesters sprinted toward them. Dozens of young people vaulted over the front of the car or sought cover behind it. Ángel sat speechless, his throat tightening.\n\nAs panic spread, police fired smoke grenades, soon followed by gunfire. He and his driver ducked instinctively, trying not to become collateral damage. After ten or fifteen tense minutes, he crawled to the rear window. Students fled, some clutching their faces or bloodied limbs. Ahead, policemen were methodically beating a small group of young men before dragging them half-conscious into a van. Wordlessly, the driver restarted the car and turned toward home.\n\nBack in his office, Ángel began drafting his report to the Secretariat of External Relations. After filling in the expected formalities, he paused for a sip of coffee before stamping it, glancing through the window. The normally quiet embassy street had transformed into a sea of angry students, fists raised in defiance of the government. He returned to his desk. If even the embassy's street has become a scene of unrest, then softening the truth would be a disservice to his nation. Mexico must understand that San Salvador stands on edge..."
ELS_forpol.59.a: ""And while nobody can see the future, it is likely the situation will grow out of control within days.""

ELS_forpol.60.t: "Caught In the Throat"
ELS_forpol.60.desc: "The Salon Rojo was always bustling with activity, and at 3 PM, President Julio Adalberto Rivera met with the American Ambassador and two intelligence agents. Their suits were immaculate tropical wool, their faces betrayed no emotion, and they seemed less men than they did automatons, speaking seldom and always crisply, without pleasantries. Rivera ordered a butler to bring the men coffee and empanadas as a kind gesture, hoping to relieve some of their tension.\n\n"As you see, Presidente Rivera," the first faceless FBI agent mentioned, "our informants are quite clear. There is a growing sentiment in the military, ripple effects following the Cuban Revolution and Puerto Plata in both the universities and the military. This is more than simple unrest, this is far more organized."\n\nRivera folded his hands. "I do not want to be another Trujillo. I might be the head of a military government, but the goal has always been to reduce poverty and improve their livelihoods. Once we can get the basic cost of living issues sorted, then we can focus on eliminating corruption and improving the rule of law. Yet it is difficult to make all the strides with limited resources and so many demands."\n\nThe Ambassador sipped the rest of his coffee. "Not to worry. Our intelligence agents are poised to assist you in defeating this conspiracy and securing the country. We will set up a meeting with your intelligence chief and outline several courses of action that we can take." The ambassador and his FBI entourage got up to leave, shaking the President's hand.\n\nAfter they left, the butler came back in to pick up the trays. "Look at that, sir. The cups are empty, but they didn't touch any of the food.""
ELS_forpol.60.a: ""Perhaps they lost their appetite, or they were eating their worries." President Rivera swallowed his frustration."

ELS_forpol.61.t: "Proportional Force"
ELS_forpol.61.desc: "The entire staff of the Presidential Palace was busy. A crowd of men listened to the news blasting on the radio while relaying stacks of papers from one end of the palace to the other. President of El Salvador, Julio Rivera, sat at his office in the middle of all this commotion with the American Ambassador, Murat Williams, in front of him, discussing the details of the incoming putsch.\n\n"Outrageous! How could such infiltration, touching every part of society, go unnoticed for so long? A quarter of the army is compromised!" the President angrily ran his finger across the map on the desk, scraping red marks representing rebel municipalities with his nail. He was so absorbed by his anger he did not heed the men around him. "Look how much of our country they've stolen! Unacceptable."\n\n"Mr. President. I understand your frustration. But please try to remain calm. It is not hopeless yet.", Murat put his finger down on the map, showing him the concentration of loyalist forces around the capital. "We may be outnumbered it is true, but look around you. Your government is well-prepared and staffed by the most brilliant commanders. Our enemies are low-ranking deserters and students just out of boyhood." the American smiled "Our forces are concentrated along roadblocks in advantageous positions. Any assault on us would be suicidal. Besides, I doubt it would come to that. Most likely they will disperse when they realise we won't fold and that my government has your back."\n\nPresident Rivera muted his anger. The Ambassador's words were indeed comforting. Just then he noticed the radio anchor announcing a new police perimeter around a protest at the University of El Salvador. His rage disappeared, replaced by a sinking feeling of helplessness in his stomach. He shifted uncomfortably as it dawned upon him that his fate would most likely lay in the hands of God almighty." 
ELS_forpol.61.a: "Readiness and Yanqui backers can do nothing against Divine Intervention."
ELS_forpol.61.tt: "Our window to support the Salvadoran government through the FBI's Operation Granite is coming to a close."
 

ELS_forpol.62.t: "The Leopards"
ELS_forpol.62.desc: "Three of El Salvador's wealthiest men emerged from the Cabana, arm-in-arm with a group of Iberian officers, laughing and reminiscing about their schoolboy exploits. Along the shore, their children played in the surf, and their wives' gossip wafted up to them almost as a sweet melody. Yet the sun burned hot that day, the Cabana beckoned, and they quickly turned to business.\n\n"No one respects coffee anymore. We practically built El Salvador from the ground up, and all the Communist catspaw politicians do is moan about our 'abuses'. The Reds smell blood, I tell you. I cannot even go out in the cities anymore! The unions are always marching. They have total impunity. They even dare to go among my workers. Productivity is slipping in every factory and field. I have seen unimaginable horrors, my overseers lynched, policemen in the towns shot with coins left on their tongues, I could go on for hours!"\n\nThe Iberians listened intently, exchanging excited glances as they gestured for the speaker to continue. Finally, the highest ranking among them rose. The whole room slowly went silent."Gentleman, this horrific disorder has gone on long enough. First Batista, then Colombia, then Trujillo, and now this. The Yankees seem intent on driving a stake through the heart of order itself. And if they have to use Communists to do it, then so they shall. What is needed is a bulwark, a castle from which we can regroup."\n\nHe paused for a moment as one of the Salvadorans leapt to his feet."We've converted half the military at this point! All we need is money, some guarantees by... more situated forces..."\n\n"That you shall have. I want addresses and names, and I promise, all of your problems will have the blood sucked right out from them!""
ELS_forpol.62.a: "Raising hopes from the dead."

ELS_forpol.63.t: "To Everlasting Cooperation"
ELS_forpol.63.desc: "Laughter reverberated throughout the plantation. Overlooking the balcony, a family of coffee magnates struggled to keep the attention of their guest, a Japanese businessman representing a local coffee firm, now waxing within the realms of small talk. The two companies had held onto a contract for years and were hoping to expand production in the coming months.\n\n"San Salvador's not quite the rural paradise I was promised." Chuckles came once again from the family, but Seiki Sawai's face remained flat. "Protesters enjoy blocking my way whenever I need to get to a plantation."\n\nThe youngest man nodded. "Anybody else would have suppressed them long ago, but Rivera just can't get to that point. I don't think he can anymore."\n\nThe eldest man, his grandfather, shook his head. "Look, these aren't the same Bolsheviks that stormed Moscow, but they're certainly communist. If they ever get into power, we're going to be lucky to make it out." The family all turned away, but none could ignore the gravity of the situation.\n\n"I'm sure there are more opponents to Conciliación Nacional than just these lot," Seiki asked, his face tinged with concern. "I'm sure that they aren't the only ones calling for nationalism, and that the viewpoint isn't only espoused by communists."\n\nA third man, a few years older than his younger brother, nodded. "They definitely exist. I served in the military for a year in '52. Never went beyond that, but I have friends who did, and they're as nationalistic as they come." \n\nSeiki grinned, and then reached into his briefcase, bringing out a hefty check. "If you can promise that their nationalism is tempered when it comes to Japanese exports, I think we'll have a deal.""
ELS_forpol.63.a: "Absolute power, shaped by the pursuit of money."

ELS_forpol.64.t: "Fanning the Flames"
ELS_forpol.64.desc: "Lieutenant Horacio Lobos Méndez was interrupted from his paperwork by one of his most trusted subordinates. The young Salvadoran soldier saluted, clicked his heels, and placed a sealed envelope on the desk. With a brief nod, Horacio dismissed him and waited until he left before opening it. Some things, after all, were better left unseen and unspoken.\n\nInside was a short letter from a fellow officer and a key, exactly what he expected. Taking both, he left the office and walked toward an old warehouse inside the barracks. He cast a nervous glance around, then slid the key into the lock and opened the door. Stacked palettes of rifles, boxes of grenades, and rows of motorcycles filled the dim interior. Binoculars, ammunition, uniforms.\n\nHoracio smiled and brushed his hand over one of the grenade boxes. The printed instructions bore the bold Japanese characters of a foreign manufacturer. His grin deepened. Picking up a folded paper from a nearby table, he locked the door behind him and crossed the courtyard toward a colonel's quarters.\n\nHe entered the office silently and placed the paper on the colonel's desk. The man examined it, then retrieved a folded map from a cabinet while Horacio turned the fan to full speed and locked the door. "We got the delivery then?" the colonel whispered.\n\nHoracio nodded, his grin widening. With his finger, he traced on the map where their forces would move, the roadblocks to set, and the targets to seize. He spoke of capturing the Palacio Nacional, of the soldiers' bravery, of rescuing El Salvador from foreign influence: the greedy Yanqui lapdogs and stupid Castrist bootlickers. The traitors would tremble once they took power, a truly Nationalist government that would bring honour to El Salvador. Horacio knew he was not alone. Across cities, towns, and barracks, fearless, honourable men were ready to rise and die for El Salvador's salvation..."
ELS_forpol.64.a: "...And his name would be recorded with that of heroes in history."

ELS_forpol.104.t: "Flight of the Penitents"
ELS_forpol.104.desc: "Gustavo Ruiz, Iberia's man in El Salvador, wavered for a moment before taking the razor to his hair. He left the clumps in the hotel sink; he'd never be returning.\n\nGeneral José Alberto Medrano, until yesterday head of the National Guard, was waiting for him at the door, his own scalp shorn and his sackcloth looking just as uncomfortable on his muscled frame as Ruiz's felt. The hardliner gave a cackle at seeing his 'monastic brother' before motioning him to the back stairs. "Donkeys are waiting down there, President Rivera's soldiers are out front."\n\nDon Ruiz grimaced, "Donkeys, all the way to the Honduran border?"\n\n"Only if we don't get put in a prison cell first," said Medrano, teeth bared in a perverse sort of glee. "Our Heavenly Father may forgive sins, but the Colonel does not forgive coup attempts." He pulled the door open with the force of a military man, before stepping out into the sunlight with the serene expression of a man of the cloth. Ruiz stumbled after him, notably less composed.\n\nThe donkeys were tied to a streetpost, just as promised. But alert soldiers were standing all too close: one of their colleagues had stopped to pet the animals.\n\n"We wouldn't receive a similar compassion," whispered Medrano, before kicking off his sandals in the alleyway and beginning the long trek north on foot."
ELS_forpol.104.a: "Ruiz sighed, it would be a long walk to Iberia."
ELS_forpol.104.tt: "The [USA.GetFlag]§mAmerican§! vicegrip on [ELS.GetFlag]§WEl Salvador§! remains... [IBR.GetFlag]our §,reconquista§! has ended in failure."

ELS_forpol.105.t: "Countered"
ELS_forpol.105.desc: "Mateos looked at the cold cup of coffee sitting in front of him. From Chiapas. They'd all be from Chiapas from here on - El Salvador was shutting the door after clearing out the conspirators Mexico had smuggled back in. Now the little stooge had gone running to the gringos to tattle.\n\nHe turned his attention back to Secretaries Ordaz and Baurraud - now in full-blown argument. Ordaz was louder, "Colonel Rivera's government has two DFS agents in Santa Ana. Even if they don't talk under torture, those Castrists will. I'm not burning my connection with Scott telling him we weren't involved - he'd smell the shit on my tongue before I opened my mouth."\n\nBaurraud's eyes were pleading even if his tone was firm. He'd dragged Mexico into this fiasco - introduced Mateos to those Salvadoran exiles with a dream. "Secretary Ordaz, I understand your concern. However, this is a matter of grave national importance, a word of confidence from the FBI will significantly mitigate-"\n\nMateos stood up, the coffee rippling a little from the motion. The pair turned to look at their president, "I threw the punch, and I'll take the hit. Put Winston on the phone, I'll explain that our field agents got ahead of themselves and offer some scalps at the DFS. He won't buy it. Will dent my credibility but the gesture will be appreciated regardless."\n\nThe president looked back down at the coffee, whitening hair reflected in a black pool."
ELS_forpol.105.a: ""I'm getting too old to box anyway.""
ELS_forpol.105.tt: "[ELS.GetFlag]§WEl Salvador§!'s government has defeated the §&patriots§! who would have liberated it. [USA.GetFlag]§mYanqui§! dominance over Central America is stronger than ever."

ELS_forpol.106.t: "Bad to the Bone"
ELS_forpol.106.desc: "The wind bristled lightly at the head of Colonel Julio Adalberto Rivera, who cruised the streets of San Salvador on his Harley-Davidson motorcycle. This was not the hectic pace of the police cars and military vehicles that rattled down the road and nearly toppled over on corners trying to route the marching student protests, but the calm, deliberately median-paced ride through a nation finally at peace.\n\nAfter months of instability, the newly secure president of El Salvador could breathe easy along with the rest of his country. All over San Salvador, as his bike rumbled along, he would briefly pass by military checkpoints in the process of being taken down, some faster than normal to allow the President pass through with little interruption.\n\nWhen he passed by the Mexican embassy, he halted his ride briefly to consider the sounds of a nearby truck fitted with loudspeakers blaring out propaganda for the Partido de Conciliación Nacional. Rivera's eyes found a gathering of soldiers on the street, offering an approving nod as they broke down the door of a hideout filled with Castrist traitors before peeling off again.\n\nThe American embassy was his destination, where the Colonel met the Yanqui ambassador on street level. They were both busy men with plenty of work left to be done, but Rivera kept his visit brief. Before he left, one or two practiced pleasantries later, he shook hands with the ambassador, allowing himself exactly one unapologetic gesture of honesty, for both the ambassador and his colleagues in Washington."
ELS_forpol.106.a: ""Gracias..." He said emphatically before mounting the bike and making for the National Palace."
ELS_forpol.106.tt: "The Rivera government, a reformist, [USA.GetFlag]pro-§mAmerican§! model for Central America, has survived the threats of [MEX.GetFlag]§&revolution§![CUB.GetFlag] and [IBR.GetFlag]§,reaction§![JAP.GetFlag]. [ELS.GetFlag]§WEl Salvador§! will follow a responsible course - for now."

ELS_forpol.107.t: "Return Flight"
ELS_forpol.107.desc: "For Kenji Mori, the flight from Mexico City was at least a quiet one, one that gave him plenty of rest he would later need standing in line. The stream of arrivals in San Salvador was almost uncanny, low in number, yes, but very much above the influx you'd expect for such a small country. Of course, his reason for arriving was more atypical than most. The 'Coffee Agency' might have sounded conveniently benign to the layman, but the Japanese intelligence apparatus was just as compelled to monitor affairs in El Salvador as any other nation keeping an eye on happenings in America's so-called backyard.\n\nMori had been thumbing through the Japanese-Spanish phrasebook, playing the role of another aloof, amicable tourist, when a white man appeared out of the sea of otherwise darker skin. An officer of the border guard accompanied him, motioning Mori out of the line and handing him a folded parchment. He didn't recognize the Spanish right away, but the bolded red stamp across his travel visa said everything. His visa had been denied.\n\nThe border guard then explained that new security policies from the Rivera administration were being enforced, a reaction to the attempted Coup D'etat that was recently crushed. Half-stunned, Mori watched as nearly every other arrival was ushered past the gate as the border officer explained the situation. They told him he would have to wait for the next charter plane back to Mexico City.\n\nMori thanked the border officer for taking the time, feeling the prying eyes of others bearing down on him. He took his visa and his belongings and made for a faraway bench to wait for his flight. That one white man, whom Mori pegged by now as likely being an agent of the FBI, observed from a safe distance."
ELS_forpol.107.a: "The Yankee gave a toothy grin, and Mori had to stop himself from rolling his eyes."
ELS_forpol.107.tt: "[ELS.GetFlag]§WEl Salvador§!'s [USA.GetFlag]pro-§mAmerican§! status quo has held. An opportunity to establish [JAP.GetFlag]§xour§! influence in Central America has been lost."

ELS_forpol.108.t: "Switch-Hitting"
ELS_forpol.108.desc: "Glasses. President Mateos considered them for a moment. A conceit to age, an admission of weakness. One he would not make in front of Secretary of External Relations Baurraud.\n\nInstead he flipped the photograph of the newly announced Salvadoran junta back around, and said, "I recognize Major Rosales, Colonel Osorio, and Dr. Cáceres, we met when this whole venture was just beginning. But who are those soldiers in the back?"\n\nBaurraud nodded and pointed with a wrinkled finger, "Ah, Medrano there - head of the National Guard. Quite the character, also heads ORDEN, El Salvador's rural paramilitary intelligence agency. According to our reports, he's a boozed up torturer. General Sosa here-" quick slide of the finger, "is a little more reputable. Thoughtful, reasonable, head of the Air Force. Though he displayed some worrying sympathies to the Axis in the '40s. And over here -"\n\nMateos cut in, "I'm glad the coup came together, Secretary, but the Salvadorans are putting some real scum on this junta. Any chance we might pressure Rosales to, mmm, clean up a bit?"\n\nBaurraud chewed his lip for a moment, "I'll see what I can do, Your Excellency. Truth be told, the Castrists' position is fragile. The coup only succeeded due to the defection of the National Guard and Air Force, and now the rightists like Medrano and Sosa are in a privileged position. With the ongoing turmoil in the streets, the coffee oligarchy is coalescing behind hard men like them as well."\n\nGlasses or not, Mateos could see what was coming. "I wanted to strike Uncle Sam a blow, Baurraud. But I'm worried our southpaw approach to El Salvador,""
ELS_forpol.108.a: ""Has turned into one hell of a right hook.""
ELS_forpol.108.tt: "Though we've shaken [USA.GetFlag]§mYanqui§! dominance over Central America, what comes next for [ELS.GetFlag]§WEl Salvador§! could be a good deal §,worse§!..."

ELS_forpol.109.t: "Quezaltepeque"
ELS_forpol.109.desc: "Pounding, pounding, pounding. Rivera could barely think straight as the mob surrounded the National Palace and thrashed against the gates. The rows of riot police pushed back against another wave, yet they could not stop the steel from bending. An architectural marvel in the heart of San Salvador, reduced to a febrile battleground. Rivera's heart could barely take it all.\n\n"You open fire against those agitators outside, Sánchez, and stop stalling!" The bodyguards holstered their weapons beside the windows of the Yellow Room, pretending to pay no attention to Rivera shouting frantic commands at the receiver. He then dials another number after cutting Sánchez off.\n\n"I need a direct line to the White House immediately without-"\n\nA new dozen soldiers rushed into his office and easily overpowered the handful of Rivera's bodyguards. A soldier moved forward and knocked Rivera down with the butt of an M16 to his nose. What caught Rivera off guard was twofold: the patch of the Caribbean Legion on the mutineers, and Rubén Alonso Rosales showing his face as the mutineers' commander.\n\nGunfire quickly muffled the slogans and ruckus from the outside, catching both Rivera and Rosales with surprise. The ungainly expression Rosales noticed hinted that they did not have the entire revolution entirely in control.\n\n"You were not as bright as you thought, my friend, when you assumed the entire nation could bend towards you when you rushed into my office. Only a matter of time before your own men point those same barrels at you, Rosales!" Rivera's diatribe easily broke through Rosales's contained composure, and his inner panic was written on his face. Rosales quietly ordered the Cuban beside him to cut the phone line."
ELS_forpol.109.a: "The White House secretary on the other end was left jabbering to an empty telephone."
ELS_forpol.109.tt: "Our [ELS.GetFlag]§WSalvadoran§! partner has been overthrown. §,Reactionaries§!, and their [IBR.GetFlag]§Ofor§!§neign§! §xbackers§![JAP.GetFlag], gather strength in the shadows."

ELS_forpol.110.t: "Miles High"
ELS_forpol.110.desc: "When Kenji Mori was flagged down by the border guard, he didn't quite know what to think. He had just stepped off the plane from Mexico into San Salvador, eyeing the Japanese-Spanish phrasebook as he did. One might assume he was just another tourist from the home islands. The assumption wasn't an incorrect one, although it was slightly more convoluted than that.\n\nThe 'Coffee Agency' wasn't exactly high on the priority list of Japanese Intelligence initiatives, but keeping an ear to the ground in Central America, only a stone's throw from the continental US, was a worthwhile investment for the gentlemen in Tokyo. This is what made waiting in the nondescript series of grey rooms past the staff-only side of the airport so ominous, even as Mori took mental steps to remain calm.\n\nIt turned out he was right to do so, as eventually the door opened for a small contingent of bodyguards to roll through. Standing to one side, they ushered in none other than General José Alberto Medrano, head of the Salvadoran National Guard and Salvadoran intelligence, who strolled in with a chin held high and his chest puffed out.\n\nBefore Mori could even mount a response, Medrano grasped his hand tightly, shaking it with a beaming smile. He thanked him and the Empire immensely for their support of the new regime in San Salvador, informing him that counter-coup operations were already underway. A tray with wine glasses and the finest Chilean Red. The General personally poured the wine himself and formally invited Mori to enjoy his idyllic country."
ELS_forpol.110.a: "The two clinked glasses privately, a toast to a new friendship between nations."
ELS_forpol.110.tt: "Victory - §xwe§! have broken [USA.GetFlag]§mWashington§!'s hold on [ELS.GetFlag]§WEl Salvador§!. Soon [JAP.GetFlag]§xwe§! will reap the commercial and intelligence benefits."

ELS_forpol.111.t: "Mexican Hook"
ELS_forpol.111.desc: ""You ever go to the ring, Secretary?" asked President Mateos, cutting off Baurraud's summary of the membership of El Salvador's new junta.\n\n"I confess, I haven't much, Your Excellency," said Baurraud, setting his brief down. No sense in interrupting Adolfo with the finer details of the successful Salvadoran coup when he got that look in his eye.\n\n"My favorite punch, our national punch, is a twist right into the opponent's liver. Wham!" Mateos threw his head back in delight, then recomposed himself, "And the best part is, the force of the blow sets you back into the guard position."\n\nBaurraud found himself smiling along as the President continued, "From there you can do anything - hang back, play defensively if you want. Let this junta settle in, calm down the peasants, get a President on board - Rosales sounds like the one if you ask me, young, active. Send a few LITEMPO reports up to Washington claiming we're just as confused as they are by the whole thing."\n\n"Or," the President's eyebrow raised, "You go in close, hammering for the knockout blow. We get on a flight to San Salvador - drink a coffee with that Dr. Cáceres, give Colonel Osorio some sort of Veracruz medal, and take a parade in the finest car alongside the prettiest guanacas they've got.""
ELS_forpol.111.a: ""You know my style, Secretary. Start packing your bag.""
ELS_forpol.111.tt: "[ELS.GetFlag]§WEl Salvador§! remains unstable - but [MEX.GetFlag]§Kour§! victory marks the start of a new, §&revolutionary§! era in Central America."

ELS_forpol.112.t: "Ilopango"
ELS_forpol.112.desc: "Pounding, pounding, pounding. Rivera could barely think straight as the mob surrounded the National Palace and thrashed against the gates. The rows of riot police pushed back against another wave, yet they could not stop the steel from bending. An architectural marvel in the heart of San Salvador, reduced to a febrile battleground. Rivera's heart could barely take it all.\n\n"You open fire against those agitators outside, Sánchez, and stop stalling!" The bodyguards holstered their weapons beside the windows of the Yellow Room, pretending to pay no attention to Rivera shouting frantic commands at the receiver. He then dials another number after cutting Sánchez off.\n\n"I need a direct line to the White House immediately without-"\n\nA new dozen soldiers rushed into his office and easily overpowered the handful of Rivera's bodyguards. A soldier strode forward and knocked Rivera down with the butt of an M16 to his nose. What caught Rivera off guard was twofold: the patch of the Caribbean Legion on the mutineers, and Rubén Alonso Rosales showing his face as the mutineers' commander. Outside, the gates of the palace creaked open, with no shouts and weapons fired to mark the turning point. Out came the guardsmen, surrendered by the whims of the mutineers' mercy as the mob gawked at the sight, signaling the end of the conservative establishment's reign, with a muted welcome into new leadership.\n\nPeering into the reappearance of a general he exiled northwards, gritted teeth hid behind the deep scowl from Rivera as he still held his bloodied nose. "Top brass rotating control is water off a duck's back anyway," Rivera thought to himself, as he willingly remits his control of the receiver to Rosales while sitting up. The dispatcher on the other end spoke only incomprehensible English, and Rosales uncouthly slightly nodded his head to the dispatcher's diatribe."
ELS_forpol.112.a: "The conservation did not last long."
ELS_forpol.112.tt: "§&Nationalists§! have overthrown our [ELS.GetFlag]§WSalvadoran§! partner. A blow to Central American stability, and §mour§! reputation."

ELS_forpol.113.t: "Tango Turbulence"
ELS_forpol.113.desc: "Señor Valdez's smile was as broad as his shoulders, a richly brown suit to go with his curly black hair and a deep, masculine voice to go with his big frame. Kenji Mori got something of a read on him, even if they spoke little on the plane. Valdez was doing some reading of his own, perusing the newspaper headline on the recent victory of the junta and the newly instituted reforms they sought to implement.\n\nThe flight from Mexico City to San Salvador was an understandably quick one for both men, but Mori's business there wasn't exactly a normal outing. Few things with the 'Coffee Agency' were, even if the role of Japanese intelligence surveillance in El Salvador should have been fairly uneventful, save for keeping tabs on Yankee intelligence in the region.\n\nWhen Mori and Valdez arrived in San Salvador, they exited the plane on the same ramp, walked out through the same gate, hailed taxis from the same spot, and went their separate ways. Yet amazingly, if perhaps unsurprisingly, Mori looked up from the Japanese-Spanish phrasebook he had been reading to see they were dropped off at the same place at the same time, checking into the same hotel.\n\nThey rode the same elevator up to the same floor their rooms were on. As they went their separate ways in earnest this time, Valdez turned to Mori and pointed, speaking in oddly fluent Japanese: "Stay out of trouble, things can get messy in a revolution." Mori wasn't all that shocked; he had flagged Valdez as a Mexican DFS agent back on the plane well over an hour ago."
ELS_forpol.113.a: "Gracias." Mori replied. One takes what pleasantries one can find."
ELS_forpol.113.tt: "§&Revolutionaries§! have overthrown [USA.GetFlag]§mWashington§!'s stooge in [ELS.GetFlag]§WEl Salvador§!. A fine outcome, even if they are not §xour§! first choice."

ELS_forpol.114.t: "Waiting for Palm Sunday"
ELS_forpol.114.desc: ""Sickening," General José Alberto Medrano took another swig of rum. "Disgusting!" he barked suddenly at General Sosa, before breaking out into peals of laughter. The Salvadoran slumped down chuckling, clinging onto the side of the table to avoid falling to the floor. "The depths to which this country must sink before it ascends, ascends to heaven!"\n\nGeneral Julio Faustino Sosa turned his gaze away from the neogothic cathedral spires on the northern skyline to stare at his slurring, earthy compatriot. "Indeed," he answered, before resuming his watch over Santa Ana. Still, if his colleague was going to indulge, now was the moment.\n\nTheir maneuver, backed by Japan and Iberia, had succeeded brilliantly - Colonel Rivera was out, and the junta of Castrists that replaced him was still flailing ineffectually in the face of student protests and peasant revolt. There were even rumors that Medrano and himself would be invited to join - to guarantee the backing of the National Guard and the Air Force for the new government.\n\nMedrano hauled himself up again, "God bless... Japan for all their yen." He drained his glass before beginning again, "God bless Iberia for Franco, a true Caudillo! Savior of Spain and now El Salvador too. God bless El Salvador, for... for the weakness of its demons shall be its salvation!" He started pouring more rum, splattering some on the table. "Before those communists can construct their hell," he hiccuped, "when disorder reaches its peak..."\n\n"We strike," said Sosa. He watched his jets roar over Santa Ana. Ready for the order. Ready for order to be restored."
ELS_forpol.114.a: "1944 was just a few months away."
ELS_forpol.114.tt: "\nWe have positioned the §,Hispanists§! to take over [ELS.GetFlag]§WEl Salvador§!, §,true patriots§! sympathetic to [IBR.GetFlag]§OIbe§!§nria§!.\nStill, their distance means that further victories will be needed to secure §Oour inf§!§nluence§!."

ELS_forpol.115.t: "Holding Pattern"
ELS_forpol.115.desc: ""Damnable communist fucks!" howled General José Alberto Medrano, brandishing a pair of pliers at his Iberian contact, Gustavo Ruiz. "They throw out Colonel Rivera and those weak-" spittle flecked Ruiz's face, "kneed, gringo-sucking bastards in the PCN, and then they start reining in ORDEN and the National Guard as peasants run wild in the fields and students amok in the streets."\n\nRuiz dabbed at his face with a silk kerchief before answering, "The Castrists are not communists, I'm afraid. Otherwise they would not have been able to secure the support of so many plantation owners. And while they would be foolish to set aside your institutions under normal circumstances, you were planning to use them in a counter-coup. So for all Rosales' reprehensible policies-"\n\nAnother wave of the pliers, even closer to Ruiz's face. "We. We were planning to use them in a counter-coup. Don't think you can wriggle out of this. Did your Caudillo back down after he got pushed back at the Casa del Campo? No! I expected more from a servant of his."\n\nRuiz prickled at that, "I'm here in a personal capacity. And I can leave in a persona-"\n\n"Like shit you are. And like shit you will. This isn't over yet," sneered Medrano with one last jab of the pliers."
ELS_forpol.115.a: ""Not until they take the last toothless communist from my cells.""
ELS_forpol.115.tt: "\n[IBR.GetFlag]§OW§!§ne§! succeeded in expelling [USA.GetFlag]§mAmerican§! interlopers from [ELS.GetFlag]§WEl Salvador§!, but hostile §&revolutionaries§!, not §,true patriots§!, are filling the void."

ELS_news.1.t: "[Get_newspaper_header]Putsch in El Salvador"
ELS_news.1.desc: "The radicals in El Salvador have successfully launched their own putsch against the established regime, following the example of Fidel Castro's revolutionary rhetoric.\n\nThough observers within international circles panic at the possible rise of another nation like Cuba in Central America, the coffee barons of El Salvador promptly vacated their assets through coercion and payoffs, forcing the creation of a new government.\n\nAlthough the old order has successfully been toppled, for concerned observers, the Castrists seem to have been kept at bay, at least for now.\n"
ELS_news.1.a: "Dark coffee, dark portents." #USA
ELS_news.1.b: "A new, revolutionary order rises." #MEX
ELS_news.1.c: "Vermin dig a new warren." #IBR
ELS_news.1.d: "A nationalist eruption in the Land of Volcanoes." #JAP
ELS_news.1.e: "Let dogs eat dogs." #Other

ELS_news.2.t: "[Get_newspaper_header]National Guard Counter-Coup in El Salvador!"
ELS_news.2.desc: "After successfully forming a coalition between various revolutionary elements, the current governing Junta of the country has been couped once again, this time by the National Guard. Fiercely nationalistic, the leaders of the new Junta were able to sway El Salvador's infamous coffee oligarchs in supporting their new regime, and it is reported that many former progressive governors have been arrested.\n\nJosé Alberto Medrano seeks new allies from Japan and Iberia, who have already publicly applauded the "restoration of law and order" in the Caudillo-ridden country. In an impromptu speech, Medrano stated his commitment to the restoration of stability and defense of the nation against "crypto-communists" that seek to subjugate it.\n"
ELS_news.2.a: "The specters of Palm Sunday stalk San Salvador." #USA
ELS_news.2.b: "Like Madero, it was not to be." #MEX
ELS_news.2.c: "La Legión assembles." #IBR
ELS_news.2.d: "Yen and coffee have bridged the Pacific." #JAP
ELS_news.2.e: "The never ending cycle." #Other

ELS_news.3.t: "[Get_newspaper_header]Coup Thwarted in El Salvador"
ELS_news.3.desc: "After weeks of "anti-terrorism" investigation in collaboration with foreign intelligence agencies, the Salvadoran government has uncovered a conspiracy within certain segments of the Armed Forces to overthrow the current regime. Suspected to be working with a gang of radical nationalists, including Castrist groups, the possible culprits have been removed from their posts and are awaiting trial for treason.\n\nEven as the state of El Salvador has managed to avert its overthrow, the ensuing political shock has nonetheless driven away investors and weakened domestic consumerism, it will likely take time before the state's damaged national integrity can fully recover.\n"
ELS_news.3.a: "National security precedes National Conciliation." #USA
ELS_news.3.b: "The true traitors are the ones that sold El Salvador to the Yanquis." #MEX
ELS_news.3.c: "Hoy somos y mañana no." #IBR
ELS_news.3.d: "The cabalgadores ride into the sunset - not toward the Rising Sun." #JAP
ELS_news.3.e: "Whatever comes, the traitors had it coming." #Other

ELS_news.4.t: "[Get_newspaper_header]Communists Seize El Salvador, President Missing"
ELS_news.4.desc: "Rural communist militias, under the leadership of Cayetano Carpio, have declared the formation of a new Amazonist state as his forces seize cities across El Salvador. Mired in instability since their loss in the Football War, the government has been locked in a brutal struggle with insurgency, suffering a legitimacy crisis as harsh declines in the living conditions of the rural poor and the mass return of Salvadorans deported by Honduras exploded into social and economic chaos. Harsh repressions failed as support collapsed.\n\nFootage has been broadcast of the trials and executions of government officials and economic leaders, along with announcements of sweeping nationalizations. National purges are being carried out, with reports of mob violence in almost every major city. The President remains missing, with speculation that he successfully fled being denied by San Salvador."
ELS_news.4.a: "Violent, hostile communists in our backyard..." #USA
ELS_news.4.b: "The future that awaits us if Cabañas' ilk wins." #MEX
ELS_news.4.c: "Horrors avoided in Spain descend upon its offspring." #IBR
ELS_news.4.d: "Let's wash our hands of this distant disaster." #JAP
ELS_news.4.e: "The taste of blood and coffee." #Other

ELS_news.5.t: "[Get_newspaper_header]Salvadoran Gaitanistas Drive Out PCN"
ELS_news.5.desc: "Fabio Castillo Figueroa has been installed as President of El Salvador amidst popular uprising. The long-standing ruling party of El Salvador, the PCN, has been mired in recent instability with strikes, public discontent, and protests climbing in severity despite repression attempts. The instability has finally triggered a collapse, with the Government resigning en masse and public disorder reaching breaking point.\n\nPresident Figueroa, rector of the University of El Salvador, was tied to the successful coup of 1960 and the Castrist coup attempt of 1963. The face of a coalition of students, urban workers, military radicals, and rural militias, he has decried the PCN as "oppressors sustained with American money and Salvadoran blood." He also thanked Mexico for supporting the revolution, suggesting closer ties between El Salvador and the Veracruz Pact."
ELS_news.5.a: "We built castles on foundations of sand..." #USA
ELS_news.5.b: "Students with the appropriate revolutionary spirit! An example to inspire us all." #MEX
ELS_news.5.c: "The military's long rule over El Salvador comes to an inglorious end." #Other

ELS_news.6.t: "[Get_newspaper_header]Amazonists Couped in El Salvador"
ELS_news.6.desc: "The communist takeover of El Salvador has met an end as violent as its start, as military remnants and mercenaries have taken control of the capital, and Amazonist control crumbles across the nation. El Salvador's new authorities appear to be formed from both anti-communist volunteers and mercenaries, funded by El Salvador's exiled oligarchs. While Cayetano Carpio's whereabouts are unknown, retribution against captured Amazonists has been swift, cruel, and public.\n\nUniversity law professor Antonio Rodríguez Porth has been proclaimed President by the new governing board, with a mandate to oversee a vast reprivatization program- a proclamation quickly accepted by the United States. Speculation persists about American support regarding the takeover, but with their support and the backing of El Salvador's oligarchs, Porth's ambitions to create a free market utopia will not lack for resources.\n"
ELS_news.6.a: "A lawyer, guns, and money - eternal keys to success in Central America." #USA
ELS_news.6.b: "The workers' triumph, as brief as it was beautiful." #Communist
ELS_news.6.c: "One experiment ends, as swiftly as it began. A new one begins." #Other

ELS_news.7.t: "[Get_newspaper_header]Constitutional Rule Affirmed in El Salvador"
ELS_news.7.desc: "Colonel Julio Adalberto Rivera has been secured as the President of El Salvador, following his uncontested nomination by the Partido de Conciliación Nacional. A charismatic speaker, he has already delivered a national broadcast declaring a return to stability after the turmoil of the past two years, decrying radicals seeking to exploit the nation's struggles for their own agendas.\n\nMatching his rhetoric, he has already promised social and economic reforms, declaring rural welfare to be the defining objective of his presidency. He also highlighted the importance of continuing the close collaboration of business and government, as well as close relations with Washington, in order to support his development ambitions. As founder of the PCN, his installment gives the government desperately needed legitimacy and solidifies constitutional, if not democratic, rule.\n"
ELS_news.7.a: "A promising new page in their nation's history." #USA
ELS_news.7.b: "The names rotate, the chains stay the same." #MEX
ELS_news.7.c: "El Salvador cannot realize its potential until it weans itself from Washington." #IBR
ELS_news.7.d: "Like a tumor, the American puppets are difficult to remove." #JAP
ELS_news.7.e: "So when's the next coup then?" #Other

ELS_news.8.t: "[Get_newspaper_header]Salvadoran PCN Wins 1967 Elections"
ELS_news.8.desc: "Salvadoran President Julio Adalberto Rivera has secured his legacy, both by completing his full electoral term in the notoriously coup-prone Central American country and by securing the victory of his chosen successor, Interior Minister Sánchez Hernández. The victorious National Conciliation Party (PCN), an alliance of the coffee barons and the military, holds a stranglehold over all levers of power, including the presidency.\n\nIncoming President Hernández has announced the continuation of Rivera's small-scale land reform while also expanding investment in education. Hernández has also pledged to crack down and eliminate any sources of radicalism inside El Salvador, promising removal of anyone deemed a threat to El Salvador's national stability.\n"
ELS_news.8.a: "Continued democracy and state stability, what's not to love!." #USA
ELS_news.8.b: "If he wasn't a US lackey, he'd be our kind of guy." #MEX
ELS_news.8.c: "El Salvador is staying on course." #Other

ELS_news.9.t: "[Get_newspaper_header]Salvadoran PCN Militarizes"
ELS_news.9.desc: "Rebuking Salvadoran President Julio Adalberto Rivera's limited attempts at reform, his National Conciliation Party's more conservative and militaristic wings have initiated a self-coup of the party, nominating General Fidel Torres as Rivera's presidential successor rather than Rivera's choice, Interior Minister Sánchez Hernández. General Torres, however, lacks President Rivera's populist charms and now rules over a party that has become increasingly disciplined and authoritarian.\n\nGeneral Torres, citing the recent tensions with neighboring Honduras and the increasingly violent border disputes, stated that El Salvador needs to continue to heighten its militarization. Torres cited Salvadoran migration to Honduras as a security issue, and will work to secure his country's national future.\n"
ELS_news.9.a: "Not ideal, but at least it's stable." #USA
ELS_news.9.b: "Washington removes its mask." #MEX
ELS_news.9.c: "No vision but violence." #Other

ELS_news.10.t: "[Get_newspaper_header]PCN Continues Salvadoran Political Dominance"
ELS_news.10.desc: "Football War hero Arturo Armando Molina has delivered another victory for the National Conciliation Party against its Christian Democratic opposition, headed by José Napoleón Duarte, San Salvador's popular mayor. While Armando had been quick to declare victory, observers have already cast doubt over the veracity of the PCN's triumph, with growing accusations of fraud, intimidation, and outright violence at the polls.\n\nThese allegations are the next in a long line of evidence for the party's fading support, and are the latest in a litany of corruption accusations. The alliance of military officers and coffee planters behind the PCN has long stifled any meaningful attempts at reform, with their stated focus on maintaining government stability. The energetic Molina, however, appears to be undeterred by this situation, and has singled out education reform as his government's foremost task - and perhaps its last chance to escape complete stagnation.\n"
ELS_news.10.a: "About what to expect from El Salvador." #USA
ELS_news.10.b: "El Salvador is entering its late Porfirian period." #MEX
ELS_news.10.c: "A system running out of steam." #Other

ELS_news.11.t: "[Get_newspaper_header]Christian Democrats Win in El Salvador"
ELS_news.11.desc: "In a stunning upset, the Salvadoran elections have concluded in a victory for the Christian Democrats under Napoleón Duarte, San Salvador's popular mayor. After long years of dominance by the National Conciliation Party and the military leaders and coffee interests that it represented, Duarte has managed to parley his cordial relations with factions across the political spectrum into a seismic shift in the country's politics.\n\nThis broad coalition has managed to bury even the PCN's tried-and-tested machine of electoral fraud under its weight, exploiting the gradual strengthening of Salvadoran institutions under American patronage. Now, Duarte must wield the unwieldy political alliance that catapulted him to power into a force for change - a daunting task in its own right.\n"
ELS_news.11.a: "See? We did bring democracy to Latin America in the end!" #USA
ELS_news.11.b: "How could this happen under the Americans' watch?" #MEX
ELS_news.11.c: "Genuine democracy in El Salvador?" #Other

ELS_news.12.t: "[Get_newspaper_header]Fascists Seize San Salvador"
ELS_news.12.desc: "Following a flurry of chaos on the airwaves, it has now become clear that nationalist officers led by Air Force General Julio Faustino Sosa have overthrown the incumbent Salvadoran government. An immediate, and seemingly well-coordinated, string of declarations by other far-right regimes in the region has followed, suggesting that this putsch was planned well in advance with aid from their intelligence services.\n\nWhile Faustino Sosa has announced an ambitious corporatist program, which openly calls for the \"subjugation of the coffee oligarchy to the demands of the Salvadoran people,\" he has struck a more flexible tone in his first address, signalling continued openness to American investment, likely in a bid to avoid an outright OFN invasion, but openly courting Japanese assistance as well."
ELS_news.12.a: "At least he's not too unfriendly..." #USA
ELS_news.12.b: "The Izote blooms late, but beautifully." #JAP
ELS_news.12.c: "This will have to be dealt with, and quickly." #MEX
ELS_news.12.d: "General Martínez's shadow lives on." #Other

ELS_news.13.t: "[Get_newspaper_header]Salvadoran Revolution Elevates Civilian"
ELS_news.13.desc: "The years following the Salvadoran Revolution have transformed the PAR from a motley crew of disgruntled military officers into a broad 'revolutionary' party, modelled after the Mexican PRI. This gradual consolidation, which has included the co-opting of much of the old coffee oligarchy into the new system, has now allowed renowned economist Ricardo Falla Cáceres to secure the presidency.\n\nThe first civilian to lead El Salvador in a long line of military officers, Cáceres was not elected due to his public appeal, but due to his painstaking work in delivering rapid economic growth during the tenure of President Rosales. His achievements have enabled him to rally the party behind him and establish a technocratic cabinet. In his inauguration speech, Cáceres promised ever more development, as well as a new constitution, to cement the gains of the Revolution for decades to come."
ELS_news.13.a: "Maybe El Salvador could yet become a solid investment." #USA
ELS_news.13.b: "Another sister walks the path of revolution." #MEX
ELS_news.13.c: "Will the pen be mightier than the sword?" #Other
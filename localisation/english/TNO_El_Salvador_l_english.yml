ELS_forpol.44.t: "Their Crisis, Our Chance"
ELS_forpol.44.desc: "New Salvadoran families spilled out of the rusty buses, being pushed and held at gunpoint by Honduran guards. Some wandered around the camp, trying to find any tents they could squeeze into with other strangers. Others crawled to the food line, where aid workers were handing out rice and bean rations.\n\nJosé and Francisco would take occasional peeks through the tent flaps. Sometimes, they saw fights on the food lines. Other times, they heard young cries from the medical triage tent. Most families lost something. Their homes, their limbs, their dignity.\n\n"This place is a damn graveyard," José muttered, retreating back into the tent's darkness. "We can't stay here."\n\n"It's not forever," whispered Francisco. The older of the two brothers, Francisco learned to find hope in every situation, whether it was back in Honduras or here in Salvador's camps.\n\n"Do you have any idea what our government is doing?" José spat. "People are starving, and they're focused on rebuilding their army! The very army that burned down our homes. So-called liberators..."\n\nJosé took another peek outside, gazing at the horizon's distant mountains. Rumors of guerrillas spread faster than the sporadic food trucks driving through the camps. Teachers, farmers, ex-soldiers—everyone was joining up.\n\n"They're building something," José said. "Something to fight for."\n\nFrancisco silently looked at his brother. José was far too young to fight, much less go through a war. But before he knew it, José had disappeared into the crowds, marching towards the mountain hideouts." 
ELS_forpol.44.a: "Let El Salvador bleed. It'll clear the path to reform."
ELS_forpol.44.b: "Get humanitarian funds there now - we can't see El Salvador break."

ELS_forpol.45.t: "New Regime, Old Habits"
ELS_forpol.45.desc: "It was just another evening in San Salvador as Carlos walked down his neighbourhood's street. He had just received his salary, and as he did so many times before, he had to run errands to ensure his family's subsistence. All the money he had could only afford him some food and a tiny bit of medicine for his parents, and just as before, each paycheck won him less bread than the last. They'd have to make do somehow, again.\n'nOn his way back, he passed by multiple little American flags. Large air-conditioned stores selling unaffordable goods, freshly painted company headquarters, their façades white as marble, all carrying a small, yet visible, steel plate, naming the company and their foreign benefactor.\n\nHe had not dared to hope that the new government's backers would bring about prosperity, and as always, he was proven more than correct. Things were only getting worse. The American dollar was not his; it was not El Salvador's, and it did not arrive to aid the common man in any way. It belonged to Molina, to the government, and the rich men around them.\n\nCarlos turned his eyes from the giant buildings and looked in front of him, where the tiny dot that was his neighbourhood could be seen in the distance. It was a lonely walk home." 
ELS_forpol.45.a: "The cost of freedom."


ELS_forpol.29.t: "Coffee Oligarchy"
ELS_forpol.29.desc: "As representatives of American business interests expand their presence and operations in El Salvador, they are encountering a significant problem. And they are asking for help.\n\nFundamentally, and regardless of what the government or the Constitution of the country says, El Salvador is in fact run by coffee. Or, rather, by the small group of Salvadoran businessmen who own the vast coffee plantations and the coffee processing plants. These oligarchs have vast influence in the government, and cannot be ignored. They also, unless we wish to push for invasion, cannot be displaced.\n\nAs such, we will need to consider how to best work with them.\n\nLuckily, like any businessman, they respect money - and America has a lot of that, indeed. Our experts in the region have assured us that should we offer concessions on trade and imports - to the oligarchs' benefit of course - they would likely be very amenable to our requests, and in permitting the expansion of American business in general. The cost on a national scale is relatively minimal, and securing positions and influence in El Salvador has political and intelligence benefits besides.\n\nHow should we proceed?" 
ELS_forpol.29.a: "Fine. Throw them a bone."
ELS_forpol.29.b: "No. Not one red cent for tribute."

ELS_forpol.30.t: "A Light Far, Far To The East"
ELS_forpol.30.desc: "World history was almost a footnote in Salvadoran history textbooks, but there was enough for young nationalists to have heard of the Meiji Restoration. An audacious, one-of-a-kind event wherein a country on the brink of colonisation reversed the tides of history and with singular determination became a great power itself in one generation. Just the thought of it made them choke up in pride for a path that their beleaguered nation could follow.\n\nOf course, the reality was different. The young nationalists became older nationalists and joined the military where they belonged. They were promoted higher and higher, then found themselves stopped by the glass ceiling of corruption. Once again, longing thoughts stirred of overthrowing the decadent regime and revitalising the country, but this time they had positions of power from which to do something. And telephone lines.\n\nThe Japan they found themselves in contact with, however, was not the same they had read about in their history textbooks. The samurai had been replaced with suited businessmen and khaki-clad soldiers, not at all interested in the romance of freeing a subjugated nation - particularly one as irrelevant as El Salvador. Even as some small businesses led by their countrymen attempted to establish themselves in the capital, they watched on idly as the gangs and the FBI systematically crushed them out. Where was that nation that picked death over dishonour? Finally, one day, the answer came." 
ELS_forpol.30.a: "We were always here, brothers - only waiting for the right time."
ELS_forpol.30.b: "The samurai are all dead - and we killed them. Wake up."
ELS_Support_Coup_Late_tt: "§YWe will lay the groundworks for a future coup of the Pro-OFN establishment in §BEl Salvador§!.§!"

ELS_forpol.31.t: "A Hole In One"
ELS_forpol.31.desc: "The trees along the green rustled their leaves as the soft wind passed through them, distant birdsongs drifting upon the invisible waves. It was a picturesque course, always had been, and there was no place better to conduct a meeting. Free of a monotonous meeting room, the ill fitting suits and the general feeling the walls were listening; who wouldn't trade the long Nine Ball for the DOJ Building?\n\n"What do you make of that Sánchez fella in El Salvador, he on the level?" The question came casually, it was as if an inquiry regarding lunch had been posed, yet the mind filled with snippets of memos and reports, messages and briefings. What to make of him?\n\n"Same old same old really. It's a renovation on an old house, the inside isn't too different but it is much better to look at." Such metaphors brought smiles so long as they were positive. It would be a lie to say half the Bureau weren't trying to outdo each other over them.\n\n"That so? Well, my reports said that democracy was finally getting a good look over there. A flash in the pan?" The query came with a smile and a laugh, but was it meant so lightly? When in doubt, just go to the facts - they all were professional game players after all, but the course was neutral ground.\n\n"Sánchez gets his support from the PCN's incumbency. The dictatorship's legacy planted him, and the recent elections secured him, after all they were fair enough. It's no Mr Smith Goes to Washington, but we can more than work with it." An approving nod answered the clarification and a player prepared to swing.\n\nA soft thunk sounded as a ball was finally driven away. It flew, further and further, a white speck landing near majestically upon the flag in the distance." 
ELS_forpol.31.a: "A Bureau Hole in One." 

ELS_forpol.32.t: "Memorandum On El Salvador Reforms"
ELS_forpol.32.desc: "MEMORANDUM FOR: BD, MIAMI Office\nSUBJECTS:\n1. Sanchez Reforms\n2. Attitudes Towards US\n3. Future\nEfforts to push a reformist agenda in El Salvador have borne fruit but it would be unwise to fashion the regime as fundamentally shifted. PCN candidates remain favored in political spheres through a variety of softly coercive measures, however the worst excesses have been removed and the State no longer enjoys a monopoly on politics. Opposition is present and effective. It does not currently pose a threat to most incumbents but is a developing situation\nCategorising El Salvador as a partially free Democracy, it should be noted rhetoric regarding the nation must be carefully considered. Opposition do not generally wade into Anti-American sentiments, however this is a generalised statement. There are those that do, and many others who skirt the line. Generally however the majority of those in any serious consideration of political office are accepting at worst of American presence within the nation.\nSupport for democracy should be encouraged to bring the nation closer to the US ideologically and secure it from any interlopers. Political movements must be monitored ensuring no anti-American sentiments become too mainstream, however broadly the reforms have been successful at legitimising American presence in the nation.\nSigned: HG, San Salvador Office" 
ELS_forpol.32.a: "Fidelity, Bravery, Integrity"

ELS_forpol.33.t: "Boots Moving Up and Down Again"
ELS_forpol.33.desc: "RESTRICTED\n\nFROM MICHAEL NAZ\nMEMORANDUM FOR THE PRESIDENT\n\nSUBJECT: INAUGURATION OF PRESIDENT FIDEL TORRES\n\nAt 0900 hours, Fidel Torres was formally inaugurated as President of El Salvador following his landslide victory in "free and fair" elections. A military parade followed, featuring armored columns rolling down the Paseo General Escalon and young officers goosestepping in unison. Loudspeakers blared fake cheers, but the audience stood in silence.\n\nTorres stood at the former Salvador Plaza, repurposed into a grand white stage, waving salutes while gazing on at the parade. No speech was given.\n\nAt 1200 hours, Executive Order No. 1 had been issued:\n\nAll amnesties for prisoners are revoked. Trials have been suspended for those under indictment. Executions will occur without civilian oversight.\n\nAt 1800 hours, news of the decree had spread. Small protests were swiftly suppressed in Santa Ana. Two fatalities have been reported. Torres claimed this to be a "necessary cleansing of national spirit."\n\nWe will do our best to monitor the situation. How long control can be maintained is unclear." 
ELS_forpol.33.a: "Fidelity, Bravery, Integrity"

ELS_forpol.34.t: "A Difficult Partnership"
ELS_forpol.34.desc: "Officially, the partnership between the Salvadoran state police forces and the FBI, agreed upon in principle by both governments and enforced on both parties from high above, was a success. Foreign and criminal operations were significantly curtailed, and security was on the mend.\n\nThis was evidenced in numerous ways.\n\nIt was evidenced in the likely Japanese spies who were nowhere to be found after the Salvadoran officer assigned to help the FBI took an unscheduled vacation without informing his commanders. It was evidenced when the criminals arrested after a long FBI sting operation walked free after handing over an envelope to the evidence clerk. It was evidenced when the politicians known to have connections with the Germans were likely informed by a police lieutenant about FBI surveillance.\n\nThere were some victories, of course, but on the whole there were far more failures than would be expected or desired. Yet, depending on who filed the reports, the picture was very different indeed. Yes, the partnership was going very well, at least if one were to ignore the mountain of reports from field agents about the countless problems encountered, that is.\n\nAnd on the whole, they were so ignored." 
ELS_forpol.34.a: "Unfortunate."


 SSC_The_Rest_Remaining: "The Missing Half"
 SSC_The_Rest_Remaining_desc: "It has long been since 1996, and the prime years of the Movement have long passed. At one point comprising half of the nation's territory during the Second American Civil War, we have been on the back foot since then. Momentum seems to continually bet against us, with state governments betraying away or decisive encirclements of our forces. Add the differing ideological forces within the Movement, and we currently lay as a carcass, slowly being picked off by vultures. If we want to realize the vision of a unified America, we will first need to strengthen within ourselves."

TNO_ugly_american_icon_tt: "§OThe Modern Tordesillas§!"
TNO_ugly_american_icon_tt_delayed: "§FThe §HTreaty of Tordesillas§! in 1494 was meant to divide the New World between §OSpain§! and §nPortugal§!. Blessed by papal sanction, §OSpain§! and §nPortugal§! carved the world between them, becoming the new masters of a land brimming with wealth and resources. Yet, the other powers of Europe looked hungrily upon the new land, and sought to defy the status quo and establish their own spheres of influence. As the fortunes of the §nPortuguese§! and §OSpanish§! Empires waned over the decades, the §JEnglish§!, §iFrench§!, and §uDutch§! left the Treaty to gather dust and took more of the Americas for themselves. Eventually, only relics of the once-mighty §OIber§!§nian§! Empires remained.\n\nThe end of the Second World War heralded a new treaty, sanctioned by the atom and carving the globe between the §mAmericans§!, §qGermans§!, and §eJapanese§!, with each superpower holding its own sphere of influence. These great powers fear their rivals' machinations and will deploy every tool they can to thwart them even as they navigate the turbulent tides of the modern day.\n\nIn Latin America, the former heart of the §OSpanish§! and §nPortuguese§! Empires, the §mUnited States§! stands ascendant, backed by proximity and the power of the dollar. Yet their hold on the Americas has grown tenuous with the rise of ideologues and putschists, who, resentful of Washington's dictats, chip away at their chains, perhaps too eager to switch them with another pair.\n\nJust as with the original §HTreaty of Tordesillas§!, there remain those powers who look upon this carved-out world with envy, and seek to assert themselves and seize their own hegemony. Where it once began, in the §OIber§!§nian§! Peninsula, the remnants of old empires now stand united, seeking to reforge the past from its ashes. Seas apart, their prodigal sons, §KMexico§! and §nBrazil§!, look at their neighbors and covet their own ascension. The 1960s shall be a tale of their clash, the rise of few out of the many, for this §OModern Tordesillas§! may prove to be no more effective than its namesake five centuries past.§!"
